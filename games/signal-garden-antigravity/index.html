<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SIGNAL GARDEN</title>
<style>
  :root {
    --bg-deep: #061014;
    --bg-mid: #0c1d24;
    --bg-panel: rgba(12, 28, 36, 0.86);
    --border-glow: rgba(110, 231, 183, 0.25);
    --text-main: #ecfdf5;
    --text-muted: #7dd3fc;
    --text-dim: #648291;
    --accent-mint: #34d399;
    --accent-gold: #fbbf24;
    --accent-cyan: #38bdf8;
    --accent-rose: #fb7185;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 25%, #112a34 0%, #071318 65%, #04090c 100%);
    color: var(--text-main);
    font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }

  /* Subtle ambient background fireflies */
  .app-shell {
    position: relative;
    width: 100%;
    max-width: 560px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 12px 14px 16px;
    z-index: 2;
  }

  /* Top Header Bar */
  .hud-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-panel);
    border: 1px solid var(--border-glow);
    border-radius: 16px;
    padding: 10px 14px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    gap: 8px;
  }

  .brand-block {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .game-title {
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent-mint);
    font-weight: 700;
  }

  .level-title-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .level-num {
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--text-main);
  }

  .level-name {
    font-size: 0.92rem;
    font-weight: 500;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .arc-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #a7f3d0;
    background: rgba(52, 211, 153, 0.12);
    border: 1px solid rgba(52, 211, 153, 0.28);
    padding: 2px 7px;
    border-radius: 999px;
    width: fit-content;
    margin-top: 2px;
  }

  .stats-cluster {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .stat-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(5, 14, 18, 0.65);
    border: 1px solid rgba(125, 211, 252, 0.16);
    border-radius: 10px;
    padding: 4px 10px;
    min-width: 54px;
  }

  .stat-label {
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 600;
  }

  .stat-value {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text-main);
    font-variant-numeric: tabular-nums;
  }

  .stat-value.over-par {
    color: var(--accent-gold);
  }

  /* Canvas Stage */
  .stage-wrap {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 0;
    margin: 8px 0;
  }

  canvas#garden-canvas {
    display: block;
    border-radius: 20px;
    box-shadow:
      0 14px 44px rgba(0, 0, 0, 0.65),
      0 0 0 1px rgba(110, 231, 183, 0.22),
      inset 0 0 32px rgba(16, 185, 129, 0.08);
    background: #07151b;
    touch-action: manipulation;
    cursor: pointer;
  }

  /* Bottom Controls Bar */
  .controls-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--bg-panel);
    border: 1px solid var(--border-glow);
    border-radius: 16px;
    padding: 8px 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(10px);
  }

  .btn-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  button.icon-btn {
    appearance: none;
    border: 1px solid rgba(125, 211, 252, 0.2);
    background: rgba(14, 34, 44, 0.85);
    color: var(--text-main);
    border-radius: 11px;
    height: 40px;
    padding: 0 12px;
    font-size: 0.84rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
  }

  button.icon-btn:hover:not(:disabled) {
    background: rgba(24, 55, 70, 0.95);
    border-color: rgba(52, 211, 153, 0.55);
    transform: translateY(-1px);
  }

  button.icon-btn:active:not(:disabled) {
    transform: translateY(0) scale(0.96);
  }

  button.icon-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }

  button.icon-btn.primary-btn {
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.28), rgba(14, 116, 144, 0.38));
    border-color: rgba(52, 211, 153, 0.5);
    color: #d1fae5;
  }

  button.icon-btn svg {
    width: 17px;
    height: 17px;
    stroke: currentColor;
    stroke-width: 2.1;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Victory Banner Overlay (Zero-text symbolic + stats) */
  .victory-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(4, 12, 16, 0.55);
    backdrop-filter: blur(4px);
    border-radius: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 10;
  }

  .victory-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .victory-card {
    background: rgba(10, 26, 33, 0.95);
    border: 1px solid rgba(52, 211, 153, 0.55);
    border-radius: 22px;
    padding: 22px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 35px rgba(52, 211, 153, 0.22);
    transform: scale(0.92);
    transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .victory-overlay.active .victory-card {
    transform: scale(1);
  }

  .stars-row {
    display: flex;
    gap: 10px;
    font-size: 2.2rem;
    line-height: 1;
  }

  .star-glyph {
    color: rgba(255, 255, 255, 0.16);
    text-shadow: none;
    transition: transform 0.35s ease, color 0.35s ease;
  }

  .star-glyph.earned {
    color: var(--accent-gold);
    text-shadow: 0 0 18px rgba(251, 191, 36, 0.75);
    transform: scale(1.08);
  }

  .victory-title {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #d1fae5;
    text-transform: uppercase;
  }

  .victory-stats {
    font-size: 0.88rem;
    color: var(--text-muted);
    display: flex;
    gap: 16px;
  }

  .victory-actions {
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }

  /* Level Select Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(3, 9, 12, 0.82);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
    z-index: 30;
  }

  .modal-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-sheet {
    width: 100%;
    max-width: 500px;
    max-height: 86vh;
    background: rgba(10, 24, 31, 0.96);
    border: 1px solid rgba(52, 211, 153, 0.38);
    border-radius: 22px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(125, 211, 252, 0.14);
    padding-bottom: 10px;
  }

  .modal-title {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent-mint);
  }

  .total-stars-badge {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--accent-gold);
    background: rgba(251, 191, 36, 0.12);
    border: 1px solid rgba(251, 191, 36, 0.32);
    padding: 4px 10px;
    border-radius: 999px;
  }

  .level-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    overflow-y: auto;
    padding: 4px 2px;
  }

  .lvl-card {
    appearance: none;
    background: rgba(15, 35, 45, 0.8);
    border: 1px solid rgba(125, 211, 252, 0.18);
    border-radius: 14px;
    padding: 10px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    color: var(--text-main);
    transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
  }

  .lvl-card:hover {
    transform: translateY(-2px);
    border-color: rgba(52, 211, 153, 0.6);
    background: rgba(22, 50, 64, 0.95);
  }

  .lvl-card.current {
    border-color: var(--accent-mint);
    box-shadow: 0 0 14px rgba(52, 211, 153, 0.28);
  }

  .lvl-card-num {
    font-size: 1.1rem;
    font-weight: 800;
  }

  .lvl-card-role {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
  }

  .lvl-card-stars {
    font-size: 0.82rem;
    letter-spacing: 2px;
    color: rgba(255, 255, 255, 0.2);
  }

  .lvl-card-stars .lit {
    color: var(--accent-gold);
    text-shadow: 0 0 8px rgba(251, 191, 36, 0.6);
  }

  @media (max-width: 420px) {
    .app-shell {
      padding: 8px 10px 12px;
    }
    .hud-header {
      padding: 8px 10px;
    }
    .level-num {
      font-size: 1rem;
    }
    .level-name {
      font-size: 0.82rem;
    }
    button.icon-btn {
      padding: 0 9px;
      height: 38px;
      font-size: 0.78rem;
    }
    .btn-label-hide-sm {
      display: none;
    }
  }
</style>
</head>
<body>

<div class="app-shell">
  <!-- Top HUD -->
  <header class="hud-header">
    <div class="brand-block">
      <div class="game-title">Signal Garden</div>
      <div class="level-title-row">
        <span class="level-num" id="hud-level-num">01</span>
        <span class="level-name" id="hud-level-name">First Sprout</span>
      </div>
      <div class="arc-pill" id="hud-arc-pill">I · Reflection · Teach</div>
    </div>

    <div class="stats-cluster">
      <div class="stat-box" title="Moves taken">
        <span class="stat-label">Moves</span>
        <span class="stat-value" id="hud-moves">0</span>
      </div>
      <div class="stat-box" title="Target par moves for 3 stars">
        <span class="stat-label">Par</span>
        <span class="stat-value" id="hud-par">1</span>
      </div>
    </div>
  </header>

  <!-- Main Interactive Garden Canvas -->
  <main class="stage-wrap" id="stage-wrap">
    <canvas id="garden-canvas" width="480" height="480" aria-label="Signal Garden puzzle board"></canvas>

    <!-- Level Complete Overlay -->
    <div class="victory-overlay" id="victory-overlay">
      <div class="victory-card">
        <div class="stars-row" id="victory-stars">
          <span class="star-glyph">★</span>
          <span class="star-glyph">★</span>
          <span class="star-glyph">★</span>
        </div>
        <div class="victory-title" id="victory-title">Harmony Awake</div>
        <div class="victory-stats">
          <span id="victory-moves-text">Moves: 1</span>
          <span>·</span>
          <span id="victory-par-text">Par: 1</span>
        </div>
        <div class="victory-actions">
          <button class="icon-btn" id="btn-replay" type="button">
            <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
            Replay
          </button>
          <button class="icon-btn primary-btn" id="btn-next-victory" type="button">
            Next
            <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Bottom Action Bar -->
  <footer class="controls-bar">
    <div class="btn-group">
      <button class="icon-btn" id="btn-undo" type="button" title="Undo (Z)" disabled>
        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
        <span class="btn-label-hide-sm">Undo</span>
      </button>
      <button class="icon-btn" id="btn-redo" type="button" title="Redo (Y)" disabled>
        <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/></svg>
        <span class="btn-label-hide-sm">Redo</span>
      </button>
      <button class="icon-btn" id="btn-reset" type="button" title="Reset Level (R)">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        <span class="btn-label-hide-sm">Reset</span>
      </button>
    </div>

    <div class="btn-group">
      <button class="icon-btn" id="btn-audio" type="button" title="Toggle Chime Audio (M)">
        <svg id="icon-audio-on" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      </button>
      <button class="icon-btn primary-btn" id="btn-levels" type="button" title="Level Select (L)">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
        <span>Levels</span>
      </button>
    </div>
  </footer>
</div>

<!-- Level Select Modal -->
<div class="modal-backdrop" id="levels-modal" role="dialog" aria-modal="true" aria-label="Select Level">
  <div class="modal-sheet">
    <div class="modal-header">
      <span class="modal-title">Garden Conservatory</span>
      <span class="total-stars-badge" id="modal-total-stars">★ 0 / 48</span>
      <button class="icon-btn" id="btn-close-modal" type="button" aria-label="Close">✕</button>
    </div>
    <div class="level-grid" id="level-grid"></div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ===========================================================================
  // 1. CONSTANTS, COLOR ALGEBRA & HANDCRAFTED LEVEL DATA (16 LEVELS)
  // ===========================================================================
  // Directions & Tile Faces: 0 = North (Top), 1 = East (Right), 2 = South (Bottom), 3 = West (Left)
  const DX = [0, 1, 0, -1];
  const DY = [-1, 0, 1, 0];

  // 3-Bit RGB Additive Color Masks
  const C_RED     = 1; // 001

  };

  // D Major Pentatonic / Lydian Garden Scale (Hz) for notes 0..7
  const SCALE_FREQS = [

  // 16 Handcrafted Levels structured around:

  // ===========================================================================
  // 2. BEAM SIMULATION ENGINE & BFS PAR SOLVER (RUNS ON LOAD)
  // ===========================================================================
  function isRotatable(piece) {
    return (piece.type === 'mirror' || piece.type === 'splitter' || piece.type === 'filter') && !piece.fixed;
  }

  function simulateBoard(level, rotOverrides = null) {
    const { width, height, grid } = level;
    const board = Array.from({ length: height }, () => Array(width).fill(null));
    let rotIndex = 0;

    for (const item of grid) {
      const copy = { ...item };
      if (rotOverrides && isRotatable(copy)) {
        copy.rot = rotOverrides[rotIndex++];
      }
      board[copy.y][copy.x] = copy;
    }

    const podReceived = new Map();
    for (const item of grid) {
      if (item.type === 'pod') {
        podReceived.set(`${item.x},${item.y}`, 0);
      }
    }

    // Queue entries: { x, y, dir, color, depth }
    const queue = [];
    const visited = new Set();

    for (const item of grid) {
      if (item.type === 'source') {
        queue.push({
          x: item.x,
          y: item.y,
          dir: item.dir,
          color: item.color ?? C_WHITE,
          depth: 0
        });
      }
    }

    const segments = [];
    const litCells = new Map(); // "x,y" -> { color, depth, blockedBack }
    const backHits = new Map(); // "x,y" -> color (productive failure feedback when hitting wrong side of flower)

    while (queue.length > 0) {
      const { x, y, dir, color, depth } = queue.shift();
      if (!color || depth > 64) continue;

      const stateKey = `${x},${y},${dir},${color}`;
      if (visited.has(stateKey)) continue;
      visited.add(stateKey);

      const nx = x + DX[dir];
      const ny = y + DY[dir];

      if (nx < 0 || nx >= width || ny < 0 || ny >= height) {
        segments.push({ x1: x, y1: y, x2: nx, y2: ny, dir, color, outOfBounds: true, depth });
        continue;
      }

      segments.push({ x1: x, y1: y, x2: nx, y2: ny, dir, color, outOfBounds: false, depth });
      const target = board[ny][nx];

      if (!target) {
        queue.push({ x: nx, y: ny, dir, color, depth: depth + 1 });
        continue;
      }

      const cellKey = `${nx},${ny}`;
      const inFace = (dir + 2) % 4;

      if (target.type === 'pod') {
        const prev = podReceived.get(cellKey) || 0;
        podReceived.set(cellKey, prev | color);
        const existing = litCells.get(cellKey);
        litCells.set(cellKey, {
          color: (existing ? existing.color : 0) | color,
          depth: existing ? Math.min(existing.depth, depth + 1) : depth + 1
        });
      } else if (target.type === 'mirror') {
        const f1 = target.rot % 4;
        const f2 = (target.rot + 1) % 4;
        if (inFace === f1 || inFace === f2) {
          const outDir = inFace === f1 ? f2 : f1;
          const existing = litCells.get(cellKey);
          litCells.set(cellKey, {
            color: (existing ? existing.color : 0) | color,
            depth: existing ? Math.min(existing.depth, depth + 1) : depth + 1
          });
          queue.push({ x: nx, y: ny, dir: outDir, color, depth: depth + 1 });
        } else {
          backHits.set(cellKey, (backHits.get(cellKey) || 0) | color);
        }
      } else if (target.type === 'splitter') {
        const stem = target.rot % 4;
        if (inFace === stem) {
          const existing = litCells.get(cellKey);
          litCells.set(cellKey, {
            color: (existing ? existing.color : 0) | color,
            depth: existing ? Math.min(existing.depth, depth + 1) : depth + 1
          });
          queue.push({ x: nx, y: ny, dir: (stem + 1) % 4, color, depth: depth + 1 });
          queue.push({ x: nx, y: ny, dir: (stem + 3) % 4, color, depth: depth + 1 });
        } else {
          backHits.set(cellKey, (backHits.get(cellKey) || 0) | color);
        }
      } else if (target.type === 'filter') {
        const f1 = target.rot % 4;
        const f2 = (target.rot + 2) % 4;
        if (inFace === f1 || inFace === f2) {
          const outColor = color & target.color;
          if (outColor > 0) {
            const existing = litCells.get(cellKey);
            litCells.set(cellKey, {
              color: (existing ? existing.color : 0) | outColor,
              depth: existing ? Math.min(existing.depth, depth + 1) : depth + 1
            });
            queue.push({ x: nx, y: ny, dir, color: outColor, depth: depth + 1 });
          } else {
            // Subtractive mismatch (e.g., Red beam hitting Blue filter) -> productive failure spark
            backHits.set(cellKey, (backHits.get(cellKey) || 0) | color);
          }
        } else {
          backHits.set(cellKey, (backHits.get(cellKey) || 0) | color);
        }
      }
    }

    let allSolved = true;
    for (const item of grid) {
      if (item.type === 'pod') {
        const got = podReceived.get(`${item.x},${item.y}`) || 0;
        const want = item.color ?? C_WHITE;
        if (got !== want) {
          allSolved = false;
          break;
        }
      }
    }

    return { board, segments, podReceived, litCells, backHits, allSolved };
  }

  // BFS Solver that finds the exact minimum tap count to solve a level and verifies par
  function solveLevel(level) {
    const rotPieces = level.grid.filter(isRotatable);
    const startState = rotPieces.map(p => p.rot % 4);
    const n = rotPieces.length;

    const encode = (st) => st.join(',');
    const queue = [{ state: startState, moves: 0 }];
    const visited = new Set([encode(startState)]);

    while (queue.length > 0) {
      const { state, moves } = queue.shift();
      const sim = simulateBoard(level, state);
      if (sim.allSolved) {
        return {
          solvable: true,
          minMoves: moves,
          solvableAtPar: moves <= level.par,
          solutionState: state
        };
      }
      for (let i = 0; i < n; i++) {
        const next = state.slice();
        next[i] = (next[i] + 1) % 4;
        const key = encode(next);
        if (!visited.has(key)) {
          visited.add(key);
          queue.push({ state: next, moves: moves + 1 });
        }
      }
    }

    return { solvable: false, minMoves: Infinity, solvableAtPar: false, solutionState: null };
  }

  function verifyAllLevelsOnLoad() {
    console.group('%cSIGNAL GARDEN · Automated Level & Par Verification', 'color:#34d399;font-weight:bold;');
    let allValid = true;
    const report = LEVELS.map(lvl => {
      const res = solveLevel(lvl);
      const ok = res.solvable && res.solvableAtPar && res.minMoves === lvl.par;
      if (!ok) allValid = false;
      console.log(
        `Level ${String(lvl.id).padStart(2, '0')} [${lvl.role.padEnd(6)}] "${lvl.name}": ` +
        `solvable=${res.solvable}, minMoves=${res.minMoves}, par=${lvl.par}, solvableAtPar=${res.solvableAtPar}`
      );
      return { id: lvl.id, name: lvl.name, role: lvl.role, minMoves: res.minMoves, par: lvl.par, solvableAtPar: res.solvableAtPar };
    });
    console.log(
      `%cSummary: ${allValid ? 'ALL 16 LEVELS SOLVABLE AT PAR ✓' : 'WARNING: LEVEL MISMATCH'}`,
      `color:${allValid ? '#34d399' : '#fb7185'};font-weight:bold;`
    );
    console.groupEnd();
    return report;
  }

  // ===========================================================================
  // 3. WEBAUDIO HARMONIC CHIME SYNTHESIZER
  // ===========================================================================
  class GardenAudio {
    constructor() {
      this.ctx = null;
      this.muted = false;
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          this.ctx = new AudioCtx();
        }
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume().catch(() => {});
      }
    }

    playTap() {
      if (this.muted) return;
      this.init();
      if (!this.ctx) return;

      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(190, now);
      osc.frequency.exponentialRampToValueAtTime(270, now + 0.045);

      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.06);
    }

    playFlowerNote(noteIndex = 0, pieceType = 'mirror', delaySec = 0, duration = 0.65) {
      if (this.muted) return;
      this.init();
      if (!this.ctx) return;

      const freq = SCALE_FREQS[Math.abs(noteIndex) % SCALE_FREQS.length];
      const now = this.ctx.currentTime + delaySec;

      const oscMain = this.ctx.createOscillator();
      const oscHarm = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      // Give each botanical piece its own organic timbre
      if (pieceType === 'pod') {
        oscMain.type = 'sine';
        oscHarm.type = 'triangle';
        oscHarm.frequency.setValueAtTime(freq * 2, now); // Octave shimmer
      } else if (pieceType === 'splitter') {
        oscMain.type = 'triangle';
        oscHarm.type = 'sine';
        oscHarm.frequency.setValueAtTime(freq * 1.5, now); // Fifth harmonic
      } else {
        oscMain.type = 'sine';
        oscHarm.type = 'sine';
        oscHarm.frequency.setValueAtTime(freq * 2, now);
      }

      oscMain.frequency.setValueAtTime(freq, now);

      const harmGain = this.ctx.createGain();
      harmGain.gain.setValueAtTime(pieceType === 'pod' ? 0.045 : 0.02, now);
      harmGain.gain.exponentialRampToValueAtTime(0.0008, now + duration * 0.8);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(pieceType === 'pod' ? 0.14 : 0.095, now + 0.018);
      gain.gain.exponentialRampToValueAtTime(0.0008, now + duration);

      oscMain.connect(gain);
      oscHarm.connect(harmGain);
      harmGain.connect(gain);
      gain.connect(this.ctx.destination);

      oscMain.start(now);
      oscHarm.start(now);
      oscMain.stop(now + duration + 0.02);
      oscHarm.stop(now + duration + 0.02);
    }

    playSolvedMelody(orderedPieces) {
      if (this.muted) return;
      this.init();
      if (!this.ctx) return;

      // Play each lit flower/pod along the beam path in sequence, then a warm resolving chord
      const stepSec = 0.13;
      orderedPieces.forEach((p, idx) => {
        this.playFlowerNote(p.note ?? idx, p.type, idx * stepSec, 0.85);
      });

      const chordStart = orderedPieces.length * stepSec + 0.08;
      [0, 2, 4, 7].forEach((n, i) => {
        this.playFlowerNote(n, 'pod', chordStart + i * 0.04, 1.35);
      });
    }
  }

  const btnLevels = document.getElementById('btn-levels');

  const victoryOverlay = document.getElementById('victory-overlay');
  const victoryStars = document.getElementById('victory-stars');
  const victoryTitle = document.getElementById('victory-title');
  const victoryMovesText = document.getElementById('victory-moves-text');
  const victoryParText = document.getElementById('victory-par-text');
  const btnReplay = document.getElementById('btn-replay');
  const btnNextVictory = document.getElementById('btn-next-victory');

  const levelsModal = document.getElementById('levels-modal');
  const levelGrid = document.getElementById('level-grid');
  const modalTotalStars = document.getElementById('modal-total-stars');
  const btnCloseModal = document.getElementById('btn-close-modal');

  function initFireflies() {
    fireflies = Array.from({ length: 22 }, () => ({
      x: Math.random(),
      y: Math.random(),
      vx: (Math.random() - 0.5) * 0.0003,
      vy: (Math.random() - 0.5) * 0.0003,
      phase: Math.random() * Math.PI * 2,
      radius: 1.2 + Math.random() * 1.8
    }));
  }

  function loadLevel(idx) {
    currentLevelIdx = Math.max(0, Math.min(LEVELS.length - 1, idx));
    progress.currentLevelIndex = currentLevelIdx;
    saveProgress();

    const template = LEVELS[currentLevelIdx];
    activeLevel = {
      ...template,
      grid: template.grid.map(item => ({ ...item }))
    };

    displayRotations.clear();
    pulseAnimations.clear();
    for (const item of activeLevel.grid) {
      if (typeof item.rot === 'number') {
        displayRotations.set(`${item.x},${item.y}`, (item.rot % 4) * (Math.PI / 2));
      }
    }

    // Center keyboard cursor on first rotatable piece
    const firstRot = activeLevel.grid.find(isRotatable);
    if (firstRot) {
      cursorPos = { x: firstRot.x, y: firstRot.y };
    } else {
      cursorPos = { x: Math.floor(activeLevel.width / 2), y: Math.floor(activeLevel.height / 2) };
    }

    undoStack = [];
    redoStack = [];
    moveCount = 0;
    isLevelSolved = false;
    victoryOverlay.classList.remove('active');

    currentSim = simulateBoard(activeLevel);
    updateHUD();
    resizeCanvas();
  }

  function updateHUD() {
    const lvl = activeLevel;
    hudLevelNum.textContent = String(lvl.id).padStart(2, '0');
    hudLevelName.textContent = lvl.name;
    hudArcPill.textContent = `${lvl.arc} · ${lvl.role}`;
    hudMoves.textContent = String(moveCount);
    hudPar.textContent = String(lvl.par);

    if (moveCount > lvl.par) {
      hudMoves.classList.add('over-par');
    } else {
      hudMoves.classList.remove('over-par');
    }

    btnUndo.disabled = undoStack.length === 0 || isLevelSolved;
    btnRedo.disabled = redoStack.length === 0 || isLevelSolved;
  }

  // ===========================================================================
  // 6. INTERACTION, UNDO/REDO & VICTORY HARMONY
  // ===========================================================================
  function rotatePieceAt(x, y) {
    if (isLevelSolved) return;
    const piece = activeLevel.grid.find(p => p.x === x && p.y === y);
    if (!piece || !isRotatable(piece)) return;

    const prevLit = new Set(currentSim ? currentSim.litCells.keys() : []);
    const oldRot = piece.rot % 4;
    const newRot = (oldRot + 1) % 4;

    undoStack.push({ x, y, prevRot: oldRot, nextRot: newRot });
    redoStack = [];
    piece.rot = newRot;
    moveCount++;

    // Advance smooth visual rotation target by +90 deg
    const key = `${x},${y}`;
    const curAngle = displayRotations.get(key) ?? (oldRot * Math.PI / 2);
    const snappedBase = Math.round(curAngle / (Math.PI / 2)) * (Math.PI / 2);
    displayRotations.set(key, snappedBase + Math.PI / 2);

    audio.playTap();
    afterBoardChange(prevLit, key);
  }

  function undoMove() {
    if (undoStack.length === 0 || isLevelSolved) return;
    const action = undoStack.pop();
    redoStack.push(action);

    const piece = activeLevel.grid.find(p => p.x === action.x && p.y === action.y);
    if (piece) {
      const prevLit = new Set(currentSim ? currentSim.litCells.keys() : []);
      piece.rot = action.prevRot;
      moveCount = Math.max(0, moveCount - 1);

      const key = `${action.x},${action.y}`;
      const curAngle = displayRotations.get(key) ?? (action.nextRot * Math.PI / 2);
      const snappedBase = Math.round(curAngle / (Math.PI / 2)) * (Math.PI / 2);
      displayRotations.set(key, snappedBase - Math.PI / 2);

      audio.playTap();
      afterBoardChange(prevLit, key);
    }
  }

  function redoMove() {
    if (redoStack.length === 0 || isLevelSolved) return;
    const action = redoStack.pop();
    undoStack.push(action);

    const piece = activeLevel.grid.find(p => p.x === action.x && p.y === action.y);
    if (piece) {
      const prevLit = new Set(currentSim ? currentSim.litCells.keys() : []);
      piece.rot = action.nextRot;
      moveCount++;

      const key = `${action.x},${action.y}`;
      const curAngle = displayRotations.get(key) ?? (action.prevRot * Math.PI / 2);
      const snappedBase = Math.round(curAngle / (Math.PI / 2)) * (Math.PI / 2);
      displayRotations.set(key, snappedBase + Math.PI / 2);

      audio.playTap();
      afterBoardChange(prevLit, key);
    }
  }

  function afterBoardChange(prevLit, clickedKey) {
    currentSim = simulateBoard(activeLevel);
    updateHUD();

    const now = performance.now();
    pulseAnimations.set(clickedKey, now);

    // Chime any newly awakened flowers or seed-pods
    let delayIdx = 0;
    for (const [cellKey, info] of currentSim.litCells.entries()) {
      if (!prevLit.has(cellKey) || cellKey === clickedKey) {
        const [cx, cy] = cellKey.split(',').map(Number);
        const piece = activeLevel.grid.find(p => p.x === cx && p.y === cy);
        if (piece) {
          pulseAnimations.set(cellKey, now);
          audio.playFlowerNote(piece.note ?? 0, piece.type, delayIdx * 0.06, 0.55);
          delayIdx++;
        }
      }
    }

    if (currentSim.allSolved) {
      triggerLevelVictory();
    }
  }

  function triggerLevelVictory() {
    isLevelSolved = true;
    updateHUD();

    // Calculate star rating: 3 stars for <= par, 2 stars for <= par + 2, 1 star otherwise
    const par = activeLevel.par;
    const earnedStars = moveCount <= par ? 3 : (moveCount <= par + 2 ? 2 : 1);
    const prevBest = progress.starsByLevel[activeLevel.id] || 0;
    if (earnedStars > prevBest) {
      progress.starsByLevel[activeLevel.id] = earnedStars;
    }
    saveProgress();

    // Order all lit flowers + pods by beam depth so the solved garden plays an ascending melody
    const litList = [];
    for (const [cellKey, info] of currentSim.litCells.entries()) {
      const [cx, cy] = cellKey.split(',').map(Number);
      const piece = activeLevel.grid.find(p => p.x === cx && p.y === cy);
      if (piece) {
        litList.push({ piece, depth: info.depth });
        pulseAnimations.set(cellKey, performance.now() + info.depth * 90);
      }
    }
    litList.sort((a, b) => a.depth - b.depth);
    audio.playSolvedMelody(litList.map(item => item.piece));

    // Populate victory card
    const starSpans = victoryStars.querySelectorAll('.star-glyph');
    starSpans.forEach((el, idx) => {
      el.classList.toggle('earned', idx < earnedStars);
    });

    victoryTitle.textContent = earnedStars === 3 ? 'Perfect Bloom' : 'Garden Awake';
    victoryMovesText.textContent = `Moves: ${moveCount}`;
    victoryParText.textContent = `Par: ${par}`;
    btnNextVictory.style.display = currentLevelIdx < LEVELS.length - 1 ? 'inline-flex' : 'none';

    setTimeout(() => {
      if (isLevelSolved) {
        victoryOverlay.classList.add('active');
      }
    }, 520);
  }

  // ===========================================================================
  // 7. RESPONSIVE CANVAS SIZING & BOTANICAL RENDERING
  // ===========================================================================
  let boardMetrics = { size: 480, cellSize: 80, pad: 24, offsetX: 24, offsetY: 24 };

  function resizeCanvas() {
    const rect = stageWrap.getBoundingClientRect();
    const availW = Math.max(260, rect.width - 4);
    const availH = Math.max(260, rect.height - 4);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    const cols = activeLevel ? activeLevel.width : 5;
    const rows = activeLevel ? activeLevel.height : 5;
    const aspect = cols / rows;

    let cssW = availW;
    let cssH = cssW / aspect;
    if (cssH > availH) {
      cssH = availH;
      cssW = cssH * aspect;
    }

    cssW = Math.floor(cssW);
    cssH = Math.floor(cssH);

    canvas.style.width = `${cssW}px`;
    canvas.style.height = `${cssH}px`;
    canvas.width = Math.floor(cssW * dpr);
    canvas.height = Math.floor(cssH * dpr);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const pad = Math.max(16, Math.min(cssW, cssH) * 0.055);
    const cellSize = Math.min((cssW - pad * 2) / cols, (cssH - pad * 2) / rows);
    const gridW = cellSize * cols;
    const gridH = cellSize * rows;

    boardMetrics = {
      cssW,
      cssH,
      cellSize,
      offsetX: (cssW - gridW) / 2,
      offsetY: (cssH - gridH) / 2
    };
  }

  function cellCenter(gx, gy) {
    return {
      cx: boardMetrics.offsetX + (gx + 0.5) * boardMetrics.cellSize,
      cy: boardMetrics.offsetY + (gy + 0.5) * boardMetrics.cellSize
    };
  }

  function renderGarden(now) {
    const { cssW, cssH, cellSize, offsetX, offsetY } = boardMetrics;
    ctx.clearRect(0, 0, cssW, cssH);

    // 1. Deep nocturnal garden backdrop
    const bgGrad = ctx.createRadialGradient(
      cssW * 0.5, cssH * 0.45, cellSize * 0.4,
      cssW * 0.5, cssH * 0.5, Math.max(cssW, cssH) * 0.75
    );
    bgGrad.addColorStop(0, '#0d2630');
    bgGrad.addColorStop(1, '#061217');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, cssW, cssH);

    // 2. Ambient drifting fireflies
    for (const f of fireflies) {
      f.x = (f.x + f.vx + 1) % 1;
      f.y = (f.y + f.vy + 1) % 1;
      const alpha = 0.15 + 0.25 * Math.sin(now * 0.002 + f.phase);
      ctx.fillStyle = `rgba(167, 243, 208, ${alpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(f.x * cssW, f.y * cssH, f.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    if (!activeLevel || !currentSim) return;

    const { width, height } = activeLevel;

    // 3. Draw mossy garden tiles
    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const tx = offsetX + x * cellSize;
        const ty = offsetY + y * cellSize;
        const inset = Math.max(2.5, cellSize * 0.045);
        const r = Math.max(8, cellSize * 0.14);

        const isLit = currentSim.litCells.has(`${x},${y}`);
        ctx.fillStyle = isLit ? 'rgba(20, 52, 62, 0.72)' : 'rgba(11, 30, 38, 0.68)';
        ctx.strokeStyle = isLit ? 'rgba(110, 231, 183, 0.28)' : 'rgba(125, 211, 252, 0.10)';
        ctx.lineWidth = 1.2;

        roundRect(ctx, tx + inset, ty + inset, cellSize - inset * 2, cellSize - inset * 2, r);
        ctx.fill();
        ctx.stroke();

        // Subtle center moss dot on empty tiles
        if (!currentSim.board[y][x]) {
          ctx.fillStyle = 'rgba(148, 163, 184, 0.14)';
          ctx.beginPath();
          ctx.arc(tx + cellSize * 0.5, ty + cellSize * 0.5, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // 4. Draw Light Beams (Layered glow + core + traveling photon pulses)
    drawBeams(now);

    // 5. Draw Garden Pieces (Sources, Rocks, Mirror-Flowers, Splitters, Filters, Seed-Pods)
    for (const item of activeLevel.grid) {
      drawPiece(item, now);
    }

    // 6. Keyboard focus ring when navigating by keyboard
    if (keyboardActive) {
      const tx = offsetX + cursorPos.x * cellSize;
      const ty = offsetY + cursorPos.y * cellSize;
      ctx.strokeStyle = 'rgba(251, 191, 36, 0.85)';
      ctx.lineWidth = 2.2;
      ctx.setLineDash([5, 4]);
      roundRect(ctx, tx + 3, ty + 3, cellSize - 6, cellSize - 6, Math.max(8, cellSize * 0.14));
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  function drawBeams(now) {
    const { cellSize } = boardMetrics;
    ctx.save();
    ctx.lineCap = 'round';

    for (const seg of currentSim.segments) {
      const p1 = cellCenter(seg.x1, seg.y1);
      let p2 = cellCenter(seg.x2, seg.y2);

      if (seg.outOfBounds) {
        p2 = {
          cx: p1.cx + DX[seg.dir] * (cellSize * 0.48),
          cy: p1.cy + DY[seg.dir] * (cellSize * 0.48)
        };
      }

      const pal = COLOR_PALETTE[seg.color] || COLOR_PALETTE[7];

      // Outer bloom
      ctx.strokeStyle = pal.glow;
      ctx.lineWidth = Math.max(8, cellSize * 0.16);
      ctx.beginPath();
      ctx.moveTo(p1.cx, p1.cy);
      ctx.lineTo(p2.cx, p2.cy);
      ctx.stroke();

      // Inner bright core
      ctx.strokeStyle = pal.core;
      ctx.lineWidth = Math.max(3, cellSize * 0.055);
      ctx.beginPath();
      ctx.moveTo(p1.cx, p1.cy);
      ctx.lineTo(p2.cx, p2.cy);
      ctx.stroke();

      // Animated energy spore traveling along beam direction
      const t = ((now * 0.0018 - seg.depth * 0.25) % 1 + 1) % 1;
      const px = p1.cx + (p2.cx - p1.cx) * t;
      const py = p1.cy + (p2.cy - p1.cy) * t;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(px, py, Math.max(2, cellSize * 0.036), 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawPiece(piece, now) {
    const { cellSize } = boardMetrics;
    const { cx, cy } = cellCenter(piece.x, piece.y);
    const key = `${piece.x},${piece.y}`;

    // Smoothly interpolate rotation angle
    let angle = 0;
    if (typeof piece.rot === 'number') {
      const targetAngle = displayRotations.get(key) ?? ((piece.rot % 4) * (Math.PI / 2));
      const curAngle = piece._renderAngle ?? targetAngle;
      piece._renderAngle = curAngle + (targetAngle - curAngle) * 0.28;
      angle = piece._renderAngle;
    }

    // Chime ripple ring when activated
    const pulseStart = pulseAnimations.get(key);
    if (pulseStart && now >= pulseStart && now - pulseStart < 650) {
      const p = (now - pulseStart) / 650;
      const rad = cellSize * (0.25 + p * 0.35);
      ctx.strokeStyle = `rgba(167, 243, 208, ${(1 - p) * 0.65})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, rad, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Productive failure indicator: subtle ember glow if a beam hits the closed side of a piece
    const backHitColor = currentSim.backHits.get(key);
    if (backHitColor) {
      const pal = COLOR_PALETTE[backHitColor] || COLOR_PALETTE[7];
      const pulse = 0.5 + 0.5 * Math.sin(now * 0.008);
      ctx.strokeStyle = pal.core;
      ctx.globalAlpha = 0.35 + 0.3 * pulse;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, cellSize * 0.34, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    if (piece.type === 'rock') {
      drawRock(cx, cy, cellSize);
    } else if (piece.type === 'source') {
      drawSource(cx, cy, cellSize, piece, now);
    } else if (piece.type === 'mirror') {
      drawMirrorFlower(cx, cy, cellSize, piece, angle, now);
    } else if (piece.type === 'splitter') {
      drawSplitterFlower(cx, cy, cellSize, piece, angle, now);
    } else if (piece.type === 'filter') {
      drawFilterOrchid(cx, cy, cellSize, piece, angle, now);
    } else if (piece.type === 'pod') {
      drawSeedPod(cx, cy, cellSize, piece, now);
    }
  }

  function drawRock(cx, cy, cellSize) {
    const r = cellSize * 0.28;
    ctx.save();
    ctx.translate(cx, cy);

    // Mossy garden stone polygon
    ctx.fillStyle = '#192d36';
    ctx.strokeStyle = '#2d4a56';
    ctx.lineWidth = 2;
    ctx.beginPath();
    const pts = [
      [-r * 0.85, -r * 0.35],
      [-r * 0.25, -r * 0.9],
      [r * 0.65, -r * 0.7],
      [r * 0.92, r * 0.15],
      [r * 0.35, r * 0.85],
      [-r * 0.65, r * 0.75]
    ];
    pts.forEach(([px, py], i) => (i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py)));
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Moss highlight accents
    ctx.fillStyle = 'rgba(52, 211, 153, 0.22)';
    ctx.beginPath();
    ctx.arc(-r * 0.2, -r * 0.3, r * 0.32, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawSource(cx, cy, cellSize, piece, now) {
    const pal = COLOR_PALETTE[piece.color ?? 7];
    const dirAngle = (piece.dir % 4) * (Math.PI / 2);
    const r = cellSize * 0.29;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(dirAngle);

    // Sun-bulb base
    const grad = ctx.createRadialGradient(0, 0, r * 0.15, 0, 0, r * 1.15);
    grad.addColorStop(0, pal.core);
    grad.addColorStop(1, 'rgba(16, 185, 129, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.15, 0, Math.PI * 2);
    ctx.fill();

    // Botanical calyx cup pointing North (dir=0 before rotation)
    ctx.fillStyle = '#13333e';
    ctx.strokeStyle = pal.core;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.75, 0.15 * Math.PI, 0.85 * Math.PI, false);
    ctx.lineTo(-r * 0.55, -r * 0.65);
    ctx.lineTo(0, -r * 0.95);
    ctx.lineTo(r * 0.55, -r * 0.65);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Glowing emitter pearl
    const pulse = 1 + 0.08 * Math.sin(now * 0.005);
    ctx.fillStyle = pal.core;
    ctx.beginPath();
    ctx.arc(0, -r * 0.15, r * 0.36 * pulse, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(0, -r * 0.22, r * 0.16, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawMirrorFlower(cx, cy, cellSize, piece, angle, now) {
    // At rot=0, connects North (0, -1) and East (1, 0): diagonal normal points NE (+1, -1)
    const key = `${piece.x},${piece.y}`;
    const litInfo = currentSim.litCells.get(key);
    const isLit = Boolean(litInfo);
    const pal = isLit ? COLOR_PALETTE[litInfo.color] : { core: '#6ee7b7', glow: 'rgba(52, 211, 153, 0.2)' };
    const r = cellSize * 0.34;

    ctx.save();
    ctx.translate(cx, cy);

    // Subtle rotatable base ring
    ctx.strokeStyle = isLit ? pal.core : 'rgba(125, 211, 252, 0.26)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.92, 0, Math.PI * 2);
    ctx.stroke();

    ctx.rotate(angle);

    // Back leaf calyx (South-West corner at rot=0: blocks beams hitting from S or W)
    ctx.fillStyle = '#112c36';
    ctx.strokeStyle = '#2dd4bf';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.72, 0.25 * Math.PI, 1.25 * Math.PI, false);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Reflective curved crystal-petal facing North-East (connects N(0) <-> E(1))
    ctx.strokeStyle = isLit ? pal.core : '#a7f3d0';
    ctx.lineWidth = Math.max(4, cellSize * 0.075);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-r * 0.56, -r * 0.56);
    ctx.quadraticCurveTo(r * 0.1, -r * 0.1, r * 0.56, r * 0.56);
    ctx.stroke();

    // Guide ticks at N and E ports so the 90° bounce path is visually unambiguous
    ctx.fillStyle = isLit ? pal.core : 'rgba(167, 243, 208, 0.75)';
    ctx.beginPath();
    ctx.arc(0, -r * 0.76, 2.8, 0, Math.PI * 2);
    ctx.arc(r * 0.76, 0, 2.8, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawSplitterFlower(cx, cy, cellSize, piece, angle, now) {
    // At rot=0, input stem is North (0, -r), splitting to East (+r, 0) and West (-r, 0)
    const key = `${piece.x},${piece.y}`;
    const litInfo = currentSim.litCells.get(key);
    const isLit = Boolean(litInfo);
    const pal = isLit ? COLOR_PALETTE[litInfo.color] : { core: '#7dd3fc', glow: 'rgba(56, 189, 248, 0.25)' };
    const r = cellSize * 0.34;

    ctx.save();
    ctx.translate(cx, cy);

    // Rotatable base ring
    ctx.strokeStyle = isLit ? pal.core : 'rgba(125, 211, 252, 0.26)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.92, 0, Math.PI * 2);
    ctx.stroke();

    ctx.rotate(angle);

    // Stem funnel at North (input face = 0)
    ctx.strokeStyle = isLit ? pal.core : '#93c5fd';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-r * 0.26, -r * 0.78);
    ctx.lineTo(0, -r * 0.15);
    ctx.lineTo(r * 0.26, -r * 0.78);
    ctx.stroke();

    // Twin output petals facing West (-r, 0) and East (+r, 0)
    ctx.fillStyle = isLit ? pal.glow : 'rgba(56, 189, 248, 0.18)';
    ctx.strokeStyle = isLit ? pal.core : '#7dd3fc';
    ctx.lineWidth = 2.2;

    // Left petal (West)
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-r * 0.45, -r * 0.36, -r * 0.82, 0);
    ctx.quadraticCurveTo(-r * 0.45, r * 0.36, 0, 0);
    ctx.fill();
    ctx.stroke();

    // Right petal (East)
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(r * 0.45, -r * 0.36, r * 0.82, 0);
    ctx.quadraticCurveTo(r * 0.45, r * 0.36, 0, 0);
    ctx.fill();
    ctx.stroke();

    // Central prism jewel
    ctx.fillStyle = isLit ? '#ffffff' : '#bae6fd';
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.28);
    ctx.lineTo(r * 0.28, 0);
    ctx.lineTo(0, r * 0.28);
    ctx.lineTo(-r * 0.28, 0);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawFilterOrchid(cx, cy, cellSize, piece, angle, now) {
    // At rot=0 (or 2), open channel is vertical (N <-> S), filtering to piece.color
    const key = `${piece.x},${piece.y}`;
    const litInfo = currentSim.litCells.get(key);
    const isLit = Boolean(litInfo);
    const pal = COLOR_PALETTE[piece.color] || COLOR_PALETTE[1];
    const r = cellSize * 0.34;

    ctx.save();
    ctx.translate(cx, cy);

    // Rotatable base ring
    ctx.strokeStyle = isLit ? pal.core : 'rgba(125, 211, 252, 0.26)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.92, 0, Math.PI * 2);
    ctx.stroke();

    ctx.rotate(angle);

    // Closed side guard leaves on West & East (showing the beam must pass through the N-S iris)
    ctx.fillStyle = '#122b34';
    ctx.strokeStyle = '#335c67';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(-r * 0.52, 0, r * 0.32, -Math.PI * 0.5, Math.PI * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(r * 0.52, 0, r * 0.32, Math.PI * 0.5, -Math.PI * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Translucent stained-glass orchid lens spanning N <-> S
    ctx.fillStyle = pal.glow;
    ctx.strokeStyle = pal.core;
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.82);
    ctx.quadraticCurveTo(r * 0.44, 0, 0, r * 0.82);
    ctx.quadraticCurveTo(-r * 0.44, 0, 0, -r * 0.82);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Inner color core
    ctx.fillStyle = pal.core;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.24, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawSeedPod(cx, cy, cellSize, piece, now) {
    const key = `${piece.x},${piece.y}`;
    const targetColor = piece.color ?? C_WHITE;
    const receivedColor = currentSim.podReceived.get(key) || 0;
    const isAwake = receivedColor === targetColor;
    const targetPal = COLOR_PALETTE[targetColor];
    const r = cellSize * 0.34;

    ctx.save();
    ctx.translate(cx, cy);

    // Outer target aura when awake
    if (isAwake) {
      const bloom = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 1.45);
      bloom.addColorStop(0, targetPal.glow);
      bloom.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = bloom;
      ctx.beginPath();
      ctx.arc(0, 0, r * 1.45, 0, Math.PI * 2);
      ctx.fill();
    }

    // Lotus petals (open wide when awake, cupped when sleeping)
    const petalCount = 6;
    const openFactor = isAwake ? 1 : (receivedColor > 0 ? 0.55 : 0.25);
    const spin = isAwake ? now * 0.0008 : 0;

    for (let i = 0; i < petalCount; i++) {
      const a = spin + (i * Math.PI * 2) / petalCount;
      ctx.save();
      ctx.rotate(a);
      ctx.fillStyle = isAwake ? targetPal.glow : 'rgba(20, 48, 60, 0.85)';
      ctx.strokeStyle = targetPal.core;
      ctx.lineWidth = isAwake ? 2.2 : 1.6;

      const reach = r * (0.62 + openFactor * 0.35);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(r * 0.34, -reach * 0.55, 0, -reach);
      ctx.quadraticCurveTo(-r * 0.34, -reach * 0.55, 0, 0);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // Productive Failure / Additive Mixing Indicator:
    // Show required color ring on the pod rim, and current received color inside the seed core!
    ctx.strokeStyle = targetPal.core;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.45, 0, Math.PI * 2);
    ctx.stroke();

    // Inner core shows received color (or sleeping dim center)
    if (receivedColor > 0) {
      const recPal = COLOR_PALETTE[receivedColor] || targetPal;
      ctx.fillStyle = recPal.core;
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = '#091920';
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2);
      ctx.fill();
    }

    // For composite target colors (Yellow=3, Magenta=5, Cyan=6, White=7), draw small component dots on rim
    const components = [];
    if (targetColor & C_RED) components.push(COLOR_PALETTE[C_RED].core);
    if (targetColor & C_GREEN) components.push(COLOR_PALETTE[C_GREEN].core);
    if (targetColor & C_BLUE) components.push(COLOR_PALETTE[C_BLUE].core);

    if (components.length > 1) {
      components.forEach((col, idx) => {
        const ang = -Math.PI / 2 + (idx * Math.PI * 2) / components.length;
        const dx = Math.cos(ang) * (r * 0.45);
        const dy = Math.sin(ang) * (r * 0.45);
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(dx, dy, 3.2, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    ctx.restore();
  }

  function roundRect(context, x, y, w, h, radius) {
    context.beginPath();
    context.moveTo(x + radius, y);
    context.arcTo(x + w, y, x + w, y + h, radius);
    context.arcTo(x + w, y + h, x, y + h, radius);
    context.arcTo(x, y + h, x, y, radius);
    context.arcTo(x, y, x + w, y, radius);
    context.closePath();
  }

  // ===========================================================================
  // 8. INPUT HANDLERS (POINTER, TOUCH, KEYBOARD & MODAL)
  // ===========================================================================
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    keyboardActive = false;
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;

    const gx = Math.floor((px - boardMetrics.offsetX) / boardMetrics.cellSize);
    const gy = Math.floor((py - boardMetrics.offsetY) / boardMetrics.cellSize);

    if (gx >= 0 && gx < activeLevel.width && gy >= 0 && gy < activeLevel.height) {
      cursorPos = { x: gx, y: gy };
      rotatePieceAt(gx, gy);
    }
  });

  window.addEventListener('keydown', (e) => {
    if (levelsModal.classList.contains('open')) {
      if (e.key === 'Escape') closeLevelsModal();
      return;
    }

    if (isLevelSolved && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      if (currentLevelIdx < LEVELS.length - 1) {
        loadLevel(currentLevelIdx + 1);
      }
      return;
    }

    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
      e.preventDefault();
      if (e.shiftKey) redoMove();
      else undoMove();
      return;
    }

    switch (e.key) {
      case 'ArrowUp':
      case 'w':
      case 'W':
        e.preventDefault();
        keyboardActive = true;
        cursorPos.y = (cursorPos.y - 1 + activeLevel.height) % activeLevel.height;
        break;
      case 'ArrowDown':
      case 's':
      case 'S':
        e.preventDefault();
        keyboardActive = true;
        cursorPos.y = (cursorPos.y + 1) % activeLevel.height;
        break;
      case 'ArrowLeft':
      case 'a':
      case 'A':
        e.preventDefault();
        keyboardActive = true;
        cursorPos.x = (cursorPos.x - 1 + activeLevel.width) % activeLevel.width;
        break;
      case 'ArrowRight':
      case 'd':
      case 'D':
        e.preventDefault();
        keyboardActive = true;
        cursorPos.x = (cursorPos.x + 1) % activeLevel.width;
        break;
      case ' ':
      case 'Enter':
        e.preventDefault();
        keyboardActive = true;
        rotatePieceAt(cursorPos.x, cursorPos.y);
        break;
      case 'z':
      case 'Z':
        e.preventDefault();
        undoMove();
        break;
      case 'y':
      case 'Y':
        e.preventDefault();
        redoMove();
        break;
      case 'r':
      case 'R':
        e.preventDefault();
        loadLevel(currentLevelIdx);
        break;
      case 'l':
      case 'L':
        e.preventDefault();
        openLevelsModal();
        break;
      case 'm':
      case 'M':
        e.preventDefault();
        toggleAudio();
        break;
    }
  });

  btnUndo.addEventListener('click', undoMove);
  btnRedo.addEventListener('click', redoMove);
  btnReset.addEventListener('click', () => loadLevel(currentLevelIdx));
  btnReplay.addEventListener('click', () => loadLevel(currentLevelIdx));
  btnNextVictory.addEventListener('click', () => {
    if (currentLevelIdx < LEVELS.length - 1) {
      loadLevel(currentLevelIdx + 1);
    }
  });

  function toggleAudio() {
    audio.muted = !audio.muted;
    btnAudio.style.opacity = audio.muted ? '0.45' : '1';
  }
  btnAudio.addEventListener('click', toggleAudio);

  function openLevelsModal() {
    renderLevelSelectGrid();
    levelsModal.classList.add('open');
  }

  function closeLevelsModal() {
    levelsModal.classList.remove('open');
  }

  btnLevels.addEventListener('click', openLevelsModal);
  btnCloseModal.addEventListener('click', closeLevelsModal);
  levelsModal.addEventListener('click', (e) => {
    if (e.target === levelsModal) closeLevelsModal();
  });

  function renderLevelSelectGrid() {
    levelGrid.innerHTML = '';
    let totalStars = 0;

    LEVELS.forEach((lvl, idx) => {
      const stars = progress.starsByLevel[lvl.id] || 0;
      totalStars += stars;

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'lvl-card' + (idx === currentLevelIdx ? ' current' : '');

      const starHtml = [1, 2, 3]
        .map(s => `<span class="${s <= stars ? 'lit' : ''}">★</span>`)
        .join('');

      btn.innerHTML = `
        <span class="lvl-card-num">${String(lvl.id).padStart(2, '0')}</span>
        <span class="lvl-card-role">${lvl.role}</span>
        <div class="lvl-card-stars">${starHtml}</div>
      `;

      btn.addEventListener('click', () => {
        closeLevelsModal();
        loadLevel(idx);
      });
      levelGrid.appendChild(btn);
    });

    modalTotalStars.textContent = `★ ${totalStars} / ${LEVELS.length * 3}`;
  }

  window.addEventListener('resize', resizeCanvas);

  // ===========================================================================
  // 9. BOOTSTRAP & MAIN LOOP
  // ===========================================================================
  verifyAllLevelsOnLoad();
  loadProgress();
  initFireflies();
  loadLevel(progress.currentLevelIndex);

  function loop(now) {
    renderGarden(now);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
