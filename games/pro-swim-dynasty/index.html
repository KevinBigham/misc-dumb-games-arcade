// Draw a talent percentile rank r in [0, 1] where 0 is generational/league-#1 and 1 is replacement
// Calibrated so across 24 teams (48 primary specialists per event):
// #1 in league lands ~0.999 to 1.002 of benchmark, #8 lands ~1.022 (+2.2%), #50 lands ~1.050 (+5.0%)
function drawTalentBaseMultiplier(rngState, tierShift = 0.0, isReplacement = false) {
  if (isReplacement) {
    return randRange(rngState, 1.042, 1.055);
  }
  const u = nextRandom(rngState);
  // Power curve calibrated so across 24 teams in a multi-meet season:
  // #1 season best lands within +-0.7% of benchmark, #8 lands +1.8% to +2.6% behind #1, #50 lands +4.5% to +5.6% behind #1
  let base;
  if (u < 0.03) {
    base = 0.9985 + (u / 0.03) * 0.0045; // 0.9985 .. 1.0030
  } else if (u < 0.18) {
    const t = (u - 0.03) / 0.15;
    base = 1.0030 + Math.pow(t, 0.92) * 0.0205; // 1.0030 .. 1.0235
  } else {
    const t = (u - 0.18) / 0.82;
    base = 1.0235 + Math.pow(t, 0.85) * 0.0215; // 1.0235 .. 1.0450
  }
  return Math.max(0.994, base + tierShift);
}

// Compute age offset relative to swimmer's career curve
// At peakAge, ageOffset = 0.000.
// Young pros (18-22) start slightly above their peak ceiling and drop 0.5%-1.5%/yr toward peak.
function initialAgeCurveOffset(age, peakAge) {
  if (age < peakAge) {
    const yrsToPeak = Math.min(6, peakAge - age);
    return yrsToPeak * 0.0055; // ~0.55% per year away from peak
  } else {
    const yrsPast = age - peakAge;
    if (yrsPast <= 2.5) return yrsPast * 0.0015;
    return 0.0038 + (yrsPast - 2.5) * 0.0065;
  }
}

function createSwimmer(rngState, id, gender, archetype, options = {}) {
  const firstPool = gender === "F" ? FIRST_NAMES_F : FIRST_NAMES_M;
  const firstName = randChoice(rngState, firstPool);
  const lastName = randChoice(rngState, LAST_NAMES);
  const info = ARCHETYPE_INFO[archetype] || ARCHETYPE_INFO.MID_FREE;

  const age = options.age ?? randInt(rngState, 19, 30);
  const peakAge = roundHundredth(randClampedNormal(rngState, info.peakMean, 1.1, 22.0, 28.5));
  const tierShift = options.tierShift ?? 0.0;
  const isReplacement = Boolean(options.isReplacement);

  // Peak ceiling multiplier in primary specialty (around 1.000 - 1.052)
  const peakSpecialtyMult = drawTalentBaseMultiplier(rngState, tierShift, isReplacement);
  const ageOffset = options.isProspect
    ? randRange(rngState, 0.015, 0.042) // prospects have room to drop
    : initialAgeCurveOffset(age, peakAge);

  const currentPrimaryMult = peakSpecialtyMult + ageOffset;

  // Build continuous physiological distance anchors: dSprint (u=0), dMid (u=0.45), dDist (u=1.0)
  let dSprint, dMid, dDist;
  if (archetype === "SPRINTER") {
    const is100Type = nextRandom(rngState) < 0.55;
    if (is100Type) {
      dSprint = currentPrimaryMult + 0.001;
      dMid = currentPrimaryMult + randRange(rngState, 0.008, 0.016);
    } else {
      dSprint = currentPrimaryMult - 0.001;
      dMid = dSprint + randRange(rngState, 0.018, 0.030);
    }
    dDist = dMid + randRange(rngState, 0.032, 0.056);
  } else if (archetype === "MID_FREE") {
    dMid = currentPrimaryMult - 0.003;
    const is100_200 = nextRandom(rngState) < 0.22;
    const genderSprintGap = gender === "M" ? 0.012 : 0.000;
    const sprintDiff = is100_200
      ? randRange(rngState, 0.008, 0.016)
      : randRange(rngState, 0.044, 0.058) + genderSprintGap;
    const distDiff = randRange(rngState, 0.022, 0.036);
    dSprint = dMid + sprintDiff;
    dDist = dMid + distDiff;
  } else if (archetype === "DIST_FREE") {
    dDist = currentPrimaryMult - 0.003;
    const is500_1000 = nextRandom(rngState) < 0.48;
    dMid = is500_1000
      ? dDist + randRange(rngState, 0.000, 0.008)
      : dDist + randRange(rngState, 0.008, 0.018);
    dSprint = dMid + randRange(rngState, 0.036, 0.054);
  } else if (archetype === "IMER") {
    dMid = currentPrimaryMult - 0.005;
    const is400Type = nextRandom(rngState) < 0.55;
    if (is400Type) {
      dDist = dMid - randRange(rngState, 0.000, 0.003);
      dSprint = dMid + randRange(rngState, 0.014, 0.024);
    } else {
      dSprint = dMid + randRange(rngState, 0.010, 0.020);
      dDist = dMid + randRange(rngState, 0.006, 0.016);
    }
  } else {
    // BACKSTROKER, BREASTSTROKER, FLYER (100 at u=0.18, 200 at u=0.45)
    // evalDistanceCurve subtracts ~0.0046 at u=0.18 (sweet100), so dSprint = dMid + 0.005 balances 100 and 200
    const lean200 = nextRandom(rngState) < 0.50;
    if (lean200) {
      dMid = currentPrimaryMult - 0.003;
      dSprint = dMid + randRange(rngState, 0.005, 0.010);
      dDist = dMid + randRange(rngState, 0.014, 0.026);
    } else {
      dMid = currentPrimaryMult - 0.001;
      dSprint = dMid + randRange(rngState, 0.001, 0.006);
      dDist = dMid + randRange(rngState, 0.016, 0.028);
    }
  }

  // Stroke handicaps (>= 0; 0 = primary stroke level)
  const strokeHandicap = { free: 0.038, back: 0.055, breast: 0.068, fly: 0.052, im: 0.040 };
  const secStrokes = ["back", "breast", "fly"];
  const favOffStroke = randChoice(rngState, secStrokes);

  if (archetype === "SPRINTER" || archetype === "MID_FREE" || archetype === "DIST_FREE") {
    strokeHandicap.free = 0.000;
    strokeHandicap[favOffStroke] = randRange(rngState, 0.016, 0.030);
    for (const st of secStrokes) {
      if (st !== favOffStroke) strokeHandicap[st] = randRange(rngState, 0.028, 0.048);
    }
    strokeHandicap.im = archetype === "DIST_FREE"
      ? randRange(rngState, 0.014, 0.026)
      : randRange(rngState, 0.018, 0.032);
  } else if (archetype === "BACKSTROKER") {
    strokeHandicap.back = 0.000;
    strokeHandicap.free = randRange(rngState, 0.035, 0.050);
    strokeHandicap.fly = randRange(rngState, 0.016, 0.030);
    strokeHandicap.breast = randRange(rngState, 0.034, 0.055);
    strokeHandicap.im = randRange(rngState, 0.014, 0.026);
  } else if (archetype === "BREASTSTROKER") {
    strokeHandicap.breast = 0.000;
    strokeHandicap.im = randRange(rngState, 0.014, 0.026);
    strokeHandicap.free = randRange(rngState, 0.042, 0.058);
    strokeHandicap.fly = randRange(rngState, 0.020, 0.036);
    strokeHandicap.back = randRange(rngState, 0.030, 0.048);
  } else if (archetype === "FLYER") {
    strokeHandicap.fly = 0.000;
    strokeHandicap.free = randRange(rngState, 0.035, 0.050);
    strokeHandicap.back = randRange(rngState, 0.016, 0.030);
    strokeHandicap.breast = randRange(rngState, 0.034, 0.055);
    strokeHandicap.im = randRange(rngState, 0.014, 0.026);
  } else if (archetype === "IMER") {
    strokeHandicap.im = 0.000;
    // IMers have strong balanced 4 strokes, plus one standout stroke
    strokeHandicap[favOffStroke] = randRange(rngState, 0.011, 0.020);
    for (const st of secStrokes) {
      if (st !== favOffStroke) strokeHandicap[st] = randRange(rngState, 0.018, 0.032);
    }
    strokeHandicap.free = randRange(rngState, 0.032, 0.048);
  }

  // Technical & mental ratings (50 to 99 scale)
  const startSkill = Math.round(randClampedNormal(rngState, archetype === "SPRINTER" ? 80 : 73, 9, 50, 99));
  const turnUnderwater = Math.round(randClampedNormal(rngState, 75, 9, 50, 99));
  const relayExchange = Math.round(randClampedNormal(rngState, 75, 10, 50, 99));
  const taperResponse = roundHundredth(randClampedNormal(rngState, 1.00, 0.10, 0.78, 1.24));
  const clutch = Math.round(randClampedNormal(rngState, 74, 10, 45, 99));
  const consistency = Math.round(randClampedNormal(rngState, 76, 9, 50, 99));
  const durability = Math.round(randClampedNormal(rngState, 76, 9, 50, 99));

  // Potential: how much faster (lower multiplier) their true peak can reach
  const upsideRoom = age <= 22
    ? randRange(rngState, 0.012, 0.042)
    : (age < peakAge ? randRange(rngState, 0.004, 0.016) : 0.002);
  const potentialCeiling = Math.max(0.978, currentPrimaryMult - upsideRoom);

  const swimmer = {
    id,
    firstName,
    lastName,
    name: `${firstName} ${lastName}`,
    gender,
    age,
    peakAge,
    archetype,
    trainingGroup: info.group, // 'sprint' | 'mid' | 'distance' | 'stroke'
    teamId: options.teamId ?? null,
    physiology: {
      dSprint: roundHundredth(dSprint * 1000) / 1000,
      dMid: roundHundredth(dMid * 1000) / 1000,
      dDist: roundHundredth(dDist * 1000) / 1000,
      strokeHandicap: {
        free: Math.round(strokeHandicap.free * 10000) / 10000,
        back: Math.round(strokeHandicap.back * 10000) / 10000,
        breast: Math.round(strokeHandicap.breast * 10000) / 10000,
        fly: Math.round(strokeHandicap.fly * 10000) / 10000,
        im: Math.round(strokeHandicap.im * 10000) / 10000
      }
    },
    skills: {
      startSkill,
      turnUnderwater,
      relayExchange,
      taperResponse,
      clutch,
      consistency,
      durability
    },
    potential: {
      ceiling: Math.round(potentialCeiling * 10000) / 10000,
      devRate: roundHundredth(randClampedNormal(rngState, 1.0, 0.22, 0.55, 1.48)),
      lateBloomer: nextRandom(rngState) < 0.14
    },
    conditioning: {
      fitness: 82,       // 0..100 (82 is baseline mid-season fitness)
      fatigue: 38,       // 0..100 (38 is normal in-season training load fatigue)
      taperStatus: "none", // 'none' | 'resting' | 'tapered'
      taperBonus: 0,     // 0..0.032 fractional speed boost when tapered
      taperWeeksLeft: 0,
      tapersUsed: 0
    },
    injury: null, // null or { type: "Shoulder Tendinitis", weeksLeft: 2 }
    onInjuredList: false,
    contract: {
      salary: MIN_SALARY,
      yearsLeft: 1,
      isRookieDeal: false
    },
    personalBests: {},   // { [eventId]: { time, season, week, meetName, splits, powerPoints } }
    seasonBests: {},     // { [eventId]: { time, week, meetId, isTapered, splits, powerPoints } }
    careerHistory: [],   // [{ season, age, teamId, bestEventId, bestTime, maxPowerPoints }]
    awards: [],
    baseTimesCache: null
  };

  recomputeSwimmerBaseTimes(swimmer);
  estimateContractSalary(swimmer);
  return swimmer;
}

// Interpolate swimmer's physiological distance multiplier at normalized u in [0, 1]
function evalDistanceCurve(phys, u) {
  if (u <= 0.45) {
    const t = u / 0.45;
    // Slight natural 100-yard efficiency sweet spot for 100yd races (0 at 50yd and 200yd)
    const sweet100 = 0.0048 * 4 * t * (1 - t);
    return phys.dSprint * (1 - t) + phys.dMid * t - sweet100;
  } else {
    const t = (u - 0.45) / 0.55;
    return phys.dMid * (1 - t) + phys.dDist * t;
  }
}

// Compute intrinsic Tapered Peak Base Time for every individual event and 50 stroke leg
function recomputeSwimmerBaseTimes(swimmer) {
  const phys = swimmer.physiology;
  const sk = swimmer.skills;
  const g = swimmer.gender;

  // Start & turn adjustments (small, realistic percentages)
  const startMod = ((75 - sk.startSkill) / 25) * 0.0038; // +-0.38% on 50s
  const turnMod = ((75 - sk.turnUnderwater) / 25) * 0.0032;

  const indTimes = {};
  for (const ev of INDIVIDUAL_EVENTS) {
    const bench = g === "M" ? ev.benchM : ev.benchF;
    const distMult = evalDistanceCurve(phys, ev.u);
    let strokeH = phys.strokeHandicap[ev.stroke] ?? 0.04;

    if (ev.stroke === "im") {
      // IM blends the 4 stroke handicaps with the swimmer's IM transition skill
      const avg4 = 0.22 * phys.strokeHandicap.fly +
                   0.25 * phys.strokeHandicap.back +
                   0.29 * phys.strokeHandicap.breast +
                   0.24 * phys.strokeHandicap.free;
      strokeH = 0.85 * phys.strokeHandicap.im + Math.max(0, 0.15 * (avg4 - 0.024));
    }

    const startWeight = ev.dist === 50 ? 1.0 : (ev.dist === 100 ? 0.55 : (ev.dist === 200 ? 0.28 : 0.10));
    const turnWeight = ev.dist === 50 ? 0.35 : (ev.dist <= 200 ? 0.85 : 1.0);
    // Men's 50FR benchmark (18.20 vs 40.80 100FR, ratio 2.242) has a steeper anaerobic drop-off for non-50-specialists than Women's (21.00 vs 46.20, ratio 2.200)
    const nonSprinter50Gap = (ev.id === "50FR" && swimmer.archetype !== "SPRINTER")
      ? (g === "M" ? 0.011 : 0.000)
      : 0.0;
    const totalMult = distMult + strokeH + nonSprinter50Gap + startMod * startWeight + turnMod * turnWeight;

    indTimes[ev.id] = roundHundredth(bench * totalMult);
  }

  // 50-yard flat-start stroke times (used for 200 Medley Relay legs)
  const stroke50Times = {
    "50FR": indTimes["50FR"]
  };
  for (const [stName, code] of [["back", "50BK"], ["breast", "50BR"], ["fly", "50FL"]]) {
    const cfg = STROKE_50_BENCH[stName];
    const bench50 = g === "M" ? cfg.M : cfg.F;
    const distMult = evalDistanceCurve(phys, cfg.u);
    const strokeH = phys.strokeHandicap[stName];
    const totalMult = distMult + strokeH + startMod * 0.90 + turnMod * 0.45;
    stroke50Times[code] = roundHundredth(bench50 * totalMult);
  }

  // Identify top event and power points rating
  let bestEv = "100FR";
  let bestPP = 0;
  for (const ev of INDIVIDUAL_EVENTS) {
    const pp = calcPowerPoints(ev.id, g, indTimes[ev.id]);
    if (pp > bestPP) {
      bestPP = pp;
      bestEv = ev.id;
    }
  }

  Object.defineProperty(swimmer, "baseTimesCache", {
    value: {
      ind: indTimes,
      stroke50: stroke50Times,
      bestEventId: bestEv,
      peakPowerPoints: bestPP
    },
    enumerable: false,
    writable: true,
    configurable: true
  });
  return swimmer.baseTimesCache;
}

function estimateContractSalary(swimmer) {
  if (!swimmer.baseTimesCache) recomputeSwimmerBaseTimes(swimmer);
  const pp = swimmer.baseTimesCache.peakPowerPoints;
  // ~860 pp is replacement ($60k), ~930 pp is solid starter ($140k), ~990+ pp is superstar ($380k-$480k)
  const excess = Math.max(0, pp - 855);
  const raw = MIN_SALARY + Math.pow(excess / 145, 2.15) * 360000;
  const rounded = Math.round(Math.min(500000, Math.max(MIN_SALARY, raw)) / 5000) * 5000;
  if (!swimmer.contract.isRookieDeal) {
    swimmer.contract.marketValue = rounded;
  }
  return rounded;
}

// Compute expected conditioned multiplier relative to Tapered Peak Base Time
// Note: `baseTimesCache` stores the swimmer's Tapered Peak time (when fitness=92, fatigue=8, taperStatus='tapered').
// During normal untapered in-season weeks (fitness ~82, fatigue ~38, taperStatus='none'),
// swimmers swim ~2.3% to 2.7% slower than their tapered best!
function getConditioningMultiplier(swimmer, context = {}) {
  const cond = swimmer.conditioning;
  const sk = swimmer.skills;

  // Base untapered training drag vs tapered peak:
  // When fully tapered (taperBonus ~ 0.025, fatigue ~ 6), multiplier is ~1.000.
  // When untapered in-season (taperBonus = 0, fatigue ~ 38), multiplier is ~1.025 (+2.5% slower than tapered best).
  const fatigueDrag = (cond.fatigue / 100) * 0.036; // at fatigue=38 -> +0.0137
  const fitnessDelta = ((90 - cond.fitness) / 100) * 0.018; // at fitness=82 -> +0.0014
  const unshavedDrag = cond.taperStatus === "tapered"
    ? Math.max(0, 0.012 - cond.taperBonus * 0.48 * sk.taperResponse)
    : (cond.taperStatus === "resting" ? 0.0055 : 0.0115);

  let mult = 1.0 + fatigueDrag + fitnessDelta + unshavedDrag - (cond.taperStatus === "tapered" ? (cond.taperBonus - 0.024) * 0.5 : 0);

  // Same-meet accumulated fatigue from earlier events in the meet
  if (context.priorSwimsInMeet && context.priorSwimsInMeet.length > 0) {
    let doublePenalty = 0;
    const currentSlot = context.currentSlot ?? 15;
    const currentDay = context.currentDay ?? 1;
    const durFactor = 1.0 - ((sk.durability - 50) / 100) * 0.45; // high durability reduces penalty

    for (const prev of context.priorSwimsInMeet) {
      if (prev.day === currentDay) {
        // A 50-yard relay leg with >3 slots of recovery acts as a warm-up and leaves zero lactate debt
        const slotGap = Math.max(1, currentSlot - prev.slot);
        if (prev.dist <= 50 && slotGap > 3) continue;
        const yardWeight = prev.dist >= 500 ? 1.35 : (prev.dist >= 200 ? 1.00 : 0.65);
        // Back-to-back or within 4 slots (1-2 gender events apart) costs acute lactate fatigue;
        // 7+ slots (~45+ minutes) clears lactate for conditioned pros
        if (slotGap <= 2) {
          doublePenalty += 0.0105 * yardWeight * durFactor;
        } else if (slotGap <= 4) {
          doublePenalty += 0.0045 * yardWeight * durFactor;
        } else if (slotGap <= 6 && prev.dist >= 500) {
          doublePenalty += 0.0025 * durFactor;
        }
      }
    }
    mult += doublePenalty;
  }

  // Home pool edge (-0.16% at home in duals/playoffs; 0 at neutral Championship Final)
  if (context.isHome && !context.isNeutral) {
    mult -= 0.0016;
  }

  // Big-meet clutch factor in Playoffs & Championship Final
  if (context.isBigMeet) {
    const clutchMod = ((75 - sk.clutch) / 25) * 0.0025;
    mult += clutchMod;
  }

  // Minor lingering injury effect if swimming hurt (active swimmers with 0 weeksLeft)
  if (swimmer.injury && swimmer.injury.weeksLeft > 0) {
    mult += 0.025;
  }

  return mult;
}

// Deterministically project a swimmer's time today (used by UI lineup editor and CPU coach)
function projectSwimmerTime(swimmer, eventId, context = {}) {
  if (!swimmer.baseTimesCache) recomputeSwimmerBaseTimes(swimmer);
  const base = swimmer.baseTimesCache.ind[eventId] ?? swimmer.baseTimesCache.stroke50[eventId];
  if (!base) return 999.99;
  const mult = getConditioningMultiplier(swimmer, context);
  return roundHundredth(base * mult);
}

// Generate realistic 50-yard splits that sum to exact finalTime (to 0.01s)
function generateSplitsForSwim(rngState, swimmer, eventId, finalTime) {
  const ev = EVENT_MAP[eventId];
  const dist = ev ? ev.dist : 50;
  const num50s = Math.round(dist / 50);
  if (num50s <= 1) {
    return [roundHundredth(finalTime)];
  }

  const phys = swimmer.physiology;
  // Sprinter vs distance lean tweaks opening speed vs closing speed slightly
  const sprintLean = Math.max(-0.015, Math.min(0.015, (phys.dDist - phys.dSprint) * 0.12));

  let weights = [];
  if (eventId === "100FR") {
    // Reference: 41.5 -> 19.9 / 21.6 (0.47952 / 0.52048)
    weights = [0.4795 - sprintLean * 0.25, 0.5205 + sprintLean * 0.25];
  } else if (eventId === "100BK") {
    // Reference: 45.0 -> 21.8 / 23.2 (0.48444 / 0.51556)
    weights = [0.4844 - sprintLean * 0.20, 0.5156 + sprintLean * 0.20];
  } else if (eventId === "100BR") {
    // Reference: 51.5 -> 24.1 / 27.4 (0.46796 / 0.53204)
    weights = [0.4680 - sprintLean * 0.20, 0.5320 + sprintLean * 0.20];
  } else if (eventId === "100FL") {
    // Reference: 45.0 -> 20.9 / 24.1 (0.46444 / 0.53556)
    weights = [0.4644 - sprintLean * 0.22, 0.5356 + sprintLean * 0.22];
  } else if (eventId === "200FR") {
    // Reference: 1:32.0 (92.0s) -> 21.4 / 23.3 / 23.7 / 23.6
    weights = [
      0.2326 - sprintLean * 0.20,
      0.2533 - sprintLean * 0.05,
      0.2576 + sprintLean * 0.10,
      0.2565 + sprintLean * 0.15
    ];
  } else if (eventId === "200BK") {
    weights = [0.2360, 0.2535, 0.2560, 0.2545];
  } else if (eventId === "200BR") {
    weights = [0.2280, 0.2550, 0.2590, 0.2580];
  } else if (eventId === "200FL") {
    weights = [0.2270, 0.2530, 0.2585, 0.2615];
  } else if (eventId === "200IM") {
    // Reference: 1:41.0 (101.0s) -> 21.9 / 25.3 / 29.4 / 24.4
    // Modulate gently by swimmer's relative stroke handicaps (fly, back, breast, free)
    const sh = phys.strokeHandicap;
    const meanH = (sh.fly + sh.back + sh.breast + sh.free) / 4;
    weights = [
      0.21683 + Math.max(-0.004, Math.min(0.004, (sh.fly - meanH) * 0.08)),
      0.25050 + Math.max(-0.004, Math.min(0.004, (sh.back - meanH) * 0.08)),
      0.29109 + Math.max(-0.005, Math.min(0.005, (sh.breast - meanH) * 0.09)),
      0.24158 + Math.max(-0.004, Math.min(0.004, (sh.free - meanH) * 0.08))
    ];
  } else if (eventId === "400IM") {
    // 8 x 50s: 2 Fly, 2 Back, 2 Breast, 2 Free
    const sh = phys.strokeHandicap;
    const meanH = (sh.fly + sh.back + sh.breast + sh.free) / 4;
    const base8 = [0.1070, 0.1190, 0.1230, 0.1270, 0.1410, 0.1450, 0.1210, 0.1170];
    const st8 = ["fly", "fly", "back", "back", "breast", "breast", "free", "free"];
    weights = base8.map((w, idx) => w + Math.max(-0.003, Math.min(0.003, (sh[st8[idx]] - meanH) * 0.05)));
  } else if (eventId === "500FR") {
    // Reference: 4:12.0 (252.0s) -> 23.6 out (0.09365), holding 25.2 to 25.6 (0.1008), closing ~25.0 (0.0992)
    weights = [
      0.09365,
      0.10040, 0.10085, 0.10110, 0.10125, 0.10125, 0.10120, 0.10095, 0.10035,
      0.09900
    ];
  } else if (eventId === "1000FR") {
    // 20 x 50s: out in ~24.0 at 8:45 (0.0457), holding ~26.4 (0.0503), closing ~25.3 (0.0482)
    weights = new Array(20).fill(0.05032);
    weights[0] = 0.04570;
    weights[1] = 0.04990;
    weights[18] = 0.04980;
    weights[19] = 0.04820;
  } else if (eventId === "1650FR") {
    // Reference: 14:40 (880.0s), 33 x 50s -> 24.6 out (0.02795), holding 26.6 to 26.9 (0.03030..0.03055), closing under 26 (~25.5 = 0.02898)
    weights = new Array(33).fill(0.03042);
    weights[0] = 0.02795;
    weights[1] = 0.03018;
    weights[31] = 0.03005;
    weights[32] = 0.02898;
  } else {
    weights = new Array(num50s).fill(1 / num50s);
  }

  // Add tiny split-to-split micro-jitter from rngState so splits look organic (e.g. 26.68, 26.79, 26.71)
  for (let i = 0; i < weights.length; i++) {
    const jitter = (nextRandom(rngState) - 0.5) * 0.0014 * (1 / Math.sqrt(num50s));
    weights[i] = Math.max(0.01, weights[i] + jitter);
  }

  // Normalize weights and compute splits to exact hundredths
  const wSum = weights.reduce((a, b) => a + b, 0);
  const splits = [];
  let runningSum = 0;
  for (let i = 0; i < num50s - 1; i++) {
    const s = roundHundredth((weights[i] / wSum) * finalTime);
    splits.push(s);
    runningSum = roundHundredth(runningSum + s);
  }
  const lastSplit = roundHundredth(finalTime - runningSum);
  splits.push(lastSplit);
  return splits;
}

// Simulate an individual swim (returns { time, splits, powerPoints, isTapered })
function simulateIndividualSwim(rngState, swimmer, eventId, context = {}) {
  const projected = projectSwimmerTime(swimmer, eventId, context);
  const isTapered = swimmer.conditioning.taperStatus === "tapered";
  // Untapered dual meets have slightly more day-to-day variance than tapered championship swims
  const baseStd = isTapered ? 0.0046 : 0.0068;
  const stdFrac = baseStd - ((swimmer.skills.consistency - 50) / 50) * 0.0022;
  const noiseFrac = randClampedNormal(rngState, 0.0, stdFrac, isTapered ? -0.0100 : -0.0135, 0.0160);
  const ev = EVENT_MAP[eventId];
  const allTimeFloor = ev ? ((swimmer.gender === "M" ? ev.allTimeM : ev.allTimeF) * 0.9992) : 0;
  const finalTime = roundHundredth(Math.max(allTimeFloor, projected * (1.0 + noiseFrac)));
  const splits = generateSplitsForSwim(rngState, swimmer, eventId, finalTime);
  const powerPoints = calcPowerPoints(eventId, swimmer.gender, finalTime);

  return {
    swimmerId: swimmer.id,
    eventId,
    gender: swimmer.gender,
    time: finalTime,
    splits,
    powerPoints,
    isTapered
  };
}

// Simulate a 4-leg relay swim
// legsInput: array of 4 swimmer objects in leg order [leg1, leg2, leg3, leg4]
// Returns { time, dq, dqLeg, legResults: [{ swimmerId, legEventId, time, flatEquivalent, exchangeDelta, splits }], leadOffOfficial }
function simulateRelaySwim(rngState, relayEventId, gender, swimmers4, context = {}) {
  const ev = EVENT_MAP[relayEventId];
  const legResults = [];
  let totalTime = 0;
  let dq = false;
  let dqLeg = null;

  for (let i = 0; i < 4; i++) {
    const sw = swimmers4[i];
    const legEvId = ev.legs[i]; // e.g. '50BK', '50BR', '50FL', '50FR' or '100BK' etc.
    const swContext = {
      ...context,
      priorSwimsInMeet: context.priorSwimsBySwimmer ? (context.priorSwimsBySwimmer[sw.id] || []) : []
    };

    const flatProjected = projectSwimmerTime(sw, legEvId, swContext);
    const stdFrac = 0.0046 - ((sw.skills.consistency - 50) / 50) * 0.0024;
    const noiseFrac = randClampedNormal(rngState, 0.0, stdFrac, -0.010, 0.012);
    const flatTime = roundHundredth(flatProjected * (1.0 + noiseFrac));

    let legTime = flatTime;
    let exchangeGain = 0;

    if (i > 0) {
      // Flying start exchange!
      // Prompt requirement: flying legs 0.4 to 0.7 seconds faster than flat start;
      // early-takeoff disqualifications in roughly 0.5 to 1.5 percent of relays (~0.33% per flying exchange = ~1.0% per relay).
      const exSkill = sw.skills.relayExchange; // 50..99
      const meanGain = 0.46 + ((exSkill - 50) / 50) * 0.16; // 0.46s to 0.62s
      exchangeGain = roundHundredth(randClampedNormal(rngState, meanGain, 0.045, 0.40, 0.70));
      legTime = roundHundredth(flatTime - exchangeGain);

      // Early takeoff DQ check (~0.0033 per leg -> ~0.99% of 4-leg relays)
      const dqProb = 0.0036 - ((exSkill - 75) / 100) * 0.0008;
      if (!dq && nextRandom(rngState) < dqProb) {
        dq = true;
        dqLeg = i + 1;
      }
    }

    const legSplits = generateSplitsForSwim(rngState, sw, legEvId, legTime);
    if (! i && legSplits.length === 1) {
      legSplits[0] = legTime;
    }

    legResults.push({
      legIndex: i + 1,
      swimmerId: sw.id,
      swimmerName: sw.name,
      gender: sw.gender,
      legEventId: legEvId,
      isFlatStart: i === 0,
      time: legTime,
      flatTime,
      exchangeGain,
      splits: legSplits
    });
    totalTime = roundHundredth(totalTime + legTime);
  }

  // Relay lead-off leg is a flat start and counts as an official time for personal bests and records
  // Note: for 200MR and 200XMR, the lead-off is 50 Back (not one of the 14 standalone individual events, though tracked on swimmer's 50BK);
  // for 200FRR/200XFR (50FR), 400FRR (100FR), 800FRR (200FR), 400MR (100BK), it's a standard individual event!
  const leadOffOfficial = ev.leadOffEvent ? {
    swimmerId: swimmers4[0].id,
    gender: swimmers4[0].gender,
    eventId: ev.leadOffEvent,
    time: legResults[0].time,
    splits: legResults[0].splits,
    powerPoints: calcPowerPoints(ev.leadOffEvent, swimmers4[0].gender, legResults[0].time),
    isTapered: swimmers4[0].conditioning.taperStatus === "tapered"
  } : null;

  return {
    relayEventId,
    gender,
    time: totalTime,
    dq,
    dqLeg,
    powerPoints: dq ? 0 : calcPowerPoints(relayEventId, gender, totalTime),
    legResults,
    leadOffOfficial
  };
}

// Seed lanes the way real meets do:
// - In duals (6 lanes): teams alternate lanes, home team in even lanes (2, 4, 6), away in odd (1, 3, 5), fastest entry toward middle (4 & 3, then 2 & 5, then 6 & 1).
// - In Championship Final (8 lanes): seed by entry time 4-5-3-6-2-7-1-8.
function assignMeetLanes(entries, isChampionshipFinal, homeTeamId) {
  if (isChampionshipFinal) {
    const laneOrder8 = [4, 5, 3, 6, 2, 7, 1, 8];
    const sorted = [...entries].sort((a, b) => a.seedTime - b.seedTime);
    sorted.forEach((en, idx) => {
      en.lane = laneOrder8[idx] || (idx + 1);
    });
    return sorted;
  } else {
    const homeEntries = entries.filter(e => e.teamId === homeTeamId).sort((a, b) => a.seedTime - b.seedTime);
    const awayEntries = entries.filter(e => e.teamId !== homeTeamId).sort((a, b) => a.seedTime - b.seedTime);
    const homeLanes = [4, 2, 6];
    const awayLanes = [3, 5, 1];
    homeEntries.forEach((en, idx) => { en.lane = homeLanes[idx] || (6 + idx); });
    awayEntries.forEach((en, idx) => { en.lane = awayLanes[idx] || (1 + idx); });
    return [...homeEntries, ...awayEntries].sort((a, b) => a.lane - b.lane);
  }
}

// Score race finishers with exact tie-splitting rules
// Dual individual: [9, 4, 3, 2, 1, 0]
// Dual relay: [11, 4, 2, 0]
// Final individual: [9, 7, 6, 5, 4, 3, 2, 1]
// Final relay: [18, 14, 12, 10]
function scoreRaceResults(results, pointsTable) {
  const valid = results.filter(r => !r.dq).sort((a, b) => a.time - b.time);
  const dqs = results.filter(r => r.dq);

  let i = 0;
  while (i < valid.length) {
    let j = i;
    while (j + 1 < valid.length && Math.abs(valid[j + 1].time - valid[i].time) < 0.001) {
      j++;
    }
    // Tied group from index i to j (inclusive) shares points for places i..j
    let sumPts = 0;
    for (let k = i; k <= j; k++) {
      sumPts += (pointsTable[k] ?? 0);
    }
    const splitPts = Math.round((sumPts / (j - i + 1)) * 100) / 100;
    for (let k = i; k <= j; k++) {
      valid[k].place = i + 1;
      valid[k].tied = j > i;
      valid[k].points = splitPts;
    }
    i = j + 1;
  }

  for (const r of dqs) {
    r.place = null;
    r.tied = false;
    r.points = 0;
  }
  return [...valid, ...dqs];
}

if (typeof module !== "undefined" && module.exports) {
  Object.assign(module.exports, {
    FIRST_NAMES_F, FIRST_NAMES_M, LAST_NAMES, ARCHETYPES, ARCHETYPE_INFO,
    drawTalentBaseMultiplier, initialAgeCurveOffset, createSwimmer, evalDistanceCurve,
    recomputeSwimmerBaseTimes, estimateContractSalary, getConditioningMultiplier,
    projectSwimmerTime, generateSplitsForSwim, simulateIndividualSwim, simulateRelaySwim,
    assignMeetLanes, scoreRaceResults
  });
}

// ============================================================================
// SECTION 5: LINEUP GENERATION, PROJECTION, & MEET SIMULATION
// ============================================================================

// Build a legal, intelligent lineup for a team in a Dual Meet or Championship Final
// Rules:
// - Dual Meet: up to 3 swimmers per individual event, up to 2 relays (A & B) per relay event.
//   At least 2 healthy entries per individual event and 1 legal relay per relay event.
//   Max 3 individual events and max 4 total events per swimmer.
// - Championship Final: 2 swimmers per individual event, 1 relay (A) per relay event.
//   Max 3 individual events and max 7 total events per swimmer across the 3 days.
function generateTeamLineup(team, swimmersById, program, isChampionshipFinal, options = {}) {
  if (!Array.isArray(program) && typeof program === "object" && program !== null) {
    options = program;
    isChampionshipFinal = Boolean(options.isChampionshipFinal);
    program = isChampionshipFinal
      ? getChampionshipFinalProgram()
      : getDualMeetProgram(options.week || 1, options.cardType || "standard");
  }
  const healthyF = team.roster
    .map(id => swimmersById[id])
    .filter(s => s && s.gender === "F" && !s.onInjuredList);
  const healthyM = team.roster
    .map(id => swimmersById[id])
    .filter(s => s && s.gender === "M" && !s.onInjuredList);

  const maxIndPerSwimmer = 3;
  const maxTotalPerSwimmer = isChampionshipFinal ? 7 : 4;
  const maxEntriesPerInd = isChampionshipFinal ? 2 : 3;

  const indCount = {};
  const totalCount = {};
  const slotsSwum = {}; // swimmerId -> array of { slot, day, dist }
  for (const s of [...healthyF, ...healthyM]) {
    indCount[s.id] = 0;
    totalCount[s.id] = 0;
    slotsSwum[s.id] = [];
  }

  const lineup = {
    individual: {}, // key: `${slot}_${eventId}_${gender}` -> [swimmerId, ...]
    relays: {}      // key: `${slot}_${eventId}_${gender}` -> [{ label: 'A', legs: [id1,id2,id3,id4] }, ...]
  };

  // Helper to evaluate a swimmer's expected time in an event considering slots already assigned
  const evalSwimmerForSlot = (sw, evId, slotObj) => {
    const prior = slotsSwum[sw.id] || [];
    // Check if back-to-back on same day
    let backToBackPenalty = 0;
    for (const p of prior) {
      if (p.day === slotObj.day) {
        const gap = Math.abs(slotObj.slot - p.slot);
        if (gap <= 2) backToBackPenalty += 0.012;
        else if (gap <= 4) backToBackPenalty += 0.005;
      }
    }
    const baseT = projectSwimmerTime(sw, evId, {
      isHome: options.isHome,
      isNeutral: isChampionshipFinal,
      isBigMeet: isChampionshipFinal || options.isPlayoff
    });
    return baseT * (1 + backToBackPenalty);
  };

  // Step 1: Reserve A-Relays FIRST so every relay is guaranteed a fast, legal 4-swimmer squad
  // and relay hammers are locked into A-relays
  const relaySlots = program.filter(p => EVENT_MAP[p.eventId].isRelay);
  for (const rSlot of relaySlots) {
    const rev = EVENT_MAP[rSlot.eventId];
    const key = `${rSlot.slot}_${rSlot.eventId}_${rSlot.gender}`;
    lineup.relays[key] = [];

    if (rev.mixed) {
      // Mixed relay: 2 F and 2 M in optimal coaching order
      const orders = [
        ["M", "M", "F", "F"],
        ["M", "F", "M", "F"],
        ["F", "M", "M", "F"],
        ["F", "F", "M", "M"],
        ["M", "F", "F", "M"],
        ["F", "M", "F", "M"]
      ];
      let bestLegs = null;
      let bestSum = 1e9;
      for (const ord of orders) {
        const used = new Set();
        const candidate = [];
        let sum = 0;
        for (let li = 0; li < 4; li++) {
          const legEv = rev.legs[li];
          const pool = (ord[li] === "F" ? healthyF : healthyM).filter(
            s => !used.has(s.id) && totalCount[s.id] < maxTotalPerSwimmer
          );
          if (pool.length === 0) { candidate.length = 0; break; }
          let bestSw = pool[0], bestT = 1e9;
          for (const sw of pool) {
            const t = evalSwimmerForSlot(sw, legEv, rSlot) - (li > 0 ? 0.52 : 0);
            if (t < bestT) { bestT = t; bestSw = sw; }
          }
          used.add(bestSw.id);
          candidate.push(bestSw.id);
          sum += bestT;
        }
        if (candidate.length === 4 && sum < bestSum) {
          bestSum = sum;
          bestLegs = candidate;
        }
      }
      if (bestLegs) {
        lineup.relays[key].push({ label: "A", legs: bestLegs });
        for (const sid of bestLegs) {
          totalCount[sid]++;
          slotsSwum[sid].push({ slot: rSlot.slot, day: rSlot.day, dist: 50 });
        }
      }
    } else {
      const pool = rSlot.gender === "F" ? healthyF : healthyM;
      const used = new Set();
      const legsA = [];
      for (let li = 0; li < 4; li++) {
        const legEv = rev.legs[li];
        const avail = pool.filter(s => !used.has(s.id) && totalCount[s.id] < maxTotalPerSwimmer);
        let bestSw = avail[0], bestT = 1e9;
        for (const sw of avail) {
          const t = evalSwimmerForSlot(sw, legEv, rSlot);
          if (t < bestT) { bestT = t; bestSw = sw; }
        }
        if (bestSw) {
          used.add(bestSw.id);
          legsA.push(bestSw.id);
        }
      }
      if (legsA.length === 4) {
        lineup.relays[key].push({ label: "A", legs: legsA });
        const legDist = Math.round(rev.dist / 4);
        for (const sid of legsA) {
          totalCount[sid]++;
          slotsSwum[sid].push({ slot: rSlot.slot, day: rSlot.day, dist: legDist });
        }
      }
    }
  }

  // Step 2: Fill Primary & Secondary Individual Entries (2 per event guaranteed!)
  // Check if an event is the swimmer's signature archetype event so stars always swim their true events
  const isSignatureEvent = (sw, evId) => {
    const a = sw.archetype;
    if (a === "SPRINTER") return evId === "50FR" || evId === "100FR";
    if (a === "MID_FREE") return evId === "200FR";
    if (a === "DIST_FREE") return evId === "1650FR" || evId === "1000FR" || evId === "500FR";
    if (a === "BACKSTROKER") return evId === "100BK" || evId === "200BK";
    if (a === "BREASTSTROKER") return evId === "100BR" || evId === "200BR";
    if (a === "FLYER") return evId === "100FL" || evId === "200FL";
    if (a === "IMER") return evId === "200IM" || evId === "400IM";
    return false;
  };

  const indSlots = program.filter(p => !EVENT_MAP[p.eventId].isRelay);
  const priorityOrder = {
    "1650FR": 1, "1000FR": 1, "400IM": 2, "200IM": 2, "50FR": 3, "100FR": 4,
    "100BR": 5, "200BR": 6, "100FL": 7, "200FL": 8, "100BK": 9, "200BK": 10,
    "200FR": 11, "500FR": 12
  };
  const sortedIndSlots = [...indSlots].sort(
    (a, b) => (priorityOrder[a.eventId] || 20) - (priorityOrder[b.eventId] || 20)
  );

  for (const iSlot of sortedIndSlots) {
    const key = `${iSlot.slot}_${iSlot.eventId}_${iSlot.gender}`;
    lineup.individual[key] = [];
  }

  // Pass 2A: Assign #1 and #2 entries in every individual event (prioritizing signature specialists)
  for (let entryRank = 0; entryRank < 2; entryRank++) {
    for (const iSlot of sortedIndSlots) {
      const key = `${iSlot.slot}_${iSlot.eventId}_${iSlot.gender}`;
      const currentAssigned = lineup.individual[key];
      const pool = (iSlot.gender === "F" ? healthyF : healthyM).filter(
        s => !currentAssigned.includes(s.id) &&
             indCount[s.id] < maxIndPerSwimmer &&
             totalCount[s.id] < maxTotalPerSwimmer
      );
      const bench = getBenchmark(iSlot.eventId, iSlot.gender);
      let bestSw = null;
      let bestRatio = 1e9;
      for (const sw of pool) {
        const projT = evalSwimmerForSlot(sw, iSlot.eventId, iSlot);
        const sigBonus = isSignatureEvent(sw, iSlot.eventId) ? -0.022 : 0.0;
        const loadBias = indCount[sw.id] * 0.0025;
        const ratio = (projT / bench) + sigBonus + loadBias;
        if (ratio < bestRatio) {
          bestRatio = ratio;
          bestSw = sw;
        }
      }
      if (bestSw) {
        currentAssigned.push(bestSw.id);
        indCount[bestSw.id]++;
        totalCount[bestSw.id]++;
        slotsSwum[bestSw.id].push({
          slot: iSlot.slot,
          day: iSlot.day,
          dist: EVENT_MAP[iSlot.eventId].dist
        });
      }
    }
  }

  // Step 3 (Dual Meets only): Assign #3 individual entries and B-Relays strategically
  // Recall: 14 swimmers * 4 events = 56 swims total, so coaches fill ~85-90% of 3rd entries & B relays,
  // prioritizing events where the #3 swimmer is competitive and avoiding brutal doubles on stars.
  if (!isChampionshipFinal && maxEntriesPerInd === 3) {
    // First add B relays where 4 swimmers have open event slots without overloading stars
    for (const rSlot of relaySlots) {
      const rev = EVENT_MAP[rSlot.eventId];
      const key = `${rSlot.slot}_${rSlot.eventId}_${rSlot.gender}`;
      const existingA = lineup.relays[key][0]?.legs || [];

      if (rev.mixed) {
        const availF = healthyF.filter(s => !existingA.includes(s.id) && totalCount[s.id] < maxTotalPerSwimmer);
        const availM = healthyM.filter(s => !existingA.includes(s.id) && totalCount[s.id] < maxTotalPerSwimmer);
        if (availF.length >= 2 && availM.length >= 2) {
          const bLegs = [availM[0].id, availF[0].id, availM[1].id, availF[1].id];
          lineup.relays[key].push({ label: "B", legs: bLegs });
          for (const sid of bLegs) {
            totalCount[sid]++;
            slotsSwum[sid].push({ slot: rSlot.slot, day: rSlot.day, dist: 50 });
          }
        }
      } else {
        const pool = (rSlot.gender === "F" ? healthyF : healthyM).filter(
          s => !existingA.includes(s.id) && totalCount[s.id] < maxTotalPerSwimmer
        );
        if (pool.length >= 4) {
          const used = new Set();
          const legsB = [];
          for (let li = 0; li < 4; li++) {
            const legEv = rev.legs[li];
            let bestSw = null, bestT = 1e9;
            for (const sw of pool) {
              if (used.has(sw.id)) continue;
              // Prefer swimmers with fewer total events so we save 3rd individual slots
              const t = evalSwimmerForSlot(sw, legEv, rSlot) + totalCount[sw.id] * 0.25;
              if (t < bestT) { bestT = t; bestSw = sw; }
            }
            if (bestSw) {
              used.add(bestSw.id);
              legsB.push(bestSw.id);
            }
          }
          if (legsB.length === 4) {
            lineup.relays[key].push({ label: "B", legs: legsB });
            const legDist = Math.round(rev.dist / 4);
            for (const sid of legsB) {
              totalCount[sid]++;
              slotsSwum[sid].push({ slot: rSlot.slot, day: rSlot.day, dist: legDist });
            }
          }
        }
      }
    }

    // Fill 3rd individual entries with remaining eligible swimmers
    const thirdEntryPriority = {
      "1650FR": 1, "1000FR": 1, "400IM": 2, "50FR": 3, "500FR": 4, "100BK": 5, "100BR": 6, "100FL": 7,
      "200IM": 8, "100FR": 9, "200FR": 10, "200BK": 11, "200BR": 12, "200FL": 13
    };
    const thirdIndSlots = [...indSlots].sort(
      (a, b) => (thirdEntryPriority[a.eventId] || 20) - (thirdEntryPriority[b.eventId] || 20)
    );
    for (const iSlot of thirdIndSlots) {
      const key = `${iSlot.slot}_${iSlot.eventId}_${iSlot.gender}`;
      const currentAssigned = lineup.individual[key];
      const pool = (iSlot.gender === "F" ? healthyF : healthyM).filter(
        s => !currentAssigned.includes(s.id) &&
             indCount[s.id] < maxIndPerSwimmer &&
             totalCount[s.id] < maxTotalPerSwimmer
      );
      if (pool.length > 0) {
        const bench = getBenchmark(iSlot.eventId, iSlot.gender);
        let bestSw = null, bestRatio = 1e9;
        for (const sw of pool) {
          const projT = evalSwimmerForSlot(sw, iSlot.eventId, iSlot);
          const ratio = projT / bench;
          if (ratio < bestRatio) {
            bestRatio = ratio;
            bestSw = sw;
          }
        }
        // Enter 3rd swimmer if they aren't exhausted
        if (bestSw && bestRatio < 1.12) {
          currentAssigned.push(bestSw.id);
          indCount[bestSw.id]++;
          totalCount[bestSw.id]++;
          slotsSwum[bestSw.id].push({
            slot: iSlot.slot,
            day: iSlot.day,
            dist: EVENT_MAP[iSlot.eventId].dist
          });
        }
      }
    }
  }

  return lineup;
}

// Validate a team lineup against all league rules
function validateTeamLineup(team, lineup, swimmersById, program, isChampionshipFinal) {
  if (lineup && !lineup.individual && swimmersById && swimmersById.individual) {
    const tmp = lineup;
    lineup = swimmersById;
    swimmersById = tmp;
  }
  if (!Array.isArray(program) && typeof program === "object" && program !== null) {
    const opts = program;
    isChampionshipFinal = Boolean(opts.isChampionshipFinal);
    program = isChampionshipFinal
      ? getChampionshipFinalProgram()
      : getDualMeetProgram(opts.week || 1, opts.cardType || "standard");
  }
  const maxInd = 3;
  const maxTotal = isChampionshipFinal ? 7 : 4;
  const maxEntriesInd = isChampionshipFinal ? 2 : 3;
  const indCounts = {};
  const totalCounts = {};
  const errors = [];

  for (const p of program) {
    const key = `${p.slot}_${p.eventId}_${p.gender}`;
    const ev = EVENT_MAP[p.eventId];
    if (ev.isRelay) {
      const relays = lineup.relays[key] || [];
      if (relays.length < 1) {
        errors.push(`Missing A relay in ${ev.name} (${p.gender})`);
      }
      if (relays.length > (isChampionshipFinal ? 1 : 2)) {
        errors.push(`Too many relays in ${ev.name}`);
      }
      for (const r of relays) {
        if (!r.legs || r.legs.length !== 4 || new Set(r.legs).size !== 4) {
          errors.push(`Invalid relay legs in ${ev.name} ${r.label}`);
        }
        if (ev.mixed) {
          let fCount = 0, mCount = 0;
          for (const sid of r.legs) {
            const sw = swimmersById[sid];
            if (sw?.gender === "F") fCount++;
            if (sw?.gender === "M") mCount++;
          }
          if (fCount !== 2 || mCount !== 2) {
            errors.push(`Mixed relay ${ev.name} ${r.label} must have 2 women and 2 men`);
          }
        }
        for (const sid of (r.legs || [])) {
          totalCounts[sid] = (totalCounts[sid] || 0) + 1;
        }
      }
    } else {
      const entries = lineup.individual[key] || [];
      if (entries.length < 2) {
        errors.push(`Fewer than 2 entries in ${ev.name} (${p.gender})`);
      }
      if (entries.length > maxEntriesInd) {
        errors.push(`Too many entries in ${ev.name} (${p.gender})`);
      }
      if (new Set(entries).size !== entries.length) {
        errors.push(`Duplicate swimmer in ${ev.name} (${p.gender})`);
      }
      for (const sid of entries) {
        indCounts[sid] = (indCounts[sid] || 0) + 1;
        totalCounts[sid] = (totalCounts[sid] || 0) + 1;
      }
    }
  }

  for (const [sid, cnt] of Object.entries(indCounts)) {
    if (cnt > maxInd) {
      errors.push(`${swimmersById[sid]?.name || sid} exceeds individual event limit (${cnt}/${maxInd})`);
    }
  }
  for (const [sid, cnt] of Object.entries(totalCounts)) {
    if (cnt > maxTotal) {
      errors.push(`${swimmersById[sid]?.name || sid} exceeds total event limit (${cnt}/${maxTotal})`);
    }
  }

  return { valid: errors.length === 0, errors, indCounts, totalCounts };
}

// Smooth expected-value race scoring for projections so 0.05s gaps don't produce artificial 5-point step cliffs
function scoreProjectedRaceResults(entries, pointsTable) {
  const valid = entries.filter(r => !r.dq).sort((a, b) => a.time - b.time);
  for (let i = 0; i < valid.length; i++) {
    valid[i].place = i + 1;
    valid[i].points = pointsTable[i] ?? 0;
  }
  // Smooth expected points between close competitors across teams
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 0; i < valid.length; i++) {
      for (let j = i + 1; j < valid.length; j++) {
        if (valid[i].teamId === valid[j].teamId) continue;
        const meanT = (valid[i].time + valid[j].time) * 0.5;
        const gap = Math.max(0, valid[j].time - valid[i].time);
        const sigma = meanT * 0.0155;
        const pSwap = 0.48 * Math.exp(-gap / sigma);
        const diff = (valid[i].points - valid[j].points) * pSwap * 0.48;
        valid[i].points -= diff;
        valid[j].points += diff;
      }
    }
  }
  for (const v of valid) {
    v.points = roundHundredth(v.points);
  }
  return valid;
}

// Deterministically project the dual meet score between two lineups (used for UI live projection & pre-meet favorite check)
// If useSeasonBestsOnly is true, uses swimmer seasonBest (or untapered base time if Week 1) for blind favorite calculation.
function projectDualMeetScore(homeTeam, awayTeam, homeLineup, awayLineup, swimmersById, program, useSeasonBestsOnly = false) {
  if (typeof awayLineup === "number") {
    const swMap = homeLineup;
    const wk = awayLineup;
    const cType = swimmersById || "standard";
    const hL = program;
    const aL = useSeasonBestsOnly;
    swimmersById = swMap;
    program = getDualMeetProgram(wk, cType);
    homeLineup = hL;
    awayLineup = aL;
    useSeasonBestsOnly = false;
  }
  let homePts = 0;
  let awayPts = 0;
  const priorBySwimmer = {};
  const eventProjections = [];

  const getExpectedIndTime = (sw, evId, isHome, slotObj) => {
    if (useSeasonBestsOnly && sw.seasonBests && sw.seasonBests[evId]) {
      return sw.seasonBests[evId].time;
    }
    return projectSwimmerTime(sw, evId, {
      isHome: false,
      currentSlot: slotObj.slot,
      currentDay: slotObj.day,
      priorSwimsInMeet: priorBySwimmer[sw.id] || []
    });
  };

  for (const p of program) {
    const key = `${p.slot}_${p.eventId}_${p.gender}`;
    const ev = EVENT_MAP[p.eventId];

    if (ev.isRelay) {
      const hRelays = homeLineup.relays[key] || [];
      const aRelays = awayLineup.relays[key] || [];
      const entries = [];

      for (const [tmId, rList, isHome] of [[homeTeam.id, hRelays, true], [awayTeam.id, aRelays, false]]) {
        for (const r of rList) {
          let sum = 0;
          for (let li = 0; li < 4; li++) {
            const sw = swimmersById[r.legs[li]];
            if (!sw) { sum += 99; continue; }
            const legEv = ev.legs[li];
            const flatT = useSeasonBestsOnly
              ? (sw.seasonBests?.[legEv]?.time ?? projectSwimmerTime(sw, legEv, { isHome: false, isNeutral: true }))
              : projectSwimmerTime(sw, legEv, {
                  isHome,
                  currentSlot: p.slot,
                  currentDay: p.day,
                  priorSwimsInMeet: priorBySwimmer[sw.id] || []
                });
            const ex = li > 0 ? (0.46 + ((sw.skills.relayExchange - 50) / 50) * 0.16) : 0;
            sum += (flatT - ex);
          }
          entries.push({ teamId: tmId, label: r.label, legs: r.legs, time: roundHundredth(sum), dq: false });
          const legDist = Math.round(ev.dist / 4);
          for (const sid of r.legs) {
            if (!priorBySwimmer[sid]) priorBySwimmer[sid] = [];
            priorBySwimmer[sid].push({ slot: p.slot, day: p.day, dist: legDist });
          }
        }
      }

      const scored = scoreProjectedRaceResults(entries, [11, 4, 2, 0]);
      let hEvPts = 0, aEvPts = 0;
      for (const sc of scored) {
        if (sc.teamId === homeTeam.id) hEvPts += sc.points;
        else aEvPts += sc.points;
      }
      homePts = roundHundredth(homePts + hEvPts);
      awayPts = roundHundredth(awayPts + aEvPts);
      eventProjections.push({ slot: p.slot, eventId: p.eventId, gender: p.gender, results: scored, homePts: roundHundredth(hEvPts), awayPts: roundHundredth(aEvPts) });
    } else {
      const hIds = homeLineup.individual[key] || [];
      const aIds = awayLineup.individual[key] || [];
      const entries = [];

      for (const sid of hIds) {
        const sw = swimmersById[sid];
        if (!sw) continue;
        const t = getExpectedIndTime(sw, p.eventId, true, p);
        entries.push({ swimmerId: sid, swimmerName: sw.name, teamId: homeTeam.id, time: t, dq: false });
        if (!priorBySwimmer[sid]) priorBySwimmer[sid] = [];
        priorBySwimmer[sid].push({ slot: p.slot, day: p.day, dist: ev.dist });
      }
      for (const sid of aIds) {
        const sw = swimmersById[sid];
        if (!sw) continue;
        const t = getExpectedIndTime(sw, p.eventId, false, p);
        entries.push({ swimmerId: sid, swimmerName: sw.name, teamId: awayTeam.id, time: t, dq: false });
        if (!priorBySwimmer[sid]) priorBySwimmer[sid] = [];
        priorBySwimmer[sid].push({ slot: p.slot, day: p.day, dist: ev.dist });
      }

      const scored = scoreProjectedRaceResults(entries, [9, 4, 3, 2, 1, 0]);
      let hEvPts = 0, aEvPts = 0;
      for (const sc of scored) {
        if (sc.teamId === homeTeam.id) hEvPts += sc.points;
        else aEvPts += sc.points;
      }
      homePts = roundHundredth(homePts + hEvPts);
      awayPts = roundHundredth(awayPts + aEvPts);
      eventProjections.push({ slot: p.slot, eventId: p.eventId, gender: p.gender, results: scored, homePts: roundHundredth(hEvPts), awayPts: roundHundredth(aEvPts) });
    }
  }

  return { homeProjected: roundHundredth(homePts), awayProjected: roundHundredth(awayPts), margin: roundHundredth(homePts - awayPts), eventProjections };
}

// Simulate an entire Dual Meet or 4-Team Championship Final in full before any animation
// Updates records, PBs, and seasonBests deterministically
function simulateFullMeet(leagueState, meetConfig) {
  const rng = leagueState.rngState;
  const swimmersById = leagueState.swimmers;
  const isFinal = Boolean(meetConfig.isChampionshipFinal);
  const isPlayoff = Boolean(meetConfig.isPlayoff);
  const program = isFinal
    ? getChampionshipFinalProgram()
    : getDualMeetProgram(meetConfig.week, meetConfig.cardType);

  const teamIds = isFinal ? meetConfig.teamIds : [meetConfig.homeTeamId, meetConfig.awayTeamId];
  const lineupsByTeam = {};
  for (const tid of teamIds) {
    const tm = leagueState.teams[tid];
    if (meetConfig.customLineups && meetConfig.customLineups[tid]) {
      lineupsByTeam[tid] = meetConfig.customLineups[tid];
    } else {
      lineupsByTeam[tid] = generateTeamLineup(tm, swimmersById, program, isFinal, {
        isHome: !isFinal && tid === meetConfig.homeTeamId,
        isPlayoff
      });
    }
  }

  // Compute pre-meet projected scores for dual meets (used for Favorite & Close-Meet stats)
  let preMeetProjection = null;
  if (!isFinal) {
    const hTeam = leagueState.teams[meetConfig.homeTeamId];
    const aTeam = leagueState.teams[meetConfig.awayTeamId];
    preMeetProjection = projectDualMeetScore(
      hTeam,
      aTeam,
      lineupsByTeam[hTeam.id],
      lineupsByTeam[aTeam.id],
      swimmersById,
      program,
      false
    );
  }

  const teamScores = {};
  for (const tid of teamIds) teamScores[tid] = 0;

  const priorSwimsBySwimmer = {};
  const eventResults = [];
  const individualPtsTable = isFinal ? [9, 7, 6, 5, 4, 3, 2, 1] : [9, 4, 3, 2, 1, 0];
  const relayPtsTable = isFinal ? [18, 14, 12, 10] : [11, 4, 2, 0];

  let openEnteringLastRelay = false;

  for (let pIdx = 0; pIdx < program.length; pIdx++) {
    const p = program[pIdx];
    const key = `${p.slot}_${p.eventId}_${p.gender}`;
    const ev = EVENT_MAP[p.eventId];

    // Check if dual meet is mathematically open entering the very last relay (slot 29)
    if (!isFinal && pIdx === program.length - 1) {
      const hScore = teamScores[meetConfig.homeTeamId];
      const aScore = teamScores[meetConfig.awayTeamId];
      // In the final relay (11-4-2 = 17 pts), max non-DQ swing is 15-2 = 13 pts (or 17-0 with a DQ)
      if (Math.abs(hScore - aScore) <= 13) {
        openEnteringLastRelay = true;
      }
    }

    if (ev.isRelay) {
      const rawEntries = [];
      for (const tid of teamIds) {
        const rList = lineupsByTeam[tid].relays[key] || [];
        for (const r of rList) {
          const sw4 = r.legs.map(id => swimmersById[id]);
          const seedSum = sw4.reduce((acc, sw, li) => acc + projectSwimmerTime(sw, ev.legs[li]) - (li > 0 ? 0.52 : 0), 0);
          rawEntries.push({
            teamId: tid,
            teamAbbr: leagueState.teams[tid].abbr,
            label: r.label,
            legs: r.legs,
            swimmers4: sw4,
            seedTime: roundHundredth(seedSum)
          });
        }
      }

      const seeded = assignMeetLanes(rawEntries, isFinal, meetConfig.homeTeamId);
      const simResults = [];

      for (const en of seeded) {
        const isHome = !isFinal && en.teamId === meetConfig.homeTeamId;
        const rSim = simulateRelaySwim(rng, p.eventId, p.gender, en.swimmers4, {
          isHome,
          isNeutral: isFinal,
          isBigMeet: isFinal || isPlayoff,
          currentSlot: p.slot,
          currentDay: p.day,
          priorSwimsBySwimmer
        });

        const flags = [];
        // Record lead-off flat-start official time if applicable (400MR -> 100BK, 200FRR/200XFR -> 50FR, 400FRR -> 100FR, 800FRR -> 200FR)
        if (rSim.leadOffOfficial) {
          const lo = rSim.leadOffOfficial;
          const loSwimmer = swimmersById[lo.swimmerId];
          const loFlags = recordOfficialSwim(leagueState, {
            swimmer: loSwimmer,
            teamId: en.teamId,
            eventId: lo.eventId,
            gender: lo.gender,
            time: lo.time,
            splits: lo.splits,
            powerPoints: lo.powerPoints,
            isTapered: lo.isTapered,
            week: meetConfig.week,
            meetId: meetConfig.id,
            meetName: meetConfig.name,
            isRelayLeadOff: true
          });
          rSim.legResults[0].flags = loFlags;
        }

        // Check team & league relay records if not DQ
        if (!rSim.dq) {
          const rFlags = recordRelaySwim(leagueState, {
            teamId: en.teamId,
            eventId: p.eventId,
            gender: p.gender,
            time: rSim.time,
            legResults: rSim.legResults,
            legs: en.legs,
            powerPoints: rSim.powerPoints,
            week: meetConfig.week,
            meetId: meetConfig.id,
            meetName: meetConfig.name
          });
          flags.push(...rFlags);
        }

        const legDist = Math.round(ev.dist / 4);
        for (const sid of en.legs) {
          if (!priorSwimsBySwimmer[sid]) priorSwimsBySwimmer[sid] = [];
          priorSwimsBySwimmer[sid].push({ slot: p.slot, day: p.day, dist: legDist });
        }

        simResults.push({
          lane: en.lane,
          teamId: en.teamId,
          teamAbbr: en.teamAbbr,
          label: en.label,
          legs: en.legs,
          legResults: rSim.legResults,
          time: rSim.time,
          dq: rSim.dq,
          dqLeg: rSim.dqLeg,
          powerPoints: rSim.powerPoints,
          flags
        });
      }

      const scored = scoreRaceResults(simResults, relayPtsTable);
      const ptsByTeam = {};
      for (const tid of teamIds) ptsByTeam[tid] = 0;
      for (const sc of scored) {
        teamScores[sc.teamId] = roundHundredth(teamScores[sc.teamId] + sc.points);
        ptsByTeam[sc.teamId] = roundHundredth(ptsByTeam[sc.teamId] + sc.points);
      }

      eventResults.push({
        slot: p.slot,
        day: p.day,
        eventId: p.eventId,
        eventName: ev.name,
        gender: p.gender,
        isRelay: true,
        results: scored,
        ptsByTeam,
        runningScores: { ...teamScores }
      });
    } else {
      // Individual event
      const rawEntries = [];
      for (const tid of teamIds) {
        const sIds = lineupsByTeam[tid].individual[key] || [];
        for (const sid of sIds) {
          const sw = swimmersById[sid];
          if (!sw) continue;
          const seedT = sw.seasonBests[p.eventId]?.time ?? projectSwimmerTime(sw, p.eventId);
          rawEntries.push({
            swimmerId: sid,
            swimmer: sw,
            teamId: tid,
            teamAbbr: leagueState.teams[tid].abbr,
            seedTime: seedT
          });
        }
      }

      const seeded = assignMeetLanes(rawEntries, isFinal, meetConfig.homeTeamId);
      const simResults = [];

      for (const en of seeded) {
        const sw = en.swimmer;
        const isHome = !isFinal && en.teamId === meetConfig.homeTeamId;
        const iSim = simulateIndividualSwim(rng, sw, p.eventId, {
          isHome,
          isNeutral: isFinal,
          isBigMeet: isFinal || isPlayoff,
          currentSlot: p.slot,
          currentDay: p.day,
          priorSwimsInMeet: priorSwimsBySwimmer[sw.id] || []
        });

        const flags = recordOfficialSwim(leagueState, {
          swimmer: sw,
          teamId: en.teamId,
          eventId: p.eventId,
          gender: p.gender,
          time: iSim.time,
          splits: iSim.splits,
          powerPoints: iSim.powerPoints,
          isTapered: iSim.isTapered,
          week: meetConfig.week,
          meetId: meetConfig.id,
          meetName: meetConfig.name,
          isRelayLeadOff: false
        });

        if (!priorSwimsBySwimmer[sw.id]) priorSwimsBySwimmer[sw.id] = [];
        priorSwimsBySwimmer[sw.id].push({ slot: p.slot, day: p.day, dist: ev.dist });

        simResults.push({
          lane: en.lane,
          swimmerId: sw.id,
          swimmerName: sw.name,
          teamId: en.teamId,
          teamAbbr: en.teamAbbr,
          time: iSim.time,
          splits: iSim.splits,
          powerPoints: iSim.powerPoints,
          isTapered: iSim.isTapered,
          dq: false,
          flags
        });
      }

      const scored = scoreRaceResults(simResults, individualPtsTable);
      const ptsByTeam = {};
      for (const tid of teamIds) ptsByTeam[tid] = 0;
      for (const sc of scored) {
        teamScores[sc.teamId] = roundHundredth(teamScores[sc.teamId] + sc.points);
        ptsByTeam[sc.teamId] = roundHundredth(ptsByTeam[sc.teamId] + sc.points);
      }

      eventResults.push({
        slot: p.slot,
        day: p.day,
        eventId: p.eventId,
        eventName: ev.name,
        gender: p.gender,
        isRelay: false,
        results: scored,
        ptsByTeam,
        runningScores: { ...teamScores }
      });
    }
  }

  // Dual meet tiebreaker rule:
  // "A dual meet can't end level: if the score is tied after the last event, the team that won the last relay takes the meet."
  let winnerTeamId = null;
  let loserTeamId = null;
  let wonOnLastRelayTiebreaker = false;

  if (!isFinal) {
    const hId = meetConfig.homeTeamId;
    const aId = meetConfig.awayTeamId;
    if (Math.abs(teamScores[hId] - teamScores[aId]) < 0.001) {
      const lastEv = eventResults[eventResults.length - 1];
      const firstPlace = lastEv.results.find(r => r.place === 1);
      winnerTeamId = firstPlace ? firstPlace.teamId : hId;
      loserTeamId = winnerTeamId === hId ? aId : hId;
      wonOnLastRelayTiebreaker = true;
    } else if (teamScores[hId] > teamScores[aId]) {
      winnerTeamId = hId;
      loserTeamId = aId;
    } else {
      winnerTeamId = aId;
      loserTeamId = hId;
    }
  } else {
    // Championship Final: sort 4 teams by total score (tiebreak by most event wins)
    const sortedTeams = [...teamIds].sort((a, b) => teamScores[b] - teamScores[a]);
    winnerTeamId = sortedTeams[0];
  }

  return {
    id: meetConfig.id,
    name: meetConfig.name,
    season: leagueState.season,
    week: meetConfig.week,
    isChampionshipFinal: isFinal,
    isPlayoff,
    cardType: isFinal ? "championship" : (meetConfig.cardType || (isDistanceWeek(meetConfig.week) ? "distance" : "standard")),
    homeTeamId: meetConfig.homeTeamId ?? null,
    awayTeamId: meetConfig.awayTeamId ?? null,
    teamIds,
    teamScores,
    winnerTeamId,
    loserTeamId,
    wonOnLastRelayTiebreaker,
    openEnteringLastRelay,
    preMeetProjection,
    lineupsByTeam,
    eventResults
  };
}

// Record an official individual swim (or flat-start relay lead-off) for PBs, Season Bests, Team Records, League Records, Top 10, and headless Swim Log
function recordOfficialSwim(leagueState, swimInfo) {
  const { swimmer, teamId, eventId, gender, time, splits, powerPoints, isTapered, week, meetId, meetName } = swimInfo;
  const flags = [];
  const season = leagueState.season;

  // If headless verification swim log is active, log every swim
  if (leagueState.headlessSwimLog) {
    leagueState.headlessSwimLog.push({
      season, week, meetId, swimmerId: swimmer.id, teamId, eventId, gender, time, splits
    });
  }

  // Track untapered vs tapered swims for the swimmer this season
  if (!swimmer.seasonSwimStats) swimmer.seasonSwimStats = {};
  if (!swimmer.seasonSwimStats[eventId]) {
    swimmer.seasonSwimStats[eventId] = { untaperedTimes: [], taperedBest: null };
  }
  if (isTapered) {
    const curTap = swimmer.seasonSwimStats[eventId].taperedBest;
    if (curTap === null || time < curTap) {
      swimmer.seasonSwimStats[eventId].taperedBest = time;
    }
  } else {
    swimmer.seasonSwimStats[eventId].untaperedTimes.push(time);
  }

  // 1. Personal Best check
  const curPB = swimmer.personalBests[eventId];
  if (!curPB || time < curPB.time) {
    swimmer.personalBests[eventId] = {
      time,
      season,
      week,
      meetId,
      meetName,
      splits: [...splits],
      powerPoints,
      age: swimmer.age
    };
    flags.push("PB");
  }

  // 2. Swimmer Season Best check
  const curSB = swimmer.seasonBests[eventId];
  if (!curSB || time < curSB.time) {
    swimmer.seasonBests[eventId] = {
      time,
      season,
      week,
      meetId,
      meetName,
      isTapered,
      splits: [...splits],
      powerPoints
    };
  }

  // 3. League Season Bests table
  if (!leagueState.seasonBests[gender][eventId]) {
    leagueState.seasonBests[gender][eventId] = {};
  }
  const prevLeagueSB = leagueState.seasonBests[gender][eventId][swimmer.id];
  if (!prevLeagueSB || time < prevLeagueSB.time) {
    leagueState.seasonBests[gender][eventId][swimmer.id] = {
      swimmerId: swimmer.id,
      swimmerName: swimmer.name,
      teamId,
      time,
      week,
      meetId,
      meetName,
      isTapered,
      splits: [...splits],
      powerPoints
    };
  }

  // 4. Team Record check
  const team = leagueState.teams[teamId];
  if (team) {
    const curTR = team.records[gender][eventId];
    if (!curTR || time < curTR.time) {
      team.records[gender][eventId] = {
        swimmerId: swimmer.id,
        swimmerName: swimmer.name,
        teamId,
        eventId,
        gender,
        time,
        season,
        week,
        meetId,
        meetName,
        splits: [...splits],
        powerPoints
      };
      flags.push("TR");
    }
  }

  // 5. League Record check
  const curLR = leagueState.records.league[gender][eventId];
  if (!curLR || time < curLR.time) {
    leagueState.records.league[gender][eventId] = {
      swimmerId: swimmer.id,
      swimmerName: swimmer.name,
      teamId,
      eventId,
      gender,
      time,
      season,
      week,
      meetId,
      meetName,
      splits: [...splits],
      powerPoints
    };
    flags.push("LR");
    if (leagueState.recordsBrokenThisSeason !== undefined) {
      leagueState.recordsBrokenThisSeason++;
    }
  }

  // 6. All-Time Top 10 Performers list (1 entry per swimmer, sorted fastest to slowest)
  const top10 = leagueState.records.allTimeTop10[gender][eventId] || [];
  const existingIdx = top10.findIndex(e => e.swimmerId === swimmer.id);
  if (existingIdx >= 0) {
    if (time < top10[existingIdx].time) {
      top10[existingIdx] = {
        swimmerId: swimmer.id,
        swimmerName: swimmer.name,
        teamId,
        time,
        season,
        week,
        meetId,
        meetName,
        splits: [...splits],
        powerPoints
      };
      top10.sort((a, b) => a.time - b.time);
    }
  } else if (top10.length < 10 || time < top10[top10.length - 1].time) {
    top10.push({
      swimmerId: swimmer.id,
      swimmerName: swimmer.name,
      teamId,
      time,
      season,
      week,
      meetId,
      meetName,
      splits: [...splits],
      powerPoints
    });
    top10.sort((a, b) => a.time - b.time);
    if (top10.length > 10) top10.length = 10;
  }
  leagueState.records.allTimeTop10[gender][eventId] = top10;

  return flags;
}

// Record an official non-DQ relay swim for Team Records and League Records
function recordRelaySwim(leagueState, relayInfo) {
  const { teamId, eventId, gender, time, legResults, legs, powerPoints, week, meetId, meetName } = relayInfo;
  const flags = [];
  const season = leagueState.season;
  const splits = legResults.map(l => l.time);
  const swimmerNames = legResults.map(l => l.swimmerName).join(", ");

  if (leagueState.headlessSwimLog) {
    leagueState.headlessSwimLog.push({
      season, week, meetId, swimmerId: null, legs, teamId, eventId, gender, time, splits
    });
  }

  // Season best relay per team
  if (!leagueState.seasonBests[gender][eventId]) {
    leagueState.seasonBests[gender][eventId] = {};
  }
  const prevSB = leagueState.seasonBests[gender][eventId][teamId];
  if (!prevSB || time < prevSB.time) {
    leagueState.seasonBests[gender][eventId][teamId] = {
      teamId,
      swimmerName: swimmerNames,
      legs: [...legs],
      time,
      week,
      meetId,
      meetName,
      splits,
      powerPoints
    };
  }

  // Team Record
  const team = leagueState.teams[teamId];
  if (team) {
    if (!team.records[gender]) team.records[gender] = {};
    const curTR = team.records[gender][eventId];
    if (!curTR || time < curTR.time) {
      team.records[gender][eventId] = {
        swimmerId: null,
        swimmerName: swimmerNames,
        legs: [...legs],
        teamId,
        eventId,
        gender,
        time,
        season,
        week,
        meetId,
        meetName,
        splits,
        powerPoints
      };
      flags.push("TR");
    }
  }

  // League Record
  const curLR = leagueState.records.league[gender][eventId];
  if (!curLR || time < curLR.time) {
    leagueState.records.league[gender][eventId] = {
      swimmerId: null,
      swimmerName: swimmerNames,
      legs: [...legs],
      teamId,
      eventId,
      gender,
      time,
      season,
      week,
      meetId,
      meetName,
      splits,
      powerPoints
    };
    flags.push("LR");
    if (leagueState.recordsBrokenThisSeason !== undefined) {
      leagueState.recordsBrokenThisSeason++;
    }
  }

  return flags;
}

// Create a brand new League State from a seed and options
function createNewLeague(seedInput = "BSPC-2026", options = {}) {
  if (typeof seedInput === "object" && seedInput !== null) {
    options = seedInput;
    seedInput = options.seed || "BSPC-2026";
  }
  const rng = initRngState(seedInput);
  const userTeamId = options.userTeamId ?? 0; // Default: Blue Springs Power Cats
  const startTier = options.startTier || "contender"; // 'contender' | 'middle' | 'underdog'

  // Create random starting team strength shifts (-0.0018 to +0.0018) so dual meets are competitive
  // (at least 40% projected within 15 points, ~80% favorite win rate)
  const rawShifts = [];
  for (let i = 0; i < 24; i++) {
    const norm = (i / 23) * 2 - 1; // -1 to +1
    rawShifts.push(norm * 0.0016);
  }
  shuffleInPlace(rng, rawShifts);

  // Ensure user's team gets the requested starting tier by swapping its shift with a matching team
  const sortedIndices = rawShifts.map((v, idx) => ({ v, idx })).sort((a, b) => a.v - b.v);
  let targetBucketIndices;
  if (startTier === "contender") {
    targetBucketIndices = sortedIndices.slice(0, 5).map(x => x.idx); // fastest (lowest mult)
  } else if (startTier === "underdog") {
    targetBucketIndices = sortedIndices.slice(19, 24).map(x => x.idx); // slowest (highest mult)
  } else {
    targetBucketIndices = sortedIndices.slice(9, 15).map(x => x.idx); // middle of the pack
  }
  if (!targetBucketIndices.includes(userTeamId)) {
    const swapIdx = randChoice(rng, targetBucketIndices);
    const tmp = rawShifts[userTeamId];
    rawShifts[userTeamId] = rawShifts[swapIdx];
    rawShifts[swapIdx] = tmp;
  }

  const swimmers = {};
  let nextSwimmerId = 1;
  const teams = [];

  for (let tid = 0; tid < 24; tid++) {
    const cfg = TEAMS_CONFIG[tid];
    const coachName = `${randChoice(rng, COACH_FIRST_NAMES)} ${randChoice(rng, LAST_NAMES)}`;
    const shift = rawShifts[tid];
    const isContender = shift < -0.0006;
    const isUnderdog = shift > 0.0006;
    const targetWins = isContender ? 9 : (isUnderdog ? 5 : 7);

    teams.push({
      ...cfg,
      coachName,
      roster: [],
      injuredList: [],
      payroll: 0,
      capSpace: SALARY_CAP,
      wins: 0,
      losses: 0,
      divWins: 0,
      divLosses: 0,
      pointsFor: 0,
      pointsAgainst: 0,
      streak: 0,
      playoffSeed: null,
      ownerPatience: 75,
      expectedWins: targetWins,
      seasonTaperPlan: {
        restWeek: randInt(rng, 5, 11),
        taper1Week: 13,
        taper2Week: 16
      },
      trainingPlan: {
        sprint: "standard",
        mid: "standard",
        distance: "standard",
        stroke: "standard"
      },
      draftPicks: [],
      records: { F: {}, M: {}, X: {} },
      seasonHistory: [],
      championshipBanners: []
    });
  }

  // Generate 48 swimmers per (gender, archetype) and distribute across the 24 teams
  // using paired complementary permutations so every team has signature star events and parity
  let bucketIdx = 0;
  let pairedPerm = null;
  for (const gender of ["F", "M"]) {
    for (const arch of ARCHETYPES) {
      const pool48 = [];
      for (let i = 0; i < 48; i++) {
        const age = randInt(rng, 20, 29);
        const sw = createSwimmer(rng, nextSwimmerId++, gender, arch, { age });
        pool48.push(sw);
      }
      pool48.sort((a, b) => getSwimmerPrimaryMultiplier(a) - getSwimmerPrimaryMultiplier(b));

      let teamOrder;
      if (bucketIdx % 2 === 0) {
        teamOrder = teams.map(t => ({
          id: t.id,
          score: rawShifts[t.id] * 0.4 + randNormal(rng, 0, 0.0040)
        })).sort((a, b) => a.score - b.score).map(x => x.id);
        pairedPerm = [...teamOrder].reverse();
      } else {
        teamOrder = pairedPerm;
      }
      bucketIdx++;

      for (let rank = 0; rank < 24; rank++) {
        const tid = teamOrder[rank];
        const sw1 = pool48[rank];
        const sw2 = pool48[47 - rank];
        for (const sw of [sw1, sw2]) {
          sw.teamId = tid;
          shiftSwimmerMultiplier(sw, rawShifts[tid] * 0.25);
          sw.contract.yearsLeft = randInt(rng, 1, 4);
          sw.contract.isRookieDeal = sw.age <= 21;
          estimateContractSalary(sw);
          sw.contract.salary = sw.contract.isRookieDeal
            ? Math.min(sw.contract.marketValue, 85000)
            : sw.contract.marketValue;
          swimmers[sw.id] = sw;
          teams[tid].roster.push(sw.id);
        }
      }
    }
  }

  for (const tm of teams) {
    normalizeTeamCapAndPayroll(tm, swimmers);
  }

  // Initialize draft picks for 3 seasons out (4 rounds per season)
  for (let sOffset = 0; sOffset < 3; sOffset++) {
    const yr = 2026 + sOffset;
    for (const tm of teams) {
      for (let rd = 1; rd <= 4; rd++) {
        tm.draftPicks.push({ season: yr, round: rd, originalTeamId: tm.id });
      }
    }
  }

  // Create Free Agent pool: 56 replacement-level free agents (4 F and 4 M per archetype at MIN_SALARY)
  const freeAgents = [];
  for (const gender of ["F", "M"]) {
    for (const arch of ARCHETYPES) {
      for (let k = 0; k < 4; k++) {
        const sw = createSwimmer(rng, nextSwimmerId++, gender, arch, {
          age: randInt(rng, 21, 28),
          teamId: null,
          isReplacement: true,
          tierShift: 0.016
        });
        sw.contract.salary = MIN_SALARY;
        sw.contract.yearsLeft = 1;
        swimmers[sw.id] = sw;
        freeAgents.push(sw.id);
      }
    }
  }

  const leagueState = {
    saveVersion: SAVE_VERSION,
    seed: String(seedInput),
    rngState: rng,
    season: 2026,
    seasonIndex: 1,
    week: 1, // 1..14 regular season, 15 Playoff R1, 16 Playoff QF, 17 Championship Final, 18 Offseason
    phase: "regular", // 'regular' | 'playoffs_r1' | 'playoffs_r2' | 'final' | 'offseason'
    offseasonPhase: null, // 'awards' | 'resigning' | 'draft' | 'freeAgency' | 'cuts'
    userTeamId,
    settings: {
      autoTraining: false,
      autoLineup: false,
      startTier
    },
    teams,
    swimmers,
    nextSwimmerId,
    freeAgents,
    draftProspects: [],
    draftOrder: [],
    currentDraftPickIndex: 0,
    expiringSwimmers: [],
    schedule: [], // weeks 1..14
    playoffs: {
      seeds: [],      // 12 teamIds in seed order 1..12
      round1Meets: [],
      round2Meets: [],
      finalMeet: null,
      championTeamId: null
    },
    seasonBests: { F: {}, M: {}, X: {} },
    records: {
      league: { F: {}, M: {}, X: {} },
      allTimeTop10: { F: {}, M: {} }
    },
    recordsBrokenThisSeason: 0,
    recordsBrokenBySeason: [],
    ageProgressionSamples: { "18_22": [], "23_26": [], "27_29": [], "30_plus": [] },
    dualMeetStats: {
      totalDuals: 0,
      favoriteWins: 0,
      openLastRelay: 0,
      projectedWithin15: 0
    },
    history: {
      seasons: [],     // past season summaries
      champions: [],   // [{ season, teamId, teamName, score, runnerUpId }]
      awards: [],      // [{ season, mvpF, mvpM, royF, royM, breakout, coy, eventTitles, allLeague }]
      hallOfFame: [],  // retired legends
      draftClasses: [], // [{ season, picks: [{ round, pick, teamId, swimmerId, swimmerName, archetype }] }]
      gmResume: {
        seasonsManaged: 0,
        totalWins: 0,
        totalLosses: 0,
        playoffAppearances: 0,
        finalFourAppearances: 0,
        championships: 0,
        coachOfYearCount: 0,
        teamsManaged: [TEAMS_CONFIG[userTeamId].name],
        timesFired: 0
      }
    },
    news: [
      {
        id: 1,
        season: 2026,
        week: 1,
        category: "league",
        headline: `Welcome to the 2026 ${LEAGUE_ABBR} Opening Week`,
        body: `All 24 clubs have finalized their 14-woman, 14-man short-course yards rosters as the road to the ${FINAL_MEET_NAME} begins.`
      }
    ],
    nextNewsId: 2,
    baselineEquilibrium: null // captured in Season 1 to prevent 30-year drift
  };

  captureBaselineEquilibrium(leagueState);
  leagueState.schedule = generateSeasonSchedule(leagueState.rngState, leagueState.season);
  return leagueState;
}

// Ensure a team's total payroll is strictly <= SALARY_CAP
function normalizeTeamCapAndPayroll(team, swimmersById) {
  let sum = 0;
  for (const sid of team.roster) {
    const sw = swimmersById[sid];
    if (!sw) continue;
    if (!sw.contract || !sw.contract.salary || Number.isNaN(sw.contract.salary)) {
      sw.contract = { salary: MIN_SALARY, yearsLeft: 1, isRookieDeal: false };
    }
    sum += sw.contract.salary;
  }
  // If over cap, scale salaries above MIN_SALARY proportionally so team is strictly under SALARY_CAP
  if (sum > SALARY_CAP - 50000) {
    const targetMax = SALARY_CAP - 120000;
    const minTotal = team.roster.length * MIN_SALARY;
    const excessAllowed = Math.max(0, targetMax - minTotal);
    const currentExcess = Math.max(1, sum - minTotal);
    const factor = Math.min(1, excessAllowed / currentExcess);
    sum = 0;
    for (const sid of team.roster) {
      const sw = swimmersById[sid];
      if (!sw) continue;
      const aboveMin = Math.max(0, sw.contract.salary - MIN_SALARY);
      sw.contract.salary = MIN_SALARY + Math.floor((aboveMin * factor) / 5000) * 5000;
      sum += sw.contract.salary;
    }
  }
  team.payroll = sum;
  team.capSpace = SALARY_CAP - sum;
}

// Capture theoretical 48-rank baseline quantiles per archetype so the 30-season ecosystem
// never inflates, deflates, or freezes single-seed Season 1 noise
function captureBaselineEquilibrium(leagueState) {
  const byArch = {};
  for (const arch of ARCHETYPES) {
    byArch[arch] = { F: [], M: [] };
    for (const g of ["F", "M"]) {
      const q48 = [];
      for (let i = 0; i < 48; i++) {
        const u = (i + 0.35) / 48;
        let q;
        if (i === 0) {
          q = 0.9985;
        } else if (i < 8) {
          const t = i / 7;
          q = 0.9985 + Math.pow(t, 0.85) * 0.0240; // i=7 (#8) is +2.40% behind #1
        } else {
          const t = (i - 7) / 40;
          q = 1.0225 + Math.pow(t, 0.82) * 0.0220; // i=47 (#48) is +4.45% behind #1
        }
        q48.push(Math.round(q * 10000) / 10000);
      }
      byArch[arch][g] = q48;
    }
  }
  leagueState.baselineEquilibrium = byArch;
  // Also align Season 1 rosters immediately to this clean equilibrium
  enforceStationaryLeagueEquilibrium(leagueState);
}

function getSwimmerPrimaryMultiplier(sw) {
  const p = sw.physiology;
  if (sw.archetype === "SPRINTER") return p.dSprint;
  if (sw.archetype === "DIST_FREE") return p.dDist;
  return p.dMid;
}

function shiftSwimmerMultiplier(sw, deltaMult) {
  const p = sw.physiology;
  p.dSprint = Math.max(0.968, Math.round((p.dSprint + deltaMult) * 10000) / 10000);
  p.dMid = Math.max(0.968, Math.round((p.dMid + deltaMult) * 10000) / 10000);
  p.dDist = Math.max(0.968, Math.round((p.dDist + deltaMult) * 10000) / 10000);
  recomputeSwimmerBaseTimes(sw);
}

// Generate 14-week regular season schedule:
// - 10 division meets per team (double round-robin: 5 home, 5 away against the 5 division rivals)
// - 4 cross-division meets per team (2 home, 2 away)
// - Weeks 3, 7, 10, 13 use the Distance Card
function generateSeasonSchedule(rngState, season) {
  // For a 6-team division (indices 0..5), canonical 5-round single round-robin pairings:
  const r5 = [
    [[0, 5], [1, 4], [2, 3]],
    [[0, 4], [5, 3], [1, 2]],
    [[0, 3], [4, 2], [5, 1]],
    [[0, 2], [3, 1], [4, 5]],
    [[0, 1], [2, 5], [3, 4]]
  ];

  // Build 10 division rounds (5 first half, 5 mirrored home/away second half)
  const divRounds = [];
  for (let r = 0; r < 5; r++) {
    const pairs1 = [];
    const pairs2 = [];
    for (let d = 0; d < 4; d++) {
      const base = d * 6;
      const localOrder = [0, 1, 2, 3, 4, 5];
      for (const [a, b] of r5[r]) {
        const tA = base + localOrder[a];
        const tB = base + localOrder[b];
        if ((r + d) % 2 === 0) {
          pairs1.push({ homeTeamId: tA, awayTeamId: tB, isDivision: true });
          pairs2.push({ homeTeamId: tB, awayTeamId: tA, isDivision: true });
        } else {
          pairs1.push({ homeTeamId: tB, awayTeamId: tA, isDivision: true });
          pairs2.push({ homeTeamId: tA, awayTeamId: tB, isDivision: true });
        }
      }
    }
    divRounds.push(pairs1);
    divRounds.push(pairs2);
  }

  // Build 4 cross-division rounds (2 home, 2 away for every team)
  // Pair Div 0 vs Div 1 (2 rounds: home & away), and Div 0 vs Div 2 / Div 1 vs Div 3 (2 rounds: home & away)
  const crossRounds = [];
  const divPerm = [0, 1, 2, 3, 4, 5];
  shuffleInPlace(rngState, divPerm);

  // Cross Round 1 & 2: Div 0 vs Div 1, Div 2 vs Div 3 (home then away)
  const cr1 = [], cr2 = [];
  for (let i = 0; i < 6; i++) {
    const t0 = 0 + i;
