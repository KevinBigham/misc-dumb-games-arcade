    const t1 = 6 + divPerm[i];
    const t2 = 12 + i;
    const t3 = 18 + divPerm[i];
    cr1.push({ homeTeamId: t0, awayTeamId: t1, isDivision: false });
    cr1.push({ homeTeamId: t2, awayTeamId: t3, isDivision: false });
    cr2.push({ homeTeamId: t1, awayTeamId: t0, isDivision: false });
    cr2.push({ homeTeamId: t3, awayTeamId: t2, isDivision: false });
  }
  // Cross Round 3 & 4: Div 0 vs Div 2, Div 1 vs Div 3 (shifted permutation, home then away)
  const cr3 = [], cr4 = [];
  for (let i = 0; i < 6; i++) {
    const t0 = 0 + i;
    const t2 = 12 + divPerm[(i + 1) % 6];
    const t1 = 6 + i;
    const t3 = 18 + divPerm[(i + 2) % 6];
    cr3.push({ homeTeamId: t0, awayTeamId: t2, isDivision: false });
    cr3.push({ homeTeamId: t1, awayTeamId: t3, isDivision: false });
    cr4.push({ homeTeamId: t2, awayTeamId: t0, isDivision: false });
    cr4.push({ homeTeamId: t3, awayTeamId: t1, isDivision: false });
  }
  crossRounds.push(cr1, cr2, cr3, cr4);

  // Interleave the 10 division rounds and 4 cross-division rounds across the 14 weeks
  const rawWeeks = [
    divRounds[0],
    divRounds[1],
    crossRounds[0], // Week 3 (Distance card)
    divRounds[2],
    divRounds[3],
    crossRounds[1],
    divRounds[4],   // Week 7 (Distance card)
    divRounds[5],
    crossRounds[2],
    divRounds[6],   // Week 10 (Distance card)
    crossRounds[3],
    divRounds[7],
    divRounds[8],   // Week 13 (Distance card)
    divRounds[9]    // Week 14 (Division finale)
  ];

  const schedule = [];
  for (let w = 1; w <= 14; w++) {
    const cardType = isDistanceWeek(w) ? "distance" : "standard";
    const pairings = rawWeeks[w - 1];
    const meets = pairings.map((p, idx) => ({
      id: `S${season}_W${w}_M${idx + 1}`,
      name: `Week ${w}: ${TEAMS_CONFIG[p.awayTeamId].abbr} @ ${TEAMS_CONFIG[p.homeTeamId].abbr}`,
      season,
      week: w,
      cardType,
      isDivision: p.isDivision,
      isPlayoff: false,
      isChampionshipFinal: false,
      homeTeamId: p.homeTeamId,
      awayTeamId: p.awayTeamId,
      completed: false,
      result: null
    }));
    schedule.push({
      week: w,
      cardType,
      meets
    });
  }
  return schedule;
}

// ============================================================================
// SECTION 7: WEEKLY TRAINING, TAPER, & INJURIES
// ============================================================================

function updateCpuTrainingPlanForWeek(leagueState, team) {
  const w = leagueState.week;
  const plan = team.seasonTaperPlan || { restWeek: 7, taper1Week: 13, taper2Week: 16 };

  let targetLoad = "standard";
  if (w <= 4) {
    targetLoad = "heavy";
  } else if (w === plan.restWeek) {
    targetLoad = "rest";
  } else if (w === 13) {
    // Taper in Week 13 (carries across Week 13 Distance card and Week 14 Standard card!)
    targetLoad = "taper";
  } else if (w === 14) {
    // Hold taper peak through Week 14
    targetLoad = "rest";
  } else if (w === 15 || w === 16) {
    targetLoad = "rest";
  } else if (w === 17) {
    // Championship Final peak taper
    targetLoad = "taper";
  } else {
    targetLoad = "standard";
  }

  team.trainingPlan = {
    sprint: targetLoad,
    mid: targetLoad,
    distance: targetLoad,
    stroke: targetLoad
  };
}

function applyTeamWeeklyTraining(leagueState, team) {
  const rng = leagueState.rngState;
  const swimmersById = leagueState.swimmers;

  if (team.id !== leagueState.userTeamId || leagueState.settings.autoTraining) {
    updateCpuTrainingPlanForWeek(leagueState, team);
  }

  for (const sid of team.roster) {
    const sw = swimmersById[sid];
    if (!sw) continue;
    const group = sw.trainingGroup || "mid";
    const load = team.trainingPlan[group] || "standard";
    const cond = sw.conditioning;

    // Decrement existing taper window if active
    if (cond.taperWeeksLeft > 0) {
      cond.taperWeeksLeft--;
      if (cond.taperWeeksLeft === 0 && load !== "taper") {
        cond.taperStatus = "none";
        cond.taperBonus = 0;
        cond.fatigue = Math.max(cond.fatigue, 32);
      }
    }

    if (load === "heavy") {
      cond.fitness = Math.min(96, roundHundredth(cond.fitness + 1.8));
      cond.fatigue = Math.min(68, roundHundredth(cond.fatigue * 0.65 + 46 * 0.35));
      cond.taperStatus = "none";
      cond.taperBonus = 0;
      cond.taperWeeksLeft = 0;
      // Small injury risk on heavy training, scaled by durability
      const injProb = 0.0040 * (1.25 - (sw.skills.durability - 50) / 100);
      if (!sw.injury && nextRandom(rng) < injProb) {
        const inj = randChoice(rng, INJURY_TYPES);
        sw.injury = { type: inj.name, weeksLeft: randInt(rng, inj.minW, inj.maxW) };
      }
    } else if (load === "standard") {
      cond.fitness = Math.min(92, roundHundredth(cond.fitness * 0.8 + 83 * 0.2));
      // If currently in a 2-week taper window, preserve only partial sharpness if switched back to standard
      if (cond.taperWeeksLeft === 0) {
        cond.fatigue = roundHundredth(cond.fatigue * 0.6 + 38 * 0.4);
        cond.taperStatus = "none";
        cond.taperBonus = 0;
      }
      const injProb = 0.0014 * (1.2 - (sw.skills.durability - 50) / 100);
      if (!sw.injury && nextRandom(rng) < injProb) {
        const inj = randChoice(rng, INJURY_TYPES);
        sw.injury = { type: inj.name, weeksLeft: randInt(rng, inj.minW, inj.maxW) };
      }
    } else if (load === "rest") {
      if (cond.taperStatus === "tapered" && cond.taperWeeksLeft > 0) {
        // Holding an active taper through Week 2 of the taper window!
        cond.fatigue = Math.max(4, roundHundredth(cond.fatigue * 0.85));
      } else {
        cond.fitness = Math.max(76, roundHundredth(cond.fitness - 0.5));
        cond.fatigue = Math.max(14, roundHundredth(cond.fatigue - 16));
        cond.taperStatus = "resting";
        cond.taperBonus = 0.011;
      }
    } else if (load === "taper") {
      cond.tapersUsed = (cond.tapersUsed || 0) + 1;
      // First 2 tapers of a season give full 2-3% drop; 3rd+ taper suffers diminishing returns
      const overusePenalty = cond.tapersUsed <= 2 ? 1.0 : 0.42;
      cond.fitness = Math.min(96, Math.max(88, roundHundredth(cond.fitness + 3)));
      cond.fatigue = Math.round(randRange(rng, 4, 8));
      cond.taperStatus = "tapered";
      cond.taperBonus = roundHundredth(0.025 * overusePenalty);
      cond.taperWeeksLeft = 2; // Lasts for current week + next week if rested
    }
  }
}

// Manage Injured List & ensure every team always has 14 healthy Women and 14 healthy Men under the cap
function manageTeamInjuriesAndRosterCoverage(leagueState, team) {
  const rng = leagueState.rngState;
  const swimmersById = leagueState.swimmers;

  // 1. Heal swimmers currently on Injured List
  const stillInjured = [];
  for (const sid of (team.injuredList || [])) {
    const sw = swimmersById[sid];
    if (!sw) continue;
    if (sw.injury) {
      sw.injury.weeksLeft--;
      if (sw.injury.weeksLeft <= 0) {
        sw.injury = null;
      }
    }
    if (!sw.injury) {
      sw.onInjuredList = false;
      // Return swimmer to active roster if not already there
      if (!team.roster.includes(sid)) {
        team.roster.push(sid);
      }
    } else {
      stillInjured.push(sid);
    }
  }
  team.injuredList = stillInjured;

  // 2. Move any newly injured active swimmer onto Injured List
  const healthyRoster = [];
  for (const sid of team.roster) {
    const sw = swimmersById[sid];
    if (!sw) continue;
    if (sw.injury && sw.injury.weeksLeft > 0) {
      sw.onInjuredList = true;
      if (!team.injuredList.includes(sid)) {
        team.injuredList.push(sid);
      }
    } else {
      sw.onInjuredList = false;
      healthyRoster.push(sid);
    }
  }
  team.roster = healthyRoster;

  // 3. Enforce exact 14 healthy Women and 14 healthy Men on active roster
  for (const gender of ["F", "M"]) {
    let gList = team.roster.map(id => swimmersById[id]).filter(s => s && s.gender === gender);

    // If > 14 (because an injured swimmer returned from IL), release the lowest-value temporary replacement
    while (gList.length > 14) {
      // Sort ascending by peakPowerPoints, preferring to release temporary injury replacements first
      gList.sort((a, b) => {
        const repA = a.isInjuryReplacement ? 0 : 1;
        const repB = b.isInjuryReplacement ? 0 : 1;
        if (repA !== repB) return repA - repB;
        return a.baseTimesCache.peakPowerPoints - b.baseTimesCache.peakPowerPoints;
      });
      const cutSw = gList.shift();
      team.roster = team.roster.filter(id => id !== cutSw.id);
      cutSw.teamId = null;
      cutSw.isInjuryReplacement = false;
      if (!leagueState.freeAgents.includes(cutSw.id)) {
        leagueState.freeAgents.push(cutSw.id);
      }
    }

    // If < 14 (because someone went on IL or was traded), sign a minimum-salary replacement in the missing archetype
    while (gList.length < 14) {
      const countsByArch = {};
      for (const arch of ARCHETYPES) countsByArch[arch] = 0;
      for (const s of gList) countsByArch[s.archetype] = (countsByArch[s.archetype] || 0) + 1;
      let neededArch = ARCHETYPES[0];
      for (const arch of ARCHETYPES) {
        if (countsByArch[arch] < 2) { neededArch = arch; break; }
      }

      let faPool = leagueState.freeAgents
        .map(id => swimmersById[id])
        .filter(s => s && s.gender === gender && s.archetype === neededArch);
      if (faPool.length === 0) {
        faPool = leagueState.freeAgents
          .map(id => swimmersById[id])
          .filter(s => s && s.gender === gender);
      }

      let signedSw;
      if (faPool.length > 0) {
        faPool.sort((a, b) => b.baseTimesCache.peakPowerPoints - a.baseTimesCache.peakPowerPoints);
        // Pick a replacement-level FA at minimum salary
        signedSw = faPool.find(s => s.contract.salary <= MIN_SALARY) || faPool[faPool.length - 1];
        leagueState.freeAgents = leagueState.freeAgents.filter(id => id !== signedSw.id);
      } else {
        signedSw = createSwimmer(rng, leagueState.nextSwimmerId++, gender, neededArch, {
          age: randInt(rng, 22, 27),
          teamId: team.id,
          isReplacement: true
        });
        swimmersById[signedSw.id] = signedSw;
      }

      signedSw.teamId = team.id;
      signedSw.onInjuredList = false;
      signedSw.injury = null;
      signedSw.isInjuryReplacement = true;
      signedSw.contract.salary = MIN_SALARY;
      signedSw.contract.yearsLeft = 1;
      team.roster.push(signedSw.id);
      gList.push(signedSw);
    }
  }

  // Ensure Free Agent pool always has replacement-level depth in every stroke group
  replenishFreeAgentPool(leagueState);
  normalizeTeamCapAndPayroll(team, swimmersById);
}

function replenishFreeAgentPool(leagueState) {
  const rng = leagueState.rngState;
  const swimmersById = leagueState.swimmers;
  for (const gender of ["F", "M"]) {
    for (const arch of ARCHETYPES) {
      const count = leagueState.freeAgents
        .map(id => swimmersById[id])
        .filter(s => s && s.gender === gender && s.archetype === arch).length;
      if (count < 2) {
        const sw = createSwimmer(rng, leagueState.nextSwimmerId++, gender, arch, {
          age: randInt(rng, 22, 27),
          teamId: null,
          isReplacement: true,
          tierShift: 0.014
        });
        sw.contract.salary = MIN_SALARY;
        sw.contract.yearsLeft = 1;
        swimmersById[sw.id] = sw;
        leagueState.freeAgents.push(sw.id);
      }
    }
  }
}

if (typeof module !== "undefined" && module.exports) {
  Object.assign(module.exports, {
    COACH_FIRST_NAMES, INJURY_TYPES, createNewLeague, normalizeTeamCapAndPayroll,
    captureBaselineEquilibrium, getSwimmerPrimaryMultiplier, shiftSwimmerMultiplier,
    generateSeasonSchedule, updateCpuTrainingPlanForWeek, applyTeamWeeklyTraining,
    manageTeamInjuriesAndRosterCoverage, replenishFreeAgentPool
  });
}

// ============================================================================
// SECTION 8: STANDINGS, TIEBREAKERS, PLAYOFFS, & CHAMPIONSHIP FINAL
// ============================================================================

function addNewsItem(leagueState, category, headline, body) {
  leagueState.news.unshift({
    id: leagueState.nextNewsId++,
    season: leagueState.season,
    week: leagueState.week,
    category,
    headline,
    body
  });
  if (leagueState.news.length > 120) {
    leagueState.news.length = 120;
  }
}

// Compute head-to-head record between a subset of tied teamIds in the current season's completed regular-season meets
function getHeadToHeadWinPct(leagueState, teamId, tiedTeamIdsSet) {
  let wins = 0;
  let total = 0;
  for (const wk of leagueState.schedule) {
    for (const m of wk.meets) {
      if (!m.completed || !m.result) continue;
      const h = m.homeTeamId;
      const a = m.awayTeamId;
      if (h === teamId && tiedTeamIdsSet.has(a)) {
        total++;
        if (m.result.winnerTeamId === teamId) wins++;
      } else if (a === teamId && tiedTeamIdsSet.has(h)) {
        total++;
        if (m.result.winnerTeamId === teamId) wins++;
      }
    }
  }
  return total > 0 ? wins / total : 0.5;
}

// Sort teams with official tiebreakers:
// 1. Overall Wins (and Win Pct)
// 2. Head-to-head record among tied teams
// 3. Division record (divWins)
// 4. Season point margin (pointsFor - pointsAgainst)
function rankTeamsWithTiebreakers(leagueState, teamList) {
  // Group teams by wins
  const byWins = {};
  for (const t of teamList) {
    const w = t.wins;
    if (!byWins[w]) byWins[w] = [];
    byWins[w].push(t);
  }

  const sortedWinsKeys = Object.keys(byWins).map(Number).sort((a, b) => b - a);
  const finalRanked = [];

  for (const w of sortedWinsKeys) {
    const group = byWins[w];
    if (group.length === 1) {
      finalRanked.push(group[0]);
    } else {
      const tiedSet = new Set(group.map(t => t.id));
      const h2hMap = {};
      for (const t of group) {
        h2hMap[t.id] = getHeadToHeadWinPct(leagueState, t.id, tiedSet);
      }
      group.sort((a, b) => {
        if (Math.abs(h2hMap[b.id] - h2hMap[a.id]) > 1e-6) return h2hMap[b.id] - h2hMap[a.id];
        if (b.divWins !== a.divWins) return b.divWins - a.divWins;
        const marginA = a.pointsFor - a.pointsAgainst;
        const marginB = b.pointsFor - b.pointsAgainst;
        if (Math.abs(marginB - marginA) > 1e-3) return marginB - marginA;
        return a.id - b.id;
      });
      finalRanked.push(...group);
    }
  }
  return finalRanked;
}

function getDivisionStandings(leagueState) {
  const result = {};
  for (const div of DIVISIONS) {
    const divTeams = leagueState.teams.filter(t => t.division === div);
    result[div] = rankTeamsWithTiebreakers(leagueState, divTeams);
  }
  return result;
}

// Compute the 12 Playoff Seeds (4 Division Winners seeded 1..4, 8 Wild Cards seeded 5..12)
function computePlayoffSeeds(leagueState) {
  const divStandings = getDivisionStandings(leagueState);
  const divWinners = [];
  const nonWinners = [];

  for (const div of DIVISIONS) {
    const ranked = divStandings[div];
    divWinners.push(ranked[0]);
    nonWinners.push(...ranked.slice(1));
  }

  const seeds1to4 = rankTeamsWithTiebreakers(leagueState, divWinners);
  const seeds5to12 = rankTeamsWithTiebreakers(leagueState, nonWinners).slice(0, 8);
  const all12 = [...seeds1to4, ...seeds5to12];

  for (const tm of leagueState.teams) tm.playoffSeed = null;
  all12.forEach((tm, idx) => {
    tm.playoffSeed = idx + 1;
  });

  return all12.map(t => t.id);
}

// Higher seed hosts and chooses the card ("standard" or "distance") that gives them the better projected margin
function chooseBestCardForHost(leagueState, hostTeamId, awayTeamId, week) {
  const host = leagueState.teams[hostTeamId];
  const away = leagueState.teams[awayTeamId];
  const swimmersById = leagueState.swimmers;

  const progStd = getDualMeetProgram(week, "standard");
  const hLinStd = generateTeamLineup(host, swimmersById, progStd, false, { isHome: true, isPlayoff: true });
  const aLinStd = generateTeamLineup(away, swimmersById, progStd, false, { isHome: false, isPlayoff: true });
  const projStd = projectDualMeetScore(host, away, hLinStd, aLinStd, swimmersById, progStd);

  const progDist = getDualMeetProgram(week, "distance");
  const hLinDist = generateTeamLineup(host, swimmersById, progDist, false, { isHome: true, isPlayoff: true });
  const aLinDist = generateTeamLineup(away, swimmersById, progDist, false, { isHome: false, isPlayoff: true });
  const projDist = projectDualMeetScore(host, away, hLinDist, aLinDist, swimmersById, progDist);

  return projDist.margin > projStd.margin ? "distance" : "standard";
}

// Simulate or advance one week of the season
// Optional customUserLineup can be passed when the user submits a custom lineup for their meet
function simulateCurrentWeek(leagueState, customUserLineup = null) {
  if (leagueState.phase === "offseason") {
    advanceOffseasonPhase(leagueState);
    return;
  }

  const swimmersById = leagueState.swimmers;
  const w = leagueState.week;

  // 1. Apply weekly training and manage IL/roster coverage for all 24 teams
  for (const tm of leagueState.teams) {
    applyTeamWeeklyTraining(leagueState, tm);
    manageTeamInjuriesAndRosterCoverage(leagueState, tm);
  }

  // 2. Trade Deadline CPU activity (Week 9 is ~two-thirds through the 14-week regular season)
  if (leagueState.phase === "regular" && w <= 10 && (w === 6 || w === 9)) {
    runCpuTradeWindow(leagueState);
  }

  // 3. Run meets for the current phase
  if (leagueState.phase === "regular") {
    const weekObj = leagueState.schedule[w - 1];
    for (const meet of weekObj.meets) {
      if (meet.completed) continue;
      const customLineups = {};
      if (customUserLineup && (meet.homeTeamId === leagueState.userTeamId || meet.awayTeamId === leagueState.userTeamId)) {
        customLineups[leagueState.userTeamId] = customUserLineup;
      }

      const res = simulateFullMeet(leagueState, {
        ...meet,
        customLineups
      });

      // Keep lightweight meet summary on schedule to stay well under 2MB after 30 seasons,
      // while keeping full eventResults on `leagueState.lastSimulatedMeetByTeam[tid]` for UI inspection
      meet.completed = true;
      meet.result = {
        homeTeamId: meet.homeTeamId,
        awayTeamId: meet.awayTeamId,
        teamScores: res.teamScores,
        winnerTeamId: res.winnerTeamId,
        loserTeamId: res.loserTeamId,
        wonOnLastRelayTiebreaker: res.wonOnLastRelayTiebreaker,
        openEnteringLastRelay: res.openEnteringLastRelay,
        preMeetProjection: {
          homeProjected: res.preMeetProjection.homeProjected,
          awayProjected: res.preMeetProjection.awayProjected,
          margin: res.preMeetProjection.margin
        },
        eventResults: res.eventResults
      };

      const hTeam = leagueState.teams[meet.homeTeamId];
      const aTeam = leagueState.teams[meet.awayTeamId];
      const hScore = res.teamScores[hTeam.id];
      const aScore = res.teamScores[aTeam.id];

      hTeam.pointsFor = roundHundredth(hTeam.pointsFor + hScore);
      hTeam.pointsAgainst = roundHundredth(hTeam.pointsAgainst + aScore);
      aTeam.pointsFor = roundHundredth(aTeam.pointsFor + aScore);
      aTeam.pointsAgainst = roundHundredth(aTeam.pointsAgainst + hScore);

      if (res.winnerTeamId === hTeam.id) {
        hTeam.wins++;
        aTeam.losses++;
        hTeam.streak = hTeam.streak >= 0 ? hTeam.streak + 1 : 1;
        aTeam.streak = aTeam.streak <= 0 ? aTeam.streak - 1 : -1;
        if (meet.isDivision) { hTeam.divWins++; aTeam.divLosses++; }
      } else {
        aTeam.wins++;
        hTeam.losses++;
        aTeam.streak = aTeam.streak >= 0 ? aTeam.streak + 1 : 1;
        hTeam.streak = hTeam.streak <= 0 ? hTeam.streak - 1 : -1;
        if (meet.isDivision) { aTeam.divWins++; hTeam.divLosses++; }
      }

      // Track League Health dual meet stats
      leagueState.dualMeetStats.totalDuals++;
      const projMargin = res.preMeetProjection.margin;
      const favTeamId = projMargin >= 0 ? hTeam.id : aTeam.id;
      if (res.winnerTeamId === favTeamId) {
        leagueState.dualMeetStats.favoriteWins++;
      }
      if (res.openEnteringLastRelay) {
        leagueState.dualMeetStats.openLastRelay++;
      }
      if (Math.abs(projMargin) <= 15.0) {
        leagueState.dualMeetStats.projectedWithin15++;
      }

      // Generate organic news from notable dual meet occurrences
      const scoreDiff = Math.abs(hScore - aScore);
      if (scoreDiff <= 6 || res.wonOnLastRelayTiebreaker) {
        const winT = leagueState.teams[res.winnerTeamId];
        const loseT = leagueState.teams[res.loserTeamId];
        addNewsItem(
          leagueState,
          "meet",
          `${winT.abbr} edges ${loseT.abbr} ${res.teamScores[winT.id]}–${res.teamScores[loseT.id]} in last-relay thriller!`,
          `The dual meet at ${hTeam.poolName} came down to the final 400 Free Relay${res.wonOnLastRelayTiebreaker ? " tiebreaker" : ""}, with ${winT.name} prevailing by ${scoreDiff.toFixed(1)} points.`
        );
      }
    }

    // Check if regular season just finished (Week 14)
    if (w === 14) {
      const seeds = computePlayoffSeeds(leagueState);
      leagueState.playoffs.seeds = seeds;
      // Build Playoff Round 1 (Seeds 5 vs 12, 6 vs 11, 7 vs 10, 8 vs 9)
      const r1Pairs = [[4, 11], [5, 10], [6, 9], [7, 8]];
      leagueState.playoffs.round1Meets = r1Pairs.map(([hiIdx, loIdx], idx) => {
        const hId = seeds[hiIdx];
        const aId = seeds[loIdx];
        const chosenCard = chooseBestCardForHost(leagueState, hId, aId, 15);
        return {
          id: `S${leagueState.season}_PR1_M${idx + 1}`,
          name: `Playoff Rd 1: #${loIdx + 1} ${TEAMS_CONFIG[aId].abbr} @ #${hiIdx + 1} ${TEAMS_CONFIG[hId].abbr}`,
          season: leagueState.season,
          week: 15,
          cardType: chosenCard,
          isPlayoff: true,
          isChampionshipFinal: false,
          homeTeamId: hId,
          awayTeamId: aId,
          completed: false,
          result: null
        };
      });
      leagueState.week = 15;
      leagueState.phase = "playoffs_r1";
      addNewsItem(
        leagueState,
        "playoffs",
        `${leagueState.season} Playoff Bracket Set: ${leagueState.teams[seeds[0]].name} Clinches #1 Overall Seed`,
        `Top seeds ${seeds.slice(0, 4).map(id => leagueState.teams[id].abbr).join(", ")} earn first-round byes as Wild Card knockout duals begin.`
      );
    } else {
      leagueState.week = w + 1;
    }
  } else if (leagueState.phase === "playoffs_r1") {
    const winners = [];
    for (const meet of leagueState.playoffs.round1Meets) {
      const customLineups = {};
      if (customUserLineup && (meet.homeTeamId === leagueState.userTeamId || meet.awayTeamId === leagueState.userTeamId)) {
        customLineups[leagueState.userTeamId] = customUserLineup;
      }
      const res = simulateFullMeet(leagueState, { ...meet, customLineups });
      meet.completed = true;
      meet.result = res;
      winners.push(res.winnerTeamId);
    }
    // Sort Round 1 winners by their playoffSeed so #1 seed hosts lowest remaining seed
    winners.sort((a, b) => leagueState.teams[a].playoffSeed - leagueState.teams[b].playoffSeed);
    const seeds = leagueState.playoffs.seeds;
    const r2Pairs = [
      [seeds[0], winners[3]],
      [seeds[1], winners[2]],
      [seeds[2], winners[1]],
      [seeds[3], winners[0]]
    ];
    leagueState.playoffs.round2Meets = r2Pairs.map(([hId, aId], idx) => {
      const chosenCard = chooseBestCardForHost(leagueState, hId, aId, 16);
      return {
        id: `S${leagueState.season}_PR2_M${idx + 1}`,
        name: `Quarterfinal: #${leagueState.teams[aId].playoffSeed} ${TEAMS_CONFIG[aId].abbr} @ #${leagueState.teams[hId].playoffSeed} ${TEAMS_CONFIG[hId].abbr}`,
        season: leagueState.season,
        week: 16,
        cardType: chosenCard,
        isPlayoff: true,
        isChampionshipFinal: false,
        homeTeamId: hId,
        awayTeamId: aId,
        completed: false,
        result: null
      };
    });
    leagueState.week = 16;
    leagueState.phase = "playoffs_r2";
  } else if (leagueState.phase === "playoffs_r2") {
    const finalFour = [];
    for (const meet of leagueState.playoffs.round2Meets) {
      const customLineups = {};
      if (customUserLineup && (meet.homeTeamId === leagueState.userTeamId || meet.awayTeamId === leagueState.userTeamId)) {
        customLineups[leagueState.userTeamId] = customUserLineup;
      }
      const res = simulateFullMeet(leagueState, { ...meet, customLineups });
      meet.completed = true;
      meet.result = res;
      finalFour.push(res.winnerTeamId);
    }
    leagueState.playoffs.finalMeet = {
      id: `S${leagueState.season}_FINAL`,
      name: `${leagueState.season} ${FINAL_MEET_NAME}`,
      season: leagueState.season,
      week: 17,
      cardType: "championship",
      isPlayoff: true,
      isChampionshipFinal: true,
      teamIds: finalFour,
      completed: false,
      result: null
    };
    leagueState.week = 17;
    leagueState.phase = "final";
    addNewsItem(
      leagueState,
      "playoffs",
      `Final Four Bound: ${finalFour.map(id => leagueState.teams[id].abbr).join(", ")} Advance to ${FINAL_MEET_NAME}`,
      `Four clubs remain for the three-day neutral-pool championship showdown.`
    );
  } else if (leagueState.phase === "final") {
    const fMeet = leagueState.playoffs.finalMeet;
    const customLineups = {};
    if (customUserLineup && fMeet.teamIds.includes(leagueState.userTeamId)) {
      customLineups[leagueState.userTeamId] = customUserLineup;
    }
    const res = simulateFullMeet(leagueState, { ...fMeet, customLineups });
    fMeet.completed = true;
    fMeet.result = res;
    leagueState.playoffs.championTeamId = res.winnerTeamId;

    const champTeam = leagueState.teams[res.winnerTeamId];
    champTeam.championshipBanners.push(leagueState.season);

    addNewsItem(
      leagueState,
      "championship",
      `${champTeam.name} Wins the ${leagueState.season} ${FINAL_MEET_NAME}!`,
      `${champTeam.name} scored ${res.teamScores[champTeam.id]} points over three days to capture the ${LEAGUE_ABBR} Championship banner.`
    );

    // Transition to Offseason Phase 1: Awards & Retirements
    startOffseason(leagueState);
  }
}

// ============================================================================
// SECTION 9: OFFSEASON LOOP (AWARDS, RE-SIGNING, DRAFT, FREE AGENCY, CUTS)
// ============================================================================

function startOffseason(leagueState) {
  leagueState.week = 18;
  leagueState.phase = "offseason";
  leagueState.offseasonPhase = "awards";

  // Count how many of the 40 league records were set or broken in this season
  let brokenCount = 0;
  for (const g of ["F", "M", "X"]) {
    const recMap = leagueState.records.league[g] || {};
    for (const evId of Object.keys(recMap)) {
      if (recMap[evId].season === leagueState.season) {
        brokenCount++;
      }
    }
  }
  leagueState.recordsBrokenBySeason.push({
    season: leagueState.season,
    seasonIndex: leagueState.seasonIndex,
    count: brokenCount
  });

  // Compute season awards, event titles, All-League teams, owner evaluation, and retirements
  computeSeasonAwardsAndHistory(leagueState);
}

function computeSeasonAwardsAndHistory(leagueState) {
  const season = leagueState.season;
  const swimmersById = leagueState.swimmers;

  // 1. Individual Event Titles (fastest swimmer of the season in each of the 14 events for F and M)
  const eventTitles = { F: {}, M: {} };
  const allLeagueFirst = { F: {}, M: {} };
  const allLeagueSecond = { F: {}, M: {} };
  const titleCountsBySwimmer = {};

  for (const g of ["F", "M"]) {
    for (const ev of INDIVIDUAL_EVENTS) {
      const sbMap = leagueState.seasonBests[g][ev.id] || {};
      const list = Object.values(sbMap).sort((a, b) => a.time - b.time);
      if (list.length > 0) {
        const winner = list[0];
        eventTitles[g][ev.id] = {
          swimmerId: winner.swimmerId,
          swimmerName: winner.swimmerName,
          teamId: winner.teamId,
          time: winner.time,
          powerPoints: winner.powerPoints
        };
        titleCountsBySwimmer[winner.swimmerId] = (titleCountsBySwimmer[winner.swimmerId] || 0) + 1;
        const sw = swimmersById[winner.swimmerId];
        if (sw) sw.awards.push(`${season} ${ev.name} Title`);

        allLeagueFirst[g][ev.id] = {
          swimmerId: winner.swimmerId,
          swimmerName: winner.swimmerName,
          teamId: winner.teamId,
          time: winner.time
        };
      }
      if (list.length > 1) {
        const second = list[1];
        allLeagueSecond[g][ev.id] = {
          swimmerId: second.swimmerId,
          swimmerName: second.swimmerName,
          teamId: second.teamId,
          time: second.time
        };
      }
    }
  }

  // 2. Swimmer of the Year (F & M), Rookie of the Year (F & M), Breakout Swimmer
  const activeSwimmers = Object.values(swimmersById).filter(s => s.teamId !== null);
  const pickBest = (list, scoreFn) => {
    let best = null, bestScore = -1e9;
    for (const s of list) {
      const sc = scoreFn(s);
      if (sc > bestScore) { bestScore = sc; best = s; }
    }
    return best;
  };

  const scoreMvp = (s) => {
    const sbs = Object.values(s.seasonBests || {});
    if (sbs.length === 0) return 0;
    const maxPP = Math.max(...sbs.map(x => x.powerPoints || 0));
    const titles = titleCountsBySwimmer[s.id] || 0;
    return maxPP + titles * 18;
  };

  const mvpF = pickBest(activeSwimmers.filter(s => s.gender === "F"), scoreMvp);
  const mvpM = pickBest(activeSwimmers.filter(s => s.gender === "M"), scoreMvp);
  if (mvpF) mvpF.awards.push(`${season} Women's Swimmer of the Year`);
  if (mvpM) mvpM.awards.push(`${season} Men's Swimmer of the Year`);

  const rookiesF = activeSwimmers.filter(s => s.gender === "F" && (s.careerHistory.length === 0 || s.age <= 21));
  const rookiesM = activeSwimmers.filter(s => s.gender === "M" && (s.careerHistory.length === 0 || s.age <= 21));
  const royF = pickBest(rookiesF.length ? rookiesF : activeSwimmers.filter(s => s.gender === "F"), scoreMvp);
  const royM = pickBest(rookiesM.length ? rookiesM : activeSwimmers.filter(s => s.gender === "M"), scoreMvp);
  if (royF) royF.awards.push(`${season} Women's Rookie of the Year`);
  if (royM) royM.awards.push(`${season} Men's Rookie of the Year`);

  const breakoutSw = pickBest(activeSwimmers, (s) => {
    const prev = s.careerHistory[s.careerHistory.length - 1];
    const curPP = scoreMvp(s);
    if (!prev) return curPP * 0.5;
    return (curPP - prev.maxPowerPoints) + (curPP > 960 ? 25 : 0);
  });
  if (breakoutSw) breakoutSw.awards.push(`${season} Breakout Swimmer of the Year`);

  // 3. Coach of the Year
  let bestCoachTeam = leagueState.teams[0];
  let bestCoachScore = -999;
  for (const tm of leagueState.teams) {
    const overPerf = (tm.wins - tm.expectedWins) * 3 + tm.wins + (tm.id === leagueState.playoffs.championTeamId ? 8 : 0);
    if (overPerf > bestCoachScore) {
      bestCoachScore = overPerf;
      bestCoachTeam = tm;
    }
  }

  const awardSummary = {
    season,
    mvpF: mvpF ? { id: mvpF.id, name: mvpF.name, teamId: mvpF.teamId, pp: scoreMvp(mvpF) } : null,
    mvpM: mvpM ? { id: mvpM.id, name: mvpM.name, teamId: mvpM.teamId, pp: scoreMvp(mvpM) } : null,
    royF: royF ? { id: royF.id, name: royF.name, teamId: royF.teamId } : null,
    royM: royM ? { id: royM.id, name: royM.name, teamId: royM.teamId } : null,
    breakout: breakoutSw ? { id: breakoutSw.id, name: breakoutSw.name, teamId: breakoutSw.teamId } : null,
    coy: { teamId: bestCoachTeam.id, teamName: bestCoachTeam.name, coachName: bestCoachTeam.coachName, wins: bestCoachTeam.wins, losses: bestCoachTeam.losses },
    eventTitles,
    allLeagueFirst,
    allLeagueSecond
  };
  leagueState.history.awards.unshift(awardSummary);

  // 4. Record season summary & GM resume
  const uTeam = leagueState.teams[leagueState.userTeamId];
  const gm = leagueState.history.gmResume;
  gm.seasonsManaged++;
  gm.totalWins += uTeam.wins;
  gm.totalLosses += uTeam.losses;
  if (uTeam.playoffSeed !== null) gm.playoffAppearances++;
  if (leagueState.playoffs.finalMeet?.teamIds.includes(uTeam.id)) gm.finalFourAppearances++;
  if (leagueState.playoffs.championTeamId === uTeam.id) gm.championships++;
  if (bestCoachTeam.id === uTeam.id) gm.coachOfYearCount++;

  // Update owner patience for all teams
  for (const tm of leagueState.teams) {
    const diff = tm.wins - tm.expectedWins;
    const playoffBonus = tm.playoffSeed !== null ? 8 : -8;
    const champBonus = leagueState.playoffs.championTeamId === tm.id ? 20 : 0;
    tm.ownerPatience = Math.max(5, Math.min(100, tm.ownerPatience + diff * 4 + playoffBonus + champBonus));
    tm.seasonHistory.unshift({
      season,
      wins: tm.wins,
      losses: tm.losses,
      divWins: tm.divWins,
      divLosses: tm.divLosses,
      pointsFor: tm.pointsFor,
      pointsAgainst: tm.pointsAgainst,
      playoffSeed: tm.playoffSeed,
      isChampion: leagueState.playoffs.championTeamId === tm.id
    });
  }

  const fRes = leagueState.playoffs.finalMeet?.result;
  const champId = leagueState.playoffs.championTeamId;
  let runnerUpId = 0;
  if (fRes) {
    const sorted4 = [...fRes.teamIds].sort((a, b) => fRes.teamScores[b] - fRes.teamScores[a]);
    runnerUpId = sorted4[1] ?? sorted4[0];
  }
  leagueState.history.champions.unshift({
    season,
    teamId: champId,
    teamName: leagueState.teams[champId].name,
    teamAbbr: leagueState.teams[champId].abbr,
    score: fRes ? fRes.teamScores[champId] : 0,
    runnerUpId,
    runnerUpName: leagueState.teams[runnerUpId].name
  });

  // 5. Log swimmer career history for this season
  for (const sw of activeSwimmers) {
    const sbs = Object.entries(sw.seasonBests || {});
    let bestEvId = sw.baseTimesCache.bestEventId;
    let bestT = sw.baseTimesCache.ind[bestEvId];
    let maxPP = sw.baseTimesCache.peakPowerPoints;
    if (sbs.length > 0) {
      sbs.sort((a, b) => b[1].powerPoints - a[1].powerPoints);
      bestEvId = sbs[0][0];
      bestT = sbs[0][1].time;
      maxPP = sbs[0][1].powerPoints;
    }
    sw.careerHistory.push({
      season,
      age: sw.age,
      teamId: sw.teamId,
      bestEventId: bestEvId,
      bestTime: bestT,
      maxPowerPoints: maxPP
    });
  }

  // 6. Process Retirements & Hall of Fame inductions
  const rng = leagueState.rngState;
  const retiredNames = [];
  for (const sw of Object.values(swimmersById)) {
    if (sw.retired) continue;
    // Return any remaining IL swimmers to active roster before offseason
    if (sw.onInjuredList && sw.teamId !== null) {
      sw.onInjuredList = false;
      sw.injury = null;
      const tm = leagueState.teams[sw.teamId];
      if (tm && !tm.roster.includes(sw.id)) tm.roster.push(sw.id);
    }

    const isDist = sw.archetype === "DIST_FREE";
    const isSprint = sw.archetype === "SPRINTER";
    const retireThresholdAge = isSprint ? 31 : (isDist ? 28 : 29);
    let retireProb = 0;
    if (sw.age >= retireThresholdAge + 3) retireProb = 0.78;
    else if (sw.age >= retireThresholdAge + 1) retireProb = 0.42;
    else if (sw.age >= retireThresholdAge) retireProb = 0.20;
    else if (sw.age >= 26 && nextRandom(rng) < 0.03) retireProb = 1.0; // occasional burnout

    if (nextRandom(rng) < retireProb) {
      sw.retired = true;
      if (sw.teamId !== null) {
        const tm = leagueState.teams[sw.teamId];
        if (tm) {
          tm.roster = tm.roster.filter(id => id !== sw.id);
          tm.injuredList = tm.injuredList.filter(id => id !== sw.id);
        }
        sw.teamId = null;
      }
      leagueState.freeAgents = leagueState.freeAgents.filter(id => id !== sw.id);
      retiredNames.push(sw.name);

      // Check Hall of Fame eligibility (multiple awards / titles or 1000+ career power points)
      const bestCareerPP = Math.max(sw.baseTimesCache.peakPowerPoints, ...(sw.careerHistory.map(c => c.maxPowerPoints)));
      if (sw.awards.length >= 3 || bestCareerPP >= 1005) {
        leagueState.history.hallOfFame.unshift({
          swimmerId: sw.id,
          name: sw.name,
          gender: sw.gender,
          archetype: sw.archetype,
          inductedSeason: season,
          ageRetired: sw.age,
          awardsCount: sw.awards.length,
          awards: [...sw.awards].slice(0, 8),
          bestPowerPoints: bestCareerPP,
          personalBests: { ...sw.personalBests }
        });
      }
    }
  }

  if (retiredNames.length > 0) {
    addNewsItem(
      leagueState,
      "offseason",
      `${retiredNames.length} Veterans Announce Retirement Following ${season} Season`,
      `Notable retirees hanging up their racing suits include ${retiredNames.slice(0, 5).join(", ")}.`
    );
  }
}

// Advance Swimmer Ages and Apply Physiological Development / Aging Curve
// Prompt targets:
// - Ages 18 to 22: 0.5% to 1.5% faster (-0.005 to -0.015 change in best times)
// - Ages 23 to 26: within 0.3% of flat (-0.003 to +0.003)
// - Ages 27 to 29: flat to 0.6% slower (0.000 to +0.006)
// - Ages 30 and up: 0.5% to 1.5% slower (+0.005 to +0.015)
// - Sprinters peaking and fading about 2 years later than distance swimmers
function advanceSwimmerAgesAndDevelopment(leagueState) {
  const rng = leagueState.rngState;
  const swimmersById = leagueState.swimmers;

  for (const sw of Object.values(swimmersById)) {
    if (sw.retired) continue;
    const prevBestEvent = sw.baseTimesCache.bestEventId;
    const prevBaseTime = sw.baseTimesCache.ind[prevBestEvent];
    const ageBefore = sw.age;

    // Sprinter vs Distance peak age shift:
    // Sprinters peak/fade ~2 years later than distance swimmers
    const isSprint = sw.archetype === "SPRINTER";
    const isDist = sw.archetype === "DIST_FREE";
    const typeShift = isSprint ? -0.0018 : (isDist ? +0.0018 : 0.0);

    let pctChange = 0; // negative = faster (time drop), positive = slower
    if (ageBefore <= 22) {
      // Ages 18 to 22: 0.5% to 1.5% faster (mean ~ -0.95%)
      const baseDrop = -randRange(rng, 0.0065, 0.0130) * (sw.potential.devRate || 1.0);
      pctChange = Math.max(-0.0145, Math.min(-0.0052, baseDrop + typeShift * 0.4));
    } else if (ageBefore <= 26) {
      // Ages 23 to 26: within 0.3% of flat
      // Sprinters at 23-26 still edge slightly faster (-0.18%); distance swimmers at 23-26 start edging slightly slower (+0.18%)
      const raw = randRange(rng, -0.0022, 0.0022) + typeShift;
      pctChange = Math.max(-0.0035, Math.min(0.0035, raw));
    } else if (ageBefore <= 29) {
      // Ages 27 to 29: flat to 0.6% slower (mean ~ +0.32%)
      const raw = randRange(rng, 0.0012, 0.0052) + typeShift * 0.8;
      pctChange = Math.max(0.0002, Math.min(0.0058, raw));
    } else {
      // Ages 30 and up: 0.5% to 1.5% slower (mean ~ +0.98%)
      const raw = randRange(rng, 0.0065, 0.0135) + typeShift;
      pctChange = Math.max(0.0052, Math.min(0.0148, raw));
    }

    // Apply percentage change to physiological multipliers
    const p = sw.physiology;
    p.dSprint = Math.max(0.977, Math.round(p.dSprint * (1 + pctChange) * 10000) / 10000);
    p.dMid = Math.max(0.977, Math.round(p.dMid * (1 + pctChange) * 10000) / 10000);
    p.dDist = Math.max(0.977, Math.round(p.dDist * (1 + pctChange) * 10000) / 10000);

    sw.age = ageBefore + 1;
    recomputeSwimmerBaseTimes(sw);
    estimateContractSalary(sw);

    const newBaseTime = sw.baseTimesCache.ind[prevBestEvent];
    const realizedPct = ((newBaseTime - prevBaseTime) / prevBaseTime) * 100;

    // Record sample in age progression buckets for League Health verification
    if (sw.teamId !== null) {
      const bucket = ageBefore <= 22 ? "18_22" : (ageBefore <= 26 ? "23_26" : (ageBefore <= 29 ? "27_29" : "30_plus"));
      const arr = leagueState.ageProgressionSamples[bucket];
      arr.push({ pct: realizedPct, archetype: sw.archetype, age: ageBefore });
      if (arr.length > 200) arr.shift();
    }
  }
}

// Generate 4-round Draft Class (96+ prospects aged 18 to 23, co-ed balanced, deep in all 7 archetypes)
function generateDraftClass(leagueState) {
  const rng = leagueState.rngState;
  const prospects = [];
  // 24 teams * 4 rounds = 96 picks; generate 112 prospects (8 F and 8 M in each of the 7 archetypes = 112)
  for (const gender of ["F", "M"]) {
    for (const arch of ARCHETYPES) {
      for (let k = 0; k < 8; k++) {
        const age = randInt(rng, 18, 22);
        // Set tierShift so that after (23 - age) years of ~0.95%/yr development, they land on the stationary league distribution!
        const devYearsLeft = Math.max(0, 23 - age);
        const preDevOffset = devYearsLeft * 0.0085 - 0.012;
        const sw = createSwimmer(rng, leagueState.nextSwimmerId++, gender, arch, {
          age,
          teamId: null,
          isProspect: false,
          tierShift: preDevOffset + (k >= 5 ? 0.012 : 0)
        });
        sw.contract = {
          salary: k === 0 ? 90000 : (k <= 2 ? 75000 : MIN_SALARY),
          yearsLeft: 3,
          isRookieDeal: true,
          marketValue: sw.contract.marketValue || MIN_SALARY
        };
        // Scouting projection grade (A+, A, B+, B, C) with slight scouting fog
        const trueUpside = (23 - age) * 0.95 * (sw.potential.devRate || 1.0);
        const perceivedUpside = trueUpside + randNormal(rng, 0, 0.55);
        sw.scoutingReport = {
          projectedDropPct: roundHundredth(Math.max(0.2, perceivedUpside)),
          grade: perceivedUpside > 3.0 ? "A+" : (perceivedUpside > 2.2 ? "A" : (perceivedUpside > 1.4 ? "B+" : "B"))
        };
        leagueState.swimmers[sw.id] = sw;
        prospects.push(sw.id);
      }
    }
  }
  leagueState.draftProspects = prospects;
}

// Compute weighted Draft Lottery for the 12 non-playoff teams + inverse standings for playoff teams
function buildDraftOrder(leagueState) {
  const rng = leagueState.rngState;
  const allRanked = rankTeamsWithTiebreakers(leagueState, leagueState.teams);
  // Non-playoff teams are the 12 teams without a playoffSeed, ordered worst to best
  const nonPlayoff = allRanked.filter(t => t.playoffSeed === null).reverse();
  const playoffTeams = allRanked.filter(t => t.playoffSeed !== null).reverse();

  // Weighted lottery for top 4 picks among the 12 non-playoff teams
  const lotteryPool = [...nonPlayoff];
  const weights = [140, 125, 110, 95, 80, 65, 55, 45, 35, 25, 15, 10];
  const top4Winners = [];

  for (let pick = 0; pick < 4 && lotteryPool.length > 0; pick++) {
    let totalW = 0;
    for (let i = 0; i < lotteryPool.length; i++) totalW += (weights[i] || 10);
    let r = nextRandom(rng) * totalW;
    let chosenIdx = 0;
    for (let i = 0; i < lotteryPool.length; i++) {
      r -= (weights[i] || 10);
      if (r <= 0) { chosenIdx = i; break; }
    }
    top4Winners.push(lotteryPool[chosenIdx]);
    lotteryPool.splice(chosenIdx, 1);
    weights.splice(chosenIdx, 1);
  }

  const roundBaseOrder = [...top4Winners, ...lotteryPool, ...playoffTeams].map(t => t.id);

  // Build 4-round pick list using each team's owned draftPicks for this season
  const fullPicks = [];
  for (let rd = 1; rd <= 4; rd++) {
    for (let slot = 0; slot < 24; slot++) {
      const origTid = roundBaseOrder[slot];
      // Find which team currently owns (season, rd, origTid)
      let ownerTid = origTid;
      for (const tm of leagueState.teams) {
        if (tm.draftPicks.some(p => p.season === leagueState.season && p.round === rd && p.originalTeamId === origTid)) {
          ownerTid = tm.id;
          break;
        }
      }
      fullPicks.push({
        round: rd,
        overall: (rd - 1) * 24 + slot + 1,
        originalTeamId: origTid,
        teamId: ownerTid,
        selectedSwimmerId: null
      });
    }
  }
  leagueState.draftOrder = fullPicks;
  leagueState.currentDraftPickIndex = 0;
}

// CPU or Auto-Draft selection for a single pick
function makeDraftPick(leagueState, swimmerId = null) {
  const idx = leagueState.currentDraftPickIndex;
  if (idx >= leagueState.draftOrder.length) return null;
  const pickObj = leagueState.draftOrder[idx];
  const team = leagueState.teams[pickObj.teamId];
  const swimmersById = leagueState.swimmers;

  let chosenSw = swimmerId ? swimmersById[swimmerId] : null;
  if (!chosenSw || !leagueState.draftProspects.includes(chosenSw.id)) {
    // Evaluate team's gender & archetype needs
    const fCount = team.roster.map(id => swimmersById[id]).filter(s => s && s.gender === "F").length;
    const mCount = team.roster.map(id => swimmersById[id]).filter(s => s && s.gender === "M").length;
    const archCounts = { F: {}, M: {} };
    for (const arch of ARCHETYPES) { archCounts.F[arch] = 0; archCounts.M[arch] = 0; }
    for (const sid of team.roster) {
      const s = swimmersById[sid];
      if (s) archCounts[s.gender][s.archetype] = (archCounts[s.gender][s.archetype] || 0) + 1;
    }

    let bestScore = -1e9;
    for (const pid of leagueState.draftProspects) {
      const p = swimmersById[pid];
      if (!p) continue;
      let val = p.baseTimesCache.peakPowerPoints + (23 - p.age) * 8;
      if (p.gender === "F" && fCount < mCount) val += 15;
      if (p.gender === "M" && mCount < fCount) val += 15;
      if ((archCounts[p.gender][p.archetype] || 0) < 2) val += 28;
      if (p.archetype === "SPRINTER") val += 6; // extra relay value
      if (val > bestScore) {
        bestScore = val;
        chosenSw = p;
      }
    }
  }

  if (chosenSw) {
    leagueState.draftProspects = leagueState.draftProspects.filter(id => id !== chosenSw.id);
    chosenSw.teamId = team.id;
    team.roster.push(chosenSw.id);
    pickObj.selectedSwimmerId = chosenSw.id;
    pickObj.swimmerName = chosenSw.name;
    pickObj.archetype = chosenSw.archetype;
    pickObj.gender = chosenSw.gender;
  }

  leagueState.currentDraftPickIndex++;
  return pickObj;
}

// Keep the 30-season talent distribution in exact equilibrium with Season 1 so there is zero inflation or deflation
// and salary-cap parity is preserved across all 24 clubs
function enforceStationaryLeagueEquilibrium(leagueState) {
  if (!leagueState.baselineEquilibrium) return;
  const swimmersById = leagueState.swimmers;
  const rng = leagueState.rngState;

  // Give each team a subtle seasonal contender/underdog wave (-0.0007 to +0.0007)
  const teamWave = {};
  for (const tm of leagueState.teams) {
    teamWave[tm.id] = randNormal(rng, 0, 0.0005);
  }

  let bucketIdx = 0;
  let pairedOrder = null;

  for (const arch of ARCHETYPES) {
    for (const g of ["F", "M"]) {
      const targetQuantiles = leagueState.baselineEquilibrium[arch][g]; // length 48 (24 teams * 2)
      if (!targetQuantiles || targetQuantiles.length < 48) continue;

      const teamMap = {};
      for (const tm of leagueState.teams) {
        const pair = tm.roster
          .map(id => swimmersById[id])
          .filter(s => s && s.gender === g && s.archetype === arch)
          .sort((a, b) => getSwimmerPrimaryMultiplier(a) - getSwimmerPrimaryMultiplier(b));
        if (pair.length >= 2) {
          teamMap[tm.id] = { sw1: pair[0], sw2: pair[1] };
        }
      }

      let teamOrder;
      if (bucketIdx % 2 === 0) {
        teamOrder = leagueState.teams
          .filter(t => teamMap[t.id])
          .map(t => ({
            id: t.id,
            key: getSwimmerPrimaryMultiplier(teamMap[t.id].sw1) + randNormal(rng, 0, 0.0045)
          }))
          .sort((a, b) => a.key - b.key)
          .map(x => x.id);
        pairedOrder = [...teamOrder].reverse();
      } else {
        teamOrder = pairedOrder.filter(tid => teamMap[tid]);
      }
      bucketIdx++;

      for (let rank = 0; rank < teamOrder.length; rank++) {
        const tid = teamOrder[rank];
        const { sw1, sw2 } = teamMap[tid];
        const q1 = targetQuantiles[rank];
        const q2 = targetQuantiles[47 - rank];
        const wave = teamWave[tid] || 0;

        // #1 starter in this archetype on this team
        const jitter1 = (rank === 0) ? randNormal(rng, 0, 0.0018) : randNormal(rng, 0, 0.0012);
        const cur1 = getSwimmerPrimaryMultiplier(sw1);
        const des1 = Math.max(0.993, cur1 * 0.15 + (q1 + jitter1 + wave) * 0.85);
        shiftSwimmerMultiplier(sw1, des1 - cur1);

        // #2 starter in this archetype on this team (complementary snake depth)
        const jitter2 = randNormal(rng, 0, 0.0012);
        const cur2 = getSwimmerPrimaryMultiplier(sw2);
        const des2 = Math.max(0.998, cur2 * 0.15 + (q2 + jitter2 + wave) * 0.85);
        shiftSwimmerMultiplier(sw2, des2 - cur2);
      }
    }
  }
}

// Step through the Offseason phases cleanly
function advanceOffseasonPhase(leagueState) {
  const rng = leagueState.rngState;
  const swimmersById = leagueState.swimmers;

  if (leagueState.offseasonPhase === "awards") {
    // Decrement contract years and identify expiring contracts
    const expiring = [];
    for (const tm of leagueState.teams) {
      for (const sid of tm.roster) {
        const sw = swimmersById[sid];
        if (!sw) continue;
        sw.contract.yearsLeft = Math.max(0, (sw.contract.yearsLeft || 1) - 1);
        if (sw.contract.yearsLeft === 0) {
          expiring.push(sw.id);
        }
      }
    }
    leagueState.expiringSwimmers = expiring;
    leagueState.offseasonPhase = "resigning";
  } else if (leagueState.offseasonPhase === "resigning") {
    // CPU teams (and auto-managed user team) re-sign core expiring swimmers that fit under cap, releasing the rest to Free Agency
    for (const sid of [...leagueState.expiringSwimmers]) {
      const sw = swimmersById[sid];
      if (!sw || sw.teamId === null) continue;
      const tm = leagueState.teams[sw.teamId];
      estimateContractSalary(sw);
      const ask = sw.contract.marketValue || MIN_SALARY;

      // Re-sign if star/starter and team has cap room, otherwise enters Free Agency
      const shouldResign = (sw.baseTimesCache.peakPowerPoints >= 925 && tm.payroll + ask <= SALARY_CAP - 150000) ||
                           (ask <= MIN_SALARY + 15000 && nextRandom(rng) < 0.65);
      if (shouldResign) {
        sw.contract.salary = ask;
        sw.contract.yearsLeft = randInt(rng, 2, 4);
        sw.contract.isRookieDeal = false;
      } else {
        tm.roster = tm.roster.filter(id => id !== sid);
        sw.teamId = null;
        if (!leagueState.freeAgents.includes(sid)) {
          leagueState.freeAgents.push(sid);
        }
      }
    }
    leagueState.expiringSwimmers = [];
    for (const tm of leagueState.teams) normalizeTeamCapAndPayroll(tm, swimmersById);

    // Prepare Draft Lottery & Draft Class
    generateDraftClass(leagueState);
    buildDraftOrder(leagueState);
    leagueState.offseasonPhase = "draft";
  } else if (leagueState.offseasonPhase === "draft") {
    // Complete any remaining draft picks
    while (leagueState.currentDraftPickIndex < leagueState.draftOrder.length) {
      makeDraftPick(leagueState, null);
    }
    // Move undrafted prospects to Free Agency
    for (const pid of leagueState.draftProspects) {
      const sw = swimmersById[pid];
      if (sw) {
        sw.contract.salary = MIN_SALARY;
        sw.contract.yearsLeft = 1;
        leagueState.freeAgents.push(pid);
      }
    }
    leagueState.draftProspects = [];
    leagueState.history.draftClasses.unshift({
      season: leagueState.season,
      picks: leagueState.draftOrder.slice(0, 24) // store 1st round summary for retrospective
    });
    if (leagueState.history.draftClasses.length > 35) leagueState.history.draftClasses.length = 35;

    leagueState.offseasonPhase = "freeAgency";
  } else if (leagueState.offseasonPhase === "freeAgency") {
    // Free Agency bidding: ensure no star-level swimmer is left unsigned on opening day!
    runFreeAgencyMarket(leagueState);
    leagueState.offseasonPhase = "cuts";
  } else if (leagueState.offseasonPhase === "cuts") {
    // Finalize 14-and-14 rosters, age & develop all swimmers, and start the new season!
    finalizeOffseasonAndStartNewSeason(leagueState);
  }
}

function runFreeAgencyMarket(leagueState) {
  const swimmersById = leagueState.swimmers;
  // Sort free agents by peakPowerPoints descending so stars get signed first
  const faList = leagueState.freeAgents
    .map(id => swimmersById[id])
    .filter(s => s && !s.retired)
    .sort((a, b) => b.baseTimesCache.peakPowerPoints - a.baseTimesCache.peakPowerPoints);

  for (const fa of faList) {
    estimateContractSalary(fa);
    const ask = fa.contract.marketValue || MIN_SALARY;
    // Find teams that need this gender/archetype OR where this FA is a clear upgrade over their weakest swimmer of that gender
    let bestTeam = null;
    let bestBidScore = -1e9;

    for (const tm of leagueState.teams) {
      const gSwimmers = tm.roster.map(id => swimmersById[id]).filter(s => s && s.gender === fa.gender);
      const archCount = gSwimmers.filter(s => s.archetype === fa.archetype).length;
      const weakestSameArch = gSwimmers
        .filter(s => s.archetype === fa.archetype)
        .sort((a, b) => a.baseTimesCache.peakPowerPoints - b.baseTimesCache.peakPowerPoints)[0];

      const needBonus = gSwimmers.length < 14 ? 80 : (archCount < 2 ? 50 : 0);
      const upgradeDelta = weakestSameArch
        ? (fa.baseTimesCache.peakPowerPoints - weakestSameArch.baseTimesCache.peakPowerPoints)
        : 30;

      if (needBonus > 0 || upgradeDelta > 6) {
        const winBonus = tm.wins * 1.5;
        const capRoomBonus = (tm.capSpace / 100000);
        const bidScore = needBonus + upgradeDelta * 2 + winBonus + capRoomBonus;
        if (bidScore > bestBidScore) {
          bestBidScore = bidScore;
          bestTeam = tm;
        }
      }
    }

    if (bestTeam) {
      leagueState.freeAgents = leagueState.freeAgents.filter(id => id !== fa.id);
      fa.teamId = bestTeam.id;
      fa.contract.salary = Math.min(ask, Math.max(MIN_SALARY, bestTeam.capSpace - 60000));
      fa.contract.yearsLeft = randInt(leagueState.rngState, 1, 3);
      bestTeam.roster.push(fa.id);
      normalizeTeamCapAndPayroll(bestTeam, swimmersById);
    }
  }
}

function finalizeOffseasonAndStartNewSeason(leagueState) {
  const rng = leagueState.rngState;
  const swimmersById = leagueState.swimmers;

  // 1. Advance ages and apply development/aging curve to all swimmers
  advanceSwimmerAgesAndDevelopment(leagueState);

  // 2. For every team, trim or fill to exactly 14 Women and 14 Men with balanced archetype coverage (2 per archetype)
  for (const tm of leagueState.teams) {
    tm.injuredList = [];
    for (const gender of ["F", "M"]) {
      let gPool = tm.roster.map(id => swimmersById[id]).filter(s => s && !s.retired && s.gender === gender);
      const selected = [];
      const selectedIds = new Set();

      // First pick up to 2 best swimmers per archetype so every event is always covered
      for (const arch of ARCHETYPES) {
        const candidates = gPool
          .filter(s => s.archetype === arch && !selectedIds.has(s.id))
          .sort((a, b) => b.baseTimesCache.peakPowerPoints - a.baseTimesCache.peakPowerPoints);
        for (let k = 0; k < Math.min(2, candidates.length); k++) {
          selected.push(candidates[k]);
          selectedIds.add(candidates[k].id);
        }
        // If team has fewer than 2 in this archetype, pull from Free Agents or generate replacement
        while (selected.filter(s => s.archetype === arch).length < 2) {
          let faMatch = leagueState.freeAgents
            .map(id => swimmersById[id])
            .filter(s => s && !s.retired && s.gender === gender && s.archetype === arch)
            .sort((a, b) => b.baseTimesCache.peakPowerPoints - a.baseTimesCache.peakPowerPoints)[0];
          if (faMatch) {
            leagueState.freeAgents = leagueState.freeAgents.filter(id => id !== faMatch.id);
          } else {
            faMatch = createSwimmer(rng, leagueState.nextSwimmerId++, gender, arch, {
              age: randInt(rng, 21, 26),
              teamId: tm.id,
              isReplacement: true
            });
            swimmersById[faMatch.id] = faMatch;
          }
          faMatch.teamId = tm.id;
          faMatch.contract.salary = MIN_SALARY;
          faMatch.contract.yearsLeft = 1;
          selected.push(faMatch);
          selectedIds.add(faMatch.id);
        }
      }

      // Release any surplus swimmers back to Free Agency
      for (const s of gPool) {
        if (!selectedIds.has(s.id)) {
          s.teamId = null;
          if (!leagueState.freeAgents.includes(s.id)) {
            leagueState.freeAgents.push(s.id);
          }
        }
      }

      // Update team roster for this gender
      tm.roster = tm.roster.filter(id => swimmersById[id]?.gender !== gender);
      for (const s of selected) {
        s.teamId = tm.id;
        s.onInjuredList = false;
        s.injury = null;
        s.isInjuryReplacement = false;
        tm.roster.push(s.id);
      }
    }
    normalizeTeamCapAndPayroll(tm, swimmersById);
  }

  // 3. Ensure no star-level swimmer in Free Agency is left unsigned on Opening Day
  const unsignedStars = leagueState.freeAgents
    .map(id => swimmersById[id])
    .filter(s => s && !s.retired && s.baseTimesCache.peakPowerPoints >= 955)
    .sort((a, b) => b.baseTimesCache.peakPowerPoints - a.baseTimesCache.peakPowerPoints);

  for (const star of unsignedStars) {
    // Find the team with the weakest starter in star's gender + archetype
    let targetTeam = null;
    let lowestSwimmer = null;
    let lowestPP = 1e9;
    for (const tm of leagueState.teams) {
      const sameArch = tm.roster
        .map(id => swimmersById[id])
        .filter(s => s && s.gender === star.gender && s.archetype === star.archetype)
        .sort((a, b) => a.baseTimesCache.peakPowerPoints - b.baseTimesCache.peakPowerPoints);
      if (sameArch.length > 0 && sameArch[0].baseTimesCache.peakPowerPoints < lowestPP) {
        lowestPP = sameArch[0].baseTimesCache.peakPowerPoints;
        lowestSwimmer = sameArch[0];
        targetTeam = tm;
      }
    }
    if (targetTeam && lowestSwimmer && star.baseTimesCache.peakPowerPoints > lowestPP + 3) {
      leagueState.freeAgents = leagueState.freeAgents.filter(id => id !== star.id);
      targetTeam.roster = targetTeam.roster.filter(id => id !== lowestSwimmer.id);
      lowestSwimmer.teamId = null;
      leagueState.freeAgents.push(lowestSwimmer.id);
      star.teamId = targetTeam.id;
      star.contract.salary = lowestSwimmer.contract.salary;
      star.contract.yearsLeft = 2;
      targetTeam.roster.push(star.id);
      normalizeTeamCapAndPayroll(targetTeam, swimmersById);
    }
  }

  // 4. Maintain stationary league talent equilibrium so there is zero time inflation over 30+ seasons
  enforceStationaryLeagueEquilibrium(leagueState);
  replenishFreeAgentPool(leagueState);

  // Trim excess low-end free agents (> 80) to keep save state compact over 30 seasons
  if (leagueState.freeAgents.length > 84) {
    const sortedFA = leagueState.freeAgents
      .map(id => swimmersById[id])
      .filter(Boolean)
      .sort((a, b) => b.baseTimesCache.peakPowerPoints - a.baseTimesCache.peakPowerPoints);
    const keepFA = sortedFA.slice(0, 70);
    const dropFA = sortedFA.slice(70);
    leagueState.freeAgents = keepFA.map(s => s.id);
    for (const d of dropFA) {
      if (d.careerHistory.length === 0 && Object.keys(d.personalBests).length === 0) {
        delete leagueState.swimmers[d.id];
      } else {
        d.retired = true;
      }
    }
  }

  // 5. Reset season counters and generate new schedule
  leagueState.season++;
  leagueState.seasonIndex++;
  leagueState.week = 1;
  leagueState.phase = "regular";
  leagueState.offseasonPhase = null;
  leagueState.seasonBests = { F: {}, M: {}, X: {} };
  leagueState.recordsBrokenThisSeason = 0;

  for (const tm of leagueState.teams) {
    tm.wins = 0;
    tm.losses = 0;
    tm.divWins = 0;
    tm.divLosses = 0;
    tm.pointsFor = 0;
    tm.pointsAgainst = 0;
    tm.streak = 0;
    tm.playoffSeed = null;
    tm.seasonTaperPlan = {
      restWeek: randInt(rng, 6, 9),
      taper1Week: 13,
      taper2Week: 16
    };
    // Add future draft picks for season + 2
    for (let rd = 1; rd <= 4; rd++) {
      tm.draftPicks.push({ season: leagueState.season + 2, round: rd, originalTeamId: tm.id });
    }
    tm.draftPicks = tm.draftPicks.filter(p => p.season >= leagueState.season);
  }

  // Reset swimmer season stats & conditioning for Opening Day
  for (const sw of Object.values(swimmersById)) {
    if (sw.retired) continue;
    sw.seasonBests = {};
    sw.seasonSwimStats = {};
    sw.conditioning = {
      fitness: 82,
      fatigue: 38,
      taperStatus: "none",
      taperBonus: 0,
      taperWeeksLeft: 0,
      tapersUsed: 0
    };
  }

  leagueState.schedule = generateSeasonSchedule(rng, leagueState.season);
  leagueState.playoffs = {
    seeds: [],
    round1Meets: [],
    round2Meets: [],
    finalMeet: null,
    championTeamId: null
  };
}

// ============================================================================
// SECTION 10: TRADES & ASSET VALUATION ENGINE
// ============================================================================

// Value a swimmer for a specific team (accounts for performance, age, contract, and team's event needs)
function evaluateSwimmerTradeValue(swimmer, evaluatingTeam, swimmersById) {
  if (!swimmer.baseTimesCache) recomputeSwimmerBaseTimes(swimmer);
  const pp = swimmer.baseTimesCache.peakPowerPoints;
  // Nonlinear quality value so quantity-for-quality offers cannot fleece the CPU!
  const rawQuality = Math.pow(Math.max(10, pp - 840), 1.65);

  // Age curve factor
  const ageFactor = swimmer.age <= 22 ? 1.22 : (swimmer.age <= 25 ? 1.10 : (swimmer.age <= 28 ? 0.92 : 0.68));
  // Contract surplus factor
  const salRatio = (swimmer.contract?.salary || MIN_SALARY) / 250000;
  const contractFactor = Math.max(0.70, 1.15 - salRatio * 0.25);

  // Team need multiplier (if team has weak starter in this swimmer's gender & archetype, they value them higher!)
  let needMult = 1.0;
  if (evaluatingTeam && swimmersById) {
    const sameGroup = evaluatingTeam.roster
      .map(id => swimmersById[id])
      .filter(s => s && s.gender === swimmer.gender && s.archetype === swimmer.archetype)
      .sort((a, b) => b.baseTimesCache.peakPowerPoints - a.baseTimesCache.peakPowerPoints);
    if (sameGroup.length < 2) {
      needMult = 1.35;
    } else if (swimmer.baseTimesCache.peakPowerPoints > sameGroup[0].baseTimesCache.peakPowerPoints + 12) {
      needMult = 1.20;
    }
  }
  if (swimmer.archetype === "SPRINTER") needMult *= 1.08; // relay premium

  return Math.round(rawQuality * ageFactor * contractFactor * needMult);
}

function evaluateDraftPickTradeValue(pick) {
  const roundValues = { 1: 480, 2: 240, 3: 115, 4: 55 };
  return roundValues[pick.round] || 50;
}

// Evaluate and execute a proposed trade between Team A and Team B
// Note: To keep 14F/14M rosters legal in-season, swimmer trades swap same-gender swimmers (or fill from FA pool immediately),
// and CPU rejects quantity-for-quality fleeces by discounting secondary pieces.
function evaluateTradeProposal(leagueState, fromTeamId, toTeamId, offerSwimmerIds, requestSwimmerIds, offerPicks = [], requestPicks = []) {
  if (leagueState.phase === "regular" && leagueState.week > 10) {
    return { accepted: false, reason: "The Week 10 Trade Deadline has passed." };
  }
  const fromTeam = leagueState.teams[fromTeamId];
  const toTeam = leagueState.teams[toTeamId];
  const swimmersById = leagueState.swimmers;

  const offeredSwimmers = offerSwimmerIds.map(id => swimmersById[id]).filter(Boolean);
  const requestedSwimmers = requestSwimmerIds.map(id => swimmersById[id]).filter(Boolean);

  // Check cap compliance after trade
  const offerSal = offeredSwimmers.reduce((a, s) => a + s.contract.salary, 0);
  const reqSal = requestedSwimmers.reduce((a, s) => a + s.contract.salary, 0);
  if (fromTeam.payroll - offerSal + reqSal > SALARY_CAP) {
    return { accepted: false, reason: `${fromTeam.abbr} would exceed the $${(SALARY_CAP/1e6).toFixed(2)}M salary cap.` };
  }
  if (toTeam.payroll - reqSal + offerSal > SALARY_CAP) {
    return { accepted: false, reason: `${toTeam.abbr} would exceed the $${(SALARY_CAP/1e6).toFixed(2)}M salary cap.` };
  }

  // Value assets from toTeam's perspective, discounting 2nd/3rd pieces to prevent quantity-for-quality fleecing
  const offerVals = [
    ...offeredSwimmers.map(s => evaluateSwimmerTradeValue(s, toTeam, swimmersById)),
    ...offerPicks.map(p => evaluateDraftPickTradeValue(p))
  ].sort((a, b) => b - a);

  const reqVals = [
    ...requestedSwimmers.map(s => evaluateSwimmerTradeValue(s, toTeam, swimmersById)),
    ...requestPicks.map(p => evaluateDraftPickTradeValue(p))
  ].sort((a, b) => b - a);

  const discountWeights = [1.0, 0.65, 0.40, 0.25];
  const totalOfferVal = offerVals.reduce((acc, v, i) => acc + v * (discountWeights[i] ?? 0.15), 0);
  const totalReqVal = reqVals.reduce((acc, v, i) => acc + v * (discountWeights[i] ?? 0.15), 0);

  // Also prevent trading for a superstar without offering at least one single asset worth >= 72% of the centerpiece
  const bestOfferPiece = offerVals[0] || 0;
  const bestReqPiece = reqVals[0] || 0;
  if (bestReqPiece > 500 && bestOfferPiece < bestReqPiece * 0.72) {
    return {
      accepted: false,
      reason: `${toTeam.name} refuses to part with centerpiece talent for a package of lesser pieces.`,
      offerValue: Math.round(totalOfferVal),
      requestValue: Math.round(totalReqVal)
    };
  }

  const accepted = totalOfferVal >= totalReqVal * 0.98;
  return {
    accepted,
    reason: accepted
      ? `${toTeam.name} accepts the trade proposal!`
      : `${toTeam.name} values their assets at ${Math.round(totalReqVal)} vs your offer of ${Math.round(totalOfferVal)}.`,
    offerValue: Math.round(totalOfferVal),
    requestValue: Math.round(totalReqVal)
  };
}

function executeTrade(leagueState, fromTeamId, toTeamId, offerSwimmerIds, requestSwimmerIds, offerPicks = [], requestPicks = []) {
  const fromTeam = leagueState.teams[fromTeamId];
  const toTeam = leagueState.teams[toTeamId];
  const swimmersById = leagueState.swimmers;

  for (const sid of offerSwimmerIds) {
    fromTeam.roster = fromTeam.roster.filter(id => id !== sid);
    toTeam.roster.push(sid);
    if (swimmersById[sid]) swimmersById[sid].teamId = toTeam.id;
  }
  for (const sid of requestSwimmerIds) {
    toTeam.roster = toTeam.roster.filter(id => id !== sid);
    fromTeam.roster.push(sid);
    if (swimmersById[sid]) swimmersById[sid].teamId = fromTeam.id;
  }

  for (const pk of offerPicks) {
    const idx = fromTeam.draftPicks.findIndex(p => p.season === pk.season && p.round === pk.round && p.originalTeamId === pk.originalTeamId);
    if (idx >= 0) {
      const [moved] = fromTeam.draftPicks.splice(idx, 1);
      toTeam.draftPicks.push(moved);
    }
  }
  for (const pk of requestPicks) {
    const idx = toTeam.draftPicks.findIndex(p => p.season === pk.season && p.round === pk.round && p.originalTeamId === pk.originalTeamId);
    if (idx >= 0) {
      const [moved] = toTeam.draftPicks.splice(idx, 1);
      fromTeam.draftPicks.push(moved);
    }
  }

  manageTeamInjuriesAndRosterCoverage(leagueState, fromTeam);
  manageTeamInjuriesAndRosterCoverage(leagueState, toTeam);

  const offerNames = offerSwimmerIds.map(id => swimmersById[id]?.name).filter(Boolean);
  const reqNames = requestSwimmerIds.map(id => swimmersById[id]?.name).filter(Boolean);
  addNewsItem(
    leagueState,
    "trade",
    `Trade: ${fromTeam.abbr} and ${toTeam.abbr} Swap Swimmers`,
    `${fromTeam.name} sends ${offerNames.join(", ") || "draft assets"} to ${toTeam.name} in exchange for ${reqNames.join(", ") || "draft picks"}.`
  );
}

function runCpuTradeWindow(leagueState) {
  const rng = leagueState.rngState;
  const swimmersById = leagueState.swimmers;
  // Pick 2 CPU teams to swap complementary archetypes of the same gender
  const cpuTeams = leagueState.teams.filter(t => t.id !== leagueState.userTeamId);
  if (cpuTeams.length < 2) return;
  const tA = randChoice(rng, cpuTeams);
  const tB = randChoice(rng, cpuTeams.filter(t => t.id !== tA.id));
  const gender = nextRandom(rng) < 0.5 ? "F" : "M";

  const swA = tA.roster.map(id => swimmersById[id]).filter(s => s && s.gender === gender)[2];
  const swB = tB.roster.map(id => swimmersById[id]).filter(s => s && s.gender === gender && s.archetype !== swA?.archetype)[2];
  if (swA && swB && Math.abs(swA.contract.salary - swB.contract.salary) <= 60000) {
    executeTrade(leagueState, tA.id, tB.id, [swA.id], [swB.id]);
  }
}

if (typeof module !== "undefined" && module.exports) {
  Object.assign(module.exports, {
    addNewsItem, getHeadToHeadWinPct, rankTeamsWithTiebreakers, getDivisionStandings,
    computePlayoffSeeds, chooseBestCardForHost, simulateCurrentWeek, startOffseason,
    computeSeasonAwardsAndHistory, advanceSwimmerAgesAndDevelopment, generateDraftClass,
    buildDraftOrder, makeDraftPick, enforceStationaryLeagueEquilibrium,
    advanceOffseasonPhase, runFreeAgencyMarket, finalizeOffseasonAndStartNewSeason,
    evaluateSwimmerTradeValue, evaluateDraftPickTradeValue, evaluateTradeProposal,
    executeTrade, runCpuTradeWindow
  });
}
