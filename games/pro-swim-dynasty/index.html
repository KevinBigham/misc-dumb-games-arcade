function triggerInGameLeagueHealth(numSeasons) {
  const st = APP_UI.state;
  if (!st || APP_UI.healthRunning) return;
  APP_UI.healthRunning = true;
  renderEntireApp();

  setTimeout(() => {
    try {
      const rpt = runLeagueHealthSimulation(st, numSeasons, (done, tot) => {
        const lbl = document.getElementById("health-progress-label");
        if (lbl) lbl.textContent = `Season ${done} / ${tot}`;
      });
      APP_UI.healthReport = rpt;
    } catch (err) {
      showToast("League Health run error: " + err.message, "error");
    } finally {
      APP_UI.healthRunning = false;
      renderEntireApp();
    }
  }, 40);
}

function renderHealthReportDetails(rpt) {
  const flagBadge = ok => `<span class="badge ${ok ? "badge-success" : "badge-danger"}">${ok ? "PASS" : "FLAG"}</span>`;

  const renderIndTable = (g, label) => {
    const rows = rpt.eventTable[g]
      .map(
        r => `
        <tr>
          <td><strong>${escapeHtml(r.eventName)}</strong></td>
          <td>${formatTime(r.benchmark)}</td>
          <td><strong>${formatTime(r.r1)}</strong> (${r.r1DiffPct >= 0 ? "+" : ""}${r.r1DiffPct.toFixed(2)}%) ${flagBadge(r.r1Ok)}</td>
          <td><strong>${formatTime(r.r8)}</strong> (+${r.r8BehindPct.toFixed(2)}%) ${flagBadge(r.r8Ok)}</td>
          <td><strong>${formatTime(r.r50)}</strong> (+${r.r50BehindPct.toFixed(2)}%) ${flagBadge(r.r50Ok)}</td>
        </tr>
      `
      )
      .join("");
    return `
      <div class="mt-12">
        <h4>${escapeHtml(label)} Individual Events (${rpt.numSeasons}-Season Mean)</h4>
        <div class="table-scroll">
          <table class="data-table compact-table">
            <thead><tr><th>Event</th><th>Benchmark</th><th>#1 Season Best (±1.0%)</th><th>#8 Swimmer (+1.5%..3.0%)</th><th>#50 Swimmer (+4.0%..6.0%)</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    `;
  };

  const relayRows = rpt.relayTable
    .map(
      r => `
      <tr>
        <td><strong>${escapeHtml(r.name)} (${r.gender})</strong></td>
        <td>${formatTime(r.benchmark)}</td>
        <td><strong>${formatTime(r.r1)}</strong> (${r.diffPct >= 0 ? "+" : ""}${r.diffPct.toFixed(2)}%) ${flagBadge(r.ok)}</td>
      </tr>
    `
    )
    .join("");

  const recBySeasonStr = Object.entries(rpt.recordsBrokenBySeason)
    .map(([s, cnt]) => `S${s}: <strong>${cnt}</strong>`)
    .join(" • ");

  const champsStr = Object.entries(rpt.champsByTeam)
    .sort((a, b) => b[1] - a[1])
    .map(([ab, c]) => `${ab}: <strong>${c}</strong>`)
    .join(" • ");

  const a18Ok = rpt.ageChangeByBucket["18_22"] <= -0.5 && rpt.ageChangeByBucket["18_22"] >= -1.5;
  const a23Ok = Math.abs(rpt.ageChangeByBucket["23_26"]) <= 0.3;
  const a27Ok = rpt.ageChangeByBucket["27_29"] >= 0.0 && rpt.ageChangeByBucket["27_29"] <= 0.6;
  const a30Ok = rpt.ageChangeByBucket["30_plus"] >= 0.5 && rpt.ageChangeByBucket["30_plus"] <= 1.5;

  return `
    <div class="health-summary-wrap mt-12">
      <div class="awards-summary-grid">
        <div class="award-mini-card">
          <span class="award-label">Hard Invariants</span>
          <strong>${rpt.invariantViolations.length} Violations</strong>
          ${flagBadge(rpt.invariantViolations.length === 0)}
        </div>
        <div class="award-mini-card">
          <span class="award-label">Save Size (${rpt.numSeasons} Seasons)</span>
          <strong>${(rpt.saveBytes / 1024).toFixed(1)} KB / 2048 KB</strong>
          ${flagBadge(rpt.saveBytes <= 2 * 1024 * 1024)}
        </div>
        <div class="award-mini-card">
          <span class="award-label">Untapered vs Tapered</span>
          <strong>+${rpt.avgUntaperedDiffPct.toFixed(2)}% (2.0–3.0%)</strong>
          ${flagBadge(rpt.avgUntaperedDiffPct >= 2.0 && rpt.avgUntaperedDiffPct <= 3.0)}
        </div>
        <div class="award-mini-card">
          <span class="award-label">Flying Exchange Gain</span>
          <strong>-${rpt.avgExchangeGain.toFixed(3)}s (0.40–0.70s)</strong>
          ${flagBadge(rpt.avgExchangeGain >= 0.40 && rpt.avgExchangeGain <= 0.70)}
        </div>
        <div class="award-mini-card">
          <span class="award-label">Relay Early-Takeoff DQ</span>
          <strong>${rpt.relayDqRatePct.toFixed(2)}% (0.5–1.5%)</strong>
          ${flagBadge(rpt.relayDqRatePct >= 0.5 && rpt.relayDqRatePct <= 1.5)}
        </div>
        <div class="award-mini-card">
          <span class="award-label">Dual Favorite Win Rate</span>
          <strong>${rpt.favWinPct.toFixed(1)}% (75–85%)</strong>
          ${flagBadge(rpt.favWinPct >= 75 && rpt.favWinPct <= 85)}
        </div>
        <div class="award-mini-card">
          <span class="award-label">Open Entering Last Relay</span>
          <strong>${rpt.openLastRelayPct.toFixed(1)}% (12–25%)</strong>
          ${flagBadge(rpt.openLastRelayPct >= 12 && rpt.openLastRelayPct <= 25)}
        </div>
        <div class="award-mini-card">
          <span class="award-label">Projected Within 15 Pts</span>
          <strong>${rpt.projWithin15Pct.toFixed(1)}% (≥40%)</strong>
          ${flagBadge(rpt.projWithin15Pct >= 40)}
        </div>
        <div class="award-mini-card">
          <span class="award-label">Aging 18–22 / 23–26</span>
          <strong>${rpt.ageChangeByBucket["18_22"].toFixed(2)}% / ${rpt.ageChangeByBucket["23_26"].toFixed(2)}%</strong>
          ${flagBadge(a18Ok && a23Ok)}
        </div>
        <div class="award-mini-card">
          <span class="award-label">Aging 27–29 / 30+</span>
          <strong>+${rpt.ageChangeByBucket["27_29"].toFixed(2)}% / +${rpt.ageChangeByBucket["30_plus"].toFixed(2)}%</strong>
          ${flagBadge(a27Ok && a30Ok)}
        </div>
        <div class="award-mini-card">
          <span class="award-label">30-Yr Drift (#1 / #50)</span>
          <strong>${rpt.inflationR1DiffPct.toFixed(3)}% / ${rpt.inflationR50DiffPct.toFixed(3)}% (≤0.5%)</strong>
          ${flagBadge(rpt.inflationR1DiffPct <= 0.5 && rpt.inflationR50DiffPct <= 0.5)}
        </div>
        <div class="award-mini-card">
          <span class="award-label">All-Time Marks Broken</span>
          <strong>${rpt.allTimeMarksBroken} (≤2 in 30 yrs)</strong>
          ${flagBadge(rpt.allTimeMarksBroken <= 2)}
        </div>
      </div>

      <div class="card mt-12">
        <div><strong>League Records Broken by Season:</strong> ${recBySeasonStr}</div>
        <div class="mt-4"><strong>Unique Champions (${rpt.uniqueChampionsCount} clubs):</strong> ${champsStr}</div>
      </div>

      ${renderIndTable("M", "Men's")}
      ${renderIndTable("F", "Women's")}

      <div class="mt-12">
        <h4>Relay Events (${rpt.numSeasons}-Season Mean)</h4>
        <div class="table-scroll">
          <table class="data-table compact-table">
            <thead><tr><th>Relay Event</th><th>Benchmark</th><th>#1 Season Best (±1.2%)</th></tr></thead>
            <tbody>${relayRows}</tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

// ============================================================================
// MODALS: SWIMMER PROFILE, NEW GAME / TITLE SCREEN & FIRED / JOB OFFER
// ============================================================================

function openSwimmerModal(swimmerId) {
  const st = APP_UI.state;
  if (!st) return;
  const sw = st.swimmers[swimmerId];
  const modal = document.getElementById("swimmer-profile-modal");
  const body = document.getElementById("swimmer-modal-body");
  if (!modal || !body || !sw) return;

  if (!sw.baseTimesCache) recomputeSwimmerBaseTimes(sw);
  const team = sw.teamId !== null ? st.teams[sw.teamId] : null;

  // All 14 Individual Events table with Tapered Base, Season Best, Personal Best & Splits
  const evRows = INDIVIDUAL_EVENTS.map(ev => {
    const baseT = sw.baseTimesCache.ind[ev.id];
    const pp = calcPowerPoints(ev.id, sw.gender, baseT);
    const pb = sw.personalBests?.[ev.id];
    const sb = sw.seasonBests?.[ev.id];
    const splits = (pb?.splits || sb?.splits || []).slice(0, 6).map(s => formatTime(s)).join(" / ") + ((pb?.splits || []).length > 6 ? " …" : "");
    return `
      <tr>
        <td><strong>${escapeHtml(ev.name)}</strong></td>
        <td data-val="${baseT}">${formatTime(baseT)}</td>
        <td data-val="${pp}"><strong>${pp}</strong></td>
        <td data-val="${sb ? sb.time : 9999}">${sb ? formatTime(sb.time) + (sb.isTapered ? " (T)" : "") : "—"}</td>
        <td data-val="${pb ? pb.time : 9999}">${pb ? `<strong>${formatTime(pb.time)}</strong> <small>(${pb.season})</small>` : "—"}</td>
        <td><small>${splits || "—"}</small></td>
      </tr>
    `;
  }).join("");

  // 50-yard Relay Flat-Start Stroke Times
  const s50 = sw.baseTimesCache.stroke50;
  const stroke50Html = `50 Back: <strong>${formatTime(s50["50BK"])}</strong> • 50 Breast: <strong>${formatTime(s50["50BR"])}</strong> • 50 Fly: <strong>${formatTime(s50["50FL"])}</strong> • 50 Free: <strong>${formatTime(s50["50FR"])}</strong>`;

  const careerRows = (sw.careerHistory || [])
    .map(
      c => `
      <tr>
        <td>${c.season}</td>
        <td>${c.age}</td>
        <td>${c.teamId !== null && TEAMS_CONFIG[c.teamId] ? TEAMS_CONFIG[c.teamId].abbr : "FA"}</td>
        <td><strong>${c.bestEventId}</strong> (${formatTime(c.bestTime)})</td>
        <td><strong>${c.maxPowerPoints}</strong></td>
      </tr>
    `
    )
    .join("");

  body.innerHTML = `
    <div class="modal-swimmer-header">
      <div>
        <h2>${escapeHtml(sw.name)} <span class="badge badge-slate">${sw.gender === "F" ? "Woman" : "Man"} • Age ${sw.age} (Peak ${sw.peakAge})</span></h2>
        <div class="muted-p mt-4">
          ${team ? teamBadgeHtml(team.id, true, false) : `<span class="badge badge-warn">Free Agent / Prospect</span>`}
          • Archetype: <strong>${sw.archetype}</strong> • Training Group: <strong>${sw.trainingGroup.toUpperCase()}</strong>
          • Contract: <strong>${formatMoney(sw.contract.salary)}/yr (${sw.contract.yearsLeft}y)</strong>
        </div>
      </div>
      <div class="swimmer-pp-badge">
        <small>PEAK POWER PTS</small>
        <strong>${sw.baseTimesCache.peakPowerPoints}</strong>
      </div>
    </div>

    <div class="awards-summary-grid mt-12">
      <div class="award-mini-card"><span class="award-label">Flat Start</span><strong>${sw.skills.startSkill} / 99</strong></div>
      <div class="award-mini-card"><span class="award-label">Turns & Underwaters</span><strong>${sw.skills.turnUnderwater} / 99</strong></div>
      <div class="award-mini-card"><span class="award-label">Relay Exchange</span><strong>${sw.skills.relayExchange} / 99</strong></div>
      <div class="award-mini-card"><span class="award-label">Taper Response</span><strong>${sw.skills.taperResponse.toFixed(2)}x</strong></div>
      <div class="award-mini-card"><span class="award-label">Big-Meet Clutch</span><strong>${sw.skills.clutch} / 99</strong></div>
      <div class="award-mini-card"><span class="award-label">Consistency / Durab.</span><strong>${sw.skills.consistency} / ${sw.skills.durability}</strong></div>
    </div>

    <div class="card mt-12">
      <div><strong>200 Medley Relay 50-Yard Flat-Start Speed:</strong> ${stroke50Html}</div>
      <div class="mt-4"><strong>Current Conditioning:</strong> Fitness <strong>${sw.conditioning.fitness}</strong> • Fatigue <strong>${sw.conditioning.fatigue}</strong> • Taper Status: <strong>${sw.conditioning.taperStatus.toUpperCase()}</strong> (${sw.conditioning.tapersUsed}/2 tapers used)</div>
      ${sw.awards.length ? `<div class="mt-4"><strong>Career Honors:</strong> ${sw.awards.map(a => `<span class="badge badge-gold">${escapeHtml(a)}</span>`).join(" ")}</div>` : ""}
    </div>

    <h4 class="mt-12 mb-8">Event Profile, Season Bests & Personal Bests (SCY)</h4>
    <div class="table-scroll">
      <table class="data-table compact-table sortable-table">
        <thead>
          <tr>
            <th data-sort="text">Event</th>
            <th data-sort="num">Tapered Base</th>
            <th data-sort="num">Power Pts</th>
            <th data-sort="num">Season Best</th>
            <th data-sort="num">Personal Best</th>
            <th>Best Splits</th>
          </tr>
        </thead>
        <tbody>${evRows}</tbody>
      </table>
    </div>

    ${
      careerRows
        ? `
      <h4 class="mt-12 mb-8">Career Season-by-Season Progression</h4>
      <div class="table-scroll">
        <table class="data-table compact-table">
          <thead><tr><th>Season</th><th>Age</th><th>Club</th><th>Best Event & Time</th><th>Power Pts</th></tr></thead>
          <tbody>${careerRows}</tbody>
        </table>
      </div>
    `
        : ""
    }
  `;

  modal.style.display = "flex";
  makeTablesSortable();
}

function closeModal(modalId) {
  const m = document.getElementById(modalId);
  if (m) m.style.display = "none";
}

function openNewGameModal() {
  const modal = document.getElementById("new-game-modal");
  const body = document.getElementById("new-game-modal-body");
  if (!modal || !body) return;

  const currentTeamId = APP_UI.state ? APP_UI.state.userTeamId : 0; // Default 0: Blue Springs Power Cats
  const randomSeed = "BSPC-" + Math.floor(1000 + uiRandom() * 9000);

  const divGroupsHtml = DIVISIONS.map(divName => {
    const clubs = TEAMS_CONFIG.filter(t => t.division === divName)
      .map(
        t => `
        <label class="club-radio-card ${t.id === currentTeamId ? "selected" : ""}" id="club-card-${t.id}" onclick="selectNewGameClub(${t.id})">
          <input type="radio" name="ng-team-id" value="${t.id}" ${t.id === currentTeamId ? "checked" : ""} style="display:none">
          <span class="team-lettermark" style="background:${t.primary};border-color:${t.secondary};color:${t.accent}">${t.abbr}</span>
          <div class="club-radio-meta">
            <strong>${escapeHtml(t.name)}</strong>
            <small>${escapeHtml(t.city)}</small>
          </div>
        </label>
      `
      )
      .join("");
    return `
      <div class="ng-div-block">
        <h5>${escapeHtml(divName)} Division</h5>
        <div class="ng-clubs-grid">${clubs}</div>
      </div>
    `;
  }).join("");

  body.innerHTML = `
    <div class="ng-top-controls">
      <div class="ng-field">
        <label><strong>League RNG Seed (Deterministic Replay):</strong></label>
        <div class="flex-align-center gap-8 mt-4">
          <input type="text" id="ng-seed-input" class="text-input" value="${randomSeed}">
          <button type="button" class="btn btn-sm btn-ghost" onclick="document.getElementById('ng-seed-input').value='NPSL-'+Math.floor(10000+uiRandom()*90000)">Randomize</button>
        </div>
      </div>
      <div class="ng-field">
        <label><strong>Starting Club Roster Strength:</strong></label>
        <select id="ng-tier-select" class="select-input mt-4">
          <option value="contender">Contender (Championship Window Now)</option>
          <option value="middle" selected>Middle of the Pack (Balanced Build)</option>
          <option value="underdog">Underdog (Rebuild & Cap Flexibility)</option>
        </select>
      </div>
      <div class="ng-field">
        <label><strong>Have an Existing Save File?</strong></label>
        <div class="mt-4">
          <button type="button" class="btn btn-sm btn-secondary" onclick="triggerImportSaveDialog()">Import Save JSON…</button>
        </div>
      </div>
    </div>

    <h4 class="mt-12 mb-8">Select Your Club (Blue Springs Power Cats Preselected)</h4>
    <div class="ng-divisions-wrap">
      ${divGroupsHtml}
    </div>

    <div class="btn-row mt-16 flex-end">
      ${APP_UI.state ? `<button type="button" class="btn btn-ghost" onclick="closeModal('new-game-modal')">Cancel</button>` : ""}
      <button type="button" class="btn btn-primary btn-lg" onclick="launchNewFranchiseFromModal()">Launch Pro Swim Dynasty →</button>
    </div>
  `;

  modal.style.display = "flex";
}

function selectNewGameClub(teamId) {
  document.querySelectorAll(".club-radio-card").forEach(el => el.classList.remove("selected"));
  const card = document.getElementById(`club-card-${teamId}`);
  if (card) {
    card.classList.add("selected");
    const radio = card.querySelector("input[type=radio]");
    if (radio) radio.checked = true;
  }
}

function launchNewFranchiseFromModal() {
  const checkedRadio = document.querySelector("input[name='ng-team-id']:checked");
  const teamId = checkedRadio ? Number(checkedRadio.value) : 0;
  const seedVal = document.getElementById("ng-seed-input")?.value.trim() || "BSPC-2026";
  const tierVal = document.getElementById("ng-tier-select")?.value || "middle";

  stopLiveMeetPlayback();
  const newState = createNewLeague({
    seed: seedVal,
    userTeamId: teamId,
    startTier: tierVal
  });
  APP_UI.state = newState;
  APP_UI.activeTab = "hub";
  APP_UI.rosterTeamId = teamId;
  APP_UI.recordsTeamId = teamId;
  APP_UI.editingMeetId = null;
  APP_UI.editingLineup = null;
  APP_UI.viewingMeet = null;
  saveLeagueToStorage(newState, false);
  closeModal("new-game-modal");
  applyTeamTheme(teamId);
  renderEntireApp();
  showToast(`Started new ${TEAMS_CONFIG[teamId].name} franchise (Seed: ${seedVal}, Tier: ${tierVal}).`, "success");
}

function openFiredModal(st) {
  const modal = document.getElementById("fired-offer-modal");
  const body = document.getElementById("fired-modal-body");
  if (!modal || !body || !st.pendingFiredOffer) return;

  const cards = st.pendingFiredOffer
    .map(tid => {
      const t = st.teams[tid];
      return `
        <div class="card mb-8">
          <div class="flex-between">
            <div>
              ${teamBadgeHtml(tid, true, false)}
              <div class="muted-p mt-4">${escapeHtml(t.division)} Division • Last Season: ${t.wins}-${t.losses} • Pool: ${escapeHtml(t.poolName)}</div>
            </div>
            <button type="button" class="btn btn-primary" onclick="acceptJobOfferFromModal(${tid})">Accept Head Coach & GM Role</button>
          </div>
        </div>
      `;
    })
    .join("");

  body.innerHTML = `
    <p class="muted-p mb-12">Ownership has made a leadership change following a difficult stretch. Three clubs with head-coaching & general-manager vacancies have extended offers for you to take over their program immediately:</p>
    ${cards}
  `;
  modal.style.display = "flex";
}

function acceptJobOfferFromModal(newTeamId) {
  const st = APP_UI.state;
  if (!st) return;
  acceptNewTeamJob(st, newTeamId);
  APP_UI.rosterTeamId = newTeamId;
  APP_UI.recordsTeamId = newTeamId;
  closeModal("fired-offer-modal");
  saveLeagueToStorage(st, false);
  renderEntireApp();
  showToast(`Hired as GM & Head Coach of ${TEAMS_CONFIG[newTeamId].name}!`, "success");
}

// ============================================================================
// APP BOOTSTRAP
// ============================================================================

function initProSwimDynastyApp() {
  const fileInput = document.getElementById("import-file-input");
  if (fileInput) {
    fileInput.addEventListener("change", e => {
      if (e.target.files && e.target.files[0]) {
        handleImportSaveFile(e.target.files[0]);
      }
    });
  }

  const saved = loadLeagueFromStorage();
  if (saved) {
    APP_UI.state = saved;
    APP_UI.rosterTeamId = saved.userTeamId;
    APP_UI.recordsTeamId = saved.userTeamId;
    applyTeamTheme(saved.userTeamId);
    renderEntireApp();
  } else {
    // Initialize default Blue Springs Power Cats franchise in background and open the New Game modal so user can pick club, seed, and tier
    const initial = createNewLeague({
      seed: "BSPC-2026",
      userTeamId: 0,
      startTier: "middle"
    });
    APP_UI.state = initial;
    APP_UI.rosterTeamId = 0;
    APP_UI.recordsTeamId = 0;
    applyTeamTheme(0);
    renderEntireApp();
    openNewGameModal();
  }
}

if (typeof window !== "undefined") {
  window.addEventListener("DOMContentLoaded", initProSwimDynastyApp);
}
