function renderSingleEventResultCard(st, meet, er, isFeatured) {
  if (!er) return "";
  const gTitle = er.gender === "F" ? "Women's" : er.gender === "M" ? "Men's" : "Mixed";
  const rows = er.results
    .map(r => {
      const badges = (r.badges || [])
        .map(b => `<span class="badge ${b === "LR" ? "badge-gold" : b === "TR" ? "badge-cyan" : "badge-success"}">${b}</span>`)
        .join(" ");
      const dqBadge = r.dq ? `<span class="badge badge-danger">DQ (Early Takeoff Leg ${r.dqLeg})</span>` : "";

      if (er.isRelay) {
        const legsDesc = (r.legResults || [])
          .map(
            l =>
              `<span class="split-chip">${escapeHtml(l.swimmerName.split(" ").pop())} (${l.gender}): <strong>${formatTime(l.time)}</strong>${
                l.isFlatStart ? " flat" : ` (-${l.exchangeGain.toFixed(2)}s)`
              }</span>`
          )
          .join(" ");
        return `
          <tr class="${r.teamId === st.userTeamId ? "row-highlight" : ""}">
            <td>${r.dq ? "DQ" : r.place}</td>
            <td>Lane ${r.lane}</td>
            <td>${teamBadgeHtml(r.teamId, true)} <strong>(${r.label})</strong></td>
            <td><div class="splits-wrap">${legsDesc}</div></td>
            <td><strong>${r.dq ? "DQ" : formatTime(r.time)}</strong> ${badges} ${dqBadge}</td>
            <td><strong>${r.points > 0 ? "+" + r.points : "0"}</strong></td>
          </tr>
        `;
      } else {
        const splitsStr = (r.splits || []).map((s, idx) => `<span class="split-chip">${(idx + 1) * 50}y: ${formatTime(s)}</span>`).join(" ");
        return `
          <tr class="${r.teamId === st.userTeamId ? "row-highlight" : ""}">
            <td>${r.place}</td>
            <td>Lane ${r.lane}</td>
            <td>${swimmerLink(r.swimmerId, r.swimmerName)} ${teamBadgeHtml(r.teamId, false)}</td>
            <td><div class="splits-wrap">${splitsStr}</div></td>
            <td><strong>${formatTime(r.time)}</strong> ${badges}</td>
            <td><strong>${r.points > 0 ? "+" + r.points : "0"}</strong></td>
          </tr>
        `;
      }
    })
    .join("");

  return `
    <div class="card ${isFeatured ? "card-highlight" : "ev-result-box"}">
      <div class="card-header">
        <h4>Event #${er.slot}: ${gTitle} ${escapeHtml(er.eventName)} ${er.day > 1 ? `(Day ${er.day})` : ""}</h4>
        <div class="pts-summary-pills">
          ${Object.entries(er.ptsByTeam || {})
            .map(([tid, pts]) => `<span class="badge badge-slate">${TEAMS_CONFIG[tid].abbr}: +${pts}</span>`)
            .join(" ")}
        </div>
      </div>
      <div class="table-scroll">
        <table class="data-table compact-table">
          <thead>
            <tr>
              <th>Pl</th>
              <th>Lane</th>
              <th>${er.isRelay ? "Club Relay" : "Swimmer"}</th>
              <th>${er.isRelay ? "Relay Legs & Exchanges" : "50-Yard Splits"}</th>
              <th>Final Time</th>
              <th>Pts</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;
}

// LIVE 25-YARD POOL CANVAS ANIMATION ENGINE
// ============================================================================

function initPoolCanvasAfterRender() {
  const meet = APP_UI.viewingMeet;
  if (!meet || !meet.result) return;
  const er = meet.result.eventResults[APP_UI.liveEventIndex];
  if (!er) return;
  // If not actively playing, show finish state or current elapsed state
  if (!APP_UI.livePlaying && APP_UI.liveElapsedSec === 0) {
    const maxT = Math.max(...er.results.map(r => r.time || 60));
    APP_UI.liveElapsedSec = maxT;
  }
  drawPoolFrame();
}

function startLiveMeetPlayback() {
  const meet = APP_UI.viewingMeet;
  if (!meet || !meet.result) return;
  APP_UI.livePlaying = true;
  if (APP_UI.liveElapsedSec > 5000) APP_UI.liveElapsedSec = 0;
  APP_UI.liveLastTimestamp = performance.now();
  if (APP_UI.liveAnimFrame) cancelAnimationFrame(APP_UI.liveAnimFrame);
  APP_UI.liveAnimFrame = requestAnimationFrame(stepLivePoolAnimation);
}

function stopLiveMeetPlayback() {
  APP_UI.livePlaying = false;
  if (APP_UI.liveAnimFrame) {
    cancelAnimationFrame(APP_UI.liveAnimFrame);
    APP_UI.liveAnimFrame = null;
  }
}

function toggleLiveMeetPlayback() {
  const meet = APP_UI.viewingMeet;
  if (!meet || !meet.result) return;
  const er = meet.result.eventResults[APP_UI.liveEventIndex];
  const maxT = er ? Math.max(...er.results.map(r => r.time || 60)) : 60;
  if (APP_UI.livePlaying) {
    stopLiveMeetPlayback();
    renderEntireApp();
  } else {
    if (APP_UI.liveElapsedSec >= maxT - 0.05) {
      APP_UI.liveElapsedSec = 0;
    }
    startLiveMeetPlayback();
    renderEntireApp();
  }
}

function setLivePlaybackSpeed(spd) {
  APP_UI.liveSpeed = spd;
  renderEntireApp();
  if (APP_UI.livePlaying) {
    APP_UI.liveLastTimestamp = performance.now();
    APP_UI.liveAnimFrame = requestAnimationFrame(stepLivePoolAnimation);
  }
}

function jumpToMeetEvent(idx) {
  stopLiveMeetPlayback();
  APP_UI.liveEventIndex = idx;
  APP_UI.liveElapsedSec = 0;
  renderEntireApp();
  startLiveMeetPlayback();
}

function nextLiveMeetEvent() {
  const meet = APP_UI.viewingMeet;
  if (!meet || !meet.result) return;
  const total = meet.result.eventResults.length;
  if (APP_UI.liveEventIndex < total - 1) {
    APP_UI.liveEventIndex++;
    APP_UI.liveElapsedSec = 0;
    renderEntireApp();
    if (APP_UI.livePlaying) {
      APP_UI.liveLastTimestamp = performance.now();
      APP_UI.liveAnimFrame = requestAnimationFrame(stepLivePoolAnimation);
    } else {
      startLiveMeetPlayback();
    }
  } else {
    skipToFinalMeetResults();
  }
}

function skipToFinalMeetResults() {
  stopLiveMeetPlayback();
  const meet = APP_UI.viewingMeet;
  if (!meet || !meet.result) return;
  APP_UI.liveEventIndex = meet.result.eventResults.length - 1;
  const er = meet.result.eventResults[APP_UI.liveEventIndex];
  APP_UI.liveElapsedSec = er ? Math.max(...er.results.map(r => r.time || 60)) + 1 : 999;
  renderEntireApp();
}

function stepLivePoolAnimation(now) {
  if (!APP_UI.livePlaying || APP_UI.activeTab !== "meet") return;
  const dtReal = Math.min(0.1, (now - APP_UI.liveLastTimestamp) / 1000);
  APP_UI.liveLastTimestamp = now;

  const meet = APP_UI.viewingMeet;
  if (!meet || !meet.result) return;
  const er = meet.result.eventResults[APP_UI.liveEventIndex];
  if (!er) return;

  // Scale playback speed so distance races (500/1000/1650) animate smoothly without taking 15 real minutes
  const distScale = er.dist >= 1000 ? 6.0 : er.dist >= 500 ? 3.0 : er.dist >= 200 ? 1.8 : 1.15;
  APP_UI.liveElapsedSec += dtReal * APP_UI.liveSpeed * distScale;

  const maxT = Math.max(...er.results.map(r => r.time || 60));
  drawPoolFrame();

  if (APP_UI.liveElapsedSec >= maxT + 0.8) {
    // Pause briefly at touch or advance if more events
    if (APP_UI.liveEventIndex < meet.result.eventResults.length - 1) {
      APP_UI.liveEventIndex++;
      APP_UI.liveElapsedSec = 0;
      renderEntireApp();
      APP_UI.liveLastTimestamp = performance.now();
      APP_UI.liveAnimFrame = requestAnimationFrame(stepLivePoolAnimation);
      return;
    } else {
      APP_UI.liveElapsedSec = maxT;
      stopLiveMeetPlayback();
      renderEntireApp();
      return;
    }
  }

  APP_UI.liveAnimFrame = requestAnimationFrame(stepLivePoolAnimation);
}

function drawPoolFrame() {
  const canvas = document.getElementById("pool-race-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const meet = APP_UI.viewingMeet;
  if (!meet || !meet.result) return;
  const er = meet.result.eventResults[APP_UI.liveEventIndex];
  if (!er) return;

  const W = canvas.width;
  const H = canvas.height;
  const numLanes = meet.isChampionshipFinal ? 8 : 6;
  const deckLeft = 145;
  const deckRight = 155;
  const poolX = deckLeft;
  const poolW = W - deckLeft - deckRight;
  const laneH = H / numLanes;

  const elapsed = APP_UI.liveElapsedSec;
  const clockEl = document.getElementById("live-pool-clock");
  const maxRaceT = Math.max(...er.results.map(r => r.time || 60));
  if (clockEl) {
    clockEl.textContent = formatTime(Math.min(elapsed, maxRaceT));
  }

  // 1. Background Deck & Pool Water
  ctx.fillStyle = "#081224";
  ctx.fillRect(0, 0, W, H);

  const waterGrad = ctx.createLinearGradient(poolX, 0, poolX + poolW, 0);
  waterGrad.addColorStop(0, "#072a47");
  waterGrad.addColorStop(0.5, "#0a385c");
  waterGrad.addColorStop(1, "#072a47");
  ctx.fillStyle = waterGrad;
  ctx.fillRect(poolX, 0, poolW, H);

  // Backstroke flags (5 yards = 20% from each wall) & 15m mark (60% from start wall)
  const flagLeftX = poolX + poolW * 0.20;
  const flagRightX = poolX + poolW * 0.80;
  ctx.strokeStyle = "rgba(255, 255, 255, 0.16)";
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(flagLeftX, 0); ctx.lineTo(flagLeftX, H);
  ctx.moveTo(flagRightX, 0); ctx.lineTo(flagRightX, H);
  ctx.stroke();
  ctx.setLineDash([]);

  // Pool Walls / Touchpads
  ctx.fillStyle = "#fbbf24";
  ctx.fillRect(poolX - 4, 0, 4, H);
  ctx.fillRect(poolX + poolW, 0, 4, H);

  // 2. Draw Lanes & Swimmers
  for (let lane = 1; lane <= numLanes; lane++) {
    const yTop = (lane - 1) * laneH;
    const yMid = yTop + laneH / 2;

    // Bottom T-line
    ctx.strokeStyle = "rgba(14, 165, 233, 0.22)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(poolX + 18, yMid);
    ctx.lineTo(poolX + poolW - 18, yMid);
    ctx.stroke();

    // Lane rope
    if (lane < numLanes) {
      ctx.strokeStyle = "rgba(226, 232, 240, 0.32)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(poolX, yTop + laneH);
      ctx.lineTo(poolX + poolW, yTop + laneH);
      ctx.stroke();
    }

    // Find entry in this lane
    const entry = er.results.find(r => r.lane === lane);
    ctx.fillStyle = "#94a3b8";
    ctx.font = "600 11px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText(`L${lane}`, 8, yMid + 4);

    if (!entry) continue;

    const teamCfg = TEAMS_CONFIG[entry.teamId] || TEAMS_CONFIG[0];
    // Left deck label: Team + Swimmer
    ctx.fillStyle = teamCfg.primary;
    ctx.fillRect(30, yTop + 6, 6, laneH - 12);
    ctx.fillStyle = "#f8fafc";
    ctx.font = "700 11px -apple-system, BlinkMacSystemFont, sans-serif";
    const shortName = er.isRelay
      ? `${teamCfg.abbr} '${entry.label}'`
      : entry.swimmerName.length > 14 ? entry.swimmerName.slice(0, 13) + "…" : entry.swimmerName;
    ctx.fillText(shortName, 42, yMid - 2);
    ctx.fillStyle = "#38bdf8";
    ctx.font = "500 10px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillText(teamCfg.abbr, 42, yMid + 11);

    // Compute swimmer position along the 25-yard pool using 50-yard splits
    const splits50 = er.isRelay
      ? (entry.legResults || []).flatMap(l => l.splits || [l.time])
      : entry.splits || [entry.time];

    const totalTime = entry.time || 60;
    const finished = elapsed >= totalTime;

    let cum = 0;
    let active50Index = splits50.length - 1;
    let fracIn50 = 1.0;

    if (!finished) {
      for (let sIdx = 0; sIdx < splits50.length; sIdx++) {
        const sp = splits50[sIdx];
        if (elapsed <= cum + sp) {
          active50Index = sIdx;
          fracIn50 = Math.max(0, Math.min(1, (elapsed - cum) / Math.max(0.01, sp)));
          break;
        }
        cum += sp;
      }
    }

    // Each 50 yards is 2 lengths of the 25-yard pool:
    // First 25 yards (0.0 to 0.485 of the 50 time): left to right (poolX -> poolX + poolW)
    // Second 25 yards (0.485 to 1.0 of the 50 time): right to left (poolX + poolW -> poolX)
    let xPos = poolX + 12;
    let goingRight = true;
    if (!finished) {
      const turnPoint = 0.485;
      if (fracIn50 < turnPoint) {
        goingRight = true;
        const f25 = fracIn50 / turnPoint;
        xPos = poolX + 12 + f25 * (poolW - 24);
      } else {
        goingRight = false;
        const f25 = (fracIn50 - turnPoint) / (1 - turnPoint);
        xPos = poolX + poolW - 12 - f25 * (poolW - 24);
      }
    } else {
      xPos = poolX + 10;
    }

    // Draw wake & splash
    if (!finished && elapsed > 0) {
      ctx.fillStyle = "rgba(224, 242, 254, 0.35)";
      const wakeDir = goingRight ? -1 : 1;
      ctx.beginPath();
      ctx.ellipse(xPos + wakeDir * 10, yMid, 9, 4, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Draw swimmer body & team cap
    ctx.fillStyle = "#e2e8f0";
    ctx.beginPath();
    ctx.ellipse(xPos, yMid, 8, 3.5, 0, 0, Math.PI * 2);
    ctx.fill();

    const capX = goingRight ? xPos + 6 : xPos - 6;
    ctx.fillStyle = teamCfg.accent || teamCfg.primary;
    ctx.beginPath();
    ctx.arc(capX, yMid, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = teamCfg.primary;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Right deck readout: live split or final place & time
    const rightX = poolX + poolW + 10;
    if (finished) {
      ctx.fillStyle = entry.place === 1 ? "#fbbf24" : "#f8fafc";
      ctx.font = "700 11px -apple-system, BlinkMacSystemFont, sans-serif";
      const badgeTxt = entry.dq ? "DQ" : `#${entry.place}  ${formatTime(entry.time)}`;
      ctx.fillText(badgeTxt, rightX, yMid - 1);
      ctx.fillStyle = "#94a3b8";
      ctx.font = "500 10px -apple-system, BlinkMacSystemFont, sans-serif";
      const lastSplit = splits50[splits50.length - 1];
      ctx.fillText(`Last 50: ${formatTime(lastSplit)} (+${entry.points}p)`, rightX, yMid + 11);
    } else {
      const ydsDone = (active50Index + 1) * 50;
      const curSplit = splits50[active50Index];
      ctx.fillStyle = "#38bdf8";
      ctx.font = "600 11px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillText(`${ydsDone}y pace: ${formatTime(curSplit)}`, rightX, yMid + 4);
    }
  }
}

function renderStandingsScreen(st) {
  // 1. All 4 Division Tables
  const divCards = DIVISIONS.map(divName => {
    const divTeams = rankTeamsWithTiebreakers(
      st,
      st.teams.filter(t => t.division === divName)
    );
    const rows = divTeams
      .map((t, idx) => {
        const margin = roundHundredth(t.pointsFor - t.pointsAgainst);
        const seedBadge = t.playoffSeed ? `<span class="badge badge-gold">Seed #${t.playoffSeed}</span>` : idx === 0 ? `<span class="badge badge-cyan">Div Leader</span>` : "";
        return `
          <tr class="${t.id === st.userTeamId ? "row-highlight" : ""}">
            <td data-val="${idx + 1}">${idx + 1}</td>
            <td>${teamBadgeHtml(t.id, true)} ${seedBadge}</td>
            <td data-val="${t.wins}"><strong>${t.wins}-${t.losses}</strong></td>
            <td data-val="${t.divWins}">${t.divWins}-${t.divLosses}</td>
            <td data-val="${t.pointsFor}">${t.pointsFor.toFixed(1)}</td>
            <td data-val="${t.pointsAgainst}">${t.pointsAgainst.toFixed(1)}</td>
            <td data-val="${margin}" class="${margin >= 0 ? "text-success" : "text-warn"}">${margin >= 0 ? "+" : ""}${margin.toFixed(1)}</td>
            <td>${t.streak > 0 ? "W" + t.streak : t.streak < 0 ? "L" + Math.abs(t.streak) : "—"}</td>
          </tr>
        `;
      })
      .join("");

    return `
      <div class="card">
        <div class="card-header">
          <h4>${escapeHtml(divName)} Division</h4>
          <span class="badge badge-slate">6 Clubs • 10 Div Meets</span>
        </div>
        <div class="table-scroll">
          <table class="data-table sortable-table">
            <thead>
              <tr>
                <th data-sort="num">#</th>
                <th data-sort="text">Club</th>
                <th data-sort="num">W-L</th>
                <th data-sort="num">Div</th>
                <th data-sort="num">PF</th>
                <th data-sort="num">PA</th>
                <th data-sort="num">Diff</th>
                <th data-sort="text">Strk</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    `;
  }).join("");

  // 2. Playoff Bracket & Championship Final Hub
  let bracketHtml = "";
  const seeds = st.playoffs?.seeds?.length === 12 ? st.playoffs.seeds : computePlayoffSeedsPreview(st);
  const seedsListHtml = seeds
    .map(
      s => `
      <div class="seed-chip ${s.teamId === st.userTeamId ? "seed-user" : ""}">
        <span class="seed-num">#${s.seed}</span>
        ${teamBadgeHtml(s.teamId, false)}
        <small>${s.seed <= 4 ? "BYE" : "WC"}</small>
      </div>
    `
    )
    .join("");

  const r1Meets = st.playoffs?.round1Meets || [];
  const r2Meets = st.playoffs?.round2Meets || [];
  const finalMeet = st.playoffs?.finalMeet;

  const renderBracketMatchup = m => {
    const hT = st.teams[m.homeTeamId];
    const aT = st.teams[m.awayTeamId];
    const res = m.result;
    const hScore = res ? res.teamScores[hT.id] : "—";
    const aScore = res ? res.teamScores[aT.id] : "—";
    return `
      <div class="bracket-matchup-card">
        <div class="bracket-team-row ${res && res.winnerTeamId === hT.id ? "winner-row" : ""}">
          <span>#${hT.playoffSeed || ""} ${teamBadgeHtml(hT.id, true)} <small>(Host • ${m.cardType})</small></span>
          <strong>${hScore}</strong>
        </div>
        <div class="bracket-team-row ${res && res.winnerTeamId === aT.id ? "winner-row" : ""}">
          <span>#${aT.playoffSeed || ""} ${teamBadgeHtml(aT.id, true)}</span>
          <strong>${aScore}</strong>
        </div>
        ${res ? `<button type="button" class="btn btn-xs btn-ghost mt-4" onclick="openMeetBoxScore('${m.id}')">Box Score →</button>` : ""}
      </div>
    `;
  };

  let finalCardHtml = `<div class="muted-p">Quarterfinal winners advance to the 4-team, 3-day ${escapeHtml(FINAL_MEET_NAME)}.</div>`;
  if (finalMeet) {
    const teamRows = (finalMeet.teamIds || [])
      .map(tid => {
        const pts = finalMeet.result ? finalMeet.result.teamScores[tid] : "—";
        const isWin = finalMeet.result && finalMeet.result.winnerTeamId === tid;
        return `
          <div class="bracket-team-row ${isWin ? "winner-row" : ""}">
            <span>${teamBadgeHtml(tid, true)} ${isWin ? "🏆" : ""}</span>
            <strong>${pts}${finalMeet.result ? " pts" : ""}</strong>
          </div>
        `;
      })
      .join("");
    finalCardHtml = `
      <div class="bracket-matchup-card">
        <div class="mb-4"><strong>${escapeHtml(FINAL_MEET_NAME)} (Neutral 8-Lane Pool)</strong></div>
        ${teamRows}
        ${finalMeet.result ? `<button type="button" class="btn btn-xs btn-accent mt-8" onclick="openMeetBoxScore('${finalMeet.id}')">Full 3-Day Results →</button>` : ""}
      </div>
    `;
  }

  bracketHtml = `
    <div class="card mb-16">
      <div class="card-header">
        <div>
          <h3>12-Team Playoff Picture & ${escapeHtml(FINAL_MEET_NAME)} Bracket</h3>
          <p class="muted-p">Seeds 1–4 (Division Winners) earn a Round 1 bye. Higher seed hosts and selects Standard or Distance card in Knockout Rounds. Tiebreakers: Head-to-Head → Division Record → Season Point Margin.</p>
        </div>
      </div>
      <div class="seeds-strip mt-8">${seedsListHtml}</div>
      <div class="bracket-columns mt-12">
        <div class="bracket-col">
          <h5>Wild Card Round (Week 15)</h5>
          ${r1Meets.length ? r1Meets.map(renderBracketMatchup).join("") : `<div class="muted-p">Set after Week 14 (#5 vs #12, #6 vs #11, #7 vs #10, #8 vs #9).</div>`}
        </div>
        <div class="bracket-col">
          <h5>Quarterfinals (Week 16)</h5>
          ${r2Meets.length ? r2Meets.map(renderBracketMatchup).join("") : `<div class="muted-p">Seeds #1–#4 host Wild Card winners.</div>`}
        </div>
        <div class="bracket-col">
          <h5>${escapeHtml(FINAL_MEET_NAME)} (Week 17)</h5>
          ${finalCardHtml}
        </div>
      </div>
    </div>
  `;

  // 3. Schedule Explorer by Week
  const selWeek = APP_UI.scheduleWeekFilter || Math.min(14, st.week);
  const wkButtons = st.schedule
    .map(
      w => `
      <button type="button" class="btn btn-xs ${w.week === selWeek ? "btn-primary" : "btn-ghost"}"
        onclick="APP_UI.scheduleWeekFilter=${w.week}; renderEntireApp();">
        Wk ${w.week}${w.cardType === "distance" ? " (D)" : ""}
      </button>
    `
    )
    .join("");

  const wkObj = st.schedule.find(w => w.week === selWeek) || st.schedule[0];
  const meetRows = (wkObj?.meets || [])
    .map(m => {
      const hT = st.teams[m.homeTeamId];
      const aT = st.teams[m.awayTeamId];
      const res = m.result;
      const scoreStr = res
        ? `<strong>${res.teamScores[aT.id]} — ${res.teamScores[hT.id]}</strong>${res.wonViaLastRelayTiebreaker ? " <span class='badge badge-gold'>Relay TB</span>" : ""}`
        : `<span class="muted-p">Scheduled (${m.cardType})</span>`;
      const btn = res
        ? `<button type="button" class="btn btn-xs btn-ghost" onclick="openMeetBoxScore('${m.id}')">Box Score</button>`
        : "—";
      return `
        <tr class="${m.homeTeamId === st.userTeamId || m.awayTeamId === st.userTeamId ? "row-highlight" : ""}">
          <td>${teamBadgeHtml(aT.id, true)} (${aT.wins}-${aT.losses})</td>
          <td>@ ${teamBadgeHtml(hT.id, true)} (${hT.wins}-${hT.losses})</td>
          <td>${escapeHtml(m.poolName)}</td>
          <td><span class="badge ${m.cardType === "distance" ? "badge-cyan" : "badge-slate"}">${m.cardType.toUpperCase()}</span></td>
          <td>${scoreStr}</td>
          <td>${btn}</td>
        </tr>
      `;
    })
    .join("");

  return `
    ${bracketHtml}
    <div class="divisions-grid mb-16">
      ${divCards}
    </div>
    <div class="card">
      <div class="card-header wrap-row">
        <h3>Regular Season Schedule & Dual Meet Results</h3>
        <div class="btn-group wrap-row">${wkButtons}</div>
      </div>
      <div class="table-scroll mt-12">
        <table class="data-table">
          <thead>
            <tr>
              <th>Away Club</th>
              <th>Home Club</th>
              <th>Venue</th>
              <th>Card</th>
              <th>Result (Away — Home)</th>
              <th>Sheet</th>
            </tr>
          </thead>
          <tbody>${meetRows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function computePlayoffSeedsPreview(st) {
  const divWinners = [];
  const nonWinners = [];
  for (const divName of DIVISIONS) {
    const divTeams = st.teams.filter(t => t.division === divName);
    const ranked = rankTeamsWithTiebreakers(st, divTeams);
    divWinners.push(ranked[0]);
    nonWinners.push(...ranked.slice(1));
  }
  const top4 = rankTeamsWithTiebreakers(st, divWinners);
  const wildCards = rankTeamsWithTiebreakers(st, nonWinners).slice(0, 8);
  return [...top4, ...wildCards].map((t, i) => ({ seed: i + 1, teamId: t.id }));
}

    const recentPicks = st.draftOrder
      .slice(Math.max(0, pickIdx - 6), Math.min(totalPicks, pickIdx + 6))
      .map(p => {
        const sw = p.selectedSwimmerId ? st.swimmers[p.selectedSwimmerId] : null;
        const highlight = p.overall === curPick?.overall ? "row-highlight" : "";
        return `
          <tr class="${highlight}">
            <td>Rd ${p.round} • #${p.overall}</td>
            <td>${teamBadgeHtml(p.teamId, true)} ${p.originalTeamId !== p.teamId ? `<small>(via ${TEAMS_CONFIG[p.originalTeamId].abbr})</small>` : ""}</td>
            <td>${sw ? `${swimmerLink(sw)} (${sw.gender} • ${sw.archetype} • ${sw.baseTimesCache.peakPowerPoints} PP)` : p.overall === curPick?.overall ? "<strong>ON THE CLOCK</strong>" : "—"}</td>
          </tr>
        `;
      })
      .join("");

    const prospects = (st.draftProspects || [])
      .map(id => st.swimmers[id])
      .filter(Boolean)
      .filter(s => (APP_UI.draftGenderFilter === "ALL" || s.gender === APP_UI.draftGenderFilter) && (APP_UI.draftArchFilter === "ALL" || s.archetype === APP_UI.draftArchFilter))
      .sort((a, b) => b.baseTimesCache.peakPowerPoints - a.baseTimesCache.peakPowerPoints);

    const prospectRows = prospects
      .slice(0, 45)
      .map(sw => {
        const bestEv = sw.baseTimesCache.bestEventId;
        const upsideRoom = (getSwimmerPrimaryMultiplier(sw) - sw.potential.ceiling) * 100;
        const upsideGrade = upsideRoom >= 2.8 ? "A+" : upsideRoom >= 2.1 ? "A" : upsideRoom >= 1.5 ? "B+" : "B";
        return `
          <tr>
            <td>${swimmerLink(sw)}</td>
            <td>${sw.gender}</td>
            <td>${sw.age}</td>
            <td><span class="badge badge-slate">${sw.archetype}</span></td>
            <td><strong>${bestEv}</strong> (${formatTime(sw.baseTimesCache.ind[bestEv])})</td>
            <td data-val="${sw.baseTimesCache.peakPowerPoints}"><strong>${sw.baseTimesCache.peakPowerPoints}</strong></td>
            <td><span class="badge ${upsideGrade.startsWith("A") ? "badge-gold" : "badge-cyan"}">${upsideGrade}</span></td>
            <td>
              ${
                isUserOnClock
                  ? `<button type="button" class="btn btn-xs btn-accent" onclick="userMakeDraftPick(${sw.id})">Draft #${curPick.overall}</button>`
                  : `<span class="muted-p">Wait for Pick</span>`
              }
            </td>
          </tr>
        `;
      })
      .join("");

    bodyHtml = `
      <div class="offseason-phase-box">
        <div class="flex-between wrap-row">
          <div>
            <h4>${st.season} 4-Round Entry Draft (${pickIdx}/${totalPicks} Picks Made)</h4>
            <p class="muted-p">Current Club Roster: <strong>${fCount}W / ${mCount}M</strong>. ${
      curPick
        ? isUserOnClock
          ? `🔥 YOU ARE ON THE CLOCK at Round ${curPick.round}, Pick #${curPick.overall}!`
          : `On the Clock: ${TEAMS_CONFIG[curPick.teamId].name} (Rd ${curPick.round}, #${curPick.overall})`
        : "All 96 draft picks completed!"
    }</p>
          </div>
          <div class="btn-row">
            ${curPick && !isUserOnClock ? `<button type="button" class="btn btn-sm btn-secondary" onclick="simDraftToUserPick()">Sim to My Next Pick</button>` : ""}
            ${curPick && isUserOnClock ? `<button type="button" class="btn btn-sm btn-secondary" onclick="userAutoPickCurrentDraft()">Auto-Pick Best Fit</button>` : ""}
            <button type="button" class="btn btn-sm btn-primary" onclick="stepOffseasonForward()">Complete Draft & Open Free Agency →</button>
          </div>
        </div>

        <div class="dashboard-grid mt-12">
          <div>
            <div class="flex-between mb-8">
              <h5>Available Draft Prospects (${prospects.length})</h5>
              <div class="flex-align-center gap-8">
                <select class="select-input select-xs" onchange="APP_UI.draftGenderFilter=this.value; renderEntireApp();">
                  <option value="ALL" ${APP_UI.draftGenderFilter === "ALL" ? "selected" : ""}>All Genders</option>
                  <option value="F" ${APP_UI.draftGenderFilter === "F" ? "selected" : ""}>Women</option>
                  <option value="M" ${APP_UI.draftGenderFilter === "M" ? "selected" : ""}>Men</option>
                </select>
                <select class="select-input select-xs" onchange="APP_UI.draftArchFilter=this.value; renderEntireApp();">
                  <option value="ALL" ${APP_UI.draftArchFilter === "ALL" ? "selected" : ""}>All Archetypes</option>
                  ${ARCHETYPES.map(a => `<option value="${a}" ${APP_UI.draftArchFilter === a ? "selected" : ""}>${a}</option>`).join("")}
                </select>
              </div>
            </div>
            <div class="table-scroll">
              <table class="data-table sortable-table">
                <thead><tr><th data-sort="text">Prospect</th><th>G</th><th data-sort="num">Age</th><th>Type</th><th>Top Event</th><th data-sort="num">Power Pts</th><th>Upside</th><th>Draft</th></tr></thead>
                <tbody>${prospectRows}</tbody>
              </table>
            </div>
          </div>
          <div>
            <h5 class="mb-8">Draft Ticker</h5>
            <div class="table-scroll">
              <table class="data-table compact-table">
                <thead><tr><th>Pick</th><th>Club</th><th>Selection</th></tr></thead>
                <tbody>${recentPicks}</tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    `;
  } else if (phase === "freeAgency") {
    const fas = (st.freeAgents || [])
      .map(id => st.swimmers[id])
      .filter(Boolean)
      .filter(s => (APP_UI.faGenderFilter === "ALL" || s.gender === APP_UI.faGenderFilter) && (APP_UI.faArchFilter === "ALL" || s.archetype === APP_UI.faArchFilter))
      .sort((a, b) => b.baseTimesCache.peakPowerPoints - a.baseTimesCache.peakPowerPoints);

    const faRows = fas
      .slice(0, 50)
      .map(sw => {
        const askSal = estimateContractSalary(sw);
        const bestEv = sw.baseTimesCache.bestEventId;
        const canAfford = userTeam.capSpace >= askSal || askSal === MIN_SALARY;
        return `
          <tr>
            <td>${swimmerLink(sw)}</td>
            <td>${sw.gender}</td>
            <td data-val="${sw.age}">${sw.age}</td>
            <td><span class="badge badge-slate">${sw.archetype}</span></td>
            <td><strong>${bestEv}</strong> (${formatTime(sw.baseTimesCache.ind[bestEv])})</td>
            <td data-val="${sw.baseTimesCache.peakPowerPoints}"><strong>${sw.baseTimesCache.peakPowerPoints}</strong></td>
            <td data-val="${askSal}">${formatMoney(askSal)} / yr</td>
            <td>
              <button type="button" class="btn btn-xs ${canAfford ? "btn-primary" : "btn-ghost"}"
                onclick="userSignFreeAgent(${sw.id}, ${askSal})">Sign Free Agent</button>
            </td>
          </tr>
        `;
      })
      .join("");

    bodyHtml = `
      <div class="offseason-phase-box">
        <div class="flex-between wrap-row">
          <div>
            <h4>Free Agency Market • Cap Space: ${formatMoney(userTeam.capSpace)} • Roster: ${fCount}W / ${mCount}M</h4>
            <p class="muted-p">Sign unsigned veterans and undrafted swimmers to fill roster needs before Final Roster Cuts to 14 Women and 14 Men.</p>
          </div>
          <div class="flex-align-center gap-8">
            <select class="select-input select-xs" onchange="APP_UI.faGenderFilter=this.value; renderEntireApp();">
              <option value="ALL" ${APP_UI.faGenderFilter === "ALL" ? "selected" : ""}>All Genders</option>
              <option value="F" ${APP_UI.faGenderFilter === "F" ? "selected" : ""}>Women</option>
              <option value="M" ${APP_UI.faGenderFilter === "M" ? "selected" : ""}>Men</option>
            </select>
            <button type="button" class="btn btn-primary" onclick="stepOffseasonForward()">Complete Free Agency & Proceed to Cuts →</button>
          </div>
        </div>
        <div class="table-scroll mt-12">
          <table class="data-table sortable-table">
            <thead><tr><th data-sort="text">Free Agent</th><th>G</th><th data-sort="num">Age</th><th>Archetype</th><th>Best Event</th><th data-sort="num">Power Pts</th><th data-sort="num">Asking Salary</th><th>Action</th></tr></thead>
            <tbody>${faRows}</tbody>
          </table>
        </div>
      </div>
    `;
  } else if (phase === "cuts") {
    const rosterSwimmers = userTeam.roster.map(id => st.swimmers[id]).filter(Boolean);
    const cutRows = rosterSwimmers
      .sort((a, b) => a.baseTimesCache.peakPowerPoints - b.baseTimesCache.peakPowerPoints)
      .map(sw => {
        const gCount = sw.gender === "F" ? fCount : mCount;
        return `
          <tr>
            <td>${swimmerLink(sw)}</td>
            <td>${sw.gender}</td>
            <td>${sw.age}</td>
            <td><span class="badge badge-slate">${sw.archetype}</span></td>
            <td><strong>${sw.baseTimesCache.bestEventId}</strong> (${formatTime(sw.baseTimesCache.ind[sw.baseTimesCache.bestEventId])})</td>
            <td data-val="${sw.baseTimesCache.peakPowerPoints}"><strong>${sw.baseTimesCache.peakPowerPoints}</strong></td>
            <td>${formatMoney(sw.contract.salary)}</td>
            <td>
              ${
                gCount > 14
                  ? `<button type="button" class="btn btn-xs btn-danger" onclick="userCutRosterSwimmer(${sw.id})">Release (${gCount}->${gCount - 1})</button>`
                  : `<span class="badge badge-success">Locked (14)</span>`
              }
            </td>
          </tr>
        `;
      })
      .join("");

    bodyHtml = `
      <div class="offseason-phase-box">
        <div class="flex-between wrap-row">
          <div>
            <h4>Final Opening Day Roster Cuts • Current: ${fCount} Women / ${mCount} Men (Target: 14W / 14M)</h4>
            <p class="muted-p">Trim any excess swimmers down to 14 Women and 14 Men, or click below to auto-trim lowest-rated extras and launch the ${st.season + 1} Season!</p>
          </div>
          <button type="button" class="btn btn-accent" onclick="stepOffseasonForward()">Finalize 14W/14M Rosters & Start ${st.season + 1} Season →</button>
        </div>
        <div class="table-scroll mt-12">
          <table class="data-table sortable-table">
            <thead><tr><th data-sort="text">Swimmer</th><th>G</th><th>Age</th><th>Archetype</th><th>Best Event</th><th data-sort="num">Power Pts</th><th>Salary</th><th>Cut Action</th></tr></thead>
            <tbody>${cutRows}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  return `
    <div class="card card-highlight mb-16">
      <div class="offseason-steps-bar mb-12">${stepsBar}</div>
      ${bodyHtml}
    </div>
  `;
}

function stepOffseasonForward() {
  const st = APP_UI.state;
  if (!st || st.phase !== "offseason") return;
  simulateCurrentWeek(st);
  if (st.phase === "regular") {
    pruneRetiredSwimmersForSaveSize(st);
    showToast(`Welcome to Opening Week of the ${st.season} Season!`, "success");
  }
  saveLeagueToStorage(st, false);
  renderEntireApp();
}

function userResignSwimmer(swimmerId, salary, years) {
  const st = APP_UI.state;
  const userTeam = st.teams[st.userTeamId];
  const sw = st.swimmers[swimmerId];
  if (!sw) return;
  sw.contract = {
    salary: userTeam.capSpace >= salary ? salary : MIN_SALARY,
    yearsLeft: years,
    isRookieDeal: false
  };
  normalizeTeamCapAndPayroll(userTeam, st.swimmers);
  saveLeagueToStorage(st, false);
  renderEntireApp();
  showToast(`Re-signed ${sw.name} (${formatMoney(sw.contract.salary)}/yr for ${years} yrs).`, "success");
}

function userReleaseExpiringSwimmer(swimmerId) {
  const st = APP_UI.state;
  const userTeam = st.teams[st.userTeamId];
  const sw = st.swimmers[swimmerId];
  if (!sw) return;
  userTeam.roster = userTeam.roster.filter(id => id !== sw.id);
  sw.teamId = null;
  sw.contract = { salary: estimateContractSalary(sw), yearsLeft: 1, isRookieDeal: false };
  if (!st.freeAgents.includes(sw.id)) st.freeAgents.push(sw.id);
  normalizeTeamCapAndPayroll(userTeam, st.swimmers);
  saveLeagueToStorage(st, false);
  renderEntireApp();
  showToast(`Allowed ${sw.name} to enter Free Agency.`, "info");
}

function userMakeDraftPick(swimmerId) {
  const st = APP_UI.state;
  if (!st || st.offseasonPhase !== "draft") return;
  const pick = makeDraftPick(st, swimmerId);
  if (pick) {
    const sw = st.swimmers[pick.selectedSwimmerId];
    showToast(`Drafted ${sw.name} (${sw.gender} • ${sw.archetype}) at Pick #${pick.overall}!`, "success");
    // Advance CPU picks until user's next turn or end of draft
    while (st.currentDraftPickIndex < st.draftOrder.length) {
      const nextP = st.draftOrder[st.currentDraftPickIndex];
      if (nextP.teamId === st.userTeamId) break;
      makeDraftPick(st, null);
    }
    saveLeagueToStorage(st, false);
    renderEntireApp();
  }
}

function userAutoPickCurrentDraft() {
  const st = APP_UI.state;
  if (!st || st.offseasonPhase !== "draft") return;
  const pick = makeDraftPick(st, null);
  if (pick) {
    const sw = st.swimmers[pick.selectedSwimmerId];
    showToast(`Auto-drafted ${sw.name} at Pick #${pick.overall}.`, "info");
    saveLeagueToStorage(st, false);
    renderEntireApp();
  }
}

function simDraftToUserPick() {
  const st = APP_UI.state;
  if (!st || st.offseasonPhase !== "draft") return;
  let count = 0;
  while (st.currentDraftPickIndex < st.draftOrder.length) {
    const nextP = st.draftOrder[st.currentDraftPickIndex];
    if (nextP.teamId === st.userTeamId) break;
    makeDraftPick(st, null);
    count++;
  }
  saveLeagueToStorage(st, false);
  renderEntireApp();
  showToast(`Simulated ${count} CPU draft pick(s).`, "info");
}

function userSignFreeAgent(swimmerId, askSal) {
  const st = APP_UI.state;
  const userTeam = st.teams[st.userTeamId];
  const sw = st.swimmers[swimmerId];
  if (!sw || !st.freeAgents.includes(sw.id)) return;
  const sal = userTeam.capSpace >= askSal ? askSal : MIN_SALARY;
  st.freeAgents = st.freeAgents.filter(id => id !== sw.id);
  sw.teamId = userTeam.id;
  sw.contract = { salary: sal, yearsLeft: randInt(st.rngState, 1, 3), isRookieDeal: false };
  userTeam.roster.push(sw.id);
  normalizeTeamCapAndPayroll(userTeam, st.swimmers);
  saveLeagueToStorage(st, false);
  renderEntireApp();
  showToast(`Signed Free Agent ${sw.name} (${formatMoney(sal)}/yr).`, "success");
}

function userCutRosterSwimmer(swimmerId) {
  const st = APP_UI.state;
  const userTeam = st.teams[st.userTeamId];
  const sw = st.swimmers[swimmerId];
  if (!sw) return;
  userTeam.roster = userTeam.roster.filter(id => id !== sw.id);
  sw.teamId = null;
  if (!st.freeAgents.includes(sw.id)) st.freeAgents.push(sw.id);
  normalizeTeamCapAndPayroll(userTeam, st.swimmers);
  saveLeagueToStorage(st, false);
  renderEntireApp();
  showToast(`Released ${sw.name} to Free Agency.`, "info");
}

function renderTradeCenterCard(st) {
  const uid = st.userTeamId;
  if (APP_UI.tradePartnerId === uid) {
    APP_UI.tradePartnerId = (uid + 1) % 24;
  }
  const partnerId = APP_UI.tradePartnerId;
  const userTeam = st.teams[uid];
  const cpuTeam = st.teams[partnerId];

  const partnerOpts = st.teams
    .filter(t => t.id !== uid)
    .map(t => `<option value="${t.id}" ${t.id === partnerId ? "selected" : ""}>${escapeHtml(t.name)} (${t.abbr} • Cap Space: ${formatMoney(t.capSpace)})</option>`)
    .join("");

  const userSwimmerIds = Array.from(APP_UI.tradeUserSwimmers).filter(id => userTeam.roster.includes(id));
  const cpuSwimmerIds = Array.from(APP_UI.tradeCpuSwimmers).filter(id => cpuTeam.roster.includes(id));
  const userPickKeys = Array.from(APP_UI.tradeUserPicks);
  const cpuPickKeys = Array.from(APP_UI.tradeCpuPicks);

  const parsePickKey = k => {
    const [s, r, o] = k.split("_").map(Number);
    return { season: s, round: r, originalTeamId: o };
  };
  const userPicksObjs = userPickKeys.map(parsePickKey);
  const cpuPicksObjs = cpuPickKeys.map(parsePickKey);

  const evalResult =
    userSwimmerIds.length > 0 || cpuSwimmerIds.length > 0 || userPicksObjs.length > 0 || cpuPicksObjs.length > 0
      ? evaluateTradeProposal(st, uid, partnerId, userSwimmerIds, cpuSwimmerIds, userPicksObjs, cpuPicksObjs)
      : null;

  const renderAssetTable = (team, selectedSwSet, selectedPickSet, isUser) => {
    const swRows = team.roster
      .map(id => st.swimmers[id])
      .filter(Boolean)
      .sort((a, b) => b.baseTimesCache.peakPowerPoints - a.baseTimesCache.peakPowerPoints)
      .map(sw => {
        const checked = selectedSwSet.has(sw.id) ? "checked" : "";
        const val = Math.round(evaluateSwimmerTradeValue(sw, team, st.swimmers));
        return `
          <tr class="${checked ? "row-highlight" : ""}">
            <td><input type="checkbox" ${checked} onchange="toggleTradeSwimmer(${sw.id}, ${isUser})"></td>
            <td>${swimmerLink(sw)}</td>
            <td>${sw.gender} • ${sw.age}</td>
            <td><small>${sw.archetype}</small></td>
            <td><strong>${sw.baseTimesCache.peakPowerPoints}</strong></td>
            <td>${formatMoney(sw.contract.salary)}</td>
            <td>${val}</td>
          </tr>
        `;
      })
      .join("");

    const pickChips = (team.draftPicks || [])
      .slice(0, 8)
      .map(pk => {
        const key = `${pk.season}_${pk.round}_${pk.originalTeamId}`;
        const active = selectedPickSet.has(key) ? "btn-primary" : "btn-ghost";
        return `<button type="button" class="btn btn-xs ${active}" onclick="toggleTradePick('${key}', ${isUser})">${pk.season} Rd ${pk.round} (${TEAMS_CONFIG[pk.originalTeamId].abbr})</button>`;
      })
      .join(" ");

    return `
      <div class="trade-side-box">
        <div class="flex-between mb-8">
          <h4>${teamBadgeHtml(team.id, true)}</h4>
          <span class="badge badge-slate">Cap Space: ${formatMoney(team.capSpace)}</span>
        </div>
        <div class="mb-8">
          <small class="muted-p"><strong>Include Draft Picks:</strong></small>
          <div class="btn-row wrap-row mt-4">${pickChips}</div>
        </div>
        <div class="table-scroll trade-table-scroll">
          <table class="data-table compact-table">
            <thead><tr><th></th><th>Swimmer</th><th>G/Age</th><th>Type</th><th>PP</th><th>Salary</th><th>Val</th></tr></thead>
            <tbody>${swRows}</tbody>
          </table>
        </div>
      </div>
    `;
  };

  return `
    <div class="card mb-16">
      <div class="card-header wrap-row">
        <div>
          <h3>Club Trade Center (Swimmers & Draft Picks)</h3>
          <p class="muted-p">Propose swimmer and draft-pick packages. Swapped swimmer packages must maintain equal Women/Men counts during the season so both clubs stay at 14W/14M.</p>
        </div>
        <div class="flex-align-center gap-8">
          <label><strong>Trade Partner:</strong></label>
          <select class="select-input" onchange="changeTradePartner(Number(this.value))">
            ${partnerOpts}
          </select>
        </div>
      </div>

      ${
        evalResult
          ? `
        <div class="trade-eval-banner mt-12 ${evalResult.accepted ? "eval-accept" : "eval-reject"}">
          <div>
            <strong>${evalResult.accepted ? "✓ CPU GM Accepts Proposal:" : "✗ CPU GM Declines:"}</strong>
            <span>${escapeHtml(evalResult.reason)}</span>
            ${evalResult.offerValue ? `<small class="ml-8">(Your Offer Value: ${evalResult.offerValue} vs Requested Value: ${evalResult.requestValue})</small>` : ""}
          </div>
          <div class="btn-row">
            <button type="button" class="btn btn-sm btn-ghost" onclick="clearTradeSelection()">Clear</button>
            <button type="button" class="btn btn-sm ${evalResult.accepted ? "btn-accent" : "btn-secondary"}"
              ${evalResult.accepted ? "" : "disabled"} onclick="submitUserTradeProposal()">
              Execute Trade
            </button>
          </div>
        </div>
      `
          : ""
      }

      <div class="trade-grid mt-12">
        ${renderAssetTable(userTeam, APP_UI.tradeUserSwimmers, APP_UI.tradeUserPicks, true)}
        ${renderAssetTable(cpuTeam, APP_UI.tradeCpuSwimmers, APP_UI.tradeCpuPicks, false)}
      </div>
    </div>
  `;
}

function changeTradePartner(newPartnerId) {
  APP_UI.tradePartnerId = newPartnerId;
  APP_UI.tradeCpuSwimmers.clear();
  APP_UI.tradeCpuPicks.clear();
  renderEntireApp();
}

function toggleTradeSwimmer(swId, isUser) {
  const set = isUser ? APP_UI.tradeUserSwimmers : APP_UI.tradeCpuSwimmers;
  if (set.has(swId)) set.delete(swId);
  else set.add(swId);
  renderEntireApp();
}

function toggleTradePick(pickKey, isUser) {
  const set = isUser ? APP_UI.tradeUserPicks : APP_UI.tradeCpuPicks;
  if (set.has(pickKey)) set.delete(pickKey);
  else set.add(pickKey);
  renderEntireApp();
}

function clearTradeSelection() {
  APP_UI.tradeUserSwimmers.clear();
  APP_UI.tradeCpuSwimmers.clear();
  APP_UI.tradeUserPicks.clear();
  APP_UI.tradeCpuPicks.clear();
  renderEntireApp();
}

function submitUserTradeProposal() {
  const st = APP_UI.state;
  const uid = st.userTeamId;
  const pid = APP_UI.tradePartnerId;
  const parsePickKey = k => {
    const [s, r, o] = k.split("_").map(Number);
    return { season: s, round: r, originalTeamId: o };
  };
  const uSw = Array.from(APP_UI.tradeUserSwimmers);
  const cSw = Array.from(APP_UI.tradeCpuSwimmers);
  const uPk = Array.from(APP_UI.tradeUserPicks).map(parsePickKey);
  const cPk = Array.from(APP_UI.tradeCpuPicks).map(parsePickKey);

  const check = evaluateTradeProposal(st, uid, pid, uSw, cSw, uPk, cPk);
  if (!check.accepted) {
    showToast(check.reason, "warn");
    return;
  }
  executeTrade(st, uid, pid, uSw, cSw, uPk, cPk);
  clearTradeSelection();
  saveLeagueToStorage(st, false);
  renderEntireApp();
  showToast(`Trade completed with ${TEAMS_CONFIG[pid].name}!`, "success");
}

function renderUserDraftPicksCard(st) {
  const userTeam = st.teams[st.userTeamId];
  const picks = (userTeam.draftPicks || [])
    .map(p => `<span class="badge badge-slate">${p.season} Round ${p.round} (Orig: ${TEAMS_CONFIG[p.originalTeamId].abbr})</span>`)
    .join(" ");
  return `
    <div class="card">
      <div class="card-header"><h4>${escapeHtml(userTeam.name)} Owned Draft Picks</h4></div>
      <div class="btn-row wrap-row mt-8">${picks || "<span class='muted-p'>None</span>"}</div>
    </div>
  `;
}

function renderRecordsScreen(st) {
  const sub = APP_UI.recordsSubTab || "depth";
  const subTabs = [
    { id: "depth", label: "Season Top-50 Depth & Event Titles" },
    { id: "league", label: "League Record Board" },
    { id: "team", label: "24-Club Team Record Boards" },
    { id: "top10", label: "All-Time Top 10 Performers" },
    { id: "history", label: "Champions, Hall of Fame & GM Résumé" }
  ];

  const subNav = subTabs
    .map(
      t => `
      <button type="button" class="btn btn-sm ${sub === t.id ? "btn-primary" : "btn-ghost"}"
        onclick="APP_UI.recordsSubTab='${t.id}'; renderEntireApp();">${escapeHtml(t.label)}</button>
    `
    )
    .join("");

  let contentHtml = "";
  if (sub === "depth") {
    contentHtml = renderSeasonDepthSubTab(st);
  } else if (sub === "league") {
    contentHtml = renderLeagueRecordBoardSubTab(st);
  } else if (sub === "team") {
    contentHtml = renderTeamRecordBoardSubTab(st);
  } else if (sub === "top10") {
    contentHtml = renderAllTimeTop10SubTab(st);
  } else {
    contentHtml = renderDynastyHistorySubTab(st);
  }

  return `
    <div class="card mb-16">
      <div class="btn-group wrap-row">${subNav}</div>
    </div>
    ${contentHtml}
  `;
}

function renderSeasonDepthSubTab(st) {
  const g = APP_UI.recordsGender === "X" ? "M" : APP_UI.recordsGender;
  const evId = APP_UI.recordsEventId || "100FR";
  const ev = EVENT_MAP[evId] || INDIVIDUAL_EVENTS[0];

  const evOptions = INDIVIDUAL_EVENTS.map(
    e => `<option value="${e.id}" ${e.id === ev.id ? "selected" : ""}>${escapeHtml(e.name)}</option>`
  ).join("");

  const sbMap = st.seasonBests?.[g]?.[ev.id] || {};
  const entries = Object.values(sbMap).sort((a, b) => a.time - b.time);
  const bench = getBenchmark(ev.id, g);
  const r1Time = entries[0]?.time || bench;

  const rows = entries
    .slice(0, 50)
    .map((en, idx) => {
      const rank = idx + 1;
      const pctBehind = (((en.time - r1Time) / r1Time) * 100).toFixed(2);
      const splitsStr = (en.splits || []).slice(0, 8).map(s => formatTime(s)).join(" / ") + ((en.splits || []).length > 8 ? " …" : "");
      const rankBadge =
        rank === 1
          ? `<span class="badge badge-gold">#1 Event Leader</span>`
          : rank === 8
          ? `<span class="badge badge-cyan">#8 Benchmark</span>`
          : rank === 50
          ? `<span class="badge badge-slate">#50 Depth</span>`
          : `#${rank}`;
      return `
        <tr class="${en.teamId === st.userTeamId ? "row-highlight" : ""}">
          <td data-val="${rank}">${rankBadge}</td>
          <td>${swimmerLink(en.swimmerId, en.swimmerName)}</td>
          <td>${teamBadgeHtml(en.teamId, true)}</td>
          <td data-val="${en.time}"><strong>${formatTime(en.time)}</strong></td>
          <td data-val="${pctBehind}">${rank === 1 ? "Leader" : "+" + pctBehind + "%"}</td>
          <td data-val="${en.powerPoints}"><strong>${en.powerPoints}</strong></td>
          <td>Wk ${en.week} ${en.isTapered ? `<span class="badge badge-gold">Tapered</span>` : ""}</td>
          <td><small>${splitsStr}</small></td>
        </tr>
      `;
    })
    .join("");

  return `
    <div class="card">
      <div class="card-header wrap-row">
        <div>
          <h3>${st.season} Season Top-50 Depth List • ${g === "F" ? "Women's" : "Men's"} ${escapeHtml(ev.name)}</h3>
          <p class="muted-p">Benchmark: <strong>${formatTime(bench)}</strong> • All-Time Barrier: <strong>${formatTime(g === "M" ? ev.allTimeM : ev.allTimeF)}</strong> • Individual Event Title goes to the season's fastest performer (#1).</p>
        </div>
        <div class="flex-align-center gap-8">
          <div class="btn-group">
            <button type="button" class="btn btn-sm ${g === "F" ? "btn-primary" : "btn-ghost"}" onclick="APP_UI.recordsGender='F'; renderEntireApp();">Women</button>
            <button type="button" class="btn btn-sm ${g === "M" ? "btn-primary" : "btn-ghost"}" onclick="APP_UI.recordsGender='M'; renderEntireApp();">Men</button>
          </div>
          <select class="select-input" onchange="APP_UI.recordsEventId=this.value; renderEntireApp();">
            ${evOptions}
          </select>
        </div>
      </div>
      <div class="table-scroll mt-12">
        <table class="data-table sortable-table">
          <thead>
            <tr>
              <th data-sort="num">Rank</th>
              <th data-sort="text">Swimmer</th>
              <th data-sort="text">Club</th>
              <th data-sort="num">Season Best</th>
              <th data-sort="num">% vs #1</th>
              <th data-sort="num">Power Pts</th>
              <th>Week</th>
              <th>50-Yard Splits</th>
            </tr>
          </thead>
          <tbody>${rows || `<tr><td colspan="8" class="muted-p">No swims recorded yet this season in ${escapeHtml(ev.name)}.</td></tr>`}</tbody>
        </table>
      </div>
    </div>
  `;
}

function renderLeagueRecordBoardSubTab(st) {
  const renderGenderBoard = (g, title) => {
    const evList = g === "X"
      ? RELAY_EVENTS.filter(r => r.mixed)
      : [...INDIVIDUAL_EVENTS, ...RELAY_EVENTS.filter(r => !r.mixed)];

    const rows = evList
      .map(ev => {
        const rec = st.records.league[g]?.[ev.id];
        const bench = getBenchmark(ev.id, g);
        const allTime = !ev.isRelay ? (g === "M" ? ev.allTimeM : ev.allTimeF) : null;
        if (!rec) {
          return `<tr><td><strong>${escapeHtml(ev.name)}</strong></td><td colspan="6" class="muted-p">No record set yet (Bench: ${formatTime(bench)})</td></tr>`;
        }
        const holderHtml = ev.isRelay
          ? `${teamBadgeHtml(rec.teamId, true)} <small>(${(rec.legNames || []).map(n => escapeHtml(n.split(" ").pop())).join(", ")})</small>`
          : `${swimmerLink(rec.swimmerId, rec.swimmerName)} ${teamBadgeHtml(rec.teamId, false)}`;
        const splitsStr = (rec.splits || []).slice(0, 6).map(s => formatTime(s)).join(" / ") + ((rec.splits || []).length > 6 ? " …" : "");
        return `
          <tr>
            <td><strong>${escapeHtml(ev.name)}</strong></td>
            <td data-val="${rec.time}"><span class="record-time-badge">${formatTime(rec.time)}</span></td>
            <td>${holderHtml}</td>
            <td>${rec.season} (Wk ${rec.week})</td>
            <td>${escapeHtml(rec.meetName || "")}</td>
            <td>${allTime ? formatTime(allTime) : formatTime(bench)}</td>
            <td><small>${splitsStr}</small></td>
          </tr>
        `;
      })
      .join("");

    return `
      <div class="card mb-16">
        <div class="card-header">
          <h3>${escapeHtml(title)} — Official ${LEAGUE_ABBR} Short-Course Yards Record Board</h3>
        </div>
        <div class="table-scroll">
          <table class="data-table sortable-table">
            <thead>
              <tr>
                <th data-sort="text">Event</th>
                <th data-sort="num">League Record</th>
                <th data-sort="text">Record Holder</th>
                <th data-sort="text">Date</th>
                <th data-sort="text">Venue / Meet</th>
                <th data-sort="num">All-Time / Bench</th>
                <th>Splits</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    `;
  };

  return `
    ${renderGenderBoard("F", "Women's League Records")}
    ${renderGenderBoard("M", "Men's League Records")}
    ${renderGenderBoard("X", "Mixed Relay League Records")}
  `;
}

function renderTeamRecordBoardSubTab(st) {
  const tid = APP_UI.recordsTeamId ?? st.userTeamId;
  const team = st.teams[tid] || st.teams[0];
  const teamOpts = st.teams
    .map(t => `<option value="${t.id}" ${t.id === tid ? "selected" : ""}>${escapeHtml(t.name)} (${t.abbr})</option>`)
    .join("");

  const renderTeamGenderTable = (g, label) => {
    const evList = g === "X"
      ? RELAY_EVENTS.filter(r => r.mixed)
      : [...INDIVIDUAL_EVENTS, ...RELAY_EVENTS.filter(r => !r.mixed)];
    const rows = evList
      .map(ev => {
        const rec = team.records?.[g]?.[ev.id];
        const lRec = st.records.league[g]?.[ev.id];
        const isLeagueRecord = rec && lRec && Math.abs(rec.time - lRec.time) < 0.001 && lRec.teamId === team.id;
        if (!rec) {
          return `<tr><td><strong>${escapeHtml(ev.name)}</strong></td><td colspan="4" class="muted-p">No club record set yet</td></tr>`;
        }
        const holder = ev.isRelay
          ? `Relay (${(rec.legNames || []).map(n => escapeHtml(n.split(" ").pop())).join(", ")})`
          : swimmerLink(rec.swimmerId, rec.swimmerName);
        return `
          <tr>
            <td><strong>${escapeHtml(ev.name)}</strong></td>
            <td data-val="${rec.time}"><strong>${formatTime(rec.time)}</strong> ${isLeagueRecord ? `<span class="badge badge-gold">LR</span>` : ""}</td>
            <td>${holder}</td>
            <td>${rec.season} (Wk ${rec.week})</td>
            <td>${escapeHtml(rec.meetName || "")}</td>
          </tr>
        `;
      })
      .join("");

    return `
      <div class="card mb-16">
        <div class="card-header"><h4>${escapeHtml(team.name)} — ${escapeHtml(label)} Club Record Board</h4></div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Event</th><th>Club Record</th><th>Swimmer / Relay</th><th>Season</th><th>Venue</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    `;
  };

  return `
    <div class="card mb-16">
      <div class="card-header wrap-row">
        <div class="flex-align-center gap-12">
          ${teamBadgeHtml(team.id, false, false)}
          <div>
            <h3>${escapeHtml(team.name)} Official Club Record Board</h3>
            <div class="muted-p">Home Pool: ${escapeHtml(team.poolName)} (${escapeHtml(team.city)})</div>
          </div>
        </div>
        <select class="select-input" onchange="APP_UI.recordsTeamId=Number(this.value); renderEntireApp();">
          ${teamOpts}
        </select>
      </div>
    </div>
    ${renderTeamGenderTable("F", "Women's")}
    ${renderTeamGenderTable("M", "Men's")}
    ${renderTeamGenderTable("X", "Mixed Relays")}
  `;
}

function renderDynastyHistorySubTab(st) {
  const career = st.history.gmResume || st.history.gmCareer || {
    seasonsManaged: 0,
    totalWins: 0,
    totalLosses: 0,
    playoffAppearances: 0,
    finalFourAppearances: 0,
    championships: 0,
    coachOfYearCount: 0
  };
  const champsRows = (st.history.champions || [])
    .map(
      c => `
      <tr>
        <td><strong>${c.season}</strong></td>
        <td>🏆 ${teamBadgeHtml(c.teamId, true)}</td>
        <td>${c.score} pts</td>
        <td>${teamBadgeHtml(c.runnerUpId ?? c.runnerUpTeamId ?? 0, true)}</td>
      </tr>
    `
    )
    .join("");

  const hofRows = (st.history.hallOfFame || [])
    .map(
      h => `
      <tr>
        <td><strong>${escapeHtml(h.name)}</strong> (${h.gender})</td>
        <td><span class="badge badge-slate">${h.archetype}</span></td>
        <td>${h.inductedSeason} (Age ${h.ageRetired})</td>
        <td><strong>${h.bestPowerPoints}</strong></td>
        <td>${h.awardsCount} (${escapeHtml((h.awards || []).slice(0, 3).join(", "))})</td>
      </tr>
    `
    )
    .join("");

  const draftRetroRows = (st.history.draftClasses || [])
    .slice(0, 15)
    .map(dc => {
      // Retrospective: find best pick and biggest late-round sleeper (Rd 3-4)
      let bestPick = dc.picks[0];
      let bestPP = 0;
      let sleeperPick = null;
      let sleeperPP = 0;
      for (const p of dc.picks) {
        const sid = p.selectedSwimmerId || p.swimmerId;
        const sw = sid ? st.swimmers[sid] : null;
        const pp = sw ? sw.baseTimesCache?.peakPowerPoints || 900 : 900;
        if (pp > bestPP) {
          bestPP = pp;
          bestPick = p;
        }
        if ((p.round >= 2 || p.overall >= 13) && pp > sleeperPP) {
          sleeperPP = pp;
          sleeperPick = p;
        }
      }
      return `
        <tr>
          <td><strong>${dc.season}</strong></td>
          <td>${bestPick ? `#${bestPick.overall} ${escapeHtml(bestPick.swimmerName || "Prospect")} (${TEAMS_CONFIG[bestPick.teamId].abbr} • ${bestPP} PP)` : "—"}</td>
          <td>${sleeperPick ? `Rd ${sleeperPick.round} (#${sleeperPick.overall}) ${escapeHtml(sleeperPick.swimmerName || "Prospect")} (${TEAMS_CONFIG[sleeperPick.teamId].abbr} • ${sleeperPP} PP)` : "—"}</td>
        </tr>
      `;
    })
    .join("");

  return `
    <div class="card mb-16">
      <div class="card-header"><h3>General Manager & Head Coach Career Résumé</h3></div>
      <div class="awards-summary-grid mt-8">
        <div class="award-mini-card"><span class="award-label">Seasons Managed</span><strong>${career.seasonsManaged}</strong></div>
        <div class="award-mini-card"><span class="award-label">Career Dual Record</span><strong>${career.totalWins}-${career.totalLosses}</strong></div>
        <div class="award-mini-card"><span class="award-label">Playoff Berths</span><strong>${career.playoffAppearances}</strong></div>
        <div class="award-mini-card"><span class="award-label">Final Four Berths</span><strong>${career.finalFourAppearances}</strong></div>
        <div class="award-mini-card"><span class="award-label">${FINAL_MEET_NAME} Titles</span><strong>${career.championships} 🏆</strong></div>
        <div class="award-mini-card"><span class="award-label">Coach of the Year</span><strong>${career.coachOfYearCount}</strong></div>
      </div>
    </div>

    <div class="dashboard-grid mb-16">
      <div class="card">
        <div class="card-header"><h4>Past ${escapeHtml(FINAL_MEET_NAME)} Champions</h4></div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Season</th><th>Champion</th><th>Pts</th><th>Runner-Up</th></tr></thead>
            <tbody>${champsRows || `<tr><td colspan="4" class="muted-p">Complete a season to crown the first champion.</td></tr>`}</tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><h4>Draft Class Retrospectives (Best Pick & Late Sleeper)</h4></div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Class</th><th>Best Overall Career Pick</th><th>Biggest Rd 3–4 Sleeper</th></tr></thead>
            <tbody>${draftRetroRows || `<tr><td colspan="3" class="muted-p">Complete an offseason draft to view retrospectives.</td></tr>`}</tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h4>${LEAGUE_ABBR} Hall of Fame</h4></div>
      <div class="table-scroll">
        <table class="data-table">
          <thead><tr><th>Inductee</th><th>Archetype</th><th>Inducted</th><th>Peak Power Pts</th><th>Career Honors</th></tr></thead>
          <tbody>${hofRows || `<tr><td colspan="5" class="muted-p">Legends are inducted upon retirement after multi-title careers.</td></tr>`}</tbody>
        </table>
      </div>
    </div>
  `;
}

  let reportHtml = `<p class="muted-p mt-12">Click one of the buttons above to run a multi-season headless verification on a throwaway clone of the league engine. Your current franchise and RNG seed state will not be modified.</p>`;

    reportHtml = `<div class="health-progress-box mt-12"><strong>Running headless multi-season simulation…</strong> <span id="health-progress-label">Initializing…</span></div>`;
  } else if (rpt) {
    reportHtml = renderHealthReportDetails(rpt);
  }

  return `
    <div class="card mb-16">
      <div class="card-header"><h3>Franchise Save Management & Preferences</h3></div>
      <div class="muted-p mb-12">
        Save Version: <strong>v${st.saveVersion}</strong> • Seed: <strong>${escapeHtml(st.seed)}</strong> • Current Save Footprint: <strong>${saveSizeKB} KB</strong> (30-season target: &lt; 2,048 KB)

        <div>
          <h3>In-Game League Health & Multi-Season Calibration Verifier</h3>
          <p class="muted-p">Simulates N full seasons on an isolated clone and checks all 84 individual event depth targets (#1, #8, #50), all 12 relay targets, split/score invariants, aging curves, and 30-year stability.</p>
        </div>
        <div class="btn-row">
          <button type="button" class="btn btn-sm btn-secondary" ${APP_UI.healthRunning ? "disabled" : ""} onclick="triggerInGameLeagueHealth(5)">Run 5 Seasons</button>
          <button type="button" class="btn btn-sm btn-secondary" ${APP_UI.healthRunning ? "disabled" : ""} onclick="triggerInGameLeagueHealth(10)">Run 10 Seasons</button>

        ${reportHtml}
