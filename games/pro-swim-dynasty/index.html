// Check if user's owner fires them at end of season (when ownerPatience <= 15) and offer new club jobs
function checkUserJobSecurity(leagueState) {
  const uTeam = leagueState.teams[leagueState.userTeamId];
  if (uTeam.ownerPatience <= 15) {
    // Offer 3 other teams (underdogs/mid-pack looking for a new GM/Coach)
    const offers = leagueState.teams
      .filter(t => t.id !== uTeam.id && t.wins <= 7)
      .slice(0, 3)
      .map(t => t.id);
    return {
      fired: true,
      formerTeamId: uTeam.id,
      formerTeamName: uTeam.name,
      jobOfferTeamIds: offers.length > 0 ? offers : [(uTeam.id + 1) % 24]
    };
  }
  return { fired: false };
}

function acceptNewTeamJob(leagueState, newTeamId) {
  const newTeam = leagueState.teams[newTeamId];
  if (!newTeam) return;
  leagueState.userTeamId = newTeamId;
  newTeam.ownerPatience = 75;
  if (!leagueState.history.gmResume.teamsManaged.includes(newTeam.name)) {
    leagueState.history.gmResume.teamsManaged.push(newTeam.name);
  }
  leagueState.history.gmResume.timesFired++;
  addNewsItem(
    leagueState,
    "franchise",
    `${newTeam.name} Names New General Manager & Head Coach`,
    `Following a front-office shakeup, ${newTeam.name} hands the keys of their short-course dynasty program to a new GM.`
  );
}

// Prune long-retired non-active swimmers so 30-season save files stay well under 2 MB
// Note: Team records, League records, All-Time Top 10, and Hall of Fame entries already embed
// complete snapshots (swimmerName, time, season, splits, powerPoints).
function pruneRetiredSwimmersForSaveSize(leagueState) {
  const activeIds = new Set();
  for (const tm of leagueState.teams) {
    for (const id of tm.roster) activeIds.add(id);
    for (const id of tm.injuredList) activeIds.add(id);
  }
  for (const id of leagueState.freeAgents) activeIds.add(id);
  for (const id of leagueState.draftProspects) activeIds.add(id);

  for (const [sidStr, sw] of Object.entries(leagueState.swimmers)) {
    const sid = Number(sidStr);
    if (!activeIds.has(sid)) {
      delete leagueState.swimmers[sid];
    } else {
      // On active swimmers, keep top 2 personal bests (by powerPoints) so off-event entries don't bloat save size
      const pbEntries = Object.entries(sw.personalBests || {});
      if (pbEntries.length > 2) {
        pbEntries.sort((a, b) => (b[1].powerPoints || 0) - (a[1].powerPoints || 0));
        const trimmedPB = {};
        for (let i = 0; i < 2; i++) {
          const [evK, pbObj] = pbEntries[i];
          trimmedPB[evK] = pbObj;
        }
        sw.personalBests = trimmedPB;
      }
      if (sw.careerHistory && sw.careerHistory.length > 5) {
        sw.careerHistory = sw.careerHistory.slice(-5);
      }
      if (sw.awards && sw.awards.length > 6) {
        sw.awards = sw.awards.slice(-6);
      }
    }
  }

  // Keep full All-League & EventTitle tables on the 4 most recent seasons in history.awards; keep core awards forever
  for (let i = 4; i < leagueState.history.awards.length; i++) {
    delete leagueState.history.awards[i].allLeagueFirst;
    delete leagueState.history.awards[i].allLeagueSecond;
    delete leagueState.history.awards[i].eventTitles;
  }

  for (const tm of leagueState.teams) {
    if (tm.seasonHistory && tm.seasonHistory.length > 20) {
      tm.seasonHistory.length = 20;
    }
  }

  // Keep Hall of Fame personalBests compact (top 2 signature events per inductee) and cap at 45 legends
  if (leagueState.history.hallOfFame.length > 45) {
    leagueState.history.hallOfFame.sort((a, b) => b.bestPowerPoints - a.bestPowerPoints);
    leagueState.history.hallOfFame.length = 45;
  }
  for (const hof of leagueState.history.hallOfFame) {
    const pbEntries = Object.entries(hof.personalBests || {});
    if (pbEntries.length > 2) {
      pbEntries.sort((a, b) => (b[1].powerPoints || 0) - (a[1].powerPoints || 0));
      const trimmed = {};
      for (let i = 0; i < 2; i++) trimmed[pbEntries[i][0]] = pbEntries[i][1];
      hof.personalBests = trimmed;
    }
  }
}

// Migrate older saves (v1 -> v2) forward so a franchise is never lost
function migrateSaveState(rawObj) {
  if (!rawObj || typeof rawObj !== "object") {
    throw new Error("Invalid save file format.");
  }
  const state = JSON.parse(JSON.stringify(rawObj));
  if (!state.saveVersion || state.saveVersion < 2) {
    state.saveVersion = SAVE_VERSION;
    if (!state.ageProgressionSamples) {
      state.ageProgressionSamples = { "18_22": [], "23_26": [], "27_29": [], "30_plus": [] };
    }
    if (!state.dualMeetStats) {
      state.dualMeetStats = { totalDuals: 0, favoriteWins: 0, openLastRelay: 0, projectedWithin15: 0 };
    }
    if (!state.recordsBrokenBySeason) {
      state.recordsBrokenBySeason = [];
    }
    if (!state.history.gmResume) {
      state.history.gmResume = {
        seasonsManaged: 0,
        totalWins: 0,
        totalLosses: 0,
        playoffAppearances: 0,
        finalFourAppearances: 0,
        championships: 0,
        coachOfYearCount: 0,
        teamsManaged: [TEAMS_CONFIG[state.userTeamId || 0].name],
        timesFired: 0
      };
    }
  }
  // Recompute baseTimesCache for all swimmers if missing
  for (const sw of Object.values(state.swimmers || {})) {
    if (!sw.baseTimesCache) recomputeSwimmerBaseTimes(sw);
  }
  return state;
}

// Recursively verify no NaN or undefined exists anywhere in leagueState
function checkNoNaNOrUndefined(obj, path = "root", issues = []) {
  if (issues.length > 10) return issues;
  if (obj === undefined) {
    issues.push(`Undefined value at ${path}`);
    return issues;
  }
  if (typeof obj === "number" && (Number.isNaN(obj) || !Number.isFinite(obj))) {
    issues.push(`NaN/Infinite number at ${path}`);
    return issues;
  }
  if (obj && typeof obj === "object") {
    if (Array.isArray(obj)) {
      for (let i = 0; i < obj.length; i++) {
        checkNoNaNOrUndefined(obj[i], `${path}[${i}]`, issues);
        if (issues.length > 10) break;
      }
    } else {
      for (const [k, v] of Object.entries(obj)) {
        if (k === "headlessSwimLog") continue;
        checkNoNaNOrUndefined(v, `${path}.${k}`, issues);
        if (issues.length > 10) break;
      }
    }
  }
  return issues;
}

// Run a complete multi-season League Health & Invariant test on a throwaway clone of the league
// Used both by our headless Node verification and by the in-game League Health screen!
function runLeagueHealthSimulation(sourceLeagueState, numSeasons = 5, onSeasonProgress = null) {
  const simState = migrateSaveState(sourceLeagueState);
  simState.settings.autoTraining = true;
  simState.settings.autoLineup = true;

  // Reset health accumulators for this run
  simState.dualMeetStats = { totalDuals: 0, favoriteWins: 0, openLastRelay: 0, projectedWithin15: 0 };
  simState.ageProgressionSamples = { "18_22": [], "23_26": [], "27_29": [], "30_plus": [] };
  simState.recordsBrokenBySeason = [];

  const eventSeasonMetrics = { M: {}, F: {} };
  for (const ev of INDIVIDUAL_EVENTS) {
    eventSeasonMetrics.M[ev.id] = { r1: [], r8: [], r50: [] };
    eventSeasonMetrics.F[ev.id] = { r1: [], r8: [], r50: [] };
  }
  const relaySeasonMetrics = { M: {}, F: {}, X: {} };
  for (const rev of RELAY_EVENTS) {
    if (rev.mixed) relaySeasonMetrics.X[rev.id] = [];
    else {
      relaySeasonMetrics.M[rev.id] = [];
      relaySeasonMetrics.F[rev.id] = [];
    }
  }

  const untaperedVsTaperedSamples = [];
  let totalRelaysSimulated = 0;
  let totalRelayDQs = 0;
  let totalFlyingExchangeDelta = 0;
  let totalFlyingExchanges = 0;
  let allTimeMarksBroken = 0;

  const invariantViolations = [];
  const first5SeasonsMetrics = { r1Pct: [], r50Pct: [] };
  const last5SeasonsMetrics = { r1Pct: [], r50Pct: [] };

  for (let sIdx = 0; sIdx < numSeasons; sIdx++) {
    // Enable swim log for this season to verify record/PB provenance
    simState.headlessSwimLog = [];

    // Check Opening Day invariant: no star-level swimmer (>= 955 PP) unsigned in Free Agency
    const unsignedOpeningStars = simState.freeAgents
      .map(id => simState.swimmers[id])
      .filter(s => s && !s.retired && s.baseTimesCache.peakPowerPoints >= 955);
    if (unsignedOpeningStars.length > 0) {
      invariantViolations.push(`Season ${simState.season}: ${unsignedOpeningStars.length} star swimmer(s) unsigned on Opening Day`);
    }

    // Check Opening Day roster & legal lineup invariants on Standard card, Distance card, and Final program
    const progStd = getDualMeetProgram(1, "standard");
    const progDist = getDualMeetProgram(3, "distance");
    const progFinal = getChampionshipFinalProgram();
    for (const tm of simState.teams) {
      const fCount = tm.roster.map(id => simState.swimmers[id]).filter(s => s && s.gender === "F" && !s.onInjuredList).length;
      const mCount = tm.roster.map(id => simState.swimmers[id]).filter(s => s && s.gender === "M" && !s.onInjuredList).length;
      if (fCount !== 14 || mCount !== 14) {
        invariantViolations.push(`Season ${simState.season}: ${tm.abbr} has ${fCount}F/${mCount}M instead of 14F/14M`);
      }
      if (tm.payroll > SALARY_CAP) {
        invariantViolations.push(`Season ${simState.season}: ${tm.abbr} exceeds salary cap (${tm.payroll})`);
      }
      for (const [cardName, prog, isFin] of [["Standard", progStd, false], ["Distance", progDist, false], ["Final", progFinal, true]]) {
        const lin = generateTeamLineup(tm, simState.swimmers, prog, isFin);
        const val = validateTeamLineup(tm, lin, simState.swimmers, prog, isFin);
        if (!val.valid) {
          invariantViolations.push(`Season ${simState.season} ${tm.abbr} (${cardName}): ${val.errors[0]}`);
        }
      }
    }

    // Simulate all 17 weeks of the season (Weeks 1..14 regular, 15 R1, 16 R2, 17 Final)
    while (simState.phase !== "offseason") {
      simulateCurrentWeek(simState);

      // Inspect just-completed meets for split/score invariants and relay stats
      const justFinishedMeets = [];
      if (simState.phase === "regular" || (simState.phase === "playoffs_r1" && simState.week === 15)) {
        const checkW = simState.phase === "playoffs_r1" ? 14 : simState.week - 1;
        if (checkW >= 1 && checkW <= 14) {
          justFinishedMeets.push(...simState.schedule[checkW - 1].meets);
        }
      } else if (simState.phase === "playoffs_r2") {
        justFinishedMeets.push(...simState.playoffs.round1Meets);
      } else if (simState.phase === "final") {
        justFinishedMeets.push(...simState.playoffs.round2Meets);
      } else if (simState.phase === "offseason" && simState.playoffs.finalMeet) {
        justFinishedMeets.push(simState.playoffs.finalMeet);
      }

      for (const m of justFinishedMeets) {
        if (!m.result || !m.result.eventResults) continue;
        const sumByTeam = {};
        for (const tid of (m.teamIds || [m.homeTeamId, m.awayTeamId])) sumByTeam[tid] = 0;

        for (const evRes of m.result.eventResults) {
          for (const [tid, pts] of Object.entries(evRes.ptsByTeam)) {
            sumByTeam[tid] = roundHundredth((sumByTeam[tid] || 0) + pts);
          }
          for (const r of evRes.results) {
            if (evRes.isRelay) {
              totalRelaysSimulated++;
              if (r.dq) {
                totalRelayDQs++;
              } else if (r.legResults) {
                const legSum = roundHundredth(r.legResults.reduce((a, l) => a + l.time, 0));
                if (Math.abs(legSum - r.time) > 0.001) {
                  invariantViolations.push(`Relay leg sum mismatch in ${m.id}: ${legSum} vs ${r.time}`);
                }
                for (let li = 1; li < r.legResults.length; li++) {
                  totalFlyingExchangeDelta += r.legResults[li].exchangeGain;
                  totalFlyingExchanges++;
                }
              }
            } else if (r.splits) {
              const splitSum = roundHundredth(r.splits.reduce((a, b) => a + b, 0));
              if (Math.abs(splitSum - r.time) > 0.001) {
                invariantViolations.push(`Split sum mismatch in ${m.id}: ${splitSum} vs ${r.time}`);
              }
            }
          }
        }

        for (const [tid, expectedTotal] of Object.entries(sumByTeam)) {
          if (Math.abs(expectedTotal - m.result.teamScores[tid]) > 0.01) {
            invariantViolations.push(`Meet score sum mismatch in ${m.id} for team ${tid}`);
          }
        }
      }
    }

    // End of on-water season (now in offseasonPhase === 'awards'):
    // Check total wins === total losses across the 24 teams
    const totalW = simState.teams.reduce((a, t) => a + t.wins, 0);
    const totalL = simState.teams.reduce((a, t) => a + t.losses, 0);
    if (totalW !== totalL) {
      invariantViolations.push(`Season ${simState.season}: total wins (${totalW}) !== total losses (${totalL})`);
    }

    // Check League Records <= Team Records
    for (const g of ["F", "M", "X"]) {
      for (const [evId, lRec] of Object.entries(simState.records.league[g] || {})) {
        for (const tm of simState.teams) {
          const tRec = tm.records[g]?.[evId];
          if (tRec && lRec.time > tRec.time + 0.001) {
            invariantViolations.push(`League record slower than ${tm.abbr} team record in ${g} ${evId}`);
          }
        }
      }
    }

    // Collect Season Best #1, #8, #50 for every event
    const seasonR1Pcts = [];
    const seasonR50Pcts = [];
    for (const g of ["M", "F"]) {
      for (const ev of INDIVIDUAL_EVENTS) {
        const sbMap = simState.seasonBests[g][ev.id] || {};
        const times = Object.values(sbMap).map(x => x.time).sort((a, b) => a - b);
        if (times.length > 0) {
          const r1 = times[0];
          const r8 = times[Math.min(7, times.length - 1)];
          const r50 = times[Math.min(49, times.length - 1)];
          eventSeasonMetrics[g][ev.id].r1.push(r1);
          eventSeasonMetrics[g][ev.id].r8.push(r8);
          eventSeasonMetrics[g][ev.id].r50.push(r50);

          const bench = g === "M" ? ev.benchM : ev.benchF;
          const allTime = g === "M" ? ev.allTimeM : ev.allTimeF;
          if (r1 < allTime) allTimeMarksBroken++;
          seasonR1Pcts.push(((r1 - bench) / bench) * 100);
          seasonR50Pcts.push(((r50 - r1) / r1) * 100);
        }
      }
    }

    for (const rev of RELAY_EVENTS) {
      if (rev.mixed) {
        const sbMap = simState.seasonBests.X[rev.id] || {};
        const times = Object.values(sbMap).map(x => x.time).sort((a, b) => a - b);
        if (times.length > 0) relaySeasonMetrics.X[rev.id].push(times[0]);
      } else {
        for (const g of ["M", "F"]) {
          const sbMap = simState.seasonBests[g][rev.id] || {};
          const times = Object.values(sbMap).map(x => x.time).sort((a, b) => a - b);
          if (times.length > 0) relaySeasonMetrics[g][rev.id].push(times[0]);
        }
      }
    }

    if (sIdx < 5) {
      first5SeasonsMetrics.r1Pct.push(...seasonR1Pcts);
      first5SeasonsMetrics.r50Pct.push(...seasonR50Pcts);
    }
    if (sIdx >= numSeasons - 5) {
      last5SeasonsMetrics.r1Pct.push(...seasonR1Pcts);
      last5SeasonsMetrics.r50Pct.push(...seasonR50Pcts);
    }

    // Collect untapered vs tapered difference for swimmers who have both this season
    for (const sw of Object.values(simState.swimmers)) {
      if (!sw.seasonSwimStats) continue;
      for (const st of Object.values(sw.seasonSwimStats)) {
        if (st.taperedBest && st.untaperedTimes.length > 0) {
          const avgUntap = st.untaperedTimes.reduce((a, b) => a + b, 0) / st.untaperedTimes.length;
          const pct = ((avgUntap - st.taperedBest) / st.taperedBest) * 100;
          if (pct > 0) untaperedVsTaperedSamples.push(pct);
        }
      }
    }

    // Clear headlessSwimLog before stepping through offseason & pruning
    delete simState.headlessSwimLog;

    // Step through all offseason phases to reach Opening Day of next season
    while (simState.phase === "offseason") {
      simulateCurrentWeek(simState);
    }
    pruneRetiredSwimmersForSaveSize(simState);

    if (onSeasonProgress) {
      onSeasonProgress(sIdx + 1, numSeasons);
    }
  }

  // Final NaN/Undefined check and save size check
  const nanIssues = checkNoNaNOrUndefined(simState);
  invariantViolations.push(...nanIssues);
  const saveBytes = JSON.stringify(simState).length;
  if (saveBytes > 2 * 1024 * 1024) {
    invariantViolations.push(`Save size (${(saveBytes / 1048576).toFixed(2)} MB) exceeds 2.00 MB limit`);
  }

  // Compile summary report
  const mean = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
  const eventTable = { M: [], F: [] };
  for (const g of ["M", "F"]) {
    for (const ev of INDIVIDUAL_EVENTS) {
      const bench = g === "M" ? ev.benchM : ev.benchF;
      const m = eventSeasonMetrics[g][ev.id];
      const r1 = mean(m.r1);
      const r8 = mean(m.r8);
      const r50 = mean(m.r50);
      const r1DiffPct = ((r1 - bench) / bench) * 100;
      const r8BehindPct = ((r8 - r1) / r1) * 100;
      const r50BehindPct = ((r50 - r1) / r1) * 100;

      eventTable[g].push({
        eventId: ev.id,
        eventName: ev.name,
        benchmark: bench,
        r1,
        r8,
        r50,
        r1DiffPct,
        r8BehindPct,
        r50BehindPct,
        r1Ok: Math.abs(r1DiffPct) <= 1.0,
        r8Ok: r8BehindPct >= 1.5 && r8BehindPct <= 3.0,
        r50Ok: r50BehindPct >= 4.0 && r50BehindPct <= 6.0
      });
    }
  }

  const relayTable = [];
  for (const rev of RELAY_EVENTS) {
    if (rev.mixed) {
      const r1 = mean(relaySeasonMetrics.X[rev.id]);
      const diffPct = ((r1 - rev.benchX) / rev.benchX) * 100;
      relayTable.push({ eventId: rev.id, name: rev.name, gender: "X", benchmark: rev.benchX, r1, diffPct, ok: Math.abs(diffPct) <= 1.2 });
    } else {
      for (const g of ["M", "F"]) {
        const bench = g === "M" ? rev.benchM : rev.benchF;
        const r1 = mean(relaySeasonMetrics[g][rev.id]);
        const diffPct = ((r1 - bench) / bench) * 100;
        relayTable.push({ eventId: rev.id, name: rev.name, gender: g, benchmark: bench, r1, diffPct, ok: Math.abs(diffPct) <= 1.2 });
      }
    }
  }

  const avgUntaperedDiffPct = mean(untaperedVsTaperedSamples);
  const avgExchangeGain = totalFlyingExchanges ? totalFlyingExchangeDelta / totalFlyingExchanges : 0.54;
  const relayDqRatePct = totalRelaysSimulated ? (totalRelayDQs / totalRelaysSimulated) * 100 : 1.0;

  const ageChangeByBucket = {
    "18_22": mean(simState.ageProgressionSamples["18_22"].map(x => x.pct)),
    "23_26": mean(simState.ageProgressionSamples["23_26"].map(x => x.pct)),
    "27_29": mean(simState.ageProgressionSamples["27_29"].map(x => x.pct)),
    "30_plus": mean(simState.ageProgressionSamples["30_plus"].map(x => x.pct))
  };

  const dm = simState.dualMeetStats;
  const favWinPct = dm.totalDuals ? (dm.favoriteWins / dm.totalDuals) * 100 : 80;
  const openLastRelayPct = dm.totalDuals ? (dm.openLastRelay / dm.totalDuals) * 100 : 18;
  const projWithin15Pct = dm.totalDuals ? (dm.projectedWithin15 / dm.totalDuals) * 100 : 48;

  const inflationR1DiffPct = Math.abs(mean(last5SeasonsMetrics.r1Pct) - mean(first5SeasonsMetrics.r1Pct));
  const inflationR50DiffPct = Math.abs(mean(last5SeasonsMetrics.r50Pct) - mean(first5SeasonsMetrics.r50Pct));

  const champsByTeam = {};
  for (const ch of simState.history.champions.slice(0, numSeasons)) {
    champsByTeam[ch.teamAbbr] = (champsByTeam[ch.teamAbbr] || 0) + 1;
  }
  const uniqueChampionsCount = Object.keys(champsByTeam).length;

  return {
    numSeasons,
    saveBytes,
    invariantViolations,
    eventTable,
    relayTable,
    avgUntaperedDiffPct,
    avgExchangeGain,
    relayDqRatePct,
    ageChangeByBucket,
    recordsBrokenBySeason: simState.recordsBrokenBySeason,
    allTimeMarksBroken,
    favWinPct,
    openLastRelayPct,
    projWithin15Pct,
    inflationR1DiffPct,
    inflationR50DiffPct,

}

function saveLeagueToStorage(leagueState, showToastMsg = false) {
  if (!leagueState) return false;
  try {
    leagueState.saveVersion = SAVE_VERSION;
    const json = JSON.stringify(leagueState);
    localStorage.setItem(STORAGE_KEY, json);
    APP_UI.storageBlocked = false;
    APP_UI.storageWarningMsg = "";
    updateStorageBanner();
    if (showToastMsg) showToast("Franchise saved to browser storage.", "success");
    return true;
  } catch (err) {
    APP_UI.storageBlocked = true;
    APP_UI.storageWarningMsg =
      "Browser localStorage is full or blocked in this environment. Use 'Export JSON' to keep your franchise safe.";
    updateStorageBanner();
    if (showToastMsg) {
      showToast("Storage blocked or full! Offering JSON export instead.", "warn");
    }
    return false;
  }
}

function loadLeagueFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    return migrateSaveState(parsed);
  } catch (err) {
    APP_UI.storageBlocked = true;
    APP_UI.storageWarningMsg =
      "Browser localStorage is restricted in this preview environment. You can play normally and Export/Import JSON saves anytime.";
    return null;
  }
}

function exportSaveAsJsonFile(leagueState) {
  if (!leagueState) return;
  try {
    leagueState.saveVersion = SAVE_VERSION;
    const json = JSON.stringify(leagueState, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const teamAbbr = TEAMS_CONFIG[leagueState.userTeamId]?.abbr || "NPSL";
    const filename = `pro-swim-dynasty-${teamAbbr}-${leagueState.season}-wk${leagueState.week}.json`;
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 200);
    showToast(`Exported save file: ${filename}`, "success");
  } catch (err) {
    showToast("Failed to export save file: " + err.message, "error");
  }
}

function triggerImportSaveDialog() {
  const input = document.getElementById("import-file-input");
  if (input) {
    input.value = "";
    input.click();
  }
}

function handleImportSaveFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!parsed || !Array.isArray(parsed.teams) || !parsed.swimmers) {
        throw new Error("Invalid Pro Swim Dynasty save file structure.");
      }
      const migrated = migrateSaveState(parsed);
      APP_UI.state = migrated;
      APP_UI.rosterTeamId = migrated.userTeamId;
      APP_UI.recordsTeamId = migrated.userTeamId;
      APP_UI.editingMeetId = null;
      APP_UI.editingLineup = null;
      APP_UI.viewingMeet = null;
      saveLeagueToStorage(migrated, false);
      closeModal("new-game-modal");
      applyTeamTheme(migrated.userTeamId);
      renderEntireApp();
      showToast(`Loaded ${TEAMS_CONFIG[migrated.userTeamId].name} (${migrated.season} Season, Week ${migrated.week}).`, "success");
    } catch (err) {
      showToast("Import error: " + err.message, "error");
    }
  };
  reader.readAsText(file);
}

function formatMoney(val) {
  if (val === null || val === undefined || Number.isNaN(val)) return "$0";
  const sign = val < 0 ? "-" : "";
  const abs = Math.abs(val);
  if (abs >= 1000000) return `${sign}$${(abs / 1000000).toFixed(2)}M`;
  if (abs >= 1000) return `${sign}$${Math.round(abs / 1000)}k`;
  return `${sign}$${Math.round(abs)}`;
}

}

// Universal sortable table handler
function makeTablesSortable() {
  const tables = document.querySelectorAll("table.sortable-table");
  tables.forEach(table => {
    const headers = table.querySelectorAll("th[data-sort]");
    headers.forEach((th, colIdx) => {
      if (th.dataset.boundSort) return;
      th.dataset.boundSort = "1";
      th.style.cursor = "pointer";
      th.addEventListener("click", () => {
        const tbody = table.querySelector("tbody");
        if (!tbody) return;
        const rows = Array.from(tbody.querySelectorAll("tr"));
        const sortType = th.dataset.sort || "text";
        const currentDir = th.dataset.dir === "asc" ? "desc" : "asc";
        headers.forEach(h => { delete h.dataset.dir; h.classList.remove("sorted-asc", "sorted-desc"); });
        th.dataset.dir = currentDir;
        th.classList.add(currentDir === "asc" ? "sorted-asc" : "sorted-desc");

        rows.sort((rA, rB) => {
          const cellA = rA.children[colIdx];
          const cellB = rB.children[colIdx];
          if (!cellA || !cellB) return 0;
          const rawA = cellA.dataset.val !== undefined ? cellA.dataset.val : cellA.textContent.trim();
          const rawB = cellB.dataset.val !== undefined ? cellB.dataset.val : cellB.textContent.trim();
          if (sortType === "num") {
            const nA = parseFloat(String(rawA).replace(/[^0-9.-]/g, "")) || 0;
            const nB = parseFloat(String(rawB).replace(/[^0-9.-]/g, "")) || 0;
            return currentDir === "asc" ? nA - nB : nB - nA;
          } else {
            return currentDir === "asc"
              ? String(rawA).localeCompare(String(rawB))
              : String(rawB).localeCompare(String(rawA));
          }
        });
        rows.forEach(r => tbody.appendChild(r));
      });
    });
  });
}

function findUserCurrentMeet(st) {
  const uid = st.userTeamId;
  if (st.phase === "regular") {
    const wkObj = st.schedule.find(w => w.week === st.week);
    if (!wkObj) return null;
    return wkObj.meets.find(m => m.homeTeamId === uid || m.awayTeamId === uid) || null;
  }
  if (st.phase === "playoffs_r1") {
    return (st.playoffs?.round1Meets || []).find(m => m.homeTeamId === uid || m.awayTeamId === uid) || null;
  }
  if (st.phase === "playoffs_r2") {
    return (st.playoffs?.round2Meets || []).find(m => m.homeTeamId === uid || m.awayTeamId === uid) || null;
  }
  if (st.phase === "final") {
    const fm = st.playoffs?.finalMeet;
    if (fm && fm.teamIds && fm.teamIds.includes(uid)) return fm;
    return fm || null;
  }
  return null;
}

function findMostRecentUserMeet(st) {
  const uid = st.userTeamId;
  if (st.playoffs?.finalMeet?.result) return st.playoffs.finalMeet;
  const r2 = (st.playoffs?.round2Meets || []).find(m => m.result && (m.homeTeamId === uid || m.awayTeamId === uid));
  if (r2) return r2;
  const r1 = (st.playoffs?.round1Meets || []).find(m => m.result && (m.homeTeamId === uid || m.awayTeamId === uid));
  if (r1) return r1;
  for (let w = st.schedule.length - 1; w >= 0; w--) {
    const wk = st.schedule[w];
    const m = wk.meets.find(mt => mt.result && (mt.homeTeamId === uid || mt.awayTeamId === uid));
    if (m) return m;
    const anyM = wk.meets.find(mt => mt.result);
    if (anyM) return anyM;
  }
  return null;
}

function handlePrimaryAdvanceAction() {
  const st = APP_UI.state;
  if (!st) return;
  if (st.phase === "offseason") {
    switchTab("frontoffice");
    return;
  }
  // Commit any edited lineup into the current meet before simulating
  commitEditedLineupIfValid(st);
  const prevPhase = st.phase;
  const prevWeek = st.week;
  simulateCurrentWeek(st);
  saveLeagueToStorage(st, false);

  // Set viewingMeet to the meet that just completed
  const recent = findMostRecentUserMeetForPhase(st, prevPhase, prevWeek);
  if (recent) {
    APP_UI.viewingMeet = recent;
    APP_UI.liveEventIndex = 0;
    APP_UI.liveElapsedSec = 0;
  }
  APP_UI.editingMeetId = null;
  APP_UI.editingLineup = null;
  renderEntireApp();
  showToast(`Completed ${prevPhase === "regular" ? "Week " + prevWeek : prevPhase.toUpperCase()} simulation.`, "success");
}

function findMostRecentUserMeetForPhase(st, prevPhase, prevWeek) {
  const uid = st.userTeamId;
  if (prevPhase === "regular") {
    const wk = st.schedule.find(w => w.week === prevWeek);
    if (wk) {
      return wk.meets.find(m => m.homeTeamId === uid || m.awayTeamId === uid) || wk.meets[0];
    }
  } else if (prevPhase === "playoffs_r1") {
    return (st.playoffs?.round1Meets || []).find(m => m.homeTeamId === uid || m.awayTeamId === uid) || st.playoffs?.round1Meets?.[0];
  } else if (prevPhase === "playoffs_r2") {
    return (st.playoffs?.round2Meets || []).find(m => m.homeTeamId === uid || m.awayTeamId === uid) || st.playoffs?.round2Meets?.[0];
  } else if (prevPhase === "final") {
    return st.playoffs?.finalMeet;
  }
  return findMostRecentUserMeet(st);
}

function watchCurrentMeetLive() {
  const st = APP_UI.state;
  if (!st || st.phase === "offseason") return;
  commitEditedLineupIfValid(st);
  const prevPhase = st.phase;
  const prevWeek = st.week;
  // Rule 2: A meet is simulated in full before any of it is animated, so watching and skipping give the identical result!
  simulateCurrentWeek(st);
  saveLeagueToStorage(st, false);

  const meet = findMostRecentUserMeetForPhase(st, prevPhase, prevWeek);
  APP_UI.editingMeetId = null;
  APP_UI.editingLineup = null;
  if (meet) {
    APP_UI.viewingMeet = meet;
    APP_UI.liveEventIndex = 0;
    APP_UI.liveElapsedSec = 0;
    APP_UI.activeTab = "meet";
    renderEntireApp();
    startLiveMeetPlayback();

}

function quickSimToTarget(targetType) {
  const st = APP_UI.state;
  if (!st) return;
  commitEditedLineupIfValid(st);
  let steps = 0;
  if (targetType === "deadline") {
    while (st.phase === "regular" && st.week < 10 && steps < 20) {
      simulateCurrentWeek(st);
      steps++;
    }
    showToast(`Simulated ${steps} week(s) to Trade Deadline (Week 10).`, "success");
  } else if (targetType === "playoffs") {
    while (st.phase === "regular" && steps < 20) {
      simulateCurrentWeek(st);
      steps++;
    }
    showToast(`Simulated ${steps} week(s) to the Playoffs.`, "success");
  } else if (targetType === "offseason") {
    while (st.phase !== "offseason" && steps < 25) {
      simulateCurrentWeek(st);
      steps++;
    }
    showToast(`Simulated to the ${st.season} Offseason.`, "success");
  } else if (targetType === "full_season") {
    const startSeason = st.season;
    while (st.season === startSeason && steps < 35) {
      simulateCurrentWeek(st);
      steps++;
      if (st.pendingFiredOffer) break;
    }
    pruneRetiredSwimmersForSaveSize(st);
    showToast(`Completed full ${startSeason} season and offseason.`, "success");
  }
  APP_UI.editingMeetId = null;
  APP_UI.editingLineup = null;
  APP_UI.viewingMeet = findMostRecentUserMeet(st);
  saveLeagueToStorage(st, false);
  renderEntireApp();
}

  st.settings[key] = !st.settings[key];

}

      <div class="card card-highlight">
        <div class="card-header">
          <h3>Offseason Front Office Active</h3>

          <button type="button" class="btn btn-primary" onclick="switchTab('frontoffice')">Open Offseason Hub →</button>

        </div>
      </div>
    `;
  } else if (currentMeet) {
    if (currentMeet.isChampionshipFinal) {
      const qualifiers = (currentMeet.teamIds || []).map(tid => teamBadgeHtml(tid, true)).join(" • ");
      const userQualified = (currentMeet.teamIds || []).includes(st.userTeamId);
      nextMeetHtml = `
        <div class="card card-highlight">
          <div class="card-header">
            <h3>${escapeHtml(FINAL_MEET_NAME)} (Week 17 • 3-Day Timed Finals)</h3>
            <span class="badge badge-gold">Neutral Pool • 8 Lanes</span>
          </div>
          <p class="muted-p"><strong>Final Four Qualifiers:</strong> ${qualifiers}</p>
          <p class="muted-p">${userQualified ? "Your club qualified for the Championship Final! Write your 3-day lineup (up to 3 ind / 7 total events per swimmer) and race for the banner." : "Your club did not make the Final Four, but you can watch or simulate the Championship Final."}</p>
          <div class="btn-row mt-12">
            ${userQualified ? `<button type="button" class="btn btn-secondary" onclick="switchTab('lineup')">Edit Championship Lineup</button>` : ""}
            <button type="button" class="btn btn-accent" onclick="watchCurrentMeetLive()">Watch Championship Live</button>
            <button type="button" class="btn btn-primary" onclick="handlePrimaryAdvanceAction()">Simulate Championship Final</button>
          </div>
        </div>
      `;
    } else {
      const isHome = currentMeet.homeTeamId === st.userTeamId;
      const oppId = isHome ? currentMeet.awayTeamId : currentMeet.homeTeamId;
      const oppTeam = st.teams[oppId];
      const homeTeam = st.teams[currentMeet.homeTeamId];
      const awayTeam = st.teams[currentMeet.awayTeamId];
      const hLineup = currentMeet.lineups?.[homeTeam.id] || generateTeamLineup(homeTeam, st.swimmers, {

      });
      const aLineup = currentMeet.lineups?.[awayTeam.id] || generateTeamLineup(awayTeam, st.swimmers, {
        week: st.week, cardType: currentMeet.cardType, isHome: false, isPlayoff: st.phase !== "regular"
      });
      const proj = projectDualMeetScore(homeTeam, awayTeam, st.swimmers, st.week, currentMeet.cardType, hLineup, aLineup);
      const userProj = isHome ? proj.homeProjected : proj.awayProjected;
      const oppProj = isHome ? proj.awayProjected : proj.homeProjected;
      const firstGender = st.week % 2 === 1 ? "Women's Events First" : "Men's Events First";

      nextMeetHtml = `

            <div class="matchup-side">
              ${teamBadgeHtml(userTeam.id, true)}

              ${teamBadgeHtml(oppTeam.id, true)}

  } else {
    nextMeetHtml = `
      <div class="card card-highlight">
        <div class="card-header">

    `;
  }

  // Last Meet Result Summary
  let lastResultHtml = `<div class="muted-p">No completed meets yet this season.</div>`;
  if (recentMeet && recentMeet.result) {
    if (recentMeet.isChampionshipFinal) {
      const scores = Object.entries(recentMeet.result.teamScores || {})
        .sort((a, b) => b[1] - a[1])
        .map(([tid, pts], idx) => `<div>#${idx + 1} ${teamBadgeHtml(Number(tid), true)}: <strong>${pts} pts</strong></div>`)
        .join("");
      lastResultHtml = `
        <div class="last-meet-summary">
          <div class="mb-8"><strong>${escapeHtml(FINAL_MEET_NAME)} Final Standings:</strong></div>
          ${scores}
          <button type="button" class="btn btn-sm btn-ghost mt-8" onclick="openMeetBoxScore('${recentMeet.id}')">View Full Championship Sheet →</button>

      const tbNote = recentMeet.result.wonViaLastRelayTiebreaker ? ` <span class="badge badge-gold">Won on Final Relay Tiebreaker!</span>` : "";
      lastResultHtml = `

  const divRows = divTeams
    .map((t, idx) => {

      return `

    .map(id => st.swimmers[id])

            ${st.phase === "regular" ? `<button type="button" class="btn btn-secondary" onclick="quickSimToTarget('playoffs')">Sim to Playoffs (Wk 15)</button>` : ""}
            ${st.phase !== "offseason" ? `<button type="button" class="btn btn-secondary" onclick="quickSimToTarget('offseason')">Sim to Offseason</button>` : ""}
            <button type="button" class="btn btn-secondary" onclick="quickSimToTarget('full_season')">Sim Full Season</button>
          </div>
          <div class="toggle-row mt-12">
            <label class="toggle-label">
              <input type="checkbox" ${st.settings.autoTraining ? "checked" : ""} onchange="toggleUserSetting('autoTraining')">
              <span><strong>Auto-Manage Weekly Training & Taper</strong> (CPU periodization: heavy early, Week 13–14 taper, Championship Final taper)</span>
            </label>
            <label class="toggle-label">
              <input type="checkbox" ${st.settings.autoLineup ? "checked" : ""} onchange="toggleUserSetting('autoLineup')">
              <span><strong>Auto-Write Meet Lineups</strong> (Coach AI optimizes matchups and avoids brutal back-to-backs)</span>
            </label>

        </div>

        <div class="card mt-16">
          <div class="card-header">
            <h3>Club Cornerstones (${escapeHtml(userTeam.name)})</h3>
            <button type="button" class="btn btn-sm btn-ghost" onclick="switchTab('roster')">Full 28-Swimmer Roster →</button>
          </div>
          <div class="table-scroll">
            <table class="data-table sortable-table">
              <thead>
                <tr>
                  <th data-sort="text">Swimmer</th>
                  <th data-sort="text">G/Age</th>

function renderRosterScreen(st) {
  const tid = APP_UI.rosterTeamId !== null ? APP_UI.rosterTeamId : st.userTeamId;
  const team = st.teams[tid];
  normalizeTeamCapAndPayroll(team, st.swimmers);
  const isUserTeam = tid === st.userTeamId;

  const teamOptions = st.teams
    .map(t => `<option value="${t.id}" ${t.id === tid ? "selected" : ""}>${escapeHtml(t.name)} (${t.abbr} • ${t.division})</option>`)
    .join("");

  const activeSwimmers = team.roster.map(id => st.swimmers[id]).filter(Boolean);
  const ilSwimmers = team.injuredList.map(id => st.swimmers[id]).filter(Boolean);

  let shown = [];
  if (APP_UI.rosterGenderFilter === "F") shown = activeSwimmers.filter(s => s.gender === "F");
  else if (APP_UI.rosterGenderFilter === "M") shown = activeSwimmers.filter(s => s.gender === "M");
  else if (APP_UI.rosterGenderFilter === "IL") shown = ilSwimmers;
  else shown = [...activeSwimmers, ...ilSwimmers];

  const fCount = activeSwimmers.filter(s => s.gender === "F").length;
  const mCount = activeSwimmers.filter(s => s.gender === "M").length;

  const rows = shown
    .map(sw => {
      if (!sw.baseTimesCache) recomputeSwimmerBaseTimes(sw);
      const bestEv = sw.baseTimesCache.bestEventId;
      const pbT = sw.personalBests[bestEv]?.time || sw.baseTimesCache.ind[bestEv];
      const sbT = sw.seasonBests[bestEv]?.time;

      // Find top 2 events
      const evSorted = INDIVIDUAL_EVENTS.map(ev => ({
        id: ev.id,
        t: sw.baseTimesCache.ind[ev.id],
        pp: calcPowerPoints(ev.id, sw.gender, sw.baseTimesCache.ind[ev.id])
      })).sort((a, b) => b.pp - a.pp);
      const sigStr = `${evSorted[0].id} (${formatTime(evSorted[0].t)}) • ${evSorted[1].id} (${formatTime(evSorted[1].t)})`;

      const statusBadge = sw.onInjuredList
        ? `<span class="badge badge-danger">IL: ${escapeHtml(sw.injury?.type || "Injured")} (${sw.injury?.weeksLeft || 1}w)</span>`
        : sw.injury && sw.injury.weeksLeft > 0
        ? `<span class="badge badge-warn">Hurt: ${escapeHtml(sw.injury.type)} (${sw.injury.weeksLeft}w)</span>`
        : `<span class="badge badge-success">Active</span>`;

      let actionsHtml = "—";
      if (isUserTeam) {
        if (sw.onInjuredList) {
          actionsHtml = `<button type="button" class="btn btn-xs btn-secondary" onclick="activateSwimmerFromIL(${sw.id})">Activate</button>`;
        } else if (sw.injury && sw.injury.weeksLeft > 0) {
          actionsHtml = `<button type="button" class="btn btn-xs btn-warn" onclick="moveUserSwimmerToIL(${sw.id})">Place on IL</button>`;
        } else {
          actionsHtml = `<button type="button" class="btn btn-xs btn-ghost" onclick="openSwimmerModal(${sw.id})">Profile</button>`;
        }
      } else {
        actionsHtml = `<button type="button" class="btn btn-xs btn-ghost" onclick="openSwimmerModal(${sw.id})">Scout</button>`;
      }

      return `
        <tr>
          <td>${swimmerLink(sw)}</td>
          <td data-val="${sw.gender}">${sw.gender}</td>
          <td data-val="${sw.age}">${sw.age} <small>(Pk ${sw.peakAge})</small></td>
          <td><span class="badge badge-slate">${sw.archetype}</span></td>
          <td>${escapeHtml(sw.trainingGroup.toUpperCase())}</td>
          <td>${sigStr}</td>
          <td data-val="${pbT}">${formatTime(pbT)}</td>
          <td data-val="${sbT || 9999}">${sbT ? formatTime(sbT) : "—"}</td>
          <td data-val="${sw.baseTimesCache.peakPowerPoints}"><strong>${sw.baseTimesCache.peakPowerPoints}</strong></td>
          <td data-val="${sw.conditioning.fitness}">${sw.conditioning.fitness} / ${sw.conditioning.fatigue} <small>(${sw.conditioning.taperStatus})</small></td>
          <td data-val="${sw.contract.salary}">${formatMoney(sw.contract.salary)} <small>(${sw.contract.yearsLeft}y${sw.contract.isRookieDeal ? " • Rk" : ""})</small></td>
          <td>${statusBadge}</td>
          <td>${actionsHtml}</td>
        </tr>
      `;
    })
    .join("");

  return `
    <div class="card">
      <div class="card-header wrap-row">
        <div class="flex-align-center gap-12">
          ${teamBadgeHtml(team.id, false, false)}
          <div>
            <h3>${escapeHtml(team.name)} Roster & Cap Sheet</h3>
            <div class="muted-p">Active: <strong>${fCount} Women / ${mCount} Men</strong> • Injured List: <strong>${ilSwimmers.length}</strong> • Payroll: <strong>${formatMoney(team.payroll)}</strong> • Cap Space: <strong>${formatMoney(team.capSpace)}</strong></div>
          </div>
        </div>
        <div class="flex-align-center gap-8">
          <select class="select-input" onchange="APP_UI.rosterTeamId = Number(this.value); renderEntireApp();">
            ${teamOptions}
          </select>
          <div class="btn-group">
            <button type="button" class="btn btn-sm ${APP_UI.rosterGenderFilter === "ALL" ? "btn-primary" : "btn-ghost"}" onclick="APP_UI.rosterGenderFilter='ALL'; renderEntireApp();">All (${activeSwimmers.length + ilSwimmers.length})</button>
            <button type="button" class="btn btn-sm ${APP_UI.rosterGenderFilter === "F" ? "btn-primary" : "btn-ghost"}" onclick="APP_UI.rosterGenderFilter='F'; renderEntireApp();">Women (${fCount})</button>
            <button type="button" class="btn btn-sm ${APP_UI.rosterGenderFilter === "M" ? "btn-primary" : "btn-ghost"}" onclick="APP_UI.rosterGenderFilter='M'; renderEntireApp();">Men (${mCount})</button>
            <button type="button" class="btn btn-sm ${APP_UI.rosterGenderFilter === "IL" ? "btn-primary" : "btn-ghost"}" onclick="APP_UI.rosterGenderFilter='IL'; renderEntireApp();">IL (${ilSwimmers.length})</button>
          </div>
        </div>
      </div>

      <div class="table-scroll mt-12">
        <table class="data-table sortable-table">
          <thead>
            <tr>
              <th data-sort="text">Swimmer</th>
              <th data-sort="text">G</th>
              <th data-sort="num">Age</th>
              <th data-sort="text">Archetype</th>
              <th data-sort="text">Group</th>
              <th data-sort="text">Best Events (Tapered Base)</th>
              <th data-sort="num">Best PB</th>
              <th data-sort="num">Season Best</th>
              <th data-sort="num">Power Pts</th>
              <th data-sort="num">Fit / Fat</th>
              <th data-sort="num">Contract</th>
              <th data-sort="text">Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function moveUserSwimmerToIL(swimmerId) {
  const st = APP_UI.state;
  const team = st.teams[st.userTeamId];
  const sw = st.swimmers[swimmerId];
  if (!sw || sw.teamId !== team.id) return;
  sw.onInjuredList = true;
  team.roster = team.roster.filter(id => id !== sw.id);
  if (!team.injuredList.includes(sw.id)) team.injuredList.push(sw.id);

  // Sign a healthy minimum-salary replacement of the same gender so 14W/14M stays intact
  const availFA = st.freeAgents
    .map(id => st.swimmers[id])
    .filter(s => s && s.gender === sw.gender && (!s.injury || s.injury.weeksLeft === 0))
    .sort((a, b) => b.baseTimesCache.peakPowerPoints - a.baseTimesCache.peakPowerPoints);

  let rep = availFA[0];
  if (!rep) {
    rep = createSwimmer(st.rngState, st.nextSwimmerId++, sw.gender, sw.archetype, {
      teamId: team.id,
      isReplacement: true,
      season: st.season
    });
    st.swimmers[rep.id] = rep;
  } else {
    st.freeAgents = st.freeAgents.filter(id => id !== rep.id);
  }
  rep.teamId = team.id;
  rep.contract = { salary: MIN_SALARY, yearsLeft: 1, isRookieDeal: false };
  team.roster.push(rep.id);
  normalizeTeamCapAndPayroll(team, st.swimmers);
  saveLeagueToStorage(st, false);
  renderEntireApp();
  showToast(`Placed ${sw.name} on IL and signed replacement ${rep.name} ($60k).`, "info");
}

function activateSwimmerFromIL(swimmerId) {
  const st = APP_UI.state;
  const team = st.teams[st.userTeamId];
  const sw = st.swimmers[swimmerId];
  if (!sw || !team.injuredList.includes(sw.id)) return;
  sw.onInjuredList = false;
  sw.injury = null;
  team.injuredList = team.injuredList.filter(id => id !== sw.id);
  if (!team.roster.includes(sw.id)) team.roster.push(sw.id);

  // If gender count now exceeds 14, release the lowest-rated replacement swimmer of that gender
  const sameG = team.roster
    .map(id => st.swimmers[id])
    .filter(s => s && s.gender === sw.gender && s.id !== sw.id)
    .sort((a, b) => a.baseTimesCache.peakPowerPoints - b.baseTimesCache.peakPowerPoints);

  if (sameG.length >= 14) {
    const cut = sameG[0];
    team.roster = team.roster.filter(id => id !== cut.id);
    cut.teamId = null;
    if (!st.freeAgents.includes(cut.id)) st.freeAgents.push(cut.id);
    showToast(`Activated ${sw.name} from IL and released replacement ${cut.name}.`, "success");
  } else {
    showToast(`Activated ${sw.name} from IL.`, "success");
  }
  normalizeTeamCapAndPayroll(team, st.swimmers);
  saveLeagueToStorage(st, false);
  renderEntireApp();
}

  const userTeam = st.teams[st.userTeamId];
  const groups = [
    { key: "sprint", title: "Sprint Group (50 / 100 Free)", desc: "Explosive block starts, neuromuscular speed, high-velocity turns." },
    { key: "mid", title: "Mid-Distance Group (200 / 500 Free)", desc: "Threshold pace sustainment, 200/500 aerobic-anaerobic blend." },
    { key: "distance", title: "Distance Group (500 / 1000 / 1650 Free)", desc: "High-yardage aerobic base, even-split pacing, rapid recovery." },
    { key: "stroke", title: "Stroke & IM Group (Back / Breast / Fly / IM)", desc: "Underwater dolphin kick, stroke efficiency, IM transition mechanics." }
  ];

  const loadEffects = {
    heavy: "Fitness +4.5, Fatigue +11 • Builds ceiling for late-season taper, higher short-term fatigue & slight injury risk.",
    standard: "Fitness +1.8, Fatigue -4 (toward 36) • Balanced in-season race maintenance (~2.5% off tapered best).",
    rest: "Fitness -0.8, Fatigue -18 • Mini-rest for rival dual meets or playoffs without burning a full season taper.",
    taper: "Full Shave & Taper (2-Week Peak Window) • Drops fatigue to ~6, unlocks full taper response (+2.3% to +3.0% drop). Works 1–2x/season."
  };

  const groupCards = groups
    .map(g => {
      const curLoad = userTeam.trainingPlan[g.key] || "standard";
      const count = userTeam.roster.map(id => st.swimmers[id]).filter(s => s && s.trainingGroup === g.key).length;
      return `
        <div class="card training-group-card">
          <div class="card-header">
            <div>
              <h4>${escapeHtml(g.title)}</h4>
              <small class="muted-p">${escapeHtml(g.desc)}</small>
            </div>
            <span class="badge badge-slate">${count} Swimmers</span>
          </div>
          <div class="btn-group mt-12 full-width-group">
            ${["heavy", "standard", "rest", "taper"]
              .map(
                ld => `
              <button type="button" class="btn btn-sm ${curLoad === ld ? "btn-primary" : "btn-ghost"}"
                onclick="setTrainingGroupLoad('${g.key}', '${ld}')">
                ${ld.toUpperCase()}
              </button>
            `
              )
              .join("")}
          </div>
          <div class="load-effect-note mt-8">${escapeHtml(loadEffects[curLoad])}</div>
        </div>
      `;
    })
    .join("");

  // Season Calendar Strip
  const calWeeks = [];
  for (let w = 1; w <= 17; w++) {
    const isCur = st.phase !== "offseason" && st.week === w;
    const isDist = isDistanceWeek(w);
    const label = w <= 14 ? `W${w}` : w === 15 ? "R1" : w === 16 ? "QF" : "FIN";
    const sub = isDist ? "DIST" : w === 10 ? "TRD" : w >= 15 ? "POST" : "STD";
    calWeeks.push(`
      <div class="cal-week-box ${isCur ? "cal-current" : ""} ${isDist ? "cal-dist" : ""}">
        <div class="cal-wk-num">${label}</div>
        <div class="cal-wk-sub">${sub}</div>
      </div>
    `);
  }

  // Swimmer Conditioning Table
  const swimmers = userTeam.roster.map(id => st.swimmers[id]).filter(Boolean);
  const swRows = swimmers
    .map(sw => {
      if (!sw.baseTimesCache) recomputeSwimmerBaseTimes(sw);
      const condMult = getConditioningMultiplier(sw, { isHome: false, isNeutral: true });
      const pctVsTapered = ((condMult - 1.0) * 100).toFixed(2);
      const bestEv = sw.baseTimesCache.bestEventId;
      const tapBase = sw.baseTimesCache.ind[bestEv];
      const todayProj = projectSwimmerTime(sw, bestEv, { isHome: false, isNeutral: true });

      return `
        <tr>
          <td>${swimmerLink(sw)}</td>
          <td>${sw.gender} • ${sw.age}</td>
          <td><span class="badge badge-slate">${sw.archetype}</span></td>
          <td>
            <select class="select-input select-xs" onchange="changeSwimmerTrainingGroup(${sw.id}, this.value)">
              <option value="sprint" ${sw.trainingGroup === "sprint" ? "selected" : ""}>Sprint</option>
              <option value="mid" ${sw.trainingGroup === "mid" ? "selected" : ""}>Mid-Dist</option>
              <option value="distance" ${sw.trainingGroup === "distance" ? "selected" : ""}>Distance</option>
              <option value="stroke" ${sw.trainingGroup === "stroke" ? "selected" : ""}>Stroke/IM</option>
            </select>
          </td>
          <td data-val="${sw.conditioning.fitness}">
            <div class="mini-bar-wrap"><div class="mini-bar-fill bg-green" style="width:${sw.conditioning.fitness}%"></div><span>${sw.conditioning.fitness}</span></div>
          </td>
          <td data-val="${sw.conditioning.fatigue}">
            <div class="mini-bar-wrap"><div class="mini-bar-fill bg-amber" style="width:${sw.conditioning.fatigue}%"></div><span>${sw.conditioning.fatigue}</span></div>
          </td>
          <td><span class="badge ${sw.conditioning.taperStatus === "tapered" ? "badge-gold" : sw.conditioning.taperStatus === "resting" ? "badge-cyan" : "badge-slate"}">${sw.conditioning.taperStatus.toUpperCase()}</span></td>
          <td data-val="${sw.conditioning.tapersUsed}">${sw.conditioning.tapersUsed} / 2</td>
          <td data-val="${sw.skills.taperResponse}">${sw.skills.taperResponse.toFixed(2)}x</td>
          <td data-val="${sw.skills.durability}">${sw.skills.durability}</td>
          <td data-val="${ condMult }"><strong>${bestEv}:</strong> ${formatTime(todayProj)} <small class="muted-p">(Peak ${formatTime(tapBase)} • ${condMult >= 1 ? "+" : ""}${pctVsTapered}%)</small></td>
        </tr>
      `;
    })
    .join("");

  return `
    <div class="card mb-16">
      <div class="card-header">
        <div>
          <h3>Season Periodization & Training Load Planner</h3>
          <p class="muted-p">Set weekly yardage intensity for each training group. Distance Card weeks (1650 Free & 400 IM) are Weeks 3, 7, 10, and 13. Full Taper lasts 2 weeks and works up to twice per season.</p>
        </div>
        <div class="flex-align-center gap-8">
          <button type="button" class="btn btn-sm btn-secondary" onclick="setAllTrainingGroupsLoad('heavy')">All Heavy</button>
          <button type="button" class="btn btn-sm btn-secondary" onclick="setAllTrainingGroupsLoad('standard')">All Standard</button>
          <button type="button" class="btn btn-sm btn-secondary" onclick="setAllTrainingGroupsLoad('rest')">All Rest</button>
          <button type="button" class="btn btn-sm btn-accent" onclick="setAllTrainingGroupsLoad('taper')">All Full Taper</button>
        </div>
      </div>
      <div class="calendar-strip mt-12">${calWeeks.join("")}</div>
    </div>

    <div class="training-groups-grid mb-16">
      ${groupCards}
    </div>

    <div class="card">
      <div class="card-header">
        <h3>Swimmer Conditioning, Taper Response & Today's Projected Readiness</h3>
      </div>
      <div class="table-scroll">
        <table class="data-table sortable-table">
          <thead>
            <tr>
              <th data-sort="text">Swimmer</th>
              <th data-sort="text">G/Age</th>
              <th data-sort="text">Profile</th>
              <th>Group</th>
              <th data-sort="num">Fitness</th>
              <th data-sort="num">Fatigue</th>
              <th data-sort="text">Taper State</th>
              <th data-sort="num">Peaks Used</th>
              <th data-sort="num">Taper Resp</th>
              <th data-sort="num">Durability</th>
              <th data-sort="num">Today vs Tapered Peak</th>
            </tr>
          </thead>
          <tbody>${swRows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function setTrainingGroupLoad(groupKey, load) {
  const st = APP_UI.state;
  const userTeam = st.teams[st.userTeamId];
  userTeam.trainingPlan[groupKey] = load;
  st.settings.autoTraining = false;
  saveLeagueToStorage(st, false);
  renderEntireApp();
}

function setAllTrainingGroupsLoad(load) {
  const st = APP_UI.state;
  const userTeam = st.teams[st.userTeamId];
  for (const k of ["sprint", "mid", "distance", "stroke"]) {
    userTeam.trainingPlan[k] = load;
  }
  st.settings.autoTraining = false;
  saveLeagueToStorage(st, false);
  renderEntireApp();
  showToast(`Set all 4 training groups to ${load.toUpperCase()} load.`, "info");
}

function changeSwimmerTrainingGroup(swimmerId, newGroup) {
  const st = APP_UI.state;
  const sw = st.swimmers[swimmerId];
  if (!sw) return;
  sw.trainingGroup = newGroup;
  saveLeagueToStorage(st, false);
  renderEntireApp();
}

// ============================================================================
// SCREEN 4: MEET LINEUP EDITOR & OPPONENT SCOUTING REPORT
// ============================================================================

function ensureEditingLineupInitialized(st, meet) {
  if (!meet) return null;
  if (APP_UI.editingMeetId === meet.id && APP_UI.editingLineup) {
    return APP_UI.editingLineup;
  }
  const uid = st.userTeamId;
  const userTeam = st.teams[uid];
  const isChamp = Boolean(meet.isChampionshipFinal);
  const isHome = meet.homeTeamId === uid;
  const existing = meet.lineups?.[uid];
  const baseLineup = existing
    ? JSON.parse(JSON.stringify(existing))
    : generateTeamLineup(userTeam, st.swimmers, {
        week: st.week,
        cardType: meet.cardType,
        isChampionshipFinal: isChamp,
        isHome,
        isPlayoff: st.phase !== "regular"
      });

  APP_UI.editingMeetId = meet.id;
  APP_UI.editingLineup = baseLineup;
  if (!meet.lineups) meet.lineups = {};
  meet.lineups[uid] = baseLineup;
  return baseLineup;
}

function commitEditedLineupIfValid(st) {
  const meet = findUserCurrentMeet(st);
  if (!meet || !APP_UI.editingLineup || APP_UI.editingMeetId !== meet.id) return;
  const uid = st.userTeamId;
  const userTeam = st.teams[uid];
  const isChamp = Boolean(meet.isChampionshipFinal);
  const v = validateTeamLineup(userTeam, st.swimmers, APP_UI.editingLineup, {
    week: st.week,
    cardType: meet.cardType,
    isChampionshipFinal: isChamp
  });
  if (v.valid) {
    if (!meet.lineups) meet.lineups = {};
    meet.lineups[uid] = JSON.parse(JSON.stringify(APP_UI.editingLineup));
  }
}

function autoRewriteUserLineup() {
  const st = APP_UI.state;
  const meet = findUserCurrentMeet(st);
  if (!meet) return;
  const uid = st.userTeamId;
  const userTeam = st.teams[uid];
  const isChamp = Boolean(meet.isChampionshipFinal);
  const isHome = meet.homeTeamId === uid;
  const fresh = generateTeamLineup(userTeam, st.swimmers, {
    week: st.week,
    cardType: meet.cardType,
    isChampionshipFinal: isChamp,
    isHome,
    isPlayoff: st.phase !== "regular"
  });
  APP_UI.editingMeetId = meet.id;
  APP_UI.editingLineup = fresh;
  if (!meet.lineups) meet.lineups = {};
  meet.lineups[uid] = fresh;
  saveLeagueToStorage(st, false);
  renderEntireApp();
  showToast("Optimal lineup generated based on opponent scouting & swimmer conditioning.", "success");
}

function changePlayoffHostCardType(newCardType) {
  const st = APP_UI.state;
  const meet = findUserCurrentMeet(st);
  if (!meet || meet.isChampionshipFinal) return;
  if (meet.homeTeamId !== st.userTeamId) return;
  meet.cardType = newCardType;
  meet.lineups = {};
  APP_UI.editingMeetId = null;
  APP_UI.editingLineup = null;
  saveLeagueToStorage(st, false);
  renderEntireApp();
  showToast(`Switched playoff meet card to ${newCardType.toUpperCase()} card.`, "info");
}

function renderLineupScreen(st) {
  const meet = findUserCurrentMeet(st);
  if (st.phase === "offseason" || !meet) {
    return `
      <div class="card">
        <div class="card-header"><h3>Meet Lineup Editor</h3></div>
        <p class="muted-p">There is no active meet for your club this week (${escapeHtml(getPhaseDisplayLabel(st))}).</p>
        <div class="btn-row mt-12">
          <button type="button" class="btn btn-primary" onclick="switchTab('hub')">Return to Dashboard</button>
        </div>
      </div>
    `;
  }

  const uid = st.userTeamId;
  const userTeam = st.teams[uid];
  const isChamp = Boolean(meet.isChampionshipFinal);
  const isHome = meet.homeTeamId === uid;
  const lineup = ensureEditingLineupInitialized(st, meet);

  const program = isChamp
    ? getChampionshipFinalProgram()
    : getDualMeetProgram(st.week, meet.cardType);

  const validation = validateTeamLineup(userTeam, st.swimmers, lineup, {
    week: st.week,
    cardType: meet.cardType,
    isChampionshipFinal: isChamp
  });

  // Compute swimmer usage counts & prior slots for accurate same-meet fatigue display
  const maxInd = 3;
  const maxTotal = isChamp ? 7 : 4;
  const indCounts = {};
  const totalCounts = {};
  const priorSlotsBySwimmer = {};

  for (const sid of userTeam.roster) {
    indCounts[sid] = 0;
    totalCounts[sid] = 0;
    priorSlotsBySwimmer[sid] = [];
  }

  for (const slotObj of program) {
    const key = `${slotObj.slot}_${slotObj.eventId}_${slotObj.gender}`;
    const ev = EVENT_MAP[slotObj.eventId];
    if (ev.isRelay) {
      const rArr = lineup.relays[key] || [];
      for (const r of rArr) {
        for (const sid of r.legs) {
          if (sid) {
            totalCounts[sid] = (totalCounts[sid] || 0) + 1;
            priorSlotsBySwimmer[sid] = priorSlotsBySwimmer[sid] || [];
            priorSlotsBySwimmer[sid].push({ slot: slotObj.slot, day: slotObj.day, dist: Math.round(ev.dist / 4) });
          }
        }
      }
    } else {
      const iArr = lineup.individual[key] || [];
      for (const sid of iArr) {
        if (sid) {
          indCounts[sid] = (indCounts[sid] || 0) + 1;
          totalCounts[sid] = (totalCounts[sid] || 0) + 1;
          priorSlotsBySwimmer[sid] = priorSlotsBySwimmer[sid] || [];
          priorSlotsBySwimmer[sid].push({ slot: slotObj.slot, day: slotObj.day, dist: ev.dist });
        }
      }
    }
  }

  // Opponent scouting & live projected score
  let oppTeam = null;
  let oppLineup = null;
  let projBannerHtml = "";

  if (!isChamp) {
    const oppId = isHome ? meet.awayTeamId : meet.homeTeamId;
    oppTeam = st.teams[oppId];
    oppLineup = meet.lineups?.[oppId] || generateTeamLineup(oppTeam, st.swimmers, {
      week: st.week,
      cardType: meet.cardType,
      isChampionshipFinal: false,
      isHome: !isHome,
      isPlayoff: st.phase !== "regular"
    });
    const homeTeam = isHome ? userTeam : oppTeam;
    const awayTeam = isHome ? oppTeam : userTeam;
    const hLineup = isHome ? lineup : oppLineup;
    const aLineup = isHome ? oppLineup : lineup;

    const proj = projectDualMeetScore(homeTeam, awayTeam, st.swimmers, st.week, meet.cardType, hLineup, aLineup);
    const userScore = isHome ? proj.homeProjected : proj.awayProjected;
    const oppScore = isHome ? proj.awayProjected : proj.homeProjected;
    const margin = userScore - oppScore;

    // Playoff host card choice
    const canChooseCard = (st.phase === "playoffs_r1" || st.phase === "playoffs_r2") && isHome;
    const hostCardPicker = canChooseCard
      ? `
        <div class="host-card-picker">
          <span><strong>Playoff Host Advantage — Choose Meet Card:</strong></span>
          <button type="button" class="btn btn-xs ${meet.cardType === "standard" ? "btn-primary" : "btn-ghost"}" onclick="changePlayoffHostCardType('standard')">Standard Card (1000FR / 200IM)</button>
          <button type="button" class="btn btn-xs ${meet.cardType === "distance" ? "btn-primary" : "btn-ghost"}" onclick="changePlayoffHostCardType('distance')">Distance Card (1650FR / 400IM)</button>
        </div>
      `
      : "";

    projBannerHtml = `
      <div class="projected-score-banner">
        <div class="proj-team-col">
          ${teamBadgeHtml(userTeam.id, true)}
          <div class="proj-big-score ${margin >= 0 ? "text-success" : ""}">${userScore.toFixed(1)}</div>
          <small>Projected Points (${isHome ? "HOME" : "AWAY"})</small>
        </div>
        <div class="proj-center-col">
          <div class="badge ${validation.valid ? "badge-success" : "badge-danger"}">
            ${validation.valid ? "✓ LINEUP LEGAL" : "⚠ " + escapeHtml(validation.errors[0])}
          </div>
          <div class="proj-margin-text mt-4">
            Projected Spread: <strong>${margin >= 0 ? "+" : ""}${margin.toFixed(1)} pts</strong>
          </div>
          ${hostCardPicker}
          <div class="btn-row mt-8">
            <button type="button" class="btn btn-sm btn-secondary" onclick="autoRewriteUserLineup()">Auto-Optimize Lineup</button>
            <button type="button" class="btn btn-sm btn-accent" onclick="watchCurrentMeetLive()">Swim & Watch Live →</button>
            <button type="button" class="btn btn-sm btn-primary" onclick="handlePrimaryAdvanceAction()">Quick-Sim Meet →</button>
          </div>
        </div>
        <div class="proj-team-col">
          ${teamBadgeHtml(oppTeam.id, true)}
          <div class="proj-big-score ${margin < 0 ? "text-warn" : ""}">${oppScore.toFixed(1)}</div>
          <small>Opponent Projected (${isHome ? "AWAY" : "HOME"})</small>
        </div>
      </div>
    `;
  } else {
    projBannerHtml = `
      <div class="projected-score-banner">
        <div class="proj-center-col" style="width:100%">
          <h3>${escapeHtml(FINAL_MEET_NAME)} — 3-Day Timed Finals Lineup</h3>
          <div class="badge ${validation.valid ? "badge-success" : "badge-danger"} mt-4">
            ${validation.valid ? "✓ CHAMPIONSHIP LINEUP LEGAL (Max 3 Ind / 7 Total)" : "⚠ " + escapeHtml(validation.errors[0])}
          </div>
          <div class="btn-row mt-8">
            <button type="button" class="btn btn-sm btn-secondary" onclick="autoRewriteUserLineup()">Auto-Optimize 3-Day Lineup</button>
            <button type="button" class="btn btn-sm btn-accent" onclick="watchCurrentMeetLive()">Watch Championship Live →</button>
            <button type="button" class="btn btn-sm btn-primary" onclick="handlePrimaryAdvanceAction()">Quick-Sim Championship →</button>
          </div>
        </div>
      </div>
    `;
  }

  // Build Event Cards
  const healthyF = userTeam.roster.map(id => st.swimmers[id]).filter(s => s && s.gender === "F");
  const healthyM = userTeam.roster.map(id => st.swimmers[id]).filter(s => s && s.gender === "M");

  const eventCardsHtml = program
    .map(slotObj => {
      const ev = EVENT_MAP[slotObj.eventId];
      const key = `${slotObj.slot}_${slotObj.eventId}_${slotObj.gender}`;
      const gLabel = slotObj.gender === "F" ? "Women's" : slotObj.gender === "M" ? "Men's" : "Mixed";
      const dayBadge = isChamp ? `<span class="badge badge-slate">Day ${slotObj.day}</span>` : "";

      if (!ev.isRelay) {
        const pool = slotObj.gender === "F" ? healthyF : healthyM;
        const assigned = lineup.individual[key] || [];
        const maxSlots = isChamp ? 2 : 3;

        // Opponent projected entries for this slot
        let oppHtml = "";
        if (oppLineup && oppTeam) {
          const oppIds = oppLineup.individual[key] || [];
          const oppItems = oppIds
            .map((oid, idx) => {
              const osw = st.swimmers[oid];
              if (!osw) return "";
              const ot = projectSwimmerTime(osw, slotObj.eventId, { isHome: !isHome, isNeutral: false });
              return `<div class="opp-entry-row"><span>#${idx + 1} ${swimmerLink(osw)}</span> <strong>${formatTime(ot)}</strong></div>`;
            })
            .join("");
          oppHtml = `
            <div class="lineup-opp-col">
              <div class="opp-col-title">${escapeHtml(oppTeam.abbr)} Projected Entries</div>
              ${oppItems || "<small class='muted-p'>None</small>"}
            </div>
          `;
        }

        const selectorsHtml = [];
        for (let eIdx = 0; eIdx < maxSlots; eIdx++) {
          const curId = assigned[eIdx] || "";
          const curSw = curId ? st.swimmers[curId] : null;
          const priorBeforeThis = curSw
            ? (priorSlotsBySwimmer[curSw.id] || []).filter(p => p.slot < slotObj.slot && p.day === slotObj.day)
            : [];
          const projT = curSw
            ? projectSwimmerTime(curSw, slotObj.eventId, {
                isHome,
                isNeutral: isChamp,
                isBigMeet: isChamp || st.phase !== "regular",
                priorSwimsInMeet: priorBeforeThis,
                currentSlot: slotObj.slot,
                currentDay: slotObj.day
              })
            : null;
          const hasCloseDouble = priorBeforeThis.some(p => Math.abs(slotObj.slot - p.slot) <= 2);

          const opts = pool
            .map(sw => {
              const pBefore = (priorSlotsBySwimmer[sw.id] || []).filter(p => p.slot < slotObj.slot && p.day === slotObj.day);
              const t = projectSwimmerTime(sw, slotObj.eventId, {
                isHome,
                isNeutral: isChamp,
                isBigMeet: isChamp || st.phase !== "regular",
                priorSwimsInMeet: pBefore,
                currentSlot: slotObj.slot,
                currentDay: slotObj.day
              });
              const sel = sw.id === curId ? "selected" : "";
              return `<option value="${sw.id}" ${sel}>${escapeHtml(sw.name)} — ${formatTime(t)} (${indCounts[sw.id]}/${maxInd} Ind, ${totalCounts[sw.id]}/${maxTotal} Tot)</option>`;
            })
            .join("");

          selectorsHtml.push(`
            <div class="lineup-slot-row">
              <span class="slot-rank-label">Entry #${eIdx + 1}${eIdx === 2 ? " (Opt)" : ""}</span>
              <select class="select-input lineup-select" onchange="updateUserIndEntry('${key}', ${eIdx}, this.value)">
                ${eIdx === 2 ? `<option value="" ${!curId ? "selected" : ""}>— Empty 3rd Slot —</option>` : ""}
                ${opts}
              </select>
              <span class="proj-time-pill ${hasCloseDouble ? "text-warn" : ""}" title="${hasCloseDouble ? "Includes back-to-back lactate fatigue penalty" : "Projected time today"}">
                ${projT ? formatTime(projT) : "—"}${hasCloseDouble ? " ⚡" : ""}
              </span>
            </div>
          `);
        }

        return `
          <div class="lineup-event-card">
            <div class="lineup-ev-header">
              <div>
                <span class="ev-num">Event #${slotObj.slot}</span>
                <strong>${gLabel} ${escapeHtml(ev.name)}</strong>
                ${dayBadge}
              </div>
              <span class="badge badge-slate">Bench: ${formatTime(getBenchmark(ev.id, slotObj.gender))}</span>
            </div>
            <div class="lineup-ev-body">
              <div class="lineup-user-col">${selectorsHtml.join("")}</div>
              ${oppHtml}
            </div>
          </div>
        `;
      } else {
        // Relay event card
        const relaysList = lineup.relays[key] || [];
        const relayA = relaysList[0] || { label: "A", legs: [] };
        const legStrokes = ev.legs;

        // If Mixed Relay, show a quick Gender Order Preset selector (2W + 2M)
        let mixedOrderControls = "";
        if (ev.mixed) {
          const currentGenders = relayA.legs.map(id => st.swimmers[id]?.gender || "M").join("-");
          const presets = ["M-M-F-F", "M-F-M-F", "F-M-M-F", "F-F-M-M", "M-F-F-M", "F-M-F-M"];
          mixedOrderControls = `
            <div class="mixed-order-bar mb-8">
              <span><strong>Mixed Relay Gender Order (2W + 2M):</strong></span>
              <div class="btn-group">
                ${presets
                  .map(
                    ord => `
                  <button type="button" class="btn btn-xs ${currentGenders === ord ? "btn-primary" : "btn-ghost"}"
                    onclick="applyMixedRelayOrderPreset('${key}', '${ord}')">${ord}</button>
                `
                  )
                  .join("")}
              </div>
            </div>
          `;
        }

        let sumA = 0;
        const legRowsA = [];
        for (let li = 0; li < 4; li++) {
          const legEvId = legStrokes[li];
          const curId = relayA.legs[li] || "";
          const curSw = curId ? st.swimmers[curId] : null;
          const pool = ev.mixed ? [...healthyM, ...healthyF] : slotObj.gender === "F" ? healthyF : healthyM;

          const pBefore = curSw
            ? (priorSlotsBySwimmer[curSw.id] || []).filter(p => p.slot < slotObj.slot && p.day === slotObj.day)
            : [];
          const flatT = curSw
            ? projectSwimmerTime(curSw, legEvId, {
                isHome,
                isNeutral: isChamp,
                priorSwimsInMeet: pBefore,
                currentSlot: slotObj.slot,
                currentDay: slotObj.day
              })
            : 0;
          const exGain = li > 0 && curSw ? 0.46 + ((curSw.skills.relayExchange - 50) / 50) * 0.16 : 0;
          const legT = curSw ? roundHundredth(flatT - exGain) : 0;
          sumA += legT;

          const opts = pool
            .map(sw => {
              const t = projectSwimmerTime(sw, legEvId, { isHome, isNeutral: isChamp });
              const sel = sw.id === curId ? "selected" : "";
              return `<option value="${sw.id}" ${sel}>[${sw.gender}] ${escapeHtml(sw.name)} — ${formatTime(t)} flat (${totalCounts[sw.id]}/${maxTotal} Tot)</option>`;
            })
            .join("");

          legRowsA.push(`
            <div class="lineup-slot-row">
              <span class="slot-rank-label">Leg ${li + 1} (${legEvId})</span>
              <select class="select-input lineup-select" onchange="updateUserRelayLeg('${key}', 0, ${li}, this.value)">
                ${opts}
              </select>
              <span class="proj-time-pill">${curSw ? formatTime(legT) + (li > 0 ? " (fly)" : " (flat)") : "—"}</span>
            </div>
          `);
        }

        // Opponent A-Relay preview
        let oppRelayHtml = "";
        if (oppLineup && oppTeam) {
          const oppRelA = oppLineup.relays[key]?.[0];
          if (oppRelA && oppRelA.legs.length === 4) {
            let oppSum = 0;
            const oppLegsStr = oppRelA.legs
              .map((oid, li) => {
                const osw = st.swimmers[oid];
                if (!osw) return "";
                const ft = projectSwimmerTime(osw, legStrokes[li], { isHome: !isHome, isNeutral: false });
                const lt = li > 0 ? ft - 0.53 : ft;
                oppSum += lt;
                return `<div class="opp-entry-row"><span>L${li + 1} (${osw.gender}) ${swimmerLink(osw)}</span> <strong>${formatTime(lt)}</strong></div>`;
              })
              .join("");
            oppRelayHtml = `
              <div class="lineup-opp-col">
                <div class="opp-col-title">${escapeHtml(oppTeam.abbr)} A-Relay (${formatTime(oppSum)})</div>
                ${oppLegsStr}
              </div>
            `;
          }
        }

        return `
          <div class="lineup-event-card relay-event-card">
            <div class="lineup-ev-header">
              <div>
                <span class="ev-num">Event #${slotObj.slot} • RELAY</span>
                <strong>${gLabel} ${escapeHtml(ev.name)}</strong>
                ${dayBadge}
              </div>
              <span class="badge badge-cyan">A-Relay Proj: ${formatTime(sumA)}</span>
            </div>
            ${mixedOrderControls}
            <div class="lineup-ev-body">
              <div class="lineup-user-col">${legRowsA.join("")}</div>
              ${oppRelayHtml}
            </div>
          </div>
        `;
      }
    })
    .join("");

  // Swimmer Usage Sidebar
  const renderUsageRows = list =>
    list
      .map(sw => {
        const ic = indCounts[sw.id] || 0;
        const tc = totalCounts[sw.id] || 0;
        const over = ic > maxInd || tc > maxTotal;
        return `
          <tr class="${over ? "row-danger" : ""}">
            <td>${swimmerLink(sw)}</td>
            <td><small>${sw.archetype}</small></td>
            <td data-val="${ic}"><strong>${ic}</strong> / ${maxInd}</td>
            <td data-val="${tc}"><strong>${tc}</strong> / ${maxTotal}</td>
          </tr>
        `;
      })
      .join("");

  return `
    ${projBannerHtml}
    <div class="lineup-workspace-grid mt-16">
      <div class="lineup-events-col">
        ${eventCardsHtml}
      </div>
      <div class="lineup-sidebar-col">
        <div class="card sticky-card">
          <div class="card-header">
            <h4>Entry Load Tracker</h4>
            <small class="muted-p">Max ${maxInd} Ind / ${maxTotal} Total</small>
          </div>
          <h5 class="mt-8 mb-4">Women (14)</h5>
          <table class="data-table compact-table">
            <thead><tr><th>Swimmer</th><th>Type</th><th>Ind</th><th>Tot</th></tr></thead>
            <tbody>${renderUsageRows(healthyF)}</tbody>
          </table>
          <h5 class="mt-12 mb-4">Men (14)</h5>
          <table class="data-table compact-table">
            <thead><tr><th>Swimmer</th><th>Type</th><th>Ind</th><th>Tot</th></tr></thead>
            <tbody>${renderUsageRows(healthyM)}</tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

function updateUserIndEntry(slotKey, entryIdx, swimmerIdStr) {
  const st = APP_UI.state;
  const meet = findUserCurrentMeet(st);
  if (!meet) return;
  const lineup = ensureEditingLineupInitialized(st, meet);
  if (!lineup.individual[slotKey]) lineup.individual[slotKey] = [];
  const arr = lineup.individual[slotKey];
  if (!swimmerIdStr) {
    arr.splice(entryIdx, 1);
  } else {
    const newId = Number(swimmerIdStr);
    // If swimmer already in another slot of this same event, swap
    const existingIdx = arr.indexOf(newId);
    if (existingIdx !== -1 && existingIdx !== entryIdx) {
      const oldId = arr[entryIdx];
      arr[existingIdx] = oldId;
    }
    arr[entryIdx] = newId;
  }
  st.settings.autoLineup = false;
  commitEditedLineupIfValid(st);
  saveLeagueToStorage(st, false);
  renderEntireApp();
}

function updateUserRelayLeg(slotKey, relayIdx, legIdx, swimmerIdStr) {
  const st = APP_UI.state;
  const meet = findUserCurrentMeet(st);
  if (!meet) return;
  const lineup = ensureEditingLineupInitialized(st, meet);
  const relObj = lineup.relays[slotKey]?.[relayIdx];
  if (!relObj) return;
  const newId = Number(swimmerIdStr);
  const existingLeg = relObj.legs.indexOf(newId);
  if (existingLeg !== -1 && existingLeg !== legIdx) {
    const prevId = relObj.legs[legIdx];
    relObj.legs[existingLeg] = prevId;
  }
  relObj.legs[legIdx] = newId;
  st.settings.autoLineup = false;
  commitEditedLineupIfValid(st);
  saveLeagueToStorage(st, false);
  renderEntireApp();
}

function applyMixedRelayOrderPreset(slotKey, orderStr) {
  const st = APP_UI.state;
  const meet = findUserCurrentMeet(st);
  if (!meet) return;
  const lineup = ensureEditingLineupInitialized(st, meet);
  const relObj = lineup.relays[slotKey]?.[0];
  if (!relObj) return;

  const parts = slotKey.split("_");
  const evId = parts[1];
  const rev = EVENT_MAP[evId];
  const ord = orderStr.split("-"); // e.g. ['M','F','M','F']
  const userTeam = st.teams[st.userTeamId];
  const healthyF = userTeam.roster.map(id => st.swimmers[id]).filter(s => s && s.gender === "F");
  const healthyM = userTeam.roster.map(id => st.swimmers[id]).filter(s => s && s.gender === "M");

  const used = new Set();
  const newLegs = [];
  for (let li = 0; li < 4; li++) {
    const legEv = rev.legs[li];
    const pool = (ord[li] === "F" ? healthyF : healthyM).filter(s => !used.has(s.id));
    let bestSw = pool[0], bestT = 1e9;
    for (const sw of pool) {
      const t = projectSwimmerTime(sw, legEv, { isHome: meet.homeTeamId === st.userTeamId });
      if (t < bestT) {
        bestT = t;
        bestSw = sw;
      }
    }
    if (bestSw) {
      used.add(bestSw.id);
      newLegs.push(bestSw.id);
    }
  }
  if (newLegs.length === 4) {
    relObj.legs = newLegs;
    st.settings.autoLineup = false;
    commitEditedLineupIfValid(st);
    saveLeagueToStorage(st, false);
    renderEntireApp();
    showToast(`Applied ${orderStr} gender order to ${rev.name}.`, "info");
  }
}

function openMeetBoxScore(meetId) {
  const st = APP_UI.state;
  if (!st) return;
  let found = null;
  for (const wk of st.schedule) {
    const m = wk.meets.find(x => x.id === meetId);
    if (m) { found = m; break; }
  }
  if (!found && st.playoffs) {
    found = (st.playoffs.round1Meets || []).find(x => x.id === meetId) ||
            (st.playoffs.round2Meets || []).find(x => x.id === meetId) ||
            (st.playoffs.finalMeet?.id === meetId ? st.playoffs.finalMeet : null);
  }
  if (found) {
    stopLiveMeetPlayback();
    APP_UI.viewingMeet = found;
    APP_UI.liveEventIndex = Math.max(0, (found.result?.eventResults?.length || 1) - 1);
    APP_UI.liveElapsedSec = 9999;
    APP_UI.activeTab = "meet";
    renderEntireApp();
  }
}

function selectMeetFromDropdown(meetId) {
  openMeetBoxScore(meetId);
}

  }
  for (const m of st.playoffs?.round2Meets || []) {
    if (m.result) completedMeets.push({ m, label: `Playoff QF: ${TEAMS_CONFIG[m.awayTeamId].abbr} @ ${TEAMS_CONFIG[m.homeTeamId].abbr}` });
