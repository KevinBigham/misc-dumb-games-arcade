  else if(mode==='cuts') c.push({l:'Camp deal',c:'r',v:s=>campPrice(s),h:s=>money(campPrice(s))},{l:'',h:s=>'<button class="sm" data-act="campsign" data-id="'+s.id+'">Sign</button>'});
  else c.push({l:'Cost',c:'r',v:s=>market(s),h:s=>money(clamp(Math.round(market(s)*0.6/5)*5,MINSAL,MAXSAL))},{l:'',h:s=>'<a data-go="sw:'+s.id+'">Sign…</a>'});
  return c;
}
function faPanel(mode){ const L=UI.L, sx=UI.tab.fasx; const list=L.fa.map(id=>L.sw[id]).filter(s=>sx==null||s.sx===sx);
  return panel('Free agents ('+list.length+')',tbl('fa'+mode,faCols(L,mode),list,{sort:{i:4,d:-1},empty:'The pool is empty.'}),[['All',null],['Women',0],['Men',1]].map(x=>'<button class="sm '+(sx===x[1]||(sx==null&&x[1]==null)?'on':'')+'" data-act="fasx" data-v="'+x[1]+'">'+x[0]+'</button>').join('')); }
ACT.fasx=d=>{ UI.tab.fasx=d.v==='null'?null:+d.v; render(); };
ACT.offer=d=>{ const e=userOffer(UI.L,+d.id,+$('os'+d.id).value,+$('oy'+d.id).value); toast(e||'Offer on the table. He or she decides when the round closes.',!!e); saveGame(); render(); };
ACT.unoffer=d=>{ delete UI.L.faS.offers[d.id]; saveGame(); render(); };
ACT.campsign=d=>{ const e=userCampSign(UI.L,+d.id); toast(e||'Signed.',!!e); saveGame(); render(); };
ACT.release=d=>{ const e=userRelease(UI.L,+d.id); toast(e||'Released to the free-agent pool.',!!e); saveGame(); render(); };
function tradePanel(){
  const L=UI.L, U=L.userTid, X=UI.trade; if(X.with<0||X.with===U) X.with=U===0?1:0; const B=L.teams[X.with], A=L.teams[U];
  X.a.sw=X.a.sw.filter(id=>A.ros.includes(id)); X.b.sw=X.b.sw.filter(id=>B.ros.includes(id)); X.a.pk=X.a.pk.filter(k=>pkOwner(L,k)===U); X.b.pk=X.b.pk.filter(k=>pkOwner(L,k)===X.with);
  const any=X.a.sw.length+X.a.pk.length+X.b.sw.length+X.b.pk.length>0, ev=any?evalTrade(L,U,X.with,X.a,X.b):null;
  const side=(T,g,key)=>{ const sw=T.ros.map(id=>L.sw[id]).filter(s=>s.c.tmp==null);
    return tbl('tr'+key,[{l:'',h:s=>'<input type="checkbox" data-ch="trsel" data-side="'+key+'" data-id="'+s.id+'"'+(g.sw.includes(s.id)?' checked':'')+'>'},{l:'Swimmer',v:s=>s.nm.split(' ').slice(-1)[0],d:1,h:s=>swL(s.id)+swTags(s)},{l:'',v:s=>s.sx,d:1,h:s=>SXC[s.sx]},{l:'Age',c:'r',v:s=>s.age,h:s=>s.age},{l:'Type',v:s=>s.ty,d:1,h:s=>TYL[s.ty]},{l:'Ovr',c:'r',v:s=>valOf(s),h:s=>profOf(s).ovr},{l:'Pot',c:'c',v:s=>potVal(s),h:potCell},{l:'Salary',c:'r',v:s=>s.c.sal,h:s=>money(s.c.sal)+' ×'+s.c.yrs},{l:'Their value',c:'r',v:s=>tradeVal(L,s,B),h:s=>Math.round(tradeVal(L,s,B))}],sw,{sort:{i:5,d:-1}})+
      '<div class="pb"><div class="cond mute">Draft picks</div><div class="chips">'+ownedPicks(L,T.id).map(k=>'<label class="chip'+(g.pk.includes(k)?' full':'')+'"><input type="checkbox" data-ch="trpk" data-side="'+key+'" data-k="'+k+'"'+(g.pk.includes(k)?' checked':'')+'> '+pickLabel(k)+' <span class="mute">'+Math.round(pickVal(L,k))+'</span></label>').join('')+'</div></div>'; };
  let top='<div class="pb"><div class="row"><span class="cond">Trade partner</span><select data-ch="trwith">'+L.teams.filter(t=>t.id!==U).map(t=>'<option value="'+t.id+'"'+(t.id===X.with?' selected':'')+'>'+h(TEAM_LIST[t.id].name)+' ('+t.w+'–'+t.l+')</option>').join('')+'</select><span class="mute">'+['Selling: out of the race, wants picks and youth','In between','Buying: contending now, pays for veterans'][teamMode(L,X.with)+1]+'</span><span class="sp"></span><button class="pri" data-act="trpropose"'+(ev&&ev.legal?'':' disabled')+'>Propose trade</button><button data-act="trclear">Clear</button></div>';
  if(ev) top+='<div style="margin-top:8px" class="'+(ev.ok?'good':'bad')+'">'+(ev.legal?(ev.ok?'They would say yes':'They would say no')+' — they value what they get at '+Math.round(ev.inV)+' and what they give at '+Math.round(ev.outV)+'.':h(ev.why))+'</div>';
  else top+='<div class="mute" style="margin-top:8px">Tick swimmers and picks on both sides. Values are from the other team’s point of view: performance, age, contract, and how badly they need that stroke. Three ordinary swimmers do not add up to a star.</div>';
  return panel('Trade desk',top+'</div>')+'<div style="height:14px"></div><div class="grid"><div class="c6">'+panel('You send',side(A,X.a,'a'),'Payroll '+money(payroll(L,A)))+'</div><div class="c6">'+panel(h(TEAM_LIST[X.with].abbr)+' send',side(B,X.b,'b'),'Payroll '+money(payroll(L,B)))+'</div></div>';
}
ACT.trwith=(d,el)=>{ UI.trade={with:+el.value,a:{sw:[],pk:[]},b:{sw:[],pk:[]}}; render(); };
ACT.trsel=(d,el)=>{ const g=UI.trade[d.side].sw, id=+d.id; if(el.checked){ if(!g.includes(id)) g.push(id); } else removeFrom(g,id); render(); };
ACT.trpk=(d,el)=>{ const g=UI.trade[d.side].pk; if(el.checked){ if(!g.includes(d.k)) g.push(d.k); } else removeFrom(g,d.k); render(); };
ACT.trclear=()=>{ UI.trade.a={sw:[],pk:[]}; UI.trade.b={sw:[],pk:[]}; render(); };
ACT.trpropose=()=>{ const L=UI.L, X=UI.trade, ev=evalTrade(L,L.userTid,X.with,X.a,X.b); if(!ev.legal){ toast(ev.why,true); } else if(!ev.ok){ toast(tAbbr(X.with)+' decline. '+ev.why,true); } else { execTrade(L,L.userTid,X.with,X.a,X.b); toast('Trade accepted.'); X.a={sw:[],pk:[]}; X.b={sw:[],pk:[]}; UI.lu=null; saveGame(); } render(); };
function prospectTable(canDraft){ const L=UI.L, T=L.teams[L.userTid]; const list=L.dc.map(id=>L.sw[id]);
  return tbl('pros',[{l:'Prospect',v:s=>s.nm.split(' ').slice(-1)[0],d:1,h:s=>swL(s.id)},{l:'',v:s=>s.sx,d:1,h:s=>SXC[s.sx]},{l:'Age',c:'r',v:s=>s.age,d:1,h:s=>s.age},{l:'Type',v:s=>s.ty,d:1,h:s=>TYL[s.ty]},{l:'Now',c:'r',v:s=>valOf(s),h:s=>'<b>'+profOf(s).ovr+'</b>'},{l:'Scouts say',c:'c',v:s=>potVal(s),h:s=>grade(ovrFromVal(potVal(s)))},
    {l:'Best times',h:s=>bestEv(s,3)},{l:'Last 3 years ('+'top event)',h:s=>s.h?'<span class="t">'+EVN[s.h[0]]+' '+s.h.slice(1).map(fmt).join(' → ')+' → '+fmt(Math.round(abil(s,s.h[0])*101.2))+'</span>':''},
    {l:'Drop/yr',c:'r',v:s=>s.h&&s.h.length>2?(s.h[1]-abil(s,s.h[0])*101.2)/s.h[1]/(s.h.length-1):0,h:s=>s.h&&s.h.length>2?((s.h[1]-abil(s,s.h[0])*101.2)/s.h[1]/(s.h.length-1)*100).toFixed(2)+'%':''},
    {l:'Fit for us',c:'r',v:s=>mvOf(s,teamList(L,T,s.sx)),h:s=>'+'+Math.round(mvOf(s,teamList(L,T,s.sx)))},{l:'',h:s=>canDraft?'<button class="sm pri" data-act="draft" data-id="'+s.id+'">Draft</button>':''}],list,{sort:{i:5,d:-1},empty:'No prospects on the board.'});
}
VIEWS.market=()=>{
  const L=UI.L, names=['Free Agents','Trade'].concat(L.dc.length?['Prospects']:[]), tab=curTab('market','Free Agents'); let o=tabs('market',names);
  if(tab==='Trade') return o+tradePanel();
  if(tab==='Prospects'&&L.dc.length) return o+panel('Draft class',prospectTable(false),'You see their real times. Where the curve goes from here is the scouting question.');
  const mode=L.phase==='off'?(L.off==='fa'?'fa':L.off==='cuts'?'cuts':'closed'):'season';
  if(mode==='closed') return o+'<div class="msg">Free agency opens after the draft. <a data-go="off">Offseason desk</a></div>'+faPanel('view');
  if(mode==='season') o+='<div class="msg">In season you can sign any free agent by releasing someone of the same sex, so the roster stays at 14 and 14. Injured swimmers go to the IL automatically and a short-term replacement is signed at the minimum.</div>';
  return o+faPanel(mode);
};
/* ---------- offseason ---------- */
function offContinue(){ const L=UI.L; if(UI.busy) return; if(L.fired){ toast('Pick your next job first.',true); render(); return; }
  const was=L.off, e=advanceOff(L); if(e){ toast(e,true); } else if(L.phase!=='off'){ toast('Season '+L.season+' is underway. Ownership expects: '+ownerGoalText(L.owner.exp)+'.'); saveGame(); go('hub'); return; }
  else if(was==='fa'&&L.faS){ const mine=L.faS.log.filter(x=>x[1]===L.userTid); toast('Round '+(L.off==='cuts'?FA_ROUNDS:L.faS.round)+' closed: '+L.faS.log.length+' signings league-wide'+(mine.length?', including '+mine.map(x=>L.sw[x[0]].nm).join(', ')+' to you':'')+'.'); }
  saveGame(); render(); }
ACT.offcont=()=>offContinue();
ACT.simoff=()=>{ const L=UI.L; if(L.fired){ toast('Pick your next job first.',true); go('off'); return; } runChunked('Assistant GM runs the offseason',()=>{ if(L.phase!=='off') return false; const g=L.auto.gm; L.auto.gm=true; const e=advanceOff(L); L.auto.gm=g; UI.busy.txt=L.off||'opening day'; return !e&&L.phase==='off'; },()=>{ saveGame(); go(L.phase==='off'?'off':'hub'); },12); };
ACT.takejob=d=>{ takeJob(UI.L,+d.t); UI.lu=null; saveGame(); toast('Welcome to '+TEAM_LIST[+d.t].name+'.'); render(); };
ACT.resign=d=>{ const e=userResign(UI.L,+d.id); toast(e||'Re-signed.',!!e); saveGame(); render(); };
ACT.draft=d=>{ const L=UI.L, D=L.draft; if(!D||!D.picks[D.cur]||D.picks[D.cur].tid!==L.userTid){ toast('You are not on the clock.',true); render(); return; } draftPick(L,+d.id); saveGame(); render(); };
ACT.draftsim=()=>{ draftRun(UI.L,true); saveGame(); render(); };
ACT.draftauto=()=>{ const L=UI.L, D=L.draft; if(D.picks[D.cur]&&D.picks[D.cur].tid===L.userTid) draftCpuPick(L); saveGame(); render(); };
ACT.userfinal=()=>{ const L=UI.L; cpuFinalize(L,L.teams[L.userTid]); toast('Your assistant set the roster at 14 and 14 under the cap.'); saveGame(); render(); };
VIEWS.off=()=>{
  const L=UI.L, U=L.userTid, T=L.teams[U]; if(L.phase!=='off') return '<div class="msg">The offseason desk opens after '+FINAL_NAME+'.</div>';
  const steps=['awards','resign','draft','fa','cuts'], names=['Awards & retirements','Re-signing','Draft','Free agency','Final cuts'];
  let o='<div class="row" style="margin-bottom:12px">'+steps.map((s,i)=>'<span class="chip '+(s===L.off?'full':'')+'" style="font-size:14px;padding:5px 10px">'+(i+1)+' '+names[i]+'</span>').join('')+'<span class="sp"></span><span class="cond mute">Cap room '+money(CAP-payroll(L,T))+' · '+rosterCount(L,T,0)+'W / '+rosterCount(L,T,1)+'M</span></div>';
  const H=L.hist[L.hist.length-1];
  if(L.off==='awards'){
    const me=L.gm.res[L.gm.res.length-1];
    o+='<div class="hero"><div class="cond mute">Season '+H.se+' champions</div><h1>'+h(TEAM_LIST[H.champ].name)+'</h1><div class="mute">'+FINAL_NAME+': '+H.fin.map(x=>tAbbr(x[0])+' '+x[1]).join(' · ')+'</div><div class="row" style="margin-top:10px"><button data-go="season:'+H.se+'">Season review: awards, titles, all-league</button><button data-go="result:final">Final results</button><button data-act="replay" data-i="final">Watch the final</button></div></div>';
    if(L.fired){ o+=panel('You have been fired','<div class="pb">Ownership has moved on. These clubs want to talk:<div class="row" style="margin-top:10px">'+L.fired.offers.map(t=>'<button class="pri" data-act="takejob" data-t="'+t+'">'+h(TEAM_LIST[t].name)+' ('+L.teams[t].w+'–'+L.teams[t].l+')</button>').join('')+'</div></div>'); return o; }
    o+='<div class="grid"><div class="c6">'+panel('Owner’s review','<div class="pb"><div class="kv"><span>Your season</span><b>'+(me?me.w+'–'+me.l+' · '+finishLabel(me.fin):'—')+'</b><span>The goal was</span><b>'+(me?ownerGoalText(me.exp):'—')+'</b><span>Job security</span><b>'+bar(L.owner.sec/100,'a')+' '+L.owner.sec+' <span class="'+(L.owner.last>=0?'good':'bad')+'">('+(L.owner.last>=0?'+':'')+L.owner.last+')</span></b></div></div>')+'</div><div class="c6">'+panel('Offseason wire',newsHTML(L.news.filter(n=>n.s===L.season&&['award','hof','ret','gm','rec'].includes(n.k)).slice(-8).reverse()))+'</div></div>';
    o+='<div style="margin-top:14px"><button class="pri" data-act="offcont">Continue to re-signing ▸</button></div>'; return o; }
  if(L.off==='resign'){ const ex=expiring(L,T);
    o+=panel('Expiring contracts',tbl('exp',[{l:'Swimmer',h:s=>swL(s.id)},{l:'',h:s=>SXC[s.sx]},{l:'Age',c:'r',v:s=>s.age,h:s=>s.age},{l:'Type',h:s=>TYL[s.ty]},{l:'Ovr',c:'r',v:s=>valOf(s),h:s=>profOf(s).ovr},{l:'Pot',c:'c',h:potCell},{l:'Best events',h:s=>bestEv(s,2)},{l:'Was paid',c:'r',h:s=>money(s.c.sal)},{l:'Wants',c:'r',v:s=>resignAsk(s),h:s=>money(resignAsk(s))+' × '+askYears(s)+' yr'},{l:'',h:s=>'<button class="sm pri" data-act="resign" data-id="'+s.id+'">Re-sign</button>'}],ex,{sort:{i:4,d:-1},empty:'Nobody’s deal is up.'}),'Anyone you do not re-sign walks into free agency when you continue');
    o+='<div style="margin-top:14px"><button class="pri" data-act="offcont">Continue to the draft ▸</button></div>'; return o; }
  if(L.off==='draft'){ const D=L.draft, pk=D.picks[D.cur], mineNow=pk&&pk.tid===U;
    o+=panel('Draft board','<div class="pb"><div class="row">'+(pk?'<span class="mid">Pick '+pk.n+' · Round '+pk.rd+'</span> '+tmL(pk.tid,true)+(mineNow?' <span class="tag tr">You are on the clock</span>':''):'<span class="mid">Draft complete</span>')+'<span class="sp"></span>'+(pk?(mineNow?'<button data-act="draftauto">Let my scouts pick</button>':'<button class="pri" data-act="draftsim">Sim to my next pick</button>'):'')+'<button '+(pk?'':'class="pri" ')+'data-act="offcont">'+(pk?'Auto-finish the draft':'Continue to free agency ▸')+'</button></div>'+
      '<div class="chips" style="margin-top:8px">'+D.picks.slice(D.cur,D.cur+14).map(p=>'<span class="chip'+(p.tid===U?' full':'')+'">'+p.n+' '+tAbbr(p.tid)+'</span>').join('')+'</div><div class="mute" style="margin-top:6px">Your picks: '+(D.picks.filter(p=>p.tid===U).map(p=>'#'+p.n+(p.nm?' '+h(p.nm):'')).join(', ')||'none')+'</div></div>');
    o+='<div style="height:14px"></div>'+panel('Prospects ('+L.dc.length+')',prospectTable(mineNow),'Real times now; the hidden part is the curve. Younger swimmers with big yearly drops have more left.');
    const rec=D.picks.slice(Math.max(0,D.cur-10),D.cur).reverse(); if(rec.length) o+='<div style="height:14px"></div>'+panel('Latest picks','<div class="pb chips">'+rec.map(p=>'<span class="chip">'+p.n+' '+tAbbr(p.tid)+' · '+swL(p.sid,p.nm)+'</span>').join('')+'</div>');
    return o; }
  if(L.off==='fa'){ const mine=Object.keys(L.faS.offers);
    o+='<div class="msg">Round '+(L.faS.round+1)+' of '+FA_ROUNDS+'. Asking prices fall each round, but the other 23 clubs are bidding too. Swimmers weigh money, role, your record and your coaching. '+(mine.length?'You have '+mine.length+' offer'+(mine.length>1?'s':'')+' out.':'')+'</div>';
    o+=faPanel('fa')+'<div style="margin-top:14px"><button class="pri" data-act="offcont">Close round '+(L.faS.round+1)+' ▸</button></div>'; return o; }
  const legal=rosterLegal(L,T);
  o+=(legal.length?'<div class="msg err">Not legal yet: '+legal.map(h).join(' · ')+'</div>':'<div class="msg">Roster is legal: 14 women, 14 men, under the cap.</div>');
  o+='<div class="row" style="margin-bottom:12px"><button data-act="userfinal">Let my assistant finalize the roster</button><button class="pri" data-act="offcont"'+(legal.length?' disabled':'')+'>Start season '+(L.season+1)+' ▸</button></div>';
  const cols=rosterCols(L,false); cols.push({l:'',h:s=>'<button class="sm" data-act="release" data-id="'+s.id+'">Release</button>'});
  return o+panel('Your camp roster',tbl('cuts',cols,T.ros.map(id=>L.sw[id]),{sort:{i:4,d:-1}}),'Payroll '+money(payroll(L,T))+' / '+money(CAP))+'<div style="height:14px"></div>'+faPanel('cuts');
};
/* ---------- boot ---------- */
if(typeof document!=='undefined'){ window.addEventListener('beforeunload',()=>{ if(UI.L) saveGame(); }); UI.view='new'; render(); }
