<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Shardstorm Depths</title>
<meta name="description" content="Shardstorm Depths: a match-3 RPG battler. Swap gems to charge four heroes, outrun the monster's countdown and slay the Hollow Sovereign.">
<meta name="theme-color" content="#0b0914">
<style>

}
*{box-sizing:border-box}

.ov.show{display:flex}
.panel{width:100%;max-width:430px;max-height:100%;overflow-y:auto;touch-action:pan-y;background:linear-gradient(170deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:22px;padding:22px 20px;box-shadow:0 20px 60px rgba(0,0,0,.6);text-align:center;animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
h1{margin:0;font-size:clamp(34px,9vw,46px);line-height:1;letter-spacing:1px;font-weight:900;background:linear-gradient(180deg,#fff2c8,var(--accent) 55%,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;text-transform:uppercase;filter:drop-shadow(0 4px 0 rgba(0,0,0,.45))}

h2.bad{color:var(--bad)} h2.good{color:var(--good)}
.tag{color:var(--muted);margin:8px 0 14px;font-size:15px;line-height:1.4}
.how{background:rgba(0,0,0,.25);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.45;color:#d9d3f2;margin:0 0 14px;text-align:left}
.how b{color:#fff}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px 18px;font:900 20px/1 "Trebuchet MS","Segoe UI",system-ui,sans-serif;letter-spacing:1px;text-transform:uppercase;color:#2b1600;background:linear-gradient(180deg,#ffd27a,var(--accent) 60%,var(--accent2));box-shadow:0 6px 0 var(--accent-shadow),0 10px 24px rgba(0,0,0,.5);cursor:pointer;margin:10px 0 0;transition:transform .08s,box-shadow .08s;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--accent-shadow)}

.stats{display:flex;justify-content:center;gap:10px;margin:12px 0 4px;flex-wrap:wrap}

.card:active{transform:scale(.97)}
.card canvas{width:52px;height:52px;flex:none}
.card .txt{flex:1;min-width:0}
.card b{display:block;font-size:17px;font-weight:900}
.card small{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:2px}
.card .cost{flex:none;font-weight:900;color:var(--gold);font-size:15px;white-space:nowrap}
.card.owned{opacity:.6;cursor:default}
.card.owned .cost{color:var(--good)}
.card.locked .cost{color:var(--muted)}
.prog{height:10px;background:rgba(0,0,0,.4);border-radius:6px;overflow:hidden;margin:6px 0 2px}

@media (pointer:fine){.kbd{display:block}}
</style>
<canvas id="c"></canvas>
<div id="safe"></div>
<div id="hud">
  <button id="muteBtn" class="hb" aria-label="Toggle sound"></button>
  <button id="pauseBtn" class="hb" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
</div>

<script>
(function(){
'use strict';
// =============================================================== utils
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;};
const easeOut=t=>1-Math.pow(1-t,3);
const easeIn=t=>t*t*t;
const easeBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const num=(v,d)=>(typeof v==='number'&&isFinite(v))?v:(d||0);
function hexToRgb(h){const n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];}
function shade(h,amt){const [r,g,b]=hexToRgb(h);const f=v=>clamp(Math.round(amt>0?v+(255-v)*amt:v*(1+amt)),0,255);return 'rgb('+f(r)+','+f(g)+','+f(b)+')';}
function rgba(h,a){const [r,g,b]=hexToRgb(h);return 'rgba('+r+','+g+','+b+','+a+')';}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function esc(s){return String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[ch]);}
const FONT='"Trebuchet MS","Segoe UI",system-ui,sans-serif';
function txt(c,s,x,y,size,color,align,weight,stroke){c.font=(weight||900)+' '+size+'px '+FONT;c.textAlign=align||'center';c.textBaseline='middle';if(stroke){c.lineWidth=Math.max(2,size*.14);c.strokeStyle=stroke;c.lineJoin='round';c.strokeText(s,x,y);}c.fillStyle=color;c.fillText(s,x,y);}

// =============================================================== save
const SAVE_KEY='shardstorm.depths.save.v1';
const defaultSave=()=>({v:1,best:0,gold:0,perks:[],runs:0,bossKills:0,muted:false,bestCombo:0});
let SAVE=defaultSave();
function loadSave(){try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const o=JSON.parse(raw);if(o&&typeof o==='object'){SAVE=Object.assign(defaultSave(),o);}}}catch(e){SAVE=defaultSave();}
  if(!Array.isArray(SAVE.perks))SAVE.perks=[];SAVE.best=num(SAVE.best);SAVE.gold=num(SAVE.gold);SAVE.runs=num(SAVE.runs);SAVE.bossKills=num(SAVE.bossKills);SAVE.bestCombo=num(SAVE.bestCombo);SAVE.muted=!!SAVE.muted;}
function writeSave(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(SAVE));}catch(e){}}
const hasPerk=id=>SAVE.perks.indexOf(id)>=0;

// =============================================================== audio
const A={ctx:null,master:null,sfx:null,mus:null,muted:false,noiseBuf:null,
  init(){if(this.ctx)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC();this.ctx=ctx;this.master=ctx.createGain();this.master.connect(ctx.destination);this.sfx=ctx.createGain();this.sfx.gain.value=.5;this.sfx.connect(this.master);this.mus=ctx.createGain();this.mus.gain.value=.26;this.mus.connect(this.master);
    const len=ctx.sampleRate;const buf=ctx.createBuffer(1,len,ctx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.noiseBuf=buf;this.applyMute();Music.start();}catch(e){this.ctx=null;}},
  resume(){const c=this.ctx;if(c&&c.state==='suspended'){try{c.resume();}catch(e){}}},
  suspend(){const c=this.ctx;if(c&&c.state==='running'){try{c.suspend();}catch(e){}}},
  setMuted(m){this.muted=!!m;this.applyMute();},
  applyMute(){if(this.master)this.master.gain.value=this.muted?0:1;},
  tone(freq,dur,type,vol,o){o=o||{};const c=this.ctx;if(!c||this.muted)return;try{const t0=c.currentTime+(o.delay||0);const osc=c.createOscillator();const g=c.createGain();osc.type=type||'sine';osc.frequency.setValueAtTime(Math.max(20,freq),t0);if(o.slide)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide),t0+dur);const a=o.attack||0.006;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol),t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);osc.connect(g);g.connect(o.dest||this.sfx);osc.start(t0);osc.stop(t0+dur+.03);}catch(e){}},
  noise(dur,vol,o){o=o||{};const c=this.ctx;if(!c||this.muted||!this.noiseBuf)return;try{const t0=c.currentTime+(o.delay||0);const src=c.createBufferSource();src.buffer=this.noiseBuf;src.loop=true;const f=c.createBiquadFilter();f.type=o.type||'lowpass';f.frequency.setValueAtTime(o.freq||1200,t0);if(o.freqTo)f.frequency.exponentialRampToValueAtTime(o.freqTo,t0+dur);const g=c.createGain();g.gain.setValueAtTime(Math.max(0.0002,vol),t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);src.connect(f);f.connect(g);g.connect(o.dest||this.sfx);src.start(t0,Math.random()*0.5);src.stop(t0+dur+.03);}catch(e){}}
};
const mt=m=>440*Math.pow(2,(m-69)/12);
const SFX={
  swap(){A.tone(620,.07,'triangle',.18);A.tone(840,.06,'triangle',.12,{delay:.04});},
  invalid(){A.tone(180,.16,'sawtooth',.14,{slide:120});},
  select(){A.tone(1000,.04,'sine',.09);},
  match(combo,n){const base=392*Math.pow(1.1225,Math.min(combo-1,14));A.tone(base,.16,'triangle',.22);A.tone(base*1.5,.22,'sine',.15,{delay:.03});if(n>=5)A.tone(base*2,.26,'sine',.12,{delay:.07});if(combo>=3)A.tone(base*3,.12,'square',.05,{delay:.1});},
  land(){A.noise(.05,.07,{freq:700});},
  burst(){A.noise(.3,.35,{freq:1400,freqTo:200});A.tone(140,.3,'square',.2,{slide:45});},
  cross(){A.noise(.35,.3,{type:'highpass',freq:800,freqTo:3000});A.tone(300,.3,'sawtooth',.12,{slide:1200});},
  prism(){[0,4,7,12,16].forEach((s,i)=>A.tone(440*Math.pow(2,s/12),.25,'triangle',.16,{delay:i*.05}));A.noise(.5,.2,{type:'highpass',freq:2000,freqTo:6000});},
  spawn(){A.tone(900,.12,'sine',.14,{slide:1500});},
  ult(){A.tone(200,.45,'sawtooth',.18,{slide:1400});A.noise(.4,.25,{freq:2500,freqTo:300,delay:.1});A.tone(80,.35,'square',.2,{slide:40,delay:.25});},
  hit(big){A.noise(big?.22:.1,big?.45:.25,{freq:900,freqTo:150});A.tone(big?70:110,big?.2:.1,'square',.2,{slide:40});},
  kill(){A.noise(.6,.5,{freq:2000,freqTo:100});[0,3,7].forEach((s,i)=>A.tone(220*Math.pow(2,s/12),.4,'sawtooth',.12,{delay:i*.06,slide:110}));},
  windup(){A.tone(90,.4,'sawtooth',.2,{slide:160});A.noise(.4,.12,{freq:300,freqTo:900});},
  monsterHit(){A.noise(.3,.5,{freq:600,freqTo:80});A.tone(60,.3,'square',.3,{slide:30});},
  heal(){[0,4,7,12].forEach((s,i)=>A.tone(523*Math.pow(2,s/12),.22,'sine',.14,{delay:i*.06}));},
  shield(){A.tone(500,.25,'sine',.14,{slide:900});A.tone(750,.3,'triangle',.08,{delay:.08,slide:1100});},
  coin(){A.tone(1300,.07,'square',.09);A.tone(1750,.14,'square',.09,{delay:.06});},
  stun(){A.tone(1200,.3,'square',.1,{slide:300});},
  fanfare(){[0,4,7,12,7,12].forEach((s,i)=>A.tone(392*Math.pow(2,s/12),i===5?.5:.18,'triangle',.18,{delay:i*.11}));},
  defeat(){[12,7,3,0].forEach((s,i)=>{const f=330*Math.pow(2,s/12);A.tone(f,.45,'sawtooth',.14,{delay:i*.22,slide:f*.94});});},
  click(){A.tone(700,.05,'square',.07);},
  shuffle(){for(let i=0;i<8;i++)A.tone(400+Math.random()*800,.06,'triangle',.08,{delay:i*.04});},
  revive(){[0,7,12,19,24].forEach((s,i)=>A.tone(262*Math.pow(2,s/12),.5,'sine',.16,{delay:i*.08}));},
  enrage(){A.tone(60,.8,'sawtooth',.25,{slide:200});A.noise(.8,.3,{freq:200,freqTo:2000});},
  bossIntro(){A.tone(55,1.2,'sawtooth',.25,{slide:110});A.noise(1.2,.2,{freq:150,freqTo:1200});}
};
const Music={mode:'menu',step:0,nextTime:0,timer:null,paused:false,
  start(){if(this.timer||!A.ctx)return;this.nextTime=A.ctx.currentTime+.1;this.timer=setInterval(()=>this.tick(),70);},
  setMode(m){if(this.mode!==m){this.mode=m;this.step=0;}},
  tick(){const c=A.ctx;if(!c||this.paused||A.muted||c.state!=='running')return;if(this.nextTime<c.currentTime-.1)this.nextTime=c.currentTime+.05;
    while(this.nextTime<c.currentTime+.2){this.schedule(this.nextTime,this.step);const bpm=this.mode==='menu'?80:this.mode==='boss'?140:122;this.nextTime+=60/bpm/4;this.step++;}},
  n(t,midi,dur,type,vol){const c=A.ctx;try{const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(mt(midi),t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(A.mus);o.start(t);o.stop(t+dur+.02);}catch(e){}},
  pad(t,midi,dur,vol){const c=A.ctx;try{const o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(mt(midi),t);o.detune.setValueAtTime(rnd(-6,6),t);f.type='lowpass';f.frequency.setValueAtTime(600,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+dur*.4);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(f);f.connect(g);g.connect(A.mus);o.start(t);o.stop(t+dur+.02);}catch(e){}},
  kick(t){const c=A.ctx;try{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(40,t+.14);g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(0.0001,t+.18);o.connect(g);g.connect(A.mus);o.start(t);o.stop(t+.2);}catch(e){}},
  hat(t,vol,dur){const c=A.ctx;try{const s=c.createBufferSource();s.buffer=A.noiseBuf;s.loop=true;const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=6000;const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(A.mus);s.start(t,Math.random()*.5);s.stop(t+dur+.02);}catch(e){}},
  snare(t){const c=A.ctx;try{const s=c.createBufferSource();s.buffer=A.noiseBuf;s.loop=true;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;const g=c.createGain();g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(0.0001,t+.13);s.connect(f);f.connect(g);g.connect(A.mus);s.start(t,Math.random()*.5);s.stop(t+.15);}catch(e){}},
  schedule(t,step){const bar=Math.floor(step/16)%4,s=step%16,mode=this.mode;
    if(mode==='menu'){const prog=[50,48,53,55];const root=prog[bar];if(s===0){this.pad(t,root-12,3.2,.09);this.pad(t,root+3,3.2,.05);this.pad(t,root+7,3.2,.05);}
      if(s%4===2&&Math.random()<.65)this.n(t,root+12+pick([0,3,7,10,12,15]),.6,'triangle',.06);if(s===8&&Math.random()<.5)this.n(t,root+24,.9,'sine',.04);return;}
    const boss=mode==='boss';const prog=boss?[50,50,51,49]:[50,50,53,48];const root=prog[bar];
    if(s%4===0)this.kick(t);if(boss&&s%8===6)this.kick(t);if(s%8===4)this.snare(t);if(s%2===0)this.hat(t,s%4===2?.09:.05,.04);
    if(s%4===0||s===6||s===14||(boss&&s===11))this.n(t,root-12,.2,'sawtooth',.14);
    if(s%2===0&&s!==6&&s!==14)this.n(t,root-12,.12,'square',.05);
    const arp=boss?[0,7,12,13,7,15,12,10]:[0,7,12,3,7,15,12,10];this.n(t,root+12+arp[step%8],.13,'square',.045);
    if(bar===3&&s===12)this.n(t,root+24,.3,'triangle',.06);if(boss&&s===0&&bar%2===0)this.pad(t,root+6,1.2,.05);}
};

// =============================================================== game data
const N=8,NTYPES=6,PRISM=6;
const TYPE_WEIGHTS=[1,1,1,1,1,.62];
const GEM_COLORS=['#ff4d5a','#4db8ff','#5ee07a','#ffd84d','#b96bff','#ffcc33','#ffffff'];
const GEM_NAMES=['Ember','Tide','Verdant','Storm','Rift','Gold'];
const HERO_DEFS=[

// =============================================================== board logic (pure)
let gemSeq=0;
function makeGem(type,special){return {id:gemSeq++,type:type,special:special||null,x:0,y:0,vy:0,scale:1,alpha:1,dying:false,dieT:0,land:0,_tw:0,born:0};}
function randType(){let tot=0;for(let i=0;i<NTYPES;i++)tot+=TYPE_WEIGHTS[i];let r=Math.random()*tot;for(let i=0;i<NTYPES;i++){r-=TYPE_WEIGHTS[i];if(r<0)return i;}return NTYPES-1;}
const rc=i=>[Math.floor(i/N),i%N];
const idx=(r,c)=>r*N+c;
function adjacent(a,b){const [r1,c1]=rc(a),[r2,c2]=rc(b);return Math.abs(r1-r2)+Math.abs(c1-c2)===1;}
function typeAt(g,r,c){if(r<0||r>=N||c<0||c>=N)return -1;const gm=g[r][c];return (gm&&!gm.dying)?gm.type:-1;}
function freshGrid(){const g=[];for(let r=0;r<N;r++){g[r]=[];for(let c=0;c<N;c++){let t,tries=0;do{t=randType();tries++;}while(tries<40&&((c>=2&&typeAt(g,r,c-1)===t&&typeAt(g,r,c-2)===t)||(r>=2&&typeAt(g,r-1,c)===t&&typeAt(g,r-2,c)===t)));const gm=makeGem(t);gm.x=c;gm.y=r;g[r][c]=gm;}}return g;}
function freshGridWithMove(){let g=null;for(let i=0;i<60;i++){g=freshGrid();if(findAnyMove(g)&&findMatches(g).length===0)return g;}return g;}
function findMatches(g){
  const runs=[];
  for(let r=0;r<N;r++){let c=0;while(c<N){const t=typeAt(g,r,c);if(t<0||t>=NTYPES){c++;continue;}let k=c+1;while(k<N&&typeAt(g,r,k)===t)k++;if(k-c>=3){const cells=[];for(let i=c;i<k;i++)cells.push(idx(r,i));runs.push({type:t,cells:cells,dir:'h',len:k-c});}c=k;}}
  for(let c=0;c<N;c++){let r=0;while(r<N){const t=typeAt(g,r,c);if(t<0||t>=NTYPES){r++;continue;}let k=r+1;while(k<N&&typeAt(g,k,c)===t)k++;if(k-r>=3){const cells=[];for(let i=r;i<k;i++)cells.push(idx(i,c));runs.push({type:t,cells:cells,dir:'v',len:k-r});}r=k;}}
  const groups=[];const owner=new Map();
  for(const run of runs){let target=null;
    for(const i of run.cells){const o=owner.get(i);if(o&&o!==target){if(!target)target=o;else{for(const j of o.cells){target.cells.add(j);owner.set(j,target);}for(const rr2 of o.runs)target.runs.push(rr2);groups[groups.indexOf(o)]=null;}}}
    if(!target){target={type:run.type,cells:new Set(),runs:[]};groups.push(target);}
    for(const i of run.cells){target.cells.add(i);owner.set(i,target);}target.runs.push(run);}
  return groups.filter(Boolean).map(gp=>{let maxLen=0,hasH=false,hasV=false;for(const run of gp.runs){if(run.len>maxLen)maxLen=run.len;if(run.dir==='h')hasH=true;else hasV=true;}
    let inter=-1;if(hasH&&hasV){for(const h of gp.runs){if(h.dir!=='h')continue;for(const v of gp.runs){if(v.dir!=='v')continue;for(const i of h.cells)if(v.cells.indexOf(i)>=0){inter=i;}}}}
    return {type:gp.type,cells:Array.from(gp.cells),maxLen:maxLen,cross:hasH&&hasV,inter:inter,runs:gp.runs};});
}
function computeClear(g,groups,swapped){
  const clear=new Map();const spawns=[];const triggered=[];
  for(const gp of groups){
    for(const i of gp.cells){const [r,c]=rc(i);const gm=g[r][c];if(!gm)continue;clear.set(i,gp.type<0?gm.type:gp.type);}
    const special=gp.cross?'cross':gp.maxLen>=5?'prism':gp.maxLen===4?'burst':null;
    if(special){let pos=-1;for(const i of gp.cells)if(swapped.indexOf(i)>=0){pos=i;break;}
      if(pos<0){if(gp.cross&&gp.inter>=0)pos=gp.inter;else{let run=gp.runs[0];for(const rn of gp.runs)if(rn.len>run.len)run=rn;pos=run.cells[Math.floor(run.len/2)];}}
      spawns.push({idx:pos,type:special==='prism'?PRISM:gp.type,special:special});}
  }
  const queue=[];const seen=new Set();
  for(const i of clear.keys()){const [r,c]=rc(i);const gm=g[r][c];if(gm&&gm.special){queue.push(i);seen.add(i);}}
  const addCell=(r,c)=>{if(r<0||r>=N||c<0||c>=N)return;const gm=g[r][c];if(!gm||gm.dying)return;const i=idx(r,c);if(!clear.has(i))clear.set(i,gm.type);if(gm.special&&!seen.has(i)){seen.add(i);queue.push(i);}};
  while(queue.length){const i=queue.shift();const [r,c]=rc(i);const gm=g[r][c];if(!gm)continue;triggered.push({idx:i,special:gm.special,type:gm.type});
    if(gm.special==='burst'){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)addCell(r+dr,c+dc);}
    else if(gm.special==='cross'){for(let k=0;k<N;k++){addCell(r,k);addCell(k,c);}}
    else if(gm.special==='prism'){const cnt=new Array(NTYPES).fill(0);for(let rr2=0;rr2<N;rr2++)for(let cc=0;cc<N;cc++){const t=typeAt(g,rr2,cc);if(t>=0&&t<NTYPES)cnt[t]++;}let best=0;for(let t=1;t<NTYPES;t++)if(cnt[t]>cnt[best])best=t;for(let rr2=0;rr2<N;rr2++)for(let cc=0;cc<N;cc++)if(typeAt(g,rr2,cc)===best)addCell(rr2,cc);}
  }
  return {clear:clear,spawns:spawns,triggered:triggered};
}
function collapse(g){
  for(let c=0;c<N;c++){let write=N-1;
    for(let r=N-1;r>=0;r--){const gm=g[r][c];if(gm){if(write!==r){g[write][c]=gm;g[r][c]=null;}write--;}}
    let k=1;for(let r=write;r>=0;r--){const gm=makeGem(randType());gm.x=c;gm.y=-k;gm.vy=0;k++;g[r][c]=gm;}}
}
function allSettled(g){for(let r=0;r<N;r++)for(let c=0;c<N;c++){const gm=g[r][c];if(!gm)return false;if(gm.dying)return false;if(Math.abs(gm.y-r)>1e-6)return false;}return true;}
function lineAt(g,r,c){const t=typeAt(g,r,c);if(t<0||t>=NTYPES)return false;let n=1,k;for(k=c-1;k>=0&&typeAt(g,r,k)===t;k--)n++;for(k=c+1;k<N&&typeAt(g,r,k)===t;k++)n++;if(n>=3)return true;n=1;for(k=r-1;k>=0&&typeAt(g,k,c)===t;k--)n++;for(k=r+1;k<N&&typeAt(g,k,c)===t;k++)n++;return n>=3;}
function findAnyMove(g){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const gm=g[r][c];if(!gm)continue;
    if(gm.special==='prism'){if(c+1<N&&g[r][c+1])return [idx(r,c),idx(r,c+1)];if(r+1<N&&g[r+1][c])return [idx(r,c),idx(r+1,c)];if(c>0&&g[r][c-1])return [idx(r,c),idx(r,c-1)];if(r>0&&g[r-1][c])return [idx(r,c),idx(r-1,c)];}
    for(const d of [[0,1],[1,0]]){const r2=r+d[0],c2=c+d[1];if(r2>=N||c2>=N)continue;const gm2=g[r2][c2];if(!gm2)continue;if(gm2.special==='prism')return [idx(r,c),idx(r2,c2)];
      g[r][c]=gm2;g[r2][c2]=gm;const ok=lineAt(g,r,c)||lineAt(g,r2,c2);g[r][c]=gm;g[r2][c2]=gm2;if(ok)return [idx(r,c),idx(r2,c2)];}}
  return null;
}
function reshuffleGrid(g){
  const gems=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(g[r][c])gems.push(g[r][c]);
  for(let tries=0;tries<120;tries++){shuffle(gems);let k=0;for(let r=0;r<N;r++)for(let c=0;c<N;c++){const gm=gems[k++];g[r][c]=gm;gm.x=c;gm.y=r;gm.vy=0;}
    if(findMatches(g).length===0&&findAnyMove(g))return;}
  const fresh=freshGridWithMove();for(let r=0;r<N;r++)for(let c=0;c<N;c++)g[r][c]=fresh[r][c];
}
// ---- end board logic

function tween(obj,props,dur,ease){return new Promise(res=>{const from={};for(const k in props)from[k]=obj[k];if(obj._tw!==undefined)obj._tw++;tweens.push({obj:obj,props:props,from:from,dur:Math.max(1,dur),t:0,ease:ease||easeOut,res:res});});}
function flushAsync(){for(const t of timers){if(!t.cb)t.res();}timers.length=0;for(const tw of tweens){if(tw.obj._tw!==undefined)tw.obj._tw=0;tw.res();}tweens.length=0;}

const L={W:0,H:0,dpr:1,safeT:0,safeB:0,safeL:0,safeR:0,colX:0,colW:0,bx:0,by:0,bs:0,cs:0,monY:0,monH:0,hpY:0,hpH:0,hx:0,hy:0,hw:0,hh:0};
let gemSprites=[];const mc=document.createElement('canvas');const mctx=mc.getContext('2d');
function layout(){
  const W=window.innerWidth,H=window.innerHeight;L.W=W;L.H=H;L.dpr=Math.min(window.devicePixelRatio||1,3);
  canvas.width=Math.round(W*L.dpr);canvas.height=Math.round(H*L.dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(L.dpr,0,0,L.dpr,0,0);
  try{const s=getComputedStyle(safeEl);L.safeT=parseFloat(s.paddingTop)||0;L.safeB=parseFloat(s.paddingBottom)||0;L.safeL=parseFloat(s.paddingLeft)||0;L.safeR=parseFloat(s.paddingRight)||0;}catch(e){}
  const availW=W-L.safeL-L.safeR;const colW=Math.min(availW,520);L.colW=colW;L.colX=L.safeL+(availW-colW)/2;
  const hh=clamp(colW*.2,60,H<620?74:104),hpH=22,bottomPad=L.safeB+8,top=L.safeT;
  let bs=colW-16;const minMon=Math.min(200,Math.max(130,H*.26));const avail=H-top-bottomPad-hh-hpH-18;
  if(avail-bs<minMon)bs=Math.max(180,avail-minMon);
  L.bs=bs;L.cs=bs/N;L.bx=L.colX+(colW-bs)/2;L.monY=top;L.monH=Math.max(100,avail-bs);L.by=L.monY+L.monH+4;L.hpY=L.by+bs+8;L.hpH=hpH;L.hy=L.hpY+hpH+6;L.hh=hh;L.hx=L.colX+8;L.hw=colW-16;
  mc.width=Math.max(1,Math.round(colW*L.dpr));mc.height=Math.max(1,Math.round(L.monH*L.dpr));
  buildGemSprites();
}
function gemPath(c,type,r){c.beginPath();const pt=(ang,rad)=>c.lineTo(Math.cos(ang)*rad,Math.sin(ang)*rad);
  switch(type){
    case 0:c.moveTo(0,-r*1.08);c.lineTo(r*.82,0);c.lineTo(0,r*1.08);c.lineTo(-r*.82,0);break;
    case 1:c.arc(0,0,r*.93,0,TAU);break;
    case 2:for(let i=0;i<6;i++){const a=-Math.PI/2+i*TAU/6;if(i===0)c.moveTo(Math.cos(a)*r,Math.sin(a)*r);else pt(a,r);}break;
    case 3:for(let i=0;i<3;i++){const a=-Math.PI/2+i*TAU/3;const x=Math.cos(a)*r*1.1,y=Math.sin(a)*r*1.1+r*.15;if(i===0)c.moveTo(x,y);else c.lineTo(x,y);}break;
    case 4:for(let i=0;i<5;i++){const a=-Math.PI/2+i*TAU/5;if(i===0)c.moveTo(Math.cos(a)*r*1.02,Math.sin(a)*r*1.02);else pt(a,r*1.02);}break;
    case 5:for(let i=0;i<10;i++){const a=-Math.PI/2+i*TAU/10;const rad=i%2?r*.52:r*1.06;if(i===0)c.moveTo(Math.cos(a)*rad,Math.sin(a)*rad);else pt(a,rad);}break;
    default:c.arc(0,0,r*.93,0,TAU);
  }c.closePath();}
function drawGemBase(c,x,y,cs,type){const r=cs*.4;c.save();c.translate(x,y);
  if(type===PRISM){let g;try{g=c.createConicGradient?c.createConicGradient(0,0,0):null;}catch(e){g=null;}
    if(g){['#ff4d5a','#ffd84d','#5ee07a','#4db8ff','#b96bff','#ff4d5a'].forEach((col,i)=>g.addColorStop(i/5,col));}
    else{g=c.createRadialGradient(0,0,0,0,0,r);g.addColorStop(0,'#fff');g.addColorStop(.5,'#b96bff');g.addColorStop(1,'#4db8ff');}
    c.fillStyle=g;gemPath(c,PRISM,r);c.fill();c.lineWidth=cs*.05;c.strokeStyle='rgba(255,255,255,.9)';c.stroke();
    c.fillStyle='rgba(255,255,255,.85)';c.beginPath();c.arc(0,0,r*.38,0,TAU);c.fill();c.restore();return;}
  const col=GEM_COLORS[type];const g=c.createRadialGradient(-r*.35,-r*.4,r*.05,0,0,r*1.15);g.addColorStop(0,shade(col,.55));g.addColorStop(.45,col);g.addColorStop(1,shade(col,-.5));
  c.fillStyle=g;gemPath(c,type,r);c.fill();c.lineWidth=cs*.045;c.strokeStyle=shade(col,-.6);c.stroke();
  c.save();gemPath(c,type,r);c.clip();c.fillStyle='rgba(255,255,255,.22)';c.beginPath();c.ellipse(-r*.15,-r*.35,r*.6,r*.3,-.5,0,TAU);c.fill();c.fillStyle='rgba(0,0,0,.18)';c.beginPath();c.ellipse(r*.2,r*.45,r*.7,r*.35,-.4,0,TAU);c.fill();c.restore();
  c.fillStyle='rgba(255,255,255,.75)';c.beginPath();c.ellipse(-r*.35,-r*.42,r*.16,r*.1,-.6,0,TAU);c.fill();c.restore();}
function buildGemSprites(){gemSprites=[];const cs=L.cs,d=L.dpr,S=Math.ceil(cs*1.3);for(let t=0;t<=PRISM;t++){const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(S*d));cv.height=cv.width;const c=cv.getContext('2d');c.scale(d,d);drawGemBase(c,S/2,S/2,cs,t);gemSprites[t]={cv:cv,S:S};}}
function drawGem(c,x,y,gm,t){const sp=gemSprites[gm.type]||gemSprites[0];if(!sp)return;const cs=L.cs;const sx=gm.scale*(1+gm.land*.18),sy=gm.scale*(1-gm.land*.25);
  c.save();c.translate(x,y+gm.land*cs*.08);c.scale(sx,sy);c.globalAlpha*=gm.alpha;
  if(gm.special){const r=cs*.5;const pulse=.5+.5*Math.sin(t*7+gm.id);
    if(gm.special==='burst'){c.fillStyle='rgba(255,140,40,'+(.25+.25*pulse)+')';c.beginPath();c.arc(0,0,r*1.05,0,TAU);c.fill();}
    else if(gm.special==='cross'){c.fillStyle='rgba(255,255,255,'+(.2+.2*pulse)+')';c.beginPath();c.arc(0,0,r*1.05,0,TAU);c.fill();}
    else{c.fillStyle='rgba(255,255,255,'+(.3+.3*pulse)+')';c.beginPath();c.arc(0,0,r*1.12,0,TAU);c.fill();}}
  c.drawImage(sp.cv,-sp.S/2,-sp.S/2,sp.S,sp.S);

function drawMonster(c,m,cx,cy,s,t){
  const bob=Math.sin(t*2.2)*s*.03;const p=m.attackT>0?1-m.attackT:0;const lunge=Math.sin(p*Math.PI)*s*.5;const sc=1+Math.sin(p*Math.PI)*.12;
  let dx=0,dy=bob+lunge;if(m.hitT>0){dx+=(Math.random()-.5)*s*.1*m.hitT;dy+=(Math.random()-.5)*s*.06*m.hitT;}
  if(m.enterT>0){const e=easeOut(1-m.enterT);dx+=(1-e)*s*1.6;c.globalAlpha=e;}
  c.save();c.translate(cx+dx,cy+dy);c.scale(sc,sc);
  if(m.dieT>0){const d=m.dieT;c.globalAlpha=Math.max(0,1-d);c.scale(1+d*.4,Math.max(.01,1-d*.8));c.rotate(d*.3);}
  c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(0,s*.46-lunge*.6,s*.38,s*.07,0,0,TAU);c.fill();
  (SHAPES[m.def.shape]||SHAPES.blob)(c,s,t,m.def.color,m);c.restore();c.globalAlpha=1;

// =============================================================== effects
function shake(mag){G.shake=Math.max(G.shake,mag);}
function flash(color,alpha){G.flash={color:color,a:alpha,max:alpha};}
function hitstop(ms){G.hitstop=Math.max(G.hitstop,ms);}
function announce(text,sub,color,dur){G.ann={text:text,sub:sub||'',color:color||'#fff',t:0,dur:dur||1100};}
function floater(x,y,text,color,size,delay){floaters.push({x:x,y:y,text:text,color:color||'#fff',size:size||22,t:0,dur:1000,delay:delay||0,vy:-55,vx:rnd(-8,8)});}
function burstParticles(x,y,color,n,speed,size){for(let i=0;i<n;i++){const a=rnd(0,TAU),sp=rnd(speed*.3,speed);particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-speed*.3,t:0,dur:rnd(.4,.8),color:color,size:rnd(size*.5,size),grav:600,rot:rnd(0,TAU),vr:rnd(-8,8),shape:Math.random()<.5?'rect':'circ'});}}
function streak(x,y,tx,ty,color,delay){fx.push({kind:'streak',x:x,y:y,tx:tx,ty:ty,vx:rnd(-200,200),vy:rnd(-350,-100),color:color,t:-(delay||0),life:0,done:false});}
function projectile(x,y,tx,ty,color,dur){fx.push({kind:'proj',x:x,y:y,sx:x,sy:y,tx:tx,ty:ty,color:color,t:0,dur:dur||260});}
function ringFx(x,y,color,r){fx.push({kind:'ring',x:x,y:y,color:color,t:0,dur:420,r:r||60});}
function cellCenter(i){const [r,c]=rc(i);return [L.bx+(c+.5)*L.cs,L.by+(r+.5)*L.cs];}
function monsterCenter(){return [L.colX+L.colW/2,L.monY+L.monH*.5+10];}
function heroCenter(i){const n=4,gap=6,cw=(L.hw-gap*(n-1))/n;return [L.hx+i*(cw+gap)+cw/2,L.hy+L.hh/2];}

// =============================================================== run flow
function newRun(){
  const heroes=HERO_DEFS.map(h=>({id:h.id,name:h.name,role:h.role,color:h.color,initial:h.initial,ultName:h.ultName,atk:h.atk+(hasPerk('warpath')?1:0),healPer:h.healPer,shieldPer:h.shieldPer,charge:0,maxCharge:12,ultShield:15,ultHeal:.25,ultT:0}));
  const maxHp=100+(hasPerk('heart')?20:0);
  return {floor:0,hp:maxHp,maxHp:maxHp,shield:0,gold:0,heroes:heroes,goldMul:hasPerk('nose')?1.5:1,specialMul:hasPerk('temper')?1.4:1,riftDmg:hasPerk('attune')?2:0,riftCharge:1,comboStep:.25,cdBonus:0,secondWind:hasPerk('wind'),spark:hasPerk('spark'),dmgDealt:0,bestCombo:0,turns:0,pool:shuffle(MONSTERS.slice()),regIdx:0,killedBy:'',bossKills:0};
}
function beginRun(){
  G.seq++;flushAsync();particles.length=0;floaters.length=0;fx.length=0;G.ann=null;G.shake=0;G.flash=null;G.hitstop=0;G.combo=0;
  G.run=newRun();if(G.run.spark)G.run.heroes.forEach(h=>{h.charge=Math.round(h.maxCharge*.3);});
  G.scene='battle';G.paused=false;G.menuOpen=false;hideOverlay();document.body.classList.add('battle');
  startFloor();
}
async function startFloor(){
  const run=G.run;const seq=G.seq;run.floor++;const f=run.floor;const boss=f%6===0;
  let def;if(boss)def=BOSS;else{def=run.pool[run.regIdx%run.pool.length];run.regIdx++;}
  const hpMax=Math.max(1,Math.round(floorHp(f)*def.hpMul));const atk=Math.max(1,Math.round(floorAtk(f)*def.atkMul*10)/10);
  const prefix=f>6?ELITE[Math.min(ELITE.length-1,Math.floor((f-7)/6))]:'';
  const name=boss?(f>6?'The Sovereign Reborn':def.name):(prefix?prefix+' ':'')+def.name;
  const cd=def.cd+run.cdBonus;
  G.mon={def:def,name:name,hp:hpMax,max:hpMax,shownHp:hpMax,targetShown:hpMax,atk:atk,baseAtk:atk,cdMax:cd,cd:cd,attackT:0,hitT:0,flash:0,dieT:0,enraged:false,boss:boss,enterT:1,dead:false};
  G.grid=freshGridWithMove();G.selected=-1;G.hintPair=null;G.combo=0;G.idle=0;run.shield=Math.min(run.shield,Math.round(run.maxHp*.2));
  for(const h of run.heroes){h.charge=clamp(num(h.charge),0,h.maxCharge);}
  Music.setMode(boss?'boss':'battle');
  G.state='busy';
  if(boss){announce(f>6?'SOVEREIGN REBORN':'THE SOVEREIGN',name,'#ff5e8a',1600);SFX.bossIntro();shake(8);flash('#c05cff',.35);}
  else{announce('FLOOR '+f,name,'#ffd27a',1200);SFX.spawn();}
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const gm=G.grid[r][c];gm.scale=0;tween(gm,{scale:1},260+Math.random()*260,easeBack);}
  tween(G.mon,{enterT:0},600);
  await wait(800);if(seq!==G.seq)return;
  G.state='idle';G.idle=0;
}
async function trySwap(a,b){
  if(G.state!=='idle'||G.scene!=='battle'||G.paused)return;
  const seq=G.seq;G.state='busy';G.selected=-1;G.hintPair=null;G.idle=0;
  const g=G.grid;const [r1,c1]=rc(a),[r2,c2]=rc(b);const g1=g[r1][c1],g2=g[r2][c2];
  if(!g1||!g2){G.state='idle';return;}
  SFX.swap();

function applyClearEffects(clear,triggered,combo){

let ptr=null;
function cellAt(px,py){const c=Math.floor((px-L.bx)/L.cs),r=Math.floor((py-L.by)/L.cs);if(r<0||r>=N||c<0||c>=N)return -1;return idx(r,c);}
canvas.addEventListener('pointerdown',e=>{
  if(G.scene!=='battle'||G.paused||G.menuOpen)return;if(ptr)return;
  const cell=cellAt(e.clientX,e.clientY);ptr={id:e.pointerId,x:e.clientX,y:e.clientY,cell:cell,swiped:false};
  try{canvas.setPointerCapture(e.pointerId);}catch(err){}
  G.idle=0;G.hintPair=null;
  if(G.state!=='idle')return;
  if(cell<0){G.selected=-1;return;}
  if(G.selected>=0&&G.selected!==cell&&adjacent(G.selected,cell)){const a=G.selected;G.selected=-1;ptr.swiped=true;trySwap(a,cell);return;}
  if(G.selected===cell){G.selected=-1;return;}
  SFX.select();G.selected=cell;
});
canvas.addEventListener('pointermove',e=>{
  if(!ptr||ptr.id!==e.pointerId||ptr.swiped||ptr.cell<0)return;if(G.state!=='idle')return;
  const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y;if(Math.hypot(dx,dy)<L.cs*.28)return;
  const [r,c]=rc(ptr.cell);let r2=r,c2=c;if(Math.abs(dx)>Math.abs(dy))c2+=dx>0?1:-1;else r2+=dy>0?1:-1;ptr.swiped=true;
  if(r2>=0&&r2<N&&c2>=0&&c2<N){G.selected=-1;trySwap(ptr.cell,idx(r2,c2));}
});
const endPtr=e=>{if(ptr&&ptr.id===e.pointerId)ptr=null;};

// =============================================================== update
let last=0;
function update(dt,rdt){
  const t=G.time;
  for(let i=tweens.length-1;i>=0;i--){const tw=tweens[i];tw.t+=dt*1000;const p=Math.min(1,tw.t/tw.dur);const e=tw.ease(p);for(const k in tw.props)tw.obj[k]=lerp(tw.from[k],tw.props[k],e);if(p>=1){if(tw.obj._tw!==undefined)tw.obj._tw=Math.max(0,tw.obj._tw-1);tweens.splice(i,1);tw.res();}}
  if(G.grid&&G.scene==='battle'){let landed=0;for(let r=0;r<N;r++)for(let c=0;c<N;c++){const gm=G.grid[r][c];if(!gm)continue;
      if(gm.dying){gm.dieT=Math.min(1,gm.dieT+dt/.17);gm.scale=1+gm.dieT*.35;gm.alpha=1-gm.dieT;}
      else if(!gm._tw){if(gm.y<r){gm.vy=Math.min(26,gm.vy+60*dt);gm.y+=gm.vy*dt;if(gm.y>=r){gm.y=r;gm.vy=0;gm.land=1;landed++;}}else if(gm.y>r){gm.y=r;gm.vy=0;}}
      if(gm.land>0)gm.land=Math.max(0,gm.land-dt*5);}
    if(landed>0&&Math.random()<.5)SFX.land();
    if(G.state==='idle'&&!G.paused){G.idle+=dt*1000;if(G.idle>3800&&!G.hintPair){G.hintPair=findAnyMove(G.grid);}}
    const m=G.mon;if(m){if(m.hitT>0)m.hitT=Math.max(0,m.hitT-dt*5);if(m.flash>0)m.flash=Math.max(0,m.flash-dt*6);m.shownHp+=(m.targetShown-m.shownHp)*Math.min(1,dt*9);if(Math.abs(m.shownHp-m.targetShown)<.5)m.shownHp=m.targetShown;}
  }
  G.gameTime+=dt*1000;
  for(let i=timers.length-1;i>=0;i--){const tm=timers[i];if(tm.fn?tm.fn():G.gameTime>=tm.t){timers.splice(i,1);tm.res();}}
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.t+=dt;if(p.t>=p.dur){particles.splice(i,1);continue;}p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;}
  for(let i=floaters.length-1;i>=0;i--){const f=floaters[i];if(f.delay>0){f.delay-=dt*1000;continue;}f.t+=dt*1000;if(f.t>=f.dur){floaters.splice(i,1);continue;}f.y+=f.vy*dt;f.x+=f.vx*dt;}
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];
    if(f.kind==='streak'){f.t+=dt*1000;if(f.t<0)continue;const dx=f.tx-f.x,dy=f.ty-f.y,d=Math.hypot(dx,dy);if(d<14||f.life>1.2){fx.splice(i,1);burstParticles(f.tx,f.ty,f.color,3,120,3);continue;}f.life+=dt;const acc=2600;f.vx+=dx/d*acc*dt;f.vy+=dy/d*acc*dt;const sp=Math.hypot(f.vx,f.vy),max=900+f.life*1500;if(sp>max){f.vx*=max/sp;f.vy*=max/sp;}f.x+=f.vx*dt;f.y+=f.vy*dt;}
    else{f.t+=dt*1000;if(f.t>=f.dur){fx.splice(i,1);continue;}if(f.kind==='proj'){const p=easeIn(f.t/f.dur);f.x=lerp(f.sx,f.tx,p);f.y=lerp(f.sy,f.ty,p)-Math.sin(p*Math.PI)*80;if(Math.random()<.8)particles.push({x:f.x,y:f.y,vx:rnd(-40,40),vy:rnd(-40,40),t:0,dur:.3,color:f.color,size:5,grav:0,rot:0,vr:0,shape:'circ'});}}}
  if(G.ann){G.ann.t+=dt*1000;if(G.ann.t>=G.ann.dur)G.ann=null;}
  G.shake=Math.max(0,G.shake-rdt*28);
  if(G.flash){G.flash.a-=rdt*G.flash.max*4;if(G.flash.a<=0)G.flash=null;}
  for(const d of dust){d.y-=d.v*rdt;d.x+=Math.sin(t*.5+d.p)*8*rdt;if(d.y<-10){d.y=L.H+10;d.x=rnd(0,L.W);}}
  if(G.scene!=='battle')for(const a of ambient){a.y-=a.v*rdt;a.rot+=a.vr*rdt;if(a.y<-60){a.y=L.H+60;a.x=rnd(0,L.W);}}
}

// =============================================================== render
function render(){
  const c=ctx,W=L.W,H=L.H,t=G.time;
  c.setTransform(L.dpr,0,0,L.dpr,0,0);
  const floor=G.run?G.run.floor:0;const hue=(250+floor*19)%360;
  const bg=c.createLinearGradient(0,0,0,H);bg.addColorStop(0,'hsl('+hue+',42%,13%)');bg.addColorStop(.6,'#0f0c1c');bg.addColorStop(1,'#0b0914');c.fillStyle=bg;c.fillRect(0,0,W,H);
  if(G.shake>0){c.translate(rnd(-G.shake,G.shake),rnd(-G.shake,G.shake));}
  c.fillStyle='rgba(255,255,255,.07)';for(const d of dust){c.beginPath();c.arc(d.x,d.y,d.r,0,TAU);c.fill();}
  if(G.scene!=='battle'){for(const a of ambient){c.save();c.translate(a.x,a.y);c.rotate(a.rot);c.globalAlpha=.35;const gm={type:a.type,special:null,scale:a.s,land:0,alpha:1,id:a.type};drawGem(c,0,0,gm,t);c.restore();}}
  else if(G.run&&G.mon){drawBattle(c,t);}
  for(const p of particles){const a=1-p.t/p.dur;c.globalAlpha=a;c.fillStyle=p.color;if(p.shape==='rect'){c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillRect(-p.size/2,-p.size/2,p.size,p.size);c.restore();}else{c.beginPath();c.arc(p.x,p.y,p.size*.5*a+.5,0,TAU);c.fill();}}
  c.globalAlpha=1;
  for(const f of fx){
    if(f.kind==='streak'){if(f.t<0)continue;c.strokeStyle=f.color;c.lineWidth=3;c.lineCap='round';c.beginPath();c.moveTo(f.x,f.y);c.lineTo(f.x-f.vx*.03,f.y-f.vy*.03);c.stroke();c.fillStyle='#fff';c.beginPath();c.arc(f.x,f.y,2.5,0,TAU);c.fill();}
    else if(f.kind==='proj'){c.fillStyle=f.color;c.beginPath();c.arc(f.x,f.y,10,0,TAU);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(f.x,f.y,5,0,TAU);c.fill();}
    else if(f.kind==='ring'){const p=f.t/f.dur;c.strokeStyle=f.color;c.globalAlpha=1-p;c.lineWidth=6*(1-p)+1;c.beginPath();c.arc(f.x,f.y,f.r*easeOut(p),0,TAU);c.stroke();c.globalAlpha=1;}
    else if(f.kind==='cross'){const p=f.t/f.dur;c.globalAlpha=1-p;c.fillStyle='#fff';const w=L.cs*(.9-.6*p);c.fillRect(L.bx,f.y-w/2,L.bs,w);c.fillRect(f.x-w/2,L.by,w,L.bs);c.globalAlpha=1;}
    else if(f.kind==='bolt'){const p=f.t/f.dur;c.globalAlpha=1-p;c.strokeStyle='#ffd84d';c.lineWidth=5;c.lineJoin='round';c.beginPath();let x=f.x+rnd(-20,20),y=L.monY-10;c.moveTo(x,y);for(let k=1;k<=6;k++){y=lerp(L.monY-10,f.y,k/6);x=f.x+rnd(-30,30)*(1-k/6);c.lineTo(x,y);}c.stroke();c.strokeStyle='#fff';c.lineWidth=2;c.stroke();c.globalAlpha=1;}
  }
  for(const f of floaters){if(f.delay>0)continue;const p=f.t/f.dur;const sc=p<.12?easeBack(p/.12):1;c.save();c.translate(f.x,f.y);c.scale(sc,sc);c.globalAlpha=p>.7?1-(p-.7)/.3:1;txt(c,f.text,0,0,f.size,f.color,'center',900,'rgba(0,0,0,.85)');c.restore();}
  if(G.ann&&G.scene==='battle'){const a=G.ann;const p=a.t/a.dur;const sc=p<.14?easeBack(p/.14):1+(p-.14)*.08;const al=p>.72?1-(p-.72)/.28:1;c.save();c.translate(L.bx+L.bs/2,L.by+L.bs*.42);c.scale(sc,sc);c.globalAlpha=al;const size=Math.min(46,L.bs*.11);txt(c,a.text,0,0,size,a.color,'center',900,'rgba(0,0,0,.9)');if(a.sub)txt(c,a.sub,0,size*.9,size*.5,'#fff','center',700,'rgba(0,0,0,.9)');c.restore();}
  c.setTransform(L.dpr,0,0,L.dpr,0,0);
  if(G.flash){c.fillStyle=G.flash.color;c.globalAlpha=Math.max(0,G.flash.a);c.fillRect(0,0,W,H);c.globalAlpha=1;}
}
function drawBattle(c,t){
  const run=G.run,mon=G.mon;
  // ---- monster area
  const mx=L.colX+L.colW/2,my=L.monY+L.monH*.5+10;const ms=Math.min(L.monH*.58,L.colW*.5);
  mctx.setTransform(L.dpr,0,0,L.dpr,0,0);mctx.clearRect(0,0,L.colW,L.monH);
  drawMonster(mctx,mon,mx-L.colX,my-L.monY,ms,t);
  if(mon.flash>0){mctx.globalCompositeOperation='source-atop';mctx.fillStyle='rgba(255,255,255,'+mon.flash+')';mctx.fillRect(0,0,L.colW,L.monH);mctx.globalCompositeOperation='source-over';}
  c.drawImage(mc,L.colX,L.monY,L.colW,L.monH);
  const top=L.monY+14,lx=L.colX+14;
  txt(c,(mon.boss?'BOSS  ':'FLOOR ')+run.floor+(run.floor>6?'  DEEP':''),lx,top,12,mon.boss?'#ff5e8a':'#a79fc9','left',900);
  let nameSize=Math.min(22,L.colW*.05);c.font='900 '+nameSize+'px '+FONT;const maxNameW=L.colW-130;const nw=c.measureText(mon.name.toUpperCase()).width;if(nw>maxNameW)nameSize=Math.max(11,nameSize*maxNameW/nw);
  txt(c,mon.name.toUpperCase(),lx,top+22,nameSize,'#fff','left',900,'rgba(0,0,0,.6)');
  if(mon.def.traitText)txt(c,mon.enraged?'ENRAGED: faster, harder':mon.def.traitText,lx,top+44,11,mon.enraged?'#ff5e8a':'#a79fc9','left',700);
  txt(c,run.gold+' G',L.colX+L.colW-14,top+50,16,'#ffcc33','right',900,'rgba(0,0,0,.6)');
  // monster hp bar
  const hbW=L.colW*.86,hbX=L.colX+(L.colW-hbW)/2,hbY=L.monY+L.monH-30,hbH=16;
  rr(c,hbX,hbY,hbW,hbH,8);c.fillStyle='rgba(0,0,0,.55)';c.fill();
  const shown=clamp(mon.shownHp/mon.max,0,1),tgt=clamp(mon.targetShown/mon.max,0,1);
  if(shown>tgt){rr(c,hbX+2,hbY+2,(hbW-4)*shown,hbH-4,6);c.fillStyle='rgba(255,255,255,.75)';c.fill();}
  if(tgt>0){rr(c,hbX+2,hbY+2,(hbW-4)*tgt,hbH-4,6);const hg=c.createLinearGradient(0,hbY,0,hbY+hbH);hg.addColorStop(0,mon.enraged?'#ff7a9a':'#ff6a6a');hg.addColorStop(1,mon.enraged?'#b0103a':'#b01030');c.fillStyle=hg;c.fill();}
  txt(c,Math.round(mon.targetShown)+' / '+mon.max,hbX+hbW/2,hbY+hbH/2,11,'#fff','center',900,'rgba(0,0,0,.7)');
  // countdown badge
  const cdX=L.colX+L.colW-40,cdY=hbY-38,cdR=22;const urgent=mon.cd<=1;const pulse=urgent?.5+.5*Math.sin(t*10):0;
  c.fillStyle=urgent?'rgba(255,60,80,'+(.5+.3*pulse)+')':'rgba(0,0,0,.55)';c.beginPath();c.arc(cdX,cdY,cdR+pulse*3,0,TAU);c.fill();
  c.strokeStyle=urgent?'#ff5e8a':'#ffd27a';c.lineWidth=3;c.beginPath();c.arc(cdX,cdY,cdR,-Math.PI/2,-Math.PI/2+TAU*clamp(mon.cd/Math.max(1,mon.cdMax),0,1));c.stroke();
  txt(c,String(Math.max(0,mon.cd)),cdX,cdY+1,22,'#fff','center',900);txt(c,'ATTACKS IN',cdX,cdY-cdR-9,9,urgent?'#ff9ab0':'#a79fc9','center',900);
  // ---- board
  const bx=L.bx,by=L.by,bs=L.bs,cs=L.cs;

  for(let r=0;r<N;r++)for(let col=0;col<N;col++){c.fillStyle=(r+col)%2?'rgba(255,255,255,.035)':'rgba(255,255,255,.015)';c.fillRect(bx+col*cs,by+r*cs,cs,cs);}

  if(G.hintPair&&G.state==='idle'){const pulse=.5+.5*Math.sin(t*6);for(const i of G.hintPair){const [hr,hc]=rc(i);c.strokeStyle='rgba(255,255,255,'+(.3+.5*pulse)+')';c.lineWidth=3;rr(c,bx+hc*cs+3,by+hr*cs+3,cs-6,cs-6,9);c.stroke();}}
  c.save();c.beginPath();c.rect(bx-6,by-6,bs+12,bs+12);c.clip();

  for(let r=0;r<N;r++)for(let col=0;col<N;col++){const gm=g[r][col];if(!gm||gm.dying)continue;const sel=G.selected===idx(r,col)&&G.state==='idle';const hint=G.hintPair&&G.hintPair.indexOf(idx(r,col))>=0&&G.state==='idle';

  const f=clamp(run.hp/run.maxHp,0,1);if(f>0){rr(c,hx+2,hy+2,(hw-4)*f,hh-4,8);const hg=c.createLinearGradient(0,hy,0,hy+hh);const low=f<.3;hg.addColorStop(0,low?'#ff8a8a':'#8ef0a0');hg.addColorStop(1,low?'#c01030':'#2a9a4a');c.fillStyle=hg;c.fill();}
  if(run.shield>0){const sf=clamp(run.shield/run.maxHp,0,1);rr(c,hx+2,hy+2,(hw-4)*sf,hh-4,8);c.fillStyle='rgba(77,184,255,.55)';c.fill();c.strokeStyle='#4db8ff';c.lineWidth=2;rr(c,hx+1,hy+1,hw-2,hh-2,9);c.stroke();}
  txt(c,'HP '+run.hp+' / '+run.maxHp+(run.shield>0?'   +'+run.shield+' SHIELD':''),hx+hw/2,hy+hh/2,12,'#fff','center',900,'rgba(0,0,0,.75)');
  // ---- heroes
  const n=run.heroes.length,gap=6,cw=(hw-gap*(n-1))/n,chh=L.hh;
  for(let i=0;i<n;i++){const h=run.heroes[i];const x=hx+i*(cw+gap);const y=L.hy-Math.sin((1-h.ultT)*Math.PI)*(h.ultT>0?16:0);const col=GEM_COLORS[h.color];const ready=h.charge>=h.maxCharge;const pulse=.5+.5*Math.sin(t*5+i);
    rr(c,x,y,cw,chh,12);c.fillStyle=ready?rgba(col,.22+.1*pulse):'rgba(20,16,38,.9)';c.fill();c.strokeStyle=ready?col:'rgba(255,255,255,.1)';c.lineWidth=ready?2:1;c.stroke();
    const pr=Math.min(chh*.26,cw*.22);const px=x+pr+8,py=y+pr+8;
    const pg=c.createRadialGradient(px-pr*.3,py-pr*.3,1,px,py,pr);pg.addColorStop(0,shade(col,.3));pg.addColorStop(1,shade(col,-.45));c.fillStyle=pg;c.beginPath();c.arc(px,py,pr,0,TAU);c.fill();
    heroIcon(c,h.id,px,py,pr*.62,'rgba(255,255,255,.95)');
    const nameSize=Math.min(14,cw*.14);txt(c,h.name.toUpperCase(),px+pr+6,py-6,nameSize,'#fff','left',900);
    const stat=h.id==='grove'?'HEAL '+h.healPer:h.id==='tide'?'SHLD '+h.shieldPer:'ATK '+h.atk;txt(c,stat,px+pr+6,py+9,Math.min(11,cw*.11),rgba(col,1),'left',900);
    const barY=y+chh-16,barH=8,barX=x+8,barW=cw-16;rr(c,barX,barY,barW,barH,4);c.fillStyle='rgba(0,0,0,.5)';c.fill();
    const cf=clamp(h.charge/h.maxCharge,0,1);if(cf>0){rr(c,barX,barY,barW*cf,barH,4);c.fillStyle=ready?'#fff':col;c.fill();}
    for(let k=1;k<h.maxCharge;k++){const sx=barX+barW*k/h.maxCharge;c.fillStyle='rgba(0,0,0,.35)';c.fillRect(sx-.5,barY,1,barH);}
    if(ready)txt(c,'READY!',x+cw/2,barY-8,Math.min(11,cw*.12),'#fff','center',900,'rgba(0,0,0,.6)');
    else txt(c,h.charge+'/'+h.maxCharge,x+cw-8,barY-8,9,'#a79fc9','right',700);}
}

// =============================================================== loop
function frame(now){
  requestAnimationFrame(frame);
  let raw=Math.min(50,now-last);last=now;if(!isFinite(raw)||raw<0)raw=16;
  if(G.paused)raw=0;
  let dt=raw;if(G.hitstop>0){G.hitstop-=raw;dt=0;}
  G.time+=raw/1000;
  update(dt/1000,raw/1000);render();
}
// =============================================================== boot
loadSave();A.muted=!!SAVE.muted;updateMuteIcon();layout();
for(let i=0;i<40;i++)dust.push({x:rnd(0,L.W),y:rnd(0,L.H),r:rnd(.6,2),v:rnd(6,20),p:rnd(0,TAU)});
for(let i=0;i<10;i++)ambient.push({x:rnd(0,L.W),y:rnd(0,L.H),v:rnd(10,30),type:i%6,s:rnd(.9,1.8),rot:rnd(0,TAU),vr:rnd(-.5,.5)});
showTitle();
last=performance.now();requestAnimationFrame(frame);
})();
</script>
