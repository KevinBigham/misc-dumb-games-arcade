function rnd(S) { let t = (S.rs = (S.rs + 0x6D2B79F5) | 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }

  <div class="kv"><span>Payroll / cap</span><span class="t">${money(E.payroll(S, t))} / ${money(S.cap)}</span></div><div class="kv"><span>Preseason paper rank</span><span>${ordinal(t.pre)}</span></div>

  <div class="pan"><h2>Your point scorers</h2>${tbl(['Swimmer', 'Best swim this season', { h: 'Power', r: 1, t: 'Power points of best swim (1000 = all-time benchmark)' }, { h: 'Meet pts', r: 1 }, { h: 'Wins', r: 1 }], top.map(p => { let be = null, bp = 0; for (const e in p.sb) { const x = E.ptsOf(e, p.g, p.sb[e] / 100); if (x > bp) { bp = x; be = e; } } return [pl(p.id), be ? E.EV[be].n + ' <span class="t">' + f(p.sb[be]) + '</span>' : '—', num(Math.round(bp)), num(Math.round(p.sp * 10) / 10), num(p.wins)]; }))}</div>

function topEvents(p, n) { return E.evPts(p).slice(0, n || 3).map(([e]) => E.EV[e].n.replace(' Free', ' FR').replace(' Back', ' BK').replace(' Breast', ' BR').replace(' Fly', ' FL')).join(', '); }
function rosterRows(ps, mine) {

}

/* ---------- meet prep: scouting + lineup ---------- */
function cleanLu(lu) { const o = { pk: lu.pk, week: lu.week, season: lu.season, ind: {}, rel: {} }; for (const k in lu.ind) o.ind[k] = lu.ind[k].filter(Boolean); for (const k in lu.rel) o.rel[k] = lu.rel[k].filter(r => r && r.filter(Boolean).length === 4); return o; }
function lineupErrors(nm) { if (!U.lu) return ['No lineup']; const errs = []; for (const k in U.lu.rel) for (const r of U.lu.rel[k]) { const n = r ? r.filter(Boolean).length : 0; if (n > 0 && n < 4) errs.push('Incomplete relay in ' + E.evName(k)); } S.user.lineup = cleanLu(U.lu); return errs.concat(E.validateLineup(S, me(), nm.pk, nm.rules, S.user.lineup)); }
function loadWord(t) { const l = t.plan[0], tap = t.roster.map(P).filter(p => p.tw > 0).length; return tap > 14 ? 'Tapering (week ' + Math.max(...t.roster.map(id => P(id).tw)) + ')' : l === 3 ? 'Training through — heavy load' : l === 2 ? 'Moderate training' : l <= 1 ? 'Resting up' : 'Tapering'; }
VIEWS.prep = () => {
  const nm = S.sub === 'meet' || true ? ensureLineup() : null; if (!nm) return `<div class="pan"><h2>Meet prep</h2><p class="mu">No meet for your club this week.</p></div>`;
  const [tab, th] = tabs('prep', [['lineup', 'Lineup card'], ['scout', 'Scouting report']]);
  const head = `<div class="pan hi" style="margin-bottom:12px"><h2>${esc(nm.label)} — ${nm.type === 'final' ? 'vs ' + nm.opp.map(o => T(o).abbr).join(', ') : (nm.home === S.user.tid ? 'vs ' : 'at ') + esc(T(nm.opp[0]).name)}</h2>${S.sub === 'train' ? '<p class="warn sm">Practice week has not been run yet — fitness, fatigue and injuries will change before the meet. Lineups are submitted blind: you never see their card, only this report.</p>' : '<p class="sm mu">Lineups are submitted blind. Scoring: ' + (nm.type === 'final' ? '20-17-16-15-14-13-12-11 individual, relays double; two swimmers per event; max 3 individual / 6 total swims.' : '9-4-3-2-1 individual, 11-4-2 relays; up to 3 entries and 2 relays; max 3 individual / 4 total swims.') + '</p>'}${th}</div>`;
  return head + (tab === 'scout' ? scoutView(nm) : lineupView(nm));
};
function scoutView(nm) {
  return nm.opp.map(o => { const t = T(o), rep = E.scouting(S, o, nm.pk, nm.rules), needs = E.teamNeeds(S, t).slice(0, 4), inj = t.roster.map(P).filter(p => !E.avail(p)), stars = t.roster.map(P).sort((a, b) => E.val(b) - E.val(a)).slice(0, 5);
    const mine = S.user.lineup || { ind: {}, rel: {} };
    return `<div class="pan" style="margin-bottom:12px"><h2>${bdg(o)} ${esc(t.name)} <span class="mu sm">${t.w}–${t.l} · coach ${esc(t.coach.n)}</span></h2>
    <div class="grid g3"><div><div class="kv"><span>Habits this week</span><span class="b">${loadWord(t)}</span></div><div class="kv"><span>Readiness</span><span>${readiness(t.roster.map(P).filter(E.avail)).toFixed(1)}% off peak</span></div><div class="kv"><span>Out injured</span><span>${inj.length ? inj.map(p => pl(p.id, p.ln)).join(', ') : 'nobody'}</span></div></div>
    <div><h3>Stars</h3>${stars.map(p => `<div class="sm">${pl(p.id)} <span class="mu">${E.ARCHN[p.arch]} · ${topEvents(p, 2)}</span></div>`).join('')}</div>
    <div><h3>Where they are thin</h3>${needs.length ? needs.map(([k, n]) => `<div class="sm">${E.evName(k)} <span class="mu">(+${(n * 100).toFixed(1)}% behind league-median No. 1)</span></div>`).join('') : '<div class="sm mu">No obvious holes.</div>'}</div></div>
    <h3 style="margin-top:10px">Likely entries — season bests and how they should swim this week</h3>${tbl(['Event', 'Expected entries (projected · season best)', 'Your card'], rep.map(r => { const myk = r.rel ? (mine.rel[r.k] || []).length + ' relay(s)' : (mine.ind[r.k] || []).map(id => P(id) ? P(id).ln + ' <span class="t mu">' + f(E.expTime(P(id), r.k.slice(2)) * 100) + '</span>' : '').join(' · ');
      return [`<span class="cond">${E.evName(r.k)}</span>`, { cls: 'wrap', v: r.rel ? r.rel.map((x, i) => 'AB'[i] + ': ' + x.ids.map(id => P(id).ln).join(', ') + ' <span class="t">' + f(x.t) + '</span>').join('<br>') + (r.sb ? ' <span class="mu sm">· team SB ' + f(r.sb) + '</span>' : '') : r.ent.map(x => pl(x.id, P(x.id).ln) + ' <span class="t">' + f(x.t) + '</span>' + (x.sb ? ' <span class="t mu sm">(' + f(x.sb) + ')</span>' : '')).join(' · ') }, { cls: 'wrap sm', v: myk }]; }))}</div>`; }).join('');
}
function lineupView(nm) {
  const t = me(), lu = U.lu, prog = E.PROG[nm.pk], rules = nm.rules, errs = lineupErrors(nm), ps = t.roster.map(P).filter(E.avail), cnt = {}, ind = {};
  for (const k in lu.ind) for (const id of lu.ind[k]) if (id) { cnt[id] = (cnt[id] || 0) + 1; ind[id] = (ind[id] || 0) + 1; } for (const k in lu.rel) for (const r of lu.rel[k]) if (r) for (const id of r) if (id) cnt[id] = (cnt[id] || 0) + 1;
  let proj = null; try { proj = E.projection(S, S.user.lineup, nm); } catch (e) { }
  const optCache = {}; const opts = (g, e) => { const key = g + e; if (optCache[key]) return optCache[key]; return optCache[key] = ps.filter(p => g === 2 || p.g === g).map(p => [p, E.expTime(p, e)]).sort((a, b) => a[1] - b[1]).map(([p, x]) => `<option value="${p.id}">${esc(p.ln)}, ${p.fn[0]}.${g === 2 ? ' (' + E.GN[p.g] + ')' : ''} ${f(x * 100)}${(cnt[p.id] || 0) >= rules.maxTot ? ' ●' : ''}</option>`).join(''); };
  const sel = (g, e, cur, attrs) => { const over = cur && ((cnt[cur] || 0) > rules.maxTot || (ind[cur] || 0) > rules.maxInd); return `<select data-ch="lu" ${attrs} class="${over ? 'bad' : ''}"><option value="">— empty —</option>${opts(g, e).replace(`value="${cur}"`, `value="${cur}" selected`)}</select>`; };

  for (const ev of prog) {
    if (ev.pos - lastPos > 20) rows += '<div class="brk">— next session —</div>'; else if (ev.pos - lastPos > 3 && lastPos) rows += '<div class="brk">— break —</div>'; lastPos = ev.pos;
    const pr = proj && proj.per[ev.k], ptxt = pr ? `<span class="t ${pr[0] > pr[1] + .5 ? 'good' : pr[0] < pr[1] - .5 ? 'bad' : ''}">${pr[0].toFixed(1)}–${pr[1].toFixed(1)}</span>` : '';
    if (ev.rel) { const legs = E.REL[ev.e].legs, rs = lu.rel[ev.k] || (lu.rel[ev.k] = []); let h = ''; for (let ri = 0; ri < rules.relays; ri++) { const r = rs[ri] || [null, null, null, null]; h += `<div class="sl" style="margin-bottom:3px">${legs.map((le, li) => sel(ev.g, le, r[li], `data-k="${ev.k}" data-r="${ri}" data-l="${li}" title="${'AB'[ri]} relay · ${E.EV[le].n}"`)).join('')}</div>`; } rows += `<div class="lev rel"><div class="en">${E.evName(ev.k)}</div><div>${h}</div><div class="r">${ptxt}</div></div>`; }
    else { const a = lu.ind[ev.k] || (lu.ind[ev.k] = []); let h = ''; for (let i = 0; i < rules.per; i++) h += sel(ev.g, ev.e, a[i], `data-k="${ev.k}" data-i="${i}"`); rows += `<div class="lev"><div class="en">${E.evName(ev.k)}</div><div class="sl">${h}</div><div class="r">${ptxt}</div></div>`; }
  }
  const use = ps.slice().sort((a, b) => a.g - b.g || E.val(b) - E.val(a)).map(p => ({ cls: (cnt[p.id] || 0) > rules.maxTot || (ind[p.id] || 0) > rules.maxInd ? 'me' : '', c: [pl(p.id, p.ln + ', ' + p.fn[0] + '.'), E.GN[p.g], { v: `<span class="${(ind[p.id] || 0) > rules.maxInd ? 'bad b' : ''}">${ind[p.id] || 0}</span>`, sv: ind[p.id] || 0, r: 1 }, { v: `<span class="${(cnt[p.id] || 0) > rules.maxTot ? 'bad b' : (cnt[p.id] || 0) === 0 ? 'warn' : ''}">${cnt[p.id] || 0}/${rules.maxTot}</span>`, sv: cnt[p.id] || 0, r: 1 }, { v: (E.slowOf(p) * 100).toFixed(1) + '%', sv: E.slowOf(p), r: 1 }] }));
  return `<div class="grid" style="grid-template-columns:minmax(0,3fr) minmax(260px,1fr)"><div class="pan"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px"><button class="btn on" data-act="autoLu">Auto-lineup</button><button class="btn" data-act="clearLu">Clear card</button>
  <label class="sm"><input type="checkbox" data-ch="tog" data-arg="autoLineup" ${S.user.autoLineup ? 'checked' : ''}> Auto-manage lineups every meet</label><span class="sp"></span>
  ${proj ? `<span class="cond">Projected</span> <span class="led" style="font-size:20px">${proj.my.toFixed(0)}–${(proj.op / nm.opp.length).toFixed(0)}</span>${nm.opp.length > 1 ? ' <span class="sm mu">you vs the average of the other three</span>' : ''}` : ''}</div>
  ${errs.length ? `<div class="news inj">${errs.slice(0, 5).map(esc).join('<br>')}${errs.length > 5 ? '<br>…and ' + (errs.length - 5) + ' more' : ''}</div>` : '<div class="news meet">Card is legal. Times shown are how each swimmer projects today (fitness, fatigue, taper). Swims close together in the program cost time. ● = at the swim limit.</div>'}
  ${rows}<p style="margin-top:10px"><button class="btn pri" data-act="play">${playLabel()} ▶</button> <label class="sm"><input type="checkbox" data-ch="tog" data-arg="watch" ${S.user.watch ? 'checked' : ''}> Watch race by race</label></p></div>
  <div class="pan"><h2>Swim count</h2>${tbl(['Swimmer', 'G', { h: 'Ind', r: 1 }, { h: 'Total', r: 1 }, { h: 'Off peak', r: 1 }], use)}</div></div>`;
}
CH.lu = el => { const lu = U.lu, k = el.dataset.k, v = el.value ? +el.value : null; if (el.dataset.r != null) { const rs = lu.rel[k] || (lu.rel[k] = []), ri = +el.dataset.r; while (rs.length <= ri) rs.push([null, null, null, null]); rs[ri][+el.dataset.l] = v; } else { const a = lu.ind[k] || (lu.ind[k] = []); a[+el.dataset.i] = v; lu.ind[k] = a.filter((x, i) => x && a.indexOf(x) === i); } S.user.lineup = cleanLu(lu); save(); rerender(); };
ACT.autoLu = () => { S.user.lineup = E.autoLineup(S); U.lu = null; ensureLineup(); save(); rerender(); toast('Assistant wrote a lineup against their expected entries. Edit anything.'); };
ACT.clearLu = () => { for (const k in U.lu.ind) U.lu.ind[k] = []; for (const k in U.lu.rel) U.lu.rel[k] = []; S.user.lineup = cleanLu(U.lu); rerender(); };

/* ---------- live meet viewer ---------- */
function rn_(res, id, short) { const n = (res.nm && res.nm[id]) || (P(id) ? E.pname(P(id)) : '?'); return short ? n.slice(n.indexOf(' ') + 1) : n; }

function evMeta(k) { const g = k[0], e = k.slice(2); return { k, e, rel: !!E.REL[e], dist: E.REL[e] ? E.REL[e].legs.reduce((s, l) => s + E.EV[l].d, 0) : E.EV[e].d }; }

VIEWS.live = () => {
  const L = U.live; if (!L) return VIEWS.dash(); const res = L.res, ev = res.ev[L.ei], m = evMeta(ev.k), rows = ev.rows.slice().sort((a, b) => a.ln - b.ln);

  <button class="btn" data-act="livePause" id="lp">${L.playing ? '❚❚ Pause' : '▶ Play'}</button>${[1, 2, 4, 8].map(x => `<button class="btn ${L.speed === x ? 'on' : ''}" data-act="liveSpeed" data-arg="${x}">${x}×</button>`).join('')}<button class="btn" data-act="liveNext">Next event →</button><button class="btn" data-act="liveSkip">Skip to results</button></div>

  <div class="grid" style="grid-template-columns:minmax(0,1fr) 190px"><div><div class="pool">${rows.map((r, i) => { const t = T(res.teams[r.ti]); return `<div class="lane" id="ln${i}"><div class="ln">${r.ln}</div><div class="nm">${bdg(t.id)} <span id="lnm${i}">${esc(m.rel ? '1. ' + rn_(res, r.pids[0], 1) : rn_(res, r.pid))}</span></div><div class="trk"><div class="sw" id="lsw${i}" style="background:${t.c1};border:2px solid ${t.c2}"></div></div><div class="rs" id="lrs${i}"></div></div>`; }).join('')}</div>

};
function startLive() {
  const L = U.live; if (!L) return; const res = L.res, ev = res.ev[L.ei], m = evMeta(ev.k), rows = ev.rows.slice().sort((a, b) => a.ln - b.ln);
  L.rows = rows; L.data = rows.map(r => laneData(m, r)); L.maxT = Math.max(...L.data.map(d => d.tot)); L.dur = 6 + Math.log2(m.dist / 50) * 1.7; L.last = null; L.idx = rows.map(() => 0); L.m = m;
  if (L.fin) { L.t = L.maxT + 1; drawLive(true); showEventResult(); return; }
  const tick = ts => { if (U.view !== 'live' || U.live !== L) return; if (L.last == null) L.last = ts; const dt = Math.min(.1, (ts - L.last) / 1000); L.last = ts; if (L.playing) L.t += dt * L.speed * (L.maxT / L.dur); drawLive(false); if (L.t >= L.maxT) { L.fin = true; drawLive(true); showEventResult(); if (L.playing) L.to = setTimeout(() => { if (U.live === L && U.view === 'live' && L.playing && L.fin) ACT.liveNext(); }, 2600 / Math.sqrt(L.speed)); return; } L.raf = requestAnimationFrame(tick); };
  L.raf = requestAnimationFrame(tick);

    const d = L.data[i], sw = document.getElementById('lsw' + i), rs = document.getElementById('lrs' + i); if (!sw) return;

}

    `<div class="grid g2"><div class="pan hi"><h2>${h.y} champions: ${esc(T(h.champ).name)}</h2><p>${h.fin.map(([x, s], i) => `${i + 1}. ${bdg(x)} <span class="led">${s}</span>`).join(' &nbsp; ')}</p>${awardsBlock(h)}<p><a data-go="history">Full season page: event titles, all-league teams →</a></p></div>
    <div class="pan"><h2>Your review</h2><div class="kv"><span>Season</span><span class="b">${r ? r.w + '–' + r.l + ' · ' + esc(r.res) : ''}</span></div><div class="kv"><span>Owner wanted</span><span>${r ? esc(E.EXPN[r.exp]) : ''}</span></div><div class="kv"><span>Job security</span><span>${meter(S.user.sec / 100, S.user.sec < 30 ? 'fat' : '')} ${Math.round(S.user.sec)}</span></div><div class="kv"><span>Expiring contracts</span><span>${(O.exp[t.id] || []).length}</span></div>
    <h3 style="margin-top:8px">Retirements around the league</h3><div class="sm" style="max-height:150px;overflow:auto">${O.retired.map(x => (S.retired[x[0]] ? pl(x[0], x[1]) : esc(x[1])) + ' <span class="mu">(' + (T(x[2]) ? T(x[2]).abbr : 'FA') + ', ' + x[3] + ')</span>').join(' · ') || 'None.'}</div></div>
    <div class="pan" style="grid-column:1/-1"><h2>Offseason development — your swimmers</h2>${tbl(['Swimmer', 'G', { h: 'Age', r: 1 }, 'Type', { h: 'Ovr', r: 1 }, { h: 'Change', r: 1, t: 'Change in ability (power-point scale) since last season' }, 'Ceil', { h: 'Yrs left', r: 1 }], mine.map(p => [pl(p.id), E.GN[p.g], p.age, E.ARCHN[p.arch], num(E.ovr(p)), { v: `<span class="${(p.dv || 0) > 0 ? 'good' : (p.dv || 0) < 0 ? 'bad' : 'mu'}">${(p.dv || 0) > 0 ? '+' : ''}${p.dv || 0}</span>`, sv: p.dv || 0, r: 1 }, { v: p.age < 26 ? potGrade(p) : '—', sv: E.val(p) }, num(p.c.yrs)]))}</div></div>`;
  }
  if (O.step === 'resign') {
    const ex = (O.exp[t.id] || []).map(P).filter(Boolean).sort((a, b) => E.val(b) - E.val(a)), c = E.gcount(S, t), cm = [c[0], c[1]]; ex.forEach(p => cm[p.g]--);
    return bar + `<div class="pan hi"><h2>Re-signing window</h2><p class="sm mu">These contracts are up. Offer at or near the ask and they stay; anyone unsigned when you advance hits the open market. Committed for next year without them: ${cm[0]} women, ${cm[1]} men, ${money(E.payroll(S, t) - ex.reduce((s, p) => s + p.c.sal, 0))} of ${money(S.cap)}. Trades are open.</p>
    ${tbl(['Swimmer', 'G', { h: 'Age', r: 1 }, 'Type', { h: 'Ovr', r: 1 }, 'Ceil', 'Best events', { h: 'Last salary', r: 1 }, { h: 'Asking / yr', r: 1 }, 'Offer'], ex.map(p => [pl(p.id) + statusTags(p), E.GN[p.g], p.age, E.ARCHN[p.arch], num(E.ovr(p)), { v: p.age < 26 ? potGrade(p) : '—', sv: E.val(p) }, topEvents(p, 3), { v: money(p.c.sal), sv: p.c.sal, r: 1 }, { v: money(p.ask), sv: p.ask, r: 1 }, `<input type="number" id="rs${p.id}" value="${p.ask}" step="5" style="width:76px"> <select id="ry${p.id}">${[1, 2, 3, 4].map(y => `<option${y === 2 ? ' selected' : ''}>${y}</option>`).join('')}</select> <button class="btn sm on" data-act="resign" data-arg="${p.id}">Re-sign</button>`]), { empty: 'Nobody left to re-sign.' })}</div>`;
  }
  const is = E.userRosterIssues(S), c = E.gcount(S, t);
  return bar + `<div class="pan hi"><h2>Cut-down day</h2><p>You carry ${c[0]} women and ${c[1]} men; payroll ${money(E.payroll(S, t))} of ${money(S.cap)}. ${is.length ? '<span class="bad b">Fix: ' + is.map(esc).join(' · ') + '</span>' : '<span class="good b">Roster is legal. Start the season when ready.</span>'}</p><p><button class="btn" data-act="autofix">Let my assistant fix it</button> <button class="btn" data-go="fa">Free agents</button> <button class="btn" data-go="trade">Trades</button></p>
  ${tbl(ROSTER_H, rosterRows(t.roster.map(P).sort((a, b) => a.g - b.g || E.val(b) - E.val(a)), true))}</div>`;
};
window.__UI = U;
render();
})();
