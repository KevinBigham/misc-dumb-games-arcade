  function renderWorld() {
    ctx.save();
    ctx.scale(dpr, dpr);

    // Camera trauma shake
    ctx.save();
    ctx.translate(G.shakeX, G.shakeY);

    drawStudioFloor();

    // Shockwaves
    for (const sw of G.shockwaves) {
      ctx.strokeStyle = sw.color;
      ctx.lineWidth = sw.width * (sw.life / sw.maxLife);
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Loose Props
    for (const pr of G.props) {
      drawPropShape(pr, pr.x, pr.y, pr.r * G.mods.scaleMult, pr.angle);
    }

    // Fired Projectiles
    for (const proj of G.projectiles) {
      drawPropShape(proj, proj.x, proj.y, proj.r, proj.angle);
    }

    // Stage Crashers
    for (const c of G.crashers) {
      drawCrasher(c);
    }

    // Player Anchor Chad in Swivel Chair
    if (G.player) {
      drawPlayer(G.player);
    }

    // Physical Teleprompter Score HUD
    drawPhysicalPrompter();

    // Particles
    for (const pt of G.particles) {
      ctx.fillStyle = pt.color;
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Floating Texts
    for (const ft of G.floatTexts) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, ft.life / ft.maxLife);
      ctx.font = `bold ${ft.size}px Courier New`;
      ctx.textAlign = 'center';
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = CFG.INK;
      ctx.strokeText(ft.text, ft.x, ft.y);
      ctx.fillStyle = ft.color;
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
    }

    ctx.restore(); // End camera shake

    drawAudienceAndHUD();

    // Screen Flash
    if (G.flashAlpha > 0.01) {
      ctx.fillStyle = G.flashColor;
      ctx.globalAlpha = G.flashAlpha;
      ctx.fillRect(0, 0, CFG.W, CFG.H);
      ctx.globalAlpha = 1;
    }

    // overlays per state
    if (state === 'TITLE') drawTitleOverlay();
    else if (state === 'PAUSED') drawPauseOverlay();
    else if (state === 'DVR_REPLAY') drawDvrReplayOverlay();
    else if (state === 'RECEIPT') drawReceiptOverlay();

    if (debugOpen) drawDebugOverlay();

    ctx.restore();
  }

  // ============================================================================
  // 13. MAIN FIXED-TIMESTEP LOOP & GLOBAL SHORTCUTS

  resetRun(initialSeed);

  let lastTime = performance.now();
  let accumulator = 0;

  function handleMetaInputs() {
    if (Input.justPressed.has('Backquote')) {
      debugOpen = !debugOpen;
    }
    if (Input.justPressed.has('KeyM')) {
      Snd.toggleMute();
    }
    if (Input.justPressed.has('KeyR') && state !== 'TITLE') {
      resetRun();
      state = 'PLAY';
      return;
    }

    if (state === 'TITLE') {
      if (Input.mouseJustPressed || Input.justPressed.has('Space') || Input.justPressed.has('Enter')) {
        resetRun();
        state = 'PLAY';
      }
    } else if (state === 'PLAY') {
      if (Input.justPressed.has('KeyP') || Input.justPressed.has('Escape')) {
        enterPauseMenu();
        return;
      }
      // Debug shortcuts when debug panel is open (or via window.__DEBUG)
      if (debugOpen) {
        for (let d = 1; d <= 9; d++) {
          if (Input.justPressed.has('Digit' + d) && NETWORK_NOTES[d - 1]) {
            enactNextNetworkNote(NETWORK_NOTES[d - 1].id);
          }
        }
        if (Input.justPressed.has('Digit0')) triggerApplauseWave('DEBUG APPLAUSE!');
        if (Input.justPressed.has('KeyK')) triggerGameOver();
      }
    } else if (state === 'PAUSED') {
      if (Input.justPressed.has('KeyP') || Input.justPressed.has('Escape')) {
        state = 'PLAY';
        return;
      }
      if (Input.mouseJustPressed) {
        // Check if player clicked a physical pause cue card!
        let hitCard = null;
        for (const card of G.pauseCards) {
          if (
            Math.abs(Input.mouseX - card.x) <= card.w * 0.5 &&
            Math.abs(Input.mouseY - card.y) <= card.h * 0.5
          ) {
            hitCard = card;
            break;
          }
        }
        if (hitCard) {
          if (hitCard.id === 'RESUME') { state = 'PLAY'; return; }
          if (hitCard.id === 'MUTE') { Snd.toggleMute(); hitCard.vy = -260; return; }
          if (hitCard.id === 'RESTART') { resetRun(); state = 'PLAY'; return; }
        } else {
          // Clicking anywhere else in the pause menu sneezes a shockwave that bounces the pause cards!
          Snd.sneeze(0.7, false, false, 0);
          addShockwave(Input.mouseX, Input.mouseY, 120, '#ffbe2e', 5);
          for (const card of G.pauseCards) {
            const dx = card.x - Input.mouseX;
            const dy = card.y - Input.mouseY;
            const d = Math.max(30, Math.hypot(dx, dy));
            card.vx += (dx / d) * 420;
            card.vy = -Math.abs((dy / d) * 460) - 180;
            card.vAngle += (Math.random() - 0.5) * 4;
          }
        }
      }
    } else if (state === 'DVR_REPLAY') {
      if (Input.mouseJustPressed || Input.justPressed.has('Space') || Input.justPressed.has('Enter')) {
        state = 'RECEIPT';
        G.receiptStep = 0;
        G.receiptTimer = 0;
      }
    } else if (state === 'RECEIPT') {
      if (Input.mouseJustPressed || Input.justPressed.has('Space') || Input.justPressed.has('Enter')) {
        if (G.receiptStep <= 10) {
          G.receiptStep = 12;
        } else {
          resetRun();
          state = 'PLAY';
        }
      }
    }
  }

  function frame(now) {
    let rawDt = (now - lastTime) / 1000;
    lastTime = now;
    if (rawDt > 0) fpsEstimate = fpsEstimate * 0.92 + (1 / rawDt) * 0.08;
    const clampedDt = Math.min(CFG.MAX_DT, Math.max(0, rawDt));

    handleMetaInputs();

    // Update camera shake & screen flash in real time
    if (G.shake > 0.05) {
      G.shake *= Math.pow(0.04, clampedDt);
      const mag = Math.min(11, G.shake);
      G.shakeX = Math.sin(now * 0.09) * mag;
      G.shakeY = Math.cos(now * 0.11) * mag;
    } else {
      G.shake = 0; G.shakeX = 0; G.shakeY = 0;
    }
    if (G.flashAlpha > 0) {
      G.flashAlpha = Math.max(0, G.flashAlpha - clampedDt * 1.8);
    }

    if (state === 'PLAY' || state === 'TITLE') {
      if (G.hitStop > 0) {
        G.hitStop = Math.max(0, G.hitStop - clampedDt);
      } else {
        accumulator += clampedDt * G.timeScale;
        let steps = 0;
        while (accumulator >= CFG.DT && steps < 6) {
          updatePlay(CFG.DT);
          if (state === 'PLAY') recordDvrSnapshot();
          accumulator -= CFG.DT;
          steps++;
        }
        if (steps >= 6) accumulator = 0;
      }
    } else if (state === 'PAUSED') {
      updatePauseMenu(clampedDt);
    } else if (state === 'DVR_REPLAY') {
      // Play back the recorded DVR buffer at 0.35x speed!
      G.dvrPlaybackPos += clampedDt * 60 * CFG.DVR.slowMoScale;
      const idx = Math.floor(G.dvrPlaybackPos);
      if (idx < G.dvrBuffer.length) {
        const snap = G.dvrBuffer[idx];
        G.player.x = snap.px; G.player.y = snap.py;
        G.player.angle = snap.pAngle; G.player.chairAngle = snap.pChair;
        G.player.sx = snap.psx; G.player.sy = snap.psy;
      } else {
        state = 'RECEIPT';
        G.receiptStep = 0;
        G.receiptTimer = 0;
      }
    } else if (state === 'RECEIPT') {
      G.receiptTimer += clampedDt;
      if (G.receiptTimer >= 0.11 && G.receiptStep <= 10) {
        G.receiptTimer = 0;
        G.receiptStep++;
        Snd.receiptTick(G.receiptStep > 9);
      }
    }

    renderWorld();
    Input.clearFrame();
    requestAnimationFrame(frame);
  }

  // Expose testing hooks for automated headless verification
  window.__CHAIRBORNE = {
    getState: () => state,
    setState: (s) => { state = s; },
    getGame: () => G,
    enactNote: (id) => enactNextNetworkNote(id),
    triggerApplause: () => triggerApplauseWave('TEST APPLAUSE'),
    triggerGameOver: () => triggerGameOver(),
    enterPause: () => enterPauseMenu(),
    notes: NETWORK_NOTES
  };

  requestAnimationFrame(frame);
})();
</script>
