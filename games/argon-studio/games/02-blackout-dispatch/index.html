function getUpgradeCostMat(fromType, toType, isDamaged) {
  if (fromType === toType) {
    return isDamaged ? CONFIG.LINKS[fromType].repairCostMat : 0;
  }
  const diff = Math.max(10, CONFIG.LINKS[toType].buildCostMat - CONFIG.LINKS[fromType].buildCostMat + (isDamaged ? 5 : 0));
  return diff;
}
function coordKey(row, col) {
  return `${row},${col}`;
}
function parseCoordKey(key) {
  const [r, c] = key.split(",").map(Number);
  return { row: r, col: c };
}
function makeEdgeId(a, b) {
  const cA = typeof a === "string" ? parseCoordKey(a) : a;
  const cB = typeof b === "string" ? parseCoordKey(b) : b;
  const kA = coordKey(cA.row, cA.col);
  const kB = coordKey(cB.row, cB.col);
  if (cA.row < cB.row || cA.row === cB.row && cA.col <= cB.col) {
    return `${kA}--${kB}`;
  }
  return `${kB}--${kA}`;
}
function parseEdgeId(edgeId) {
  const [nodeA, nodeB] = edgeId.split("--");
  return {
    nodeA,
    nodeB,
    coordA: parseCoordKey(nodeA),
    coordB: parseCoordKey(nodeB)
  };
}
function isOrthogonallyAdjacent(a, b) {
  return Math.abs(a.row - b.row) + Math.abs(a.col - b.col) === 1;
}
function formatEdgeLabel(edgeId) {
  const { nodeA, nodeB } = parseEdgeId(edgeId);
  return `(${nodeA})\u2194(${nodeB})`;
}

// games/02-blackout-dispatch/src/rng.ts
function createSeededRng(initialSeed) {
  const normalizedSeed = Math.floor(initialSeed) >>> 0 || 1;
  let state = normalizedSeed;
  const next = () => {
    state = state + 1831565813 >>> 0;
    let t = Math.imul(state ^ state >>> 15, 1 | state);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const nextInt = (minInclusive, maxInclusive) => {
    if (maxInclusive <= minInclusive) return minInclusive;
    return minInclusive + Math.floor(next() * (maxInclusive - minInclusive + 1));
  };
  const pick = (items) => {
    if (items.length === 0) {
      throw new Error("Cannot pick from empty array");
    }
    return items[nextInt(0, items.length - 1)];
  };
  const shuffle = (items) => {
    const copy = [...items];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = nextInt(0, i);
      const tmp = copy[i];
      copy[i] = copy[j];
      copy[j] = tmp;
    }
    return copy;
  };
  return {
    seed: normalizedSeed,
    next,
    nextInt,
    pick,
    shuffle
  };
}

function generateSeededScenario(seed) {
  const rng = createSeededRng(seed);
  const base = SCENARIO_1_HARBOR_SQUALL;
  const candidateTargetEdges = [
    makeEdgeId({ row: 3, col: 3 }, { row: 3, col: 4 }),
    makeEdgeId({ row: 2, col: 4 }, { row: 2, col: 5 }),
    makeEdgeId({ row: 5, col: 3 }, { row: 5, col: 4 }),
    makeEdgeId({ row: 1, col: 4 }, { row: 2, col: 4 }),
    makeEdgeId({ row: 4, col: 4 }, { row: 5, col: 4 }),
    makeEdgeId({ row: 3, col: 4 }, { row: 3, col: 5 }),
    makeEdgeId({ row: 1, col: 3 }, { row: 1, col: 4 })
  ];
  const shuffledEdges = rng.shuffle(candidateTargetEdges);
  const strikeTurns = [4, 6, 8, 10, 12];
  const gustNames = [
    "Seeded Squall Front",
    "Barometric Shear Gust",
    "Harbor Vortex Line",
    "Coastal Microburst",
    "Cyclonic Tail Gust"
  ];
  const stormStrikes = strikeTurns.map((turn, idx) => ({
    turn,
    edgeId: shuffledEdges[idx % shuffledEdges.length],
    severity: "wind",
    label: `${gustNames[idx]} (#${rng.nextInt(10, 99)})`
  }));
  const districts = base.districts.map((d) => {
    const curve = d.demandCurve.map((val, turnIdx) => {
      if (turnIdx < 3) return val;
      const delta = rng.nextInt(-1, 1);
      return Math.max(2, Math.min(4, val + delta));
    });
    return {
      ...d,
      demandCurve: curve
    };
  });
  return {
    ...base,
    id: `seeded-${rng.seed}`,
    number: 4,
    title: `Seeded Storm #${rng.seed}`,
    subtitle: "Deterministic Procedural Weather Pattern",
    briefing: `Seeded Storm Dispatch (Seed: ${rng.seed}). All storm strikes and district demand fluctuations are 100% deterministic for this seed.`,
    districts,
    stormStrikes,
    isSeeded: true,
    seed: rng.seed
  };
}
function getScenarioById(id, seed = CONFIG.DEFAULT_SEED) {

  padding: 0.65rem 0.9rem;
  margin-block-end: 0.75rem;
  font-size: 0.86rem;
  line-height: 1.4;
  border-left: 4px solid #38bdf8;
  background: #0c192c;
}

.bd-banner-ok {
  border-left-color: #10b981;
  background: #06221c;
  color: #d1fae5;
}

.bd-banner-warn {
  border-left-color: #f59e0b;
  background: #271a07;
  color: #fef3c7;
}

.bd-banner-danger {
  border-left-color: #ef4444;
  background: #2a0d12;
  color: #fee2e2;
}

.bd-layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.85rem;
}

@container dispatch-shell (min-width: 900px) {
  .bd-layout {
    grid-template-columns: minmax(480px, 1.25fr) minmax(350px, 0.95fr);
    align-items: start;
  }
}

.bd-panel {
  background: #0f1b2d;
  border: 1px solid #1e3a5f;
  border-radius: 10px;
  padding: 0.8rem;
}

.bd-panel h2 {
  margin: 0 0 0.55rem;
  font-size: 0.95rem;
  font-weight: 700;
  color: #e2e8f0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.bd-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-block-end: 0.65rem;
}

.bd-tool-btn {
  flex: 1 1 auto;
  min-block-size: 34px;
  padding: 0.35rem 0.55rem;
  border-radius: 6px;
  border: 1px solid #334155;
  background: #162235;
  color: #cbd5e1;
  font-size: 0.77rem;
  font-weight: 600;
  cursor: pointer;
  text-align: left;
}

.bd-tool-btn[aria-pressed="true"] {
  background: #0369a1;
  border-color: #38bdf8;
  color: #ffffff;
}

.bd-board-wrapper {
  width: 100%;
  overflow-x: auto;
}

.bd-svg-board {
  width: 100%;
  max-width: 680px;
  height: auto;
  aspect-ratio: 1 / 1;
  display: block;
  margin: 0 auto;
  background: #070e1a;
  border: 1px solid #1e3a5f;
  border-radius: 8px;
  user-select: none;
}

.bd-corridor-hit {
  cursor: pointer;
}

.bd-corridor-hit:hover .bd-corridor-hover-ring {
  opacity: 0.95;
}

.bd-inspector {
  margin-block-start: 0.65rem;
  padding: 0.65rem;
  background: #091322;
  border: 1px solid #264063;
  border-radius: 8px;
}

.bd-inspector-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-block-start: 0.45rem;
}

.bd-action-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  margin-block-start: 0.65rem;
  padding-block-start: 0.65rem;
  border-top: 1px solid #1e3a5f;
}

.bd-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.78rem;
}

.bd-table caption {
  text-align: left;
  font-weight: 700;
  color: #cbd5e1;
  margin-block-end: 0.35rem;
  font-size: 0.85rem;
}

.bd-table th, .bd-table td {
  padding: 0.4rem 0.45rem;
  border-bottom: 1px solid #1e293b;
  text-align: left;
}

.bd-table th {
  color: #94a3b8;
  font-weight: 600;
  background: #091322;
}

.bd-badge {
  display: inline-block;
  padding: 0.12rem 0.42rem;
  border-radius: 4px;
  font-size: 0.71rem;
  font-weight: 700;
}

.bd-badge-lit {
  background: #064e3b;
  color: #6ee7b7;
  border: 1px solid #10b981;
}

.bd-badge-short {
  background: #78350f;
  color: #fde68a;
  border: 1px solid #f59e0b;
}

.bd-badge-out {
  background: #7f1d1d;
  color: #fecaca;
  border: 1px solid #ef4444;
}

.bd-forecast-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.bd-forecast-item {
  padding: 0.45rem 0.6rem;
  border-radius: 6px;
  background: #091322;
  border: 1px solid #1e3a5f;
  font-size: 0.79rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
}

.bd-dialog {
  background: #0f1b2d;
  color: #f1f5f9;
  border: 1px solid #38bdf8;
  border-radius: 10px;
  padding: 1rem;
  max-width: 520px;
  width: 92vw;
}

.bd-dialog::backdrop {
  background: rgba(2, 6, 23, 0.78);
}

}

                  ${selectedLink ? `${CONFIG.LINKS[selectedLink.type].name} \xB7 Status: ${selectedLink.status.toUpperCase()} \xB7 Flow: ${selectedEf?.flowMW ?? 0}/${selectedEf?.capacityMW ?? 0} MW \xB7 Gate: ${selectedLink.directionConstraint.toUpperCase()}` : "Empty Corridor (No Link Installed)"}
                </span>
              </div>
              <div class="bd-inspector-actions">
                ${!selectedLink ? `
                      <button type="button" class="bd-btn bd-btn-primary" data-direct-action="place-standard">Place Standard (4MW \xB7 10 Mat)</button>
                      <button type="button" class="bd-btn" data-direct-action="place-heavy">Place Heavy Trunk (8MW \xB7 20 Mat)</button>
                      <button type="button" class="bd-btn" data-direct-action="place-shielded">Place Storm-Shielded (5MW \xB7 25 Mat)</button>
                    ` : `
                      ${selectedLink.status === "damaged" ? `<button type="button" class="bd-btn bd-btn-warn" data-direct-action="repair">\u{1F527} Repair ${CONFIG.LINKS[selectedLink.type].name} (${CONFIG.LINKS[selectedLink.type].repairCostMat} Mat)</button>` : ""}
                      ${selectedLink.type !== "heavy" ? `<button type="button" class="bd-btn bd-btn-primary" data-direct-action="upgrade-heavy">\u2B06 Upgrade to Heavy Trunk 8MW (${getUpgradeCostMat(selectedLink.type, "heavy", selectedLink.status === "damaged")} Mat)</button>` : ""}
                      ${selectedLink.type !== "shielded" ? `<button type="button" class="bd-btn" data-direct-action="upgrade-shielded">\u{1F6E1} Upgrade to Storm-Shielded 5MW (${getUpgradeCostMat(selectedLink.type, "shielded", selectedLink.status === "damaged")} Mat)</button>` : ""}
                      <button type="button" class="bd-btn" data-direct-action="reroute">\u21C4 Cycle Flow Gate (${CONFIG.REROUTE_COST_MAT} Mat)</button>

            <div class="bd-action-bar">
              <div style="display:flex;gap:0.45rem;flex-wrap:wrap;align-items:center;">
                <button type="button" class="bd-btn" id="bd-btn-undo" ${state.stagedActions.length === 0 ? "disabled" : ""}>\u21A9 Undo Action (${state.stagedActions.length})</button>
                <button type="button" class="bd-btn" id="bd-btn-reset-turn" ${state.stagedActions.length === 0 ? "disabled" : ""}>\u27F2 Reset Turn</button>
              </div>
              <button type="button" class="bd-btn bd-btn-commit" id="bd-btn-commit" ${state.status !== "playing" ? "disabled" : ""}>
                \u2713 Commit Turn ${state.turn} (${flow.totalDeliveredMW}/${flow.totalDemandMW} MW)

          </section>

          <div style="display:flex;flex-direction:column;gap:0.85rem;">
            <section class="bd-panel" aria-labelledby="bd-districts-heading">
              <h2 id="bd-districts-heading">5-District Priority & Demand Schedule</h2>
              <table class="bd-table">
                <caption>Deterministic allocation follows strict Priority Order (P1 \u2192 P5)</caption>
                <thead>
                  <tr>
                    <th scope="col">Pri</th>
                    <th scope="col">District</th>
                    <th scope="col">Turn ${state.turn}</th>
                    <th scope="col">Turn ${Math.min(CONFIG.TOTAL_TURNS, state.turn + 1)}</th>
                    <th scope="col">Status</th>
                    <th scope="col">Unmet Limit</th>
                  </tr>
                </thead>
                <tbody>
                  ${state.scenario.districts.map((d) => {
      const alloc = flow.districtAllocations[d.id];
      const dState = state.districts[d.id];
      const nextDemand = d.demandCurve[Math.min(CONFIG.TOTAL_TURNS - 1, state.turn)];
      const projCum = dState.cumulativeUnmetMW + alloc.unmetMW;
      const badgeClass = alloc.unmetMW === 0 ? "bd-badge-lit" : alloc.deliveredMW > 0 ? "bd-badge-short" : "bd-badge-out";
      const badgeText = alloc.demandMW === 0 ? "IDLE \u2713" : alloc.unmetMW === 0 ? "LIT \u2713" : alloc.deliveredMW > 0 ? `SHORT -${alloc.unmetMW}MW \u26A0` : `OUTAGE -${alloc.unmetMW}MW \u2716`;
      return `
                        <tr>
                          <th scope="row">P${d.priority}</th>
                          <td><strong>${d.id}</strong> ${d.name} <small style="color:#94a3b8;">(${d.row},${d.col})</small></td>

                          <td><span class="bd-badge ${badgeClass}">${badgeText}</span></td>
                          <td style="color:${projCum > d.unmetLimitMW ? "#ef4444" : "#cbd5e1"}">${projCum} / ${d.unmetLimitMW} MW</td>

                      `;
    }).join("")}
                </tbody>
              </table>

            <section class="bd-panel" aria-labelledby="bd-forecast-heading">

      (s) => `
                        <li class="bd-forecast-item" style="border-color:#f59e0b;">
                          <span><strong>\u26A1 Turn ${s.turn} (Resolves Now):</strong> ${s.label} at <code>${formatEdgeLabel(s.edgeId)}</code></span>
                          <span class="bd-badge bd-badge-short">${s.severity.toUpperCase()}</span>
                        </li>`
    ).join("")}
                ${forecast.turnPlus1.length === 0 ? `<li class="bd-forecast-item"><span><strong>Turn ${state.turn + 1} (T+1):</strong> No strikes forecast</span><span class="bd-badge bd-badge-lit">CLEAR</span></li>` : forecast.turnPlus1.map(
      (s) => `
                        <li class="bd-forecast-item">
                          <span><strong>\u26C8 Turn ${s.turn} (T+1):</strong> ${s.label} at <code>${formatEdgeLabel(s.edgeId)}</code></span>
                          <span class="bd-badge bd-badge-short">${s.severity.toUpperCase()}</span>
                        </li>`
    ).join("")}
                ${forecast.turnPlus2.length === 0 ? `<li class="bd-forecast-item"><span><strong>Turn ${state.turn + 2} (T+2):</strong> No strikes forecast</span><span class="bd-badge bd-badge-lit">CLEAR</span></li>` : forecast.turnPlus2.map(
      (s) => `
                        <li class="bd-forecast-item">
                          <span><strong>\u{1F327} Turn ${s.turn} (T+2):</strong> ${s.label} at <code>${formatEdgeLabel(s.edgeId)}</code></span>
                          <span class="bd-badge bd-badge-short">${s.severity.toUpperCase()}</span>
                        </li>`
    ).join("")}
              </ul>
            </section>

            <section class="bd-panel" aria-labelledby="bd-legend-heading">

              <ul class="bd-forecast-list" role="list">
                <li class="bd-forecast-item">
                  <span><strong>Standard Line (L):</strong> 4 MW Capacity \xB7 Build 10 Mat \xB7 Repair 5 Mat</span>

                  <span><strong>Heavy Trunk (H):</strong> 8 MW Capacity \xB7 Build 20 Mat \xB7 Upgrade 10 Mat</span>
                  <span style="color:#34d399;">High Throughput</span>
                </li>
                <li class="bd-forecast-item">
                  <span><strong>Storm-Shielded (S\u{1F6E1}):</strong> 5 MW Capacity \xB7 Build 25 Mat \xB7 Upgrade 15 Mat</span>
                  <span style="color:#38bdf8;">Immune to Wind</span>
                </li>
              </ul>
            </section>

            ${debugEnabled ? `
                  <section class="bd-panel" aria-labelledby="bd-debug-heading" style="border-color:#a855f7;">
                    <h2 id="bd-debug-heading" style="color:#e9d5ff;">\u{1F6E0} Solver & Telemetry Debug Panel</h2>
                    <div style="display:flex;flex-wrap:wrap;gap:0.4rem;margin-bottom:0.5rem;">
                      <button type="button" class="bd-btn" id="bd-dbg-trunk">Run Strategy A: Efficient Trunk (Win)</button>
                      <button type="button" class="bd-btn" id="bd-dbg-loop">Run Strategy B: Redundant Loop (Win)</button>

                      DAG Verified (No Cycles): ${!flow.hasDirectedCycle} | Links: ${Object.keys(state.board.links).length} | Energized Relays: ${flow.energizedRelayIds.join(", ") || "None"}
                    </div>
                  </section>
                ` : ""}
          </div>
        </div>
      </main>

      <dialog id="bd-save-dialog" class="bd-dialog" aria-labelledby="bd-dialog-title">
        <h2 id="bd-dialog-title" style="margin-top:0;">Save / Export / Import Dispatch State</h2>
        <p style="font-size:0.82rem;color:#94a3b8;">Copy this JSON snapshot to back up your mid-turn dispatch state or paste a saved payload below.</p>

        <textarea id="bd-save-textarea" class="bd-textarea">${serializeGameState(state)}</textarea>

        </div>
      </dialog>
    `;
    root.querySelector("#bd-scenario-select")?.addEventListener("change", (e) => {
      const val = e.target.value;
      const nextScenario = val === "seeded" ? getScenarioById("seeded", state.scenario.seed ?? CONFIG.DEFAULT_SEED) : getScenarioById(val);
      state = createInitialGameState(nextScenario);
      feedbackBanner = { text: `Loaded ${nextScenario.title}.`, kind: "info" };
      persistCurrentState();
      render();
    });
    root.querySelector("#bd-btn-new-seed")?.addEventListener("click", () => {
      const nextSeed = (state.scenario.seed ?? CONFIG.DEFAULT_SEED) + 137 >>> 0;
      state = createInitialGameState(getScenarioById("seeded", nextSeed));
      feedbackBanner = {
        text: `Generated deterministic Seeded Storm #${nextSeed}.`,
        kind: "info"
      };
      persistCurrentState();
      render();
    });
    root.querySelector("#bd-btn-restart")?.addEventListener("click", () => {
      state = createInitialGameState(state.scenario);
      feedbackBanner = { text: `Restarted ${state.scenario.title} at Turn 1.`, kind: "info" };
      persistCurrentState();
      render();
    });
    root.querySelector("#bd-btn-mute")?.addEventListener("click", () => {
      audio.toggleMute();
      render();
    });
    root.querySelector("#bd-btn-debug")?.addEventListener("click", () => {
      debugEnabled = !debugEnabled;
      render();
    });
    const dialog = root.querySelector("#bd-save-dialog");
    root.querySelector("#bd-btn-save-modal")?.addEventListener("click", () => {
      if (dialog && typeof dialog.showModal === "function") {
        dialog.showModal();
      }
    });
    root.querySelector("#bd-btn-close-dialog")?.addEventListener("click", () => {
      dialog?.close();
    });
    root.querySelector("#bd-btn-clear-save")?.addEventListener("click", () => {
      clearSavedGameState();
      dialog?.close();
      feedbackBanner = { text: "Cleared saved localStorage state.", kind: "info" };
      render();
    });
    root.querySelector("#bd-btn-import-save")?.addEventListener("click", () => {
      const raw = root.querySelector("#bd-save-textarea")?.value;
      if (!raw) return;
      const imported = deserializeGameState(raw);
      if (imported) {
        state = imported;
        persistCurrentState();
        dialog?.close();
        feedbackBanner = { text: `Imported save state at Turn ${state.turn}.`, kind: "info" };
        render();
      } else {
        feedbackBanner = {
          text: "Invalid or corrupted save JSON \u2014 current state preserved.",
          kind: "error"
        };
        dialog?.close();
        render();
      }
    });
    root.querySelectorAll("[data-tool]").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeTool = btn.getAttribute("data-tool");
        render();
      });
    });
    root.querySelectorAll("[data-edge-id]").forEach((el) => {
      el.addEventListener("click", () => {
        const edgeId = el.getAttribute("data-edge-id");
        if (edgeId) handleCorridorAction(edgeId);
      });
    });
    root.querySelectorAll("[data-direct-action]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const tool = btn.getAttribute("data-direct-action");
        handleCorridorAction(selectedEdgeId, tool);
      });
    });
    root.querySelector("#bd-btn-undo")?.addEventListener("click", handleUndo);
    root.querySelector("#bd-btn-reset-turn")?.addEventListener("click", handleResetTurn);
    root.querySelector("#bd-btn-commit")?.addEventListener("click", handleCommitTurn);
    root.querySelector("#bd-dbg-trunk")?.addEventListener(
      "click",
      () => runAutomatedScript(SCENARIO_1_EFFICIENT_TRUNK_SCRIPT, "Efficient Trunk Strategy")
    );
    root.querySelector("#bd-dbg-loop")?.addEventListener(
      "click",
      () => runAutomatedScript(SCENARIO_1_REDUNDANT_LOOP_SCRIPT, "Redundant Loop Strategy")
    );
    root.querySelector("#bd-dbg-loss")?.addEventListener(
      "click",
      () => runAutomatedScript(SCENARIO_1_NEGLECT_LOSS_SCRIPT, "Neglect Failure Script")
    );
  };
  const onKeyDown = (e) => {
    if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement || e.target instanceof HTMLSelectElement) {
      return;
    }
    if (e.key === "d" || e.key === "D") {
      debugEnabled = !debugEnabled;
      render();
    } else if (e.key === "z" || e.key === "Z") {
      handleUndo();
    }
  };
  window.addEventListener("keydown", onKeyDown);
  render();
  return {
    destroy() {
      window.removeEventListener("keydown", onKeyDown);
      audio.destroy();
      container2.innerHTML = "";
    },
    getState() {
      return state;
    },
    restartWithSeed(seed) {
      state = createInitialGameState(getScenarioById("seeded", seed));
      persistCurrentState();
      render();
    },
    toggleDebug(force) {
      debugEnabled = force !== void 0 ? force : !debugEnabled;
      render();
    }
  };
}

function mountGame(container2, options) {
  const controller = createBlackoutDispatchUI(container2, options);
  return {
    destroy() {
      controller.destroy();
    },
    getStateSnapshot() {
      return controller.getState();
    },
    restartWithSeed(seed) {
      controller.restartWithSeed(seed);
    },
    toggleDebug(force) {
      controller.toggleDebug(force);
    }
  };
}

if (container) {
