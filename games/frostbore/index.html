function startDive(){
  var st=stats();
  G.screen='dive';G.paused=false;G.msg=null;G.hint=null;
  seed=(Math.random()*4294967295)>>>0;rows.length=0;caveCarry=null;
  P={x:4,y:-1,px:4,py:-1,face:0,mv:null,dig:null,fall:0,heat:st.heatMax,cargo:[],haul:0,relics:[],maxD:0,desc:false,time:0,thrust:false,flaring:-1,frozen:-1,warnT:0,digSfx:0,thrSfx:0,treads:0,drillSpin:0};
  particles.length=0;texts.length=0;shake=0;hitStop=0;
  cam.y=-3.5;
  if(SV.dives===0){G.hint={s:'HOLD DOWN TO DIG',t:5};}
  else if(SV.dives<3){G.hint={s:'Bank at the hut before HEAT runs out',t:4};}
}
function dirInput(){
  if(botDir!==undefined&&botDir!==null)return botDir;
  if(dpadDir)return dpadDir;
  return keyStack.length?keyStack[keyStack.length-1]:null;
}
function startMove(tx,ty,spd,fall){P.mv={fx:P.x,fy:P.y,tx:tx,ty:ty,t:0,spd:spd,fall:fall};}
function retHeat(st){st=st||stats();var depth=Math.max(0,P.y+1);return depth/st.climb*BASE_DRAIN*2*st.drain*(1+depth/(2*COLD_SCALE));}
function land(){
  if(P.fall>=5){var dmg=(P.fall-4)*6;P.heat-=dmg;shake=Math.max(shake,0.5);addText(P.x+0.5,P.y,'-'+dmg+' HEAT','#ff6b6b',true);SFX.thud();burst(P.x+0.5,P.y+1,'#9aa6b8',10,3,0.5);}
  else if(P.fall>=2){SFX.thud();shake=Math.max(shake,0.15);burst(P.x+0.5,P.y+1,'#9aa6b8',5,2,0.35);}
  P.fall=0;
}
function breakTile(x,y,t,st){
  setT(x,y,T.EMPTY);
  var col=tileColor(t,y);
  burst(x+0.5,y+0.5,col,10,3.5,0.55);
  SFX.crack(hardnessOf(t));
  shake=Math.max(shake,0.12);
  if(t>=30){
    var rel=REL_BY[t];if(rel){var isNew=!SV.relics[rel.id];var v=rel.val*(isNew?2:1);P.haul+=v;P.relics.push({id:rel.id,isNew:isNew,val:v});
      addText(x+0.5,y+0.2,(isNew?'NEW RELIC! ':'')+rel.name+' +'+v,rel.col,true);SFX.relic();shake=Math.max(shake,0.7);hitStop=Math.max(hitStop,0.16);burst(x+0.5,y+0.5,rel.col,30,6,1.1);G.flash=GK.flash.allow(0.5);
      if(isNew){SV.relics[rel.id]=true;writeSave();}}
  }else if(t>=10){
    var o=ORE_BY[t];if(o){P.cargo.push(o.id);P.haul+=o.val;addText(x+0.5,y+0.3,'+'+o.val,o.hi,o.val>=28);SFX.ore(o.val);
      if(o.val>=28){hitStop=Math.max(hitStop,o.val>=100?0.14:0.09);shake=Math.max(shake,0.45);burst(x+0.5,y+0.5,o.hi,18,5.5,0.8);}
      if(P.cargo.length>=st.cargoMax){flashMsg('CARGO FULL - head up and bank!',2.2);}}
  }else if(t===T.VENT){
    P.heat-=18;shake=Math.max(shake,0.8);addText(x+0.5,y+0.2,'CRYO VENT -18','#7ff3ff',true);SFX.vent();burst(x+0.5,y+0.5,'#9ff7ff',28,6,1);
  }else if(t===T.THERM){
    P.heat=Math.min(st.heatMax,P.heat+30);addText(x+0.5,y+0.2,'WARM POCKET +30','#ffb347',true);SFX.therm();burst(x+0.5,y+0.5,'#ffb347',20,4,0.9);
  }
}
function digAt(x,y,dt,st){
  var t=getT(x,y);
  if(!P.dig||P.dig.x!==x||P.dig.y!==y)P.dig={x:x,y:y,t:0};
  if(t>=10&&t<30&&P.cargo.length>=st.cargoMax){if(!G.msg||G.msg.s.indexOf('FULL')<0)flashMsg('CARGO FULL - bank at the hut!',1.5);P.dig.t=0;SFX.nope();P.dig.blocked=true;return;}
  P.dig.blocked=false;
  var need=hardnessOf(t);
  P.dig.t+=dt*st.drill;P.drillSpin+=dt*30;
  P.digSfx-=dt;if(P.digSfx<=0){P.digSfx=0.11;SFX.dig(need);if(Math.random()<0.7)burst(x+0.5,y+0.5,tileColor(t,y),2,1.6,0.3);}
  if(P.dig.t>=need){breakTile(x,y,t,st);P.dig=null;startMove(x,y,HSPD*1.1,false);}
}
function fallStep(){startMove(P.x,P.y+1,Math.min(14,6+P.fall*2.2),true);P.fall++;}
function updateDive(dt){
  var st=stats();
  P.time+=dt;
  if(P.frozen>=0){P.frozen+=dt;if(P.frozen>1.0)endDive('frozen');return;}
  if(P.flaring>=0){P.flaring+=dt;P.py-=dt*40;if(Math.random()<0.8)particles.push({x:P.px+0.5,y:P.py+1,vx:(Math.random()-0.5)*2,vy:3+Math.random()*3,life:0.5,max:0.5,col:'#ffb347',sz:0.18});if(P.flaring>0.75)endDive('flare');return;}
  var inp=dirInput();if(inp)fbMoved=true;
  P.thrust=false;var digging=false;
  if(P.mv){
    var m=P.mv;m.t+=dt*m.spd;
    if(m.t>=1){P.x=m.tx;P.y=m.ty;P.px=P.x;P.py=P.y;P.mv=null;P.treads+=1;
      if(P.y>=1)P.desc=true;P.maxD=Math.max(P.maxD,P.y+1);
      if(P.y===-1&&P.desc){endDive('banked');return;}
    }else{P.px=lerp(m.fx,m.tx,m.t);P.py=lerp(m.fy,m.ty,m.t);}
  }
  if(!P.mv){
    var below=getT(P.x,P.y+1);
    if(P.fall>0&&below!==T.EMPTY)land();
    var acted=false;
    if(inp==='up'){
      P.thrust=true;acted=true;
      if(P.y>-1&&getT(P.x,P.y-1)===T.EMPTY){startMove(P.x,P.y-1,st.climb,false);}
      if(P.fall>0){P.fall=0;}
    }else if(inp==='left'||inp==='right'){
      var nx=P.x+(inp==='right'?1:-1);P.face=inp==='right'?1:-1;
      if(nx>=0&&nx<COLS){var t=getT(nx,P.y);
        if(t===T.EMPTY){startMove(nx,P.y,HSPD,false);acted=true;if(P.fall>0)P.fall=0;}
        else if(isDiggable(t)&&P.y>=0){digAt(nx,P.y,dt,st);digging=true;acted=true;}
        else if(t===T.CORE&&P.y>=0){acted=true;if(!G.msg)flashMsg('Glacial core - too hard to drill',1.2);}
      }
    }else if(inp==='down'){
      if(below===T.EMPTY){fallStep();acted=true;}
      else if(isDiggable(below)){P.face=0;digAt(P.x,P.y+1,dt,st);digging=true;acted=true;}
      else if(below===T.CORE){acted=true;if(!G.msg)flashMsg('Glacial core - dig around it',1.2);}
    }
    if(!digging)P.dig=null;
    if(!acted&&below===T.EMPTY)fallStep();
  }else if(P.mv.fall===false&&inp==='up')P.thrust=true;
  // heat
  var rate=BASE_DRAIN*coldFactor(P.py+1)*(1+(P.thrust?1.0:0)+(digging?0.35:0))*st.drain;
  P.heat-=rate*dt;
  if(P.thrust){P.thrSfx-=dt;if(P.thrSfx<=0){P.thrSfx=0.15;SFX.thrust();}if(Math.random()<0.6)particles.push({x:P.px+0.5+(Math.random()-0.5)*0.3,y:P.py+0.95,vx:(Math.random()-0.5)*1.5,vy:2+Math.random()*2,life:0.35,max:0.35,col:'#cfe8ff',sz:0.12});}
  var frac=P.heat/st.heatMax;
  if(frac<0.25&&P.y>=0){P.warnT-=dt;if(P.warnT<=0){P.warnT=frac<0.12?0.6:1.1;SFX.warn();}}
  if(P.heat<=0){P.heat=0;P.frozen=0;SFX.freeze();shake=0.6;flashMsg('FROZEN SOLID',1.2);}
  // hints
  if(G.hint){if(P.y>=2&&G.hint.s.indexOf('HOLD')===0){G.hint={s:'Bank at the hut before HEAT runs out',t:4};}G.hint.t-=dt;if(G.hint.t<=0)G.hint=null;}
  if(SV.dives===0&&!P.hintFlare&&P.y>=12&&SV.flares>0){P.hintFlare=true;flashMsg('Tap FLARE for an instant lift home',2.6);}
  // camera
  var target=P.py-L.rows*0.42;
  if(target<-3.5)target=-3.5;
  cam.y=lerp(cam.y,target,Math.min(1,dt*7));
}
function endDive(how){
  var st=stats();
  var keep=how==='frozen'?0.5:1;
  var earned=Math.floor(P.haul*keep);
  var bonus=0,newRecord=false;
  if(P.maxD>SV.deepest){bonus=P.maxD-SV.deepest;SV.deepest=P.maxD;newRecord=true;}
  var oldCoins=SV.coins;
  SV.coins+=earned+bonus;SV.banked+=earned;SV.dives++;
  if(earned+bonus>SV.best)SV.best=earned+bonus;
  var tally={};P.cargo.forEach(function(id){tally[id]=(tally[id]||0)+1;});
  var items=[];for(var id in tally){var o=ORE_BY[id];items.push({name:o.name,n:tally[id],val:o.val*tally[id],col:o.hi});}
  items.sort(function(a,b){return b.val-a.val;});
  R={how:how,haul:P.haul,earned:earned,bonus:bonus,depth:P.maxD,items:items,relics:P.relics.slice(),time:P.time,newRecord:newRecord,oldCoins:oldCoins,next:nextUp(),anim:0};
  writeSave();
  G.screen='result';
  if(how==='frozen'){}else SFX.bank();
}
function useFlare(){
  if(G.screen!=='dive'||!P||P.flaring>=0||P.frozen>=0)return false;
  if(SV.flares<=0){flashMsg('No flares - buy one in the shop',1.5);SFX.nope();return false;}
  if(P.y<0){flashMsg('You are already home!',1.2);return false;}
  SV.flares--;writeSave();P.flaring=0;P.mv=null;P.dig=null;SFX.flare();shake=0.4;G.flash=GK.flash.allow(0.6);flashMsg('FLARE! Lifting home...',1);return true;
}
function buy(id){
  if(id==='flare'){var c=flareCost();if(SV.flares>=3){flashMsg('Max 3 flares',1.2);SFX.nope();return false;}if(SV.coins<c){SFX.nope();return false;}SV.coins-=c;SV.flares++;writeSave();SFX.buy();return true;}
  for(var i=0;i<UPG.length;i++){var d=UPG[i];if(d.id!==id)continue;var l=SV.up[id];if(l>=d.max){SFX.nope();return false;}var cost=upCost(d,l);if(SV.coins<cost){SFX.nope();return false;}SV.coins-=cost;SV.up[id]=l+1;writeSave();SFX.buy();G.flash=GK.flash.allow(0.3);return true;}
  return false;
}

// ---------------- input ----------------
var keyStack=[],dpadDir=null,dpadPid=null,dpadAnchor=null,botDir=null,buttons=[],buttonsScreen='',pointers={};
var KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
var fbMoved=false;
function keyDown(e){
  if(D.querySelector('.gk-prefs'))return;
  var k=e.key;var d=KEYMAP[k];
  if(d){e.preventDefault&&e.preventDefault();if(keyStack.indexOf(d)<0)keyStack.push(d);firstTouch();if(G.screen==='dive'&&G.paused)G.paused=false;return;}
  if(k===' '||k==='Enter'){e.preventDefault&&e.preventDefault();firstTouch();primary();}
  else if(k==='f'||k==='F'){if(G.screen==='dive')useFlare();}
  else if(k==='m'||k==='M'){setMute(!SV.mute);}
  else if(k==='p'||k==='P'||k==='Escape'){if(G.screen==='dive')G.paused=!G.paused;}
}
function keyUp(e){var d=KEYMAP[e.key];if(d){var i=keyStack.indexOf(d);if(i>=0)keyStack.splice(i,1);}}
function primary(){
  if(G.screen==='title')startDive();
  else if(G.screen==='result')startDive();
  else if(G.screen==='shop')startDive();
  else if(G.screen==='log')G.screen=SV.dives>0?'result':'title';
  else if(G.screen==='dive'&&G.paused)G.paused=false;
  if(G.screen==='result'&&!R)G.screen='title';
}
var started=false;
function firstTouch(){if(!started){started=true;}initAudio();resumeAudio();}
function ptPos(e){var r=canvas.getBoundingClientRect?canvas.getBoundingClientRect():{left:0,top:0};return {x:e.clientX-r.left,y:e.clientY-r.top};}
function dpadFromPoint(x,y){var c=dpadAnchor||L.dp,dx=x-c.cx,dy=y-c.cy,d=Math.sqrt(dx*dx+dy*dy);if(d<12)return dpadDir;if(Math.abs(dx)>Math.abs(dy))return dx>0?'right':'left';return dy>0?'down':'up';}
function inDpad(x,y){var dx=x-L.dp.cx,dy=y-L.dp.cy;return Math.sqrt(dx*dx+dy*dy)<=L.dp.r*2.0;}
function onDown(e){
  if(e.preventDefault)e.preventDefault();
  firstTouch();
  var p=ptPos(e),id=e.pointerId!==undefined?e.pointerId:'m';
  pointers[id]=p;
  if(G.screen==='dive'&&G.paused){G.paused=false;return;}
  if(buttonsScreen!==G.screen){buttons=[];}
  for(var i=buttons.length-1;i>=0;i--){var b=buttons[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){if(!b.disabled){b.fn();if(!b.quiet)SFX.click();}return;}}
  if(G.screen==='dive'){
    if(inDpad(p.x,p.y)){dpadAnchor=null;dpadPid=id;dpadDir=dpadFromPoint(p.x,p.y);return;}
    // touch anywhere else = floating D-pad anchored at the touch point; drag from it to steer (mouse keeps old behaviour)
    if(e.pointerType!=='mouse'){dpadAnchor={cx:p.x,cy:p.y};dpadPid=id;dpadDir=null;return;}
  }else if(G.screen==='title'){startDive();}
  else if(G.screen==='result'&&R&&R.anim>0.6&&p.y<L.h*0.5){/* ignore */}
}
function onMove(e){
  var id=e.pointerId!==undefined?e.pointerId:'m';
  if(dpadPid===id){var p=ptPos(e);pointers[id]=p;var nd=dpadFromPoint(p.x,p.y);if(nd)dpadDir=nd;}
}
function onUp(e){var id=e.pointerId!==undefined?e.pointerId:'m';delete pointers[id];if(dpadPid===id){dpadPid=null;dpadDir=null;dpadAnchor=null;}}

// ---------------- drawing: tiles ----------------
function depthTint(y){return clamp(y/320,0,1);}
function tileColor(t,y){
  var k=depthTint(y);
  if(t===T.DIRT)return mix('#7a5a40','#3b3550',k);
  if(t===T.CLAY)return mix('#6f7f93','#45506b',k);
  if(t===T.ROCK)return mix('#4b5a70','#2c3148',k);
  if(t===T.CORE)return '#0d1424';
  if(t===T.VENT)return '#5fd8ee';
  if(t===T.THERM)return '#ff9a3c';
  if(t>=30)return REL_BY[t]?REL_BY[t].col:'#fff';
  if(t>=10)return ORE_BY[t]?ORE_BY[t].col:'#fff';
  return '#000';
}
function drawTile(t,x,y,sx,sy,cs){
  var k=depthTint(y);
  if(t===T.CORE){
    ctx.fillStyle='#0b1120';ctx.fillRect(sx,sy,cs,cs);
    ctx.strokeStyle='rgba(120,170,255,0.55)';ctx.lineWidth=Math.max(1.5,cs*0.06);
    ctx.beginPath();ctx.moveTo(sx+cs*0.5,sy+cs*0.12);ctx.lineTo(sx+cs*0.88,sy+cs*0.5);ctx.lineTo(sx+cs*0.5,sy+cs*0.88);ctx.lineTo(sx+cs*0.12,sy+cs*0.5);ctx.closePath();ctx.stroke();
    ctx.fillStyle='rgba(120,170,255,0.18)';ctx.fill();
    return;
  }
  var base=(t===T.DIRT||t===T.CLAY||t===T.ROCK)?t:(t===T.VENT||t===T.THERM?T.CLAY:(hash2(x,y,9)<0.5?T.DIRT:T.CLAY));
  ctx.fillStyle=tileColor(base,y);ctx.fillRect(sx,sy,cs,cs);
  // bevel
  ctx.fillStyle='rgba(255,255,255,'+(0.10-k*0.05)+')';ctx.fillRect(sx,sy,cs,Math.max(1,cs*0.08));
  ctx.fillStyle='rgba(0,0,0,0.22)';ctx.fillRect(sx,sy+cs-Math.max(1,cs*0.09),cs,Math.max(1,cs*0.09));
  // speckles
  var n=base===T.ROCK?2:3;
  for(var i=0;i<n;i++){var hx=hash2(x,y,i*3+1),hy=hash2(x,y,i*3+2),hs=hash2(x,y,i*3+3);
    ctx.fillStyle=base===T.ROCK?'rgba(190,210,240,0.22)':(base===T.CLAY?'rgba(220,235,255,0.18)':'rgba(40,25,15,0.35)');
    var s=cs*(0.08+hs*0.12);ctx.fillRect(sx+hx*(cs-s),sy+hy*(cs-s),s,s);}
  if(base===T.ROCK){ctx.strokeStyle='rgba(10,15,30,0.5)';ctx.lineWidth=1;ctx.beginPath();var a=hash2(x,y,21);ctx.moveTo(sx+cs*0.2,sy+cs*(0.3+a*0.4));ctx.lineTo(sx+cs*0.55,sy+cs*(0.5-a*0.2));ctx.lineTo(sx+cs*0.85,sy+cs*(0.7-a*0.3));ctx.stroke();}
  if(t===T.VENT){
    var pul=0.6+0.4*Math.sin(G.t*6+x);
    ctx.strokeStyle='rgba(120,240,255,'+(0.6+0.4*pul)+')';ctx.lineWidth=Math.max(1.5,cs*0.07);ctx.beginPath();ctx.moveTo(sx+cs*0.5,sy+cs*0.05);ctx.lineTo(sx+cs*0.38,sy+cs*0.4);ctx.lineTo(sx+cs*0.62,sy+cs*0.55);ctx.lineTo(sx+cs*0.45,sy+cs*0.95);ctx.stroke();
    ctx.fillStyle='rgba(120,240,255,'+(0.12*pul)+')';ctx.fillRect(sx,sy,cs,cs);
  }else if(t===T.THERM){
    var pu=0.6+0.4*Math.sin(G.t*4+y);
    var g=ctx.createRadialGradient(sx+cs/2,sy+cs/2,cs*0.05,sx+cs/2,sy+cs/2,cs*0.55);g.addColorStop(0,'rgba(255,200,90,'+(0.95*pu)+')');g.addColorStop(1,'rgba(255,120,40,0)');ctx.fillStyle=g;ctx.fillRect(sx,sy,cs,cs);
  }else if(t>=30){
    drawRelicIcon(sx+cs/2,sy+cs/2,cs*0.36,REL_BY[t],1,true);
  }else if(t>=10){
    var o=ORE_BY[t];
    for(var j=0;j<3;j++){var ox=hash2(x,y,40+j),oy=hash2(x,y,50+j),os=cs*(0.16+hash2(x,y,60+j)*0.14);
      var cx=sx+cs*0.18+ox*cs*0.64,cy=sy+cs*0.18+oy*cs*0.64;
      ctx.fillStyle=o.col;ctx.beginPath();ctx.moveTo(cx,cy-os/2);ctx.lineTo(cx+os/2,cy);ctx.lineTo(cx,cy+os/2);ctx.lineTo(cx-os/2,cy);ctx.closePath();ctx.fill();
      ctx.fillStyle=o.hi;ctx.fillRect(cx-os*0.18,cy-os*0.32,os*0.22,os*0.22);}
    if(o.val>=28){var sh=0.5+0.5*Math.sin(G.t*5+x*1.7+y);ctx.fillStyle=rgba(o.hi,0.12*sh);ctx.fillRect(sx,sy,cs,cs);}
  }
}
function drawRelicIcon(cx,cy,r,rel,alpha,glow){
  ctx.save();ctx.globalAlpha=alpha;
  if(glow){var g=ctx.createRadialGradient(cx,cy,r*0.2,cx,cy,r*1.6);g.addColorStop(0,rgba(rel.col,0.55));g.addColorStop(1,rgba(rel.col,0));ctx.fillStyle=g;ctx.fillRect(cx-r*1.6,cy-r*1.6,r*3.2,r*3.2);}
  var n=4+(rel.id%4),rot=G.t*0.8+rel.id;
  ctx.fillStyle=rel.col;ctx.beginPath();
  for(var i=0;i<n*2;i++){var a=rot+i*Math.PI/n,rr2=i%2?r*0.45:r;ctx.lineTo(cx+Math.cos(a)*rr2,cy+Math.sin(a)*rr2);}
  ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.85)';ctx.beginPath();ctx.arc(cx-r*0.2,cy-r*0.2,r*0.22,0,6.283);ctx.fill();
  ctx.restore();
}

// ---------------- drawing: world ----------------

  btn(fx,fy,fb,fb,'FLARE',useFlare,{col:can?'#b03a3a':'#3a4050',size:15,sub:'x'+SV.flares,quiet:true,cap:1});
  ctx.fillStyle='#ffb347';ctx.beginPath();ctx.arc(fx+fb/2,fy+fb*0.22,fb*0.07,0,6.283);ctx.fill();
  // pause
  btn(w-L.inR-16-44,top+88,44,40,'II',function(){G.paused=true;},{size:16,col:'rgba(30,45,75,0.7)',cap:1});

  if(P.frozen>=0){ctx.fillStyle='rgba(150,210,255,'+Math.min(0.55,P.frozen*0.6)+')';ctx.fillRect(0,0,w,L.h);}

function drawDpad(dp,r){
  ctx.save();ctx.globalAlpha=0.85;
  var dirs=[['up',0,-1],['down',0,1],['left',-1,0],['right',1,0]];
  for(var i=0;i<dirs.length;i++){var d=dirs[i],cx=dp.cx+d[1]*r*1.08,cy=dp.cy+d[2]*r*1.08,act=dirInput()===d[0];
    ctx.fillStyle=act?'rgba(255,140,60,0.9)':'rgba(30,45,75,0.75)';ctx.beginPath();ctx.arc(cx,cy,r*0.52,0,6.283);ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();var ar=r*0.22;ctx.moveTo(cx+d[1]*ar,cy+d[2]*ar);ctx.lineTo(cx-d[1]*ar*0.5+d[2]*ar*0.8,cy-d[2]*ar*0.5+d[1]*ar*0.8);ctx.lineTo(cx-d[1]*ar*0.5-d[2]*ar*0.8,cy-d[2]*ar*0.5-d[1]*ar*0.8);ctx.closePath();ctx.fill();}
  ctx.fillStyle='rgba(30,45,75,0.5)';ctx.beginPath();ctx.arc(dp.cx,dp.cy,r*0.34,0,6.283);ctx.fill();
  ctx.restore();
}
function ctxWidthGuess(s,size){return s.length*size*0.6;}
function drawPaused(){ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,L.w,L.h);ctx.fillStyle='#fff';ctx.font=F(34,'900');ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('PAUSED',L.w/2,L.h/2-20);ctx.font=F(16,'700');ctx.fillStyle='#9fc3ff';ctx.fillText('Tap to resume',L.w/2,L.h/2+22);}

function drawResult(){
  panelBg();
  var frozen=R.how==='frozen',w=L.w,cx=w/2;
  var a=R.anim;
  var title=frozen?'FROZEN SOLID':(R.how==='flare'?'FLARE LIFT!':'BANKED!');
  var tsub=frozen?'Rescued by the hut crew. Half the haul thawed away.':(R.how==='flare'?'Beamed home with the full haul.':'Safe at the hut with the full haul.');
  ctx.save();ctx.translate(cx,L.inT+52);var sc=1-(1-Math.min(1,a*3))*GK.prefs.motionScale();ctx.scale(sc,sc);ctx.fillStyle=frozen?'#8fd0ff':'#ffd04a';ctx.font=F(L.narrow?40:48,'900');ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor=frozen?'rgba(140,210,255,0.8)':'rgba(255,200,60,0.8)';ctx.shadowBlur=20;ctx.fillText(title,0,0);ctx.restore();
  ctx.fillStyle='#9fc3ff';ctx.font=F(13,'600',1.25);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(tsub,cx,L.inT+90,w-24);
  // depth + record
  var y=L.inT+120;
  ctx.fillStyle='#fff';ctx.font=F(16,'800',1.25);ctx.textAlign='left';ctx.fillText('Depth reached',24,y);ctx.textAlign='right';ctx.fillText(R.depth+'m'+(R.newRecord?'  NEW RECORD!':''),w-24,y);
  if(R.newRecord){ctx.fillStyle='#ffd04a';ctx.textAlign='right';ctx.fillText(R.depth+'m  NEW RECORD!',w-24,y);}
  y+=14;ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.beginPath();ctx.moveTo(24,y+8);ctx.lineTo(w-24,y+8);ctx.stroke();y+=26;
  // items (animated count-in)
  var shown=Math.floor(a*12);
  var lines=[];R.items.forEach(function(it){lines.push({l:it.n+'x '+it.name,r:'+'+fmt(it.val),col:it.col});});
  R.relics.forEach(function(rl){var rel=REL_BY[rl.id];lines.push({l:(rl.isNew?'NEW  ':'')+rel.name,r:'+'+fmt(rl.val),col:rel.col,star:true});});
  if(!lines.length)lines.push({l:'Nothing in the sled',r:'+0',col:'#8a92a6'});
  var maxLines=Math.max(3,Math.floor((L.h*0.5-y)/24));
  var extra=0;if(lines.length>maxLines){extra=lines.length-(maxLines-1);lines=lines.slice(0,maxLines-1);}
  ctx.font=F(15,'700',1.25);
  for(var i=0;i<lines.length&&i<shown;i++){var ln=lines[i];ctx.fillStyle=ln.col;ctx.textAlign='left';ctx.fillText(ln.l,24,y);ctx.textAlign='right';ctx.fillText(ln.r,w-24,y);y+=24;}
  if(extra>0&&shown>lines.length){ctx.fillStyle='#8a92a6';ctx.textAlign='left';ctx.fillText('+'+extra+' more...',24,y);y+=24;}
  y+=4;ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.beginPath();ctx.moveTo(24,y);ctx.lineTo(w-24,y);ctx.stroke();y+=22;
  if(frozen){ctx.fillStyle='#ff8080';ctx.font=F(14,'700',1.25);ctx.textAlign='left';ctx.fillText('Haul '+fmt(R.haul)+'  x 50% thaw loss',24,y);y+=24;}
  if(R.bonus>0){ctx.fillStyle='#ffd04a';ctx.font=F(14,'700',1.25);ctx.textAlign='left';ctx.fillText('Depth record bonus',24,y);ctx.textAlign='right';ctx.fillText('+'+R.bonus,w-24,y);y+=24;}
  ctx.fillStyle='#fff';ctx.font=F(22,'900',1);ctx.textAlign='left';ctx.fillText('EARNED',24,y+6);ctx.textAlign='right';var cnt=Math.floor((R.earned+R.bonus)*clamp((a-0.3)/0.6,0,1));coinIcon(w-24-ctxWidthGuess(fmt(cnt),22)-14,y+6,10);ctx.fillStyle='#ffe9a0';ctx.fillText(fmt(cnt),w-24,y+7);y+=36;
  // wallet
  ctx.fillStyle='#9fc3ff';ctx.font=F(13,'700',1.25);ctx.textAlign='left';ctx.fillText('Wallet',24,y);ctx.textAlign='right';ctx.fillStyle='#ffe9a0';ctx.fillText(fmt(R.oldCoins+cnt)+' coins',w-24,y);y+=26;
  // next upgrade bar
  var nx=R.next;
  var barY=Math.max(y+4,L.h-L.inB-250);
  if(nx){var have=SV.coins,pr=clamp(have/nx.cost,0,1),ready=have>=nx.cost;
    ctx.fillStyle='rgba(0,0,0,0.35)';rr(16,barY,w-32,74,14);ctx.fill();
    ctx.fillStyle='#9fc3ff';ctx.font=F(11,'800',1.25);ctx.textAlign='left';ctx.fillText('NEXT UPGRADE',30,barY+16);
    ctx.fillStyle='#fff';ctx.font=F(16,'900',1.25);ctx.fillText(nx.def.name+' Mk'+(nx.lvl+2),30,barY+36);var nmw=ctx.measureText(nx.def.name+' Mk'+(nx.lvl+2)).width;ctx.fillStyle='#cfe3ff';ctx.font=F(12,'600',1.25);ctx.textAlign='right';ctx.fillText(nx.def.desc,w-30,barY+36,Math.max(60,w-60-nmw-12));
    ctx.fillStyle='rgba(255,255,255,0.12)';rr(30,barY+50,w-60,14,7);ctx.fill();
    var g=ctx.createLinearGradient(30,0,w-30,0);g.addColorStop(0,ready?'#ffd04a':'#ff7a2f');g.addColorStop(1,ready?'#fff2a8':'#ffb347');ctx.fillStyle=g;rr(30,barY+50,(w-60)*pr*clamp(a*1.5,0,1),14,7);ctx.fill();
    ctx.fillStyle=ready?'#ffe9a0':'#fff';ctx.font=F(11,'900',1);ctx.textAlign='center';ctx.fillText(ready?'READY TO BUY!':(fmt(have)+' / '+fmt(nx.cost)),w/2,barY+57);
  }else{ctx.fillStyle='#ffd04a';ctx.font=F(14,'800');ctx.textAlign='center';ctx.fillText('Rig fully upgraded. Legend.',w/2,barY+30);}
  // buttons
  var by=L.h-L.inB-160;
  btn(16,by,w-32,74,'DIVE AGAIN',startDive,{primary:true,size:28});
  var bw2=(w-44)/2;var ready2=nx&&SV.coins>=nx.cost;
  btn(16,by+86,bw2,56,ready2?'UPGRADE!':'RIG SHOP',function(){G.screen='shop';},{primary:ready2,glow:ready2,size:18,col:'#2b3a55'});
  btn(28+bw2,by+86,bw2,56,'RELIC LOG',function(){G.screen='log';},{size:18});
}
function drawShop(){
  panelBg();
  var w=L.w;
  header('RIG SHOP');
  coinsBadge(L.inT+66);
  btn(L.w-L.inR-60,L.inT+12,48,40,SV.mute?'OFF':'ON',function(){setMute(!SV.mute);},{size:13,cap:1});ctx.fillStyle='#9fc3ff';ctx.font=F(10,'700',1);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('SOUND',L.w-L.inR-36,L.inT+60);

    ctx.fillStyle='rgba(255,255,255,0.06)';rr(12,y,w-24,rowH-6,12);ctx.fill();

    ctx.fillStyle='#9fc3ff';ctx.font=F(12,'600',1.25);ctx.fillText(d.desc,24,y+rowH*0.62,w-152);
    for(var p=0;p<d.max;p++){ctx.fillStyle=p<l?'#ffb347':'rgba(255,255,255,0.15)';ctx.fillRect(24+p*12,y+rowH*0.8,9,5);}
    var bx=w-12-96,bh=Math.min(44,rowH-16);

    else btn(bx,y+(rowH-6-bh)/2,86,bh,fmt(cost),(function(id){return function(){buy(id);};})(d.id),{primary:can,glow:false,size:15,disabled:!can,sub:undefined});
    y+=rowH;}
  // flare row
  var fc=flareCost(),canF=SV.coins>=fc&&SV.flares<3;
  ctx.fillStyle='rgba(176,58,58,0.25)';rr(12,y,w-24,rowH-6,12);ctx.fill();
  ctx.fillStyle='#fff';ctx.font=F(16,'900',1.25);ctx.textAlign='left';ctx.fillText('Rescue Flare  x'+SV.flares,24,y+rowH*0.3);
  ctx.fillStyle='#ffb3b3';ctx.font=F(12,'600',1.25);ctx.fillText('Instant lift home with full haul (hold 3)',24,y+rowH*0.62,w-152);
  var bh2=Math.min(44,rowH-16);
  if(SV.flares>=3)btn(w-12-96,y+(rowH-6-bh2)/2,86,bh2,'FULL',function(){},{disabled:true,size:14});
  else btn(w-12-96,y+(rowH-6-bh2)/2,86,bh2,fmt(fc),function(){buy('flare');},{primary:canF,disabled:!canF,size:15,col:'#b03a3a'});
  y+=rowH;
  // stats line
  var st=stats();ctx.fillStyle='#cfe3ff';ctx.font=F(12,'600',1);ctx.textAlign='center';ctx.fillText('Heat '+st.heatMax+'  |  Dig x'+st.drill.toFixed(2)+'  |  Cargo '+st.cargoMax+'  |  Drain x'+st.drain.toFixed(2)+'  |  Climb '+st.climb.toFixed(1)+'/s',w/2,y+10,w-16);
  var by=L.h-L.inB-150;
  btn(16,by,w-32,74,'DIVE',startDive,{primary:true,size:30});
  var bw2=(w-44)/2;
  btn(16,by+86,bw2,50,'BACK',function(){G.screen=SV.dives>0?'result':'title';if(G.screen==='result'&&!R)G.screen='title';},{size:16});
  btn(28+bw2,by+86,bw2,50,'RELIC LOG',function(){G.screen='log';},{size:16});
}
function drawLog(){
  panelBg();var w=L.w;
  var found=Object.keys(SV.relics).length;
  header('RELIC LOG',found+' / '+RELICS.length+' discovered');
  var y=L.inT+90,cols=2,cw=(w-36)/cols,rh=Math.min(64,(L.h-L.inB-y-90)/Math.ceil(RELICS.length/cols));
  for(var i=0;i<RELICS.length;i++){var rel=RELICS[i],got=!!SV.relics[rel.id],cx=12+(i%cols)*(cw+12),cy=y+Math.floor(i/cols)*rh;
    ctx.fillStyle=got?rgba(rel.col,0.14):'rgba(255,255,255,0.05)';rr(cx,cy,cw,rh-6,10);ctx.fill();
    if(got)drawRelicIcon(cx+24,cy+(rh-6)/2,14,rel,1,true);else{ctx.fillStyle='rgba(255,255,255,0.25)';ctx.font=F(20,'900');ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('?',cx+24,cy+(rh-6)/2+1);}
    ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle=got?'#fff':'#8a92a6';ctx.font=F(cw<170?12:13,'800',1.25);ctx.fillText(got?rel.name:'Unknown relic',cx+46,cy+(rh-6)*0.36,cw-52);
    ctx.fillStyle=got?rel.col:'#6b7385';ctx.font=F(11,'600',1.25);ctx.fillText(got?('Worth '+fmt(rel.val)):('Below '+rel.minD+'m'),cx+46,cy+(rh-6)*0.7,cw-52);}
  btn(16,L.h-L.inB-76,w-32,56,'BACK',function(){G.screen=SV.dives>0?'result':'title';if(G.screen==='result'&&!R)G.screen='title';},{size:20});
}

// ---------------- main loop ----------------
var last=0;
function update(dt){
  G.t+=dt;
  if(G.flash>0)G.flash-=dt;
  if(G.msg){G.msg.t-=dt;if(G.msg.t<=0)G.msg=null;}
  for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue;}p.vy+=9*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  for(i=texts.length-1;i>=0;i--){texts[i].life-=dt;if(texts[i].life<=0)texts.splice(i,1);}
  if(shake>0)shake=Math.max(0,shake-dt*1.8);
  if(G.screen==='dive'&&!G.paused){
    if(hitStop>0){hitStop-=dt;}else updateDive(dt*GK.prefs.speed());
  }
  if(G.screen==='result'&&R){R.anim=Math.min(1.5,R.anim+dt);}
}
function render(){
  buttons=[];buttonsScreen=G.screen;
  ctx.save();
  if(shake>0&&G.screen==='dive'){var s=shake*shake*12*GK.prefs.motionScale();ctx.translate((Math.random()-0.5)*s,(Math.random()-0.5)*s);}
  if(G.screen==='dive'){drawWorld();drawHUD();if(G.paused)drawPaused();}
  else if(G.screen==='title')drawTitle();
  else if(G.screen==='result'){if(R)drawResult();else drawTitle();}
  else if(G.screen==='shop')drawShop();
  else if(G.screen==='log')drawLog();
  ctx.restore();
  if(G.flash>0){ctx.fillStyle='rgba(255,255,255,'+clamp(G.flash*0.5,0,0.5)+')';ctx.fillRect(0,0,L.w,L.h);}
}
function frame(ts){
  var dt=last?(ts-last)/1000:0.016;last=ts;if(dt>0.05)dt=0.05;if(dt<0)dt=0;
  update(dt);render();gkGearSync();
  W.requestAnimationFrame(frame);
}
function tick(dt){update(dt);render();}

// ---------------- wiring ----------------
layout();
W.addEventListener('resize',layout);
W.addEventListener('orientationchange',function(){setTimeout(layout,60);setTimeout(layout,400);});
if(W.visualViewport&&W.visualViewport.addEventListener)W.visualViewport.addEventListener('resize',layout);
canvas.addEventListener('pointerdown',onDown);

D.addEventListener('touchstart',function(e){if(gkUI(e))return;if(e.preventDefault)e.preventDefault();},{passive:false});
D.addEventListener('touchmove',function(e){if(gkUI(e))return;if(e.preventDefault)e.preventDefault();},{passive:false});
D.addEventListener('gesturestart',function(e){if(e.preventDefault)e.preventDefault();});
D.addEventListener('contextmenu',function(e){if(e.preventDefault)e.preventDefault();});
W.addEventListener('keydown',keyDown);
W.addEventListener('keyup',keyUp);
W.addEventListener('blur',function(){keyStack.length=0;dpadDir=null;dpadPid=null;if(G.screen==='dive')G.paused=true;});
D.addEventListener('visibilitychange',function(){if(D.hidden){if(G.screen==='dive')G.paused=true;keyStack.length=0;dpadDir=null;dpadPid=null;if(AC){try{AC.suspend();}catch(e){}}}else{last=0;resumeAudio();}});
GK.studio();
var gkWas=false,gkGearV=null;
var gkGear=GK.ui.gear({corner:'tl',panel:{text:true,speed:true,tips:false},onOpen:function(){gkWas=G.paused;if(G.screen==='dive')G.paused=true;},onClose:function(){if(G.screen==='dive')G.paused=gkWas||G.paused;}});
function gkGearSync(){var v=G.screen!=='dive'||G.paused;if(v!==gkGearV){gkGearV=v;gkGear.show(v);}}
GK.coach.create('frostbore-first',[{target:function(){return {x:L.dp.cx,y:L.dp.cy,r:L.dp.r*1.7};},done:function(){return fbMoved;}}],{when:function(){return G.screen==='dive'&&!G.paused&&!!P&&P.frozen<0&&P.flaring<0;}});
GK.wired('motion','screen shake, particle bursts, result title pop-in, title drill wobble, low-heat pulse');
GK.wired('flash','relic find, flare, upgrade buy (peaks .5/.6/.3, unchanged)');
GK.wired('speed','updateDive dt: heat drain, digging, moves, camera');
GK.wired('text','every canvas font floored at 12 px and scaled; HUD plate, bars, small buttons capped; long lines fit to width');
if(!HEADLESS){W.requestAnimationFrame(frame);}

W.__FB={
  G:G,get P(){return P;},get R(){return R;},get SV(){return SV;},stats:stats,startDive:startDive,endDive:endDive,useFlare:useFlare,buy:buy,tick:tick,update:update,render:render,
  getT:getT,ensureRow:ensureRow,setBot:function(d){botDir=d;},retHeat:function(){return P?retHeat():0;},layout:layout,upCost:upCost,UPG:UPG,ORES:ORES,RELICS:RELICS,T:T,COLS:COLS,nextUp:nextUp,flareCost:flareCost,
  reset:function(){SV=defaultSave();writeSave();G.screen='title';R=null;},setSeed:function(s){seed=s>>>0;rows.length=0;caveCarry=null;},rows:function(){return rows;},primary:primary,pointer:{down:onDown,move:onMove,up:onUp},key:{down:keyDown,up:keyUp},L:L
};
})();
