function loadParadoxSave() {

    career: createDefaultCareerStats(),
    activeRun: null

    return fallback;
  }

    const raw = window.localStorage.getItem(PARADOX_CONFIG.STORAGE_KEY);
    if (!raw) return fallback;
    const parsed = JSON.parse(raw);
    if (!parsed || parsed.schemaVersion !== PARADOX_CONFIG.SCHEMA_VERSION || !parsed.career) {
      return fallback;
    }
    return {
      schemaVersion: PARADOX_CONFIG.SCHEMA_VERSION,
      career: {
        gamesPlayed: Number(parsed.career.gamesPlayed) || 0,
        highScore: Number(parsed.career.highScore) || 0,
        totalPodsSaved: Number(parsed.career.totalPodsSaved) || 0,
        totalPredictionsBroken: Number(parsed.career.totalPredictionsBroken) || 0,
        discoveredEndings: Array.isArray(parsed.career.discoveredEndings) ? parsed.career.discoveredEndings : [],
        processedRunKeys: Array.isArray(parsed.career.processedRunKeys) ? parsed.career.processedRunKeys : []
      },
      activeRun: parsed.activeRun ? cloneParadoxState(parsed.activeRun) : null
    };
  } catch {
    return fallback;
  }
}
function saveParadoxState(career, activeRun) {
  const updatedCareer = {
    ...career,
    discoveredEndings: [...career.discoveredEndings],
    processedRunKeys: [...career.processedRunKeys]
  };
  if (activeRun) {
    updatedCareer.highScore = Math.max(updatedCareer.highScore, activeRun.score);
    if (activeRun.status === "VICTORY" && activeRun.endingVerdictId) {
      const runKey = `${activeRun.seed}-${activeRun.totalElapsedMs}-${activeRun.endingVerdictId}`;
      if (!updatedCareer.processedRunKeys.includes(runKey)) {
        updatedCareer.processedRunKeys.push(runKey);
        updatedCareer.gamesPlayed += 1;
        updatedCareer.totalPodsSaved += activeRun.podsSavedTotal;
        updatedCareer.totalPredictionsBroken += activeRun.oracle.predictionsBroken;

        }

  drawCanvas(state, dtMs) {
    const ctx = this.ctx;
    if (!ctx) return;
    const W = PARADOX_CONFIG.ARENA_WIDTH;
    const H = PARADOX_CONFIG.ARENA_HEIGHT;
    const dtSec = dtMs / 1e3;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = state.player.chronoBrakeActive ? "#09071a" : "#050811";
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = state.act === "ACT_B_MIRROR" ? "rgba(244, 63, 94, 0.12)" : "rgba(56, 189, 248, 0.09)";
    ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    for (let y = 0; y <= H; y += 40) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    if (state.chamber === 1) {
      ctx.save();
      ctx.lineWidth = 5;
      ctx.strokeStyle = state.trolleyActiveTrack === "ALPHA" ? "#f43f5e" : "rgba(148, 163, 184, 0.25)";
      ctx.beginPath();
      ctx.moveTo(40, H * 0.5);
      ctx.lineTo(W - 105, 130);
      ctx.stroke();
      ctx.strokeStyle = state.trolleyActiveTrack === "BETA" ? "#eab308" : "rgba(148, 163, 184, 0.25)";
      ctx.beginPath();
      ctx.moveTo(40, H * 0.5);
      ctx.lineTo(W - 105, H - 105);
      ctx.stroke();
      ctx.fillStyle = "#94a3b8";
      ctx.font = "bold 11px Inter, sans-serif";
      ctx.fillText(
        `ACTIVE TRACK: ${state.trolleyActiveTrack} (Press [1/Q] to Flip Switch)`,
        52,
        H * 0.5 - 16
      );
      ctx.restore();
    } else if (state.chamber === 2 && state.oracle.newcombOutcomeLabel) {
      ctx.fillStyle = "#38bdf8";
      ctx.font = "bold 12px Inter, sans-serif";
      ctx.fillText(state.oracle.newcombOutcomeLabel, 24, H - 18);
    } else if (state.chamber === 5) {
      const bx = W * 0.5;
      const by = 95;
      ctx.save();
      ctx.beginPath();
      ctx.arc(bx, by, 38, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(236, 72, 153, 0.22)";
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#ec4899";
      ctx.stroke();
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 12px Inter, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(`LAPLACE-9 ARCHITECT (${state.oracle.bossHp}/${state.oracle.bossMaxHp} HP)`, bx, by - 48);
      ctx.restore();
    }
    for (const pod of state.pods) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(pod.x, pod.y, 24, 0, Math.PI * 2);
      ctx.fillStyle = !pod.alive ? "rgba(71, 85, 105, 0.25)" : pod.shieldedMs > 0 ? "rgba(16, 185, 129, 0.3)" : "rgba(15, 23, 42, 0.9)";
      ctx.fill();
      ctx.lineWidth = pod.shieldedMs > 0 ? 3.5 : 2;
      ctx.strokeStyle = !pod.alive ? "#475569" : pod.shieldedMs > 0 ? "#10b981" : pod.track === "ALPHA" ? "#38bdf8" : "#eab308";
      ctx.stroke();
      ctx.fillStyle = pod.alive ? "#f8fafc" : "#64748b";
      ctx.font = "bold 10px Inter, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(pod.label, pod.x, pod.y - 30);
      ctx.fillText(pod.alive ? `${pod.hp}%` : "LOST", pod.x, pod.y + 4);
      ctx.restore();
    }
    for (const s of state.shards) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(s.x, s.y, 8, 0, Math.PI * 2);
      ctx.fillStyle = s.color;
      ctx.fill();
      ctx.restore();
    }
    for (const clone of state.clones) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(clone.x, clone.y, 15, 0, Math.PI * 2);
      ctx.fillStyle = clone.disposition === "ALLY" ? "rgba(16, 185, 129, 0.28)" : "rgba(244, 63, 94, 0.28)";
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = clone.color;
      ctx.stroke();
      ctx.fillStyle = clone.color;
      ctx.font = "bold 10px Inter, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(`${clone.label} [${clone.lastMove}]`, clone.x, clone.y - 20);
      ctx.restore();
    }
    for (const h of state.hazards) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(h.x, h.y, h.radius, 0, Math.PI * 2);
      ctx.fillStyle = h.color;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();
      ctx.restore();
    }
    ctx.save();
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = state.oracle.predictionLockPct >= 70 ? "rgba(244, 63, 94, 0.75)" : "rgba(56, 189, 248, 0.45)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(state.player.x, state.player.y);
    ctx.lineTo(state.oracle.predictedX, state.oracle.predictedY);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.arc(state.oracle.predictedX, state.oracle.predictedY, 16, 0, Math.PI * 2);
    ctx.strokeStyle = state.oracle.predictionLockPct >= 70 ? "#f43f5e" : "#38bdf8";
    ctx.stroke();
    ctx.fillStyle = state.oracle.predictionLockPct >= 70 ? "#f43f5e" : "#38bdf8";
    ctx.font = "10px Inter, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(
      `ORACLE LOCK ${Math.round(state.oracle.predictionLockPct)}%`,
      state.oracle.predictedX,
      state.oracle.predictedY - 22
    );
    ctx.restore();
    if (state.player.shieldPulseMs > 0) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(state.player.x, state.player.y, 68, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(16, 185, 129, 0.65)";
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();
    }
    if (state.player.siphonBeamMs > 0) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(state.player.x, state.player.y, 85, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(244, 63, 94, 0.7)";
      ctx.lineWidth = 3.5;
      ctx.stroke();
      ctx.restore();
    }
    ctx.save();
    ctx.beginPath();
    ctx.arc(state.player.x, state.player.y, PARADOX_CONFIG.PLAYER_RADIUS, 0, Math.PI * 2);
    ctx.fillStyle = state.soul.humanity <= 25 ? "#eab308" : "#38bdf8";
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#ffffff";
    ctx.stroke();
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 10px Inter, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(
      state.soul.humanity <= 25 ? "THESEUS-09" : "SUBJECT-09 (YOU)",
      state.player.x,
      state.player.y + 28
    );
    ctx.restore();
    ctx.save();
    ctx.fillStyle = "rgba(15, 23, 42, 0.82)";
    ctx.fillRect(10, 8, W - 20, 24);
    ctx.fillStyle = "#e2e8f0";
    ctx.font = "11px Inter, sans-serif";
    ctx.fillText(state.oracle.activeTaunt, 18, 24);
    ctx.restore();
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx * dtSec;
      p.y += p.vy * dtSec;
      p.alpha -= dtSec * 1.9;
      if (p.alpha <= 0) {
        this.particles.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
      ctx.restore();
    }
    for (let i = this.popups.length - 1; i >= 0; i--) {
      const pop = this.popups[i];
      pop.y += pop.vy * dtSec;
      pop.alpha -= dtSec * 0.85;
      if (pop.alpha <= 0) {
        this.popups.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = Math.max(0, pop.alpha);
      ctx.fillStyle = pop.color;
      ctx.font = "bold 12px Inter, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(pop.text, pop.x, pop.y);
      ctx.restore();
    }
  }
  destroy() {
    window.removeEventListener("keydown", this.keydownHandler);
    window.removeEventListener("keyup", this.keyupHandler);
    this.container.innerHTML = "";
  }
};
