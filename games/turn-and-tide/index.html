function stat(label,value,detail){return `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div><div class="detail">${detail}</div></div>`;}
function linkText(text){let hits=[];for(let p of S.players){let at=text.indexOf(p.name);if(at>=0)hits.push({at,end:at+p.name.length,html:pLink(p.id)});}CLUBS.forEach((c,t)=>{for(let name of [c[0],c[1]]){let at=text.indexOf(name);if(at>=0&&(name.length>4||!/[A-Za-z]/.test(text[at-1]||'')&&!/[A-Za-z]/.test(text[at+name.length]||'')))hits.push({at,end:at+name.length,html:`<button class="link" data-action="team" data-id="${t}">${esc(name)}</button>`});}});hits.sort((a,b)=>a.at-b.at||b.end-a.end);let out='',at=0;for(let h of hits)if(h.at>=at){out+=esc(text.slice(at,h.at))+h.html;at=h.end;}return out+esc(text.slice(at));}
function newsFeed(items){return items.length?items.map(n=>`<div class="news-item"><div class="news-date">S${n.year}<br>W${n.week+1}</div><div>${linkText(n.text)}</div></div>`).join(''):`<div class="empty">The first chapter is still ahead of you.</div>`;}
function rosterRows(team,sex){return S.players.filter(p=>p.team===team&&!p.retired&&(!sex||p.sex===sex)).map(p=>{let e=bestEvent(p),c=p.sb?.[e]?.c||p.pb[e]?.[2];return `<tr>${td(pLink(p.id)+`<div class="cell-note">${p.type} · ${p.sex}</div>`)}${td(p.age,p.age,'num')}${td(status(p))}${td(E.label(e))}${td(c?time(c):time(E.projection(p,e)),c||E.projection(p,e),'num')}${td(power(p),power(p),'num')}${td(pct(p.fitness),p.fitness,'num')}${td(pct(p.fatigue),p.fatigue,'num')}${td(money(p.contract.salary),p.contract.salary,'num')}${td(p.contract.years+' yr',p.contract.years,'num')}</tr>`;});}
function rosterPage(){let t=U.rosterTeam??S.user;let roster=E.roster(S,t,null,false);return head('The roster.',`${club(t)[0]} · ${club(t)[2]}`,`${btn('Women','roster-sex','data-sex="W"',U.rosterSex==='W'?'dark':'')}${btn('Men','roster-sex','data-sex="M"',U.rosterSex==='M'?'dark':'')}<select id="roster-team" aria-label="Roster club">${CLUBS.map((x,i)=>`<option value="${i}" ${i===t?'selected':''}>${esc(x[0])}</option>`).join('')}</select>`)+`<div class="card space-bottom stat-grid">${stat('Active women',roster.filter(p=>p.sex==='W').length+'/14','Injured list creates a replacement spot')}${stat('Active men',roster.filter(p=>p.sex==='M').length+'/14','At least two entries per event')}${stat('Payroll',money(E.payroll(S,t)),'Injured-list contracts receive cap relief')}${stat('Cap room',money(E.CAP-E.payroll(S,t)),'Fixed $30m annual cap')}</div><div class="card">${table(['Swimmer','Age','Status','Best event','Best / projection','PP','Fitness','Fatigue','Salary','Term'],rosterRows(t,U.rosterSex),'Click a swimmer for every event, exact PB splits, progression, attributes and contract actions. Without an official mark, the time shown is a current projection. Click any column heading to sort.')}</div>`;}
function trainingPage(){let loads=['Heavy','Normal','Rest','Full taper'];return head('Earn the time drop.',S.ready?'Training is complete for this week. Write the lineup with today’s fitness, fatigue and taper.':'Choose the load for each group, then complete training before writing entries.',btn(S.ready?'Open lineup':'Complete training & write entries','prepare','','primary'))+`<div class="notice"><strong>Build, recover, peak.</strong>Heavy work adds fitness and development but carries fatigue and injury risk. Normal work sustains the base. Rest sharpens briefly. A full taper creates a three-week window, with two effective taper cycles per season. Repeated tapering fades.</div><div class="grid">${E.GROUPS.map((group,g)=>{let ps=E.roster(S,S.user,null,false).filter(p=>p.group===g);return `<section class="span3 card"><div class="card-head"><h3>${group}</h3>${badge(ps.length+' swimmers')}</div><div class="card-pad"><label>Weekly load<select data-load="${g}" ${S.ready||S.settings.autoTraining?'disabled':''}>${loads.map((l,i)=>`<option value="${i}" ${S.training[g]===i?'selected':''}>${l}</option>`).join('')}</select></label><div class="spread small space-top"><span>Average fitness</span><b class="mono">${pct(ps.reduce((a,p)=>a+p.fitness,0)/(ps.length||1))}</b></div><div class="spread small space-top"><span>Average fatigue</span><b class="mono">${pct(ps.reduce((a,p)=>a+p.fatigue,0)/(ps.length||1))}</b></div></div></section>`;}).join('')}<div class="span12 card"><div class="card-head"><h3>Training groups</h3><div class="toolbar"><label class="row"><input type="checkbox" data-setting="autoTraining" ${S.settings.autoTraining?'checked':''}> Auto training</label>${btn('Assign by profile','auto-groups',S.ready?'disabled':'')}</div></div>${table(['Swimmer','Group','Fitness','Fatigue','Sharpness','Tapers used','Status'],E.roster(S,S.user,null,false).map(p=>`<tr>${td(pLink(p.id)+` <span class="cell-note">${p.sex} · ${p.type}</span>`)}${td(`<select data-group="${p.id}" ${S.ready?'di function ensureLine(){if(!fixture())return null;let prg=E.program(currentCard(),S.week);if(!line||line.length!==prg.length)line=S.manual?E.clone(S.manual):E.autoLineup(S,S.user,prg,fixture().filter(t=>t!==S.user),S.phase==='final');return prg;}
function swimmerOptions(sex,event,selected){let sexes=sex==='X'?['W','M']:[sex];return sexes.map(sx=>`<optgroup label="${sx==='W'?'Women':'Men'}">${E.roster(S,S.user,sx).sort((a,b)=>E.projection(a,event)-E.projection(b,event)).map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)} · ${time(E.projection(p,event))}</option>`).join('')}</optgroup>`).join('');}
function scoutHabits(teams){return teams.map(t=>{let entries=Object.entries(S.teams[t].habits||{}).filter(([k])=>!E.info(k.split(':')[1]).relay).map(([k,v])=>{let a=Object.entries(v).sort((a,b)=>b[1]-a[1])[0];return {key:k,id:+a[0],n:a[1]};}).sort((a,b)=>b.n-a.n).slice(0,6);return `<div class="card space-bottom"><div class="card-head"><h3>Observed tendencies</h3>${teamLink(t,true)}</div><div class="card-pad"><p class="small muted">${S.teams[t].w}–${S.teams[t].l} · ${esc(S.teams[t].coach)} coaches. Most repeated individual assignments:</p>${entries.length?entries.map(x=>`<div class="small space-bottom">${x.key.split(':')[0]} ${E.label(x.key.split(':')[1])}<br>${pLink(x.id)} · ${x.n} starts</div>`).join(''):'<p class="small muted">No official entries have been filed this season. Opening-week scouting uses preseason ability estimates.</p>'}</div></div>`;}).join('');}
function scoutingLineup(team,prg,final){let scout=E.clone(S);for(let p of E.roster(scout,team,null,false)){p.fatigue=.62;p.fitness=.72;p.sharp=0;}return E.autoLineup(scout,team,prg,[S.user],final);}
function lineupPage(){let f=fixture();if(!f)return head('Read the water.','No meet is scheduled for your club in this phase.')+`<div class="card card-pad">${btn('View the league','nav','data-view="league"')}</div>`;let prg=ensureLine(),final=S.phase==='final',rivals=f.filter(t=>t!==S.user),cpu=rivals.map(t=>scoutingLineup(t,prg,final)),errors=E.validateLineup(S,S.user,line,prg,final,true),lines=f.map(t=>t===S.user?line:cpu[rivals.indexOf(t)]),today=E.projectMeet(S,f,lines,prg,false),seeded=E.projectMeet(S,f,lines,prg,true),counts=E.workload(line,prg);let views=['W','M','X'];return head('Write the heat sheet.','Entries are submitted blind. Opponent entries below are scouting estimates from their roster and season marks, never a response to your lineup.',`${btn('Auto-lineup','auto-lineup')}${btn('Submit entries','submit-lineup',errors.length||!S.ready?'disabled':'','primary')}`)+`${!S.ready?`<div class="notice warning"><strong>Training is still pending.</strong>Read the scouting report now. Complete your weekly training to unlock edits and accurate projections. ${btn('Complete training','prepare')}</div>`:''}${S.manual?`<div class="notice"><strong>Entries submitted.</strong>You can revise them until the meet begins. ${btn('Swim & watch','swim-watch')} ${btn('Skip to results','advance')}</div>`:''}<div class="grid"><div class="span8 card"><div class="card-head"><div class="toolbar">${views.map(sx=>btn(sx==='W'?'Women':sx==='M'?'Men':'Mixed','line-sex',`data-sex="${sx}"`,U.lineSex===sx?'dark':'')).join('')}</div>${f[0]===S.user&&['wildcard','quarterfinal'].includes(S.phase)?`<label>Host card<select id="card-choice"><option value="standard" ${currentCard()==='standard'?'selected':''}>Standard</option><option value="distance" ${currentCard()==='distance'?'selected':''}>Distance</option></select></label>`:badge(currentCard()==='distance'?'Distance card':final?'Three-day final':'Standard card')}</div>${prg.map((e,i)=>{if(e.sex!==U.lineSex)return '';let relay=E.info(e.event).relay,legs=relay?E.relayEvents(e.event):[e.event],opp=rivals.map((t,j)=>{let entries=cpu[j][i];return `<span>${club(t)[1]}: ${entries.map(ids=>ids.map(id=>`<button class="link" data-action="player" data-id="${id}">${esc(player(id).name.split(' ').at(-1))}</button>`).join(' / ')+' '+time(E.entryProjection(S,ids,e,i,cpu[j],prg,true,false))).join(' · ')}</span>`;}).join('<br>');return `<section class="lineup-event"><div class="event-title"><span class="event-no">${String(i+1).padStart(2,'0')}</span><strong>${E.label(e.event)}</strong>${final?badge('Day '+(e.day+1)):''}</div><div class="small muted space-bottom">Likely opposition / season marks · ${opp}</div>${line[i].map((ids,j)=>relay?`<div class="relay-entry"><div class="spread small"><b>Relay ${j?'B':'A'}</b><div class="toolbar"><span class="projected">${time(E.entryProjection(S,ids,e,i,line,prg,false,f[0]===S.user&&!final))}</span>${j>0?btn('Remove','remove-entry',`data-i="${i}" data-j="${j}" ${!S.ready?'disabled':''}`):''}</div></div><div class="relay-legs">${ids.map((id,k)=>`<label>${k+1}. ${E.label(legs[k])}${k?' · flying':' · flat'}<select data-line-i="${i}" data-line-j="${j}" data-line-k="${k}" ${!S.ready?'disabled':''}>${swimmerOptions(e.sex,legs[k],id)}</select></label>`).join('')}</div></div>`:`<div class="entry-row"><span class="entry-label">${j+1}</span><select data-line-i="${i}" data-line-j="${j}" data-line-k="0" ${!S.ready?'disabled':''} aria-label="Entry ${j+1} for ${E.label(e.event)}">${swimmerOptions(e.sex,e.event,ids[0])}</select><span class="projected">${time(E.entryProjection(S,ids,e,i,line,prg,false,f[0]===S.user&&!final))}</span>${j>1?btn('×','remove-entry',`data-i="${i}" data-j="${j}" aria-label="Remove third entry" ${!S.ready?'disabled':''}`):''}</div>`).join('')}${!final&&line[i].length<(relay?2:3)?`<div class="space-top">${btn(relay?'Add B relay':'Add third entry','add-entry',`data-i="${i}" ${!S.ready?'disabled':''}`)}</div>`:''}</section>`;}).join('')}</div><aside class="span4 lineup-sideb return head('The touchpad tells the story.',`${m.pool} · Season ${m.year} · ${m.card==='final'?'Meridian Cup final':'Week '+(m.week+1)+' / '+m.card+' card'}`,selectors+btn('Watch race by race','replay','','primary'))+`<div class="card space-bottom"><div class="card-pad result-summary">${m.teams.map(t=>`<div class="row">${teamLink(t)}<strong class="score">${E.round(m.score[t],10)}</strong>${m.winner===t?badge(m.final?'CHAMPION':'WIN','gold'):''}</div>`).join('<span class="muted">/</span>')}</div>${m.tieBreak?`<div class="table-foot">Tied team totals: the closing free-relay winner takes the meet.</div>`:''}</div><div class="heat-sheet"><div class="heat-title spread"><div><div class="eyebrow">Official results / Short course yards</div><h2 style="margin:0">Every hundredth, accounted for.</h2></div>${badge(m.events.length+' events')}</div>${m.events.map((e,i)=>`<details ${i===0?'open':''}><summary>${i+1}. ${e.sex} ${E.label(e.event)} ${m.final?' · Day '+(e.day+1):''} <span class="cell-note"> / ${m.teams.map(t=>club(t)[1]+' '+E.round(e.score[t],10)).join(' · ')}</span></summary><div class="space-top">${resultsTable(m,e)}${relayDetails(e)}<div class="toolbar space-top">${btn('Replay this race','race-replay',`data-index="${i}"`)}</div></div></details>`).join('')}</div>`;}
function relayDetails(e){if(!E.info(e.event).relay)return '';return `<div class="card space-top"><div class="card-head"><h3>Relay legs & exchanges</h3></div>${table(['Club','Leg','Swimmer','Stroke','Leg time','Start','Marks'],e.entries.flatMap(r=>r.legs.map((leg,k)=>`<tr>${td(teamLink(r.team,true))}${td(k+1,null,'num')}${td(pLink(leg.id))}${td(E.label(leg.leg))}${td(time(leg.c),leg.c,'num')}${td(k?`Flying −${(leg.flying/100).toFixed(2)}s`:'Flat / official')}${td(leg.pb?badge('PB','blue'):leg.record?badge('LR','gold'):'')}</tr>`)),'Only lead-off legs are eligible for individual PBs and records. Flying-leg times do not enter individual record lists.')}</div>`;}

function stopWatch(){watchToken++;watch=null;}

function racePosition(r,elapsed){let c=elapsed*100,sum=0,k=0;while(k<r.splits.length&&sum+r.splits[k]<=c){sum+=r.splits[k];k++;}let done=k===r.splits.length,frac=done?0:(c-sum)/r.splits[k],yards=done?r.splits.length*50:k*50+Math.max(0,frac)*50;return {yards,done,k,last:k?r.splits[k-1]:0,cumulative:sum};}
function drawPool(){let canvas=$('pool-canvas');if(!canvas||!watch)return;let rect=canvas.getBoundingClientRect(),ratio=window.devicePixelRatio||1,w=rect.width,h=rect.height;if(canvas.width!==Math.round(w*ratio)||canvas.height!==Math.round(h*ratio)){canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio);}let ctx=canvas.getContext('2d');ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,w,h);let margin=30,right=w-18,lanes=watch.meet.final?8:6,laneH=(h-22)/lanes,top=10;ctx.fillStyle='#0d5266';ctx.fillRect(margin,top,right-margin,laneH*lanes);let e=watch.meet.events[watch.index];for(let lane=1;lane<=lanes;lane++){let y=top+(lane-.5)*laneH;ctx.fillStyle=lane%2?'#176276':'#155b6d';ctx.fillRect(margin,top+(lane-1)*laneH,right-margin,laneH);ctx.strokeStyle='#2c7887';ctx.setLineDash([4,5]);ctx.beginPath();ctx.moveTo(margin,y+laneH/2);ctx.lineTo(right,y+laneH/2);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#c6e5de';ctx.font='10px ui-monospace,monospace';ctx.fillText(lane,8,y+4);ctx.strokeStyle='#103a48';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(margin+6,y);ctx.lineTo(right-6,y);ctx.stroke();for(let wall of [margin,right]){ctx.fillStyle='#dbe6d6';ctx.fillRect(wall-2,top+(lane-1)*laneH,4,laneH-1);}let r=e.entries.find(x=>x.lane===lane);if(!r)continue;let pos=racePosition(r,watch.elapsed),segment=pos.yards%50,fraction=segment<=25?segment/25:2-segment/25,x=margin+8+fraction*(right-margin-16),direction=segment<=25?1:-1;if(pos.done)x=margin+8;ctx.strokeStyle='#b0e9ec77';ctx.lineWidth=1;for(let n=1;n<4;n++){ctx.beginPath();ctx.ellipse(x-direction*n*8,y,3+n*2,3+n*2,0,-1,1);ctx.stroke();}ctx.fillStyle=club(r.team)[4];ctx.beginPath();ctx.ellipse(x,y,9,3.5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=club(r.team)[3];ctx.beginPath();ctx.arc(x+direction*7,y,4,0,Math.PI*2);ctx.fill();ctx.strokeStyle=club(r.team)[4];ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.sin(watch.elapsed*5+lane)*6,y-6);ctx.stroke();ctx.fillStyle='#f7f7e9';ctx.font='9px ui-monospa function animateWatch(){let token=++watchToken;function frame(now){if(!watch||token!==watchToken||!watch.playing)return;let e=watch.meet.events[watch.index],end=Math.max(...e.entries.map(r=>r.c))/100;if(watch.last)watch.elapsed+=Math.min(.15,(now-watch.last)/1000)*watch.speed;watch.last=now;if(watch.elapsed>=end){watch.elapsed=end;watch.playing=false;watch.finished=true;render();drawPool();return;}drawPool();requestAnimationFrame(frame);}requestAnimationFrame(frame);}
function leaguePage(){let st=E.standings(S),seeds=E.playoffSeeds(S),tab=U.leagueTab||'standings';let actions=btn('Standings','league-tab','data-tab="standings"',tab==='standings'?'dark':'')+btn('Results & schedule','league-tab','data-tab="schedule"',tab==='schedule'?'dark':'');if(tab==='schedule'){let week=U.leagueWeek??Math.max(0,Math.min(13,S.week-1)),games=S.schedule[week],results=S.results.filter(m=>m.week===week);return head('Around the league.','Ten division duals plus four cross-division meets per club. Home and away are balanced.',actions)+`<div class="toolbar space-bottom"><label class="row">Week<select id="league-week">${Array.from({length:14},(_,w)=>`<option value="${w}" ${w===week?'selected':''}>Week ${w+1} · ${E.cardForWeek(w)}</option>`).join('')}</select></label></div><div class="grid">${games.map(pair=>{let result=results.find(m=>m.teams[0]===pair[0]);return `<div class="span6 card card-pad"><div class="eyebrow">${E.cardForWeek(week)} card / ${esc(S.teams[pair[0]].pool)}</div>${pair.map((t,j)=>`<div class="spread space-bottom">${teamLink(t)}<strong class="score-mini">${result?E.round(result.score[t],10):j?'AWAY':'HOME'}</strong></div>`).join('')}${result?btn('Meet summary','meet-summary',`data-id="${esc(result.id)}"`):badge(week<S.week?'Scheduled':'Upcoming','blue')}</div>`;}).join('')}</div>`;}

function ownedPicks(t){let out=[];for(let y=S.year+1;y<=S.year+2;y++)for(let r=1;r<=4;r++)for(let original=0;original<24;original++){let owner=S.futurePicks?.[`${y}:${r}:${original}`]??original,used=S.draftYear===y&&S.picks.findIndex(p=>p.original===original&&p.round===r)<S.draftIndex;if(owner===t&&!used)out.push({year:y,round:r,original});}return out;}

function draftPage(){let live=['lottery','draft','freeagency','cuts'].includes(S.phase)&&S.prospects.length,pick=S.picks[S.draftIndex],prospects=S.players.filter(p=>p.team===-3&&(U.draftSex==='All'||p.sex===U.draftSex)).sort((a,b)=>E.playerValue(b)-E.playerValue(a));if(!live)return head('The next generation.','The four-round draft follows the season awards and re-signing window.')+`<div class="card card-pad"><h2>Times you can see. Futures you must project.</h2><p>The class contains 144 adult prospects, balanced by gender and spread across stroke and distance groups. The lottery weights non-playoff clubs toward earlier picks. Drafted swimmers receive three-year rookie-scale contracts.</p>${btn('Draft class retrospectives','history-tab','data-tab="drafts"')} ${btn('View current season','nav','data-view="hq"')}</div>`;

function recordsPage(){let sex=U.eventSex,scope=U.recordScope,mode=U.recordMode,events=recordEvents(sex);if(!events.includes(U.recordEvent))U.recordEvent=events[0];let board=scope==='league'?S.records:S.teamRecords[+scope],controls=`<select id="record-scope" aria-label="Record scope"><option value="league" ${scope==='league'?'selected':''}>League records</option>${CLUBS.map((t,i)=>`<option value="${i}" ${String(i)===scope?'selected':''}>${esc(t[0])}</option>`).join('')}</select><select id="record-sex" aria-label="Record gender">${['W','M','X'].map(x=>`<option value="${x}" ${x===sex?'selected':''}>${x==='W'?'Women':x==='M'?'Men':'Mixed'}</option>`).join('')}</select>`;let content='';if(mode==='records')content=table(['Event','Record holder','Time','PP','Season','Meet'],events.map(e=>{let key=sex+':'+e,r=board[key];return `<tr>${td(E.label(e)+(e==='50BK'?'<div class="cell-note">Official relay lead-off</div>':''))}${td(r?holder(r,e):'<span class="cell-note">No official swim yet</span>')}${td(r?evLink(r,key):'—',r?.[2]||1e9,'num')}${td(r?E.points(sex,e,r[2]):'—',r?E.points(sex,e,r[2]):0,'num')}${td(r?r[0]:'—',r?.[0]||0,'num')}${td(r?esc(meetLabel(r[1])):'—')}</tr>`;}),'Record times open the exact 50-yard splits and meet provenance. Power points use a fixed benchmark set for comparisons across eras.');else{let e=U.recordEvent,key=sex+':'+e;if(mode==='top')content=table(['Rank','Performer','Time','PP','Season'],(S.top[key]||[]).filter(r=>scope==='league'||r[5]===+scope).map((r,i)=>`<tr>${td(i+1,null,'rank')}${td(holder(r,e))}${td(evLink(r,key),r[2],'num')}${td(E.points(sex,e,r[2]),E.points(sex,e,r[2]),'num')}${td(r[0],r[0],'num')}</tr>`),'One best mark per individual performer; one per club for relays. Team filtering applies to the league’s all-time top ten.');else content=table(['Rank','Performer','Season best','PP','Meet'],Object.values(S.seasonBest[key]||{}).filter(r=>scope==='league'||(E.info(e).relay?r.id:player(r.id)?.team)===+scope).sort((a,b)=>a.c-b.c).map((r,i)=>`<tr>${td(i+1,null,'rank')}${td(E.info(e).relay?teamLink(r.id):pLink(r.id))}${td(time(r.c),r.c,'num')}${td(E.points(sex,e,r.c),E.points(sex,e,r.c),'num')}${td(r.meet?esc(meetLabel(r.meet)):!E.info(e).relay&&player(r.id)?.sb?.[e]?.meet?esc(meetLabel(player(r.id).sb[e].meet)):'Stored season best')}</tr>`),'Season event titles go to the fastest official performer, including eligible flat-start relay lead-offs.');}
return head('The record board.','Time is the language. A hundredth is history.',controls)+`<div class="toolbar space-bottom">${btn('Records','record-mode','data-mode="records"',mode==='records'?'dark':'')}${btn('All-time top ten','record-mode','data-mode="top"',mode==='top'?'dark':'')}${btn('Season depth','record-mode','data-mode="season"',mode==='season'?'dark':'')}${mode!=='records'?`<select id="record-event" aria-label="Record event">${events.map(e=>`<option value="${e}" ${e===U.recordEvent?'selected':''}>${E.label(e)}</option>`).join('')}</select>`:''}</div><div class="card record-board">${content}</div>`;}
function historyPage(){let tab=U.historyTab||'seasons',actions=['seasons','hall','drafts'].map(t=>btn(t==='seasons'?'Seasons & awards':t==='hall'?'Hall of Currents':'Draft retrospectives','history-tab',`data-tab="${t}"`,t===tab?'dark':'')).join('');if(tab==='hall'){let members=S.hall.map(id=>player(id)).filter(Boolean).sort((a,b)=>careerPower(b)-careerPower(a));return head('The Hall of Currents.','Retired swimmers with a 1,000-point peak and at least 100 official individual swims.',actions)+`<div class="card">${table(['Swimmer','Specialty','Final age','Retired','Career peak','Official swims'],members.map(p=>`<tr>${td(pLink(p.id))}${td(p.type)}${td(p.age,p.age,'num')}${td('Season '+p.retiredYear,p.retiredYear,'num')}${td(careerPower(p),careerPower(p),'num')}${td(p.careerSwims,p.careerSwims,'num')}</tr>`),members.length?'Their PB progressions remain preserved.':'No inductees yet. The Hall opens as the league’s great swimmers retire.')}</div>`;}
if(tab==='drafts'){let years=[...new Set(S.draftHistory.map(p=>p.year))].sort((a,b)=>b-a),year=U.draftHistoryYear||years[0],rows=S.draftHistory.filter(h=>h.year===year).sort((a,b)=>a.pick-b.pick);return head('What became of the class.','From draft-night bets to verified time drops.',actions)+`<div class="toolbar space-bottom"><select id="draft-history-year" aria-label="Draft class">${years.map(y=>`<option value="${y}" ${y===year?'selected':''}>Season ${y} class</option>`).join('')||'<option>No draft completed yet</option>'}</select></div><div class="card">${table(['Pick','Swimmer','Drafted by','Age now / final','Current club','Career PP','Status'],rows.map(h=>{let p=player(h.id),pp=careerPower(p);return `<tr>${td(h.pick,h.pick,'rank')}${td(pLink(p.id)+`<div class="cell-note">${p.sex} · ${p.type}</div>`)}${td(teamLink(h.team,true))}${td(p.age,p.age,'num')}${td(p.team>=0?teamLink(p.team,true):p.retired?'Retired':'Free agent')}${td(pp||'—',pp,'num')}${td(p.retired?badge('Retired'):pp>=980?badge('Star peak','gold'):pp>=900?badge('Established'):badge('Developing'))}</tr>`;}),'Career points reflect actual official personal bests, not a prospect rating.')}</div>`;}
if(!S.history.length)return head('A history worth keeping.','Season standings, champions, awards and event titles will be recorded when the first Meridian Cup is decided.',actions)+`<div class="card card-pad"><p>Your league record board is already live. Every personal best carries its original season, meet and splits.</p>${btn('Open record board','nav','data-view="records"')}</div>`;let h=S.history.find(x=>x.year===U.historyYear)||S.history.at(-1),aw=h.awards;return head('Banners outlive seasons.',`Season ${h.year}: ${club(h.champion)[0]} won the Meridian Cup.`,actions)+`<div class="toolbar space-bottom"><select id="history-year" aria-label="Historical season">${S.history.slice().reverse().map(x=>`<option value="${x.year}" ${x.year===h.year?'selected':''}>Season ${x.year} · ${esc(club(x.champion)[1])}</option>`).join('')}</select></div><div class="banners">${S.history.slice().reverse().slice(0,18).map(x=>`<button class="banner" data-action="team" data-id="${x.champion}" style="--club:${club(x.champion)[3]};--second:${club(x.champion)[4]}"><span>Meridian Cup</span><strong>${x.year}</strong><span>${club(x.champion)[1]}</span></button>`).join('')}</div><div class="grid"><div class="span7 card"><div class="card-head"><h3>Final standings · season ${h.year}</h3></div>${table(['Club','W','L','Division','Margin'],h.standings.map(r=>`<tr>${td(teamLink(r[0]))}${td(r[1],r[1],'num')}${td(r[2],r[2],'num')}${td(r[3]+'–'+r[4],r[3],'num')}${td(r[5],r[5],'num')}</tr>`))}</div><div class="span5"><div class="card space-bottom"><div class="card-head"><h3>Season honors</h3></div><div class="card-pad">${[['Women’s Swimmer of the Year','W'],['Men’s Swimmer of the Year','M'],['Women’s Rookie of the Year','WRookie'],['Men’s Rookie of the Year','MRookie'],['Women’s Breakout Swimmer','WBreakout'],['Men’s Breakout Swimmer','MBreakout']].map(([title,key])=>`<div class="space-bottom"><div class="eyebrow" style="margin-bottom:5px">${title}</div>${aw[key]?pLink(aw[key]):'<span class="small muted"> function officePage(){let roster=S.players.filter(p=>p.team===S.user&&!p.retired),career=S.career;return head('The long view.','Contracts, ownership, your résumé, and the tools that keep the franchise portable.')+`<div class="grid"><div class="span12 card stat-grid">${stat('GM / coach seasons',career.seasons,'Across every job')}${stat('Career record',career.wins+'–'+career.losses,'Regular-season dual meets')}${stat('Meridian Cups',career.titles,'Championships as GM / coach')}${stat('Owner confidence',Math.round(career.trust)+'/100',myTeam().target+' wins expected this season')}</div><div class="span8 card"><div class="card-head"><h3>Contract ledger</h3>${badge(money(E.payroll(S,S.user))+' / '+money(E.CAP))}</div>${table(['Swimmer','Annual salary','Years left','Expires','Status','Action'],roster.slice().sort((a,b)=>a.contract.years-b.contract.years).map(p=>`<tr>${td(pLink(p.id)+`<div class="cell-note">${p.sex} · ${p.type}</div>`)}${td(money(p.contract.salary),p.contract.salary,'num')}${td(p.contract.years,p.contract.years,'num')}${td('S'+(S.year+Math.max(0,p.contract.years-1)))}${td(p.il?badge('Cap relief','blue'):p.contract.years<=1?badge('Expiring','red'):badge('Under contract'))}${td(btn('Extend','extend',`data-id="${p.id}"`))}</tr>`),'Contracts are non-guaranteed, with no dead-cap charge on release. Injured-list salaries receive cap relief while the athlete is unavailable. Rookie deals last three seasons.')}</div><div class="span4"><div class="card space-bottom"><div class="card-head"><h3>Save desk</h3></div><div class="card-pad"><p class="small">Autosave uses browser storage. Exported JSON saves contain the full franchise, exact PB evidence, RNG state and save version.</p><div class="toolbar">${btn('Export franchise','export','','primary')}${btn('Import franchise','import')}${btn('Save now','save-now')}</div><p class="small muted space-top">Keep an exported copy when moving or renaming the HTML file, or changing browsers. Save version ${S.version}. Benchmarks re function healthPage(){let report=healthResult||FACTORY_AUDIT.summary,source=healthResult?`Your throwaway run · ${healthResult.seed} · ${healthResult.seasons} seasons`:`Factory audit · ${FACTORY_AUDIT.seed} · 30 seasons`,selected=U.healthIndex!=='average'&&healthSeasons.length?H.summarize([healthSeasons[+U.healthIndex]]):report;return head('Trust the numbers.',source,`${btn('Download report','health-export')}`)+`<div class="card card-pad space-bottom"><div class="form-grid three"><label>Seasons to simulate<input id="health-years" type="number" min="1" max="60" value="${U.healthYears}"></label><label>Display<select id="health-season"><option value="average">Run averages</option>${healthSeasons.map((s,i)=>`<option value="${i}" ${String(i)===U.healthIndex?'selected':''}>Season ${s.year}</option>`).join('')}</select></label><div style="align-self:end">${btn('Run on a throwaway copy','health-run',busy?'disabled':'','primary')}</div></div><p class="small muted space-top" style="margin-bottom:0">Your live franchise and RNG are untouched. Every club uses CPU management. A partial current season is finished before measured seasons begin. Runs yield between league steps and can be stopped. Individual-season variation is shown honestly; the primary time/depth gate uses run averages.</p></div><div class="health-checks space-bottom">${selected.checks.map(c=>`<div class="health-cell ${c.flag?'failed':''}"><small>${esc(c.label)}</small><strong>${Number.isFinite(c.value)?(Number.isInteger(c.value)?c.value:c.value.toFixed(c.label.includes('MB')?3:2)):'—'}</strong><small>Target ${c.low}–${c.high} ${c.flag?' · FLAG':' · PASS'}</small></div>`).join('')}</div><div class="card space-bottom"><div class="card-head"><h3>Actual season performers</h3>${badge('Unique swimmers, official times','blue')}</div>${table(['Event','Benchmark','Fastest','Δ target','8th','8th gap','50th','50th gap','Fast drift','50th drift'],selected.rows.map(r=>`<tr>${td(r.sex+' '+E.label(r.event))}${td(time(r.benchmark),r.benchmark,'num')}${td(time(r.first),r.first,'num')}${td(r.fastError.toFixed(2)+'%',r.fastError,'num '+(Math.abs(r.fastError)>1?'warn':''))}${td(time(r.eighth),r.eighth,'num')}${td(r.d8.toFixed(2)+'%',r.d8,'num '+(r.d8<1.5||r.d8>3?'warn':''))}${td(time(r.fiftieth),r.fiftieth,'num')}${td(r.d50.toFixed(2)+'%',r.d50,'num '+(r.d50<4||r.d50>6?'warn':''))}${td(r.driftFirst===null?'—':r.driftFirst.toFixed(2)+'%',r.driftFirst,'num '+(Math.abs(r.driftFirst)>.5?'warn':''))}${td(r.drift50===null?'—':r.drift50.toFixed(2)+'%',r.drift50,'num '+(Math.abs(r.drift50)>.5?'warn':''))}</tr>`),'Targets: fastest within ±1%; 8th +1.5–3%; 50th +4–6%. Drift compares the final five seasons with the first five and flags each event outside ±0.5%; the summary also reports the league-wide average. Short runs have wider sampling variation.')}</div><div class="grid"><div class="span6 card"><div class="card-head"><h3>Relay calibration</h3></div>${table(['Event','Fastest average','Benchmark','Difference'],selected.relays.map(r=>`<tr class="${Math.abs(r.error)>1?'warn':''}">${td(r.sex+' '+E.label(r.event))}${td(time(r.time),r.time,'num')}${td(time(r.benchmark),r.benchmark,'num')}${td(r.error.toFixed(2)+'%',r.error,'num')}</tr>`),'Relay times come from four individual swims and actual exchange advantages. No relay time multiplier is used.')}</div><div class="span6 card"><div class="card-head"><h3>Actual season-best change by age</h3></div>${table(['Ages','Change','Target','Paired swims'],selected.aging.map(r=>`<tr class="${r.flag?'warn':''}">${td(r.label)}${td(r.change===null?'—':r.change.toFixed(3)+'%',r.change,'num')}${td(r.low+' to '+r.high+'%')}${td(r.n,r.n,'num')}</tr>`),'Negative is faster. These are paired event season-best changes, not cumulative lifetime PBs. The underlying peak window is two years later for sprinters than distance swimmers.')}</div><div class="span6 card"><div class="card-head"><h3>League record boards lowered</h3></div>${table(['Season','Events improved','≈ 40 / n'],selected.records.map(r=>`<tr class="${r.year>1&&Math.abs(r.count-r.target)>Math.max(2,2*Math.sqrt(r.target))?'warn':''}">${td(r.year,r.year,'num')}${td(r.count,r.count,'num')}${td(r.target.toFixed(1),r.target,'num')}</tr>`),'Counts distinct primary event boards improved during the season. Multiple improvements in one event remain in PB histories and the news. Large deviations beyond a rough two-standard-deviation count band are flagged.')}</div><div class="span6 card"><div class="card-head"><h3>Champions</h3></div>${table(['Club','Titles'],Object.entries(selected.champions).sort((a,b)=>b[1]-a[1]).map(([t,n])=>`<tr>${td(teamLink(+t))}${td(n,n,'num')}</tr>`))}<div class="card-pad"><h3>Invariant checks</h3><p class="small">Rosters, lineup coverage on both dual cards and the final, event limits, caps, numeric validity, wins/losses, record order, exact splits and score totals use the same engine checks as the headless audit.</p><p class="small muted">The shipped headless audit additionally retained every official swim and traced every PB progression and record-board entry to that full log. Live browser health runs keep compact evidence rather than that full log.</p>${selected.errors.length?`<div class="notice error">${esc(JSON.stringify(selected.errors.slice(0,8)))}</div>`:badge('No structural violations','gold')}</div></div></div>`;}
function renderModal(){let root=$('modal-root');if(!modal){root.innerHTML='';return;}let title='',subtitle='',body='';if(modal.type==='player'){let p=player(modal.id);if(!p){modal=null;root.innerHTML='';return;}title=p.name;subtitle=`${p.sex==='W'?'Woman':'Man'} · ${p.type} · ${p.retired?'Age '+p.age+' at retirement':'Age '+p.age} · ${p.team>=0?club(p.team)[0]:p.team===-3?'Draft prospect':p.retired?'Retired professional':'Free agent'}`;let event=modal.event||bestEvent(p),progress=p.progress?.[event]||[],times=p.team===-3?p.amateur:null;body=`<div class="row space-bottom">${p.team>=0?mark(p.team,true):`<div class="avatar">${esc(p.name[0]+p.name.split(' ').at(-1)[0])}</div>`}<div>${p.retired?badge('Retired'):status(p)} ${p.draft?badge('S'+p.draft.year+' · Pick '+(p.draft.pick||'—')):''}<p class="small muted" style="margin:8px 0 0">${p.careerSwims||0} official individual swims · ${careerPower(p)||'—'} career peak PP</p></div></div>${!p.retired?`<div class="attribute-grid space-bottom">${[['Starts',p.start],['Turns',p.turn],['Underwaters / pullout',p.uw],['Relay exchange',p.exchange],['Consistency',p.consistency],['Durability',p.durability],['Taper response',Math.round(p.taperResponse*100)],['Big-meet change',(-p.clutch*100).toFixed(2)+'%']].map(([n,v])=>`<div class="attribute">${n}<b>${v}</b>${typeof v==='number'?`<div class="meter"><span style="width:${Math.min(100,v)}%"></span></div>`:''}</div>`).join('')}</div>`:''}<div class="toolbar space-bottom">${p.team===S.user&&!p.retired?btn('Extend contract','extend',`data-id="${p.id}"`)+btn(S.phase==='regular'?'Release & replace at minimum':'Release swimmer','release',`data-id="${p.id}"`,'danger'):p.team===-1&&!p.retired?btn('Make offer','offer',`data-id="${p.id}"`,'primary'):''}${p.team===-3&&S.phase==='draft'&&S.picks[S.draftIndex]?.owner===S.user?btn('Draft this swimmer','draft-pick',`data-id="${p.id}"`,'primary'):''}</div><div class="card space-bottom">${table(['Event',times?'Pre-draft best':'Personal best','Season best function sparkline(records){let max=Math.max(...records.map(r=>r[2])),min=Math.min(...records.map(r=>r[2])),range=Math.max(1,max-min),points=records.map((r,i)=>(40+i/Math.max(1,records.length-1)*820).toFixed(1)+','+(90-(max-r[2])/range*65).toFixed(1));return `<svg class="spark" viewBox="0 0 900 120" role="img" aria-label="Personal best times improve over recorded swims"><line x1="40" y1="95" x2="860" y2="95" stroke="#bfccbd"/><polyline points="${points.join(' ')}" fill="none" stroke="var(--accent)" stroke-width="3"/>${points.map(p=>{let [x,y]=p.split(',');return `<circle cx="${x}" cy="${y}" r="3" fill="var(--accent)"/>`;}).join('')}<text x="40" y="112" font-size="10" fill="#597270">First PB ${time(records[0][2])}</text><text x="860" y="112" text-anchor="end" font-size="10" fill="#597270">Current PB ${time(records.at(-1)[2])}</text></svg>`;}
function helpContent(){return `<details open><summary>The weekly loop</summary><p>Set the four training groups, complete training, inspect the opponent’s likely entries, and write your lineup. Auto-lineup is a starting point you can edit. Submit blind, then watch the completed meet or go straight to its results. Space advances; Escape closes a dialog. Auto-training and auto-lineup let you stay at the GM level.</p></details><details><summary>Roster, cap and contracts</summary><p>Each club has 14 active women and 14 active men. The salary cap is $30m and minimum salary is $360k. Contracts last one to four years; drafted swimmers get three-year rookie deals. Contracts are non-guaranteed. Injured-list contracts receive cap relief, with short-term replacements at minimum salary. Emergency roster repair keeps meets legal.</p></details><details><summary>Training and taper</summary><p>Heavy work builds fitness and development while increasing fatigue and shoulder-injury risk. Normal work maintains the base. Rest gives a short sharpening effect. A full taper gives approximately 2–3% against in-season form for a three-week window. Two cycles per season are effective; a third or an extended taper fades. Sprint athletes peak about two years later than distance swimmers.</p></details><details><summary>Dual entries and scoring</summary><p>Up to three individual entries and two relays per event. A swimmer may swim four events total, at most three individual. Mixed relays use exactly two women and two men, with any order. Individual points: 9–4–3–2–1. Relays: 11–4–2. Race ties split points. A team-score tie goes to the club winning the last free relay. Week 4, 8, 11 and 13 use the distance card.</p></details><details><summary>The Meridian Cup</summary><p>Four division champions and eight wild cards reach the playoffs. Seeds 1–4 have a bye. The higher seed hosts and chooses the card in each knockout round; quarterfinal opponents are reseeded. The four survivors race timed finals for three days in a neutral eight-lane pool. Two entries per individual event, one per relay; at most three individual and seven total swims per athlete. Individual scoring is 9–7–6–5–4–3–2–1; relays 18–14–12–10. A tied championship total also uses the closing relay.</p></details><details><summary>What a time means</summary><p>A stroke-and-distance profile, age, starts, turns, underwaters, fitness, fatigue, taper response, meet workload, home familiarity, big-meet temperament and bounded race-day variance produce each swim. Official results are hundredths. Every 50 split adds exactly to the finish. Flying relay exchanges save 0.4–0.7 seconds; roughly 1% of relays are disqualified for an early takeoff. Flat lead-offs are official individual swims. Flying legs are not eligible for individual PBs or records.</p></details><details><summary>Reading projections</summary><p>Lineup times include current form and earlier swims in the card. Opponent lineups are scouting estimates. Expected scores use probabilistic placing; the season-best projection allows 3.2% form uncertainty. Actual scoring always uses the listed meet point scales. The CPU never reads your submitted lineup.</p></details><details><summary>The draft and market</summary><p>A balanced class of 144 adult prospects enters each offseason. A weighted lottery sets the non-playoff order, followed by playoff clubs. Four rounds select 96 swimmers. Pre-draft times are visible; upside estimates are noisy and true potential is hidden. Free agents consider competing bids, role and success. Trades value performance, age, contract and event needs, with discounts for quantity packages. The trade deadline follows Week 10.</p></details><details><summary>Records and power points</summary><p>Power points = 1000 × (fixed benchmark ÷ time)³. The benchmark set stays fixed across eras. Season titles go to the fastest official performer in each event. League and team boards, unique all-time top-ten performers, and every swimmer’s complete PB progression preserve the meet and exact splits. Supplemental 50 back records come from medley-relay lead-offs.</p></details><details><summary>Saving and verification</summary><p>The game autosaves locally after changes. Export produces portable, versioned JSON using lossless compressed history. Import restores the random generator exactly. If browser storage is blocked or full, an on-screen warning offers export. No network calls or external assets are used. League Health runs a throwaway copy in chunks and flags out-of-range results without changing your franchise.</p></details>`;}

async function runHealth(){if(busy)return;let n=Math.max(1,Math.min(60,+$('health-years').value||30));U.healthYears=n;let work=E.clone(S),partial=work.phase!=='regular'||work.week!==0||work.ready,startYear=work.year,measured=[],errors=[],unsignedStars=0,allTime=0;work._allCPU=true;work.settings.autoTraining=true;work.settings.autoLineup=true;work.manual=null;busy={title:'League Health · throwaway simulation',detail:'Preparing an isolated league copy',progress:0,cancel:false};drawBusy();await yieldFrame();try{if(partial){let year=work.year;while(work.year===year&&!busy.cancel){E.nextWeek(work);busy.detail='Finishing the partial season before measurement';drawBusy();await yieldFrame();}startYear=work.year;}for(let i=0;i<n&&!busy.cancel;i++){let year=work.year,opening=E.checkState(work,true);if(opening.length)errors.push({year,phase:'opening',errors:opening});unsignedStars+=work.players.filter(p=>p.team===-1&&!p.retired&&Math.max(...E.EIDS.map(e=>E.points(p.sex,e,Math.round(E.baseTime(p,e)*100))))>=950).length;while(work.year===year&&!busy.cancel){E.nextWeek(work);if(work.phase==='awards'){H.stampSeason(work);let checks=E.checkState(work,true);if(checks.length)errors.push({year,phase:'final',errors:checks});allTime+=work.metrics.allTime||0;}busy.progress=(i+Math.min(.98,work.week/22))/n;busy.detail=`${i} / ${n} seasons · Season ${year} · ${phaseName(work.phase)}`;drawBusy();await yieldFrame();}if(work.year!==year)measured.push(E.clone(work.history.at(-1)));}if(measured.length){busy.detail='Compressing the final save and calculating ranges';drawBusy();await yieldFrame();let encoded=await C.encode(work);healthSeasons=measured;healthResult=H.summarize(measured,errors,{bytes:new TextEncoder().encode(encoded).length,allTime,unsignedStars,seed:work.seed,startYear});U.healthIndex='average';}else toast('Health run stopped before a full measured season completed.');}catch(e){errors.push({error:e.message});if(measured.length){healthSeasons=measured;healthResult=H.summarize(measu document.addEventListener('click',async event=>{let th=event.target.closest('th[data-sort]');if(th){sortTable(th);return;}let el=event.target.closest('[data-action]');if(!el||el.disabled)return;let action=el.dataset.action;if(action==='backdrop'&&event.target!==el)return;if(busy&&!['nav','player','team','evidence','close','backdrop','export','health-export','cancel-busy'].includes(action)){toast('A simulation is running. Stop it to make changes.');return;}switch(action){case 'start':newGame();break;case 'new-seed':{let a=new Uint32Array(1);crypto.getRandomValues(a);$('new-seed').value='TIDE-'+a[0].toString(36).toUpperCase();break;}case 'resume':U.view='hq';render();break;case 'new-franchise':U.view='new';modal=null;render();break;case 'nav':if(watch){watch.playing=false;watch.last=0;watchToken++;}U.view=el.dataset.view;modal=null;render();window.scrollTo(0,0);break;case 'go-training':U.view='training';render();break;case 'go-lineup':U.view='lineup';render();break;case 'advance':await advance(false);break;case 'swim-watch':await advance(true);break;case 'sim':await simTo(el.dataset.target);break;case 'prepare':prepare();break;case 'auto-groups':{let next=E.clone(S);E.roster(next,next.user,null,false).forEach(p=>p.group=p.type==='Sprint'?0:p.type==='Middle'?1:p.type==='Distance'?2:3);S=next;persist();render();toast('Training groups assigned by profile.');break;}case 'auto-lineup':if(!S.ready&&!act({type:'prepare'}))break;S.manual=null;line=null;ensureLine();render();toast('A legal lineup is ready to edit.');break;case 'submit-lineup':if(act({type:'lineup',lineup:line})){toast('Blind entries submitted.');render();}break;case 'line-sex':U.lineSex=el.dataset.sex;render();break;case 'remove-entry':line[+el.dataset.i].splice(+el.dataset.j,1);S.manual=null;render();break;case 'add-entry':addEntry(+el.dataset.i);break;case 'roster-sex':U.rosterSex=el.dataset.sex;render();break;case 'player':modal={type:'player',id:+el.dataset.id};renderModal();break;case 'team':modal={type:'team',id:+el.dataset.id};renderModal();break;case 'team-roster':U.rosterTeam=+el.dataset.id;U.view='roster';modal=null;render();break;case 'team-records':U.recordScope=el.dataset.id;U.recordMode='records';U.view='records';modal=null;render();break;case 'evidence':modal={type:'evidence',data:evidenceRefs[+el.dataset.id]};renderModal();break;case 'player-event':modal.event=el.dataset.event;renderModal();break;case 'close':case 'backdrop':modal=null;renderModal();break;case 'help':modal={type:'help'};renderModal();break;case 'export':await exportSave();break;case 'import':$('import-input').click();break;case 'save-now':persist();toast('Saving the current franchise.');break;case 'market-sex':U.marketSex=el.dataset.sex;U.marketPage=0;render();break;case 'market-page':U.marketPage+=+el.dataset.dir;render();break;case 'offer':modal={type:'offer',id:+el.dataset.id};renderModal();break;case 'extend':modal={type:'extend',id:+el.dataset.id};renderModal();break;case 'submit-offer':{let id=+el.dataset.id,mode=el.dataset.mode,success=act({type:mode,id,salary:+$('offer-salary').value,years:+$('offer-years').value,release:+($('offer-release')?.value||0)});if(success){let signed=player(id).team===S.user;modal=null;render();toast(signed?'Contract agreed and saved.':'A competing club won the signing. See the news feed.');}break;}case 'release':{let p=player(+el.dataset.id);if(confirm(`Release ${p.name}? ${S.phase==='regular'?'A minimum-salary replacement will be signed to keep the active roster legal.':'The contract ends immediately with no dead-cap charge.'}`)&&act({type:'release',id:p.id})){modal=null;render();toast('Swimmer released.');}break;}case 'execute-trade':if(act({type:'trade',other:U.tradeTeam,give:U.tradeGive,get:U.tradeGet,givePicks:U.tradeGivePicks,getPicks:U.tradeGetPicks})){U.tradeGive=[];U.tradeGet=[];U.tradeGivePicks=[];U.tradeGetPicks=[];render();toast('Trade completed.');}break;case 'draft-sex':U.draftSex=el.dataset.sex;render();break;case 'draft-pick':doDraft(+el.dataset.id);break;case 'draft-best':{let p=S.players.filter(p=>p.team===-3).sort((a,b)=>E.playerValue(b)*E.need(S,S.user,b)-E.playerValue(a)*E.need(S,S.user,a))[0];if(p)doDraft(p.id);break;}case 'record-mode':U.recordMode=el.dataset.mode;render();break;case 'history-tab':U.historyTab=el.dataset.tab;U.view='history';render();break;case 'league-tab':U.leagueTab=el.dataset.tab;render();break;case 'meet-summary':modal={type:'summary',id:el.dataset.id};renderModal();break;case 'summary-full':U.meetMode='mine';U.view='meet';modal=null;render();break;case 'summary-final':U.meetMode='final';U.view='meet';modal=null;render();break;case 'replay':if(U.view!=='meet')U.meetMode='mine';beginWatch();break;case 'race-replay':beginWatch(+el.dataset.index);break;case 'watch-toggle':if(watch){watch.playing=!watch.playing;watch.last=0;render();if(watch.playing){if(watch.finished){watch.elapsed=0;watch.finished=false;render();}animateWatch();}else watchToken++;}break;case 'finish-race':if(watch){let e=watch.meet.events[watch.index];watch.elapsed=Math.max(...e.entries.map(r=>r.c))/100;watch.finished=true;watch.playing=false;watchToken++;render();}break;case 'next-event':if(watch){let index=watch.index+1,speed=watch.speed;beginWatch(index);watch.speed=speed;render();}break;case 'skip-watch':stopWatch();render();break;case 'job':if(act({type:'job',team:+el.dataset.id})){U.rosterTeam=null;U.tradeTeam=S.user===0?1:0;U.view='hq';render();toast('Your new appointment is confirmed.');}break;case 'health-run':await runHealth();break;case 'health-export':download(JSON.stringify(healthResult||FACTORY_AUDIT.summary,null,2),'Turn-Tide-League-Health.json');toast('Health report exported.');break;case 'cancel-busy':if(busy){busy.cancel=true;drawBusy();}break;}});
document.addEventListener('change',async event=>{let el=event.target;if(el.id==='import-input'){let file=el.files[0];if(!file)return;try{let imported=await C.decode(await file.text());let errors=E.checkState(imported,false);let structural=['regular','wildcard','quarterfinal','final'].includes(imported.phase)?errors:errors.filter(x=>x.startsWith('Invalid'));if(structural.length)throw Error(structural.slice(0,3).join('; '));stopWatch();S=imported;line=null;modal=null;U.view='hq';U.rosterTeam=null;persist();render();toast('Franchise imported. Your league RNG and complete history are restored.');}catch(e){toast('Import failed: '+e.message);}el.value='';return;}if(!S)return;if(el.dataset.setting){act({type:'settings',settings:{[el.dataset.setting]:el.checked}});return;}if(el.dataset.load!==undefined){let loads=S.training.slice();loads[+el.dataset.load]=+el.value;act({type:'training',loads});return;}if(el.dataset.group){act({type:'group',id:+el.dataset.group,group:+el.value});return;}if(el.dataset.lineI!==undefined){line[+el.dataset.lineI][+el.dataset.lineJ][+el.dataset.lineK]=+el.value;S.manual=null;render();return;}if(el.dataset.tradeSide){let give=el.dataset.tradeSide==='give';if(el.dataset.pick){let [year,round,original]=el.dataset.pick.split(':').map(Number),key=give?'tradeGivePicks':'tradeGetPicks';U[key]=U[key].filter(p=>pickKey(p)!==el.dataset.pick);if(el.checked)U[key].push({year,round,original});}else{let id=+el.dataset.id,key=give?'tradeGive':'tradeGet';U[key]=U[key].filter(x=>x!==id);if(el.checked)U[key].push(id);}render();return;}switch(el.id){case 'roster-team':U.rosterTeam=+el.value;break;case 'market-type':U.marketType=el.value;U.marketPage=0;break;case 'market-search':U.marketSearch=el.value;U.marketPage=0;break;case 'trade-team':U.tradeTeam=+el.value;U.tradeGet=[];U.tradeGetPicks=[];break;case 'card-choice':act({type:'card',card:el.value});line=null;break;case 'record-scope':U.recordScope=el.value;break;case 'record-sex':U.eventSex=el.value;break;case 'record-event':U.recordEvent=el.value;break;case 'history-year':U.historyYear=+el.value;break;case 'draft-history-year':U.draftHistoryYear=+el.value;break;case 'league-week':U.leagueWeek=+el.value;break;case 'meet-mode':stopWatch();U.meetMode=el.value;break;case 'watch-event':beginWatch(+el.value);return;case 'watch-speed':if(watch)watch.speed=+el.value;return;case 'player-event':modal.event=el.value;renderModal();return;case 'health-years':U.healthYears=Math.max(1,Math.min(60,+el.value||30));el.value=U.healthYears;return;case 'health-season':U.healthIndex=el.value;break;default:return;}render();});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&modal){modal=null;renderModal();return;}if(event.key==='Enter'&&event.target.matches('th[data-sort]')){sortTable(event.target);return;}if(event.code==='Space'&&!event.repeat&&!modal&&!busy&&S&&!event.target.closest('input,select,textarea,button,th')){event.preventDefault();if(watch){watch.playing=!watch.playing;watch.last=0;render();if(watch.playing)animateWatch();else watchToken++;}else advance(false);}});
window.addEventListener('resize',()=>{if(watch)drawPool();});
async function boot(){healthSeasons=FACTORY_AUDIT.seasons||[];try{let raw=localStorage.getItem(KEY);if(raw)S=await C.decode(raw);}catch(e){storageWarning='Stored saves cannot be read here. Import an exported JSON save, or start a new franchise.';}render();window.TurnTide={getState:()=>S?E.clone(S):null,getView:()=>U.view,isBusy:()=>!!busy,getHealth:()=>healthResult?E.clone(healthResult):null,saveText:()=>C.encode(S)};}
boot();
return {render};
})();
