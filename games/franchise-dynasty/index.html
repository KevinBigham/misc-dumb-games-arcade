function makePlayer(pos,target,age,opts={}){
  const w=W[pos];const a={};

  keys.forEach((k,i)=>{

    if(w[i]===0) v=ri(25,60); // irrelevant attrs low

    if(k==='awr'&&age<24) v-=ri(2,8);
    a[k]=clamp(Math.round(v),20,99);

  const p={id:nextId++,name:opts.name||pname(),pos,age,a,college:pick(COLLEGES),exp:Math.max(0,age-22),
    tid:-1,c:null,inj:0,pot:0,s:null,career:[],awards:[],hof:false,retired:false,
    morale:ri(60,90),yrsPro:0};
  p.ovr=calcOvr(p);
  // potential: young players have headroom
  const head=age<=22?ri(5,22):age<=25?ri(2,14):age<=28?ri(0,6):0;

// Salary expectation ($M/yr) from OVR/age/pos
function askingSalary(p){
  let o=p.ovr;
  const posMult={QB:1.6,OT:1.15,DE:1.15,CB:1.1,WR:1.05,RB:.95,OLB:1,MLB:.95,DT:1,FS:.9,SS:.9,TE:.9,OG:.85,C:.85,FB:.5,K:.45,P:.4}[p.pos]||1;
  let base;
  if(o>=90) base=9+(o-90)*1.0; else if(o>=80) base=3+(o-80)*0.6; else if(o>=70) base=0.8+(o-70)*0.22; else base=0.3+(Math.max(0,o-55))*0.033;
  if(p.age>=32) base*=0.75; else if(p.age>=30) base*=0.9;
  return Math.round(base*posMult*100)/100;
}

function autoDepth(G,t){
  t.depth={};

    t.depth[pos]=t.roster.map(id=>G.players[id]).filter(p=>p.pos===pos&&!p.retired).sort((a,b)=>b.ovr-a.ovr).map(p=>p.id);
  });
  // fallback: positions with no bodies borrow nearest
  const alt={FB:['RB','TE'],TE:['WR','FB'],C:['OG','OT'],OG:['OT','C'],OT:['OG','C'],OLB:['MLB','DE'],MLB:['OLB','SS'],FS:['SS','CB'],SS:['FS','CB'],DT:['DE'],DE:['DT','OLB'],K:['P'],P:['K'],WR:['TE','RB'],RB:['FB','WR'],CB:['FS','SS'],QB:['WR']};
  POS.forEach(pos=>{
    const need=STARTERS[pos];
    if(t.depth[pos].length<need&&alt[pos]){
      for(const ap of alt[pos]){for(const id of (t.depth[ap]||[])){if(t.depth[pos].length>=need)break;if(!t.depth[pos].includes(id))t.depth[pos].push(id);}}
    }
  });
}

function fixDepth(G,t){ // keep manual order but drop missing/injured-out players and add new ones at bottom
  POS.forEach(pos=>{
    const cur=(t.depth[pos]||[]).filter(id=>G.players[id]&&t.roster.includes(id)&&!G.players[id].retired);
    const rest=t.roster.map(id=>G.players[id]).filter(p=>p.pos===pos&&!cur.includes(p.id)).sort((a,b)=>b.ovr-a.ovr).map(p=>p.id);
    t.depth[pos]=cur.concat(rest);
  });
}

  fixDepth(G,t);
  const n=STARTERS[pos];
  const healthy=(t.depth[pos]||[]).map(id=>G.players[id]).filter(p=>p&&p.inj===0);
  let list=healthy.slice(0,n);
  if(list.length<n){ // emergency: any healthy player
    const any=t.roster.map(id=>G.players[id]).filter(p=>p.inj===0&&!list.includes(p)).sort((a,b)=>b.ovr-a.ovr);
    while(list.length<n&&any.length)list.push(any.shift());
  }
  return list;
}

  const o=pos=>ovrAt(G,t,pos);
  const ol=(o('OT')*2+o('OG')*2+o('C'))/5;
  const lb=(o('OLB')*2+o('MLB'))/3, s=(o('FS')+o('SS'))/2;
  const hc=t.staff.HC.rating, oc=t.staff.OC.rating, dc=t.staff.DC.rating;
  const passOff=o('QB')*.45+o('WR')*.25+o('TE')*.1+ol*.2+(oc-70)*.08;

// ---------- Draft class ----------
function genDraftClass(G){
  const out=[];const n=260;
  for(let i=0;i<n;i++){
    const pos=pick(POS.filter(p=>p!=='K'&&p!=='P').concat(i%40===0?['K','P']:[]));
    const tier=R();
    const tgt=tier<0.04?ri(74,82):tier<0.2?ri(66,75):tier<0.55?ri(58,68):ri(46,60);
    const p=makePlayer(pos,tgt,ri(21,23));
    p.pot=clamp(p.ovr+ri(2,25)+(tier<0.2?ri(0,8):0),p.ovr,99);
    p.yrsPro=0;p.exp=0;p.tid=-3;
    p.scouted=0; // 0..3 levels; scouted ratings have noise
    const noise=ri(-7,7),noise2=ri(-10,10);
    p.sOvr=clamp(p.ovr+noise,40,99);p.sPot=clamp(p.pot+noise2,p.sOvr,99);
    p.proj=0;p.combine={forty:(4.35+(99-p.a.spd)*0.012+rf(-.05,.05)).toFixed(2),bench:Math.round(8+(p.a.str-40)*0.45+ri(-3,3))};
    out.push(p);
  }
  // projected ranks by scouted value
  out.sort((a,b)=>(b.sOvr*0.6+b.sPot*0.4)-(a.sOvr*0.6+a.sPot*0.4)).forEach((p,i)=>p.proj=i+1);
  out.forEach(p=>{G.players[p.id]=p;});
  return out.map(p=>p.id);
}

// ---------- Schedule (16 games, 17 weeks, 1 bye) ----------
function genSchedule(G){
  const T=G.teams;
  for(let attempt=0;attempt<400;attempt++){
    const pairs=[];
    // division double round robin
    for(const t of T)for(const u of T){if(t.id<u.id&&t.conf===u.conf&&t.div===u.div){pairs.push([t.id,u.id]);pairs.push([u.id,t.id]);}}
    // 10 more, structured like a real league rotation:
    //  4 vs one full in-conference division, 2 vs the other two in-conference divisions (1 each, index-matched),
    //  4 vs one full cross-conference division
    const extra=[];
    const divTeams=(c,d)=>shuffle(T.filter(t=>t.conf===c&&t.div===d));
    const yr=(G.season||0)+attempt;
    const home=(a,b)=>extra.push(R()<.5?[a.id,b.id]:[b.id,a.id]);
    CONFS.forEach((c,ci)=>{
      const rot=yr%3; // full-division partner rotation: 3 possible pairings of 4 divisions
      const pairings=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]][rot];
      pairings.forEach(([x,y])=>{const A=divTeams(c,DIVS[x]),B=divTeams(c,DIVS[y]);A.forEach(a=>B.forEach(b=>home(a,b)));});
      // the other two divisions: 1 game each, index-matched
      const others=[[[0,2],[0,3],[1,2],[1,3]],[[0,1],[0,3],[2,1],[2,3]],[[0,1],[0,2],[3,1],[3,2]]][rot];
      others.forEach(([x,y])=>{const A=divTeams(c,DIVS[x]),B=divTeams(c,DIVS[y]);A.forEach((a,i)=>home(a,B[i]));});
    });
    // cross-conference: division i of Atlantic vs division perm[i] of Pacific
    const perm=[0,1,2,3].map(i=>(i+yr)%4);
    DIVS.forEach((d,i)=>{const A=divTeams('Atlantic',d),B=divTeams('Pacific',DIVS[perm[i]]);A.forEach(a=>B.forEach(b=>home(a,b)));});
    const all=shuffle(pairs.concat(extra)); // 256 games, every team degree 16
    // Edge-color with 17 colors (weeks) via Kempe-chain swaps: each team misses exactly one week = bye
    const K=17;const n=T.length;
    const col=all.map(()=>-1);
    const at=Array.from({length:n},()=>Array(K).fill(-1)); // at[team][color]=edge index
    const free=(t)=>{for(let c=0;c<K;c++)if(at[t][c]<0)return c;return -1;};
    const freeC=(t,c)=>at[t][c]<0;
    let fail=false;
    for(let e=0;e<all.length;e++){
      const [u,v]=all[e];
      const fu=[],fv=[];for(let c=0;c<K;c++){if(at[u][c]<0)fu.push(c);if(at[v][c]<0)fv.push(c);}
      const common=fu.find(c=>fv.includes(c));
      if(common!=null){col[e]=common;at[u][common]=e;at[v][common]=e;continue;}
      // Kempe chain: for free a at u and free b at v, flip the a/b path starting at v unless it ends at u
      let done=false;
      outer: for(const a of fu)for(const b of fv){
        const chain=[];let cur=v,c=a;
        while(at[cur][c]>=0){const ei=at[cur][c];chain.push(ei);const [x,y]=all[ei];cur=x===cur?y:x;c=c===a?b:a;}
        if(cur===u)continue;
        for(const ei of chain){const [x,y]=all[ei];const oc=col[ei];at[x][oc]=-1;at[y][oc]=-1;col[ei]=oc===a?b:a;}
        for(const ei of chain){const [x,y]=all[ei];at[x][col[ei]]=ei;at[y][col[ei]]=ei;}
        col[e]=a;at[u][a]=e;at[v][a]=e;done=true;break outer;
      }
      if(!done){fail=true;break;}
    }
    if(fail)continue;
    const weeks=Array.from({length:K},()=>[]);
    const order=shuffle([...Array(K).keys()]);
    all.forEach((g,e)=>{weeks[order[col[e]]].push({home:g[0],away:g[1],hs:null,as:null,ot:false});});
    return weeks;
  }
  throw new Error('schedule gen failed');
}
FD.genSchedule=genSchedule;

      desc=rc.name+' rushes for '+yds;

      else{const tk=tackler(starterSets[o]);ps(tk).tkl++;}

      injuryCheck(d,rc);
    }
    box[d].yds+=yds;
    L('    '+(down)+(down===1?'st':down===2?'nd':down===3?'rd':'th')+' & '+dist+' at '+(yl<50?T[d].abbr+' '+yl:yl===50?'50':T[o].abbr+' '+(100-yl))+': '+desc);

// ---------- Standings ----------
function standings(G){
  const pct=t=>(t.w+0.5*t.t)/Math.max(1,t.w+t.l+t.t);
  const cmp=(a,b)=>pct(b)-pct(a)||((b.divw-b.divl)-(a.divw-a.divl))||((b.confw-b.confl)-(a.confw-a.confl))||((b.pf-b.pa)-(a.pf-a.pa))||(b.pf-a.pf);
  const all=[...G.teams].sort(cmp);
  const byDiv={};const byConf={};
  FD.C.CONFS.forEach(c=>{byConf[c]=all.filter(t=>t.conf===c);FD.C.DIVS.forEach(d=>{byDiv[c+' '+d]=all.filter(t=>t.conf===c&&t.div===d);});});

function prodScore(p){const s=p.s;return s.py*0.055+s.ptd*4.5-s.pint*2.5+s.ry*0.1+s.rtd*6+s.recy*0.1+s.rectd*6;}

function updateRecords(G){
  const RB=G.recordBook;
  const cats=[['py','Passing yards'],['ptd','Passing TD'],['ry','Rushing yards'],['rtd','Rushing TD'],['recy','Receiving yards'],['rec','Receptions'],['rectd','Receiving TD'],['sck','Sacks'],['dint','Interceptions'],['tkl','Tackles'],['fgm','Field goals']];
  cats.forEach(([k,label])=>{
    const best=Object.values(G.players).filter(p=>p.tid>=0).sort((a,b)=>b.s[k]-a.s[k])[0];
    if(best&&(!RB[k]||best.s[k]>RB[k].val)){RB[k]={label,val:best.s[k],name:best.name,season:G.season,team:G.teams[best.tid].abbr};if(RB[k].val>0&&G.seasonsPlayed>0)news(G,'league','RECORD: '+best.name+' sets the single-season '+label.toLowerCase()+' record with '+best.s[k]+'.',best.tid);}
  });
  const bestW=[...G.teams].sort((a,b)=>b.w-a.w)[0];
  if(!RB.wins||bestW.w>RB.wins.val)RB.wins={label:'Wins',val:bestW.w,name:tname(G,bestW.id),season:G.season,team:bestW.abbr};
}
FD.updateRecords=updateRecords;

// ---------- Owner finances ----------
function yearEndFinance(G,t){
  const f=t.fin;
  const tv=85;const merch=(f.fan/100)*f.merch*0.9+(t.poResult==='CHAMPION'?12:0);
  const gate=f.rev;
  const rev=tv+merch+gate+(f.stadium/100)*8;
  const pay=FD.payroll(G,t);const staff=t.staff.HC.sal+t.staff.OC.sal+t.staff.DC.sal;
  const upkeep=4+f.capacity/20000;
  const exp=pay+staff+upkeep;
  const profit=rev-exp;
  f.funds=Math.round((f.funds+profit)*100)/100;
  f.last={season:G.season,tv,merch:Math.round(merch*10)/10,gate:Math.round(gate*10)/10,rev:Math.round(rev*10)/10,pay:Math.round(pay*10)/10,staff:Math.round(staff*10)/10,upkeep:Math.round(upkeep*10)/10,exp:Math.round(exp*10)/10,profit:Math.round(profit*10)/10,avgAtt:Math.round(avg(f.attendance)||0)};
  f.rev=0;f.exp=0;f.attendance=[];
  f.stadium=clamp(f.stadium-2,10,100); // aging
  if(f.fan<30)f.lowFanYrs++;else f.lowFanYrs=0;
  // CPU teams set sensible prices
  if(t.id!==G.userTid){f.ticket=clamp(Math.round(45+f.fan*0.3+(t.w-8)),35,110);if(f.funds>80&&f.stadium<60){f.funds-=40;f.stadium+=25;}}
}
FD.yearEndFinance=yearEndFinance;
function upgradeStadium(G,t,kind){
  const f=t.fin;const cost={renovate:40,expand:60,rebuild:250}[kind];
  if(f.funds<cost)return 'Not enough funds ('+FD.u.money(f.funds)+' available, need '+FD.u.money(cost)+').';
  f.funds-=cost;
  if(kind==='renovate'){f.stadium=clamp(f.stadium+20,0,100);}
  if(kind==='expand'){f.capacity+=6000;f.stadium=clamp(f.stadium+5,0,100);}
  if(kind==='rebuild'){f.stadium=100;f.capacity=Math.max(f.capacity,72000);f.fan=clamp(f.fan+15,0,99);news(G,'front',t.city+' breaks ground on a brand-new stadium.',t.id);}
  return null;
}
FD.upgradeStadium=upgradeStadium;
function relocate(G,t,city,name,abbr){
  const old=t.city+' '+t.name;
  t.city=city;t.name=name;t.abbr=abbr.toUpperCase().slice(0,3);
  t.fin.fan=clamp(55+ri(-5,15),0,99);t.fin.lowFanYrs=0;t.fin.stadium=90;t.fin.funds-=100;
  news(G,'front','RELOCATION: The '+old+' are moving. Say hello to the '+city+' '+name+'.',t.id);
}
FD.relocate=relocate;

// ---------- Coaching staff ----------
function staffOffseason(G){
  G.teams.forEach(t=>{
    ['HC','OC','DC'].forEach(r=>{const c=t.staff[r];c.yrs--;c.age++;c.rating=clamp(c.rating+ri(-3,3),40,99);
      if(c.yrs<=0){if(t.id===G.userTid){c.expired=true;}else{ // CPU: renew or replace
        if(c.rating>=65||Math.random()<.5){c.yrs=ri(2,4);}else{t.staff[r]=FD.makeCoach(r);news(G,'league',tname(G,t.id)+' hire '+t.staff[r].name+' as '+r+'.',t.id);}
      }}
      if(t.id!==G.userTid&&r==='HC'&&t.w<=4&&Math.random()<.6){t.staff.HC=FD.makeCoach('HC');news(G,'league',tname(G,t.id)+' fire their head coach after a '+t.w+'-'+t.l+' season.',t.id);}
    });
  });
  // refresh pool
  G.coachPool=G.coachPool.filter(()=>Math.random()<.6);
  while(G.coachPool.length<18)G.coachPool.push(FD.makeCoach(pick(['HC','OC','DC'])));
}
function hireCoach(G,t,poolIdx){
  const c=G.coachPool[poolIdx];if(!c)return 'No such coach.';
  const cost=c.sal*2;
  const old=t.staff[c.role];
  t.staff[c.role]={...c,yrs:ri(2,4),expired:false};
  G.coachPool.splice(poolIdx,1);
  if(old)G.coachPool.push({...old,yrs:0,expired:false});
  news(G,'front',tname(G,t.id)+' hire '+c.name+' as '+c.role+'.',t.id);
  return null;
}
FD.hireCoach=hireCoach;
function renewCoach(G,t,role){const c=t.staff[role];c.yrs=3;c.expired=false;c.sal=Math.round(c.sal*1.1*100)/100;}
FD.renewCoach=renewCoach;

// ---------- Retirement & progression ----------
function retirements(G){
  const retired=[];
  Object.values(G.players).forEach(p=>{
    if(p.retired)return;
    if(G.prospects.includes(p.id))return;
    const late=['QB','K','P'].includes(p.pos)?4:0;
    let prob=0;
    if(p.age>=30+late)prob=(p.age-29-late)*0.13;
    if(p.ovr<60&&p.age>=27)prob+=0.25;
    if(p.tid===-1&&p.age>=29)prob+=0.3;
    if(p.tid===-1&&p.ovr<64)prob+=0.5;
    if(Math.random()<prob){
      p.retired=true;retired.push(p);
      if(p.tid>=0){const t=G.teams[p.tid];t.roster=t.roster.filter(id=>id!==p.id);if(p.c&&p.c.bonus)t.dead=(t.dead||0)+p.c.bonus*Math.max(0,p.c.yrs-1);}
      const score=hofScore(p);
      if(score>=100){p.hof=true;G.hof.unshift({id:p.id,name:p.name,pos:p.pos,season:G.season,score:Math.round(score)});news(G,'front',p.name+' retires and heads straight to the Hall of Fame.',p.tid);}
      else if(p.ovr>=85||p.awards.length)news(G,'league',p.name+' ('+p.pos+', age '+p.age+') announces his retirement.',p.tid);
      p.tid=-2;
    }
  });
  // prune forgettable retirees to keep the save small
  Object.values(G.players).forEach(p=>{if(p.retired&&!p.hof&&!p.awards.length&&!p.career.some(c=>c.ovr>=85)&&!p.draft)delete G.players[p.id];});
  return retired;
}
function hofScore(p){
  const c=p.career;const tot=k=>sum(c.map(s=>s[k]||0));
  let sc=tot('py')/400+tot('ptd')*1.2+tot('ry')/100+tot('rtd')*1.5+tot('recy')/100+tot('rectd')*1.5+tot('sck')*1.2+tot('dint')*1.5+tot('tkl')/25+tot('fgm')/4;
  sc+=p.awards.filter(a=>a.a==='MVP').length*25+p.awards.filter(a=>a.a!=='MVP').length*10;
  const seasons85=c.filter(s=>s.ovr>=85).length;sc+=seasons85*4;
  return sc;
}
FD.hofScore=hofScore;
function progression(G){
  const changes=[];
  Object.values(G.players).forEach(p=>{
    if(p.retired||G.prospects.includes(p.id))return;
    const late=['QB','K','P'].includes(p.pos)?3:0;
    const a=p.age-late;
    let g;
    if(a<=23)g=ri(0,3)+(p.pot-p.ovr>10?ri(1,3):0);
    else if(a<=27)g=ri(-1,2)+(p.pot-p.ovr>6?1:0);
    else if(a<=30)g=ri(-2,1);
    else if(a<=33)g=ri(-5,-1);
    else g=ri(-8,-3);
    if(p.tid>=0){const t=G.teams[p.tid];const hc=t.staff.HC.rating;const coord=FD.C.OFF_POS.includes(p.pos)?t.staff.OC.rating:t.staff.DC.rating;g+=Math.round((hc-70)/15+(coord-70)/20);
      if(t.campBoost&&t.campBoost[p.id])g+=t.campBoost[p.id];}
    const old=p.ovr;
    ['spd','str','agi','awr','skl'].forEach(k=>{let d=g+ri(-1,1);if(k==='awr'&&a<27)d+=1;if(k==='spd'&&a>=29)d-=1;p.a[k]=clamp(p.a[k]+d,20,99);});
    p.ovr=FD.calcOvr(p);
    if(p.ovr>p.pot&&a<=27)p.ovr=p.pot,p.a.awr=Math.max(20,p.a.awr-(p.ovr-p.pot));
    p.ovr=FD.calcOvr(p);
    if(a>=27)p.pot=Math.max(p.ovr,p.pot-ri(1,4));
    if(p.ovr>p.pot)p.pot=p.ovr;
    p.age++;p.yrsPro++;p.exp++;
    if(p.c)p.c.yrs--;
    if(Math.abs(p.ovr-old)>=4&&p.tid===G.userTid)changes.push({p,old});
  });
  G.teams.forEach(t=>{t.campBoost=null;});
  return changes;
}

// ---------- Re-signing ----------
function expiringPlayers(G,t){return t.roster.map(id=>G.players[id]).filter(p=>p.c&&p.c.yrs<=0);}
FD.expiringPlayers=expiringPlayers;
function resignOffer(G,p,yrs,sal){
  // player accepts if offer >= asking*(mood) ; returns true/false
  const ask=FD.askingSalary(p);
  const tol=(p.morale-50)/400; // happier players take less
  return sal>=ask*(0.95-tol)&&yrs>=1;
}
FD.resignOffer=resignOffer;
function cpuResign(G){
  G.teams.forEach(t=>{if(t.id===G.userTid)return;
    expiringPlayers(G,t).forEach(p=>{
      const ask=FD.askingSalary(p);
      const keep=p.ovr>=74&&p.age<=32&&FD.capRoom(G,t)-FD.capHit(p)+ask<G.cap*0.15?Math.random()<.85:p.ovr>=68&&Math.random()<.4;
      if(keep&&FD.capRoom(G,t)+FD.capHit(p)>=ask){FD.giveContract(p,FD.askingYears(p),ask,ask*rf(0,1));}
      else releasePlayer(G,p,true);
    });
  });
}
function releasePlayer(G,p,expired){
  const t=G.teams[p.tid];if(!t)return;
  t.roster=t.roster.filter(id=>id!==p.id);
  if(!expired&&p.c&&p.c.bonus&&p.c.yrs>0)t.dead=(t.dead||0)+p.c.bonus*p.c.yrs;
  p.tid=-1;p.c=null;p.morale=clamp(p.morale-10,0,100);
  FD.fixDepth(G,t);
}
FD.releasePlayer=releasePlayer;
function userResign(G,p,yrs,sal){
  if(!resignOffer(G,p,yrs,sal))return 'He turned it down. His agent is asking for about '+FD.u.money(FD.askingSalary(p))+'/yr.';
  const t=G.teams[G.userTid];
  if(FD.capRoom(G,t)+FD.capHit(p)<sal)return 'Not enough cap room.';
  FD.giveContract(p,yrs,sal,sal*0.5);p.morale=clamp(p.morale+8,0,100);
  news(G,'front',tname(G,t.id)+' re-sign '+p.name+' ('+p.pos+') for '+yrs+' yrs, '+FD.u.money(sal)+'/yr.',t.id);
  return null;
}
FD.userResign=userResign;
function finishResignPhase(G){ // user's unresigned expiring players hit FA
  const t=G.teams[G.userTid];expiringPlayers(G,t).forEach(p=>releasePlayer(G,p,true));
}

// ---------- Free agency ----------
function freeAgents(G){return Object.values(G.players).filter(p=>p.tid===-1&&!p.retired);}
FD.freeAgents=freeAgents;
function teamNeeds(G,t){
  const need={};POS.forEach(pos=>{const have=t.roster.map(id=>G.players[id]).filter(p=>p.pos===pos);const top=have.sort((a,b)=>b.ovr-a.ovr);
    const starterQ=avg(top.slice(0,STARTERS[pos]).map(p=>p.ovr))||40;const depthGap=ROSTER_COMP[pos]-have.length;
    need[pos]=(80-starterQ)*1.2+depthGap*8;});
  return need;
}
FD.teamNeeds=teamNeeds;
function userFAOffer(G,p,yrs,sal){
  const t=G.teams[G.userTid];
  if(t.roster.length>=53)return 'Roster is full (53). Release someone first.';
  if(FD.capRoom(G,t)<sal)return 'Not enough cap room.';
  const ask=FD.askingSalary(p);
  const interest=0.9+(t.prestige-60)/400+(G.playoffs&&G.playoffs.champion===t.id?0.05:0);
  const diffMult={rookie:0.85,pro:1,allpro:1.12}[G.difficulty]||1;
  if(sal<ask*interest*diffMult*(1-G.freeAgentDay*0.06))return 'Offer rejected. He is looking for about '+FD.u.money(ask*interest*diffMult)+'/yr (asking prices drop each FA day).';
  signFA(G,t,p,yrs,sal);
  news(G,'front',tname(G,t.id)+' sign free agent '+p.name+' ('+p.pos+', '+p.ovr+' OVR) — '+yrs+' yrs, '+FD.u.money(sal)+'/yr.',t.id);
  return null;
}
FD.userFAOffer=userFAOffer;
function signFA(G,t,p,yrs,sal){p.tid=t.id;t.roster.push(p.id);FD.giveContract(p,yrs,sal,sal*0.4);FD.fixDepth(G,t);}
function cpuFADay(G){
  const fas=freeAgents(G).sort((a,b)=>b.ovr-a.ovr);
  const order=shuffle(G.teams.filter(t=>t.id!==G.userTid));
  order.forEach(t=>{
    const need=teamNeeds(G,t);
    let signed=0;
    for(const p of fas){
      if(signed>=2||p.tid!==-1)continue;
      if(t.roster.length>=53)break;
      const ask=FD.askingSalary(p)*(1-G.freeAgentDay*0.06);
      if(need[p.pos]<8&&p.ovr<78)continue;
      if(FD.capRoom(G,t)<ask+1)continue;
      const want=p.ovr>=74||need[p.pos]>20;
      if(want&&Math.random()<0.7){signFA(G,t,p,FD.askingYears(p),ask);signed++;if(p.ovr>=80)news(G,'league',tname(G,t.id)+' land free agent '+p.name+' ('+p.pos+', '+p.ovr+' OVR).',t.id);need[p.pos]-=15;}
    }
  });
  G.freeAgentDay++;
}
FD.cpuFADay=cpuFADay;

// ---------- Draft ----------
function draftOrder(G){
  const st=FD.standings(G);
  const nonPO=st.all.filter(t=>!t.poResult||t.poResult==='').reverse();
  const po=st.all.filter(t=>t.poResult&&t.poResult!=='');
  const rank=r=>({'Lost Wild Card':1,'Lost Divisional':2,'Lost Conference Championship':3,'Conference Champion':4,'CHAMPION':5})[r]||0;
  po.sort((a,b)=>rank(a.poResult)-rank(b.poResult)||st.pct(a)-st.pct(b));
  return nonPO.concat(po).map(t=>t.id);
}
function startDraft(G){
  const order=draftOrder(G);
  const picks=[];
  for(let r=1;r<=7;r++)order.forEach((tid,i)=>{
    // find who owns this pick
    const owner=G.teams.find(t=>t.picks.some(pk=>pk.season===G.season&&pk.round===r&&pk.orig===tid))||G.teams[tid];
    picks.push({round:r,no:(r-1)*32+i+1,orig:tid,tid:owner.id,pid:null});
  });
  G.draft={picks,cur:0,done:false,order};
  G.teams.forEach(t=>{t.picks=t.picks.filter(pk=>pk.season!==G.season);for(let r=1;r<=7;r++)t.picks.push({season:G.season+3,round:r,orig:t.id});});
  G.phase='draft';
  news(G,'front','The '+(G.season+1)+' Draft is underway. '+tname(G,order[0])+' are on the clock with the #1 pick.');
}
function prospectValue(G,p,need){return p.sOvr*0.55+p.sPot*0.45+(need?need[p.pos]*0.25:0)-(p.pos==='K'||p.pos==='P'?12:0)-(p.pos==='FB'?6:0);}
function cpuPick(G,t){
  const need=teamNeeds(G,t);
  const avail=G.prospects.map(id=>G.players[id]).filter(p=>p.tid===-3);
  avail.sort((a,b)=>prospectValue(G,b,need)+Math.random()*4-prospectValue(G,a,need));
  return avail[0];
}
function makePick(G,pid){
  const D=G.draft;const pk=D.picks[D.cur];const p=G.players[pid];const t=G.teams[pk.tid];
  pk.pid=pid;p.tid=t.id;p.draft={season:G.season,round:pk.round,no:pk.no,team:t.abbr};
  t.roster.push(pid);FD.rookieContract(p,pk.round,pk.no);FD.fixDepth(G,t);
  if(pk.round===1)news(G,'league','Round 1, pick '+pk.no+': '+tname(G,t.id)+' select '+p.name+', '+p.pos+', '+p.college+'.',t.id);
  D.cur++;
  if(D.cur>=D.picks.length){finishDraft(G);}
}
function finishDraft(G){
  const D=G.draft;D.done=true;
  // undrafted → FA pool (true ratings revealed), prospects cleared
  G.prospects.forEach(id=>{const p=G.players[id];if(p.tid===-3){p.tid=-1;p.scouted=3;}delete p.sOvr;delete p.sPot;});
  G.prospects=[];
  news(G,'front','Draft complete. Rookies report to camp.');
}
function draftAdvance(G){ // run CPU picks until user's pick or end
  const D=G.draft;
  while(!D.done){
    const pk=D.picks[D.cur];
    if(pk.tid===G.userTid)return 'user';
    const p=cpuPick(G,G.teams[pk.tid]);
    makePick(G,p.id);
  }
  return 'done';
}
FD.draftAdvance=draftAdvance;FD.makePick=makePick;FD.startDraft=startDraft;
function scoutProspect(G,pid){
  const t=G.teams[G.userTid];const p=G.players[pid];
  if(t.scout<5)return 'Out of scouting points.';
  if(p.scouted>=3)return 'Fully scouted.';
  t.scout-=5;p.scouted++;
  const f=p.scouted/3;
  p.sOvr=Math.round(p.sOvr+(p.ovr-p.sOvr)*f+ri(-1,1)*(1-f)*3);p.sPot=Math.round(p.sPot+(p.pot-p.sPot)*f);
  if(p.scouted>=3){p.sOvr=p.ovr;p.sPot=p.pot;}
  return null;
}
FD.scoutProspect=scoutProspect;

// ---------- Training camp ----------
function campAllocate(G,alloc){ // alloc: {posGroup: points}
  const t=G.teams[G.userTid];
  const groups={QB:['QB'],RB:['RB','FB'],WR:['WR','TE'],OL:['OT','OG','C'],DL:['DE','DT'],LB:['OLB','MLB'],DB:['CB','FS','SS'],ST:['K','P']};
  t.campBoost={};
  let spent=0;
  for(const g in alloc){const pts=alloc[g]|0;if(pts<=0)continue;spent+=pts;
    t.roster.map(id=>G.players[id]).filter(p=>groups[g]&&groups[g].includes(p.pos)).forEach(p=>{
      // young players benefit more
      const b=Math.random()<0.5+pts*0.08?(p.age<=26?ri(1,2):1):0;
      t.campBoost[p.id]=b;
    });
  }
  t.camp=Math.max(0,t.camp-spent);
  return Object.values(t.campBoost).filter(x=>x>0).length;
}
FD.campAllocate=campAllocate;
function cpuCamp(G){G.teams.forEach(t=>{if(t.id===G.userTid)return;t.campBoost={};t.roster.forEach(id=>{if(Math.random()<.2)t.campBoost[id]=1;});});}

// ---------- Trades ----------
function playerValue(G,p){
  let v=Math.pow(Math.max(0,p.ovr-50)/10,2.6)*10;
  const youth=p.age<=25?1.25:p.age<=28?1.05:p.age<=30?0.85:p.age<=32?0.6:0.35;
  v*=youth;
  if(p.age<=25)v+=Math.max(0,p.pot-p.ovr)*2.5;
  if(p.pos==='QB')v*=1.4;if(p.pos==='K'||p.pos==='P'||p.pos==='FB')v*=0.35;
  const over=p.c?FD.capHit(p)-FD.askingSalary(p):0;v-=Math.max(0,over)*6;
  return Math.max(1,v);
}
function pickValue(G,pk){
  const t=G.teams[pk.orig];const pct=t.w/Math.max(1,t.w+t.l);
  const base={1:120,2:60,3:32,4:18,5:10,6:6,7:4}[pk.round];
  const adj=pk.round===1?(1.6-pct*1.2):1;
  const future=pk.season>G.season?0.8:1;
  return base*adj*future;
}
FD.playerValue=playerValue;FD.pickValue=pickValue;
function evaluateTrade(G,userGive,userGet,partnerId){
  // userGive/userGet: {players:[ids],picks:[pick objs]}
  const t=G.teams[partnerId];const u=G.teams[G.userTid];
  const need=teamNeeds(G,t);
  const val=(pkg,forTeam,needs)=>sum(pkg.players.map(id=>{const p=G.players[id];return playerValue(G,p)*(needs?(1+clamp(needs[p.pos],-10,40)/80):1);}))+sum(pkg.picks.map(pk=>pickValue(G,pk)));
  const give=val(userGive,t,need),get=val(userGet,u,null);
  const mult={rookie:0.9,pro:1.05,allpro:1.25}[G.difficulty]||1.05;
  // roster/cap feasibility
  const tIn=sum(userGive.players.map(id=>FD.capHit(G.players[id]))),tOut=sum(userGet.players.map(id=>FD.capHit(G.players[id])));
  const uIn=tOut,uOut=tIn;
  const problems=[];
  if(FD.capRoom(G,t)+tOut-tIn<0)problems.push(t.abbr+' cannot fit the salary.');
  if(FD.capRoom(G,u)+uOut-uIn<0)problems.push('You cannot fit the salary.');
  if(t.roster.length-userGet.players.length+userGive.players.length>53)problems.push(t.abbr+' roster would exceed 53.');
  if(u.roster.length-userGive.players.length+userGet.players.length>53)problems.push('Your roster would exceed 53.');
  const accept=give>=get*mult&&problems.length===0;
  return {give:Math.round(give),get:Math.round(get),need:Math.round(get*mult),accept,problems};
}
FD.evaluateTrade=evaluateTrade;
function executeTrade(G,userGive,userGet,partnerId){
  const t=G.teams[partnerId],u=G.teams[G.userTid];
  const move=(ids,from,to)=>ids.forEach(id=>{const p=G.players[id];from.roster=from.roster.filter(x=>x!==id);to.roster.push(id);p.tid=to.id;if(p.c&&p.c.bonus){from.dead=(from.dead||0)+p.c.bonus*p.c.yrs;p.c.bonus=0;}});
  move(userGive.players,u,t);move(userGet.players,t,u);
  const movePk=(pks,from,to)=>pks.forEach(pk=>{from.picks=from.picks.filter(x=>!(x.season===pk.season&&x.round===pk.round&&x.orig===pk.orig));to.picks.push({...pk});});
  movePk(userGive.picks,u,t);movePk(userGet.picks,t,u);
  FD.fixDepth(G,t);FD.fixDepth(G,u);
  const d=(pkg)=>pkg.players.map(id=>G.players[id].name).concat(pkg.picks.map(pk=>pk.season+' R'+pk.round)).join(', ')||'nothing';
  news(G,'front','TRADE: '+u.name+' send '+d(userGive)+' to '+t.city+' for '+d(userGet)+'.',u.id);
}
FD.executeTrade=executeTrade;
function cpuTrades(G){ // light CPU-CPU activity in offseason
  if(Math.random()<.5)return;
  const a=pick(G.teams),b=pick(G.teams);if(a===b||a.id===G.userTid||b.id===G.userTid)return;
  const pa=a.roster.map(id=>G.players[id]).filter(p=>p.ovr>=72&&p.ovr<=84&&p.age<=30);const pb=b.roster.map(id=>G.players[id]).filter(p=>p.ovr>=72&&p.ovr<=84&&p.age<=30);
  if(!pa.length||!pb.length)return;const x=pick(pa),y=pick(pb);
  if(Math.abs(playerValue(G,x)-playerValue(G,y))>20)return;
  a.roster=a.roster.filter(i=>i!==x.id);b.roster=b.roster.filter(i=>i!==y.id);a.roster.push(y.id);b.roster.push(x.id);x.tid=b.id;y.tid=a.id;FD.fixDepth(G,a);FD.fixDepth(G,b);
  news(G,'league','TRADE: '+tname(G,a.id)+' acquire '+y.name+' ('+y.pos+') from '+b.city+' for '+x.name+' ('+x.pos+').',a.id);
}

// ---------- CPU roster management ----------
function cpuRosterFix(G){
  G.teams.forEach(t=>{
    if(t.id===G.userTid)return;
    // cut to 53, worst first (never below starter minimum at a position)
    while(t.roster.length>53){const w=surplusWorst(G,t);if(!w)break;releasePlayer(G,w,false);}
    // cap compliance: release the most overpaid surplus players
    let guard=0;while(FD.payroll(G,t)>G.cap&&guard++<20){const cands=t.roster.map(id=>G.players[id]).filter(p=>p.c&&countPos(G,t,p.pos)>STARTERS[p.pos]).sort((a,b)=>(FD.capHit(b)-FD.askingSalary(b))-(FD.capHit(a)-FD.askingSalary(a)));if(!cands.length)break;releasePlayer(G,cands[0],false);}
    // fill holes from FA with min contracts
    POS.forEach(pos=>{let have=countPos(G,t,pos);
      while(have<Math.max(STARTERS[pos],Math.round(ROSTER_COMP[pos]*0.85))&&t.roster.length<53){
        let fa=freeAgents(G).filter(p=>p.pos===pos&&FD.askingSalary(p)<=Math.max(0.5,FD.capRoom(G,t)-0.3)).sort((a,b)=>b.ovr-a.ovr)[0];
        if(!fa){fa=FD.makePlayer(pos,ri(48,62),ri(23,29));G.players[fa.id]=fa;FD.bumpId(G);}
        signFA(G,t,fa,1,Math.min(FD.askingSalary(fa),Math.max(0.23,FD.capRoom(G,t)-0.3)));have++;
      }});
    FD.autoDepth(G,t);
  });
}
function countPos(G,t,pos){return t.roster.reduce((n,id)=>n+(G.players[id].pos===pos?1:0),0);}
function surplusWorst(G,t){return t.roster.map(id=>G.players[id]).filter(p=>countPos(G,t,p.pos)>STARTERS[p.pos]).sort((a,b)=>a.ovr-b.ovr)[0];}
FD.countPos=countPos;FD.surplusWorst=surplusWorst;
FD.cpuRosterFix=cpuRosterFix;
function userRosterProblems(G){
  const t=G.teams[G.userTid];const out=[];
  if(t.roster.length>53)out.push('Roster is over 53 ('+t.roster.length+'). Release players.');
  if(FD.payroll(G,t)>G.cap)out.push('Over the salary cap by '+FD.u.money(FD.payroll(G,t)-G.cap)+'.');
  POS.forEach(pos=>{const n=t.roster.map(id=>G.players[id]).filter(p=>p.pos===pos).length;if(n<STARTERS[pos])out.push('Not enough '+pos+' ('+n+'/'+STARTERS[pos]+' needed).');});
  if(t.roster.length<45)out.push('Roster is thin ('+t.roster.length+'); you need at least 45.');
  return out;
}
FD.userRosterProblems=userRosterProblems;
function autoFillUser(G){ // sign min-salary FAs to meet minimums
  const t=G.teams[G.userTid];
  POS.forEach(pos=>{let have=t.roster.map(id=>G.players[id]).filter(p=>p.pos===pos).length;
    while(have<STARTERS[pos]||(t.roster.length<45&&have<ROSTER_COMP[pos])){
      if(t.roster.length>=53){const w=surplusWorst(G,t);if(!w||w.pos===pos)return;releasePlayer(G,w,false);}
      let fa=freeAgents(G).filter(p=>p.pos===pos&&FD.askingSalary(p)<=0.6).sort((a,b)=>b.ovr-a.ovr)[0];
      if(!fa){fa=FD.makePlayer(pos,ri(48,60),ri(23,29));G.players[fa.id]=fa;FD.bumpId(G);}
      signFA(G,t,fa,1,0.3);have++;if(t.roster.length>=53)return;
    }});
}
FD.autoFillUser=autoFillUser;

// ---------- Phase machine ----------
const PHASES=['regular','playoffs','awards','retire','progress','resign','freeagency','draft','camp','preseason'];
FD.PHASES=PHASES;
function phaseLabel(ph){return {regular:'Regular Season',playoffs:'Playoffs',awards:'Awards',retire:'Retirements',progress:'Player Progression',resign:'Re-Sign Players',freeagency:'Free Agency',draft:'Draft',camp:'Training Camp',preseason:'Preseason'}[ph]||ph;}
FD.phaseLabel=phaseLabel;
function advancePhase(G){
  const ph=G.phase;
  switch(ph){
    case 'awards':{ G.offseason={retired:retirements(G)};staffOffseason(G);G.phase='retire';break; }
    case 'retire':{ G.offseason.changes=progression(G);G.phase='progress';break; }
    case 'progress':{ cpuResign(G);G.phase='resign';break; }
    case 'resign':{ finishResignPhase(G);G.freeAgentDay=0;G.phase='freeagency';for(let i=0;i<3;i++)cpuTrades(G);break; }
    case 'freeagency':{ // user ends FA; run remaining CPU days
      while(G.freeAgentDay<5)cpuFADay(G);
      startDraft(G);break; }
    case 'draft':{ if(!G.draft.done)draftAdvance(G);if(!G.draft.done)return 'draft';G.teams.forEach(t=>{t.scout=60;t.camp=10;});G.phase='camp';break; }
    case 'camp':{ cpuCamp(G);G.phase='preseason';cpuRosterFix(G);break; }
    case 'preseason':{ const probs=userRosterProblems(G);if(probs.length)return probs;newSeason(G);break; }
  }
  return null;
}
FD.advancePhase=advancePhase;
function newSeason(G){
  G.season++;G.week=1;G.phase='regular';G.cap=Math.round(G.cap*1.045*10)/10;
  G.teams.forEach(t=>{t.w=t.l=t.t=t.pf=t.pa=t.divw=t.divl=t.confw=t.confl=t.streak=0;t.poResult='';t.dead=0;t.prestige=clamp(Math.round(t.prestige*0.7+(t.hist[t.hist.length-1]?.w||8)*3+(t.hist[t.hist.length-1]?.champ?15:0)),20,99);FD.fixDepth(G,t);});
  Object.values(G.players).forEach(p=>{p.s=FD.blankStats();p.inj=0;});
  G.prospects=FD.genDraftClass(G);FD.bumpId(G);
  G.schedule=FD.genSchedule(G);G.results=[];G.playoffs=null;G.draft=null;
  if(G.userTid!=null){const t=G.teams[G.userTid];news(G,'front','Season '+G.season+' kicks off. Camp reports put the '+t.name+' at '+FD.teamOvr(G,t)+' OVR.',t.id);
    if(t.fin.lowFanYrs>=2)mail(G,'Owner','Relocation on the table','Fan support has been in the gutter for two years. The league has cleared us to explore relocation. Check the Owner tab if you want to move the franchise.');}
  if(G.seasonsPlayed>=G.maxSeasons){G.phase='complete';}
}
FD.newSeason=newSeason;

// ---------- Save / load ----------
FD.serialize=G=>JSON.stringify(G);
FD.deserialize=s=>{const G=JSON.parse(s);FD.syncIds(G);return G;};

})(FD);


</script>
<script>
/* ===== UI part 1: state, helpers, shell, start screen, hub ===== */
const UI={};
(function(UI){
let G=null;UI.get=()=>G;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=FD.u.money;
const ovrCls=o=>o>=85?'o85':o>=75?'o75':o>=65?'o65':'o50';
const ovrTag=o=>`<span class="ovr ${ovrCls(o)}">${o}</span>`;
const abbr=t=>`<span class="tabbr" style="--c1:${t.c1};--c2:${t.c2}">${t.abbr}</span>`;
const rec=t=>t.w+'-'+t.l+(t.t?'-'+t.t:'');
const myTeam=()=>G.teams[G.userTid];
const P=id=>G.players[id];
let tab='hub';
let sortKey='ovr',sortDir=-1,posFilter='ALL';
UI.tab=t=>{tab=t;render();};

// ---------- Save / load ----------
const KEY='franchise-dynasty-save';
function compress(s){try{return (window.LZString?'LZ:'+LZString.compressToUTF16(s):s);}catch(e){return s;}}
function decompress(s){try{return s.startsWith('LZ:')?LZString.decompressFromUTF16(s.slice(3)):s;}catch(e){return s;}}
UI.save=(quiet)=>{if(!G)return;FD.bumpId(G);try{localStorage.setItem(KEY,compress(FD.serialize(G)));if(!quiet)toast('Franchise saved.');return true;}catch(e){if(!quiet)toast('Could not save to this browser (storage blocked or full). Use Export in Settings.');return false;}};
UI.load=()=>{try{const s=localStorage.getItem(KEY);if(!s)return false;G=FD.deserialize(decompress(s));return true;}catch(e){return false;}};
UI.hasSave=()=>{try{return !!localStorage.getItem(KEY);}catch(e){return false;}};
UI.exportSave=()=>{$('#io').value=FD.serialize(G);$('#io').select();try{navigator.clipboard.writeText($('#io').value).then(()=>toast('Save copied to clipboard.')).catch(()=>toast('Select the text and copy it.'));}catch(e){toast('Select the text and copy it.');}};
UI.importSave=()=>{try{const s=$('#io').value.trim();if(!s)return toast('Paste a save first.');G=FD.deserialize(s);UI.save(true);tab='hub';render();toast('Franchise imported.');}catch(e){toast('That did not look like a valid save.');}};
UI.reset=()=>{G=null;try{localStorage.removeItem(KEY);}catch(e){}render();};

// ---------- Toast / modal ----------
let toastT;function toast(msg){const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3200);}
UI.toast=toast;
function modal(html,wide){const m=$('#modal');m.querySelector('.mbox').innerHTML=html;m.querySelector('.mbox').classList.toggle('wide',!!wide);m.hidden=false;m.querySelector('.mbox').scrollTop=0;}
UI.closeModal=()=>{$('#modal').hidden=true;};
UI.modal=modal;
function confirmBox(msg,onYes){modal(`<h3>Confirm</h3><p>${msg}</p><div class="row"><button class="btn primary" id="cy">Yes</button><button class="btn" onclick="UI.closeModal()">Cancel</button></div>`);$('#cy').onclick=()=>{UI.closeModal();onYes();};}
UI.confirm=confirmBox;

// ---------- Render shell ----------
function render(){
  const app=$('#app');
  if(!G){app.innerHTML=startScreen();return;}
  if(G.userTid==null){app.innerHTML=pickTeamScreen();return;}
  const t=myTeam();
  const phase=FD.phaseLabel(G.phase);
  const weekLabel=G.phase==='regular'?'Week '+G.week:G.phase==='playoffs'?['Wild Card','Divisional','Conf. Championship','Championship Bowl'][G.playoffs.round-1]:phase;
  const tabs=[['hub','Franchise'],['roster','Roster'],['depth','Depth Chart'],['schedule','Schedule'],['standings','Standings'],['stats','Stats'],['trade','Trades'],['fa','Free Agents'],['draft','Draft'],['owner','Owner'],['news','Storyline Central'],['history','History'],['settings','Settings']];
  const unread=G.mail.filter(m=>!m.read).length;
  app.innerHTML=`
  <header class="top" style="--c1:${t.c1};--c2:${t.c2}">
    <div class="brand"><div class="logo">${esc(t.abbr)}</div><div><div class="tname">${esc(t.city)} <b>${esc(t.name)}</b></div><div class="sub">${G.season} · ${weekLabel} · ${rec(t)}${t.poResult?' · '+esc(t.poResult):''}</div></div></div>
    <div class="kpis"><div><span>Team OVR</span><b>${FD.teamOvr(G,t)}</b></div><div><span>Cap room</span><b class="${FD.capRoom(G,t)<0?'neg':''}">${money(FD.capRoom(G,t))}</b></div><div><span>Funds</span><b class="${t.fin.funds<0?'neg':''}">${money(t.fin.funds)}</b></div><div><span>Fans</span><b>${Math.round(t.fin.fan)}%</b></div></div>
    <div class="act">${actionButton()}</div>
  </header>
  <nav class="tabs">${tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="UI.tab('${k}')">${l}${k==='news'&&unread?` <i class="dot">${unread}</i>`:''}${k==='draft'&&G.phase==='draft'?' <i class="dot">!</i>':''}</button>`).join('')}</nav>
  <main class="main" id="main">${screens[tab]?screens[tab]():''}</main>`;
}
UI.render=render;
const screens={};UI.screens=screens;

function actionButton(){
  const ph=G.phase;
  const b=(label,fn,cls='primary')=>`<button class="btn ${cls}" onclick="${fn}">${label}</button>`;
  switch(ph){
    case 'regular':return b('Sim Week '+G.week,'UI.simWeek()')+b('Sim to playoffs','UI.simToEnd()','ghost');
    case 'playoffs':return b('Sim playoff round','UI.simPlayoff()');
    case 'awards':return b('View awards','UI.tab(\'hub\')','ghost')+b('Continue','UI.advance()');
    case 'retire':case 'progress':return b('Continue','UI.advance()');
    case 'resign':return b('Finish re-signing','UI.finishResign()');
    case 'freeagency':return b('Advance FA day ('+(G.freeAgentDay+1)+'/5)','UI.faDay()',G.freeAgentDay<5?'primary':'ghost')+b('Go to draft','UI.advance()',G.freeAgentDay>=5?'primary':'ghost');
    case 'draft':return b(G.draft&&G.draft.done?'Continue':'Go to draft room','UI.draftBtn()');
    case 'camp':return b('Break camp','UI.advance()');
    case 'preseason':return b('Start season '+(G.season+1),'UI.startSeason()');
    case 'complete':return '<span class="pill">Franchise complete</span>';
  }
  return '';
}

// ---------- Start / team pick ----------
function startScreen(){
  return `<section class="start">
    <div class="hero"><div class="kicker">Front-office football, 30 seasons deep</div><h1>Franchise Dynasty</h1>
    <p>Run every part of a pro football franchise the way the classic mid-2000s franchise modes did: build the roster, manage the cap, sign free agents, work the draft board, set ticket prices, hire coaches, and read the morning paper after every game. No on-field controls, all of the front office.</p>
    <div class="row">
      <button class="btn primary big" onclick="UI.newGame()">New franchise</button>
      ${UI.hasSave()?'<button class="btn big" onclick="UI.continueGame()">Continue saved franchise</button>':''}
      <button class="btn big ghost" onclick="UI.importScreen()">Import save</button>
    </div></div>
    <div class="grid3">
      <div class="card"><h3>Season</h3><p>16 games, 17 weeks, 12-team playoffs, Championship Bowl. Injuries, depth charts, drive-by-drive game logs for your games.</p></div>
      <div class="card"><h3>Offseason</h3><p>Awards, retirements, progression, re-signing, five days of free agency, a seven-round draft with scouting points, training camp.</p></div>
      <div class="card"><h3>Owner</h3><p>Ticket and concession prices, stadium upgrades, fan support, staff hiring, relocation when the fans stop showing up.</p></div>
    </div></section>`;
}
UI.newGame=()=>{G=FD.newLeague({startYear:2005});render();};
UI.continueGame=()=>{if(UI.load()){tab='hub';render();}else toast('No saved franchise found.');};
UI.importScreen=()=>{modal(`<h3>Import save</h3><p>Paste an exported save below.</p><textarea id="io" rows="6" style="width:100%"></textarea><div class="row"><button class="btn primary" onclick="UI.importSave();UI.closeModal()">Import</button><button class="btn" onclick="UI.closeModal()">Cancel</button></div>`);};
function pickTeamScreen(){
  const by={};G.teams.forEach(t=>{const k=t.conf+' '+t.div;(by[k]=by[k]||[]).push(t);});
  return `<section class="start"><div class="hero small"><h1>Choose your franchise</h1><p>Any team is open. Team OVR is the current starting lineup; prestige drives free-agent interest.</p>
  <div class="row"><label>Difficulty <select id="diff"><option value="rookie">Rookie</option><option value="pro" selected>Pro</option><option value="allpro">All-Pro</option></select></label></div></div>
  ${Object.keys(by).map(k=>`<h3 class="divh">${k}</h3><div class="teamgrid">${by[k].map(t=>`<button class="teamcard" style="--c1:${t.c1};--c2:${t.c2}" onclick="UI.chooseTeam(${t.id})"><span class="logo">${t.abbr}</span><span class="n">${t.city}<b>${t.name}</b></span><span class="o">${FD.teamOvr(G,t)}<small>OVR</small></span></button>`).join('')}</div>`).join('')}</section>`;
}
UI.chooseTeam=(id)=>{G.userTid=id;G.difficulty=$('#diff').value;const t=myTeam();FD.news(G,'front','New ownership era begins in '+t.city+'. The '+t.name+' name you as GM and head of football operations.',id);FD.mail(G,'Owner','Welcome aboard','Welcome to the '+t.name+'. Three things matter to me: wins, a full stadium, and a healthy bottom line. The cap is '+money(G.cap)+'. Scouting points reset every offseason. Do not embarrass me.');FD.mail(G,'League Office','Trade deadline','Trades close after week '+G.tradeDeadline+'.');tab='hub';UI.save(true);render();};

// ---------- Hub ----------
screens.hub=()=>{
  const t=myTeam();
  const ph=G.phase;
  let main='';
  if(ph==='regular'){
    const g=G.schedule[G.week-1].find(g=>g.home===t.id||g.away===t.id);
    if(g){const opp=G.teams[g.home===t.id?g.away:g.home];const home=g.home===t.id;
      main=`<div class="card next"><div class="kicker">Week ${G.week} · ${home?'Home':'Away'}</div><div class="vs">${abbr(t)} <span>${home?'vs':'at'}</span> ${abbr(opp)}</div><div class="sub">${esc(opp.city)} ${esc(opp.name)} · ${rec(opp)} · ${FD.teamOvr(G,opp)} OVR · ${opp.streak>0?'W'+opp.streak:opp.streak<0?'L'+(-opp.streak):'—'}</div>${matchup(t,opp)}</div>`;}
    else main=`<div class="card next"><div class="kicker">Week ${G.week}</div><div class="vs">Bye week</div><div class="sub">Rest up. Injured players heal a week.</div></div>`;
  } else if(ph==='playoffs'){
    const P=G.playoffs;const g=P.bracket.find(g=>g.home===t.id||g.away===t.id);
    main=`<div class="card next"><div class="kicker">${['Wild Card','Divisional Round','Conference Championship','Championship Bowl'][P.round-1]}</div>${g?`<div class="vs">${abbr(G.teams[g.home])} <span>vs</span> ${abbr(G.teams[g.away])}</div>`:`<div class="vs">${t.poResult&&t.poResult!=='Playoffs'?esc(t.poResult):'Not in the playoffs'}</div>`}<div class="bracket">${P.bracket.map(g=>`<div>${G.teams[g.home].abbr} vs ${G.teams[g.away].abbr}</div>`).join('')}</div></div>`;
  } else main=phasePanel();
  const inj=t.roster.map(P).filter(p=>p.inj>0);
  const st=FD.standings(G);const divRank=st.byDiv[t.conf+' '+t.div].indexOf(t)+1;const seed=st.seeds[t.conf].indexOf(t)+1;
  return `<div class="hubgrid">
    <div class="col">
      ${main}
      <div class="card"><h3>Front page</h3>${G.news.filter(n=>n.type==='front').slice(0,5).map(n=>`<div class="headline"><span class="when">${n.season} ${n.phase==='regular'?'wk '+n.week:FD.phaseLabel(n.phase)}</span>${esc(n.text)}</div>`).join('')||'<p class="muted">Nothing yet.</p>'}</div>
      <div class="card radio"><h3>Drive-time radio</h3><p>“${esc(G.radio||'We are on the air. Let\'s talk some football.')}”</p></div>
    </div>
    <div class="col">
      <div class="card"><h3>Season outlook</h3><div class="kv"><div><span>Division</span><b>${divRank}${['st','nd','rd','th'][Math.min(divRank,4)-1]} in ${t.div}</b></div><div><span>Conference seed</span><b>${seed?'#'+seed:'Out'}</b></div><div><span>Points</span><b>${t.pf} for / ${t.pa} against</b></div><div><span>Streak</span><b>${t.streak>0?'W'+t.streak:t.streak<0?'L'+(-t.streak):'—'}</b></div><div><span>Payroll</span><b>${money(FD.payroll(G,t))} / ${money(G.cap)}</b></div><div><span>Roster</span><b>${t.roster.length} / 53</b></div></div></div>
      <div class="card"><h3>Injury report</h3>${inj.length?inj.map(p=>`<div class="line"><span>${esc(p.name)} <small>${p.pos}</small></span><b class="neg">${p.inj} wk</b></div>`).join(''):'<p class="muted">Everyone is healthy.</p>'}</div>
      <div class="card"><h3>Inbox ${G.mail.filter(m=>!m.read).length?`<i class="dot">${G.mail.filter(m=>!m.read).length}</i>`:''}</h3>${G.mail.slice(0,4).map((m,i)=>`<div class="line clickable" onclick="UI.openMail(${i})"><span>${m.read?'':'<b>•</b> '}${esc(m.subject)} <small>${esc(m.from)}</small></span></div>`).join('')}</div>
      <div class="card"><h3>Top players</h3>${t.roster.map(P).filter(p=>p.pos!=='K'&&p.pos!=='P').sort((a,b)=>b.ovr-a.ovr).slice(0,6).map(p=>`<div class="line clickable" onclick="UI.player(${p.id})"><span>${esc(p.name)} <small>${p.pos} · ${p.age}</small></span>${ovrTag(p.ovr)}</div>`).join('')}</div>
    </div></div>`;
};
function matchup(a,b){const ra=FD.teamRatings(G,a),rb=FD.teamRatings(G,b);const bar=(l,x,y)=>`<div class="mline"><b>${Math.round(x)}</b><span>${l}</span><b>${Math.round(y)}</b></div>`;return `<div class="matchup">${bar('Pass offense',ra.passOff,rb.passOff)}${bar('Rush offense',ra.rushOff,rb.rushOff)}${bar('Pass defense',ra.passDef,rb.passDef)}${bar('Rush defense',ra.rushDef,rb.rushDef)}</div>`;}

/* ===== UI part 3: trades, free agents, draft, owner, storyline central, history, settings ===== */
(function(UI){
const G=()=>UI.get();
const $=s=>document.querySelector(s);
const {esc,ovrTag,abbr,rec,money}=UI.h;
const myTeam=()=>G().teams[G().userTid];
const P=id=>G().players[id];
const S=UI.screens;

// ---------- Trades ----------
let tr={partner:null,give:{players:[],picks:[]},get:{players:[],picks:[]}};
UI.tradeFor=(pid)=>{const p=P(pid);tr={partner:p.tid,give:{players:[],picks:[]},get:{players:[pid],picks:[]}};UI.tab('trade');};
UI.tradePartner=id=>{tr={partner:+id,give:{players:[],picks:[]},get:{players:[],picks:[]}};UI.render();};
UI.trToggle=(side,kind,key)=>{const arr=tr[side][kind];if(kind==='players'){const i=arr.indexOf(key);if(i>=0)arr.splice(i,1);else arr.push(key);}else{const i=arr.findIndex(pk=>pk.season+'-'+pk.round+'-'+pk.orig===key);if(i>=0)arr.splice(i,1);else{const team=side==='give'?myTeam():G().teams[tr.partner];const pk=team.picks.find(pk=>pk.season+'-'+pk.round+'-'+pk.orig===key);if(pk)arr.push({...pk});}}UI.render();};
S.trade=()=>{
  const g=G();const t=myTeam();
  const open=g.phase!=='regular'||g.week<=g.tradeDeadline;
  if(!open&&g.phase==='regular')return `<div class="card"><h3>Trade deadline has passed</h3><p>Trades reopen after the season.</p></div>`;
  if(g.phase==='playoffs'||g.phase==='draft')return `<div class="card"><h3>Trades are closed during the ${FD.phaseLabel(g.phase).toLowerCase()}</h3></div>`;
  const partner=tr.partner!=null?g.teams[tr.partner]:null;
  const side=(team,sideKey,pkg)=>{const list=team.roster.map(P).sort((a,b)=>b.ovr-a.ovr);const picks=team.picks.slice().sort((a,b)=>a.season-b.season||a.round-b.round);
    return `<div class="card"><h3>${abbr(team)} ${esc(team.name)} <small>${rec(team)} · cap room ${money(FD.capRoom(g,team))}</small></h3><div class="scroll">${list.map(p=>`<label class="line"><span><input type="checkbox" ${pkg.players.includes(p.id)?'checked':''} onchange="UI.trToggle('${sideKey}','players',${p.id})"> <span class="clickable" onclick="UI.player(${p.id})">${esc(p.name)}</span> <small>${p.pos} · ${p.age} · ${p.c?p.c.yrs+'y '+money(p.c.sal):''}</small></span>${ovrTag(p.ovr)}</label>`).join('')}</div><h4>Draft picks</h4><div class="chips">${picks.map(pk=>{const key=pk.season+'-'+pk.round+'-'+pk.orig;const on=pkg.picks.some(x=>x.season+'-'+x.round+'-'+x.orig===key);return `<button class="chip ${on?'on':''}" onclick="UI.trToggle('${sideKey}','picks','${key}')">${pk.season} R${pk.round}${pk.orig!==team.id?' ('+g.teams[pk.orig].abbr+')':''}</button>`;}).join('')||'<span class="muted">None</span>'}</div></div>`;};

  <div><div class="card"><h3>Your picks</h3>${myPicks.map(pk=>`<div class="line"><span>R${pk.round} #${pk.no}${pk.orig!==t.id?' <small>via '+g.teams[pk.orig].abbr+'</small>':''}</span><b>${pk.pid?esc(P(pk.pid).name)+' '+P(pk.pid).pos:pk.no===D.picks[D.cur]?.no?'NOW':'—'}</b></div>`).join('')}</div><div class="card"><h3>Recent picks</h3>${recent.map(pk=>`<div class="line"><span>#${pk.no} ${g.teams[pk.tid].abbr}</span><b class="clickable" onclick="UI.player(${pk.pid})">${esc(P(pk.pid).name)} <small>${P(pk.pid).pos}</small></b></div>`).join('')||'<p class="muted">Draft is about to begin.</p>'}</div><div class="card"><h3>Team needs</h3>${(()=>{const n=FD.teamNeeds(g,t);return Object.keys(n).sort((a,b)=>n[b]-n[a]).slice(0,6).map(p=>`<div class="line"><span>${p}</span><b class="${n[p]>15?'neg':''}">${n[p]>20?'High':n[p]>8?'Medium':'Low'}</b></div>`).join('');})()}</div></div></div>`;

function boardTable(board,onClock){
  const g=G();
  return `<div class="tbl"><table><thead><tr><th>Proj</th><th>Prospect</th><th>Pos</th><th>Age</th><th>OVR</th><th>POT</th><th>40</th><th>College</th><th></th></tr></thead><tbody>${board.map(p=>{const rng=p.scouted>=3?'':'±'+(7-p.scouted*2);return `<tr><td>${p.proj}</td><td class="clickable" onclick="UI.player(${p.id})">${esc(p.name)}</td><td>${p.pos}</td><td>${p.age}</td><td>${ovrTag(p.sOvr)} <small>${rng}</small></td><td>${p.sPot} <small>${rng}</small></td><td>${p.combine.forty}</td><td class="muted">${esc(p.college)}</td><td class="nowrap">${p.scouted<3?`<button class="btn xs" onclick="UI.scout(${p.id})">Scout (5)</button>`:'<small>✓ scouted</small>'} ${onClock?`<button class="btn xs primary" onclick="UI.draftPick(${p.id})">Draft</button>`:''}</td></tr>`;}).join('')}</tbody></table></div>`;
}
UI.scout=(id)=>{const err=FD.scoutProspect(G(),id);if(err)UI.toast(err);UI.save(true);UI.render();};
UI.draftPick=(id)=>{const g=G();const p=P(id);FD.makePick(g,id);UI.toast('You selected '+p.name+', '+p.pos+'.');FD.draftAdvance(g);UI.save(true);UI.render();};
UI.draftSimToMe=()=>{const g=G();const r=FD.draftAdvance(g);UI.save(true);UI.render();if(r==='user')UI.toast('You are on the clock.');};
UI.draftAuto=()=>{UI.confirm('Let the computer make your remaining picks by projection and need?',()=>{const g=G();const t=myTeam();let r;while((r=FD.draftAdvance(g))==='user'){const n=FD.teamNeeds(g,t);const best=g.prospects.map(P).filter(p=>p.tid===-3).sort((a,b)=>(b.sOvr*0.55+b.sPot*0.45+n[b.pos]*0.25)-(a.sOvr*0.55+a.sPot*0.45+n[a.pos]*0.25))[0];FD.makePick(g,best.id);}UI.save(true);UI.render();});};

// ---------- Owner ----------
S.owner=()=>{
  const g=G();const t=myTeam();const f=t.fin;const L=f.last;
  const staff=['HC','OC','DC'].map(r=>{const c=t.staff[r];return `<div class="line"><span><b>${r}</b> ${esc(c.name)} <small>age ${c.age} · ${money(c.sal)}/yr · ${c.expired?'<span class="neg">contract expired</span>':c.yrs+' yr'+(c.yrs!==1?'s':'')+' left'}</small></span><span>${ovrTag(c.rating)} ${c.expired?`<button class="btn xs" onclick="UI.renew('${r}')">Renew (+10%)</button>`:''}<button class="btn xs" onclick="UI.fireAsk('${r}')">Fire</button></span></div>`;}).join('');
  const pool=g.coachPool.map((c,i)=>`<div class="line"><span>${esc(c.name)} <small>${c.role} · age ${c.age} · ${money(c.sal)}/yr</small></span><span>${ovrTag(c.rating)} <button class="btn xs" onclick="UI.hire(${i})">Hire</button></span></div>`).join('');
  const canRelocate=f.lowFanYrs>=2||f.funds>=300;
  const att=f.attendance.length?Math.round(f.attendance.reduce((a,b)=>a+b,0)/f.attendance.length):(L?L.avgAtt:0);
  return `<div class="grid2">
  <div><div class="card"><h3>Finances</h3><div class="kv"><div><span>Funds</span><b class="${f.funds<0?'neg':''}">${money(f.funds)}</b></div><div><span>Payroll</span><b>${money(FD.payroll(g,t))}</b></div><div><span>Fan support</span><b>${Math.round(f.fan)}%</b></div><div><span>Avg attendance</span><b>${att.toLocaleString()} / ${f.capacity.toLocaleString()}</b></div></div>
  ${L?`<h4>${L.season} statement</h4><table class="mini"><tbody><tr><th>TV share</th><td>${money(L.tv)}</td></tr><tr><th>Gate (tickets, parking, concessions)</th><td>${money(L.gate)}</td></tr><tr><th>Merchandise</th><td>${money(L.merch)}</td></tr><tr><th><b>Revenue</b></th><td><b>${money(L.rev)}</b></td></tr><tr><th>Player payroll</th><td>${money(L.pay)}</td></tr><tr><th>Coaching staff</th><td>${money(L.staff)}</td></tr><tr><th>Stadium upkeep</th><td>${money(L.upkeep)}</td></tr><tr><th><b>Profit</b></th><td><b class="${L.profit>=0?'pos':'neg'}">${money(L.profit)}</b></td></tr></tbody></table>`:'<p class="muted">First statement arrives after the season.</p>'}</div>
  <div class="card"><h3>Prices</h3><p class="muted">Higher prices raise per-game revenue but cost fan support and attendance. League average ticket is about $55.</p><div class="prices">${[['ticket','Ticket',20,150],['parking','Parking',5,60],['conc','Concessions (avg item)',3,20],['merch','Merchandise (avg)',10,80]].map(([k,l,lo,hi])=>`<label>${l} <b id="pv${k}">$${f[k]}</b><input type="range" min="${lo}" max="${hi}" value="${f[k]}" oninput="UI.price('${k}',this.value)"></label>`).join('')}</div></div>
  <div class="card"><h3>Stadium</h3><div class="kv"><div><span>Condition</span><b>${f.stadium}/100</b></div><div><span>Capacity</span><b>${f.capacity.toLocaleString()}</b></div></div><div class="row"><button class="btn sm" onclick="UI.upgrade('renovate')">Renovate (+20 condition) · $40M</button><button class="btn sm" onclick="UI.upgrade('expand')">Expand (+6,000 seats) · $60M</button><button class="btn sm" onclick="UI.upgrade('rebuild')">New stadium · $250M</button></div>
  <h4>Relocation</h4><p class="muted">${canRelocate?'The league has cleared a move. Relocating costs $100M and resets fan support in the new market.':'Available only when fan support stays under 30% for two straight seasons, or with $300M in the bank.'}</p>${canRelocate?`<div class="row"><select id="relCity">${FD.C.RELOCATION_CITIES.map(c=>`<option>${c}</option>`).join('')}</select><select id="relName">${FD.C.RELOCATION_NAMES.map(c=>`<option>${c}</option>`).join('')}</select><input id="relAbbr" maxlength="3" placeholder="ABR" style="width:4em"><button class="btn sm" onclick="UI.relocateAsk()">Move franchise</button></div>`:''}</div></div>
  <div><div class="card"><h3>Coaching staff</h3><p class="muted">Head coach lifts game-day ratings and progression; coordinators shape their side of the ball. Expired contracts must be renewed or replaced before the season.</p>${staff}</div><div class="card"><h3>Available coaches</h3><p class="muted">Hiring replaces your current coach in that role (a one-time fee of two years' salary applies).</p><div class="scroll">${pool||'<p class="muted">Nobody available.</p>'}</div></div></div></div>`;
};
UI.price=(k,v)=>{myTeam().fin[k]=+v;$('#pv'+k).textContent='$'+v;UI.save(true);};
UI.upgrade=(k)=>{const err=FD.upgradeStadium(G(),myTeam(),k);if(err)return UI.toast(err);UI.save(true);UI.render();UI.toast('Done.');};
UI.renew=(r)=>{FD.renewCoach(G(),myTeam(),r);UI.save(true);UI.render();};
UI.fireAsk=(r)=>{const t=myTeam();const c=t.staff[r];UI.confirm(`Fire ${esc(c.name)}? You owe the rest of his deal (${money(c.sal*Math.max(1,c.yrs))}) and must hire a replacement.`,()=>{t.fin.funds-=c.sal*Math.max(1,c.yrs);G().coachPool.push({...c,yrs:0,expired:false});t.staff[r]=FD.makeCoach(r,45);t.staff[r].name='Interim '+r;UI.save(true);UI.render();});};
UI.hire=(i)=>{const g=G();const t=myTeam();const c=g.coachPool[i];if(t.fin.funds<c.sal*2)return UI.toast('Not enough funds for the hiring fee.');t.fin.funds-=c.sal*2;FD.hireCoach(g,t,i);UI.save(true);UI.render();};
UI.relocateAsk=()=>{const city=$('#relCity').value,name=$('#relName').value,ab=($('#relAbbr').value||city.slice(0,3)).toUpperCase();UI.confirm(`Move the franchise to ${esc(city)} as the ${esc(name)}? This cannot be undone.`,()=>{FD.relocate(G(),myTeam(),city,name,ab);UI.save(true);UI.render();});};

// ---------- Storyline Central ----------
let newsFilter='all';
UI.newsFilter=f=>{newsFilter=f;UI.render();};
S.news=()=>{
  const g=G();
  const list=g.news.filter(n=>newsFilter==='all'||(newsFilter==='mine'?n.tid===g.userTid:n.type===newsFilter)).slice(0,80);
  return `<div class="grid2"><div><div class="bar"><div class="chips">${[['all','All'],['mine','My team'],['front','Front page'],['league','League wire'],['injury','Injuries']].map(([k,l])=>`<button class="chip ${newsFilter===k?'on':''}" onclick="UI.newsFilter('${k}')">${l}</button>`).join('')}</div></div><div class="paper">${list.map(n=>`<div class="headline ${n.type}"><span class="when">${n.season} · ${n.phase==='regular'?'Week '+n.week:n.phase==='playoffs'?'Playoffs':FD.phaseLabel(n.phase)}</span>${esc(n.text)}</div>`).join('')||'<p class="muted">Nothing on the wire yet.</p>'}</div></div>
  <div><div class="card radio"><h3>Drive-time radio</h3><p>“${esc(g.radio||'We are on the air.')}”</p></div><div class="card"><h3>Inbox</h3>${g.mail.map((m,i)=>`<div class="line clickable" onclick="UI.openMail(${i})"><span>${m.read?'':'<b>•</b> '}${esc(m.subject)} <small>${esc(m.from)} · ${m.season}${m.phase==='regular'?' wk '+m.week:''}</small></span></div>`).join('')||'<p class="muted">Empty.</p>'}</div></div></div>`;
};

// ---------- History ----------
S.history=()=>{
  const g=G();const t=myTeam();
  const RB=g.recordBook;
  return `<div class="grid2">
  <div><div class="card"><h3>Champions</h3>${g.history.map(h=>`<div class="line"><span><b>${h.season}</b> ${abbr(g.teams[h.champion])} ${esc(g.teams[h.champion].name)} <small>over ${g.teams[h.runnerUp].abbr}</small></span><b>MVP ${h.mvp&&P(h.mvp)?esc(P(h.mvp).name):'—'}</b></div>`).join('')||'<p class="muted">No seasons completed yet.</p>'}</div>
  <div class="card"><h3>${esc(t.city)} ${esc(t.name)} history</h3><div class="tbl"><table class="mini"><thead><tr><th>Season</th><th>Record</th><th>PF</th><th>PA</th><th>Result</th></tr></thead><tbody>${t.hist.slice().reverse().map(h=>`<tr><td>${h.season}</td><td>${h.w}-${h.l}${h.t?'-'+h.t:''}</td><td>${h.pf}</td><td>${h.pa}</td><td class="${h.champ?'pos':''}">${h.champ?'CHAMPIONS':h.po||'Missed playoffs'}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Your story starts now.</td></tr>'}</tbody></table></div></div>
  <div class="card"><h3>Awards</h3>${g.awards.map(a=>`<div class="line"><span><b>${a.season}</b> MVP ${a.MVP&&P(a.MVP)?esc(P(a.MVP).name):'—'} · OPOY ${a.OPOY&&P(a.OPOY)?esc(P(a.OPOY).name):'—'} · DPOY ${a.DPOY&&P(a.DPOY)?esc(P(a.DPOY).name):'—'}</span></div>`).join('')||'<p class="muted">—</p>'}</div></div>
  <div><div class="card"><h3>Hall of Fame</h3>${g.hof.map(h=>`<div class="line"><span>${esc(h.name)} <small>${h.pos} · inducted ${h.season}</small></span><b>${h.score}</b></div>`).join('')||'<p class="muted">No inductees yet. Careers need volume, awards, and rings.</p>'}</div>
  <div class="card"><h3>Record book <small>single season</small></h3>${Object.keys(RB).map(k=>`<div class="line"><span>${RB[k].label} <small>${esc(RB[k].name)} · ${RB[k].team} ${RB[k].season}</small></span><b>${RB[k].val}</b></div>`).join('')||'<p class="muted">Set after the first season.</p>'}</div></div></div>`;
};

// ---------- Settings ----------
S.settings=()=>{
  const g=G();
  return `<div class="grid2"><div class="card"><h3>Save</h3><p class="muted">The game autosaves after every week and phase to this browser. Export to move it elsewhere.</p><div class="row"><button class="btn primary" onclick="UI.save()">Save now</button><button class="btn" onclick="UI.exportSave()">Export (copy)</button><button class="btn" onclick="UI.importSave()">Import from box</button></div><textarea id="io" rows="5" style="width:100%" placeholder="Exported save appears here; paste a save here to import."></textarea></div>
  <div class="card"><h3>Franchise</h3><div class="kv"><div><span>Season</span><b>${g.season} (${g.seasonsPlayed+1} of ${g.maxSeasons})</b></div><div><span>Difficulty</span><b><select onchange="UI.setDiff(this.value)">${['rookie','pro','allpro'].map(d=>`<option value="${d}" ${g.difficulty===d?'selected':''}>${d}</option>`).join('')}</select></b></div><div><span>Salary cap</span><b>${money(g.cap)} (+4.5%/yr)</b></div><div><span>Trade deadline</span><b>Week ${g.tradeDeadline}</b></div></div><div class="row"><button class="btn danger" onclick="UI.confirm('Delete this franchise and start over?',UI.reset)">New franchise (deletes this one)</button></div>
  <h4>House rules</h4><p class="muted">16-game season, 12-team playoffs, 53-man rosters, hard cap with dead money on cut bonuses, 7-round draft, 60 scouting points and 10 camp points per offseason, 30-season franchise. All teams, players, and names are fictional.</p></div></div>`;
};
UI.setDiff=d=>{G().difficulty=d;UI.save(true);UI.toast('Difficulty: '+d);};

})(UI);

// ---------- Boot ----------
(function(){
  function start(){if(UI.load()){}UI.render();}
  try{if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);else start();}catch(e){start();}
  document.addEventListener('keydown',e=>{if(e.key==='Escape')UI.closeModal();});
})();

</script>

</body></html>
