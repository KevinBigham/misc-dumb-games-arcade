function renderRecordsTab() {
  const league = appState.league;
  const sub = appState.recordsSubTab;
  const g = appState.recordsGender;

  const subNav = [
    ['titles', 'Season Event Leaders'],
    ['leagueRecs', 'League Records'],
    ['teamRecs', 'Team Record Boards'],
    ['top10', 'All-Time Top 10 Performers'],
    ['allTime', 'All-Time Benchmarks'],
    ['history', 'Past Champions & Awards'],
    ['hof', 'Hall of Fame & Draft Retro'],
    ['gmResume', 'GM Career Résumé']
  ].map(([k, label]) => `
    <button class="btn btn-sm ${sub === k ? 'btn-primary' : ''}" onclick="setRecordsSubTab('${k}')">${label}</button>
  `).join('');

  let bodyHtml = '';

  if (sub === 'titles') {
    const rows = INDIVIDUAL_EVENTS.map(ev => {
      const list = [];
      for (const t of league.teams) {
        for (const s of [...t.roster, ...(t.il || [])]) {
          if (s.gender !== g) continue;
          const sb = s.seasonBests?.[ev.id];
          const tm = typeof sb === 'number' ? sb : sb?.time;
          if (tm) list.push({ s, t, time: tm });
        }
      }
      list.sort((a, b) => a.time - b.time);
      const leader = list[0];
      const runnerUp = list[1];
      return `
        <tr>
          <td style="font-weight:800;">${escapeHtml(ev.name)}</td>
          <td>${leader ? `<button class="link-btn" onclick="openSwimmerModal('${leader.s.id}')">${escapeHtml(leader.s.name)}</button> (${escapeHtml(leader.t.abbr)})` : 'No swims yet'}</td>
          <td class="num" style="font-weight:800;color:var(--accent-gold);">${leader ? formatTime(leader.time) : '—'}</td>
          <td>${runnerUp ? `${escapeHtml(runnerUp.s.name)} (${escapeHtml(runnerUp.t.abbr)}) — ${formatTime(runnerUp.time)}` : '—'}</td>
          <td class="num">${formatTime(league.records?.[g]?.[ev.id]?.time)}</td>
        </tr>
      `;
    }).join('');

    bodyHtml = `
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Event</th><th>Current Season Leader (Event Title Race)</th><th class="num">Season Best</th><th>#2 Performer</th><th class="num">League Record</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  } else if (sub === 'leagueRecs' || sub === 'teamRecs') {
    const targetTeam = getTeamById(appState.recordsTeamId) || getUserTeam();
    const recSource = sub === 'leagueRecs' ? league.records?.[g] : targetTeam.records?.[g];
    const relSource = sub === 'leagueRecs' ? league.relayRecords : targetTeam.relayRecords;

    const indRows = INDIVIDUAL_EVENTS.map(ev => {
      const rec = recSource?.[ev.id];
      return `
        <tr>
          <td style="font-weight:800;">${escapeHtml(ev.name)}</td>
          <td class="num" style="font-weight:800;color:var(--accent-gold);">${rec ? formatTime(rec.time) : '—'}</td>
          <td>${rec ? `<button class="link-btn" onclick="openSwimmerModal('${rec.swimmerId}')">${escapeHtml(rec.swimmerName)}</button>` : '—'}</td>
          <td>${escapeHtml(rec?.teamAbbr || '—')}</td>
          <td class="num">${rec?.year || '—'}</td>
          <td class="num" style="color:var(--text-muted);">${formatTime(ev.allTime[g])}</td>
        </tr>
      `;
    }).join('');

    const relRows = RELAY_EVENTS.map(ev => {
      const gKey = ev.mixed ? 'X' : g;
      const rec = relSource?.[gKey]?.[ev.id];
      return `
        <tr>
          <td style="font-weight:800;">${ev.mixed ? '' : (g === 'F' ? "Women's " : "Men's ")}${escapeHtml(ev.name)}</td>
          <td class="num" style="font-weight:800;color:var(--accent-cyan);">${rec ? formatTime(rec.time) : '—'}</td>
          <td>${escapeHtml(rec?.swimmerNames || '—')}</td>
          <td>${escapeHtml(rec?.teamAbbr || '—')}</td>
          <td class="num">${rec?.year || '—'}</td>
        </tr>
      `;
    }).join('');

    bodyHtml = `
      ${sub === 'teamRecs' ? `
        <div style="margin-bottom:12px;">
          <select onchange="setRecordsTeamId(this.value)">
            ${league.teams.map(t => `<option value="${t.id}" ${t.id === targetTeam.id ? 'selected' : ''}>Club Record Board: ${escapeHtml(t.name)}</option>`).join('')}
          </select>
        </div>
      ` : ''}
      <div class="table-wrap" style="margin-bottom:16px;">
        <table class="data-table">
          <thead><tr><th>Individual Event</th><th class="num">Record Time</th><th>Record Holder</th><th>Club</th><th class="num">Season</th><th class="num">All-Time Mark</th></tr></thead>
          <tbody>${indRows}</tbody>
        </table>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Relay Event</th><th class="num">Record Time</th><th>Relay Quartet</th><th>Club</th><th class="num">Season</th></tr></thead>
          <tbody>${relRows}</tbody>
        </table>
      </div>
    `;
  } else if (sub === 'top10') {
    const evId = appState.recordsEventId || '100FR';
    const topList = league.top10?.[g]?.[evId] || [];
    const rows = topList.map((item, idx) => `
      <tr>
        <td class="num">#${idx + 1}</td>
        <td><button class="link-btn" onclick="openSwimmerModal('${item.swimmerId}')">${escapeHtml(item.swimmerName)}</button></td>
        <td>${escapeHtml(item.teamAbbr)}</td>
        <td class="num" style="font-weight:800;color:var(--accent-gold);">${formatTime(item.time)}</td>
        <td class="num">${item.year}</td>
      </tr>
    `).join('');

    bodyHtml = `
      <div style="margin-bottom:12px;">
        <select onchange="setRecordsEventId(this.value)">
          ${INDIVIDUAL_EVENTS.map(e => `<option value="${e.id}" ${e.id === evId ? 'selected' : ''}>Event: ${escapeHtml(e.name)}</option>`).join('')}
        </select>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th class="num">Rank</th><th>Swimmer</th><th>Club</th><th class="num">Best Official Time</th><th class="num">Year</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  } else if (sub === 'allTime') {
    const rows = INDIVIDUAL_EVENTS.map(ev => {
      const lRec = league.records?.[g]?.[ev.id];
      return `
        <tr>
          <td style="font-weight:800;">${escapeHtml(ev.name)}</td>
          <td class="num" style="font-weight:800;color:var(--accent-gold);">${formatTime(ev.allTime[g])}</td>
          <td class="num">${formatTime(ev.bm[g])}</td>
          <td class="num" style="color:var(--accent-cyan);">${lRec ? formatTime(lRec.time) : '—'}</td>
          <td>${lRec ? `${escapeHtml(lRec.swimmerName)} (${escapeHtml(lRec.teamAbbr)}, ${lRec.year})` : '—'}</td>
        </tr>
      `;
    }).join('');
    bodyHtml = `
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Event</th><th class="num">All-Time Historic Benchmark</th><th class="num">Typical Season #1 Target</th><th class="num">Current League Record</th><th>Holder</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  } else if (sub === 'history') {
    const champRows = (league.history.champions || []).map(c => `
      <tr>
        <td class="num">${c.year}</td>
        <td><button class="link-btn" onclick="openTeamModal('${c.teamId}')">${escapeHtml(c.teamName)}</button></td>
        <td>${escapeHtml(c.coachName)}</td>
        <td class="num">${escapeHtml(c.record)}</td>
        <td class="num">${c.finalScore}</td>
        <td>${escapeHtml(c.runnerUpAbbr)}</td>
      </tr>
    `).join('');

    const awardRows = (league.history.awardsByYear || []).map(a => `
      <tr>
        <td class="num">${a.year}</td>
        <td>${escapeHtml(a.womenSoty?.name)} (${escapeHtml(a.womenSoty?.teamAbbr)})</td>
        <td>${escapeHtml(a.menSoty?.name)} (${escapeHtml(a.menSoty?.teamAbbr)})</td>
        <td>${escapeHtml(a.womenRoty?.name)} / ${escapeHtml(a.menRoty?.name)}</td>
        <td>${escapeHtml(a.breakout?.name)} (${escapeHtml(a.breakout?.teamAbbr)})</td>
        <td>${escapeHtml(a.coty?.coachName)} (${escapeHtml(a.coty?.teamAbbr)})</td>
      </tr>
    `).join('');

    bodyHtml = `
      <h3 style="margin-bottom:8px;">Past ${escapeHtml(league.championshipName)} Champions</h3>
      <div class="table-wrap" style="margin-bottom:18px;">
        <table class="data-table">
          <thead><tr><th class="num">Year</th><th>Champion Club</th><th>Head Coach</th><th class="num">Reg Season</th><th class="num">Final Score</th><th>Runner-Up</th></tr></thead>
          <tbody>${champRows || '<tr><td colspan="6">Complete Season 1 to crown the first champion.</td></tr>'}</tbody>
        </table>
      </div>
      <h3 style="margin-bottom:8px;">Annual League Award Winners</h3>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th class="num">Year</th><th>Women's SOTY</th><th>Men's SOTY</th><th>Rookies of the Year</th><th>Breakout Swimmer</th><th>Coach of the Year</th></tr></thead>
          <tbody>${awardRows || '<tr><td colspan="6">No past season awards yet.</td></tr>'}</tbody>
        </table>
      </div>
    `;
  } else if (sub === 'hof') {
    const hofRows = (league.history.hallOfFame || []).map(h => `
      <tr>
        <td style="font-weight:800;">${escapeHtml(h.name)} (${h.gender})</td>
        <td>${escapeHtml(h.teamAbbr)}</td>
        <td class="num">${h.inductedYear} (Age ${h.ageRetired})</td>
        <td class="num" style="color:var(--accent-gold);font-weight:800;">${h.careerTitles}</td>
        <td class="num">${h.sotyCount}</td>
      </tr>
    `).join('');

    const retroClass = (league.history.draftClasses || [])[0];
    const retroRows = (retroClass?.picks || []).slice(0, 16).map(p => {
      const found = findSwimmerById(p.selectedSwimmerId);
      const curOvr = found?.swimmer ? found.swimmer.overall : '—';
      return `
        <tr>
          <td class="num">#${p.overall} (R${p.round})</td>
          <td>${escapeHtml(getTeamById(p.teamId)?.abbr || p.teamId)}</td>
          <td>${escapeHtml(p.selectedSwimmerName)} (${p.selectedSwimmerGender})</td>
          <td class="num">${curOvr}</td>
        </tr>
      `;
    }).join('');

    bodyHtml = `
      <h3 style="margin-bottom:8px;">NPSL Hall of Fame Inductees</h3>
      <div class="table-wrap" style="margin-bottom:18px;">
        <table class="data-table">
          <thead><tr><th>Swimmer</th><th>Primary Club</th><th class="num">Inducted</th><th class="num">Event Titles</th><th class="num">SOTY Awards</th></tr></thead>
          <tbody>${hofRows || '<tr><td colspan="5">Hall of Fame inductees appear as multi-title stars retire.</td></tr>'}</tbody>
        </table>
      </div>
      <h3 style="margin-bottom:8px;">Draft Class Retrospective ${retroClass ? `(${retroClass.year})` : ''}</h3>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th class="num">Pick</th><th>Club</th><th>Drafted Swimmer</th><th class="num">Current OVR</th></tr></thead>
          <tbody>${retroRows || '<tr><td colspan="4">Complete an offseason draft to view draft class retrospectives.</td></tr>'}</tbody>
        </table>
      </div>
    `;
  } else if (sub === 'gmResume') {
    const gm = league.gm;
    bodyHtml = `
      <div class="stat-cards">
        <div class="stat-card"><div class="stat-label">GM / Head Coach</div><div class="stat-value">${escapeHtml(gm.name)}</div></div>
        <div class="stat-card"><div class="stat-label">Seasons Coached</div><div class="stat-value">${gm.seasonsCoached}</div></div>
        <div class="stat-card"><div class="stat-label">Career Dual Record</div><div class="stat-value">${gm.careerWins}-${gm.careerLosses}</div></div>
        <div class="stat-card"><div class="stat-label">Division Titles</div><div class="stat-value">${gm.divisionTitles}</div></div>
        <div class="stat-card"><div class="stat-label">NPSL Championships</div><div class="stat-value">${gm.championships}</div></div>
        <div class="stat-card"><div class="stat-label">Coach of the Year</div><div class="stat-value">${gm.cotyAwards}</div></div>
      </div>
    `;
  }

  return `
    <div class="panel">
      <div class="panel-header">
        <div style="display:flex;gap:6px;flex-wrap:wrap;">${subNav}</div>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-sm ${g === 'F' ? 'btn-primary' : ''}" onclick="setRecordsGender('F')">Women</button>
          <button class="btn btn-sm ${g === 'M' ? 'btn-primary' : ''}" onclick="setRecordsGender('M')">Men</button>
        </div>
      </div>
      ${bodyHtml}
    </div>
  `;
}

  appState.recordsSubTab = s;
  renderApp();
}

function setRecordsGender(g) {
  appState.recordsGender = g;
  renderApp();
}

function setRecordsTeamId(id) {
  appState.recordsTeamId = id;
  renderApp();
}

function setRecordsEventId(evId) {
  appState.recordsEventId = evId;
  renderApp();
}

// ============================================================================
// TAB 7: LEAGUE HEALTH & DIAGNOSTIC VERIFICATION SCREEN
// ============================================================================
function renderHealthTab() {
  const league = appState.league;
  const report = runLeagueHealthCheck(league);
  const saveBytes = JSON.stringify(league).length;
  const saveMb = (saveBytes / (1024 * 1024)).toFixed(3);
  const g = appState.recordsGender || 'M';

  const invItems = [
    ['roster14F14M', 'Every Team Strictly 14W + 14M Active'],
    ['allTeamsUnderCap', 'All 24 Teams Under $4.20M Salary Cap'],
    ['noInvalidTimes', 'Zero NaN/Undefined Times or Ratings'],
    ['leagueRecFasterOrEqualTeamRec', 'League Records <= Every Team Record'],
    ['winsEqualLosses', 'Standings Wins Equal Losses'],
    ['noUnsignedStars', 'Zero Star Free Agents Left Unsigned']
  ].map(([k, label]) => `
    <div class="stat-card" style="border-left-color:${report.invariants[k] ? 'var(--accent-green)' : 'var(--accent-red)'};">
      <div class="stat-label">${escapeHtml(label)}</div>
      <div class="stat-value" style="color:${report.invariants[k] ? 'var(--accent-green)' : 'var(--accent-red)'};">${report.invariants[k] ? 'PASS' : 'FAIL'}</div>
    </div>
  `).join('');

  const depthRows = INDIVIDUAL_EVENTS.map(ev => {
    const d = report.eventDepthReport[g][ev.id];
    return `
      <tr>
        <td style="font-weight:800;">${escapeHtml(ev.name)}</td>
        <td class="num">${formatTime(d.benchmark)}</td>
        <td class="num" style="font-weight:800;color:var(--accent-gold);">${formatTime(d.t1)} (${d.err1Pct >= 0 ? '+' : ''}${d.err1Pct.toFixed(2)}%)</td>
        <td class="num">${formatTime(d.t8)} (+${d.gap8Pct.toFixed(2)}%)</td>
        <td class="num">${formatTime(d.t50)} (+${d.gap50Pct.toFixed(2)}%)</td>
        <td><span class="badge ${d.pass ? 'badge-peaked' : 'badge-injured'}">${d.pass ? 'PASS' : 'OUT'}</span></td>
      </tr>
    `;
  }).join('');

  return `
    <div class="panel">
      <div class="panel-header">
        <div>
          <div class="panel-title">Live League Health & Calibration Diagnostics (Season ${league.seasonYear})</div>
          <div style="font-size:12px;color:var(--text-muted);">Verifies all 6 hard invariants, #1 / #8 / #50 event calibration bands, dual-meet parity, aging curves, and save payload size.</div>
        </div>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-sm ${g === 'F' ? 'btn-primary' : ''}" onclick="setRecordsGender('F')">Women's Depth</button>
          <button class="btn btn-sm ${g === 'M' ? 'btn-primary' : ''}" onclick="setRecordsGender('M')">Men's Depth</button>
        </div>
      </div>

      <div class="stat-cards">${invItems}</div>

      <div class="stat-cards">
        <div class="stat-card">
          <div class="stat-label">Favorite Win Rate (Target 75%–85%)</div>
          <div class="stat-value">${report.parity.totalDualMeets > 0 ? `${report.parity.favoriteWinPct}%` : '78.5% (Pre)'}</div>
          <div class="stat-sub">Across ${report.parity.totalDualMeets} dual meets this season</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Open Entering Final Relay (12%–25%)</div>
          <div class="stat-value">${report.parity.totalDualMeets > 0 ? `${report.parity.openLastRelayPct}%` : '19.3% (Pre)'}</div>
          <div class="stat-sub">Within 9 pts before 400 Free Relay</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Projected Within 15 Pts (>= 40%)</div>
          <div class="stat-value">${report.parity.totalDualMeets > 0 ? `${report.parity.projectedWithin15Pct}%` : '44.0% (Pre)'}</div>
          <div class="stat-sub">Relay Early-Takeoff DQ Rate: ${report.parity.totalRelaysSwum > 0 ? `${report.parity.relayDqPct}%` : '1.00%'}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Annual Development Curve Means</div>
          <div class="stat-value" style="font-size:14px;">
            18-22: ${report.devSummary.age18_22Pct.toFixed(2)}% | 23-26: ${report.devSummary.age23_26Pct.toFixed(2)}%
          </div>
          <div class="stat-sub">27-29: +${report.devSummary.age27_29Pct.toFixed(2)}% | 30+: +${report.devSummary.age30PlusPct.toFixed(2)}%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Serialized Save Size (< 2.000 MB)</div>
          <div class="stat-value">${saveMb} MB</div>
          <div class="stat-sub">Records Broken This Season: ${report.parity.recordsBrokenThisSeason}</div>
        </div>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>${g === 'F' ? "Women's" : "Men's"} Event</th>
              <th class="num">Benchmark</th>
              <th class="num">#1 League Time (Band ±1%)</th>
              <th class="num">#8 Time (+1.5% to +3.0%)</th>
              <th class="num">#50 Time (+4.0% to +6.0%)</th>
              <th>Gate 1</th>
            </tr>
          </thead>
          <tbody>${depthRows}</tbody>
        </table>
      </div>
    </div>
  `;
}

// ============================================================================
// MODALS: SWIMMER PROFILE, TEAM PROFILE, NEW FRANCHISE, OWNER FIRED
// ============================================================================
function openSwimmerModal(swimmerId) {
  const found = findSwimmerById(swimmerId);
  if (!found || !found.swimmer) return;
  appState.modal = { type: 'swimmer', swimmer: found.swimmer, team: found.team };
  renderModalRoot();
}

function openTeamModal(teamId) {
  const team = getTeamById(teamId);
  if (!team) return;
  appState.modal = { type: 'team', team };
  renderModalRoot();
}

function openNewGameModal() {
  appState.modal = { type: 'newGame' };
  renderModalRoot();
}

function openOwnerFiredModal() {
  const league = appState.league;
  const offers = league.teams.filter(t => t.id !== league.userTeamId).slice(-3);
  appState.modal = { type: 'fired', offers };
  renderModalRoot();
}

function closeModal() {
  appState.modal = null;
  renderModalRoot();
}

function renderModalRoot() {
  const root = document.getElementById('modal-root');
  if (!root) return;
  if (!appState.modal) {
    root.innerHTML = '';
    return;
  }

  const m = appState.modal;

  if (m.type === 'swimmer') {
    const s = m.swimmer;
    const t = m.team;
    const pp = getSwimmerBestPowerPoints(s);
    const evRows = INDIVIDUAL_EVENTS.map(ev => {
      const sb = s.seasonBests?.[ev.id];
      const pb = s.pbs?.[ev.id];
      const proj = getProjectedSwimTime(s, ev.id);
      const tap = getTaperedBaseTime(s, ev.id);
      return `
        <tr>
          <td style="font-weight:700;">${escapeHtml(ev.name)}</td>
          <td class="num" style="color:var(--accent-gold);font-weight:700;">${formatTime(sb)}</td>
          <td class="num">${formatTime(pb)}</td>
          <td class="num">${formatTime(proj)}</td>
          <td class="num" style="color:var(--accent-cyan);">${formatTime(tap)}</td>
          <td class="num">${calcPowerPoints(ev.id, s.gender, pb || tap)}</td>
        </tr>
      `;
    }).join('');

    root.innerHTML = `
      <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
        <div class="modal-card">
          <div class="panel-header">
            <div>
              <div class="panel-title">${escapeHtml(s.name)} (${s.gender}, Age ${s.age}) — ${escapeHtml(t?.name || 'Free Agent')}</div>
              <div style="font-size:12px;color:var(--text-muted);">
                Archetype: <b>${escapeHtml(ARCHETYPE_NAMES[s.archetype] || s.archetype)}</b> • OVR: <b>${s.overall}</b> (POT ${s.potential}) • Best Power Points: <b>${pp.powerPoints}</b> (${escapeHtml(EVENT_MAP[pp.bestEvent]?.name)})
              </div>
            </div>
            <button class="btn btn-sm" onclick="closeModal()">Close</button>
          </div>

          <div class="stat-cards">
            <div class="stat-card"><div class="stat-label">Starts / Turns / Exch</div><div class="stat-value" style="font-size:16px;">${s.start} / ${s.turns} / ${s.relayExchange}</div></div>
            <div class="stat-card"><div class="stat-label">Taper Resp / Clutch / Dur</div><div class="stat-value" style="font-size:16px;">${s.taperResponse.toFixed(2)}x / ${s.clutch} / ${s.durability}</div></div>
            <div class="stat-card"><div class="stat-label">Career Titles / SOTY</div><div class="stat-value" style="font-size:16px;">${s.careerTitles || 0} / ${s.sotyCount || 0}</div></div>
            <div class="stat-card"><div class="stat-label">Contract</div><div class="stat-value" style="font-size:16px;">${formatMoney(s.contract?.salary)} (${s.contract?.years || 1}y)</div></div>
          </div>

          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Event</th><th class="num">Season Best</th><th class="num">Personal Best (PB)</th><th class="num">Current Projected</th><th class="num">Rested Ceiling</th><th class="num">Power Pts</th></tr></thead>
              <tbody>${evRows}</tbody>
            </table>
          </div>
        </div>
      </div>
    `;
    return;
  }

  if (m.type === 'team') {
    const t = m.team;
    const payroll = t.roster.reduce((sum, s) => sum + (s.contract?.salary || 0), 0);
    const rows = t.roster.slice().sort((a, b) => b.overall - a.overall).map(s => {
      const pp = getSwimmerBestPowerPoints(s);
      return `
        <tr>
          <td><button class="link-btn" onclick="openSwimmerModal('${s.id}')">${escapeHtml(s.name)}</button></td>
          <td>${s.gender} • ${s.age}y</td>
          <td>${escapeHtml(ARCHETYPE_NAMES[s.archetype] || s.archetype)}</td>
          <td class="num">${s.overall} / ${s.potential}</td>
          <td class="num" style="color:var(--accent-gold);font-weight:700;">${pp.powerPoints}</td>
          <td class="num">${formatMoney(s.contract?.salary)}</td>
        </tr>
      `;
    }).join('');

    root.innerHTML = `
      <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
        <div class="modal-card">
          <div class="panel-header">
            <div style="display:flex;align-items:center;gap:10px;">
              ${renderTeamEmblem(t, 'sm')}
              <div>
                <div class="panel-title">${escapeHtml(t.name)} (${escapeHtml(t.city)})</div>
                <div style="font-size:12px;color:var(--text-muted);">
                  Division: ${escapeHtml(t.division)} • Coach: ${escapeHtml(t.coachName)} • Pool: ${escapeHtml(t.poolName)} • Record: ${t.wins}-${t.losses} • Payroll: ${formatMoney(payroll)}
                </div>
              </div>
            </div>
            <button class="btn btn-sm" onclick="closeModal()">Close</button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Swimmer</th><th>G/Age</th><th>Archetype</th><th class="num">OVR / POT</th><th class="num">Power Pts</th><th class="num">Salary</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      </div>
    `;
    return;
  }

  if (m.type === 'newGame') {
    const f = appState.newGameForm;
    const teamOpts = TEAM_DEFINITIONS.map(td => `
      <option value="${td.id}" ${td.id === f.userTeamId ? 'selected' : ''}>
        [${td.division}] ${escapeHtml(td.name)} (${escapeHtml(td.city)})
      </option>
    `).join('');

    root.innerHTML = `
      <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
        <div class="modal-card" style="max-width:620px;">
          <div class="panel-header">
            <div class="panel-title">Start New Pro Swimming Dynasty Franchise</div>
            <button class="btn btn-sm" onclick="closeModal()">Cancel</button>
          </div>
          <div style="display:grid;gap:12px;">
            <div>
              <label style="display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px;">Select Your Club (24 Clubs in 4 Divisions; Blue Springs Power Cats Preselected)</label>
              <select id="ng-team" style="width:100%;" onchange="appState.newGameForm.userTeamId = this.value">
                ${teamOpts}
              </select>
            </div>
            <div class="grid-2">
              <div>
                <label style="display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px;">Starting Roster Tier</label>
                <select id="ng-tier" style="width:100%;" onchange="appState.newGameForm.startTier = this.value">
                  <option value="contender" ${f.startTier === 'contender' ? 'selected' : ''}>Contender (Championship Window)</option>
                  <option value="middle" ${f.startTier === 'middle' ? 'selected' : ''}>Middle of the Pack (Balanced)</option>
                  <option value="underdog" ${f.startTier === 'underdog' ? 'selected' : ''}>Underdog (Rebuild & Cap Flexibility)</option>
                </select>
              </div>
              <div>
                <label style="display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px;">League PRNG Seed (Deterministic Replay)</label>
                <input type="text" id="ng-seed" value="${escapeHtml(f.seed)}" style="width:100%;" oninput="appState.newGameForm.seed = this.value">
              </div>
            </div>
            <div>
              <label style="display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px;">General Manager & Head Coach Name</label>
              <input type="text" id="ng-gm" value="${escapeHtml(f.gmName)}" style="width:100%;" oninput="appState.newGameForm.gmName = this.value">
            </div>
            <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px;">
              <button class="btn" onclick="randomizeNewGameSeed()">Randomize Seed</button>
              <button class="btn btn-gold" onclick="confirmStartNewFranchise()">Launch Franchise</button>
            </div>
          </div>
        </div>
      </div>
    `;
    return;
  }

  if (m.type === 'fired') {
    const offerButtons = (m.offers || []).map(t => `
      <button class="btn btn-primary" onclick="acceptNewClubJob('${t.id}')">Take Over ${escapeHtml(t.name)} (${escapeHtml(t.division)})</button>
    `).join(' ');
    root.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-card" style="max-width:560px;">
          <div class="panel-header"><div class="panel-title">Ownership Change — Select Your Next Club</div></div>
          <p style="margin-bottom:14px;color:var(--text-muted);">
            After falling short of club expectations, ownership has decided to make a coaching change. Three clubs have offered you their General Manager & Head Coach position to continue your career:
          </p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">${offerButtons}</div>
        </div>
      </div>
    `;
  }
}

function randomizeNewGameSeed() {
  const num = Math.floor(nextCosmeticRng() * 900000) + 100000;
  appState.newGameForm.seed = `NPSL-${num}`;
  renderModalRoot();
}

function confirmStartNewFranchise() {
  stopPoolAnimation();
  const f = appState.newGameForm;
  appState.league = createInitialLeague({
    userTeamId: f.userTeamId || 'BSPC',
    seed: (f.seed || 'BSPC-2026').trim(),
    startTier: f.startTier || 'middle',
    gmName: (f.gmName || 'Coach Taylor').trim()
  });
  appState.lineupDraft = null;
  appState.activeMeetResult = null;
  appState.activeChampResult = null;
  appState.recordsTeamId = appState.league.userTeamId;
  appState.modal = null;
  saveLeagueToStorage();
  renderApp();
}

function acceptNewClubJob(newTeamId) {
  const league = appState.league;
  const oldTeam = getUserTeam();
  if (oldTeam) oldTeam.ownerPatience = 75;
  league.userTeamId = newTeamId;
  const newTeam = getUserTeam();
  if (newTeam) {
    newTeam.coachName = league.gm.name;
    newTeam.ownerPatience = 75;
  }
  league.gm.teamsHistory.push({ teamId: newTeamId, startYear: league.seasonYear, endYear: null });
  appState.modal = null;
  saveLeagueToStorage();
  renderApp();
}

// --- INITIALIZATION ON WINDOW LOAD ---
function initApp() {
  const saved = loadLeagueFromStorage();
  if (saved) {
    appState.league = saved;
  } else {
    appState.league = createInitialLeague({
      userTeamId: 'BSPC',
      seed: 'BSPC-2026',
      startTier: 'middle',
      gmName: 'Coach Taylor'
    });
    saveLeagueToStorage();
  }
  appState.recordsTeamId = appState.league.userTeamId;
  renderApp();
}

if (typeof window !== 'undefined') {
  window.addEventListener('DOMContentLoaded', initApp);
}

  </script>
</body>
