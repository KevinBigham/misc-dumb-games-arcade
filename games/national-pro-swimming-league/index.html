<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>National Pro Swimming League — Franchise & Head Coach Dynasty Sim</title>
  <style>
:root {
  --bg-deep: #070d17;
  --bg-panel: #0d1626;
  --bg-card: #121f36;
  --bg-card-hover: #182946;
  --bg-pool: #062b4c;
  --border-subtle: #1f3354;
  --border-bright: #2e4d7d;
  --text-main: #edf3fb;
  --text-muted: #93a8c7;
  --text-dim: #627899;
  --team-primary: #004b87;
  --team-secondary: #d4af37;
  --accent-cyan: #00d2ff;
  --accent-gold: #f5b942;
  --accent-green: #22c55e;
  --accent-red: #ef4444;
  --accent-amber: #f59e0b;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  background: var(--bg-deep);
  color: var(--text-main);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.45;
  min-height: 100vh;
  overflow-x: hidden;
}

.num, td.num, th.num, .time-cell, .split-pill, .score-big {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}

/* Header & Broadcast Topbar */
.app-header {
  background: linear-gradient(135deg, var(--team-primary) 0%, #091322 70%);
  border-bottom: 2px solid var(--team-secondary);
  padding: 10px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.team-emblem {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 15px;
  letter-spacing: 0.5px;
  border: 2px solid rgba(255, 255, 255, 0.85);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
  flex-shrink: 0;
  user-select: none;
}

.team-emblem.sm {
  width: 28px;
  height: 28px;
  font-size: 11px;
  border-radius: 6px;
  border-width: 1.5px;
}

.header-titles h1 {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 8px;
}

.header-subtitle {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.82);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

/* Navigation Bar (Lane-Line Rule Aesthetic) */
.nav-bar {
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border-subtle);
  padding: 0 18px;
  display: flex;
  align-items: center;
  gap: 4px;
  overflow-x: auto;
}

.nav-tab {
  background: transparent;
  color: var(--text-muted);
  border: none;
  border-bottom: 3px solid transparent;
  padding: 11px 14px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s ease;
}

.nav-tab:hover {
  color: var(--text-main);
  background: rgba(255, 255, 255, 0.03);
}

.nav-tab.active {
  color: var(--accent-gold);
  border-bottom-color: var(--team-secondary);
  background: rgba(255, 255, 255, 0.05);
}

/* Main Container & Grid */
.main-container {
  max-width: 1440px;
  margin: 0 auto;
  padding: 18px;
}

.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

.grid-sidebar {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 16px;
}

@media (max-width: 980px) {
  .grid-2, .grid-3, .grid-sidebar {
    grid-template-columns: 1fr;
  }
}

/* Panels & Cards */
.panel {
  background: var(--bg-panel);
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 10px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--border-subtle);
  flex-wrap: wrap;
}

.panel-title {
  font-size: 15px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 8px;
}

.stat-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-left: 4px solid var(--team-secondary);
  border-radius: 8px;
  padding: 12px 14px;
}

.stat-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.stat-value {
  font-size: 20px;
  font-weight: 800;
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}

.stat-sub {
  font-size: 11.5px;
  color: var(--text-dim);
  margin-top: 2px;
}

/* Buttons & Inputs */
.btn {
  background: var(--bg-card-hover);
  color: var(--text-main);
  border: 1px solid var(--border-bright);
  border-radius: 6px;
  padding: 7px 13px;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.14s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn:hover:not(:disabled) {
  background: #22385e;
  border-color: var(--accent-cyan);
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-primary {
  background: linear-gradient(135deg, #0072ce, #005199);
  border-color: #38bdf8;
  color: #fff;
}

.btn-primary:hover:not(:disabled) {
  background: linear-gradient(135deg, #0ea5e9, #0284c7);
}

.btn-gold {
  background: linear-gradient(135deg, #d97706, #b45309);
  border-color: #fbbf24;
  color: #fff;
}

.btn-gold:hover:not(:disabled) {
  background: linear-gradient(135deg, #f59e0b, #d97706);
}

.btn-success {
  background: linear-gradient(135deg, #16a34a, #15803d);
  border-color: #4ade80;
  color: #fff;
}

.btn-danger {
  background: linear-gradient(135deg, #dc2626, #991b1b);
  border-color: #f87171;
  color: #fff;
}

.btn-sm {
  padding: 4px 9px;
  font-size: 11.5px;
}

input[type="text"], input[type="number"], select {
  background: #08101d;
  color: var(--text-main);
  border: 1px solid var(--border-bright);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 13px;
}

/* Heat Sheet & Record Board Tables */
.table-wrap {
  width: 100%;
  overflow-x: auto;
}

table.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

table.data-table th, table.data-table td {
  padding: 7px 10px;
  text-align: left;
  border-bottom: 1px solid rgba(31, 51, 84, 0.7);
}

table.data-table th {
  background: rgba(18, 31, 54, 0.9);
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}

table.data-table th:hover {
  color: var(--accent-cyan);
}

table.data-table tr:hover td {
  background: rgba(255, 255, 255, 0.03);
}

table.data-table td.num, table.data-table th.num {
  text-align: right;
}

/* Clickable links for swimmers & teams */
.link-btn {
  background: none;
  border: none;
  color: #60a5fa;
  font-weight: 700;
  cursor: pointer;
  padding: 0;
  font-size: inherit;
  text-align: left;
}

.link-btn:hover {
  color: var(--accent-cyan);
  text-decoration: underline;
}

/* Badges & Pills */
.badge {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.badge-peaked { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
.badge-resting { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid #0284c7; }
.badge-training { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; border: 1px solid #475569; }
.badge-fading { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #d97706; }
.badge-injured { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #dc2626; }
.badge-gold { background: rgba(245, 185, 66, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }

/* Pool Broadcast View */
.pool-deck {
  background: linear-gradient(180deg, #041e38 0%, #062f56 50%, #041e38 100%);
  border: 2px solid #1e4b7a;
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 16px;
  position: relative;
}

.pool-scoreboard {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(7, 13, 23, 0.88);
  border: 1px solid var(--border-bright);
  border-radius: 8px;
  padding: 10px 16px;
  margin-bottom: 12px;
  flex-wrap: wrap;
  gap: 12px;
}

.pool-lanes {
  background: #053b6e;
  border: 3px solid #cbd5e1;
  border-radius: 4px;
  position: relative;
  overflow: hidden;
}

.pool-lane {
  height: 44px;
  border-bottom: 2px dashed rgba(239, 68, 68, 0.65);
  display: flex;
  align-items: center;
  position: relative;
  padding: 0 10px;
}

.pool-lane:last-child {
  border-bottom: none;
}

.pool-flags-left, .pool-flags-right {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  background: rgba(251, 191, 36, 0.55);
  z-index: 1;
}
.pool-flags-left { left: 18%; }
.pool-flags-right { right: 18%; }

.lane-label {
  position: relative;
  z-index: 3;
  font-size: 11.5px;
  font-weight: 800;
  color: rgba(255, 255, 255, 0.92);
  background: rgba(7, 13, 23, 0.72);
  padding: 2px 7px;
  border-radius: 4px;
  pointer-events: none;
}

.swimmer-puck {
  position: absolute;
  top: 7px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 900;
  color: #fff;
  border: 2px solid #fff;
  box-shadow: 0 0 12px rgba(0, 210, 255, 0.8);
  z-index: 4;
  transition: left 0.06s linear;
}

/* Modals */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(3, 7, 15, 0.82);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 500;
  padding: 16px;
}

.modal-card {
  background: var(--bg-panel);
  border: 1px solid var(--border-bright);
  border-radius: 12px;
  max-width: 900px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 20px;
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.65);
}

.storage-warning {
  background: rgba(239, 68, 68, 0.18);
  border: 1px solid var(--accent-red);
  color: #fca5a5;
  padding: 10px 16px;
  margin: 10px 18px 0;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

  </style>
</head>

// --- 3. SEEDED PRNG (Pure state transitions inside leagueState.rngState) ---
function hashSeed(input) {
  const str = String(input ?? 'NPSL-2026');
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0) || 0x12345678;
}

function nextRng(stateHolder) {
  let t = (stateHolder.rngState = (stateHolder.rngState + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

function rngRange(stateHolder, min, max) {
  return min + nextRng(stateHolder) * (max - min);
}

function rngInt(stateHolder, min, max) {
  return Math.floor(rngRange(stateHolder, min, max + 1));
}

function rngNormal(stateHolder, mean = 0, sd = 1) {
  let u1 = nextRng(stateHolder);
  let u2 = nextRng(stateHolder);
  if (u1 < 1e-7) u1 = 1e-7;
  const z = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
  return mean + z * sd;
}

function rngChoice(stateHolder, arr) {
  return arr[Math.floor(nextRng(stateHolder) * arr.length)];
}

function rngShuffle(stateHolder, arr) {
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(nextRng(stateHolder) * (i + 1));
    const tmp = copy[i];
    copy[i] = copy[j];
    copy[j] = tmp;
  }
  return copy;
}

// Separate cosmetic RNG so UI never alters leagueState.rngState
const cosmeticRngState = { rngState: 0x9E3779B9 };
function nextCosmeticRng() {
  return nextRng(cosmeticRngState);
}

// --- 4. TIME FORMATTING & POWER POINTS ---
function formatTime(sec) {
  if (sec === null || sec === undefined || Number.isNaN(sec)) return '—';
  if (sec >= 9999) return 'DQ';
  const rounded = Math.round(sec * 100) / 100;
  const mins = Math.floor(rounded / 60);
  const rem = rounded - mins * 60;
  if (mins === 0) {
    return rem.toFixed(2);
  }
  const secStr = rem < 10 ? '0' + rem.toFixed(2) : rem.toFixed(2);
  return `${mins}:${secStr}`;
}

function calcPowerPoints(eventId, gender, timeSec) {
  if (!timeSec || timeSec <= 0 || timeSec >= 9000) return 0;
  const ev = EVENT_MAP[eventId];
  if (!ev) return 0;
  const bm = ev.mixed ? ev.bm.X : ev.bm[gender];
  if (!bm) return 0;
  const ratio = bm / timeSec;
  return Math.round(1000 * ratio * ratio * ratio);
}
