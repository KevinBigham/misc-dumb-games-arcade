  const league = appState.league;
  stopPoolAnimation();

  if (league.phase === 'regular') {
    const match = getCurrentUserMatchup(league);
    const customLineup = ensureLineupDraft();
    const val = validateDualLineup(getUserTeam(), customLineup, match.cardType, league.week);
    const lineupToUse = val.valid ? customLineup : null;

    const wkCompleted = simulateRegularSeasonWeek(league, lineupToUse);
    appState.lineupDraft = null;
    appState.lineupDraftWeekKey = null;
    appState.scheduleFilterWeek = wkCompleted ? wkCompleted.week : Math.max(1, league.week - 1);

    const userMeet = wkCompleted?.matchups.find(
      m => m.homeTeamId === league.userTeamId || m.awayTeamId === league.userTeamId
    )?.result || wkCompleted?.matchups[0]?.result;

    appState.activeMeetResult = userMeet || null;
    appState.activeChampResult = null;
    saveLeagueToStorage();

    if (userMeet) {
      appState.activeTab = 'meet';
      if (watchLive) {
        startPoolBroadcast(userMeet, false);
      } else {
        appState.poolAnim.active = false;
      }
    }
    renderApp();
    return;
  }

  if (league.phase === 'playoffs_r1' || league.phase === 'playoffs_r2') {
    const match = getCurrentUserMatchup(league);
    let lineupToUse = null;
    let cardChoice = appState.chosenPlayoffCard;
    if (match && match.type === 'dual') {
      const draft = ensureLineupDraft();
      const val = validateDualLineup(getUserTeam(), draft, match.cardType, match.week);
      if (val.valid) lineupToUse = draft;
    }

    const roundMatches = simulatePlayoffRound(league, lineupToUse, cardChoice);
    appState.lineupDraft = null;
    appState.lineupDraftWeekKey = null;
    appState.chosenPlayoffCard = null;

    const userPlayoffMeet = (roundMatches || []).find(
      m => m.homeTeamId === league.userTeamId || m.awayTeamId === league.userTeamId
    )?.result || roundMatches?.[0]?.result;

    appState.activeMeetResult = userPlayoffMeet || null;
    appState.activeChampResult = null;
    saveLeagueToStorage();

    if (userPlayoffMeet) {
      appState.activeTab = 'meet';
      if (watchLive) {
        startPoolBroadcast(userPlayoffMeet, false);
      } else {
        appState.poolAnim.active = false;
      }
    }
    renderApp();
    return;
  }

  if (league.phase === 'championship') {
    const finalRes = simulatePlayoffRound(league, null, null);
    appState.activeChampResult = finalRes;
    appState.activeMeetResult = null;
    saveLeagueToStorage();
    appState.activeTab = 'meet';
    if (watchLive && finalRes) {
      startPoolBroadcast(finalRes, true);
    } else {
      appState.poolAnim.active = false;
    }
    renderApp();
  }
}

function quickSimToPlayoffs() {
  const league = appState.league;
  stopPoolAnimation();
  while (league.phase === 'regular') {
    simulateRegularSeasonWeek(league, null);
  }
  appState.lineupDraft = null;
  appState.scheduleFilterWeek = 14;
  saveLeagueToStorage();
  renderApp();
}

function quickSimFullSeason() {
  const league = appState.league;
  stopPoolAnimation();
  if (league.phase === 'offseason') {
    advanceFullOffseasonFromCurrentStep();
  } else {
    simulateCompleteSeasonHeadless(league);
  }
  appState.lineupDraft = null;
  saveLeagueToStorage();
  renderApp();
}

function quickSimMultiSeasons(count = 5) {
  const league = appState.league;
  stopPoolAnimation();
  for (let i = 0; i < count; i++) {
    if (league.phase !== 'offseason') {
      simulateCompleteSeasonHeadless(league);
    }
    advanceFullOffseasonFromCurrentStep();
  }
  appState.lineupDraft = null;
  saveLeagueToStorage();
  renderApp();
}

function advanceFullOffseasonFromCurrentStep() {
  const league = appState.league;
  if (league.phase !== 'offseason') return;
  const step = league.offseasonStep || 'awards';

  if (step === 'awards') {
    processSeasonAwards(league);
    league.offseasonStep = 'retirements';
  }
  if (league.offseasonStep === 'retirements') {
    appState.lastRetiredList = processRetirementsAndDevelopment(league);
    league.offseasonStep = 'resigning';
  }
  if (league.offseasonStep === 'resigning') {
    if (!league.expiringSwimmers) prepareOffseasonContracts(league);
    for (const t of league.teams) autoResignTeamExpiring(league, t);
    league.offseasonStep = 'draft';
  }
  if (league.offseasonStep === 'draft') {
    if (!league.draft || league.draft.year !== league.seasonYear) {
      initDraftAndLottery(league);
    }
    finishRemainingDraft(league);
    league.offseasonStep = 'freeAgency';
  }
  if (league.offseasonStep === 'freeAgency') {
    runCpuFreeAgencyAndRosterTrim(league);
    startNextSeason(league);
  }
}

// --- POOL ANIMATION CONTROLLER (PURELY COSMETIC OVER PRE-SIMULATED MEET) ---
function stopPoolAnimation() {
  if (appState.poolAnim.timerId) {
    clearInterval(appState.poolAnim.timerId);
    appState.poolAnim.timerId = null;
  }
  appState.poolAnim.playing = false;
}

function getPoolRaceList() {
  if (appState.poolAnim.isChampionship && appState.activeChampResult) {
    const flat = [];
    for (const d of appState.activeChampResult.days) {
      for (const ev of d.events) flat.push(ev);
    }
    return flat;
  }
  if (appState.activeMeetResult) {
    return appState.activeMeetResult.events || [];
  }
  return [];
}

function startPoolBroadcast(meetOrChamp, isChampionship = false) {
  stopPoolAnimation();
  appState.poolAnim.active = true;
  appState.poolAnim.isChampionship = isChampionship;
  appState.poolAnim.raceIdx = 0;
  appState.poolAnim.elapsed = 0;
  appState.poolAnim.playing = true;
  appState.poolAnim.duration = 8;

  appState.poolAnim.timerId = setInterval(() => {
    if (!appState.poolAnim.playing) return;
    const races = getPoolRaceList();
    const curRace = races[appState.poolAnim.raceIdx];
    if (!curRace) {
      stopPoolAnimation();
      renderApp();
      return;
    }
    const validTimes = curRace.entries.filter(e => !e.dq && e.time < 9000).map(e => e.time);
    const maxRaceTime = validTimes.length > 0 ? Math.max(...validTimes) : 50;
    // Scale simulation clock so sprint races take ~6s and distance races ~10s at 1x
    const simStep = (maxRaceTime / 90) * 0.65 * appState.poolAnim.speed;
    appState.poolAnim.elapsed += simStep;

    if (appState.poolAnim.elapsed >= maxRaceTime + 1.5) {
      appState.poolAnim.elapsed = maxRaceTime;
      appState.poolAnim.playing = false;
    }
    updatePoolBroadcastDOM();
  }, 60);
}

function updatePoolBroadcastDOM() {
  const container = document.getElementById('pool-broadcast-live');
  if (!container) return;
  container.innerHTML = renderPoolBroadcastInnerHtml();
}

function renderPoolBroadcastInnerHtml() {
  const races = getPoolRaceList();
  if (races.length === 0) return '';
  const idx = Math.min(appState.poolAnim.raceIdx, races.length - 1);
  const race = races[idx];
  const validTimes = race.entries.filter(e => !e.dq && e.time < 9000).map(e => e.time);
  const maxTime = validTimes.length > 0 ? Math.max(...validTimes) : 50;
  const elapsed = Math.min(maxTime, appState.poolAnim.elapsed);
  const finished = elapsed >= maxTime - 0.01;

  const evDef = EVENT_MAP[race.eventId] || { dist: 100, name: race.label };
  const numLengths = Math.max(2, Math.round((evDef.dist || 100) / 25));

  // Running team score up to current race (only shown in full once race finishes, or prior race score while swimming)
  let scoreBannerHtml = '';
  if (!appState.poolAnim.isChampionship && appState.activeMeetResult) {
    const m = appState.activeMeetResult;
    const prevRace = idx > 0 ? races[idx - 1] : null;
    const hScore = finished ? race.runningHomeScore : (prevRace ? prevRace.runningHomeScore : 0);
    const aScore = finished ? race.runningAwayScore : (prevRace ? prevRace.runningAwayScore : 0);
    scoreBannerHtml = `
      <div style="display:flex;align-items:center;gap:14px;">
        <span style="font-weight:800;font-size:15px;">${escapeHtml(m.homeAbbr)} <span class="num" style="color:var(--accent-gold);">${hScore}</span></span>
        <span style="color:var(--text-dim);">vs</span>
        <span style="font-weight:800;font-size:15px;">${escapeHtml(m.awayAbbr)} <span class="num" style="color:var(--accent-cyan);">${aScore}</span></span>
      </div>
    `;
  } else if (appState.poolAnim.isChampionship && appState.activeChampResult) {
    const scores = race.runningScores || {};
    scoreBannerHtml = Object.entries(scores)
      .map(([tId, sc]) => {
        const t = getTeamById(tId);
        return `<span style="margin-right:10px;font-weight:700;">${escapeHtml(t?.abbr || tId)}: <span class="num" style="color:var(--accent-gold);">${sc}</span></span>`;
      })
      .join('');
  }

  const maxLanes = appState.poolAnim.isChampionship ? 8 : 6;
  const lanesHtml = [];
  for (let laneNum = 1; laneNum <= maxLanes; laneNum++) {
    const entry = race.entries.find(e => e.lane === laneNum);
    if (!entry) {
      lanesHtml.push(`
        <div class="pool-lane">
          <div class="pool-flags-left"></div>
          <div class="pool-flags-right"></div>
          <span class="lane-label">L${laneNum} — Empty</span>
        </div>
      `);
      continue;
    }

    const team = getTeamById(entry.teamId);
    const entryTime = entry.dq ? maxTime : entry.time;
    const frac = Math.max(0, Math.min(1, elapsed / Math.max(1, entryTime)));

    // Compute back-and-forth 25-yard pool position
    const lengthProgress = frac * numLengths;
    const curLengthIdx = Math.min(numLengths - 1, Math.floor(lengthProgress));
    const remInLength = (frac >= 1) ? 1 : (lengthProgress - curLengthIdx);
    const goingRight = (curLengthIdx % 2) === 0;
    const xPct = goingRight ? (4 + remInLength * 90) : (94 - remInLength * 90);

    // Current split or leg info
    let splitBadge = '';
    if (finished) {
      if (entry.dq) {
        splitBadge = `<span class="badge badge-injured">EARLY TAKEOFF DQ (Leg ${entry.dqLeg || 2})</span>`;
      } else {
        splitBadge = `<span class="badge badge-peaked">#${entry.place} — ${formatTime(entry.time)} (+${entry.points} pts)</span>`;
      }
    } else if (!race.isRelay && entry.splits && entry.splits.length > 0) {
      const splitIdx = Math.min(entry.splits.length - 1, Math.floor(frac * entry.splits.length));
      splitBadge = `<span class="num" style="font-size:11px;color:var(--accent-cyan);">50 Split #${splitIdx + 1}: ${entry.splits[splitIdx].toFixed(2)}</span>`;
    } else if (race.isRelay && entry.legTimes && entry.legTimes.length === 4) {
      const legIdx = Math.min(3, Math.floor(frac * 4));
      const rt = entry.reactionTimes?.[legIdx] ?? 0;
      const rtStr = legIdx === 0 ? `Flat +${rt.toFixed(2)}s` : `Exch ${rt >= 0 ? '+' : ''}${rt.toFixed(2)}s`;
      splitBadge = `<span class="num" style="font-size:11px;color:var(--accent-cyan);">Leg ${legIdx + 1} (${escapeHtml(entry.swimmerNames?.[legIdx] || '')}) ${rtStr}</span>`;
    }

    const labelName = race.isRelay
      ? `${entry.teamAbbr} '${entry.relayTag || 'A'}' (${(entry.swimmerNames || []).map(n => n.split(' ').pop()).join('/')})`
      : `${entry.swimmerName} (${entry.teamAbbr})`;

    lanesHtml.push(`
      <div class="pool-lane">
        <div class="pool-flags-left"></div>
        <div class="pool-flags-right"></div>
        <div style="display:flex;justify-content:space-between;width:100%;align-items:center;z-index:3;pointer-events:none;">
          <span class="lane-label">L${laneNum}: ${escapeHtml(labelName)}</span>
          <span>${splitBadge}</span>
        </div>
        <div class="swimmer-puck" style="left:${xPct.toFixed(1)}%;background:${team?.primary || '#0284c7'};border-color:${team?.secondary || '#fff'};">
          ${escapeHtml(entry.teamAbbr)}
        </div>
      </div>
    `);
  }

  // Build live 50-yard splits table for this race
  let splitsTableHtml = '';
  if (!race.isRelay) {
    const rows = race.entries
      .slice()
      .sort((a, b) => (a.place || 99) - (b.place || 99))
      .map(ent => {
        const spPills = (ent.splits || [])
          .map((s, sIdx) => `<span class="split-pill" style="display:inline-block;margin:1px 3px;padding:1px 5px;background:rgba(255,255,255,0.06);border-radius:4px;font-size:11px;">${(sIdx + 1) * 50}y: ${s.toFixed(2)}</span>`)
          .join('');
        return `
          <tr>
            <td class="num">${ent.place || 'DQ'}</td>
            <td>L${ent.lane}</td>
            <td><button class="link-btn" onclick="openSwimmerModal('${ent.swimmerId}')">${escapeHtml(ent.swimmerName)}</button> (${escapeHtml(ent.teamAbbr)})</td>
            <td class="num">${formatTime(ent.seedTime)}</td>
            <td class="num" style="font-weight:800;color:var(--accent-gold);">${finished ? formatTime(ent.time) : 'Swimming...'}</td>
            <td class="num">${finished ? ent.points : '—'}</td>
            <td>${spPills}</td>
          </tr>
        `;
      })
      .join('');
    splitsTableHtml = `
      <div class="table-wrap" style="margin-top:10px;">
        <table class="data-table">
          <thead>
            <tr>
              <th class="num">Pl</th>
              <th>Lane</th>
              <th>Swimmer</th>
              <th class="num">Seed</th>
              <th class="num">Final</th>
              <th class="num">Pts</th>
              <th>50-Yard Splits</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  } else {
    const rows = race.entries
      .slice()
      .sort((a, b) => (a.place || 99) - (b.place || 99))
      .map(ent => {
        const legDetails = (ent.legTimes || [])
          .map((lt, lIdx) => {
            const rt = ent.reactionTimes?.[lIdx] ?? 0;
            const rtLabel = lIdx === 0 ? `Flat` : `${rt >= 0 ? '+' : ''}${rt.toFixed(2)}s`;
            return `<span class="split-pill" style="display:inline-block;margin:1px 4px;padding:2px 6px;background:rgba(255,255,255,0.06);border-radius:4px;font-size:11px;">L${lIdx + 1} ${escapeHtml(ent.swimmerNames?.[lIdx] || '')}: <b>${lt.toFixed(2)}</b> (${rtLabel})</span>`;
          })
          .join('');
        return `
          <tr>
            <td class="num">${ent.dq ? 'DQ' : ent.place}</td>
            <td>L${ent.lane}</td>
            <td><b>${escapeHtml(ent.teamAbbr)} '${ent.relayTag || 'A'}'</b></td>
            <td class="num" style="font-weight:800;color:${ent.dq ? 'var(--accent-red)' : 'var(--accent-gold)'};">${finished ? (ent.dq ? `DQ (Leg ${ent.dqLeg})` : formatTime(ent.time)) : 'Swimming...'}</td>
            <td class="num">${finished ? ent.points : '—'}</td>
            <td>${legDetails}</td>
          </tr>
        `;
      })
      .join('');
    splitsTableHtml = `
      <div class="table-wrap" style="margin-top:10px;">
        <table class="data-table">
          <thead>
            <tr>
              <th class="num">Pl</th>
              <th>Lane</th>
              <th>Relay Team</th>
              <th class="num">Final</th>
              <th class="num">Pts</th>
              <th>Leg Splits & Exchange Reaction Times (Lead-off Flat Start Official)</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  }

  return `
    <div class="pool-scoreboard">
      <div>
        <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;">Race ${idx + 1} of ${races.length}</div>
        <div style="font-size:16px;font-weight:800;color:var(--accent-cyan);">${escapeHtml(race.label)}</div>
      </div>
      <div class="num" style="font-size:22px;font-weight:900;color:#fff;background:#030812;padding:4px 12px;border-radius:6px;border:1px solid var(--border-bright);">
        ${formatTime(elapsed)}
      </div>
      ${scoreBannerHtml}
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button class="btn btn-sm" onclick="togglePoolPlayPause()">${appState.poolAnim.playing ? 'Pause' : (finished ? 'Replay Race' : 'Resume')}</button>
        <button class="btn btn-sm ${appState.poolAnim.speed === 1 ? 'btn-primary' : ''}" onclick="setPoolSpeed(1)">1x</button>
        <button class="btn btn-sm ${appState.poolAnim.speed === 2 ? 'btn-primary' : ''}" onclick="setPoolSpeed(2)">2x</button>
        <button class="btn btn-sm ${appState.poolAnim.speed === 4 ? 'btn-primary' : ''}" onclick="setPoolSpeed(4)">4x</button>
        <button class="btn btn-sm btn-gold" onclick="prevPoolRace()" ${idx <= 0 ? 'disabled' : ''}>Prev Race</button>
        <button class="btn btn-sm btn-gold" onclick="nextPoolRace()" ${idx >= races.length - 1 ? 'disabled' : ''}>Next Race</button>
        <button class="btn btn-sm btn-success" onclick="skipPoolToFinalSheet()">Skip to Final Sheet</button>
      </div>
    </div>
    <div class="pool-lanes">
      ${lanesHtml.join('')}
    </div>
    ${splitsTableHtml}
  `;
}

function togglePoolPlayPause() {
  const races = getPoolRaceList();
  const race = races[appState.poolAnim.raceIdx];
  if (!race) return;
  const validTimes = race.entries.filter(e => !e.dq && e.time < 9000).map(e => e.time);
  const maxTime = validTimes.length > 0 ? Math.max(...validTimes) : 50;
  if (appState.poolAnim.elapsed >= maxTime - 0.05) {
    appState.poolAnim.elapsed = 0;
    appState.poolAnim.playing = true;
  } else {
    appState.poolAnim.playing = !appState.poolAnim.playing;
  }
  updatePoolBroadcastDOM();
}

function setPoolSpeed(spd) {
  appState.poolAnim.speed = spd;
  updatePoolBroadcastDOM();
}

function nextPoolRace() {
  const races = getPoolRaceList();
  if (appState.poolAnim.raceIdx < races.length - 1) {
    appState.poolAnim.raceIdx++;
    appState.poolAnim.elapsed = 0;
    appState.poolAnim.playing = true;
    updatePoolBroadcastDOM();
  }
}

function prevPoolRace() {
  if (appState.poolAnim.raceIdx > 0) {
    appState.poolAnim.raceIdx--;
    appState.poolAnim.elapsed = 0;
    appState.poolAnim.playing = true;
    updatePoolBroadcastDOM();
  }
}

function skipPoolToFinalSheet() {
  stopPoolAnimation();
  appState.poolAnim.active = false;
  renderApp();
}

    const oppLineup = buildAutoDualLineup(match.opponent, uTeam, match.cardType, match.week, {
      isHome: !match.isHome,
      isChampionship: match.isPlayoff
    });
    const hLineup = match.isHome ? draft : oppLineup;
    const aLineup = match.isHome ? oppLineup : draft;
    const proj = projectDualMeetScore(match.homeTeam, match.awayTeam, hLineup, aLineup, match.cardType, match.week, false);

    nextActionHtml = `
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Next Meet — ${match.isPlayoff ? 'Playoff Dual' : `Week ${match.week} Dual Meet`} (${match.cardType === 'distance' ? 'Distance Card: 1650 Free & 400 IM' : 'Standard Card: 1000 Free & 200 IM'})</div>

        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;padding:8px 0;">

            ${renderTeamEmblem(match.homeTeam)}
            <div>
              <div style="font-weight:800;font-size:15px;">${escapeHtml(match.homeTeam.name)} (Home)</div>
              <div style="font-size:12px;color:var(--text-muted);">Record: ${match.homeTeam.wins}-${match.homeTeam.losses} • Proj: <strong class="num" style="color:var(--accent-gold);">${proj.homeProjected.toFixed(1)} pts</strong></div>
            </div>
          </div>
          <div style="font-weight:900;font-size:18px;color:var(--text-dim);">VS</div>
          <div style="display:flex;align-items:center;gap:12px;">
            ${renderTeamEmblem(match.awayTeam)}
            <div>
              <div style="font-weight:800;font-size:15px;">${escapeHtml(match.awayTeam.name)} (Away)</div>
              <div style="font-size:12px;color:var(--text-muted);">Record: ${match.awayTeam.wins}-${match.awayTeam.losses} • Proj: <strong class="num" style="color:var(--accent-cyan);">${proj.awayProjected.toFixed(1)} pts</strong></div>
            </div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="switchTab('meet')">Edit Lineup & Race Deck</button>
            <button class="btn btn-gold" onclick="commitAndSimulateCurrentMeet(true)">Watch Meet Live</button>
            <button class="btn btn-success" onclick="commitAndSimulateCurrentMeet(false)">Quick-Sim Week</button>
          </div>
        </div>
      </div>
    `;
  } else if (match && match.type === 'bye_or_eliminated') {
    nextActionHtml = `
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Playoff Round In Progress</div>
        </div>
        <p style="margin-bottom:12px;color:var(--text-muted);">Your club has a First-Round Bye (Top-4 Division Winner Seed) or is observing this knockout round.</p>
        <button class="btn btn-primary" onclick="commitAndSimulateCurrentMeet(false)">Simulate Playoff Round</button>
      </div>
    `;
  } else if (match && match.type === 'championship') {
    nextActionHtml = `
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">${escapeHtml(league.championshipName)} — 3-Day Final Four at Neutral 8-Lane Pool</div>
          <span class="badge badge-peaked">${match.inFinal ? 'Your Club Qualified!' : 'Neutral Championship Showcase'}</span>
        </div>
        <p style="margin-bottom:12px;color:var(--text-muted);">Final Four Clubs: ${match.finalFourTeams.map(t => `<strong>${escapeHtml(t.name)}</strong> (${t.wins}-${t.losses})`).join(' • ')}</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-gold" onclick="commitAndSimulateCurrentMeet(true)">Watch Championship Final Live</button>
          <button class="btn btn-success" onclick="commitAndSimulateCurrentMeet(false)">Simulate Championship Final</button>
        </div>
      </div>
    `;
  } else if (league.phase === 'offseason') {
    nextActionHtml = `
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">${league.seasonYear} Offseason — Current Step: ${(league.offseasonStep || 'awards').toUpperCase()}</div>
        </div>
        <p style="margin-bottom:12px;color:var(--text-muted);">Review season awards, retirements & aging development, re-sign expiring contracts, run the 4-round Draft, and sign Free Agents.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="switchTab('frontoffice')">Open Offseason War Room</button>
          <button class="btn btn-success" onclick="quickSimFullSeason()">Auto-Complete Offseason & Start ${league.seasonYear + 1}</button>
        </div>
      </div>
    `;
  }

  // Division Standings Table
  const divTeams = standings.byDivision[uTeam.division] || [];
  const divRows = divTeams.map((t, idx) => `
    <tr style="${t.id === uTeam.id ? 'background:rgba(56,189,248,0.1);' : ''}">
      <td class="num">${idx + 1}</td>
      <td>
        <button class="link-btn" onclick="openTeamModal('${t.id}')">${escapeHtml(t.name)}</button>
      </td>
      <td class="num">${t.wins}-${t.losses}</td>
      <td class="num">${t.divWins}-${t.divLosses}</td>
      <td class="num">${(t.pointsFor - t.pointsAgainst) >= 0 ? '+' : ''}${Math.round(t.pointsFor - t.pointsAgainst)}</td>
    </tr>
  `).join('');

  // Top Swimmers on User Team
  const topSwimmers = uTeam.roster
    .slice()
    .map(s => ({ s, pp: getSwimmerBestPowerPoints(s) }))
    .sort((a, b) => b.pp.powerPoints - a.pp.powerPoints)
    .slice(0, 6);

  const topSwimmerRows = topSwimmers.map(({ s, pp }) => `
    <tr>
      <td><button class="link-btn" onclick="openSwimmerModal('${s.id}')">${escapeHtml(s.name)}</button></td>
      <td>${s.gender} • ${s.age}y</td>
      <td>${escapeHtml(ARCHETYPE_NAMES[s.archetype] || s.archetype)}</td>
      <td>${escapeHtml(EVENT_MAP[pp.bestEvent]?.name || pp.bestEvent)} (${formatTime(s.seasonBests?.[pp.bestEvent] || s.pbs?.[pp.bestEvent])})</td>
      <td class="num" style="font-weight:800;color:var(--accent-gold);">${pp.powerPoints}</td>

  const newsItems = (league.news || []).slice(0, 8).map(n => `

// TAB 2: ROSTER & TRAINING / TAPER PLANNER
// ============================================================================
function renderRosterTab() {
  const league = appState.league;
  const uTeam = getUserTeam();
  const plan = uTeam.trainingPlan || { sprint: 'balanced', mid: 'balanced', distance: 'balanced', stroke: 'balanced', im: 'balanced' };

  const groups = [
    ['sprint', 'Sprint Free Group (50/100)'],
    ['mid', 'Middle-Distance Free (200/500)'],
    ['distance', 'Distance Free (1000/1650)'],
    ['stroke', 'Stroke Specialists (BK/BR/FL)'],
    ['im', 'Individual Medley Group (200/400 IM)']
  ];

  const trainingControls = groups.map(([gKey, gLabel]) => `
    <div class="stat-card" style="border-left-color:var(--accent-cyan);">
      <div class="stat-label">${escapeHtml(gLabel)}</div>
      <div style="margin-top:6px;">
        <select style="width:100%;" onchange="updateTrainingGroupMode('${gKey}', this.value)">
          <option value="heavy" ${plan[gKey] === 'heavy' ? 'selected' : ''}>Heavy Yardage (+Fitness, +Fatigue)</option>
          <option value="balanced" ${plan[gKey] === 'balanced' ? 'selected' : ''}>Balanced Maintenance</option>
          <option value="rest" ${plan[gKey] === 'rest' ? 'selected' : ''}>Short Rest (-Fatigue, ~1% off Peak)</option>
          <option value="taper" ${plan[gKey] === 'taper' ? 'selected' : ''}>Full Shave & Taper (Peak 2-3 Wks, max 2/yr)</option>
        </select>
      </div>
    </div>
  `).join('');

  let pool = uTeam.roster.slice();
  if (appState.rosterFilterGender !== 'ALL') {
    pool = pool.filter(s => s.gender === appState.rosterFilterGender);
  }

  pool.sort((a, b) => {
    const f = appState.rosterSortField;
    let va, vb;
    if (f === 'name') { va = a.name; vb = b.name; }
    else if (f === 'age') { va = a.age; vb = b.age; }
    else if (f === 'overall') { va = a.overall; vb = b.overall; }
    else if (f === 'potential') { va = a.potential; vb = b.potential; }
    else if (f === 'salary') { va = a.contract?.salary || 0; vb = b.contract?.salary || 0; }
    else if (f === 'fitness') { va = a.fitness || 0; vb = b.fitness || 0; }
    else if (f === 'fatigue') { va = a.fatigue || 0; vb = b.fatigue || 0; }
    else {
      va = getSwimmerBestPowerPoints(a).powerPoints;
      vb = getSwimmerBestPowerPoints(b).powerPoints;
    }
    if (va < vb) return appState.rosterSortAsc ? -1 : 1;
    if (va > vb) return appState.rosterSortAsc ? 1 : -1;
    return 0;
  });

  const rows = pool.map(s => {
    const pp = getSwimmerBestPowerPoints(s);
    const sigEvs = getSwimmerSignatureEvents(s).slice(0, 2);
    const evSummary = sigEvs.map(evId => {
      const sb = s.seasonBests?.[evId];
      const pb = s.pbs?.[evId];
      return `${EVENT_MAP[evId]?.name}: <span class="num">${formatTime(sb || pb)}</span>`;
    }).join(' | ');

    return `
      <tr>
        <td><button class="link-btn" onclick="openSwimmerModal('${s.id}')">${escapeHtml(s.name)}</button> ${s.isInjuryReplacement ? '<span class="badge badge-fading">Temp Repl</span>' : ''}</td>
        <td>${s.gender}</td>
        <td class="num">${s.age}</td>
        <td>${escapeHtml(ARCHETYPE_NAMES[s.archetype] || s.archetype)}</td>
        <td class="num" style="font-weight:700;">${s.overall} <span style="color:var(--text-dim);">/ ${s.potential}</span></td>
        <td class="num" style="font-weight:800;color:var(--accent-gold);">${pp.powerPoints}</td>
        <td>${evSummary}</td>
        <td class="num">${Math.round(s.fitness ?? 78)} / ${Math.round(s.fatigue ?? 45)}</td>
        <td>${renderTaperBadge(s)} <span class="num" style="font-size:11px;color:var(--text-dim);">(${s.taperState?.tapersUsed || 0}/2)</span></td>
        <td class="num">${formatMoney(s.contract?.salary || 0)} (${s.contract?.years || 1}y)</td>
        <td>
          <select style="font-size:11.5px;padding:3px 6px;" onchange="setSwimmerOffseasonFocus('${s.id}', this.value)">
            <option value="" ${!s.offseasonFocus ? 'selected' : ''}>Balanced Growth</option>
            <option value="starts" ${s.offseasonFocus === 'starts' ? 'selected' : ''}>Starts (${s.start})</option>
            <option value="turns" ${s.offseasonFocus === 'turns' ? 'selected' : ''}>Turns/UW (${s.turns})</option>
            <option value="exchanges" ${s.offseasonFocus === 'exchanges' ? 'selected' : ''}>Relay Exch (${s.relayExchange})</option>
            <option value="weak_stroke" ${s.offseasonFocus === 'weak_stroke' ? 'selected' : ''}>IM Weak Stroke</option>
          </select>
        </td>
      </tr>
    `;
  }).join('');

  const ilRows = (uTeam.il || []).map(s => `
    <tr>
      <td><button class="link-btn" onclick="openSwimmerModal('${s.id}')">${escapeHtml(s.name)}</button></td>
      <td>${s.gender}</td>
      <td class="num">${s.age}</td>
      <td>${escapeHtml(ARCHETYPE_NAMES[s.archetype] || s.archetype)}</td>
      <td><span class="badge badge-injured">${escapeHtml(s.injury?.type || 'Injured')} (${s.injury?.weeksLeft || 1} wks left)</span></td>
      <td class="num">${formatMoney(s.contract?.salary || 0)}</td>
    </tr>
  `).join('');

  return `
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">Weekly Training Load & Season Periodization (Week ${league.week})</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn btn-sm" onclick="setAllTrainingGroups('heavy')">All Heavy</button>
          <button class="btn btn-sm" onclick="setAllTrainingGroups('balanced')">All Balanced</button>
          <button class="btn btn-sm" onclick="setAllTrainingGroups('rest')">All Short Rest</button>
          <button class="btn btn-sm btn-gold" onclick="setAllTrainingGroups('taper')">All Full Taper</button>
        </div>
      </div>
      <p style="font-size:12.5px;color:var(--text-muted);margin-bottom:10px;">
        Untapered in-season swims run ~2–3% slower than tapered bests. Each swimmer can hold peak form for 2–3 weeks per full taper (up to 2 full tapers per season; Weeks 4, 8, 12, and 13 swim the Distance Card).
      </p>
      <div class="stat-cards" style="margin-bottom:0;">
        ${trainingControls}
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">Active Co-Ed Roster (${uTeam.roster.filter(s => s.gender === 'F').length} Women, ${uTeam.roster.filter(s => s.gender === 'M').length} Men)</div>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-sm ${appState.rosterFilterGender === 'ALL' ? 'btn-primary' : ''}" onclick="setRosterFilterGender('ALL')">All (28)</button>
          <button class="btn btn-sm ${appState.rosterFilterGender === 'F' ? 'btn-primary' : ''}" onclick="setRosterFilterGender('F')">Women (14)</button>
          <button class="btn btn-sm ${appState.rosterFilterGender === 'M' ? 'btn-primary' : ''}" onclick="setRosterFilterGender('M')">Men (14)</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th onclick="sortRosterBy('name')">Swimmer</th>
              <th>G</th>
              <th class="num" onclick="sortRosterBy('age')">Age</th>
              <th>Archetype</th>
              <th class="num" onclick="sortRosterBy('overall')">OVR / POT</th>
              <th class="num" onclick="sortRosterBy('powerPoints')">Power Pts</th>
              <th>Top Events (Season / PB)</th>
              <th class="num" onclick="sortRosterBy('fitness')">Fit / Fat</th>
              <th>Taper State</th>
              <th class="num" onclick="sortRosterBy('salary')">Contract</th>
              <th>Offseason Focus</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>

    ${(uTeam.il && uTeam.il.length > 0) ? `
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Injured List (IL)</div>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>Swimmer</th><th>G</th><th class="num">Age</th><th>Role</th><th>Injury & Return</th><th class="num">Salary</th></tr>
            </thead>
            <tbody>${ilRows}</tbody>
          </table>
        </div>
      </div>
    ` : ''}
  `;
}

function updateTrainingGroupMode(groupKey, mode) {
  const uTeam = getUserTeam();
  if (!uTeam.trainingPlan) uTeam.trainingPlan = {};
  uTeam.trainingPlan[groupKey] = mode;
  saveLeagueToStorage();
  renderApp();
}

function setAllTrainingGroups(mode) {
  const uTeam = getUserTeam();
  uTeam.trainingPlan = { sprint: mode, mid: mode, distance: mode, stroke: mode, im: mode };
  saveLeagueToStorage();
  renderApp();
}

function setRosterFilterGender(g) {
  appState.rosterFilterGender = g;
  renderApp();
}

function sortRosterBy(field) {
  if (appState.rosterSortField === field) {
    appState.rosterSortAsc = !appState.rosterSortAsc;
  } else {
    appState.rosterSortField = field;
    appState.rosterSortAsc = field === 'name' || field === 'age';
  }
  renderApp();
}

function setSwimmerOffseasonFocus(swimmerId, focusVal) {
  const found = findSwimmerById(swimmerId);
  if (found && found.swimmer) {
    found.swimmer.offseasonFocus = focusVal || null;
    saveLeagueToStorage();
  }
}

// TAB 3: LINEUP EDITOR & MEET BROADCAST DECK
// ============================================================================
function renderMeetTab() {
  const league = appState.league;
  const uTeam = getUserTeam();
  const match = getCurrentUserMatchup(league);

  // 1. Live Pool Broadcast View if active
  let broadcastSection = '';
  if (appState.poolAnim.active && (appState.activeMeetResult || appState.activeChampResult)) {
    broadcastSection = `
      <div class="pool-deck" id="pool-broadcast-live">
        ${renderPoolBroadcastInnerHtml()}
      </div>
    `;
  }

  // 2. Pre-Meet Dual Lineup Editor (when in regular season or active playoff dual)
  let lineupEditorSection = '';
  if (match && match.type === 'dual') {
    const draft = ensureLineupDraft();
    const oppLineup = buildAutoDualLineup(match.opponent, uTeam, match.cardType, match.week, {
      isHome: !match.isHome,
      isChampionship: match.isPlayoff
    });
    const hLineup = match.isHome ? draft : oppLineup;
    const aLineup = match.isHome ? oppLineup : draft;
    const proj = projectDualMeetScore(match.homeTeam, match.awayTeam, hLineup, aLineup, match.cardType, match.week, false);
    const legality = validateDualLineup(uTeam, draft, match.cardType, match.week);
    const { indCount, totCount } = getSwimmerLoadInDraft(draft);

    const baseCard = match.cardType === 'distance' ? DUAL_CARD_DISTANCE : DUAL_CARD_STANDARD;
    const mixedRelayId = (match.week % 2) === 1 ? '200MXMR' : '200MXFRR';
    const indEventIds = baseCard.filter(id => id !== 'MIXED_RELAY' && !RELAY_EVENTS.some(r => r.id === id));
    const g = appState.lineupEditGender;
    const gRoster = uTeam.roster.filter(s => s.gender === g && !s.injury);

    // Individual Event Assignment Rows for selected gender (F or M)
    const indRows = indEventIds.map(evId => {
      const assignedIds = draft.individual[g][evId] || [];
      const oppPool = match.opponent.roster.filter(s => s.gender === g && !s.injury);
      const oppBest = oppPool.map(s => getSwimmerEntrySeedTime(s, evId)).sort((a, b) => a - b)[0];

      // Sort our roster by projected time in this event
      const sortedRoster = gRoster.slice().sort((a, b) =>
        getProjectedSwimTime(a, evId, { isHome: match.isHome }) - getProjectedSwimTime(b, evId, { isHome: match.isHome })
      );

      const slotSelects = [0, 1, 2].map(slotIdx => {
        const curId = assignedIds[slotIdx] || '';
        const opts = sortedRoster.map(sw => {
          const pTime = getProjectedSwimTime(sw, evId, { isHome: match.isHome, priorSwims: Math.max(0, (totCount[sw.id] || 1) - 1) });
          const iCnt = indCount[sw.id] || 0;
          const tCnt = totCount[sw.id] || 0;
          return `<option value="${sw.id}" ${sw.id === curId ? 'selected' : ''}>${escapeHtml(sw.name)} (${formatTime(pTime)}) [${iCnt}i/${tCnt}t]</option>`;
        }).join('');

        return `
          <select style="font-size:12px;padding:4px 6px;min-width:185px;" onchange="changeLineupIndEntry('${g}', '${evId}', ${slotIdx}, this.value)">
            <option value="">— Empty Slot #${slotIdx + 1} —</option>
            ${opts}
          </select>
        `;
      }).join(' ');

      return `
        <tr>
          <td style="font-weight:800;">${escapeHtml(EVENT_MAP[evId].name)}</td>
          <td class="num" style="color:var(--text-muted);">${formatTime(oppBest)}</td>
          <td><div style="display:flex;gap:6px;flex-wrap:wrap;">${slotSelects}</div></td>
        </tr>
      `;
    }).join('');

    // Relay Editor for 200MR, 400FRR (Gender g) + Mixed Relay (X)
    const renderRelayRow = (genderKey, relId, tag) => {
      const evDef = EVENT_MAP[relId];
      const curIds = draft.relays[genderKey]?.[relId]?.[tag] || [];
      const eligiblePool = uTeam.roster.filter(s => !s.injury && (genderKey === 'X' || s.gender === genderKey));

      const legSelectors = [0, 1, 2, 3].map(legIdx => {
        const legEvId = evDef.legs[legIdx];
        const curId = curIds[legIdx] || '';
        const sortedPool = eligiblePool.slice().sort((a, b) =>
          getProjectedSwimTime(a, legEvId, { isHome: match.isHome }) - getProjectedSwimTime(b, legEvId, { isHome: match.isHome })
        );
        const opts = sortedPool.map(sw => {
          const legT = getProjectedSwimTime(sw, legEvId, { isHome: match.isHome }) - (legIdx > 0 ? 0.48 : 0);
          return `<option value="${sw.id}" ${sw.id === curId ? 'selected' : ''}>${sw.gender}: ${escapeHtml(sw.name)} (${formatTime(legT)}) [${totCount[sw.id] || 0}t]</option>`;
        }).join('');
        return `
          <select style="font-size:11.5px;padding:4px 6px;min-width:165px;" onchange="changeLineupRelayLeg('${genderKey}', '${relId}', '${tag}', ${legIdx}, this.value)">
            <option value="">Leg ${legIdx + 1} (${legEvId})</option>
            ${opts}
          </select>
        `;
      }).join(' ');

      return `
        <tr>
          <td style="font-weight:700;">${genderKey === 'X' ? 'Mixed' : (genderKey === 'F' ? "Women's" : "Men's")} ${escapeHtml(evDef.name)} (${tag})</td>
          <td><div style="display:flex;gap:6px;flex-wrap:wrap;">${legSelectors}</div></td>
        </tr>
      `;
    };

    lineupEditorSection = `
      <div class="panel">
        <div class="panel-header">
          <div>
            <div class="panel-title">Meet Lineup Sheet — ${escapeHtml(uTeam.name)} vs ${escapeHtml(match.opponent.name)} (Week ${match.week})</div>

              Dual Rules: Max 3 individual events & 4 total swims per swimmer. Individual events score 9-4-3-2-1-0; Relays score 11-4-2-0 (max 2 relays score per team).
            </div>
          </div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            ${match.canChooseCard ? `
              <select onchange="changePlayoffHostCard(this.value)" style="font-weight:700;">
                <option value="standard" ${match.cardType === 'standard' ? 'selected' : ''}>Host Choice: Standard Card (1000FR / 200IM)</option>
                <option value="distance" ${match.cardType === 'distance' ? 'selected' : ''}>Host Choice: Distance Card (1650FR / 400IM)</option>
              </select>
            ` : ''}
            <button class="btn btn-sm" onclick="resetLineupToAuto()">Auto-Fill Optimal Lineup</button>
            <button class="btn btn-gold" onclick="commitAndSimulateCurrentMeet(true)" ${!legality.valid ? 'disabled' : ''}>Swim Meet (Watch Live)</button>
            <button class="btn btn-success" onclick="commitAndSimulateCurrentMeet(false)" ${!legality.valid ? 'disabled' : ''}>Skip to Final Sheet</button>
          </div>
        </div>

        <div class="stat-cards">
          <div class="stat-card">
            <div class="stat-label">Live Projected Meet Score</div>
            <div class="stat-value" id="projected-score-banner">
              ${escapeHtml(match.homeTeam.abbr)} ${proj.homeProjected.toFixed(1)} — ${escapeHtml(match.awayTeam.abbr)} ${proj.awayProjected.toFixed(1)}
            </div>
            <div class="stat-sub">Updates immediately when you swap any swimmer or relay leg</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Lineup Legality Check</div>
            <div class="stat-value" style="color:${legality.valid ? 'var(--accent-green)' : 'var(--accent-red)'};font-size:16px;">
              ${legality.valid ? 'LEGAL LINEUP (READY)' : `${legality.errors.length} RULE ISSUE(S)`}
            </div>
            <div class="stat-sub">${legality.valid ? 'All swimmers within 3 Ind / 4 Total limit' : escapeHtml(legality.errors[0])}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Meet Card & Alternating Gender Order</div>
            <div class="stat-value" style="font-size:16px;">${match.cardType === 'distance' ? 'Distance Card' : 'Standard Card'}</div>
            <div class="stat-sub">${(match.week % 2) === 1 ? 'Women swim odd races first • Mixed 200 Medley Relay' : 'Men swim even-week races first • Mixed 200 Free Relay'}</div>
          </div>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
          <div style="display:flex;gap:6px;">
            <button class="btn btn-sm ${g === 'F' ? 'btn-primary' : ''}" onclick="setLineupEditGender('F')">Edit Women's Events</button>

            <button class="btn btn-sm" onclick="applyMixedRelayOrderPreset(['F','M','F','M'])">F-M-F-M</button>
            <button class="btn btn-sm" onclick="applyMixedRelayOrderPreset(['F','F','M','M'])">F-F-M-M</button>
          </div>
        </div>

        <div class="table-wrap" style="margin-bottom:14px;">
          <table class="data-table">
            <thead>
              <tr>
                <th style="width:150px;">${g === 'F' ? "Women's" : "Men's"} Event</th>

                <th style="width:220px;">Relay Team</th>
                <th>4 Relay Legs (Back / Breast / Fly / Free for Medley; 4x Free for Free Relay)</th>
              </tr>
            </thead>
            <tbody>
              ${renderRelayRow(g, '200MR', 'A')}
              ${renderRelayRow(g, '200MR', 'B')}
              ${renderRelayRow(g, '400FRR', 'A')}
              ${renderRelayRow(g, '400FRR', 'B')}
              ${renderRelayRow('X', mixedRelayId, 'A')}
              ${renderRelayRow('X', mixedRelayId, 'B')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  } else if (match && match.type === 'championship') {
    lineupEditorSection = `
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">${escapeHtml(league.championshipName)} — 3-Day Neutral-Pool Timed Finals</div>

        </p>

  }

  // 3. Completed Meet Full Result Sheet (if available)
  let resultSheetHtml = '';
  if (appState.activeMeetResult) {
    resultSheetHtml = renderDualMeetSheetHtml(appState.activeMeetResult);
  } else if (appState.activeChampResult || league.playoffs?.championshipFinal) {
    resultSheetHtml = renderChampionshipResultHtml(appState.activeChampResult || league.playoffs.championshipFinal);
  }

  return `
    ${broadcastSection}
    ${lineupEditorSection}
    ${resultSheetHtml}
  `;
}

function changeLineupIndEntry(gender, eventId, slotIdx, swimmerId) {
  const draft = ensureLineupDraft();
  if (!draft) return;
  const arr = (draft.individual[gender][eventId] || []).slice();
  if (!swimmerId) {
    arr.splice(slotIdx, 1);
  } else {
    // Avoid duplicate in same event
    const existingIdx = arr.indexOf(swimmerId);
    if (existingIdx !== -1 && existingIdx !== slotIdx) {
      arr.splice(existingIdx, 1);
    }
    arr[slotIdx] = swimmerId;
  }
  draft.individual[gender][eventId] = arr.filter(Boolean);
  renderApp();
}

function changeLineupRelayLeg(genderKey, relId, tag, legIdx, swimmerId) {
  const draft = ensureLineupDraft();
  if (!draft) return;
  if (!draft.relays[genderKey]) draft.relays[genderKey] = {};
  if (!draft.relays[genderKey][relId]) draft.relays[genderKey][relId] = { A: [], B: [] };
  const arr = (draft.relays[genderKey][relId][tag] || []).slice();
  if (!swimmerId) {
    arr.splice(legIdx, 1);
  } else {
    arr[legIdx] = swimmerId;
  }
  draft.relays[genderKey][relId][tag] = arr.filter(Boolean);
  renderApp();
}

function applyMixedRelayOrderPreset(genderOrder) {
  const draft = ensureLineupDraft();
  const match = getCurrentUserMatchup();
  if (!draft || !match) return;
  const uTeam = getUserTeam();
  const mixedRelayId = (match.week % 2) === 1 ? '200MXMR' : '200MXFRR';
  const evDef = EVENT_MAP[mixedRelayId];
  const chosen = [];
  const used = new Set();

  for (let i = 0; i < 4; i++) {
    const g = genderOrder[i];
    const legEv = evDef.legs[i];
    const candidates = uTeam.roster
      .filter(s => s.gender === g && !s.injury && !used.has(s.id))
      .sort((a, b) => getProjectedSwimTime(a, legEv) - getProjectedSwimTime(b, legEv));
    if (candidates[0]) {
      chosen.push(candidates[0].id);
      used.add(candidates[0].id);
    }
  }
  if (chosen.length === 4) {
    draft.relays.X[mixedRelayId].A = chosen;
    renderApp();
  }
}

function renderDualMeetSheetHtml(meet) {
  if (!meet) return '';
  const eventBlocks = (meet.events || []).map(ev => {
    const rows = (ev.entries || []).map(ent => {
      if (!ev.isRelay) {
        const spStr = (ent.splits || []).map(s => s.toFixed(2)).join(' / ');
        return `
          <tr>
            <td class="num">${ent.place || 'DQ'}</td>
            <td>L${ent.lane || '—'}</td>
            <td><button class="link-btn" onclick="openSwimmerModal('${ent.swimmerId}')">${escapeHtml(ent.swimmerName)}</button></td>
            <td>${escapeHtml(ent.teamAbbr)}</td>
            <td class="num" style="font-weight:800;color:var(--accent-gold);">${formatTime(ent.time)}</td>
            <td class="num">${ent.points}</td>
            <td class="num" style="font-size:11.5px;color:var(--text-muted);">${spStr || '—'}</td>
          </tr>
        `;
      } else {
        const legsStr = (ent.legTimes || []).map((lt, idx) => {
          const rt = ent.reactionTimes?.[idx];
          const rtTxt = rt !== undefined ? (idx === 0 ? 'Flat' : `${rt >= 0 ? '+' : ''}${rt.toFixed(2)}s`) : '';
          return `${escapeHtml(ent.swimmerNames?.[idx] || '')} ${lt.toFixed(2)} (${rtTxt})`;
        }).join(' • ');
        return `
          <tr>
            <td class="num">${ent.dq ? 'DQ' : ent.place}</td>
            <td>L${ent.lane || '—'}</td>
            <td><b>${escapeHtml(ent.teamAbbr)} '${ent.relayTag || 'A'}'</b></td>
            <td>${escapeHtml(ent.teamAbbr)}</td>
            <td class="num" style="font-weight:800;color:${ent.dq ? 'var(--accent-red)' : 'var(--accent-gold)'};">${ent.dq ? `DQ (Leg ${ent.dqLeg})` : formatTime(ent.time)}</td>
            <td class="num">${ent.points}</td>
            <td style="font-size:11.5px;color:var(--text-muted);">${legsStr}</td>
          </tr>
        `;
      }
    }).join('');

    return `
      <div style="margin-bottom:12px;border:1px solid var(--border-subtle);border-radius:8px;overflow:hidden;">
        <div style="background:rgba(18,31,54,0.95);padding:7px 12px;display:flex;justify-content:space-between;align-items:center;">
          <strong>#${ev.raceNumber} — ${escapeHtml(ev.label)} ${ev.tiebreakerApplied ? '<span class="badge badge-gold">Last-Relay Tiebreaker (+1 pt)</span>' : ''}</strong>
          <span class="num" style="font-size:12px;color:var(--accent-cyan);">
            Event: ${escapeHtml(meet.homeAbbr)} ${ev.homePoints} - ${escapeHtml(meet.awayAbbr)} ${ev.awayPoints} | Running: <b>${escapeHtml(meet.homeAbbr)} ${ev.runningHomeScore} - ${escapeHtml(meet.awayAbbr)} ${ev.runningAwayScore}</b>
          </span>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="panel">
      <div class="panel-header">
        <div>
          <div class="panel-title">Official Meet Results — ${escapeHtml(meet.homeAbbr)} ${meet.homeScore} vs ${escapeHtml(meet.awayAbbr)} ${meet.awayScore} (Week ${meet.week})</div>
          <div style="font-size:12px;color:var(--text-muted);">
            Pre-Meet Projection: ${escapeHtml(meet.homeAbbr)} ${meet.homeKnownProjected?.toFixed(1) || meet.homeProjected} - ${escapeHtml(meet.awayAbbr)} ${meet.awayKnownProjected?.toFixed(1) || meet.awayProjected}
            • Score Entering Final Relay: ${meet.homeScoreBeforeLast} - ${meet.awayScoreBeforeLast}
          </div>
        </div>
        <button class="btn btn-sm btn-gold" onclick="startPoolBroadcast(appState.activeMeetResult, false); renderApp();">Replay Broadcast</button>
      </div>
      ${eventBlocks}
    </div>
  `;
}

function renderStandingsTab() {
  const league = appState.league;
  const standings = computeStandingsAndPlayoffSeeds(league);
  const divisions = ['Heartland', 'East', 'Central', 'West'];

  const divPanels = divisions.map(div => {
    const rows = (standings.byDivision[div] || []).map((t, idx) => {
      const seedObj = standings.playoffSeeds.find(s => s.teamId === t.id);
      return `
        <tr style="${t.id === league.userTeamId ? 'background:rgba(56,189,248,0.1);' : ''}">
          <td class="num">${idx + 1}</td>
          <td><button class="link-btn" onclick="openTeamModal('${t.id}')">${escapeHtml(t.name)}</button></td>
          <td class="num">${seedObj ? `#${seedObj.seed}` : '—'}</td>
          <td class="num">${t.wins}-${t.losses}</td>
          <td class="num">${t.divWins}-${t.divLosses}</td>
          <td class="num">${Math.round(t.pointsFor)}</td>
          <td class="num">${Math.round(t.pointsAgainst)}</td>
        </tr>
      `;
    }).join('');
    return `
      <div class="panel">
        <div class="panel-header"><div class="panel-title">${div} Division</div></div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th class="num">#</th><th>Club</th><th class="num">Seed</th><th class="num">W-L</th><th class="num">Div</th><th class="num">PF</th><th class="num">PA</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    `;
  }).join('');

  // Playoff Bracket Panel if initialized
  let bracketHtml = '';
  if (league.playoffs) {
    const r1Html = (league.playoffs.round1 || []).map(m => {
      const h = getTeamById(m.homeTeamId);
      const a = getTeamById(m.awayTeamId);
      const scoreTxt = m.completed && m.result ? `${m.result.homeScore} - ${m.result.awayScore}` : 'Upcoming';
      return `<div class="stat-card">
        <div class="stat-label">Wild Card (#${m.highSeed} vs #${m.lowSeed}) • ${m.cardType}</div>
        <div style="font-weight:800;">#${m.highSeed} ${escapeHtml(h?.abbr)} vs #${m.lowSeed} ${escapeHtml(a?.abbr)}</div>
        <div class="num" style="color:var(--accent-gold);margin-top:4px;">${scoreTxt}</div>
      </div>`;
    }).join('');

    const r2Html = (league.playoffs.round2 || []).map(m => {
      const h = getTeamById(m.homeTeamId);
      const a = getTeamById(m.awayTeamId);
      const scoreTxt = m.completed && m.result ? `${m.result.homeScore} - ${m.result.awayScore}` : 'Upcoming';
      return `<div class="stat-card">
        <div class="stat-label">Quarterfinal (#${m.highSeed} vs #${m.lowSeed}) • ${m.cardType}</div>
        <div style="font-weight:800;">#${m.highSeed} ${escapeHtml(h?.abbr)} vs #${m.lowSeed} ${escapeHtml(a?.abbr)}</div>
        <div class="num" style="color:var(--accent-cyan);margin-top:4px;">${scoreTxt}</div>
      </div>`;
    }).join('');

    bracketHtml = `
      <div class="panel">
        <div class="panel-header"><div class="panel-title">12-Team Playoff Bracket & Final Four</div></div>
        <div class="stat-cards">${r1Html}</div>
        ${r2Html ? `<div class="stat-cards">${r2Html}</div>` : ''}
      </div>
    `;
  }

  // Schedule Viewer by Week (1..14)
  const wkNum = Math.max(1, Math.min(14, appState.scheduleFilterWeek || 1));
  const wkObj = league.schedule[wkNum - 1];
  const schedRows = (wkObj?.matchups || []).map(m => {
    const h = getTeamById(m.homeTeamId);
    const a = getTeamById(m.awayTeamId);
    const res = m.result;
    return `
      <tr>
        <td>${m.isDivision ? `<span class="badge badge-resting">${escapeHtml(h?.division)}</span>` : '<span class="badge badge-training">Cross-Div</span>'}</td>
        <td><button class="link-btn" onclick="openTeamModal('${h?.id}')">${escapeHtml(h?.name)}</button> (${h?.wins}-${h?.losses})</td>
        <td><button class="link-btn" onclick="openTeamModal('${a?.id}')">${escapeHtml(a?.name)}</button> (${a?.wins}-${a?.losses})</td>
        <td class="num" style="font-weight:800;color:var(--accent-gold);">
          ${res ? `${escapeHtml(h?.abbr)} ${res.homeScore} — ${escapeHtml(a?.abbr)} ${res.awayScore}` : 'Scheduled'}
        </td>
        <td>
          ${res && res.events ? `<button class="btn btn-sm" onclick="viewPastMeetResult(${wkNum}, '${h.id}', '${a.id}')">Box Score</button>` : (res ? '<span style="color:var(--text-dim);font-size:11.5px;">Final Logged</span>' : '—')}

  return `

    <div class="grid-2">${divPanels}</div>
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">14-Week Regular Season Schedule & Results — Week ${wkNum} (${wkObj?.cardType === 'distance' ? 'Distance Card' : 'Standard Card'})</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;">
          ${Array.from({ length: 14 }, (_, i) => i + 1).map(w => `
            <button class="btn btn-sm ${w === wkNum ? 'btn-primary' : ''}" onclick="setScheduleWeek(${w})">W${w}</button>

        </div>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Type</th><th>Home Club</th><th>Away Club</th><th class="num">Result</th><th>Details</th></tr>
          </thead>
          <tbody>${schedRows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function setScheduleWeek(w) {
  appState.scheduleFilterWeek = w;
  renderApp();
}

function viewPastMeetResult(weekNum, homeId, awayId) {
  const wk = appState.league.schedule[weekNum - 1];
  const m = wk?.matchups.find(x => x.homeTeamId === homeId && x.awayTeamId === awayId);
  if (m && m.result) {
    appState.activeMeetResult = m.result;
    appState.poolAnim.active = false;
    appState.activeTab = 'meet';
    renderApp();
  }
}

      `;
    } else if (step === 'resigning') {
      if (!league.expiringSwimmers) prepareOffseasonContracts(league);
      const userExpiring = league.expiringSwimmers[uTeam.id] || [];
      const payroll = uTeam.roster.reduce((sum, s) => sum + s.contract.salary, 0);
      const expRows = userExpiring.map(sw => {
        const fair = estimateFairContract(league, sw);
        const pp = getSwimmerBestPowerPoints(sw);
        return `
          <tr>
            <td><button class="link-btn" onclick="openSwimmerModal('${sw.id}')">${escapeHtml(sw.name)}</button></td>
            <td>${sw.gender} • ${sw.age}y</td>
            <td>${escapeHtml(ARCHETYPE_NAMES[sw.archetype] || sw.archetype)}</td>
            <td class="num">${sw.overall} / ${sw.potential}</td>
            <td class="num">${pp.powerPoints}</td>
            <td class="num">${formatMoney(fair.salary)} / ${fair.years}y</td>
            <td>
              <button class="btn btn-sm btn-success" onclick="userResignSwimmer('${sw.id}')">Re-Sign</button>
              <button class="btn btn-sm btn-danger" onclick="userReleaseExpiring('${sw.id}')">Let Walk</button>
            </td>
          </tr>
        `;
      }).join('');

      stepContent = `
        <div style="margin-bottom:10px;">
          Current Payroll: <strong class="num">${formatMoney(payroll)} / $4.20M</strong> • Expiring Club Swimmers: <b>${userExpiring.length}</b>
        </div>
        ${userExpiring.length > 0 ? `
          <div class="table-wrap" style="margin-bottom:12px;">
            <table class="data-table">
              <thead><tr><th>Swimmer</th><th>G/Age</th><th>Role</th><th class="num">OVR/POT</th><th class="num">Pts</th><th class="num">Ask Contract</th><th>Decision</th></tr></thead>
              <tbody>${expRows}</tbody>
            </table>
          </div>
        ` : '<p style="margin-bottom:12px;color:var(--accent-green);">All expiring club contract decisions completed!</p>'}
        <button class="btn btn-primary" onclick="runOffseasonStepAdvanceToDraft()">Finalize Re-Signings & Enter Draft Lottery</button>
      `;
    } else if (step === 'draft') {
      if (!league.draft || league.draft.year !== league.seasonYear) {
        initDraftAndLottery(league);
      }
      const draft = league.draft;
      const curPick = draft.picks[draft.currentPickIndex];
      const isUserOnClock = curPick && curPick.teamId === uTeam.id;

      const prospectRows = (draft.prospects || []).slice(0, 25).map((p, idx) => {
        const pp = getSwimmerBestPowerPoints(p);
        return `
          <tr>
            <td class="num">#${idx + 1}</td>
            <td><button class="link-btn" onclick="openSwimmerModal('${p.id}')">${escapeHtml(p.name)}</button> ${p.isGenerational ? '<span class="badge badge-gold">Generational</span>' : ''}</td>
            <td>${p.gender} • ${p.age}y</td>
            <td>${escapeHtml(ARCHETYPE_NAMES[p.archetype] || p.archetype)}</td>
            <td class="num" style="font-weight:700;">${p.overall} / <span style="color:var(--accent-cyan);">${p.potential}</span></td>
            <td>${escapeHtml(EVENT_MAP[pp.bestEvent]?.name || pp.bestEvent)} (${formatTime(p.pbs?.[pp.bestEvent])})</td>
            <td class="num">${formatMoney(p.contract?.salary || 70000)} (3y)</td>
            <td>
              <button class="btn btn-sm btn-gold" onclick="userDraftProspect('${p.id}')" ${!isUserOnClock ? 'disabled' : ''}>Draft Swimmer</button>
            </td>
          </tr>
        `;
      }).join('');

      stepContent = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
          <div>
            <strong>${curPick ? `Pick #${curPick.overall} (Round ${curPick.round}, Slot ${curPick.slot}) — On the Clock: ${escapeHtml(getTeamById(curPick.teamId)?.name)}` : 'All 96 Picks Complete!'}</strong>
          </div>
          <div style="display:flex;gap:8px;">
            ${curPick && !isUserOnClock ? `<button class="btn btn-sm btn-primary" onclick="simDraftToUserPick()">Sim to My Next Pick</button>` : ''}
            <button class="btn btn-sm btn-success" onclick="runOffseasonFinishDraft()">Auto-Finish Draft & Advance to Free Agency</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th class="num">Rank</th><th>Prospect</th><th>G/Age</th><th>Archetype</th><th class="num">OVR / POT</th><th>Best Event</th><th class="num">Rookie Deal</th><th>Action</th></tr></thead>
            <tbody>${prospectRows}</tbody>
          </table>
        </div>
      `;
    } else if (step === 'freeAgency') {
      stepContent = `
        <p style="margin-bottom:12px;">Sign any remaining Free Agents below, or click to balance all 24 club rosters to 14W/14M under the $4.20M cap and launch the ${league.seasonYear + 1} Season!</p>
        <button class="btn btn-gold" onclick="runOffseasonStartNextSeason()">Finalize 14W/14M Rosters & Launch ${league.seasonYear + 1} Season</button>
      `;
    }

    offseasonHtml = `
      <div class="panel" style="border-color:var(--accent-gold);">
        <div class="panel-header">
          <div class="panel-title">Offseason War Room — Step: ${step.toUpperCase()}</div>
          <button class="btn btn-sm btn-success" onclick="quickSimFullSeason()">Auto-Complete Entire Offseason</button>
        </div>
        ${stepContent}
      </div>
    `;
  }

  // 2. Trade Center (Swimmers & Draft Picks)
  const cpuTeams = league.teams.filter(t => t.id !== uTeam.id);
  if (!cpuTeams.some(t => t.id === appState.tradePartnerId)) {
    appState.tradePartnerId = cpuTeams[0].id;
  }
  const partner = getTeamById(appState.tradePartnerId);
  const evalCheck = evaluateTradeProposal(
    league,
    uTeam,
    partner,
    appState.tradeUserSwimmers,
    appState.tradeCpuSwimmers,
    appState.tradeUserPicks,
    appState.tradeCpuPicks
  );

  const renderTradeRosterSelect = (team, selectedIds, toggleFnName) => {
    return team.roster.slice().sort((a, b) => b.overall - a.overall).map(s => {
      const checked = selectedIds.includes(s.id);
      const val = getTradeAssetValue({ type: 'swimmer', swimmer: s }, partner);
      return `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 8px;border-bottom:1px solid rgba(31,51,84,0.5);background:${checked ? 'rgba(56,189,248,0.15)' : 'transparent'};">
          <label style="cursor:pointer;display:flex;align-items:center;gap:6px;">
            <input type="checkbox" ${checked ? 'checked' : ''} onchange="${toggleFnName}('${s.id}')">
            <span><b>${escapeHtml(s.name)}</b> (${s.gender}, ${s.age}y, ${escapeHtml(ARCHETYPE_NAMES[s.archetype] || s.archetype)})</span>
          </label>
          <span class="num" style="font-size:12px;color:var(--text-muted);">OVR ${s.overall} • ${formatMoney(s.contract?.salary)} • Val: <b>${val}</b></span>
        </div>
      `;
    }).join('');
  };

  // 3. Free Agent Pool Browser
  let faPool = (league.freeAgents || []).slice().sort((a, b) => getSwimmerBestPowerPoints(b).powerPoints - getSwimmerBestPowerPoints(a).powerPoints);
  if (appState.faFilterGender !== 'ALL') faPool = faPool.filter(s => s.gender === appState.faFilterGender);

  const faRows = faPool.slice(0, 25).map(fa => {
    const pp = getSwimmerBestPowerPoints(fa);
    const ask = estimateFairContract(league, fa);
    return `
      <tr>
        <td><button class="link-btn" onclick="openSwimmerModal('${fa.id}')">${escapeHtml(fa.name)}</button></td>
        <td>${fa.gender} • ${fa.age}y</td>
        <td>${escapeHtml(ARCHETYPE_NAMES[fa.archetype] || fa.archetype)}</td>
        <td class="num">${fa.overall} / ${fa.potential}</td>
        <td class="num" style="color:var(--accent-gold);font-weight:700;">${pp.powerPoints}</td>
        <td>${escapeHtml(EVENT_MAP[pp.bestEvent]?.name || pp.bestEvent)} (${formatTime(fa.pbs?.[pp.bestEvent])})</td>
        <td class="num">${formatMoney(ask.salary)} (${ask.years}y)</td>
        <td>
          <button class="btn btn-sm btn-primary" onclick="signFreeAgentSwap('${fa.id}')">Sign & Swap</button>
        </td>
      </tr>
    `;
  }).join('');

  return `
    ${offseasonHtml}

    <div class="panel">
      <div class="panel-header">
        <div>
          <div class="panel-title">Trade Center (Deadline: Regular Season Week 10)</div>
          <div style="font-size:12px;color:var(--text-muted);">Swap swimmers (matching W/M counts to maintain 14W/14M active rosters) and draft picks under the $4.20M salary cap.</div>
        </div>
        <select onchange="selectTradePartner(this.value)" id="trade-partner-select">
          ${cpuTeams.map(t => `<option value="${t.id}" ${t.id === partner.id ? 'selected' : ''}>Trade Partner: ${escapeHtml(t.name)} (${t.wins}-${t.losses})</option>`).join('')}
        </select>
      </div>

      ${appState.tradeStatusMsg ? `<div style="margin-bottom:10px;padding:8px 12px;border-radius:6px;background:rgba(56,189,248,0.12);border:1px solid var(--accent-cyan);">${escapeHtml(appState.tradeStatusMsg)}</div>` : ''}

      <div class="grid-2">
        <div style="border:1px solid var(--border-subtle);border-radius:8px;padding:10px;max-height:310px;overflow-y:auto;">
          <div style="font-weight:800;margin-bottom:6px;">Your Club Assets (${escapeHtml(uTeam.name)})</div>
          ${renderTradeRosterSelect(uTeam, appState.tradeUserSwimmers, 'toggleUserTradeSwimmer')}
        </div>
        <div style="border:1px solid var(--border-subtle);border-radius:8px;padding:10px;max-height:310px;overflow-y:auto;">
          <div style="font-weight:800;margin-bottom:6px;">Partner Assets (${escapeHtml(partner.name)})</div>
          ${renderTradeRosterSelect(partner, appState.tradeCpuSwimmers, 'toggleCpuTradeSwimmer')}
        </div>
      </div>

      <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <div style="font-size:13px;">
          <strong>CPU Trade Assessment:</strong>
          <span style="color:${evalCheck.accepted ? 'var(--accent-green)' : 'var(--text-muted)'};">${escapeHtml(evalCheck.reason)}</span>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-sm" onclick="clearTradeProposal()">Clear</button>
          <button class="btn btn-sm btn-gold" onclick="submitTradeOffer()" ${(appState.tradeUserSwimmers.length === 0 && appState.tradeCpuSwimmers.length === 0) ? 'disabled' : ''}>Execute Trade</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">Free Agent Pool (${(league.freeAgents || []).length} Available)</div>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-sm ${appState.faFilterGender === 'ALL' ? 'btn-primary' : ''}" onclick="setFaGenderFilter('ALL')">All</button>
          <button class="btn btn-sm ${appState.faFilterGender === 'F' ? 'btn-primary' : ''}" onclick="setFaGenderFilter('F')">Women</button>
          <button class="btn btn-sm ${appState.faFilterGender === 'M' ? 'btn-primary' : ''}" onclick="setFaGenderFilter('M')">Men</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Swimmer</th><th>G/Age</th><th>Archetype</th><th class="num">OVR / POT</th><th class="num">Power Pts</th><th>Best Event</th><th class="num">Ask Contract</th><th>Sign</th></tr>
          </thead>
          <tbody>${faRows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function runOffseasonStepAwards() {
  processSeasonAwards(appState.league);
  appState.league.offseasonStep = 'retirements';
  saveLeagueToStorage();
  renderApp();
}

function runOffseasonStepRetirements() {
  processRetirementsAndDevelopment(appState.league);
  prepareOffseasonContracts(appState.league);
  for (const t of appState.league.teams) {
    if (t.id !== appState.league.userTeamId) autoResignTeamExpiring(appState.league, t);
  }
  appState.league.offseasonStep = 'resigning';
  saveLeagueToStorage();
  renderApp();
}

function userResignSwimmer(swimmerId) {
  const league = appState.league;
  const uTeam = getUserTeam();
  const list = league.expiringSwimmers?.[uTeam.id] || [];
  const idx = list.findIndex(s => s.id === swimmerId);
  if (idx === -1) return;
  const sw = list[idx];
  const fair = estimateFairContract(league, sw);
  const payroll = uTeam.roster.reduce((sum, s) => sum + s.contract.salary, 0);
  const gCnt = uTeam.roster.filter(s => s.gender === sw.gender).length;
  if (gCnt >= 14) {
    alert(`You already have 14 ${sw.gender === 'F' ? 'Women' : 'Men'} under contract.`);
    return;
  }
  if (payroll + fair.salary > league.salaryCap) {
    alert('Insufficient salary cap space to re-sign this swimmer.');
    return;
  }
  sw.contract = fair;
  sw.teamId = uTeam.id;
  uTeam.roster.push(sw);
  list.splice(idx, 1);
  saveLeagueToStorage();
  renderApp();
}

function userReleaseExpiring(swimmerId) {
  const league = appState.league;
  const uTeam = getUserTeam();
  const list = league.expiringSwimmers?.[uTeam.id] || [];
  const idx = list.findIndex(s => s.id === swimmerId);
  if (idx === -1) return;
  const sw = list.splice(idx, 1)[0];
  sw.teamId = null;
  league.freeAgents.push(sw);
  saveLeagueToStorage();
  renderApp();
}

function runOffseasonStepAdvanceToDraft() {
  const league = appState.league;
  const uTeam = getUserTeam();
  autoResignTeamExpiring(league, uTeam);
  initDraftAndLottery(league);
  league.offseasonStep = 'draft';
  saveLeagueToStorage();
  renderApp();
}

function simDraftToUserPick() {
  const league = appState.league;
  const draft = league.draft;
  if (!draft) return;
  while (draft.currentPickIndex < draft.picks.length) {
    const pick = draft.picks[draft.currentPickIndex];
    if (pick.teamId === league.userTeamId) break;
    makeDraftPick(league, draft.currentPickIndex);
  }
  if (draft.currentPickIndex >= draft.picks.length) {
    finishRemainingDraft(league);
    league.offseasonStep = 'freeAgency';
  }
  saveLeagueToStorage();
  renderApp();
}

function userDraftProspect(prospectId) {
  const league = appState.league;
  const draft = league.draft;
  if (!draft) return;
  makeDraftPick(league, draft.currentPickIndex, prospectId);
  if (draft.currentPickIndex >= draft.picks.length) {
    finishRemainingDraft(league);
    league.offseasonStep = 'freeAgency';
  }
  saveLeagueToStorage();
  renderApp();
}

function runOffseasonFinishDraft() {
  const league = appState.league;
  finishRemainingDraft(league);
  league.offseasonStep = 'freeAgency';
  saveLeagueToStorage();
  renderApp();
}

function runOffseasonStartNextSeason() {
  const league = appState.league;
  runCpuFreeAgencyAndRosterTrim(league);
  startNextSeason(league);
  saveLeagueToStorage();
  renderApp();
}

function selectTradePartner(teamId) {
  appState.tradePartnerId = teamId;
  appState.tradeCpuSwimmers = [];
  appState.tradeStatusMsg = null;
  renderApp();
}

function toggleUserTradeSwimmer(id) {
  const idx = appState.tradeUserSwimmers.indexOf(id);
  if (idx === -1) appState.tradeUserSwimmers.push(id);
  else appState.tradeUserSwimmers.splice(idx, 1);
  renderApp();
}

function toggleCpuTradeSwimmer(id) {
  const idx = appState.tradeCpuSwimmers.indexOf(id);
  if (idx === -1) appState.tradeCpuSwimmers.push(id);
  else appState.tradeCpuSwimmers.splice(idx, 1);
  renderApp();
}

function clearTradeProposal() {
  appState.tradeUserSwimmers = [];
  appState.tradeCpuSwimmers = [];
  appState.tradeUserPicks = [];
  appState.tradeCpuPicks = [];
  appState.tradeStatusMsg = null;
  renderApp();
}

function submitTradeOffer() {
  const league = appState.league;
  const uTeam = getUserTeam();
  const partner = getTeamById(appState.tradePartnerId);
  const res = executeTrade(league, uTeam, partner, appState.tradeUserSwimmers, appState.tradeCpuSwimmers, appState.tradeUserPicks, appState.tradeCpuPicks);
  appState.tradeStatusMsg = res.reason;
  if (res.accepted) {
    appState.tradeUserSwimmers = [];
    appState.tradeCpuSwimmers = [];
    appState.lineupDraft = null;
    saveLeagueToStorage();
  }
  renderApp();
}

function setFaGenderFilter(g) {
  appState.faFilterGender = g;
  renderApp();
}

function signFreeAgentSwap(faId) {
  const league = appState.league;
  const uTeam = getUserTeam();
  const faIdx = league.freeAgents.findIndex(s => s.id === faId);
  if (faIdx === -1) return;
  const fa = league.freeAgents[faIdx];
  const fair = estimateFairContract(league, fa);

  const sameGender = uTeam.roster.filter(s => s.gender === fa.gender).sort((a, b) => a.overall - b.overall);
  const cutCandidate = sameGender[0];
  const payrollAfter = uTeam.roster.reduce((sum, s) => sum + s.contract.salary, 0) - (sameGender.length >= 14 && cutCandidate ? cutCandidate.contract.salary : 0) + fair.salary;

  if (payrollAfter > league.salaryCap) {
    alert(`Signing ${fa.name} (${formatMoney(fair.salary)}) would exceed the $4.20M salary cap.`);
    return;
  }

  league.freeAgents.splice(faIdx, 1);
  if (sameGender.length >= 14 && cutCandidate) {
    const cIdx = uTeam.roster.findIndex(s => s.id === cutCandidate.id);
    if (cIdx !== -1) {
      const released = uTeam.roster.splice(cIdx, 1)[0];
      released.teamId = null;
      league.freeAgents.push(released);
    }
  }
  fa.contract = fair;
  fa.teamId = uTeam.id;
  uTeam.roster.push(fa);
  appState.lineupDraft = null;
  saveLeagueToStorage();
  renderApp();
}
