// Compute a swimmer's tapered base percentage offset above Benchmark for any eventId
function getSwimmerEventOffset(swimmer, eventId) {
  const ev = EVENT_MAP[eventId];
  if (!ev) return 0.15;
  const dw = DIST_WEIGHTS[ev.dist] || DIST_WEIGHTS[200];
  const p = swimmer.physDeficit;

  // 1. Physiological energy system deficit (percentage points above 0)
  const physDeficit =
    dw.ala * p.ala +
    dw.gly * p.gly +
    dw.aer * p.aer +
    dw.end * p.end;

  // 2. Stroke efficiency deficit
  let strokeDeficit = 0;
  if (ev.stroke === 'IM') {
    const s = swimmer.strokeDeficit;
    strokeDeficit = (0.24 * s.FL + 0.26 * s.BK + 0.28 * s.BR + 0.22 * s.FR) * swimmer.imEfficiency + swimmer.imBonus;
  } else {
    strokeDeficit = swimmer.strokeDeficit[ev.stroke] ?? 0.05;
  }

  // 3. Technical start & turn contribution (centered around 0, range roughly -0.004 to +0.004)
  // Higher start/turn rating (0..100, center 75) reduces time offset
  const startMod = -((swimmer.start - 75) / 25) * 0.008 * dw.startW;
  const turnMod  = -((swimmer.turns - 75) / 25) * 0.008 * dw.turnW;

  // 4. Combine with swimmer's overall base talent offset
  const totalOffset = swimmer.baseOffset + physDeficit + strokeDeficit + startMod + turnMod;
  return Math.max(-0.026, totalOffset);
}

// Tapered base time (in seconds) if swimmer were racing fully tapered right now
function getTaperedBaseTime(swimmer, eventId) {
  const ev = EVENT_MAP[eventId];
  if (!ev) return 999;
  const bm = ev.bm[swimmer.gender];
  const offset = getSwimmerEventOffset(swimmer, eventId);
  return bm * (1 + offset);
}

// Projected time today given current fitness, fatigue, taper state, and prior swims today
function getProjectedSwimTime(swimmer, eventId, options = {}) {
  const baseTapered = getTaperedBaseTime(swimmer, eventId);
  const priorSwims = options.priorSwims || 0;
  const isBackToBack = options.isBackToBack || false;
  const isHome = options.isHome || false;
  const forceRested = options.forceRested || false;

  // Training / Taper / Rest modifier relative to tapered best
  let statePenalty = 0;
  if (forceRested || (swimmer.taperState && swimmer.taperState.status === 'peaked')) {
    // Fully tapered! Taper response controls how close they get to (or slightly under) their tapered ceiling
    const respBonus = (swimmer.taperResponse - 1.0) * 0.012;
    const fitnessBonus = ((swimmer.fitness ?? 85) - 85) * 0.00012;
    statePenalty = -respBonus - fitnessBonus;
  } else if (swimmer.taperState && swimmer.taperState.status === 'resting') {
    // Short rest week: ~1.15% slower than full taper
    const fatFactor = ((swimmer.fatigue ?? 25) / 100) * 0.008;
    statePenalty = 0.0095 + fatFactor;
  } else if (swimmer.taperState && swimmer.taperState.status === 'fading') {
    // Post-taper fade: ~1.4% slower than peak
    statePenalty = 0.014;
  } else {
    // Untapered in-season training: 2.0% to 3.0% slower than tapered best (mean ~2.48%)
    const fat = swimmer.fatigue ?? 55;
    const fit = swimmer.fitness ?? 75;
    statePenalty = 0.0205 + (fat / 100) * 0.0078 - ((fit - 70) / 100) * 0.0025;
    statePenalty = Math.max(0.0195, Math.min(0.0305, statePenalty));
  }

  // In-meet cumulative fatigue from earlier events & short rest doubles
  const durFactor = 1.15 - (swimmer.durability || 75) / 200; // ~0.65 to 0.85
  let doublePenalty = priorSwims * 0.0022 * durFactor;
  if (isBackToBack) {
    doublePenalty += 0.0045 * durFactor;
  }

  // Home pool edge (-0.16%)
  const homeMod = isHome ? -0.0016 : 0;

  return baseTapered * (1 + statePenalty + doublePenalty + homeMod);
}

// Simulate an actual swim and produce final time + realistic 50-yard splits
function simulateIndividualSwim(rngHolder, swimmer, eventId, options = {}) {
  const projected = getProjectedSwimTime(swimmer, eventId, options);
  const isBigMeet = options.isBigMeet || false;

  // Clutch modifier in big meets
  const clutchMod = isBigMeet ? -((swimmer.clutch - 75) / 25) * 0.0020 : 0;

  // Race-day variance (SD ~0.22% to 0.34% depending on consistency)
  const cons = swimmer.consistency || 78;
  const sd = 0.0033 - ((cons - 60) / 40) * 0.0012;
  const raceNoise = rngNormal(rngHolder, 0, Math.max(0.0016, sd));

  let rawTime = projected * (1 + clutchMod + raceNoise);
  // Prevent impossible superhuman outliers beyond -2.75% of benchmark unless generational
  const ev = EVENT_MAP[eventId];
  const minFloor = ev.bm[swimmer.gender] * 0.968;
  if (rawTime < minFloor) rawTime = minFloor + (rawTime - minFloor) * 0.25;

  const finalTime = Math.round(rawTime * 100) / 100;
  const splits = generateSplits(rngHolder, swimmer, eventId, finalTime);
  return {
    time: finalTime,
    splits,
    powerPoints: calcPowerPoints(eventId, swimmer.gender, finalTime)
  };
}

// --- 7. REALISTIC 50-YARD SPLIT GENERATOR ---
function generateSplits(rngHolder, swimmer, eventId, finalTime) {
  const ev = EVENT_MAP[eventId];
  if (!ev || ev.dist <= 50) {
    return [finalTime];
  }
  const numSplits = Math.round(ev.dist / 50);
  let weights = [];

  // Sprinter vs distance pacing tendency (-1 = aggressive front-half, +1 = strong back-half closer)
  const p = swimmer.physDeficit || { ala: 0, gly: 0, aer: 0, end: 0 };
  const paceTendency = Math.max(-1, Math.min(1, ((p.ala + p.gly) * 0.5 - p.aer) * 18));

  if (eventId === '100FR') {
    // Reference: 41.5 -> 19.9 / 21.6 (0.47952 / 0.52048)
    const w0 = 0.47952 + paceTendency * 0.0018;
    weights = [w0, 1 - w0];
  } else if (eventId === '100BK') {
    // Reference: 45.0 -> 21.8 / 23.2 (0.48444 / 0.51556)
    const w0 = 0.48444 + paceTendency * 0.0016;
    weights = [w0, 1 - w0];
  } else if (eventId === '100BR') {
    // Reference: 51.5 -> 24.1 / 27.4 (0.46796 / 0.53204)
    const w0 = 0.46796 + paceTendency * 0.0016;
    weights = [w0, 1 - w0];
  } else if (eventId === '100FL') {
    // Reference: 45.0 -> 20.9 / 24.1 (0.46444 / 0.53556)
    const w0 = 0.46444 + paceTendency * 0.0018;
    weights = [w0, 1 - w0];
  } else if (eventId === '200FR') {
    // Reference: 1:32.0 (92.0) -> 21.4 / 23.3 / 23.7 / 23.6
    weights = [
      21.4 / 92.0 + paceTendency * 0.0010,
      23.3 / 92.0 + paceTendency * 0.0004,
      23.7 / 92.0 - paceTendency * 0.0005,
      23.6 / 92.0 - paceTendency * 0.0009
    ];
  } else if (eventId === '200BK') {
    weights = [0.2359, 0.2533, 0.2564, 0.2544];
  } else if (eventId === '200BR') {
    weights = [0.2292, 0.2548, 0.2585, 0.2575];
  } else if (eventId === '200FL') {
    weights = [0.2244, 0.2528, 0.2599, 0.2629];
  } else if (eventId === '200IM') {
    // Reference: 1:41.0 (101.0) -> 21.9 / 25.3 / 29.4 / 24.4
    // Modulated subtly by swimmer's relative Fly/Back/Breast/Free stroke deficits
    const s = swimmer.strokeDeficit || { FL: 0, BK: 0, BR: 0, FR: 0 };
    const meanS = (s.FL + s.BK + s.BR + s.FR) / 4;
    weights = [
      (21.9 / 101.0) * (1 + (s.FL - meanS) * 0.22),
      (25.3 / 101.0) * (1 + (s.BK - meanS) * 0.22),
      (29.4 / 101.0) * (1 + (s.BR - meanS) * 0.22),
      (24.4 / 101.0) * (1 + (s.FR - meanS) * 0.22)
    ];
  } else if (eventId === '400IM') {
    // 8 splits of 50: 2 Fly, 2 Back, 2 Breast, 2 Free
    const s = swimmer.strokeDeficit || { FL: 0, BK: 0, BR: 0, FR: 0 };
    const meanS = (s.FL + s.BK + s.BR + s.FR) / 4;
    const base8 = [22.6, 25.3, 26.9, 27.3, 30.5, 31.0, 26.0, 25.4];
    const strokes8 = ['FL', 'FL', 'BK', 'BK', 'BR', 'BR', 'FR', 'FR'];
    weights = base8.map((b, idx) => (b / 215.0) * (1 + (s[strokes8[idx]] - meanS) * 0.20));
  } else if (eventId === '500FR') {
    // Reference: 4:12.0 (252.0) -> 23.6 out, then holding 25.2 to 25.6
    const ref10 = [23.60, 25.25, 25.35, 25.40, 25.42, 25.45, 25.45, 25.43, 25.38, 25.27];
    weights = ref10.map(x => x / 252.0);
  } else if (eventId === '1000FR') {
    // 20 splits: fast out off dive, steady hold, strong closing 50
    const ref20 = [24.10];
    for (let i = 1; i < 19; i++) {
      ref20.push(26.40 + Math.sin((i / 18) * Math.PI) * 0.14);
    }
    ref20.push(25.45);
    const sum20 = ref20.reduce((a, b) => a + b, 0);
    weights = ref20.map(x => x / sum20);
  } else if (eventId === '1650FR') {
    // Reference: 14:40.0 (880.0) -> 24.6 out, holding 26.6 to 26.9, closing under 26 (25.70)
    const ref33 = [24.60];
    for (let i = 1; i <= 31; i++) {
      // Smooth hold strictly between 26.68 and 26.82 (average 26.7645)
      const curve = 26.71 + Math.sin((i / 31) * Math.PI) * 0.085;
      ref33.push(curve);
    }
    ref33.push(25.70);
    const sum33 = ref33.reduce((a, b) => a + b, 0);
    weights = ref33.map(x => x / sum33);
  } else {
    weights = Array(numSplits).fill(1 / numSplits);
  }

  // Add tiny realistic split noise while preserving split shapes, then normalize to finalTime
  const noisy = weights.map((w, idx) => {
    const jitterSd = numSplits >= 10 ? 0.00028 : 0.00055;
    const j = rngNormal(rngHolder, 0, jitterSd);
    // Keep opening and closing splits extra true to reference
    return Math.max(0.01, w * (1 + (idx === 0 ? j * 0.5 : j)));
  });

  const wSum = noisy.reduce((a, b) => a + b, 0);
  const splits = [];
  let runningSum = 0;
  for (let i = 0; i < numSplits - 1; i++) {
    const s = Math.round((finalTime * (noisy[i] / wSum)) * 100) / 100;
    splits.push(s);
    runningSum = Math.round((runningSum + s) * 100) / 100;
  }
  const lastSplit = Math.round((finalTime - runningSum) * 100) / 100;
  splits.push(lastSplit);
  return splits;
}

// --- 8. RELAY SIMULATION (Flat Lead-off + 3 Flying Exchanges + Early Takeoff DQ) ---
function simulateRelaySwim(rngHolder, relayEventId, swimmers, options = {}) {
  const ev = EVENT_MAP[relayEventId];
  if (!ev || !swimmers || swimmers.length !== 4) {
    return { dq: true, dqLeg: 1, time: 9999, legTimes: [], legSplits: [], reactionTimes: [] };
  }

  const legTimes = [];
  const legSplits = [];
  const reactionTimes = [];
  let totalTime = 0;
  let dq = false;
  let dqLeg = null;
  let leadoffOfficial = null;

  for (let i = 0; i < 4; i++) {
    const sw = swimmers[i];
    const legEventId = ev.legs[i];
    const priorSwims = (options.priorSwimsBySwimmer && options.priorSwimsBySwimmer[sw.id]) || 0;
    const isBackToBack = (options.backToBackBySwimmer && options.backToBackBySwimmer[sw.id]) || false;

    const flatSwim = simulateIndividualSwim(rngHolder, sw, legEventId, {
      priorSwims,
      isBackToBack,
      isHome: options.isHome,
      isBigMeet: options.isBigMeet,
      forceRested: options.forceRested
    });

    if (i === 0) {
      // Flat start lead-off leg: counts as official individual time for PBs and records!
      const rt = Math.round(rngRange(rngHolder, 0.58, 0.72) * 100) / 100;
      reactionTimes.push(rt);
      legTimes.push(flatSwim.time);
      legSplits.push(flatSwim.splits);
      totalTime = Math.round((totalTime + flatSwim.time) * 100) / 100;
      // Only 100FR, 200FR, 100BK, 50FR are official individual record events (not 50BK)
      if (EVENT_MAP[legEventId] && INDIVIDUAL_EVENTS.some(e => e.id === legEventId)) {
        leadoffOfficial = {
          swimmerId: sw.id,
          swimmerName: sw.name,
          gender: sw.gender,
          eventId: legEventId,
          time: flatSwim.time,
          splits: flatSwim.splits,
          powerPoints: flatSwim.powerPoints
        };
      }
    } else {
      // Flying start leg!
      // Early takeoff DQ probability: ~0.30% per flying leg -> ~0.90% per relay (range 0.5% to 1.5%)
      const exSkill = sw.relayExchange || 75;
      const dqProb = Math.max(0.0018, 0.0033 - ((exSkill - 75) / 25) * 0.0008);
      if (nextRng(rngHolder) < dqProb) {
        dq = true;
        dqLeg = i + 1;
        reactionTimes.push(-Math.round(rngRange(rngHolder, 0.04, 0.11) * 100) / 100);
      } else {
        reactionTimes.push(Math.round(rngRange(rngHolder, 0.05, 0.28) * 100) / 100);
      }

      // Flying start exchange advantage: 0.40 to 0.70 seconds faster than flat start (mean ~0.49s)
      const meanAdv = 0.47 + ((exSkill - 70) / 30) * 0.06;
      const exchangeAdvantage = Math.max(0.40, Math.min(0.70, rngNormal(rngHolder, meanAdv, 0.042)));
      const flyingTime = Math.round((flatSwim.time - exchangeAdvantage) * 100) / 100;

      // Adjust first 50 split of the flying leg by the exchange advantage so leg splits sum to flyingTime
      const fSplits = flatSwim.splits.slice();
      fSplits[0] = Math.round((fSplits[0] - (flatSwim.time - flyingTime)) * 100) / 100;

      legTimes.push(flyingTime);
      legSplits.push(fSplits);
      totalTime = Math.round((totalTime + flyingTime) * 100) / 100;
    }
  }

  return {
    dq,
    dqLeg,
    time: dq ? 9999 : totalTime,
    legTimes,
    legSplits,
    reactionTimes,
    leadoffOfficial,
    powerPoints: dq ? 0 : calcPowerPoints(relayEventId, ev.mixed ? 'X' : swimmers[0].gender, totalTime)
  };
}

// --- 9. SWIMMER GENERATION & ARCHETYPE CALIBRATION ---
let NEXT_SWIMMER_ID = 1000;

function generateSwimmerName(rngHolder, gender, usedNames) {
  const firstPool = gender === 'F' ? FIRST_NAMES_F : FIRST_NAMES_M;
  for (let attempt = 0; attempt < 40; attempt++) {
    const first = rngChoice(rngHolder, firstPool);
    const last = rngChoice(rngHolder, LAST_NAMES);
    const full = `${first} ${last}`;
    if (!usedNames || !usedNames.has(full)) {
      if (usedNames) usedNames.add(full);
      return full;
    }
  }
  const fallback = `${rngChoice(rngHolder, firstPool)} ${rngChoice(rngHolder, LAST_NAMES)}-${rngInt(rngHolder, 2, 99)}`;
  if (usedNames) usedNames.add(fallback);
  return fallback;
}

// Build a coherent physiological & stroke profile for a given template and talent rank (0.0 = #1 of 24 in slot, 1.0 = #24 of 24 in slot)
function buildProfileFromTemplate(rngHolder, template, rankNorm, age, isGenerational = false) {
  const r = Math.max(0, Math.min(1.35, rankNorm));
  const dp = template.distProfile;
  const slotShift = dp === 'sp_relay' ? 0.0510 : dp === 'dist_1650' ? 0.0165 : 0.0;
  let targetCurrentOffset = -0.0052 + slotShift + 0.0635 * Math.pow(r, 0.50);
  if (isGenerational) {
    targetCurrentOffset = rngRange(rngHolder, -0.0215, -0.0160);
  }

  // 4 Physiological energy systems: ala (50), gly (100), aer (200-400), end (500-1650)
  let ala = 0, gly = 0, aer = 0, end = 0;
  if (dp === 'sp_50') {
    // 50 Free lead / 100 Free co-lead
    ala = rngRange(rngHolder, 0.000, 0.0015);
    gly = rngRange(rngHolder, 0.024, 0.030);
    aer = rngRange(rngHolder, 0.052, 0.064);
    end = rngRange(rngHolder, 0.105, 0.135);
  } else if (dp === 'sp_100') {
    // 100 Free lead / 50 & 200 Free co-lead
    ala = rngRange(rngHolder, 0.034, 0.041);
    gly = rngRange(rngHolder, 0.000, 0.0015);
    aer = rngRange(rngHolder, 0.022, 0.028);
    end = rngRange(rngHolder, 0.085, 0.115);
  } else if (dp === 'sp_relay') {
    // Sprint relay & depth specialist (50/100 Free #3, plus 100 Breast/Fly secondary)
    ala = rngRange(rngHolder, 0.003, 0.007);
    gly = rngRange(rngHolder, 0.004, 0.009);
    aer = rngRange(rngHolder, 0.026, 0.035);
    end = rngRange(rngHolder, 0.080, 0.105);
  } else if (dp === 'mid_200') {
    // 200 Free lead / 500 Free co-lead / 100 Free #3
    ala = rngRange(rngHolder, 0.052, 0.064);
    gly = rngRange(rngHolder, 0.028, 0.036);
    aer = rngRange(rngHolder, 0.000, 0.0015);
    end = rngRange(rngHolder, 0.038, 0.048);
  } else if (dp === 'mid_500') {
    // 500 Free lead / 200 & 1000 Free co-lead
    ala = rngRange(rngHolder, 0.085, 0.105);
    gly = rngRange(rngHolder, 0.255, 0.285);
    aer = rngRange(rngHolder, 0.000, 0.002);
    end = rngRange(rngHolder, 0.038, 0.046);
  } else if (dp === 'dist_1000') {
    // 1000 & 1650 Free lead / 500 Free co-lead
    ala = rngRange(rngHolder, 0.090, 0.108);
    gly = rngRange(rngHolder, 0.068, 0.084);
    aer = rngRange(rngHolder, 0.052, 0.062);
    end = rngRange(rngHolder, 0.000, 0.002);
  } else if (dp === 'dist_1650') {
    // 1650 & 1000 Free co-lead / 400 IM & 500 Free #3
    ala = rngRange(rngHolder, 0.095, 0.112);
    gly = rngRange(rngHolder, 0.072, 0.088);
    aer = rngRange(rngHolder, 0.048, 0.058);
    end = rngRange(rngHolder, 0.000, 0.0015);
  } else if (dp === 'st_100') {
    // 100 Stroke lead / 200 Stroke co-lead
    ala = rngRange(rngHolder, 0.002, 0.005);
    gly = rngRange(rngHolder, 0.000, 0.0015);
    aer = rngRange(rngHolder, 0.022, 0.028);
    end = rngRange(rngHolder, 0.055, 0.075);
  } else if (dp === 'st_200') {
    // 200 Stroke lead / 100 Stroke co-lead / IM co-lead
    ala = rngRange(rngHolder, 0.030, 0.038);
    gly = rngRange(rngHolder, 0.020, 0.026);
    aer = rngRange(rngHolder, 0.000, 0.0015);
    end = rngRange(rngHolder, 0.006, 0.012);
  } else {
    // im_both (200 & 400 IM lead, plus #3 in stroke events)
    ala = rngRange(rngHolder, 0.026, 0.034);
    gly = rngRange(rngHolder, 0.016, 0.022);
    aer = rngRange(rngHolder, 0.000, 0.0015);
    end = rngRange(rngHolder, 0.000, 0.002);
  }

  // Stroke deficits { FR, BK, BR, FL }
  const strokeDeficit = {
    FR: rngRange(rngHolder, 0.045, 0.062),
    BK: rngRange(rngHolder, 0.054, 0.076),
    BR: rngRange(rngHolder, 0.064, 0.088),
    FL: rngRange(rngHolder, 0.052, 0.074)
  };

  let imEfficiency = 1.0;
  let imBonus = 0.026;

  if (template.primaryStroke === 'IM') {
    strokeDeficit.FR = rngRange(rngHolder, 0.025, 0.033);
    strokeDeficit.BK = rngRange(rngHolder, 0.022, 0.031);
    strokeDeficit.BR = rngRange(rngHolder, 0.016, 0.022);
    strokeDeficit.FL = rngRange(rngHolder, 0.022, 0.031);
    if (template.secondStroke && strokeDeficit[template.secondStroke] !== undefined) {
      strokeDeficit[template.secondStroke] = rngRange(rngHolder, 0.015, 0.021);
    }
    imEfficiency = 0.15;
    imBonus = -0.0015;
  } else {
    strokeDeficit[template.primaryStroke] = 0.0;
    if (template.secondStroke === 'IM') {
      for (const st of ['FR', 'BK', 'BR', 'FL']) {
        if (st !== template.primaryStroke) {
          strokeDeficit[st] = rngRange(rngHolder, 0.028, 0.037);
        }
      }
      imEfficiency = 0.35;
      imBonus = 0.0135;
    } else if (template.secondStroke && strokeDeficit[template.secondStroke] !== undefined) {
      if (template.secondStroke === 'FR' && dp === 'st_100') {
        strokeDeficit.FR = rngRange(rngHolder, 0.034, 0.042);
      } else if (dp === 'sp_relay') {
        strokeDeficit[template.secondStroke] = rngRange(rngHolder, 0.008, 0.015);
      } else {
        strokeDeficit[template.secondStroke] = rngRange(rngHolder, 0.026, 0.034);
      }
    }
  }

  // Technical & Mental Attributes (50..99 scale, centered at 75)
  const talentBoost = Math.round((1 - Math.min(1, r)) * 12);
  const start = Math.max(52, Math.min(99, 69 + talentBoost + rngInt(rngHolder, -7, 9)));
  const turns = Math.max(52, Math.min(99, 69 + talentBoost + rngInt(rngHolder, -7, 9)));
  const relayExchange = Math.max(55, Math.min(99, 71 + rngInt(rngHolder, -10, 17)));
  const taperResponse = Math.round(rngRange(rngHolder, 0.90, 1.12) * 100) / 100;
  const consistency = Math.max(58, Math.min(98, 75 + rngInt(rngHolder, -12, 15)));
  const clutch = Math.max(55, Math.min(99, 74 + rngInt(rngHolder, -12, 16)));
  const durability = Math.max(58, Math.min(98, 75 + rngInt(rngHolder, -12, 16)));

  // Normalize against the swimmer's coreEvent so targetCurrentOffset is their exact coreEvent offset
  const coreEv = EVENT_MAP[template.coreEvent || '200FR'];
  const dw = DIST_WEIGHTS[coreEv.dist];
  const corePhys = dw.ala * ala + dw.gly * gly + dw.aer * aer + dw.end * end;
  const coreStroke = coreEv.stroke === 'IM'
    ? (0.24 * strokeDeficit.FL + 0.26 * strokeDeficit.BK + 0.28 * strokeDeficit.BR + 0.22 * strokeDeficit.FR) * imEfficiency + imBonus
    : (strokeDeficit[coreEv.stroke] || 0);
  const coreStart = -((start - 75) / 25) * 0.008 * dw.startW;
  const coreTurn  = -((turns - 75) / 25) * 0.008 * dw.turnW;
  const intrinsicCore = corePhys + coreStroke + coreStart + coreTurn;

  const currentBaseOffset = targetCurrentOffset - intrinsicCore;

  // Peak age: sprinters peak & fade ~2 years later than distance swimmers
  const isSprinter = template.group === 'sprint';
  const isDistance = template.group === 'distance';
  const peakAge = isSprinter
    ? rngInt(rngHolder, 25, 27)
    : isDistance
      ? rngInt(rngHolder, 23, 25)
      : rngInt(rngHolder, 24, 26);

  const isLateBloomer = nextRng(rngHolder) < 0.16;
  const devRate = Math.round(rngRange(rngHolder, 0.78, 1.25) * 100) / 100;

  // Future prime ceiling: young swimmers (18-22) have 0.5-1.5%/yr of room to drop into age 23!
  const yrsToPrime = Math.max(0, 23 - age);
  const roomToGrow = yrsToPrime * rngRange(rngHolder, 0.0080, 0.0115) * devRate + (isLateBloomer ? 0.006 : 0);
  const primeOffset = Math.max(-0.023 - intrinsicCore, currentBaseOffset - roomToGrow);
  const potentialOffset = primeOffset;

  return {
    baseOffset: currentBaseOffset,
    primeOffset,
    potentialOffset,
    physDeficit: { ala, gly, aer, end },
    strokeDeficit,
    imEfficiency,
    imBonus,
    start,
    turns,
    relayExchange,
    taperResponse,
    consistency,
    clutch,
    durability,
    peakAge,
    devRate,
    isLateBloomer
  };
}

function createSwimmer(rngHolder, options = {}) {
  const gender = options.gender || (nextRng(rngHolder) < 0.5 ? 'F' : 'M');
  const template = options.template || rngChoice(rngHolder, ROSTER_SLOT_TEMPLATES);
  const age = options.age ?? rngInt(rngHolder, 19, 29);
  const rankNorm = options.rankNorm ?? rngRange(rngHolder, 0.05, 0.95);
  const isGenerational = options.isGenerational || false;
  const name = options.name || generateSwimmerName(rngHolder, gender, options.usedNames);

  const prof = buildProfileFromTemplate(rngHolder, template, rankNorm, age, isGenerational);
  const id = `SW_${++NEXT_SWIMMER_ID}`;

  const swimmer = {
    id,
    name,
    lastName: name.split(' ').slice(-1)[0],
    gender,
    age,
    teamId: options.teamId || null,
    slot: template.slot,
    slotRole: template.slot,
    coreEvent: template.coreEvent,
    archetype: template.archetype,
    trainingGroup: template.group, // 'sprint' | 'mid' | 'distance' | 'stroke'
    primaryStroke: template.primaryStroke,
    secondStroke: template.secondStroke,
    distProfile: template.distProfile,
    ...prof,
    overall: Math.max(55, Math.min(99, Math.round(98 - Math.min(1, rankNorm) * 34))),
    potential: Math.max(60, Math.min(99, Math.round(99 - Math.min(1, rankNorm) * 26))),
    fitness: 78,
    fatigue: 42,
    taperState: { status: 'training', peakWeeksLeft: 0, tapersUsed: 0 },
    injury: null,
    contract: options.contract || { salary: 120000, years: 2 },
    pbs: {},
    pbHistory: {},
    seasonBests: {},
    careerTitles: 0,
    allLeagueCount: 0,
    sotyCount: 0
  };

  // Seed initial career Personal Bests based on prior career (slightly slower for rookies, tapered best for veterans)
  seedInitialPersonalBests(rngHolder, swimmer, options.season || 2026);
  // Set realist contract based on power points value if not explicitly supplied
  if (!options.contract) {
    swimmer.contract = estimateFairContract(rngHolder, swimmer);
  }
  return swimmer;
}

function getSwimmerSignatureEvents(swimmer) {
  const evs = [];
  if (swimmer.archetype === 'sprint_free') {
    evs.push('50FR', '100FR');
    if (swimmer.secondStroke === 'FL') evs.push('100FL');
    else if (swimmer.secondStroke === 'BK') evs.push('100BK');
    else if (swimmer.secondStroke === 'BR') evs.push('100BR');
    evs.push('200FR');
  } else if (swimmer.archetype === 'mid_free') {
    evs.push('200FR', '500FR', '100FR');
    if (swimmer.distProfile === 'mid_dist') evs.push('1000FR', '1650FR');
    if (swimmer.secondStroke === 'BK') evs.push('200BK');
    if (swimmer.secondStroke === 'FL') evs.push('200FL');
  } else if (swimmer.archetype === 'dist_free') {
    evs.push('500FR', '1000FR', '1650FR', '200FR');
    if (swimmer.secondStroke === 'IM') evs.push('400IM');
    if (swimmer.secondStroke === 'FL') evs.push('200FL');
  } else if (swimmer.archetype === 'back') {
    evs.push('100BK', '200BK');
    if (swimmer.secondStroke === 'IM') evs.push('200IM', '400IM');
    else evs.push('50FR', '100FR');
  } else if (swimmer.archetype === 'breast') {
    evs.push('100BR', '200BR');
    if (swimmer.secondStroke === 'IM') evs.push('200IM', '400IM');
    else evs.push('50FR');
  } else if (swimmer.archetype === 'fly') {
    evs.push('100FL', '200FL');
    if (swimmer.secondStroke === 'IM') evs.push('200IM', '400IM');
    else evs.push('50FR', '100FR');
  } else {
    // 'im'
    evs.push('200IM', '400IM', '200BR', '200BK', '200FL', '100BR');
  }
  return evs;
}

function seedInitialPersonalBests(rngHolder, swimmer, currentSeason) {
  // Swimmers begin Season 1 with clean PBs to be recorded from actual swims in the league
  // (Invariant: "every personal best and every record on a board traces back to a swim that actually happened")
  delete swimmer.enteringBests;
}

function getSwimmerBestPowerPoints(swimmer) {
  let bestPP = 0;
  let bestEv = '100FR';
  for (const ev of INDIVIDUAL_EVENTS) {
    const sb = swimmer.seasonBests?.[ev.id];
    const sbT = typeof sb === 'number' ? sb : sb?.time;
    const t = sbT || getTaperedBaseTime(swimmer, ev.id);
    const pp = calcPowerPoints(ev.id, swimmer.gender, t);
    if (pp > bestPP) {
      bestPP = pp;
      bestEv = ev.id;
    }
  }
  return { powerPoints: bestPP, bestEvent: bestEv };
}

function estimateFairContract(rngHolder, swimmer) {
  const { powerPoints } = getSwimmerBestPowerPoints(swimmer);
  // Benchmark 1000 PP -> ~$380k; 930 PP -> ~$190k; 860 PP -> $65k minimum
  const norm = Math.max(0, (powerPoints - 855) / 145);
  let rawSal = 65000 + Math.pow(norm, 1.85) * 310000;
  // Sprint freestylers get a slight relay premium
  if (swimmer.archetype === 'sprint_free') rawSal *= 1.06;
  const salary = Math.max(65000, Math.min(480000, Math.round(rawSal / 5000) * 5000));
  const years = rngInt(rngHolder, 1, 3);
  return { salary, years };
}

// --- 10. LEAGUE INITIALIZATION & STRATIFIED TALENT DISTRIBUTION ---
function getAgeWithZeroCurrentOffset(rngHolder, template) {
  // Ages 22-26 are in their prime window (zero ageOffset penalty)
  return rngInt(rngHolder, 22, 26);
}

function generateInitialLeagueRosters(rngHolder, teams, userTeamId, startTier = 'middle', season = 2026) {
  const usedNames = new Set();
  const numTeams = teams.length; // 24

  // 1. Assign randomized team strength weights from seed
  const teamOrder = rngShuffle(rngHolder, teams.map((_, idx) => idx));
  const userIdx = teams.findIndex(t => t.id === userTeamId);
  if (userIdx !== -1) {
    // Place user team in requested starting tier:
    // contender = rank 1..4, middle = rank 10..15, underdog = rank 20..24
    const curPos = teamOrder.indexOf(userIdx);
    let targetPos = curPos;
    if (startTier === 'contender') targetPos = rngInt(rngHolder, 1, 4);
    else if (startTier === 'underdog') targetPos = rngInt(rngHolder, 19, 23);
    else targetPos = rngInt(rngHolder, 9, 14);
    teamOrder[curPos] = teamOrder[targetPos];
    teamOrder[targetPos] = userIdx;
  }

  // Team quality target in [0.272, 0.299] for star-weighted value ((1 - q)^2.5, whose mean on [0,1] is 1/3.5 = 0.2857)
  const teamQuality = new Array(numTeams).fill(0.2857);
  for (let rank = 0; rank < numTeams; rank++) {
    const tIdx = teamOrder[rank];
    teamQuality[tIdx] = 0.299 - (rank / (numTeams - 1)) * 0.027;
  }

  for (const t of teams) {
    t.roster = [];
    t.il = [];
  }

  const runningStarSum = new Array(numTeams).fill(0);
  const runningSlotCount = new Array(numTeams).fill(0);

  // Interleave F and M slots in randomized order so every event has varied distribution across teams
  const allGenderSlots = [];
  for (let slotIdx = 0; slotIdx < ROSTER_SLOT_TEMPLATES.length; slotIdx++) {
    allGenderSlots.push({ gender: 'F', slotIdx });
    allGenderSlots.push({ gender: 'M', slotIdx });
  }
  const shuffledGenderSlots = rngShuffle(rngHolder, allGenderSlots);

  for (const { gender, slotIdx } of shuffledGenderSlots) {
    {
      const template = ROSTER_SLOT_TEMPLATES[slotIdx];

      // Create 24 stratified quantiles in [0, 1] for this slot across the 24 teams
      const quantiles = [];
      for (let k = 0; k < numTeams; k++) {
        const q = (k + 0.5) / numTeams;
        quantiles.push(q);
      }

      // Pair quantiles with teams using salary-cap star-weight mean reversion
      const noisyTeams = teams.map((_, tIdx) => {
        const cnt = runningSlotCount[tIdx];
        const curStarMean = cnt > 0 ? runningStarSum[tIdx] / cnt : teamQuality[tIdx];
        const capCorrection = (curStarMean - teamQuality[tIdx]) * 20.0;
        return {
          tIdx,
          score: (0.5 - (teamQuality[tIdx] - 0.2857) * 5.0) + capCorrection + rngNormal(rngHolder, 0, 0.11)
        };
      }).sort((a, b) => a.score - b.score);

      for (let k = 0; k < numTeams; k++) {
        const tIdx = noisyTeams[k].tIdx;
        const team = teams[tIdx];
        const rankNorm = quantiles[k];
        runningStarSum[tIdx] += Math.pow(1 - rankNorm, 2.5);
        runningSlotCount[tIdx]++;

        // Age distribution: top stars mostly in prime (22-26), others 19-30
        const age = rankNorm < 0.18
          ? rngInt(rngHolder, 23, 26)
          : rngChoice(rngHolder, [19, 20, 21, 22, 23, 24, 24, 25, 25, 26, 27, 28, 29, 30]);

        const sw = createSwimmer(rngHolder, {
          gender,
          template,
          age,
          rankNorm,
          teamId: team.id,
          usedNames,
          season
        });
        team.roster.push(sw);
      }
    }

    // Ensure every team's total payroll is comfortably under the $4.2M cap
    for (const team of teams) {
      enforceTeamCapOnInit(team, 4200000);
    }
  }

  return usedNames;
}

function enforceTeamCapOnInit(team, salaryCap = 4200000) {
  const targetMax = salaryCap - 250000;
  let total = team.roster.reduce((sum, s) => sum + s.contract.salary, 0);
  if (total > targetMax) {
    const scale = targetMax / total;
    for (const s of team.roster) {
      s.contract.salary = Math.max(65000, Math.floor((s.contract.salary * scale) / 5000) * 5000);
    }
  }
}

// --- 11. RELAY SELECTION & SINGLE-MEET SCORING ENGINE ---
function pickBestRelaySwimmers(team, relayEventId, gender, excludedIds = new Set(), options = {}) {
  const ev = EVENT_MAP[relayEventId];
  if (!ev) return [];
  const pool = team.roster.filter(s => !s.injury && !excludedIds.has(s.id) && (ev.mixed ? true : s.gender === gender));

  if (!ev.mixed) {
    // Same-stroke relay (200FRR, 400FRR, 800FRR) or Medley relay (200MR, 400MR)
    const isMedley = relayEventId === '200MR' || relayEventId === '400MR';
    if (!isMedley) {
      const legEv = ev.legs[0];
      const sorted = pool
        .map(s => ({ s, t: getProjectedSwimTime(s, legEv, options) - (s.relayExchange - 70) * 0.002 }))
        .sort((a, b) => a.t - b.t)
        .slice(0, 4);
      if (sorted.length < 4) return [];
      // Order: 2nd fastest lead-off (good flat start), 3rd, 4th, fastest anchor!
      sorted.sort((a, b) => getProjectedSwimTime(a.s, legEv, options) - getProjectedSwimTime(b.s, legEv, options));
      return [sorted[1].s, sorted[2].s, sorted[3].s, sorted[0].s];
    } else {
      // Greedy optimal 4-stroke assignment across BK, BR, FL, FR
      const legs = ev.legs; // ['50BK','50BR','50FL','50FR'] or 100s
      let bestCombo = null;
      let bestTime = 999999;

      // Top 5 candidates per leg
      const cands = legs.map(legId =>
        pool
          .map(s => ({ s, t: getProjectedSwimTime(s, legId, options) }))
          .sort((a, b) => a.t - b.t)
          .slice(0, 6)
      );

      for (const c0 of cands[0]) {
        for (const c1 of cands[1]) {
          if (c1.s.id === c0.s.id) continue;
          for (const c2 of cands[2]) {
            if (c2.s.id === c0.s.id || c2.s.id === c1.s.id) continue;
            for (const c3 of cands[3]) {
              if (c3.s.id === c0.s.id || c3.s.id === c1.s.id || c3.s.id === c2.s.id) continue;
              const sumT = c0.t + c1.t + c2.t + c3.t;
              if (sumT < bestTime) {
                bestTime = sumT;
                bestCombo = [c0.s, c1.s, c2.s, c3.s];
              }
            }
          }
        }
      }
      return bestCombo || pool.slice(0, 4);
    }
  } else {
    // Mixed relay (200MXMR or 200MXFRR): 2 Women ('F') and 2 Men ('M') in any order!
    const women = pool.filter(s => s.gender === 'F');
    const men = pool.filter(s => s.gender === 'M');
    if (women.length < 2 || men.length < 2) return [];

    if (relayEventId === '200MXFRR') {
      const topW = women.map(s => ({ s, t: getProjectedSwimTime(s, '50FR', options) })).sort((a, b) => a.t - b.t).slice(0, 2);
      const topM = men.map(s => ({ s, t: getProjectedSwimTime(s, '50FR', options) })).sort((a, b) => a.t - b.t).slice(0, 2);
      // Classic coaching order: M lead-off, W 2nd, W 3rd, M anchor (or customizable in UI!)
      return [topM[1].s, topW[0].s, topW[1].s, topM[0].s];
    } else {
      // Mixed 200 Medley Relay: 2W + 2M across ['50BK', '50BR', '50FL', '50FR']
      // Evaluate all 6 gender patterns (e.g. F-M-M-F, M-M-F-F, F-M-F-M, etc.)
      const legs = ev.legs;
      const patterns = [
        ['F', 'M', 'M', 'F'],
        ['F', 'M', 'F', 'M'],
        ['M', 'M', 'F', 'F'],
        ['M', 'F', 'M', 'F'],
        ['M', 'F', 'F', 'M'],
        ['F', 'F', 'M', 'M']
      ];
      let bestCombo = null;
      let bestTime = 999999;

      for (const pat of patterns) {
        const cands = legs.map((legId, idx) =>
          (pat[idx] === 'F' ? women : men)
            .map(s => ({ s, t: getProjectedSwimTime(s, legId, options) }))
            .sort((a, b) => a.t - b.t)
            .slice(0, 4)
        );
        for (const c0 of cands[0]) {
          for (const c1 of cands[1]) {
            if (c1.s.id === c0.s.id) continue;
            for (const c2 of cands[2]) {
              if (c2.s.id === c0.s.id || c2.s.id === c1.s.id) continue;
              for (const c3 of cands[3]) {
                if (c3.s.id === c0.s.id || c3.s.id === c1.s.id || c3.s.id === c2.s.id) continue;
                const sumT = c0.t + c1.t + c2.t + c3.t;
                if (sumT < bestTime) {
                  bestTime = sumT;
                  bestCombo = [c0.s, c1.s, c2.s, c3.s];
                }
              }
            }
          }
        }
      }
      return bestCombo || [women[0], men[0], men[1], women[1]];
    }
  }
}

// --- 12. DUAL MEET & CHAMPIONSHIP LINEUP BUILDER ---
function getSwimmerEntrySeedTime(swimmer, eventId) {
  if (swimmer.seasonBests && swimmer.seasonBests[eventId]) {
    const sb = swimmer.seasonBests[eventId];
    return typeof sb === 'number' ? sb : sb.time;
  }
  if (swimmer.pbs && swimmer.pbs[eventId]) {
    const pb = swimmer.pbs[eventId];
    return typeof pb === 'number' ? pb : pb.time;
  }
  if (swimmer.enteringBests && swimmer.enteringBests[eventId]) {
    return swimmer.enteringBests[eventId];
  }
  return Math.round(getTaperedBaseTime(swimmer, eventId) * 1.023 * 100) / 100;
}

function getDualMeetEventList(cardType, week) {
  const baseCard = cardType === 'distance' ? DUAL_CARD_DISTANCE : DUAL_CARD_STANDARD;
  const womenFirst = (week % 2) === 1;
  const mixedRelayId = (week % 2) === 1 ? '200MXMR' : '200MXFRR';
  const order = [];
  let raceNum = 1;

  for (const token of baseCard) {
    if (token === 'MIXED_RELAY') {
      order.push({
        raceNumber: raceNum++,
        eventId: mixedRelayId,
        gender: 'X',
        isRelay: true,
        isMixed: true
      });
    } else {
      const ev = EVENT_MAP[token];
      const isRel = RELAY_EVENTS.some(r => r.id === token);
      const genders = womenFirst ? ['F', 'M'] : ['M', 'F'];
      for (const g of genders) {
        order.push({
          raceNumber: raceNum++,
          eventId: token,
          gender: g,
          isRelay: isRel,
          isMixed: false,
          name: `${g === 'F' ? "Women's" : "Men's"} ${ev.name}`
        });
      }
    }
  }
  return order;
}

// Build an intelligent, legal dual-meet lineup for a team (blind to opponent's actual lineup, using opponent's season/entering bests)
function buildAutoDualLineup(team, opponent, cardType, week, options = {}) {
  const baseCard = cardType === 'distance' ? DUAL_CARD_DISTANCE : DUAL_CARD_STANDARD;
  const mixedRelayId = (week % 2) === 1 ? '200MXMR' : '200MXFRR';
  const indEventIds = baseCard.filter(id => id !== 'MIXED_RELAY' && !RELAY_EVENTS.some(r => r.id === id));

  const lineup = {
    individual: { F: {}, M: {} }, // { [eventId]: [swimmerId1, swimmerId2, swimmerId3?] }
    relays: {
      F: { '200MR': { A: [], B: [] }, '400FRR': { A: [], B: [] } },
      M: { '200MR': { A: [], B: [] }, '400FRR': { A: [], B: [] } },
      X: { [mixedRelayId]: { A: [], B: [] } }
    }
  };

  const indCount = {};
  const totalCount = {};
  const enteredEventsBySwimmer = {}; // track event indices for back-to-back avoidance

  for (const s of team.roster) {
    indCount[s.id] = 0;
    totalCount[s.id] = 0;
    enteredEventsBySwimmer[s.id] = [];
  }

  const canAddInd = (s, evId) =>
    !s.injury &&
    indCount[s.id] < 3 &&
    totalCount[s.id] < 4 &&
    !(lineup.individual[s.gender][evId] || []).includes(s.id);

  const canAddRelay = (s) => !s.injury && totalCount[s.id] < 4;

  // Estimate opponent's top 2 times in each individual event from their roster's known bests
  const oppTopTimes = { F: {}, M: {} };
  if (opponent) {
    for (const g of ['F', 'M']) {
      const oppPool = opponent.roster.filter(s => s.gender === g && !s.injury);
      for (const evId of indEventIds) {
        const times = oppPool.map(s => getSwimmerEntrySeedTime(s, evId)).sort((a, b) => a - b);
        oppTopTimes[g][evId] = [times[0] || 999, times[1] || 999, times[2] || 999];
      }
    }
  }

  // 1. Pick A Relays first (200MR, 400FRR for F & M, plus Mixed Relay A)
  for (const g of ['F', 'M']) {
    for (const relId of ['200MR', '400FRR']) {
      const aSwimmers = pickBestRelaySwimmers(team, relId, g, new Set(), options);
      lineup.relays[g][relId].A = aSwimmers.map(s => s.id);
      for (const s of aSwimmers) {
        totalCount[s.id]++;
      }
    }
  }
  const mixASwimmers = pickBestRelaySwimmers(team, mixedRelayId, 'X', new Set(), options);
  lineup.relays.X[mixedRelayId].A = mixASwimmers.map(s => s.id);
  for (const s of mixASwimmers) {
    totalCount[s.id]++;
  }

  // 2. Assign Individual Events for each gender
  for (const g of ['F', 'M']) {
    const pool = team.roster.filter(s => s.gender === g && !s.injury);
    for (const evId of indEventIds) {
      lineup.individual[g][evId] = [];
    }

    // Pass 2A: Guarantee at least 2 strong entries in every individual event (24 swims)
    // Order events by scarcity of specialists (1650/1000, 400IM/200IM, 200FL, 200BR, 200BK first)
    const priorityOrder = indEventIds.slice().sort((a, b) => {
      const scoreEv = (id) => {
        if (id === '1650FR' || id === '1000FR') return 1;
        if (id === '400IM' || id === '200IM') return 2;
        if (id.startsWith('200') && id !== '200FR') return 3;
        if (id === '500FR') return 4;
        return 5;
      };
      return scoreEv(a) - scoreEv(b);
    });

    for (let slotNum = 0; slotNum < 2; slotNum++) {
      for (const evId of priorityOrder) {
        const evIdx = baseCard.indexOf(evId);
        const oppTimes = oppTopTimes[g][evId] || [999, 999, 999];

        // Score each available swimmer by projected time vs benchmark + tactical swing vs opponent's #1/#2
        const candidates = pool
          .filter(s => canAddInd(s, evId))
          .map(s => {
            const hasAdjacent = enteredEventsBySwimmer[s.id].some(idx => Math.abs(idx - evIdx) <= 1);
            const proj = getProjectedSwimTime(s, evId, {
              ...options,
              priorSwims: totalCount[s.id],
              isBackToBack: hasAdjacent
            });
            const bm = EVENT_MAP[evId].bm[g];
            const relOffset = (proj - bm) / bm;

            // Bonus if this swimmer is close to beating opponent's #1 or #2 entry (swing race!)
            let swingBonus = 0;
            const diffOpp1 = (proj - oppTimes[0]) / bm;
            if (diffOpp1 > -0.012 && diffOpp1 < 0.008) swingBonus -= 0.006;
            const diffOpp2 = (proj - oppTimes[1]) / bm;
            if (diffOpp2 > -0.010 && diffOpp2 < 0.008) swingBonus -= 0.003;

            // Slight load-balancing penalty so one swimmer doesn't take 3 events before teammates have 1
            const loadPen = indCount[s.id] * 0.0055 + (hasAdjacent ? 0.006 : 0);
            return { s, score: relOffset + swingBonus + loadPen, evIdx };
          })
          .sort((a, b) => a.score - b.score);

        if (candidates.length > 0) {
          const chosen = candidates[0].s;
          lineup.individual[g][evId].push(chosen.id);
          indCount[chosen.id]++;
          totalCount[chosen.id]++;
          enteredEventsBySwimmer[chosen.id].push(evIdx);
        }
      }
    }

    // Pass 2B: Add 3rd entries in up to 10 individual events where our #3 has best scoring/depth value
    const thirdCandidates = [];
    for (const evId of indEventIds) {
      const evIdx = baseCard.indexOf(evId);
      const bm = EVENT_MAP[evId].bm[g];
      const oppTimes = oppTopTimes[g][evId] || [999, 999, 999];

      const avail = pool
        .filter(s => canAddInd(s, evId))
        .map(s => {
          const hasAdjacent = enteredEventsBySwimmer[s.id].some(idx => Math.abs(idx - evIdx) <= 1);
          const proj = getProjectedSwimTime(s, evId, {
            ...options,
            priorSwims: totalCount[s.id],
            isBackToBack: hasAdjacent
          });
          const relOffset = (proj - bm) / bm;
          const beatsOpp3 = proj < oppTimes[2] ? -0.005 : 0;
          return { s, evId, evIdx, score: relOffset + beatsOpp3 + (hasAdjacent ? 0.008 : 0) };
        })
        .sort((a, b) => a.score - b.score);

      if (avail.length > 0) {
        thirdCandidates.push(avail[0]);
      }
    }

    thirdCandidates.sort((a, b) => a.score - b.score);
    let addedThirds = 0;
    for (const tc of thirdCandidates) {
      if (addedThirds >= 10) break;
      // Re-verify swimmer still has capacity
      const evId = tc.evId;
      const evIdx = tc.evIdx;
      const availNow = pool
        .filter(s => canAddInd(s, evId))
        .sort((a, b) => getProjectedSwimTime(a, evId, options) - getProjectedSwimTime(b, evId, options));
      if (availNow.length > 0 && lineup.individual[g][evId].length < 3) {
        const chosen = availNow[0];
        lineup.individual[g][evId].push(chosen.id);
        indCount[chosen.id]++;
        totalCount[chosen.id]++;
        enteredEventsBySwimmer[chosen.id].push(evIdx);
        addedThirds++;
      }
    }

    // 3. Assign B Relays (200MR B and 400FRR B) from swimmers with < 4 total swims
    for (const relId of ['200MR', '400FRR']) {
      const aIds = new Set(lineup.relays[g][relId].A);
      // Exclude anyone already on A relay of this event OR anyone at 4 swims
      const excluded = new Set(
        team.roster.filter(s => s.gender === g && (aIds.has(s.id) || !canAddRelay(s))).map(s => s.id)
      );
      const bSwimmers = pickBestRelaySwimmers(team, relId, g, excluded, options);
      if (bSwimmers.length === 4) {
        lineup.relays[g][relId].B = bSwimmers.map(s => s.id);
        for (const s of bSwimmers) {
          totalCount[s.id]++;
        }
      }
    }
  }

  // 4. Assign Mixed B Relay if 2F + 2M still have < 4 total swims
  const mixAIds = new Set(lineup.relays.X[mixedRelayId].A);
  const mixExcluded = new Set(
    team.roster.filter(s => mixAIds.has(s.id) || !canAddRelay(s)).map(s => s.id)
  );
  const mixBSwimmers = pickBestRelaySwimmers(team, mixedRelayId, 'X', mixExcluded, options);
  if (mixBSwimmers.length === 4) {
    lineup.relays.X[mixedRelayId].B = mixBSwimmers.map(s => s.id);
    for (const s of mixBSwimmers) {
      totalCount[s.id]++;
    }
  }

  return lineup;
}

function assignSmoothExpectedPoints(entries, ptsTable, relScale = 0.0085) {
  entries.sort((a, b) => a.time - b.time);
  const n = entries.length;
  const pts = entries.map((_, i) => ptsTable[i] || 0);
  // Smooth adjacent place swaps by time proximity relative to pre-meet & race-day variance
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 0; i < n - 1; i++) {
      const dt = Math.max(0, entries[i + 1].time - entries[i].time);
      const scale = Math.max(0.05, entries[i].time * relScale);
      const pSwap = 1 / (1 + Math.exp(dt / scale)); // 0.5 when tied, -> 0 when far apart
      const diff = (pts[i] - pts[i + 1]) * pSwap * 0.72;
      pts[i] -= diff;
      pts[i + 1] += diff;
    }
  }
  return pts;
}

// Project a dual meet score between two lineups using season/entering bests (or current state)
function projectDualMeetScore(homeTeam, awayTeam, homeLineup, awayLineup, cardType, week, useKnownBests = false) {
  const order = getDualMeetEventList(cardType, week);
  let homePts = 0;
  let awayPts = 0;

  const homeMap = new Map(homeTeam.roster.map(s => [s.id, s]));
  const awayMap = new Map(awayTeam.roster.map(s => [s.id, s]));

  const priorSwims = {};
  const lastRaceNum = {};

  const getTime = (sw, evId, isHome) => {
    const pSwims = priorSwims[sw.id] || 0;
    if (useKnownBests) {
      const seedT = getSwimmerEntrySeedTime(sw, evId);
      const durFactor = 1.15 - (sw.durability || 75) / 200;
      const doubleMod = pSwims * 0.0022 * durFactor;
      const homeMod = isHome ? -0.0016 : 0;
      return seedT * (1 + doubleMod + homeMod);
    }
    return getProjectedSwimTime(sw, evId, { priorSwims: pSwims, isHome });
  };

  for (const item of order) {
    if (!item.isRelay) {
      const hIds = (homeLineup.individual[item.gender]?.[item.eventId]) || [];
      const aIds = (awayLineup.individual[item.gender]?.[item.eventId]) || [];
      const entries = [];
      for (const id of hIds) {
        const sw = homeMap.get(id);
        if (sw) {
          entries.push({ teamId: homeTeam.id, time: getTime(sw, item.eventId, true) });
          priorSwims[sw.id] = (priorSwims[sw.id] || 0) + 1;
          lastRaceNum[sw.id] = item.raceNumber;
        }
      }
      for (const id of aIds) {
        const sw = awayMap.get(id);
        if (sw) {
          entries.push({ teamId: awayTeam.id, time: getTime(sw, item.eventId, false) });
          priorSwims[sw.id] = (priorSwims[sw.id] || 0) + 1;
          lastRaceNum[sw.id] = item.raceNumber;
        }
      }
      const expPts = assignSmoothExpectedPoints(entries, [9, 4, 3, 2, 1, 0], 0.0095);
      for (let i = 0; i < entries.length; i++) {
        if (entries[i].teamId === homeTeam.id) homePts += expPts[i];
        else awayPts += expPts[i];
      }
    } else {
      const ev = EVENT_MAP[item.eventId];
      const gKey = item.isMixed ? 'X' : item.gender;
      const hRel = homeLineup.relays[gKey]?.[item.eventId] || { A: [], B: [] };
      const aRel = awayLineup.relays[gKey]?.[item.eventId] || { A: [], B: [] };
      const entries = [];

      for (const [teamObj, mapObj, relObj, isHome] of [
        [homeTeam, homeMap, hRel, true],
        [awayTeam, awayMap, aRel, false]
      ]) {
        for (const tag of ['A', 'B']) {
          const ids = relObj[tag] || [];
          if (ids.length === 4) {
            let sum = 0;
            for (let i = 0; i < 4; i++) {
              const sw = mapObj.get(ids[i]);
              if (sw) {
                sum += getTime(sw, ev.legs[i], isHome) - (i > 0 ? 0.48 : 0);
                priorSwims[sw.id] = (priorSwims[sw.id] || 0) + 1;
              }
            }
            entries.push({ teamId: teamObj.id, tag, time: sum });
          }
        }
      }
      const expRPts = assignSmoothExpectedPoints(entries, [11, 4, 2, 0], 0.0085);
      for (let i = 0; i < entries.length; i++) {
        if (entries[i].teamId === homeTeam.id) homePts += expRPts[i];
        else awayPts += expRPts[i];
      }
    }
  }

  return { homeProjected: round2(homePts), awayProjected: round2(awayPts) };
}


// ============================================================================
// SECTION 13: LINEUP VALIDATION, OFFICIAL RECORDS & MEET SIMULATION
// ============================================================================

function validateDualLineup(team, lineup, cardType, week) {
  const baseCard = cardType === 'distance' ? DUAL_CARD_DISTANCE : DUAL_CARD_STANDARD;
  const mixedRelayId = (week % 2) === 1 ? '200MXMR' : '200MXFRR';
  const indEventIds = baseCard.filter(id => id !== 'MIXED_RELAY' && !RELAY_EVENTS.some(r => r.id === id));
  const rosterMap = new Map(team.roster.map(s => [s.id, s]));

  const indCount = {};
  const totalCount = {};
  const errors = [];

  for (const g of ['F', 'M']) {
    for (const evId of indEventIds) {
      const ids = lineup.individual?.[g]?.[evId] || [];
      if (ids.length > 3) errors.push(`${team.abbr} ${g} ${evId} has >3 entries`);
      const seen = new Set();
      for (const id of ids) {
        if (seen.has(id)) errors.push(`Duplicate swimmer ${id} in ${evId}`);
        seen.add(id);
        const sw = rosterMap.get(id);
        if (!sw) errors.push(`Unknown swimmer ${id} in ${evId}`);
        else if (sw.gender !== g) errors.push(`Wrong gender for ${sw.name} in ${g} ${evId}`);
        else if (sw.injury) errors.push(`Injured swimmer ${sw.name} entered in ${evId}`);
        indCount[id] = (indCount[id] || 0) + 1;
        totalCount[id] = (totalCount[id] || 0) + 1;
      }
    }

    for (const relId of ['200MR', '400FRR']) {
      const relObj = lineup.relays?.[g]?.[relId] || { A: [], B: [] };
      const inThisRelayEvent = new Set();
      for (const tag of ['A', 'B']) {
        const ids = relObj[tag] || [];
        if (ids.length !== 0 && ids.length !== 4) {
          errors.push(`${team.abbr} ${g} ${relId} ${tag} has ${ids.length} swimmers`);
        }
        for (const id of ids) {
          if (inThisRelayEvent.has(id)) errors.push(`Swimmer ${id} on both A & B of ${g} ${relId}`);
          inThisRelayEvent.add(id);
          const sw = rosterMap.get(id);
          if (!sw) errors.push(`Unknown swimmer ${id} in ${g} ${relId}`);
          else if (sw.gender !== g) errors.push(`Wrong gender in ${g} ${relId}`);
          else if (sw.injury) errors.push(`Injured swimmer ${sw.name} in ${g} ${relId}`);
          totalCount[id] = (totalCount[id] || 0) + 1;
        }
      }
    }
  }

  // Mixed relay validation (2F + 2M per entered relay)
  const mixObj = lineup.relays?.X?.[mixedRelayId] || { A: [], B: [] };
  const inMixEvent = new Set();
  for (const tag of ['A', 'B']) {
    const ids = mixObj[tag] || [];
    if (ids.length !== 0 && ids.length !== 4) {
      errors.push(`${team.abbr} X ${mixedRelayId} ${tag} has ${ids.length} swimmers`);
    }
    if (ids.length === 4) {
      let fCnt = 0, mCnt = 0;
      for (const id of ids) {
        if (inMixEvent.has(id)) errors.push(`Swimmer ${id} on both A & B of ${mixedRelayId}`);
        inMixEvent.add(id);
        const sw = rosterMap.get(id);
        if (!sw) errors.push(`Unknown swimmer ${id} in ${mixedRelayId}`);
        else {
          if (sw.gender === 'F') fCnt++;
          if (sw.gender === 'M') mCnt++;
          if (sw.injury) errors.push(`Injured swimmer ${sw.name} in ${mixedRelayId}`);
        }
        totalCount[id] = (totalCount[id] || 0) + 1;
      }
      if (fCnt !== 2 || mCnt !== 2) {
        errors.push(`${team.abbr} ${mixedRelayId} ${tag} must have 2F & 2M (got ${fCnt}F/${mCnt}M)`);
      }
    }
  }

  for (const [id, c] of Object.entries(indCount)) {
    if (c > 3) errors.push(`Swimmer ${id} has ${c} individual events (max 3)`);
  }
  for (const [id, c] of Object.entries(totalCount)) {
    if (c > 4) errors.push(`Swimmer ${id} has ${c} total swims in dual meet (max 4)`);
  }

  return { valid: errors.length === 0, errors };
}

function round2(val) {
  return Math.round(val * 100) / 100;
}

function recordOfficialSwim(league, team, swimmer, eventId, time, week, meetLabel = '') {
  if (!EVENT_MAP[eventId] || EVENT_MAP[eventId].legs) return; // only 14 standard individual events
  const g = swimmer.gender;
  const rounded = round2(time);

  // Track in verification log if enabled
  if (league.swimLog) {
    league.swimLog.add(`${swimmer.id}:${eventId}:${rounded.toFixed(2)}`);
  }

  // Track swims under all-time benchmark
  const allTimeMark = EVENT_MAP[eventId].allTime?.[g];
  if (allTimeMark && rounded <= allTimeMark) {
    if (league.seasonStats) {
      league.seasonStats.swimsUnderAllTime = (league.seasonStats.swimsUnderAllTime || 0) + 1;
    }
  }

  // 1. Season best
  const curSB = swimmer.seasonBests[eventId];
  const curSBTime = typeof curSB === 'number' ? curSB : curSB?.time;
  if (!curSBTime || rounded < curSBTime) {
    swimmer.seasonBests[eventId] = rounded;
  }

  // 2. Personal best
  const curPB = swimmer.pbs[eventId];
  const curPBTime = typeof curPB === 'number' ? curPB : curPB?.time;
  if (!curPBTime || rounded < curPBTime) {
    swimmer.pbs[eventId] = rounded;
    const sigEvs = getSwimmerSignatureEvents(swimmer);
    if (sigEvs.slice(0, 2).includes(eventId)) {
      if (!swimmer.pbHistory[eventId]) swimmer.pbHistory[eventId] = [];
      swimmer.pbHistory[eventId].push({
        year: league.seasonYear,
        age: swimmer.age,
        time: rounded
      });
      if (swimmer.pbHistory[eventId].length > 3) {
        swimmer.pbHistory[eventId] = [
          swimmer.pbHistory[eventId][0],
          ...swimmer.pbHistory[eventId].slice(-2)
        ];
      }
    }
  }

  // 3. Team record
  if (!team.records) team.records = { F: {}, M: {} };
  const curTeamRec = team.records[g][eventId];
  if (!curTeamRec || rounded < curTeamRec.time) {
    team.records[g][eventId] = {
      time: rounded,
      swimmerId: swimmer.id,
      swimmerName: swimmer.name,
      teamId: team.id,
      teamAbbr: team.abbr,
      year: league.seasonYear,
      week
    };
  }

  // 4. League record
  if (!league.records) league.records = { F: {}, M: {} };
  const curLeagueRec = league.records[g][eventId];
  if (!curLeagueRec || rounded < curLeagueRec.time) {
    const isNewAfterInit = curLeagueRec && !league.isInitializingRecords;
    league.records[g][eventId] = {
      time: rounded,
      swimmerId: swimmer.id,
      swimmerName: swimmer.name,
      teamId: team.id,
      teamAbbr: team.abbr,
      year: league.seasonYear,
      week
    };
    if (isNewAfterInit && league.seasonStats) {
      if (!league.seasonStats.brokenEventsMap) league.seasonStats.brokenEventsMap = {};
      const evKey = `${g}_${eventId}`;
      if (!league.seasonStats.brokenEventsMap[evKey]) {
        league.seasonStats.brokenEventsMap[evKey] = true;
        league.seasonStats.recordsBroken = (league.seasonStats.recordsBroken || 0) + 1;
      }
      if (league.news) {
        league.news.unshift({
          year: league.seasonYear,
          week,
          type: 'record',
          headline: `${swimmer.name} (${team.abbr}) shatters League Record in ${g === 'F' ? "Women's" : "Men's"} ${EVENT_MAP[eventId].name} with a ${formatTime(rounded)}!`
        });
        if (league.news.length > 120) league.news.pop();
      }
    }
  }

  // 5. All-Time Top 10 Performers list
  if (!league.top10) league.top10 = { F: {}, M: {} };
  if (!league.top10[g][eventId]) league.top10[g][eventId] = [];
  const list = league.top10[g][eventId];
  const existingIdx = list.findIndex(item => item.swimmerId === swimmer.id);
  if (existingIdx >= 0) {
    if (rounded < list[existingIdx].time) {
      list[existingIdx] = {
        time: rounded,
        swimmerId: swimmer.id,
        swimmerName: swimmer.name,
        teamId: team.id,
        teamAbbr: team.abbr,
        year: league.seasonYear,
        week
      };
      list.sort((a, b) => a.time - b.time);
    }
  } else if (list.length < 10 || rounded < list[list.length - 1].time) {
    list.push({
      time: rounded,
      swimmerId: swimmer.id,
      swimmerName: swimmer.name,
      teamId: team.id,
      teamAbbr: team.abbr,
      year: league.seasonYear,
      week
    });
    list.sort((a, b) => a.time - b.time);
    if (list.length > 10) list.length = 10;
  }
}

function recordOfficialRelaySwim(league, team, genderKey, eventId, time, legSwimmers, week) {
  const rounded = round2(time);
  if (league.swimLog) {
    league.swimLog.add(`RELAY:${team.id}:${genderKey}:${eventId}:${rounded.toFixed(2)}`);
  }

  if (!team.relayRecords) team.relayRecords = { F: {}, M: {}, X: {} };
  const curTeamRec = team.relayRecords[genderKey][eventId];
  const names = legSwimmers.map(s => s.lastName).join(', ');

  if (!curTeamRec || rounded < curTeamRec.time) {
    team.relayRecords[genderKey][eventId] = {
      time: rounded,
      swimmerNames: names,
      swimmerIds: legSwimmers.map(s => s.id),
      teamId: team.id,
      teamAbbr: team.abbr,
      year: league.seasonYear,
      week
    };
  }

  if (!league.relayRecords) league.relayRecords = { F: {}, M: {}, X: {} };
  const curLeagueRec = league.relayRecords[genderKey][eventId];
  if (!curLeagueRec || rounded < curLeagueRec.time) {
    const isNewAfterInit = curLeagueRec && !league.isInitializingRecords;
    league.relayRecords[genderKey][eventId] = {
      time: rounded,
      swimmerNames: names,
      swimmerIds: legSwimmers.map(s => s.id),
      teamId: team.id,
      teamAbbr: team.abbr,
      year: league.seasonYear,
      week
    };
    if (isNewAfterInit && league.seasonStats) {
      league.seasonStats.relayRecordsBroken = (league.seasonStats.relayRecordsBroken || 0) + 1;
    }
  }
}

// Helper to score a sorted list of race finishers with tie-splitting
function scoreRaceEntries(entries, pointsTable) {
  // Separate non-DQ and DQ entries
  const valid = entries.filter(e => !e.dq).sort((a, b) => a.time - b.time);
  const dqs = entries.filter(e => e.dq);

  let idx = 0;
  while (idx < valid.length) {
    let endIdx = idx + 1;
    while (endIdx < valid.length && Math.abs(valid[endIdx].time - valid[idx].time) < 0.001) {
      endIdx++;
    }
    const tiedCount = endIdx - idx;
    let ptsSum = 0;
    for (let k = idx; k < endIdx; k++) {
      ptsSum += (pointsTable[k] || 0);
    }
    const eachPts = ptsSum / tiedCount;
    const placeNum = idx + 1;
    for (let k = idx; k < endIdx; k++) {
      valid[k].place = placeNum;
      valid[k].tied = tiedCount > 1;
      valid[k].points = eachPts;
    }
    idx = endIdx;
  }

  for (const d of dqs) {
    d.place = null;
    d.tied = false;
    d.points = 0;
  }

  return [...valid, ...dqs];
}

// Simulate a full Dual Meet between homeTeam and awayTeam
function simulateDualMeet(league, homeTeam, awayTeam, cardType, week, options = {}) {
  const isPlayoff = !!options.isPlayoff;
  const homeLineup = options.homeLineup || buildAutoDualLineup(homeTeam, awayTeam, cardType, week, { isHome: true, isChampionship: isPlayoff });
  const awayLineup = options.awayLineup || buildAutoDualLineup(awayTeam, homeTeam, cardType, week, { isHome: false, isChampionship: isPlayoff });

  // Pre-meet projection using known entering bests (for favorite tracking & UI display)
  const projKnown = projectDualMeetScore(homeTeam, awayTeam, homeLineup, awayLineup, cardType, week, true);
  const projActual = projectDualMeetScore(homeTeam, awayTeam, homeLineup, awayLineup, cardType, week, false);

  const eventOrder = getDualMeetEventList(cardType, week);
  const homeMap = new Map(homeTeam.roster.map(s => [s.id, s]));
  const awayMap = new Map(awayTeam.roster.map(s => [s.id, s]));

  const priorSwims = {};
  const lastRaceBySwimmer = {};

  let homeScore = 0;
  let awayScore = 0;
  let homeScoreBeforeLast = 0;
  let awayScoreBeforeLast = 0;
  const eventResults = [];

  // Home even lanes (4, 2, 6), Away odd lanes (3, 5, 1)
  const homeIndLanes = [4, 2, 6];
  const awayIndLanes = [3, 5, 1];
  const homeRelayLanes = { A: 4, B: 2 };
  const awayRelayLanes = { A: 3, B: 5 };

  for (let eIdx = 0; eIdx < eventOrder.length; eIdx++) {
    const item = eventOrder[eIdx];
    const isLastEvent = eIdx === eventOrder.length - 1;
    if (isLastEvent) {
      homeScoreBeforeLast = homeScore;
      awayScoreBeforeLast = awayScore;
    }

    if (!item.isRelay) {
      const hIds = (homeLineup.individual[item.gender]?.[item.eventId] || []).slice(0, 3);
      const aIds = (awayLineup.individual[item.gender]?.[item.eventId] || []).slice(0, 3);

      // Sort each team's entries by seed time so fastest gets center lane (4 or 3)
      const hSwimmers = hIds.map(id => homeMap.get(id)).filter(Boolean)
        .sort((a, b) => getSwimmerEntrySeedTime(a, item.eventId) - getSwimmerEntrySeedTime(b, item.eventId));
      const aSwimmers = aIds.map(id => awayMap.get(id)).filter(Boolean)
        .sort((a, b) => getSwimmerEntrySeedTime(a, item.eventId) - getSwimmerEntrySeedTime(b, item.eventId));

      const raceEntries = [];

      for (let i = 0; i < hSwimmers.length; i++) {
        const sw = hSwimmers[i];
        const pSwims = priorSwims[sw.id] || 0;
        const isB2B = lastRaceBySwimmer[sw.id] !== undefined && (item.raceNumber - lastRaceBySwimmer[sw.id]) <= 2;
        const sim = simulateIndividualSwim(league, sw, item.eventId, {
          priorSwims: pSwims,
          isBackToBack: isB2B,
          isHome: true,
          isChampionship: isPlayoff
        });
        priorSwims[sw.id] = pSwims + 1;
        lastRaceBySwimmer[sw.id] = item.raceNumber;
        recordOfficialSwim(league, homeTeam, sw, item.eventId, sim.time, week);

        raceEntries.push({
          lane: homeIndLanes[i],
          teamId: homeTeam.id,
          teamAbbr: homeTeam.abbr,
          swimmerId: sw.id,
          swimmerName: sw.name,
          seedTime: round2(getSwimmerEntrySeedTime(sw, item.eventId)),
          time: sim.time,
          splits: sim.splits,
          dq: false
        });
      }

      for (let i = 0; i < aSwimmers.length; i++) {
        const sw = aSwimmers[i];
        const pSwims = priorSwims[sw.id] || 0;
        const isB2B = lastRaceBySwimmer[sw.id] !== undefined && (item.raceNumber - lastRaceBySwimmer[sw.id]) <= 2;
        const sim = simulateIndividualSwim(league, sw, item.eventId, {
          priorSwims: pSwims,
          isBackToBack: isB2B,
          isHome: false,
          isChampionship: isPlayoff
        });
        priorSwims[sw.id] = pSwims + 1;
        lastRaceBySwimmer[sw.id] = item.raceNumber;
        recordOfficialSwim(league, awayTeam, sw, item.eventId, sim.time, week);

        raceEntries.push({
          lane: awayIndLanes[i],
          teamId: awayTeam.id,
          teamAbbr: awayTeam.abbr,
          swimmerId: sw.id,
          swimmerName: sw.name,
          seedTime: round2(getSwimmerEntrySeedTime(sw, item.eventId)),
          time: sim.time,
          splits: sim.splits,
          dq: false
        });
      }

      const scored = scoreRaceEntries(raceEntries, [9, 4, 3, 2, 1, 0]);
      let evHomePts = 0;
      let evAwayPts = 0;
      for (const ent of scored) {
        if (ent.teamId === homeTeam.id) evHomePts += ent.points;
        else evAwayPts += ent.points;
      }
      homeScore += evHomePts;
      awayScore += evAwayPts;

      eventResults.push({
        raceNumber: item.raceNumber,
        eventId: item.eventId,
        gender: item.gender,
        label: item.label,
        isRelay: false,
        entries: scored,
        homePoints: evHomePts,
        awayPoints: evAwayPts,
        runningHomeScore: homeScore,
        runningAwayScore: awayScore
      });
    } else {
      // Relay event
      const gKey = item.isMixed ? 'X' : item.gender;
      const hRelObj = homeLineup.relays[gKey]?.[item.eventId] || { A: [], B: [] };
      const aRelObj = awayLineup.relays[gKey]?.[item.eventId] || { A: [], B: [] };
      const evDef = EVENT_MAP[item.eventId];
      const raceEntries = [];

      const runTeamRelays = (teamObj, mapObj, relObj, lanesMap, isHome) => {
        for (const tag of ['A', 'B']) {
          const ids = relObj[tag] || [];
          if (ids.length === 4) {
            const legSwimmers = ids.map(id => mapObj.get(id)).filter(Boolean);
            if (legSwimmers.length === 4) {
              const sim = simulateRelaySwim(league, item.eventId, legSwimmers, {
                priorSwimsBySwimmer: priorSwims,
                isHome,
                isBigMeet: isPlayoff
              });
              for (const sw of legSwimmers) {
                priorSwims[sw.id] = (priorSwims[sw.id] || 0) + 1;
                lastRaceBySwimmer[sw.id] = item.raceNumber;
              }
              // Lead-off leg counts as an official flat-start time if it's a standard individual event (e.g. 100FR in 400FRR, 50FR in 200MXFRR)
              if (sim.leadoffOfficial) {
                recordOfficialSwim(league, teamObj, legSwimmers[0], sim.leadoffOfficial.eventId, sim.leadoffOfficial.time, week);
              }
              if (!sim.dq) {
                recordOfficialRelaySwim(league, teamObj, gKey, item.eventId, sim.time, legSwimmers, week);
              }

              raceEntries.push({
                lane: lanesMap[tag],
                teamId: teamObj.id,
                teamAbbr: teamObj.abbr,
                relayTag: tag,
                swimmerIds: legSwimmers.map(s => s.id),
                swimmerNames: legSwimmers.map(s => s.name),
                legTimes: sim.legTimes,
                legSplits: sim.legSplits,
                reactionTimes: sim.reactionTimes,
                time: sim.time,
                dq: sim.dq,
                dqLeg: sim.dqLeg
              });
            }
          }
        }
      };

      runTeamRelays(homeTeam, homeMap, hRelObj, homeRelayLanes, true);
      runTeamRelays(awayTeam, awayMap, aRelObj, awayRelayLanes, false);

      const scored = scoreRaceEntries(raceEntries, [11, 4, 2, 0]);
      let evHomePts = 0;
      let evAwayPts = 0;
      for (const ent of scored) {
        if (ent.teamId === homeTeam.id) evHomePts += ent.points;
        else evAwayPts += ent.points;
      }

      // Check dual-meet tiebreaker rule on the final relay:
      // "A dual meet can't end level: if the score is tied after the last event, the team that won the last relay takes the meet."
      let tiebreakerApplied = false;
      if (isLastEvent && Math.abs((homeScore + evHomePts) - (awayScore + evAwayPts)) < 0.001) {
        const relayWinner = scored.find(e => e.place === 1);
        if (relayWinner) {
          relayWinner.points += 1;
          if (relayWinner.teamId === homeTeam.id) evHomePts += 1;
          else evAwayPts += 1;
          tiebreakerApplied = true;
        }
      }

      homeScore += evHomePts;
      awayScore += evAwayPts;

      eventResults.push({
        raceNumber: item.raceNumber,
        eventId: item.eventId,
        gender: item.gender,
        isMixed: item.isMixed,
        label: item.label,
        isRelay: true,
        tiebreakerApplied,
        entries: scored,
        homePoints: evHomePts,
        awayPoints: evAwayPts,
        runningHomeScore: homeScore,
        runningAwayScore: awayScore
      });
    }
  }

  // A dual meet is realistically open going into the final 400 Free Relay when within 9 points (1st+3rd = 13 vs 2nd = 4)
  const openEnteringLastRelay = Math.abs(homeScoreBeforeLast - awayScoreBeforeLast) <= 9;
  const winnerId = homeScore > awayScore ? homeTeam.id : awayTeam.id;
  const loserId = homeScore > awayScore ? awayTeam.id : homeTeam.id;

  return {
    homeTeamId: homeTeam.id,
    awayTeamId: awayTeam.id,
    homeAbbr: homeTeam.abbr,
    awayAbbr: awayTeam.abbr,
    week,
    cardType,
    isPlayoff,
    homeProjected: projActual.homeProjected,
    awayProjected: projActual.awayProjected,
    homeKnownProjected: projKnown.homeProjected,
    awayKnownProjected: projKnown.awayProjected,
    homeScore,
    awayScore,
    homeScoreBeforeLast,
    awayScoreBeforeLast,
    openEnteringLastRelay,
    winnerId,
    loserId,
    homeLineup,
    awayLineup,
    events: eventResults
  };
}

// Build a legal 3-day Championship Final lineup for a team
// 2 swimmers per team in all 13 individual events, 1 relay per team in all 7 relays
// Max 3 individual events and 7 total swims per swimmer
function buildAutoChampionshipLineup(team, options = {}) {
  const champIndEvents = INDIVIDUAL_EVENTS.filter(e => e.id !== '1000FR').map(e => e.id);
  const genderedRelayIds = ['200MR', '400MR', '200FRR', '400FRR', '800FRR'];
  const mixedRelayIds = ['200MXMR', '200MXFRR'];

  const lineup = {
    individual: { F: {}, M: {} }, // { [eventId]: [swimmerId1, swimmerId2] }
    relays: {
      F: {},
      M: {},
      X: {}
    }
  };

  const indCount = {};
  const totalCount = {};
  for (const s of team.roster) {
    indCount[s.id] = 0;
    totalCount[s.id] = 0;
  }

  // 1. Assign 2 entries per individual event (13 events * 2 = 26 entries across 14 swimmers, max 3 per swimmer)
  const priorityOrder = champIndEvents.slice().sort((a, b) => {
    const rank = (id) => {
      if (id === '1650FR' || id === '400IM') return 1;
      if (id.startsWith('200') && id !== '200FR') return 2;
      if (id === '500FR') return 3;
      return 4;
    };
    return rank(a) - rank(b);
  });

  for (const g of ['F', 'M']) {
    const pool = team.roster.filter(s => s.gender === g && !s.injury);
    for (const evId of champIndEvents) lineup.individual[g][evId] = [];

    for (let slot = 0; slot < 2; slot++) {
      for (const evId of priorityOrder) {
        const bm = EVENT_MAP[evId].bm[g];
        const candidates = pool
          .filter(s => indCount[s.id] < 3 && totalCount[s.id] < 7 && !lineup.individual[g][evId].includes(s.id))
          .map(s => {
            const proj = getProjectedSwimTime(s, evId, { ...options, isChampionship: true });
            const rel = (proj - bm) / bm + indCount[s.id] * 0.005;
            return { s, rel };
          })
          .sort((a, b) => a.rel - b.rel);

        if (candidates.length > 0) {
          const chosen = candidates[0].s;
          lineup.individual[g][evId].push(chosen.id);
          indCount[chosen.id]++;
          totalCount[chosen.id]++;
        }
      }
    }
  }

  // 2. Assign Mixed Relays (200MXMR, 200MXFRR)
  for (const mRelId of mixedRelayIds) {
    const excl = new Set(team.roster.filter(s => s.injury || totalCount[s.id] >= 7).map(s => s.id));
    const sws = pickBestRelaySwimmers(team, mRelId, 'X', excl, { ...options, isChampionship: true });
    lineup.relays.X[mRelId] = sws.map(s => s.id);
    for (const s of sws) totalCount[s.id]++;
  }

  // 3. Assign 5 gendered relays per gender (200MR, 400MR, 200FRR, 400FRR, 800FRR)
  for (const g of ['F', 'M']) {
    for (const rId of genderedRelayIds) {
      const excl = new Set(team.roster.filter(s => s.gender === g && (s.injury || totalCount[s.id] >= 7)).map(s => s.id));
      const sws = pickBestRelaySwimmers(team, rId, g, excl, { ...options, isChampionship: true });
      lineup.relays[g][rId] = sws.map(s => s.id);
      for (const s of sws) totalCount[s.id]++;
    }
  }

  return lineup;
}

// Simulate the 3-day, 4-team Championship Final at a neutral 8-lane pool
function simulateChampionshipFinal(league, fourTeams, options = {}) {
  const lineupsByTeam = {};
  const rosterMaps = {};
  const teamScores = {};
  const dayScores = {};

  for (const t of fourTeams) {
    lineupsByTeam[t.id] = options.lineups?.[t.id] || buildAutoChampionshipLineup(t);
    rosterMaps[t.id] = new Map(t.roster.map(s => [s.id, s]));
    teamScores[t.id] = 0;
    dayScores[t.id] = [0, 0, 0];
  }

  const centerOutLanes = [4, 5, 3, 6, 2, 7, 1, 8];
  const priorDaysSwims = {};
  const daysResults = [];
  let raceNum = 1;

  for (let dIdx = 0; dIdx < FINAL_DAYS.length; dIdx++) {
    const dayDef = FINAL_DAYS[dIdx];
    const priorSwimsToday = {};
    const dayEvents = [];

    // Build day's alternating W/M event list
    const expandedDayOrder = [];
    for (const evId of dayDef.events) {
      const evObj = EVENT_MAP[evId];
      if (evObj.mixed) {
        expandedDayOrder.push({ eventId: evId, gender: 'X', isRelay: true, isMixed: true, label: evObj.name });
      } else {
        const isRel = !!evObj.legs;
        expandedDayOrder.push({ eventId: evId, gender: 'F', isRelay: isRel, isMixed: false, label: `Women's ${evObj.name}` });
        expandedDayOrder.push({ eventId: evId, gender: 'M', isRelay: isRel, isMixed: false, label: `Men's ${evObj.name}` });
      }
    }

    for (const item of expandedDayOrder) {
      if (!item.isRelay) {
        // Gather 2 swimmers from each of the 4 teams = 8 swimmers
        const rawEntries = [];
        for (const t of fourTeams) {
          const ids = (lineupsByTeam[t.id].individual[item.gender]?.[item.eventId] || []).slice(0, 2);
          for (const id of ids) {
            const sw = rosterMaps[t.id].get(id);
            if (sw) {
              rawEntries.push({
                team: t,
                swimmer: sw,
                seedTime: getSwimmerEntrySeedTime(sw, item.eventId)
              });
            }
          }
        }
        // Sort by seed time to assign lanes 4, 5, 3, 6, 2, 7, 1, 8
        rawEntries.sort((a, b) => a.seedTime - b.seedTime);

        const raceEntries = [];
        for (let i = 0; i < rawEntries.length; i++) {
          const { team, swimmer, seedTime } = rawEntries[i];
          const pToday = priorSwimsToday[swimmer.id] || 0;
          const pDays = priorDaysSwims[swimmer.id] || 0;
          const sim = simulateIndividualSwim(league, swimmer, item.eventId, {
            priorSwims: pToday + Math.floor(pDays * 0.35),
            isHome: false,
            isBigMeet: true
          });
          priorSwimsToday[swimmer.id] = pToday + 1;
          recordOfficialSwim(league, team, swimmer, item.eventId, sim.time, 17, 'Championship Final');

          raceEntries.push({
            lane: centerOutLanes[i] || (i + 1),
            teamId: team.id,
            teamAbbr: team.abbr,
            swimmerId: swimmer.id,
            swimmerName: swimmer.name,
            seedTime: round2(seedTime),
            time: sim.time,
            splits: sim.splits,
            dq: false
          });
        }

        const scored = scoreRaceEntries(raceEntries, [9, 7, 6, 5, 4, 3, 2, 1]);
        const ptsByTeam = {};
        for (const t of fourTeams) ptsByTeam[t.id] = 0;
        for (const ent of scored) {
          teamScores[ent.teamId] += ent.points;
          dayScores[ent.teamId][dIdx] += ent.points;
          ptsByTeam[ent.teamId] += ent.points;
        }

        dayEvents.push({
          raceNumber: raceNum++,
          day: dayDef.day,
          eventId: item.eventId,
          gender: item.gender,
          label: item.label,
          isRelay: false,
          entries: scored,
          pointsByTeam: ptsByTeam,
          runningScores: { ...teamScores }
        });
      } else {
        // Relay event (4 teams -> lanes 4, 5, 3, 6)
        const gKey = item.isMixed ? 'X' : item.gender;
        const evDef = EVENT_MAP[item.eventId];
        const raceEntries = [];

        for (let tIdx = 0; tIdx < fourTeams.length; tIdx++) {
          const team = fourTeams[tIdx];
          const ids = lineupsByTeam[team.id].relays[gKey]?.[item.eventId] || [];
          const legSwimmers = ids.map(id => rosterMaps[team.id].get(id)).filter(Boolean);
          if (legSwimmers.length === 4) {
            const sim = simulateRelaySwim(league, item.eventId, legSwimmers, {
              priorSwimsBySwimmer: priorSwimsToday,
              isHome: false,
              isBigMeet: true
            });
            for (const sw of legSwimmers) {
              priorSwimsToday[sw.id] = (priorSwimsToday[sw.id] || 0) + 1;
            }
            if (sim.leadoffOfficial) {
              recordOfficialSwim(league, team, legSwimmers[0], sim.leadoffOfficial.eventId, sim.leadoffOfficial.time, 17, 'Championship Final');
            }
            if (!sim.dq) {
              recordOfficialRelaySwim(league, team, gKey, item.eventId, sim.time, legSwimmers, 17);
            }

            raceEntries.push({
              lane: centerOutLanes[tIdx],
              teamId: team.id,
              teamAbbr: team.abbr,
              relayTag: 'A',
              swimmerIds: legSwimmers.map(s => s.id),
              swimmerNames: legSwimmers.map(s => s.name),
              legTimes: sim.legTimes,
              legSplits: sim.legSplits,
              reactionTimes: sim.reactionTimes,
              time: sim.time,
              dq: sim.dq,
              dqLeg: sim.dqLeg
            });
          }
        }

        const scored = scoreRaceEntries(raceEntries, [18, 14, 12, 10]);
        const ptsByTeam = {};
        for (const t of fourTeams) ptsByTeam[t.id] = 0;
        for (const ent of scored) {
          teamScores[ent.teamId] += ent.points;
          dayScores[ent.teamId][dIdx] += ent.points;
          ptsByTeam[ent.teamId] += ent.points;
        }

        dayEvents.push({
          raceNumber: raceNum++,
          day: dayDef.day,
          eventId: item.eventId,
          gender: item.gender,
          isMixed: item.isMixed,
          label: item.label,
          isRelay: true,
          entries: scored,
          pointsByTeam: ptsByTeam,
          runningScores: { ...teamScores }
        });
      }
    }

    // Carry today's swims into priorDaysSwims for subsequent days
    for (const [swId, cnt] of Object.entries(priorSwimsToday)) {
      priorDaysSwims[swId] = (priorDaysSwims[swId] || 0) + cnt;
    }

    daysResults.push({
      day: dayDef.day,
      title: dayDef.title,
      events: dayEvents
    });
  }

  const standings = fourTeams
    .map(t => ({
      teamId: t.id,
      teamName: t.name,
      teamAbbr: t.abbr,
      score: teamScores[t.id],
      dayScores: dayScores[t.id]
    }))
    .sort((a, b) => b.score - a.score);

  return {
    year: league.seasonYear,
    poolName: 'National Aquatics Center (Indianapolis)',
    standings,
    championTeamId: standings[0].teamId,
    days: daysResults,
    lineupsByTeam
  };
}
