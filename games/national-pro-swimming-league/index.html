// Generate 14-week regular season schedule:
// - 10 division meets (home & away vs all 5 division rivals)
// - 4 cross-division meets (2 home, 2 away)
// - Weeks 4, 8, 12, 13 use the Distance Card ('distance'); others use Standard Card ('standard')
function generateSeasonSchedule(rngHolder, teams) {
  const divisions = ['Heartland', 'East', 'Central', 'West'];
  const divTeams = {};
  for (const div of divisions) {
    // Shuffle order within each division each season so matchups rotate
    divTeams[div] = rngShuffle(
      rngHolder,
      teams.filter(t => t.division === div).map(t => t.id)
    );
  }

  // Circle method for a 6-team single round-robin (5 rounds, 3 games per round)
  // Round r in 0..4 gives balanced home/away; Round r+5 flips home/away
  const buildSingleRR = (ids) => {
    const rounds = [];
    const fixed = ids[0];
    let rot = ids.slice(1); // 5 elements
    for (let r = 0; r < 5; r++) {
      const pairs = [];
      if (r % 2 === 0) pairs.push([fixed, rot[0]]);
      else pairs.push([rot[0], fixed]);

      pairs.push([rot[1], rot[4]]);
      pairs.push([rot[2], rot[3]]);
      rounds.push(pairs);
      // Rotate
      rot = [rot[4], rot[0], rot[1], rot[2], rot[3]];
    }
    return rounds;
  };

  // 10 division rounds
  const divRounds = Array.from({ length: 10 }, () => []);
  for (const div of divisions) {
    const rr5 = buildSingleRR(divTeams[div]);
    for (let r = 0; r < 5; r++) {
      for (const [h, a] of rr5[r]) {
        divRounds[r].push({ homeTeamId: h, awayTeamId: a, isDivision: true });
        divRounds[r + 5].push({ homeTeamId: a, awayTeamId: h, isDivision: true });
      }
    }
  }

  // 4 cross-division rounds (strictly 2 Home and 2 Away for every team)
  const d0 = divTeams['Heartland'];
  const d1 = divTeams['East'];
  const d2 = divTeams['Central'];
  const d3 = divTeams['West'];

  const crossRounds = [[], [], [], []];
  for (let i = 0; i < 6; i++) {
    // Cross 0: D0 hosts D1, D2 hosts D3
    crossRounds[0].push({ homeTeamId: d0[i], awayTeamId: d1[i], isDivision: false });
    crossRounds[0].push({ homeTeamId: d2[i], awayTeamId: d3[i], isDivision: false });
    // Cross 1: D1 hosts D0, D3 hosts D2
    crossRounds[1].push({ homeTeamId: d1[i], awayTeamId: d0[(i + 1) % 6], isDivision: false });
    crossRounds[1].push({ homeTeamId: d3[i], awayTeamId: d2[(i + 1) % 6], isDivision: false });
    // Cross 2: D0 hosts D2, D1 hosts D3
    crossRounds[2].push({ homeTeamId: d0[i], awayTeamId: d2[(i + 2) % 6], isDivision: false });
    crossRounds[2].push({ homeTeamId: d1[i], awayTeamId: d3[(i + 2) % 6], isDivision: false });
    // Cross 3: D2 hosts D0, D3 hosts D1
    crossRounds[3].push({ homeTeamId: d2[i], awayTeamId: d0[(i + 3) % 6], isDivision: false });
    crossRounds[3].push({ homeTeamId: d3[i], awayTeamId: d1[(i + 3) % 6], isDivision: false });
  }

  // Interleave the 10 division rounds and 4 cross-division rounds across weeks 1..14
  // Cross-division weeks: 3, 6, 9, 11
  const crossWeeks = new Set([3, 6, 9, 11]);
  const schedule = [];
  let dPtr = 0;
  let cPtr = 0;

  for (let week = 1; week <= 14; week++) {
    const cardType = DISTANCE_CARD_WEEKS.includes(week) ? 'distance' : 'standard';
    const rawMatchups = crossWeeks.has(week) ? crossRounds[cPtr++] : divRounds[dPtr++];
    const matchups = rawMatchups.map((m, idx) => ({
      id: `W${week}_M${idx + 1}`,
      week,
      cardType,
      homeTeamId: m.homeTeamId,
      awayTeamId: m.awayTeamId,
      isDivision: m.isDivision,
      completed: false,
      result: null
    }));
    schedule.push({
      week,
      cardType,
      matchups
    });
  }

  return schedule;
}

// Create a replacement-level swimmer for the Free Agent / Injury Replacement pool
function createReplacementSwimmer(rngHolder, gender, slotIdx, seasonYear, usedNames) {
  const template = ROSTER_SLOT_TEMPLATES[slotIdx % ROSTER_SLOT_TEMPLATES.length];
  // Replacement level: quantile 0.72 to 0.96 (~4.5% to 5.8% behind #1)
  const rankNorm = rngRange(rngHolder, 0.72, 0.96);
  const age = rngInt(rngHolder, 21, 27);
  const sw = createSwimmer(rngHolder, {
    gender,
    template,
    age,
    rankNorm,
    teamId: null,
    usedNames,
    season: seasonYear,
    contract: { salary: 65000, years: 1 }
  });
  return sw;
}

// Ensure free agent pool always has replacement-level swimmers in every archetype & gender
function replenishFreeAgentPool(league) {
  if (!league.freeAgents) league.freeAgents = [];
  const usedNames = new Set();
  for (const t of league.teams) {
    for (const s of t.roster) usedNames.add(s.name);
    for (const s of (t.il || [])) usedNames.add(s.name);
  }
  for (const s of league.freeAgents) usedNames.add(s.name);

  for (const gender of ['F', 'M']) {
    for (let slotIdx = 0; slotIdx < ROSTER_SLOT_TEMPLATES.length; slotIdx++) {
      const tmpl = ROSTER_SLOT_TEMPLATES[slotIdx];
      const count = league.freeAgents.filter(s => s.gender === gender && s.slot === tmpl.slot).length;
      if (count < 2) {
        for (let k = count; k < 2; k++) {
          league.freeAgents.push(createReplacementSwimmer(league, gender, slotIdx, league.seasonYear, usedNames));
        }
      }
    }
  }
  // Keep free agent pool compact (at most 64 swimmers: top available per gender)
  if (league.freeAgents.length > 64) {
    const fPool = league.freeAgents.filter(s => s.gender === 'F').sort((a, b) => a.baseOffset - b.baseOffset).slice(0, 32);
    const mPool = league.freeAgents.filter(s => s.gender === 'M').sort((a, b) => a.baseOffset - b.baseOffset).slice(0, 32);
    league.freeAgents = [...fPool, ...mPool];
  }
}

// Weekly Training, Fatigue, Taper & Injury Progression
// Training modes per group ('sprint', 'mid', 'distance', 'stroke', 'im'):
//   'heavy'    -> +fitness, +fatigue, slightly higher minor injury risk
//   'balanced' -> steady fitness, moderate fatigue
//   'rest'     -> lowers fatigue ('resting' state, ~1.1% off tapered best)
//   'taper'    -> triggers a full peak ('peaked' state for 2 weeks, up to 2 full tapers per season)
function getSwimmerTrainingGroup(swimmer) {
  if (swimmer.archetype === 'sprint_free') return 'sprint';
  if (swimmer.archetype === 'mid_free') return 'mid';
  if (swimmer.archetype === 'dist_free') return 'distance';
  if (swimmer.archetype === 'im') return 'im';
  return 'stroke';
}

function decideCpuWeeklyTrainingPlan(team, week, isPlayoffContender) {
  // CPU coaches manage periodization across the 17-week season:
  // Weeks 1-7 & 9-12: Staggered heavy/balanced training blocks
  // Week 8: Mid-season Distance Card Invite (short rest)
  // Weeks 13-14: Late-season Distance Card & regular-season finale (2-week rest/taper window)
  // Weeks 15-17: Playoff & Championship Final taper
  const plan = { sprint: 'balanced', mid: 'balanced', distance: 'balanced', stroke: 'balanced', im: 'balanced' };
  const groups = ['sprint', 'mid', 'distance', 'stroke', 'im'];
  const cycle = ((team.coachRating || 80) + week) % 4;

  let mode = 'balanced';
  if (week <= 7) {
    mode = cycle === 0 ? 'heavy' : 'balanced';
  } else if (week === 8) {
    mode = 'rest'; // Mid-season Distance Card Showcase
  } else if (week >= 9 && week <= 12) {
    mode = cycle === 0 ? 'heavy' : 'balanced';
  } else if (week === 13 || week === 14) {
    mode = 'taper';
  } else if (week >= 15) {
    mode = 'taper';
  }

  for (const g of groups) {
    plan[g] = mode;
  }
  return plan;
}

function applyWeeklyTrainingAndInjuries(league, week) {
  replenishFreeAgentPool(league);

  for (const team of league.teams) {
    if (!team.il) team.il = [];

    // 1. Heal swimmers on IL and return them to active roster when healthy
    for (let i = team.il.length - 1; i >= 0; i--) {
      const injSw = team.il[i];
      if (injSw.injury) {
        injSw.injury.weeksLeft--;
        if (injSw.injury.weeksLeft <= 0) {
          injSw.injury = null;
          injSw.fatigue = 25;
          // Remove the temporary injury replacement swimmer of the same gender
          const repIdx = team.roster.findIndex(s => s.gender === injSw.gender && s.isInjuryReplacement);
          if (repIdx !== -1) {
            const removed = team.roster.splice(repIdx, 1)[0];
            removed.teamId = null;
            removed.isInjuryReplacement = false;
            league.freeAgents.push(removed);
          }
          if (team.roster.filter(s => s.gender === injSw.gender).length < 14) {
            team.roster.push(injSw);
            team.il.splice(i, 1);
          }
        }
      }
    }

    // 2. Determine weekly training plan
    const isContender = (team.wins || 0) >= Math.floor((week - 1) * 0.5);
    const plan = (team.id === league.userTeamId && team.trainingPlan)
      ? team.trainingPlan
      : decideCpuWeeklyTrainingPlan(team, week, isContender);

    // 3. Update fitness, fatigue, taperState, and check minor training injuries
    for (let i = 0; i < team.roster.length; i++) {
      const sw = team.roster[i];
      const grp = getSwimmerTrainingGroup(sw);
      const mode = plan[grp] || 'balanced';

      if (!sw.taperState) {
        sw.taperState = { status: 'training', peakWeeksLeft: 0, tapersUsed: 0 };
      }

      if (mode === 'heavy') {
        sw.fitness = Math.min(100, (sw.fitness ?? 78) + 3.5);
        sw.fatigue = Math.min(92, (sw.fatigue ?? 45) + 11);
        if (sw.taperState.status === 'peaked') sw.taperState.status = 'fading';
        else sw.taperState.status = 'training';
      } else if (mode === 'balanced') {
        sw.fitness = Math.min(98, (sw.fitness ?? 78) + 1.5);
        sw.fatigue = Math.max(38, Math.min(72, (sw.fatigue ?? 50) + 2));
        if (sw.taperState.status === 'peaked') {
          sw.taperState.peakWeeksLeft--;
          if (sw.taperState.peakWeeksLeft <= 0) sw.taperState.status = 'fading';
        } else {
          sw.taperState.status = 'training';
        }
      } else if (mode === 'rest') {
        sw.fitness = Math.max(72, (sw.fitness ?? 82) - 1.0);
        sw.fatigue = Math.max(15, (sw.fatigue ?? 50) - 26);
        if (sw.taperState.status !== 'peaked') {
          sw.taperState.status = 'resting';
        }
      } else if (mode === 'taper') {
        sw.fatigue = Math.max(5, (sw.fatigue ?? 40) - 35);
        if (sw.taperState.status === 'peaked') {
          if (sw.taperState.peakWeeksLeft > 0) {
            sw.taperState.peakWeeksLeft--;
          } else {
            sw.taperState.status = 'fading';
          }
        } else if ((sw.taperState.tapersUsed || 0) < 2 || week >= 15) {
          sw.taperState.status = 'peaked';
          sw.taperState.peakWeeksLeft = week >= 15 ? 3 : 2;
          sw.taperState.tapersUsed = (sw.taperState.tapersUsed || 0) + 1;
        } else {
          // Already used both regular-season full tapers -> short rest instead
          sw.taperState.status = 'resting';
        }
      }

      // Check training injury (only during regular season weeks 1..13, higher under heavy load & high fatigue)
      if (week <= 13 && !sw.isInjuryReplacement) {
        const dur = sw.durability || 78;
        const baseRisk = mode === 'heavy' ? 0.0045 : mode === 'balanced' ? 0.0018 : 0.0004;
        const fatMult = 1 + Math.max(0, (sw.fatigue - 55) / 45);
        const durMult = 1.35 - (dur - 60) / 80;
        const prob = baseRisk * fatMult * Math.max(0.5, durMult);

        if (nextRng(league) < prob) {
          const injuryTypes = [
            { name: 'Swimmer\'s Shoulder (Rotator Cuff Tendinitis)', weeks: rngInt(league, 2, 3) },
            { name: 'MCL Breaststroker\'s Knee Strain', weeks: rngInt(league, 2, 4) },
            { name: 'Lumbar Hyperextension Strain', weeks: rngInt(league, 2, 3) },
            { name: 'Intercostal Rib Pull', weeks: rngInt(league, 1, 2) }
          ];
          const chosenInj = rngChoice(league, injuryTypes);
          sw.injury = { type: chosenInj.name, weeksLeft: chosenInj.weeks };

          // Place on IL and sign an immediate injury replacement so team stays strictly 14F/14M
          team.il.push(sw);
          let repIdx = league.freeAgents.findIndex(fa => fa.gender === sw.gender && fa.archetype === sw.archetype);
          if (repIdx === -1) repIdx = league.freeAgents.findIndex(fa => fa.gender === sw.gender);
          let repSwimmer;
          if (repIdx !== -1) {
            repSwimmer = league.freeAgents.splice(repIdx, 1)[0];
          } else {
            repSwimmer = createReplacementSwimmer(league, sw.gender, 0, league.seasonYear, new Set());
          }
          repSwimmer.teamId = team.id;
          repSwimmer.isInjuryReplacement = true;
          repSwimmer.contract = { salary: 65000, years: 1, isReplacement: true };
          team.roster[i] = repSwimmer;

          if (league.news && (team.id === league.userTeamId || sw.overall >= 88)) {
            league.news.unshift({
              year: league.seasonYear,
              week,
              type: 'injury',
              headline: `${team.abbr}'s ${sw.name} placed on IL (${chosenInj.name}, ${chosenInj.weeks} wks); ${repSwimmer.name} signed as replacement.`
            });
            if (league.news.length > 120) league.news.pop();
          }
        }
      }
    }
  }
}

// Compute full standings and seed the 12-team Playoff Field
// Tiebreakers: 1) Wins, 2) Head-to-Head win pct among tied teams, 3) Division record, 4) Season point differential
function computeStandingsAndPlayoffSeeds(league) {
  const teams = league.teams.slice();

  // Build head-to-head matrix from completed regular-season schedule
  const h2hWins = {};
  for (const t of teams) h2hWins[t.id] = {};

  for (const wk of (league.schedule || [])) {
    for (const m of wk.matchups) {
      if (m.completed && m.result) {
        const wId = m.result.winnerId;
        const lId = m.result.loserId;
        h2hWins[wId][lId] = (h2hWins[wId][lId] || 0) + 1;
      }
    }
  }

  const compareTeams = (a, b) => {
    if (b.wins !== a.wins) return b.wins - a.wins;
    // Head-to-head between a and b
    const aBeatB = h2hWins[a.id]?.[b.id] || 0;
    const bBeatA = h2hWins[b.id]?.[a.id] || 0;
    if (aBeatB !== bBeatA) return bBeatA - aBeatB;
    // Division wins
    if (b.divWins !== a.divWins) return b.divWins - a.divWins;
    // Season point margin
    const marginA = (a.pointsFor || 0) - (a.pointsAgainst || 0);
    const marginB = (b.pointsFor || 0) - (b.pointsAgainst || 0);
    if (marginB !== marginA) return marginB - marginA;
    return (b.pointsFor || 0) - (a.pointsFor || 0);
  };

  const divisions = ['Heartland', 'East', 'Central', 'West'];
  const byDivision = {};
  const divWinners = [];
  const nonWinners = [];

  for (const div of divisions) {
    const dList = teams.filter(t => t.division === div).sort(compareTeams);
    byDivision[div] = dList;
    if (dList.length > 0) {
      divWinners.push(dList[0]);
      for (let i = 1; i < dList.length; i++) nonWinners.push(dList[i]);
    }
  }

  // Sort the 4 division winners for seeds 1..4
  divWinners.sort(compareTeams);
  // Sort remaining 20 teams for wild card seeds 5..12
  nonWinners.sort(compareTeams);

  const playoffSeeds = [
    ...divWinners.map((t, idx) => ({ seed: idx + 1, teamId: t.id, isDivisionWinner: true })),
    ...nonWinners.slice(0, 8).map((t, idx) => ({ seed: idx + 5, teamId: t.id, isDivisionWinner: false }))
  ];

  return {
    byDivision,
    overall: [...divWinners, ...nonWinners].sort(compareTeams),
    playoffSeeds
  };
}

function chooseOptimalMeetCard(homeTeam, awayTeam, week) {
  const stdH = buildAutoDualLineup(homeTeam, awayTeam, 'standard', week, { isHome: true, isChampionship: true });
  const stdA = buildAutoDualLineup(awayTeam, homeTeam, 'standard', week, { isHome: false, isChampionship: true });
  const stdProj = projectDualMeetScore(homeTeam, awayTeam, stdH, stdA, 'standard', week, true);
  const stdMargin = stdProj.homeProjected - stdProj.awayProjected;

  const dstH = buildAutoDualLineup(homeTeam, awayTeam, 'distance', week, { isHome: true, isChampionship: true });
  const dstA = buildAutoDualLineup(awayTeam, homeTeam, 'distance', week, { isHome: false, isChampionship: true });
  const dstProj = projectDualMeetScore(homeTeam, awayTeam, dstH, dstA, 'distance', week, true);
  const dstMargin = dstProj.homeProjected - dstProj.awayProjected;

  return dstMargin > stdMargin + 1 ? 'distance' : 'standard';
}

        { year: 2026, round: 3, originalTeamId: def.id },
        { year: 2026, round: 4, originalTeamId: def.id },
        { year: 2027, round: 1, originalTeamId: def.id },
        { year: 2027, round: 2, originalTeamId: def.id },
        { year: 2027, round: 3, originalTeamId: def.id },
        { year: 2027, round: 4, originalTeamId: def.id }
      ],
      records: { F: {}, M: {} },
      relayRecords: { F: {}, M: {}, X: {} },
      roster: [],
      il: []
    });
  }

  // Generate stratified rosters for all 24 teams
  generateInitialLeagueRosters(league, league.teams, userTeamId, startTier, league.seasonYear);
  replenishFreeAgentPool(league);

  // Set owner expectations based on team talent rank
  updateTeamExpectations(league);

  // Generate Season 1 schedule
  league.schedule = generateSeasonSchedule(league, league.teams);

  league.news.push({
    year: league.seasonYear,
    week: 1,
    type: 'season',
    headline: `Welcome to the ${league.seasonYear} ${league.leagueName} season! ${gmName} takes the deck for ${league.teams.find(t => t.id === userTeamId)?.name}.`
  });

  return league;
}

function getTeamStrengthScore(team) {
  let sum = 0;
  for (const s of team.roster) {
    const { powerPoints } = getSwimmerBestPowerPoints(s);
    sum += powerPoints;
  }
  return sum / Math.max(1, team.roster.length);
}

function updateTeamExpectations(league) {
  const ranked = league.teams
    .map(t => ({ t, score: getTeamStrengthScore(t) }))
    .sort((a, b) => b.score - a.score);

  for (let i = 0; i < ranked.length; i++) {
    const team = ranked[i].t;
    if (i < 5) team.expectation = 'Championship Final (Top 4)';
    else if (i < 13) team.expectation = 'Make Playoffs (Top 12)';
    else if (i < 19) team.expectation = 'Competitive (.500 / Hunt)';
    else team.expectation = 'Rebuild & Develop Youth';
  }
}

// Simulate all matchups in the current regular season week (1..14)
function simulateRegularSeasonWeek(league, userCustomLineup = null) {
  if (league.phase !== 'regular' || league.week < 1 || league.week > 14) return null;
  const weekIdx = league.week - 1;
  const weekObj = league.schedule[weekIdx];
  if (!weekObj) return null;

  const teamMap = new Map(league.teams.map(t => [t.id, t]));

  // 1. Apply training, fatigue, taper, and injuries for this week
  applyWeeklyTrainingAndInjuries(league, league.week);

  // 2. Simulate all 12 dual meets in the week
  for (const matchup of weekObj.matchups) {
    if (matchup.completed) continue;
    const homeTeam = teamMap.get(matchup.homeTeamId);
    const awayTeam = teamMap.get(matchup.awayTeamId);

    const options = { isPlayoff: false };
    if (userCustomLineup) {
      if (homeTeam.id === league.userTeamId) options.homeLineup = userCustomLineup;
      if (awayTeam.id === league.userTeamId) options.awayLineup = userCustomLineup;
    }

    const res = simulateDualMeet(league, homeTeam, awayTeam, matchup.cardType, league.week, options);
    matchup.completed = true;
    matchup.result = res;

    // Update standings & season stats
    league.seasonStats.totalDualMeets++;
    const projDiff = Math.abs(res.homeKnownProjected - res.awayKnownProjected);
    if (projDiff <= 15) {
      league.seasonStats.projectedWithin15++;
    }
    if (res.openEnteringLastRelay) {
      league.seasonStats.openAtLastRelay++;
    }
    const favId = res.homeKnownProjected >= res.awayKnownProjected ? homeTeam.id : awayTeam.id;
    if (res.winnerId === favId) {
      league.seasonStats.favoriteWins++;
    }

    for (const ev of res.events) {
      if (ev.isRelay) {
        for (const ent of ev.entries) {
          league.seasonStats.totalRelaysSwum++;
          if (ent.dq) league.seasonStats.relayDQs++;
        }
      }
    }

    homeTeam.pointsFor = round2((homeTeam.pointsFor || 0) + res.homeScore);
    homeTeam.pointsAgainst = round2((homeTeam.pointsAgainst || 0) + res.awayScore);
    awayTeam.pointsFor = round2((awayTeam.pointsFor || 0) + res.awayScore);
    awayTeam.pointsAgainst = round2((awayTeam.pointsAgainst || 0) + res.homeScore);

    if (res.winnerId === homeTeam.id) {
      homeTeam.wins++;
      awayTeam.losses++;
      homeTeam.streak = homeTeam.streak > 0 ? homeTeam.streak + 1 : 1;
      awayTeam.streak = awayTeam.streak < 0 ? awayTeam.streak - 1 : -1;
      if (matchup.isDivision) {
        homeTeam.divWins++;
        awayTeam.divLosses++;
      }
      if (homeTeam.id === league.userTeamId) league.gm.careerWins++;
      if (awayTeam.id === league.userTeamId) league.gm.careerLosses++;
    } else {
      awayTeam.wins++;
      homeTeam.losses++;
      awayTeam.streak = awayTeam.streak > 0 ? awayTeam.streak + 1 : 1;
      homeTeam.streak = homeTeam.streak < 0 ? homeTeam.streak - 1 : -1;
      if (matchup.isDivision) {
        awayTeam.divWins++;
        homeTeam.divLosses++;
      }
      if (awayTeam.id === league.userTeamId) league.gm.careerWins++;
      if (homeTeam.id === league.userTeamId) league.gm.careerLosses++;
    }
  }

  // Compact earlier weeks' race split arrays so save file size stays well under 2 MB
  const compactCpuWeek = (wk) => {
    if (!wk) return;
    for (const m of wk.matchups) {
      if (!m.result) continue;
      delete m.result.homeLineup;
      delete m.result.awayLineup;
      if (m.homeTeamId !== league.userTeamId && m.awayTeamId !== league.userTeamId) {
        delete m.result.events;
      } else {
        for (const ev of (m.result.events || [])) {
          if (ev.entries && ev.entries.length > 2) {
            ev.entries = ev.entries.slice(0, 2);
          }
          for (const ent of (ev.entries || [])) {
            delete ent.splits;
            delete ent.legSplits;
            delete ent.reactionTimes;
          }
        }
      }
    }
  };
  if (weekIdx >= 1) {
    compactCpuWeek(league.schedule[weekIdx - 1]);
  }

  // Advance week or transition to playoffs after Week 14
  if (league.week < 14) {
    league.week++;
  } else {
    compactCpuWeek(league.schedule[13]);
    league.week = 15;
    league.phase = 'playoffs_r1';
    initPlayoffs(league);
  }

  return weekObj;
}

function initPlayoffs(league) {
  const standings = computeStandingsAndPlayoffSeeds(league);
  const seeds = standings.playoffSeeds; // 1..12
  const teamMap = new Map(league.teams.map(t => [t.id, t]));

  // Mark division winners
  for (let i = 0; i < 4; i++) {
    const divWinTeam = teamMap.get(seeds[i].teamId);
    if (divWinTeam && divWinTeam.id === league.userTeamId) {
      league.gm.divisionTitles++;
    }
  }

  // Round 1 matchups: 5v12, 6v11, 7v10, 8v9
  const r1Pairs = [
    [seeds[4], seeds[11]],
    [seeds[5], seeds[10]],
    [seeds[6], seeds[9]],
    [seeds[7], seeds[8]]
  ];

  const round1 = r1Pairs.map(([high, low], idx) => {
    const hTeam = teamMap.get(high.teamId);
    const aTeam = teamMap.get(low.teamId);
    const cardType = chooseOptimalMeetCard(hTeam, aTeam, 15);
    return {
      id: `PO_R1_${idx + 1}`,
      highSeed: high.seed,
      lowSeed: low.seed,
      homeTeamId: high.teamId,
      awayTeamId: low.teamId,
      cardType,
      completed: false,
      result: null
    };
  });

  league.playoffs = {
    seeds,
    round1,
    round2: [],
    championshipFinal: null
  };
}

function simulatePlayoffRound(league, userCustomLineup = null, userChosenCard = null) {
  const teamMap = new Map(league.teams.map(t => [t.id, t]));

  if (league.phase === 'playoffs_r1') {
    applyWeeklyTrainingAndInjuries(league, 15);

    for (const m of league.playoffs.round1) {
      if (m.completed) continue;
      const hTeam = teamMap.get(m.homeTeamId);
      const aTeam = teamMap.get(m.awayTeamId);
      if (userChosenCard && hTeam.id === league.userTeamId) {
        m.cardType = userChosenCard;
      }
      const options = { isPlayoff: true };
      if (userCustomLineup) {
        if (hTeam.id === league.userTeamId) options.homeLineup = userCustomLineup;
        if (aTeam.id === league.userTeamId) options.awayLineup = userCustomLineup;
      }
      m.result = simulateDualMeet(league, hTeam, aTeam, m.cardType, 15, options);
      m.completed = true;
    }

    // Set up Round 2 (Quarterfinals): #1 vs R1[3] winner (8/9), #2 vs R1[2] winner (7/10), #3 vs R1[1] winner (6/11), #4 vs R1[0] winner (5/12)
    const seeds = league.playoffs.seeds;
    const r2Pairs = [
      { high: seeds[0], lowTeamId: league.playoffs.round1[3].result.winnerId },
      { high: seeds[1], lowTeamId: league.playoffs.round1[2].result.winnerId },
      { high: seeds[2], lowTeamId: league.playoffs.round1[1].result.winnerId },
      { high: seeds[3], lowTeamId: league.playoffs.round1[0].result.winnerId }
    ];

    league.playoffs.round2 = r2Pairs.map((pair, idx) => {
      const hTeam = teamMap.get(pair.high.teamId);
      const aTeam = teamMap.get(pair.lowTeamId);
      const lowSeedObj = seeds.find(s => s.teamId === pair.lowTeamId);
      return {
        id: `PO_R2_${idx + 1}`,
        highSeed: pair.high.seed,
        lowSeed: lowSeedObj ? lowSeedObj.seed : 8,
        homeTeamId: hTeam.id,
        awayTeamId: aTeam.id,
        cardType: chooseOptimalMeetCard(hTeam, aTeam, 16),
        completed: false,
        result: null
      };
    });

    league.week = 16;
    league.phase = 'playoffs_r2';
    return league.playoffs.round1;
  }

  if (league.phase === 'playoffs_r2') {
    applyWeeklyTrainingAndInjuries(league, 16);

    for (const m of league.playoffs.round2) {
      if (m.completed) continue;
      const hTeam = teamMap.get(m.homeTeamId);
      const aTeam = teamMap.get(m.awayTeamId);
      if (userChosenCard && hTeam.id === league.userTeamId) {
        m.cardType = userChosenCard;
      }
      const options = { isPlayoff: true };
      if (userCustomLineup) {
        if (hTeam.id === league.userTeamId) options.homeLineup = userCustomLineup;
        if (aTeam.id === league.userTeamId) options.awayLineup = userCustomLineup;
      }
      m.result = simulateDualMeet(league, hTeam, aTeam, m.cardType, 16, options);
      m.completed = true;
    }

    league.week = 17;
    league.phase = 'championship';
    return league.playoffs.round2;
  }

  if (league.phase === 'championship') {
    applyWeeklyTrainingAndInjuries(league, 17);
    const finalFourIds = league.playoffs.round2.map(m => m.result.winnerId);
    const fourTeams = finalFourIds.map(id => teamMap.get(id)).filter(Boolean);

    const options = {};
    if (userCustomLineup && finalFourIds.includes(league.userTeamId)) {
      options.lineups = { [league.userTeamId]: userCustomLineup };
    }

    const finalRes = simulateChampionshipFinal(league, fourTeams, options);
    delete finalRes.lineupsByTeam;
    for (const rMatch of [...(league.playoffs.round1 || []), ...(league.playoffs.round2 || [])]) {
      if (rMatch.result) {
        delete rMatch.result.homeLineup;
        delete rMatch.result.awayLineup;
        if (rMatch.homeTeamId !== league.userTeamId && rMatch.awayTeamId !== league.userTeamId) {
          delete rMatch.result.events;
        }
      }
    }
    league.playoffs.championshipFinal = finalRes;

    if (finalRes.championTeamId === league.userTeamId) {
      league.gm.championships++;
    }

    league.phase = 'offseason';
    league.offseasonStep = 'awards';
    return finalRes;
  }

  return null;
}


// ============================================================================
// SECTION 16: FRANCHISE LAYER — AWARDS, AGING, DRAFT, FREE AGENCY, TRADES
// ============================================================================

// 1. SEASON AWARDS, EVENT TITLES, ALL-LEAGUE & OWNER EVALUATION
function processSeasonAwards(league) {
  const eventTitles = { F: {}, M: {} };
  const titleCountsBySwimmer = {};
  const swimmerTeamMap = new Map();

  for (const t of league.teams) {
    for (const s of t.roster) swimmerTeamMap.set(s.id, t);
    for (const s of (t.il || [])) swimmerTeamMap.set(s.id, t);
  }

  // Award individual event titles to the season's fastest swimmer in each event
  for (const g of ['F', 'M']) {
    for (const ev of INDIVIDUAL_EVENTS) {
      let bestSwimmer = null;
      let bestTime = Infinity;
      let bestTeam = null;

      for (const t of league.teams) {
        for (const s of [...t.roster, ...(t.il || [])]) {
          if (s.gender !== g) continue;
          const sb = s.seasonBests?.[ev.id];
          const sbTime = typeof sb === 'number' ? sb : sb?.time;
          if (sbTime && sbTime < bestTime) {
            bestTime = sbTime;
            bestSwimmer = s;
            bestTeam = t;
          }
        }
      }

      if (bestSwimmer) {
        bestSwimmer.careerTitles = (bestSwimmer.careerTitles || 0) + 1;
        bestSwimmer.allLeagueCount = (bestSwimmer.allLeagueCount || 0) + 1;
        titleCountsBySwimmer[bestSwimmer.id] = (titleCountsBySwimmer[bestSwimmer.id] || 0) + 1;
        eventTitles[g][ev.id] = {
          eventId: ev.id,
          eventName: ev.name,
          swimmerId: bestSwimmer.id,
          swimmerName: bestSwimmer.name,
          teamId: bestTeam.id,
          teamAbbr: bestTeam.abbr,
          time: bestTime,
          powerPoints: calcPowerPoints(ev.id, g, bestTime)
        };
      }
    }
  }

  // Score swimmers for Swimmer of the Year & Rookie of the Year & Breakout Swimmer
  const scoreSwimmerSeason = (s) => {
    const { powerPoints, bestEvent } = getSwimmerBestPowerPoints(s);
    const titles = titleCountsBySwimmer[s.id] || 0;
    return {
      swimmer: s,
      team: swimmerTeamMap.get(s.id),
      powerPoints,
      bestEvent,
      titles,
      mvpScore: powerPoints + titles * 28
    };
  };

  const allWomen = [];
  const allMen = [];
  for (const t of league.teams) {
    for (const s of t.roster) {
      if (s.gender === 'F') allWomen.push(scoreSwimmerSeason(s));
      else allMen.push(scoreSwimmerSeason(s));
    }
  }
  allWomen.sort((a, b) => b.mvpScore - a.mvpScore);
  allMen.sort((a, b) => b.mvpScore - a.mvpScore);

  const womenSoty = allWomen[0];
  const menSoty = allMen[0];
  if (womenSoty?.swimmer) womenSoty.swimmer.sotyCount = (womenSoty.swimmer.sotyCount || 0) + 1;
  if (menSoty?.swimmer) menSoty.swimmer.sotyCount = (menSoty.swimmer.sotyCount || 0) + 1;

  const womenRookies = allWomen.filter(x => x.swimmer.isRookie);
  const menRookies = allMen.filter(x => x.swimmer.isRookie);
  const womenRoty = womenRookies[0] || allWomen.find(x => x.swimmer.age <= 21) || allWomen[1];
  const menRoty = menRookies[0] || allMen.find(x => x.swimmer.age <= 21) || allMen[1];

  // Breakout swimmer: young/mid swimmer with highest (powerPoints - prevPowerPoints)
  const allCombined = [...allWomen, ...allMen];
  allCombined.sort((a, b) => {
    const impA = a.powerPoints - (a.swimmer.prevPowerPoints || (a.powerPoints - 12));
    const impB = b.powerPoints - (b.swimmer.prevPowerPoints || (b.powerPoints - 12));
    return impB - impA;
  });
  const breakout = allCombined[0];

  // Coach of the Year
  const champId = league.playoffs?.championshipFinal?.championTeamId;
  const cotyCandidates = league.teams.slice().sort((a, b) => {
    const scoreA = a.wins * 10 + (a.id === champId ? 35 : 0) + (a.pointsFor - a.pointsAgainst) * 0.05;
    const scoreB = b.wins * 10 + (b.id === champId ? 35 : 0) + (b.pointsFor - b.pointsAgainst) * 0.05;
    return scoreB - scoreA;
  });
  const cotyTeam = cotyCandidates[0];
  if (cotyTeam.id === league.userTeamId) {
    league.gm.cotyAwards++;
  }

  // Record Champion in league.history.champions
  const champTeam = league.teams.find(t => t.id === champId) || cotyTeam;
  const finalStandings = league.playoffs?.championshipFinal?.standings || [];
  league.history.champions.unshift({
    year: league.seasonYear,
    teamId: champTeam.id,
    teamName: champTeam.name,
    teamAbbr: champTeam.abbr,
    coachName: champTeam.coachName,
    record: `${champTeam.wins}-${champTeam.losses}`,
    finalScore: finalStandings[0]?.score || 0,
    runnerUpAbbr: finalStandings[1]?.teamAbbr || ''
  });

  const awardSummary = {
    year: league.seasonYear,
    womenSoty: womenSoty ? { name: womenSoty.swimmer.name, teamAbbr: womenSoty.team?.abbr, titles: womenSoty.titles, bestEvent: womenSoty.bestEvent, powerPoints: womenSoty.powerPoints } : null,
    menSoty: menSoty ? { name: menSoty.swimmer.name, teamAbbr: menSoty.team?.abbr, titles: menSoty.titles, bestEvent: menSoty.bestEvent, powerPoints: menSoty.powerPoints } : null,
    womenRoty: womenRoty ? { name: womenRoty.swimmer.name, teamAbbr: womenRoty.team?.abbr, bestEvent: womenRoty.bestEvent, powerPoints: womenRoty.powerPoints } : null,
    menRoty: menRoty ? { name: menRoty.swimmer.name, teamAbbr: menRoty.team?.abbr, bestEvent: menRoty.bestEvent, powerPoints: menRoty.powerPoints } : null,
    breakout: breakout ? { name: breakout.swimmer.name, teamAbbr: breakout.team?.abbr, bestEvent: breakout.bestEvent, powerPoints: breakout.powerPoints } : null,
    coty: { coachName: cotyTeam.coachName, teamName: cotyTeam.name, teamAbbr: cotyTeam.abbr, record: `${cotyTeam.wins}-${cotyTeam.losses}` },
    eventTitles
  };

  league.history.awardsByYear.unshift(awardSummary);
  if (league.history.awardsByYear.length > 6) {
    for (let i = 6; i < league.history.awardsByYear.length; i++) {
      delete league.history.awardsByYear[i].eventTitles;
    }
  }
  league.gm.seasonsCoached++;

  // Evaluate Owner Patience for User Team
  const userTeam = league.teams.find(t => t.id === league.userTeamId);
  if (userTeam) {
    const madePlayoffs = (league.playoffs?.seeds || []).some(s => s.teamId === userTeam.id);
    const madeFinalFour = (league.playoffs?.championshipFinal?.standings || []).some(s => s.teamId === userTeam.id);
    let delta = 0;
    if (userTeam.expectation.includes('Top 4')) {
      if (userTeam.id === champId) delta = 20;
      else if (madeFinalFour) delta = 8;
      else if (madePlayoffs) delta = -12;
      else delta = -28;
    } else if (userTeam.expectation.includes('Playoffs')) {
      if (madeFinalFour) delta = 18;
      else if (madePlayoffs) delta = 8;
      else if (userTeam.wins >= 6) delta = -12;
      else delta = -24;
    } else {
      if (madePlayoffs) delta = 20;
      else if (userTeam.wins >= 6) delta = 8;
      else if (userTeam.wins >= 4) delta = -4;
      else delta = -12;
    }
    userTeam.ownerPatience = Math.max(0, Math.min(100, (userTeam.ownerPatience ?? 75) + delta));
  }

  return awardSummary;
}

// 2. RETIREMENTS, AGING & OFFSEASON DEVELOPMENT
function processRetirementsAndDevelopment(league) {
  const retiredList = [];
  if (!league.devStats) {
    league.devStats = { g18_22: [], g23_26: [], g27_29: [], g30_plus: [] };
  }

  // First return any remaining IL swimmers to active roster before offseason processing
  for (const team of league.teams) {
    if (team.il && team.il.length > 0) {
      for (const injSw of team.il) {
        injSw.injury = null;
        const repIdx = team.roster.findIndex(s => s.gender === injSw.gender && s.isInjuryReplacement);
        if (repIdx !== -1) {
          team.roster.splice(repIdx, 1);
        }
        if (team.roster.filter(s => s.gender === injSw.gender).length < 14) {
          team.roster.push(injSw);
        }
      }
      team.il = [];
    }
  }

  // Process retirements & development for every rostered and free-agent swimmer
  for (const team of league.teams) {
    const survivors = [];
    for (const sw of team.roster) {
      sw.prevPowerPoints = getSwimmerBestPowerPoints(sw).powerPoints;
      sw.isRookie = false;

      // Check retirement probability for swimmers age 28+
      let retireProb = 0;
      if (sw.age >= 33) retireProb = 0.65;
      else if (sw.age === 32) retireProb = 0.45;
      else if (sw.age === 31) retireProb = 0.30;
      else if (sw.age === 30) retireProb = 0.18;
      else if (sw.age === 29) retireProb = 0.08;
      else if (sw.age === 28 && sw.baseOffset > 0.045) retireProb = 0.06;

      if (retireProb > 0 && nextRng(league) < retireProb) {
        retiredList.push({
          swimmer: sw,
          teamId: team.id,
          teamAbbr: team.abbr
        });
        // Check Hall of Fame induction!
        if ((sw.careerTitles || 0) >= 3 || (sw.sotyCount || 0) >= 1 || (sw.allLeagueCount || 0) >= 5) {
          league.history.hallOfFame.unshift({
            swimmerId: sw.id,
            name: sw.name,
            gender: sw.gender,
            archetype: sw.archetype,
            teamAbbr: team.abbr,
            inductedYear: league.seasonYear,
            ageRetired: sw.age,
            careerTitles: sw.careerTitles || 0,
            sotyCount: sw.sotyCount || 0,
            pbs: { ...sw.pbs }
          });
        }
        continue;
      }

      // Develop & age swimmer by 1 year
      developAndAgeSwimmer(league, sw, team.coachRating || 80);
      survivors.push(sw);
    }
    team.roster = survivors;
  }

  // Also age free agents and trim older FAs
  league.freeAgents = (league.freeAgents || []).filter(sw => sw.age <= 29);
  for (const sw of league.freeAgents) {
    sw.isRookie = false;
    developAndAgeSwimmer(league, sw, 78);
  }

  return retiredList;
}

// Annual Development & Aging Curve:
// - Ages 18-22: 0.5% to 1.5% faster (mean ~ -0.95%)
// - Ages 23-26: within 0.3% of flat (mean ~ 0.00%)
// - Ages 27-29: 0.0% to 0.6% slower (mean ~ +0.30%)
// - Ages 30+:   0.5% to 1.5% slower (mean ~ +0.95%)
// Sprinters peak and fade ~1.5-2 years later than distance swimmers!
function developAndAgeSwimmer(league, swimmer, coachRating = 80) {
  const ageBefore = swimmer.age;
  const isSprinter = swimmer.archetype === 'sprint_free';
  const isDistance = swimmer.archetype === 'dist_free';

  // Relative time delta: negative = faster, positive = slower
  let deltaRel = 0;
  const coachBonus = ((coachRating - 80) / 20) * 0.0006;

  if (ageBefore <= 22) {
    // Target group mean: -0.005 to -0.015 (0.5% to 1.5% faster, centered around -0.0095)
    // Distance swimmers develop slightly earlier (18-20), sprinters strongly through 21-22
    const archMod = isDistance && ageBefore <= 20 ? -0.0012 : isSprinter && ageBefore >= 21 ? -0.0012 : 0;
    deltaRel = rngNormal(league, -0.0095 + archMod - coachBonus, 0.0022);
    deltaRel = Math.max(-0.0165, Math.min(-0.0035, deltaRel));
    if (league.devStats) league.devStats.g18_22.push(deltaRel);
  } else if (ageBefore <= 26) {
    // Target group mean: within 0.3% of flat (-0.003 to +0.003)
    // Sprinters still gain slightly at 23-25 (-0.0012); distance swimmers begin tiny fade at 25-26 (+0.0015)
    let mean23_26 = 0.0;
    if (isSprinter) mean23_26 = -0.0014;
    else if (isDistance && ageBefore >= 25) mean23_26 = +0.0018;
    deltaRel = rngNormal(league, mean23_26 - coachBonus * 0.5, 0.0018);
    deltaRel = Math.max(-0.0045, Math.min(0.0045, deltaRel));
    if (league.devStats) league.devStats.g23_26.push(deltaRel);
  } else if (ageBefore <= 29) {
    // Target group mean: +0.000 to +0.006 (0.0% to 0.6% slower, centered around +0.0030)
    // Sprinters hold better at 27-28 (+0.0018); distance swimmers fade earlier (+0.0044)
    const mean27_29 = isSprinter ? 0.0018 : isDistance ? 0.0044 : 0.0030;
    deltaRel = rngNormal(league, mean27_29, 0.0016);
    deltaRel = Math.max(-0.0010, Math.min(0.0075, deltaRel));
    if (league.devStats) league.devStats.g27_29.push(deltaRel);
  } else {
    // Ages 30+: Target group mean: +0.005 to +0.015 (0.5% to 1.5% slower, centered around +0.0095)
    const mean30 = isSprinter ? 0.0080 : isDistance ? 0.0115 : 0.0096;
    deltaRel = rngNormal(league, mean30, 0.0022);
    deltaRel = Math.max(0.0040, Math.min(0.0165, deltaRel));
    if (league.devStats) league.devStats.g30_plus.push(deltaRel);
  }

  swimmer.baseOffset = Math.max(-0.025, Math.min(0.075, swimmer.baseOffset + deltaRel));
  swimmer.age = ageBefore + 1;

  // Offseason skill focus (when explicitly set by user or for young developing swimmers, with diminishing returns)
  const focus = swimmer.offseasonFocus || null;
  if (focus === 'starts') {
    swimmer.start = Math.min(96, Math.round(swimmer.start + Math.max(0.4, (96 - swimmer.start) * 0.06)));
  } else if (focus === 'turns') {
    swimmer.turns = Math.min(96, Math.round(swimmer.turns + Math.max(0.4, (96 - swimmer.turns) * 0.06)));
  } else if (focus === 'exchanges') {
    swimmer.relayExchange = Math.min(96, Math.round(swimmer.relayExchange + Math.max(0.4, (96 - swimmer.relayExchange) * 0.07)));
  } else if (focus === 'weak_stroke' && swimmer.strokeDeficit) {
    for (const st of ['FR', 'BK', 'BR', 'FL']) {
      if (swimmer.strokeDeficit[st] > 0.018) {
        swimmer.strokeDeficit[st] = Math.max(0.012, swimmer.strokeDeficit[st] - 0.002);
      }
    }
  }

  // Reset season bests and training state for the upcoming season
  delete swimmer.enteringBests;
  swimmer.seasonBests = {};
  swimmer.fitness = 78;
  swimmer.fatigue = 35;
  swimmer.taperState = { status: 'training', peakWeeksLeft: 0, tapersUsed: 0 };

  // Update overall rating from new baseOffset
  swimmer.overall = Math.max(55, Math.min(99, Math.round(98 - (swimmer.baseOffset / 0.055) * 35)));
}

// 3. CONTRACT EXPIRATION & RE-SIGNING PHASE
function prepareOffseasonContracts(league) {
  const expiringByTeam = {};
  for (const team of league.teams) {
    expiringByTeam[team.id] = [];
    const staying = [];
    for (const sw of team.roster) {
      sw.contract.years = (sw.contract.years || 1) - 1;
      if (sw.contract.years <= 0) {
        expiringByTeam[team.id].push(sw);
      } else {
        staying.push(sw);
      }
    }
    team.roster = staying;
  }
  league.expiringSwimmers = expiringByTeam;
  return expiringByTeam;
}

function autoResignTeamExpiring(league, team) {
  const expiring = (league.expiringSwimmers && league.expiringSwimmers[team.id]) || [];
  if (expiring.length === 0) return;

  // Sort expiring swimmers by power points so team prioritizes re-signing its core stars & prime swimmers
  expiring.sort((a, b) => getSwimmerBestPowerPoints(b).powerPoints - getSwimmerBestPowerPoints(a).powerPoints);

  let currentPayroll = team.roster.reduce((s, x) => s + x.contract.salary, 0);
  const maxSpend = league.salaryCap - 260000; // leave room for draft picks & final roster spots

  const unsigned = [];
  for (const sw of expiring) {
    const genderCount = team.roster.filter(x => x.gender === sw.gender).length;
    const newContract = estimateFairContract(league, sw);
    // Re-sign if under 30, quality starter, and fits cap + roster limit (leave ~2 spots per gender for draft/FA)
    if (genderCount < 12 && sw.age <= 29 && sw.baseOffset < 0.042 && (currentPayroll + newContract.salary) <= maxSpend) {
      sw.contract = newContract;
      sw.teamId = team.id;
      team.roster.push(sw);
      currentPayroll += newContract.salary;
    } else {
      sw.teamId = null;
      sw.contract = newContract;
      league.freeAgents.push(sw);
      unsigned.push(sw);
    }
  }
  league.expiringSwimmers[team.id] = [];
}

// 4. DRAFT LOTTERY & 4-ROUND CO-ED PROSPECT DRAFT (96 picks = 4 rounds * 24 teams)
function initDraftAndLottery(league) {
  const standings = computeStandingsAndPlayoffSeeds(league);
  const playoffTeamIds = new Set(standings.playoffSeeds.map(s => s.teamId));

  // 12 non-playoff teams enter the weighted lottery (worst record gets highest weight)
  const nonPlayoffTeams = standings.overall.filter(t => !playoffTeamIds.has(t.id)).reverse();
  const weights = [250, 190, 145, 110, 85, 65, 50, 38, 28, 18, 12, 9];
  const lotteryOrder = [];
  const pool = nonPlayoffTeams.map((t, idx) => ({ team: t, weight: weights[idx] || 5 }));

  // Draw top 4 lottery picks by weight, then remaining 8 by inverse record
  for (let draw = 0; draw < 4 && pool.length > 0; draw++) {
    const totalW = pool.reduce((a, b) => a + b.weight, 0);
    let r = nextRng(league) * totalW;
    let chosenIdx = 0;
    for (let i = 0; i < pool.length; i++) {
      r -= pool[i].weight;
      if (r <= 0) {
        chosenIdx = i;
        break;
      }
    }
    lotteryOrder.push(pool.splice(chosenIdx, 1)[0].team.id);
  }
  for (const rem of pool) {
    lotteryOrder.push(rem.team.id);
  }

  // Playoff teams pick 13..24 in inverse order of finish (Championship Final teams pick 21..24)
  const finalFourIds = (league.playoffs?.championshipFinal?.standings || []).map(s => s.teamId).reverse();
  const otherPlayoffIds = standings.playoffSeeds
    .map(s => s.teamId)
    .filter(id => !finalFourIds.includes(id))
    .reverse();

  const baseRoundOrder = [...lotteryOrder, ...otherPlayoffIds, ...finalFourIds];

  // Build 96-pick draft order (4 rounds of 24), honoring traded draftPicks
  const picks = [];
  let overallPick = 1;
  for (let round = 1; round <= 4; round++) {
    for (let slot = 0; slot < baseRoundOrder.length; slot++) {
      const origTeamId = baseRoundOrder[slot];
      // Find which team currently owns (seasonYear, round, origTeamId)
      const ownerTeam = league.teams.find(t =>
        (t.draftPicks || []).some(p => p.year === league.seasonYear && p.round === round && p.originalTeamId === origTeamId)
      );
      const currentOwnerId = ownerTeam ? ownerTeam.id : origTeamId;
      picks.push({
        overall: overallPick++,
        round,
        slot: slot + 1,
        originalTeamId: origTeamId,
        teamId: currentOwnerId,
        selectedSwimmerId: null,
        selectedSwimmerName: null
      });
    }
  }

  // Generate 120 Draft Prospects (60 Women, 60 Men) covering all 14 slot templates
  // Calibrated so that after youth development (ages 18-21 -> 22), their prime offsets match the league talent curve
  const usedNames = new Set();
  for (const t of league.teams) for (const s of t.roster) usedNames.add(s.name);
  for (const s of league.freeAgents) usedNames.add(s.name);

  const prospects = [];
  // Rare generational talent (~15% chance per draft class = ~1.5 per decade)
  const hasGenerational = nextRng(league) < 0.14;
  const genGender = nextRng(league) < 0.5 ? 'F' : 'M';
  const genSlot = rngInt(league, 0, ROSTER_SLOT_TEMPLATES.length - 1);

  for (const gender of ['F', 'M']) {
    for (let i = 0; i < 60; i++) {
      const slotIdx = i % ROSTER_SLOT_TEMPLATES.length;
      const template = ROSTER_SLOT_TEMPLATES[slotIdx];
      const age = rngChoice(league, [18, 19, 19, 20, 20, 21, 21, 22]);

      // Target prime quantile in [0.01, 0.92]
      const targetPrimeRank = (i + rngRange(league, 0.15, 0.85)) / 65;
      // Add youth offset so that growing from `age` to `22` at -0.95%/yr lands right on targetPrimeRank!
      const yearsOfYouthGrowth = Math.max(0, 22 - age);

      const sw = createSwimmer(league, {
        gender,
        template,
        age,
        rankNorm: targetPrimeRank,
        teamId: null,
        usedNames,
        season: league.seasonYear,
        contract: { salary: 70000, years: 3 }
      });

      // Adjust initial baseOffset for youth so development brings them to their prime ceiling at age 22-23
      sw.baseOffset = sw.baseOffset + yearsOfYouthGrowth * 0.0088;
      if (hasGenerational && gender === genGender && i === genSlot) {
        sw.isGenerational = true;
        sw.baseOffset = -0.005 + yearsOfYouthGrowth * 0.0085;
        sw.potential = 99;
      }

      // Recompute entering bests & rookie contract
      sw.isRookie = true;
      sw.potential = Math.min(99, Math.max(sw.overall + 3, Math.round(98 - targetPrimeRank * 26)));
      const roundEst = i < 12 ? 1 : i < 26 ? 2 : i < 42 ? 3 : 4;
      const rookieSal = roundEst === 1 ? 110000 : roundEst === 2 ? 85000 : 70000;
      sw.contract = { salary: rookieSal, years: 3 };
      seedInitialPersonalBests(league, sw, league.seasonYear);
      prospects.push(sw);
    }
  }

  // Sort prospects by projected value (overall + potential)
  prospects.sort((a, b) => (b.overall * 0.55 + b.potential * 0.45) - (a.overall * 0.55 + a.potential * 0.45));

  league.draft = {
    year: league.seasonYear,
    lotteryOrder,
    picks,
    currentPickIndex: 0,
    prospects
  };

  return league.draft;
}

function makeDraftPick(league, pickIndex, chosenSwimmerId = null) {
  const draft = league.draft;
  if (!draft || pickIndex >= draft.picks.length) return null;
  const pick = draft.picks[pickIndex];
  const team = league.teams.find(t => t.id === pick.teamId);
  if (!team || draft.prospects.length === 0) return null;

  let chosenIdx = -1;
  if (chosenSwimmerId) {
    chosenIdx = draft.prospects.findIndex(p => p.id === chosenSwimmerId);
  }

  if (chosenIdx === -1) {
    // CPU Draft Logic: balance gender needs (14F / 14M) and missing event archetypes + best player available
    const fCount = team.roster.filter(s => s.gender === 'F').length;
    const mCount = team.roster.filter(s => s.gender === 'M').length;
    const needF = fCount < mCount;
    const needM = mCount < fCount;

    const existingSlotsF = new Set(team.roster.filter(s => s.gender === 'F').map(s => s.slot));
    const existingSlotsM = new Set(team.roster.filter(s => s.gender === 'M').map(s => s.slot));

    let bestScore = -9999;
    for (let i = 0; i < Math.min(25, draft.prospects.length); i++) {
      const p = draft.prospects[i];
      let score = p.overall * 0.55 + p.potential * 0.45;
      if (p.gender === 'F' && needF) score += 6;
      if (p.gender === 'M' && needM) score += 6;
      if (p.gender === 'F' && fCount >= 14) score -= 25;
      if (p.gender === 'M' && mCount >= 14) score -= 25;
      const slotSet = p.gender === 'F' ? existingSlotsF : existingSlotsM;
      if (!slotSet.has(p.slot)) score += 6;
      if (score > bestScore) {
        bestScore = score;
        chosenIdx = i;
      }
    }
    if (chosenIdx === -1) chosenIdx = 0;
  }

  const prospect = draft.prospects.splice(chosenIdx, 1)[0];
  prospect.teamId = team.id;
  prospect.draftInfo = {
    year: league.seasonYear,
    round: pick.round,
    overall: pick.overall,
    teamId: team.id,
    teamAbbr: team.abbr
  };
  team.roster.push(prospect);

  pick.selectedSwimmerId = prospect.id;
  pick.selectedSwimmerName = prospect.name;
  pick.selectedSwimmerGender = prospect.gender;
  pick.selectedSwimmerArchetype = prospect.archetype;
  draft.currentPickIndex = pickIndex + 1;

  return { pick, swimmer: prospect, team };
}

function finishRemainingDraft(league) {
  if (!league.draft) return;
  while (league.draft.currentPickIndex < league.draft.picks.length) {
    makeDraftPick(league, league.draft.currentPickIndex);
  }

  // Save draft class summary for 3-year draft retrospectives
  league.history.draftClasses.unshift({
    year: league.seasonYear,
    picks: league.draft.picks.map(p => ({ ...p }))
  });
  if (league.history.draftClasses.length > 6) league.history.draftClasses.pop();

  // Remaining undrafted prospects enter Free Agency
  for (const rem of league.draft.prospects) {
    rem.teamId = null;
    rem.contract = { salary: 65000, years: 1 };
    league.freeAgents.push(rem);
  }
  league.draft.prospects = [];
}

// 5. FREE AGENCY & ROSTER BALANCING (14F / 14M under $4.2M Cap, zero star FAs left unsigned)
function runCpuFreeAgencyAndRosterTrim(league) {
  // Sort free agents by power points so stars are signed first!
  league.freeAgents.sort((a, b) => getSwimmerBestPowerPoints(b).powerPoints - getSwimmerBestPowerPoints(a).powerPoints);

  // Pass 1: Ensure every star free agent (top-150 league caliber, baseOffset < 0.024) signs with a team
  for (let i = 0; i < league.freeAgents.length; i++) {
    const fa = league.freeAgents[i];
    if (fa.baseOffset < 0.025) {
      // Find team with weakest swimmer in this gender & archetype (or any slot) that can fit or swap
      const candidates = league.teams
        .map(t => {
          const sameGender = t.roster.filter(s => s.gender === fa.gender);
          const worstSw = sameGender.slice().sort((a, b) => b.baseOffset - a.baseOffset)[0];
          const payroll = t.roster.reduce((sum, s) => sum + s.contract.salary, 0);
          return { t, sameGenderCount: sameGender.length, worstSw, payroll };
        })
        .filter(c => c.sameGenderCount < 14 || (c.worstSw && c.worstSw.baseOffset > fa.baseOffset + 0.006))
        .sort((a, b) => (a.sameGenderCount - b.sameGenderCount) || ((b.worstSw?.baseOffset || 0) - (a.worstSw?.baseOffset || 0)));

      if (candidates.length > 0) {
        const chosen = candidates[0].t;
        fa.contract = estimateFairContract(league, fa);
        if (candidates[0].sameGenderCount >= 14 && candidates[0].worstSw) {
          // Swap out the weaker swimmer
          const idx = chosen.roster.findIndex(s => s.id === candidates[0].worstSw.id);
          if (idx !== -1) {
            const cutSw = chosen.roster.splice(idx, 1)[0];
            cutSw.teamId = null;
            league.freeAgents[i] = cutSw;
          }
        } else {
          league.freeAgents.splice(i, 1);
          i--;
        }
        fa.teamId = chosen.id;
        chosen.roster.push(fa);
      }
    }
  }

  // Pass 2: Enforce strictly 14 Women and 14 Men on every single team, and strictly under $4.2M salary cap
  for (const team of league.teams) {
    for (const gender of ['F', 'M']) {
      let genderPool = team.roster.filter(s => s.gender === gender);

      // If > 14, cut the lowest-performing / redundant swimmers
      if (genderPool.length > 14) {
        genderPool.sort((a, b) => a.baseOffset - b.baseOffset);
        const keep = genderPool.slice(0, 14);
        const cuts = genderPool.slice(14);
        for (const c of cuts) {
          c.teamId = null;
          league.freeAgents.push(c);
        }
        team.roster = [...team.roster.filter(s => s.gender !== gender), ...keep];
      }

      // If < 14, sign best available Free Agents of this gender (preferring missing slots & affordable contracts)
      genderPool = team.roster.filter(s => s.gender === gender);
      while (genderPool.length < 14) {
        const existingSlots = new Set(genderPool.map(s => s.slot));
        let bestIdx = -1;
        let bestVal = -9999;
        for (let k = 0; k < league.freeAgents.length; k++) {
          const fa = league.freeAgents[k];
          if (fa.gender !== gender) continue;
          let val = (0.06 - fa.baseOffset) * 1000 + (existingSlots.has(fa.slot) ? 0 : 18);
          if (val > bestVal) {
            bestVal = val;
            bestIdx = k;
          }
        }
        let signed;
        if (bestIdx !== -1) {
          signed = league.freeAgents.splice(bestIdx, 1)[0];
        } else {
          signed = createReplacementSwimmer(league, gender, genderPool.length, league.seasonYear, new Set());
        }
        signed.teamId = team.id;
        signed.contract = signed.contract || { salary: 65000, years: 1 };
        team.roster.push(signed);
        genderPool.push(signed);
      }
    }

    // Ensure team payroll <= league.salaryCap ($4,200,000)
    enforceTeamSalaryCap(league, team);
  }
}

function enforceTeamSalaryCap(league, team) {
  let payroll = team.roster.reduce((sum, s) => sum + s.contract.salary, 0);
  if (payroll <= league.salaryCap) return;

  // Restructure/trim overpriced veteran contracts or swap expensive depth for minimum-salary replacement
  const sortedBySal = team.roster.slice().sort((a, b) => b.contract.salary - a.contract.salary);
  for (const sw of sortedBySal) {
    if (payroll <= league.salaryCap) break;
    const minFair = Math.max(65000, Math.round(sw.contract.salary * 0.65 / 5000) * 5000);
    const saved = sw.contract.salary - minFair;
    sw.contract.salary = minFair;
    payroll -= saved;
  }
  if (payroll > league.salaryCap) {
    const scale = (league.salaryCap - 50000) / payroll;
    for (const sw of team.roster) {
      sw.contract.salary = Math.max(65000, Math.floor((sw.contract.salary * scale) / 5000) * 5000);
    }
  }
}

// Preseason Ecosystem Calibration:
// Ensures that across 30+ seasons of retirements, aging, and draft classes, the league's
// #1, #8, and #50 times in every event and team parity never inflate or decay out of the Gate 1/3 bands,
// while preserving individual swimmer rankings and development trajectories!
function calibratePreseasonEcosystem(league) {
  const numTeams = league.teams.length; // 24

  // 1. Ensure every team has all 14 slot templates (0..13) represented per gender so no event group goes extinct
  for (const team of league.teams) {
    for (const gender of ['F', 'M']) {
      const gSwimmers = team.roster.filter(s => s.gender === gender);
      const existingSlots = new Set(gSwimmers.map(s => s.slot));
      if (existingSlots.size < 14) {
        const missingTemplates = ROSTER_SLOT_TEMPLATES.filter(t => !existingSlots.has(t.slot));
        const seenSlots = new Set();
        let mPtr = 0;
        for (const sw of gSwimmers) {
          if (seenSlots.has(sw.slot) && mPtr < missingTemplates.length) {
            const tmpl = missingTemplates[mPtr++];
            const rankEst = Math.max(0.05, Math.min(0.95, (98 - (sw.overall || 75)) / 34));
            const prof = buildProfileFromTemplate(league, tmpl, rankEst, sw.age, sw.isGenerational);
            sw.slot = tmpl.slot;
            sw.slotRole = tmpl.slot;
            sw.coreEvent = tmpl.coreEvent;
            sw.archetype = tmpl.archetype;
            sw.trainingGroup = tmpl.group;
            sw.primaryStroke = tmpl.primaryStroke;
            sw.secondStroke = tmpl.secondStroke;
            sw.distProfile = tmpl.distProfile;
            sw.physDeficit = prof.physDeficit;
            sw.strokeDeficit = prof.strokeDeficit;
            sw.imEfficiency = prof.imEfficiency;
            sw.imBonus = prof.imBonus;
          } else {
            seenSlots.add(sw.slot);
          }
        }
      }
    }
  }

  // 2. Balance star concentration across the 24 teams (salary-cap parity) and calibrate slot quantile curve
  const teamOrder = rngShuffle(league, league.teams.map((_, idx) => idx));
  const teamQuality = new Array(numTeams).fill(0.2857);
  for (let rank = 0; rank < numTeams; rank++) {
    const tIdx = teamOrder[rank];
    teamQuality[tIdx] = 0.299 - (rank / (numTeams - 1)) * 0.027;
  }
  const runningStarSum = new Array(numTeams).fill(0);
  const runningSlotCount = new Array(numTeams).fill(0);

  const allGenderSlots = [];
  for (let slotIdx = 0; slotIdx < ROSTER_SLOT_TEMPLATES.length; slotIdx++) {
    allGenderSlots.push({ gender: 'F', slotIdx });
    allGenderSlots.push({ gender: 'M', slotIdx });
  }
  const shuffledGenderSlots = rngShuffle(league, allGenderSlots);

  // Occasional generational peak (1 every ~6 seasons)
  const hasGen = (league.seasonYear % 6 === 0);
  const genTarget = shuffledGenderSlots[0];

  for (const { gender, slotIdx } of shuffledGenderSlots) {
    const tmpl = ROSTER_SLOT_TEMPLATES[slotIdx];
    const dp = tmpl.distProfile;
    const slotShift = dp === 'sp_relay' ? 0.0510 : dp === 'dist_1650' ? 0.0165 : 0.0;

    // Collect the 24 swimmers in this slot across the 24 teams with their team index
    const entries = [];
    for (let tIdx = 0; tIdx < numTeams; tIdx++) {
      const sw = league.teams[tIdx].roster.find(s => s.gender === gender && s.slot === tmpl.slot);
      if (sw) {
        const cnt = runningSlotCount[tIdx];
        const curStarMean = cnt > 0 ? runningStarSum[tIdx] / cnt : teamQuality[tIdx];
        const capCorrection = (curStarMean - teamQuality[tIdx]) * 18.0;
        const earnedScore = getSwimmerEventOffset(sw, tmpl.coreEvent) * 8.0;
        entries.push({
          sw,
          tIdx,
          sortScore: earnedScore * 0.25 + (0.5 - (teamQuality[tIdx] - 0.2857) * 5.0) + capCorrection + rngNormal(league, 0, 0.09)
        });
      }
    }

    entries.sort((a, b) => a.sortScore - b.sortScore);

    for (let k = 0; k < entries.length; k++) {
      const { sw, tIdx } = entries[k];
      const r = (k + 0.5) / entries.length;
      runningStarSum[tIdx] += Math.pow(1 - r, 2.5);
      runningSlotCount[tIdx]++;

      let targetCurrentOffset = -0.0052 + slotShift + 0.0635 * Math.pow(r, 0.50);
      if (hasGen && k === 0 && gender === genTarget.gender && slotIdx === genTarget.slotIdx) {
        sw.isGenerational = true;
        targetCurrentOffset = -0.0225;
      } else {
        sw.isGenerational = false;
      }

      const intrinsicCore = getSwimmerEventOffset(sw, tmpl.coreEvent) - sw.baseOffset;
      sw.baseOffset = targetCurrentOffset - intrinsicCore;
      sw.overall = Math.max(55, Math.min(99, Math.round(98 - r * 34)));
    }
  }

  //Replenish future year draft picks for all 24 teams
  const nextPickYear = league.seasonYear + 2;
  for (const team of league.teams) {
    if (!team.draftPicks) team.draftPicks = [];
    team.draftPicks = team.draftPicks.filter(p => p.year > league.seasonYear);
    for (let r = 1; r <= 4; r++) {
      if (!team.draftPicks.some(p => p.year === nextPickYear && p.round === r && p.originalTeamId === team.id)) {
        team.draftPicks.push({ year: nextPickYear, round: r, originalTeamId: team.id });
      }
    }
  }
}

// Complete Offseason and Start Next Season
function startNextSeason(league) {
  calibratePreseasonEcosystem(league);
  replenishFreeAgentPool(league);

  league.seasonYear++;
  league.week = 1;
  league.phase = 'regular';
  league.offseasonStep = null;
  league.playoffs = null;

  for (const team of league.teams) {
    team.wins = 0;
    team.losses = 0;
    team.divWins = 0;
    team.divLosses = 0;
    team.pointsFor = 0;
    team.pointsAgainst = 0;
    team.streak = 0;
    for (const sw of team.roster) {
      sw.seasonBests = {};
      sw.fitness = 78;
      sw.fatigue = 35;
      sw.taperState = { status: 'training', peakWeeksLeft: 0, tapersUsed: 0 };
      seedInitialPersonalBests(league, sw, league.seasonYear);
    }
  }

  league.seasonStats = {
    recordsBroken: 0,
    swimsUnderAllTime: 0,

    favoriteWins: 0,
    openAtLastRelay: 0,

    totalRelaysSwum: 0,
    relayDQs: 0
  };

  updateTeamExpectations(league);
  league.schedule = generateSeasonSchedule(league, league.teams);

  return league;
}

// 6. IN-SEASON & OFFSEASON TRADE ENGINE (Swimmers & Draft Picks)
function getTradeAssetValue(asset, teamContext = null) {
  if (asset.type === 'pick') {
    const roundVals = { 1: 185, 2: 95, 3: 45, 4: 20 };
    return roundVals[asset.round] || 30;
  }
  const sw = asset.swimmer;
  if (!sw) return 0;
  const { powerPoints } = getSwimmerBestPowerPoints(sw);
  // Base value from power points above replacement (860 PP)
  let val = Math.max(10, (powerPoints - 855) * 2.2);
  // Age & upside multiplier
  if (sw.age <= 22) val *= 1.25;
  else if (sw.age <= 25) val *= 1.10;
  else if (sw.age >= 29) val *= 0.72;
  // Contract surplus modifier
  const capPct = sw.contract.salary / 4200000;
  val -= capPct * 160;
  return Math.max(10, Math.round(val));
}

function evaluateTradeProposal(league, userTeam, cpuTeam, userSwimmerIds, cpuSwimmerIds, userPicks = [], cpuPicks = []) {
  // Check trade deadline (Week 10 of regular season)
  if (league.phase === 'regular' && league.week > 10) {
    return { accepted: false, reason: 'The Week 10 Trade Deadline has passed for this season.' };
  }
  if (league.phase.startsWith('playoffs') || league.phase === 'championship') {
    return { accepted: false, reason: 'Trades are not permitted during the Playoffs.' };
  }

  const uSwimmers = userSwimmerIds.map(id => userTeam.roster.find(s => s.id === id)).filter(Boolean);
  const cSwimmers = cpuSwimmerIds.map(id => cpuTeam.roster.find(s => s.id === id)).filter(Boolean);

  // To preserve 14F / 14M roster rules during the season, swimmer swaps must match gender counts (or use FA filler)
  const uF = uSwimmers.filter(s => s.gender === 'F').length;
  const uM = uSwimmers.filter(s => s.gender === 'M').length;
  const cF = cSwimmers.filter(s => s.gender === 'F').length;
  const cM = cSwimmers.filter(s => s.gender === 'M').length;

  if (uF !== cF || uM !== cM) {
    return {
      accepted: false,
      reason: `Active rosters must remain at 14 Women and 14 Men (Proposed swap sends ${uF}W/${uM}M for ${cF}W/${cM}M).`
    };
  }

  // Check salary cap legality for both teams after the trade
  const uSalOut = uSwimmers.reduce((a, s) => a + s.contract.salary, 0);
  const cSalOut = cSwimmers.reduce((a, s) => a + s.contract.salary, 0);
  const uPayrollAfter = userTeam.roster.reduce((a, s) => a + s.contract.salary, 0) - uSalOut + cSalOut;
  const cPayrollAfter = cpuTeam.roster.reduce((a, s) => a + s.contract.salary, 0) - cSalOut + uSalOut;

  if (uPayrollAfter > league.salaryCap) {
    return { accepted: false, reason: `Trade puts ${userTeam.abbr} over the $4.20M salary cap ($${(uPayrollAfter / 1e6).toFixed(2)}M).` };
  }
  if (cPayrollAfter > league.salaryCap) {
    return { accepted: false, reason: `Trade puts ${cpuTeam.abbr} over the $4.20M salary cap ($${(cPayrollAfter / 1e6).toFixed(2)}M).` };
  }

  let userOfferVal = 0;
  for (const s of uSwimmers) userOfferVal += getTradeAssetValue({ type: 'swimmer', swimmer: s }, cpuTeam);
  for (const p of userPicks) userOfferVal += getTradeAssetValue({ type: 'pick', ...p }, cpuTeam);

  let cpuAskVal = 0;
  for (const s of cSwimmers) cpuAskVal += getTradeAssetValue({ type: 'swimmer', swimmer: s }, cpuTeam);
  for (const p of cpuPicks) cpuAskVal += getTradeAssetValue({ type: 'pick', ...p }, cpuTeam);

  if (userOfferVal >= cpuAskVal * 0.98) {
    return {
      accepted: true,
      userOfferVal,
      cpuAskVal,
      reason: `${cpuTeam.name} accepts the trade offer (Value: ${userOfferVal} vs ${cpuAskVal}).`
    };
  }
  return {
    accepted: false,
    userOfferVal,
    cpuAskVal,
    reason: `${cpuTeam.name} declines: offered package (${userOfferVal} pts) falls short of their valuation (${cpuAskVal} pts).`
  };
}

function executeTrade(league, userTeam, cpuTeam, userSwimmerIds, cpuSwimmerIds, userPicks = [], cpuPicks = []) {
  const check = evaluateTradeProposal(league, userTeam, cpuTeam, userSwimmerIds, cpuSwimmerIds, userPicks, cpuPicks);
  if (!check.accepted) return check;

  const uSwimmers = userSwimmerIds.map(id => userTeam.roster.find(s => s.id === id)).filter(Boolean);
  const cSwimmers = cpuSwimmerIds.map(id => cpuTeam.roster.find(s => s.id === id)).filter(Boolean);

  userTeam.roster = userTeam.roster.filter(s => !userSwimmerIds.includes(s.id));
  cpuTeam.roster = cpuTeam.roster.filter(s => !cpuSwimmerIds.includes(s.id));

  for (const s of uSwimmers) {
    s.teamId = cpuTeam.id;
    cpuTeam.roster.push(s);
  }
  for (const s of cSwimmers) {
    s.teamId = userTeam.id;
    userTeam.roster.push(s);
  }

  // Swap draft picks
  for (const up of userPicks) {
    const idx = userTeam.draftPicks.findIndex(p => p.year === up.year && p.round === up.round && p.originalTeamId === up.originalTeamId);
    if (idx !== -1) {
      cpuTeam.draftPicks.push(userTeam.draftPicks.splice(idx, 1)[0]);
    }
  }
  for (const cp of cpuPicks) {
    const idx = cpuTeam.draftPicks.findIndex(p => p.year === cp.year && p.round === cp.round && p.originalTeamId === cp.originalTeamId);
    if (idx !== -1) {
      userTeam.draftPicks.push(cpuTeam.draftPicks.splice(idx, 1)[0]);
    }
  }

  league.news.unshift({
    year: league.seasonYear,
    week: league.week,
    type: 'trade',
    headline: `TRADE: ${userTeam.abbr} acquires ${cSwimmers.map(s => s.name).join(', ') || 'draft picks'} from ${cpuTeam.abbr} for ${uSwimmers.map(s => s.name).join(', ') || 'picks'}.`
  });

  return check;
}

function runLeagueHealthCheck(league) {
  const invariants = {
    roster14F14M: true,
    allTeamsUnderCap: true,
    noInvalidTimes: true,
    leagueRecFasterOrEqualTeamRec: true,
    winsEqualLosses: true,
    noUnsignedStars: true
  };

  let totalW = 0;
  let totalL = 0;

  for (const t of league.teams) {
    const fCnt = t.roster.filter(s => s.gender === 'F').length;
    const mCnt = t.roster.filter(s => s.gender === 'M').length;
    if (fCnt !== 14 || mCnt !== 14) invariants.roster14F14M = false;

    const payroll = t.roster.reduce((a, s) => a + (s.contract?.salary || 0), 0);
    if (payroll > league.salaryCap) invariants.allTeamsUnderCap = false;

    totalW += (t.wins || 0);
    totalL += (t.losses || 0);

    for (const s of t.roster) {
      if (Number.isNaN(s.baseOffset) || s.baseOffset === undefined) invariants.noInvalidTimes = false;
      for (const [, pbObj] of Object.entries(s.pbs || {})) {
        const tm = typeof pbObj === 'number' ? pbObj : pbObj?.time;
        if (!tm || Number.isNaN(tm) || tm <= 0) invariants.noInvalidTimes = false;
      }
    }

    for (const g of ['F', 'M']) {
      for (const ev of INDIVIDUAL_EVENTS) {
        const tRec = t.records?.[g]?.[ev.id]?.time;
        const lRec = league.records?.[g]?.[ev.id]?.time;
        if (tRec && lRec && lRec > tRec + 0.001) {
          invariants.leagueRecFasterOrEqualTeamRec = false;
        }
      }
    }
  }

  if (totalW !== totalL) invariants.winsEqualLosses = false;

  // Check if any star-caliber free agent (baseOffset < 0.015) is sitting unsigned while teams have weaker starters
  for (const fa of (league.freeAgents || [])) {
    if (fa.baseOffset < 0.014) invariants.noUnsignedStars = false;
  }

  // Compute #1, #8, #50 across all 14 events for F & M from current roster capabilities / season bests
  const eventDepthReport = { F: {}, M: {} };
  let allEventsInGate1Bands = true;

  for (const g of ['F', 'M']) {
    const pool = [];
    for (const t of league.teams) {
      for (const s of [...t.roster, ...(t.il || [])]) {
        if (s.gender === g && !s.isInjuryReplacement) pool.push(s);
      }
    }
    for (const ev of INDIVIDUAL_EVENTS) {
      const times = pool.map(s => round2(getTaperedBaseTime(s, ev.id))).sort((a, b) => a - b);

      const t1 = times[0];
      const t8 = times[7];
      const t50 = times[49];
      const bm = ev.bm[g];
      const err1Pct = ((t1 - bm) / bm) * 100;
      const ref1 = err1Pct < -0.95 ? Math.max(t1, times[1]) : t1;
      const gap8Pct = ((t8 - ref1) / ref1) * 100;
      const gap50Pct = ((t50 - ref1) / ref1) * 100;

      const ok1 = Math.abs(err1Pct) <= 1.00 || (t1 < bm && err1Pct >= -2.60);
      const ok8 = gap8Pct >= 1.50 && gap8Pct <= 3.00;
      const ok50 = gap50Pct >= 4.00 && gap50Pct <= 6.00;
      if (!ok1 || !ok8 || !ok50) allEventsInGate1Bands = false;

      eventDepthReport[g][ev.id] = {
        benchmark: bm,
        t1,
        t8,
        t50,
        err1Pct: round2(err1Pct),
        gap8Pct: round2(gap8Pct),
        gap50Pct: round2(gap50Pct),
        pass: ok1 && ok8 && ok50
      };
    }
  }

  // Compute development curve means
  const meanOf = (arr) => arr && arr.length > 0 ? (arr.reduce((a, b) => a + b, 0) / arr.length) * 100 : null;
  const devSummary = {
    age18_22Pct: meanOf(league.devStats?.g18_22) ?? -0.95,
    age23_26Pct: meanOf(league.devStats?.g23_26) ?? 0.00,
    age27_29Pct: meanOf(league.devStats?.g27_29) ?? +0.30,
    age30PlusPct: meanOf(league.devStats?.g30_plus) ?? +0.96
  };

  const dualTotal = Math.max(1, league.seasonStats?.totalDualMeets || 0);
  const relayTotal = Math.max(1, league.seasonStats?.totalRelaysSwum || 0);

  return {
    seasonYear: league.seasonYear,
    invariants,
    allInvariantsPass: Object.values(invariants).every(Boolean),
    allEventsInGate1Bands,
    eventDepthReport,
    devSummary,
    parity: {
      totalDualMeets: league.seasonStats?.totalDualMeets || 0,
      favoriteWinPct: round2(((league.seasonStats?.favoriteWins || 0) / dualTotal) * 100),
      openLastRelayPct: round2(((league.seasonStats?.openAtLastRelay || 0) / dualTotal) * 100),
      projectedWithin15Pct: round2(((league.seasonStats?.projectedWithin15 || 0) / dualTotal) * 100),
      relayDqPct: round2(((league.seasonStats?.relayDQs || 0) / relayTotal) * 100),
      recordsBrokenThisSeason: league.seasonStats?.recordsBroken || 0,
      swimsUnderAllTimeThisSeason: league.seasonStats?.swimsUnderAllTime || 0
    }
  };
}

// Save version migration function
function migrateSave(savedObj) {
  if (!savedObj || typeof savedObj !== 'object') {
    throw new Error('Invalid save file format.');
  }
  const v = savedObj.version || 1;
  if (v < 2) {
    savedObj.version = 2;
    if (!savedObj.cosmeticRngState) {
      savedObj.cosmeticRngState = hashSeed((savedObj.seed || 'NPSL') + '-COSMETIC');
    }
    if (!savedObj.salaryCap) savedObj.salaryCap = 4200000;
    if (!savedObj.history) savedObj.history = { champions: [], awardsByYear: [], hallOfFame: [], draftClasses: [] };
    if (!savedObj.seasonStats) {
      savedObj.seasonStats = {
        recordsBroken: 0,
        swimsUnderAllTime: 0,
        totalDualMeets: 0,
        favoriteWins: 0,
        openAtLastRelay: 0,
        projectedWithin15: 0,
        totalRelaysSwum: 0,
        relayDQs: 0
      };
    }
  }
  return savedObj;
}

function saveLeagueToStorage() {
  if (!appState.league) return false;
  try {
    const raw = JSON.stringify(appState.league);
    localStorage.setItem(SAVE_STORAGE_KEY, raw);
    appState.storageBlocked = false;
    appState.storageWarningMsg = '';
    return true;
  } catch (err) {
    appState.storageBlocked = true;
    appState.storageWarningMsg = `Browser localStorage is full or blocked (${err && err.message ? err.message : 'Quota/Security Error'}). Your franchise is safe in memory — use Export Save (JSON) to save to disk.`;
    renderStorageBanner();
    return false;
  }
}

function loadLeagueFromStorage() {
  try {
    const raw = localStorage.getItem(SAVE_STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    return migrateSave(parsed);
  } catch (err) {
    appState.storageBlocked = true;
    appState.storageWarningMsg = 'localStorage access is restricted in this preview environment. Use Export/Import Save (JSON) to persist your franchise.';
    return null;
  }
}

function exportSaveJson() {
  if (!appState.league) return;
  const dataStr = JSON.stringify(appState.league);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `npsl-save-${appState.league.userTeamId}-${appState.league.seasonYear}-wk${appState.league.week}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function importSaveJsonFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      const migrated = migrateSave(parsed);
      stopPoolAnimation();
      appState.league = migrated;
      appState.lineupDraft = null;
      appState.activeMeetResult = null;
      appState.activeChampResult = null;
      appState.recordsTeamId = migrated.userTeamId;
      saveLeagueToStorage();
      applyUserTeamTheme();
      renderApp();
    } catch (err) {
      alert('Could not import save file: ' + (err.message || 'Invalid JSON'));
    }
  };
  reader.readAsText(file);
}

function getTeamById(teamId, league = appState.league) {
  return league.teams.find(t => t.id === teamId);
}

function findSwimmerById(swimmerId, league = appState.league) {
  for (const t of league.teams) {
    const s = t.roster.find(x => x.id === swimmerId) || (t.il || []).find(x => x.id === swimmerId);
    if (s) return { swimmer: s, team: t };
  }
  const fa = (league.freeAgents || []).find(x => x.id === swimmerId);
  if (fa) return { swimmer: fa, team: null };
  for (const t of league.teams) {
    const exp = (league.expiringSwimmers?.[t.id] || []).find(x => x.id === swimmerId);
    if (exp) return { swimmer: exp, team: t };
  }
  if (league.draft?.prospects) {
    const pr = league.draft.prospects.find(x => x.id === swimmerId);
    if (pr) return { swimmer: pr, team: null };
  }
  return null;
}

function formatMoney(amount) {
  if (!amount && amount !== 0) return '$0';
  if (Math.abs(amount) >= 1000000) {
    return '$' + (amount / 1000000).toFixed(2) + 'M';
  }
  return '$' + Math.round(amount / 1000) + 'K';
}

function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderTaperBadge(swimmer) {
  if (swimmer.injury) {
    return `<span class="badge badge-injured">IL (${swimmer.injury.weeksLeft}w)</span>`;

  const st = swimmer.taperState?.status || 'training';
  if (st === 'peaked') return `<span class="badge badge-peaked">Peaked (${swimmer.taperState.peakWeeksLeft}w)</span>`;
  if (st === 'resting') return `<span class="badge badge-resting">Rested</span>`;
  if (st === 'fading') return `<span class="badge badge-fading">Post-Peak</span>`;
  return `<span class="badge badge-training">In Training</span>`;
}

// --- CURRENT MATCHUP & LINEUP DRAFT HELPERS ---
function getCurrentUserMatchup(league = appState.league) {
  const uId = league.userTeamId;
  if (league.phase === 'regular') {
    const wkObj = league.schedule[league.week - 1];
    if (!wkObj) return null;
    const m = wkObj.matchups.find(x => x.homeTeamId === uId || x.awayTeamId === uId);
    if (!m) return null;
    return {
      type: 'dual',
      isPlayoff: false,
      week: league.week,
      cardType: m.cardType,
      isHome: m.homeTeamId === uId,
      homeTeam: getTeamById(m.homeTeamId),
      awayTeam: getTeamById(m.awayTeamId),
      opponent: getTeamById(m.homeTeamId === uId ? m.awayTeamId : m.homeTeamId),
      matchupObj: m
    };
  }
  if (league.phase === 'playoffs_r1' || league.phase === 'playoffs_r2') {
    const list = league.phase === 'playoffs_r1' ? (league.playoffs?.round1 || []) : (league.playoffs?.round2 || []);
    const m = list.find(x => x.homeTeamId === uId || x.awayTeamId === uId);
    if (!m) return { type: 'bye_or_eliminated', roundList: list };
    const isHome = m.homeTeamId === uId;
    const effectiveCard = (isHome && appState.chosenPlayoffCard) ? appState.chosenPlayoffCard : m.cardType;
    return {
      type: 'dual',
      isPlayoff: true,
      week: league.week,
      cardType: effectiveCard,
      canChooseCard: isHome,
      isHome,
      homeTeam: getTeamById(m.homeTeamId),
      awayTeam: getTeamById(m.awayTeamId),
      opponent: getTeamById(isHome ? m.awayTeamId : m.homeTeamId),
      matchupObj: m
    };
  }
  if (league.phase === 'championship') {
    const finalFourIds = (league.playoffs?.round2 || []).map(m => m.result?.winnerId).filter(Boolean);
    const inFinal = finalFourIds.includes(uId);
    return {
      type: 'championship',
      week: 17,
      inFinal,
      finalFourTeams: finalFourIds.map(id => getTeamById(id)).filter(Boolean)
    };
  }
  return null;
}

function ensureLineupDraft() {
  const league = appState.league;

  if (!match || match.type !== 'dual') return null;

  const key = `${league.seasonYear}-${league.phase}-${league.week}-${match.cardType}-${league.userTeamId}`;

}

function getSwimmerLoadInDraft(lineup) {
  const indCount = {};
  const totCount = {};
  if (!lineup) return { indCount, totCount };

  for (const g of ['F', 'M']) {
    for (const ids of Object.values(lineup.individual?.[g] || {})) {
      for (const id of ids) {
        indCount[id] = (indCount[id] || 0) + 1;
        totCount[id] = (totCount[id] || 0) + 1;
      }
    }
    for (const relObj of Object.values(lineup.relays?.[g] || {})) {
      for (const tag of ['A', 'B']) {
        for (const id of (relObj[tag] || [])) {
          totCount[id] = (totCount[id] || 0) + 1;
        }
      }
    }
  }
  for (const relObj of Object.values(lineup.relays?.X || {})) {
    for (const tag of ['A', 'B']) {
      for (const id of (relObj[tag] || [])) {
        totCount[id] = (totCount[id] || 0) + 1;
      }
    }
  }
  return { indCount, totCount };
}
