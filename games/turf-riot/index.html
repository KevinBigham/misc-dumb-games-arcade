    cx.restore();
  }

  if (g.activeRules.length) {
    cx.save();
    cx.font = 'bold 10px Arial, sans-serif'; cx.textAlign = 'left';
    cx.fillStyle = 'rgba(255,212,0,0.85)';
    g.activeRules.slice(0, 8).forEach((c, i) => cx.fillText('◆ ' + c.name, 12, 26 + i * 13));
    cx.restore();
  }

  cx.save();
  cx.font = 'bold 11px Arial, sans-serif'; cx.textAlign = 'right';
  cx.fillStyle = 'rgba(255,255,255,0.4)';
  const onOff = g.possession === g.userTeam;
  const hints = g.mode === GM.PRESNAP
    ? ['K = HIKE', 'L+K = HIKE w/ EXTRA BLOCKER', '1/2/3 = MOTION', 'WASD = MOVE']
    : onOff
      ? ['J = TURBO', 'J,J = SPIN', 'K = PASS (+W/S for lane)', '1/2/3 = DIRECT RECEIVER', 'L = JUMP/HURDLE', 'J+K = STIFF ARM', 'J+L = HIGH HURDLE', 'K = LATERAL (past LOS)']
      : ['J = TURBO', 'K = TACKLE', 'L = DIVE TACKLE', 'J+L = POWER TACKLE', 'J+K = PUSH', 'Q = SWITCH'];
  hints.forEach((h, i) => cx.fillText(h, W - 12, H - 12 - (hints.length - 1 - i) * 13));
  cx.restore();

  if (g.debug) {
    cx.save();
    cx.font = '11px monospace'; cx.fillStyle = '#8f8'; cx.textAlign = 'left';
    const lines = [
      `frame ${g.frame}  rngstate ${G.rng.s}`,
      `mode ${g.mode}  carrier ${g.carrier}  ball ${g.ball.mode}`,
      `pressure ${g.qbPressure.toFixed(2)}  diff ${T.DIFFICULTY[g.opt.difficulty].name}`,
      `assist ${g.opt.cpuAssist && !g.mods.noAssist ? 'ON' : 'OFF'}  randFum ${g.opt.randomFumbles && !g.mods.noRandomFumbles ? 'ON' : 'OFF'}`,
      `red = tackle radius | yellow = pair alignment budget`,
    ];
    lines.forEach((l, i) => cx.fillText(l, 12, H - 12 - (lines.length - 1 - i) * 13));
    cx.restore();
  }
}

const ui = { screen: 'title', sel: 0, homeSel: 0, awaySel: 1, col: 0, page: 0, prow: 0, codeDigits: '', codeMsg: '' };

function panel(x, y, w, h, title) {
  cx.save();
  cx.fillStyle = 'rgba(6,8,12,0.92)';
  roundRect(cx, x, y, w, h, 12); cx.fill();
  cx.strokeStyle = 'rgba(255,212,0,0.5)'; cx.lineWidth = 2; cx.stroke();
  if (title) {
    cx.fillStyle = '#ffd400'; cx.font = 'bold 15px Arial Black, sans-serif'; cx.textAlign = 'left';
    cx.fillText(title, x + 16, y + 26);
  }
  cx.restore();
}

function drawTitle(g) {
  cx.fillStyle = '#05070a'; cx.fillRect(0, 0, W, H);

  cx.save();
  for (let i = 0; i < 22; i++) {
    cx.globalAlpha = 0.05 + 0.03 * Math.sin(i + performance.now() / 700);
    cx.fillStyle = i % 2 ? '#e8552b' : '#3ddbd9';
    cx.fillRect(0, i * (H / 22), W, H / 44);
  }
  cx.restore();

  cx.textAlign = 'center';
  cx.save();
  cx.translate(W / 2, 96);
  cx.font = 'bold 62px Arial Black, sans-serif';
  cx.lineWidth = 12; cx.strokeStyle = '#000'; cx.strokeText('TURF RIOT', 0, 0);
  const gr = cx.createLinearGradient(0, -46, 0, 16);
  gr.addColorStop(0, '#fff3b0'); gr.addColorStop(0.55, '#ff9d1f'); gr.addColorStop(1, '#e8552b');
  cx.fillStyle = gr; cx.fillText('TURF RIOT', 0, 0);
  cx.font = 'bold 20px Arial Black, sans-serif';
  cx.fillStyle = '#3ddbd9'; cx.fillText("'00", 0, 26);
  cx.restore();

  cx.fillStyle = 'rgba(255,255,255,0.45)';
  cx.font = '12px Arial, sans-serif';
  cx.fillText('7-on-7  •  30 yards for a first down  •  no penalties  •  an original arcade game', W / 2, 150);

  const pw = 300, ph = 250, gap = 34;
  const lx = W / 2 - pw - gap / 2, rx = W / 2 + gap / 2;
  panel(lx, 180, pw, ph, 'HOME');
  panel(rx, 180, pw, ph, 'AWAY');
  TEAMS.forEach((t, i) => {
    for (const [side, px, sel] of [[0, lx, ui.homeSel], [1, rx, ui.awaySel]]) {
      const y = 208 + i * 26;
      const active = ui.col === side && ui.sel === 0;
      if (i === sel) {
        cx.fillStyle = active ? 'rgba(255,212,0,0.22)' : 'rgba(255,255,255,0.08)';
        cx.fillRect(px + 8, y - 1, pw - 16, 24);
      }
      cx.textAlign = 'left';
      cx.fillStyle = t.c1; cx.font = 'bold 13px Arial Black, sans-serif';
      cx.fillText('■', px + 16, y + 16);
      cx.fillStyle = i === sel ? '#fff' : 'rgba(255,255,255,0.55)';
      cx.font = 'bold 13px Arial, sans-serif';
      cx.fillText(`${t.city} ${t.nick}`, px + 34, y + 16);
    }
  });

  const oy = 452;
  panel(W / 2 - 320, oy, 640, 118, 'OPTIONS');
  const opts = [
    ['DIFFICULTY', T.DIFFICULTY[G.opt.difficulty].name],
    ['QUARTER LENGTH', (T.QUARTER_OPTIONS[G.opt.quarterIdx] / 60) + ' MIN'],
    ['QUICK PASS KEYS (1/2/3)', G.opt.quickPass ? 'ON' : 'OFF'],
    ['CPU ASSISTANCE', G.opt.cpuAssist ? 'ON' : 'OFF'],
    ['RANDOM FUMBLES', G.opt.randomFumbles ? 'ON' : 'OFF'],
  ];
  opts.forEach((o, i) => {
    const y = oy + 46 + i * 0;
    const col = i % 3, row = Math.floor(i / 3);
    const px = W / 2 - 300 + col * 205, py = oy + 48 + row * 32;
    const active = ui.sel === i + 1;
    if (active) { cx.fillStyle = 'rgba(255,212,0,0.18)'; cx.fillRect(px - 6, py - 15, 198, 24); }
    cx.textAlign = 'left';
    cx.fillStyle = active ? '#ffd400' : 'rgba(255,255,255,0.5)';
    cx.font = 'bold 10px Arial, sans-serif';
    cx.fillText(o[0], px, py - 4);
    cx.fillStyle = '#fff'; cx.font = 'bold 13px Arial Black, sans-serif';
    cx.fillText(o[1], px, py + 10);
  });

  cx.textAlign = 'center';
  const sy0 = oy + 140;
  const btns = ['HOUSE RULES', 'KICK OFF'];
  btns.forEach((b, i) => {
    const active = ui.sel === 6 + i;
    const bxx = W / 2 - 200 + i * 210;
    cx.fillStyle = active ? '#ffd400' : 'rgba(255,255,255,0.12)';
    roundRect(cx, bxx, sy0, 190, 34, 8); cx.fill();
    cx.fillStyle = active ? '#111' : '#fff';
    cx.font = 'bold 14px Arial Black, sans-serif';
    cx.fillText(b, bxx + 95, sy0 + 23);
  });
  cx.fillStyle = 'rgba(255,255,255,0.4)'; cx.font = '11px Arial, sans-serif';
  cx.fillText('ARROWS / WASD to navigate  •  ENTER or K to confirm  •  V = debug overlay', W / 2, H - 22);
}

function applyModifierSideEffects() {
  if (G.mods.noAssist) G.opt.cpuAssist = false;
  if (G.mods.noRandomFumbles) G.opt.randomFumbles = false;
  if (G.mods.noTargetHL) G.opt.targetHL = false;
  if (G.mods.smartCPU) G.opt.difficulty = 2;
}

function toggleRule(m) {
  if (G.mods[m.cell]) { delete G.mods[m.cell]; G.activeRules = G.activeRules.filter(c => c.cell !== m.cell); ui.codeMsg = m.name + ' — OFF'; }
  else { G.mods[m.cell] = true; G.activeRules.push(m); ui.codeMsg = m.name + ' — ON'; }
  applyModifierSideEffects();
}

function drawCodes(g) {
  cx.fillStyle = '#05070a'; cx.fillRect(0, 0, W, H);
  cx.textAlign = 'center';
  cx.fillStyle = '#ffd400'; cx.font = 'bold 34px Arial Black, sans-serif';
  cx.fillText('HOUSE RULES', W / 2, 58);
  cx.fillStyle = 'rgba(255,255,255,0.5)'; cx.font = '12px Arial, sans-serif';
  cx.fillText('ARROWS to move  •  K / ENTER to switch a rule on or off  •  ESC to go back', W / 2, 80);
  if (ui.codeMsg) {
    cx.fillStyle = '#3ddbd9'; cx.font = 'bold 14px Arial Black, sans-serif';
    cx.fillText(ui.codeMsg, W / 2, 112);
  }
  const cols = 3, colW = Math.min(300, (W - 80) / cols);
  const startX = W / 2 - (colW * cols) / 2;
  const perCol = Math.ceil(MODIFIERS.length / cols);
  cx.textAlign = 'left';
  MODIFIERS.forEach((m, i) => {
    const c = Math.floor(i / perCol), r = i % perCol;
    const px = startX + c * colW, py = 150 + r * 22;
    const on = !!G.mods[m.cell], cur = i === (ui.rsel || 0);
    if (on || cur) { cx.fillStyle = on ? 'rgba(255,212,0,0.16)' : 'rgba(255,255,255,0.08)'; cx.fillRect(px - 6, py - 13, colW - 12, 20); }
    if (cur) { cx.strokeStyle = '#3ddbd9'; cx.lineWidth = 1.5; cx.strokeRect(px - 6, py - 13, colW - 12, 20); }
    cx.font = 'bold 11px monospace';
    cx.fillStyle = on ? '#ffd400' : 'rgba(255,255,255,0.35)';
    cx.fillText(on ? 'ON ' : 'OFF', px, py);
    cx.font = 'bold 11px Arial, sans-serif';
    cx.fillStyle = on ? '#fff' : 'rgba(255,255,255,0.62)';
    cx.fillText(m.name, px + 34, py);
  });
}

function drawPlayCall(g) {
  const onOff = g.possession === g.userTeam;
  const list = onOff ? OFF_PLAYS.filter(p => p.page === ui.page) : DEF_PLAYS;
  const w = 660, h = 330, x = (W - w) / 2, y = H / 2 - h / 2;
  cx.fillStyle = 'rgba(0,0,0,0.55)'; cx.fillRect(0, 0, W, H);
  panel(x, y, w, h, onOff ? `OFFENSE — PAGE ${ui.page + 1}/3   (TAB / Q to change page)` : 'DEFENSE');

  const toGo = Math.max(0, Math.round(Math.abs(g.gainLine - g.los)));
  cx.textAlign = 'right';
  cx.fillStyle = '#fff'; cx.font = 'bold 13px Arial Black, sans-serif';
  cx.fillText(`${['1ST', '2ND', '3RD', '4TH'][clamp(g.down - 1, 0, 3)]} & ${toGo}  •  BALL ON ${yardLine(g.los)}`, x + w - 16, y + 26);

  const extra = [];
  if (onOff && g.down === 4) {
    const inEnemy = (g.dir > 0 && g.los > EZ + 50) || (g.dir < 0 && g.los < EZ + 50);
    if (inEnemy && T.FG_ONLY_ENEMY_TERRITORY) extra.push({ name: 'FIELD GOAL', special: 'fg' });
    if (!g.mods.noPunting) extra.push({ name: 'PUNT', special: 'punt' });
  }
  const all = list.concat(extra);
  ui.prow = clamp(ui.prow, 0, all.length - 1);

  all.forEach((p, i) => {
    const col = i % 2, row = Math.floor(i / 2);
    const px = x + 22 + col * (w / 2 - 12), py = y + 56 + row * 52;
    const sel = i === ui.prow;
    cx.fillStyle = sel ? 'rgba(255,212,0,0.2)' : 'rgba(255,255,255,0.05)';
    roundRect(cx, px, py, w / 2 - 34, 44, 8); cx.fill();
    if (sel) { cx.strokeStyle = '#ffd400'; cx.lineWidth = 2; cx.stroke(); }
    cx.textAlign = 'left';
    cx.fillStyle = sel ? '#ffd400' : '#fff';
    cx.font = 'bold 14px Arial Black, sans-serif';
    cx.fillText(p.name, px + 12, py + 20);
    cx.fillStyle = 'rgba(255,255,255,0.45)'; cx.font = '10px Arial, sans-serif';
    cx.fillText(p.special ? 'SPECIAL TEAMS' : (p.kind ? p.kind.toUpperCase() + ' PLAY' : 'COVERAGE'), px + 12, py + 34);

    if (p.routes) drawMiniRoutes(px + w / 2 - 110, py + 22, p);
  });

  cx.textAlign = 'center';
  cx.fillStyle = 'rgba(255,255,255,0.45)'; cx.font = '11px Arial, sans-serif';
  cx.fillText('ARROWS to choose  •  K / ENTER to call  •  routes drawn from the play bytecode', W / 2, y + h - 14);
}

function drawMiniRoutes(cxp, cyp, play) {
  cx.save();
  cx.translate(cxp, cyp);
  cx.strokeStyle = 'rgba(255,255,255,0.25)';
  cx.beginPath(); cx.moveTo(-6, 0); cx.lineTo(76, 0); cx.stroke();
  const cols = { WL: '#3ddbd9', WR: '#ff9d1f', RB: '#8ef05a' };
  for (const tag in play.routes) {
    let px = 4, py = tag === 'WL' ? -10 : tag === 'WR' ? 10 : -3;
    cx.strokeStyle = cols[tag] || '#fff'; cx.lineWidth = 1.6;
    cx.beginPath(); cx.moveTo(px, py);
    for (const op of play.routes[tag]) {
      if (op[0] === 'go') px += op[1] * 0.7;
      else if (op[0] === 'cut') { px += op[1] * 0.7; py += op[2] * 0.5; }
      else if (op[0] === 'hook') px -= 4;
      else continue;
      py = clamp(py, -17, 17); px = Math.min(px, 78);
      cx.lineTo(px, py);
    }
    cx.stroke();
    cx.fillStyle = cols[tag] || '#fff';
    cx.beginPath(); cx.arc(px, py, 2.2, 0, 7); cx.fill();
  }
  cx.restore();
}

function drawFinal(g) {
  cx.fillStyle = 'rgba(0,0,0,0.82)'; cx.fillRect(0, 0, W, H);
  cx.textAlign = 'center';
  cx.fillStyle = '#ffd400'; cx.font = 'bold 44px Arial Black, sans-serif';
  cx.fillText('FINAL', W / 2, 96);
  const winner = g.score[0] === g.score[1] ? null : (g.score[0] > g.score[1] ? g.home : g.away);
  cx.fillStyle = '#fff'; cx.font = 'bold 26px Arial Black, sans-serif';
  cx.fillText(`${g.home.id} ${g.score[0]}   —   ${g.away.id} ${g.score[1]}`, W / 2, 140);
  if (winner) { cx.fillStyle = winner.c1; cx.font = 'bold 18px Arial Black, sans-serif'; cx.fillText(winner.city + ' ' + winner.nick + ' WIN', W / 2, 172); }

  const rows = [['PASS YDS', 'pass'], ['RUSH YDS', 'rush'], ['TOUCHDOWNS', 'td'], ['SACKS', 'sack'], ['FUMBLES', 'fum'], ['INTERCEPTIONS', 'int'], ['COMP/ATT', null]];
  const y0 = 220;
  cx.font = 'bold 13px Arial, sans-serif';
  rows.forEach((r, i) => {
    const y = y0 + i * 26;
    cx.fillStyle = 'rgba(255,255,255,0.5)'; cx.textAlign = 'center';
    cx.fillText(r[0], W / 2, y);
    cx.fillStyle = '#fff'; cx.textAlign = 'right';
    cx.fillText(r[1] ? String(g.stats[0][r[1]]) : `${g.stats[0].comp}/${g.stats[0].att}`, W / 2 - 90, y);
    cx.textAlign = 'left';
    cx.fillText(r[1] ? String(g.stats[1][r[1]]) : `${g.stats[1].comp}/${g.stats[1].att}`, W / 2 + 90, y);
  });
  cx.textAlign = 'center'; cx.fillStyle = '#ffd400'; cx.font = 'bold 15px Arial Black, sans-serif';
  cx.fillText('PRESS ENTER FOR A NEW GAME', W / 2, H - 60);
}

function menuStep() {
  const g = G;
  if (g.mode === GM.MENU) {
    const upP = hit('up'), dnP = hit('down'), lfP = hit('left'), rtP = hit('right');
    if (ui.sel === 0) {
      if (lfP) ui.col = 0; if (rtP) ui.col = 1;
      if (upP) { if (ui.col === 0) ui.homeSel = (ui.homeSel + TEAMS.length - 1) % TEAMS.length; else ui.awaySel = (ui.awaySel + TEAMS.length - 1) % TEAMS.length; }
      if (dnP) { if (ui.col === 0) ui.homeSel = (ui.homeSel + 1) % TEAMS.length; else ui.awaySel = (ui.awaySel + 1) % TEAMS.length; }
      if (hit('pass') || hit('start')) ui.sel = 1;
    } else {
      if (upP) ui.sel = Math.max(0, ui.sel - 1);
      if (dnP) ui.sel = Math.min(7, ui.sel + 1);
      const flip = (rtP ? 1 : lfP ? -1 : 0);
      if (flip) {
        if (ui.sel === 1) g.opt.difficulty = (g.opt.difficulty + 3 + flip) % 3;
        if (ui.sel === 2) g.opt.quarterIdx = (g.opt.quarterIdx + 4 + flip) % 4;
        if (ui.sel === 3) g.opt.quickPass = !g.opt.quickPass;
        if (ui.sel === 4) g.opt.cpuAssist = !g.opt.cpuAssist;
        if (ui.sel === 5) g.opt.randomFumbles = !g.opt.randomFumbles;
      }
      if (hit('pass') || hit('start')) {
        if (ui.sel === 6) { g.mode = GM.CODES; ui.codeMsg = ''; }
        else if (ui.sel === 7) startMatch();
        else if (ui.sel >= 1 && ui.sel <= 5) {
          if (ui.sel === 1) g.opt.difficulty = (g.opt.difficulty + 1) % 3;
          if (ui.sel === 2) g.opt.quarterIdx = (g.opt.quarterIdx + 1) % 4;
          if (ui.sel === 3) g.opt.quickPass = !g.opt.quickPass;
          if (ui.sel === 4) g.opt.cpuAssist = !g.opt.cpuAssist;
          if (ui.sel === 5) g.opt.randomFumbles = !g.opt.randomFumbles;
        }
      }
    }
    if (ui.homeSel === ui.awaySel) ui.awaySel = (ui.awaySel + 1) % TEAMS.length;
  } else if (g.mode === GM.CODES) {
    const n = MODIFIERS.length, per = Math.ceil(n / 3);
    ui.rsel = ui.rsel || 0;
    if (hit('back')) g.mode = GM.MENU;
    else {
      if (hit('up')) ui.rsel = (ui.rsel + n - 1) % n;
      if (hit('down')) ui.rsel = (ui.rsel + 1) % n;
      if (hit('left')) ui.rsel = Math.max(0, ui.rsel - per);
      if (hit('right')) ui.rsel = Math.min(n - 1, ui.rsel + per);
      if (hit('pass') || hit('start')) toggleRule(MODIFIERS[ui.rsel]);
    }
  } else if (g.mode === GM.PLAYCALL) {
    const onOff = g.possession === g.userTeam;
    const list = onOff ? OFF_PLAYS.filter(p => p.page === ui.page) : DEF_PLAYS;
    const extra = [];
    if (onOff && g.down === 4) {
      const inEnemy = (g.dir > 0 && g.los > EZ + 50) || (g.dir < 0 && g.los < EZ + 50);
      if (inEnemy) extra.push({ special: 'fg' });
      if (!g.mods.noPunting) extra.push({ special: 'punt' });
    }
    const all = list.concat(extra);
    if (hit('up')) ui.prow = (ui.prow + all.length - 2) % all.length;
    if (hit('down')) ui.prow = (ui.prow + 2) % all.length;
    if (hit('left')) ui.prow = (ui.prow + all.length - 1) % all.length;
    if (hit('right')) ui.prow = (ui.prow + 1) % all.length;
    if (onOff && hit('switch')) { ui.page = (ui.page + 1) % 3; ui.prow = 0; }
    if (hit('pass') || hit('start')) {
      const p = all[ui.prow];
      if (p && p.special === 'fg') { g.attemptFG(); ui.prow = 0; return; }
      if (p && p.special === 'punt') { g.punt(); ui.prow = 0; return; }
      if (onOff) g.playIdx = OFF_PLAYS.indexOf(p);
      else g.defIdx = DEF_PLAYS.indexOf(p);

      if (g.mods.noPlaySelect) { g.playIdx = g.rng.n(OFF_PLAYS.length); g.defIdx = g.rng.n(DEF_PLAYS.length); }
      g.setupPlay();
      ui.prow = 0;
    }
  } else if (g.mode === GM.FINAL) {
    if (hit('start') || hit('pass')) { g.mode = GM.MENU; ui.sel = 0; }
  }
  if (hit('debug')) g.debug = !g.debug;
}

function startMatch() {
  const savedMods = G.mods, savedCodes = G.activeRules, savedOpt = G.opt;
  G.newGame(ui.homeSel, ui.awaySel);
  G.mods = savedMods; G.activeRules = savedCodes; G.opt = savedOpt;
  applyModifierSideEffects();
  G.userTeam = 0;
  G.pickCpuPlays();
  ui.page = 0; ui.prow = 0;
  cam.x = G.los;
}

let G = new Game(20260802);
G.newGame(0, 1);
G.mode = GM.MENU;
resize();

let acc = 0, last = performance.now();

function frame(now) {
  const dtReal = Math.min(0.25, (now - last) / 1000);
  last = now;
  acc += dtReal;

  let steps = 0;
  while (acc >= T.TICK && steps < 5) {
    menuStep();
    if ((G.mode === GM.PRESNAP || G.mode === GM.LIVE || G.mode === GM.DEAD || G.mode === GM.SCORE)) {
      G.step(sampleInput());
    }
    clearEdges();
    acc -= T.TICK;
    steps++;
  }
  if (steps === 0) {  }

  updateCam(G, dtReal);

  if (G.mode === GM.MENU) { drawTitle(G); }
  else if (G.mode === GM.CODES) drawCodes(G);
  else {
    drawField(G);
    const sorted = G.actors.slice().sort((a, b) => (a.y + a.x * 0.0001) - (b.y + b.x * 0.0001));
    for (const a of sorted) drawActor(G, a);
    drawBall(G);
    drawWeather(G);
    drawHUD(G);
    if (G.mode === GM.PLAYCALL) drawPlayCall(G);
    if (G.mode === GM.FINAL) drawFinal(G);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
