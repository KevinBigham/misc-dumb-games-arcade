<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meridian Football League</title>
<style>
:root{--bg:#090c11;--bg2:#10151d;--bg3:#161d28;--ln:#242e3d;--tx:#e8ebf1;--mu:#8793a6;--ac:#f2b705;--ac2:#0b2545;--good:#3ddc84;--bad:#ff5d5d;--warn:#ffb020;--mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;--cond:"Avenir Next Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{background:linear-gradient(180deg,#0c1118 0,var(--bg) 240px) fixed}
a{color:var(--tx);text-decoration:none;border-bottom:1px dotted #4a5870}
a:hover{color:var(--ac);border-color:var(--ac)}
a.tm{border:0;font-family:var(--cond);font-weight:700;letter-spacing:.04em;padding:1px 6px 1px 7px;border-left:3px solid var(--c);background:#1a2230;white-space:nowrap}
a.tm:hover{background:#243044}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--bg3);border:1px solid var(--ln);color:var(--tx);padding:6px 11px;cursor:pointer;font-family:var(--cond);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--ac);color:var(--ac)}
.btn.pri{background:var(--ac);color:#0a0d12;border-color:var(--ac)}
.btn.pri:hover{filter:brightness(1.12);color:#0a0d12}
.btn.sm{padding:2px 7px;font-size:11.5px}
.btn.dng:hover{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
select,input[type=text],input[type=number]{background:#0c1118;border:1px solid var(--ln);padding:5px 7px;min-width:0}
select:focus,input:focus,.btn:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
/* top bar */
#top{position:sticky;top:0;z-index:30;background:#070a0e;border-bottom:1px solid var(--ln)}
.bar{display:flex;align-items:stretch;gap:0;min-height:48px}
.brand{display:flex;align-items:center;gap:9px;padding:0 14px 0 12px;background:var(--ac2);border-right:4px solid var(--ac);transform:skewX(-12deg);margin-left:-8px;padding-left:20px}
.brand>*{transform:skewX(12deg)}
.brand b{font-family:var(--cond);font-size:21px;font-style:italic;letter-spacing:.03em;color:#fff;line-height:1}
.brand small{display:block;font-family:var(--mono);font-size:10.5px;color:#fff;opacity:.85}
.clock{display:flex;flex-direction:column;justify-content:center;padding:0 14px;font-family:var(--cond);text-transform:uppercase;letter-spacing:.07em;border-right:1px solid var(--ln)}
.clock b{font-size:15px;color:var(--ac)}.clock span{font-size:11px;color:var(--mu)}
.capbox{display:flex;flex-direction:column;justify-content:center;padding:0 14px;font-family:var(--mono);font-size:12px;border-right:1px solid var(--ln)}
.capbox span{color:var(--mu);font-size:10.5px;font-family:var(--cond);letter-spacing:.08em;text-transform:uppercase}
.sp{flex:1}
.adv{display:flex;align-items:center;gap:6px;padding:6px 10px;position:relative}
.adv .btn.pri{font-size:14px;padding:8px 16px}
.menu{position:absolute;right:10px;top:100%;background:var(--bg2);border:1px solid var(--ac);min-width:270px;z-index:40;box-shadow:0 12px 30px #000a}
.menu button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--ln);background:none;padding:10px 12px;cursor:pointer}
.menu button:hover{background:var(--bg3);color:var(--ac)}
.menu small{display:block;color:var(--mu);font-size:11.5px}
nav{display:flex;overflow-x:auto;background:#0c1017;border-top:1px solid #151b25;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{border:0;padding:8px 13px;font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);white-space:nowrap;border-bottom:3px solid transparent}
nav a:hover{color:var(--tx)}
nav a.on{color:var(--tx);border-bottom-color:var(--ac);background:linear-gradient(0deg,#1a2230,transparent)}
nav a .dot{display:inline-block;width:7px;height:7px;background:var(--warn);border-radius:50%;margin-left:5px;vertical-align:1px}
main{padding:14px;max-width:1500px;margin:0 auto}
/* headings: broadcast lower-third */
h1{font-family:var(--cond);font-style:italic;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin:0 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1:before{content:"";width:8px;height:26px;background:var(--ac);transform:skewX(-12deg)}
h1 small{font-family:var(--mono);font-style:normal;font-size:12px;color:var(--mu);text-transform:none;letter-spacing:0}
h2{font-family:var(--cond);font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin:0;padding:7px 10px;background:linear-gradient(90deg,var(--ac2),transparent 85%);border-left:4px solid var(--ac);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 a,h2 span.r{font-size:11px;letter-spacing:.06em;color:#fff;opacity:.8;border:0;font-weight:400}
.card{background:var(--bg2);border:1px solid var(--ln);margin-bottom:14px}
.card .pad{padding:10px 12px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,1fr);align-items:start}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
.grid>div{min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tabs .btn.on{background:var(--ac);color:#0a0d12;border-color:var(--ac)}
/* tables */
.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:13px}
.t th{position:sticky;top:0;background:#0c1118;color:var(--mu);font-family:var(--cond);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;text-align:left;padding:6px 8px;border-bottom:1px solid var(--ln);white-space:nowrap;font-weight:700}
.t th.srt{cursor:pointer}.t th.srt:hover,.t th.on{color:var(--ac)}
.t td{padding:5px 8px;border-bottom:1px solid #192130;white-space:nowrap}
.t tr:nth-child(even) td{background:#0e131b}
.t tr:hover td{background:#1a2333}
.t .n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.t .ctr{text-align:center}
.t tr.me td{background:color-mix(in srgb,var(--ac) 13%,#10151d)}
.t tr.cut td{border-bottom:2px dashed var(--ac)}
.mut{color:var(--mu)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mono{font-family:var(--mono)}.ctr{text-align:center}.rt{text-align:right}
.ov{display:inline-block;min-width:27px;text-align:center;font-family:var(--mono);font-weight:700;padding:0 4px;background:#222b3a;border-bottom:2px solid #55627a}
.ov.o9{background:#3b2f00;border-color:#ffd23f;color:#ffe27a}.ov.o8{background:#0f3323;border-color:#3ddc84;color:#8ff0bb}.ov.o7{border-color:#6ea8ff}.ov.o5{color:var(--mu);border-color:#3a4558}
.pos{font-family:var(--cond);font-weight:700;letter-spacing:.05em;color:var(--mu)}
.tag{display:inline-block;font-family:var(--cond);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:1px 6px;border:1px solid var(--ln);color:var(--mu);vertical-align:1px}
.tag.inj{border-color:var(--bad);color:var(--bad)}.tag.ir{border-color:var(--bad);background:var(--bad);color:#000}.tag.ac{border-color:var(--ac);color:var(--ac)}.tag.g{border-color:var(--good);color:var(--good)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}.kv dt{color:var(--mu);font-family:var(--cond);letter-spacing:.07em;text-transform:uppercase;font-size:11.5px;padding-top:2px}.kv dd{margin:0;font-family:var(--mono)}
.meter{height:9px;background:#0b0f15;border:1px solid var(--ln);position:relative;min-width:80px}.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--ac)}
.rbar{display:grid;grid-template-columns:110px 30px 1fr;gap:8px;align-items:center;font-size:12.5px;margin:3px 0}.rbar b{font-family:var(--mono);text-align:right}
.news{list-style:none;margin:0;padding:0}.news li{padding:7px 12px;border-bottom:1px solid #192130;font-size:13px;display:grid;grid-template-columns:64px 1fr;gap:8px}
.news li.big{border-left:3px solid var(--ac);background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 9%,transparent),transparent 60%)}
.news time{font-family:var(--mono);font-size:10.5px;color:var(--mu);padding-top:2px}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px 16px;background:linear-gradient(100deg,var(--c1) 0,var(--c1) 45%,#10151d 45.2%);border:1px solid var(--ln);border-bottom:4px solid var(--c2);margin-bottom:14px}
.hero h1{margin:0;color:#fff;text-shadow:0 2px 0 #0008}.hero h1:before{background:var(--c2)}
.hero .big{font-family:var(--cond);font-size:34px;font-style:italic;font-weight:800;line-height:1}
.hero .meta{font-family:var(--mono);font-size:12px;color:#fff;opacity:.9}
.stat{display:inline-block;margin-right:18px}.stat b{display:block;font-family:var(--mono);font-size:19px}.stat span{font-family:var(--cond);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:#05070a;border:1px solid var(--ln);border-bottom:4px solid var(--ac)}
.sb .side{display:flex;align-items:center;gap:12px;padding:12px 16px;border-left:8px solid var(--c)}
.sb .side.r{flex-direction:row-reverse;border-left:0;border-right:8px solid var(--c);text-align:right}
.sb .nm{font-family:var(--cond);font-size:20px;font-weight:800;font-style:italic;text-transform:uppercase;line-height:1.05}.sb .nm small{display:block;font-family:var(--mono);font-size:11px;font-style:normal;color:var(--mu);font-weight:400}
.sb .pts{font-family:var(--mono);font-size:40px;font-weight:700;min-width:56px;text-align:center}
.sb .mid{padding:6px 16px;text-align:center;font-family:var(--cond);letter-spacing:.1em;text-transform:uppercase;background:#10151d;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.sb .mid b{font-family:var(--mono);font-size:19px;color:var(--ac);letter-spacing:0}
.field{position:relative;height:34px;margin:8px 0;background:repeating-linear-gradient(90deg,#123a22 0,#123a22 calc(10% - 1px),#2c6b45 calc(10% - 1px),#2c6b45 10%);border:1px solid var(--ln)}
.field .ball{position:absolute;top:3px;bottom:3px;width:5px;background:#fff;box-shadow:0 0 8px #fff;transition:left .25s}
.field .ez{position:absolute;top:0;bottom:0;width:6%;opacity:.85}
.field .ld{position:absolute;top:0;bottom:0;border-left:2px solid #ffd23f;transition:left .25s}
.tick{max-height:52vh;overflow-y:auto;font-size:13px}.tick div{padding:5px 12px;border-bottom:1px solid #192130;display:grid;grid-template-columns:104px 1fr;gap:10px}
.tick .k1{color:#fff}.tick .k2{background:color-mix(in srgb,var(--ac) 16%,transparent);color:#fff;font-weight:700;border-left:3px solid var(--ac)}.tick .k3{background:#0b0f15;color:var(--ac);font-family:var(--cond);letter-spacing:.1em;text-transform:uppercase;text-align:center;grid-template-columns:1fr}
.tick small{font-family:var(--mono);color:var(--mu);font-size:11px}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tcard{border:1px solid var(--ln);border-left:8px solid var(--c1);background:var(--bg2);padding:10px 12px;cursor:pointer;text-align:left;display:block;width:100%}
.tcard:hover{border-color:var(--c2);background:var(--bg3)}
.tcard b{font-family:var(--cond);font-size:18px;font-style:italic;text-transform:uppercase;display:block}
.tcard .l{font-family:var(--mono);font-size:11.5px;color:var(--mu);display:block}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#05070a;border:1px solid var(--ac);border-left:6px solid var(--ac);padding:10px 16px;z-index:90;max-width:92vw;box-shadow:0 10px 30px #000c}
#toast.bad{border-color:var(--bad)}#toast.good{border-color:var(--good)}
#modal{position:fixed;inset:0;background:#000b;z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:6vh 12px;overflow:auto}
#modal .box{background:var(--bg2);border:1px solid var(--ac);max-width:640px;width:100%}
#modal .pad{padding:14px}
.splash{max-width:1100px;margin:0 auto;padding:30px 16px}
.splash .logo{font-family:var(--cond);font-style:italic;font-weight:800;font-size:54px;line-height:.95;text-transform:uppercase;border-left:14px solid var(--ac);padding-left:16px;margin-bottom:6px}
.splash .logo span{color:var(--ac)}
.flag{font-family:var(--cond);font-weight:700;letter-spacing:.08em;padding:1px 7px;font-size:11.5px}.flag.ok{background:#0f3323;color:#8ff0bb}.flag.out{background:#4a1010;color:#ffb0b0}
label.f{display:flex;flex-direction:column;gap:3px;font-family:var(--cond);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.dc{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.dc ol{margin:0;padding:0;list-style:none}.dc li{display:flex;align-items:center;gap:6px;padding:4px 8px;border-bottom:1px solid #192130;font-size:13px}.dc li.st{background:color-mix(in srgb,var(--ac) 8%,transparent)}.dc li .g{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dc li i{font-family:var(--mono);font-style:normal;color:var(--mu);font-size:11px;width:14px}
@media(max-width:900px){.c3,.c4,.c5,.c6,.c7,.c8,.c9{grid-column:span 12}main{padding:9px}.capbox.x{display:none}.brand small{display:none}.sb .nm{font-size:14px}.sb .pts{font-size:28px;min-width:40px}.sb .side{padding:8px;gap:6px}.hero{background:linear-gradient(100deg,var(--c1) 0,var(--c1) 100%)}.splash .logo{font-size:36px}.tick div{grid-template-columns:78px 1fr}h1{font-size:21px}}
@media(max-width:560px){.bar{flex-wrap:wrap}.adv{flex:1 0 100%;justify-content:flex-end;border-top:1px solid var(--ln);padding:5px 8px}.adv .btn.pri{flex:1}.sp{display:none}.capbox{flex:1}.clock span{display:none}.adv .btn.pri{padding:8px 10px;font-size:12.5px}.brand{padding-right:8px}.brand b{font-size:16px}.clock{padding:0 8px}.capbox{padding:0 8px}}

</style></head>

  h += '<div class="grid"><div class="c8"><div class="card"><h2>Football Environment</h2>' + tbl('health', [{ h: 'Metric', v: function (x) { return x.m[0]; } }, { h: 'Target', c: 'n', v: function (x) { return x.base != null ? 'start ' + x.base.toFixed(1) : x.m[1]; } }, { h: 'Average', c: 'n', v: function (x) { return '<b>' + x.avg.toFixed(x.m[5]) + '</b>'; } }, { h: 'Low', c: 'n', v: function (x) { return x.mn.toFixed(x.m[5]); } }, { h: 'High', c: 'n', v: function (x) { return x.mx.toFixed(x.m[5]); } }, { h: 'First yr', c: 'n', v: function (x) { return x.f.toFixed(x.m[5]); } }, { h: 'Last yr', c: 'n', v: function (x) { return x.l.toFixed(x.m[5]); } }, { h: 'Status', v: function (x) { return x.ok ? '<span class="flag ok">OK</span>' : '<span class="flag out">OUT</span>'; } }], rows) + '</div></div>';
  h += '<div class="c4"><div class="card"><h2>Integrity</h2><div class="tw"><table class="t"><tbody>' + integ.map(function (x) { return '<tr><td style="white-space:normal">' + x[0] + '</td><td class="n">' + x[1] + '</td><td>' + (x[2] ? '<span class="flag ok">OK</span>' : '<span class="flag out">FAIL</span>') + '</td></tr>'; }).join('') + '</tbody></table></div>' + (H.bad.length ? '<div class="pad bad mono" style="white-space:normal;font-size:12px">' + H.bad.slice(0, 8).map(esc).join('<br>') + '</div>' : '') + '</div>';
  h += '<div class="card"><h2>Champions in This Run</h2><div class="pad">' + Object.keys(H.champs).sort(function (a, b) { return H.champs[b] - H.champs[a]; }).map(function (k) { return tl(+k) + ' <span class="mono">' + H.champs[k] + '</span>'; }).join(' &nbsp; ') + '</div></div></div></div>';
  return h;
};
ACT.healthRun = function () {
  var n = +(S.filt.hn || 25), C = JSON.parse(JSON.stringify(L)); C.userTid = -1; C.gm.fired = false; C.set.autoGM = true;
  var g0 = 0; while (C.phase !== 'REG' && g0++ < 40) { if (C.phase === 'PO') GE.simPlayoffRound(C); else GE.advanceOffseason(C); }
  var st0 = GE.stateMetrics(C), base = {}; HM.forEach(function (m) { if (m[6]) base[m[0]] = m[4]({ st: st0 }); });
  S.health = { n: n, i: 0, rows: [], bad: [], L: C, running: true, t0: Date.now(), m0: GE.dbg.mismatch, c0: GE.dbg.checks, mis: 0, checks: 0, base: base, champs: {}, size: 0 };
  render(); setTimeout(healthStep, 30);
};
function healthStep() {
  var H = S.health; if (!H || !H.running) return;
  try {
    var m = GE.simOneSeason(H.L), st = GE.stateMetrics(H.L), inv = GE.checkInvariants(H.L, true), hs = H.L.hist.seasons, ch = hs[hs.length - 1].champ;
    H.rows.push({ y: H.L.year - 1, m: m, st: st, inv: inv.length }); inv.slice(0, 3).forEach(function (x) { H.bad.push((H.L.year - 1) + ': ' + x); });
    H.champs[ch] = (H.champs[ch] || 0) + 1; H.mis = GE.dbg.mismatch - H.m0; H.checks = GE.dbg.checks - H.c0; H.i++;
  } catch (e) { H.bad.push('Simulation error: ' + e.message); H.running = false; }
  if (H.i >= H.n) H.running = false;
  if (!H.running) { H.t1 = Date.now(); try { H.size = JSON.stringify(H.L).length; } catch (e) { } H.L = null; }
  if (S.r === 'health') render();
  if (H.running) setTimeout(healthStep, 0);
}
ACT.healthStop = function () { if (S.health) { S.health.running = false; S.health.t1 = Date.now(); S.health.L = null; } render(); };

// ---------- boot ----------
(function boot() {
  var o = loadLocal();
  if (o && o.userTid >= 0) { L = o; theme(); var h = location.hash.replace(/^#\/?/, ''); S.r = h && PAGES[h.split('/')[0]] && h.indexOf('live') !== 0 ? h : 'hub'; }
  render();
})();
})();
