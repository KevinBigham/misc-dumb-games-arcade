<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Metaphysical Deli at the End of Your Forehead | Argon Game 11</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100dvh;
        background: #04020a;
        color: #f8fafc;
      }
      #metaphysical-deli-root {
        width: 100%;
        min-height: 100dvh;
        display: flex;
      }
    </style>
  </head>
  <body>
    <main id="metaphysical-deli-root"></main>
    <script type="module">
      import { mountGame } from './src/index.ts';
      if (typeof HTMLButtonElement !== 'undefined' && !('commandForElement' in HTMLButtonElement.prototype)) {
        import('invokers-polyfill');
      }
      if (typeof HTMLElement !== 'undefined' && !('popover' in HTMLElement.prototype)) {
        import('@oddbird/popover-polyfill');
      }
      const container = document.getElementById('metaphysical-deli-root');
      if (container) {
        mountGame(container);
      }
    </script>
  </body>
</html>
