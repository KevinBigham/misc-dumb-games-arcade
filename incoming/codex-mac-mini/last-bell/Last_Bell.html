<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A four-round classroom business simulation. Set a price, choose inventory, and explain the profit. Works offline.">
<title>Last Bell · The School Store Challenge</title>
<style>
:root{color-scheme:dark;--bg:#111312;--panel:#1b1e1b;--ink:#f3f1e9;--muted:#b5b9b0;--line:#3c443c;--green:#d3ef94;--red:#ffb2a0;--gold:#f1d28a;font-family:Arial,Helvetica,sans-serif;font-size:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5}button,select,input{font:inherit}button,select{cursor:pointer}button,a,select,input{touch-action:manipulation}button:focus-visible,select:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:4px}button{border:1px solid var(--line);color:var(--ink);background:var(--panel);padding:12px 18px;border-radius:5px;font-weight:700}button:hover{border-color:var(--green)}button:disabled{opacity:.45;cursor:default}button.primary{background:var(--green);color:#182014;border-color:var(--green)}button.quiet{background:transparent}select{color:var(--ink);background:#101410;border:1px solid #77816e;border-radius:4px;padding:10px 12px;min-width:108px}a{color:var(--green)}header{border-bottom:1px solid var(--line);padding:20px 5vw;display:flex;justify-content:space-between;align-items:center;gap:20px}.wordmark{font-size:22px;font-weight:800;letter-spacing:-.8px}.edition{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}main{max-width:1180px;margin:auto;padding:42px 34px 80px}h1{font-size:clamp(38px,6vw,78px);letter-spacing:-3px;line-height:1.02;margin:14px 0 26px;max-width:880px}h2{font-size:30px;line-height:1.15;letter-spacing:-.7px;margin:0 0 18px}h3{font-size:20px;margin:0 0 10px}p{margin:0 0 18px}.lede{font-size:23px;max-width:760px;color:#dbdfd4}.eyebrow{color:var(--green);font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase}.grid{display:grid;grid-template-columns:1.45fr 1fr;gap:44px}.panel{background:var(--panel);border:1px solid var(--line);padding:26px;border-radius:6px}.rules{margin:0;padding-left:22px}.rules li{margin:10px 0}.muted{color:var(--muted)}.small{font-size:14px}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.spaced{justify-content:space-between}.actions{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap}.divider{border-top:1px solid var(--line);padding-top:25px;margin-top:30px}.steps{display:flex;gap:10px;margin-bottom:28px;flex-wrap:wrap}.step{padding:5px 12px;border:1px solid var(--line);color:var(--muted);font-size:14px}.step.active{color:var(--green);border-color:var(--green)}.factrow{display:flex;gap:30px;flex-wrap:wrap;margin:24px 0}.fact b{display:block;font-size:28px;line-height:1.2}.fact span{font-size:14px;color:var(--muted)}.prompt{border-left:3px solid var(--green);padding-left:18px;margin:24px 0;font-size:22px}.tablewrap{overflow-x:auto;margin:22px 0}table{border-collapse:collapse;width:100%;text-align:left;font-variant-numeric:tabular-nums}th{color:var(--muted);font-size:13px;font-weight:500}td,th{padding:14px 10px;border-bottom:1px solid var(--line);white-space:nowrap}tbody th{color:var(--ink);font-size:18px;font-weight:700}td:first-child,th:first-child{padding-left:0}td:last-child,th:last-child{padding-right:0}.gain{color:var(--green);font-weight:700}.loss{color:var(--red);font-weight:700}.totals{font-size:23px;font-weight:700}details{margin-top:24px;border-top:1px solid var(--line);padding-top:16px}summary{cursor:pointer;font-weight:700}details>div{margin:16px 0}footer{padding:22px 5vw;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;gap:18px;justify-content:space-between;flex-wrap:wrap}.status{font-size:13px;color:var(--muted);min-height:20px;margin-top:20px}.money{font-variant-numeric:tabular-nums}.score{font-size:48px;line-height:1.1;font-weight:700;color:var(--green)}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.note{padding:14px 18px;background:#262b22;border:1px solid #596549;border-radius:5px}.error{color:var(--red)}[hidden]{display:none!important}
@media(max-width:720px){main{padding:28px 20px 50px}.grid{grid-template-columns:1fr;gap:25px}h1{letter-spacing:-1.8px}.edition{display:none}.panel{padding:20px}.lede{font-size:20px}td,th{padding:12px 8px}.factrow{gap:20px}header{padding:16px 20px}button{padding:12px 14px}select{min-width:90px}}
@media print{body{background:white;color:black;font-size:12pt}header,footer,.actions,.status,button,details,.steps{display:none!important}main{padding:0}h1{font-size:32pt;color:black}h2{font-size:20pt}.panel{background:white;border:1px solid #999}.gain,.loss,.muted,th,.score,.eyebrow{color:black}td,th{border-color:#bbb}.tablewrap{overflow:visible}tr{break-inside:avoid}.grid{display:block}.panel{margin-bottom:20px}.note{background:white;color:black}.fact b{font-size:18pt}}
</style>
</head>
<body>
<header><div class="wordmark">Last Bell<span style="color:var(--green)">.</span></div><div class="edition">The School Store Challenge / 1.0</div><button id="helpButton" class="quiet" type="button">How to play</button></header>
<main id="app"></main>
<footer><span>One classroom. Four decisions. No accounts.</span><span>Offline edition · No analytics or network requests · v1.0</span></footer>
<script>
'use strict';
const ROUNDS=Object.freeze([
 {title:'An ordinary afternoon',forecast:'The same students will pass your drink stand as usual. Use yesterday’s sales as your starting point.',cost:100,fee:1000,demand:{2:38,3:28,4:18},reveal:'A normal crowd. Your price changed how many people wanted to buy.',question:'Did selling the most drinks also produce the most profit?',hint:'Yesterday, a similar stand saw demand of 38 drinks at $2, 28 at $3, and 18 at $4.'},
 {title:'The hot afternoon',forecast:'It is hotter than yesterday. More people want a cold drink at every price. Inventory still costs $1 per drink.',cost:100,fee:1000,demand:{2:48,3:38,4:28},reveal:'The heat brought 10 more buyers at each price than on the ordinary afternoon.',question:'What changed: your price, or the number of customers who wanted a drink at each price?',hint:'Look back at Round 1 demand. Decide how much extra stock the heat might justify.'},
 {title:'The quiet afternoon',forecast:'Rain has moved the after-school activities indoors. Fewer students will pass your outdoor stand.',cost:100,fee:1000,demand:{2:28,3:18,4:8},reveal:'Demand fell by 10 drinks at each price compared with the ordinary afternoon.',question:'How did unsold stock change the result? A low cost per drink does not make extra stock free.',hint:'Choose your price and stock before you learn exactly how many customers show up.'},
 {title:'The big game',forecast:'A school game will bring a larger crowd. Your supplier raises the cost to $1.50 per drink. The stand fee stays $10.',cost:150,fee:1000,demand:{2:50,3:38,4:26},reveal:'The crowd was larger, but every drink you stocked cost more, including the ones you did not sell.',question:'Could a team bring in more revenue and still make less profit? Use two results to prove it.',hint:'The $100 daily budget stays the same. You can still afford every listed stock option.'}
]);
const KEY='last-bell-v1';
const money=cents=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:cents%100===0?0:2}).format(cents/100);
function calculate(round,price,stock){
 if(!Number.isInteger(round)||round<0||round>=ROUNDS.length||![2,3,4].includes(price)||![20,30,40].includes(stock))throw new Error('Choose a listed round, price, and stock quantity.');
 const r=ROUNDS[round],demand=r.demand[price],sold=Math.min(stock,demand),cost=stock*r.cost+r.fee,revenue=sold*price*100;
 return {demand,sold,unsold:stock-sold,missed:Math.max(0,demand-stock),cost,revenue,profit:revenue-cost};
}
const fresh=()=>({v:1,started:false,round:0,revealed:false,checked:false,teamCount:4,choices:Array.from({length:4},()=>Array.from({length:4},()=>({price:3,stock:30})))});
function valid(s){return s&&s.v===1&&typeof s.started==='boolean'&&Number.isInteger(s.round)&&s.round>=0&&s.round<4&&typeof s.revealed==='boolean'&&typeof s.checked==='boolean'&&(!s.checked||s.revealed)&&Number.isInteger(s.teamCount)&&s.teamCount>=1&&s.teamCount<=8&&Array.isArray(s.choices)&&s.choices.length===4&&s.choices.every(x=>Array.isArray(x)&&x.length===s.teamCount&&x.every(c=>c&&[2,3,4].includes(c.price)&&[20,30,40].includes(c.stock)));}
let state=fresh(),storageOK=true,help=false;
try{const saved=JSON.parse(localStorage.getItem(KEY));if(valid(saved))state=saved;}catch(e){storageOK=false;}
const app=document.getElementById('app');
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}updateStatus();}
function updateStatus(){const e=document.getElementById('status');if(e)e.textContent=storageOK?'Progress saved in this browser. Use Save session for a portable copy.':'Browser storage is unavailable. Keep this tab open, or use Save session.';}
function total(team){let sum=0;for(let i=0;i<=state.round;i++){if(i===state.round&&!state.revealed)break;const c=state.choices[i][team];sum+=calculate(i,c.price,c.stock).profit;}return sum;}
function teamName(i){return 'Team '+String.fromCharCode(65+i);}
function download(name,type,data){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function sessionButtons(){return '<div class="actions"><button type="button" id="saveSession" class="quiet">Save session</button><button type="button" id="loadSession" class="quiet">Load session</button><input type="file" id="sessionFile" accept=".json,application/json" hidden><button type="button" id="restart" class="quiet">New class</button></div><p id="status" class="status" role="status"></p>';}
function render(){
 if(help){app.innerHTML=`<div class="eyebrow">Teacher quick start</div><h1>Make a choice.<br>Show your reasoning.</h1><div class="grid"><div><h2>Run it from one screen</h2><ol class="rules"><li>Give each team the two-page Student Sheet. Choose 1–8 teams. Use team letters, not student names.</li><li>Read the forecast aloud. Students think independently for 30 seconds, then agree on a price and stock level.</li><li>All teams record and lock their choices on paper before you enter them here.</li><li>Select <b>Reveal demand</b>. Students calculate, then select <b>Check the results</b> to show the answers.</li><li>Discuss one result, rotate roles, and start the next round. Finish with the individual exit ticket.</li></ol></div><div class="panel"><h3>The rules that matter</h3><ul class="rules"><li>Each round is a separate day with a fresh $100 budget.</li><li>Price: $2, $3, or $4. Stock: 20, 30, or 40 drinks.</li><li>Demand means people willing and able to buy at your chosen price.</li><li>Sales cannot exceed either stock or demand.</li><li>Pay for all stock plus the $10 daily stand fee.</li><li>Unsold prepared drinks are discarded; they have no resale value.</li><li>Add the four daily profits. Cash and inventory do not carry over.</li></ul></div></div><div class="divider"><p><b>45-minute plan:</b> 0–5 setup; 5–9 worked example; 9–33 four rounds; 33–40 comparison; 40–45 exit ticket.</p><p class="muted small">The scenarios are a simplified, fixed teaching model. Teams operate separate identical stands; they do not steal customers from one another. Demand is revealed after choices. Anyone inspecting the file can see the scenarios, so keep the teacher file on the projected device.</p><p class="muted small">Print the supplied PDFs if your school blocks downloaded HTML. On iPad or locked-down Chromebooks, use the PDF version. No internet is required after download.</p><button type="button" class="primary" id="back">Back to game</button></div>`;
 document.getElementById('back').onclick=()=>{help=false;render();};return;}
 if(!state.started){app.innerHTML=`<div class="eyebrow">A 45-minute business simulation / Grades 8–12</div><h1>Busy stand.<br>Empty cash box?</h1><p class="lede">Four afternoons. A drink stand. You choose the price and how much to stock. The crowd decides the rest.</p><div class="grid divider"><div><div class="factrow"><div class="fact"><b>$100</b><span>fresh budget each round</span></div><div class="fact"><b>4 rounds</b><span>one class period</span></div><div class="fact"><b>1 screen</b><span>students use paper</span></div></div><label for="teamCount">Number of teams</label> <select id="teamCount">${Array.from({length:8},(_,i)=>`<option value="${i+1}" ${state.teamCount===i+1?'selected':''}>${i+1}</option>`).join('')}</select><div class="actions"><button id="start" type="button" class="primary">Open the stand →</button></div><p class="small muted" style="margin-top:20px">Print one Student Sheet per student. Teams can also share a sheet and complete the exit ticket individually.</p></div><div class="panel"><h3>Your target</h3><p>Make a profit you can explain.</p><p class="muted">Selling every drink sounds good. So does charging a higher price. Neither tells you whether you made money.</p><p class="money"><b>Profit = revenue − all costs</b></p></div></div>${sessionButtons()}`;
 document.getElementById('start').onclick=()=>{const count=+document.getElementById('teamCount').value;state.teamCount=count;state.choices=Array.from({length:4},()=>Array.from({length:count},()=>({price:3,stock:30})));state.started=true;save();render();};
 }else{
 const r=ROUNDS[state.round],final=state.round===3&&state.revealed&&state.checked;
 const steps=ROUNDS.map((x,i)=>`<span class="step ${i===state.round?'active':''}" ${i===state.round?'aria-current="step"':''}>${i+1}. ${['Ordinary','Hot','Quiet','Big game'][i]}</span>`).join('');
 app.innerHTML=`<div class="steps" aria-label="Round progress">${steps}</div><div class="eyebrow">Round ${state.round+1} of 4 · ${state.revealed?(state.checked?'Results':'Calculate first'):'Make your decision'}</div><h1>${r.title}</h1><p class="lede">${state.revealed?r.reveal:r.forecast}</p><div class="factrow"><div class="fact"><b>${money(r.cost)}</b><span>cost per drink stocked</span></div><div class="fact"><b>$10</b><span>stand fee each day</span></div><div class="fact"><b>$100</b><span>budget for this day</span></div></div>${state.revealed?resultsHTML(final):choicesHTML(r)}${sessionButtons()}`;
 if(!state.revealed){document.querySelectorAll('select[data-team]').forEach(e=>{e.onchange=()=>{state.choices[state.round][+e.dataset.team][e.dataset.field]=+e.value;save();document.getElementById('cost'+e.dataset.team).textContent=money(calculate(state.round,state.choices[state.round][+e.dataset.team].price,state.choices[state.round][+e.dataset.team].stock).cost);};});document.getElementById('reveal').onclick=()=>{state.revealed=true;save();render();};}
 else if(!state.checked){document.getElementById('check').onclick=()=>{state.checked=true;save();render();};}
 else{if(!final)document.getElementById('next').onclick=()=>{state.round++;state.revealed=false;state.checked=false;save();render();};document.getElementById('csv').onclick=exportCSV;document.getElementById('print').onclick=()=>window.print();}
 }
 document.getElementById('restart').onclick=()=>{if(confirm('Start a new class? Save this session first if you want to keep its results.')){state=fresh();save();render();}};
 document.getElementById('saveSession').onclick=()=>download('Last_Bell_Session.json','application/json',JSON.stringify(state,null,2));
 document.getElementById('loadSession').onclick=()=>document.getElementById('sessionFile').click();
 document.getElementById('sessionFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>50000)throw new Error();const candidate=JSON.parse(await file.text());if(!valid(candidate))throw new Error();if(state.started&&!confirm('Replace this class with the saved session?'))return;state=candidate;save();render();}catch(err){document.getElementById('status').textContent='That is not a valid Last Bell session. Your current class is unchanged.';}finally{e.target.value='';}};
 updateStatus();
}
function choicesHTML(r){return `<p class="note">${r.hint}</p><div class="tablewrap"><table><caption class="sr">Team choices. Record all choices on paper before revealing results.</caption><thead><tr><th scope="col">Team</th><th scope="col">Selling price</th><th scope="col">Drinks to stock</th><th scope="col">Total cost</th></tr></thead><tbody>${state.choices[state.round].map((c,i)=>`<tr><th scope="row">${teamName(i)}</th><td><label class="sr" for="price${i}">${teamName(i)} price</label><select id="price${i}" data-team="${i}" data-field="price">${[2,3,4].map(n=>`<option value="${n}" ${n===c.price?'selected':''}>$${n}</option>`).join('')}</select></td><td><label class="sr" for="stock${i}">${teamName(i)} stock</label><select id="stock${i}" data-team="${i}" data-field="stock">${[20,30,40].map(n=>`<option value="${n}" ${n===c.stock?'selected':''}>${n}</option>`).join('')}</select></td><td id="cost${i}">${money(calculate(state.round,c.price,c.stock).cost)}</td></tr>`).join('')}</tbody></table></div><p class="small muted">Each team runs a separate identical stand. All demand figures stay hidden until you reveal. Lock every choice on paper first.</p><div class="actions"><button id="reveal" class="primary" type="button">Reveal demand →</button></div>`;}
function resultsHTML(final){const r=ROUNDS[state.round];if(!state.checked)return `<div class="note"><b>Actual demand:</b> $2 price → ${r.demand[2]} drinks &nbsp; / &nbsp; $3 → ${r.demand[3]} &nbsp; / &nbsp; $4 → ${r.demand[4]}</div><div class="divider"><h2>Calculate before you check.</h2><p class="lede">Use the stock and price your team recorded. Work out units sold, unsold drinks, revenue, all costs, and profit.</p><p>Sold = the smaller of stock and demand.<br>Revenue = sold × price.<br>All costs = stock × ${money(r.cost)} + $10.<br>Profit = revenue − all costs.</p><p class="muted">Checker: show your arithmetic. Explainer: be ready to defend the decision.</p><button id="check" class="primary" type="button">Check the results →</button></div>`;return `<div class="note"><b>Actual demand:</b> $2 price → ${r.demand[2]} drinks &nbsp; / &nbsp; $3 → ${r.demand[3]} &nbsp; / &nbsp; $4 → ${r.demand[4]}</div><div class="tablewrap"><table><caption class="sr">Results for round ${state.round+1}. Amounts are in dollars.</caption><thead><tr><th scope="col">Team</th><th scope="col">Price / stock</th><th scope="col">Sold</th><th scope="col">Unsold</th><th scope="col">Unmet demand</th><th scope="col">Revenue</th><th scope="col">All costs</th><th scope="col">Profit</th></tr></thead><tbody>${state.choices[state.round].map((c,i)=>{const a=calculate(state.round,c.price,c.stock);return `<tr><th scope="row">${teamName(i)}</th><td>$${c.price} / ${c.stock}</td><td>${a.sold}</td><td>${a.unsold}</td><td>${a.missed}</td><td>${money(a.revenue)}</td><td>${money(a.cost)}</td><td class="${a.profit>=0?'gain':'loss'}">${money(a.profit)}</td></tr>`;}).join('')}</tbody></table></div><p class="prompt">${r.question}</p><details><summary>Check the math and compare choices</summary><div><p>Units sold = the smaller of stock and demand. Revenue = units sold × price. All costs = all drinks stocked × unit cost + $10. Profit = revenue − all costs.</p><p class="muted small">This table uses demand we now know. The best result in hindsight is not a fair grading target for a decision made before the reveal.</p><div class="tablewrap"><table><thead><tr><th scope="col">Price</th>${[20,30,40].map(n=>`<th scope="col">Profit: stock ${n}</th>`).join('')}</tr></thead><tbody>${[2,3,4].map(p=>`<tr><th scope="row">$${p}</th>${[20,30,40].map(q=>`<td>${money(calculate(state.round,p,q).profit)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div></details><div class="divider"><h2>${final?'The final ledger':'Profit so far'}</h2><div class="row" style="gap:32px">${Array.from({length:state.teamCount},(_,i)=>`<div><span class="small muted">${teamName(i)}</span><div class="totals ${total(i)<0?'loss':'gain'}">${money(total(i))}</div></div>`).join('')}</div>${final?'<p class="prompt">Which decision would you change, and which number supports your answer?</p><p>Complete the individual exit ticket. Judge the explanation and the arithmetic, not just the largest profit.</p>':'<p class="muted small" style="margin-top:18px">The next round starts with a fresh $100 budget. Only your profit score carries forward.</p>'}</div><div class="actions">${final?'':'<button id="next" class="primary" type="button">Next afternoon →</button>'}<button id="csv" type="button">Export results</button><button id="print" type="button">Print this result</button></div>`;}
function exportCSV(){const rows=[['Round','Team','Price_USD','Stock','Demand','Sold','Unsold','Unmet_demand','Revenue_USD','Cost_USD','Profit_USD']];for(let round=0;round<=state.round;round++){if(round===state.round&&!state.revealed)break;for(let team=0;team<state.teamCount;team++){const c=state.choices[round][team],a=calculate(round,c.price,c.stock);rows.push([round+1,teamName(team),c.price,c.stock,a.demand,a.sold,a.unsold,a.missed,a.revenue/100,a.cost/100,a.profit/100]);}}download('Last_Bell_Results.csv','text/csv;charset=utf-8',rows.map(x=>x.join(',')).join('\r\n'));}
document.getElementById('helpButton').onclick=()=>{help=!help;render();};
render();
</script>
</body>
</html>
