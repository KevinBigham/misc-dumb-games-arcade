  cam.shake = g.shake;
}

const YS = 0.62;   // lateral compression → readable pseudo-3/4 view
function sx(x) { return (x - cam.x) * cam.zoom + W / 2 + (cam.shake ? (Math.random() - 0.5) * cam.shake * 22 : 0); }
function sy(y, z) { return H * 0.56 + (y - cam.y * 0.35) * cam.zoom * YS - (z || 0) * cam.zoom * 0.9 + (cam.shake ? (Math.random() - 0.5) * cam.shake * 14 : 0); }

/* ---------------------------------------------------------------------------
   FIELD
--------------------------------------------------------------------------- */
function drawField(g) {
  const night = g.mods.night || g.mods.lightsOut;
  const grad = cx.createLinearGradient(0, sy(-HALF_W, 0) - 200, 0, sy(HALF_W, 0) + 200);
  if (night) { grad.addColorStop(0, '#050a06'); grad.addColorStop(1, '#0a1409'); }
  else { grad.addColorStop(0, '#0d1a12'); grad.addColorStop(1, '#132417'); }
  cx.fillStyle = grad; cx.fillRect(0, 0, W, H);

  // stands
  if (!g.mods.noStadium) {
    cx.fillStyle = night ? '#0b0f16' : '#161c26';
    cx.fillRect(0, 0, W, sy(-HALF_W - 4.5, 0));
    // crowd speckle (presentation RNG only — never the sim RNG)
    const top = sy(-HALF_W - 4.5, 0);
    cx.save(); cx.beginPath(); cx.rect(0, 0, W, Math.max(0, top)); cx.clip();
    for (let i = 0; i < 420; i++) {
      const px = ((i * 71 + Math.floor(cam.x * 3)) % (W + 40)) - 20;
      const py = (i * 37) % Math.max(1, top);
      cx.fillStyle = i % 5 === 0 ? '#3a4152' : i % 3 === 0 ? '#242a36' : '#2e3440';
      cx.fillRect(px, py, 3, 3);
    }
    cx.restore();
  }

  // sideline aprons
  const y0 = sy(-HALF_W, 0), y1 = sy(HALF_W, 0);
  cx.fillStyle = night ? '#101a13' : '#1a2320';
  cx.fillRect(0, sy(-HALF_W - 4.5, 0), W, y0 - sy(-HALF_W - 4.5, 0) + 1);
  cx.fillRect(0, y1, W, sy(HALF_W + 5, 0) - y1);
  cx.fillStyle = night ? '#080c10' : '#12171f';
  cx.fillRect(0, sy(HALF_W + 5, 0), W, H);
  for (let i = 0; i < 24; i++) {
    const a = EZ + (i * 100 / 24) - EZ, xa = (i * 5), xb = ((i + 1) * 5);
    cx.fillStyle = i % 2 ? (night ? '#12301a' : '#1f4d2a') : (night ? '#0f2a17' : '#1b4525');
    const px = sx(xa), pw = sx(xb) - px;
    cx.fillRect(px, y0, pw + 1, y1 - y0);
  }
  // endzones
  for (const [ex, team] of [[0, 0], [EZ + 100, 1]]) {
    const t = team === 0 ? g.home : g.away;
    cx.fillStyle = t.c2;
    cx.fillRect(sx(ex), y0, sx(ex + EZ) - sx(ex), y1 - y0);
    cx.save();
    cx.globalAlpha = 0.85;
    cx.fillStyle = t.c1;
    cx.font = `bold ${Math.round(cam.zoom * 1.5)}px Arial Black, sans-serif`;
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.translate(sx(ex + EZ / 2), sy(0, 0));
    cx.rotate(team === 0 ? -Math.PI / 2 : Math.PI / 2);
    cx.fillText(t.nick, 0, 0);
    cx.restore();
  }
  // yard lines every 5, numbers every 10
  cx.strokeStyle = 'rgba(255,255,255,0.42)'; cx.lineWidth = 1.5;
  cx.fillStyle = 'rgba(255,255,255,0.5)';
  cx.font = `bold ${Math.round(cam.zoom * 0.62)}px Arial Black, sans-serif`;
  cx.textAlign = 'center';
  for (let y = 0; y <= 100; y += 5) {
    const x = EZ + y;
    const px = sx(x);
    if (px < -60 || px > W + 60) continue;
    cx.globalAlpha = y % 10 === 0 ? 1 : 0.55;
    cx.beginPath(); cx.moveTo(px, y0); cx.lineTo(px, y1); cx.stroke();
    if (y % 10 === 0 && y > 0 && y < 100) {
      const n = y <= 50 ? y : 100 - y;
      cx.globalAlpha = 0.55;
      cx.fillText(String(n), px, sy(-HALF_W + 3.4, 0));
      cx.fillText(String(n), px, sy(HALF_W - 1.2, 0));
    }
  }
  cx.globalAlpha = 1;
  // sidelines
  cx.strokeStyle = '#e8f0e8'; cx.lineWidth = 3;
  cx.beginPath(); cx.moveTo(sx(0), y0); cx.lineTo(sx(FIELD_LEN), y0);
  cx.moveTo(sx(0), y1); cx.lineTo(sx(FIELD_LEN), y1); cx.stroke();

  // line of scrimmage + the 30-yard gain line (GP-034 Known 99%)
  if (g.mode !== GM.MENU) {
    cx.lineWidth = 3;
    cx.strokeStyle = '#4fc3f7';
    cx.beginPath(); cx.moveTo(sx(g.los), y0); cx.lineTo(sx(g.los), y1); cx.stroke();
    if (!g.mods.noFirstDowns) {
      cx.strokeStyle = '#ffd400';
      cx.setLineDash([10, 8]);
      cx.beginPath(); cx.moveTo(sx(g.gainLine), y0); cx.lineTo(sx(g.gainLine), y1); cx.stroke();
      cx.setLineDash([]);
    }
  }
}

/* ---------------------------------------------------------------------------
   ACTORS
--------------------------------------------------------------------------- */
function teamOf(g, t) { return t === 0 ? g.home : g.away; }

function drawActor(g, a) {
  if (!a.onField) return;
  if (g.mods.invisible && a.team !== g.userTeam) return;
  const t = teamOf(g, a.team);
  const px = sx(a.x), py = sy(a.y, a.z);
  const gy = sy(a.y, 0);
  const scale = cam.zoom * 1.85 * (g.mods.tinyPlayers && a.team !== g.userTeam ? 0.55 : 1);
  const r = a.r * scale;

  // shadow
  cx.save();
  cx.globalAlpha = clamp(0.42 - a.z * 0.06, 0.08, 0.42);
  cx.fillStyle = '#000';
  cx.beginPath(); cx.ellipse(px, gy + r * 0.55, r * 1.05, r * 0.5, 0, 0, 7); cx.fill();
  cx.restore();

  const downed = a.state === S.DOWN || a.state === S.TACKLED || a.state === S.KNOCKED;
  const lean = downed ? 1.0 : 0;
  const bob = downed ? 0 : Math.sin(a.anim * 3) * r * 0.10;

  cx.save();
  cx.translate(px, py - r * 0.9 + bob);
  if (downed) cx.rotate(Math.PI / 2 * (a.state === S.KNOCKED ? -1 : 1) * 0.85);
  if (a.state === S.DIVE || a.state === S.DIVETACKLE) cx.rotate(Math.cos(a.face) >= 0 ? 0.9 : -0.9);
  if (a.state === S.SPIN) cx.rotate(a.st / T.SPIN_DURATION * Math.PI * 2);

  // On Fire aura — GP-040
  if (g.onFire[a.team]) {
    cx.save();
    for (let i = 0; i < 5; i++) {
      const ph = a.anim * 3 + i;
      cx.globalAlpha = 0.16 + 0.1 * Math.sin(ph);
      cx.fillStyle = i % 2 ? '#ff9a1f' : '#ff3b1f';
      cx.beginPath();
      cx.ellipse(Math.sin(ph) * r * 0.35, -r * (0.3 + i * 0.32), r * (0.8 - i * 0.1), r * (1.0 - i * 0.12), 0, 0, 7);
      cx.fill();
    }
    cx.restore();
  }

  // body
  const g1 = cx.createLinearGradient(0, -r * 1.6, 0, r);
  g1.addColorStop(0, t.c1); g1.addColorStop(1, shade(t.c1, -0.35));
  cx.fillStyle = g1;
  cx.strokeStyle = shade(t.c2, 0.1); cx.lineWidth = Math.max(1, r * 0.14);
  roundRect(cx, -r * 0.72, -r * 1.5, r * 1.44, r * 2.05, r * 0.42);
  cx.fill(); cx.stroke();

  // number
  if (!g.mods.headless || a.team === g.userTeam) {
    cx.fillStyle = t.c3;
    cx.font = `bold ${Math.round(r * 0.9)}px Arial Black, sans-serif`;
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText(String(a.num), 0, -r * 0.35);
  }
  // helmet
  if (!(g.mods.headless && a.team !== g.userTeam)) {
    let hr = r * 0.62;
    if (g.mods.hugeHead && a.team === g.userTeam) hr = r * 1.55;
    else if (g.mods.teamBigHeads && a.team === g.userTeam) hr = r * 1.05;
    else if (g.mods.bigHead && a.id === g.control) hr = r * 1.1;
    cx.fillStyle = shade(t.c2, 0.18);
    cx.beginPath(); cx.arc(0, -r * 1.62 - (hr - r * 0.62), hr, 0, 7); cx.fill();
    cx.strokeStyle = t.c3; cx.lineWidth = Math.max(1, r * 0.1); cx.stroke();
    // facemask direction
    cx.strokeStyle = '#dfe6ea';
    cx.beginPath();
    cx.moveTo(0, -r * 1.62 - (hr - r * 0.62));
    cx.lineTo(Math.cos(a.face) * hr * 1.05, -r * 1.62 - (hr - r * 0.62) + Math.sin(a.face) * hr * 0.5);
    cx.stroke();
  }
  cx.restore();

  // control cursor — FEEL-011 Known(97%): make hidden state visible
  if (a.id === g.control) {
    cx.save();
    cx.fillStyle = '#fff';
    cx.globalAlpha = 0.9;
    const cyv = py - r * 3.6;
    cx.beginPath(); cx.moveTo(px, cyv + r * 0.85); cx.lineTo(px - r * 0.6, cyv); cx.lineTo(px + r * 0.6, cyv); cx.closePath(); cx.fill();
    cx.restore();
    // turbo meter under the cursor — GP-010 / FEEL-011
    const bw = r * 2.4, bh = r * 0.32;
    cx.fillStyle = 'rgba(0,0,0,0.55)'; cx.fillRect(px - bw / 2, py - r * 3.05, bw, bh);
    const frac = g.mods.infTurbo ? 1 : a.turbo / T.TURBO_MAX;
    cx.fillStyle = frac > 0.35 ? '#38e07b' : '#ff5252';
    cx.fillRect(px - bw / 2, py - r * 3.05, bw * frac, bh);
  }
  // target highlight — HID-003 Known(99%), independently disableable
  if (g.opt.targetHL && !g.mods.noTargetHL && g.ball.mode === BALL.PASS && g.ball.target === a.id) {
    cx.save();
    cx.strokeStyle = '#ffd400'; cx.lineWidth = 2.5;
    cx.globalAlpha = 0.55 + 0.45 * Math.sin(g.frame * 0.3);
    cx.beginPath(); cx.ellipse(px, gy + r * 0.5, r * 1.6, r * 0.75, 0, 0, 7); cx.stroke();
    cx.restore();
  }
  // receiver name — HID-003 / ARCH-022
  if (!g.mods.hideNames && a.team === g.userTeam && a.unit === 'off' && a.tag !== 'QB' && a.role !== 'OL' && g.mode !== GM.MENU) {
    cx.fillStyle = 'rgba(255,255,255,0.75)';
    cx.font = `bold ${Math.max(9, Math.round(r * 0.62))}px Arial, sans-serif`;
    cx.textAlign = 'center';
    cx.fillText(a.name, px, gy + r * 1.9);
  }
  // debug: bounded alignment budget (GP-023 REC — visualise the magnet)
  if (g.debug && a.unit === 'def') {
    cx.save(); cx.strokeStyle = 'rgba(255,80,80,0.5)'; cx.lineWidth = 1;
    cx.beginPath(); cx.ellipse(px, gy, (T.TACKLE_RADIUS) * cam.zoom, T.TACKLE_RADIUS * cam.zoom * YS, 0, 0, 7); cx.stroke();
    cx.strokeStyle = 'rgba(255,200,0,0.35)';
    cx.beginPath(); cx.ellipse(px, gy, (T.TACKLE_RADIUS + T.PAIR_ALIGN_BUDGET) * cam.zoom, (T.TACKLE_RADIUS + T.PAIR_ALIGN_BUDGET) * cam.zoom * YS, 0, 0, 7); cx.stroke();
    cx.restore();
  }
}

function drawBall(g) {
  const b = g.ball;
  if (b.mode === BALL.DEAD) return;
  // Landing marker while the pass is in flight. HID-003 Known(99%) establishes
  // target highlighting as a real, independently disableable system; this is
  // the same family of aid and respects the same switch.
  if (b.mode === BALL.PASS && g.opt.targetHL && !g.mods.noTargetHL) {
    const mx = sx(b.tx), my = sy(b.ty, 0);
    const u = clamp(b.t / b.tof, 0, 1);
    cx.save();
    cx.strokeStyle = '#ffd400'; cx.lineWidth = 2.5; cx.globalAlpha = 0.35 + 0.5 * u;
    cx.beginPath(); cx.ellipse(mx, my, cam.zoom * (1.9 - u * 0.9), cam.zoom * (1.9 - u * 0.9) * YS, 0, 0, 7); cx.stroke();
    cx.beginPath();
    cx.moveTo(mx - cam.zoom * 0.5, my); cx.lineTo(mx + cam.zoom * 0.5, my);
    cx.moveTo(mx, my - cam.zoom * 0.4); cx.lineTo(mx, my + cam.zoom * 0.4);
    cx.stroke();
    cx.restore();
  }
  const scale = g.mods.bigFootball ? 2.1 : 1;
  const px = sx(b.x), py = sy(b.y, b.z), gy = sy(b.y, 0);
  // trail — ARCH: the original has a dedicated ball-trail presentation task
  if (b.mode === BALL.PASS || b.mode === BALL.LOOSE) {
    cx.save();
    for (let i = 0; i < b.trail.length; i++) {
      const p = b.trail[i];
      cx.globalAlpha = (i / b.trail.length) * 0.35;
      cx.fillStyle = '#fff';
      cx.beginPath(); cx.arc(sx(p.x), sy(p.y, p.z), cam.zoom * 0.12 * scale, 0, 7); cx.fill();
    }
    cx.restore();
  }
  cx.save();
  cx.globalAlpha = 0.3; cx.fillStyle = '#000';
  cx.beginPath(); cx.ellipse(px, gy, cam.zoom * 0.2 * scale, cam.zoom * 0.1 * scale, 0, 0, 7); cx.fill();
  cx.restore();
  cx.save();
  cx.translate(px, py);
  cx.rotate(b.mode === BALL.HELD ? 0 : g.frame * 0.35);
  cx.fillStyle = '#7a3b18'; cx.strokeStyle = '#fff'; cx.lineWidth = 1.5;
  cx.beginPath(); cx.ellipse(0, 0, cam.zoom * 0.32 * scale, cam.zoom * 0.19 * scale, 0, 0, 7); cx.fill();
  cx.beginPath(); cx.moveTo(-cam.zoom * 0.16 * scale, 0); cx.lineTo(cam.zoom * 0.16 * scale, 0); cx.stroke();
  cx.restore();
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, gg = (n >> 8) & 255, b = n & 255;
  r = clamp(Math.round(r + 255 * amt), 0, 255);
  gg = clamp(Math.round(gg + 255 * amt), 0, 255);
  b = clamp(Math.round(b + 255 * amt), 0, 255);
  return `rgb(${r},${gg},${b})`;
}

/* Weather / lighting modifiers — HID-004 */
function drawWeather(g) {
  if (g.mods.rain) {
    cx.save(); cx.strokeStyle = 'rgba(180,210,255,0.35)'; cx.lineWidth = 1;
    for (let i = 0; i < 220; i++) {
      const x = (i * 173 + g.frame * 17) % W, y = (i * 97 + g.frame * 26) % H;
      cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x - 3, y + 13); cx.stroke();
    }
    cx.restore();
  }
  if (g.mods.snow) {
    cx.save(); cx.fillStyle = 'rgba(255,255,255,0.8)';
    for (let i = 0; i < 180; i++) {
      const x = (i * 211 + g.frame * 2 + Math.sin(g.frame * 0.02 + i) * 30) % W;
      const y = (i * 131 + g.frame * 4) % H;
      cx.beginPath(); cx.arc(x, y, 1.8, 0, 7); cx.fill();
    }
    cx.restore();
  }
  if (g.mods.fog || g.mods.thickFog) {
    cx.save();
    cx.fillStyle = g.mods.thickFog ? 'rgba(200,210,215,0.55)' : 'rgba(200,210,215,0.28)';
    cx.fillRect(0, 0, W, H);
    cx.restore();
  }
  if (g.mods.lightsOut) {
    const c = g.actor(g.control);
    const px = c ? sx(c.x) : W / 2, py = c ? sy(c.y, 0) : H / 2;
    const rad = cx.createRadialGradient(px, py, 40, px, py, 340);
    rad.addColorStop(0, 'rgba(0,0,0,0)'); rad.addColorStop(1, 'rgba(0,0,0,0.93)');
    cx.fillStyle = rad; cx.fillRect(0, 0, W, H);
  }
}

/* ---------------------------------------------------------------------------
   HUD — ARCH-022 Known(93%) / FEEL-011 Known(97%)
--------------------------------------------------------------------------- */
function drawHUD(g) {
  const pad = 14;
  // scoreboard
  const bw = 520, bh = 58, bx = (W - bw) / 2;
  cx.save();
  cx.fillStyle = 'rgba(8,10,14,0.86)';
  roundRect(cx, bx, pad, bw, bh, 10); cx.fill();
  cx.strokeStyle = 'rgba(255,255,255,0.14)'; cx.lineWidth = 1.5; cx.stroke();

  const teams = [g.home, g.away];
  for (let i = 0; i < 2; i++) {
    const tx = i === 0 ? bx + 16 : bx + bw - 16;
    cx.textAlign = i === 0 ? 'left' : 'right';
    cx.fillStyle = teams[i].c1;
    cx.font = 'bold 15px Arial Black, sans-serif';
    cx.fillText(teams[i].id, tx, pad + 22);
    cx.fillStyle = '#fff';
    cx.font = 'bold 27px Arial Black, sans-serif';
    cx.fillText(String(g.score[i]), i === 0 ? tx + 46 : tx - 46, pad + 26);
    if (g.onFire[i]) {
      cx.fillStyle = '#ff8a1f'; cx.font = 'bold 11px Arial Black, sans-serif';
      cx.fillText('ON FIRE', i === 0 ? tx + 4 : tx - 4, pad + 46);
    }
    if (g.possession === i && g.mode !== GM.MENU) {
      cx.fillStyle = '#ffd400';
      cx.beginPath(); cx.arc(i === 0 ? tx + 100 : tx - 100, pad + 18, 4.5, 0, 7); cx.fill();
    }
  }
  cx.textAlign = 'center';
  cx.fillStyle = '#fff'; cx.font = 'bold 22px Arial Black, sans-serif';
  const m = Math.floor(g.clock / 60), s = Math.floor(g.clock % 60);
  cx.fillText(`${m}:${String(s).padStart(2, '0')}`, W / 2, pad + 26);
  cx.fillStyle = 'rgba(255,255,255,0.65)'; cx.font = 'bold 11px Arial, sans-serif';
  cx.fillText(g.qtr > 4 ? 'OT' : `Q${g.qtr}`, W / 2, pad + 43);
  cx.restore();

  // down & distance
  if (g.mode !== GM.MENU && g.mode !== GM.FINAL) {
    const toGo = Math.max(0, Math.round(Math.abs(g.gainLine - g.los)));
    const label = g.mods.noFirstDowns ? 'NO FIRST DOWNS'
      : `${['1ST', '2ND', '3RD', '4TH'][clamp(g.down - 1, 0, 3)]} & ${toGo}`;
    cx.save();
    cx.fillStyle = 'rgba(8,10,14,0.86)';
    roundRect(cx, bx + bw / 2 - 120, pad + bh + 4, 240, 26, 6); cx.fill();
    cx.fillStyle = '#ffd400'; cx.font = 'bold 14px Arial Black, sans-serif'; cx.textAlign = 'center';
    cx.fillText(`${label}   •   BALL ON ${yardLine(g.los)}`, W / 2, pad + bh + 22);
    cx.restore();
  }

  // messages
  if (g.msgT > 0) {
    cx.save();
    cx.globalAlpha = clamp(g.msgT, 0, 1);
    cx.textAlign = 'center';
    cx.font = 'bold 20px Arial Black, sans-serif';
    cx.lineWidth = 5; cx.strokeStyle = '#000';
    cx.strokeText(g.msg, W / 2, H - 96); cx.fillStyle = '#fff';
    cx.fillText(g.msg, W / 2, H - 96);
    cx.restore();
  }
  if (g.bigMsgT > 0) {
    cx.save();
    const t = clamp(g.bigMsgT, 0, 1);
    cx.globalAlpha = t;
    cx.textAlign = 'center';
    const sc = 1 + (1 - clamp(g.bigMsgT / 2, 0, 1)) * 0.0;
    cx.translate(W / 2, H * 0.32);
    cx.scale(sc, sc);
    cx.font = 'bold 58px Arial Black, sans-serif';
    cx.lineWidth = 10; cx.strokeStyle = '#000'; cx.strokeText(g.bigMsg, 0, 0);
    const gr = cx.createLinearGradient(0, -40, 0, 20);
    gr.addColorStop(0, '#fff1a8'); gr.addColorStop(1, '#ff9d1f');
    cx.fillStyle = gr; cx.fillText(g.bigMsg, 0, 0);
    cx.restore();
  }

  // active modifiers strip — ARCH-029: modifiers are explicit rule data
  if (g.activeCodes.length) {
    cx.save();
    cx.font = 'bold 10px Arial, sans-serif'; cx.textAlign = 'left';
    cx.fillStyle = 'rgba(255,212,0,0.85)';
    g.activeCodes.slice(0, 8).forEach((c, i) => cx.fillText('◆ ' + c.name, 12, 26 + i * 13));
    cx.restore();
  }

  // controls hint
  cx.save();
  cx.font = 'bold 11px Arial, sans-serif'; cx.textAlign = 'right';
  cx.fillStyle = 'rgba(255,255,255,0.4)';
  const onOff = g.possession === g.userTeam;
  const hints = g.mode === GM.PRESNAP
    ? ['K = HIKE', 'L+K = HIKE w/ EXTRA BLOCKER', '1/2/3 = MOTION', 'WASD = MOVE']
    : onOff
      ? ['J = TURBO', 'J,J = SPIN', 'K = PASS (+W/S for lane)', '1/2/3 = DIRECT RECEIVER', 'L = JUMP/HURDLE', 'J+K = STIFF ARM', 'J+L = HIGH HURDLE', 'K = LATERAL (past LOS)']
      : ['J = TURBO', 'K = TACKLE', 'L = DIVE TACKLE', 'J+L = POWER TACKLE', 'J+K = PUSH', 'Q = SWITCH'];
  hints.forEach((h, i) => cx.fillText(h, W - 12, H - 12 - (hints.length - 1 - i) * 13));
  cx.restore();

  if (g.debug) {
    cx.save();
    cx.font = '11px monospace'; cx.fillStyle = '#8f8'; cx.textAlign = 'left';
    const lines = [
      `frame ${g.frame}  rngstate ${G.rng.s}`,
      `mode ${g.mode}  carrier ${g.carrier}  ball ${g.ball.mode}`,
      `pressure ${g.qbPressure.toFixed(2)}  diff ${T.DIFFICULTY[g.opt.difficulty].name}`,
      `assist ${g.opt.cpuAssist && !g.mods.noAssist ? 'ON' : 'OFF'}  randFum ${g.opt.randomFumbles && !g.mods.noRandomFumbles ? 'ON' : 'OFF'}`,
      `red = tackle radius (GP-023) | yellow = pair alignment budget`,
    ];
    lines.forEach((l, i) => cx.fillText(l, 12, H - 12 - (lines.length - 1 - i) * 13));
    cx.restore();
  }
}

/* ---------------------------------------------------------------------------
   MENUS
--------------------------------------------------------------------------- */
const ui = { screen: 'title', sel: 0, homeSel: 0, awaySel: 1, col: 0, page: 0, prow: 0, codeDigits: '', codeMsg: '' };

function panel(x, y, w, h, title) {
  cx.save();
  cx.fillStyle = 'rgba(6,8,12,0.92)';
  roundRect(cx, x, y, w, h, 12); cx.fill();
  cx.strokeStyle = 'rgba(255,212,0,0.5)'; cx.lineWidth = 2; cx.stroke();
  if (title) {
    cx.fillStyle = '#ffd400'; cx.font = 'bold 15px Arial Black, sans-serif'; cx.textAlign = 'left';
    cx.fillText(title, x + 16, y + 26);
  }
  cx.restore();
}

function drawTitle(g) {
  cx.fillStyle = '#05070a'; cx.fillRect(0, 0, W, H);
  // animated stripes
  cx.save();
  for (let i = 0; i < 22; i++) {
    cx.globalAlpha = 0.05 + 0.03 * Math.sin(i + performance.now() / 700);
    cx.fillStyle = i % 2 ? '#e8552b' : '#3ddbd9';
    cx.fillRect(0, i * (H / 22), W, H / 44);
  }
  cx.restore();

  cx.textAlign = 'center';
  cx.save();
  cx.translate(W / 2, 96);
  cx.font = 'bold 62px Arial Black, sans-serif';

/* ARCH-029 Known(99%): the code entry screen drives the same descriptor table
   the match rules read. Enter 3 digits, then an arrow for the direction. */
function handleCodeKey(code) {
  if (G.mode !== GM.CODES) return;
  const d = code.match(/^Digit(\d)$/);
  if (d) { if (ui.codeDigits.length < 3) ui.codeDigits += d[1]; return; }
  if (code === 'Backspace') { ui.codeDigits = ui.codeDigits.slice(0, -1); return; }
  const dirs = { ArrowUp: 'Up', ArrowDown: 'Down', ArrowLeft: 'Left', ArrowRight: 'Right' };
  if (dirs[code] && ui.codeDigits.length === 3) {
    const m = MODIFIERS.find(x => x.code === ui.codeDigits && x.dir === dirs[code]);
    if (m) {
      if (G.mods[m.cell]) { delete G.mods[m.cell]; G.activeCodes = G.activeCodes.filter(c => c.cell !== m.cell); ui.codeMsg = m.name + ' — OFF'; }
      else { G.mods[m.cell] = true; G.activeCodes.push(m); ui.codeMsg = m.name + ' — ON'; }
      applyModifierSideEffects();
    } else ui.codeMsg = 'NO SUCH CODE: ' + ui.codeDigits + ' ' + dirs[code];
    ui.codeDigits = '';
  }
}

function applyModifierSideEffects() {
  if (G.mods.noAssist) G.opt.cpuAssist = false;
  if (G.mods.noRandomFumbles) G.opt.randomFumbles = false;
  if (G.mods.noTargetHL) G.opt.targetHL = false;
  if (G.mods.smartCPU) G.opt.difficulty = 2;
}

function drawMiniRoutes(cxp, cyp, play) {
  cx.save();
  cx.translate(cxp, cyp);
  cx.strokeStyle = 'rgba(255,255,255,0.25)';
  cx.beginPath(); cx.moveTo(-6, 0); cx.lineTo(76, 0); cx.stroke();
  const cols = { WL: '#3ddbd9', WR: '#ff9d1f', RB: '#8ef05a' };
  for (const tag in play.routes) {
    let px = 4, py = tag === 'WL' ? -10 : tag === 'WR' ? 10 : -3;
    cx.strokeStyle = cols[tag] || '#fff'; cx.lineWidth = 1.6;
    cx.beginPath(); cx.moveTo(px, py);
    for (const op of play.routes[tag]) {
      if (op[0] === 'go') px += op[1] * 0.7;
      else if (op[0] === 'cut') { px += op[1] * 0.7; py += op[2] * 0.5; }
      else if (op[0] === 'hook') px -= 4;
      else continue;
      py = clamp(py, -17, 17); px = Math.min(px, 78);
      cx.lineTo(px, py);
    }
    cx.stroke();
    cx.fillStyle = cols[tag] || '#fff';
    cx.beginPath(); cx.arc(px, py, 2.2, 0, 7); cx.fill();
  }
  cx.restore();
}

/* ---------------------------------------------------------------------------
   MENU NAVIGATION
--------------------------------------------------------------------------- */
function menuStep() {
  const g = G;
  if (g.mode === GM.MENU) {
    const upP = hit('up'), dnP = hit('down'), lfP = hit('left'), rtP = hit('right');
    if (ui.sel === 0) {
      if (lfP) ui.col = 0; if (rtP) ui.col = 1;
      if (upP) { if (ui.col === 0) ui.homeSel = (ui.homeSel + TEAMS.length - 1) % TEAMS.length; else ui.awaySel = (ui.awaySel + TEAMS.length - 1) % TEAMS.length; }
      if (dnP) { if (ui.col === 0) ui.homeSel = (ui.homeSel + 1) % TEAMS.length; else ui.awaySel = (ui.awaySel + 1) % TEAMS.length; }
      if (hit('pass') || hit('start')) ui.sel = 1;
    } else {
      if (upP) ui.sel = Math.max(0, ui.sel - 1);
      if (dnP) ui.sel = Math.min(7, ui.sel + 1);
      const flip = (rtP ? 1 : lfP ? -1 : 0);
      if (flip) {
        if (ui.sel === 1) g.opt.difficulty = (g.opt.difficulty + 3 + flip) % 3;
        if (ui.sel === 2) g.opt.quarterIdx = (g.opt.quarterIdx + 4 + flip) % 4;
        if (ui.sel === 3) g.opt.blitzPassing = !g.opt.blitzPassing;
        if (ui.sel === 4) g.opt.cpuAssist = !g.opt.cpuAssist;
        if (ui.sel === 5) g.opt.randomFumbles = !g.opt.randomFumbles;
      }
      if (hit('pass') || hit('start')) {
        if (ui.sel === 6) { g.mode = GM.CODES; ui.codeMsg = ''; }
        else if (ui.sel === 7) startMatch();
        else if (ui.sel >= 1 && ui.sel <= 5) {
          if (ui.sel === 1) g.opt.difficulty = (g.opt.difficulty + 1) % 3;
          if (ui.sel === 2) g.opt.quarterIdx = (g.opt.quarterIdx + 1) % 4;
          if (ui.sel === 3) g.opt.blitzPassing = !g.opt.blitzPassing;
          if (ui.sel === 4) g.opt.cpuAssist = !g.opt.cpuAssist;
          if (ui.sel === 5) g.opt.randomFumbles = !g.opt.randomFumbles;
        }
      }
    }
    if (ui.homeSel === ui.awaySel) ui.awaySel = (ui.awaySel + 1) % TEAMS.length;
  } else if (g.mode === GM.CODES) {
    if (hit('back') || hit('pass')) g.mode = GM.MENU;
  } else if (g.mode === GM.PLAYCALL) {
    const onOff = g.possession === g.userTeam;
    const list = onOff ? OFF_PLAYS.filter(p => p.page === ui.page) : DEF_PLAYS;
    const extra = [];
    if (onOff && g.down === 4) {
      const inEnemy = (g.dir > 0 && g.los > EZ + 50) || (g.dir < 0 && g.los < EZ + 50);
      if (inEnemy) extra.push({ special: 'fg' });
      if (!g.mods.noPunting) extra.push({ special: 'punt' });
    }
    const all = list.concat(extra);
    if (hit('up')) ui.prow = (ui.prow + all.length - 2) % all.length;
    if (hit('down')) ui.prow = (ui.prow + 2) % all.length;
    if (hit('left')) ui.prow = (ui.prow + all.length - 1) % all.length;
    if (hit('right')) ui.prow = (ui.prow + 1) % all.length;
    if (onOff && hit('switch')) { ui.page = (ui.page + 1) % 3; ui.prow = 0; }
    if (hit('pass') || hit('start')) {
      const p = all[ui.prow];
      if (p && p.special === 'fg') { g.attemptFG(); ui.prow = 0; return; }
      if (p && p.special === 'punt') { g.punt(); ui.prow = 0; return; }
      if (onOff) g.playIdx = OFF_PLAYS.indexOf(p);
      else g.defIdx = DEF_PLAYS.indexOf(p);
      // NO PLAY SELECTION modifier — HID / ARCH-029
      if (g.mods.noPlaySelect) { g.playIdx = g.rng.n(OFF_PLAYS.length); g.defIdx = g.rng.n(DEF_PLAYS.length); }
      g.setupPlay();
      ui.prow = 0;
    }
  } else if (g.mode === GM.FINAL) {
    if (hit('start') || hit('pass')) { g.mode = GM.MENU; ui.sel = 0; }
  }
  if (g.showAudit && g.mode === GM.MENU) { /* panel drawn over the title too */ }
  if (hit('debug')) g.debug = !g.debug;
  if (hit('audit')) g.showAudit = !g.showAudit;
  if (g.showAudit) {
    if (hit('r1')) { g.opt.cpuAssist = !g.opt.cpuAssist; delete g.mods.noAssist; }
    if (hit('r2')) { g.opt.randomFumbles = !g.opt.randomFumbles; delete g.mods.noRandomFumbles; }
    if (hit('r3')) { g.opt.targetHL = !g.opt.targetHL; delete g.mods.noTargetHL; }
    if (edge['Digit4']) g.opt.difficulty = (g.opt.difficulty + 1) % 3;
  }
}

function startMatch() {
  const savedMods = G.mods, savedCodes = G.activeCodes, savedOpt = G.opt;
  G.newGame(ui.homeSel, ui.awaySel);
  G.mods = savedMods; G.activeCodes = savedCodes; G.opt = savedOpt;
  applyModifierSideEffects();
  G.userTeam = 0;
  G.pickCpuPlays();
  ui.page = 0; ui.prow = 0;
  cam.x = G.los;
}

/* ---------------------------------------------------------------------------
   MAIN LOOP — fixed-tick simulation, decoupled variable-rate presentation.
   ARCH-006 REC: the tick is a recommendation, exposed as T.TICK, not folklore.
--------------------------------------------------------------------------- */
let G = new Game(20260802);
G.newGame(0, 1);
G.mode = GM.MENU;
resize();

let acc = 0, last = performance.now();

function frame(now) {
  const dtReal = Math.min(0.25, (now - last) / 1000);
  last = now;
  acc += dtReal;

  let steps = 0;
  while (acc >= T.TICK && steps < 5) {
    menuStep();
    if (!G.showAudit && (G.mode === GM.PRESNAP || G.mode === GM.LIVE || G.mode === GM.DEAD || G.mode === GM.SCORE)) {
      G.step(sampleInput());
    }
    clearEdges();
    acc -= T.TICK;
    steps++;
  }
  if (steps === 0) { /* keep edges alive until a tick consumes them */ }

  updateCam(G, dtReal);

  if (G.mode === GM.MENU) { drawTitle(G); if (G.showAudit) drawAudit(G); }
  else if (G.mode === GM.CODES) drawCodes(G);
  else {
    drawField(G);
    const sorted = G.actors.slice().sort((a, b) => (a.y + a.x * 0.0001) - (b.y + b.x * 0.0001));
    for (const a of sorted) drawActor(G, a);
    drawBall(G);
    drawWeather(G);
    drawHUD(G);
    if (G.mode === GM.PLAYCALL) drawPlayCall(G);
    if (G.mode === GM.FINAL) drawFinal(G);
    if (G.showAudit) drawAudit(G);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

</script>
