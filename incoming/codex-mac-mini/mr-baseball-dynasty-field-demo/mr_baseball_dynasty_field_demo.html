// 5-byte shift-register PRNG — original re-expression of the recovered
// recurrence (pure algorithm = functional behavior, clean to reuse).
// Verified against the reference: 320 steps × 8 seeds, 0 mismatches.
function RNG(seed) {
  const s = seed && seed.length === 5 ? seed.slice() : [0x12, 0x34, 0x56, 0x78, 0x9A];
  this.a = s[0] & 0xFF; this.b = s[1] & 0xFF; this.c = s[2] & 0xFF; this.d = s[3] & 0xFF; this.e = s[4] & 0xFF;
}
RNG.prototype.next = function () {
  const fb = (((this.b >> 4) | ((this.c << 4) & 0xFF)) ^ (((this.e & 1) << 7) | (this.d >> 1))) & 0xFF;
  this.e = this.d; this.d = this.c; this.c = this.b; this.b = this.a; this.a = fb;
  return fb;
};
// Unbiased range helper — floor(byte × n / 256), the original's multiplier idiom [PROVEN]
RNG.prototype.range = function (n) { return (this.next() * n) >> 8; };
RNG.prototype.pick = function (arr) { return arr[this.range(arr.length)]; };
// Weighted choice from [weight, value] pairs (small cumulative tables — authentic texture)
RNG.prototype.weighted = function (pairs) {
  let total = 0; for (let i = 0; i < pairs.length; i++) total += pairs[i][0];
  let r = this.range(total);
  for (let i = 0; i < pairs.length; i++) { r -= pairs[i][0]; if (r < 0) return pairs[i][1]; }
  return pairs[pairs.length - 1][1];
};
RNG.prototype.state = function () { return [this.a, this.b, this.c, this.d, this.e]; };

/* ════════════════ SECTION §C — FIXED-POINT & ANGLES ════════════════ */
const SUB = 256;                       // 8.8 fixed point
const toSub = (u) => (u * SUB) | 0;
const toInt = (s) => s >> 8;           // floor conversion [PROVEN]
const TAU = Math.PI * 2;
// 2048-step circle [PROVEN granularity]. Modern impl: real trig, outputs
// quantized to 8.8 at assignment (per spec §6) — reproduces the grain.
function vecFromAngle(steps, speedU) {  // steps: 0 = toward CF (−y); + = toward RF (+x)
  const rad = (steps / CONST.ANGLE_STEPS) * TAU;
  return { vx: Math.round(Math.sin(rad) * speedU * SUB), vy: -Math.round(Math.cos(rad) * speedU * SUB) };
}
function degToSteps(d) { return Math.round(d / 360 * CONST.ANGLE_STEPS); }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist2d = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); };

// Derived field geometry (world units, integer)
const GEO = (() => {
  const PX = CONST.PLATE_X, PY = CONST.PLATE_Y, B = CONST.BASE_DIST;
  const d = Math.round(B / Math.SQRT2); // 554
  return {
    plate: { x: PX, y: PY },
    mound: { x: PX, y: PY - CONST.MOUND_DIST },
    bases: [ { x: PX, y: PY },            // 0 = home
             { x: PX + d, y: PY - d },    // 1B
             { x: PX, y: PY - 2 * d },    // 2B
             { x: PX - d, y: PY - d } ],  // 3B
    // Fence distance from plate as a function of |azimuth| (0=CF, ±45°=lines)
    fenceDist(azSteps) {
      const a = Math.abs(azSteps) / degToSteps(45); // 0..1
      return Math.round(CONST.FENCE_CF - (CONST.FENCE_CF - CONST.FENCE_CORNER) * a * a);
    },
    // Fair iff within the 90° wedge toward the outfield
    isFair(x, y) { return y <= PY && Math.abs(x - PX) <= (PY - y); },
    azimuthOf(x, y) { // angle steps from CF axis as seen from the plate
      return Math.round(Math.atan2(x - PX, PY - y) / TAU * CONST.ANGLE_STEPS);
    },
    distFromPlate(x, y) { return dist2d(x, y, PX, PY); },
  };
})();

// Defensive spots [DESIGN]: position id → world coords

  const P = GEO.plate, spot = (azDeg, d) => {
    const r = azDeg / 360 * TAU;

function drawText(ctx, text, x, y, color, scale) {
  scale = scale || 1;
  ctx.fillStyle = color;
  let cx = x;
  for (const ch of String(text)) {
    const g = FONT[ch] || FONT[ch.toUpperCase()] || FONT['?'];
    for (let r = 0; r < 5; r++) {
      const bits = g[r];
      for (let c = 0; c < 4; c++) if (bits & (8 >> c)) ctx.fillRect(cx + c * scale, y + r * scale, scale, scale);
    }
    cx += 5 * scale;
  }
  return cx;
}
function drawTextShadow(ctx, text, x, y, color, scale, shadow) {
  const off = scale > 1 ? scale - 1 : 1;
  drawText(ctx, text, x + off, y + off, shadow || '#101018', scale);
  drawText(ctx, text, x, y, color, scale);
}
function textW(text, scale) { return String(text).length * 5 * (scale || 1); }
function centerText(ctx, text, y, color, scale, shadow) {
  const x = (VIEW_W - textW(text, scale)) >> 1;
  if (shadow !== false) drawTextShadow(ctx, text, x, y, color, scale, typeof shadow === 'string' ? shadow : undefined);
  else drawText(ctx, text, x, y, color, scale);
}
// ── chunky banner font [v0.3]: 4x5 glyphs upscaled 2x + 1px bold dilation (9x11 cells) ──
function drawChunk(ctx, text, x, y, color, scale) {
  scale = scale || 1;                       // [v0.6] integer scale for the call-pop treatment
  const cell = 2 * scale;
  ctx.fillStyle = color;
  let cx = x;
  for (const ch of String(text)) {
    const g = FONT[ch] || FONT[ch.toUpperCase()] || FONT['?'];
    for (let r = 0; r < 5; r++) {
      const bits = g[r];
      for (let c = 0; c < 4; c++) if (bits & (8 >> c)) ctx.fillRect(cx + c * cell, y + r * cell, cell + scale, cell + scale);
    }
    cx += 9 * scale + 1;
  }
  return cx;
}
function chunkW(text, scale) { return String(text).length * (9 * (scale || 1) + 1); }
function centerChunk(ctx, text, y, color, shadow, scale) {
  const x = (VIEW_W - chunkW(text, scale)) >> 1;
  ctx.save();
  drawChunk(ctx, text, x + 2 * (scale || 1), y + 2 * (scale || 1), shadow || '#101018', scale);
  drawChunk(ctx, text, x, y, color, scale);
  ctx.restore();
}

// ── sprite helper: string rows, palette map, integer scale ──
function drawSprite(ctx, rows, pal, x, y, flipX, scale) {
  scale = scale || 1;
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    for (let c = 0; c < row.length; c++) {
      const k = flipX ? row[row.length - 1 - c] : row[c];
      if (k === '.') continue;
      const col = pal[k]; if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(x + c * scale, y + r * scale, scale, scale);
    }
  }
}
// [v0.7 W8] inked sprite: 4-offset dark silhouette pass then the sprite on
// top — the Griffey-era black outline without touching a single sprite row
function drawSpriteOutlined(ctx, rows, pal, x, y, flipX, scale) {
  scale = scale || 1;
  ctx.fillStyle = '#14141c';
  for (let r = 0; r < rows.length; r++) {
    const row = rows[r];
    for (let c = 0; c < row.length; c++) {
      const k = flipX ? row[row.length - 1 - c] : row[c];
      if (k === '.' || !pal[k]) continue;
      ctx.fillRect(x + c * scale - 1, y + r * scale, scale + 2, scale);
      ctx.fillRect(x + c * scale, y + r * scale - 1, scale, scale + 2);
    }
  }
  drawSprite(ctx, rows, pal, x, y, flipX, scale);
}

function shade(hex, f) {   // render-only shade helper (Q: darken toward black)
  const n = parseInt(hex.slice(1), 16);
  const r = Math.round(((n >> 16) & 255) * f), g = Math.round(((n >> 8) & 255) * f), b = Math.round((n & 255) * f);

}
function teamPal(team, alt) {

/* ── world→screen for the FIELD view: OBLIQUE projection [v0.3] ──
   Ground-plane y is foreshortened (FSHORT/256 ≈ 0.656 vertical compression →
   the diamond reads as the original's wide trapezoid, 2B up-screen).
   CRITICAL: the 2:1 shadow projection [PROVEN] is preserved EXACTLY in screen
   pixels — height z lifts a sprite off its shadow by 2z world units at FULL
   scale (never foreshortened). Steering/catch feel is untouched. */
const FSHORT = 168;                       // ground-y compression, Q8 (168/256 = 0.65625)
function groundToScreenY(st, wy) {        // ground plane only (stripes, shapes)
  const camY = toInt(st.camera.yS);
  return 116 + (((((wy - camY) * FSHORT) >> 8) * 3) >> 5);
}
function fieldToScreen(st, wx, wy, wz) {
  const camX = toInt(st.camera.xS), camY = toInt(st.camera.yS);
  const sx = 128 + (((wx - camX) * 3) >> 5);
  const sy = 116 + (((((wy - camY) * FSHORT) >> 8) * 3) >> 5)   // foreshortened ground

  return { sx, sy };
}

function crowdPixel(x, y) { return PAL.crowdDots[(x * 7 + y * 13 + ((x * y) >> 3)) % PAL.crowdDots.length]; }

/* ── FIELD VIEW (v0.3 oblique · v0.4 textured) ── */
function renderField(ctx, st) {
  ctx.fillStyle = PAL.grassB; ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  // — world-anchored 256u cells, band+column parity, Griffey-cut kelly green
  for (let band = 0; band < 24; band++) {
    const wy0 = band * 256;
    const s0 = groundToScreenY(st, wy0), s1 = groundToScreenY(st, wy0 + 256);
    if (s1 < 0 || s0 > VIEW_H) continue;
    const h = Math.max(1, s1 - s0);
    ctx.fillStyle = band % 2 ? PAL.grassA : PAL.grassB;
    ctx.fillRect(0, s0, VIEW_W, h);
    ctx.fillStyle = band % 2 ? PAL.grassB : PAL.grassA;
    for (let seg = 0; seg < 16; seg++) {
      if ((band + seg) % 2) continue;
      const p0 = fieldToScreen(st, seg * 256, wy0, 0), p1 = fieldToScreen(st, seg * 256 + 256, wy0, 0);
      if (p1.sx < 0 || p0.sx > VIEW_W) continue;
      ctx.fillRect(p0.sx, s0, Math.max(1, p1.sx - p0.sx), h);
    }
  }

  const tiles = getTiles(ctx);

  const P = GEO.plate;
  // ── outfield wall arc + stands that FILL upward (curved tiers, era look) ──
  // build wallY per screen column from the fence arc, then column-fill stands
  const wallY = new Int16Array(VIEW_W).fill(-999);
  {
    let prev = null;
    for (let a = -degToSteps(52); a <= degToSteps(52); a += 8) {
      const d = GEO.fenceDist(Math.max(-degToSteps(45), Math.min(degToSteps(45), a)));
      const rad = (a / CONST.ANGLE_STEPS) * TAU;
      const wx = P.x + Math.sin(rad) * d, wy = P.y - Math.cos(rad) * d;
      const pt = fieldToScreen(st, wx | 0, wy | 0, 0);
      if (prev) {
        const x0 = Math.min(prev.sx, pt.sx), x1 = Math.max(prev.sx, pt.sx);
        for (let x = Math.max(0, x0); x <= Math.min(VIEW_W - 1, x1); x++) {
          const t = x1 === x0 ? 0 : (x - x0) / (x1 - x0);
          wallY[x] = Math.round(prev.sy + (pt.sy - prev.sy) * t);
        }
      }
      prev = pt;
    }
  }
  for (let x = 0; x < VIEW_W; x++) {
    const wy = wallY[x];
    if (wy === -999 || wy < -60) continue;
    if (wy - 6 > 0) {

      ctx.fillStyle = PAL.stands2; ctx.fillRect(x, 0, 1, wy - 5);
      // crowd tiers follow the arc: 8px seat rows, sparse fans, strong railings
      for (let y = wy - 7; y >= 0; y--) {

        if ((row & 7) === 7) { ctx.fillStyle = '#181824'; ctx.fillRect(x, y, 1, 1); continue; }   // rail shadow
        if ((row & 7) === 6) { ctx.fillStyle = '#4e4e66'; ctx.fillRect(x, y, 1, 1); continue; }   // railing

// INIDISP-style brightness-step scene fades [v0.3, per wpB graphics docs]:
// 6 frames of quantized darkness (0.25 steps) on every scene/camera change.
const FADE = { t: 0, key: '' };
function render(ctx, st) {
  const fkey = st.scene + '|' + (st.scene === 'GAME' ? st.camera.mode : '');
  if (fkey !== FADE.key) { FADE.key = fkey; if (st.phase !== 'BLANK') FADE.t = 6; }
  switch (st.scene) {
    case 'TITLE': renderTitle(ctx, st); applyFade(ctx); return;
    case 'MATCHUP': renderMatchup(ctx, st); applyFade(ctx); return;
    case 'CARD': renderCardScreen(ctx, st, false); applyFade(ctx); return;
    case 'FINAL': renderCardScreen(ctx, st, true); applyFade(ctx); return;
  }
  // GAME
  if (st.phase === 'BLANK') {          // [PROVEN] 6-frame forced blank on contact
    // [DESIGN] 2-frame white impact pop inside the blank, then black
    ctx.fillStyle = st.phaseT < 2 ? '#f8f8f2' : '#000';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    return;
  }
  if (st.camera.mode === 'plate') renderPlate(ctx, st);
  else renderField(ctx, st);
  renderHUD(ctx, st);
  applyFade(ctx);
}
function applyFade(ctx) {
  if (FADE.t <= 0) return;
  FADE.t--;
  const step = Math.ceil(FADE.t / 2) * 0.25 + 0.25;      // 0.75 / 0.5 / 0.25 quantized
  ctx.fillStyle = 'rgba(0,0,0,' + step + ')';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
}

// Two layers, per the handoff's feel model: a continuous crowd/ambience bed +
// short SFX fired on the EXACT sim frame of each event (never from animation).
const AudioSys = {
  ctx: null, master: null, crowdGain: null, started: false, musicTimer: null,
  init() {
    if (this.started || typeof window === 'undefined') return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = 0.22;
    this.master.connect(this.ctx.destination);
    // crowd bed: looping filtered noise
    const len = this.ctx.sampleRate * 2;
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    let seed = 1234567;
    for (let i = 0; i < len; i++) { seed = (seed * 1103515245 + 12345) & 0x7fffffff; d[i] = ((seed / 0x3fffffff) - 1) * 0.8; }
    const src = this.ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const filt = this.ctx.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 420; filt.Q.value = 0.6;
    this.crowdGain = this.ctx.createGain(); this.crowdGain.gain.value = 0.0;
    src.connect(filt); filt.connect(this.crowdGain); this.crowdGain.connect(this.master);
    src.start();
    this.started = true;
  },
  setCrowd(level) {
    if (!this.started) return;
    const g = this.crowdGain.gain;
    g.cancelScheduledValues(this.ctx.currentTime);
    g.setTargetAtTime(level, this.ctx.currentTime, 0.4);
  },
  swell(amount, decay) {
    if (!this.started) return;
    const g = this.crowdGain.gain, t = this.ctx.currentTime;
    g.cancelScheduledValues(t);
    g.setValueAtTime(Math.min(0.34, (g.value || 0.06) + amount), t);
    g.setTargetAtTime(0.07, t + 0.15, decay || 1.2);
  },
  tone(freq, dur, type, vol, when, slide) {
    if (!this.started) return;
    const t = this.ctx.currentTime + (when || 0);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t + dur);
    g.gain.setValueAtTime(vol || 0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, freq, when, slideTo) {
    if (!this.started) return;
    const t = this.ctx.currentTime + (when || 0);
    const len = Math.max(1, this.ctx.sampleRate * dur | 0);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    let seed = 777; for (let i = 0; i < len; i++) { seed = (seed * 48271) % 2147483647; d[i] = (seed / 1073741823) - 1; }
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const filt = this.ctx.createBiquadFilter(); filt.type = 'bandpass'; filt.frequency.setValueAtTime(freq || 1800, t); filt.Q.value = 0.8;
    if (slideTo) filt.frequency.exponentialRampToValueAtTime(slideTo, t + dur);   // [v0.6 P3] swept whoosh support
    const g = this.ctx.createGain(); g.gain.setValueAtTime(vol || 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(filt); filt.connect(g); g.connect(this.master);
    src.start(t);
  },
  fanfare(notes, step, dur, type, vol) {
    notes.forEach((n, i) => this.tone(n, dur || 0.14, type || 'square', vol || 0.13, i * (step || 0.09)));
  },
  // vocal-ish umpire bark: sawtooth burst through a swept formant filter
  voice(syllables) {
    if (!this.started) return;
    let when = 0;
    for (const [f0, f1, dur] of syllables) {
      const t = this.ctx.currentTime + when;
      const o = this.ctx.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(120, t);
      o.frequency.exponentialRampToValueAtTime(85, t + dur);
      const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2.4;
      bp.frequency.setValueAtTime(f0, t);
      bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.001, t);
      g.gain.exponentialRampToValueAtTime(0.34, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(bp); bp.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + dur + 0.02);
      when += dur + 0.03;
    }

  ooh() {
    if (!this.started) return;
    const t = this.ctx.currentTime;
    this.noise(0.55, 0.16, 700);
    this.swell(0.06, 0.8);
  },
  /* ── v0.3 FULL AUDIO PACKAGE — all melodies original compositions ── */
  // two-voice ballpark organ: square lead + triangle bass, vibrato-free chunky
  organ(melody, bass, step, vol) {
    if (!this.started) return;
    step = step || 0.14; vol = vol || 0.12;
    melody.forEach((n, i) => { if (n) this.tone(n, step * 0.92, 'square', vol, i * step); });
    (bass || []).forEach((n, i) => { if (n) this.tone(n, step * 1.7, 'triangle', vol * 0.9, i * step * 2); });
  },
  // between-innings number (16 beats) — original comp "Seventh-Inning Strut"
  betweenInnings() {
    this.organ(
      [392, 494, 587, 494, 659, 587, 494, 392, 440, 523, 659, 523, 587, 494, 440, 392],
      [196, 247, 262, 196, 220, 262, 247, 196],
      0.13, 0.11);
  },
  // [v0.6 P3] crowd stomp-clap chant under the organ — fixed pattern (no RNG),
  // two bars of "clap ... clap ... clap-clap-clap", era-tasteful and short
  clapChant() {
    if (!this.started) return;
    const beat = 0.13;
    const bars = [[0, 2, 4, 6, 7], [8, 10, 12, 14, 15]];
    for (const bar of bars) for (const b of bar) {
      const acc = (b % 8 === 0);                                   // bar-downbeat accent
      this.noise(0.035, acc ? 0.13 : 0.09, 1150, b * beat);        // clap
      if (acc) this.tone(72, 0.09, 'sine', 0.15, b * beat);        // stomp
    }
  },
  // CHARGE! — the classic six-note build, original voicing
  charge() {
    const N = [392, 523, 659, 784, 659, 784];
    N.forEach((n, i) => this.tone(n, i === 5 ? 0.34 : 0.09, 'square', 0.14, i * (i === 4 ? 0.16 : 0.085)));
    this.swell(0.08, 1.0);
  },
  // walk-up ditty by batter archetype [v0.3]
  walkup(pow, spd) {
    if (pow >= 11) this.organ([196, 233, 262, 311], [98], 0.11, 0.13);          // slugger: heavy minor climb
    else if (spd >= 11) this.organ([523, 659, 784, 1047], [262], 0.07, 0.11);   // burner: quick sprint up
    else this.organ([392, 494, 440, 523], [196], 0.10, 0.10);                   // contact: neutral bounce
  },
  // PA-announcer-ish stinger: formant syllables matched to name length
  paCall(syl) {
    const shapes = [[720, 520], [560, 380], [820, 600], [480, 340]];
    const arr = [];
    for (let i = 0; i < syl; i++) arr.push([shapes[i % 4][0], shapes[i % 4][1], i === syl - 1 ? 0.22 : 0.11]);
    this.voice(arr);
  },
  // consume this tick's sim events — exact-frame audio [handoff requirement]
  consume(events, st) {
    if (!this.started) return;
    for (const e of events) {
      switch (e.type) {
        case 'release': {   // [v0.6 P3] whoosh scaled by actual flight speed: T = frames mound→plate (20 fast … 26 slow)
          const v = Math.max(0, Math.min(1, (26 - (e.data ? e.data.T : 23)) / 6));
          this.noise(0.07 + v * 0.06, 0.10 + v * 0.12, 2600 + v * 1000, 0, 1400 - v * 500);
          break;
        }
        case 'crack': {     // [v0.6 P3] louder, clearly tiered: q4 crack · q2 thwack · q0 dribbler
          const q = e.data ? e.data.q : 2;
          if (e.data && e.data.bunt) { this.tone(120, 0.05, 'triangle', 0.18); this.noise(0.03, 0.12, 800); break; }
          if (q === 4) {
            this.noise(0.07, 0.44, 3000, 0, 1200);
            this.tone(240, 0.07, 'triangle', 0.3);
            this.tone(90, 0.09, 'sine', 0.26);                 // low thump under the crack
          } else if (q === 2) {
            this.noise(0.06, 0.32, 1900, 0, 1000);
            this.tone(170, 0.06, 'triangle', 0.24);
          } else {
            this.noise(0.04, 0.2, 1200);
            this.tone(120, 0.05, 'triangle', 0.16);
          }
          this.swell(q === 4 ? 0.18 : q === 2 ? 0.1 : 0.05);
          break;
        }
        case 'catchpop': case 'catch': this.noise(0.045, 0.2, 900); break;
        case 'pickup': this.noise(0.03, 0.1, 700); break;
        case 'throw': case 'pickoff': this.noise(0.06, 0.08, 2000); break;
        case 'bounce': if (e.data && e.data.n <= 2) this.tone(90, 0.05, 'triangle', 0.1); break;
        case 'dive': this.noise(0.1, 0.12, 500); break;
        case 'call:strike': this.voice([[900, 420, 0.13], [520, 260, 0.2]]); break;          // "stee-RIKE"
        case 'call:ball': this.voice([[420, 300, 0.16]]); break;                              // "ball"
        case 'call:strikeout': this.voice([[900, 420, 0.12], [560, 240, 0.3]]); this.swell(0.12); break;
        case 'call:walk': this.fanfare([262, 330, 392], 0.09, 0.12); break;
        case 'call:foul': this.ooh(); break;
        case 'call:out': this.voice([[760, 300, 0.22]]); this.swell(0.1); break;              // "OUT"
        case 'call:hbp': this.tone(180, 0.2, 'sawtooth', 0.1, 0, 120); break;
        case 'flyout': this.swell(0.1); break;
        case 'newBatter': {   // walk-up ditty by archetype + PA stinger [v0.3]
          if (e.data && st.scene === 'GAME') {
            this.walkup(e.data.pow || 8, e.data.spd || 8);
            this.paCall(e.data.syl || 2);
          } else this.fanfare([392, 523, 659], 0.07, 0.09, 'square', 0.05);
          break;
        }
        case 'hr': {          // [v0.3] layered eruption: fanfare + bells + double swell
          const big = e.data && e.data.ft >= 400;
          this.fanfare(big ? [392, 494, 587, 784, 988, 784, 988, 1175] : [392, 494, 587, 784, 587, 784], 0.09, 0.2, 'square', 0.16);
          [1319, 1568, 2093].forEach((n, i) => this.tone(n, 0.5, 'triangle', 0.07, 0.5 + i * 0.13));
          this.noise(1.2, 0.10, 900, 0.1);                       // roar bed
          this.swell(big ? 0.34 : 0.26, big ? 3.0 : 2.2);
          if (this.ctx) { const g = this.crowdGain.gain; g.setTargetAtTime(0.22, this.ctx.currentTime + 1.4, 0.6); g.setTargetAtTime(0.08, this.ctx.currentTime + 3.4, 1.2); }
          break;
        }
        case 'run': this.fanfare([659, 880], 0.06, 0.1, 'triangle', 0.14); this.swell(0.14); break;
        case 'error': this.fanfare([220, 208], 0.09, 0.14, 'sawtooth', 0.1); break;
        case 'steal': this.noise(0.12, 0.14, 600); this.swell(0.05, 0.6); break;             // jump! [v0.3]
        case 'stolen': this.fanfare([523, 659, 784], 0.06, 0.1, 'square', 0.12); this.swell(0.1); break;
        case 'switch': this.tone(740, 0.04, 'square', 0.07); break;
        case 'tagup': case 'go': case 'advance': break;
        case 'phantom': this.tone(660, 0.05, 'square', 0.07); break;
        case 'playball': this.fanfare([392, 523, 659, 784], 0.1, 0.16); this.setCrowd(0.09); break;
        case 'halfStart': this.setCrowd(0.09); break;                    // gameplay bed > title RMS
        case 'card': this.setCrowd(0.03); this.betweenInnings(); this.clapChant(); break;  // organ + chant [v0.6 P3]
        case 'final': this.fanfare([523, 659, 784, 1047], 0.12, 0.3); this.swell(0.2, 2.5); break;
        case 'menu': this.tone(880, 0.05, 'square', 0.08); break;
        case 'wall': this.noise(0.06, 0.18, 500); break;
        case 'windup': break;
      }
    }
    // CHARGE! riff: batting team just put a runner into scoring position [v0.3]
    const risp = st.scene === 'GAME' && !!(st.bases[2] || st.bases[3]);
    if (risp && !this.lastRISP && st.phase === 'PREPITCH') this.charge();
    this.lastRISP = risp;
    // title riff (original 8-note loop) while on title screen
    if (st.scene === 'TITLE' && st.frame % 96 === 1) {
      this.fanfare([330, 392, 440, 523, 440, 392, 494, 523], 0.11, 0.12, 'square', 0.07);
    }
  },
};
/* ════════════════ SECTION §J — SHELL: fixed-timestep loop, canvas, keyboard ════════════════ */
// Fixed 60.0988 Hz accumulator [PROVEN cadence]. Simulation only advances in
// whole ticks; rendering happens per animation frame (no interpolation —
// "authentic feel" mode is the only mode in the demo).
const Shell = {
  state: null, bus: null, canvas: null, ctx: null,
  acc: 0, last: 0, paused: false, idleT: 0,
  boot() {
    const cv = document.getElementById('mbd-canvas');
    cv.width = VIEW_W; cv.height = VIEW_H;
    this.canvas = cv; this.ctx = cv.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;
    this.bus = new InputBus();
    this.state = newGame({});
    window.addEventListener('keydown', (e) => this.onKey(e, true));
    window.addEventListener('keyup', (e) => this.onKey(e, false));
    this.last = performance.now();
    requestAnimationFrame((t) => this.frame(t));
  },
  onKey(e, down) {
    if (e.repeat) { e.preventDefault(); return; }
    AudioSys.init();
    if (this.state && this.state.demo && down) {   // any key exits attract mode
      this.state = newGame({}); this.bus = new InputBus(); e.preventDefault(); return;
    }
    if (e.code === 'Escape' && down) { this.paused = !this.paused; e.preventDefault(); return; }
    const bit = KEYMAP[e.code], bit2 = KEYMAP2[e.code];
    if (bit === undefined && bit2 === undefined) return;
    e.preventDefault();
    if (bit !== undefined) { if (down) { this.bus.raw[0] |= bit; this.idleT = 0; } else this.bus.raw[0] &= ~bit; }
    if (bit2 !== undefined) { if (down) { this.bus.raw[1] |= bit2; this.idleT = 0; } else this.bus.raw[1] &= ~bit2; }
  },
  frame(now) {
    const SPF = 1000 / CONST.FPS;
    let dt = now - this.last; this.last = now;
    if (dt > 250) dt = 250;                        // tab-away guard
    if (!this.paused) this.acc += dt;
    let steps = 0;
    while (this.acc >= SPF && steps < 4) {
      this.acc -= SPF; steps++;
      const frames = this.bus.latch();
      const r = tick(this.state, frames);
      AudioSys.consume(this.state.events, this.state);
      if (r === 'RESET') { this.state = newGame({}); this.bus = new InputBus(); break; }
      // attract mode: menu pick or 15 s idle on title → CPU-vs-CPU demo game
      if (r === 'DEMO' || (this.state.scene === 'TITLE' && this.state.sceneT > 60 * 15)) {
        this.state = newGame({ scene: 'GAME', demo: true, seed: [9, 9, 9, 9, 9] });
        this.state.scene = 'GAME'; startHalf(this.state);
      }
    }
    render(this.ctx, this.state);
    if (this.paused) {
      this.ctx.fillStyle = 'rgba(0,0,0,0.55)'; this.ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      centerText(this.ctx, 'PAUSE', 104, '#f8f8f2', 2);
      centerText(this.ctx, 'ESC TO RESUME', 126, '#9aa0b8', 1);
    }
    requestAnimationFrame((t) => this.frame(t));
  },
};

/* ════════════════ SECTION §K — TESTHOOKS (node/headless) ════════════════ */
const MBD = {
  version: '0.6.0',
  CONST, TUNE, GEO, TABLE16, PITCH_TYPES, LAUNCH, FIELD_POS, BTN,
  RNG, InputBus, buildTeams,
  toSub, toInt, vecFromAngle, degToSteps,
  newBall, ballStep, predictLanding, computeLaunch, applyContact, setThrow,
  newGame, tick, startHalf, startWindup, releasePitch, startSwing, selectPitchType,
  battingTeam, fieldingTeam, lineup,
  // rules-engine hooks for test labs
  awardWalk, newPA, recordPAOut, scoreRun, endLivePlay, foulBall, computeForces, makeRunner,
};
if (typeof globalThis !== 'undefined') globalThis.MBD = MBD;
if (typeof window !== 'undefined' && typeof document !== 'undefined') {
  if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', () => Shell.boot());
  else Shell.boot();
}
