<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr. Baseball Dynasty — Field Demo</title>
<style>
  html, body { margin: 0; padding: 0; background: #07070f; height: 100%; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
         font-family: monospace; color: #9aa0b8; }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges;
           width: min(96vw, calc(92vh * 8 / 7)); aspect-ratio: 8 / 7;
           border: 2px solid #1c1c30; box-shadow: 0 0 42px rgba(40,68,140,0.35); }
  #foot { font-size: 11px; letter-spacing: 0.06em; opacity: 0.7; text-align: center; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="mbd-canvas"></canvas>
  <div id="foot">MR. BASEBALL DYNASTY · FIELD DEMO v0.6 · arrows=d-pad · Z/space=B · X=A · enter=start · esc=pause</div>
</div>
<script src="game.js"></script>
</body>
</html>
