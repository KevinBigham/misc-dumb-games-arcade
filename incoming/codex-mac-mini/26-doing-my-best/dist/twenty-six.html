@layer reset {

const EVENT_DAYS = [3, 6, 10, 13, 17, 20, 24, 27];
const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
const stats = ['cash', 'energy', 'peace', 'social'];
const has = (state, perk) => state.upgrades.includes(perk);
const sample = (state, items, count) => {
  const pool = [...items], out = [];
  while (out.length < count && pool.length) out.push(pool.splice(Math.floor(random(state) * pool.length), 1)[0]);
  return out;
};

function createLife(seed = 26) {
  return {
    version: QUARTERLIFE_VERSION, seed: normalizeSeed(seed), rngState: normalizeSeed(seed),
    day: 1, phase: 'playing', stats: { cash: 650, energy: 70, peace: 58, social: 52 },
    food: 0, tidy: 0, hand: ['cook', 'walk', 'gig'], previous: null, rerolled: false, petted: false,
    pending: null, offers: [], upgrades: [], usedEvents: [], memories: [], history: [],
    boundaries: 0, combos: 0, recoveries: 0, earnings: 0, spending: 0, points: 0,
    feed: [{ day: 1, title: 'A fresh-ish start', text: '$650. A full-time job. A plant with trust issues. Let’s make a month of it.', kind: 'life' }],
    last: null, ending: null,
  };
}

function log(state, title, text, kind = 'life') {
  state.feed.unshift({ day: state.day, title, text, kind });
  state.feed = state.feed.slice(0, 40);
}

function apply(state, effects) {
  for (const [key, amount] of Object.entries(effects)) {
    if (key === 'cash') {
      state.stats.cash += amount;
      if (amount > 0) state.earnings += amount;
      else state.spending -= amount;
    } else state.stats[key] = clamp(state.stats[key] + amount, 0, 100);
  }
}

function memory(state, title) {
  if (!state.memories.some(m => m.title === title)) {
    state.memories.push({ title, day: state.day });
    state.points += 100;
  }
}

function comboFor(state, cardId) {
  const card = LIFE_CARDS[cardId];
  if (!card || !state.previous) return null;
  const previous = LIFE_CARDS[state.previous];
  if (state.previous === 'cook' && card.tag === 'social') return { title: 'Dinner-table lore', text: 'Cook → connect: +$25, +8 connection, +6 peace.', effects: { cash: 25, social: 8, peace: 6 } };
  if (previous.tag === 'move' && card.tag === 'create') return { title: 'Main-character energy', text: 'Move → create: +14 peace and a bonus memory.', effects: { peace: 14 }, memory: 'A little main-character moment' };
  if (previous.tag === 'work' && card.tag === 'rest') return { title: 'Work. Then actually stop.', text: 'Hustle → rest: +10 energy, +10 peace.', effects: { energy: 10, peace: 10 } };
  if (previous.tag === 'admin' && card.tag === 'rest') return { title: 'Nothing hanging over you', text: 'Admin → rest: +16 peace.', effects: { peace: 16 } };
  if (previous.tag === 'social' && card.tag === 'boundary') return { title: 'A social battery, respected', text: 'Connect → boundary: +10 energy, +8 peace.', effects: { energy: 10, peace: 8 } };
  return null;
}

function cardEffects(state, id) {
  if (!Object.hasOwn(LIFE_CARDS, id)) return null;
  const card = LIFE_CARDS[id], effects = { ...card.effects };
  if (card.tag === 'rest' && has(state, 'pillow')) effects.energy = (effects.energy || 0) + 8;
  if (card.tag === 'social' && has(state, 'regulars')) effects.social = (effects.social || 0) + 6;
  if (card.tag === 'work' && has(state, 'rates')) effects.cash = (effects.cash || 0) + 35;
  return effects;
}

function canPlay(state, id) {
  if (state.phase !== 'playing') return 'Finish the current moment first.';
  if (!Object.hasOwn(LIFE_CARDS, id) || (!state.hand.includes(id) && id !== 'sleep')) return 'That plan is not available.';
  const effects = cardEffects(state, id);
  if (effects.cash < 0 && state.stats.cash + effects.cash < 0) return 'Not enough cash. A free night still counts.';
  if (effects.energy < 0 && state.stats.energy + effects.energy < 0) return 'Your battery says no. Try a rest night.';
  return null;
}

function deal(state) {
  const all = Object.keys(LIFE_CARDS).filter(id => id !== 'sleep' && id !== state.previous);
  const result = sample(state, all, 3);
  // A setup always has its payoff next day. Sleep is permanently available.
  const tag = LIFE_CARDS[state.previous]?.tag;
  if (state.previous === 'cook') result[0] = 'host';
  else if (tag === 'move') result[0] = 'create';
  else if (tag === 'social') result[0] = 'boundary';
  state.hand = [...new Set(result)];
  while (state.hand.length < 3) state.hand.push(sample(state, all.filter(id => !state.hand.includes(id)), 1)[0]);
}

function playCard(state, id) {
  const error = canPlay(state, id);
  if (error) return { ok: false, error };
  const card = LIFE_CARDS[id], effects = cardEffects(state, id), combo = comboFor(state, id);
  apply(state, effects);
  state.food += (card.food || 0) + (id === 'cook' && has(state, 'rice') ? 2 : 0);
  state.tidy = Math.min(7, state.tidy + (card.tidy || 0));
  if (card.memory) memory(state, card.memory);
  if (card.tag === 'boundary') state.boundaries++;
  let note = card.note;
  if (card.chance) {
    if (random(state) < 0.55) {
      apply(state, { peace: 18, social: 10 }); memory(state, 'A date worth leaving the house for');
      note = 'You talked until the café closed. They asked real questions. Wait. That was nice?';
    } else {
      apply(state, { peace: -6 }); memory(state, 'An extremely good bad-date story');
      note = 'They explained cryptocurrency for 38 minutes. The group chat is going to eat this up.';
    }
  }
  if (card.scroll) {
    if (random(state) < 0.3) {
      apply(state, { peace: 22 }); memory(state, 'The raccoon with the grape');
      note = 'The raccoon got the grape. You laughed until you cried. Rare algorithm W.';
    } else { apply(state, { energy: -5, peace: -6 }); note = 'It is somehow 1:14 am. You now know how to grout a bathroom you do not own.'; }
  }
  state.points += 20;
  if (combo) {
    apply(state, combo.effects); state.combos++; state.points += 75;
    if (combo.memory) memory(state, combo.memory);
    log(state, combo.title, combo.text, 'combo');
  }
  state.last = { title: combo?.title || card.title, text: note, combo: Boolean(combo) };
  log(state, card.title, note, 'action');
  state.history.push({ day: state.day, card: id, combo: Boolean(combo) });
  state.previous = id;
  settleDay(state);
  return { ok: true, combo: combo?.title || null };
}

function settleDay(state) {
  const weekend = (state.day - 1) % 7 >= 5;
  const fed = state.food > 0;
  if (fed) state.food--;
  apply(state, { energy: -(weekend ? 4 : 8) + (fed ? 4 : 0), peace: has(state, 'boundaries') ? -1 : -3, social: -3 });
  if (state.tidy > 0) { apply(state, { peace: 2 }); state.tidy--; }
  if ((state.day - 1) % 7 === 4) {
    apply(state, { cash: 420 }); log(state, 'Direct deposit hit. +$420', 'Your weekly take-home pay. Rich for approximately seven minutes.', 'money');
  }
  if (state.day % 7 === 0) {
    apply(state, { cash: -250 }); log(state, 'The boring bills. −$250', 'Groceries, utilities, transport, and your ordinary life. Rent is separate.', 'money');
  }
  if (state.stats.energy === 0 || state.stats.peace === 0) {
    state.recoveries++;
    apply(state, { energy: 18, peace: 15 });
    log(state, 'A very human reset', 'You hit a wall. An early night and a friend checking in got you moving again. No game over for being human.', 'life');
  }
  if (state.day === QUARTERLIFE_DAYS) { finishMonth(state); return; }
  if (EVENT_DAYS.includes(state.day)) {
    const available = LIFE_EVENTS.filter(e => !state.usedEvents.includes(e.id));
    state.pending = sample(state, available, 1)[0].id;
    state.usedEvents.push(state.pending); state.phase = 'event'; return;
  }
  afterMoment(state);
}

function afterMoment(state) {
  if (state.day % 7 === 0) {
    state.phase = 'upgrade';
    state.offers = sample(state, Object.keys(LIFE_UPGRADES).filter(id => !has(state, id)), 3);
  } else nextDay(state);
}

function nextDay(state) {
  state.day++; state.phase = 'playing'; state.rerolled = false; state.petted = false;
  state.pending = null; state.offers = []; deal(state);
}

function resolveLifeEvent(state, index) {
  if (state.phase !== 'event' || !Number.isInteger(index)) return { ok: false, error: 'No choice to resolve.' };
  const event = LIFE_EVENTS.find(e => e.id === state.pending), option = event?.options[index];
  if (!option) return { ok: false, error: 'That choice is not available.' };
  if (option.effects.cash < 0 && state.stats.cash + option.effects.cash < 0) return { ok: false, error: 'That would cost more cash than you have.' };
  apply(state, option.effects);
  if (option.memory) memory(state, option.memory);
  if (option.boundary) state.boundaries++;
  state.food += option.food || 0;
  state.tidy = Math.min(7, state.tidy + (option.tidy || 0));
  state.last = { title: option.label, text: option.reply, combo: false };
  log(state, event.title, option.reply, 'message');
  state.pending = null; afterMoment(state);
  return { ok: true };
}

function chooseLifeUpgrade(state, id) {
  if (state.phase !== 'upgrade' || !state.offers.includes(id)) return { ok: false, error: 'That upgrade is not available.' };
  state.upgrades.push(id);
  if (id === 'buffer') apply(state, { cash: 130 });
  log(state, LIFE_UPGRADES[id].title, LIFE_UPGRADES[id].description, 'upgrade');
  state.last = { title: 'A little life upgrade', text: LIFE_UPGRADES[id].flavor, combo: true };
  nextDay(state); return { ok: true };
}

function rerollPlans(state) {
  if (state.phase !== 'playing' || state.rerolled || state.stats.peace < 5) return { ok: false, error: 'You can rethink once a day, for 5 peace.' };
  apply(state, { peace: -5 }); state.rerolled = true;
  const pool = Object.keys(LIFE_CARDS).filter(id => id !== 'sleep' && !state.hand.includes(id));
  state.hand = sample(state, pool, 3);
  return { ok: true };
}

function petCat(state) {
  if (state.phase !== 'playing' || state.petted) return { ok: false, error: 'Miso is recharging. More pets tomorrow.' };
  state.petted = true; apply(state, { peace: 3 });
  return { ok: true };
}

function finishMonth(state) {
  apply(state, { cash: -QUARTERLIFE_RENT });
  state.phase = 'ended'; state.hand = []; state.pending = null; state.offers = [];
  const solvent = state.stats.cash >= 0;
  const balanced = ['energy', 'peace', 'social'].every(key => state.stats[key] >= 25);
  const richLife = state.memories.length >= 4;
  const boundaried = state.boundaries >= 3;
  const wins = Number(solvent) + Number(balanced) + Number(richLife) + Number(boundaried);
  const title = wins === 4 ? 'A life that actually feels like yours.' : solvent && richLife ? 'Rent paid. Lore acquired.' : solvent ? 'The bills are paid. You’re still becoming.' : 'A plot twist. Not a verdict.';
  const text = wins === 4 ? 'You made room for your people, your peace, and your rent. Nobody has it all figured out. You figured out enough.' : solvent ? 'You kept the lights on and made it through a month of being a person. There is no perfect run at being 26.' : `You’re $${Math.abs(state.stats.cash)} short after rent. That is a problem to solve, not a personality trait. Next month is another run.`;
  state.points += wins * 250 + state.combos * 25 + Math.round((state.stats.energy + state.stats.peace + state.stats.social) * 2);
  state.ending = { title, text, solvent, balanced, richLife, boundaried, wins, score: state.points };
  log(state, solvent ? 'Rent is paid. You did it.' : 'Rent needs a plan.', text, 'money');
}

/** Validate before accepting persisted state. No migration exists before initial v1. */
function validLife(state) {
  if (!state || state.version !== QUARTERLIFE_VERSION) return false;
  if (!Number.isInteger(state.seed) || state.seed < 0 || state.seed > 0xffffffff || !Number.isInteger(state.rngState) || state.rngState < 0 || state.rngState > 0xffffffff) return false;
  if (!Number.isInteger(state.day) || state.day < 1 || state.day > 28 || !['playing', 'event', 'upgrade', 'ended'].includes(state.phase)) return false;
  if (!state.stats || stats.some(key => !Number.isSafeInteger(state.stats[key]))) return false;
  if (['energy', 'peace', 'social'].some(key => state.stats[key] < 0 || state.stats[key] > 100)) return false;
  for (const key of ['food', 'tidy', 'boundaries', 'combos', 'recoveries', 'earnings', 'spending', 'points']) if (!Number.isSafeInteger(state[key]) || state[key] < 0 || state[key] > 1000000) return false;
  if (typeof state.petted !== 'boolean' || typeof state.rerolled !== 'boolean') return false;
  for (const [key, source, max] of [['hand', LIFE_CARDS, 3], ['offers', LIFE_UPGRADES, 3], ['upgrades', LIFE_UPGRADES, 3]]) {
    if (!Array.isArray(state[key]) || state[key].length > max || new Set(state[key]).size !== state[key].length || state[key].some(id => typeof id !== 'string' || !Object.hasOwn(source, id))) return false;
  }
  if (state.previous !== null && !Object.hasOwn(LIFE_CARDS, state.previous)) return false;
  const short = value => typeof value === 'string' && value.length <= 1000;
  if (!Array.isArray(state.history) || state.history.length > 28 || state.history.some((h, i) => !h || !Object.hasOwn(LIFE_CARDS, h.card) || h.day !== i + 1 || typeof h.combo !== 'boolean')) return false;
  if (state.previous !== (state.history.at(-1)?.card ?? null)) return false;
  if (state.upgrades.length !== Math.floor((state.day - 1) / 7)) return false;
  if (!Array.isArray(state.memories) || state.memories.length > 40 || state.memories.some(m => !m || !short(m.title) || !Number.isInteger(m.day) || m.day < 1 || m.day > 28)) return false;
  if (!Array.isArray(state.feed) || state.feed.length > 40 || state.feed.some(f => !f || !short(f.title) || !short(f.text) || !short(f.kind) || !Number.isInteger(f.day))) return false;
  if (!Array.isArray(state.usedEvents) || state.usedEvents.length > 8 || new Set(state.usedEvents).size !== state.usedEvents.length || state.usedEvents.some(id => !LIFE_EVENTS.some(e => e.id === id))) return false;
  if (state.last !== null && (!state.last || !short(state.last.title) || !short(state.last.text) || typeof state.last.combo !== 'boolean')) return false;
  const ended = state.phase === 'ended';
  if (ended) {
    if (state.day !== 28 || state.history.length !== 28 || !state.ending || !short(state.ending.title) || !short(state.ending.text) || !Number.isSafeInteger(state.ending.score) || !Number.isInteger(state.ending.wins)) return false;
    if (['solvent', 'balanced', 'richLife', 'boundaried'].some(key => typeof state.ending[key] !== 'boolean')) return false;
  } else if (state.ending !== null) return false;
  if (state.phase === 'event' && (!EVENT_DAYS.includes(state.day) || !state.usedEvents.includes(state.pending))) return false;
  if (state.phase !== 'event' && state.pending !== null) return false;
  if (state.phase === 'upgrade' && (state.day % 7 !== 0 || state.offers.length !== 3 || state.offers.some(id => state.upgrades.includes(id)))) return false;
  if (state.phase !== 'upgrade' && state.offers.length) return false;
  if (state.phase === 'playing' && (state.hand.length !== 3 || state.history.length !== state.day - 1)) return false;
  if (['event', 'upgrade'].includes(state.phase) && state.history.length !== state.day) return false;
  return true;
}




function createLifeStorage(storage) {
  let blocked = false, warning = '', loaded = false, knownRaw = null;
  const api = {
    load() {
      loaded = true;
      try {
        const raw = storage?.getItem(QUARTERLIFE_KEY) ?? null;
        knownRaw = raw;
        if (!raw) return null;
        const state = JSON.parse(raw);
        if (state.version !== QUARTERLIFE_VERSION) throw new Error('This save is from another version. It will be kept untouched; this session will not save.');
        if (!validLife(state)) throw new Error('Your saved month could not be read. It will be kept untouched; this session will not save.');
        return state;
      } catch (error) { blocked = true; warning = error.message; return null; }
    },
    save(state) {
      if (!loaded) api.load();
      if (blocked || !validLife(state)) return false;
      try {
        if (!storage) throw new Error('Storage unavailable');
        if ((storage.getItem(QUARTERLIFE_KEY) ?? null) !== knownRaw) {
          blocked = true;
          warning = 'Another tab changed this month. Its save is safe. Reload to continue that save; this tab will not overwrite it.';
          return false;
        }
        const next = JSON.stringify(state);
        storage.setItem(QUARTERLIFE_KEY, next); knownRaw = next; return true;
      } catch { warning = 'This browser could not save your month. You can still play this session.'; return false; }
    },
    get warning() { return warning; },
    get blocked() { return blocked; },
  };
  return api;
}



/** Presentation-only selectors. These never mutate a run or consume its RNG. */
function lifeEra(state) {
  const count = tag => state.history.filter(h => LIFE_CARDS[h.card].tag === tag).length;
  if (count('rest') >= 13) return { name: 'Professionally Horizontal', line: 'CEO of finding out that a nap was the answer.', icon: 'moon' };
  if (count('work') >= 7) return { name: 'The Invoice Goblin', line: 'An ambitious little creature with a spreadsheet and a dream.', icon: 'laptop' };
  if (count('social') >= 7) return { name: 'The Glue Friend', line: 'You turned “we should hang out” into an actual location.', icon: 'heart' };
  if (state.boundaries >= 7) return { name: 'The Boundary Renaissance', line: 'Unavailable, respectfully. Thriving, intermittently.', icon: 'shield' };
  if (count('create') >= 5) return { name: 'The Side-Quest Romantic', line: 'You made room for the version of you that makes things.', icon: 'spark' };
  if (count('home') >= 5) return { name: 'Domestically Delusional', line: 'A stocked fridge and clean sheets. Basically an empire.', icon: 'bowl' };
  if (state.combos >= 6) return { name: 'Small-Win Stacking Legend', line: 'One tiny good decision quietly became another.', icon: 'check' };
  return { name: 'Doing My Best, Actually', line: 'Not a finished product. A pretty good person-in-progress.', icon: 'sun' };
}

function weekRecap(state) {
  const first = Math.floor((state.day - 1) / 7) * 7 + 1;
  const actions = state.history.filter(h => h.day >= first);
  return {
    nights: actions.length,
    work: actions.filter(h => LIFE_CARDS[h.card].tag === 'work').length,
    rest: actions.filter(h => LIFE_CARDS[h.card].tag === 'rest').length,
    social: actions.filter(h => LIFE_CARDS[h.card].tag === 'social').length,
    memories: state.memories.filter(m => m.day >= first).length,
    combos: actions.filter(h => h.combo).length,
  };
}

function sceneCaption(state) {
  if (state.stats.energy < 25) return 'Low battery. Still a whole person.';
  if (state.stats.social < 20) return 'Maybe send someone a little “hey.”';
  const last = LIFE_CARDS[state.previous];
  if (last?.tag === 'rest') return 'An evening without a deliverable.';
  if (last?.tag === 'social') return 'Still smiling about something they said.';
  if (last?.tag === 'work') return 'Laptop closed. Probably. Mostly.';
  if (last?.tag === 'create') return 'A little more you than yesterday.';
  if (last?.tag === 'boundary') return 'The quiet you actually wanted.';
  return 'A perfectly imperfect little life';
}

function statCard(key, label, s, subtitle, delta = 0) {
  const color = { cash: 'sage', energy: 'butter', peace: 'lavender', social: 'peach' }[key];
  const value = s.stats[key];
  return `<div class="stat ${color} ${key !== 'cash' && value < 25 ? 'low' : ''}"><div class="stat-icon">${icon(key === 'social' ? 'heart' : key)}</div><div class="stat-copy"><span class="eyebrow">${label}</span><div class="stat-value">${key === 'cash' ? dollars(value) : value}<small>${key === 'cash' ? 'available' : '/ 100'}</small></div>${key !== 'cash' ? `<div class="meter" role="meter" aria-label="${label}" aria-valuenow="${value}" aria-valuemin="0" aria-valuemax="100"><i style="width:${value}%"></i></div>` : `<span class="stat-note">${subtitle}</span>`}</div>${delta ? `<span class="stat-delta ${delta > 0 ? 'positive' : 'negative'}" aria-label="Latest change ${delta}">${delta > 0 ? '+' : '−'}${key === 'cash' ? '$' : ''}${Math.abs(delta)}</span>` : ''}</div>`;
}

function effectsHtml(effects) {
  return Object.entries(effects).map(([key, value]) => `<span class="effect ${value < 0 ? 'cost' : 'gain'}">${icon(key === 'social' ? 'heart' : key)} ${key === 'cash' ? `${value < 0 ? '−' : '+'}$${Math.abs(value)}` : `${value < 0 ? '−' : '+'}${Math.abs(value)}`}<span class="sr-only"> ${key}</span></span>`).join('');
}

function planLabel(s, id, error) {
  const card = LIFE_CARDS[id];
  const effects = Object.entries(cardEffects(s, id)).map(([key, value]) => `${value > 0 ? 'plus' : 'minus'} ${Math.abs(value)} ${key === 'social' ? 'connection' : key === 'cash' ? 'dollars' : key}`).join(', ');
  const combo = comboFor(s, id);
  return escapeHtml(`${card.title}. ${card.subtitle} ${effects}.${card.food ? ` Makes ${card.food + (s.upgrades.includes('rice') ? 2 : 0)} meals.` : ''}${combo ? ` Combo ready: ${combo.text}` : ''}${error ? ` ${error}` : ''}`);
}

function plans(s, started) {
  return `<section class="plans" id="plans" aria-labelledby="plans-title"><div class="section-title"><div><span class="eyebrow">ONE EVENING. MANY POSSIBILITIES.</span><h2 id="plans-title" tabindex="-1">What’s the move?</h2></div><button class="text-button reroll" data-action="reroll" ${!started || s.phase !== 'playing' || s.rerolled || s.stats.peace < 5 ? 'disabled' : ''}>${icon('refresh')} Rethink <small>−5 peace</small></button></div>
  <div class="cards">${s.hand.map((id, i) => {
    const card = LIFE_CARDS[id], combo = comboFor(s, id), error = canPlay(s, id);
    return `<button class="plan ${card.color} ${combo ? 'has-combo' : ''}" data-action="play" data-id="${id}" ${!started || error ? 'disabled' : ''} aria-label="${planLabel(s, id, error)}"><div class="card-top"><span class="card-symbol">${icon(card.icon)}</span><span class="tag">${card.tag === 'chance' ? 'a little risky' : card.tag}</span><kbd>${i + 1}</kbd></div><h3>${card.title}</h3><p>${card.subtitle}</p><div class="effects">${effectsHtml(cardEffects(s, id))}${card.food ? `<span class="effect food">${icon('bowl')} +${card.food + (s.upgrades.includes('rice') ? 2 : 0)} meals</span>` : ''}</div><div class="card-bottom">${error && started ? `<span>${escapeHtml(error)}</span>` : combo ? `<span class="combo-label">${icon('spark')} COMBO READY</span>` : `<span>${card.memory ? '＋ A little memory' : card.chance ? '55% spark · 45% story' : card.scroll ? '30% joy · 70% regrets' : 'Make a little room for life'}</span>`}${icon('arrow')}</div>${combo ? `<span class="combo-tooltip">${combo.text}</span>` : ''}</button>`;
  }).join('')}</div>
  <div class="plan-footer"><span>Day job: handled. Choose how to spend your evening.</span><button class="rest-button" data-action="play" data-id="sleep" ${!started || s.phase !== 'playing' ? 'disabled' : ''}>${icon('moon')} Just go to bed <span>+${cardEffects(s, 'sleep').energy} energy</span><kbd>4</kbd>${comboFor(s, 'sleep') ? '<b>+ combo</b>' : ''}</button></div>

}

function sidebar(s) {

async function downloadLifeRecap(state) {
  if (state.phase !== 'ended') return false;
  const canvas = document.createElement('canvas');
  canvas.width = 1000; canvas.height = 1280;
  const ctx = canvas.getContext('2d');
  if (!ctx) throw new Error('This browser could not create your recap image.');
  const ink = '#2b3c33', muted = '#7e896e';
  const text = (value, x, y, size = 24, color = ink, serif = false) => {
    ctx.fillStyle = color; ctx.font = `${size}px ${serif ? 'Georgia' : 'sans-serif'}`; ctx.fillText(String(value), x, y);
  };
  const wrap = (value, x, y, width, size = 24, lineHeight = 33, color = ink, serif = false) => {
    ctx.font = `${size}px ${serif ? 'Georgia' : 'sans-serif'}`;
    let line = '';
    for (const word of String(value).split(' ')) {
      const next = line ? `${line} ${word}` : word;
      if (ctx.measureText(next).width > width && line) { text(line, x, y, size, color, serif); y += lineHeight; line = word; }
      else line = next;
    }
    if (line) { text(line, x, y, size, color, serif); y += lineHeight; }
    return y;
  };
  const box = (x, y, w, h, fill) => { ctx.fillStyle = fill; ctx.beginPath(); ctx.roundRect(x, y, w, h, 15); ctx.fill(); };
  ctx.fillStyle = '#f5f2e9'; ctx.fillRect(0, 0, 1000, 1280);
  ctx.strokeStyle = '#deded1'; ctx.lineWidth = 2; ctx.strokeRect(32, 32, 936, 1216);
  text('26', 70, 178, 130, ink, true); text('DOING MY BEST', 252, 126, 25); text('MY MONTH, WRAPPED.', 254, 163, 17, muted);
  ctx.beginPath(); ctx.moveTo(70, 208); ctx.lineTo(930, 208); ctx.stroke();
  const era = lifeEra(state);
  text('THE GROUP CHAT HAS NAMED MY ERA:', 70, 260, 17, muted);
  let y = wrap(era.name, 70, 330, 850, 53, 60, ink, true);
  y = wrap(era.line, 70, y + 10, 840, 23, 32, muted) + 28;
  const cash = state.stats.cash;
  const figures = [[`${cash < 0 ? '−' : ''}$${Math.abs(cash).toLocaleString('en-US')}`, 'AFTER RENT'], [state.memories.length, 'LITTLE MEMORIES'], [state.combos, 'SMALL-WIN COMBOS'], [state.boundaries, 'HEALTHY BOUNDARIES']];
  figures.forEach(([value, label], i) => {
    const x = 70 + (i % 2) * 440, yy = y + Math.floor(i / 2) * 135;
    box(x, yy, 420, 117, ['#e2e9d9', '#f4e2d7', '#f2e9cb', '#e8e4ef'][i]);
    text(value, x + 24, yy + 62, 44, ink, true); text(label, x + 25, yy + 91, 14, muted);
  });
  y += 304;
  text('THINGS I’M TAKING WITH ME', 70, y, 17, muted); y += 42;
  const memories = state.memories.slice(-3);
  if (!memories.length) y = wrap('The knowledge that making it through still counts.', 70, y, 820, 25, 34, ink, true);
  for (const memory of memories) { y = wrap(`— ${memory.title}`, 70, y, 820, 25, 35, ink, true) + 10; }
  box(70, 1030, 860, 130, '#2b3c33');
  text('DOING-MY-BEST SCORE', 96, 1071, 16, '#bdc8b1'); text(state.ending.score.toLocaleString('en-US'), 95, 1131, 53, '#faf6e7', true);
  text(`${state.ending.wins}/4 little goals`, 690, 1123, 22, '#d7dfcd');
  text('Not a life score. Just one very human month.', 70, 1201, 18, muted);
  text(`MONTH SEED ${state.seed}`, 650, 1201, 15, muted);
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  if (!blob) throw new Error('This browser could not save your recap image.');
  const url = URL.createObjectURL(blob), link = document.createElement('a');
  link.href = url; link.download = `26-my-month-${state.seed}.png`; document.body.append(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);

}






const root = document.getElementById('life-app');
const dialog = document.getElementById('life-dialog');
const announcement = document.getElementById('announcement');
const toast = document.createElement('div'); toast.id = 'life-toast'; document.body.append(toast);
let storage;
try { storage = window.localStorage; } catch { /* Private browsers can still play in memory. */ }
const saves = createLifeStorage(storage);
const saved = saves.load();
const freshSeed = () => { const values = new Uint32Array(1); crypto.getRandomValues(values); return values[0]; };
let state = saved || createLife(freshSeed());
let started = Boolean(saved), muted = true, audio = null, modal = '', toastTimer = null, lockedUntil = 0, deltas = {};

function tone(type = 'choice') {
  if (muted) return;
  try {
    audio ||= new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume().catch(() => {});
    const notes = type === 'combo' ? [392, 494, 587, 784] : type === 'cat' ? [330, 392, 330] : [330, 440];
    notes.forEach((frequency, i) => {
      const oscillator = audio.createOscillator(), gain = audio.createGain(), time = audio.currentTime + i * .085;
      oscillator.type = 'sine'; oscillator.frequency.value = frequency;
      gain.gain.setValueAtTime(0, time); gain.gain.linearRampToValueAtTime(.035, time + .012); gain.gain.exponentialRampToValueAtTime(.001, time + .25);
      oscillator.connect(gain); gain.connect(audio.destination); oscillator.start(time); oscillator.stop(time + .27);
      oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
    });
  } catch { muted = true; }
}

function notify(message) {
  clearTimeout(toastTimer); toast.textContent = message; toast.classList.add('visible'); announcement.textContent = message;
  toastTimer = setTimeout(() => toast.classList.remove('visible'), 2800);
}

function render() { root.innerHTML = renderLife(state, { started, muted, warning: saves.warning, deltas }); }
function save() { if (started) saves.save(state); }

function openModal(type) {
  modal = type;
  dialog.innerHTML = type === 'help' ? helpDialog() : type === 'journal' ? journalDialog(state) : type === 'results' ? resultsDialog(state) : type === 'restart' ? `<button class="modal-close" data-action="close" aria-label="Keep playing">×</button><span class="eyebrow">A FRESH START</span><h2 id="modal-title">Another version of this month?</h2><p class="modal-lead">Your current autosave will be replaced. Your new month will have different plans and surprises.</p><div class="restart-actions"><button class="primary-button" data-action="new">Start a new month ${icon('arrow')}</button><button class="text-button" data-action="close">Keep this one</button></div><form id="seed-form" class="seed-form"><label for="month-seed">Have a month code? Try the same starting seed as a friend.</label><div><input id="month-seed" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="e.g. 26" aria-describedby="seed-error"><button type="submit" class="quiet-button">Play this month ${icon("arrow")}</button></div><p id="seed-error" role="status"></p></form>` : momentDialog(state);
  if (!dialog.open) dialog.showModal();
  dialog.scrollTop = 0;
}

function closeModal() { if (dialog.open) dialog.close(); modal = ''; }

function syncMoment() {
  if (state.phase === 'event' || state.phase === 'upgrade') openModal('moment');
  else if (state.phase === 'ended') openModal('results');
  else { closeModal(); document.getElementById('plans-title')?.focus({ preventScroll: true }); }
}

function newMonth(same = false, chosenSeed = null) {
  const seed = chosenSeed ?? (same ? state.seed : freshSeed());
  closeModal(); state = createLife(seed); started = true; deltas = {}; save(); render();
  document.getElementById('plans-title')?.focus({ preventScroll: true }); window.scrollTo({ top: 0 });
  notify('A fresh month. You don’t have to do it perfectly.');
}

function act(action, data = {}) {
  if (['play', 'event', 'upgrade', 'new', 'same'].includes(action)) {
    if (performance.now() < lockedUntil) return;
    lockedUntil = performance.now() + 180;
  }
  if (action === 'start') { started = true; save(); render(); tone(); notify('One evening at a time. Pick your first plan.'); return; }
  if (action === 'help') { openModal('help'); return; }
  if (action === 'journal') { openModal('journal'); return; }
  if (action === 'results' && state.phase === 'ended') { openModal('results'); return; }
  if (action === 'download' && state.phase === 'ended') { downloadLifeRecap(state).then(ok => { if (ok) notify('Your month, saved as a little keepsake.'); }).catch(error => notify(error.message)); return; }
  if (action === 'close') { if (modal !== 'moment') { closeModal(); document.getElementById('plans-title')?.focus({ preventScroll: true }); } return; }
  if (action === 'restart') { if (started) openModal('restart'); else newMonth(); return; }
  if (action === 'seed') {
    const input = document.getElementById('month-seed'), raw = input?.value.trim() || '';
    if (!/^\d{1,10}$/.test(raw) || Number(raw) > 0xffffffff) {
      document.getElementById('seed-error').textContent = 'Use a whole-number month code from 0 to 4,294,967,295.';
      input?.focus(); return;
    }
    newMonth(false, Number(raw)); return;
  }
  if (action === 'new' || action === 'same') { newMonth(action === 'same'); return; }
  if (action === 'sound') { muted = !muted; tone(); render(); notify(muted ? 'Sound off. A quiet little life.' : 'Sound on. Tiny wins, tiny sounds.'); return; }
  if (!started) return;
  const before = { ...state.stats };
  let result;
  if (action === 'play') result = playCard(state, data.id);
  else if (action === 'reroll') result = rerollPlans(state);
  else if (action === 'pet') result = petCat(state);
  else if (action === 'event') result = resolveLifeEvent(state, Number(data.index));
  else if (action === 'upgrade') result = chooseLifeUpgrade(state, data.id);
  else return;
  if (!result.ok) { notify(result.error); return; }
  deltas = Object.fromEntries(Object.keys(before).map(key => [key, state.stats[key] - before[key]]));
  save(); render();
  if (action === 'pet') { tone('cat'); notify('Miso: purrrrr. +3 peace. No evening used.'); return; }
  if (action === 'reroll') { tone(); notify('New possibilities. −5 peace. Choose one or just rest.'); return; }
  clearTimeout(toastTimer); toast.classList.remove('visible');
  tone(result.combo || action === 'upgrade' ? 'combo' : 'choice');
  announcement.textContent = state.last ? `${state.last.title}. ${state.last.text}. Day ${state.day}. Cash ${state.stats.cash} dollars. Energy ${state.stats.energy}. Peace ${state.stats.peace}. Connection ${state.stats.social}.` : '';
  syncMoment();
}

document.addEventListener('click', event => {
  const button = event.target.closest('button[data-action]');
  if (!button || button.disabled) return;
  act(button.dataset.action, button.dataset);
});

document.addEventListener('submit', event => {
  if (event.target.id === 'seed-form') { event.preventDefault(); act('seed'); }
});

dialog.addEventListener('cancel', event => { if (modal === 'moment') { event.preventDefault(); notify('Choose a response to keep your month moving.'); } else modal = ''; });

document.addEventListener('keydown', event => {
  if (event.repeat || event.ctrlKey || event.metaKey || event.altKey || event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
  if (event.key.toLowerCase() === 'm' && !dialog.open) { event.preventDefault(); act('sound'); return; }
  if (!/^[1-4]$/.test(event.key)) return;
  const index = Number(event.key) - 1;
  if (dialog.open) {
    if (modal !== 'moment') return;
    const button = dialog.querySelectorAll('.event-options>button')[index];
    if (button && !button.disabled) { event.preventDefault(); button.click(); }
  } else if (started && state.phase === 'playing') {
    const id = index === 3 ? 'sleep' : state.hand[index];
    if (id) { event.preventDefault(); act('play', { id }); }
  }
});

render();
if (started && state.phase !== 'playing') syncMoment();
</script>
</body>
</html>
