<style>

.mwrap{max-width:460px;margin:0 auto}

 if(data){SIM.restore(G,data);store.set(RKEY,SIM.serialize(G));}

 let best=null;for(const p of PERKS){const l=meta.perks[p.k];if(l<3&&(!best||p.c[l]<best.c))best={c:p.c[l],n:p.n};}
 if(best)return{t:'Next perk: '+best.n,have:Math.min(meta.myc,best.c),need:best.c,unit:'mycelium'};return{t:'Everything unlocked. Chase Endless records!',have:1,need:1,unit:''};}
function showEnd(){
 endShown=true;const m=G.map,won=G.won;const before=unlockedTowers();
 const cleared=won?G.wave:G.cleared;let st=0,newSt=0,best=false,firstBeat=false;
 if(!G.endless){if(won){const f=G.lives/G.startLives;st=f>=.9?3:f>=.5?2:1;}if(st>meta.stars[m]){newSt=st-meta.stars[m];meta.stars[m]=st;}if(won&&!meta.beaten[m]){meta.beaten[m]=1;firstBeat=true;}}
 else{if(cleared>meta.best[m]){meta.best[m]=cleared;best=true;}}
 const myc=cleared+newSt*5+(won?10:0);meta.myc+=myc;saveMeta();
 const fresh=unlockedTowers().filter(k=>before.indexOf(k)<0);
 const nu=nextUnlock();const pct=Math.round(Math.min(1,nu.have/nu.need)*100);
 const nextOk=m<MAPS.length-1&&meta.beaten[m];
 let h=`<div class="panel"><h2 class="disp" style="color:${won?'#9be05a':G.endless?'#f3c96a':'#ff9a7a'}">${won?'Village Saved!':G.endless?'The Hollow Falls':'Overrun!'}</h2><p>${MAPS[m].n}${G.endless?' · Endless':''}</p>`;
 if(!G.endless)h+=`<div class="bigstars" id="bst">${stars(st)}</div>`;else h+=`<div class="mycbig" style="font-size:30px;color:#f3c96a">${cleared} waves${best?' · NEW BEST!':''}</div>`;
 h+=`<div class="sgr"><div><b>${cleared}${G.endless?'':'/'+SIM.MAXW}</b>waves survived</div><div><b>${G.endless?meta.best[m]:'<span class="stars" style="justify-content:center">'+stars(meta.stars[m])+'</span>'}</b>${G.endless?'best wave':'best'}</div><div><b>${G.lives}</b>lives left</div><div><b style="color:#9be05a">+${myc}</b>mycelium</div></div>`;
 if(fresh.length)h+=`<div class="newu">New mushroom unlocked: ${fresh.map(k=>TT[k].n).join(', ')}!</div>`;
 if(firstBeat&&m<MAPS.length-1)h+=`<div class="newu">New map unlocked: ${MAPS[m+1].n}</div>`;
 h+=`<div class="prog">${nu.t}<span style="float:right;color:#f3c96a">${nu.unit?nu.have+'/'+nu.need+' '+nu.unit:''}</span><div class="pb"><i style="width:0%" data-w="${pct}"></i></div></div>`;
 if(!won&&!G.endless&&st===0)h+=`<p style="font-size:13px">${hintFor()}</p>`;
 h+=`<div class="pcol"><button class="btn pri wide" data-e="again">Play again</button>`;
 if(nextOk)h+=`<button class="btn pri" data-e="next">Next map: ${MAPS[m+1].n}</button>`;
 if(meta.beaten[m]&&!G.endless)h+=`<button class="btn" data-e="endless">Endless on ${MAPS[m].n}</button>`;
 h+=`<button class="btn" data-e="menu">Menu${meta.myc>=cheapestPerk()?' · spend mycelium':''}</button></div></div>`;
 const el=$('end');el.innerHTML=h;el.classList.remove('hide');
 setTimeout(()=>{const i=el.querySelector('.pb i');if(i)i.style.width=i.dataset.w+'%';},60);
 const svs=el.querySelectorAll('#bst svg');svs.forEach((s,i)=>setTimeout(()=>{s.classList.add('in');if(i<st)sfx('star',0);},250+i*320));
}
function cheapestPerk(){let c=1e9;for(const p of PERKS){const l=meta.perks[p.k];if(l<3)c=Math.min(c,p.c[l]);}return c;}
function hintFor(){const tips=['Inkcaps splash whole clumps of Scuttlers.','Frostcaps on corners make every other mushroom hit more.','Shellbacks shrug off spores: answer with Inkcaps or Glowcaps.','Grow a mushroom instead of planting a new one when it already covers a long stretch of path.','Sending waves early pays out, but only when you are ahead.'];return tips[(Math.random()*tips.length)|0];}
$('end').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;audioInit();const a=b.dataset.e,m=G?G.map:0;
 if(a==='again')startRun(m,G.endless);else if(a==='next')startRun(m+1,false);else if(a==='endless')startRun(m,true);else goMenu();});
// ---------- menu ----------
function renderMenu(){
 const tot=totalStars(),sv=store.get(RKEY);let h='<div class="mwrap"><canvas id="logo" width="480" height="220"></canvas><h1>Spore Siege</h1><p class="tag">Plant mushrooms. Unwind the clockwork beetles. Save the snail folk.</p>';
 if(sv&&sv.v===1&&MAPS[sv.map])h+=`<div class="card resume"><div class="mi"><b>Run in progress</b><span>${MAPS[sv.map].n}${sv.endless?' · Endless':''} · next up wave ${sv.wave+1}</span></div><div class="mb"><button class="btn pri" data-a="resume">Resume</button><button class="btn" data-a="discard" style="min-height:44px;font-size:13px">Discard</button></div></div>`;
 MAPS.forEach((m,i)=>{const un=i===0||meta.beaten[i-1];
  h+=`<div class="card ${un?'':'lock'}"><div class="mi"><b>${i+1}. ${m.n}</b><span>${m.d}</span><div class="stars">${stars(meta.stars[i])}</div></div><div class="mb">`;
  h+=un?`<button class="btn pri" data-a="play" data-m="${i}">Play</button>`:`<span class="lkt">Beat ${MAPS[i-1].n} to open</span>`;
  if(meta.beaten[i])h+=`<button class="btn" data-a="endless" data-m="${i}" style="font-size:13px">Endless${meta.best[i]?' · best '+meta.best[i]:''}</button>`;
  h+='</div></div>';});
 h+=`<div class="row"><button class="btn" data-a="perks">Mycelium perks · <b style="color:#9be05a">${meta.myc}</b></button><button class="btn" data-a="mute" style="flex:0 0 auto">${meta.mute?'Sound off':'Sound on'}</button></div>`;
 h+=`<div class="lab">Mushroom grove · ${tot}/9 stars</div><div class="road">`+ORDER.map(k=>{const u=UNLOCK[k]<=tot;return`<div class="rt ${u?'':'lk'}"><img alt="" src="${icon(k)}">${TT[k].n}${u?'':'<em>'+UNLOCK[k]+'★</em>'}</div>`;}).join('')+'</div>';
 h+='<p class="help">Tap moss to plant · tap a mushroom to grow, retarget or sell<br>Send waves early for bonus coins · Desktop: 1-6 plant, Space wave, F speed</p></div>';
 $('menu').innerHTML=h;
}
$('menu').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;audioInit();const a=b.dataset.a;
 if(a==='play'||a==='endless'){const m=+b.dataset.m,en=a==='endless';if(store.get(RKEY))ask('Start a fresh run?','This replaces your saved run in progress.','Start',()=>startRun(m,en));else startRun(m,en);}
 else if(a==='resume'){const sv=store.get(RKEY);if(sv&&MAPS[sv.map])startRun(sv.map,!!sv.endless,sv);else renderMenu();}
 else if(a==='discard')ask('Discard run?','The saved run will be gone for good.','Discard',()=>{store.del(RKEY);renderMenu();});
 else if(a==='perks')showPerks();
 else if(a==='mute'){setMute(!meta.mute);renderMenu();}
});
function showPerks(){
 let h=`<div class="mwrap"><div class="ptitle">Mycelium</div><div class="mycbig">${meta.myc} mycelium to spend</div><div class="pcol">`;
 for(const p of PERKS){const l=meta.perks[p.k];const c=l<3?p.c[l]:0;h+=`<div class="perk"><div class="mi"><b>${p.n}</b><span class="pips" style="margin:0 0 0 4px"><i class="${l>=1?'f':''}"></i><i class="${l>=2?'f':''}"></i><i class="${l>=3?'f':''}"></i></span><span>${p.d} per level</span></div>${l<3?`<button class="btn ${meta.myc>=c?'pri':''}" data-k="${p.k}" ${meta.myc>=c?'':'disabled style="opacity:.5"'}>${c}</button>`:'<span class="lkt">Maxed</span>'}</div>`;}
 h+=`</div><p class="help">Earn mycelium every run: 1 per wave survived, 10 per win, 5 per new star.</p><button class="btn wide" data-k="back" style="margin-top:8px">Back</button></div>`;
 const el=$('perks');el.innerHTML=h;el.classList.remove('hide');
}
$('perks').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;audioInit();const k=b.dataset.k;if(k==='back'){$('perks').classList.add('hide');renderMenu();return;}
 const p=PERKS.find(q=>q.k===k);if(!p)return;const l=meta.perks[k];if(l>=3||meta.myc<p.c[l])return;meta.myc-=p.c[l];meta.perks[k]=l+1;saveMeta();sfx('up',0);showPerks();});
// ---------- render ----------
function render(){
 const c=ctx;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,cv.width,cv.height);if(!G||!bg)return;
 const k=cv.width/WW;let sx=0,sy=0;if(shake>0&&!RM){sx=(Math.random()-.5)*shake;sy=(Math.random()-.5)*shake;}
 c.setTransform(k,0,0,k,sx*k,sy*k);c.drawImage(bg,0,0,WW,WH);
 // snail folk
 const vy=(ROWS-1)*T+T/2+8,ns=Math.max(0,Math.ceil(G.lives/G.startLives*6));for(let i=0;i<ns;i++){const x=20+((i*61+tm*(8+i*2))%(WW-40)),y=vy+((i%2)*6);snail(c,x,y,i);}
 // tile highlight
 const ht=sel?(sel.kind==='build'?{x:sel.x,y:sel.y}:{x:sel.t.x,y:sel.t.y}):(hover&&hover.y<ROWS-1?hover:null);
 if(ht){c.fillStyle=sel?'rgba(255,230,140,.25)':'rgba(255,240,200,.12)';rr(c,ht.x*T+2,ht.y*T+2,T-4,T-4,8);c.fill();c.strokeStyle=sel?'#f3c96a':'rgba(243,230,196,.4)';c.lineWidth=2;c.stroke();}
 // range ring
 let rg=null;if(sel&&sel.kind==='tower'&&TT[sel.t.type].rng[sel.t.lvl]>0)rg={x:sel.t.cx,y:sel.t.cy,r:TT[sel.t.type].rng[sel.t.lvl]};
 else if(sel&&sel.kind==='build'&&sel.pv&&TT[sel.pv].rng[0]>.7)rg={x:sel.x+.5,y:sel.y+.5,r:TT[sel.pv].rng[0]};
 if(rg){c.fillStyle='rgba(243,230,196,.1)';c.beginPath();c.arc(rg.x*T,rg.y*T,rg.r*T,0,Math.PI*2);c.fill();c.setLineDash([6,5]);c.strokeStyle='rgba(243,230,196,.75)';c.lineWidth=2;c.stroke();c.setLineDash([]);}
 if(sel&&sel.kind==='tower'&&sel.t.lvl<2&&TT[sel.t.type].rng[sel.t.lvl+1]>TT[sel.t.type].rng[sel.t.lvl]){c.strokeStyle='rgba(155,224,90,.45)';c.lineWidth=1.5;c.setLineDash([3,6]);c.beginPath();c.arc(sel.t.cx*T,sel.t.cy*T,TT[sel.t.type].rng[sel.t.lvl+1]*T,0,Math.PI*2);c.stroke();c.setLineDash([]);}
 // thorns (ground layer)
 for(const t of G.towers)if(t.type==='thorn')drawTower(c,t);
 // enemies ground
 const es=G.enemies.slice().sort((a,b)=>a.y-b.y);
 for(const e of es)if(!ET[e.type].fly)drawBug(c,e,tm,true);
 // towers
 const ts=G.towers.filter(t=>t.type!=='thorn').sort((a,b)=>a.y-b.y);for(const t of ts)drawTower(c,t);
 // flyers
 for(const e of es)if(ET[e.type].fly)drawBug(c,e,tm,true);
 // projectiles
 for(const p of G.projs){const x=p.x*T,y=p.y*T;p.tr=p.tr||[];p.tr.push(x,y);if(p.tr.length>12)p.tr.splice(0,2);
  if(p.k==='spore'){for(let i=0;i<p.tr.length;i+=2){c.globalAlpha=(i/p.tr.length)*.6;c.fillStyle='#f6e7c6';circ(c,p.tr[i],p.tr[i+1],1+i*.18);}c.globalAlpha=1;c.fillStyle='#fff6dc';circ(c,x,y,3.2);}
  else if(p.k==='ink'){const tot=Math.hypot(p.tx-p.sx,p.ty-p.sy)||1,rem=Math.hypot(p.tx-p.x,p.ty-p.y),pr=Math.max(0,Math.min(1,1-rem/tot)),lift=Math.sin(pr*Math.PI)*Math.min(30,tot*12);c.fillStyle='rgba(0,0,0,.25)';ell(c,x,y+4,5,2.5);for(let i=0;i<p.tr.length;i+=2){c.globalAlpha=(i/p.tr.length)*.4;c.fillStyle='#2c2638';circ(c,p.tr[i],p.tr[i+1]-lift,2+i*.15);}c.globalAlpha=1;c.fillStyle='#2c2638';circ(c,x,y-lift,5.5);c.fillStyle='#8a80a8';circ(c,x-1.6,y-lift-1.8,1.6);}
  else{for(let i=0;i<p.tr.length;i+=2){c.globalAlpha=(i/p.tr.length)*.6;c.fillStyle='#bff2ff';circ(c,p.tr[i],p.tr[i+1],1.5+i*.2);}c.globalAlpha=1;c.fillStyle='#e8ffff';circ(c,x,y,4);c.fillStyle='#8fd3d0';circ(c,x+1,y+1,2);}}
 // beams
 for(const b of beams){const a=b.life/.2;c.lineCap='round';c.lineJoin='round';c.globalAlpha=a;c.strokeStyle='rgba(220,255,120,.4)';c.lineWidth=8;c.beginPath();b.pts.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.stroke();c.strokeStyle='#f6ffc8';c.lineWidth=2.4;c.beginPath();b.pts.forEach((p,i)=>{const j=i&&i<b.pts.length?(Math.random()-.5)*4:0;i?c.lineTo(p.x+j,p.y+j):c.moveTo(p.x,p.y);});c.stroke();c.globalAlpha=1;}
 drawParts(c);
 for(const p of pops){c.globalAlpha=Math.min(1,p.life*2);c.font=(p.big?'900 22px':'800 14px')+" Grandstander, 'Comic Sans MS', cursive";c.textAlign='center';c.lineWidth=3;c.strokeStyle='#2a1508';c.strokeText(p.txt,p.x,p.y);c.fillStyle=p.col;c.fillText(p.txt,p.x,p.y);}c.globalAlpha=1;
 if(G.phase==='ready'&&!G.over&&G.wave===0){const e0=G.M.P[0];c.globalAlpha=.6+.4*Math.sin(tm*4);c.fillStyle='#f3c96a';c.beginPath();const ax=e0.x*T,ay=26+Math.sin(tm*4)*4;c.moveTo(ax,ay+12);c.lineTo(ax-9,ay);c.lineTo(ax+9,ay);c.fill();c.globalAlpha=1;}
 if(leakFlash>0){const g=c.createRadialGradient(WW/2,WH/2,WH*.25,WW/2,WH/2,WH*.75);g.addColorStop(0,'rgba(200,40,30,0)');g.addColorStop(1,'rgba(200,40,30,'+(.5*leakFlash)+')');c.fillStyle=g;c.fillRect(-20,-20,WW+40,WH+40);}
}
function drawTower(c,t){
 let gr=1;if(t.gr!=null&&t.gr<1){const q=t.gr;gr=RM?1:(q<.6?q/.6*1.18:1.18-(q-.6)/.4*.18);}
 drawMush(c,t.type,t.lvl,t.cx*T,t.cy*T-6,1,tm+t.id,t.sq||0,gr);
 if(t.mode===1&&TT[t.type].kind){c.fillStyle='#c8452f';circ(c,t.cx*T+14,t.cy*T-16,3.5);}
}
function snail(c,x,y,i){const b=Math.sin(tm*3+i)*1.2;c.fillStyle='#d9c79a';ell(c,x,y+3,9,3);c.fillStyle='#e8d8a8';circ(c,x+7,y-1+b*.3,3);c.strokeStyle='#e8d8a8';c.lineWidth=1.2;c.beginPath();c.moveTo(x+8,y-3);c.lineTo(x+10,y-8);c.stroke();const cl=['#c86a3a','#d9a03a','#a8663a'][i%3];c.fillStyle=cl;circ(c,x-1,y-3+b,6);c.strokeStyle='#6a3a1a';c.lineWidth=1.2;c.beginPath();c.arc(x-1,y-3+b,3,0,5);c.stroke();}
// ---------- logo ----------
let logoBugs=[{x:-40,id:1,type:'scut'},{x:-140,id:2,type:'shell'}];
function drawLogo(dt){
 const lc=$('logo');if(!lc)return;const c=lc.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,480,220);c.setTransform(2,0,0,2,0,0);
 c.fillStyle='#5a3d22';rr(c,0,82,240,14,7);c.fill();c.fillStyle='#7d5a37';rr(c,0,85,240,8,4);c.fill();
 drawMush(c,'puff',2,46,58,1.25,tm,Math.max(0,Math.sin(tm*3))*.3);drawMush(c,'glow',1,190,60,1.1,tm,0);drawMush(c,'ink',0,150,64,.9,tm,0);
 for(const b of logoBugs){b.x+=dt*(b.type==='shell'?22:34);if(b.x>280)b.x=-40-Math.random()*80;const e={x:b.x/T,y:88/T,a:0,off:0,id:b.id,type:b.type,spd:ET[b.type].spd,slowF:0,hp:1,max:1,flash:0};drawBug(c,e,tm,false);}
}
// ---------- loop ----------
let last=performance.now(),acc=0;
function frame(ts){
 requestAnimationFrame(frame);let dt=(ts-last)/1000;last=ts;if(!(dt>0))dt=0;dt=Math.min(dt,.1);tm+=dt;
 if(screen==='game'&&G){
  if(!paused&&!G.over){acc+=dt;let n=0;while(acc>=STEP&&n<6){for(let i=0;i<speed;i++)SIM.step(G,STEP);acc-=STEP;n++;}if(n>=6)acc=0;}
  handleEvents();if(sel&&sel.kind==='tower'&&G.towers.indexOf(sel.t)<0)closeSheet();
  if(G.over&&!endShown){endT-=dt;if(endT<=0){closeSheet();showEnd();}}
  if(!paused)updFx(dt);render();updHud();
 }else if(screen==='menu'){drawLogo(dt);}
}
renderMenu();muteIcon();speedIcon();resize();requestAnimationFrame(frame);
document.addEventListener('pointerdown',()=>audioInit(),{once:false,passive:true});
})();
</script>
