<title>One More Season</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A six-fixture five-a-side club season: pick five of eight, manage fatigue, read the scouting, win four.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, sticky fixture bar on top, one big action docked at the bottom.
   Look: a five-a-side cage under floodlights. Chalk-white pitch paper, deep pitch-green ink,
   training-bib orange for the action, scoreboard numerals in a condensed face. */
:root {
  --paper: #eef1ea; --card: #fbfcf8; --ink: #14251c; --muted: #56675d; --line-c: #cfd8cd;
  --club: #17533b; --gold: #e0a419; --accent: #ef5a1c; --good: #237a46; --bad: #c2391b;

  --shadow: 0 1px 0 rgba(20,37,28,.07), 0 3px 10px rgba(20,37,28,.06);
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;

  --font-data: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1713; --card: #18221c; --ink: #e9efe8; --muted: #9fb0a5; --line-c: #2c3a32;
    --club: #2f9a69; --gold: #f0bb3a; --accent: #ff7a3d; --good: #4cbc78; --bad: #ff7a5c;
    --d0: #3e4a43; --d3: #d3a335; --d7: #3c9e63; --grass: #24603a; --line: rgba(255,255,255,.6);
    --warn-bg: #3b2014; --warn-fg: #ffd2bd; --on-accent: #1a0d05; --on-d3: #1f1600; --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1713; --card: #18221c; --ink: #e9efe8; --muted: #9fb0a5; --line-c: #2c3a32;
  --club: #2f9a69; --gold: #f0bb3a; --accent: #ff7a3d; --good: #4cbc78; --bad: #ff7a5c;
  --d0: #3e4a43; --d3: #d3a335; --d7: #3c9e63; --grass: #24603a; --line: rgba(255,255,255,.6);
  --warn-bg: #3b2014; --warn-fg: #ffd2bd; --on-accent: #1a0d05; --on-d3: #1f1600; --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
#app { max-width: 584px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 env(safe-area-inset-bottom, 0px); }
h1, h2, h3 { margin: 0 0 6px; line-height: 1.1; text-wrap: balance; font-family: var(--font-display); }
h1 { font-size: 46px; font-weight: 800; text-transform: uppercase; letter-spacing: .01em; }
h2 { font-size: 24px; font-weight: 700; } h3 { font-size:calc(max(12px,15px) * var(--gk-text-scale,1)); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
p { margin: 6px 0; }
button { font: inherit; color: inherit; cursor: pointer; border-radius: 10px; border: 1.5px solid var(--line-c); background: var(--card); padding: 8px 12px; min-height: 40px; touch-action: manipulation; }
button:disabled { opacity: .45; cursor: not-allowed; }

.big { display: block; width: 100%; min-height: 54px; background: var(--accent); color: var(--on-accent); border-color: var(--accent); font: 700 calc(max(12px,20px) * min(var(--gk-text-scale,1),1.25))/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .04em; }
.big small { display: block; font: 500 calc(max(12px,13px) * min(var(--gk-text-scale,1),1.25)) var(--font-body); text-transform: none; letter-spacing: 0; opacity: .9; }
.big:disabled { background: var(--d0); color: var(--ink); border-color: var(--d0); font: 600 calc(max(12px,15px) * min(var(--gk-text-scale,1),1.25)) var(--font-body); text-transform: none; letter-spacing: 0; opacity: 1; }
.secondary { display: block; width: 100%; min-height: 46px; font-weight: 600; }

.chip { border-radius: 999px; min-height: 36px; padding: 4px 14px; font-weight: 600; font-size:calc(max(12px,13px) * min(var(--gk-text-scale,1),1.25)); }
.chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.mini { min-height: 36px; padding: 4px 10px; font-size:calc(max(12px,13px) * var(--gk-text-scale,1)); font-weight: 600; }
.mini.sel { background: var(--club); color: var(--card); border-color: var(--club); }
.card { background: var(--card); border: 1px solid var(--line-c); border-radius: 14px; padding: 12px; margin: 10px 0; box-shadow: var(--shadow); }
.fine { font-size:calc(max(12px,12px) * var(--gk-text-scale,1)); color: var(--muted); }
.warn { background: var(--warn-bg); color: var(--warn-fg); border-radius: 10px; padding: 8px 10px; margin: 8px 0; font-size:calc(max(12px,14px) * var(--gk-text-scale,1)); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; background: var(--paper); border-bottom: 1px solid var(--line-c); }
.bar-mid { text-align: center; display: flex; flex-direction: column; } .bar-mid span { font-size:calc(max(12px,12px) * min(var(--gk-text-scale,1),1.25)); color: var(--muted); }
.dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(transparent, var(--paper) 30%); z-index: 6; }
.dock > * { max-width: 536px; margin: 0 auto; }
.spacer { height: 86px; }
.title { text-align: center; padding: 36px 6px 30px; }
.title .crest { margin: 0 auto 8px; display: block; }
.title .sub { color: var(--muted); font-weight: 600; }
.title .pitch { font-size:calc(max(12px,17px) * var(--gk-text-scale,1)); margin: 14px auto 22px; max-width: 360px; }
.stack { display: grid; gap: 10px; margin: 14px 0; }
.hist { color: var(--muted); font-weight: 600; }
.scout { border-top: 6px solid var(--o1); }
.scout-head { display: flex; gap: 10px; align-items: center; }
.badge-o { width: 30px; height: 34px; flex: none; background: linear-gradient(135deg, var(--o1) 50%, var(--o2) 50%); clip-path: polygon(50% 0, 100% 15%, 100% 60%, 50% 100%, 0 60%, 0 15%); }
.vs { width: 100%; border-collapse: collapse; margin: 8px 0; font-variant-numeric: tabular-nums; }
.vs th { font-size:calc(max(12px,12px) * var(--gk-text-scale,1)); color: var(--muted); text-align: center; } .vs td { text-align: center; padding: 3px; } .vs td:first-child { text-align: left; font-weight: 600; }
.vs tr.you td { color: var(--club); font-weight: 700; }
.tend { background: var(--paper); border-radius: 10px; padding: 8px; }
.pill { display: inline-block; font-size:calc(max(12px,12px) * var(--gk-text-scale,1)); font-weight: 700; padding: 1px 8px; border-radius: 999px; margin: 2px 0; }
.pill.good { background: rgba(47,125,79,.15); color: var(--good); } .pill.bad { background: rgba(184,67,47,.14); color: var(--bad); }
.notes { border-left: 4px solid var(--gold); } .notes p { font-size:calc(max(12px,14px) * var(--gk-text-scale,1)); }
.count { text-transform: none; letter-spacing: 0; font-size:calc(max(12px,13px) * var(--gk-text-scale,1)); color: var(--ink); font-weight: 600; }
.squad, .devl, .evs, .fatl, .lines { list-style: none; margin: 0; padding: 0; }
.pl { border-top: 1px solid var(--line-c); padding: 9px 0; } .pl:first-child { border-top: 0; }
.pl.on .who b { color: var(--club); }
.pl-top { display: flex; align-items: center; gap: 8px; }
.start { min-width: 84px; font: 700 calc(max(12px,15px) * min(var(--gk-text-scale,1),1.25)) var(--font-display); text-transform: uppercase; letter-spacing: .03em; }
.start.on { background: var(--club); color: var(--card); border-color: var(--club); }
.who { flex: 1; min-width: 0; display: flex; flex-direction: column; } .who b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .who small { color: var(--muted); font-size:calc(max(12px,12px) * var(--gk-text-scale,1)); }
.fat { position: relative; width: 74px; height: 22px; border-radius: 6px; background: var(--paper); border: 1px solid var(--line-c); overflow: hidden; flex: none; }
.fat div { position: absolute; inset: 0 auto 0 0; background: #8fbf9b; } .fat.warm div { background: #e2b54a; } .fat.hot div { background: #d9694f; }
.fat span { position: relative; display: block; text-align: center; font-size:12px; font-weight: 700; line-height: 20px; font-variant-numeric: tabular-nums; } .fat s { opacity: .6; font-weight: 500; }
.attrs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 7px 0 6px; }
.at { background: var(--paper); border-radius: 7px; padding: 2px 4px; text-align: center; font: 700 calc(max(12px,17px) * min(var(--gk-text-scale,1),1.25))/1.15 var(--font-display); font-variant-numeric: tabular-nums; }
.at small { display: block; font: 600 calc(max(12px,10px) * min(var(--gk-text-scale,1),1.25)) var(--font-body); color: var(--muted); letter-spacing: .05em; } .at em { font-style: normal; font-size:calc(max(12px,11px) * min(var(--gk-text-scale,1),1.25)); color: var(--bad); margin-left: 3px; font-weight: 600; }
.at.up { outline: 2px solid var(--gold); }
.prep { display: flex; gap: 6px; flex-wrap: wrap; }
.pick { margin-top: 6px; font-size:calc(max(12px,13px) * var(--gk-text-scale,1)); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.plans { display: grid; gap: 8px; }
.plan { text-align: left; display: block; width: 100%; padding: 10px; }
.plan > b { font-size:calc(max(12px,16px) * var(--gk-text-scale,1)); margin-right: 6px; } .plan > span { color: var(--muted); font-size:calc(max(12px,13px) * var(--gk-text-scale,1)); }
.plan.sel { border-color: var(--club); box-shadow: inset 0 0 0 2px var(--club); }
.dist { display: flex; height: 22px; border-radius: 6px; overflow: hidden; margin: 6px 0 3px; font-size:12px; font-weight: 700; line-height: 22px; text-align: center; }
.d0 { background: var(--d0); color: var(--ink); } .d3 { background: var(--d3); color: var(--on-d3); } .d7 { background: var(--d7); color: #fff; }
.key { display: flex; gap: 12px; font-size:calc(max(12px,12px) * var(--gk-text-scale,1)); color: var(--muted); margin-top: 4px; } .key i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.k0 { background: var(--d0); } .k3 { background: var(--d3); } .k7 { background: var(--d7); }
.math { font: calc(max(12px,11.5px) * var(--gk-text-scale,1))/1.45 var(--font-data); color: var(--muted); background: var(--paper); border-radius: 6px; padding: 5px 7px; margin: 5px 0; word-break: break-word; }
.score { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 6px; }
.side { display: flex; align-items: center; gap: 6px; min-width: 0; } .side.them { flex-direction: row-reverse; }
.side b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .side .crest, .side .badge-o { flex: none; }
.side .num { font: 800 44px/1 var(--font-display); font-variant-numeric: tabular-nums; margin: 0 4px; }
.clock { font-size:calc(max(12px,12px) * min(var(--gk-text-scale,1),1.25)); color: var(--muted); font-weight: 700; text-transform: uppercase; text-align: center; }
.field { width: 100%; height: 92px; display: block; border-radius: 12px; }
.ball { transition: cx .45s ease-out; }
.tlrow { display: grid; grid-template-columns: 72px repeat(8, 1fr); gap: 4px; align-items: center; margin: 4px 0; }
.lab { font-size:calc(max(12px,12px) * min(var(--gk-text-scale,1),1.25)); font-weight: 700; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell { height: 30px; border-radius: 6px; background: var(--paper); border: 1px dashed var(--line-c); display: grid; place-items: center; font-weight: 800; font-size:13px; color: transparent; }
.cell.p0 { background: var(--d0); color: var(--ink); border: 0; } .cell.p3 { background: var(--d3); color: var(--on-d3); border: 0; } .cell.p7 { background: var(--d7); color: #fff; border: 0; }
.cell.new { animation: pop .35s ease-out; }
@keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { html:not([data-gk-motion]) .cell.new { animation: none; } html:not([data-gk-motion]) .ball { transition: none; } }
html[data-gk-motion]:not([data-gk-motion=full]) .cell.new { animation: none; } html[data-gk-motion]:not([data-gk-motion=full]) .ball { transition: none; }
.call { min-height: 60px; font-size:calc(max(12px,15px) * var(--gk-text-scale,1)); }
.result { text-align: center; } .result.W { border-top: 6px solid var(--good); } .result.L { border-top: 6px solid var(--bad); } .result.D { border-top: 6px solid var(--gold); }
.result .crest { display: block; margin: 0 auto 6px; }
.big-rec { font: 800 40px/1 var(--font-display); margin: 4px 0; }
.ev { border-left: 4px solid var(--club); padding: 4px 0 4px 10px; margin: 10px 0; } .ev.them { border-left-color: var(--accent); }
.ev small { color: var(--muted); font-size:calc(max(12px,12px) * var(--gk-text-scale,1)); display: block; }
.fatl { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; font-size:calc(max(12px,14px) * var(--gk-text-scale,1)); font-variant-numeric: tabular-nums; } .hotT { color: var(--bad); font-weight: 700; }
.dv { border-top: 1px solid var(--line-c); padding: 8px 0; } .dv:first-child { border-top: 0; }
.dvb { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 5px; }
.lines li { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line-c); } .lines li:first-child { border-top: 0; }
.lines p { font-size:calc(max(12px,13px) * var(--gk-text-scale,1)); color: var(--muted); margin: 3px 0 0; }
.o { flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; color: #fff; }
.o.W { background: var(--good); } .o.L { background: var(--bad); } .o.D { background: var(--gold); color: var(--on-d3); }
.q { background: var(--paper); border-radius: 10px; padding: 8px; }
.recap { padding-bottom: 30px; }
.modal { position: fixed; inset: 0; background: rgba(10,14,12,.55); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--card); width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); display: grid; gap: 8px; }
.sheet ol { padding-left: 20px; margin: 4px 0; } .sheet li { margin: 5px 0; }
.row { display: flex; gap: 8px; } .row > * { flex: 1; }
input, textarea { font: calc(max(12px,14px) * var(--gk-text-scale,1)) var(--font-data); width: 100%; padding: 9px; border-radius: 10px; border: 1.5px solid var(--line-c); background: var(--paper); color: var(--ink); }
@media (max-width: 380px) { .fat { width: 62px; } .start { min-width: 74px; } h1 { font-size: 38px; } .side .num { font-size: 36px; } .side .crest { display: none; } }
#app { overflow-x: clip; }
