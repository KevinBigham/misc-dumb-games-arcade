<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>One More Season</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A six-fixture five-a-side club season: pick five of eight, manage fatigue, read the scouting, win four.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, sticky fixture bar on top, one big action docked at the bottom.
   Look: a five-a-side cage under floodlights. Chalk-white pitch paper, deep pitch-green ink,
   training-bib orange for the action, scoreboard numerals in a condensed face. */
:root {
  --paper: #eef1ea; --card: #fbfcf8; --ink: #14251c; --muted: #56675d; --line-c: #cfd8cd;
  --club: #17533b; --gold: #e0a419; --accent: #ef5a1c; --good: #237a46; --bad: #c2391b;
  --d0: #c4ccc2; --d3: #e9b93c; --d7: #237a46; --grass: #2f7a49; --line: rgba(255,255,255,.75);
  --warn-bg: #fde6d6; --warn-fg: #6e2410; --on-accent: #ffffff; --on-d3: #2a1e00;
  --shadow: 0 1px 0 rgba(20,37,28,.07), 0 3px 10px rgba(20,37,28,.06);
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-data: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1713; --card: #18221c; --ink: #e9efe8; --muted: #9fb0a5; --line-c: #2c3a32;
    --club: #2f9a69; --gold: #f0bb3a; --accent: #ff7a3d; --good: #4cbc78; --bad: #ff7a5c;
    --d0: #3e4a43; --d3: #d3a335; --d7: #3c9e63; --grass: #24603a; --line: rgba(255,255,255,.6);
    --warn-bg: #3b2014; --warn-fg: #ffd2bd; --on-accent: #1a0d05; --on-d3: #1f1600; --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1713; --card: #18221c; --ink: #e9efe8; --muted: #9fb0a5; --line-c: #2c3a32;
  --club: #2f9a69; --gold: #f0bb3a; --accent: #ff7a3d; --good: #4cbc78; --bad: #ff7a5c;
  --d0: #3e4a43; --d3: #d3a335; --d7: #3c9e63; --grass: #24603a; --line: rgba(255,255,255,.6);
  --warn-bg: #3b2014; --warn-fg: #ffd2bd; --on-accent: #1a0d05; --on-d3: #1f1600; --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font: calc(max(12px,15px) * var(--gk-text-scale,1))/1.45 var(--font-body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
#app { max-width: 584px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 env(safe-area-inset-bottom, 0px); }
h1, h2, h3 { margin: 0 0 6px; line-height: 1.1; text-wrap: balance; font-family: var(--font-display); }
h1 { font-size: 46px; font-weight: 800; text-transform: uppercase; letter-spacing: .01em; }
h2 { font-size: 24px; font-weight: 700; } h3 { font-size:calc(max(12px,15px) * var(--gk-text-scale,1)); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
p { margin: 6px 0; }
button { font: inherit; color: inherit; cursor: pointer; border-radius: 10px; border: 1.5px solid var(--line-c); background: var(--card); padding: 8px 12px; min-height: 40px; touch-action: manipulation; }
button:disabled { opacity: .45; cursor: not-allowed; }

.big { display: block; width: 100%; min-height: 54px; background: var(--accent); color: var(--on-accent); border-color: var(--accent); font: 700 calc(max(12px,20px) * min(var(--gk-text-scale,1),1.25))/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .04em; }
.big small { display: block; font: 500 calc(max(12px,13px) * min(var(--gk-text-scale,1),1.25)) var(--font-body); text-transform: none; letter-spacing: 0; opacity: .9; }
.big:disabled { background: var(--d0); color: var(--ink); border-color: var(--d0); font: 600 calc(max(12px,15px) * min(var(--gk-text-scale,1),1.25)) var(--font-body); text-transform: none; letter-spacing: 0; opacity: 1; }

.chip { border-radius: 999px; min-height: 36px; padding: 4px 14px; font-weight: 600; font-size:calc(max(12px,13px) * min(var(--gk-text-scale,1),1.25)); }
.chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.mini { min-height: 36px; padding: 4px 10px; font-size:calc(max(12px,13px) * var(--gk-text-scale,1)); font-weight: 600; }
.mini.sel { background: var(--club); color: var(--card); border-color: var(--club); }
.card { background: var(--card); border: 1px solid var(--line-c); border-radius: 14px; padding: 12px; margin: 10px 0; box-shadow: var(--shadow); }
.fine { font-size:calc(max(12px,12px) * var(--gk-text-scale,1)); color: var(--muted); }
.warn { background: var(--warn-bg); color: var(--warn-fg); border-radius: 10px; padding: 8px 10px; margin: 8px 0; font-size:calc(max(12px,14px) * var(--gk-text-scale,1)); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; background: var(--paper); border-bottom: 1px solid var(--line-c); }
.bar-mid { text-align: center; display: flex; flex-direction: column; } .bar-mid span { font-size:calc(max(12px,12px) * min(var(--gk-text-scale,1),1.25)); color: var(--muted); }
.dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(transparent, var(--paper) 30%); z-index: 6; }
.dock > * { max-width: 536px; margin: 0 auto; }
.spacer { height: 86px; }
.title { text-align: center; padding: 36px 6px 30px; }
.title .crest { margin: 0 auto 8px; display: block; }
.title .sub { color: var(--muted); font-weight: 600; }
.title .pitch { font-size:calc(max(12px,17px) * var(--gk-text-scale,1)); margin: 14px auto 22px; max-width: 360px; }
.stack { display: grid; gap: 10px; margin: 14px 0; }
.hist { color: var(--muted); font-weight: 600; }
.scout { border-top: 6px solid var(--o1); }
.scout-head { display: flex; gap: 10px; align-items: center; }
.badge-o { width: 30px; height: 34px; flex: none; background: linear-gradient(135deg, var(--o1) 50%, var(--o2) 50%); clip-path: polygon(50% 0, 100% 15%, 100% 60%, 50% 100%, 0 60%, 0 15%); }
.vs { width: 100%; border-collapse: collapse; margin: 8px 0; font-variant-numeric: tabular-nums; }
.vs th { font-size:calc(max(12px,12px) * var(--gk-text-scale,1)); color: var(--muted); text-align: center; } .vs td { text-align: center; padding: 3px; } .vs td:first-child { text-align: left; font-weight: 600; }
.vs tr.you td { color: var(--club); font-weight: 700; }
.tend { background: var(--paper); border-radius: 10px; padding: 8px; }
.pill { display: inline-block; font-size:calc(max(12px,12px) * var(--gk-text-scale,1)); font-weight: 700; padding: 1px 8px; border-radius: 999px; margin: 2px 0; }
.pill.good { background: rgba(47,125,79,.15); color: var(--good); } .pill.bad { background: rgba(184,67,47,.14); color: var(--bad); }
.notes { border-left: 4px solid var(--gold); } .notes p { font-size:calc(max(12px,14px) * var(--gk-text-scale,1)); }
.count { text-transform: none; letter-spacing: 0; font-size:calc(max(12px,13px) * var(--gk-text-scale,1)); color: var(--ink); font-weight: 600; }
.squad, .devl, .evs, .fatl, .lines { list-style: none; margin: 0; padding: 0; }
.pl { border-top: 1px solid var(--line-c); padding: 9px 0; } .pl:first-child { border-top: 0; }
.pl.on .who b { color: var(--club); }
.pl-top { display: flex; align-items: center; gap: 8px; }
.start { min-width: 84px; font: 700 calc(max(12px,15px) * min(var(--gk-text-scale,1),1.25)) var(--font-display); text-transform: uppercase; letter-spacing: .03em; }
.start.on { background: var(--club); color: var(--card); border-color: var(--club); }
.who { flex: 1; min-width: 0; display: flex; flex-direction: column; } .who b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .who small { color: var(--muted); font-size:calc(max(12px,12px) * var(--gk-text-scale,1)); }
.fat { position: relative; width: 74px; height: 22px; border-radius: 6px; background: var(--paper); border: 1px solid var(--line-c); overflow: hidden; flex: none; }
.fat div { position: absolute; inset: 0 auto 0 0; background: #8fbf9b; } .fat.warm div { background: #e2b54a; } .fat.hot div { background: #d9694f; }
.fat span { position: relative; display: block; text-align: center; font-size:12px; font-weight: 700; line-height: 20px; font-variant-numeric: tabular-nums; } .fat s { opacity: .6; font-weight: 500; }
.attrs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 7px 0 6px; }
.at { background: var(--paper); border-radius: 7px; padding: 2px 4px; text-align: center; font: 700 calc(max(12px,17px) * min(var(--gk-text-scale,1),1.25))/1.15 var(--font-display); font-variant-numeric: tabular-nums; }
.at small { display: block; font: 600 calc(max(12px,10px) * min(var(--gk-text-scale,1),1.25)) var(--font-body); color: var(--muted); letter-spacing: .05em; } .at em { font-style: normal; font-size:calc(max(12px,11px) * min(var(--gk-text-scale,1),1.25)); color: var(--bad); margin-left: 3px; font-weight: 600; }
.at.up { outline: 2px solid var(--gold); }
.prep { display: flex; gap: 6px; flex-wrap: wrap; }
.pick { margin-top: 6px; font-size:calc(max(12px,13px) * var(--gk-text-scale,1)); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.plans { display: grid; gap: 8px; }
.plan { text-align: left; display: block; width: 100%; padding: 10px; }
.plan > b { font-size:calc(max(12px,16px) * var(--gk-text-scale,1)); margin-right: 6px; } .plan > span { color: var(--muted); font-size:calc(max(12px,13px) * var(--gk-text-scale,1)); }
.plan.sel { border-color: var(--club); box-shadow: inset 0 0 0 2px var(--club); }
.dist { display: flex; height: 22px; border-radius: 6px; overflow: hidden; margin: 6px 0 3px; font-size:12px; font-weight: 700; line-height: 22px; text-align: center; }
.d0 { background: var(--d0); color: var(--ink); } .d3 { background: var(--d3); color: var(--on-d3); } .d7 { background: var(--d7); color: #fff; }
.key { display: flex; gap: 12px; font-size:calc(max(12px,12px) * var(--gk-text-scale,1)); color: var(--muted); margin-top: 4px; } .key i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.k0 { background: var(--d0); } .k3 { background: var(--d3); } .k7 { background: var(--d7); }
.math { font: calc(max(12px,11.5px) * var(--gk-text-scale,1))/1.45 var(--font-data); color: var(--muted); background: var(--paper); border-radius: 6px; padding: 5px 7px; margin: 5px 0; word-break: break-word; }
.score { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 6px; }
.side { display: flex; align-items: center; gap: 6px; min-width: 0; } .side.them { flex-direction: row-reverse; }
.side b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .side .crest, .side .badge-o { flex: none; }
.side .num { font: 800 44px/1 var(--font-display); font-variant-numeric: tabular-nums; margin: 0 4px; }
.clock { font-size:calc(max(12px,12px) * min(var(--gk-text-scale,1),1.25)); color: var(--muted); font-weight: 700; text-transform: uppercase; text-align: center; }
.field { width: 100%; height: 92px; display: block; border-radius: 12px; }
.ball { transition: cx .45s ease-out; }
.tlrow { display: grid; grid-template-columns: 72px repeat(8, 1fr); gap: 4px; align-items: center; margin: 4px 0; }
.lab { font-size:calc(max(12px,12px) * min(var(--gk-text-scale,1),1.25)); font-weight: 700; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell { height: 30px; border-radius: 6px; background: var(--paper); border: 1px dashed var(--line-c); display: grid; place-items: center; font-weight: 800; font-size:13px; color: transparent; }
.cell.p0 { background: var(--d0); color: var(--ink); border: 0; } .cell.p3 { background: var(--d3); color: var(--on-d3); border: 0; } .cell.p7 { background: var(--d7); color: #fff; border: 0; }
.cell.new { animation: pop .35s ease-out; }
@keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { html:not([data-gk-motion]) .cell.new { animation: none; } html:not([data-gk-motion]) .ball { transition: none; } }
html[data-gk-motion]:not([data-gk-motion=full]) .cell.new { animation: none; } html[data-gk-motion]:not([data-gk-motion=full]) .ball { transition: none; }
.call { min-height: 60px; font-size:calc(max(12px,15px) * var(--gk-text-scale,1)); }
.result { text-align: center; } .result.W { border-top: 6px solid var(--good); } .result.L { border-top: 6px solid var(--bad); } .result.D { border-top: 6px solid var(--gold); }
.result .crest { display: block; margin: 0 auto 6px; }
.big-rec { font: 800 40px/1 var(--font-display); margin: 4px 0; }
.ev { border-left: 4px solid var(--club); padding: 4px 0 4px 10px; margin: 10px 0; } .ev.them { border-left-color: var(--accent); }
.ev small { color: var(--muted); font-size:calc(max(12px,12px) * var(--gk-text-scale,1)); display: block; }
.fatl { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; font-size:calc(max(12px,14px) * var(--gk-text-scale,1)); font-variant-numeric: tabular-nums; } .hotT { color: var(--bad); font-weight: 700; }
.dv { border-top: 1px solid var(--line-c); padding: 8px 0; } .dv:first-child { border-top: 0; }
.dvb { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 5px; }
.lines li { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line-c); } .lines li:first-child { border-top: 0; }
.lines p { font-size:calc(max(12px,13px) * var(--gk-text-scale,1)); color: var(--muted); margin: 3px 0 0; }
.o { flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; color: #fff; }
.o.W { background: var(--good); } .o.L { background: var(--bad); } .o.D { background: var(--gold); color: var(--on-d3); }
.q { background: var(--paper); border-radius: 10px; padding: 8px; }
.recap { padding-bottom: 30px; }
.modal { position: fixed; inset: 0; background: rgba(10,14,12,.55); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--card); width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); display: grid; gap: 8px; }
.sheet ol { padding-left: 20px; margin: 4px 0; } .sheet li { margin: 5px 0; }
.row { display: flex; gap: 8px; } .row > * { flex: 1; }
input, textarea { font: calc(max(12px,14px) * var(--gk-text-scale,1)) var(--font-data); width: 100%; padding: 9px; border-radius: 10px; border: 1.5px solid var(--line-c); background: var(--paper); color: var(--ink); }
@media (max-width: 380px) { .fat { width: 62px; } .start { min-width: 74px; } h1 { font-size: 38px; } .side .num { font-size: 36px; } .side .crest { display: none; } }
#app { overflow-x: clip; }

<div id="app"></div>
<script>
(function(){
'use strict';
// ---- config.mjs ----
// One More Season — tunable rules. Every number the sim uses lives here.
const CONFIG = {
  saveVersion: 1,
  fixtures: 6,
  winTarget: 4,
  startersCount: 5,
  possessionsPerTeam: 8,
  outcomes: [0, 3, 7],
  // Base chances (percent) for 0 / 3 / 7 points at equal strength.
  base: {
    patient: [25, 55, 20],
    balanced: [35, 35, 30],
    aggressive: [50, 10, 40],
  },
  // Shift S (percentage points) moves chance from the 0 bucket to the 7 bucket.
  // S = round(kAttack*(offAttack - defDefense) + kControl*(offControl - defControl) + tendency)
  // then clamped to [-maxShift, +maxShift]. The 3-point bucket never changes.
  kAttack: 3,
  kControl: 2,
  maxShift: 15,
  fatigueMax: 100,
  fatigueDivisor: 200, // effective = attribute * (1 - fatigue / 200)
  attrMin: 1,
  attrMax: 10,
  prepPoints: 2,
  restAmount: 24,
  trainFatigue: 8,
  starterFatigueBase: 24, // starters gain (24 - Stamina)
  reserveRecovery: 18,
  // Decisive-event picker: swing = |points - expected points|, +lateBonus if
  // possession index >= lateFrom and the margin before it was within lateMargin.
  lateFrom: 12,
  lateMargin: 7,
  lateBonus: 1.5,
  tiredBelow: 0.8, // recap calls your side "tired" when average fatigue multiplier < 0.8
  tiredWarn: 45, // prep screen warns about any starter at or above this fatigue
  playbackMs: 650,
};

// ---- content.mjs ----
// One More Season — content data. All names and text are original and fictional.
const CLUB = { name: 'Saltgate Town', short: 'Saltgate', league: 'Fenward Five League' };

const ATTRS = ['attack', 'defense', 'control', 'stamina'];
const ATTR_LABEL = { attack: 'Attack', defense: 'Defense', control: 'Control', stamina: 'Stamina' };
const ATTR_SHORT = { attack: 'ATK', defense: 'DEF', control: 'CTL', stamina: 'STA' };
const ATTR_HELP = {
  attack: 'Attack: turns possessions into 7-point scores against their Defense.',
  defense: 'Defense: blunts their Attack when they have the ball.',
  control: 'Control: keeps the ball against their Control, on both ends.',
  stamina: 'Stamina: does not score. It cuts the fatigue a starter gains each match.',
};

const ROSTER = [
  { id: 'reyke', name: 'Tomas Reyke', role: 'Striker', attack: 9, defense: 3, control: 6, stamina: 5, fatigue: 64 },
  { id: 'marrow', name: 'Ilse Marrow', role: 'Playmaker', attack: 6, defense: 4, control: 9, stamina: 6, fatigue: 22 },
  { id: 'abara', name: 'Kofi Abara', role: 'Stopper', attack: 3, defense: 8, control: 5, stamina: 7, fatigue: 18 },
  { id: 'hollis', name: 'Bram Hollis', role: 'Keeper', attack: 2, defense: 9, control: 4, stamina: 6, fatigue: 12 },
  { id: 'ostrova', name: 'Nell Ostrova', role: 'Winger', attack: 7, defense: 4, control: 6, stamina: 8, fatigue: 30 },
  { id: 'calder', name: 'Rui Calder', role: 'Engine', attack: 5, defense: 6, control: 6, stamina: 9, fatigue: 26 },
  { id: 'danner', name: 'Pip Danner', role: 'Young forward', attack: 6, defense: 3, control: 4, stamina: 7, fatigue: 0 },
  { id: 'brask', name: 'Otto Brask', role: 'Veteran back', attack: 4, defense: 7, control: 5, stamina: 3, fatigue: 8 },
];

const TACTICS = {
  patient: { id: 'patient', name: 'Patient', blurb: 'Work it short. Reliable 3s, fewer 7s.' },
  balanced: { id: 'balanced', name: 'Balanced', blurb: 'Mix it up. Even spread.' },
  aggressive: { id: 'aggressive', name: 'Aggressive', blurb: 'Go direct. Big upside, lots of blanks.' },
};
const TACTIC_ORDER = ['patient', 'balanced', 'aggressive'];

// Tendency: when YOU pick `tactic`, add `pp` to the shift of `side`'s offense.
// side 'you' = your attacks; side 'them' = their attacks (positive pp helps them).
const OPPONENTS = [
  {
    id: 'harbor', name: 'Harbor Lane Rovers', colors: ['#2f6f8f', '#e8d9a8'],
    attack: 4.5, defense: 4, control: 4.5, tactic: 'balanced',
    tendency: { tactic: 'patient', side: 'you', pp: 7, text: 'They push everyone forward. Patient build-ups find the space behind them.' },
  },
  {
    id: 'millbrook', name: 'Millbrook Stonecutters', colors: ['#6b6b6b', '#f2b134'],
    attack: 4, defense: 6, control: 4.5, tactic: 'patient',
    tendency: { tactic: 'aggressive', side: 'you', pp: -6, text: 'They pack the box. Long-range gambles get blocked.' },
  },
  {
    id: 'ironworks', name: 'Ironworks Social', colors: ['#8a3b2e', '#d9d2c5'],
    attack: 5.5, defense: 4.5, control: 4, tactic: 'aggressive',
    tendency: { tactic: 'aggressive', side: 'you', pp: 7, text: 'Slow to turn. Direct, aggressive attacks catch them flat.' },
  },
  {
    id: 'ashgrove', name: 'Ashgrove Kestrels', colors: ['#3d7a4a', '#f4f1e6'],
    attack: 5, defense: 4.5, control: 5, tactic: 'balanced',
    tendency: { tactic: 'aggressive', side: 'them', pp: 7, text: 'Lethal on the break. If you commit bodies forward (Aggressive), they punish it.' },
  },
  {
    id: 'cobalt', name: 'Cobalt Street', colors: ['#2b4aa0', '#9fd3f0'],
    attack: 5, defense: 5, control: 5, tactic: 'patient',
    tendency: { tactic: 'patient', side: 'you', pp: -6, text: 'They smother slow play. Patient possession gets pressed into mistakes.' },
  },
  {
    id: 'quillmouth', name: 'Quillmouth Lanterns', colors: ['#5a2d82', '#f6c945'],
    attack: 5.5, defense: 5.5, control: 5.5, tactic: 'balanced',
    tendency: { tactic: 'balanced', side: 'you', pp: 6, text: 'Champions with a high back line. Balanced, mixed play pulls them apart.' },
  },
];

// Twelve recap templates. Each describes ONE logged possession. Placeholders are
// filled only from the recorded event and match context (see sim.renderTemplate).
// Rules are checked top to bottom; first match wins.
const TEMPLATES = [
  { id: 'you7_tend', when: { team: 'you', points: 7, tendency: true }, text: 'Possession {n}: the {tactic} plan hit the weakness the scouts flagged, and {club} scored 7 ({chance7}% chance, roll {roll}). {score}.' },
  { id: 'you7_late', when: { team: 'you', points: 7, late: true }, text: 'Possession {n}, late and tight: {club} found a 7 when it mattered ({chance7}% chance, roll {roll}). {score}.' },
  { id: 'you7', when: { team: 'you', points: 7 }, text: 'Possession {n}: {club} broke through for 7 ({chance7}% chance, roll {roll}). {score}.' },
  { id: 'you3_tired', when: { team: 'you', points: 3, tired: true }, text: 'Possession {n}: tired legs (your side at {fatiguePct}% strength) settled for 3. {score}.' },
  { id: 'you3', when: { team: 'you', points: 3 }, text: 'Possession {n}: {club} worked it into a 3 ({chance3}% chance). {score}.' },
  { id: 'you0_gamble', when: { team: 'you', points: 0, tactic: 'aggressive' }, text: 'Possession {n}: the aggressive gamble came up empty (a {chance0}% risk, roll {roll}). {score}.' },
  { id: 'you0_tired', when: { team: 'you', points: 0, tired: true }, text: 'Possession {n}: fatigue showed. Your side played at {fatiguePct}% strength and came away with nothing. {score}.' },
  { id: 'you0', when: { team: 'you', points: 0 }, text: 'Possession {n}: {club} came up empty ({chance0}% chance of a blank, roll {roll}). {score}.' },
  { id: 'them7_tend', when: { team: 'them', points: 7, tendency: true }, text: 'Possession {n}: {opp} punished your {tactic} shape exactly as scouted, 7 points ({chance7}% chance). {score}.' },
  { id: 'them7', when: { team: 'them', points: 7 }, text: 'Possession {n}: {opp} cut through for 7 ({chance7}% chance, roll {roll}). {score}.' },
  { id: 'them3', when: { team: 'them', points: 3 }, text: 'Possession {n}: {opp} chipped in a 3. {score}.' },
  { id: 'them0', when: { team: 'them', points: 0 }, text: 'Possession {n}: your defense held. {opp} got nothing ({chance0}% chance of a stop, roll {roll}). {score}.' },
];

function validateContent(cfg) {
  const errors = [];
  const ids = new Set();
  if (ROSTER.length !== 8) errors.push('roster must have 8 players');
  for (const p of ROSTER) {
    if (ids.has(p.id)) errors.push('duplicate player id ' + p.id);
    ids.add(p.id);
    for (const a of ATTRS) {
      if (!Number.isInteger(p[a]) || p[a] < cfg.attrMin || p[a] > cfg.attrMax) errors.push(p.id + ' bad ' + a);
    }
    if (!(p.fatigue >= 0 && p.fatigue <= cfg.fatigueMax)) errors.push(p.id + ' bad fatigue');
  }
  if (OPPONENTS.length !== cfg.fixtures) errors.push('need one opponent per fixture');
  for (const o of OPPONENTS) {
    if (!TACTICS[o.tactic]) errors.push(o.id + ' bad tactic');
    const t = o.tendency;
    if (!TACTICS[t.tactic] || (t.side !== 'you' && t.side !== 'them') || Math.abs(t.pp) > cfg.maxShift) errors.push(o.id + ' bad tendency');
  }
  for (const k of TACTIC_ORDER) {
    const b = cfg.base[k];
    if (!b || b.length !== 3 || b[0] + b[1] + b[2] !== 100) errors.push('base ' + k + ' must sum to 100');
    if (b && (b[0] < cfg.maxShift || b[2] < cfg.maxShift)) errors.push('base ' + k + ' cannot absorb max shift');
  }
  if (TEMPLATES.length !== 12) errors.push('need 12 templates');
  const tids = new Set();
  const allowed = new Set(['n', 'tactic', 'club', 'opp', 'chance0', 'chance3', 'chance7', 'roll', 'score', 'fatiguePct']);
  for (const t of TEMPLATES) {
    if (tids.has(t.id)) errors.push('duplicate template ' + t.id);
    tids.add(t.id);
    for (const m of t.text.matchAll(/\{(\w+)\}/g)) if (!allowed.has(m[1])) errors.push(t.id + ' unknown placeholder ' + m[1]);
  }
  // every (team, points) pair must have a fallback template with no extra conditions
  for (const team of ['you', 'them']) for (const pts of cfg.outcomes) {
    if (!TEMPLATES.some(t => t.when.team === team && t.when.points === pts && Object.keys(t.when).length === 2)) errors.push('no fallback template for ' + team + ' ' + pts);
  }
  return errors;
}

// ---- rng.mjs ----
// Seeded RNG (mulberry32). State is a single uint32 so it can be saved as a number.
function seedToState(seed) {
  const s = String(seed);
  let h = 1779033703 ^ s.length;
  for (let i = 0; i < s.length; i++) {
    h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  h = Math.imul(h ^ (h >>> 16), 2246822507);
  h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^ (h >>> 16)) >>> 0;
}

// Returns [integer in 0..n-1, nextState]. Pure: never mutates anything.
function rngInt(state, n) {
  const t = (state + 0x6D2B79F5) >>> 0;
  let r = Math.imul(t ^ (t >>> 15), t | 1);
  r ^= r + Math.imul(r ^ (r >>> 7), r | 61);
  const v = ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  return [Math.floor(v * n), t];
}

// ---- sim.mjs ----
// One More Season — pure match simulator. No DOM, no storage, no Math.random.




const round2 = x => Math.round(x * 100) / 100;

function fatigueMult(p, cfg = CONFIG) {
  return 1 - p.fatigue / cfg.fatigueDivisor;
}

function effective(p, attr, cfg = CONFIG) {
  if (attr === 'stamina') return p.stamina;
  return p[attr] * fatigueMult(p, cfg);
}

// Average effective Attack / Defense / Control across the five starters.
function teamRatings(starters, cfg = CONFIG) {
  const n = starters.length;
  const sum = { attack: 0, defense: 0, control: 0, mult: 0 };
  for (const p of starters) {
    sum.attack += effective(p, 'attack', cfg);
    sum.defense += effective(p, 'defense', cfg);
    sum.control += effective(p, 'control', cfg);
    sum.mult += fatigueMult(p, cfg);
  }
  return { attack: round2(sum.attack / n), defense: round2(sum.defense / n), control: round2(sum.control / n), fatigueFactor: round2(sum.mult / n) };
}

function oppRatings(opp) {
  return { attack: opp.attack, defense: opp.defense, control: opp.control, fatigueFactor: 1 };
}

function tendencyPP(opp, side, yourTactic) {
  const t = opp.tendency;
  return t.side === side && t.tactic === yourTactic ? t.pp : 0;
}

// The single documented modifier formula. Returns every term so it can be logged.
function possessionOdds(off, def, tactic, tendency, cfg = CONFIG) {
  const attackTerm = round2(cfg.kAttack * (off.attack - def.defense));
  const controlTerm = round2(cfg.kControl * (off.control - def.control));
  const raw = round2(attackTerm + controlTerm + tendency);
  const shift = Math.max(-cfg.maxShift, Math.min(cfg.maxShift, Math.round(raw)));
  const b = cfg.base[tactic];
  const dist = [b[0] - shift, b[1], b[2] + shift];
  return { attackTerm, controlTerm, tendency, raw, shift, dist };
}

const expectedPoints = dist => round2((dist[1] * 3 + dist[2] * 7) / 100);

function matchPreview(starters, opp, tactic, cfg = CONFIG) {
  const you = teamRatings(starters, cfg);
  const them = oppRatings(opp);
  const yourOdds = possessionOdds(you, them, tactic, tendencyPP(opp, 'you', tactic), cfg);
  const theirOdds = possessionOdds(them, you, opp.tactic, tendencyPP(opp, 'them', tactic), cfg);
  return {
    you, them, yourOdds, theirOdds,
    evYou: round2(expectedPoints(yourOdds.dist) * cfg.possessionsPerTeam),
    evThem: round2(expectedPoints(theirOdds.dist) * cfg.possessionsPerTeam),
  };
}

function outcomeFor(dist, roll) {
  if (roll < dist[0]) return 0;
  if (roll < dist[0] + dist[1]) return 3;
  return 7;
}

// Resolve a whole match once. Possessions alternate; each team gets 8.
function simulateMatch({ starters, opp, tactic, rngState, youFirst }, cfg = CONFIG) {
  const pv = matchPreview(starters, opp, tactic, cfg);
  let rng = rngState >>> 0;
  let scoreYou = 0, scoreThem = 0;
  const events = [];
  const total = cfg.possessionsPerTeam * 2;
  for (let i = 0; i < total; i++) {
    const yours = (i % 2 === 0) === !!youFirst;
    const odds = yours ? pv.yourOdds : pv.theirOdds;
    let roll;
    [roll, rng] = rngInt(rng, 100);
    const points = outcomeFor(odds.dist, roll);
    const marginBefore = scoreYou - scoreThem;
    if (yours) scoreYou += points; else scoreThem += points;
    events.push({
      i, n: i + 1, team: yours ? 'you' : 'them',
      tactic: yours ? tactic : opp.tactic,
      off: yours ? pv.you : pv.them,
      def: yours ? pv.them : pv.you,
      attackTerm: odds.attackTerm, controlTerm: odds.controlTerm, tendency: odds.tendency,
      raw: odds.raw, shift: odds.shift, dist: odds.dist.slice(),
      fatigueFactor: pv.you.fatigueFactor,
      roll, points, marginBefore, scoreYou, scoreThem,
    });
  }
  const outcome = scoreYou > scoreThem ? 'W' : scoreYou < scoreThem ? 'L' : 'D';
  return { events, scoreYou, scoreThem, outcome, rngAfter: rng, decisive: pickDecisive(events, cfg), preview: pv };
}

function eventSwing(e, cfg = CONFIG) {
  let s = Math.abs(e.points - expectedPoints(e.dist));
  if (e.i >= cfg.lateFrom && Math.abs(e.marginBefore) <= cfg.lateMargin) s += cfg.lateBonus;
  return round2(s);
}

// Three decisive events: biggest swing vs expectation, ties go to the later possession.
function pickDecisive(events, cfg = CONFIG) {
  return events
    .map(e => ({ i: e.i, s: eventSwing(e, cfg) }))
    .sort((a, b) => b.s - a.s || b.i - a.i)
    .slice(0, 3)
    .map(x => x.i)
    .sort((a, b) => a - b);
}

function eventFlags(e, cfg = CONFIG) {
  return {
    team: e.team, points: e.points, tactic: e.tactic,
    tendency: e.tendency !== 0,
    late: e.i >= cfg.lateFrom && Math.abs(e.marginBefore) <= cfg.lateMargin,
    tired: e.team === 'you' ? e.fatigueFactor < cfg.tiredBelow : false,
  };
}

function templateFor(e, cfg = CONFIG) {
  const f = eventFlags(e, cfg);
  return TEMPLATES.find(t => Object.entries(t.when).every(([k, v]) => f[k] === v));
}

function renderEvent(e, ctx, cfg = CONFIG) {
  const t = templateFor(e, cfg);
  const yourTactic = ctx.tactic;
  const vals = {
    n: e.n,
    tactic: TACTICS[e.team === 'you' ? e.tactic : yourTactic].name.toLowerCase(),
    club: CLUB.short,
    opp: ctx.oppName,
    chance0: e.dist[0], chance3: e.dist[1], chance7: e.dist[2],
    roll: e.roll,
    score: `${CLUB.short} ${e.scoreYou}, ${ctx.oppShort} ${e.scoreThem}`,
    fatiguePct: Math.round(e.fatigueFactor * 100),
  };
  return { id: t.id, text: t.text.replace(/\{(\w+)\}/g, (_, k) => String(vals[k])) };
}

// ---- game.mjs ----
// One More Season — season state machine. Every change goes through reduce().
// reduce() is pure: it returns a brand-new state or an error, never mutates.





const PHASES = ['prep', 'match', 'review', 'develop', 'recap'];
// Legal transitions, by command.
const TRANSITIONS = {
  SET_DRAFT: { prep: 'prep' },
  COMMIT: { prep: 'match' },
  FINISH_MATCH: { match: 'review' },
  CONTINUE: { review: 'develop|recap' },
  DEVELOP: { develop: 'prep' },
  MARK_HISTORY: { recap: 'recap' },
};

const clone = x => JSON.parse(JSON.stringify(x));
const clampF = (f, cfg) => Math.max(0, Math.min(cfg.fatigueMax, f));

function defaultDraft(roster, prevStarters) {
  const starters = prevStarters && prevStarters.length === CONFIG.startersCount
    ? prevStarters.slice()
    : ['reyke', 'marrow', 'abara', 'hollis', 'ostrova'];
  return { starters, prep: {}, tactic: 'balanced' };
}

function newSeason(seed, id, cfg = CONFIG) {
  const roster = clone(ROSTER);
  return {
    version: cfg.saveVersion,
    id: String(id || seed),
    seed: String(seed),
    rng: seedToState(seed),
    phase: 'prep',
    fixture: 0,
    roster,
    draft: defaultDraft(roster),
    results: [],
    historyRecorded: false,
  };
}

function currentOpponent(state) {
  return OPPONENTS[state.fixture];
}

// Checks a lineup/prep/tactic decision. Returns a list of problems (empty = legal).
function checkDecision(state, d, cfg = CONFIG) {
  const errs = [];
  const ids = new Set(state.roster.map(p => p.id));
  const st = d.starters || [];
  if (st.length !== cfg.startersCount) errs.push(`Pick exactly ${cfg.startersCount} starters.`);
  if (new Set(st).size !== st.length) errs.push('A player is listed twice.');
  for (const id of st) if (!ids.has(id)) errs.push('Unknown player ' + id);
  if (!TACTICS[d.tactic]) errs.push('Pick a plan.');
  const prep = d.prep || {};
  const entries = Object.entries(prep);
  if (entries.length > cfg.prepPoints) errs.push(`Only ${cfg.prepPoints} prep points.`);
  for (const [id, act] of entries) {
    const p = state.roster.find(x => x.id === id);
    if (!p) { errs.push('Unknown player ' + id); continue; }
    if (act === 'rest') continue;
    const m = /^train:(\w+)$/.exec(act);
    if (!m || !ATTRS.includes(m[1])) { errs.push('Bad prep action for ' + p.name); continue; }
    if (p[m[1]] >= cfg.attrMax) errs.push(`${p.name} is already at ${cfg.attrMax} ${m[1]}.`);
  }
  return errs;
}

function applyPrep(roster, prep, cfg = CONFIG) {
  const out = clone(roster);
  for (const [id, act] of Object.entries(prep)) {
    const p = out.find(x => x.id === id);
    if (act === 'rest') p.fatigue = clampF(p.fatigue - cfg.restAmount, cfg);
    else {
      const attr = act.split(':')[1];
      p[attr] = Math.min(cfg.attrMax, p[attr] + 1);
      p.fatigue = clampF(p.fatigue + cfg.trainFatigue, cfg);
    }
  }
  return out;
}

function fatigueAfterMatch(roster, starters, cfg = CONFIG) {
  return roster.map(p => {
    const before = p.fatigue;
    const delta = starters.includes(p.id) ? cfg.starterFatigueBase - p.stamina : -cfg.reserveRecovery;
    return { id: p.id, before, after: clampF(before + delta, cfg) };
  });
}

function reduce(state, cmd, cfg = CONFIG) {
  const allowed = TRANSITIONS[cmd.type];
  if (!allowed) return { ok: false, error: 'Unknown command ' + cmd.type, state };
  if (!(state.phase in allowed)) return { ok: false, error: `${cmd.type} is not allowed during ${state.phase}`, state };
  const s = clone(state);
  switch (cmd.type) {
    case 'SET_DRAFT': {
      const d = cmd.draft;
      s.draft = { starters: (d.starters || []).slice(0, cfg.startersCount), prep: Object.assign({}, d.prep), tactic: d.tactic };
      return { ok: true, state: s };
    }
    case 'COMMIT': {
      const d = { starters: cmd.starters, prep: cmd.prep || {}, tactic: cmd.tactic };
      const errs = checkDecision(s, d, cfg);
      if (errs.length) return { ok: false, error: errs.join(' '), state };
      const opp = currentOpponent(s);
      // 1. prep is applied once, as part of the same atomic commit
      const rosterBefore = clone(s.roster);
      s.roster = applyPrep(s.roster, d.prep, cfg);
      const starters = d.starters.map(id => s.roster.find(p => p.id === id));
      const youFirst = s.fixture % 2 === 0;
      // 2. the match is resolved exactly once; result + RNG are stored before playback
      const m = simulateMatch({ starters, opp, tactic: d.tactic, rngState: s.rng, youFirst }, cfg);
      s.results.push({
        fixture: s.fixture, oppId: opp.id, starters: d.starters.slice(), prep: clone(d.prep), tactic: d.tactic,
        youFirst, rosterBefore, rosterAtKickoff: clone(s.roster),
        events: m.events, scoreYou: m.scoreYou, scoreThem: m.scoreThem, outcome: m.outcome,
        decisive: m.decisive, preview: m.preview, rngBefore: s.rng, rngAfter: m.rngAfter,
        fatigueApplied: false, fatigueChanges: null, devApplied: false, dev: null,
      });
      s.rng = m.rngAfter;
      s.phase = 'match';
      return { ok: true, state: s };
    }
    case 'FINISH_MATCH': {
      const r = s.results[s.fixture];
      if (r.fatigueApplied) return { ok: false, error: 'Fatigue already applied', state };
      const ch = fatigueAfterMatch(s.roster, r.starters, cfg);
      for (const c of ch) s.roster.find(p => p.id === c.id).fatigue = c.after;
      r.fatigueChanges = ch;
      r.fatigueApplied = true;
      s.phase = 'review';
      return { ok: true, state: s };
    }
    case 'CONTINUE': {
      s.phase = s.fixture < cfg.fixtures - 1 ? 'develop' : 'recap';
      return { ok: true, state: s };
    }
    case 'DEVELOP': {
      const r = s.results[s.fixture];
      if (r.devApplied) return { ok: false, error: 'Development already chosen', state };
      const p = s.roster.find(x => x.id === cmd.playerId);
      if (!p) return { ok: false, error: 'Pick a player', state };
      if (!ATTRS.includes(cmd.attr)) return { ok: false, error: 'Pick an attribute', state };
      if (p[cmd.attr] >= cfg.attrMax) return { ok: false, error: `${p.name} is already at ${cfg.attrMax}`, state };
      p[cmd.attr] += 1;
      r.devApplied = true;
      r.dev = { playerId: p.id, attr: cmd.attr, to: p[cmd.attr] };
      s.fixture += 1;
      s.phase = 'prep';
      s.draft = defaultDraft(s.roster, r.starters);
      s.draft.tactic = r.tactic;
      return { ok: true, state: s };
    }
    case 'MARK_HISTORY': {
      if (s.historyRecorded) return { ok: false, error: 'Already recorded', state };
      s.historyRecorded = true;
      return { ok: true, state: s };
    }
  }
  return { ok: false, error: 'unreachable', state };
}

// Structural validation for loaded saves. Returns problems (empty = valid).
function validateState(s, cfg = CONFIG) {
  const e = [];
  if (!s || typeof s !== 'object') return ['not an object'];
  if (s.version !== cfg.saveVersion) e.push('version ' + s.version);
  if (!PHASES.includes(s.phase)) e.push('phase ' + s.phase);
  if (!Number.isInteger(s.fixture) || s.fixture < 0 || s.fixture >= cfg.fixtures) e.push('fixture');
  if (!Number.isInteger(s.rng) || s.rng < 0) e.push('rng');
  if (!Array.isArray(s.roster) || s.roster.length !== ROSTER.length) e.push('roster');
  else for (const p of s.roster) {
    for (const a of ATTRS) if (!Number.isInteger(p[a]) || p[a] < cfg.attrMin || p[a] > cfg.attrMax) e.push(p.id + '.' + a);
    if (typeof p.fatigue !== 'number' || p.fatigue < 0 || p.fatigue > cfg.fatigueMax) e.push(p.id + '.fatigue');
  }
  if (!Array.isArray(s.results)) return e.concat('results');
  const need = s.phase === 'prep' ? s.fixture : s.fixture + 1;
  if (s.results.length !== need) e.push(`results length ${s.results.length} != ${need}`);
  const r = s.results[s.fixture];
  if (s.phase === 'match' && r && r.fatigueApplied) e.push('match phase but fatigue applied');
  if ((s.phase === 'review' || s.phase === 'develop' || s.phase === 'recap') && r && !r.fatigueApplied) e.push('fatigue missing');
  if (s.phase === 'develop' && r && r.devApplied) e.push('develop phase but dev applied');
  if (s.phase === 'recap' && s.fixture !== cfg.fixtures - 1) e.push('recap before last fixture');
  for (const x of s.results) if (!Array.isArray(x.events) || x.events.length !== cfg.possessionsPerTeam * 2) e.push('events');
  if (s.phase === 'prep' && (!s.draft || !Array.isArray(s.draft.starters))) e.push('draft');
  return e;
}

function record(state) {
  const w = state.results.filter(r => r.outcome === 'W').length;
  const d = state.results.filter(r => r.outcome === 'D').length;
  const l = state.results.filter(r => r.outcome === 'L').length;
  return { w, d, l };
}

// Season recap built only from recorded results.
function seasonRecap(state, cfg = CONFIG) {
  const rec = record(state);
  const success = rec.w >= cfg.winTarget;
  const pf = state.results.reduce((a, r) => a + r.scoreYou, 0);
  const pa = state.results.reduce((a, r) => a + r.scoreThem, 0);
  const starts = {};
  for (const r of state.results) for (const id of r.starters) starts[id] = (starts[id] || 0) + 1;
  const lines = state.results.map(r => {
    const opp = OPPONENTS[r.fixture];
    const big = r.decisive.map(i => r.events[i]).sort((a, b) => Math.abs(b.points - 3) - Math.abs(a.points - 3))[0];
    return {
      fixture: r.fixture + 1, opp: opp.name, outcome: r.outcome, score: `${r.scoreYou}-${r.scoreThem}`,
      tactic: TACTICS[r.tactic].name,
      key: big ? renderEvent(big, { tactic: r.tactic, oppName: opp.name, oppShort: opp.name.split(' ')[0] }, cfg).text : '',
    };
  });
  const losses = state.results.filter(r => r.outcome !== 'W').map(r => ({ r, m: r.scoreThem - r.scoreYou })).sort((a, b) => a.m - b.m);
  const closest = losses[0] ? { fixture: losses[0].r.fixture + 1, opp: OPPONENTS[losses[0].r.fixture].name, margin: losses[0].m, outcome: losses[0].r.outcome, tactic: TACTICS[losses[0].r.tactic].name, fatiguePct: Math.round(losses[0].r.preview.you.fatigueFactor * 100) } : null;
  let peak = null;
  for (const r of state.results) for (const id of r.starters) {
    const p = r.rosterAtKickoff.find(x => x.id === id);
    if (!peak || p.fatigue > peak.fatigue) peak = { name: p.name, fatigue: p.fatigue, fixture: r.fixture + 1 };
  }
  return { rec, success, pf, pa, starts, lines, closest, peak };
}

// ---- storage.mjs ----
// One More Season — persistence. Works with any Storage-like object (localStorage or a test fake).


const KEYS = {
  save: 'oneMoreSeason.save.v1',
  prev: 'oneMoreSeason.prev.v1', // last good save before the newest write (recovery path)
  backup: 'oneMoreSeason.backup', // any unreadable save is parked here, never deleted
  history: 'oneMoreSeason.history.v1',
  prefs: 'oneMoreSeason.prefs.v1',
};

function get(st, k) { try { return st ? st.getItem(k) : null; } catch (e) { return null; } }
function set(st, k, v) { try { st.setItem(k, v); return true; } catch (e) { return false; } }

function loadSave(st) {
  const raw = get(st, KEYS.save);
  if (raw == null) return { state: null, problem: null };
  let parsed = null, problems;
  try { parsed = JSON.parse(raw); problems = validateState(parsed); } catch (e) { problems = ['unreadable JSON']; }
  if (!problems.length) return { state: parsed, problem: null };
  set(st, KEYS.backup, raw); // keep the player's data; the main slot is only overwritten by a later save
  const prevRaw = get(st, KEYS.prev);
  if (prevRaw) {
    try {
      const prev = JSON.parse(prevRaw);
      if (!validateState(prev).length) return { state: prev, problem: 'Your latest save was damaged, so the previous good save was restored. The damaged copy is kept as a backup.' };
    } catch (e) { /* fall through */ }
  }
  return { state: null, problem: 'Your save could not be read (' + problems.slice(0, 2).join(', ') + '). It was kept as a backup; export it from the menu if you need it.' };
}

// Persist the already-resolved state. Returns false if storage is unavailable.
function writeSave(st, state) {
  const cur = get(st, KEYS.save);
  if (cur != null) {
    try { if (!validateState(JSON.parse(cur)).length) set(st, KEYS.prev, cur); } catch (e) { /* keep old prev */ }
  }
  return set(st, KEYS.save, JSON.stringify(state));
}

function exportText(st) { return get(st, KEYS.save) || get(st, KEYS.backup) || ''; }

function importText(text) {
  let s;
  try { s = JSON.parse(text); } catch (e) { return { ok: false, error: 'That is not save text.' }; }
  const p = validateState(s);
  return p.length ? { ok: false, error: 'Save failed checks: ' + p.slice(0, 3).join(', ') } : { ok: true, state: s };
}

function loadHistory(st) {
  try { const h = JSON.parse(get(st, KEYS.history) || '[]'); return Array.isArray(h) ? h : []; } catch (e) { return []; }
}

function addHistory(st, entry) {
  const h = loadHistory(st);
  if (h.some(x => x.id === entry.id)) return h;
  h.push(entry);
  set(st, KEYS.history, JSON.stringify(h.slice(-50)));
  return h;
}

function loadPrefs(st) { try { return JSON.parse(get(st, KEYS.prefs) || '{}') || {}; } catch (e) { return {}; } }
function savePrefs(st, p) { set(st, KEYS.prefs, JSON.stringify(p)); }

// One More Season — presentation. Reads state, dispatches commands, never computes outcomes itself.

try { LS = window.localStorage; LS.getItem('oms-probe'); } catch (e) { LS = null; }

  state: null, screen: 'title', notice: '', saveOff: !LS,
  prefs: loadPrefs(LS), trainPick: null, play: null, devPick: null, modal: null,
};

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const f1 = x => (Math.round(x * 10) / 10).toFixed(1);
const oppShort = o => o.name.split(' ')[0];
const debugOn = () => !!ui.prefs.debug;
const player = id => ui.state.roster.find(p => p.id === id);
const KIT = typeof GK !== 'undefined' ? GK : null; // GameKit, when the page carries it

function newCode() {
  const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  const buf = new Uint32Array(6);
  try { crypto.getRandomValues(buf); } catch (e) { for (let i = 0; i < 6; i++) buf[i] = Math.floor(Math.random() * 1e9); }
  for (let i = 0; i < 6; i++) s += a[buf[i] % a.length];
  return s;
}

function persist() {
  if (!LS) { ui.saveOff = true; return; }
  ui.saveOff = !writeSave(LS, ui.state);
}

function dispatch(cmd) {
  const res = reduce(ui.state, cmd);
  if (!res.ok) { ui.notice = res.error; render(); return false; }
  ui.state = res.state; // resolve first...
  persist(); // ...then persist the resolved state, then present it
  ui.notice = '';
  return true;
}

function startSeason(code) {
  ui.state = newSeason(code, code + '@' + Date.now());
  ui.screen = 'game'; ui.play = null; ui.trainPick = null; ui.devPick = null;
  persist();
  render(); window.scrollTo(0, 0);
}

// ---------- prep ----------
function coachNotes(s, opp, pv) {
  const notes = [];
  const d = s.draft;
  if (s.fixture === 0) {
    const t = player('reyke');
    notes.push(`<b>${esc(t.name)}</b> is your best attacker (ATK ${t.attack}) but tired: fatigue ${t.fatigue} means every stat plays at ${Math.round(fatigueMult(t) * 100)}%. Rest the striker (fatigue -24), or bench for fresh <b>${esc(player('danner').name)}</b>.`);
    notes.push(`Scouts say ${esc(opp.name)} leave space behind. Your <b>${TACTICS[opp.tendency.tactic].name}</b> plan gets ${opp.tendency.pp > 0 ? '+' : ''}${opp.tendency.pp} toward 7s in this fixture.`);
  }
  for (const id of d.starters) {
    const p = player(id);
    const after = d.prep[id] === 'rest' ? Math.max(0, p.fatigue - CONFIG.restAmount) : p.fatigue + (d.prep[id] && d.prep[id] !== 'rest' ? CONFIG.trainFatigue : 0);
    if (s.fixture > 0 && after >= CONFIG.tiredWarn) notes.push(`<b>${esc(p.name)}</b> would start at fatigue ${Math.round(after)} (${Math.round((1 - after / 200) * 100)}% strength) and gain ${CONFIG.starterFatigueBase - p.stamina} more.`);
  }
  const left = CONFIG.prepPoints - Object.keys(d.prep).length;
  if (left > 0 && s.fixture > 0) notes.push(`${left} prep point${left > 1 ? 's' : ''} unused. They do not carry over.`);
  if (s.fixture === CONFIG.fixtures - 1) notes.push('Last fixture: nothing to save legs for.');
  return notes.length ? `<section class="card notes"><h3>Coach's notes</h3>${notes.map(n => `<p>${n}</p>`).join('')}</section>` : '';
}

  const s = ui.state, d = s.draft, opp = currentOpponent(s);
  const prepRoster = applyPrep(s.roster, d.prep);
  const startersNow = d.starters.map(id => prepRoster.find(p => p.id === id));
  const full = startersNow.length === CONFIG.startersCount;
  const pv = full ? matchPreview(startersNow, opp, d.tactic) : null;
  const left = CONFIG.prepPoints - Object.keys(d.prep).length;
  const t = opp.tendency;
  const yourR = pv ? pv.you : null;

  const scouting = `<section class="card scout" style="--o1:${opp.colors[0]};--o2:${opp.colors[1]}">

      <tr><td>${esc(oppShort(opp))}</td><td>${f1(opp.attack)}</td><td>${f1(opp.defense)}</td><td>${f1(opp.control)}</td></tr>
      ${yourR ? `<tr class="you"><td>You</td><td>${f1(yourR.attack)}</td><td>${f1(yourR.defense)}</td><td>${f1(yourR.control)}</td></tr>` : ''}</table>
    <p class="tend"><b>Tendency:</b> ${esc(t.text)} <span class="pill ${(t.side === 'you') === (t.pp > 0) ? 'good' : 'bad'}">${TACTICS[t.tactic].name}: ${t.side === 'you' ? 'your' : 'their'} 7s ${t.pp > 0 ? '+' : ''}${t.pp}</span></p>
    <p class="fine">Team numbers are averages of the five starters after fatigue.</p>
  </section>`;

  const rows = s.roster.map(p0 => {

    const on = d.starters.includes(p.id);
    const act = d.prep[p.id];

    const fCls = p.fatigue >= 60 ? 'hot' : p.fatigue >= 35 ? 'warm' : 'cool';

        <div class="fat ${fCls}" title="Fatigue"><div style="width:${p.fatigue}%"></div><span>${Math.round(p.fatigue)}${p0.fatigue !== p.fatigue ? ` <s>${Math.round(p0.fatigue)}</s>` : ''}</span></div>
      </div>
      <div class="attrs">${attrs}</div>
      <div class="prep">
        <button class="mini ${act === 'rest' ? 'sel' : ''}" data-act="rest" data-id="${p.id}" ${canPrep || act === 'rest' ? '' : 'disabled'}>Rest -${CONFIG.restAmount}</button>

    </li>`;
  }).join('');

  const plans = TACTIC_ORDER.map(k => {

      body = `${distBar(p2.yourOdds.dist, TACTICS[k].name + ' your attack')}${tag}`;
      if (debugOn()) body += `<div class="math">shift ${p2.yourOdds.shift} (atk ${p2.yourOdds.attackTerm}, ctl ${p2.yourOdds.controlTerm}, tend ${p2.yourOdds.tendency}) &middot; your EV ${p2.evYou} vs their EV ${p2.evThem}</div>`;
    }
    return `<button class="plan ${sel ? 'sel' : ''}" data-act="tactic" data-t="${k}" aria-pressed="${sel}"><b>${TACTICS[k].name}</b><span>${esc(TACTICS[k].blurb)}</span>${body}</button>`;
  }).join('');

  const errs = checkDecision(s, d);
  const theirs = pv ? `<section class="card"><h3>Their attack vs your defense</h3>${distBar(pv.theirOdds.dist, 'their attack')}${distKey}
    ${debugOn() ? `<div class="math">${esc(oppShort(opp))} ${TACTICS[opp.tactic].name} &middot; ATK ${f1(pv.them.attack)} vs your DEF ${f1(pv.you.defense)} &rarr; ${pv.theirOdds.attackTerm} &middot; CTL ${pv.theirOdds.controlTerm} &middot; tend ${pv.theirOdds.tendency} &rarr; shift ${pv.theirOdds.shift}</div>` : ''}</section>` : '';

  app.innerHTML = `${topBar()}<main class="prepview">
    ${scouting}
    ${coachNotes(s, opp, pv)}
    <section class="card"><h3>Squad <span class="count">${d.starters.length}/${CONFIG.startersCount} starting &middot; ${left} prep point${left === 1 ? '' : 's'} left</span></h3>
      <ul class="squad">${rows}</ul></section>
    <section class="card"><h3>Your plan <span class="count">chance per possession</span></h3><div class="plans">${plans}</div>${full ? distKey : '<p class="fine">Pick 5 starters to see your odds.</p>'}</section>
    ${theirs}
    ${debugOn() ? `<p class="math">Season code ${esc(s.seed)} &middot; rng ${s.rng} &middot; ${s.fixture % 2 === 0 ? 'you' : 'they'} attack first</p>` : ''}

  <footer class="dock"><button class="big" data-act="kickoff" ${errs.length ? 'disabled' : ''}>${errs.length ? esc(errs[0]) : 'Kick off vs ' + esc(oppShort(opp))}</button></footer>`;

// ---------- review ----------
function renderReview() {
  const s = ui.state, r = s.results[s.fixture], opp = OPPONENTS[r.fixture];
  const ctx = { tactic: r.tactic, oppName: opp.name, oppShort: oppShort(opp) };
  const word = { W: 'Win', D: 'Draw', L: 'Loss' }[r.outcome];
  const dec = r.decisive.map(i => {
    const e = r.events[i];
    const rt = renderEvent(e, ctx);
    return `<li class="ev ${e.team}"><p>${esc(rt.text)}</p><small>Logged: possession ${e.n}, ${e.team === 'you' ? 'your' : 'their'} ${TACTICS[e.tactic].name} attack, odds ${e.dist.join('/')}, roll ${e.roll}${e.tendency ? `, tendency ${e.tendency > 0 ? '+' : ''}${e.tendency}` : ''}, your strength ${Math.round(e.fatigueFactor * 100)}%.</small>${debugOn() ? mathLine(e) : ''}</li>`;
  }).join('');
  const fat = r.fatigueChanges.filter(c => Math.abs(c.after - c.before) > 0).map(c => {
    const p = player(c.id);
    return `<li><b>${esc(p.name)}</b> ${Math.round(c.before)} &rarr; <span class="${c.after >= 60 ? 'hotT' : ''}">${Math.round(c.after)}</span></li>`;
  }).join('');
  const prep = Object.entries(r.prep).map(([id, a]) => `${esc(player(id).name)}: ${a === 'rest' ? 'rested' : 'trained ' + ATTR_LABEL[a.split(':')[1]]}`).join(' &middot; ') || 'none';
  app.innerHTML = `${topBar()}<main>
    <section class="card result ${r.outcome}"><h2>${word} ${r.scoreYou}-${r.scoreThem}</h2><p>vs ${esc(opp.name)} &middot; you played ${TACTICS[r.tactic].name}</p></section>
    <section class="card"><h3>Three moments that decided it</h3><ol class="evs">${dec}</ol></section>
    <section class="card"><h3>Fatigue after the match</h3><ul class="fatl">${fat}</ul><p class="fine">Prep used: ${prep}</p></section>
    ${debugOn() ? `<section class="card"><h3>All 16 possessions</h3>${r.events.map(mathLine).join('')}<p class="math">rng before ${r.rngBefore}, after ${r.rngAfter}</p></section>` : ''}
    <div class="spacer"></div></main>
  <footer class="dock"><button class="big" data-act="continue">${s.fixture < CONFIG.fixtures - 1 ? 'Training ground' : 'Season recap'}</button></footer>`;
}

// ---------- development ----------
function renderDevelop() {
  const s = ui.state, nextOpp = OPPONENTS[s.fixture + 1];
  const pick = ui.devPick;
  const rows = s.roster.map(p => `<li class="dv"><div class="who"><b>${esc(p.name)}</b><small>${esc(p.role)} &middot; fatigue ${Math.round(p.fatigue)}</small></div>
    <div class="dvb">${ATTRS.map(a => `<button class="mini ${pick && pick.id === p.id && pick.attr === a ? 'sel' : ''}" data-act="devpick" data-id="${p.id}" data-attr="${a}" ${p[a] >= CONFIG.attrMax ? 'disabled' : ''}>${ATTR_SHORT[a]} ${p[a]}</button>`).join('')}</div></li>`).join('');
  app.innerHTML = `${topBar()}<main>
    <section class="card"><h2>Training ground</h2><p>Pick one player and one attribute for a free +1. No fatigue cost. Next up: <b>${esc(nextOpp.name)}</b> (${esc(nextOpp.tendency.text)})</p></section>
    <section class="card"><ul class="devl">${rows}</ul></section>
    <div class="spacer"></div></main>
  <footer class="dock"><button class="big" data-act="develop" ${pick ? '' : 'disabled'}>${pick ? `Confirm: ${esc(player(pick.id).name)} ${ATTR_SHORT[pick.attr]} +1` : 'Pick a player and attribute'}</button></footer>`;
}

// ---------- recap ----------
function renderRecap() {
  const s = ui.state;
  const R = seasonRecap(s);
  if (!s.historyRecorded) {
    addHistory(LS, { id: s.id, seed: s.seed, w: R.rec.w, d: R.rec.d, l: R.rec.l, success: R.success });
    dispatch({ type: 'MARK_HISTORY' });
  }
  const starts = Object.entries(R.starts).sort((a, b) => b[1] - a[1]).map(([id, n]) => `${esc(player(id).name.split(' ')[0])} ${n}`).join(' &middot; ');
  const benched = s.roster.filter(p => !R.starts[p.id]).map(p => esc(p.name)).join(', ');
  app.innerHTML = `<main class="recap">
    <section class="card result ${R.success ? 'W' : 'L'}">${crest(56)}<h2>${R.success ? 'The board keeps you.' : 'The board has seen enough.'}</h2>
      <p class="big-rec">${R.rec.w}W ${R.rec.d}D ${R.rec.l}L</p><p>Scored ${R.pf}, conceded ${R.pa} &middot; target ${CONFIG.winTarget} wins</p></section>
    <section class="card"><h3>The season</h3><ol class="lines">${R.lines.map(l => `<li><span class="o ${l.outcome}">${l.outcome}</span><div><b>${l.score} vs ${esc(l.opp)}</b> <small>${l.tactic}</small><p>${esc(l.key)}</p></div></li>`).join('')}</ol></section>
    <section class="card"><h3>From the log</h3>
      ${R.closest ? `<p>Closest result you did not win: fixture ${R.closest.fixture} vs ${esc(R.closest.opp)}, ${R.closest.outcome === 'D' ? 'a draw' : 'lost by ' + R.closest.margin}, playing ${R.closest.tactic} at ${R.closest.fatiguePct}% strength.</p>` : '<p>You won every fixture.</p>'}
      ${R.peak ? `<p>Most tired starter: ${esc(R.peak.name)} kicked off fixture ${R.peak.fixture} at fatigue ${Math.round(R.peak.fatigue)}.</p>` : ''}
      <p>Starts: ${starts}${benched ? `. Never started: ${benched}` : ''}.</p>
      <p class="q"><b>One decision you would change?</b> Replay this exact season code and try it. Same code + same choices gives the same results, so only your change differs.</p>
    </section>
    <div class="stack"><button class="big" data-act="new">One more season</button><button class="secondary" data-act="replay">Replay season code ${esc(s.seed)}</button><button class="secondary" data-act="home">Title screen</button></div>
  </main>`;
}

// ---------- router ----------
function render() {
  if (ui.screen === 'title' || !ui.state) return renderTitle();
  const ph = ui.state.phase;
  if (ph !== 'match' && ui.play && ui.play.timer) { clearTimeout(ui.play.timer); ui.play = null; }
  if (ph === 'prep') renderPrep();
  else if (ph === 'match') renderMatch();
  else if (ph === 'review') renderReview();
  else if (ph === 'develop') renderDevelop();
  else renderRecap();
  if (ui.modal) app.insertAdjacentHTML('beforeend', renderModal());
}

function setDraft(mut) {
  const d = JSON.parse(JSON.stringify(ui.state.draft));
  mut(d);
  dispatch({ type: 'SET_DRAFT', draft: d });
}

app.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act, id = b.dataset.id;
  const y = window.scrollY;
  let keepScroll = true;
  switch (act) {
    case 'new': if (!ui.state || ui.state.phase === 'recap') { startSeason(newCode()); return; } ui.modal = 'confirmNew'; break;
    case 'confirmnew': ui.modal = null; startSeason(newCode()); return;
    case 'replay': startSeason(ui.state.seed); return;
    case 'resume': ui.screen = 'game'; keepScroll = false; break;
    case 'home': ui.screen = 'title'; ui.modal = null; if (ui.play && ui.play.timer) clearTimeout(ui.play.timer); ui.play = null; keepScroll = false; break;
    case 'rules': ui.modal = 'rules'; break;
    case 'tools': ui.modal = 'tools'; break;
    case 'close': ui.modal = null; break;
    case 'debug': ui.prefs.debug = !ui.prefs.debug; savePrefs(LS, ui.prefs); break;
    case 'toggle': {
      const d0 = ui.state.draft;
      if (!d0.starters.includes(id) && d0.starters.length >= CONFIG.startersCount) { ui.notice = 'Five are already starting. Bench someone first.'; break; }
      setDraft(d => { if (d.starters.includes(id)) d.starters = d.starters.filter(x => x !== id); else d.starters.push(id); });
      break;
    }
    case 'rest': ui.trainPick = null; setDraft(d => { if (d.prep[id] === 'rest') delete d.prep[id]; else d.prep[id] = 'rest'; }); break;
    case 'train': ui.trainPick = ui.trainPick === id ? null : id; break;
    case 'trainattr': ui.trainPick = null; setDraft(d => { d.prep[id] = 'train:' + b.dataset.attr; }); break;
    case 'clearprep': ui.trainPick = null; setDraft(d => { delete d.prep[id]; }); break;
    case 'tactic': setDraft(d => { d.tactic = b.dataset.t; }); break;
    case 'kickoff': { const d = ui.state.draft; if (dispatch({ type: 'COMMIT', starters: d.starters, prep: d.prep, tactic: d.tactic })) { ui.play = null; keepScroll = false; } break; }
    case 'skip': if (ui.play) { if (ui.play.timer) clearTimeout(ui.play.timer); ui.play.timer = null; ui.play.shown = CONFIG.possessionsPerTeam * 2; } break;
    case 'finish': if (dispatch({ type: 'FINISH_MATCH' })) keepScroll = false; break;
    case 'continue': if (dispatch({ type: 'CONTINUE' })) keepScroll = false; ui.devPick = null; break;
    case 'devpick': ui.devPick = { id, attr: b.dataset.attr }; break;
    case 'develop': if (ui.devPick && dispatch({ type: 'DEVELOP', playerId: ui.devPick.id, attr: ui.devPick.attr })) { ui.devPick = null; keepScroll = false; } break;
    case 'playcode': { const c = (document.getElementById('code').value || '').trim().toUpperCase(); if (!c) return; ui.modal = null; startSeason(c); return; }
    case 'copy': { const t = document.getElementById('savetext'); t.select(); try { navigator.clipboard.writeText(t.value); ui.notice = 'Save text copied.'; } catch (e) { document.execCommand && document.execCommand('copy'); } break; }
    case 'import': {
      const res = importText(document.getElementById('savetext').value);
      if (!res.ok) { ui.notice = res.error; break; }
      ui.state = res.state; persist(); ui.modal = null; ui.screen = 'game'; ui.notice = 'Save imported.'; keepScroll = false; break;
    }
  }
  render();
  window.scrollTo(0, keepScroll ? y : 0);
});

// ---------- boot ----------
(function boot() {
  if (KIT) KIT.studio();
  const { state, problem } = loadSave(LS);
  ui.state = state;
  if (problem) ui.notice = problem;
  render();
  if (KIT) {
    KIT.coach.create('one-more-season-first', [{ target: () => { const k = document.querySelector('[data-act=kickoff]'), r = k && k.getBoundingClientRect(); return r && r.height ? { x: r.left + r.width / 2, y: r.top + r.height / 2, r: Math.max(30, r.height / 2 + 8) } : null; }, done: () => !!ui.state && (ui.state.fixture > 0 || ui.state.phase !== 'prep' || ui.state.results.length > 0 || loadHistory(LS).length > 0) }], { when: () => ui.screen !== 'title' && !!ui.state && ui.state.phase === 'prep' && !ui.modal });
    KIT.wired('motion', 'possession pop and ball slide stop under Calm/Still (the game\'s own reduced-motion CSS now follows the kit Motion setting)');
    KIT.wired('text', 'page CSS scaled (dock button, starter toggles, attribute tiles, top bar and timeline labels capped at 125%; numbers inside the fatigue bar, odds bar and timeline cells fixed at 12-13px)');
  }
})();


})();
</script>
</body>
</html>
