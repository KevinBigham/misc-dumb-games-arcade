// Seeded RNG (mulberry32). State is a single uint32 so it can be saved as a number.
function seedToState(seed) {
  const s = String(seed);
  let h = 1779033703 ^ s.length;
  for (let i = 0; i < s.length; i++) {
    h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  h = Math.imul(h ^ (h >>> 16), 2246822507);
  h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^ (h >>> 16)) >>> 0;
}

// Returns [integer in 0..n-1, nextState]. Pure: never mutates anything.
function rngInt(state, n) {
  const t = (state + 0x6D2B79F5) >>> 0;
  let r = Math.imul(t ^ (t >>> 15), t | 1);
  r ^= r + Math.imul(r ^ (r >>> 7), r | 61);
  const v = ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  return [Math.floor(v * n), t];

// ---- sim.mjs ----
// One More Season — pure match simulator. No DOM, no storage, no Math.random.




const round2 = x => Math.round(x * 100) / 100;

function fatigueMult(p, cfg = CONFIG) {
  return 1 - p.fatigue / cfg.fatigueDivisor;
}

function effective(p, attr, cfg = CONFIG) {
  if (attr === 'stamina') return p.stamina;
  return p[attr] * fatigueMult(p, cfg);
}

// Average effective Attack / Defense / Control across the five starters.
function teamRatings(starters, cfg = CONFIG) {
  const n = starters.length;
  const sum = { attack: 0, defense: 0, control: 0, mult: 0 };
  for (const p of starters) {
    sum.attack += effective(p, 'attack', cfg);
    sum.defense += effective(p, 'defense', cfg);
    sum.control += effective(p, 'control', cfg);
    sum.mult += fatigueMult(p, cfg);
  }
  return { attack: round2(sum.attack / n), defense: round2(sum.defense / n), control: round2(sum.control / n), fatigueFactor: round2(sum.mult / n) };
}

function oppRatings(opp) {
  return { attack: opp.attack, defense: opp.defense, control: opp.control, fatigueFactor: 1 };
}

function tendencyPP(opp, side, yourTactic) {
  const t = opp.tendency;
  return t.side === side && t.tactic === yourTactic ? t.pp : 0;
}

// The single documented modifier formula. Returns every term so it can be logged.
function possessionOdds(off, def, tactic, tendency, cfg = CONFIG) {
  const attackTerm = round2(cfg.kAttack * (off.attack - def.defense));
  const controlTerm = round2(cfg.kControl * (off.control - def.control));
  const raw = round2(attackTerm + controlTerm + tendency);
  const shift = Math.max(-cfg.maxShift, Math.min(cfg.maxShift, Math.round(raw)));
  const b = cfg.base[tactic];
  const dist = [b[0] - shift, b[1], b[2] + shift];
  return { attackTerm, controlTerm, tendency, raw, shift, dist };
}

const expectedPoints = dist => round2((dist[1] * 3 + dist[2] * 7) / 100);

function matchPreview(starters, opp, tactic, cfg = CONFIG) {
  const you = teamRatings(starters, cfg);
  const them = oppRatings(opp);
  const yourOdds = possessionOdds(you, them, tactic, tendencyPP(opp, 'you', tactic), cfg);
  const theirOdds = possessionOdds(them, you, opp.tactic, tendencyPP(opp, 'them', tactic), cfg);
  return {
    you, them, yourOdds, theirOdds,
    evYou: round2(expectedPoints(yourOdds.dist) * cfg.possessionsPerTeam),
    evThem: round2(expectedPoints(theirOdds.dist) * cfg.possessionsPerTeam),

function outcomeFor(dist, roll) {
  if (roll < dist[0]) return 0;
  if (roll < dist[0] + dist[1]) return 3;
  return 7;
}

// Resolve a whole match once. Possessions alternate; each team gets 8.
function simulateMatch({ starters, opp, tactic, rngState, youFirst }, cfg = CONFIG) {
  const pv = matchPreview(starters, opp, tactic, cfg);
  let rng = rngState >>> 0;
  let scoreYou = 0, scoreThem = 0;
  const events = [];
  const total = cfg.possessionsPerTeam * 2;
  for (let i = 0; i < total; i++) {
    const yours = (i % 2 === 0) === !!youFirst;
    const odds = yours ? pv.yourOdds : pv.theirOdds;
    let roll;
    [roll, rng] = rngInt(rng, 100);
    const points = outcomeFor(odds.dist, roll);
    const marginBefore = scoreYou - scoreThem;
    if (yours) scoreYou += points; else scoreThem += points;
    events.push({
      i, n: i + 1, team: yours ? 'you' : 'them',
      tactic: yours ? tactic : opp.tactic,
      off: yours ? pv.you : pv.them,
      def: yours ? pv.them : pv.you,
      attackTerm: odds.attackTerm, controlTerm: odds.controlTerm, tendency: odds.tendency,
      raw: odds.raw, shift: odds.shift, dist: odds.dist.slice(),
      fatigueFactor: pv.you.fatigueFactor,
      roll, points, marginBefore, scoreYou, scoreThem,
    });

  const outcome = scoreYou > scoreThem ? 'W' : scoreYou < scoreThem ? 'L' : 'D';

function eventSwing(e, cfg = CONFIG) {
  let s = Math.abs(e.points - expectedPoints(e.dist));
  if (e.i >= cfg.lateFrom && Math.abs(e.marginBefore) <= cfg.lateMargin) s += cfg.lateBonus;
  return round2(s);
}

// Three decisive events: biggest swing vs expectation, ties go to the later possession.
function pickDecisive(events, cfg = CONFIG) {
  return events
    .map(e => ({ i: e.i, s: eventSwing(e, cfg) }))
    .sort((a, b) => b.s - a.s || b.i - a.i)
    .slice(0, 3)
    .map(x => x.i)
    .sort((a, b) => a - b);

function eventFlags(e, cfg = CONFIG) {
  return {
    team: e.team, points: e.points, tactic: e.tactic,
    tendency: e.tendency !== 0,
    late: e.i >= cfg.lateFrom && Math.abs(e.marginBefore) <= cfg.lateMargin,
    tired: e.team === 'you' ? e.fatigueFactor < cfg.tiredBelow : false,

function templateFor(e, cfg = CONFIG) {
  const f = eventFlags(e, cfg);
  return TEMPLATES.find(t => Object.entries(t.when).every(([k, v]) => f[k] === v));
}

function renderEvent(e, ctx, cfg = CONFIG) {
  const t = templateFor(e, cfg);
  const yourTactic = ctx.tactic;
  const vals = {
    n: e.n,
    tactic: TACTICS[e.team === 'you' ? e.tactic : yourTactic].name.toLowerCase(),
    club: CLUB.short,
    opp: ctx.oppName,
    chance0: e.dist[0], chance3: e.dist[1], chance7: e.dist[2],
    roll: e.roll,
    score: `${CLUB.short} ${e.scoreYou}, ${ctx.oppShort} ${e.scoreThem}`,
    fatiguePct: Math.round(e.fatigueFactor * 100),

// One More Season — season state machine. Every change goes through reduce().
// reduce() is pure: it returns a brand-new state or an error, never mutates.





const PHASES = ['prep', 'match', 'review', 'develop', 'recap'];
// Legal transitions, by command.
const TRANSITIONS = {
  SET_DRAFT: { prep: 'prep' },
  COMMIT: { prep: 'match' },
  FINISH_MATCH: { match: 'review' },
  CONTINUE: { review: 'develop|recap' },

const clone = x => JSON.parse(JSON.stringify(x));
const clampF = (f, cfg) => Math.max(0, Math.min(cfg.fatigueMax, f));

function defaultDraft(roster, prevStarters) {
  const starters = prevStarters && prevStarters.length === CONFIG.startersCount
    ? prevStarters.slice()
    : ['reyke', 'marrow', 'abara', 'hollis', 'ostrova'];
  return { starters, prep: {}, tactic: 'balanced' };

function newSeason(seed, id, cfg = CONFIG) {
  const roster = clone(ROSTER);
  return {
    version: cfg.saveVersion,
    id: String(id || seed),
    seed: String(seed),
    rng: seedToState(seed),
    phase: 'prep',
    fixture: 0,
    roster,
    draft: defaultDraft(roster),
    results: [],
    historyRecorded: false,

}

function currentOpponent(state) {
  return OPPONENTS[state.fixture];
}

// Checks a lineup/prep/tactic decision. Returns a list of problems (empty = legal).
function checkDecision(state, d, cfg = CONFIG) {
  const errs = [];
  const ids = new Set(state.roster.map(p => p.id));
  const st = d.starters || [];
  if (st.length !== cfg.startersCount) errs.push(`Pick exactly ${cfg.startersCount} starters.`);
  if (new Set(st).size !== st.length) errs.push('A player is listed twice.');
  for (const id of st) if (!ids.has(id)) errs.push('Unknown player ' + id);
  if (!TACTICS[d.tactic]) errs.push('Pick a plan.');
  const prep = d.prep || {};
  const entries = Object.entries(prep);
  if (entries.length > cfg.prepPoints) errs.push(`Only ${cfg.prepPoints} prep points.`);
  for (const [id, act] of entries) {
    const p = state.roster.find(x => x.id === id);
    if (!p) { errs.push('Unknown player ' + id); continue; }
    if (act === 'rest') continue;
    const m = /^train:(\w+)$/.exec(act);
    if (!m || !ATTRS.includes(m[1])) { errs.push('Bad prep action for ' + p.name); continue; }
    if (p[m[1]] >= cfg.attrMax) errs.push(`${p.name} is already at ${cfg.attrMax} ${m[1]}.`);
  }

}

function applyPrep(roster, prep, cfg = CONFIG) {
  const out = clone(roster);
  for (const [id, act] of Object.entries(prep)) {
    const p = out.find(x => x.id === id);
    if (act === 'rest') p.fatigue = clampF(p.fatigue - cfg.restAmount, cfg);
    else {
      const attr = act.split(':')[1];
      p[attr] = Math.min(cfg.attrMax, p[attr] + 1);
      p.fatigue = clampF(p.fatigue + cfg.trainFatigue, cfg);
    }
  }
  return out;
}

function fatigueAfterMatch(roster, starters, cfg = CONFIG) {
  return roster.map(p => {
    const before = p.fatigue;
    const delta = starters.includes(p.id) ? cfg.starterFatigueBase - p.stamina : -cfg.reserveRecovery;
    return { id: p.id, before, after: clampF(before + delta, cfg) };

}

function reduce(state, cmd, cfg = CONFIG) {

      return { ok: true, state: s };

      const rosterBefore = clone(s.roster);
      s.roster = applyPrep(s.roster, d.prep, cfg);

      const youFirst = s.fixture % 2 === 0;
      // 2. the match is resolved exactly once; result + RNG are stored before playback
      const m = simulateMatch({ starters, opp, tactic: d.tactic, rngState: s.rng, youFirst }, cfg);
      s.results.push({
        fixture: s.fixture, oppId: opp.id, starters: d.starters.slice(), prep: clone(d.prep), tactic: d.tactic,
        youFirst, rosterBefore, rosterAtKickoff: clone(s.roster),
        events: m.events, scoreYou: m.scoreYou, scoreThem: m.scoreThem, outcome: m.outcome,
        decisive: m.decisive, preview: m.preview, rngBefore: s.rng, rngAfter: m.rngAfter,
        fatigueApplied: false, fatigueChanges: null, devApplied: false, dev: null,
      });
      s.rng = m.rngAfter;
      s.phase = 'match';
      return { ok: true, state: s };
    }
    case 'FINISH_MATCH': {
      const r = s.results[s.fixture];
      if (r.fatigueApplied) return { ok: false, error: 'Fatigue already applied', state };
      const ch = fatigueAfterMatch(s.roster, r.starters, cfg);
      for (const c of ch) s.roster.find(p => p.id === c.id).fatigue = c.after;
      r.fatigueChanges = ch;
      r.fatigueApplied = true;
      s.phase = 'review';
      return { ok: true, state: s };
    }
    case 'CONTINUE': {
      s.phase = s.fixture < cfg.fixtures - 1 ? 'develop' : 'recap';
      return { ok: true, state: s };
    }
    case 'DEVELOP': {
      const r = s.results[s.fixture];
      if (r.devApplied) return { ok: false, error: 'Development already chosen', state };
      const p = s.roster.find(x => x.id === cmd.playerId);
      if (!p) return { ok: false, error: 'Pick a player', state };
      if (!ATTRS.includes(cmd.attr)) return { ok: false, error: 'Pick an attribute', state };
      if (p[cmd.attr] >= cfg.attrMax) return { ok: false, error: `${p.name} is already at ${cfg.attrMax}`, state };
      p[cmd.attr] += 1;
      r.devApplied = true;
      r.dev = { playerId: p.id, attr: cmd.attr, to: p[cmd.attr] };
      s.fixture += 1;
      s.phase = 'prep';
      s.draft = defaultDraft(s.roster, r.starters);
      s.draft.tactic = r.tactic;
      return { ok: true, state: s };
    }
    case 'MARK_HISTORY': {
      if (s.historyRecorded) return { ok: false, error: 'Already recorded', state };
      s.historyRecorded = true;
      return { ok: true, state: s };
    }
  }
  return { ok: false, error: 'unreachable', state };
}

// Structural validation for loaded saves. Returns problems (empty = valid).
function validateState(s, cfg = CONFIG) {
  const e = [];
  if (!s || typeof s !== 'object') return ['not an object'];
  if (s.version !== cfg.saveVersion) e.push('version ' + s.version);
  if (!PHASES.includes(s.phase)) e.push('phase ' + s.phase);
  if (!Number.isInteger(s.fixture) || s.fixture < 0 || s.fixture >= cfg.fixtures) e.push('fixture');
  if (!Number.isInteger(s.rng) || s.rng < 0) e.push('rng');
  if (!Array.isArray(s.roster) || s.roster.length !== ROSTER.length) e.push('roster');
  else for (const p of s.roster) {
    for (const a of ATTRS) if (!Number.isInteger(p[a]) || p[a] < cfg.attrMin || p[a] > cfg.attrMax) e.push(p.id + '.' + a);
    if (typeof p.fatigue !== 'number' || p.fatigue < 0 || p.fatigue > cfg.fatigueMax) e.push(p.id + '.fatigue');
  }
  if (!Array.isArray(s.results)) return e.concat('results');
  const need = s.phase === 'prep' ? s.fixture : s.fixture + 1;
  if (s.results.length !== need) e.push(`results length ${s.results.length} != ${need}`);
  const r = s.results[s.fixture];
  if (s.phase === 'match' && r && r.fatigueApplied) e.push('match phase but fatigue applied');
  if ((s.phase === 'review' || s.phase === 'develop' || s.phase === 'recap') && r && !r.fatigueApplied) e.push('fatigue missing');
  if (s.phase === 'develop' && r && r.devApplied) e.push('develop phase but dev applied');
  if (s.phase === 'recap' && s.fixture !== cfg.fixtures - 1) e.push('recap before last fixture');
  for (const x of s.results) if (!Array.isArray(x.events) || x.events.length !== cfg.possessionsPerTeam * 2) e.push('events');
  if (s.phase === 'prep' && (!s.draft || !Array.isArray(s.draft.starters))) e.push('draft');
  return e;
}

function record(state) {
  const w = state.results.filter(r => r.outcome === 'W').length;
  const d = state.results.filter(r => r.outcome === 'D').length;
  const l = state.results.filter(r => r.outcome === 'L').length;
  return { w, d, l };
}

// Season recap built only from recorded results.
function seasonRecap(state, cfg = CONFIG) {
  const rec = record(state);
  const success = rec.w >= cfg.winTarget;
  const pf = state.results.reduce((a, r) => a + r.scoreYou, 0);
  const pa = state.results.reduce((a, r) => a + r.scoreThem, 0);
  const starts = {};
  for (const r of state.results) for (const id of r.starters) starts[id] = (starts[id] || 0) + 1;
  const lines = state.results.map(r => {
    const opp = OPPONENTS[r.fixture];
    const big = r.decisive.map(i => r.events[i]).sort((a, b) => Math.abs(b.points - 3) - Math.abs(a.points - 3))[0];
    return {
      fixture: r.fixture + 1, opp: opp.name, outcome: r.outcome, score: `${r.scoreYou}-${r.scoreThem}`,
      tactic: TACTICS[r.tactic].name,
      key: big ? renderEvent(big, { tactic: r.tactic, oppName: opp.name, oppShort: opp.name.split(' ')[0] }, cfg).text : '',
    };
  });
  const losses = state.results.filter(r => r.outcome !== 'W').map(r => ({ r, m: r.scoreThem - r.scoreYou })).sort((a, b) => a.m - b.m);
  const closest = losses[0] ? { fixture: losses[0].r.fixture + 1, opp: OPPONENTS[losses[0].r.fixture].name, margin: losses[0].m, outcome: losses[0].r.outcome, tactic: TACTICS[losses[0].r.tactic].name, fatiguePct: Math.round(losses[0].r.preview.you.fatigueFactor * 100) } : null;
  let peak = null;
  for (const r of state.results) for (const id of r.starters) {
    const p = r.rosterAtKickoff.find(x => x.id === id);
    if (!peak || p.fatigue > peak.fatigue) peak = { name: p.name, fatigue: p.fatigue, fixture: r.fixture + 1 };
  }
  return { rec, success, pf, pa, starts, lines, closest, peak };
}

// ---- storage.mjs ----
// One More Season — persistence. Works with any Storage-like object (localStorage or a test fake).


const KEYS = {
  save: 'oneMoreSeason.save.v1',
  prev: 'oneMoreSeason.prev.v1', // last good save before the newest write (recovery path)
  backup: 'oneMoreSeason.backup', // any unreadable save is parked here, never deleted
  history: 'oneMoreSeason.history.v1',
  prefs: 'oneMoreSeason.prefs.v1',
};

function get(st, k) { try { return st ? st.getItem(k) : null; } catch (e) { return null; } }
function set(st, k, v) { try { st.setItem(k, v); return true; } catch (e) { return false; } }

function loadSave(st) {
  const raw = get(st, KEYS.save);
  if (raw == null) return { state: null, problem: null };
  let parsed = null, problems;
  try { parsed = JSON.parse(raw); problems = validateState(parsed); } catch (e) { problems = ['unreadable JSON']; }
  if (!problems.length) return { state: parsed, problem: null };
  set(st, KEYS.backup, raw); // keep the player's data; the main slot is only overwritten by a later save
  const prevRaw = get(st, KEYS.prev);
  if (prevRaw) {
    try {
      const prev = JSON.parse(prevRaw);
      if (!validateState(prev).length) return { state: prev, problem: 'Your latest save was damaged, so the previous good save was restored. The damaged copy is kept as a backup.' };
    } catch (e) { /* fall through */ }
  }
  return { state: null, problem: 'Your save could not be read (' + problems.slice(0, 2).join(', ') + '). It was kept as a backup; export it from the menu if you need it.' };
}

// Persist the already-resolved state. Returns false if storage is unavailable.
function writeSave(st, state) {
  const cur = get(st, KEYS.save);
  if (cur != null) {
    try { if (!validateState(JSON.parse(cur)).length) set(st, KEYS.prev, cur); } catch (e) { /* keep old prev */ }
  }
  return set(st, KEYS.save, JSON.stringify(state));
}

function exportText(st) { return get(st, KEYS.save) || get(st, KEYS.backup) || ''; }

function importText(text) {
  let s;
  try { s = JSON.parse(text); } catch (e) { return { ok: false, error: 'That is not save text.' }; }
  const p = validateState(s);
  return p.length ? { ok: false, error: 'Save failed checks: ' + p.slice(0, 3).join(', ') } : { ok: true, state: s };
}

function loadHistory(st) {
  try { const h = JSON.parse(get(st, KEYS.history) || '[]'); return Array.isArray(h) ? h : []; } catch (e) { return []; }
}

function addHistory(st, entry) {
  const h = loadHistory(st);
  if (h.some(x => x.id === entry.id)) return h;
  h.push(entry);
  set(st, KEYS.history, JSON.stringify(h.slice(-50)));
  return h;
}

function loadPrefs(st) { try { return JSON.parse(get(st, KEYS.prefs) || '{}') || {}; } catch (e) { return {}; } }
function savePrefs(st, p) { set(st, KEYS.prefs, JSON.stringify(p)); }

try { LS = window.localStorage; LS.getItem('oms-probe'); } catch (e) { LS = null; }

const ui = {
  state: null, screen: 'title', notice: '', saveOff: !LS,
  prefs: loadPrefs(LS), trainPick: null, play: null, devPick: null, modal: null,
};

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const f1 = x => (Math.round(x * 10) / 10).toFixed(1);
const oppShort = o => o.name.split(' ')[0];
const debugOn = () => !!ui.prefs.debug;
const player = id => ui.state.roster.find(p => p.id === id);

function newCode() {
  const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  const buf = new Uint32Array(6);
  try { crypto.getRandomValues(buf); } catch (e) { for (let i = 0; i < 6; i++) buf[i] = Math.floor(Math.random() * 1e9); }
  for (let i = 0; i < 6; i++) s += a[buf[i] % a.length];
  return s;
}

function persist() {
  if (!LS) { ui.saveOff = true; return; }
  ui.saveOff = !writeSave(LS, ui.state);
}

function dispatch(cmd) {
  const res = reduce(ui.state, cmd);
  if (!res.ok) { ui.notice = res.error; render(); return false; }
  ui.state = res.state; // resolve first...
  persist(); // ...then persist the resolved state, then present it
  ui.notice = '';
  return true;
}

function startSeason(code) {
  ui.state = newSeason(code, code + '@' + Date.now());
  ui.screen = 'game'; ui.play = null; ui.trainPick = null; ui.devPick = null;
  persist();
  render(); window.scrollTo(0, 0);
}

  const notes = [];
  const d = s.draft;
  if (s.fixture === 0) {
    const t = player('reyke');
    notes.push(`<b>${esc(t.name)}</b> is your best attacker (ATK ${t.attack}) but tired: fatigue ${t.fatigue} means every stat plays at ${Math.round(fatigueMult(t) * 100)}%. Rest the striker (fatigue -24), or bench for fresh <b>${esc(player('danner').name)}</b>.`);
    notes.push(`Scouts say ${esc(opp.name)} leave space behind. Your <b>${TACTICS[opp.tendency.tactic].name}</b> plan gets ${opp.tendency.pp > 0 ? '+' : ''}${opp.tendency.pp} toward 7s in this fixture.`);
  }
  for (const id of d.starters) {
    const p = player(id);
    const after = d.prep[id] === 'rest' ? Math.max(0, p.fatigue - CONFIG.restAmount) : p.fatigue + (d.prep[id] && d.prep[id] !== 'rest' ? CONFIG.trainFatigue : 0);
    if (s.fixture > 0 && after >= CONFIG.tiredWarn) notes.push(`<b>${esc(p.name)}</b> would start at fatigue ${Math.round(after)} (${Math.round((1 - after / 200) * 100)}% strength) and gain ${CONFIG.starterFatigueBase - p.stamina} more.`);

  const left = CONFIG.prepPoints - Object.keys(d.prep).length;
  if (left > 0 && s.fixture > 0) notes.push(`${left} prep point${left > 1 ? 's' : ''} unused. They do not carry over.`);
  if (s.fixture === CONFIG.fixtures - 1) notes.push('Last fixture: nothing to save legs for.');

        <button class="mini ${act === 'rest' ? 'sel' : ''}" data-act="rest" data-id="${p.id}" ${canPrep || act === 'rest' ? '' : 'disabled'}>Rest -${CONFIG.restAmount}</button>
        <button class="mini ${act && act !== 'rest' ? 'sel' : ''}" data-act="train" data-id="${p.id}" ${canPrep ? '' : 'disabled'}>${act && act !== 'rest' ? 'Train ' + ATTR_SHORT[act.split(':')[1]] + ' +1' : 'Train +1'}</button>
        ${act ? `<button class="mini ghost" data-act="clearprep" data-id="${p.id}">Undo</button>` : ''}
      </div>
      ${picking ? `<div class="pick">Train which? (+${CONFIG.trainFatigue} fatigue) ${ATTRS.map(a => `<button class="mini" data-act="trainattr" data-id="${p.id}" data-attr="${a}" ${p0[a] >= CONFIG.attrMax ? 'disabled' : ''}>${ATTR_SHORT[a]} ${p0[a]}&rarr;${Math.min(10, p0[a] + 1)}</button>`).join('')}</div>` : ''}
    </li>`;
  }).join('');

  const plans = TACTIC_ORDER.map(k => {
    const sel = d.tactic === k;
    let body = `<div class="fine">Base ${CONFIG.base[k].join(' / ')}</div>`;
    if (full) {
      const p2 = matchPreview(startersNow, opp, k);
      const tag = p2.yourOdds.tendency ? `<span class="pill ${p2.yourOdds.tendency > 0 ? 'good' : 'bad'}">scouted ${p2.yourOdds.tendency > 0 ? '+' : ''}${p2.yourOdds.tendency}</span>` : (p2.theirOdds.tendency ? `<span class="pill bad">opens you up +${p2.theirOdds.tendency}</span>` : '');
      body = `${distBar(p2.yourOdds.dist, TACTICS[k].name + ' your attack')}${tag}`;
      if (debugOn()) body += `<div class="math">shift ${p2.yourOdds.shift} (atk ${p2.yourOdds.attackTerm}, ctl ${p2.yourOdds.controlTerm}, tend ${p2.yourOdds.tendency}) &middot; your EV ${p2.evYou} vs their EV ${p2.evThem}</div>`;
    }
    return `<button class="plan ${sel ? 'sel' : ''}" data-act="tactic" data-t="${k}" aria-pressed="${sel}"><b>${TACTICS[k].name}</b><span>${esc(TACTICS[k].blurb)}</span>${body}</button>`;
  }).join('');

  const errs = checkDecision(s, d);
  const theirs = pv ? `<section class="card"><h3>Their attack vs your defense</h3>${distBar(pv.theirOdds.dist, 'their attack')}${distKey}
    ${debugOn() ? `<div class="math">${esc(oppShort(opp))} ${TACTICS[opp.tactic].name} &middot; ATK ${f1(pv.them.attack)} vs your DEF ${f1(pv.you.defense)} &rarr; ${pv.theirOdds.attackTerm} &middot; CTL ${pv.theirOdds.controlTerm} &middot; tend ${pv.theirOdds.tendency} &rarr; shift ${pv.theirOdds.shift}</div>` : ''}</section>` : '';

  app.innerHTML = `${topBar()}<main class="prepview">
    ${scouting}
    ${coachNotes(s, opp, pv)}
    <section class="card"><h3>Squad <span class="count">${d.starters.length}/${CONFIG.startersCount} starting &middot; ${left} prep point${left === 1 ? '' : 's'} left</span></h3>
      <ul class="squad">${rows}</ul></section>
    <section class="card"><h3>Your plan <span class="count">chance per possession</span></h3><div class="plans">${plans}</div>${full ? distKey : '<p class="fine">Pick 5 starters to see your odds.</p>'}</section>
    ${theirs}
    ${debugOn() ? `<p class="math">Season code ${esc(s.seed)} &middot; rng ${s.rng} &middot; ${s.fixture % 2 === 0 ? 'you' : 'they'} attack first</p>` : ''}
    <div class="spacer"></div>
  </main>
  <footer class="dock"><button class="big" data-act="kickoff" ${errs.length ? 'disabled' : ''}>${errs.length ? esc(errs[0]) : 'Kick off vs ' + esc(oppShort(opp))}</button></footer>`;
}

// ---------- match playback ----------
function renderMatch() {
  const s = ui.state, r = s.results[s.fixture], opp = OPPONENTS[r.fixture];
  if (!ui.play || ui.play.fixture !== r.fixture) ui.play = { fixture: r.fixture, shown: 0 };
  const shown = ui.play.shown;
  const evs = r.events.slice(0, shown);
  const last = evs[evs.length - 1];
  const sy = last ? last.scoreYou : 0, st = last ? last.scoreThem : 0;
  const ctx = { tactic: r.tactic, oppName: opp.name, oppShort: oppShort(opp) };
  const cells = team => r.events.filter(e => e.team === team).map(e => e.i < shown ? `<span class="cell p${e.points} ${e.i === shown - 1 ? 'new' : ''}">${e.points}</span>` : '<span class="cell"></span>').join('');
  const ballX = last ? (last.team === 'you' ? (last.points === 7 ? 94 : last.points === 3 ? 78 : 62) : (last.points === 7 ? 6 : last.points === 3 ? 22 : 38)) : 50;
  const done = shown >= r.events.length;
  app.innerHTML = `${topBar()}<main class="matchview">
    <section class="score card" style="--o1:${opp.colors[0]}">
      <div class="side">${crest(34)}<b>${esc(CLUB.short)}</b><span class="num">${sy}</span></div>
      <div class="clock">${done ? 'Full time' : shown ? 'Possession ' + shown + '/16' : 'Kick off'}</div>
      <div class="side them"><span class="badge-o"></span><b>${esc(oppShort(opp))}</b><span class="num">${st}</span></div>
    </section>
    <svg class="field" viewBox="0 0 100 34" preserveAspectRatio="none" aria-hidden="true">
      <rect x="0" y="0" width="100" height="34" rx="2" fill="var(--grass)"/>
      <line x1="50" y1="0" x2="50" y2="34" stroke="var(--line)" stroke-width=".6"/>
      <circle cx="50" cy="17" r="6" fill="none" stroke="var(--line)" stroke-width=".6"/>
      <rect x="0" y="9" width="7" height="16" fill="none" stroke="var(--line)" stroke-width=".6"/>
      <rect x="93" y="9" width="7" height="16" fill="none" stroke="var(--line)" stroke-width=".6"/>
      <circle class="ball" cx="${ballX}" cy="17" r="2.4" fill="var(--paper)" stroke="var(--ink)" stroke-width=".5"/>
    </svg>
    <section class="card tl">
      <div class="tlrow"><span class="lab">${esc(CLUB.short)}</span>${cells('you')}</div>
      <div class="tlrow"><span class="lab">${esc(oppShort(opp))}</span>${cells('them')}</div>
      <p class="call" aria-live="polite">${last ? esc(renderEvent(last, ctx).text) : `${esc(CLUB.short)} line up ${TACTICS[r.tactic].name}. ${esc(opp.name)} go ${TACTICS[opp.tactic].name}.`}</p>
      ${debugOn() && last ? mathLine(last) : ''}
    </section>
    <div class="spacer"></div>
  </main>
  <footer class="dock">${done ? '<button class="big" data-act="finish">Full time: see what decided it</button>' : '<button class="secondary" data-act="skip">Skip to full time</button>'}</footer>`;
  if (!done && !ui.play.timer) {
    ui.play.timer = setTimeout(() => { if (ui.play) { ui.play.timer = null; ui.play.shown++; render(); } }, shown === 0 ? 500 : CONFIG.playbackMs);
  }
}

// ---------- review ----------
function renderReview() {
  const s = ui.state, r = s.results[s.fixture], opp = OPPONENTS[r.fixture];
  const ctx = { tactic: r.tactic, oppName: opp.name, oppShort: oppShort(opp) };
  const word = { W: 'Win', D: 'Draw', L: 'Loss' }[r.outcome];
  const dec = r.decisive.map(i => {
    const e = r.events[i];
    const rt = renderEvent(e, ctx);
    return `<li class="ev ${e.team}"><p>${esc(rt.text)}</p><small>Logged: possession ${e.n}, ${e.team === 'you' ? 'your' : 'their'} ${TACTICS[e.tactic].name} attack, odds ${e.dist.join('/')}, roll ${e.roll}${e.tendency ? `, tendency ${e.tendency > 0 ? '+' : ''}${e.tendency}` : ''}, your strength ${Math.round(e.fatigueFactor * 100)}%.</small>${debugOn() ? mathLine(e) : ''}</li>`;
  }).join('');
  const fat = r.fatigueChanges.filter(c => Math.abs(c.after - c.before) > 0).map(c => {
    const p = player(c.id);
    return `<li><b>${esc(p.name)}</b> ${Math.round(c.before)} &rarr; <span class="${c.after >= 60 ? 'hotT' : ''}">${Math.round(c.after)}</span></li>`;
  }).join('');
  const prep = Object.entries(r.prep).map(([id, a]) => `${esc(player(id).name)}: ${a === 'rest' ? 'rested' : 'trained ' + ATTR_LABEL[a.split(':')[1]]}`).join(' &middot; ') || 'none';
  app.innerHTML = `${topBar()}<main>
    <section class="card result ${r.outcome}"><h2>${word} ${r.scoreYou}-${r.scoreThem}</h2><p>vs ${esc(opp.name)} &middot; you played ${TACTICS[r.tactic].name}</p></section>
    <section class="card"><h3>Three moments that decided it</h3><ol class="evs">${dec}</ol></section>
    <section class="card"><h3>Fatigue after the match</h3><ul class="fatl">${fat}</ul><p class="fine">Prep used: ${prep}</p></section>
    ${debugOn() ? `<section class="card"><h3>All 16 possessions</h3>${r.events.map(mathLine).join('')}<p class="math">rng before ${r.rngBefore}, after ${r.rngAfter}</p></section>` : ''}
    <div class="spacer"></div></main>
  <footer class="dock"><button class="big" data-act="continue">${s.fixture < CONFIG.fixtures - 1 ? 'Training ground' : 'Season recap'}</button></footer>`;
}

// ---------- development ----------
function renderDevelop() {
  const s = ui.state, nextOpp = OPPONENTS[s.fixture + 1];
  const pick = ui.devPick;
  const rows = s.roster.map(p => `<li class="dv"><div class="who"><b>${esc(p.name)}</b><small>${esc(p.role)} &middot; fatigue ${Math.round(p.fatigue)}</small></div>
    <div class="dvb">${ATTRS.map(a => `<button class="mini ${pick && pick.id === p.id && pick.attr === a ? 'sel' : ''}" data-act="devpick" data-id="${p.id}" data-attr="${a}" ${p[a] >= CONFIG.attrMax ? 'disabled' : ''}>${ATTR_SHORT[a]} ${p[a]}</button>`).join('')}</div></li>`).join('');
  app.innerHTML = `${topBar()}<main>
    <section class="card"><h2>Training ground</h2><p>Pick one player and one attribute for a free +1. No fatigue cost. Next up: <b>${esc(nextOpp.name)}</b> (${esc(nextOpp.tendency.text)})</p></section>
    <section class="card"><ul class="devl">${rows}</ul></section>
    <div class="spacer"></div></main>
  <footer class="dock"><button class="big" data-act="develop" ${pick ? '' : 'disabled'}>${pick ? `Confirm: ${esc(player(pick.id).name)} ${ATTR_SHORT[pick.attr]} +1` : 'Pick a player and attribute'}</button></footer>`;
}

// ---------- recap ----------
function renderRecap() {
  const s = ui.state;
  const R = seasonRecap(s);
  if (!s.historyRecorded) {
    addHistory(LS, { id: s.id, seed: s.seed, w: R.rec.w, d: R.rec.d, l: R.rec.l, success: R.success });
    dispatch({ type: 'MARK_HISTORY' });
  }
  const starts = Object.entries(R.starts).sort((a, b) => b[1] - a[1]).map(([id, n]) => `${esc(player(id).name.split(' ')[0])} ${n}`).join(' &middot; ');
  const benched = s.roster.filter(p => !R.starts[p.id]).map(p => esc(p.name)).join(', ');
  app.innerHTML = `<main class="recap">
    <section class="card result ${R.success ? 'W' : 'L'}">${crest(56)}<h2>${R.success ? 'The board keeps you.' : 'The board has seen enough.'}</h2>
      <p class="big-rec">${R.rec.w}W ${R.rec.d}D ${R.rec.l}L</p><p>Scored ${R.pf}, conceded ${R.pa} &middot; target ${CONFIG.winTarget} wins</p></section>
    <section class="card"><h3>The season</h3><ol class="lines">${R.lines.map(l => `<li><span class="o ${l.outcome}">${l.outcome}</span><div><b>${l.score} vs ${esc(l.opp)}</b> <small>${l.tactic}</small><p>${esc(l.key)}</p></div></li>`).join('')}</ol></section>
    <section class="card"><h3>From the log</h3>
      ${R.closest ? `<p>Closest result you did not win: fixture ${R.closest.fixture} vs ${esc(R.closest.opp)}, ${R.closest.outcome === 'D' ? 'a draw' : 'lost by ' + R.closest.margin}, playing ${R.closest.tactic} at ${R.closest.fatiguePct}% strength.</p>` : '<p>You won every fixture.</p>'}
      ${R.peak ? `<p>Most tired starter: ${esc(R.peak.name)} kicked off fixture ${R.peak.fixture} at fatigue ${Math.round(R.peak.fatigue)}.</p>` : ''}
      <p>Starts: ${starts}${benched ? `. Never started: ${benched}` : ''}.</p>
      <p class="q"><b>One decision you would change?</b> Replay this exact season code and try it. Same code + same choices gives the same results, so only your change differs.</p>
    </section>
    <div class="stack"><button class="big" data-act="new">One more season</button><button class="secondary" data-act="replay">Replay season code ${esc(s.seed)}</button><button class="secondary" data-act="home">Title screen</button></div>
  </main>`;
}

// ---------- router ----------
function render() {
  if (ui.screen === 'title' || !ui.state) return renderTitle();
  const ph = ui.state.phase;
  if (ph !== 'match' && ui.play && ui.play.timer) { clearTimeout(ui.play.timer); ui.play = null; }
  if (ph === 'prep') renderPrep();
  else if (ph === 'match') renderMatch();
  else if (ph === 'review') renderReview();
  else if (ph === 'develop') renderDevelop();
  else renderRecap();
  if (ui.modal) app.insertAdjacentHTML('beforeend', renderModal());
}

function setDraft(mut) {
  const d = JSON.parse(JSON.stringify(ui.state.draft));
  mut(d);
  dispatch({ type: 'SET_DRAFT', draft: d });
}

app.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act, id = b.dataset.id;
  const y = window.scrollY;
  let keepScroll = true;
  switch (act) {
    case 'new': if (!ui.state || ui.state.phase === 'recap') { startSeason(newCode()); return; } ui.modal = 'confirmNew'; break;
    case 'confirmnew': ui.modal = null; startSeason(newCode()); return;
    case 'replay': startSeason(ui.state.seed); return;
    case 'resume': ui.screen = 'game'; keepScroll = false; break;
    case 'home': ui.screen = 'title'; ui.modal = null; if (ui.play && ui.play.timer) clearTimeout(ui.play.timer); ui.play = null; keepScroll = false; break;
    case 'rules': ui.modal = 'rules'; break;
    case 'tools': ui.modal = 'tools'; break;
    case 'close': ui.modal = null; break;
    case 'debug': ui.prefs.debug = !ui.prefs.debug; savePrefs(LS, ui.prefs); break;
    case 'toggle': {
      const d0 = ui.state.draft;
      if (!d0.starters.includes(id) && d0.starters.length >= CONFIG.startersCount) { ui.notice = 'Five are already starting. Bench someone first.'; break; }
      setDraft(d => { if (d.starters.includes(id)) d.starters = d.starters.filter(x => x !== id); else d.starters.push(id); });
      break;
    }
    case 'rest': ui.trainPick = null; setDraft(d => { if (d.prep[id] === 'rest') delete d.prep[id]; else d.prep[id] = 'rest'; }); break;
    case 'train': ui.trainPick = ui.trainPick === id ? null : id; break;
    case 'trainattr': ui.trainPick = null; setDraft(d => { d.prep[id] = 'train:' + b.dataset.attr; }); break;
    case 'clearprep': ui.trainPick = null; setDraft(d => { delete d.prep[id]; }); break;
    case 'tactic': setDraft(d => { d.tactic = b.dataset.t; }); break;
    case 'kickoff': { const d = ui.state.draft; if (dispatch({ type: 'COMMIT', starters: d.starters, prep: d.prep, tactic: d.tactic })) { ui.play = null; keepScroll = false; } break; }
    case 'skip': if (ui.play) { if (ui.play.timer) clearTimeout(ui.play.timer); ui.play.timer = null; ui.play.shown = CONFIG.possessionsPerTeam * 2; } break;
    case 'finish': if (dispatch({ type: 'FINISH_MATCH' })) keepScroll = false; break;
    case 'continue': if (dispatch({ type: 'CONTINUE' })) keepScroll = false; ui.devPick = null; break;
    case 'devpick': ui.devPick = { id, attr: b.dataset.attr }; break;
    case 'develop': if (ui.devPick && dispatch({ type: 'DEVELOP', playerId: ui.devPick.id, attr: ui.devPick.attr })) { ui.devPick = null; keepScroll = false; } break;
    case 'playcode': { const c = (document.getElementById('code').value || '').trim().toUpperCase(); if (!c) return; ui.modal = null; startSeason(c); return; }
    case 'copy': { const t = document.getElementById('savetext'); t.select(); try { navigator.clipboard.writeText(t.value); ui.notice = 'Save text copied.'; } catch (e) { document.execCommand && document.execCommand('copy'); } break; }
    case 'import': {
      const res = importText(document.getElementById('savetext').value);
      if (!res.ok) { ui.notice = res.error; break; }
      ui.state = res.state; persist(); ui.modal = null; ui.screen = 'game'; ui.notice = 'Save imported.'; keepScroll = false; break;
    }
  }
  render();
  window.scrollTo(0, keepScroll ? y : 0);
});

// ---------- boot ----------
(function boot() {
  const { state, problem } = loadSave(LS);
  ui.state = state;
  if (problem) ui.notice = problem;
  render();
})();


})();
</script>
