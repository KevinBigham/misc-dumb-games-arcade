<title>Songmill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one-screen phone app. Header (order + meters) / board canvas / hint / tool rail. Single committed look: a night mill by a pine pond. */
:root{
  color-scheme: dark;
  --night:#0e1b1a;      /* page ground */
  --board:#122624;      /* board ground */
  --panel:#19332f;      /* buttons, header */
  --panel-hi:#244741;   /* selected / hover */
  --line:#2e5650;       /* hairlines */
  --ink:#efe6d2;        /* text */
  --dim:#94aca4;        /* secondary text */
  --brass:#e3b45c;      /* the one accent */
  --brass-dim:#8a6a33;
  --good:#6fdc9a;
  --warn:#ff8a6b;
  --display:"Caprasimo", "Cooper Black", Georgia, serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{-webkit-touch-callout:none;height:100%;margin:0;background:var(--night);color:var(--ink);font:calc(14px * var(--gk-text-scale,1))/1.3 var(--body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#top{padding-block:8px 4px;display:flex;flex-direction:column;gap:5px}
.row1{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
#tierLbl{font-family:var(--display);font-size:calc(max(12px,17px) * min(var(--gk-text-scale,1),1.25));letter-spacing:.01em;color:var(--brass);white-space:nowrap}
#tierLbl small{display:block;font-family:var(--body);font-size:calc(max(12px,10px) * min(var(--gk-text-scale,1),1.25));letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
#orderWrap{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
#orderWrap span{font-size:calc(max(12px,10px) * min(var(--gk-text-scale,1),1.25));letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
#orderCv{height:30px;width:120px;max-width:100%;object-fit:contain}
@media (max-width:400px){#orderWrap span{display:none}}
#qty{font-variant-numeric:tabular-nums;font-weight:700;font-size:calc(max(12px,15px) * min(var(--gk-text-scale,1),1.25));text-align:right;white-space:nowrap}
#qty small{display:block;font-weight:400;font-size:calc(max(12px,11px) * min(var(--gk-text-scale,1),1.25));color:var(--dim);letter-spacing:.02em}
#qty small.live{color:var(--good)}
#bar{height:7px;border-radius:4px;background:var(--panel);overflow:hidden;position:relative}
#barFill{height:100%;width:0;background:linear-gradient(90deg,var(--brass-dim),var(--brass));border-radius:4px;transition:width .15s}
#bar.flash #barFill{background:var(--good)}
.row2{display:flex;align-items:center;gap:6px}
#hum{font-variant-numeric:tabular-nums;font-weight:700;color:var(--brass);min-width:62px}
.spacer{flex:1}
.hb{font:700 calc(12px * min(var(--gk-text-scale,1),1.25)) var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;height:32px;min-width:36px;padding:0 9px;cursor:pointer}
.hb:active{background:var(--panel-hi)}
.hb:focus-visible,.tool:focus-visible,.mb:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.hb.glow{border-color:var(--brass);box-shadow:0 0 0 2px rgba(227,180,92,.25)}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#board{display:block;touch-action:none;border-radius:12px}
#toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-8px);background:rgba(14,27,26,.94);border:1px solid var(--brass);color:var(--ink);padding:8px 14px;border-radius:12px;font-size:calc(max(12px,13px) * var(--gk-text-scale,1));text-align:center;max-width:92%;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast b{font-family:var(--display);font-weight:400;color:var(--brass);font-size:calc(max(12px,16px) * var(--gk-text-scale,1));display:block}
#hint{min-height:34px;padding-block:5px;font-size:calc(max(12px,12.5px) * var(--gk-text-scale,1));color:var(--dim);text-align:center;display:flex;align-items:center;justify-content:center}
#hint b{color:var(--ink)}
#tools{display:flex;gap:5px;padding-block:2px 10px}
.tool{flex:1 1 0;min-width:0;max-width:76px;height:54px;background:var(--panel);border:1px solid var(--line);border-radius:11px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;cursor:pointer;position:relative;font:700 12px var(--body)}
.tool canvas{width:26px;height:26px}
.tool.sel{background:var(--panel-hi);border-color:var(--brass);box-shadow:inset 0 -3px 0 var(--brass)}
.tool.new::after{content:"";position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--brass)}
#modal{position:fixed;inset:0;background:rgba(5,12,11,.72);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px));padding-bottom:max(12px, env(safe-area-inset-bottom, 0px))}
#modalCard{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:480px;padding:16px;max-height:86%;overflow:auto}
#modalCard h2{font-family:var(--display);font-weight:400;color:var(--brass);margin:0 0 4px;font-size:calc(max(12px,22px) * var(--gk-text-scale,1));text-wrap:balance}
#modalCard p{margin:6px 0;color:var(--dim);line-height:1.45}
.urow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.urow .n{font-weight:700}
.urow .d{font-size:calc(max(12px,12px) * var(--gk-text-scale,1));color:var(--dim);grid-column:1}
.urow .lv{font-size:calc(max(12px,11px) * var(--gk-text-scale,1));letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.mb{font:700 calc(13px * var(--gk-text-scale,1)) var(--body);color:var(--night);background:var(--brass);border:0;border-radius:10px;padding:10px 12px;min-height:40px;cursor:pointer;font-variant-numeric:tabular-nums}
.mb[disabled]{background:var(--line);color:var(--dim);cursor:default}
.mb.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.mb.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.mrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0;font-variant-numeric:tabular-nums}
.stats div{background:var(--board);border-radius:10px;padding:8px 10px}
.stats b{display:block;font-size:calc(max(12px,17px) * var(--gk-text-scale,1));color:var(--ink)}
.stats span{font-size:calc(max(12px,11px) * var(--gk-text-scale,1));color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:calc(max(12px,12px) * var(--gk-text-scale,1));color:var(--dim);margin:8px 0}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px}
html[data-gk-motion]:not([data-gk-motion=full]) #toast,html[data-gk-motion]:not([data-gk-motion=full]) #barFill{transition:none}
</style>

<div id="app">
  <header id="top">
    <div class="row1">
      <div id="tierLbl">Tier 1<small>Songmill</small></div>
      <div id="orderWrap"><span>Order</span><canvas id="orderCv" width="240" height="60" aria-label="Current order"></canvas></div>
      <div id="qty"><span id="qtyN">0 / 10</span><small id="rate">&nbsp;</small></div>
    </div>
    <div id="bar"><div id="barFill"></div></div>
    <div class="row2">
      <div id="hum" title="Hum: earned from every bead the Mill sings">♪ 0</div>
      <div class="spacer"></div>
      <button class="hb" id="bUndo" title="Undo (Z)">Undo</button>
      <button class="hb" id="bSpeed" title="Speed (F)" hidden>1×</button>
      <button class="hb" id="bUp" title="Upgrades (U)" hidden>Upgrades</button>
      <button class="hb" id="bMenu" title="Menu (Esc)" aria-label="Menu">≡</button>
    </div>
  </header>
  <main id="stage"><canvas id="board" aria-label="Factory board"></canvas><div id="toast"></div></main>
  <div id="hint"></div>
  <nav id="tools" aria-label="Tools"></nav>
</div>
<div id="modal" hidden><div id="modalCard"></div></div>

<script id="gamekit">/* GameKit 2.1 : shared starter kit for single-file phone games.
   Paste inline in a script tag before the game's own script. No build step, no network.
   Modules: GK.rng, GK.daily, GK.save, GK.audio, GK.input, GK.juice, GK.ease,
            GK.badges, GK.share, GK.view, GK.ui, GK.loop, GK.prefs, GK.flash, GK.perf,
            GK.theme, GK.popups, GK.roll, GK.coach, GK.hints, GK.studio, GK.wired, GK.retrofit.  README.md has the API.
   All code here is the studio's own (no third-party code). */
(function (root) {
  'use strict';
  var GK = { version: '2.1.0' };
  var HAS_DOM = typeof window !== 'undefined' && typeof document !== 'undefined';
  var W = HAS_DOM ? window : {};
  function now() { return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now(); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function on(t, ev, fn, opt) { if (t && t.addEventListener) t.addEventListener(ev, fn, opt); }
  function off(t, ev, fn, opt) { if (t && t.removeEventListener) t.removeEventListener(ev, fn, opt); }
  GK.clamp = clamp;
  GK.now = now;

  /* ---------- environment ---------- */
  var ENV = GK.env = (function () {
    var ua = HAS_DOM && navigator.userAgent || '';
    var touchMac = HAS_DOM && /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
    var ios = /iPhone|iPad|iPod/.test(ua) || !!touchMac;
    var reduced = false;
    try { reduced = HAS_DOM && W.matchMedia && W.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    return { ios: ios, android: /Android/.test(ua), touch: HAS_DOM && (('ontouchstart' in W) || navigator.maxTouchPoints > 0), reducedMotion: !!reduced };
  })();
  // follow the phone's reduce-motion setting live (2.0)
  if (HAS_DOM && W.matchMedia) {
    try {
      var mqRM = W.matchMedia('(prefers-reduced-motion: reduce)');
      var onRM = function () { ENV.reducedMotion = !!mqRM.matches; if (GK.prefs && GK.prefs._emit) GK.prefs._emit('motion'); };
      if (mqRM && mqRM.addEventListener) mqRM.addEventListener('change', onRM); else if (mqRM && mqRM.addListener) mqRM.addListener(onRM);
    } catch (e) {}
  }

  /* ---------- storage (never throws) ---------- */
  var mem = {};
  var LS = GK.ls = {
    get: function (k) { try { var v = W.localStorage.getItem(k); return v == null ? (k in mem ? mem[k] : null) : v; } catch (e) { return k in mem ? mem[k] : null; } },
    set: function (k, v) { mem[k] = v; try { W.localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del: function (k) { delete mem[k]; try { W.localStorage.removeItem(k); } catch (e) {} }
  };

  /* ================= RNG ================= */
  // hash4: string -> four 32-bit words (multiply-xorshift mixing, one pass per lane)
  var HMUL = [0x85ebca6b, 0xc2b2ae35, 0x27d4eb2f, 0x165667b1];
  function hash4(str) {
    str = String(str);
    var h = [0x6a09e667 ^ str.length, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a], M = HMUL;
    for (var i = 0; i < str.length; i++) {
      var c = str.charCodeAt(i);
      for (var j = 0; j < 4; j++) {
        h[j] = Math.imul(h[j] ^ c, M[j]);
        h[j] ^= h[j] >>> 15;
        c = (c + h[j]) | 0;
      }
    }
    for (var k = 0; k < 4; k++) {
      var x = h[k] ^ h[(k + 1) & 3];
      x = Math.imul(x ^ (x >>> 16), 0x7feb352d);
      x = Math.imul(x ^ (x >>> 15), 0x846ca68b);
      h[k] = (x ^ (x >>> 16)) >>> 0;
    }
    return h;
  }
  function hash32(str) { return hash4(str)[0]; }
  // sfc32 generator (small fast counting, 128-bit state); state is kept so a run can resume.
  function sfc(s) {
    var a = s[0] | 0, b = s[1] | 0, c = s[2] | 0, d = s[3] | 0;
    function next() {
      var t = (((a + b) | 0) + d) | 0;
      d = (d + 1) | 0;
      a = b ^ (b >>> 9);
      b = (c + (c << 3)) | 0;
      c = (c << 21) | (c >>> 11);
      c = (c + t) | 0;
      return (t >>> 0) / 4294967296;
    }
    for (var i = 0; i < 12; i++) next();
    next.state = function () { return [a >>> 0, b >>> 0, c >>> 0, d >>> 0]; };
    next.load = function (st) { a = st[0] | 0; b = st[1] | 0; c = st[2] | 0; d = st[3] | 0; };
    return next;
  }
  // mulberry32: kept so shipped games keep their exact dailies
  function mulberry32(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6d2b79f5) | 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function wrap(fn, seedStr) {
    var R = {
      seed: seedStr,
      next: fn,
      float: function (a, b) { if (b === undefined) { b = a === undefined ? 1 : a; a = 0; } return a + fn() * (b - a); },
      int: function (lo, hi) { return lo + Math.floor(fn() * (hi - lo + 1)); }, // inclusive
      chance: function (p) { return fn() < p; },
      pick: function (arr) { return arr[Math.floor(fn() * arr.length)]; },
      sign: function () { return fn() < 0.5 ? -1 : 1; },
      shuffle: function (arr) { for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(fn() * (i + 1)); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; },
      weighted: function (items, weights) {
        var tot = 0, i; for (i = 0; i < weights.length; i++) tot += Math.max(0, weights[i]);

        return items[items.length - 1];
      },
      sub: function (label, n) { return GK.rng.make(seedFor(seedStr, label, n)); },
      state: function () { return fn.state ? fn.state() : null; },
      load: function (st) { if (fn.load && st) fn.load(st); return R; }
    };
    return R;
  }
  function seedFor(base, label, n) { return String(base) + '/' + label + (n === undefined ? '' : '#' + n); }
  var CONS = 'BCDFGHJKLMNPQRSTVWXZ';
  GK.rng = {
    hash32: hash32,
    hash4: hash4,
    mulberry32: mulberry32,
    seedFor: seedFor,
    make: function (seed) { var s = String(seed); return wrap(sfc(hash4(s)), s); },
    legacy: function (seed32) { return wrap(mulberry32(seed32), String(seed32)); },
    streams: function (seed) { return { game: GK.rng.make(seedFor(seed, 'game')), fx: GK.rng.make(seedFor(seed, 'fx')) }; },
    code: function (src) { // 9-letter shareable code, no vowels: BCD-FGH-JKL
      var r = src && src.next ? src : GK.rng.make(src === undefined ? Math.random() + ':' + Date.now() : src);
      var out = ''; for (var i = 0; i < 9; i++) { if (i && i % 3 === 0) out += '-'; out += CONS[Math.floor(r.next() * CONS.length)]; }
      return out;
    },
    normalize: function (text) { // any typed text becomes a seed; codes ignore case, spaces and dashes
      var t = String(text || '').trim();
      var c = t.toUpperCase().replace(/[\s\-_.]/g, '');
      if (/^[BCDFGHJKLMNPQRSTVWXZ]{9}$/.test(c)) return c.slice(0, 3) + '-' + c.slice(3, 6) + '-' + c.slice(6);
      return t;
    },
    // bounded retry for generators: never loops on the clock
    tries: function (max, fn) { for (var i = 0; i < max; i++) { var v = fn(i); if (v !== undefined && v !== null && v !== false) return v; } return null; }
  };

  /* ================= DAILY ================= */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function partsIn(date, tz) {
    if (!tz) return { y: date.getFullYear(), m: date.getMonth() + 1, d: date.getDate(), H: date.getHours(), M: date.getMinutes(), S: date.getSeconds() };
    try {
      var f = new Intl.DateTimeFormat('en-US', { timeZone: tz, year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric', hourCycle: 'h23' });
      var o = {}; f.formatToParts(date).forEach(function (p) { o[p.type] = p.value; });
      return { y: +o.year, m: +o.month, d: +o.day, H: (+o.hour) % 24, M: +o.minute, S: +o.second };
    } catch (e) { return partsIn(date, null); }
  }
  GK.daily = {
    // YYYY-MM-DD on the player's own clock (or a fixed zone, e.g. {tz:'America/Chicago'})
    key: function (opts, date) { var p = partsIn(date || new Date(), opts && opts.tz); return p.y + '-' + pad(p.m) + '-' + pad(p.d); },
    seed: function (gameId, key) { return gameId + '|' + (key || GK.daily.key()); },
    msToNext: function (opts, date) {
      var p = partsIn(date || new Date(), opts && opts.tz);
      return ((23 - p.H) * 3600 + (59 - p.M) * 60 + (60 - p.S)) * 1000;
    },
    countdown: function (ms) {
      var s = Math.max(0, Math.ceil(ms / 1000)); var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);

    },
    // record a day played. st = {days:0,last:''}; returns true on a new day. Counts total days, never resets.
    mark: function (st, key) { key = key || GK.daily.key(); if (st.last === key) return false; st.last = key; st.days = (st.days | 0) + 1; return true; },
    label: function (key) { var p = key.split('-'); var mo = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][(+p[1]) - 1]; return mo + ' ' + (+p[2]); },
    // "Lantern Drum Nov 6: 1234" + optional emoji row
    shareLine: function (o) { return (o.game || 'Game') + ' ' + GK.daily.label(o.key || GK.daily.key()) + ': ' + o.score + (o.grid ? '\n' + o.grid : '') + (o.tail ? '\n' + o.tail : ''); }
  };

  /* ================= SAVE ================= */
  function b64e(s) { if (typeof btoa !== 'undefined') return btoa(unescape(encodeURIComponent(s))); return Buffer.from(s, 'utf8').toString('base64'); }

  function okJSON(raw) { if (raw == null || raw === '') return false; try { JSON.parse(raw); return true; } catch (e) { return false; } }
  var hideFns = [];
  var hideBound = false;
  function bindHide() {
    if (hideBound || !HAS_DOM) return; hideBound = true;
    var fire = function () { for (var i = 0; i < hideFns.length; i++) { try { hideFns[i](); } catch (e) {} } };
    on(W, 'pagehide', fire);
    on(document, 'visibilitychange', function () { if (document.visibilityState === 'hidden') fire(); });

  function rotate(key, raw, keep) {
    keep = keep || 3;

    for (var i = keep; i > 1; i--) { var prev = LS.get(key + '.bak' + (i - 1)); if (prev != null) LS.set(key + '.bak' + i, prev); }
    LS.set(key + '.bak1', raw); return true;
  }
  function backups(key, keep) { var out = []; for (var i = 1; i <= (keep || 3); i++) { var v = LS.get(key + '.bak' + i); if (v != null) out.push(v); } return out; }
  function exportRaw(key, raw) { var body = b64e(JSON.stringify({ k: key, v: raw, t: Date.now() })); return 'GK1.' + body + '.' + sum(body); }
  function importRaw(key, code) {
    code = String(code || '').replace(/\s+/g, '');
    var p = code.split('.'); if (p.length !== 3 || p[0] !== 'GK1' || sum(p[1]) !== p[2]) return null;
    try { var o = JSON.parse(b64d(p[1])); if (o.k !== key || typeof o.v !== 'string') return null; return o.v; } catch (e) { return null; }
  }

    onHide: function (fn) { hideFns.push(fn); bindHide(); },
    persist: function () { try { if (navigator.storage && navigator.storage.persist) return navigator.storage.persist().catch(function () { return false; }); } catch (e) {} return Promise.resolve(false); },
    // Retrofit an existing game: no format change. Keeps 3 rolling backups (one per session),
    // restores the newest good backup when the key is missing or unreadable, and adds export/import.
    protect: function (key, opts) {
      opts = opts || {};
      var valid = opts.validate || okJSON;
      var keep = opts.keep || 3;
      var raw = LS.get(key), restored = false;
      if (!valid(raw)) {
        var bs = backups(key, keep);
        for (var i = 0; i < bs.length; i++) if (valid(bs[i])) { LS.set(key, bs[i]); raw = bs[i]; restored = true; break; }
      }
      if (valid(raw)) rotate(key, raw, keep);

const TOOLS = [
  { id: 'belt',  name: 'Belt',   key: '1', tier: 0, desc: '<b>Belt:</b> drag a path. Beads ride toward the arrows.' },
  { id: 'join',  name: 'Joiner', key: '2', tier: 1, desc: '<b>Joiner:</b> back strand + side strand → one strand, back first.' },

const TIERS = [
  { order: 'R',    qty: 10,   hint: 'Drag a belt from a <b>red well</b> to the <b>Mill</b> in the middle.' },
  { order: 'RY',   qty: 40,   hint: '<b>Joiner</b>: red into the dot side (back), yellow into a ring side. It sends out of the notch.' },
  { order: 'O',    qty: 150,  hint: '<b>Mixer</b>: red + yellow = orange, any order. <b>Upgrades</b> are open.' },
  { order: 'OB',   qty: 500,  hint: 'Blue wells woke. One line won\'t be enough: build a second. <b>Fork</b> and <b>Bridge</b> help.' },
  { order: 'WW',   qty: 1500, hint: 'White = red + yellow + blue. Mix twice. <b>Echo</b> doubles a strand.' },

        if (edge === c.d) return false;

  },

  deliver(st, s) {
    const o = Rules.order(st), match = s === o.order;
    const gain = s.length * (match ? CONFIG.HUM_MATCH : CONFIG.HUM_OTHER);
    st.hum += gain; st.life.beads += s.length; st.life.strands++;
    if (match) { st.prog++; st.rateLog.push(st.t); }

      const bonus = Math.round(o.qty * o.order.length * CONFIG.TIER_BONUS);

  // Rate of matching deliveries per minute over the recent window.
  rate(st) {

  // Does the building at (x,y) push items toward direction dir?
  feedsInto(st, x, y, dir) {

  // A well feeds machines, and belts that start at it: pointing away, or turning at it with nothing behind them.

  wellFeeds(st, x, y, d) {

  _move(st, item, tx, ty, dir) {

  step(st, dt) {

  buildList(st) { const b = []; st.grid.forEach((c, i) => { if (c && BUILDABLE[c.t]) b.push([i, c.t, c.d]); }); return b; },
  applyBuildList(st, list) {

  serialize(st) {

  deserialize(o) {

/* =========================== Storage =========================== */
const Storage = {
  load() { try { const s = localStorage.getItem(CONFIG.SAVE_KEY); return s ? Rules.deserialize(JSON.parse(s)) : null; } catch (e) { return null; } },
  save(st) {
    try { localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify(Rules.serialize(st))); } catch (e) {}
    const b = Storage.best();
    if (st.tier > b.tier || st.life.beads > b.beads) {
      try { localStorage.setItem(CONFIG.BEST_KEY, JSON.stringify({ tier: Math.max(b.tier, st.tier), beads: Math.max(b.beads, st.life.beads) })); } catch (e) {}
    }
  },
  best() { try { const b = JSON.parse(localStorage.getItem(CONFIG.BEST_KEY) || 'null'); if (b) return { tier: b.tier | 0, beads: b.beads | 0 }; } catch (e) {} return { tier: 0, beads: 0 }; },
  wipe() { try { localStorage.removeItem(CONFIG.SAVE_KEY); } catch (e) {} },
};

/* =========================== Audio (all generated) =========================== */
const Audio = {
  ctx: null, master: null, wet: null, nextSlot: 0, queue: [], pad: [], muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }

      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200;
      this.master.connect(lp); lp.connect(ctx.destination);

      this.wet = ctx.createGain(); this.wet.gain.value = 0.22;

      this.setPad(Rules.order(st).order);
    } catch (e) { this.ctx = null; }
  },
  setMuted(m) { this.muted = m; if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.55, this.ctx.currentTime, 0.05); },
  bell(f, t, v, dur) {

    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2.76;

  chord(notes, up) {

    notes.forEach((c, i) => this.bell(COLORS[c].f * 2, t + 0.5 + i * 0.09, 0.12, 2.4));

  setPad(order) {

  },
  tick() {

      this.nextSlot += grid;
    }
  },
};

/* =========================== Renderer =========================== */
const Theme = { board: '#122624', dot: '#24453f', belt: '#1d3c38', beltEdge: '#2c5751', chevron: '#3f7067', ink: '#efe6d2', dim: '#94aca4', brass: '#e3b45c', hub: '#1b3a35', stone: '#2a3f3b',
  tint: { join: '#b98a3c', mix: '#b5627f', fork: '#4f80a8', cross: '#55706a', echo: '#7d6bb6', flip: '#3f978d' } };

function drawStrand(ctx, x, y, s, r, letters) {
  const n = s.length, gap = r * 2.18, w = gap * n + r * 0.55;
  ctx.fillStyle = 'rgba(6,14,13,.86)'; roundRect(ctx, x - w / 2, y - r * 1.32, w, r * 2.64, r * 1.32); ctx.fill();
  for (let i = 0; i < n; i++) {

    if (letters) { ctx.fillStyle = 'rgba(10,18,17,.82)'; ctx.font = '700 ' + Math.round(r * 1.15) + 'px ' + 'Atkinson Hyperlegible, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s[i], cx, y + r * 0.06); }
    else { ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.arc(cx - r * 0.35, y - r * 0.35, r * 0.3, 0, 6.2832); ctx.fill(); }
  }
}

// Point along the path through a cell entering at edge e, leaving at edge d. Returns [x,y].
function pathPoint(cx, cy, s, e, d, p) {
  const h = s / 2;
  if ((e + 2) % 4 === d || e === d) {
    const sx = e === d ? cx : cx + DX[e] * h, sy = e === d ? cy : cy + DY[e] * h;
    return [sx + (cx + DX[d] * h - sx) * p, sy + (cy + DY[d] * h - sy) * p];
  }
  const kx = cx + (DX[e] + DX[d]) * h, ky = cy + (DY[e] + DY[d]) * h;

  const a = a0 + da * p; return [kx + Math.cos(a) * h, ky + Math.sin(a) * h];
}

// Draws building icon inside a cell box (x,y,s). Shared by the board and the tool buttons.

  const cx = x + s / 2, cy = y + s / 2, t = c.t, d = c.d;

    ctx.strokeStyle = Theme.beltEdge; ctx.lineWidth = s * 0.62; strokePath(ctx, cx, cy, s, e, d);
    ctx.strokeStyle = Theme.belt; ctx.lineWidth = s * 0.5; strokePath(ctx, cx, cy, s, e, d);

    ctx.strokeStyle = Theme.belt; ctx.lineWidth = s * 0.5; ctx.beginPath(); ctx.moveTo(x, cy); ctx.lineTo(x + s, cy); ctx.stroke();

    ctx.fillStyle = Theme.tint.cross; roundRect(ctx, cx - s * 0.3, y + s * 0.02, s * 0.6, s * 0.96, s * 0.12); ctx.fill();

    ctx.beginPath(); ctx.moveTo(cx - s * 0.3, y + s * 0.18); ctx.lineTo(cx + s * 0.3, y + s * 0.18); ctx.moveTo(cx - s * 0.3, y + s * 0.82); ctx.lineTo(cx + s * 0.3, y + s * 0.82); ctx.stroke();
    return;

  ctx.fillStyle = tint; roundRect(ctx, -q, -q, q * 2, q * 2, s * 0.17); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.22)'; roundRect(ctx, -q, q * 0.35, q * 2, q * 0.65, s * 0.12); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1; roundRect(ctx, -q + 0.5, -q + 0.5, q * 2 - 1, q * 2 - 1, s * 0.17); ctx.stroke();

  ctx.fillStyle = Theme.ink; ctx.beginPath(); ctx.moveTo(-s * 0.12, -q + 1); ctx.lineTo(0, -s * 0.5); ctx.lineTo(s * 0.12, -q + 1); ctx.closePath(); ctx.fill();

  else if (t === 'mix') { ctx.lineWidth = Math.max(1.2, s * 0.05); ctx.beginPath(); ctx.arc(-k * 0.45, 0, k * 0.85, 0, 6.2832); ctx.stroke(); ctx.beginPath(); ctx.arc(k * 0.45, 0, k * 0.85, 0, 6.2832); ctx.stroke(); }
  else if (t === 'fork') {

/* =========================== Input =========================== */
const Input = {
  drag: null, tool: 'belt', undo: [],
  snapshot() { this.undo.push(JSON.stringify(Rules.buildList(st))); if (this.undo.length > CONFIG.UNDO_MAX) this.undo.shift(); },
  doUndo() {
    const s = this.undo.pop(); if (!s) { UI.toast('Nothing to undo'); return; }

    Audio.click('rot'); Game.changed();
  },
  cellAt(e) {

  },
  mark() { if (this.drag && !this.drag.snapped) { this.snapshot(); this.drag.snapped = true; } else if (!this.drag) this.snapshot(); },

  down(x, y, button) {

    const c = Rules.cell(st, x, y), i = IDX(x, y);

      if (!c) { if (this.act(() => Rules.place(st, x, y, 'belt', st.rot))) { this.drag.own.add(i); Renderer.pop(i); Audio.click('place'); Game.changed(); } }
      else if (c.t === 'belt') { this.drag.tapRotate = true; this.drag.own.add(i); }
      return;
    }
    // machines
    if (c && c.t === tool) { this.drag.tapRotate = true; this.drag.placed = i; return; }
    if (!c || BUILDABLE[c.t]) {
      const d = c && BUILDABLE[c.t] && c.t !== 'cross' ? c.d : st.rot;
      if (this.act(() => Rules.place(st, x, y, tool, d))) { this.drag.placed = i; Renderer.pop(i); Audio.click('place'); Game.changed(); }
    }
  },
  move(x, y) {
    const D = this.drag; if (!D) return;
    if (!inb(x, y)) return;
    let { x: lx, y: ly } = D.last;
    let guard = 0;
    while ((lx !== x || ly !== y) && guard++ < 40) {
      const ddx = x - lx, ddy = y - ly;
      let nx = lx, ny = ly;
      if (Math.abs(ddx) >= Math.abs(ddy)) nx += Math.sign(ddx); else ny += Math.sign(ddy);
      this.stepTo(lx, ly, nx, ny); lx = nx; ly = ny;

  },
  stepTo(px, py, nx, ny) {

    const pi = IDX(px, py), ni = IDX(nx, ny);
    if (D.tool === 'erase') { if (this.act(() => Rules.erase(st, nx, ny))) { Audio.click('erase'); Game.changed(); } return; }
    if (D.tool === 'belt') {
      const pc = st.grid[pi];
      if (pc && pc.t === 'belt' && D.own.has(pi) && pc.d !== dir) this.act(() => { pc.d = dir; return true; });
      const nc = st.grid[ni];
      if (!nc) { if (this.act(() => Rules.place(st, nx, ny, 'belt', dir))) { D.own.add(ni); Renderer.pop(ni); Audio.click('place'); } }
      Game.changed();
      return;
    }

      if (c && MACHINES[c.t] || (c && c.t === 'fork')) { if (c.d !== dir) { this.act(() => { c.d = dir; return true; }); st.rot = dir; Renderer.pop(pi); Audio.click('rot'); Game.changed(); } }

  bind(cv) {

  key(e) {

      e.preventDefault(); Renderer.showCursor = true; const d = arrows[k];
      const nx = clamp(cur.x + DX[d], 0, CONFIG.COLS - 1), ny = clamp(cur.y + DY[d], 0, CONFIG.ROWS - 1);
      if (e.shiftKey && this.tool === 'belt') {
        this.drag = { tool: 'belt', last: { x: cur.x, y: cur.y }, moved: false, own: new Set([IDX(cur.x, cur.y)]), placed: -1, snapped: false };
        if (!Rules.cell(st, cur.x, cur.y)) { this.act(() => Rules.place(st, cur.x, cur.y, 'belt', d)); }
        this.move(nx, ny); this.drag = null; Audio.init();
      }
      cur.x = nx; cur.y = ny; return;
    }
    if (k === ' ' || k === 'enter') { e.preventDefault(); Renderer.showCursor = true; this.down(cur.x, cur.y, 0); this.up(); return; }
    if ((k === 'z' && (e.ctrlKey || e.metaKey)) || k === 'z') { e.preventDefault(); this.doUndo(); return; }
    if (k === 'r') { UI.rotate(); return; }
    if (k === 'f') { UI.speed(); return; }
    if (k === 'u') { if (st.tier >= 2) UI.openUpgrades(); return; }
    if (k === 'm') { UI.toggleMute(); return; }
    if (k === 'escape') { UI.openMenu(); return; }
    if (k === 'delete' || k === 'backspace') { UI.selectTool('erase'); return; }
    const t = TOOLS.find(t => t.key === k); if (t && Rules.toolUnlocked(st, t.id)) UI.selectTool(t.id);
  },
};

/* =========================== UI (DOM) =========================== */
const $ = id => document.getElementById(id);
const UI = {
  modalOpen: false, last: {}, toastT: 0,
  init() {
    $('bUndo').onclick = () => { Audio.init(); Input.doUndo(); };
    $('bSpeed').onclick = () => this.speed();
    $('bUp').onclick = () => this.openUpgrades();
    $('bMenu').onclick = () => this.openMenu();
    $('modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal') this.closeModal(); });
    this.buildTools(); this.refresh();
  },
  buildTools() {
    const nav = $('tools'); nav.innerHTML = '';
    TOOLS.forEach(t => {
      if (!Rules.toolUnlocked(st, t.id)) return;
      const b = document.createElement('button'); b.className = 'tool'; b.dataset.id = t.id; b.title = t.name + ' (' + t.key.toUpperCase() + ')';
      const c = document.createElement('canvas'); const dpr = Math.min(3, window.devicePixelRatio || 1); c.width = 26 * dpr; c.height = 26 * dpr;
      const g = c.getContext('2d'); g.scale(dpr, dpr);
      if (t.id === 'erase') drawEraseIcon(g, 0, 0, 26); else drawBuilding(g, 0, 0, 26, { t: t.id, d: t.id === 'belt' ? 1 : 0 }, 0.2);
      b.appendChild(c); b.appendChild(document.createTextNode(t.name));
      if (!st.seenTools[t.id]) b.classList.add('new');
      b.onclick = () => { Audio.init(); this.selectTool(t.id); };
      nav.appendChild(b);
    });
    this.markTool();
  },
  markTool() { document.querySelectorAll('.tool').forEach(b => b.classList.toggle('sel', b.dataset.id === Input.tool)); },
  selectTool(id) {
    Input.tool = id; Audio.click('ui');
    if (!st.seenTools[id]) { st.seenTools[id] = 1; const b = document.querySelector('.tool[data-id="' + id + '"]'); if (b) b.classList.remove('new'); Game.save(); }
    this.markTool(); this.hint(TOOL_BY_ID[id].desc, 4);
  },
  rotate() {
    Audio.init(); Audio.click('rot');
    const cur = Renderer.cursor;
    if (Renderer.showCursor && cur && Rules.cell(st, cur.x, cur.y) && BUILDABLE[Rules.cell(st, cur.x, cur.y).t]) { Input.snapshot(); if (Rules.rotate(st, cur.x, cur.y)) { st.rot = Rules.cell(st, cur.x, cur.y).d; Renderer.pop(IDX(cur.x, cur.y)); Game.changed(); } return; }
    st.rot = (st.rot + 1) % 4; this.hint('Taps now place facing <b>' + ARROWS[st.rot] + '</b>', 2); Game.save();
  },
  speed() { Audio.init(); Audio.click('ui'); st.speedIdx = (st.speedIdx + 1) % CONFIG.SPEEDS.length; this.refresh(); Game.save(); },
  toggleMute() { st.muted = !st.muted; Audio.setMuted(st.muted); Game.save(); if (this.modalOpen) this.openMenu(); },
  hintUntil: 0, hintHtml: '',
  hint(html, secs) { this.hintHtml = html; this.hintUntil = Game.rt + (secs || 0); $('hint').innerHTML = html; },
  toast(html) { const t = $('toast'); t.innerHTML = html; t.classList.add('on'); clearTimeout(this.toastT); this.toastT = setTimeout(() => t.classList.remove('on'), 2600); },
  refresh() {
    const o = Rules.order(st), L = this.last;
    const tierTxt = st.tier < TIERS.length ? 'Tier ' + (st.tier + 1) + '<small>of ' + TIERS.length + '</small>' : 'Freeplay<small>song ' + (st.tier - TIERS.length + 1) + '</small>';
    if (L.tier !== tierTxt) { $('tierLbl').innerHTML = tierTxt; L.tier = tierTxt; }
    if (L.order !== o.order) { L.order = o.order; this.drawOrder(o.order); }
    const q = fmt(st.prog) + ' / ' + fmt(o.qty); if (L.q !== q) { $('qtyN').textContent = q; L.q = q; }
    const pct = (100 * st.prog / o.qty).toFixed(1) + '%'; if (L.pct !== pct) { $('barFill').style.width = pct; L.pct = pct; }
    const h = '♪ ' + fmt(st.hum); if (L.h !== h) { $('hum').textContent = h; L.h = h; }
    const rpm = Rules.rate(st); let rt = '';
    if (rpm > 0) { const left = o.qty - st.prog, secs = left / (rpm / 60); rt = Math.round(rpm) + '/min · ' + (secs > 5940 ? '99m+' : secs >= 60 ? Math.floor(secs / 60) + ':' + String(Math.floor(secs % 60)).padStart(2, '0') : Math.ceil(secs) + 's'); }
    else rt = st.tier > 0 || st.prog > 0 ? 'none arriving' : '\u00a0';
    if (L.rt !== rt) { const el = $('rate'); el.textContent = rt; el.classList.toggle('live', rpm > 0); L.rt = rt; }
    $('bSpeed').hidden = st.tier < 1; $('bUp').hidden = st.tier < 2;
    const sp = CONFIG.SPEEDS[st.speedIdx] + '×'; if (L.sp !== sp) { $('bSpeed').textContent = sp; L.sp = sp; }
    const canBuy = UPGRADES.some(u => st.up[u.id] < Rules.upCap(st) && st.hum >= Rules.upCost(st.up[u.id]));
    $('bUp').classList.toggle('glow', canBuy);
    if (Game.rt > this.hintUntil && this.hintHtml !== o.hint) { this.hintHtml = o.hint; $('hint').innerHTML = o.hint; }
  },
  drawOrder(s) {
    const c = $('orderCv'), g = c.getContext('2d'), dpr = Math.min(3, window.devicePixelRatio || 1);
    c.width = 120 * dpr; c.height = 30 * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, 120, 30);
    drawStrand(g, 60, 15, s, 10, true);
  },
  closeModal() { $('modal').hidden = true; this.modalOpen = false; clearInterval(this.modalTimer); },
  showModal(html, onRender) {
    $('modalCard').innerHTML = html; $('modal').hidden = false; this.modalOpen = true;
    clearInterval(this.modalTimer); if (onRender) { onRender(); this.modalTimer = setInterval(onRender, 300); }
  },
  openUpgrades() {
    Audio.init(); Audio.click('ui');
    const rows = UPGRADES.map(u => '<div class="urow"><div><div class="n">' + u.name + ' <span class="lv" id="lv-' + u.id + '"></span></div><div class="d" id="ud-' + u.id + '"></div></div><button class="mb" id="ub-' + u.id + '"></button></div>').join('');
    this.showModal('<h2>Upgrades</h2><p>Spend hum on speed. Each level is ×' + CONFIG.UP_MULT + '. The level cap rises each tier, so more speed alone won\'t carry you: build more lines too. You have <b id="uHum"></b>.</p>' + rows + '<div class="mrow"><button class="mb ghost" id="uClose">Back to the mill</button></div>', () => {
      const h = $('uHum'); if (!h) return; h.textContent = '♪ ' + fmt(st.hum);
      UPGRADES.forEach(u => {
        const lv = st.up[u.id], cap = Rules.upCap(st), max = lv >= cap, cost = Rules.upCost(lv), b = $('ub-' + u.id);
        $('lv-' + u.id).textContent = 'Lv ' + lv + ' / ' + cap;
        const now = u.id === 'belt' ? Rules.beltSpeed(st).toFixed(1) + ' cells/s' : u.id === 'mach' ? Rules.machTime(st).toFixed(2) + ' s per craft' : (1 / Rules.wellInterval(st)).toFixed(1) + ' beads/s per well';
        $('ud-' + u.id).textContent = u.desc + ' Now ' + now + '.';
        b.textContent = max ? (cap < CONFIG.UP_MAX ? 'Next tier' : 'Maxed') : 'Buy ♪ ' + fmt(cost); b.disabled = max || st.hum < cost;
        b.onclick = () => { if (Rules.buy(st, u.id)) { Audio.chord([['R', 'Y', 'B'][UPGRADES.indexOf(u)]], true); Game.save(); } };
      });
    });
    $('uClose').onclick = () => this.closeModal();
  },
  openMenu() {
    Audio.init(); Audio.click('ui');
    const b = Storage.best();
    const legend = Object.entries(COLORS).map(([k, c]) => '<span><i style="background:' + c.hex + '"></i>' + k + ' ' + c.name + '</span>').join('');
    this.showModal(
      '<h2>Songmill</h2>' +
      '<p>Wells bubble colored beads. Belts carry them. Machines join, blend, double and flip them into strands. The Mill in the middle sings every strand it is fed, and the one the order asks for fills the bar.</p>' +
      '<div class="legend">' + legend + '</div>' +
      '<p>Mixing adds colors: R+Y=O, Y+B=G, R+B=P, all three = W. Tap a building with its own tool to turn it. Drag a machine as you place it to aim it.</p>' +
      '<div class="stats"><div><span>Beads sung</span><b>' + fmt(st.life.beads) + '</b></div><div><span>Best</span><b>' + (b.tier >= TIERS.length ? 'Freeplay ' + (b.tier - TIERS.length + 1) : 'Tier ' + (Math.max(b.tier, st.tier) + 1)) + '</b></div></div>' +
      '<p style="font-size:calc(12px * var(--gk-text-scale,1))">Keys: 1–7 tools, X erase, R turn, Z undo, F speed, U upgrades, M mute. Arrows move a cursor; Shift+arrows lays belt.</p>' +
      '<div class="mrow"><button class="mb" id="mBack">Back to the mill</button><button class="mb ghost" id="mMute">' + (st.muted ? 'Sound off' : 'Sound on') + '</button></div>' +
      '<div class="mrow"><button class="mb danger" id="mClear">Clear the board</button><button class="mb danger" id="mNew">Start over</button></div>');
    { const rw = $('mMute'); if (rw && rw.parentNode) rw.parentNode.appendChild(GK.ui.prefsButton({ className: 'mb ghost', panel: { text: true, tips: false } })); }
    $('mBack').onclick = () => this.closeModal();
    $('mMute').onclick = () => this.toggleMute();
    const confirmBtn = (id, label, fn) => { const el = $(id); let armed = false; el.onclick = () => { if (!armed) { armed = true; el.textContent = 'Tap again to ' + label.toLowerCase(); setTimeout(() => { armed = false; if (el.isConnected) el.textContent = label; }, 3000); return; } fn(); }; };
    confirmBtn('mClear', 'Clear the board', () => { Input.snapshot(); Rules.applyBuildList(st, []); Game.changed(); this.closeModal(); this.toast('Board cleared. Undo brings it back.'); });
    confirmBtn('mNew', 'Start over', () => { Storage.wipe(); st = newState(); Input.undo = []; Game.afterLoad(); this.closeModal(); this.toast('<b>A fresh mill</b>Progress reset. Your best score stays.'); });
  },
};

/* =========================== Game loop =========================== */
let st = Storage.load() || newState();
const Game = {
  rt: 0, acc: 0, lastNow: 0, saveT: 0, dirty: false, coach: null,
  coachOn() { const C = this.coach; return !!(C && !C.done && C.el && C.el.style.display !== 'none'); },
  changed() { this.dirty = true; this.save(); },
  save() { Storage.save(st); this.dirty = false; this.saveT = 0; },
  afterLoad() { Audio.muted = st.muted; UI.last = {}; UI.buildTools(); UI.refresh(); Renderer.buildStatic(); if (Audio.ctx) { Audio.setMuted(st.muted); Audio.setPad(Rules.order(st).order); } },
  layout() {
    const stage = $('stage'), r = stage.getBoundingClientRect();
    Renderer.resize(Math.max(100, r.width), Math.max(100, r.height - 4));
  },
  handleEvents() {
    const evs = st.ev; if (!evs.length) return; st.ev = [];
    let delivered = 0;
    for (const ev of evs) {
      if (ev.k === 'deliver') { delivered++; if (delivered <= 6) { Renderer.onDeliver(ev, this.rt); Audio.sing(ev.s, ev.match); } }
      else if (ev.k === 'craft') Renderer.crafts[ev.i] = 1;
      else if (ev.k === 'tier') {
        const t = ev.tier, unlocked = TOOLS.filter(x => x.tier === t).map(x => x.name), woke = WELLS.filter(w => w.tier === t).length;
        const bits = []; if (unlocked.length) bits.push(unlocked.join(' + ') + ' unlocked'); if (woke) bits.push(woke + ' well' + (woke > 1 ? 's' : '') + ' woke'); if (t === 2) bits.push('Upgrades open');
        UI.toast('<b>' + (t <= TIERS.length ? 'Tier ' + t + ' sung' : 'Song complete') + '</b>+♪' + fmt(ev.bonus) + (bits.length ? ' · ' + bits.join(' · ') : ''));
        Renderer.shake = 7 * GK.prefs.motionScale(); const [hx, hy] = Renderer.hubCenter(); Renderer.burst(hx, hy, ev.order.split('').map(c => COLORS[c].hex).concat([Theme.brass]), 40, Renderer.cs * 5);
        Audio.chord(ev.order.split(''), true); Audio.setPad(Rules.order(st).order);
        $('bar').classList.add('flash'); setTimeout(() => $('bar').classList.remove('flash'), 500);
        UI.buildTools(); UI.hintUntil = 0; this.save();
      }
      else if (ev.k === 'buy') UI.refresh();
    }
  },
  frame(now) {
    const dt = Math.min(0.1, Math.max(0, (now - this.lastNow) / 1000)); this.lastNow = now; this.rt += dt;
    this.acc += dt * CONFIG.SPEEDS[st.speedIdx];
    let n = 0; while (this.acc >= CONFIG.STEP && n < CONFIG.MAX_STEPS_PER_FRAME) { Rules.step(st, CONFIG.STEP); this.acc -= CONFIG.STEP; n++; }
    if (n >= CONFIG.MAX_STEPS_PER_FRAME) this.acc = 0;
    this.handleEvents();
    Renderer.draw(st, this.rt, dt);
    UI.refresh(); Audio.tick();
    this.saveT += dt; if (this.saveT > CONFIG.AUTOSAVE_S) this.save();
    requestAnimationFrame(t => this.frame(t));
  },
  start() {
    Audio.muted = st.muted;
    Renderer.init($('board')); UI.init(); Input.bind($('board'));
    this.layout(); window.addEventListener('resize', () => this.layout());
    if (window.visualViewport) window.visualViewport.addEventListener('resize', () => this.layout());
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.save(); });
    window.addEventListener('pagehide', () => this.save());
    UI.selectTool('belt'); UI.hintUntil = 0;
    GK.studio();
    GK.prefs.on(k => { if (k === 'text' || k === 'all') { this.layout(); UI.drawOrder(Rules.order(st).order); } });
    this.coach = GK.coach.create('songmill-first', [{ target: () => { const r = Renderer.cv.getBoundingClientRect(), w = WELLS[0], cs = Renderer.cs; return r && r.width ? { x: r.left + (w.x + 0.5) * cs, y: r.top + (w.y + 0.5) * cs, r: Math.max(24, cs * 0.75) } : null; }, done: () => st.tier > 0 || st.life.strands > 0 || st.grid.some(c => c && c.t === 'belt') }], { when: () => !UI.modalOpen });
    GK.wired('motion', 'tier shake, bead bursts, hub wheel kicks, build pops; Still also stops the hub wheel; toast and bar transitions follow Calm/Still');
    GK.wired('text', 'page CSS scaled (header capped at 125%, tool labels fixed at 12px); canvas gain floaters floored; order-strip bead letters left at 12px');
    if (st.tier === 0 && st.life.strands === 0 && !Rules.buildList(st).length) setTimeout(() => UI.toast('<b>Songmill</b>Wells bubble beads. The Mill sings whatever you feed it.'), 350);
    this.lastNow = performance.now();
    requestAnimationFrame(t => this.frame(t));
  },
};

// Hook for automated tests.
window.__songmill = { get st() { return st; }, set st(v) { st = v; Game.afterLoad(); }, Rules, CONFIG, TIERS, WELLS, Input, UI, Renderer, Game, newState };
Game.start();
})();
</script>
