// ============================================================ audio
var AU={ctx:null,master:null,noise:null,on:false,musicT:0,step:0,fight:false};
function ensureAudio(){
  if(AU.ctx||!isBrowser)return;
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    AU.ctx=new AC();AU.master=AU.ctx.createGain();AU.master.gain.value=save.muted?0:0.9;AU.master.connect(AU.ctx.destination);
    var len=AU.ctx.sampleRate|0;var buf=AU.ctx.createBuffer(1,len,AU.ctx.sampleRate);var d=buf.getChannelData(0);for(var i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noise=buf;
    AU.on=true;AU.musicT=AU.ctx.currentTime+0.1;
  }catch(e){AU.ctx=null;}
}
function resumeAudio(){if(AU.ctx&&AU.ctx.state==='suspended'){try{AU.ctx.resume();}catch(e){}}}
function tone(freq,dur,type,vol,slide,when){
  if(!AU.on)return;try{
    var c=AU.ctx,t=when||c.currentTime;var o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(freq,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+dur+0.02);
  }catch(e){}
}
function noise(dur,vol,hp,when){
  if(!AU.on)return;try{
    var c=AU.ctx,t=when||c.currentTime;var s=c.createBufferSource();s.buffer=AU.noise;var g=c.createGain();var f=c.createBiquadFilter();f.type=hp?'highpass':'lowpass';f.frequency.value=hp||1200;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(AU.master);s.start(t);s.stop(t+dur+0.02);
  }catch(e){}
}
var SFX={

  sell:function(){tone(500,0.08,'triangle',0.12,250);},
  reroll:function(){noise(0.06,0.15,2500);tone(300,0.05,'square',0.06);},
  merge:function(n){var t=AU.ctx?AU.ctx.currentTime:0,k=GK.audio.ladder(n||0);[523,659,784,1046].forEach(function(f,i){tone(f*k,0.18,'triangle',0.16,0,t+i*0.06);});noise(0.2,0.08,3000,t+0.1);},
  hit:function(){tone(180,0.06,'square',0.14,90);noise(0.04,0.18,1800);},
  crit:function(){tone(320,0.12,'sawtooth',0.18,80);noise(0.1,0.25,900);},

  shot:function(){tone(900,0.05,'square',0.06,1500);},

  dodge:function(){noise(0.05,0.08,4000);},
  fight:function(){var t=AU.ctx?AU.ctx.currentTime:0;tone(196,0.15,'square',0.18,0,t);tone(262,0.15,'square',0.18,0,t+0.12);tone(392,0.3,'square',0.2,0,t+0.24);},
  win:function(n){var t=AU.ctx?AU.ctx.currentTime:0,k=GK.audio.ladder(n||0);[523,659,784,1046,1318].forEach(function(f,i){tone(f*k,0.22,'square',0.14,0,t+i*0.08);});},
  lose:function(){var t=AU.ctx?AU.ctx.currentTime:0;[392,330,262,196].forEach(function(f,i){tone(f,0.3,'sawtooth',0.14,0,t+i*0.14);});},
  unlock:function(){var t=AU.ctx?AU.ctx.currentTime:0;[659,784,988,1318,1568].forEach(function(f,i){tone(f,0.3,'triangle',0.18,0,t+i*0.07);});},
  heart:function(){tone(150,0.4,'sawtooth',0.2,60);noise(0.3,0.3,0);}
};
var BASS=[110,110,131,131,98,98,131,147];
var LEAD=[0,440,0,523,587,0,659,0,523,0,440,0,392,0,440,0];
var LEAD2=[659,0,587,0,523,0,587,659,0,784,0,659,0,523,0,440];
function musicTick(){
  if(!AU.on||G.paused)return;
  var c=AU.ctx;var stepLen=0.125;
  while(AU.musicT<c.currentTime+0.25){
    var t=AU.musicT,s=AU.step;var fight=(G.screen==='game'&&G.phase==='fight');
    if(s%2===0){tone(BASS[(s>>2)%BASS.length],0.2,'triangle',fight?0.11:0.08,0,t);}
    var mel=(fight?LEAD2:LEAD)[s%16];if(mel)tone(mel,0.12,fight?'square':'triangle',fight?0.05:0.035,0,t);
    if(fight){if(s%4===0)tone(70,0.12,'sine',0.25,35,t);if(s%2===1)noise(0.03,0.06,6000,t);}
    else if(s%8===4)noise(0.03,0.03,5000,t);
    AU.musicT+=stepLen;AU.step=(s+1)%64;
  }
}
function setMuted(m){save.muted=m;writeSave();if(AU.master)AU.master.gain.value=m?0:0.9;}

// ============================================================ game state
var TIMER=20,FIGHT_MAX=16,RESULT_T=1.5;
var G={screen:'title',phase:'shop',round:1,lives:3,gold:0,streak:0,score:0,amberRun:0,roundsWon:0,
  board:[null,null,null,null,null,null],bench:[null,null,null,null],shop:[],boardMax:3,enemy:[null,null,null,null,null,null],
  enemyTribes:{},timer:TIMER,fight:null,sel:null,freeReroll:false,firstBuy:false,firstFight:false,shake:0,hitstop:0,
  particles:[],nums:[],toasts:[],resultT:0,result:null,paused:false,time:0,unlockedNow:[],newBest:false,introT:0,flashT:0,fastMode:false,
  dragInfo:null,lastRoundLoss:false,roundReached:1};
var uidc=1;
function boardMaxFor(r){return Math.min(6,3+Math.floor((r-1)/2));}
function boardCount(){var n=0;for(var i=0;i<6;i++)if(G.board[i])n++;return n;}
function enemyMult(r){return 1+0.05*(r-1)+(r>12?0.07*(r-12):0);}
function costOdds(r){
  if(r<=2)return [0.7,0.3,0];if(r<=4)return [0.5,0.4,0.1];if(r<=6)return [0.4,0.4,0.2];if(r<=9)return [0.32,0.4,0.28];return [0.22,0.4,0.38];
}
function ownedUnits(){var a=[];for(var i=0;i<6;i++)if(G.board[i])a.push(G.board[i]);for(i=0;i<4;i++)if(G.bench[i])a.push(G.bench[i]);return a;}
function tribeCounts(list){var c={};list.forEach(function(u){if(!u)return;var t=DEFS[u.id].tribe;c[t]=(c[t]||0)+1;});return c;}
function synLevel(n){return n>=3?2:n>=2?1:0;}
function playerTribes(){var a=[];for(var i=0;i<6;i++)if(G.board[i])a.push(G.board[i]);return tribeCounts(a);}

function toast(txt,color,big){G.toasts.push({txt:txt,color:color||'#fff',t:0,dur:big?1.6:1.1,big:!!big});}
function shake(a){G.shake=Math.max(G.shake,a);}

function newRun(){
  G.screen='game';G.phase='shop';G.round=1;G.roundReached=1;G.lives=3+(hasUnlock('heart')?1:0);G.gold=10+(hasUnlock('gold')?2:0);
  G.streak=0;G.score=0;G.amberRun=0;G.roundsWon=0;G.board=[null,null,null,null,null,null];G.bench=[null,null,null,null];G.shop=[];
  G.fight=null;G.sel=null;G.particles=[];G.nums=[];G.toasts=[];G.result=null;G.unlockedNow=[];G.newBest=false;G.fastMode=false;G.lastRoundLoss=false;
  startRound();
}
function startRound(){
  G.phase='shop';G.boardMax=boardMaxFor(G.round);G.sel=null;
  if(G.round>1){
    var inc=5+(G.streak>=2?1:0)+(G.streak>=4?1:0)+(G.round>=4?1:0)+(G.round>=7?1:0)+(G.round>=10?1:0)+(G.lastRoundLoss?1:0);
    G.gold+=inc;toast('+'+inc+' gold','#ffd23f');
  }
  G.freeReroll=hasUnlock('reroll');
  genEnemy();rollShop();G.timer=TIMER;G.introT=1.4;
  if(G.round%5===0)toast('BOSS ROUND!','#ff4060',true);
}
function rollShop(){
  var n=hasUnlock('shop5')?5:4;var odds=costOdds(G.round);var owned=ownedUnits();
  G.shop=[];
  for(var i=0;i<n;i++){
    var r=R(),cost=r<odds[0]?1:r<odds[0]+odds[1]?2:3;
    var cand=UNITS.filter(function(u){return u.cost===cost&&unitUnlocked(u.id);});
    if(!cand.length)cand=UNITS.filter(function(u){return u.cost===2&&unitUnlocked(u.id);});
    var def=pick(cand);
    // merge pity: lean toward owned bugs of same cost
    if(owned.length&&R()<0.28){var ow=owned.filter(function(o){return DEFS[o.id].cost===cost&&o.star<3;});if(ow.length)def=DEFS[pick(ow).id];}
    G.shop.push({id:def.id,cost:def.cost});
  }
}
function genEnemy(){
  var r=G.round,n=boardMaxFor(r),em=enemyMult(r);
  var A=pick(TRIBE_KEYS),B=pick(TRIBE_KEYS.filter(function(t){return t!==A;}));
  var maxCost=r<=2?2:3;var picks=[],used={};
  var nA=Math.ceil(n*0.6);
  for(var i=0;i<n;i++){
    var tribe=i<nA?A:B;
    var cand=UNITS.filter(function(u){return u.tribe===tribe&&u.cost<=maxCost&&!used[u.id]&&!u.bossOnly;});
    if(r<=1)cand=cand.filter(function(u){return u.cost<=1;})||cand;
    if(!cand.length)cand=UNITS.filter(function(u){return u.tribe===tribe&&!u.bossOnly;});
    if(!cand.length)cand=UNITS.filter(function(u){return !u.bossOnly;});
    var d=pick(cand);used[d.id]=true;
    var star=1;var p2=clamp((r-3)*0.12,0,0.85),p3=clamp((r-9)*0.1,0,0.7);
    if(R()<p2){star=2;if(R()<p3)star=3;}
    picks.push({id:d.id,star:star,em:em});
  }
  if(r%5===0){picks[0]={id:'hornet',star:Math.min(3,1+Math.floor(r/15)),em:em};}
  // placement: melee front, ranged back
  var slots=[null,null,null,null,null,null];
  var front=[0,1,2],back=[3,4,5];
  var melee=picks.filter(function(p){return DEFS[p.id].range==='melee';}),ranged=picks.filter(function(p){return DEFS[p.id].range==='ranged';});
  var order=[1,0,2];
  melee.forEach(function(p){var s=null;for(var k=0;k<3;k++){if(!slots[order[k]]){s=order[k];break;}}if(s===null)for(k=0;k<3;k++){if(!slots[3+order[k]]){s=3+order[k];break;}}if(s!==null)slots[s]=p;});
  ranged.forEach(function(p){var s=null;for(var k=0;k<3;k++){if(!slots[3+order[k]]){s=3+order[k];break;}}if(s===null)for(k=0;k<3;k++){if(!slots[order[k]]){s=order[k];break;}}if(s!==null)slots[s]=p;});
  G.enemy=slots;G.enemyTribes=tribeCounts(slots);
}
function findMergeTarget(id,star){
  for(var i=0;i<6;i++){var u=G.board[i];if(u&&u.id===id&&u.star===star&&u.star<3)return {z:'board',i:i};}
  for(i=0;i<4;i++){u=G.bench[i];if(u&&u.id===id&&u.star===star&&u.star<3)return {z:'bench',i:i};}
  return null;
}
function getAt(loc){return loc.z==='board'?G.board[loc.i]:G.bench[loc.i];}
function setAt(loc,u){if(loc.z==='board')G.board[loc.i]=u;else G.bench[loc.i]=u;}
function locPos(loc){if(loc.z==='board')return slotPos(0,loc.i);return benchPos(loc.i);}
function doMerge(loc,depth){
  var u=getAt(loc);u.star++;u.mergeT=0.6;
  var p=locPos(loc);burst(p.x,p.y,'#fff',18,120);burst(p.x,p.y,TRIBES[DEFS[u.id].tribe].color,14,90);
  G.nums.push({x:p.x,y:p.y-30,txt:'★ UP!',t:0,color:'#ffd23f',size:16});
  SFX.merge(depth||0);shake(4);
  // chain merge
  var again=null;
  var all=[];for(var i=0;i<6;i++)all.push({z:'board',i:i});for(i=0;i<4;i++)all.push({z:'bench',i:i});
  for(i=0;i<all.length;i++){var l=all[i];if(l.z===loc.z&&l.i===loc.i)continue;var v=getAt(l);if(v&&v.id===u.id&&v.star===u.star&&u.star<3){again=l;break;}}
  if(again){setAt(again,null);doMerge(loc,(depth||0)+1);}
}
function firstEmpty(def,prefer){
  if(boardCount()<G.boardMax){
    var pref=def.range==='melee'?[1,0,2,4,3,5]:[4,3,5,1,0,2];
    if(prefer)pref=prefer;
    for(var k=0;k<6;k++)if(!G.board[pref[k]])return {z:'board',i:pref[k]};
  }
  for(var i=0;i<4;i++)if(!G.bench[i])return {z:'bench',i:i};
  return null;
}
function buy(i,toLoc){
  if(G.screen!=='game'||G.phase!=='shop')return false;
  var card=G.shop[i];if(!card)return false;
  if(G.gold<card.cost){toast('Not enough gold','#ff6b6b');shake(2);return false;}
  var def=DEFS[card.id];
  var merge=findMergeTarget(card.id,1);
  if(toLoc){var tu=getAt(toLoc);if(tu){if(tu.id===card.id&&tu.star<3&&tu.star===1)merge=toLoc;else{toast('Slot taken','#ff6b6b');return false;}}
    else if(toLoc.z==='board'&&boardCount()>=G.boardMax){toast('Squad full ('+G.boardMax+')','#ff6b6b');return false;}}
  if(merge){
    G.gold-=card.cost;G.shop[i]=null;doMerge(merge);G.firstBuy=true;return true;
  }
  var loc=toLoc&&!getAt(toLoc)?toLoc:firstEmpty(def);
  if(!loc){toast('No room! Sell a bug','#ff6b6b');shake(2);return false;}
  G.gold-=card.cost;G.shop[i]=null;
  var u={uid:uidc++,id:def.id,star:1,popT:0.35};setAt(loc,u);
  var p=locPos(loc);burst(p.x,p.y,TRIBES[def.tribe].color,10,70);SFX.buy();G.firstBuy=true;
  return true;
}
function move(a,b){
  if(G.screen!=='game'||G.phase!=='shop')return false;
  if(a.z===b.z&&a.i===b.i)return false;
  var ua=getAt(a),ub=getAt(b);if(!ua)return false;
  if(ub&&ub.id===ua.id&&ub.star===ua.star&&ua.star<3){setAt(a,null);doMerge(b);return true;}
  if(b.z==='board'&&a.z==='bench'&&!ub&&boardCount()>=G.boardMax){toast('Squad full ('+G.boardMax+')','#ff6b6b');shake(2);return false;}
  setAt(a,ub);setAt(b,ua);SFX.tap();return true;
}
function sell(loc){
  if(G.screen!=='game'||G.phase!=='shop')return false;
  var u=getAt(loc);if(!u)return false;
  var val=DEFS[u.id].cost*u.star;G.gold+=val;setAt(loc,null);
  var p=locPos(loc);burst(p.x,p.y,'#ffd23f',8,60);toast('+'+val+' gold','#ffd23f');SFX.sell();
  if(G.sel&&G.sel.kind==='unit'&&G.sel.loc.z===loc.z&&G.sel.loc.i===loc.i)G.sel=null;
  return true;
}
function reroll(){
  if(G.screen!=='game'||G.phase!=='shop')return false;
  if(G.freeReroll){G.freeReroll=false;rollShop();SFX.reroll();return true;}
  if(G.gold<1){toast('Need 1 gold','#ff6b6b');shake(2);return false;}
  G.gold-=1;rollShop();SFX.reroll();return true;
}
function autoFillBoard(){
  if(boardCount()>0)return;
  for(var i=0;i<4&&boardCount()<G.boardMax;i++){if(G.bench[i]){var d=DEFS[G.bench[i].id];var loc=firstEmpty(d);if(loc&&loc.z==='board'){setAt(loc,G.bench[i]);G.bench[i]=null;}}}
}
function startFight(){
  if(G.screen!=='game'||G.phase!=='shop')return false;
  autoFillBoard();
  if(boardCount()===0){toast('Buy a bug first!','#ff6b6b');shake(3);G.timer=Math.max(G.timer,6);return false;}
  G.sel=null;G.firstFight=true;G.phase='fight';
  var units=[];
  var pt=playerTribes(),et=G.enemyTribes;
  for(var i=0;i<6;i++){if(G.board[i])units.push(makeCombatant(G.board[i],0,i,pt,1,G.board[i].uid));}
  for(i=0;i<6;i++){if(G.enemy[i])units.push(makeCombatant(G.enemy[i],1,i,et,G.enemy[i].em,-1-i));}
  G.fight={t:0,units:units,projs:[],over:false,speed:G.fastMode?2.4:1.5,result:null,hitstop:0,pdead:0,edead:0};
  SFX.fight();toast('FIGHT!','#fff',true);
  return true;
}
function makeCombatant(inst,side,slot,tribes,em,uid){
  var d=DEFS[inst.id];var sm=STAR_MULT[inst.star-1];var mult=sm*em;
  var u={uid:uid,id:d.id,def:d,star:inst.star,side:side,slot:slot,row:slot<3?0:1,col:slot%3,maxHp:Math.round(d.hp*mult),atk:d.atk*mult,aps:d.aps,
    armor:d.armor||0,ranged:d.range==='ranged',cd:0.3+R()*0.5,sm:sm,dead:false,deadT:0,flash:0,stun:0,slow:0,blind:0,
    poison:{dps:0,t:0},burn:{dps:0,t:0},dotAcc:0,lunge:null,target:null,dodge:0,crit:0,critMult:2,dmgMult:1,aspd:1,poisonHit:0,regen:0,
    healMult:1,reflect:0,weaken:false,charged:false,dartN:0,hits:0,bob:R()*6.28};
  u.hp=u.maxHp;u.baseArmor=u.armor;
  var L={};TRIBE_KEYS.forEach(function(t){L[t]=synLevel(tribes[t]||0);});
  var tr=d.tribe;
  if(L.swarm>=1&&tr==='swarm')u.aspd*=1.3;
  if(L.swarm>=2){if(tr!=='swarm')u.aspd*=1.3;else u.atk+=4*mult;}
  if(L.shell>=1)u.armor+=L.shell>=2?4:2;
  if(L.shell>=2&&tr==='shell')u.reflect=0.3;
  if(L.venom>=1)u.poisonHit=L.venom>=2?4:2;
  if(L.venom>=2)u.weaken=true;
  if(L.wing>=1&&tr==='wing')u.dodge=L.wing>=2?0.45:0.25;
  if(L.wing>=2&&tr!=='wing')u.dodge=0.2;
  if(L.hive>=1)u.regen=L.hive>=2?0.04:0.02;
  if(L.hive>=2)u.healMult=1.5;
  if(L.hunter>=1&&tr==='hunter')u.crit+=0.2;
  if(L.hunter>=2){if(tr!=='hunter')u.crit+=0.25;u.critMult=2.5;}
  if(d.scythe){u.crit+=0.35;u.critMult=Math.max(u.critMult,2.5);}
  u.baseArmor=u.armor;
  return u;
}
// ------------------------------------------------------------ combat sim
function alive(side){var a=[];var us=G.fight.units;for(var i=0;i<us.length;i++){if(!us[i].dead&&us[i].side===side)a.push(us[i]);}return a;}
function lowestFrac(list){var b=null,bf=9;for(var i=0;i<list.length;i++){var f=list[i].hp/list[i].maxHp;if(f<bf){bf=f;b=list[i];}}return b;}
function pickTarget(u,foes){
  if(!foes.length)return null;
  var taunt=null;for(var i=0;i<foes.length;i++)if(foes[i].def.taunt){taunt=foes[i];break;}
  if(u.def.ambush){var b=foes[0];for(i=1;i<foes.length;i++)if(foes[i].hp<b.hp)b=foes[i];return b;}
  var pool;
  if(!u.ranged){
    if(taunt)return taunt;
    pool=foes.filter(function(f){return f.row===0;});if(!pool.length)pool=foes;
  }else{
    if(u.def.snipe){pool=foes.filter(function(f){return f.row===1;});if(!pool.length)pool=foes;}else pool=foes;
  }
  var best=pool[0],bs=1e9;
  for(i=0;i<pool.length;i++){var f=pool[i];var s=Math.abs(f.col-u.col)*100+f.hp/f.maxHp*50+R()*20;if(s<bs){bs=s;best=f;}}
  return best;
}
function unitPos(u){
  var p=slotPos(u.side,u.slot);var x=p.x,y=p.y;
  if(u.lunge&&u.lunge.target){var tp=slotPos(u.lunge.target.side,u.lunge.target.slot);var k=Math.sin(Math.PI*clamp(u.lunge.t/u.lunge.dur,0,1))*0.55;x+=(tp.x-x)*k;y+=(tp.y-y)*k;}
  return {x:x,y:y};
}
function addPoison(t,dps,dur){t.poison.dps=Math.min(40,t.poison.dps+dps);t.poison.t=Math.max(t.poison.t,dur);}
function heal(from,tgt,amt){
  if(tgt.dead)return;amt=Math.round(amt*from.healMult);var before=tgt.hp;tgt.hp=Math.min(tgt.maxHp,tgt.hp+amt);var got=Math.round(tgt.hp-before);
  if(got>0){var p=unitPos(tgt);G.nums.push({x:p.x,y:p.y-20,txt:'+'+got,t:0,color:'#7dff9a',size:12});burst(p.x,p.y,'#7dff9a',4,40);SFX.heal();}
}
function impact(att,tgt,o){
  o=o||{};if(tgt.dead||att.dead)return;
  var tp=unitPos(tgt);
  if(att.blind>0&&R()<0.3){G.nums.push({x:tp.x,y:tp.y-22,txt:'MISS',t:0,color:'#bbb',size:11});return;}
  if(!att.def.pierce&&tgt.dodge>0&&R()<tgt.dodge){G.nums.push({x:tp.x,y:tp.y-22,txt:'DODGE',t:0,color:'#5ee1ff',size:11});SFX.dodge();return;}
  var mult=(o.mult||1)*att.dmgMult;
  if(att.poison.t>0&&o.weakenBy)mult*=0.8;
  if(att.def.finisher&&tgt.hp<tgt.maxHp*0.5)mult*=1.6;
  var crit=false;if(att.crit>0&&R()<att.crit){crit=true;mult*=att.critMult;}
  var stunT=0;
  if(att.def.charge&&!att.charged){att.charged=true;mult*=3;stunT=1;}
  if(att.def.tyrant)stunT=Math.max(stunT,0.4);
  var raw=att.atk*mult;
  var dmg=(att.def.ignoreArmor||o.ignoreArmor)?raw:raw-tgt.armor;
  dmg=Math.max(1,Math.round(dmg));
  tgt.hp-=dmg;tgt.flash=0.12;att.hits++;
  if(stunT>0)tgt.stun=Math.max(tgt.stun,stunT);
  if(tgt.def.harden)tgt.armor=Math.min(tgt.baseArmor+8,tgt.armor+1);
  var col=crit?'#ffd23f':(att.side===0?'#fff':'#ffb3b3');
  G.nums.push({x:tp.x+(R()-0.5)*16,y:tp.y-24,txt:(crit?'!':'')+dmg,t:0,color:col,size:crit?17:12});
  burst(tp.x,tp.y,crit?'#ffd23f':TRIBES[tgt.def.tribe].color,crit?10:5,crit?110:60);
  if(crit){shake(4);SFX.crit();}else{shake(dmg>25?2.5:1);SFX.hit();}
  if(o.melee&&tgt.reflect>0&&!tgt.dead){var rd=Math.round(dmg*tgt.reflect);if(rd>0){att.hp-=rd;att.flash=0.1;var ap=unitPos(att);G.nums.push({x:ap.x,y:ap.y-20,txt:rd,t:0,color:'#9bd84f',size:11});if(att.hp<=0)kill(att,tgt);}}
  if(att.dead)return;
  if(tgt.hp<=0){kill(tgt,att);return;}
  if(att.poisonHit>0)addPoison(tgt,att.poisonHit,3);
  if(att.def.sting)addPoison(tgt,4*att.sm,3);
  if(att.def.burn){tgt.burn.dps=Math.max(tgt.burn.dps,4*att.sm);tgt.burn.t=2;}
  if(att.def.web)tgt.slow=2;
  if(att.def.dust)tgt.blind=2;
}
function kill(u,killer){
  if(u.dead)return;u.dead=true;u.hp=0;u.deadT=0;u.lunge=null;
  var p=unitPos(u);burst(p.x,p.y,TRIBES[u.def.tribe].color,22,160);burst(p.x,p.y,'#fff',8,200);
  shake(u.def.bossOnly?14:7);G.fight.hitstop=Math.max(G.fight.hitstop,u.def.bossOnly?0.16:0.07);SFX.death();
  if(u.side===0)G.fight.pdead++;else G.fight.edead++;
  var allies=alive(u.side);
  if(u.def.gift){for(var i=0;i<allies.length;i++)heal(u,allies[i],20*u.sm);}
  for(i=0;i<allies.length;i++){if(allies[i].def.rally){allies[i].atk*=1.25;var ap=unitPos(allies[i]);G.nums.push({x:ap.x,y:ap.y-26,txt:'RALLY',t:0,color:'#ff7a3d',size:11});}}
}
function fireProj(u,t){
  var from=unitPos(u);
  G.fight.projs.push({x:from.x,y:from.y,from:u,target:t,t:0,dur:0.26,splash:u.def.dart&&(++u.dartN%3===0),color:TRIBES[u.def.tribe].color});
  SFX.shot();
}
function stepFight(dt){
  var F=G.fight;if(!F||F.over)return;
  var h=F.hitstop>0;if(h){F.hitstop-=dt;dt*=0.15;}
  F.t+=dt;
  var us=F.units;
  for(var i=0;i<us.length;i++){
    var u=us[i];
    if(u.dead){u.deadT+=dt;continue;}
    if(u.stun>0)u.stun-=dt;if(u.slow>0)u.slow-=dt;if(u.blind>0)u.blind-=dt;if(u.flash>0)u.flash-=dt;
    if(u.regen>0&&u.hp<u.maxHp)u.hp=Math.min(u.maxHp,u.hp+u.maxHp*u.regen*dt);
    var dot=0;
    if(u.poison.t>0){u.poison.t-=dt;dot+=u.poison.dps*dt;if(u.poison.t<=0)u.poison.dps=0;}
    if(u.burn.t>0){u.burn.t-=dt;dot+=u.burn.dps*dt;if(u.burn.t<=0)u.burn.dps=0;}
    if(dot>0){u.hp-=dot;u.dotAcc+=dot;if(u.dotAcc>=6){var p=unitPos(u);G.nums.push({x:p.x+(R()-0.5)*14,y:p.y-18,txt:Math.round(u.dotAcc),t:0,color:u.poison.t>0?'#c57bff':'#ff7a3d',size:10});burst(p.x,p.y,u.poison.t>0?'#c57bff':'#ff7a3d',2,30);u.dotAcc=0;}
      if(u.hp<=0){kill(u,null);continue;}}
    if(u.lunge){u.lunge.t+=dt;if(!u.lunge.hit&&u.lunge.t>=u.lunge.dur*0.45){u.lunge.hit=true;impact(u,u.lunge.target,{melee:true,weakenBy:u.lunge.target.weaken});}if(u.dead)continue;if(u.lunge&&u.lunge.t>=u.lunge.dur)u.lunge=null;}
    if(u.stun>0)continue;
    u.cd-=dt*u.aps*u.aspd*(u.slow>0?0.6:1);
    if(u.cd<=0&&!u.lunge){
      var foes=alive(1-u.side);if(!foes.length)continue;
      if(u.def.mend){var allies=alive(u.side);var weak=lowestFrac(allies);if(weak&&weak.hp<weak.maxHp*0.6){heal(u,weak,8*u.sm);u.cd=1;continue;}}
      if(!u.target||u.target.dead||u.def.ambush)u.target=pickTarget(u,foes);
      var t=u.target;if(!t)continue;
      u.cd=1;
      if(u.ranged)fireProj(u,t);else u.lunge={t:0,dur:0.3,target:t,hit:false};
    }
  }
  for(i=F.projs.length-1;i>=0;i--){
    var pr=F.projs[i];pr.t+=dt;
    if(pr.t>=pr.dur){
      F.projs.splice(i,1);
      var a=pr.from,tg=pr.target;
      if(a.dead)continue;
      if(tg.dead){var nf=alive(1-a.side);if(!nf.length)continue;tg=pickTarget(a,nf);if(!tg)continue;}
      if(pr.splash){var row=alive(1-a.side).filter(function(f){return f.row===tg.row;});for(var k=0;k<row.length;k++)impact(a,row[k],{weakenBy:row[k].weaken});}
      else impact(a,tg,{weakenBy:tg.weaken});
      if(a.def.glow&&!a.dead){var al=alive(a.side);var w=lowestFrac(al);if(w&&w.hp<w.maxHp)heal(a,w,5*a.sm);}
    }
  }
  var a0=alive(0).length,a1=alive(1).length;
  if(a0===0||a1===0||F.t>FIGHT_MAX)endFight(a0,a1);
}
function hpFrac(side){var s=0,m=0;G.fight.units.forEach(function(u){if(u.side===side){s+=Math.max(0,u.hp);m+=u.maxHp;}});return m?s/m:0;}
function endFight(a0,a1){
  var F=G.fight;F.over=true;var res;
  if(a1===0&&a0>0)res='win';else if(a0===0&&a1>0)res='loss';else if(a0===0&&a1===0)res='draw';
  else{var p=hpFrac(0),e=hpFrac(1);res=p>e+0.001?'win':(e>p+0.001?'loss':'draw');}
  F.result=res;G.phase='result';G.resultT=RESULT_T;G.result=res;
  var perfect=res==='win'&&F.pdead===0;
  if(res==='win'){
    G.streak++;G.roundsWon++;G.lastRoundLoss=false;
    var pts=G.round*10+(perfect?G.round*5:0);G.score+=pts;
    var amber=1+(G.round%5===0?2:0)+(perfect?1:0);G.amberRun+=amber;
    toast(perfect?'PERFECT!':'VICTORY','#7dff9a',true);SFX.win(G.streak-1);
  }else if(res==='loss'){
    G.streak=0;G.lives--;G.lastRoundLoss=true;toast('DEFEAT','#ff6b6b',true);SFX.lose();shake(10);
  }else{toast('DRAW','#ddd',true);G.lastRoundLoss=false;}
  G.roundReached=G.round;
}
function finishResult(){
  if(G.lives<=0){endRun();return;}
  G.round++;G.roundReached=G.round;startRound();
}
function endRun(){
  G.screen='gameover';G.fight=null;
  var before=save.amber;
  save.amber+=G.amberRun;save.runs++;
  G.newBest=false;
  if(G.roundsWon>save.bestRound){save.bestRound=G.roundsWon;G.newBest=true;}
  if(G.score>save.bestScore){save.bestScore=G.score;G.newBest=true;}
  G.unlockedNow=UNLOCKS.filter(function(u){return before<u.at&&save.amber>=u.at;});
  writeSave();
  if(G.unlockedNow.length)SFX.unlock();else SFX.heart();
  G.goT=0;
}

// ============================================================ update
function burst(x,y,color,n,speed){
  if(G.particles.length>400)return;
  n=Math.round(n*GK.prefs.motionScale());
  for(var i=0;i<n;i++){var a=R()*6.283,s=speed*(0.4+R()*0.8);G.particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life:0.35+R()*0.35,t:0,color:color,size:2+R()*3});}
}
function update(dt){
  if(G.paused)return;
  dt=Math.min(dt,0.1)*GK.prefs.speed();G.time+=dt;
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*30);
  if(G.introT>0)G.introT-=dt;
  for(var i=G.particles.length-1;i>=0;i--){var p=G.particles[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=240*dt;p.vx*=0.98;if(p.t>=p.life)G.particles.splice(i,1);}
  for(i=G.nums.length-1;i>=0;i--){var n=G.nums[i];n.t+=dt;n.y-=28*dt;if(n.t>0.8)G.nums.splice(i,1);}
  for(i=G.toasts.length-1;i>=0;i--){var t=G.toasts[i];t.t+=dt;if(t.t>t.dur)G.toasts.splice(i,1);}
  if(G.screen==='game'){
    if(G.phase==='shop'){
      G.timer-=dt;
      if(G.timer<=0){G.timer=0;if(!startFight())G.timer=6;}
      for(i=0;i<6;i++){var u=G.board[i];if(u){if(u.popT>0)u.popT-=dt;if(u.mergeT>0)u.mergeT-=dt;}}
      for(i=0;i<4;i++){u=G.bench[i];if(u){if(u.popT>0)u.popT-=dt;if(u.mergeT>0)u.mergeT-=dt;}}
    }else if(G.phase==='fight'){
      var F=G.fight;var sdt=dt*F.speed;
      while(sdt>0&&!F.over){var st=Math.min(sdt,1/60);stepFight(st);sdt-=st;}
    }else if(G.phase==='result'){
      G.resultT-=dt;
      if(G.fight){for(i=0;i<G.fight.units.length;i++){var cu=G.fight.units[i];if(cu.dead)cu.deadT+=dt;if(cu.flash>0)cu.flash-=dt;}}
      if(G.resultT<=0)finishResult();
    }
  }else if(G.screen==='gameover'){G.goT=(G.goT||0)+dt;}
  if(isBrowser)musicTick();
}

var AY=46,CELL=70,COLX=[117,195,273];
var ROWY={e1:AY+42,e0:AY+116,p0:AY+190,p1:AY+264};

  }
  if(G.sel&&G.sel.kind==='shop'){var ok=buy(G.sel.i,loc);G.sel=null;if(ok)return;}
  if(u){G.sel={kind:'unit',loc:loc};SFX.tap();}else G.sel=null;
}
var ptr={down:false,sx:0,sy:0,x:0,y:0,hit:null,moved:false};
function pointerDown(e){
  ensureAudio();resumeAudio();
  if(G.paused){G.paused=false;return;}
  var p=toV(e);p.y-=G.layoutOffY||0;
  ptr.down=true;ptr.sx=p.x;ptr.sy=p.y;ptr.x=p.x;ptr.y=p.y;ptr.moved=false;ptr.hit=hitAt(p.x,p.y);G.dragInfo=null;
}
function pointerMove(e){
  if(!ptr.down)return;var p=toV(e);p.y-=G.layoutOffY||0;ptr.x=p.x;ptr.y=p.y;
  var d=Math.hypot(p.x-ptr.sx,p.y-ptr.sy);
  if(!ptr.moved&&d>10){ptr.moved=true;if(ptr.hit&&ptr.hit.drag&&G.phase==='shop'&&G.screen==='game'){G.dragInfo={type:ptr.hit.drag.type,loc:ptr.hit.drag.loc,i:ptr.hit.drag.i,x:p.x,y:p.y};}}
  if(G.dragInfo){G.dragInfo.x=p.x;G.dragInfo.y=p.y;}
}
function pointerUp(e){
  if(!ptr.down)return;ptr.down=false;
  var p=toV(e);p.y-=G.layoutOffY||0;
  if(G.dragInfo){
    var tgt=hitAt(p.x,p.y);var di=G.dragInfo;G.dragInfo=null;
    if(tgt){
      if(di.type==='unit'){if(tgt.kind==='slot')move(di.loc,tgt.loc);else if(tgt.kind==='bin')sell(di.loc);}
      else if(di.type==='shop'){if(tgt.kind==='slot')buy(di.i,tgt.loc);else if(tgt.kind==='card'&&tgt.i===di.i)buy(di.i);}
    }
    G.sel=null;return;
  }
  if(!ptr.moved){
    var h=hitAt(p.x,p.y);
    if(h&&h.onTap&&ptr.hit&&h.kind===ptr.hit.kind)h.onTap();
    else if(!h||h.kind==='block'){if(G.screen==='game'&&G.sel){G.sel=null;}}
  }
}
function keyDown(e){
  if(e.repeat||document.querySelector('.gk-prefs'))return;var k=e.key;
  ensureAudio();resumeAudio();
  if(G.paused){G.paused=false;return;}
  if(G.screen==='title'){if(k==='Enter'||k===' '){newRun();e.preventDefault();}if(k==='m'||k==='M')setMuted(!save.muted);return;}
  if(G.screen==='gameover'){if(k==='Enter'||k===' '){newRun();e.preventDefault();}return;}
  if(k==='m'||k==='M'){setMuted(!save.muted);return;}
  if(G.phase==='shop'){
    if(k>='1'&&k<='5'){var i=+k-1;if(G.shop[i])buy(i);}
    else if(k==='r'||k==='R')reroll();
    else if(k==='f'||k==='F'||k==='Enter'||k===' '){startFight();e.preventDefault();}
    else if(k==='Escape')G.sel=null;
    else if((k==='s'||k==='S'||k==='Delete'||k==='Backspace')&&G.sel&&G.sel.kind==='unit'){sell(G.sel.loc);G.sel=null;}
  }else if(G.phase==='fight'){if(k==='f'||k==='F'||k===' '){G.fastMode=!G.fastMode;if(G.fight)G.fight.speed=G.fastMode?2.4:1.5;e.preventDefault();}}
}

// ============================================================ boot
var last=0,GEAR=null,COACH=null,gearOn=null;
function frame(ts){
  var dt=last?(ts-last)/1000:0.016;last=ts;
  if(GEAR){var gs=G.screen!=='game'||G.paused;if(gs!==gearOn){gearOn=gs;GEAR.show(gs);}}
  update(dt);render();
  requestAnimationFrame(frame);
}
if(isBrowser){
  canvas=document.getElementById('c');ctx=canvas.getContext('2d');
  resize();
  window.addEventListener('resize',resize);window.addEventListener('orientationchange',function(){setTimeout(resize,100);});
  if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);
  canvas.addEventListener('pointerdown',function(e){e.preventDefault();pointerDown(e);try{canvas.setPointerCapture(e.pointerId);}catch(_){}},{passive:false});
  canvas.addEventListener('pointermove',function(e){e.preventDefault();pointerMove(e);},{passive:false});
  canvas.addEventListener('pointerup',function(e){e.preventDefault();pointerUp(e);},{passive:false});
  canvas.addEventListener('pointercancel',function(){ptr.down=false;G.dragInfo=null;});
  ['touchstart','touchmove','touchend','gesturestart','dblclick','contextmenu'].forEach(function(ev){document.addEventListener(ev,function(e){if(e.target&&e.target.closest&&e.target.closest('.gk-gear,.gk-sheet,.gk-coach'))return;if(e.cancelable)e.preventDefault();},{passive:false});});
  window.addEventListener('keydown',keyDown);
  document.addEventListener('visibilitychange',function(){if(document.hidden){if(G.screen==='game')G.paused=true;if(AU.ctx){try{AU.ctx.suspend();}catch(e){}}}else{last=0;if(AU.ctx){AU.musicT=AU.ctx.currentTime+0.1;}}});
  window.addEventListener('blur',function(){if(G.screen==='game'&&G.phase!=='shop')G.paused=true;});
  GK.studio();
  var gearWas=false;
  GEAR=GK.ui.gear({corner:'tl',panel:{text:true,speed:true},onOpen:function(){gearWas=G.paused;G.paused=true;},onClose:function(){G.paused=gearWas;}});
  COACH=GK.coach.create('bug-brawl-first',[{text:'Tap a bug to buy it',done:function(){return G.firstBuy;},target:function(){for(var i=0;i<G.shop.length;i++)if(G.shop[i]){var r=shopRect(i);return {x:offX+(r.x+r.w/2)*S,y:offY+((G.layoutOffY||0)+r.y+r.h/2)*S,r:(r.w/2+8)*S};}return null;}}],{when:function(){return G.screen==='game'&&G.phase==='shop'&&!G.paused&&!G.dragInfo;}});
  GK.wired('motion','shake, particle bursts, toast punch, title pulse');GK.wired('speed','whole update: shop timer and fights');GK.wired('text','canvas txt() floor and size; star and heart icons left as drawn');GK.wired('combo','merge chain and win streak jingles');
  requestAnimationFrame(frame);
}
// test API
var API={G:G,DEFS:DEFS,UNITS:UNITS,UNLOCKS:UNLOCKS,TRIBES:TRIBES,save:save,newRun:newRun,buy:buy,move:move,sell:sell,reroll:reroll,startFight:startFight,update:update,render:function(){if(ctx)render();},
  setRng:function(f){rng=f;},boardMaxFor:boardMaxFor,enemyMult:enemyMult,getAt:getAt,boardCount:boardCount,playerTribes:playerTribes,
  setCanvas:function(c){canvas=c;ctx=c.getContext('2d');},hitAt:function(x,y){return hitAt(x,y);},hits:function(){return hits;},endRun:endRun};
if(typeof window!=='undefined')window.BB=API;
if(typeof module!=='undefined'&&module.exports)module.exports=API;
})();
</script>
