<title>Lowbell</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A slow-reveal incremental. An iron bell at the bottom of a drowned world. Someone keeps knocking.">
<style>
/* Layout: one narrow column of story on a phone (log above, the bell's controls below); two columns on wide screens. A deliberately dark world that only turns to daylight at the ending. */
:root{
  --abyss:#04080a;        /* the water */
  --ink:#cfdcd6;          /* text */
  --dim:#7f948e;          /* secondary text */
  --faint:#34464a;        /* hairlines */
  --brass:#dcb56c;        /* lamp light, the one accent */
  --rust:#cf7a5f;         /* danger */
  --kelp:#8db898;         /* growth */
  --panel:rgba(8,16,18,.62);
  --sky:#eef4ec;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--abyss);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.45;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
#bgc{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:940px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 40px;display:flex;flex-direction:column;gap:12px}
#app.shake{animation:shake .28s}
@keyframes shake{20%{transform:translate(-4px,1px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,2px)}80%{transform:translate(2px,0)}}
header{display:flex;align-items:center;gap:10px}
.brand{font-size:22px;letter-spacing:.32em;text-transform:lowercase;color:var(--dim);flex:1;min-width:0;transition:color 2s}
.brand.lit{color:var(--brass)}
#day{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.08em}
.icon{background:none;border:1px solid var(--faint);color:var(--dim);font:inherit;font-size:13px;border-radius:2px;min-height:34px;padding:0 10px;cursor:pointer}
.icon:focus-visible,.btn:focus-visible,.tab:focus-visible,.mini:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
nav#tabs{display:flex;gap:4px;flex-wrap:wrap}
nav#tabs:empty{display:none}
.tab{background:none;border:none;border-bottom:1px solid transparent;color:var(--dim);font:inherit;font-size:15px;letter-spacing:.14em;padding:6px 10px 5px;cursor:pointer;text-transform:lowercase}
.tab.on{color:var(--ink);border-bottom-color:var(--brass)}
.tab.new{color:var(--brass)}
.tab:disabled{opacity:.35;cursor:default}
#grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:760px){#grid{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)} #logWrap{order:0;max-height:none!important;height:calc(100vh - 140px);position:sticky;top:10px}}
#logWrap{position:relative;max-height:34vh;min-height:96px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
#log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
#log li{font-size:16px;line-height:1.4;max-width:34em;animation:inlog .9s ease-out both}
#log li.say{color:var(--brass);font-style:italic}
#log li.warn{color:var(--rust)}
#log li.lore{font-variant:small-caps;letter-spacing:.04em;color:#e3d9bf}
@keyframes inlog{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
#panel{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{margin:0;font-weight:normal;font-size:12px;letter-spacing:.24em;color:var(--dim);text-transform:lowercase;font-family:var(--serif)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--faint);color:var(--ink);font:inherit;font-size:16px;letter-spacing:.04em;min-height:46px;padding:8px 16px;border-radius:2px;cursor:pointer;text-align:left;touch-action:manipulation;transition:border-color .3s,opacity .3s;user-select:none;-webkit-user-select:none}
.btn .cd{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(220,181,108,.13);pointer-events:none}
.btn .lbl{position:relative}
.btn .cost{position:relative;display:block;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:0;margin-top:2px}
.btn.off{opacity:.42;cursor:default}
.btn.big{min-width:130px}
.btn.glow{border-color:var(--brass);box-shadow:0 0 18px rgba(220,181,108,.18)}
.btn.done{opacity:.5;border-style:dashed;cursor:default}
.btn:not(.off):not(.done):active{border-color:var(--brass)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.items .btn{width:100%}
.meter{display:flex;flex-direction:column;gap:4px}
.meter .top{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);letter-spacing:.12em}
.meter .top b{font-weight:normal;font-family:var(--mono);letter-spacing:0;color:var(--ink)}
.bar{height:6px;background:rgba(255,255,255,.05);border:1px solid var(--faint);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--kelp);transition:width .25s linear,background .6s}
.bar.low i{background:var(--rust)}
.stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:2px 14px;font-size:14px}
.stores div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px solid rgba(52,70,74,.5);padding:3px 0}
.stores span:last-child{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.stores em{font-style:normal;color:var(--dim);font-size:11px;margin-left:4px}
.note{font-size:14px;color:var(--dim);font-style:italic;margin:0}
.jobs{display:flex;flex-direction:column;gap:4px}
.job{display:flex;align-items:center;gap:8px;font-size:15px;border-bottom:1px solid rgba(52,70,74,.5);padding:2px 0}
.job .nm{flex:1;min-width:0}
.job .nm small{display:block;color:var(--dim);font-family:var(--mono);font-size:11px}
.job .n{font-family:var(--mono);min-width:2ch;text-align:center}
.mini{background:none;border:1px solid var(--faint);color:var(--ink);font:inherit;font-size:18px;width:42px;height:38px;border-radius:2px;cursor:pointer;touch-action:manipulation}
.mini.off{opacity:.3;cursor:default}
.mapbox{display:flex;flex-direction:column;align-items:center;gap:10px}
#map{width:100%;max-width:440px;aspect-ratio:1;max-height:62vh;touch-action:none;border:1px solid var(--faint);background:#020405;display:block}
.hud{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--mono);font-size:13px;color:var(--dim);width:100%;max-width:440px}
.hud b{color:var(--ink);font-weight:normal}
.dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,50px);gap:6px}
.dpad .btn{text-align:center;padding:0;font-size:20px;min-height:50px}
.fight{border:1px solid var(--rust);padding:12px;display:flex;flex-direction:column;gap:8px;background:rgba(30,8,6,.5);width:100%;max-width:440px}
.fight .who{font-style:italic}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--dim);max-width:440px}
.legend span b{font-weight:normal;color:var(--brass);font-family:var(--mono);margin-right:4px}
.prep{display:flex;align-items:center;gap:8px;font-size:15px}
.prep .nm{flex:1}
.depth{font-size:56px;letter-spacing:.06em;font-variant-numeric:tabular-nums;line-height:1}
.depth small{font-size:14px;letter-spacing:.3em;color:var(--dim);display:block;margin-top:4px}
.pop{position:fixed;z-index:5;pointer-events:none;font-family:var(--mono);font-size:13px;color:var(--brass);animation:popup 1.2s ease-out forwards;white-space:nowrap}
@keyframes popup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-34px)}}
#menu{position:fixed;inset:0;z-index:20;background:rgba(2,4,5,.86);display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#menu .box{max-width:360px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--faint);padding:20px;background:var(--abyss)}
#menu p{margin:0;color:var(--dim);font-size:14px}
#blk{position:fixed;inset:0;z-index:15;background:#000;opacity:0;pointer-events:none;transition:opacity 1.2s}
#blk.on{opacity:1;transition:opacity .25s}
#ending{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:center;gap:16px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:40px;color:#16241f;overflow:auto}
#ending .lines{max-width:30em;margin:0 auto;display:flex;flex-direction:column;gap:12px;width:100%}
#ending .lines p{margin:0;font-size:19px;line-height:1.5;opacity:0;transform:translateY(6px);transition:opacity 1.6s,transform 1.6s}
#ending .lines p.in{opacity:1;transform:none}
#ending .lines p.word{font-style:italic;font-size:24px}
#ending .after{max-width:30em;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px;opacity:0;transition:opacity 2s}
#ending .after.in{opacity:1}
#ending .sky .top{color:#4b6157}
#ending .sky .bar{border-color:#9fb8ab;background:rgba(255,255,255,.4)}
#ending .sky .bar i{background:#6fa6c3}
#ending .stats{font-family:var(--mono);font-size:13px;color:#3d5249;display:grid;grid-template-columns:1fr auto;gap:4px 16px}
#ending .btn{background:rgba(255,255,255,.5);color:#16241f;border-color:#9fb8ab}
#ending .tap{font-size:12px;letter-spacing:.2em;color:#5d7469;text-align:center}
#dbg{position:fixed;right:max(8px,env(safe-area-inset-right,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));z-index:40;background:#111;border:1px solid #444;padding:6px;display:flex;flex-wrap:wrap;gap:4px;max-width:300px;font-family:var(--mono);font-size:11px}
#dbg button{font:inherit;background:#222;color:#ddd;border:1px solid #555;padding:4px 6px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="bgc" aria-hidden="true"></canvas>
<div id="app">
  <header>
    <div class="brand" id="brand">lowbell</div>
    <div id="day" aria-live="off"></div>
    <button class="icon" id="muteBtn" type="button" aria-label="Toggle sound">sound on</button>
    <button class="icon" id="menuBtn" type="button" aria-label="Menu">menu</button>
  </header>
  <nav id="tabs" aria-label="Places"></nav>
  <div id="grid">
    <section id="logWrap" aria-live="polite"><ol id="log"></ol></section>
    <section id="panel"></section>
  </div>
</div>
<div id="blk"></div>
<div id="menu" hidden>
  <div class="box">
    <p id="menuInfo">lowbell saves after everything you do.</p>
    <button class="btn" id="mClose" type="button">back to the bell</button>
    <button class="btn" id="mReset" type="button">start over</button>
    <button class="btn" id="mReset2" type="button" hidden>yes, forget everything and start over</button>
  </div>
</div>
<div id="ending" hidden></div>
<div id="dbg" hidden></div>

<script>
'use strict';
/* =========================================================
   LOWBELL — an original slow-reveal incremental.
   Architecture: CONFIG, DATA, State, Rules (pure), Renderer,
   Input, Storage, AudioFX, App loop.
   ========================================================= */

/* ---------------- CONFIG: every tunable number ---------------- */
const CONFIG = {
  tick: 0.25,              // rules step in game seconds
  dayLen: 90,              // seconds per "day below"
  saveEvery: 5,
  air: { start: 62, cap: 100, decay: 0.8, valveMul: 0.5, pump: 7, warnHi: 30, warnLo: 14,
         blackoutAir: 35, diverBreath: 0.12, personBreath: 0.1, bedMake: 0.42, tenderMake: 0.5, tankCap: 60 },
  cd: { knock: 1.2, pump: 0.45, gather: 5, strike: 0.75, eat: 1, flee: 1.4, build: 0.3 },
  gatherAir: 5,
  knock: { delay: [2.4, 3.8], toArrive: 4, arriveDelay: 3.5, drifterChance: 0.5, drifterDelay: [1.8, 3.4] },
  diver: { warmNeed: 14, warmAir: 45, kelpEvery: 8, kelpAmt: 2, shiverEvery: 12 },
  passive: { every: 45, chance: 0.55 },
  exp: { canAir: 25, ratHp: 4, hpBase: 10, hpSuit: 15, eatEvery: 10, starveEvery: 4, encChance: 0.07,
         safeRadius: 2, sight: 1.5, sightLamp: 2.5, fleeChance: 0.55, fleeAir: 3, maxCan: 6, maxRat: 8 },
  map: { n: 19 },
  asc: { depth: 300, rate: 4.6, airDrain: 2.3, stall: 3 },
  dmg: { base: 1, harpoon: 2, glass: 2 },
};
const N = CONFIG.map.n, C = (N - 1) >> 1;

/* ---------------- DATA: content lives here, not in code ---------------- */
const RES = [
  { id: 'kelp', name: 'kelp' }, { id: 'scrap', name: 'scrap' }, { id: 'fish', name: 'fish' },
  { id: 'rope', name: 'rope' }, { id: 'rations', name: 'rations' }, { id: 'canister', name: 'canisters' },
  { id: 'glass', name: 'glass' }, { id: 'bellmetal', name: 'bell metal' },
];
const RESNAME = Object.fromEntries(RES.map(r => [r.id, r.name]));

// where: bell (the diver makes) | floor (raise) | forge (the forge makes) | lift (the last work)
const ITEMS = [
  { id: 'rope', where: 'bell', name: 'twist rope', cost: { kelp: 5 }, max: 999, req: s => s.flags.crafts,
    msg: 'the diver twists kelp into rope with quick, scarred fingers.', again: null },
  { id: 'hook', where: 'bell', name: 'bend a hook', cost: { rope: 2, kelp: 3 }, max: 1, req: s => s.flags.crafts,
    msg: 'a hook bent from an old bolt. now the silt gives up metal.' },
  { id: 'valve', where: 'bell', name: 'seal the valve', cost: { scrap: 5, rope: 1 }, max: 1, req: s => s.built.hook,
    msg: 'the diver seals the cracked valve with tar and kelp. the air stays longer now.' },
  { id: 'net', where: 'bell', name: 'knot a net', cost: { rope: 4 }, max: 1, req: s => s.built.hook,
    msg: 'a net, knotted tight. things live out there. some of them can be eaten.' },
  { id: 'lamp', where: 'bell', name: 'light the lamp', cost: { scrap: 6, fish: 4, rope: 1 }, max: 1, req: s => s.built.valve && s.built.net,
    msg: 'fish oil, a twist of rope, a lens from a dead porthole. the lamp catches.' },

  { id: 'shelter', where: 'floor', name: 'dig out a bell', cost: { scrap: 8, rope: 3 }, scale: 1.32, max: 12, req: s => s.flags.floor,
    msg: 'you dig out a buried bell and seal it. room for two.', again: 'another bell, dug out and sealed.' },
  { id: 'bed', where: 'floor', name: 'kelp bed', cost: { kelp: 12, rope: 1 }, scale: 1.28, max: 15, req: s => s.flags.floor,
    msg: 'you tie kelp to an anchor chain. it sways. it breathes for you.', again: 'another kelp bed, swaying.' },
  { id: 'tank', where: 'floor', name: 'air tank', cost: { scrap: 14, rope: 2 }, scale: 1.45, max: 6, req: s => s.built.shelter,
    msg: 'an old boiler, scrubbed and sealed. it holds a breath for later.', again: 'another tank.' },
  { id: 'rack', where: 'floor', name: 'smoking rack', cost: { kelp: 10, rope: 4 }, max: 1, req: s => s.flags.floor && s.built.net,
    msg: 'a rack over a warm crack in the floor. smoked fish keeps.' },
  { id: 'forge', where: 'floor', name: 'vent forge', cost: { scrap: 25, rope: 6, kelp: 10 }, max: 1, req: s => (s.built.shelter || 0) >= 2,
    msg: 'out at the vent the water shimmers. the diver lashes an anvil to the rock.' },

  { id: 'canister', where: 'forge', name: 'air canister', cost: { scrap: 5, rope: 1 }, max: 999, req: s => s.built.forge,
    msg: 'a canister, tight as a fist. a breath you can carry.', again: null },
  { id: 'deeplamp', where: 'forge', name: 'deep lamp', cost: { scrap: 12, fish: 8, rope: 2 }, max: 1, req: s => s.built.forge,
    msg: 'a lamp with a long throw. the dark has edges now.' },
  { id: 'harpoon', where: 'forge', name: 'harpoon', cost: { scrap: 8, rope: 2 }, max: 1, req: s => s.built.forge,
    msg: 'a barbed harpoon. the diver tests the point on a thumb and nods.' },
  { id: 'suit', where: 'forge', name: 'patch the suit', cost: { rope: 6, scrap: 10, fish: 4 }, max: 1, req: s => s.built.forge,
    msg: 'the diver patches the old suit at every seam. it might hold.' },
  { id: 'glassharpoon', where: 'forge', name: 'glass point', cost: { glass: 6, scrap: 6, rope: 2 }, max: 1, req: s => s.built.harpoon && s.seenRes.glass,
    msg: 'green glass, ground to a point. it sings when it moves.' },

  { id: 'cable', where: 'lift', name: 'braid the cable', cost: { rope: 40, scrap: 30 }, max: 1, req: s => s.flags.liftFound,
    msg: 'the cable, braided thick as an arm. the crews drag it out toward the shaft.' },
  { id: 'cage', where: 'lift', name: 'mend the cage', cost: { scrap: 40, glass: 12 }, max: 1, req: s => s.flags.liftFound,
    msg: 'the cage, mended, with glass in every gap. you will be able to see out.' },
  { id: 'weight', where: 'lift', name: 'counterweight', cost: { scrap: 60, kelp: 40 }, max: 1, req: s => s.flags.liftFound,
    msg: 'a counterweight made of every bolt the floor could spare, and some it couldn\'t.' },
  { id: 'greatbell', where: 'lift', name: 'cast a bell', cost: { bellmetal: 1, scrap: 15 }, max: 1, req: s => s.flags.liftFound,
    msg: 'the chapel metal, melted at the vent. a small bell. very loud.' },
  { id: 'airstore', where: 'lift', name: 'air for the climb', cost: { canister: 6 }, max: 1, req: s => s.flags.liftFound,
    msg: 'six canisters lashed to the cage. enough, if everyone breathes slow.' },
];
const ITEM = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const LIFT_PARTS = ['cable', 'cage', 'weight', 'greatbell', 'airstore'];

const JOBS = [
  { id: 'cutter', name: 'kelp cutter', make: { kelp: 0.3 }, req: s => true },
  { id: 'scav', name: 'scavenger', make: { scrap: 0.2 }, req: s => s.built.hook },
  { id: 'fisher', name: 'net-caster', make: { fish: 0.22 }, req: s => s.built.net },
  { id: 'tender', name: 'bellows tender', air: 0.5, req: s => true },
  { id: 'roper', name: 'rope twister', use: { kelp: 0.5 }, make: { rope: 0.2 }, req: s => s.built.shelter },
  { id: 'cook', name: 'smoker', use: { fish: 0.25, kelp: 0.1 }, make: { rations: 0.12 }, req: s => s.built.rack },
];

const TEXT = {
  knock1: 'the knock goes out into the water. nothing comes back.',
  knock2: 'nothing.',
  knock3: 'the air tastes of pennies. it is getting thin.',
  nothing: ['nothing.', 'only the water.', 'the iron hums, then stops.', 'you wait. nothing.'],
  firstPump: 'the bellows wheeze. air comes in, cold and thin.',
  wait: 'you wait.',
  answers: ['something knocks back. far off. above you?', 'it answers again. closer.', 'closer. you can feel it in your teeth.', 'close enough to touch. it stops, as if listening.'],
  arrive1: 'a light, swaying, coming down on a line from above.',
  arrive2: 'a diver. it taps the glass three times. you open the hatch.',
  arrive3: 'the diver is shaking with cold. keep the air good.',
  shiver: 'the diver is shivering.',
  warm1: 'the diver stops shaking. they look around the bell like they\'re measuring it.',
  warm2: 'the diver points at the hatch, at the dark outside, and then at you.',
  diverKnock: ['the diver knocks back, from right beside you. it seems to amuse them.', 'the iron rings and fades.'],
  gather1: 'outside, the cold is total. you grab what you can and haul yourself back in.',
  diverOut: 'the diver goes out on their own now. they come back with kelp.',
  floor1: 'for the first time, you can see the floor.',
  floor2: 'other bells, half buried in silt. dozens of them. all quiet.',
  floor3: 'maybe not all of them.',
  drifterNo: ['silence from the buried bells.', 'nothing answers.', 'the knock rolls away across the silt.'],
  drifterYes: 'a knock answers, from a bell half sunk in the silt.',
  drifterFull: 'knocks answer from the buried bells. there is nowhere to put anyone.',
  arrivals: ['someone crawls out of a buried bell, blinking at the lamp.', 'an old man with silt in his beard. he nods like he expected you.',
    'a girl with a tin cup. she taps it on the hull, twice, and grins.', 'a drifter, thin as rope. they go straight to work.',
    'a woman who won\'t say her name. she counts the bells instead.', 'someone in a coat three sizes too big. they hold out their hands to the lamp.'],
  arrivalsTwo: 'two of them, holding hands. they don\'t let go for an hour.',
  darkOpen1: 'the diver draws in the silt. the bells. the vent. and past them, a long line going nowhere.',
  darkOpen2: 'they tap the end of the line. then they point up.',
  darkOpen3: 'the diver hands you a canister.',
  expGo1: 'the diver ties a line around your waist and taps your helmet twice. go.',
  expGo: 'into the dark.',
  home: 'home. the diver counts what you brought, twice.',
  rescue1: 'the line goes taut. the diver hauls you home through the dark, hand over hand.',
  rescue2: 'whatever you were carrying, the dark kept.',
  stillThere: 'what you could not carry is still out there. so is whatever guarded it.',
  pull: 'you tug the line three times. the diver hauls you home. some of what you carried slips away.',
  hungry: 'you eat a ration in the dark, quickly.',
  starving: 'your stomach is a fist.',
  dark: 'the dark comes in.',
  wake: 'you wake on the floor of the bell, gasping. some of the stores are spoiled.',
  wakeLoss: 'someone has gone back into their own bell, and won\'t come out.',
  awayBlack: 'while you were out, the air ran out at home.',
  warnHi: 'your breath comes short.',
  warnLo: 'spots at the edges of everything.',
  liftReady: 'the lift is ready. everyone is ready. no one is ready.',
  asc1: 'everyone climbs into the cage. the diver checks every knot twice.',
  asc2: 'the counterweight drops. the floor falls away beneath you.',
  ascMarks: [[250, 'the cable groans. no one breathes.'], [190, 'the water is lighter here. green, not black.'],
    [130, 'fish you\'ve never seen, silver, all turning at once.'], [70, 'light. real light, coming down in ropes.'],
    [25, 'the diver is tapping the cage bars. one, two, three. waiting.']],
  ascBlack: 'everyone in the cage goes dark at once. the cage hangs, swaying.',
  lid1: 'the cage stops with a jolt. above you, a lid of iron. sealed.',
  lid2: 'there is only one thing left to do.',
  lidKnock: 'you knock on the lid.',
  lidAnswer: 'something knocks back. right there. on the other side.',
};

/* ---------------- seeded RNG (pure, state-held) ---------------- */
function rnd(s) {
  s.rng = (s.rng + 0x6D2B79F5) | 0; let t = s.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rint(s, a, b) { return a + Math.floor(rnd(s) * (b - a + 1)); }
function rpick(s, arr) { return arr[Math.floor(rnd(s) * arr.length)]; }

/* ---------------- MAP: generated from the seed, never saved ---------------- */
const MapGen = (() => {
  const cache = {};
  function gen(seed) {
    if (cache[seed]) return cache[seed];
    const st = { rng: seed ^ 0x9e3779b9 };
    let v = [], w = [];
    for (let i = 0; i < N * N; i++) { v.push(rnd(st)); w.push(rnd(st)); }
    const blur = a => a.map((_, i) => { const x = i % N, y = (i / N) | 0; let t = 0, c = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const X = x + dx, Y = y + dy; if (X >= 0 && Y >= 0 && X < N && Y < N) { t += a[Y * N + X]; c++; } } return t / c; });
    v = blur(blur(v)); w = blur(w);
    const t = []; // 0 silt, 1 rock, 2 trench, 3 kelp forest
    for (let i = 0; i < N * N; i++) { t.push(v[i] > 0.6 ? 1 : w[i] > 0.66 ? 2 : v[i] < 0.38 ? 3 : 0); }
    const dist = (x, y) => Math.hypot(x - C, y - C);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (dist(x, y) <= 1.6) t[y * N + x] = 0;
    const lm = {}; const used = {};
    for (const L of LANDMARKS) {
      const cands = [];
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        const d = dist(x, y); if (d >= L.band[0] && d < L.band[1] + 1 && !used[y * N + x]) {
          let ok = true; for (const k in used) { const kx = k % N, ky = (k / N) | 0; if (Math.abs(kx - x) + Math.abs(ky - y) < 3) { ok = false; break; } }
          if (ok) cands.push(y * N + x);
        }
      }
      const pick = cands.length ? cands[Math.floor(rnd(st) * cands.length)] : (C * N + C + L.band[0]);
      used[pick] = 1; lm[pick] = L.id; t[pick] = 0;
    }
    // make sure every landmark is reachable: carve a path where needed
    const reach = () => { const seen = new Uint8Array(N * N), q = [C * N + C]; seen[q[0]] = 1;
      while (q.length) { const i = q.shift(), x = i % N, y = (i / N) | 0;
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const X = x + dx, Y = y + dy; if (X < 0 || Y < 0 || X >= N || Y >= N) continue;
          const j = Y * N + X; if (!seen[j] && (t[j] === 0 || t[j] === 3)) { seen[j] = 1; q.push(j); } } } return seen; };
    for (const k in lm) { const seen = reach(); if (seen[k]) continue;
      let x = C, y = C; const tx = k % N, ty = (k / N) | 0;
      while (x !== tx || y !== ty) { if (x !== tx && (y === ty || rnd(st) < 0.5)) x += Math.sign(tx - x); else y += Math.sign(ty - y); const j = y * N + x; if (t[j] === 1 || t[j] === 2) t[j] = 0; } }
    return (cache[seed] = { t, lm, pos: Object.fromEntries(Object.entries(lm).map(([k, id]) => [id, +k])) });
  }
  return { gen };
})();

/* ---------------- State ---------------- */
function freshState(seed) {
  seed = (seed >>> 0) || 1;
  return {
    v: 1, seed, rng: seed, t: 0, tab: 'bell', flags: {}, newTabs: {},
    air: CONFIG.air.start, res: {}, seenRes: {}, built: {}, pop: 0, jobs: {}, cd: {},
    knockN: 0, answers: 0, pending: false, lastNothing: -1,
    diver: { state: 'none', warm: 0, nextKelp: 0, lastShiver: -99 },
    q: [], log: [], logN: 0, fx: [],
    prep: { can: 1, rat: 0 }, exp: null, seen: '', cleared: {},
    asc: null, ended: false, endT: 0, souls: 0, nextPassive: CONFIG.passive.every,
    warned: 0, stats: { knocks: 0, pumps: 0, blackouts: 0, trips: 0, steps: 0, lost: 0 },
  };
}

/* ---------------- Rules: pure functions (state in -> new state out) ---------------- */
const Rules = (() => {
  const clone = o => JSON.parse(JSON.stringify(o));
  const say = (s, text, cls) => { s.logN++; s.log.unshift({ n: s.logN, text, cls: cls || '' }); if (s.log.length > 40) s.log.length = 40; };
  const fx = (s, type, extra) => s.fx.push(Object.assign({ type }, extra || {}));
  const gain = (s, id, a) => { s.res[id] = (s.res[id] || 0) + a; if (a > 0) s.seenRes[id] = 1; };
  const have = (s, id) => s.res[id] || 0;
  const costOf = (it, s) => { const n = s.built[it.id] || 0, k = Math.pow(it.scale || 1, n), c = {}; for (const r in it.cost) c[r] = Math.ceil(it.cost[r] * k); return c; };
  const afford = (s, c) => Object.keys(c).every(r => have(s, r) >= c[r] - 1e-9);
  const pay = (s, c) => { for (const r in c) s.res[r] = have(s, r) - c[r]; };
  const cap = s => (s.built.shelter || 0) * 2;
  const airCap = s => s.asc ? 100 : CONFIG.air.cap + (s.built.tank || 0) * CONFIG.air.tankCap;
  const working = s => Object.values(s.jobs).reduce((a, b) => a + b, 0);
  const idle = s => s.pop - working(s);
  const ready = (s, k) => !(s.cd[k] > s.t);
  const setCd = (s, k) => { s.cd[k] = s.t + CONFIG.cd[k]; };
  const at = (s, delay, ev, arg) => s.q.push({ at: s.t + delay, ev, arg });
  const terrain = s => MapGen.gen(s.seed);
  const seenArr = s => (s.seen && s.seen.length === N * N ? s.seen : '0'.repeat(N * N)).split('');
  const hpMax = s => s.built.suit ? CONFIG.exp.hpSuit : CONFIG.exp.hpBase;
  const dmg = s => CONFIG.dmg.base + (s.built.harpoon ? CONFIG.dmg.harpoon : 0) + (s.built.glassharpoon ? CONFIG.dmg.glass : 0);
  const liftReady = s => LIFT_PARTS.every(p => s.built[p]);
  function airRates(s) {
    let use = CONFIG.air.decay * (s.built.valve ? CONFIG.air.valveMul : 1);
    if (s.diver.state !== 'none') use += CONFIG.air.diverBreath;
    use += s.pop * CONFIG.air.personBreath;
    const make = (s.built.bed || 0) * CONFIG.air.bedMake + (s.jobs.tender || 0) * CONFIG.air.tenderMake;
    return { use, make, net: make - use };
  }
  function itemVisible(s, it) { return !!it.req(s); }
  function jobVisible(s, j) { return s.flags.floor && !!j.req(s); }
  function unlockTab(s, id) { if (!s.flags['tab_' + id]) { s.flags['tab_' + id] = 1; s.newTabs[id] = 1; fx(s, 'reveal'); } }

  function revealAround(s) {
    const e = s.exp; const r = s.built.deeplamp ? CONFIG.exp.sightLamp : CONFIG.exp.sight; const a = seenArr(s);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (Math.hypot(x - e.x, y - e.y) <= r) a[y * N + x] = '1';
    s.seen = a.join('');
  }

  function blackout(s) {
    s.stats.blackouts++; fx(s, 'blackout');
    if (s.asc) { say(s, TEXT.ascBlack, 'warn'); s.air = 40; s.asc.stall = CONFIG.asc.stall; return; }
    if (s.exp) { s.awayBlack = (s.awayBlack || 0) + 1; s.air = CONFIG.air.blackoutAir; loseOne(s); return; }
    say(s, TEXT.dark, 'warn'); say(s, TEXT.wake, 'warn');
    s.air = CONFIG.air.blackoutAir;
    for (const r of ['kelp', 'fish']) s.res[r] = Math.floor(have(s, r) * 0.7);
    if (loseOne(s)) say(s, TEXT.wakeLoss, 'warn');
  }
  function loseOne(s) {
    if (s.pop <= 0) return false; s.pop--;
    if (working(s) > s.pop) { const ids = Object.keys(s.jobs).filter(k => s.jobs[k] > 0); const k = ids[ids.length - 1]; s.jobs[k]--; }
    return true;
  }

  function arrive(s, n) {
    n = Math.min(n, cap(s) - s.pop);
    if (n <= 0) { say(s, TEXT.drifterFull); return; }
    s.pop += n; s.jobs.cutter = (s.jobs.cutter || 0) + n;
    say(s, n === 2 ? TEXT.arrivalsTwo : rpick(s, TEXT.arrivals)); fx(s, 'arrive');
  }

  function event(s, e) {
    switch (e.ev) {
      case 'answer': {
        s.pending = false; s.answers++; fx(s, 'answer', { n: s.answers });
        say(s, TEXT.answers[Math.min(s.answers, TEXT.answers.length) - 1]);
        if (s.answers >= CONFIG.knock.toArrive) at(s, CONFIG.knock.arriveDelay, 'arrive1');
        break;
      }
      case 'arrive1': say(s, TEXT.arrive1, 'say'); fx(s, 'descend'); at(s, 2.6, 'arrive2'); break;
      case 'arrive2': say(s, TEXT.arrive2); s.diver.state = 'cold'; fx(s, 'arrive'); at(s, 1.8, 'arrive3'); break;
      case 'arrive3': say(s, TEXT.arrive3, 'warn'); s.diver.lastShiver = s.t; break;
      case 'drifterKnock': {
        s.pending = false;
        if (s.pop >= cap(s)) { say(s, TEXT.drifterFull); break; }
        say(s, TEXT.drifterYes); fx(s, 'answer', { n: 1 });
        at(s, rint(s, 15, 25) / 10, 'drifter', rnd(s) < 0.28 ? 2 : 1); break;
      }
      case 'drifter': arrive(s, e.arg || 1); break;
      case 'lidAnswer': say(s, TEXT.lidAnswer, 'say'); fx(s, 'answer', { n: 3 }); at(s, 2.6, 'end'); break;
      case 'end': {
        s.ended = true; s.endT = s.t; s.souls = s.pop + 2; fx(s, 'end'); break;
      }
      case 'say': say(s, e.arg.text, e.arg.cls); if (e.arg.fx) fx(s, e.arg.fx); break;
      case 'unlockWork': s.flags.gather = 1; s.flags.crafts = 1; fx(s, 'reveal'); break;
    }
  }

  /* ---- can(): is an action legal right now? ---- */
  function can(s, act, arg) {
    if (s.ended) return false;
    if (s.asc) {
      if (act === 'pump') return ready(s, 'pump') && s.asc.phase === 'rise';
      if (act === 'knock') return s.asc.phase === 'lid' && ready(s, 'knock');
      return false;
    }
    if (s.exp) {
      const e = s.exp, f = e.fight;
      switch (act) {
        case 'move': { if (f) return false; const d = DIRS[arg]; if (!d) return false; const x = e.x + d[0], y = e.y + d[1];
          if (x < 0 || y < 0 || x >= N || y >= N) return false; const tt = terrain(s).t[y * N + x]; return tt === 0 || tt === 3; }
        case 'strike': return !!f && ready(s, 'strike');
        case 'eat': return e.rat > 0 && e.hp < e.hpMax && ready(s, 'eat');
        case 'flee': return !!f && ready(s, 'flee');
        case 'pull': return !f;
        case 'tab': return arg === 'dark';
        case 'mute': return true;
        default: return false;
      }
    }
    switch (act) {
      case 'knock': return ready(s, 'knock');
      case 'pump': return !!s.flags.air && ready(s, 'pump');
      case 'gather': return !!s.flags.gather && ready(s, 'gather') && s.air > CONFIG.gatherAir;
      case 'make': { const it = ITEM[arg]; if (!it || !itemVisible(s, it)) return false; if ((s.built[it.id] || 0) >= it.max) return false; return afford(s, costOf(it, s)) && ready(s, 'build'); }
      case 'job+': { const j = JOBS.find(j => j.id === arg); return !!j && jobVisible(s, j) && idle(s) > 0; }
      case 'job-': return (s.jobs[arg] || 0) > 0;
      case 'tab': return arg === 'bell' || !!s.flags['tab_' + arg];
      case 'can+': return !!s.flags.dark && s.prep.can < Math.min(CONFIG.exp.maxCan, have(s, 'canister'));
      case 'can-': return s.prep.can > 1;
      case 'rat+': return !!s.flags.dark && s.prep.rat < Math.min(CONFIG.exp.maxRat, Math.floor(have(s, 'rations')));
      case 'rat-': return s.prep.rat > 0;
      case 'go': return !!s.flags.dark && have(s, 'canister') >= 1;
      case 'ascend': return liftReady(s);
      default: return false;
    }
  }

  /* ---- act(): apply a player action ---- */
  function act(s0, act, arg) {
    if (!can(s0, act, arg)) return s0;
    const s = clone(s0); s.fx = [];
    switch (act) {
      case 'knock': doKnock(s); break;
      case 'pump': {
        setCd(s, 'pump'); s.stats.pumps++; s.air = Math.min(airCap(s), s.air + CONFIG.air.pump); fx(s, 'pump', { src: 'pump' });
        if (s.stats.pumps === 1) say(s, TEXT.firstPump);
        break;
      }
      case 'gather': {
        setCd(s, 'gather'); s.air -= CONFIG.gatherAir; const got = {};
        got.kelp = rint(s, 2, 4);
        if (s.built.hook && rnd(s) < 0.8) got.scrap = rint(s, 1, 2);
        if (s.built.net) got.fish = rint(s, 1, 2);
        for (const r in got) gain(s, r, got[r]);
        if (!s.flags.gathered) { s.flags.gathered = 1; say(s, TEXT.gather1); }
        fx(s, 'gather', { src: 'gather', text: Object.entries(got).map(([r, n]) => '+' + n + ' ' + RESNAME[r]).join('  ') });
        break;
      }
      case 'make': {
        const it = ITEM[arg]; const c = costOf(it, s); pay(s, c); s.built[it.id] = (s.built[it.id] || 0) + 1; setCd(s, 'build');
        const first = s.built[it.id] === 1;
        if (first || it.again) say(s, first ? it.msg : it.again); else if (it.id === 'rope' || it.id === 'canister') { /* quiet repeat */ }
        fx(s, 'build', { src: 'make:' + it.id, text: '+1 ' + it.name });
        applyItem(s, it, first);
        break;
      }
      case 'job+': s.jobs[arg] = (s.jobs[arg] || 0) + 1; fx(s, 'tick'); break;
      case 'job-': s.jobs[arg]--; fx(s, 'tick'); break;
      case 'tab': s.tab = arg; delete s.newTabs[arg]; break;
      case 'can+': s.prep.can++; fx(s, 'tick'); break;
      case 'can-': s.prep.can--; fx(s, 'tick'); break;
      case 'rat+': s.prep.rat++; fx(s, 'tick'); break;
      case 'rat-': s.prep.rat--; fx(s, 'tick'); break;
      case 'go': startExp(s); break;
      case 'move': move(s, arg); break;
      case 'strike': strike(s); break;
      case 'eat': { const e = s.exp; setCd(s, 'eat'); e.rat--; e.hp = Math.min(e.hpMax, e.hp + CONFIG.exp.ratHp); e.hunger = 0; fx(s, 'eat'); break; }
      case 'flee': flee(s); break;
      case 'pull': endExp(s, 'pull'); break;
      case 'ascend': {
        s.asc = { depth: CONFIG.asc.depth, phase: 'rise', stall: 0, marks: 0 }; s.air = 100; s.tab = 'lift';
        say(s, TEXT.asc1); at(s, 2.2, 'say', { text: TEXT.asc2, fx: 'drop' }); fx(s, 'ascend'); break;
      }
    }
    return s;
  }

  function doKnock(s) {
    setCd(s, 'knock'); s.stats.knocks++; fx(s, 'knock', { src: 'knock' });
    if (s.asc) { s.asc.phase = 'knocked'; say(s, TEXT.lidKnock); at(s, 2.2, 'lidAnswer'); return; }
    if (!s.flags.air) {
      s.knockN++;
      if (s.knockN === 1) say(s, TEXT.knock1);
      else if (s.knockN === 2) say(s, TEXT.knock2);
      else { say(s, TEXT.knock3, 'warn'); s.flags.air = 1; fx(s, 'reveal'); }
      return;
    }
    if (s.diver.state === 'none') {
      if (s.pending) { say(s, TEXT.wait); return; }
      if (s.stats.pumps < 1 || s.answers >= CONFIG.knock.toArrive) { s.lastNothing = (s.lastNothing + 1) % TEXT.nothing.length; say(s, TEXT.nothing[s.lastNothing]); return; }
      s.pending = true; at(s, CONFIG.knock.delay[0] + rnd(s) * (CONFIG.knock.delay[1] - CONFIG.knock.delay[0]), 'answer');
      return;
    }
    if (s.flags.floor) {
      if (s.pending) { say(s, TEXT.wait); return; }
      if (s.pop >= cap(s)) { say(s, cap(s) ? TEXT.drifterFull : TEXT.drifterNo[0]); return; }
      if (rnd(s) < CONFIG.knock.drifterChance) { s.pending = true; at(s, CONFIG.knock.drifterDelay[0] + rnd(s) * (CONFIG.knock.drifterDelay[1] - CONFIG.knock.drifterDelay[0]), 'drifterKnock'); }
      else say(s, rpick(s, TEXT.drifterNo));
      return;
    }
    say(s, s.flags.diverKnocked ? TEXT.diverKnock[1] : TEXT.diverKnock[0]); s.flags.diverKnocked = 1;
  }

  function applyItem(s, it, first) {
    switch (it.id) {
      case 'rope': gain(s, 'rope', 1); break;
      case 'canister': gain(s, 'canister', 1); break;
      case 'valve': s.diver.nextKelp = s.t + CONFIG.diver.kelpEvery; at(s, 1.5, 'say', { text: TEXT.diverOut }); break;
      case 'lamp': s.flags.floor = 1; unlockTab(s, 'floor'); at(s, 1.6, 'say', { text: TEXT.floor1, cls: 'say' }); at(s, 3.6, 'say', { text: TEXT.floor2 }); at(s, 6, 'say', { text: TEXT.floor3, cls: 'say' }); break;
      case 'deeplamp': s.flags.dark = 1; unlockTab(s, 'dark'); gain(s, 'canister', 1);
        at(s, 1.5, 'say', { text: TEXT.darkOpen1 }); at(s, 3.8, 'say', { text: TEXT.darkOpen2, cls: 'say' }); at(s, 5.6, 'say', { text: TEXT.darkOpen3 }); break;
    }
    if (it.where === 'lift' && liftReady(s) && !s.flags.liftReadySaid) { s.flags.liftReadySaid = 1; at(s, 1.2, 'say', { text: TEXT.liftReady, cls: 'say' }); }
  }

  /* ---- the dark ---- */

  function startFight(s, en, lmId) {

  }
  function strike(s) {
    const e = s.exp, f = e.fight; setCd(s, 'strike'); f.hp -= dmg(s); fx(s, 'hit');

      else if (s.t - d.lastShiver > CONFIG.diver.shiverEvery) { d.lastShiver = s.t; say(s, TEXT.shiver, 'warn'); }
      if (d.warm >= CONFIG.diver.warmNeed) { d.state = 'working'; say(s, TEXT.warm1); at(s, 2.2, 'say', { text: TEXT.warm2, cls: 'say' }); at(s, 2.4, 'unlockWork'); }

    // fights
    if (s.exp && s.exp.fight && s.t >= s.exp.fight.next) {
      const f = s.exp.fight; f.next += f.speed; s.exp.hp -= f.dmg; fx(s, 'hurt');
      if (s.exp.hp <= 0) endExp(s, 'rescue');
    }
    return s;
  }

  return { tick, act, can, costOf, afford, cap, airCap, idle, working, airRates, itemVisible, jobVisible, hpMax, dmg, liftReady, terrain, DIRS, have };
})();

/* ---------------- Storage: localStorage in try/catch ---------------- */
const Storage = {
  key: 'lowbell.save.v1', bestKey: 'lowbell.best.v1',
  load() { try { const raw = localStorage.getItem(this.key); if (!raw) return null; const s = JSON.parse(raw); return s && s.v === 1 ? s : null; } catch (e) { return null; } },
  save(s) { try { localStorage.setItem(this.key, JSON.stringify(s)); } catch (e) { } },
  clear() { try { localStorage.removeItem(this.key); } catch (e) { } },
  best() { try { return JSON.parse(localStorage.getItem(this.bestKey) || 'null') || { runs: 0, fastest: 0, most: 0 }; } catch (e) { return { runs: 0, fastest: 0, most: 0 }; } },
  setBest(b) { try { localStorage.setItem(this.bestKey, JSON.stringify(b)); } catch (e) { } },
  pref(k, v) { try { if (v === undefined) return localStorage.getItem('lowbell.' + k); localStorage.setItem('lowbell.' + k, v); } catch (e) { return null; } },
};

  function structure(s) {
    const tabsSig = ['bell', 'floor', 'dark', 'lift'].map(t => (t === 'bell' || s.flags['tab_' + t]) ? t + (s.tab === t ? '*' : '') + (s.newTabs[t] ? '!' : '') : '').join(',') + (s.exp ? 'E' : '') + (s.asc ? 'A' : '');

  function values(s) {

    if (s.flags.floor && !s.asc) { const r = Rules.airRates(s); v.airTxt += '   ' + (r.net >= 0 ? '+' : '') + r.net.toFixed(1) + '/s'; }
    for (const r of RES) { if (!s.seenRes[r.id]) continue; v['r_' + r.id] = Math.floor(Rules.have(s, r.id) + 1e-6); }
    // production rates
    const rate = {}; for (const j of JOBS) { const n = s.jobs[j.id] || 0; if (!n) continue; for (const r in (j.make || {})) rate[r] = (rate[r] || 0) + j.make[r] * n; for (const r in (j.use || {})) rate[r] = (rate[r] || 0) - j.use[r] * n; }

    for (const r of RES) if (s.seenRes[r.id]) v['rr_' + r.id] = rate[r.id] ? (rate[r.id] > 0 ? '+' : '') + rate[r.id].toFixed(2) + '/s' : '';
    for (const it of ITEMS) v['c_' + it.id] = costTxt(Rules.costOf(it, s)) + (it.max > 1 && it.max < 99 ? '  (' + (s.built[it.id] || 0) + '/' + it.max + ')' : '');

    const cap2 = Rules.cap(s); v.popNote = cap2 ? `${s.pop} of ${cap2} bells filled · ${Rules.idle(s)} idle` + (s.pop < cap2 ? ' · knock to wake someone' : ' · dig out more bells for more people') : 'dig out a bell. then knock. someone might still be in there.';

      if (e.fight) { v.fWho = e.fight.name + ' · ' + Math.max(0, e.fight.hp) + '/' + e.fight.hpMax + '   ·   your strike: ' + Rules.dmg(s); w.fHp = 100 * Math.max(0, e.fight.hp) / e.fight.hpMax; } }
    const cn = s.prep.can; v.pCan = cn; v.pRat = s.prep.rat; v.pCanNote = '(' + Math.floor(Rules.have(s, 'canister')) + ' at home)';
    v.prepNote = `${cn * CONFIG.exp.canAir} air: each step costs 1. a ration every ${CONFIG.exp.eatEvery} steps. strike: ${Rules.dmg(s)}. body: ${Rules.hpMax(s)}.`;
    v.legend = LANDMARKS.filter(l => s.cleared[l.id]).map(l => `<span><b>${l.glyph}</b>${l.name}</span>`).join('') || '<span>the dark is unmapped.</span>';
    if (s.asc) v.depth = Math.ceil(s.asc.depth);
    return { v, w };
  }
  function jobDesc(j) {
    const parts = []; if (j.use) parts.push(Object.entries(j.use).map(([r, n]) => '−' + n + ' ' + RESNAME[r]).join(' ')); if (j.make) parts.push(Object.entries(j.make).map(([r, n]) => '+' + n + ' ' + RESNAME[r]).join(' ')); if (j.air) parts.push('+' + j.air + ' air');

    el.panel.querySelectorAll('[data-w]').forEach(n => { const k = n.dataset.w; if (k in w) n.style.width = Math.max(0, Math.min(100, w[k])).toFixed(1) + '%'; });

    el.brand.classList.toggle('lit', !!s.built.lamp);

  function popText(srcSel, text) {
    const b = srcSel && el.app.querySelector(srcSel); if (!text) return;
    const r = b ? b.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0 };
    const p = document.createElement('div'); p.className = 'pop'; p.textContent = text; p.style.left = (r.left + r.width / 2) + 'px'; p.style.top = (r.top - 6) + 'px';

  function blackout() { el.blk.classList.add('on'); setTimeout(() => el.blk.classList.remove('on'), 900); }
  function reset() { lastSig = ''; lastLogN = -1; lastTabsSig = ''; el.log.innerHTML = ''; }

})();

/* ---------------- MapView: canvas map of the dark ---------------- */
const MapView = (() => {
  let cv = null, g = null, phase = 0;
  const GLYPH = { 1: '▴', 2: '≈', 3: '⌇' };
  function attach(c) { cv = c; try { g = c ? c.getContext('2d') : null; } catch (e) { g = null; } }
  function draw(s) {
    if (!cv || !g) return; phase += 0.03;
    const W = cv.width, cs = W / N, map = Rules.terrain(s), seen = s.seen && s.seen.length === N * N ? s.seen : '';
    g.fillStyle = '#020405'; g.fillRect(0, 0, W, W);
    const e = s.exp, px = e ? e.x : C, py = e ? e.y : C, r = s.built.deeplamp ? CONFIG.exp.sightLamp : CONFIG.exp.sight;
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = Math.floor(cs * 0.72) + 'px ui-monospace, Menlo, monospace';
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const i = y * N + x; const known = seen[i] === '1' || (x === C && y === C);
      if (!known) continue;
      const lit = e && Math.hypot(x - px, y - py) <= r + 0.01;
      const a = lit ? 0.95 : 0.4; const cx = x * cs + cs / 2, cy = y * cs + cs / 2;
      const tt = map.t[i], lm = map.lm[i];
      if (lm) { g.fillStyle = s.cleared[lm] ? `rgba(220,181,108,${a})` : `rgba(207,122,95,${a})`; g.fillText(s.cleared[lm] ? LM[lm].glyph : '?', cx, cy); continue; }
      if (tt === 0) { g.fillStyle = `rgba(130,150,145,${a * 0.5})`; g.fillRect(cx - 1, cy - 1, 2, 2); }
      else { g.fillStyle = tt === 1 ? `rgba(90,105,104,${a})` : tt === 2 ? `rgba(70,110,140,${a})` : `rgba(110,160,120,${a})`; g.fillText(GLYPH[tt], cx, cy); }
    }
    // home
    const hx = C * cs + cs / 2, hy = C * cs + cs / 2;
    g.fillStyle = 'rgba(220,181,108,.9)'; g.beginPath(); g.arc(hx, hy, cs * 0.28, 0, 7); g.fill();
    if (e) {
      const cx = px * cs + cs / 2, cy = py * cs + cs / 2;
      g.strokeStyle = 'rgba(220,181,108,.25)'; g.lineWidth = 1; g.beginPath(); g.moveTo(hx, hy); g.lineTo(cx, cy); g.stroke();
      const rad = g.createRadialGradient(cx, cy, 0, cx, cy, cs * (r + 0.8)); rad.addColorStop(0, 'rgba(220,181,108,.22)'); rad.addColorStop(1, 'rgba(220,181,108,0)');
      g.fillStyle = rad; g.fillRect(0, 0, W, W);
      g.fillStyle = '#f1dfb4'; g.beginPath(); g.arc(cx, cy, cs * (0.24 + Math.sin(phase * 3) * 0.03), 0, 7); g.fill();
    }
  }
  return { attach, draw };
})();

/* ---------------- Background: marine snow, light that follows the story ---------------- */
const Backdrop = (() => {
  const cv = document.getElementById('bgc'); let g = null; try { g = cv.getContext('2d'); } catch (e) { } let W = 0, H = 0, dots = [], light = 0, target = 0, sky = 0;
  function size() { const d = Math.min(2, devicePixelRatio || 1); W = cv.width = innerWidth * d; H = cv.height = innerHeight * d; dots = []; for (let i = 0; i < 70; i++) dots.push({ x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.6 + 0.4) * d, v: (Math.random() * 0.25 + 0.05) * d, p: Math.random() * 6 }); }
  addEventListener('resize', size); size();
  function draw(s) {
    if (!g) return;
    target = s.ended ? 1 : s.asc ? 0.25 + 0.75 * (1 - s.asc.depth / CONFIG.asc.depth) : s.built.lamp ? 0.22 : s.diver.state !== 'none' ? 0.12 : 0.04;
    if (s.flags.air && !s.asc && s.air < CONFIG.air.warnHi) target *= 0.5;
    light += (target - light) * 0.02; sky += ((s.ended ? 1 : 0) - sky) * 0.01;
    const top = mix([4, 8, 10], [26, 60, 66], light), bot = mix([2, 4, 5], [8, 22, 26], light);
    const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, rgb(mix(top, [214, 234, 240], sky))); gr.addColorStop(1, rgb(mix(bot, [244, 240, 222], sky)));
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    const lx = W * 0.5, ly = H * 0.12, rad = g.createRadialGradient(lx, ly, 0, lx, ly, Math.max(W, H) * (0.3 + light * 0.6));
    rad.addColorStop(0, `rgba(220,181,108,${0.05 + light * 0.1})`); rad.addColorStop(1, 'rgba(220,181,108,0)'); g.fillStyle = rad; g.fillRect(0, 0, W, H);
    const rising = s.asc && s.asc.phase === 'rise';
    for (const d of dots) { d.p += 0.01; d.y += rising ? d.v * 6 : d.v; d.x += Math.sin(d.p) * 0.2; if (d.y > H) { d.y = -4; d.x = Math.random() * W; }
      g.fillStyle = `rgba(200,215,210,${(0.1 + light * 0.25) * (1 - sky)})`; g.beginPath(); g.arc(d.x, d.y, d.r, 0, 7); g.fill(); }
  }
  const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t), rgb = c => `rgb(${c.map(v => Math.round(v)).join(',')})`;
  return { draw };
})();

/* ---------------- Ending ---------------- */
const Ending = (() => {
  const box = document.getElementById('ending'); let shown = 0, timer = null, lines = [];
  function open(s, best, isNewBest) {
    box.hidden = false; box.innerHTML = ''; shown = 0;
    const wrap = document.createElement('div'); wrap.className = 'lines'; box.appendChild(wrap);
    lines = ENDING.map(l => { const p = document.createElement('p'); if (typeof l === 'object') { p.className = 'word'; p.textContent = l.word; }
      else p.textContent = l === '{souls}' ? `behind you, the people of the floor climb out one by one, into the light. ${s.souls} of you, counting the diver.` : l; wrap.appendChild(p); return p; });
    const after = document.createElement('div'); after.className = 'after';
    const mins = Math.floor(s.endT / 60), secs = Math.floor(s.endT % 60);
    after.innerHTML = `<div class="meter sky"><div class="top"><span id="skyLbl">air</span><b>∞</b></div><div class="bar"><i style="width:100%"></i></div></div>
      <div class="stats"><span>days below</span><span>${1 + Math.floor(s.endT / CONFIG.dayLen)}</span><span>knocks</span><span>${s.stats.knocks}</span><span>trips into the dark</span><span>${s.stats.trips}</span><span>people brought up</span><span>${s.souls}</span><span>time</span><span>${mins}:${String(secs).padStart(2, '0')}</span><span>best time</span><span>${fmtT(best.fastest)}${isNewBest ? ' (new)' : ''}</span></div>
      <div class="row"><button type="button" class="btn" id="eAgain">go down again</button><button type="button" class="btn" id="eStay">stay a while</button></div>`;
    box.appendChild(after);
    const tap = document.createElement('div'); tap.className = 'tap'; tap.textContent = 'tap to go on'; box.appendChild(tap);
    const next = () => { if (shown < lines.length) { lines[shown++].classList.add('in'); if (shown === lines.length) { setTimeout(() => { after.classList.add('in'); tap.remove(); setTimeout(() => { const l = document.getElementById('skyLbl'); if (l) l.textContent = 'sky'; }, 2600); }, 2200); } } };
    box.onclick = ev => { if (ev.target.closest('button')) return; clearTimeout(timer); next(); auto(); };
    const auto = () => { timer = setTimeout(() => { next(); if (shown < lines.length) auto(); }, 3400); };
    next(); auto();
    after.querySelector('#eAgain').onclick = () => App.newGame();
    after.querySelector('#eStay').onclick = () => { after.querySelector('#eStay').remove(); };
  }
  const fmtT = t => t ? Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0') : '—';
  function close() { box.hidden = true; box.innerHTML = ''; clearTimeout(timer); }
  function advanceAll() { lines.forEach(l => l.classList.add('in')); }
  return { open, close, advanceAll };
})();

/* ---------------- App: state owner, loop, Input ---------------- */
const App = (() => {
  let S = null, acc = 0, last = 0, speed = 1, saveAcc = 0, endShown = false, whaleAt = 40;
  function boot(data) {
    S = (data && data.state) || Storage.load() || freshState((Date.now() ^ (Math.random() * 1e9)) >>> 0);
    if (!S.log.length) S.log.push({ n: 0, text: 'dark. cold. a bell of iron around you, and the weight of the water on top of it.', cls: '' });
    S.fx = []; Renderer.reset();
    document.getElementById('muteBtn').textContent = AudioFX.muted ? 'sound off' : 'sound on';
    if (S.ended) { endShown = true; Ending.open(S, Storage.best(), false); }
    last = performance.now(); requestAnimationFrame(loop);
  }
  function apply(next) {
    if (next === S) return false;
    const fx = next.fx || []; next.fx = []; S = next;
    for (const f of fx) {
      AudioFX.play(f.type, f.n);
      if (f.text) Renderer.popText(f.src ? `[data-act="${f.src.split(':')[0]}"]${f.src.includes(':') ? `[data-arg="${f.src.split(':')[1]}"]` : ''}` : '#map', f.text);
      if (f.type === 'hurt') Renderer.shake();
      if (f.type === 'blackout') Renderer.blackout();
      if (f.type === 'end') onEnd();
    }
    return true;
  }
  function act(a, arg) { AudioFX.init(); if (apply(Rules.act(S, a, arg))) Storage.save(S); else if (a !== 'tab') AudioFX.play('tick'); }
  function onEnd() {
    const b = Storage.best(); const t = S.endT; let isNew = false;
    b.runs = (b.runs || 0) + 1; if (!b.fastest || t < b.fastest) { b.fastest = t; isNew = true; } b.most = Math.max(b.most || 0, S.souls);
    Storage.setBest(b); Storage.save(S);
    setTimeout(() => { endShown = true; Ending.open(S, b, isNew); }, 1800);
  }
  function loop(now) {
    const realDt = Math.min(1, (now - last) / 1000); last = now;
    acc += realDt * speed; let n = 0;
    while (acc >= CONFIG.tick && n < 400) { acc -= CONFIG.tick; apply(Rules.tick(S, CONFIG.tick)); n++; }
    saveAcc += realDt; if (saveAcc > CONFIG.saveEvery) { saveAcc = 0; Storage.save(S); }
    if (S.flags.dark && (S.tab === 'dark') && S.t > whaleAt) { whaleAt = S.t + 45 + Math.random() * 40; AudioFX.whale(); }
    AudioFX.setMood(S.ended ? 1 : S.asc ? 0.3 + 0.6 * (1 - S.asc.depth / CONFIG.asc.depth) : S.built.lamp ? 0.18 : 0.05);
    Renderer.update(S); Backdrop.draw(S);
    requestAnimationFrame(loop);
  }
  function newGame() { const keepSeed = (Date.now() ^ (Math.random() * 1e9)) >>> 0; Ending.close(); endShown = false; S = freshState(keepSeed); S.log.push({ n: 0, text: 'dark again. cold again. a bell of iron around you.', cls: '' }); Renderer.reset(); Storage.save(S); }
  function hardReset() { Storage.clear(); Ending.close(); endShown = false; S = freshState((Date.now() ^ (Math.random() * 1e9)) >>> 0); S.log.push({ n: 0, text: 'dark. cold. a bell of iron around you, and the weight of the water on top of it.', cls: '' }); Renderer.reset(); }

  /* ---- Input: touch, mouse and keyboard map to the same actions ---- */
  document.getElementById('app').addEventListener('click', ev => {
    const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return; act(b.dataset.act, b.dataset.arg);
  });
  document.getElementById('muteBtn').onclick = () => { AudioFX.init(); const m = AudioFX.toggle(); document.getElementById('muteBtn').textContent = m ? 'sound off' : 'sound on'; };
  const menu = document.getElementById('menu');
  document.getElementById('menuBtn').onclick = () => { menu.hidden = false; document.getElementById('mReset2').hidden = true; const b = Storage.best(); document.getElementById('menuInfo').textContent = 'lowbell saves after everything you do.' + (b.runs ? ` you have climbed out ${b.runs} time${b.runs > 1 ? 's' : ''}. best time ${Math.floor(b.fastest / 60)}:${String(Math.floor(b.fastest % 60)).padStart(2, '0')}.` : ''); };
  document.getElementById('mClose').onclick = () => { menu.hidden = true; };
  document.getElementById('mReset').onclick = () => { document.getElementById('mReset2').hidden = false; };
  document.getElementById('mReset2').onclick = () => { hardReset(); menu.hidden = true; };
  addEventListener('keydown', ev => {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (!menu.hidden) { if (ev.key === 'Escape') menu.hidden = true; return; }
    if (endShown) { if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); document.getElementById('ending').click(); } return; }
    const k = ev.key.toLowerCase(); const map = { arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down', arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right' };
    if (S.exp && map[k]) { ev.preventDefault(); act('move', map[k]); return; }
    if (k === 'k') act('knock'); else if (k === ' ' || k === 'b') { ev.preventDefault(); act('pump'); }
    else if (k === 'g') act('gather'); else if (k === 'f' || (k === 'enter' && S.exp && S.exp.fight)) act('strike');
    else if (k === 'e') act('eat'); else if (k === 'x') act('flee');
    else if ('1234'.includes(k) && k.length === 1) act('tab', ['bell', 'floor', 'dark', 'lift'][+k - 1]);
  });
  // swipe / tap on the map
  let sw = null;
  document.addEventListener('pointerdown', ev => { if (ev.target.id === 'map') sw = { x: ev.clientX, y: ev.clientY }; });
  document.addEventListener('pointerup', ev => {
    if (!sw || ev.target.id !== 'map') { sw = null; return; } const dx = ev.clientX - sw.x, dy = ev.clientY - sw.y; sw = null;
    if (!S.exp) return; let dir;
    if (Math.hypot(dx, dy) > 24) dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    else { const r = ev.target.getBoundingClientRect(), cs = r.width / N, cx = (S.exp.x + 0.5) * cs + r.left, cy = (S.exp.y + 0.5) * cs + r.top, ex = ev.clientX - cx, ey = ev.clientY - cy;
      if (Math.hypot(ex, ey) < cs * 0.4) return; dir = Math.abs(ex) > Math.abs(ey) ? (ex > 0 ? 'right' : 'left') : (ey > 0 ? 'down' : 'up'); }
    act('move', dir);
  });

  /* ---- Debug: add #debug to the address to fast-forward ---- */
  function debugPanel() {
    const p = document.getElementById('dbg'); p.hidden = false;
    const B = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; p.appendChild(b); };
    B('x1', () => speed = 1); B('x10', () => speed = 10); B('x40', () => speed = 40);
    B('+stuff', () => { const s = JSON.parse(JSON.stringify(S)); for (const r of RES) { s.res[r.id] = (s.res[r.id] || 0) + (r.id === 'bellmetal' ? 1 : 100); s.seenRes[r.id] = 1; } S = s; });
    B('→floor', () => { S = Debug.jump('floor', S); }); B('→dark', () => { S = Debug.jump('dark', S); }); B('→lift', () => { S = Debug.jump('lift', S); });
    B('→ascent', () => { S = Debug.jump('ascent', S); }); B('→end', () => { S = Debug.jump('end', S); apply(Rules.tick(S, 0.01)); });
  }
  if (/debug/.test(location.hash)) debugPanel();
  return { boot, newGame, act, get state() { return S; }, set state(v) { S = v; }, setSpeed(v) { speed = v; }, debugPanel };
})();

/* ---------------- Debug jumps (for testing the ending fast) ---------------- */
const Debug = {
  jump(stage, s0) {
    const s = JSON.parse(JSON.stringify(s0));
    const give = (o) => { for (const r in o) { s.res[r] = (s.res[r] || 0) + o[r]; s.seenRes[r] = 1; } };
    s.flags.air = 1; s.stats.pumps = Math.max(1, s.stats.pumps); s.diver.state = 'working'; s.flags.gather = 1; s.flags.crafts = 1;
    ['rope', 'hook', 'valve', 'net', 'lamp'].forEach(i => s.built[i] = s.built[i] || 1); s.flags.floor = 1; s.flags.tab_floor = 1;
    give({ kelp: 60, scrap: 60, fish: 20, rope: 20 });
    if (stage === 'floor') { s.tab = 'floor'; return s; }
    s.built.shelter = Math.max(4, s.built.shelter || 0); s.built.bed = Math.max(4, s.built.bed || 0); s.built.forge = 1; s.built.rack = 1; s.built.deeplamp = 1; s.built.harpoon = 1;
    s.pop = 8; s.jobs = { cutter: 2, scav: 3, fisher: 1, tender: 1, cook: 1 }; s.flags.dark = 1; s.flags.tab_dark = 1; give({ canister: 4, rations: 6 });
    if (stage === 'dark') { s.tab = 'dark'; return s; }
    s.flags.liftFound = 1; s.flags.tab_lift = 1; give({ glass: 20, bellmetal: 1, scrap: 300, rope: 80, kelp: 80, canister: 8 });
    if (stage === 'lift') { s.tab = 'lift'; return s; }
    LIFT_PARTS.forEach(p => s.built[p] = 1);
    if (stage === 'ascent') { s.tab = 'lift'; return s; }
    s.asc = { depth: 0, phase: 'knocked', stall: 0, marks: 5 }; s.q.push({ at: s.t, ev: 'end' }); return s;
  },
};

window.Lowbell = { App, Rules, CONFIG, DATA: { ITEMS, JOBS, LANDMARKS, ENEMIES, TEXT }, freshState, MapGen, Debug };
try { window.claude?.hot?.snapshot?.(() => ({ state: App.state })); } catch (e) { }
(window.claude?.hot?.ready ? window.claude.hot.ready(App.boot) : App.boot(window.claude?.hot?.data ?? {}));
</script>
