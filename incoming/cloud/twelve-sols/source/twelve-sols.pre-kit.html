<title>Twelve Sols</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1a0e11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>/* Layout: one phone-height column; scene on top, needs, tabs, scrolling panel, sticky End Sol. Single dark look on purpose (night on a red world). */
:root{
  color-scheme:dark;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#1a0e11; --panel:#2a171a; --panel2:#3a2225; --line:#4d2e2f; --ink:#f6e8d6; --muted:#c4a690;
  --teal:#4fd1c5; --rust:#e0603f; --gold:#f2c14e; --bad:#ff6b5d; --good:#8be07a;
  --air:#9ee7ff; --warm:#ff8a4c; --food:#a9cf63; --hull:#c9a0ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.35 var(--body);overscroll-behavior:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.top{display:flex;align-items:center;gap:8px;padding:8px 0 6px}
.top .sol{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:.3px;white-space:nowrap}
.top .sol small{color:var(--muted);font-weight:600}
.pips{display:flex;gap:3px;flex:1;min-width:0}
.pip{height:10px;flex:1;max-width:20px;border-radius:3px;background:var(--gold);opacity:.95}
.pip.used{background:var(--panel2)}
.pip.lamp{background:#ffe9a8}
.pip.lamp.used{background:var(--panel2)}
.pip.off{background:transparent;border:1px dashed var(--line)}
.ibtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:40px;height:36px;padding:0 8px}
#scene{width:100%;height:128px;border-radius:12px;display:block;background:#3b1a1c}
.fore{display:flex;gap:6px;align-items:center;margin:6px 0 4px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12.5px;color:var(--ink)}
.chip.warn{border-color:var(--rust);color:#ffc2a8}
.needs{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin:2px 0 6px;position:relative}
.need{font-size:12px}
.need .row{display:flex;justify-content:space-between;color:var(--muted)}
.need .row b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:9px;background:#120709;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;transition:width .25s ease}
.need.low .bar{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--bad)}}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:6px}
.tab{background:var(--panel);border:1px solid var(--line);border-radius:10px;height:40px;font-weight:700;font-size:14px;position:relative}
.tab.on{background:var(--teal);color:#0d2422;border-color:var(--teal)}
.tab .dot{position:absolute;top:4px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
#panel{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.sect{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.8px;margin:8px 2px 5px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
.card .grow{flex:1;min-width:0}
.card h3{margin:0 0 2px;font-size:15px}
.card .sub{font-size:12.5px;color:var(--muted)}
.card.done{opacity:.5}
.go{background:var(--gold);color:#2a1606;border:0;border-radius:10px;min-height:44px;min-width:76px;padding:0 12px;font-weight:800}
.go.alt{background:var(--teal);color:#0d2422}
.go:disabled{background:var(--panel2);color:var(--muted);font-weight:600}
.why{font-size:11.5px;color:#ffb79c;margin-top:2px}
.icons{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:72px;padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-size:11px;line-height:1.1;text-align:center}
.item .n{position:absolute;top:3px;left:6px;font-weight:800;font-size:12px}
.item .sec{position:absolute;top:3px;right:5px;color:var(--gold);font-weight:800;font-size:11px}
.item.sel{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset}
.item .mark{position:absolute;bottom:3px;right:5px;font-size:11px;font-weight:800}
.mk-known{color:var(--good)} .mk-dud{color:#8a6b62} .mk-untried{color:var(--gold)}
.trybox{background:var(--panel2);border-radius:12px;padding:10px;margin:8px 0;display:flex;align-items:center;gap:10px}
.eq{display:flex;align-items:center;gap:4px;font-weight:700}
.foot{display:flex;gap:8px;align-items:center;padding:6px 0 8px;border-top:1px solid var(--line)}
.log{flex:1;min-width:0;font-size:12.5px;color:var(--muted);max-height:34px;overflow:hidden}
.log .new{color:var(--gold)} .log .note{color:var(--teal)} .log .dud{color:#b08a7e} .log .good{color:var(--good)}
.endbtn{background:var(--rust);color:#fff;border:0;border-radius:12px;min-height:46px;padding:0 14px;font-weight:800;white-space:nowrap}
.endbtn.armed{background:#ff2f2f}
.list{margin:0;padding:0;list-style:none}
.list li{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:5px;font-size:13.5px}
.list li.hint{color:var(--teal);font-style:italic}
.list li.unk{color:#80665c}
.stat{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
#overlay{position:fixed;inset:0;background:rgba(14,6,8,.86);display:none;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
#overlay.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:420px;width:100%;padding:18px;max-height:92vh;overflow:auto}
.modal h1{margin:0 0 4px;font-family:var(--display);font-weight:800;font-size:44px;line-height:1;letter-spacing:2px;color:var(--gold)}
.modal h2{margin:0 0 6px;font-family:var(--display);font-size:26px;text-wrap:balance}
.modal p{margin:6px 0;color:var(--muted)}
.modal .big{width:100%;min-height:52px;margin-top:8px;font-size:17px}
.modal ul{padding-left:18px;margin:6px 0;color:var(--muted)}
.rep{font-variant-numeric:tabular-nums;display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px;margin:8px 0}
.rep b{text-align:right}
.neg{color:#ffb19c}.pos{color:var(--good)}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0d0507;border:1px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.pop{position:absolute;font-weight:900;font-size:15px;pointer-events:none;animation:pop 1s forwards;z-index:5;text-shadow:0 1px 2px #000}
@keyframes pop{0%{opacity:0;transform:translateY(6px) scale(.8)}20%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-22px) scale(1)}}
.discover{animation:glow 1.2s}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--gold)}40%{box-shadow:0 0 0 6px rgba(242,193,78,.5)}100%{box-shadow:0 0 0 0 transparent}}
.dbg{font:11px/1.3 ui-monospace,monospace;color:#9b8;white-space:pre-wrap;background:#0b0506;border-radius:8px;padding:6px;margin-top:6px}
@media (max-width:360px){.tab{font-size:13px}.grid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:700px){#scene{height:92px}.top{padding:5px 0 4px}.fore{margin:4px 0 2px}.tab{height:36px}}
</style>
<div id="app">
  <header class="top" id="top"></header>
  <canvas id="scene" aria-label="Your hab on the dunes"></canvas>
  <div class="fore" id="fore"></div>
  <section class="needs" id="needs"></section>
  <nav class="tabs" id="tabs"></nav>
  <main id="panel"></main>
  <footer class="foot"><div class="log" id="log" aria-live="polite"></div><button class="endbtn" id="end" data-act="end">End Sol</button></footer>
</div>
<div id="overlay" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<script id="core">/* Twelve Sols — core rules. No DOM in this file: it runs in the browser and in Node tests.
   Layout: CONFIG (tunables) · DATA (items, recipes, builds, sites, events) · RNG (seeded) ·
   Rules (pure: newRun / check / act) · Store (validate + repair saves). */
(function (G) {
  'use strict';

  // ---------- CONFIG: every tunable number lives here ----------
  const CONFIG = {
    VERSION: 1,
    SOLS: 12,                    // rescue lands at dawn after this sol
    DAY_HOURS: 8,                // daylight hours per sol
    LAMP_HOURS: 2,               // extra bench hours after dusk with a lamp
    START: { air: 85, warm: 85, food: 85, hull: 100 },
    START_INV: { cell: 3, ice: 2, moss: 2, ration: 1, scrap: 2, wire: 1, oxy: 1, dust: 1, resin: 1 },
    HOUR_DRAIN: { air: 1, warm: 1, food: 1 },
    NIGHT_DRAIN: { air: 5, warm: 11, food: 7 },
    INSUL_WARM: 5,               // night warmth saved per insulation
    COLD_SNAP: 8,                // extra night warmth loss on a deep-cold sol
    BREACH: { hourAir: 2, nightAir: 14, nightWarm: 8 },
    STORM_BASE: 6, STORM_RAMP: 3.4, STORM_EXP: 0.9, STORM_CAP: 40,
    SURGE_MULT: 1.5, CALM_MULT: 0.6,
    SHUTTER_BLOCK: 8,
    NUMB_BELOW: 25,              // warmth under this: bench work takes 2 hours
    GUST_FROM_SOL: 8, GUST_AIR: 4,
    LINER_AIR_MULT: 0.6,
    NOTE_CHANCE: 0.35,
    BEACON_DELAY: 3, BEACON_MIN_RESCUE: 8,
    MAX_STACK: 15,
    SCORE: { perSol: 100, win: 600, earlySol: 110 },
    // Dust levels: unlocked one at a time by being rescued. Each level is harsher and scores more.
    LEVELS: [
      { name: 'Calm season', storm: 0, warm: 0, mult: 1 },
      { name: 'Dry season', storm: 4, warm: 2, mult: 1.25 },
      { name: 'Red season', storm: 8, warm: 4, mult: 1.5 },
      { name: 'Howling season', storm: 12, warm: 6, mult: 1.8 },
    ],
    DAILY_LEVEL: 1,
    STARTER_KNOWN: ['water', 'mash', 'brick', 'patch'],
    STARTER_HINTS: ['oxy', 'coil', 'heat'],
  };

  // ---------- DATA: content as data ----------
  const ITEMS = {
    ice:     { name: 'Ice Chunk',    color: '#bfe6ff', shape: 'hex' },
    dust:    { name: 'Red Dust',     color: '#d0603f', shape: 'dots' },
    scrap:   { name: 'Scrap Plate',  color: '#9aa3ad', shape: 'square' },
    wire:    { name: 'Copper Wire',  color: '#e0904a', shape: 'zig' },
    glass:   { name: 'Glass Shard',  color: '#8fe3d6', shape: 'tri' },
    moss:    { name: 'Rust Moss',    color: '#8db84a', shape: 'blob' },
    cell:    { name: 'Power Cell',   color: '#f2d14b', shape: 'bar' },
    cloth:   { name: 'Tarp Cloth',   color: '#d9c7a7', shape: 'wave' },
    resin:   { name: 'Sealant Resin', color: '#b08cd9', shape: 'drop' },
    ration:  { name: 'Old Ration',   color: '#e8b98a', shape: 'pack', use: { food: 22 } },
    water:   { name: 'Water Flask',  color: '#5fb0ff', shape: 'drop' },
    mash:    { name: 'Moss Mash',    color: '#a9cf63', shape: 'bowl', use: { food: 28 } },
    broth:   { name: 'Hot Broth',    color: '#ff9a5a', shape: 'bowl', use: { food: 20, warm: 30 } },
    oxy:     { name: 'Oxygen Can',   color: '#9ee7ff', shape: 'can', use: { air: 36 } },
    brick:   { name: 'Dust Brick',   color: '#b5523b', shape: 'brick' },
    patch:   { name: 'Hull Patch',   color: '#c9a0ff', shape: 'square', use: { hull: 30 }, hours: 1 },
    coil:    { name: 'Heat Coil',    color: '#ff7a45', shape: 'zig' },
    heat:    { name: 'Heat Pack',    color: '#ff5d3d', shape: 'pack', use: { warm: 45 } },
    antenna: { name: 'Antenna Mast', color: '#cfd6dc', shape: 'mast' },
    circuit: { name: 'Signal Board', color: '#65d18a', shape: 'board' },
  };

  const BUILDS = {
    lamp:    { name: 'Work Lamp',     max: 1, desc: '+2 bench hours after dusk' },
    planter: { name: 'Moss Planter',  max: 2, desc: '+1 Rust Moss every dawn' },
    shutter: { name: 'Storm Shutter', max: 3, desc: 'blocks 8 storm each night' },
    insul:   { name: 'Insulation',    max: 2, desc: 'saves 5 warmth each night' },
    panel:   { name: 'Solar Panel',   max: 2, desc: '+1 Power Cell every clear dawn' },
    liner:   { name: 'Suit Liner',    max: 1, desc: 'trips cost 40% less air' },
    beacon:  { name: 'Signal Beacon', max: 1, desc: 'calls the rescue lander early' },
  };

  // Each recipe: two different ingredients (order free) -> items or a build.
  const RECIPES = [
    { id: 'water',   a: 'ice',     b: 'cell',    out: { water: 3 },  hint: 'Ice melts fast with a power cell pressed against it.' },
    { id: 'mash',    a: 'moss',    b: 'water',   out: { mash: 1 },   hint: 'Soaked moss is barely food. Barely is enough.' },
    { id: 'oxy',     a: 'water',   b: 'cell',    out: { oxy: 1 },    hint: 'Run current through water and you can breathe what bubbles up.' },
    { id: 'broth',   a: 'mash',    b: 'cell',    out: { broth: 1 },  hint: 'Warm the mash on a live cell and it warms you back.' },
    { id: 'brick',   a: 'dust',    b: 'water',   out: { brick: 1 },  hint: 'Wet red dust packs into a brick.' },
    { id: 'patch',   a: 'brick',   b: 'resin',   out: { patch: 1 },  hint: 'A brick sealed in resin plugs a hole in the hull.' },
    { id: 'coil',    a: 'wire',    b: 'scrap',   out: { coil: 1 },   hint: 'Wind wire around a plate and it glows when powered.' },
    { id: 'heat',    a: 'coil',    b: 'cell',    out: { heat: 1 },   hint: 'A glowing coil plus a cell makes a hand-warmer.' },
    { id: 'lamp',    a: 'glass',   b: 'wire',    build: 'lamp',      hint: 'Glass and wire make a lamp for working after dark.' },
    { id: 'planter', a: 'moss',    b: 'dust',    build: 'planter',   hint: 'Moss grows in a tray of red dust, given a night.' },
    { id: 'shutter', a: 'brick',   b: 'scrap',   build: 'shutter',   hint: 'Plate bolted over brick takes the storm\'s punches.' },
    { id: 'insul',   a: 'cloth',   b: 'resin',   build: 'insul',     hint: 'Tarp glued into the walls holds warmth overnight.' },
    { id: 'panel',   a: 'glass',   b: 'coil',    build: 'panel',     hint: 'Glass laid over a coil can drink the weak sunlight.' },
    { id: 'liner',   a: 'cloth',   b: 'wire',    build: 'liner',     hint: 'Stitch wire through tarp for a suit liner that wastes less air.' },
    { id: 'antenna', a: 'coil',    b: 'scrap',   out: { antenna: 1 }, hint: 'A coil on a tall plate could throw a signal far.' },
    { id: 'circuit', a: 'glass',   b: 'cell',    out: { circuit: 1 }, hint: 'Etch glass on a live cell and you have a signal board.' },
    { id: 'beacon',  a: 'antenna', b: 'circuit', build: 'beacon',    hint: 'Mast plus signal board: a beacon the lander can follow.' },
  ];

  const SITES = {
    crater: { name: 'Crater Field', h: 2, air: 8,  n: 3, loot: { dust: 4, glass: 3, scrap: 2, ice: 1, cell: 1 }, note: 0 },
    wreck:  { name: 'Probe Wreck',  h: 3, air: 10, n: 4, loot: { scrap: 4, wire: 4, cell: 4, glass: 1, cloth: 1 }, note: 0.2 },
    shelf:  { name: 'Ice Shelf',    h: 2, air: 9,  n: 3, loot: { ice: 6, glass: 1, dust: 1, cell: 1 }, note: 0 },
    gully:  { name: 'Moss Gully',   h: 2, air: 8,  n: 3, loot: { moss: 5, dust: 2, ice: 1, resin: 1 }, note: 0 },
    depot:  { name: 'Old Depot',    h: 3, air: 10, n: 4, loot: { cloth: 3, resin: 3, cell: 2, ration: 2, wire: 1 }, note: 0.15 },
    dunes:  { name: 'Glass Dunes',  h: 2, air: 8,  n: 3, loot: { glass: 4, dust: 3, cell: 1, wire: 1 }, note: 0 },
  };
  const LIFE_SITES = ['shelf', 'gully'];   // one of these is always offered (no impossible sols)

  const EVENTS = {
    plain:  { name: 'Ordinary sol', text: 'Thin wind. Pale sun.', w: 5 },
    calm:   { name: 'Still air',    text: 'Tonight\'s storm will be weaker.', w: 2 },
    haze:   { name: 'Dust haze',    text: 'Trips take 1 extra hour. Panels sleep at dawn.', w: 2 },
    cold:   { name: 'Deep cold',    text: 'Tonight will steal 8 extra warmth.', w: 2 },
    surge:  { name: 'Storm surge',  text: 'Tonight\'s storm hits 50% harder.', w: 1, wPerSol: 0.35 },
    cache:  { name: 'Supply pod',   text: 'A pod thumped down by the hatch: +1 Old Ration, +1 Power Cell.', w: 1, give: { ration: 1, cell: 1 } },
    meteor: { name: 'Meteor rain',  text: 'Fragments rattled the dome: +2 Scrap Plate, +1 Glass Shard.', w: 1, give: { scrap: 2, glass: 1 } },
  };

  const NEED_KEYS = ['air', 'warm', 'food'];
  const NEED_NAMES = { air: 'Air', warm: 'Warmth', food: 'Food', hull: 'Hull' };

  const DATA = { ITEMS, BUILDS, RECIPES, SITES, LIFE_SITES, EVENTS, NEED_KEYS, NEED_NAMES };
  const RECIPE_BY_ID = {}; const RECIPE_BY_PAIR = {};
  function pairKey(a, b) { return a < b ? a + '|' + b : b + '|' + a; }
  RECIPES.forEach(r => { RECIPE_BY_ID[r.id] = r; RECIPE_BY_PAIR[pairKey(r.a, r.b)] = r; });

  // ---------- RNG: seeded, state lives in the run ----------
  function hashSeed(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^= h >>> 16) >>> 0;
  }
  function rnd(s) { // mulberry32 step on s.rng
    let t = (s.rng = (s.rng + 0x6D2B79F5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function pickW(s, table) { // table: {key: weight}
    const keys = Object.keys(table); let tot = 0; keys.forEach(k => tot += table[k]);
    let r = rnd(s) * tot;
    for (const k of keys) { r -= table[k]; if (r < 0) return k; }
    return keys[keys.length - 1];
  }

  // ---------- helpers ----------
  const clone = o => JSON.parse(JSON.stringify(o));
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  function stormPower(sol) {
    return Math.round(Math.min(CONFIG.STORM_CAP, CONFIG.STORM_BASE + CONFIG.STORM_RAMP * Math.pow(sol, CONFIG.STORM_EXP)));
  }
  function lv(s) { return CONFIG.LEVELS[s.level || 0]; }
  function stormTonight(s) {
    let p = stormPower(s.sol) + lv(s).storm;
    if (s.event === 'surge') p = Math.round(p * CONFIG.SURGE_MULT);
    if (s.event === 'calm') p = Math.round(p * CONFIG.CALM_MULT);
    const blocked = Math.min(p, (s.builds.shutter || 0) * CONFIG.SHUTTER_BLOCK);
    return { power: p, blocked, dmg: p - blocked };
  }
  function hourLimit(s) { return CONFIG.DAY_HOURS + (s.builds.lamp ? CONFIG.LAMP_HOURS : 0); }
  function isNight(s) { return s.hour >= CONFIG.DAY_HOURS; }
  function count(s, id) { return s.inv[id] || 0; }

  function newMeta() {
    return { v: CONFIG.VERSION, known: CONFIG.STARTER_KNOWN.slice(), hints: CONFIG.STARTER_HINTS.slice(), duds: [],
      best: 0, runs: 0, wins: 0, daily: {}, lastFinished: '', unlocked: 0 };
  }

  function log(s, text, kind) { s.log.push({ t: text, k: kind || '' }); if (s.log.length > 40) s.log.splice(0, s.log.length - 40); }

  function addItems(s, give, fx) {
    const lost = [];
    Object.keys(give).forEach(id => {
      const have = count(s, id); const room = CONFIG.MAX_STACK - have; const n = give[id];
      const add = Math.max(0, Math.min(room, n));
      if (add > 0) s.inv[id] = have + add;
      if (add < n) lost.push(ITEMS[id].name);
    });
    if (lost.length && fx) fx.push({ k: 'full', items: lost });
    return lost;
  }

  function rollDay(s) {
    // three distinct sites, at least one life site
    const ids = Object.keys(SITES);
    const life = LIFE_SITES[Math.floor(rnd(s) * LIFE_SITES.length)];
    const pool = ids.filter(i => i !== life); const out = [life];
    while (out.length < 3) { const k = pool.splice(Math.floor(rnd(s) * pool.length), 1)[0]; out.push(k); }
    // shuffle order
    for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(rnd(s) * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
    s.sites = out; s.visited = [false, false, false];
    if (s.sol === 1) { s.event = 'plain'; return; }
    const table = {}; Object.keys(EVENTS).forEach(k => { const e = EVENTS[k]; table[k] = e.w + (e.wPerSol || 0) * s.sol; });
    s.event = pickW(s, table);
  }

  function applyNeeds(s, delta) {
    Object.keys(delta).forEach(k => {
      if (k === 'hull') s.hull = clamp(s.hull + delta[k], 0, 100);
      else s.needs[k] = clamp(s.needs[k] + delta[k], 0, 100);
    });
  }

  // spend hours inside the hab (or outside, with the suit replacing hab air)
  function spendHours(s, h, outside) {
    for (let i = 0; i < h; i++) {
      const d = { warm: -CONFIG.HOUR_DRAIN.warm, food: -CONFIG.HOUR_DRAIN.food };
      if (!outside) d.air = -CONFIG.HOUR_DRAIN.air - (s.hull <= 0 ? CONFIG.BREACH.hourAir : 0);
      applyNeeds(s, d);
    }
    s.hour += h;
  }

  function deadNeed(s) { for (const k of NEED_KEYS) if (s.needs[k] <= 0) return k; return null; }

  function score(s, win) {
    const sc = CONFIG.SCORE; const solsDone = win ? s.rescueSol : s.sol - 1;
    let pts = solsDone * sc.perSol;
    if (win) {
      pts += sc.win + (CONFIG.SOLS - s.rescueSol) * sc.earlySol;
      pts += Math.round((s.needs.air + s.needs.warm + s.needs.food) / 3 + s.hull / 2);
    }
    return Math.round(pts * lv(s).mult);
  }

  function finish(s, meta, win, cause, fx) {
    s.result = { win, cause: cause || null, score: score(s, win), sol: s.sol };
    if (meta.lastFinished !== s.runId) {
      meta.lastFinished = s.runId; meta.runs += 1; if (win) meta.wins += 1;
      if (win && s.mode === 'normal' && (s.level || 0) >= meta.unlocked && meta.unlocked < CONFIG.LEVELS.length - 1) { meta.unlocked += 1; s.result.unlocked = meta.unlocked; }
      s.result.newBest = s.result.score > meta.best;
      if (s.result.newBest) meta.best = s.result.score;
      if (s.mode === 'daily') { const prev = meta.daily[s.day] || 0; if (s.result.score > prev) meta.daily[s.day] = s.result.score; }
    }
    fx.push({ k: win ? 'win' : 'lose', cause });
  }

  // ---------- Rules ----------
  const Rules = {
    newRun(seedStr, mode, meta, day, level) {
      let L = mode === 'daily' ? CONFIG.DAILY_LEVEL : (level == null ? (meta ? meta.unlocked : 0) : level);
      if (mode !== 'daily') L = Math.min(L, meta ? meta.unlocked : 0);
      L = clamp(L | 0, 0, CONFIG.LEVELS.length - 1);
      const s = {
        level: L,
        v: CONFIG.VERSION, runId: seedStr + ':' + (meta ? meta.runs : 0), seed: seedStr, mode: mode || 'normal', day: day || '',
        rng: hashSeed(seedStr), sol: 1, hour: 0,
        needs: { air: CONFIG.START.air, warm: CONFIG.START.warm, food: CONFIG.START.food }, hull: CONFIG.START.hull,
        inv: clone(CONFIG.START_INV), builds: {}, sites: [], visited: [], event: 'plain',
        rescueSol: CONFIG.SOLS, beaconSol: 0,
        stats: { found: [], crafts: 0, trips: 0, dmg: 0, breachNights: 0, tries: 0, duds: 0 },
        log: [], night: null, result: null,
      };
      rollDay(s);
      log(s, 'Sol 1. The lander left you a hab, some supplies, and a promise: back at dawn after Sol ' + CONFIG.SOLS + '.', 'sys');
      return s;
    },

    // Is an action allowed? Returns {ok, why, hours}
    check(s, meta, a) {
      if (!s || s.result) return { ok: false, why: 'The run is over.' };
      const limit = hourLimit(s); const left = limit - s.hour;
      switch (a.t) {
        case 'scav': {
          const id = s.sites[a.i]; const site = SITES[id];
          if (!site) return { ok: false, why: 'No such site.' };
          if (s.visited[a.i]) return { ok: false, why: 'Already picked clean today.' };
          if (isNight(s)) return { ok: false, why: 'Too dark to go out.' };
          const h = site.h + (s.event === 'haze' ? 1 : 0);
          if (s.hour + h > CONFIG.DAY_HOURS) return { ok: false, why: 'Needs ' + h + 'h of daylight.' };
          return { ok: true, hours: h, air: Rules.tripAir(s, id) };
        }
        case 'craft': {
          const A = a.a, B = a.b;
          if (!ITEMS[A] || !ITEMS[B] || A === B) return { ok: false, why: 'Pick two different items.' };
          if (count(s, A) < 1 || count(s, B) < 1) return { ok: false, why: 'Missing an ingredient.' };
          const key = pairKey(A, B); const r = RECIPE_BY_PAIR[key];
          if (!r && meta.duds.indexOf(key) >= 0) return { ok: false, why: 'Tried before: nothing useful.' };
          if (r && r.build) {
            const b = BUILDS[r.build];
            if ((s.builds[r.build] || 0) >= b.max) return { ok: false, why: b.name + ' is already maxed (' + b.max + ').' };
          }
          if (isNight(s) && !s.builds.lamp) return { ok: false, why: 'Too dark to work. A lamp would help.' };
          const h = s.needs.warm < CONFIG.NUMB_BELOW ? 2 : 1;
          if (h > left) return { ok: false, why: left <= 0 ? 'No hours left. End the sol.' : 'Numb hands: needs 2h.' };
          return { ok: true, hours: h, recipe: r || null };
        }
        case 'use': {
          const it = ITEMS[a.id];
          if (!it || !it.use) return { ok: false, why: 'Not usable.' };
          if (count(s, a.id) < 1) return { ok: false, why: 'None left.' };
          const h = it.hours || 0;
          if (h) {
            if (isNight(s) && !s.builds.lamp) return { ok: false, why: 'Too dark to patch.' };
            if (h > left) return { ok: false, why: 'Needs ' + h + 'h.' };
          }
          const useful = Object.keys(it.use).some(k => (k === 'hull' ? s.hull : s.needs[k]) < 100);
          if (!useful) return { ok: false, why: 'Already full.' };
          return { ok: true, hours: h };
        }
        case 'end': return { ok: true };
        case 'ack': return { ok: true };
        default: return { ok: false, why: 'Unknown action.' };
      }
    },

    tripAir(s, id) {
      let air = SITES[id].air + (s.sol >= CONFIG.GUST_FROM_SOL ? CONFIG.GUST_AIR : 0);
      if (s.builds.liner) air = Math.round(air * CONFIG.LINER_AIR_MULT);
      return air;
    },

    // Pure: returns {s, meta, fx}. Never mutates its inputs.
    act(s0, meta0, a) {
      const s = clone(s0), meta = clone(meta0), fx = [];
      if (a.t === 'ack') { if (s.night) s.night.seen = true; return { s, meta, fx }; }
      const c = Rules.check(s, meta, a);
      if (!c.ok) { fx.push({ k: 'blocked', why: c.why }); return { s, meta, fx }; }

      if (a.t === 'scav') {
        const id = s.sites[a.i]; const site = SITES[id];
        s.visited[a.i] = true; s.stats.trips++;
        applyNeeds(s, { air: -c.air });
        spendHours(s, c.hours, true);
        const got = {};
        for (let i = 0; i < site.n; i++) { const k = pickW(s, site.loot); got[k] = (got[k] || 0) + 1; }
        addItems(s, got, fx);
        const names = Object.keys(got).map(k => got[k] + ' ' + ITEMS[k].name).join(', ');
        log(s, site.name + ': ' + names + '. (−' + c.air + ' air)', 'loot');
        fx.push({ k: 'loot', site: id, got });
        // field note: a hint for a recipe you don't know yet
        if (rnd(s) < CONFIG.NOTE_CHANCE + site.note) {
          const unknown = RECIPES.filter(r => meta.known.indexOf(r.id) < 0 && meta.hints.indexOf(r.id) < 0);
          if (unknown.length) {
            const r = unknown[Math.floor(rnd(s) * unknown.length)];
            meta.hints.push(r.id);
            log(s, 'Field note found: "' + r.hint + '"', 'note');
            fx.push({ k: 'note', id: r.id });
          }
        }
      } else if (a.t === 'craft') {
        const key = pairKey(a.a, a.b); const r = c.recipe;
        spendHours(s, c.hours, false); s.stats.tries++;
        if (!r) {
          meta.duds.push(key); s.stats.duds++;
          log(s, ITEMS[a.a].name + ' + ' + ITEMS[a.b].name + ': nothing useful. Noted in the journal.', 'dud');
          fx.push({ k: 'dud', key });
        } else {
          s.inv[r.a]--; s.inv[r.b]--;
          if (!s.inv[r.a]) delete s.inv[r.a];
          if (!s.inv[r.b]) delete s.inv[r.b];
          const isNew = meta.known.indexOf(r.id) < 0;
          if (isNew) { meta.known.push(r.id); s.stats.found.push(r.id); }
          s.stats.crafts++;
          let made;
          if (r.build) {
            s.builds[r.build] = (s.builds[r.build] || 0) + 1; made = BUILDS[r.build].name;
            if (r.build === 'beacon') {
              s.beaconSol = s.sol;
              const res = Math.max(s.sol + CONFIG.BEACON_DELAY, CONFIG.BEACON_MIN_RESCUE);
              s.rescueSol = Math.min(s.rescueSol, res);
              log(s, 'The beacon is pulsing. The lander answers: dawn after Sol ' + s.rescueSol + '.', 'good');
            }
          } else {
            addItems(s, r.out, fx);
            made = Object.keys(r.out).map(k => r.out[k] + ' ' + ITEMS[k].name).join(', ');
          }
          log(s, (isNew ? 'Discovered! ' : 'Made ') + made + '.', isNew ? 'new' : 'make');
          fx.push({ k: isNew ? 'discover' : 'craft', id: r.id });
        }
      } else if (a.t === 'use') {
        const it = ITEMS[a.id];
        s.inv[a.id]--; if (!s.inv[a.id]) delete s.inv[a.id];
        if (c.hours) spendHours(s, c.hours, false);
        applyNeeds(s, it.use);
        log(s, 'Used ' + it.name + '.', 'use');
        fx.push({ k: 'use', id: a.id });
      } else if (a.t === 'end') {
        Rules.night(s, meta, fx);
        return { s, meta, fx };
      }
      const dn = deadNeed(s);
      if (dn) finish(s, meta, false, dn, fx);
      return { s, meta, fx };
    },

    night(s, meta, fx) {
      const st = stormTonight(s);
      const rep = { sol: s.sol, event: s.event, power: st.power, blocked: st.blocked, dmg: st.dmg,
        hullBefore: s.hull, breach: false, drain: {}, dawn: {}, seen: false };
      s.hull = clamp(s.hull - st.dmg, 0, 100); s.stats.dmg += st.dmg;
      rep.hullAfter = s.hull;
      if (s.hull <= 0) { rep.breach = true; s.stats.breachNights++; }
      const warmLoss = Math.max(0, CONFIG.NIGHT_DRAIN.warm + lv(s).warm - (s.builds.insul || 0) * CONFIG.INSUL_WARM
        + (s.event === 'cold' ? CONFIG.COLD_SNAP : 0) + (rep.breach ? CONFIG.BREACH.nightWarm : 0));
      const airLoss = CONFIG.NIGHT_DRAIN.air + (rep.breach ? CONFIG.BREACH.nightAir : 0);
      rep.drain = { air: airLoss, warm: warmLoss, food: CONFIG.NIGHT_DRAIN.food };
      applyNeeds(s, { air: -airLoss, warm: -warmLoss, food: -CONFIG.NIGHT_DRAIN.food });
      fx.push({ k: 'storm', dmg: st.dmg, power: st.power, breach: rep.breach });
      s.night = rep;
      const dn = deadNeed(s);
      if (dn) { log(s, 'Night of Sol ' + s.sol + ': the storm hit for ' + st.dmg + '.', 'storm'); finish(s, meta, false, dn, fx); return; }
      if (s.sol >= s.rescueSol) {
        log(s, 'Dawn. Engines overhead. The lander is down.', 'good');
        rep.rescued = true; finish(s, meta, true, null, fx); return;
      }
      // dawn
      const haze = s.event === 'haze';
      s.sol += 1; s.hour = 0;
      const give = {};
      if (s.builds.planter) give.moss = s.builds.planter;
      if (s.builds.panel && !haze) give.cell = s.builds.panel;
      if (Object.keys(give).length) addItems(s, give, fx);
      rep.dawn = give;
      rollDay(s);
      const ev = EVENTS[s.event];
      if (ev.give) addItems(s, ev.give, fx);
      rep.nextEvent = s.event;
      log(s, 'Sol ' + s.sol + ' — ' + ev.name + '. ' + ev.text, 'sys');
    },

    // knowledge helpers for the UI and bots
    secretsFor(meta, id) { return RECIPES.filter(r => (r.a === id || r.b === id) && meta.known.indexOf(r.id) < 0).length; },
    pairStatus(meta, a, b) {
      const key = pairKey(a, b); const r = RECIPE_BY_PAIR[key];
      if (r && meta.known.indexOf(r.id) >= 0) return { st: 'known', r };
      if (meta.duds.indexOf(key) >= 0) return { st: 'dud' };
      return { st: 'untried' };
    },
    legal(s, meta) { // every action a bot or test could try, with check results
      const out = [];
      s.sites.forEach((_, i) => out.push({ t: 'scav', i }));
      const ids = Object.keys(s.inv);
      for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) out.push({ t: 'craft', a: ids[i], b: ids[j] });
      ids.forEach(id => { if (ITEMS[id].use) out.push({ t: 'use', id }); });
      out.push({ t: 'end' });
      return out.filter(a => Rules.check(s, meta, a).ok);
    },
    stormTonight, stormPower, level: lv, hourLimit, pairKey, hashSeed, score,
  };

  // ---------- Store: validate and repair saved data ----------
  const isInt = (v, lo, hi) => typeof v === 'number' && Number.isInteger(v) && v >= lo && v <= hi;
  const isNum = (v, lo, hi) => typeof v === 'number' && isFinite(v) && v >= lo && v <= hi;
  const Store = {
    validateRun(s) {
      try {
        if (!s || typeof s !== 'object' || s.v !== CONFIG.VERSION) return null;
        if (!isInt(s.sol, 1, CONFIG.SOLS) || !isInt(s.hour, 0, CONFIG.DAY_HOURS + CONFIG.LAMP_HOURS)) return null;
        if (!isInt(s.rescueSol, 1, CONFIG.SOLS) || s.sol > s.rescueSol) return null;
        if (!isInt(s.rng, 0, 4294967295) || typeof s.seed !== 'string' || typeof s.runId !== 'string') return null;
        if (!s.needs || !NEED_KEYS.every(k => isNum(s.needs[k], 0, 100)) || !isNum(s.hull, 0, 100)) return null;
        if (!s.inv || typeof s.inv !== 'object') return null;
        for (const k of Object.keys(s.inv)) if (!ITEMS[k] || !isInt(s.inv[k], 1, CONFIG.MAX_STACK)) return null;
        if (!s.builds || typeof s.builds !== 'object') return null;
        for (const k of Object.keys(s.builds)) if (!BUILDS[k] || !isInt(s.builds[k], 0, BUILDS[k].max)) return null;
        if (!Array.isArray(s.sites) || s.sites.length !== 3 || !s.sites.every(k => SITES[k])) return null;
        if (!Array.isArray(s.visited) || s.visited.length !== 3 || !s.visited.every(v => typeof v === 'boolean')) return null;
        if (!EVENTS[s.event]) return null;
        if (!Array.isArray(s.log) || !s.stats || typeof s.stats !== 'object' || !Array.isArray(s.stats.found)) return null;
        if (s.result !== null && (typeof s.result !== 'object' || typeof s.result.win !== 'boolean')) return null;
        if (s.night !== null && typeof s.night !== 'object') return null;
        if (s.mode !== 'normal' && s.mode !== 'daily') return null;
        if (!isInt(s.level, 0, CONFIG.LEVELS.length - 1)) return null;
        return s;
      } catch (e) { return null; }
    },
    repairMeta(m) {
      const out = newMeta();
      if (!m || typeof m !== 'object') return out;
      const ids = r => Array.isArray(r) ? r.filter((x, i) => typeof x === 'string' && RECIPE_BY_ID[x] && r.indexOf(x) === i) : [];
      out.known = Array.from(new Set(CONFIG.STARTER_KNOWN.concat(ids(m.known))));
      out.hints = Array.from(new Set(CONFIG.STARTER_HINTS.concat(ids(m.hints))));
      if (Array.isArray(m.duds)) out.duds = m.duds.filter((k, i) => {
        if (typeof k !== 'string' || m.duds.indexOf(k) !== i) return false;
        const p = k.split('|'); return p.length === 2 && ITEMS[p[0]] && ITEMS[p[1]] && p[0] < p[1] && !RECIPE_BY_PAIR[k];
      });
      ['best', 'runs', 'wins'].forEach(k => { if (isInt(m[k], 0, 1e7)) out[k] = m[k]; });
      if (isInt(m.unlocked, 0, CONFIG.LEVELS.length - 1)) out.unlocked = m.unlocked;
      if (out.wins > out.runs) out.wins = out.runs;
      if (m.daily && typeof m.daily === 'object') Object.keys(m.daily).forEach(d => {
        if (/^\d{8}$/.test(d) && isInt(m.daily[d], 0, 1e7)) out.daily[d] = m.daily[d];
      });
      if (typeof m.lastFinished === 'string') out.lastFinished = m.lastFinished;
      return out;
    },
  };

  G.TwelveSols = { CONFIG, DATA, Rules, Store, newMeta, pairKey, RECIPE_BY_ID, RECIPE_BY_PAIR };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script id="ui">/* Twelve Sols — UI: Storage, Audio, Renderer, Input. Reads state, calls Rules.act, never changes rules. */
(function () {
  'use strict';
  const { CONFIG, DATA, Rules, Store, newMeta, RECIPE_BY_ID } = window.TwelveSols;
  const { ITEMS, BUILDS, RECIPES, SITES, EVENTS, NEED_NAMES } = DATA;
  const $ = sel => document.querySelector(sel);
  const DEBUG = /[?&]debug=1/.test(location.search);

  // ---------- Storage (localStorage in try/catch, validated) ----------
  const KEY = { run: 'twelvesols.v1.run', meta: 'twelvesols.v1.meta', prefs: 'twelvesols.v1.prefs', bad: 'twelvesols.v1.damaged' };
  const Storage = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },
    loadMeta() {
      const raw = Storage.get(KEY.meta); if (!raw) return newMeta();
      try { return Store.repairMeta(JSON.parse(raw)); } catch (e) { Storage.set(KEY.bad + '.meta', raw); return newMeta(); }
    },
    loadRun() {
      const raw = Storage.get(KEY.run); if (!raw) return { run: null };
      let parsed = null; try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }
      const ok = Store.validateRun(parsed);
      if (!ok) { Storage.set(KEY.bad, raw); Storage.del(KEY.run); return { run: null, damaged: true }; }
      return { run: ok };
    },
    save() {
      Storage.set(KEY.meta, JSON.stringify(G.meta));
      if (G.s) Storage.set(KEY.run, JSON.stringify(G.s)); else Storage.del(KEY.run);
    },
    loadPrefs() { try { return Object.assign({ sound: true }, JSON.parse(Storage.get(KEY.prefs) || '{}')); } catch (e) { return { sound: true }; } },
    savePrefs() { Storage.set(KEY.prefs, JSON.stringify(G.prefs)); },
  };

  // ---------- Audio (code-generated, starts after first gesture, stops when hidden) ----------
  const Audio = {
    ctx: null, master: null, musicTimer: 0, step: 0,
    unlock() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        try { this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = 0.6; this.master.connect(this.ctx.destination); } catch (e) { this.ctx = null; return; }
      }
      if (this.ctx.state === 'suspended' && !document.hidden && G.prefs.sound) this.ctx.resume().catch(() => {});
      if (!this.musicTimer) this.music(true);
    },
    ok() { return this.ctx && G.prefs.sound && !document.hidden; },
    tone(f, d, type = 'sine', g = 0.15, delay = 0, slide = 0) {
      if (!this.ok()) return; const c = this.ctx, t = c.currentTime + delay;
      const o = c.createOscillator(), v = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
      v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(g, t + 0.015); v.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(v); v.connect(this.master); o.start(t); o.stop(t + d + 0.05);
    },
    noise(d, cutoff = 600, g = 0.25) {
      if (!this.ok()) return; const c = this.ctx, t = c.currentTime;
      const len = Math.floor(c.sampleRate * d), buf = c.createBuffer(1, len, c.sampleRate), data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = c.createBufferSource(), f = c.createBiquadFilter(), v = c.createGain();
      f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t); f.frequency.linearRampToValueAtTime(cutoff * 0.4, t + d);
      v.gain.value = g; src.buffer = buf; src.connect(f); f.connect(v); v.connect(this.master); src.start(t);
    },
    sfx(k) {
      switch (k) {
        case 'tap': this.tone(520, 0.06, 'triangle', 0.06); break;
        case 'loot': this.tone(330, 0.08, 'triangle', 0.1); this.tone(494, 0.1, 'triangle', 0.09, 0.07); break;
        case 'craft': this.tone(392, 0.09, 'square', 0.05); this.tone(587, 0.14, 'triangle', 0.09, 0.06); break;
        case 'discover': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.22, 'triangle', 0.1, i * 0.08)); break;
        case 'dud': this.tone(180, 0.22, 'sawtooth', 0.06, 0, -80); break;
        case 'use': this.tone(440, 0.12, 'sine', 0.12, 0, 220); break;
        case 'note': this.tone(880, 0.3, 'sine', 0.07); this.tone(1320, 0.3, 'sine', 0.05, 0.12); break;
        case 'blocked': this.tone(140, 0.12, 'square', 0.05); break;
        case 'storm': this.noise(1.6, 900, 0.35); this.tone(70, 0.9, 'sawtooth', 0.08, 0.1, -30); break;
        case 'win': [392, 494, 587, 784, 988].forEach((f, i) => this.tone(f, 0.35, 'triangle', 0.11, i * 0.12)); break;
        case 'lose': [330, 262, 196].forEach((f, i) => this.tone(f, 0.5, 'sine', 0.1, i * 0.25)); break;
      }
    },
    music(on) { // quiet generative pad, pentatonic minor
      clearTimeout(this.musicTimer); this.musicTimer = 0;
      if (!on || !this.ok()) return;

      const tick = () => {
        if (!this.ok()) { this.musicTimer = 0; return; }

        const f = scale[(this.step * 3 + (this.step >> 2)) % scale.length] * (night ? 0.5 : 1);

  // ---------- global UI state ----------
  const G = { s: null, meta: null, prefs: null, tab: 'go', sel: [], armed: 0, lastDiscover: null, toastT: 0 };

      case 'dots': p = `<circle cx="10" cy="12" r="5" fill="${c}"/><circle cx="20" cy="10" r="4" fill="${c}"/><circle cx="16" cy="20" r="6" fill="${c}"/>`; break;
      case 'square': p = `<rect x="5" y="6" width="20" height="18" rx="3" fill="${c}"/><path d="M8 11h14M8 16h10" stroke="#0004" stroke-width="2"/>`; break;
      case 'zig': p = `<path d="M4 15 l4-7 4 14 4-14 4 14 4-7" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round"/>`; break;
      case 'tri': p = `<polygon points="15,3 27,25 3,25" fill="${c}" opacity=".9"/><path d="M15 8 L20 22" stroke="#fff8" stroke-width="2"/>`; break;
      case 'blob': p = `<path d="M6 22 C2 12 12 4 16 9 C20 2 30 10 24 18 C28 24 14 28 6 22Z" fill="${c}"/>`; break;
      case 'bar': p = `<rect x="8" y="5" width="14" height="21" rx="3" fill="${c}"/><rect x="12" y="2" width="6" height="4" fill="${c}"/><path d="M16 10 l-3 6h5l-3 6" stroke="#2a1606" stroke-width="2" fill="none"/>`; break;
      case 'wave': p = `<path d="M3 10 q6-6 12 0 t12 0 v12 q-6-6-12 0 t-12 0z" fill="${c}"/>`; break;
      case 'drop': p = `<path d="M15 3 C20 12 24 16 24 20 a9 9 0 0 1-18 0 C6 16 10 12 15 3z" fill="${c}"/>`; break;
      case 'pack': p = `<rect x="5" y="8" width="20" height="16" rx="4" fill="${c}"/><path d="M10 8 v-3 h10 v3" stroke="${c}" stroke-width="2" fill="none"/>`; break;
      case 'bowl': p = `<path d="M4 13 h22 a11 11 0 0 1-22 0z" fill="${c}"/><path d="M11 9 q2-4 0-6 M17 9 q2-4 0-6" stroke="${c}" stroke-width="2" fill="none"/>`; break;
      case 'can': p = `<rect x="8" y="7" width="14" height="19" rx="6" fill="${c}"/><rect x="12" y="3" width="6" height="5" rx="1" fill="#cfd6dc"/>`; break;
      case 'brick': p = `<rect x="3" y="8" width="24" height="14" rx="2" fill="${c}"/><path d="M3 15h24M11 8v7M19 15v7" stroke="#0005" stroke-width="1.6"/>`; break;
      case 'mast': p = `<path d="M15 27 V6 M8 27 L15 12 L22 27" stroke="${c}" stroke-width="2.5" fill="none"/><circle cx="15" cy="5" r="3" fill="var(--rust)"/>`; break;
      case 'board': p = `<rect x="4" y="6" width="22" height="18" rx="2" fill="${c}"/><path d="M8 11h6v6h8M14 17v4" stroke="#0d2422" stroke-width="2" fill="none"/>`; break;

  }
  const buildIcon = (size = 26) => `<svg width="${size}" height="${size}" viewBox="0 0 30 30" aria-hidden="true"><path d="M3 24 A12 12 0 0 1 27 24 Z" fill="#4fd1c5"/><rect x="12" y="15" width="6" height="9" fill="#1a0e11"/></svg>`;
  const esc = t => String(t).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

  // ---------- actions ----------
  function doAct(a) {
    if (!G.s) return;
    const out = Rules.act(G.s, G.meta, a);
    G.s = out.s; G.meta = out.meta;
    Storage.save();
    handleFx(out.fx, a);
    render();
  }

  function handleFx(fx, a) {
    fx.forEach(f => {
      switch (f.k) {
        case 'blocked': toast(f.why); Audio.sfx('blocked'); break;
        case 'loot': Audio.sfx('loot'); Scene.burst('loot'); break;
        case 'craft': Audio.sfx('craft'); Scene.burst('craft'); break;
        case 'discover': Audio.sfx('discover'); G.lastDiscover = f.id; toast('Discovered: ' + recipeOutName(RECIPE_BY_ID[f.id]) + '! It stays in your journal forever.'); Scene.burst('discover'); break;
        case 'dud': Audio.sfx('dud'); toast('Nothing useful. The journal remembers, so you never waste that hour again.'); break;
        case 'use': Audio.sfx('use'); popNeeds(ITEMS[f.id].use); break;
        case 'note': setTimeout(() => { Audio.sfx('note'); toast('Field note found. Check the Journal.'); }, 350); break;
        case 'full': toast('Pack full (' + CONFIG.MAX_STACK + ' max): left ' + f.items.join(', ') + ' behind.'); break;
        case 'storm': Audio.sfx('storm'); Scene.shake(f.dmg); break;
        case 'win': setTimeout(() => Audio.sfx('win'), 600); if (G.s.result && G.s.result.unlocked) { G.prefs.level = null; Storage.savePrefs(); } break;
        case 'lose': setTimeout(() => Audio.sfx('lose'), 600); break;
      }
    });
    if (a.t === 'craft') G.sel = [];
  }

  function recipeOutName(r) {
    if (r.build) return BUILDS[r.build].name;
    return Object.keys(r.out).map(k => (r.out[k] > 1 ? r.out[k] + ' ' : '') + ITEMS[k].name).join(', ');
  }
  function useText(id) {
    const u = ITEMS[id].use; if (!u) return '';
    return Object.keys(u).map(k => '+' + u[k] + ' ' + NEED_NAMES[k]).join(', ') + (ITEMS[id].hours ? ' (' + ITEMS[id].hours + 'h)' : '');
  }

  function toast(t) {
    const el = $('#toast'); el.textContent = t; el.classList.add('on');
    clearTimeout(G.toastT); G.toastT = setTimeout(() => el.classList.remove('on'), 2600);
  }
  function popNeeds(use) {
    const box = $('.needs'); if (!box) return;
    Object.keys(use).forEach((k, i) => {
      const el = box.querySelector('[data-need="' + k + '"]'); if (!el) return;
      const sp = document.createElement('span'); sp.className = 'pop'; sp.textContent = '+' + use[k];
      sp.style.color = 'var(--' + k + ')'; sp.style.left = (el.offsetLeft + el.offsetWidth - 40) + 'px'; sp.style.top = (el.offsetTop - 4 - i * 2) + 'px';
      box.appendChild(sp); setTimeout(() => sp.remove(), 1000);

  }

  // ---------- Scene (canvas) ----------
  const Scene = {
    cv: null, cx: null, w: 0, h: 0, parts: [], shakeT: 0, shakeAmp: 0, t: 0, raf: 0, flash: 0, flashColor: '#fff',
    init() { this.cv = $('#scene'); this.cx = this.cv.getContext('2d'); this.resize(); },
    resize() {
      const r = this.cv.getBoundingClientRect(); const dpr = Math.min(2, window.devicePixelRatio || 1);
      this.w = Math.max(200, r.width || 360); this.h = Math.max(90, r.height || 128);
      this.cv.width = Math.round(this.w * dpr); this.cv.height = Math.round(this.h * dpr);
      if (this.cx) this.cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    },
    shake(dmg) { this.shakeT = 0.9; this.shakeAmp = Math.min(9, 2 + dmg / 4); for (let i = 0; i < 70; i++) this.dust(true); },
    burst(kind) {
      const col = kind === 'discover' ? '#f2c14e' : kind === 'loot' ? '#e0904a' : '#4fd1c5';
      for (let i = 0; i < (kind === 'discover' ? 40 : 16); i++) this.parts.push({ x: this.w * 0.5, y: this.h * 0.62, vx: (Math.random() - 0.5) * 160, vy: -Math.random() * 140, life: 0.9, c: col, g: 220, r: 2 });
      if (kind === 'discover') { this.flash = 0.5; this.flashColor = '#f2c14e'; }
    },
    dust(strong) {
      const s = G.s; const pow = s ? Rules.stormTonight(s).power : 10;
      this.parts.push({ x: -10, y: Math.random() * this.h * 0.85, vx: 60 + pow * 4 + (strong ? 200 : 0) + Math.random() * 60, vy: (Math.random() - 0.4) * 20, life: 6, c: strong ? '#ffb08a' : '#d9785a', g: 0, r: strong ? 2.2 : 1.4, dust: true });
    },
    loop(ts) {
      const dt = Math.min(0.05, (ts - (this.t || ts)) / 1000); this.t = ts;
      this.update(dt); this.draw();
      this.raf = requestAnimationFrame(t => this.loop(t));
    },
    start() { if (!this.raf) this.raf = requestAnimationFrame(t => { this.t = t; this.loop(t); }); },
    stop() { cancelAnimationFrame(this.raf); this.raf = 0; this.t = 0; },
    update(dt) {
      const s = G.s; const pow = s ? Rules.stormTonight(s).power : 8;
      if (Math.random() < dt * (3 + pow * 0.6)) this.dust(false);
      this.parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt; p.life -= dt; });
      this.parts = this.parts.filter(p => p.life > 0 && p.x < this.w + 20 && p.y < this.h + 20).slice(-260);
      if (this.shakeT > 0) this.shakeT -= dt; if (this.flash > 0) this.flash -= dt;
    },
    draw() {
      const c = this.cx, w = this.w, h = this.h, s = G.s; if (!c) return;
      const hour = s ? s.hour : 3; const night = hour >= CONFIG.DAY_HOURS;
      const k = Math.min(1, hour / CONFIG.DAY_HOURS);
      c.save();
      if (this.shakeT > 0) c.translate((Math.random() - 0.5) * this.shakeAmp, (Math.random() - 0.5) * this.shakeAmp);
      // sky
      const g = c.createLinearGradient(0, 0, 0, h);
      if (night) { g.addColorStop(0, '#120a1c'); g.addColorStop(1, '#3a1626'); }
      else { g.addColorStop(0, mix('#e9a27b', '#5a2a4a', k)); g.addColorStop(1, mix('#f6cfa4', '#b0523e', k)); }
      c.fillStyle = g; c.fillRect(-10, -10, w + 20, h + 20);
      // sun / stars
      if (!night) { const sx = w * (0.1 + 0.8 * k), sy = h * (0.55 - Math.sin(k * Math.PI) * 0.4); c.fillStyle = '#fff3d6'; c.globalAlpha = 0.85; c.beginPath(); c.arc(sx, sy, 7, 0, 7); c.fill(); c.globalAlpha = 1; }
      else { c.fillStyle = '#fff'; for (let i = 0; i < 26; i++) { c.globalAlpha = 0.3 + ((i * 37) % 10) / 20; c.fillRect((i * 97) % w, (i * 53) % (h * 0.5), 1.5, 1.5); } c.globalAlpha = 1; }
      // dunes
      c.fillStyle = night ? '#4a1d20' : '#a8452f'; dune(c, w, h, 0.70, 0.08, 1.3);
      c.fillStyle = night ? '#341316' : '#7d3122'; dune(c, w, h, 0.82, 0.06, 2.1);
      // hab
      const hx = w * 0.5, hy = h * 0.84, R = Math.min(48, h * 0.38);
      const b = s ? s.builds : {};
      if (b.panel) for (let i = 0; i < b.panel; i++) { c.fillStyle = '#2d5d7a'; c.save(); c.translate(hx + R + 14 + i * 26, hy - 4); c.rotate(-0.3); c.fillRect(0, -10, 22, 10); c.strokeStyle = '#8fe3d6'; c.strokeRect(0, -10, 22, 10); c.restore(); }
      if (b.planter) for (let i = 0; i < b.planter; i++) { c.fillStyle = '#5e3a26'; c.fillRect(hx - R - 34 - i * 24, hy - 8, 20, 8); c.fillStyle = '#8db84a'; for (let j = 0; j < 4; j++) c.fillRect(hx - R - 32 - i * 24 + j * 5, hy - 13 - (j % 2) * 3, 3, 6); }
      if (b.beacon) { c.strokeStyle = '#cfd6dc'; c.lineWidth = 2; c.beginPath(); c.moveTo(hx + R * 0.5, hy - R * 0.7); c.lineTo(hx + R * 0.5, hy - R * 1.5); c.stroke(); if (Math.floor(performance.now() / 500) % 2) { c.fillStyle = '#ff5d3d'; c.beginPath(); c.arc(hx + R * 0.5, hy - R * 1.5, 4, 0, 7); c.fill(); } }
      c.fillStyle = '#3e8f89'; c.beginPath(); c.arc(hx, hy, R, Math.PI, 0); c.fill();
      c.fillStyle = '#4fd1c5'; c.beginPath(); c.arc(hx, hy, R - 5, Math.PI, 0); c.fill();
      // windows glow
      const lit = night ? (b.lamp ? '#ffe28a' : '#7a5a3a') : '#cdeff0';
      c.fillStyle = lit; c.fillRect(hx - R * 0.55, hy - R * 0.45, R * 0.3, R * 0.22); c.fillRect(hx + R * 0.25, hy - R * 0.45, R * 0.3, R * 0.22);
      c.fillStyle = '#1a0e11'; c.fillRect(hx - 7, hy - 16, 14, 16);
      // shutters
      const sh = b.shutter || 0;
      for (let i = 0; i < sh; i++) { const a0 = Math.PI + 0.25 + i * 0.95; c.strokeStyle = '#9aa3ad'; c.lineWidth = 6; c.beginPath(); c.arc(hx, hy, R + 3, a0, a0 + 0.7); c.stroke(); }
      // damage

    },
  };
  function dune(c, w, h, base, amp, f) { c.beginPath(); c.moveTo(-10, h + 10); for (let x = -10; x <= w + 10; x += 8) c.lineTo(x, h * base + Math.sin(x / w * Math.PI * f + f) * h * amp); c.lineTo(w + 10, h + 10); c.fill(); }

  // ---------- Renderer ----------
  function render() {
    const s = G.s;
    if (!s) return;
    renderTop(); renderPanel(); renderFoot();
    if (s.result && !(s.night && !s.night.seen)) showEnd();
    else if (s.night && !s.night.seen) showNight();
  }

  function renderTop() {
    const s = G.s; const lim = Rules.hourLimit(s);
    let pips = '';
    for (let i = 0; i < CONFIG.DAY_HOURS + CONFIG.LAMP_HOURS; i++) {
      const lamp = i >= CONFIG.DAY_HOURS; const avail = i < lim;
      pips += `<span class="pip${lamp ? ' lamp' : ''}${i < s.hour ? ' used' : ''}${!avail ? ' off' : ''}"></span>`;
    }
    $('#top').innerHTML = `<div class="sol">Sol ${s.sol}<small>/${s.rescueSol}</small></div><div class="pips" title="Hours left today">${pips}</div>
      <button class="ibtn" data-act="sound" aria-label="Sound">${G.prefs.sound ? '♪' : '×'}</button><button class="ibtn" data-act="menu" aria-label="Menu">≡</button>`;
    const st = Rules.stormTonight(s); const ev = EVENTS[s.event];
    const left = lim - s.hour;
    $('#fore').innerHTML = `<span class="chip ${st.dmg >= s.hull ? 'warn' : ''}">Tonight's storm ${st.power}${st.blocked ? ' − ' + st.blocked + ' shutters' : ''} → hull −${st.dmg}</span>
      <span class="chip">${esc(ev.name)}</span>${s.level ? `<span class="chip warn">${esc(CONFIG.LEVELS[s.level].name)}</span>` : ''}<span class="chip">${left}h left${s.hour >= CONFIG.DAY_HOURS ? ' (lamp)' : ''}</span>`;
    const need = (k, v) => `<div class="need${v < 25 ? ' low' : ''}" data-need="${k}"><div class="row"><span>${NEED_NAMES[k]}</span><b>${Math.round(v)}</b></div><div class="bar"><i style="width:${v}%;background:var(--${k})"></i></div></div>`;
    $('#needs').innerHTML = need('air', s.needs.air) + need('warm', s.needs.warm) + need('food', s.needs.food) + need('hull', s.hull);
    const tabs = [['go', 'Go Out'], ['bench', 'Bench'], ['pack', 'Pack'], ['journal', 'Journal']];
    $('#tabs').innerHTML = tabs.map(([k, n], i) => `<button class="tab${G.tab === k ? ' on' : ''}" data-tab="${k}" aria-label="${n} (${i + 1})">${n}${k === 'journal' && G.newHint ? '<span class="dot"></span>' : ''}</button>`).join('');
  }

  function siteLootIcons(id) {
    const L = SITES[id].loot; return Object.keys(L).sort((a, b) => L[b] - L[a]).slice(0, 4).map(k => icon(k, 20)).join('');
  }

  function renderPanel() {
    const s = G.s; let h = '';

      h += `<div class="sect">Sites today · trips use suit air</div>`;
      s.sites.forEach((id, i) => {
        const site = SITES[id]; const c = Rules.check(s, G.meta, { t: 'scav', i });
        const hrs = site.h + (s.event === 'haze' ? 1 : 0);
        h += `<div class="card${s.visited[i] ? ' done' : ''}"><div class="grow"><h3>${site.name}</h3><div class="sub">${hrs}h · −${Rules.tripAir(s, id)} air · ${site.n} finds</div><div class="icons">${siteLootIcons(id)}</div>${c.ok ? '' : `<div class="why">${esc(c.why)}</div>`}</div>

      });
      if (s.sol === 1 && s.hour === 0) h += `<p class="sub" style="color:var(--muted);font-size:13px">Tip: go out for supplies, then turn them into food, air and heat at the Bench. End the sol when your hours run out. Survive ${s.rescueSol} nights.</p>`;
    } else if (G.tab === 'bench') {
      const known = RECIPES.filter(r => G.meta.known.indexOf(r.id) >= 0);
      const rows = known.map(r => ({ r, c: Rules.check(s, G.meta, { t: 'craft', a: r.a, b: r.b }) }));
      rows.sort((x, y) => (y.c.ok - x.c.ok));
      h += `<div class="sect">Make · ${known.length} known recipes</div>`;
      rows.forEach(({ r, c }) => {
        const out = r.build ? buildIcon(26) : icon(Object.keys(r.out)[0], 26);
        const extra = r.build ? ` <span style="color:var(--muted)">(${s.builds[r.build] || 0}/${BUILDS[r.build].max})</span>` : '';
        const why = c.ok ? '' : (count(r.a) && count(r.b)) ? c.why : 'Need ' + [r.a, r.b].filter(x => !count(x)).map(x => ITEMS[x].name).join(' + ');
        h += `<div class="card${G.lastDiscover === r.id ? ' discover' : ''}"><div class="grow"><div class="eq">${icon(r.a, 24)}+${icon(r.b, 24)}→${out}</div><div class="sub"><b style="color:var(--ink)">${recipeOutName(r)}</b>${extra} · ${r.build ? BUILDS[r.build].desc : (ITEMS[Object.keys(r.out)[0]].use ? useText(Object.keys(r.out)[0]) : 'ingredient')}</div>${why ? `<div class="why">${esc(why)}</div>` : ''}</div>

      });
      h += `<div class="sect">Experiment · combine two things you've never tried</div>`;
      h += experimentBox();
      h += itemGrid('exp');
    } else if (G.tab === 'pack') {
      const ids = Object.keys(s.inv);
      h += `<div class="sect">Use</div>`;
      const usable = ids.filter(id => ITEMS[id].use);
      if (!usable.length) h += `<p class="sub" style="color:var(--muted)">Nothing usable yet. Food, air and heat are made at the Bench.</p>`;
      usable.forEach(id => {
        const c = Rules.check(s, G.meta, { t: 'use', id });
        h += `<div class="card"><div>${icon(id, 30)}</div><div class="grow"><h3>${ITEMS[id].name} ×${s.inv[id]}</h3><div class="sub">${useText(id)}</div>${c.ok ? '' : `<div class="why">${esc(c.why)}</div>`}</div><button class="go" data-act="use" data-id="${id}" ${c.ok ? '' : 'disabled'}>Use</button></div>`;
      });
      h += `<div class="sect">Supplies (${ids.reduce((a, k) => a + s.inv[k], 0)} items, ${CONFIG.MAX_STACK} max each)</div>` + itemGrid('view');
      const bl = Object.keys(s.builds).filter(k => s.builds[k]);
      h += `<div class="sect">Built</div>` + (bl.length ? `<ul class="list">${bl.map(k => `<li><b>${BUILDS[k].name}</b> ×${s.builds[k]} · ${BUILDS[k].desc}</li>`).join('')}</ul>` : `<p class="sub" style="color:var(--muted)">Nothing built yet.</p>`);
    } else {
      h += journalHtml();
    }
    $('#panel').innerHTML = h;
  }
  const count = id => G.s.inv[id] || 0;

  function itemGrid(mode) {
    const ids = Object.keys(G.s.inv);
    if (!ids.length) return `<p class="sub" style="color:var(--muted)">Your pack is empty.</p>`;
    const first = G.sel[0];
    return `<div class="grid">` + ids.map(id => {
      const sec = Rules.secretsFor(G.meta, id);
      let mark = '';
      if (mode === 'exp' && first && first !== id) {
        const ps = Rules.pairStatus(G.meta, first, id).st;
        mark = ps === 'known' ? '<span class="mark mk-known">✓</span>' : ps === 'dud' ? '<span class="mark mk-dud">✗</span>' : '<span class="mark mk-untried">?</span>';
      }
      const sel = mode === 'exp' && G.sel.indexOf(id) >= 0;
      return `<button class="item${sel ? ' sel' : ''}" ${mode === 'exp' ? `data-act="pick" data-id="${id}"` : 'tabindex="-1"'} aria-label="${ITEMS[id].name} ${G.s.inv[id]}"><span class="n">${G.s.inv[id]}</span>${sec ? `<span class="sec" title="${sec} undiscovered recipes use this">✦${sec}</span>` : ''}${icon(id, 30)}<span>${ITEMS[id].name}</span>${mark}</button>`;
    }).join('') + `</div><p style="color:var(--muted);font-size:12px;margin:6px 2px">✦ = recipes you haven't discovered that use this item. ✓ known · ✗ tried, nothing · ? untried</p>`;
  }

  function experimentBox() {
    const [a, b] = G.sel;
    if (!a) return `<div class="trybox"><span class="sub" style="color:var(--muted)">Tap an item below, then a second one.</span></div>`;
    if (!b) return `<div class="trybox"><div class="eq">${icon(a, 28)} + ?</div><span class="sub" style="color:var(--muted)">Now pick a partner. Gold ✦ items still hide recipes.</span></div>`;
    const ps = Rules.pairStatus(G.meta, a, b); const c = Rules.check(G.s, G.meta, { t: 'craft', a, b });
    let msg = ps.st === 'known' ? 'Known: makes ' + recipeOutName(ps.r) : ps.st === 'dud' ? 'Tried before: nothing.' : 'Untried. Costs ' + (c.hours || 1) + 'h to test.';
    if (!c.ok && ps.st !== 'dud') msg += ' ' + c.why;
    return `<div class="trybox"><div class="eq">${icon(a, 28)}+${icon(b, 28)}</div><div class="grow" style="flex:1;font-size:13px">${esc(msg)}</div><button class="go" data-act="try" ${c.ok ? '' : 'disabled'}>${ps.st === 'known' ? 'Make' : 'Try'}</button></div>`;
  }

  function journalHtml() {
    const m = G.meta; G.newHint = false;
    let h = `<div class="sect">Field journal · ${m.known.length}/${RECIPES.length} recipes · kept forever</div><ul class="list">`;
    RECIPES.forEach(r => {
      if (m.known.indexOf(r.id) >= 0) h += `<li><span class="eq" style="display:inline-flex">${icon(r.a, 18)}${ITEMS[r.a].name} + ${icon(r.b, 18)}${ITEMS[r.b].name}</span> → <b>${recipeOutName(r)}</b></li>`;
      else if (m.hints.indexOf(r.id) >= 0) h += `<li class="hint">Unknown recipe. Note: "${esc(r.hint)}"</li>`;
      else h += `<li class="unk">??? (find field notes on trips)</li>`;
    });
    h += `</ul><div class="sect">Record</div><div class="stat"><span class="chip">Runs ${m.runs}</span><span class="chip">Rescued ${m.wins}</span><span class="chip">Best ${m.best}</span><span class="chip">Duds noted ${m.duds.length}</span>${m.daily[today()] ? `<span class="chip">Today's daily best ${m.daily[today()]}</span>` : ''}</div>`;
    h += `<div class="sect">Run</div><div class="stat"><span class="chip">${G.s.mode === 'daily' ? 'Daily sol ' + G.s.day : 'Seed ' + esc(G.s.seed)}</span><span class="chip">Score so far ${Rules.score(G.s, false)}</span></div>`;
    h += `<p style="margin-top:12px"><button class="ibtn" data-act="wipe">${G.armed === 'wipe' ? 'Tap again to erase the journal' : 'Erase journal…'}</button></p>`;
    if (DEBUG) h += `<div class="dbg">${esc(JSON.stringify({ rng: G.s.rng, storm: Array.from({ length: 12 }, (_, i) => Rules.stormPower(i + 1)), event: G.s.event, sites: G.s.sites, builds: G.s.builds }, null, 1))}</div>`;
    return h;
  }

  function renderFoot() {
    const s = G.s; const last = s.log.slice(-2);
    $('#log').innerHTML = last.map(l => `<div class="${l.k}">${esc(l.t)}</div>`).join('');
    const left = Rules.hourLimit(s) - s.hour;
    const b = $('#end');
    b.textContent = G.armed === 'end' ? 'Tap again (' + left + 'h left)' : 'End Sol ' + s.sol;
    b.classList.toggle('armed', G.armed === 'end');
  }

  // ---------- overlays ----------
  function overlay(html) { const o = $('#overlay'); o.innerHTML = `<div class="modal">${html}</div>`; o.classList.add('on'); const p = o.querySelector('[data-primary]'); if (p) setTimeout(() => { try { p.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 30); }
  function closeOverlay() { $('#overlay').classList.remove('on'); $('#overlay').innerHTML = ''; }

  function showTitle(msg) {
    const m = G.meta; const resumable = G.s && !G.s.result;
    overlay(`<h1>TWELVE SOLS</h1><p>Your lander left you on a red-dust world with a small hab. It comes back at dawn after Sol ${CONFIG.SOLS}. Keep your <b style="color:var(--air)">air</b>, <b style="color:var(--warm)">warmth</b> and <b style="color:var(--food)">food</b> above zero until then, while the dust storms grow every night.</p>
      <ul><li>Go out for supplies. Combine them at the Bench.</li><li>Every recipe you discover stays in your journal, even when a run ends.</li><li>Build shutters before the storms grow, or build a beacon to be picked up early.</li></ul>
      ${msg ? `<p style="color:#ffb79c">${esc(msg)}</p>` : ''}
      ${resumable ? `<button class="go big" data-act="resume" data-primary>Continue · Sol ${G.s.sol}</button>` : ''}
      ${levelPicker()}
      <button class="go ${resumable ? 'alt' : ''} big" data-act="new" ${resumable ? '' : 'data-primary'}>New run · ${esc(CONFIG.LEVELS[pickedLevel()].name)}</button>
      <button class="go alt big" data-act="daily">Daily sol · ${today()}${m.daily[today()] ? ' (best ' + m.daily[today()] + ')' : ''}</button>
      <p style="font-size:12.5px">Journal ${m.known.length}/${RECIPES.length} · Runs ${m.runs} · Rescued ${m.wins} · Best ${m.best}</p>
      <p style="font-size:11.5px">Keys: 1–4 tabs · N end sol · M sound · Enter continues. Everything works by touch too.</p>`);
  }

  function pickedLevel() { const u = G.meta.unlocked || 0; if (G.prefs.level == null || G.prefs.level > u) return u; return Math.max(0, G.prefs.level); }
  function levelPicker() {
    const u = G.meta.unlocked || 0; if (!u) return '';
    const L = pickedLevel(), lv = CONFIG.LEVELS[L];
    return `<div class="trybox" style="justify-content:space-between"><button class="ibtn" data-act="lvl" data-d="-1" ${L ? '' : 'disabled'} aria-label="Easier">‹</button>
      <div style="text-align:center"><b>${esc(lv.name)}</b><div style="font-size:12px;color:var(--muted)">storm +${lv.storm} · nights −${lv.warm} warmth · score ×${lv.mult}</div></div>
      <button class="ibtn" data-act="lvl" data-d="1" ${L < u ? '' : 'disabled'} aria-label="Harsher">›</button></div>`;
  }
  function showNight() {
    const n = G.s.night; const ev = EVENTS[n.event];
    const dawn = Object.keys(n.dawn || {}).map(k => '+' + n.dawn[k] + ' ' + ITEMS[k].name).join(', ');
    const next = n.nextEvent ? EVENTS[n.nextEvent] : null;
    overlay(`<h2>Night of Sol ${n.sol}</h2><div class="rep">
      <span>Storm${n.event === 'surge' ? ' (surge)' : n.event === 'calm' ? ' (still air)' : ''}</span><b>${n.power}</b>
      <span>Shutters blocked</span><b class="pos">${n.blocked}</b>
      <span>Hull</span><b class="${n.dmg ? 'neg' : ''}">${n.hullBefore} → ${n.hullAfter}${n.breach ? ' BREACH' : ''}</b>
      <span>Air</span><b class="neg">−${n.drain.air}</b><span>Warmth</span><b class="neg">−${n.drain.warm}${n.event === 'cold' ? ' (deep cold)' : ''}</b><span>Food</span><b class="neg">−${n.drain.food}</b>
      ${dawn ? `<span>At dawn</span><b class="pos">${dawn}</b>` : ''}</div>
      ${n.breach ? `<p style="color:#ffb79c">The hull is breached: you lose extra air every hour and extra air and warmth every night until you patch it.</p>` : ''}
      ${G.s.result ? '' : next ? `<p><b style="color:var(--ink)">Sol ${G.s.sol}: ${esc(next.name)}.</b> ${esc(next.text)}</p>` : ''}
      <button class="go big" data-act="ack" data-primary>${G.s.result ? 'Continue' : 'Dawn →'}</button>`);
    const m = document.querySelector('.modal'); if (m && n.dmg) m.classList.add('shake');
  }

  function lesson() {
    const s = G.s; const r = s.result; const m = G.meta;
    const tip = id => { const R = RECIPE_BY_ID[id]; return m.known.indexOf(id) >= 0 ? `${ITEMS[R.a].name} + ${ITEMS[R.b].name} makes ${recipeOutName(R)}.` : `A note you may find: "${R.hint}"`; };
    if (r.win) return s.beaconSol ? 'The beacon cut the run short. Try a full twelve sols for the bigger survival score, or light it even sooner.' : 'Next time, try the beacon: rescue comes 3 sols after you light it.';
    const out = [];
    if (r.cause === 'air') out.push(tip('oxy'), s.builds.liner ? '' : tip('liner'));
    if (r.cause === 'warm') out.push(tip('heat'), (s.builds.insul || 0) < 2 ? tip('insul') : tip('broth'));
    if (r.cause === 'food') out.push(tip('mash'), s.builds.planter ? '' : tip('planter'));
    if (s.stats.breachNights) out.push('The hull broke ' + s.stats.breachNights + ' night(s). ' + tip('shutter'));
    return out.filter(Boolean).slice(0, 2).join(' ');
  }

  function showEnd() {
    const s = G.s, r = s.result, m = G.meta;
    const causeTxt = { air: 'Your air ran out.', warm: 'The cold got in.', food: 'You ran out of food.' };
    const found = s.stats.found.map(id => recipeOutName(RECIPE_BY_ID[id]));
    overlay(`<h2 style="color:${r.win ? 'var(--good)' : '#ffb79c'}">${r.win ? 'Rescued at dawn!' : 'Run over on Sol ' + r.sol}</h2>
      <p>${r.win ? 'The lander touched down after Sol ' + s.rescueSol + (s.beaconSol ? ', called early by your beacon.' : '.') : causeTxt[r.cause] || ''}</p>
      <div class="rep"><span>Score</span><b>${r.score}${r.newBest ? ' · new best!' : ''}</b><span>Best</span><b>${m.best}</b>
      <span>Recipes found this run</span><b>${found.length}</b><span>Journal</span><b>${m.known.length}/${RECIPES.length}</b>
      <span>Trips · crafts · storm damage</span><b>${s.stats.trips} · ${s.stats.crafts} · ${s.stats.dmg}</b></div>
      ${r.unlocked ? `<p style="color:var(--gold)"><b>New season unlocked: ${esc(CONFIG.LEVELS[r.unlocked].name)}.</b> Harsher storms, bigger scores.</p>` : ''}
      ${found.length ? `<p>New: ${esc(found.join(', '))}. They're yours next run.</p>` : ''}
      <p style="color:var(--ink)">${esc(lesson())}</p>
      <button class="go big" data-act="new" data-primary>New run · ${esc(CONFIG.LEVELS[pickedLevel()].name)}</button>
      <button class="go alt big" data-act="daily">Daily sol · ${today()}</button>
      <button class="ibtn big" data-act="title">Title · change season</button>`);
  }

  // ---------- run lifecycle ----------
  function today() { const d = new Date(); return '' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0'); }
  function startRun(daily) {
    const seed = daily ? 'daily-' + today() : 'r' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
    G.s = Rules.newRun(seed, daily ? 'daily' : 'normal', G.meta, daily ? today() : '', pickedLevel());
    G.tab = 'go'; G.sel = []; G.armed = 0; G.lastDiscover = null;
    Storage.save(); closeOverlay(); render();
  }

  // ---------- Input ----------
  function onClick(e) {
    const t = e.target.closest('[data-act],[data-tab]'); if (!t || t.disabled) return;
    Audio.unlock();
    if (t.dataset.tab) { G.tab = t.dataset.tab; G.armed = 0; Audio.sfx('tap'); render(); $('#panel').scrollTop = 0; return; }
    const act = t.dataset.act;
    if (act !== 'end' && act !== 'wipe') G.armed = 0;
    switch (act) {
      case 'scav': doAct({ t: 'scav', i: +t.dataset.i }); break;
      case 'make': { const r = RECIPE_BY_ID[t.dataset.r]; doAct({ t: 'craft', a: r.a, b: r.b }); break; }
      case 'pick': {
        const id = t.dataset.id; Audio.sfx('tap');
        if (G.sel.indexOf(id) >= 0) G.sel = G.sel.filter(x => x !== id);
        else if (G.sel.length >= 2) G.sel = [id];
        else G.sel.push(id);
        render(); break;
      }
      case 'try': if (G.sel.length === 2) doAct({ t: 'craft', a: G.sel[0], b: G.sel[1] }); break;
      case 'use': doAct({ t: 'use', id: t.dataset.id }); break;
      case 'end': endSol(); break;
      case 'ack': doAct({ t: 'ack' }); if (!G.s.result) closeOverlay(); render(); break;
      case 'sound': G.prefs.sound = !G.prefs.sound; Storage.savePrefs(); if (G.prefs.sound) Audio.shown(); else Audio.hidden(); render(); break;
      case 'menu': showTitle(); break;
      case 'resume': closeOverlay(); render(); break;
      case 'lvl': G.prefs.level = Math.max(0, Math.min(G.meta.unlocked || 0, pickedLevel() + (+t.dataset.d))); Storage.savePrefs(); showTitle(); break;
      case 'new': startRun(false); break;
      case 'daily': startRun(true); break;
      case 'title': showTitle(); break;
      case 'wipe':
        if (G.armed === 'wipe') { G.meta = newMeta(); G.armed = 0; Storage.save(); toast('Journal erased.'); }
        else { G.armed = 'wipe'; }
        render(); break;
    }
  }
  function endSol() {
    const s = G.s; const left = Rules.hourLimit(s) - s.hour;
    if (left > 0 && G.armed !== 'end') { G.armed = 'end'; renderFoot(); clearTimeout(G.armT); G.armT = setTimeout(() => { if (G.armed === 'end') { G.armed = 0; renderFoot(); } }, 2500); return; }
    G.armed = 0; G.sel = []; doAct({ t: 'end' });
  }
  function onKey(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    Audio.unlock();
    const ov = $('#overlay').classList.contains('on');
    if (ov) {
      if (e.key === 'Enter' || e.key === ' ') { const p = $('#overlay [data-primary]'); if (p && document.activeElement !== p) { e.preventDefault(); p.click(); } }
      return;
    }
    const k = e.key.toLowerCase();
    if ('1234'.includes(k) && k.length === 1) { G.tab = ['go', 'bench', 'pack', 'journal'][+k - 1]; render(); }
    else if (k === 'n') endSol();
    else if (k === 'm') { G.prefs.sound = !G.prefs.sound; Storage.savePrefs(); if (G.prefs.sound) Audio.shown(); else Audio.hidden(); render(); }
    else if (k === 'escape') { G.sel = []; render(); }
  }

  // ---------- boot ----------
  function boot() {
    G.prefs = Storage.loadPrefs(); G.meta = Storage.loadMeta();
    const lr = Storage.loadRun(); G.s = lr.run;
    Scene.init();
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);
    document.addEventListener('pointerdown', () => Audio.unlock(), { once: true, capture: true });
    document.addEventListener('visibilitychange', () => { if (document.hidden) { Audio.hidden(); Scene.stop(); } else { Audio.shown(); Scene.start(); } });
    window.addEventListener('pagehide', () => { Audio.hidden(); Storage.save(); });
    window.addEventListener('resize', () => Scene.resize());
    if (G.s) render();
    showTitle(lr.damaged ? 'Your saved run was damaged, so it was set aside. Your journal is safe.' : '');
    Scene.start();
    window.__TS = { G, render, doAct, startRun, Audio, Scene, Storage }; // test hook
  }
  boot();
})();
</script>
