<title>Gloamrush</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one full-bleed canvas garden; DOM overlays float above it as dusk-glass panels, thumb-first, one column on phones. */
:root {
  --night: #0f0b1f;
  --dusk: #251a40;
  --plum: #3b2a62;
  --ember: #ffb547;
  --spark: #fff3c4;
  --hush: #ff4f8b;
  --moss: #7fd6a6;
  --sky: #7fb4ff;
  --myth: #ff9de6;
  --ink: #f1ebff;
  --mute: #a99cc8;
  --line: rgba(241, 235, 255, .14);
  --glass: rgba(22, 15, 42, .86);
  --display: "Avenir Next Condensed", "Futura", "Gill Sans", "Trebuchet MS", "Arial Narrow", sans-serif;
  --body: "Avenir Next", "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--night); color: var(--ink); font-family: var(--body);
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  touch-action: none; overscroll-behavior: none;
}
#cv { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--spark); outline-offset: 2px; }

/* HUD buttons */
#hudBtns { position: fixed; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 6px); right: calc(env(safe-area-inset-right, 0px) + 10px); display: flex; gap: 8px; }
.hb { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: rgba(15, 11, 31, .55); display: grid; place-items: center; }
.hb svg { width: 20px; height: 20px; fill: var(--ink); }

/* Overlays */
.ov { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; overflow-y: auto;
  padding-top: calc(env(safe-area-inset-top, 0px) + 16px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(120% 80% at 50% 110%, rgba(255, 181, 71, .10), transparent 60%), rgba(9, 6, 20, .55);
  -webkit-user-select: none; user-select: none; touch-action: pan-y; }
.ov.center { align-items: center; }
.ov.clear { background: transparent; }
.panel { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 14px; margin-block: auto 0; }
.ov.center .panel { margin-block: auto; }
.glass { background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 16px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.eyebrow { font-family: var(--display); font-weight: 700; letter-spacing: .18em; font-size: calc(max(12px, 12px) * var(--gk-text-scale, 1)); text-transform: uppercase; color: var(--mute); }
.big { font-family: var(--display); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; font-size: clamp(30px, 9vw, 44px); line-height: 1; }
.logo { font-family: var(--display); font-weight: 800; letter-spacing: .14em; font-size: clamp(44px, 14vw, 76px); line-height: .9; text-align: center;
  background: linear-gradient(180deg, var(--spark) 10%, var(--ember) 60%, #ff7a3a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 18px rgba(255, 181, 71, .45)); }
.tag { text-align: center; color: var(--mute); font-size: calc(max(12px, 15px) * var(--gk-text-scale, 1)); letter-spacing: .02em; }
.btn { min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 255, 255, .06); padding: 10px 16px; font-weight: 700; font-size: calc(max(12px, 16px) * var(--gk-text-scale, 1)); display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: linear-gradient(180deg, #ffc86b, var(--ember)); color: #2a1606; border: 0; font-family: var(--display); letter-spacing: .14em; text-transform: uppercase; font-size: 24px; min-height: 72px; box-shadow: 0 0 30px rgba(255, 181, 71, .35), inset 0 -3px 0 rgba(0,0,0,.18); }
.btn.daily { background: linear-gradient(180deg, #4b3480, #33245a); border-color: rgba(255, 181, 71, .35); min-height: 62px; flex-direction: column; gap: 2px; }
.btn.daily b { font-family: var(--display); letter-spacing: .12em; text-transform: uppercase; font-size: calc(max(12px, 17px) * var(--gk-text-scale, 1)); color: var(--spark); }
.btn.daily span { font-size: calc(max(12px, 13px) * var(--gk-text-scale, 1)); color: var(--mute); font-weight: 600; }
.btn:disabled { opacity: .42; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 0; min-width: 0; }
.nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.nav .btn { min-height: 64px; flex-direction: column; gap: 4px; font-size: calc(max(12px, 12px) * var(--gk-text-scale, 1)); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 8px 4px; }
.nav .btn svg { width: 22px; height: 22px; fill: var(--ember); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; background: rgba(255, 255, 255, .07); border: 1px solid var(--line); font-weight: 700; font-size: calc(max(12px, 13px) * var(--gk-text-scale, 1)); font-variant-numeric: tabular-nums; }
.pill svg { width: 14px; height: 14px; }
.glowv { color: var(--ember); }
.toprow { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.small { font-size: calc(max(12px, 13px) * var(--gk-text-scale, 1)); color: var(--mute); }
.list { display: flex; flex-direction: column; gap: 8px; }
.mis { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; font-size: calc(max(12px, 14px) * var(--gk-text-scale, 1)); }
.mis .chk { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; }
.mis.done .chk { background: var(--moss); border-color: var(--moss); }
.mis.done .chk::after { content: ""; width: 9px; height: 5px; border-left: 3px solid var(--night); border-bottom: 3px solid var(--night); transform: rotate(-45deg) translate(1px, -1px); }
.mis .pr { font-variant-numeric: tabular-nums; color: var(--mute); font-size: calc(max(12px, 13px) * var(--gk-text-scale, 1)); }
.mis.done .txt { color: var(--mute); text-decoration: line-through; text-decoration-color: rgba(127, 214, 166, .6); }
.bar { height: 12px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--ember), var(--spark)); transition: width 1.1s cubic-bezier(.2, .8, .2, 1); }

/* Level-up cards */
.cards { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 620px) { .cards { grid-template-columns: repeat(3, 1fr); } .panel.wide { max-width: 760px; } }
.card { text-align: left; border-radius: 16px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(59, 42, 98, .95), rgba(37, 26, 64, .95)); padding: 14px 16px; min-height: 92px; display: flex; flex-direction: column; gap: 6px; opacity: 0; transform: translateY(14px) scale(.98); animation: pop .32s cubic-bezier(.2, .9, .3, 1.2) forwards; }
.card:nth-child(2) { animation-delay: .06s; } .card:nth-child(3) { animation-delay: .12s; }
@keyframes pop { to { opacity: 1; transform: none; } }
.card .ct { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card b { font-family: var(--display); font-size: calc(max(12px, 20px) * var(--gk-text-scale, 1)); letter-spacing: .03em; }
.card .tg { font-size: calc(max(12px, 11px) * var(--gk-text-scale, 1)); font-weight: 800; letter-spacing: .12em; color: var(--mute); white-space: nowrap; }
.card .ds { font-size: calc(max(12px, 15px) * var(--gk-text-scale, 1)); color: var(--ink); }
.card .sb { font-size: calc(max(12px, 12.5px) * var(--gk-text-scale, 1)); color: var(--ember); font-weight: 700; }
.card.graze { border-color: rgba(255, 79, 139, .5); }
.card.graze .tg { color: var(--hush); }
.card.evo { border: 2px solid var(--ember); background: linear-gradient(180deg, #5a3a1a, #3b2340); box-shadow: 0 0 0 0 rgba(255, 181, 71, .6); animation: pop .32s cubic-bezier(.2, .9, .3, 1.2) forwards, gold 1.2s ease-in-out .3s infinite; }
.card.evo .tg { color: var(--ember); }
@keyframes gold { 50% { box-shadow: 0 0 26px 2px rgba(255, 181, 71, .55); } }

/* Results */
.bigstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.bigstats div { background: rgba(255, 255, 255, .05); border-radius: 12px; padding: 10px 8px; text-align: center; }
.bigstats b { display: block; font-family: var(--display); font-size: 24px; font-variant-numeric: tabular-nums; }
.bigstats span { font-size: calc(max(12px, 11px) * var(--gk-text-scale, 1)); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 6px 10px; border-radius: 10px; background: rgba(255, 255, 255, .07); font-size: calc(max(12px, 13px) * var(--gk-text-scale, 1)); font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
.chip em { font-style: normal; font-size: calc(max(12px, 10px) * var(--gk-text-scale, 1)); letter-spacing: .1em; background: var(--ember); color: #2a1606; border-radius: 5px; padding: 1px 5px; }
.chip i { width: 8px; height: 8px; border-radius: 99px; display: inline-block; }

/* Book grids */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.cell { border-radius: 12px; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); padding: 8px; min-height: 104px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font-size: calc(max(12px, 12px) * var(--gk-text-scale, 1)); }
.cell canvas { width: 54px; height: 40px; }
.cell b { font-size: calc(max(12px, 12.5px) * var(--gk-text-scale, 1)); line-height: 1.15; }
.cell .q { color: var(--mute); font-family: var(--display); font-size: calc(max(12px, 18px) * var(--gk-text-scale, 1)); letter-spacing: .1em; }
.cell .h { color: var(--mute); font-size: calc(max(12px, 11px) * var(--gk-text-scale, 1)); line-height: 1.2; }
.evorow { display: grid; grid-template-columns: 1fr; gap: 8px; }
.evo-e { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 12px 14px; border-radius: 12px; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); }
.evo-e.got { border-color: rgba(255, 181, 71, .5); }
.evo-e b { font-family: var(--display); font-size: calc(max(12px, 17px) * var(--gk-text-scale, 1)); letter-spacing: .04em; }
.evo-e .small { grid-column: 1 / -1; }
.shop { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 12px 14px; border-radius: 12px; background: rgba(255, 255, 255, .05); }
.shop .btn { min-height: 44px; min-width: 92px; font-size: calc(max(12px, 14px) * var(--gk-text-scale, 1)); }
.pips { display: flex; gap: 4px; margin-top: 4px; }
.pips i { width: 14px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .12); }
.pips i.on { background: var(--ember); }
.set { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; min-height: 48px; }
.set input[type=range] { width: 150px; accent-color: var(--ember); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: transparent; min-width: 52px; min-height: 40px; font-weight: 700; font-size: calc(max(12px, 13px) * var(--gk-text-scale, 1)); }
.seg button.on { background: var(--ember); color: #2a1606; }
.tog { width: 58px; height: 34px; border-radius: 99px; border: 1px solid var(--line); background: rgba(255, 255, 255, .08); position: relative; }
.tog::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 99px; background: var(--mute); transition: transform .15s; }
.tog.on { background: rgba(255, 181, 71, .35); } .tog.on::after { transform: translateX(24px); background: var(--ember); }
.share { font-size: calc(max(12px, 13px) * var(--gk-text-scale, 1)); padding: 10px; border-radius: 10px; background: rgba(0, 0, 0, .3); -webkit-user-select: text; user-select: text; word-break: break-word; }
#toast { position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(92vw, 420px); }
.tst { background: var(--glass); border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; font-weight: 700; font-size: calc(max(12px, 14px) * var(--gk-text-scale, 1)); text-align: center; animation: tin .25s ease-out, tout .4s ease-in forwards 2.4s; }
.tst.gold { border-color: var(--ember); color: var(--spark); }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } }
@keyframes tout { to { opacity: 0; transform: translateY(-6px); } }
.flame { display: inline-block; vertical-align: -3px; }
.tabs { display: flex; gap: 6px; }
.wick { width: 64px; height: 64px; margin: 0 auto -8px; border-radius: 50%; background: radial-gradient(circle, #fff 0 14%, var(--spark) 22%, rgba(255, 181, 71, .55) 45%, rgba(255, 181, 71, 0) 70%); animation: breathe 2.4s ease-in-out infinite; }
.wick.sm { width: 48px; height: 48px; margin-top: 4vh; }
@keyframes breathe { 50% { transform: scale(1.12); filter: brightness(1.2); } }
.tabs .btn { min-height: 44px; font-size: calc(max(12px, 13px) * var(--gk-text-scale, 1)); flex: 1; }
.tabs .btn.on { background: rgba(255, 181, 71, .2); border-color: var(--ember); }
@media (prefers-reduced-motion: reduce) { .wick, .card, .card.evo, .tst { animation: none !important; opacity: 1; transform: none; } .bar > i { transition: none; } }

/* GameKit 2.1 : shared starter kit for single-file phone games.

function defSave() {
  return {
    v: 1, glow: 0, bestTime: 0, bestScore: 0, wins: 0, runs: 0, kills: 0, firstRunDone: false,
    meta: { wax: 0, pot: 0, wings: 0, reach: 0, start: 0, reroll: 0, wind: 0, wide: 0 },
    heroes: { wick: true }, hero: 'wick', skin: 'amber',
    evolutions: [], moths: {},
    daily: { key: '', best: 0, firstDone: false },
    mis: null,
    streak: { n: 0, last: '', shields: 1, shieldWeek: -1 },
    lastSave: 0,
    settings: { music: 0.6, sfx: 0.8, shake: 2, nums: 1, flash: 1, haptics: 1, rm: 0 },
    muted: false,
    badges: {},
  };
}
// Type-checked merge: unknown keys dropped, wrong types fall back to defaults.
function mergeSave(raw) {
  const d = defSave();
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return d;
  const num = (v, def, lo, hi) => (typeof v === 'number' && isFinite(v)) ? clamp(v, lo, hi) : def;
  const bool = (v, def) => typeof v === 'boolean' ? v : def;
  const str = (v, def) => typeof v === 'string' ? v : def;
  d.glow = Math.floor(num(raw.glow, 0, 0, 1e9));
  d.bestTime = num(raw.bestTime, 0, 0, 1e7);
  d.bestScore = Math.floor(num(raw.bestScore, 0, 0, 1e12));
  d.wins = Math.floor(num(raw.wins, 0, 0, 1e7));
  d.runs = Math.floor(num(raw.runs, 0, 0, 1e7));
  d.kills = Math.floor(num(raw.kills, 0, 0, 1e12));
  d.firstRunDone = bool(raw.firstRunDone, d.runs > 0);
  if (raw.meta && typeof raw.meta === 'object') for (const k in d.meta) d.meta[k] = Math.floor(num(raw.meta[k], 0, 0, META_BY[k].max));
  if (raw.heroes && typeof raw.heroes === 'object') for (const h of HEROES) if (raw.heroes[h.id] === true) d.heroes[h.id] = true;
  d.heroes.wick = true;
  d.hero = (typeof raw.hero === 'string' && d.heroes[raw.hero]) ? raw.hero : 'wick';
  d.skin = (typeof raw.skin === 'string' && SKINS.some(s => s.id === raw.skin)) ? raw.skin : 'amber';
  if (Array.isArray(raw.evolutions)) d.evolutions = raw.evolutions.filter((e, i, a) => typeof e === 'string' && EVO_BY[e] && a.indexOf(e) === i);
  if (raw.moths && typeof raw.moths === 'object') for (const id in raw.moths) {
    const m = raw.moths[id];
    if (MOTH_BY[id] && m && typeof m === 'object') d.moths[id] = { n: Math.max(1, Math.floor(num(m.n, 1, 1, 1e7))), bestMm: num(m.bestMm, 0, 0, 999), first: str(m.first, '') };
  }
  if (raw.daily && typeof raw.daily === 'object') d.daily = { key: str(raw.daily.key, ''), best: Math.floor(num(raw.daily.best, 0, 0, 1e12)), firstDone: bool(raw.daily.firstDone, false) };
  if (raw.mis && typeof raw.mis === 'object' && typeof raw.mis.key === 'string' && Array.isArray(raw.mis.list) && raw.mis.list.length === 3) {
    const list = raw.mis.list.map(m => (m && MPOOL_BY[m.id]) ? { id: m.id, n: Math.max(1, Math.floor(num(m.n, 1, 1, 1e6))), rw: Math.floor(num(m.rw, 40, 0, 1000)), prog: num(m.prog, 0, 0, 1e7), done: bool(m.done, false) } : null);
    if (list.every(Boolean)) d.mis = { key: raw.mis.key, list };
  }
  if (raw.streak && typeof raw.streak === 'object') d.streak = { n: Math.floor(num(raw.streak.n, 0, 0, 1e5)), last: str(raw.streak.last, ''), shields: Math.floor(num(raw.streak.shields, 1, 0, 1)), shieldWeek: Math.floor(num(raw.streak.shieldWeek, -1, -1, 1e7)) };
  d.lastSave = num(raw.lastSave, 0, 0, 1e15);
  if (raw.settings && typeof raw.settings === 'object') {
    const s = raw.settings, ds = d.settings;
    ds.music = num(s.music, ds.music, 0, 1); ds.sfx = num(s.sfx, ds.sfx, 0, 1);
    ds.shake = Math.floor(num(s.shake, ds.shake, 0, 2));
    ds.nums = num(s.nums, ds.nums, 0, 1) ? 1 : 0; ds.flash = num(s.flash, ds.flash, 0, 1) ? 1 : 0;
    ds.haptics = num(s.haptics, ds.haptics, 0, 1) ? 1 : 0; ds.rm = num(s.rm, ds.rm, 0, 1) ? 1 : 0;
  }
  d.muted = bool(raw.muted, false);
  if (raw.badges && typeof raw.badges === 'object' && !Array.isArray(raw.badges)) { let n = 0; for (const id in raw.badges) { if (n >= 64) break; if (/^[a-z0-9]{1,24}$/.test(id) && typeof raw.badges[id] === 'number' && isFinite(raw.badges[id])) { d.badges[id] = raw.badges[id]; n++; } } }
  return d;
}

// ---------- MISSIONS / STREAK / OFFLINE (pure, operate on a save) ----------
function ensureMissions(save, dayKey) {
  if (save.mis && save.mis.key === dayKey) return false;
  const rng = mulberry32(hashStr('gloamrush:mis:' + dayKey));
  const ids = MPOOL.map(m => m.id);
  for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  // always include one day-scope mission
  let pick = ids.slice(0, 3);
  if (!pick.some(id => MPOOL_BY[id].scope === 'day')) pick[2] = ids.find(id => MPOOL_BY[id].scope === 'day');
  const list = pick.map((id, i) => { const tr = MPOOL_BY[id].tiers[i]; return { id, n: tr[0], rw: tr[1], prog: 0, done: false }; });
  save.mis = { key: dayKey, list };
  return true;
}
function missionText(m) { return MPOOL_BY[m.id].t(m.n); }
// value for a run-scope mission from run stats
function missionRunValue(id, st) {
  switch (id) {
    case 'graze': return st.grazes; case 'chain': return st.bestChain; case 'wild': return st.wildfires;
    case 'survive': return st.surviveNoWind; case 'kills': return st.kills; case 'bank': return st.banks;
    default: return 0;
  }
}
// live check during a run: returns list of missions newly completed. dayAdd = {moths, evolve, runs} increments this run so far.
function missionsLive(save, st, dayBase) {
  if (!save.mis) return [];
  const out = [];
  for (const m of save.mis.list) {
    if (m.done) continue;
    const def = MPOOL_BY[m.id];
    let v;
    if (def.scope === 'run') v = Math.max(m.prog, missionRunValue(m.id, st));
    else v = m.prog + (dayBase[m.id] || 0);
    if (v >= m.n) out.push(m);
  }
  return out;
}
// commit run results into missions. returns {completed:[...], reward}
function commitMissions(save, st, dayAdd) {
  const res = { completed: [], reward: 0 };
  if (!save.mis) return res;
  for (const m of save.mis.list) {
    if (m.done) continue;
    const def = MPOOL_BY[m.id];
    if (def.scope === 'run') m.prog = Math.max(m.prog, missionRunValue(m.id, st));
    else m.prog += (dayAdd[m.id] || 0);
    if (m.prog >= m.n) { m.prog = m.n; m.done = true; res.completed.push(m); res.reward += m.rw; }
  }
  return res;
}
function weekOf(dayKey) { return Math.floor((dayIndex(dayKey) + 3) / 7); }
// Mark today on the streak (call when a mission completes). Returns {n, usedShield, grew}
function markStreak(save, dayKey) {
  const s = save.streak, wk = weekOf(dayKey);
  if (s.shieldWeek !== wk) { s.shieldWeek = wk; s.shields = 1; }
  if (s.last === dayKey) return { n: s.n, usedShield: false, grew: false };
  const today = dayIndex(dayKey);
  let used = false;
  if (s.last) {
    const gap = today - dayIndex(s.last);
    if (gap === 1) s.n += 1;
    else if (gap === 2 && s.shields > 0) { s.shields -= 1; s.n += 1; used = true; }
    else s.n = 1;
  } else s.n = 1;
  s.last = dayKey;
  return { n: s.n, usedShield: used, grew: true };
}
// streak value as shown (0 if lapsed beyond forgiveness)
function streakShown(save, dayKey) {
  const s = save.streak; if (!s.last) return 0;
  const gap = dayIndex(dayKey) - dayIndex(s.last);
  if (gap <= 1) return s.n;
  if (gap === 2 && (s.shields > 0 || s.shieldWeek !== weekOf(dayKey))) return s.n;
  return 0;
}
const OFFLINE_CAP_H = 8;
function mothGlowRate(save) { let r = 0; for (const id in save.moths) { const m = MOTH_BY[id]; if (m) r += RAR[m.r].hr; } return r; }
function offlineGain(save, now) {
  if (!save.lastSave || now <= save.lastSave) return 0; // clock rolled back or first launch: nothing
  const h = Math.min(OFFLINE_CAP_H, (now - save.lastSave) / 3600000);
  return Math.floor(h * mothGlowRate(save));
}

function makeWorld(o) {
  o = o || {};
  const seed = (o.seed >>> 0) || 1;
  const hero = HERO_BY[o.hero] || HERO_BY.wick;
  const meta = Object.assign({ wax: 0, pot: 0, wings: 0, reach: 0, start: 0, reroll: 0, wind: 0, wide: 0 }, o.meta || {});
  const w = {
    seed, daily: !!o.daily, tutorial: !!o.tutorial, hero: hero.id, meta,
    knownEvos: (o.knownEvos || []).slice(), knownMoths: Object.assign({}, o.knownMoths || {}),
    rngSpawn: mulberry32(seed ^ 0xA5A5A5),
    rngMoth: mulberry32(seed ^ 0x3C3C3C),
    rngComet: mulberry32(seed ^ 0x5F5F5F),
    rngFx: mulberry32(seed ^ 0x777777),
    vw: o.vw || 400, vh: o.vh || 800,
    t: 0, act: 1, over: null, dawn: false, longNight: false, longT: 0,
    p: { x: 0, y: 0, vx: 0, vy: 0, r: 11, hp: 0, maxHp: 0, inv: 0, moving: false, face: 0 },
    up: {}, evos: [],
    level: 1, xp: 0, pending: 0, choices: null, rerolls: 1 + meta.reroll, rerollIdx: 0, levelIdx: 0,
    enemies: [], ebul: [], pbul: [], gems: [], puddles: [], moths: [], comet: null, stone: null, boss: null,
    fireT: 0.6, volley: 0, novaT: 3, ashT: 0, orbA: 0,
    spawnT: o.tutorial ? 2.6 : 1.2, waveI: 0, bossWarned: false, tutSpit: false,
    mothT: o.tutorial ? 40 : 35 + 0, cometT: 0, firstMothScripted: !!o.tutorial,
    flare: 0, wild: 0, chain: 0, lastGrazeT: -9, lastHitT: -9, grazeQ: [], grazeTimes: [],
    starfall: 0, swarmHands: 0, windUsed: false,
    score: 0, glowBonus: 0, banked: 0, stonesBanked: 0,
    stats: { kills: 0, grazes: 0, bestChain: 0, wildfires: 0, banks: 0, catches: 0, surviveNoWind: 0, evolves: 0, dmg: 0, comets: 0 },
    caught: [], newMoths: [], newEvos: [],
    events: [], spawnLog: [], mothLog: [],
    gridCell: 72, grid: new Map(),
    st: null,
  };
  w.mothT = o.tutorial ? 40 : 35 + w.rngMoth() * 25;
  w.cometT = 60 + w.rngComet() * 60;
  if (hero.twin) w.up.twin = hero.twin;
  if (hero.orbit) w.up.orbit = hero.orbit;
  derive(w);
  w.p.hp = w.p.maxHp;
  if (meta.start > 0) { w.pending += meta.start; w.headStart = true; }
  if (w.pending > 0) openLevel(w);
  ev(w, 'banner', { text: 'DRAG ANYWHERE TO FLY', sub: w.daily ? "TONIGHT'S DUSK" : 'DUSK', big: true });
  return w;
}
function ev(w, k, d) { const e = d || {}; e.k = k; w.events.push(e); if (w.events.length > 800) w.events.splice(0, 200); }
function lv(w, id) { return w.up[id] || 0; }
function hasEvo(w, id) { return w.evos.indexOf(id) >= 0; }

function derive(w) {
  const hero = HERO_BY[w.hero], m = w.meta;
  const st = {};
  st.maxHp = hero.hp + 15 * m.wax + 20 * lv(w, 'wax');
  st.speed = 215 * hero.spd * (1 + 0.05 * m.wings) * (1 + 0.10 * lv(w, 'wings'));
  st.fireInt = 0.42 * Math.pow(0.88, lv(w, 'quick'));
  st.shots = 1 + lv(w, 'twin');
  st.dmg = 10 * (1 + 0.08 * m.pot) * (1 + 0.22 * lv(w, 'dense'));
  st.dmgMult = (1 + 0.08 * m.pot) * (1 + 0.22 * lv(w, 'dense'));
  st.pierce = hasEvo(w, 'tempest') ? 99 : lv(w, 'needle');
  st.bounce = lv(w, 'rico');
  st.homing = lv(w, 'seeker');
  st.crit = 0.05 + 0.10 * lv(w, 'sharp');
  st.critMul = lv(w, 'sharp') ? 2.2 : 1.8;
  st.reach = 70 * (1 + 0.30 * lv(w, 'reach')) * (1 + 0.15 * m.reach);
  st.orbit = lv(w, 'orbit');
  st.near = 16 * (1 + 0.25 * lv(w, 'mwings')) * (1 + 0.08 * m.wide) * hero.graze;
  st.regen = 0.6 * lv(w, 'mend');
  st.bspd = 520;
  const old = w.st; w.st = st;
  if (old) { const d = st.maxHp - old.maxHp; if (d > 0) w.p.hp += d; }
  w.p.maxHp = st.maxHp;
  w.p.hp = Math.min(w.p.hp, w.p.maxHp);

// ---------- RENDER ----------
let camX = 0, camY = 0, tReal = 0;
function skin() { return G.SKINS.find(s => s.id === save.skin) || G.SKINS[0]; }
function skyCols(w) {
  if (!w) return ['#1c1236', '#3a2050', '#0f0b1f'];
  if (w.dawn && !w.longNight) return ['#3b2c5e', '#b8607a', '#ffb98a'];
  if (w.longNight) return ['#08061a', '#1a0f33', '#120a24'];
  const t = w.t;
  if (t < 60) return ['#1c1236', '#4a2453', '#7a3a5a'];
  if (t < 120) return ['#140e2e', '#2c1a4a', '#3c1f4f'];
  return ['#0a0820', '#150f33', '#1c1238'];
}
function render(dtR) {
  const w = world;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sk = skyCols(w);
  const gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, sk[0]); gr.addColorStop(0.65, sk[1]); gr.addColorStop(1, sk[2]);
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  // ambient fireflies (screen space)
  ctx.globalCompositeOperation = 'lighter';
  for (const a of ambient) {
    const x = ((a.x * W - camX * 0.08 * a.s) % W + W) % W, y = ((a.y * H - camY * 0.08 * a.s) % H + H) % H;
    const al = 0.25 + 0.25 * Math.sin(tReal * 1.3 + a.p);
    drawSprite(glowSprite('#ffd27a', 6), x, y, a.s, al * (w && w.t > 120 ? 0.6 : 1));
  }
  ctx.globalCompositeOperation = 'source-over';
  if (!w) return;
  // camera + shake
  camX = w.p.x; camY = w.p.y;
  const sx = JU.x, sy = JU.y;
  ctx.save();
  ctx.translate(W / 2 + sx, H / 2 + sy); if (JU.rot) ctx.rotate(JU.rot); ctx.scale(ZOOM, ZOOM); ctx.translate(-camX, -camY);
  const vw = W / ZOOM, vh = H / ZOOM, x0 = camX - vw / 2 - 40, x1 = camX + vw / 2 + 40, y0 = camY - vh / 2 - 40, y1 = camY + vh / 2 + 40;
  drawGround(x0, y0, x1, y1);
  // stone
  if (w.stone) {
    const s = w.stone, pul = 1 + Math.sin(tReal * 4) * 0.04;
    ctx.globalCompositeOperation = 'lighter'; drawSprite(glowSprite('#ffb547', s.r * 1.2), s.x, s.y, pul, 0.5); ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = '#ffb547'; ctx.lineWidth = 3; ctx.setLineDash([8, 8]); ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    ctx.lineWidth = 7; ctx.strokeStyle = '#fff3c4'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r - 6, -Math.PI / 2, -Math.PI / 2 + TAU * (s.fill / 1.5)); ctx.stroke();
    ctx.fillStyle = '#fff3c4'; ctx.font = '700 ' + fzw(12) + 'px ' + bodyFont(); ctx.textAlign = 'center'; ctx.fillText('BANK ' + Math.ceil(s.life) + 's', s.x, s.y + 4);
  }
  // puddles
  for (const u of w.puddles) { const a = clamp(u.life / u.max, 0, 1); ctx.fillStyle = G.hasEvo(w, 'ashgarden') ? `rgba(127,214,166,${0.18 * a})` : `rgba(255,122,58,${0.2 * a})`; ctx.beginPath(); ctx.arc(u.x, u.y, u.r, 0, TAU); ctx.fill(); }
  // gems
  ctx.globalCompositeOperation = 'lighter';
  for (const g of w.gems) { const c = g.v >= 20 ? '#fff3c4' : g.v >= 6 ? '#c58bff' : g.v >= 3 ? '#7fd6a6' : '#ffb547'; drawSprite(glowSprite(c, g.v >= 20 ? 12 : g.v >= 6 ? 9 : 7), g.x, g.y, 1); }
  ctx.globalCompositeOperation = 'source-over';
  // enemies
  for (const e of w.enemies) {
