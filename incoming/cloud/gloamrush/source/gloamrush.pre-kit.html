<style>
/* Layout: one full-bleed canvas garden; DOM overlays float above it as dusk-glass panels, thumb-first, one column on phones. */
:root {
  --night: #0f0b1f;
  --dusk: #251a40;
  --plum: #3b2a62;
  --ember: #ffb547;
  --spark: #fff3c4;
  --hush: #ff4f8b;
  --moss: #7fd6a6;
  --sky: #7fb4ff;
  --myth: #ff9de6;
  --ink: #f1ebff;
  --mute: #a99cc8;
  --line: rgba(241, 235, 255, .14);
  --glass: rgba(22, 15, 42, .86);
  --display: "Avenir Next Condensed", "Futura", "Gill Sans", "Trebuchet MS", "Arial Narrow", sans-serif;
  --body: "Avenir Next", "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--night); color: var(--ink); font-family: var(--body);
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  touch-action: none; overscroll-behavior: none;
}
#cv { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--spark); outline-offset: 2px; }

/* HUD buttons */
#hudBtns { position: fixed; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 6px); right: calc(env(safe-area-inset-right, 0px) + 10px); display: flex; gap: 8px; }
.hb { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: rgba(15, 11, 31, .55); display: grid; place-items: center; }
.hb svg { width: 20px; height: 20px; fill: var(--ink); }

/* Overlays */
.ov { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; overflow-y: auto;
  padding-top: calc(env(safe-area-inset-top, 0px) + 16px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(120% 80% at 50% 110%, rgba(255, 181, 71, .10), transparent 60%), rgba(9, 6, 20, .55);
  -webkit-user-select: none; user-select: none; touch-action: pan-y; }
.ov.center { align-items: center; }
.ov.clear { background: transparent; }
.panel { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 14px; margin-block: auto 0; }
.ov.center .panel { margin-block: auto; }
.glass { background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 16px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.eyebrow { font-family: var(--display); font-weight: 700; letter-spacing: .18em; font-size: 12px; text-transform: uppercase; color: var(--mute); }
.big { font-family: var(--display); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; font-size: clamp(30px, 9vw, 44px); line-height: 1; }
.logo { font-family: var(--display); font-weight: 800; letter-spacing: .14em; font-size: clamp(44px, 14vw, 76px); line-height: .9; text-align: center;
  background: linear-gradient(180deg, var(--spark) 10%, var(--ember) 60%, #ff7a3a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 18px rgba(255, 181, 71, .45)); }
.tag { text-align: center; color: var(--mute); font-size: 15px; letter-spacing: .02em; }
.btn { min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 255, 255, .06); padding: 10px 16px; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: linear-gradient(180deg, #ffc86b, var(--ember)); color: #2a1606; border: 0; font-family: var(--display); letter-spacing: .14em; text-transform: uppercase; font-size: 24px; min-height: 72px; box-shadow: 0 0 30px rgba(255, 181, 71, .35), inset 0 -3px 0 rgba(0,0,0,.18); }

.row { display: flex; gap: 10px; flex-wrap: wrap; }

.mis .pr { font-variant-numeric: tabular-nums; color: var(--mute); font-size: 13px; }
.mis.done .txt { color: var(--mute); text-decoration: line-through; text-decoration-color: rgba(127, 214, 166, .6); }
.bar { height: 12px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--ember), var(--spark)); transition: width 1.1s cubic-bezier(.2, .8, .2, 1); }

/* Level-up cards */
.cards { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 620px) { .cards { grid-template-columns: repeat(3, 1fr); } .panel.wide { max-width: 760px; } }
.card { text-align: left; border-radius: 16px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(59, 42, 98, .95), rgba(37, 26, 64, .95)); padding: 14px 16px; min-height: 92px; display: flex; flex-direction: column; gap: 6px; opacity: 0; transform: translateY(14px) scale(.98); animation: pop .32s cubic-bezier(.2, .9, .3, 1.2) forwards; }
.card:nth-child(2) { animation-delay: .06s; } .card:nth-child(3) { animation-delay: .12s; }
@keyframes pop { to { opacity: 1; transform: none; } }
.card .ct { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card b { font-family: var(--display); font-size: 20px; letter-spacing: .03em; }
.card .tg { font-size: 11px; font-weight: 800; letter-spacing: .12em; color: var(--mute); white-space: nowrap; }
.card .ds { font-size: 15px; color: var(--ink); }
.card .sb { font-size: 12.5px; color: var(--ember); font-weight: 700; }
.card.graze { border-color: rgba(255, 79, 139, .5); }

.card.evo { border: 2px solid var(--ember); background: linear-gradient(180deg, #5a3a1a, #3b2340); box-shadow: 0 0 0 0 rgba(255, 181, 71, .6); animation: pop .32s cubic-bezier(.2, .9, .3, 1.2) forwards, gold 1.2s ease-in-out .3s infinite; }
.card.evo .tg { color: var(--ember); }
@keyframes gold { 50% { box-shadow: 0 0 26px 2px rgba(255, 181, 71, .55); } }

/* Results */
.bigstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.bigstats div { background: rgba(255, 255, 255, .05); border-radius: 12px; padding: 10px 8px; text-align: center; }
.bigstats b { display: block; font-family: var(--display); font-size: 24px; font-variant-numeric: tabular-nums; }
.bigstats span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.pips i { width: 14px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .12); }
.pips i.on { background: var(--ember); }
.set { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; min-height: 48px; }
.set input[type=range] { width: 150px; accent-color: var(--ember); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }

.seg button.on { background: var(--ember); color: #2a1606; }
.tog { width: 58px; height: 34px; border-radius: 99px; border: 1px solid var(--line); background: rgba(255, 255, 255, .08); position: relative; }
.tog::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 99px; background: var(--mute); transition: transform .15s; }
.tog.on { background: rgba(255, 181, 71, .35); } .tog.on::after { transform: translateX(24px); background: var(--ember); }
.share { font-size: 13px; padding: 10px; border-radius: 10px; background: rgba(0, 0, 0, .3); -webkit-user-select: text; user-select: text; word-break: break-word; }
#toast { position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(92vw, 420px); }
.tst { background: var(--glass); border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; font-weight: 700; font-size: 14px; text-align: center; animation: tin .25s ease-out, tout .4s ease-in forwards 2.4s; }
.tst.gold { border-color: var(--ember); color: var(--spark); }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } }
@keyframes tout { to { opacity: 0; transform: translateY(-6px); } }
.flame { display: inline-block; vertical-align: -3px; }
.tabs { display: flex; gap: 6px; }
.wick { width: 64px; height: 64px; margin: 0 auto -8px; border-radius: 50%; background: radial-gradient(circle, #fff 0 14%, var(--spark) 22%, rgba(255, 181, 71, .55) 45%, rgba(255, 181, 71, 0) 70%); animation: breathe 2.4s ease-in-out infinite; }
.wick.sm { width: 48px; height: 48px; margin-top: 4vh; }
@keyframes breathe { 50% { transform: scale(1.12); filter: brightness(1.2); } }
.tabs .btn { min-height: 44px; font-size: 13px; flex: 1; }
.tabs .btn.on { background: rgba(255, 181, 71, .2); border-color: var(--ember); }
@media (prefers-reduced-motion: reduce) { .wick, .card, .card.evo, .tst { animation: none !important; opacity: 1; transform: none; } .bar > i { transition: none; } }

  a = a >>> 0;

    let t = a;

    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

// Local calendar day key. Rolls over at local midnight (not UTC).
function localDayKey(d) {
  d = d || new Date();
  const p = n => (n < 10 ? '0' : '') + n;
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());

function ensureMissions(save, dayKey) {

  for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  // always include one day-scope mission
  let pick = ids.slice(0, 3);
  if (!pick.some(id => MPOOL_BY[id].scope === 'day')) pick[2] = ids.find(id => MPOOL_BY[id].scope === 'day');
  const list = pick.map((id, i) => { const tr = MPOOL_BY[id].tiers[i]; return { id, n: tr[0], rw: tr[1], prog: 0, done: false }; });
  save.mis = { key: dayKey, list };
  return true;
}

// value for a run-scope mission from run stats
function missionRunValue(id, st) {

    case 'survive': return st.surviveNoWind; case 'kills': return st.kills; case 'bank': return st.banks;

    if (m.done) continue;
    const def = MPOOL_BY[m.id];
    let v;
    if (def.scope === 'run') v = Math.max(m.prog, missionRunValue(m.id, st));
    else v = m.prog + (dayBase[m.id] || 0);

  }
  return out;
}

function commitMissions(save, st, dayAdd) {
  const res = { completed: [], reward: 0 };
  if (!save.mis) return res;
  for (const m of save.mis.list) {
    if (m.done) continue;
    const def = MPOOL_BY[m.id];
    if (def.scope === 'run') m.prog = Math.max(m.prog, missionRunValue(m.id, st));
    else m.prog += (dayAdd[m.id] || 0);
    if (m.prog >= m.n) { m.prog = m.n; m.done = true; res.completed.push(m); res.reward += m.rw; }

}

function markStreak(save, dayKey) {
  const s = save.streak, wk = weekOf(dayKey);

  if (s.last === dayKey) return { n: s.n, usedShield: false, grew: false };
  const today = dayIndex(dayKey);
  let used = false;
  if (s.last) {
    const gap = today - dayIndex(s.last);
    if (gap === 1) s.n += 1;
    else if (gap === 2 && s.shields > 0) { s.shields -= 1; s.n += 1; used = true; }
