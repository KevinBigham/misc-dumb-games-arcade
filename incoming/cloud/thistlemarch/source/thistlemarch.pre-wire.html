<title>Thistlemarch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Pocket turn-based tactics: lead a tiny beetle warband through 9 battles against the creeping Rot.">
<style>
:root{
  --bg:#efe6cc; --ink:#2c2a1e; --ink2:#5a5640; --panel:#fbf6e6; --line:#d6caa6; --accent:#c2741f; --accent2:#7a4ea3;
  --good:#3f8a2e; --bad:#b8342b; --btn:#fffaf0; --btnInk:#2c2a1e; --shadow:0 2px 0 rgba(60,40,10,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b2116; --ink:#efe8d2; --ink2:#b9b195; --panel:#262d1f; --line:#3d4630; --accent:#e39a3e; --accent2:#b58ae0;
    --good:#7cc35f; --bad:#ef6f62; --btn:#323a28; --btnInk:#efe8d2; --shadow:0 2px 0 rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b2116; --ink:#efe8d2; --ink2:#b9b195; --panel:#262d1f; --line:#3d4630; --accent:#e39a3e; --accent2:#b58ae0;
  --good:#7cc35f; --bad:#ef6f62; --btn:#323a28; --btnInk:#efe8d2; --shadow:0 2px 0 rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.35 "Trebuchet MS","Segoe UI",system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;justify-content:center;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{position:relative;width:100%;max-width:540px;height:100%;display:flex;flex-direction:column;padding-block:0;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#top{display:flex;align-items:center;gap:8px;height:44px;flex:0 0 auto}
#top .ttl{flex:1;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .rnd{font-size:13px;color:var(--ink2);white-space:nowrap}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--btn);color:var(--btnInk);font-size:18px;box-shadow:var(--shadow);cursor:pointer}
#obj{font-size:13px;color:var(--ink2);min-height:20px;margin:0 0 4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#obj b{color:var(--ink)}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12px}
#boardWrap{position:relative;flex:0 0 auto;display:flex;justify-content:center}
#board{display:block;border-radius:10px;box-shadow:0 3px 0 rgba(60,40,10,.25);touch-action:none}
#banner{position:absolute;left:0;right:0;top:42%;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}
#banner span{display:inline-block;padding:8px 18px;border-radius:12px;background:rgba(30,26,14,.82);color:#fff6d8;font-weight:700;font-size:18px;letter-spacing:.5px}
#panel{flex:1 1 auto;display:flex;flex-direction:column;gap:6px;padding:6px 0 10px;min-height:136px}
#card{flex:1 1 auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13.5px;overflow:auto;min-height:64px}
#card .nm{font-weight:700;font-size:14.5px}
#card .sub{color:var(--ink2)}
#card .hint{color:var(--ink2)}
#card .fc{margin-top:4px}
.hpbar{display:inline-block;width:70px;height:8px;border-radius:4px;background:var(--line);vertical-align:middle;overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--good)}
#actions{display:flex;gap:6px}
.btn{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--btn);color:var(--btnInk);font:600 15px/1 inherit;font-family:inherit;box-shadow:var(--shadow);cursor:pointer;padding:0 10px}
.btn:focus-visible,.ucard:focus-visible,.perk:focus-visible,.iconbtn:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
@media (prefers-reduced-motion: reduce){#banner,#toast{transition:none}}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.warn{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.small{min-height:36px;font-size:13px;flex:0 0 auto}
.overlay{position:absolute;inset:0;padding-left:max(16px, env(safe-area-inset-left, 0px))!important;padding-right:max(16px, env(safe-area-inset-right, 0px))!important;background:var(--bg);display:none;flex-direction:column;overflow:auto;padding:14px 12px 24px;z-index:5}
.overlay.on{display:flex}
#modal{background:rgba(20,18,10,.55);z-index:9;justify-content:center;align-items:center;padding:16px}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;max-width:440px;width:100%;max-height:90%;overflow:auto}
h1{font-size:30px;margin:6px 0 2px;letter-spacing:1px;text-align:center}
h2{font-size:20px;margin:4px 0 6px}
h3{font-size:15px;margin:10px 0 4px}
p{margin:4px 0}
.center{text-align:center}
.muted{color:var(--ink2)}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ucard{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:6px 8px;display:flex;gap:8px;align-items:center;cursor:pointer;min-height:52px;text-align:left;color:var(--ink);font:inherit}
.ucard.sel{outline:3px solid var(--accent);outline-offset:-1px}
.ucard.fixed{cursor:default;opacity:.95}
.ucard canvas{flex:0 0 auto}
.ucard .t{font-weight:700;font-size:13.5px}
.ucard .d{font-size:12px;color:var(--ink2)}
.stars{color:#e0a321;font-size:20px;letter-spacing:2px}
.slots{display:flex;gap:6px;margin:6px 0}
.slot{flex:1;border:2px dashed var(--line);border-radius:10px;min-height:46px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink2);padding:2px;text-align:center}
.slot.full{border-style:solid;border-color:var(--accent);color:var(--ink)}
.tag{display:inline-block;font-size:11px;padding:0 5px;border-radius:6px;background:var(--accent2);color:#fff;margin-left:4px}
textarea{width:100%;min-height:90px;font:12px monospace;border-radius:8px;border:1px solid var(--line);background:var(--btn);color:var(--ink)}
ul.tight{margin:4px 0;padding-left:18px}
ul.tight li{margin:2px 0}
.note{font-size:12.5px;color:var(--ink2)}
.perk{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--btn);cursor:pointer;text-align:left;color:var(--ink);font:inherit;min-height:44px}
.perk b{display:block}
#toast{position:absolute;left:50%;bottom:170px;transform:translateX(-50%);background:rgba(30,26,14,.9);color:#fff6d8;padding:6px 12px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:10;max-width:90%;text-align:center}

</style>
<div id="app">
  <header id="top">
    <button class="iconbtn" id="menuBtn" aria-label="Menu">☰</button>
    <div class="ttl" id="ttl">Thistlemarch</div>
    <div class="rnd" id="rnd"></div>
  </header>
  <div id="obj"></div>
  <div id="boardWrap"><canvas id="board" aria-label="Battle map"></canvas><div id="banner"></div></div>
  <section id="panel">
    <div id="card" aria-live="polite"></div>
    <div id="actions">
      <button class="btn" id="undoBtn">↶ Undo</button>
      <button class="btn" id="nextBtn">Next unit</button>
      <button class="btn" id="endBtn">End turn</button>
    </div>
  </section>
  <div id="screen" class="overlay"></div>
  <div id="modal" class="overlay"></div>
  <div id="toast"></div>
</div>
<script id="gamekit">/* GameKit 2.0 : shared starter kit for single-file phone games.

    const table = u.captain ? CONFIG.CAPTAIN_XP : CONFIG.VET_XP;
    const max = u.captain ? CONFIG.CAPTAIN_MAX : CONFIG.VET_MAX;
    while (u.level < max && u.xp >= table[u.level]) {
      u.level++;
      applyStats(u);
      if (events) events.push(ev(b, 'level', { id: u.id, level: u.level, x: u.x, y: u.y }));
    }
  }

  // ===== movement =====
  function passable(b, x, y) { return inB(b, x, y) && !terr(b, x, y).block && !isSeed(b, x, y); }
  function stepCost(b, u, x, y) {
    const t = terr(b, x, y);
    if (t.block) return Infinity;
    if (T(u).fly) return 1;
    return t.cost;
  }
  function zocAt(b, u, x, y) {
    if (T(u).skirmish) return false;
    for (const [dx, dy] of DIRS) { const o = unitAt(b, x + dx, y + dy); if (o && o.side !== u.side) return true; }
    return false;
  }
  // Returns Map "x,y" -> {x,y,rem,path}
  function reachable(b, u, opts) {
    opts = opts || {};
    const res = new Map();
    const start = { x: u.x, y: u.y, rem: opts.full ? u.move : (u.moved ? 0 : u.move), path: [[u.x, u.y]] };
    const best = new Map();
    best.set(u.x + ',' + u.y, start);
    const open = [start];
    const jump = !!T(u).jump, fly = !!T(u).fly;
    while (open.length) {
      open.sort((a, c) => c.rem - a.rem);
      const cur = open.shift();
      if (cur.rem <= 0) continue;
      for (const [dx, dy] of DIRS) {
        const nx = cur.x + dx, ny = cur.y + dy;
        if (!passable(b, nx, ny)) continue;
        const occ = unitAt(b, nx, ny);
        if (occ && occ !== u && occ.side !== u.side && !jump) continue;
        let c = stepCost(b, u, nx, ny);
        let rem;
        if (!fly && terr(b, nx, ny).mud) rem = 0;
        else { if (c > cur.rem) continue; rem = cur.rem - c; }
        if (!(occ && occ !== u) && zocAt(b, u, nx, ny)) rem = 0;
        const key = nx + ',' + ny;
        const prev = best.get(key);
        if (prev && prev.rem >= rem) continue;
        const node = { x: nx, y: ny, rem, path: cur.path.concat([[nx, ny]]) };
        best.set(key, node);
        open.push(node);
      }
    }
    for (const [k, n] of best) {
      const occ = unitAt(b, n.x, n.y);
      if (occ && occ !== u) continue;
      res.set(k, n);
    }
    return res;
  }

  // ===== attacks =====
  function rmaxAt(b, u, x, y) { let m = u.rmax; if (m > 1 && terr(b, x, y).high) m += 1; return m; }
  function inReach(b, u, ux, uy, tx, ty) { const d = dist(ux, uy, tx, ty); return d >= u.rmin && d <= rmaxAt(b, u, ux, uy); }
  function tilesInReach(b, u, ux, uy) {
    const out = [], rm = rmaxAt(b, u, ux, uy);
    for (let y = 0; y < b.rows; y++) for (let x = 0; x < b.cols; x++) {
      const d = dist(ux, uy, x, y); if (d >= u.rmin && d <= rm) out.push([x, y]);
    }
    return out;
  }
  // damage from attacker standing at (ax,ay) against defender (unit or null for seedling) at (dx,dy)
  function calcDamage(b, att, ax, ay, def, dx, dy) {
    let d = att.dmg; const parts = ['base ' + att.dmg];
    if (att.side === 'p') {
      if (!inShade(b, ay)) { const sb = CONFIG.SUN_BONUS * (att.captain && att.perks.includes('sunborn') ? 2 : 1); d += sb; parts.push('sun +' + sb); }
      if (!att.captain) {
        const cap = captainOf(b);
        if (cap && cap.perks.includes('rally') && dist(cap.x, cap.y, ax, ay) === 1) { d += 1; parts.push('rally +1'); }
      }
      if (att.flank && def) {
        for (const [ox, oy] of DIRS) {
          const o = unitAt(b, dx + ox, dy + oy);
          if (o && o.side === 'p' && o !== att && !(o.x === ax && o.y === ay)) { d += att.flank; parts.push('flank +' + att.flank); break; }
        }
      }
    } else {
      if (inShade(b, ay)) { d += CONFIG.SHADE_BONUS; parts.push('shade +' + CONFIG.SHADE_BONUS); }
    }
    if (terr(b, ax, ay).mud && !T(att).fly) { d -= CONFIG.MUD_PENALTY; parts.push('mud -1'); }
    if (def) {
      const cv = T(def).fly ? 0 : terr(b, dx, dy).cover;
      if (cv) { d -= cv; parts.push('grass -' + cv); }
      if (def.armor) { d -= def.armor; parts.push('armor -' + def.armor); }
    }
    return { dmg: Math.max(1, d), parts };
  }

  function damageUnit(b, v, dmg, events, src, kind) {
    if (!v || v.hp <= 0) return;
    v.hp -= dmg;
    if (v.side === 'p') b.stats.taken += dmg; else b.stats.dealt += dmg;
    events.push(ev(b, 'hurt', { id: v.id, x: v.x, y: v.y, dmg, src: src ? src.id : null, kind: kind || 'hit', side: v.side }));
    if (v.hp <= 0) killUnit(b, v, events, src);
  }
  function killUnit(b, v, events, src) {
    v.hp = 0;
    b.units = b.units.filter(u => u !== v);
    if (v.side === 'p') b.fallen.push({ name: v.name, type: v.type, vetId: v.vetId, captain: v.captain, level: v.level });
    else b.kills++;
    events.push(ev(b, 'death', { id: v.id, x: v.x, y: v.y, side: v.side, type: v.type }));
    if (src && src.side === 'p' && v.side === 'e') gainXp(b, src, T(v).boss ? CONFIG.XP_BOSS : CONFIG.XP_KILL, events);
  }
  function damageSeed(b, dmg, events) {
    if (!b.seedling) return;
    b.seedling.hp = Math.max(0, b.seedling.hp - dmg);
    events.push(ev(b, 'hurt', { seed: true, x: b.seedling.x, y: b.seedling.y, dmg, side: 'seed' }));
  }

  // push v away from attacker by n tiles
  function pushUnit(b, att, v, n, events) {
    const dx = Math.sign(v.x - att.x), dy = Math.sign(v.y - att.y);
    for (let i = 0; i < n && v.hp > 0; i++) {
      const nx = v.x + dx, ny = v.y + dy;
      if (!inB(b, nx, ny) || terr(b, nx, ny).block || isSeed(b, nx, ny)) {
        events.push(ev(b, 'bump', { id: v.id, x: v.x, y: v.y, tx: nx, ty: ny }));
        damageUnit(b, v, CONFIG.BUMP_DMG, events, att, 'bump');
        return;
      }
      const occ = unitAt(b, nx, ny);
      if (occ) {
        events.push(ev(b, 'bump', { id: v.id, x: v.x, y: v.y, tx: nx, ty: ny }));
        damageUnit(b, v, CONFIG.BUMP_DMG, events, att, 'bump');
        damageUnit(b, occ, CONFIG.BUMP_DMG, events, occ.side === 'e' ? att : null, 'bump');
        return;
      }
      const fx = v.x, fy = v.y;
      v.x = nx; v.y = ny;
      events.push(ev(b, 'push', { id: v.id, fx, fy, x: nx, y: ny }));
      if (terr(b, nx, ny).mud && !T(v).fly) return;
    }
  }

  // ===== enemy intents =====
  // intent: {k:'unit', id} | {k:'tile', x, y} | {k:'seed'}  plus order
  function sweepTiles(b, e, tx, ty) {
    const out = [[tx, ty]];
    if (T(e).sweep) {
      const dx = Math.sign(tx - e.x), dy = Math.sign(ty - e.y);
      out.push([tx + dy, ty + dx], [tx - dy, ty - dx]);
    }
    return out.filter(([x, y]) => inB(b, x, y));
  }
  // Predict (apply=false) or resolve (apply=true) an intent.
  function resolveIntent(b, e, apply, events, claimed) {
    const it = e.intent;
    if (!it) return null;
    let tx, ty;
    if (it.k === 'unit') {
      const v = getUnit(b, it.id);
      if (!v || v.hp <= 0) return { fizzle: true, reason: 'target gone' };
      tx = v.x; ty = v.y;
    } else if (it.k === 'seed') {
      if (!b.seedling || b.seedling.hp <= 0) return { fizzle: true, reason: 'target gone' };
      tx = b.seedling.x; ty = b.seedling.y;
    } else { tx = it.x; ty = it.y; }
    let ax = e.x, ay = e.y, lunge = null;
    if (!inReach(b, e, ax, ay, tx, ty)) {
      // lungers take one step after a target that slipped away
      if (T(e).lunge && it.k !== 'tile') {
        for (const [dx, dy] of DIRS) {
          const nx = e.x + dx, ny = e.y + dy;
          if (!passable(b, nx, ny) || unitAt(b, nx, ny) || isSeed(b, nx, ny)) continue;
          if (claimed && claimed.has(nx + ',' + ny)) continue;
          if (inReach(b, e, nx, ny, tx, ty)) { lunge = { x: nx, y: ny }; break; }
        }
      }
      if (!lunge) {
        if (apply) events.push(ev(b, 'fizzle', { id: e.id, x: e.x, y: e.y, tx, ty }));
        return { fizzle: true, reason: T(e).lunge ? 'too far to lunge' : 'out of reach', tx, ty };
      }
      ax = lunge.x; ay = lunge.y;
      if (claimed) claimed.add(ax + ',' + ay);
      if (apply) {
        const fx = e.x, fy = e.y; e.x = ax; e.y = ay;
        events.push(ev(b, 'emove', { id: e.id, fx, fy, x: ax, y: ay, path: [[fx, fy], [ax, ay]], lunge: true }));
      }
    }
    const hits = [];
    const at = (ax === e.x && ay === e.y) ? e : Object.assign({}, e, { x: ax, y: ay });
    for (const [x, y] of sweepTiles(b, at, tx, ty)) {
      if (isSeed(b, x, y)) { hits.push({ seed: true, x, y, dmg: calcDamage(b, e, ax, ay, null, x, y).dmg }); continue; }
      const v = unitAt(b, x, y);
      if (v && v !== e) hits.push({ id: v.id, x, y, side: v.side, dmg: calcDamage(b, e, ax, ay, v, x, y).dmg });
    }
    if (apply) {
      events.push(ev(b, 'strike', { id: e.id, x: e.x, y: e.y, tx, ty, miss: hits.length === 0 }));
      for (const h of hits) {
        if (h.seed) damageSeed(b, h.dmg, events);
        else damageUnit(b, getUnit(b, h.id), h.dmg, events, e, 'hit');
      }
    }
    return { fizzle: false, tx, ty, hits, lunge };
  }
  function predictAll(b) {
    const out = [], claimed = new Set();
    const list = foes(b).filter(e => e.intent).sort((a, c) => a.intent.order - c.intent.order);
    for (const e of list) out.push({ id: e.id, order: e.intent.order, r: resolveIntent(b, e, false, null, claimed) });
    return out;
  }

  // distance field from goal tiles using unit u's movement costs (ignores units)
  function distField(b, u, goals) {
    const D = new Array(b.cols * b.rows).fill(Infinity);
    const q = [];
    for (const [x, y] of goals) { if (!passable(b, x, y) && !(x === u.x && y === u.y)) continue; D[y * b.cols + x] = 0; q.push([x, y, 0]); }
    while (q.length) {
      q.sort((a, c) => a[2] - c[2]);
      const [x, y, d] = q.shift();
      if (d > D[y * b.cols + x]) continue;
      for (const [dx, dy] of DIRS) {
        const nx = x + dx, ny = y + dy;
        if (!passable(b, nx, ny)) continue;
        // cost of stepping from (nx,ny) into (x,y) ~ cost of (x,y); mud treated as 3
        let c = T(u).fly ? 1 : (terr(b, x, y).mud ? 3 : terr(b, x, y).cost);
        const nd = d + c;
        if (nd < D[ny * b.cols + nx]) { D[ny * b.cols + nx] = nd; q.push([nx, ny, nd]); }
      }
    }
    return D;
  }

  function attackGoals(b, u) {
    const goals = [];
    const targets = players(b).map(p => [p.x, p.y]);
    if (b.seedling && b.seedling.hp > 0) targets.push([b.seedling.x, b.seedling.y]);
    for (let y = 0; y < b.rows; y++) for (let x = 0; x < b.cols; x++) {
      if (!passable(b, x, y)) continue;
      for (const [tx, ty] of targets) { const d = dist(x, y, tx, ty); if (d >= u.rmin && d <= rmaxAt(b, u, x, y)) { goals.push([x, y]); break; } }
    }
    return goals;
  }

  function planEnemies(b, events) {
    const planned = {}; // victim key -> damage already planned
    const order = foes(b).slice().sort((a, c) => {
      const da = Math.min(99, ...players(b).map(p => dist(a.x, a.y, p.x, p.y)));
      const dc = Math.min(99, ...players(b).map(p => dist(c.x, c.y, p.x, p.y)));
      return da - dc || a.id - c.id;
    });
    let n = 1;
    const hold = b.obj.kind === 'hold';
    const backRow = b.rows - 1;
    for (const e of order) {
      if (e.hp <= 0) continue;
      e.intent = null;
      const reach = reachable(b, e, { full: true });
      let best = null;
      const posScore = (t) => {
        let s = 0;
        if (inShade(b, t.y)) s += 4;
        if (!T(e).fly && terr(b, t.x, t.y).cover) s += 2;
        if (terr(b, t.x, t.y).heal && e.hp < e.maxHp) s += 3;
        if (!T(e).fly && terr(b, t.x, t.y).mud) s -= 2;
        s -= 0.01 * dist(t.x, t.y, e.x, e.y);
        return s;
      };
      for (const t of reach.values()) {
        if (hold && t.y === backRow) {
          const s = 60 + posScore(t);
          if (!best || s > best.s) best = { s, t, intent: null, breach: true };
          continue;
        }
        for (const [tx, ty] of tilesInReach(b, e, t.x, t.y)) {
          // evaluate the strike as if e stood at t
          let s = 0, any = false, mainKey = null;
          let tileList = sweepTiles(b, Object.assign({}, e, { x: t.x, y: t.y }), tx, ty);
          for (const [hx, hy] of tileList) {
            if (isSeed(b, hx, hy)) {
              const d = calcDamage(b, e, t.x, t.y, null, hx, hy).dmg;
              s += d * 10 + 30; any = true; if (hx === tx && hy === ty) mainKey = 'seed';
              continue;
            }
            const v = unitAt(b, hx, hy);
            if (!v || v === e) continue;
            const d = calcDamage(b, e, t.x, t.y, v, hx, hy).dmg;
            if (v.side === 'p') {
              const key = 'u' + v.id, pl = planned[key] || 0;
              if (pl >= v.hp) { s -= 15; continue; }
              s += Math.min(d, v.hp - pl) * 10; any = true;
              if (d + pl >= v.hp) s += 25;
              if (v.captain) s += 6;
              if (hx === tx && hy === ty) mainKey = key;
            } else {
              s -= 12;
            }
          }
          if (!any || !mainKey) continue;
          s += posScore(t);
          if (T(e).lob) s += 0; // spitters are happy anywhere in range
          if (!best || s > best.s) {
            let intent;
            if (mainKey === 'seed') intent = { k: 'seed' };
            else if (T(e).lob) intent = { k: 'tile', x: tx, y: ty };
            else intent = { k: 'unit', id: +mainKey.slice(1) };
            best = { s, t, intent, key: mainKey, dmg: calcDamage(b, e, t.x, t.y, mainKey === 'seed' ? null : getUnit(b, +mainKey.slice(1)), tx, ty).dmg };
          }
        }
      }
      if (!best) {
        // approach
        let goals;
        if (hold) { goals = []; for (let x = 0; x < b.cols; x++) goals.push([x, backRow]); }
        else goals = attackGoals(b, e);
        const D = distField(b, e, goals);
        let bs = null;
        for (const t of reach.values()) {
          const d = D[t.y * b.cols + t.x];
          let s = -d * 10 + posScore(t);
          if (T(e).lob) { const near = Math.min(99, ...players(b).map(p => dist(t.x, t.y, p.x, p.y))); if (near < 2) s -= 15; }
          if (!bs || s > bs.s) bs = { s, t };
        }
        if (bs) best = { s: bs.s, t: bs.t, intent: null };
      }
      if (best) {
        const t = best.t;
        if (t.x !== e.x || t.y !== e.y) {
          const fx = e.x, fy = e.y;
          e.x = t.x; e.y = t.y;
          events.push(ev(b, 'emove', { id: e.id, fx, fy, x: t.x, y: t.y, path: t.path }));
        }
        if (best.breach) {
          // slips through the gate
          b.gate = Math.max(0, (b.gate || 0) - 1);
          b.units = b.units.filter(u => u !== e);
          events.push(ev(b, 'breach', { id: e.id, x: e.x, y: e.y }));
          continue;
        }
        if (best.intent) {
          e.intent = Object.assign(best.intent, { order: n++ });
          if (best.key) planned[best.key] = (planned[best.key] || 0) + (best.dmg || 0);
        }
      }
    }
    if (events) events.push(ev(b, 'intents', {}));
  }

  function telegraphSpawns(b) {
    b.pending = (b.spawnPlan || []).filter(s => s[0] === b.round).map(s => ({ type: s[1], x: s[2], y: s[3] }));
  }
  function futureSpawns(b) { return (b.spawnPlan || []).some(s => s[0] > b.round) || (b.pending && b.pending.length > 0); }

  function healBlooms(b, side, events) {
    for (const u of b.units) {
      if (u.side !== side || u.hp <= 0) continue;
      if (terr(b, u.x, u.y).heal && u.hp < u.maxHp) {
        const h = Math.min(CONFIG.BLOOM_HEAL, u.maxHp - u.hp); u.hp += h;
        events.push(ev(b, 'heal', { id: u.id, x: u.x, y: u.y, amt: h }));
      }
      if (side === 'p' && u.captain && u.perks.includes('secondWind') && u.hp < u.maxHp) {
        const h = Math.min(CONFIG.SECOND_WIND, u.maxHp - u.hp); u.hp += h;
        events.push(ev(b, 'heal', { id: u.id, x: u.x, y: u.y, amt: h }));
      }
    }
  }

  // ===== win / loss =====
  function finish(b, result, reason, events) {
    b.phase = result; b.reason = reason;
    for (const u of b.units) u.intent = null;
    events.push(ev(b, result, { reason }));
    return true;
  }
  function checkEnd(b, events) {
    if (b.phase === 'won' || b.phase === 'lost') return true;
    if (b.mode !== 'free' && !captainOf(b)) return finish(b, 'lost', 'captain', events);
    if (players(b).length === 0) return finish(b, 'lost', 'band', events);
    if (b.seedling && b.seedling.hp <= 0) return finish(b, 'lost', 'seedling', events);
    if (b.obj.kind === 'hold' && b.gate <= 0) return finish(b, 'lost', 'breach', events);
    const k = b.obj.kind;
    if (k === 'rout' && foes(b).length === 0 && !futureSpawns(b)) return finish(b, 'won', 'rout', events);
    if (k === 'boss' && !b.units.some(u => u.side === 'e' && T(u).boss && u.hp > 0)) return finish(b, 'won', 'boss', events);
    if (k === 'reach') { const c = captainOf(b); if (c && terr(b, c.x, c.y).exit) return finish(b, 'won', 'reach', events); }
    return false;
  }

  function endTurn(b, events) {
    b.undo = null; b.phase = 'enemy';
    events.push(ev(b, 'phase', { who: 'e' }));
    const order = foes(b).filter(u => u.intent).sort((a, c) => a.intent.order - c.intent.order);
    for (const e of order) {
      if (e.hp <= 0 || !b.units.includes(e)) continue;
      resolveIntent(b, e, true, events);
      e.intent = null;
      if (checkEnd(b, events)) return;
    }
    for (const u of b.units) u.intent = null;
    const k = b.obj.kind;
    if ((k === 'hold' || k === 'protect') && b.round >= b.obj.rounds) { finish(b, 'won', k, events); return; }
    if (b.obj.limit && b.round >= b.obj.limit) { finish(b, 'lost', 'time', events); return; }
    // spawns climb out
    for (const sp of b.pending || []) {
      const occ = unitAt(b, sp.x, sp.y);
      if (occ && occ.side === 'p') { events.push(ev(b, 'blocked', { x: sp.x, y: sp.y, id: occ.id })); damageUnit(b, occ, CONFIG.BLOCK_DMG, events, null, 'block'); if (checkEnd(b, events)) return; continue; }
      if (occ || isSeed(b, sp.x, sp.y)) { events.push(ev(b, 'blocked', { x: sp.x, y: sp.y })); continue; }
      const u = makeUnit(b, sp.type, sp.x, sp.y);
      events.push(ev(b, 'spawn', { id: u.id, x: sp.x, y: sp.y, type: sp.type }));
    }
    b.pending = [];
    b.round++;
    if (b.shade && b.shade.h) { b.shade.row = mod(b.shade.row + b.shade.dir, b.rows); events.push(ev(b, 'shade', {})); }
    healBlooms(b, 'e', events);
    planEnemies(b, events);
    if (checkEnd(b, events)) return;
    telegraphSpawns(b);
    for (const u of b.units) if (u.side === 'p') { u.moved = false; u.acted = false; }
    healBlooms(b, 'p', events);
    b.phase = 'player';
    events.push(ev(b, 'phase', { who: 'p' }));
    checkEnd(b, events);
  }

  // ===== targets for the UI and bots =====
  function actTargets(b, u, x, y) {
    if (x == null) { x = u.x; y = u.y; }
    const out = [];
    for (const [tx, ty] of tilesInReach(b, u, x, y)) {
      const v = unitAt(b, tx, ty);
      if (!v || v === u) continue;
      if (v.side === 'e') out.push({ x: tx, y: ty, kind: 'attack', id: v.id });
      else if (u.heal && dist(x, y, tx, ty) === 1 && v.hp < v.maxHp) out.push({ x: tx, y: ty, kind: 'heal', id: v.id });
    }
    return out;
  }

  // Forecast an action without changing state.
  function forecast(b, u, tx, ty) {
    const c = clone(b);
    const r = applyCommand(c, { t: 'act', id: u.id, x: tx, y: ty });
    return r;
  }

      x.lineTo(W, H); x.lineTo(0, H); x.fill();
      // meadow
      x.fillStyle = dusk ? '#3f5232' : '#9cc66a'; x.fillRect(0, H * 0.7, W, H * 0.3);
      // thistles
      for (let i = 0; i < 5; i++) {
        const tx = W * (0.08 + i * 0.22), base = H * 0.74, ht = H * (0.22 + 0.06 * (i % 2)), sw = Math.sin(t * 1.2 + i) * 2;
        x.strokeStyle = dusk ? '#29361f' : '#4f7a34'; x.lineWidth = 2; x.beginPath(); x.moveTo(tx, base); x.quadraticCurveTo(tx + sw, base - ht * 0.6, tx + sw * 1.5, base - ht); x.stroke();
        x.fillStyle = dusk ? '#5a3a6a' : '#a45bc8'; x.beginPath(); x.arc(tx + sw * 1.5, base - ht - 4, 5, 0, 7); x.fill();
        x.fillStyle = dusk ? '#29361f' : '#4f7a34'; x.beginPath(); x.ellipse(tx + sw * 1.5, base - ht + 2, 5, 3, 0, 0, 7); x.fill();
      }
      // grass tufts
      x.strokeStyle = dusk ? '#33452a' : '#6f9e45'; x.lineWidth = 1.2;
      for (const [a, b2, k] of tufts) { const gx = a * W, gy = H * (0.72 + b2 * 0.26), sw = Math.sin(t * 2 + k * 6) * 1.5; x.beginPath(); x.moveTo(gx, gy); x.lineTo(gx - 2 + sw, gy - 6); x.moveTo(gx, gy); x.lineTo(gx + 2 + sw, gy - 7); x.stroke(); }
      // the band
      const band = kind === 'dusk' ? [['grub', 'e'], ['spitter', 'e'], ['grub', 'e']] : [['mender', 'p'], ['bomber', 'p'], ['duelist', 'p'], ['warden', 'p']];
      const sz = H * 0.3;
      band.forEach(([ty, side], i) => {
        let bx = W * (0.2 + i * 0.17), by = H * 0.8;
        if (kind === 'march' && !RM) bx = ((bx + t * 14) % (W + sz)) - sz / 2;
        if (kind === 'home') by -= Math.abs(Math.sin(t * 4 + i)) * 4;
        x.save(); x.translate(bx, by); x.rotate(side === 'p' ? Math.PI / 2 : -Math.PI / 2);
        drawBug(x, ty, 0, 0, sz, { side, captain: ty === 'warden', seed: i, still: RM });
        x.restore();
      });
      // motes: pollen by day, spores at dusk
      for (const [a, b2, k] of motes) {
        const mx = (a * W + t * 8 * (0.5 + k)) % W, my = H * (0.15 + b2 * 0.6) + Math.sin(t + k * 9) * 4;
        x.fillStyle = dusk ? 'rgba(170,140,210,0.6)' : 'rgba(255,240,150,0.85)'; x.beginPath(); x.arc(mx, my, 1.2 + k, 0, 7); x.fill();
      }
      if (!RM && !document.hidden) requestAnimationFrame(draw);
    };
    draw();
    document.addEventListener('visibilitychange', () => { if (!document.hidden && c.isConnected && !RM) requestAnimationFrame(draw); });
    return c;
  }

  function btn(label, cls, fn) { const b = document.createElement('button'); b.className = 'btn ' + (cls || ''); b.textContent = label; b.onclick = (e) => { Snd.init(); Snd.play('tap'); fn(e); }; return b; }
  function dateKey() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  function newCampaign(oath) {

  function resumeSave(sv) {

      cd.onclick = () => { if (on) S.picks = S.picks.filter(p => p.vetId !== v.vetId); else if (S.picks.length < 3) S.picks.push({ vetId: v.vetId }); else { toast('Three slots are full. Tap a slot to free it.'); return; } Snd.play('tap'); briefing(); };

      cd.onclick = () => { if (S.picks.length >= 3) { toast('Three slots are full. Tap a slot to free it.'); return; } S.picks.push({ type: t, name: C.recruitName(c) }); Snd.play('tap'); briefing(); };

    w.appendChild(cards);
    w.insertAdjacentHTML('beforeend', '<p class="note">Veterans keep their experience between battles, and their wounds: they heal 2 at camp, or fully if they sit a battle out. Anyone who falls is gone for good, even in a lost battle. Recruits are always free.</p>');

  }
  function vet(id) { return S.camp.barracks.find(v => v.vetId === id) || { type: 'duelist', name: '?' }; }
  function pickName(p) { return p.vetId != null ? vet(p.vetId).name : (p.name + '<br><span class="muted">new ' + C.UNIT_TYPES[p.type].role.toLowerCase() + '</span>'); }
  function defaultPicks(c) {
    const out = [];
    // healthiest veterans first; badly hurt ones rest
    const fit = c.barracks.filter(v => (v.wound || 0) * 2 < C.vetMaxHp(v));
    for (const v of fit) { if (out.length < 3) out.push({ vetId: v.vetId }); }
    const order = ['duelist', 'bomber', 'mender', 'scout'].filter(t => c.unlocked.includes(t));
    let i = 0;
    while (out.length < 3) { const t = order[i % order.length]; out.push({ type: t, name: C.recruitName(c) }); i++; }
    return out;
  }
  function startBattle() {
    const c = S.camp;
    if (!C.validPicks(c, S.picks)) return;
    c.newUnlock = null;
    const band = C.bandFor(c, S.picks);
    S.battle = C.createBattle(C.BATTLES[c.battle], band, { seed: C.battleSeed(c), idx: c.battle, oath: !!c.oath });
    S.picks = [];
    U.sel = null; U.pend = null; U.focus = null; U.anim = []; U.cur = null; U.disp = null;
    show('battle');
    banner(S.battle.name);
    setTimeout(() => toast(C.BATTLES[c.battle].tip), 700);
  }

  function endBattle() {
    const b = S.battle; if (!b || (b.phase !== 'won' && b.phase !== 'lost')) return;
    if (S.screen !== 'battle') return;
    if (b.mode === 'daily') { dailyResult(); return; }
    S.debrief = C.settleBattle(S.camp, b);
    if (S.debrief.unlock) S.camp.newUnlock = S.debrief.unlock;
    const sc = C.campaignScore(S.camp);
    const bk = S.camp.oath ? 'oathStars' : 'stars';
    if (S.camp.done === 'won' && !S.camp.counted) { best.campaigns = (best.campaigns || 0) + 1; if (S.camp.oath) best.oaths = (best.oaths || 0) + 1; S.camp.counted = true; }
    if (S.camp.done === 'won') best[bk] = Math.max(best[bk] || 0, sc);
    saveBest();
    S.battle = null;
    debriefScreen();
  }

  // ===== Daily skirmish =====
  function startDaily() {
    S.mode = 'daily';
    const key = dateKey();
    const ds = Store.get(K_DAILY);
    if (ds && ds.date === key && ds.battle && C.validBattle(ds.battle) && ds.battle.phase === 'player') {
      S.daily = { date: key }; S.battle = ds.battle; U.anim = []; U.cur = null; U.disp = null; U.sel = null; show('battle'); return;
    }
    const seed = C.hashStr('daily:' + key);
    const def = C.dailyDef(seed);
    S.daily = { date: key };
    S.battle = C.createBattle(def, C.dailyBand(seed), { seed, idx: -1, mode: 'daily' });
    U.anim = []; U.cur = null; U.disp = null; U.sel = null; U.pend = null; U.focus = null;
    show('battle'); banner('Daily · ' + key); setTimeout(() => toast('Same map and band for everyone today. Rout them fast.'), 600);
  }
  function dailyScore(b) { if (b.phase !== 'won') return 0; return 100 * (b.obj.limit - b.round + 1) + 60 * C.players(b).length + 5 * b.kills; }
  function dailyResult() {
    const b = S.battle; const key = S.daily.date; const sc = dailyScore(b);
    best.daily = best.daily || {}; const prev = best.daily[key] || 0; if (sc > prev) best.daily[key] = sc;
    // keep the table small
    const ks = Object.keys(best.daily).sort(); while (ks.length > 30) delete best.daily[ks.shift()];
    saveBest();
    Store.set(K_DAILY, { v: 1, date: key, battle: null, done: true });
    scr.innerHTML = '';
    const w = document.createElement('div'); w.className = 'stack';
    w.insertAdjacentHTML('beforeend', '<h2>Daily skirmish · ' + key + '</h2><p>' + (b.phase === 'won' ? 'Routed by round ' + b.round + ' with ' + C.players(b).length + ' still standing.' : 'Defeated. Tomorrow brings a new meadow, or try again today.') + '</p>' +
      '<div class="center stars">' + sc + ' pts</div><p class="center muted">Best today: ' + Math.max(prev, sc) + (sc > prev && sc > 0 ? ' · new best!' : '') + '</p><p class="note center">Score: 100 per round to spare, 60 per survivor, 5 per foe.</p>');
    w.appendChild(btn('Try again', 'primary', () => { Store.del(K_DAILY); startDaily(); }));
    w.appendChild(btn('Title', '', () => titleScreen()));
    S.battle = null; scr.appendChild(w); S.screen = 'daily'; scr.classList.add('on');
  }

  function helpBox() {

      '<li><b>Red lines</b> show exactly who each foe will hit when you end the turn, and for how much. Numbers on foes show the order.</li>' +
      '<li>A foe misses if its target <b>leaves its reach</b>. Grubs and gnats <b>lunge</b> 1 tile after a target, so step 2 away or block the lunge tile. Orange dashed arcs are spitter lobs at a tile: step off it.</li>' +
      '<li><b>Sun</b>: your attacks +1. <b>Shade</b> (violet rows): Rot attacks +1. Dotted violet rows show where the shade moves next.</li>' +
      '<li><b>Tall grass</b> softens hits by 1. <b>Pebbles</b> extend range. <b>Mud</b> stops you and weakens attacks. <b>Blooms</b> heal 2. <b>Bramble</b> blocks, and shoving a foe into it deals +1.</li>' +
      '<li>Stepping next to a foe stops your movement (its grip). The Hopper Scout ignores grip.</li>' +
      '<li>If Oakhorn falls, the battle is lost. Lose 3 battles and the campaign ends. Veterans keep their experience <b>and their wounds</b> (2 heal at camp; a battle off heals fully). The fallen are gone, even in defeat.</li>' +
      '<li>Keys: arrows + Enter to tap, S strike, U undo, N next unit, E end turn, Esc cancel. Tap during animations to speed up.</li></ul>',
      (box) => box.appendChild(btn('Got it', 'primary', closeModal)));
  }
  $('#menuBtn').onclick = () => {
    Snd.init();
    openModal('<h2>Menu</h2>', (box) => {
      const st = document.createElement('div'); st.className = 'stack';
      st.appendChild(btn('Resume', 'primary', closeModal));
      st.appendChild(btn('How to play', '', helpBox));
      st.appendChild(btn('Sound: ' + (settings.sound ? 'on' : 'off'), '', () => { settings.sound = !settings.sound; saveSettings(); closeModal(); }));
      st.appendChild(btn('Music: ' + (settings.music ? 'on' : 'off'), '', () => { settings.music = !settings.music; saveSettings(); closeModal(); }));
      st.appendChild(btn('Animation speed: ' + (settings.speed === 1 ? 'normal' : 'fast'), '', () => { settings.speed = settings.speed === 1 ? 2 : 1; saveSettings(); closeModal(); }));
      if (S.battle && S.battle.mode !== 'daily' && S.battle.phase === 'player') st.appendChild(btn('Restart this battle (costs 1 resolve)', '', () => confirmBox('Restart? This counts as a defeat and costs 1 resolve.', 'Restart', () => { S.battle.phase = 'lost'; S.battle.reason = 'retreat'; endBattle(); })));
      st.appendChild(btn('Backup: copy save code', '', exportBox));
      st.appendChild(btn('Quit to title (progress is saved)', '', () => { closeModal(); persist(); S.battle && S.mode === 'daily' && Store.set(K_DAILY, { v: 1, date: S.daily.date, battle: S.battle }); S.battle = null; titleScreen(); }));
      box.appendChild(st);
    });
  };
  function exportBox() {
    const raw = Store.raw(K_SAVE) || Store.raw(K_BAD) || '';
    let code = ''; try { code = btoa(unescape(encodeURIComponent(raw))); } catch (e) { }
    openModal('<h2>Save backup</h2><p class="note">Copy this code somewhere safe. Paste a code below and tap Load to restore it.</p><textarea id="exp" readonly>' + code + '</textarea><textarea id="imp" placeholder="Paste a save code here"></textarea>', (box) => {
      const r = document.createElement('div'); r.className = 'row';
      r.appendChild(btn('Copy', '', () => { const t = $('#exp'); t.select(); try { navigator.clipboard.writeText(t.value); toast('Copied'); } catch (e) { document.execCommand && document.execCommand('copy'); } }));
      r.appendChild(btn('Load', 'primary', () => {
        try {
          const txt = decodeURIComponent(escape(atob($('#imp').value.trim())));
          const o = JSON.parse(txt);
          if (!o || !C.validCampaign(o.camp)) throw 0;
          if (o.battle && !C.validBattle(o.battle)) { o.battle = null; o.screen = 'brief'; }
          Store.set(K_SAVE, o); closeModal(); toast('Save restored'); resumeSave(o);
        } catch (e) { toast('That code could not be read.'); }
      }));
      r.appendChild(btn('Close', '', closeModal));
      box.appendChild(r);
    });
  }

  // ===== boot =====
  // debug view: add #debug to the URL to log each command's events to the console (no change to play)
  if (location.hash === '#debug') window.TM_DEBUG = { S, C, U, exec, tapTile, tryEnd, busy, ts: () => TS, fast: false, Snd };
  resize();
  titleScreen();
})();

</script>
