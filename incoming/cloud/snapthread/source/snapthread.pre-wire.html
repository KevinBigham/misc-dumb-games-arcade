<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#271b16">
<title>Snapthread</title>
<style>
:root{
  --bg:#271b16; --bg2:#33241d; --panel:#3d2c23; --panel2:#4a362b; --line:#6b5140;
  --cream:#f4e8cd; --muted:#c3ae8e; --dim:#8f7a62; --ink:#1a120e;
  --madder:#c2473c; --madder2:#e0665a; --indigo:#4553a8; --indigo2:#6f7fd6; --saffron:#e9ab3c; --saffron2:#ffd27a;
  --weld:#9aa646; --weld2:#c4cf6a; --teal:#3f9a8c;
  --taut:#e9ab3c; --weave:#6f7fd6; --neutral:#c3ae8e;
  --r:12px; color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--cream);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{background:radial-gradient(120% 80% at 50% 0%,#3b2a21 0%,var(--bg) 60%) fixed;}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:relative;max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
.scr{flex:1;display:flex;flex-direction:column;min-height:0}
.title-font{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;letter-spacing:.02em}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-height:46px;font-weight:600;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(#d6544a,#a93a31);border-color:#e47a6f;color:#fff8ec;box-shadow:0 3px 0 #6e221c}
.btn.gold{background:linear-gradient(#f0b850,#c98a22);border-color:#ffd27a;color:#2a1a0c;box-shadow:0 3px 0 #7a5211}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.node:focus-visible,.card:focus-visible,.enemy:focus-visible{outline:3px solid var(--saffron2);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.center{text-align:center}
/* top bar */
.top{display:flex;align-items:center;gap:8px;padding:8px 10px 6px;background:rgba(0,0,0,.18);border-bottom:1px solid rgba(255,255,255,.05);flex:0 0 auto}
.hp{display:flex;align-items:center;gap:6px;font-weight:700}
.hp svg{width:18px;height:18px;flex:0 0 auto}
.iconbtn svg{width:18px;height:18px}.iconbtn{display:inline-flex;align-items:center;gap:3px}
.hpbar{width:88px;height:10px;border-radius:6px;background:#1a110d;overflow:hidden;border:1px solid #5a3f33}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#b8403a,#e0665a);transition:width .35s}
.chip{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px;font-weight:700;white-space:nowrap}
.chip svg{width:13px;height:13px}
.chip.block{background:#26315f;border-color:#5262b8}
.chip.weave{background:#2c3a58;border-color:#7c8fe0}
.chip.bad{background:#4b1f1b;border-color:#a3453b}
.chip.buff{background:#3f3816;border-color:#b2992f}
.chip.pow{background:#3a2a40;border-color:#8b6aa0}
.iconbtn{justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:42px;min-height:40px;padding:4px 8px;font-weight:700;font-size:13px}
/* title */
.title-scr{justify-content:center;align-items:center;padding:24px 18px;gap:14px;text-align:center}
.logo{font-size:44px;margin:0;line-height:1;color:var(--cream);text-shadow:0 3px 0 #6e221c}
.logo b{color:var(--saffron)}
.tag{color:var(--muted);max-width:330px;margin:0 auto}
.menu{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
.stats{color:var(--dim);font-size:13px}
.notice{background:#4b1f1b;border:1px solid #a3453b;border-radius:10px;padding:10px 12px;font-size:13.5px;max-width:340px}
/* map */
.mapwrap{flex:1;overflow-y:auto;position:relative;-webkit-overflow-scrolling:touch}
.map{position:relative;margin:0 auto}
.map svg.edges{position:absolute;left:0;top:0;pointer-events:none}
.node{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:2px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;padding:0;transition:transform .15s}
.node svg{width:26px;height:26px}
.node.done{opacity:.55;background:#2b1f19}
.node.here{border-color:var(--saffron2);box-shadow:0 0 0 3px rgba(233,171,60,.35)}
.node.can{border-color:var(--saffron);animation:pulse 1.3s infinite}
.node.locked{opacity:.38}
.node.boss{width:64px;height:64px;margin:-32px 0 0 -32px;border-color:var(--madder)}
.node.boss svg{width:38px;height:38px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:6px 8px 10px;font-size:12px;color:var(--muted);flex:0 0 auto}
.legend span{display:inline-flex;align-items:center;gap:3px}
.legend svg{width:15px;height:15px}
/* combat */
.arena{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.enemies{flex:1;display:flex;justify-content:center;align-items:flex-end;gap:6px;padding:8px 6px 4px;min-height:150px}
.enemy{position:relative;flex:1;max-width:150px;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px}
.enemy.targetable .sprite{filter:drop-shadow(0 0 6px rgba(233,171,60,.75))}
.enemy.tgt .sprite{filter:drop-shadow(0 0 10px #ffd27a)}
.enemy.dead{opacity:0;transform:scale(.6);transition:opacity .45s,transform .45s;pointer-events:none}
.sprite{width:84px;height:84px;transition:transform .12s}
.sprite svg{width:100%;height:100%}
.ename{font-size:12px;font-weight:700;color:var(--muted);text-align:center;line-height:1.1}
.ehp{width:86%;height:8px;border-radius:6px;background:#1a110d;overflow:hidden;border:1px solid #5a3f33;position:relative}
.ehp i{display:block;height:100%;background:linear-gradient(90deg,#b8403a,#e0665a);transition:width .3s}
.ehpn{font-size:11.5px;font-weight:700}
.intent{display:flex;align-items:center;gap:3px;padding:3px 8px;border-radius:999px;background:var(--ink);border:1px solid var(--line);font-weight:800;font-size:13.5px;min-height:26px}
.intent.atk{border-color:#e0665a;color:#ffb4a8}
.intent svg{width:16px;height:16px}
.estat{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:20px}
.pbar{display:flex;flex-direction:column;gap:6px;padding:6px 10px;background:rgba(0,0,0,.18);border-top:1px solid rgba(255,255,255,.05);flex:0 0 auto}
.tension{display:flex;align-items:center;gap:8px}
.tlab{font-size:12px;font-weight:800;color:var(--saffron);width:76px;line-height:1.05;white-space:nowrap}
.tlab small{display:block;color:var(--dim);font-weight:600}
.tg{flex:1;display:grid;grid-template-columns:repeat(10,1fr);gap:3px;position:relative}
.tg i{height:14px;border-radius:3px;background:#1d1410;border:1px solid #4d3a2e;transition:background .2s}
.tg i.on{background:linear-gradient(#ffd27a,#e9ab3c);border-color:#ffd27a}
.tg i.hot{background:linear-gradient(#ff9a7a,#c2473c);border-color:#ffb4a8}
.tg i.ghost{background:repeating-linear-gradient(45deg,#5a3a1a,#5a3a1a 3px,#3a2616 3px,#3a2616 6px)}
.tg.shake{animation:shake .35s}
.pstat{display:flex;gap:4px;flex-wrap:wrap;align-items:center;min-height:22px}
.info{min-height:58px;padding:7px 10px;background:var(--bg2);border-top:1px solid rgba(255,255,255,.05);font-size:13.5px;flex:0 0 auto;display:flex;gap:8px;align-items:center}
.info b{color:var(--saffron2)}
.info .grow{min-width:0}
.coach{background:#3f3816;border:1px solid #b2992f;border-radius:10px;padding:7px 10px;margin:0 8px 6px;font-size:13.5px;flex:0 0 auto}
.hand{display:flex;justify-content:center;align-items:flex-end;padding:8px 4px 4px;height:132px;flex:0 0 auto;touch-action:none;position:relative}
.card{position:relative;width:74px;height:110px;margin:0 var(--m,-5px);flex:0 0 auto;border-radius:10px;border:2px solid #7a604c;background:linear-gradient(170deg,#f6ead0,#e6d3ae);color:var(--ink);padding:0;display:flex;flex-direction:column;align-items:center;overflow:hidden;transition:transform .14s,box-shadow .14s,opacity .2s;box-shadow:0 3px 6px rgba(0,0,0,.4)}
.card.taut{border-color:#c98a22}
.card.weave{border-color:#5262b8}
.card.status{background:linear-gradient(170deg,#6a5a4e,#4b3e35);color:var(--cream);border-color:#2a201a}
.card.sel{transform:translateY(-18px) scale(1.06);z-index:5;box-shadow:0 10px 18px rgba(0,0,0,.55),0 0 0 3px var(--saffron2)}
.card.cant{opacity:.55}
.card.drag{transition:none;z-index:20;pointer-events:none}
.card.up .cname{color:#2f7a3a}
.card .cost{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--indigo);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff3d9;z-index:2}
.card.taut .cost{background:#b9771a}
.card .cname{font-size:11px;font-weight:800;line-height:1.05;padding:5px 3px 0 27px;width:100%;text-align:left;min-height:28px}
.card .cart{width:62px;height:38px;border-radius:6px;background:#e9d9b6;overflow:hidden;flex:0 0 auto}
.card .cart svg{width:100%;height:100%}
.card .cfx{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;padding:3px 2px 0;font-size:11px;font-weight:800}
.fxc{display:inline-flex;align-items:center;gap:1px;padding:0 3px;border-radius:5px;background:rgba(0,0,0,.08)}
.fxc svg{width:11px;height:11px}
.fxc.d{color:#9e2a20}.fxc.b{color:#2b3a8f}.fxc.t{color:#8a5a00}.fxc.w{color:#3b4fb0}.fxc.o{color:#4a3a2e}
.bottom{display:flex;align-items:center;gap:8px;padding:6px 10px calc(8px + env(safe-area-inset-bottom));flex:0 0 auto}
.energy{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8fa0ff,#3a4796);border:3px solid #c8d0ff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff;box-shadow:0 0 12px rgba(111,127,214,.5)}
.energy.zero{filter:grayscale(.8);box-shadow:none}
.pile{font-size:12px;color:var(--muted);text-align:center;line-height:1.1;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px;min-width:48px;min-height:40px}
.pile b{display:block;color:var(--cream);font-size:15px}
.endbtn{margin-left:auto;min-width:118px}
.endbtn.nudge{animation:pulse 1.1s infinite}
/* overlays */
.sheet{position:absolute;inset:0;background:rgba(18,12,9,.82);display:flex;flex-direction:column;z-index:50;padding:14px 12px;overflow-y:auto;backdrop-filter:blur(2px)}
.sheet h2{margin:4px 0 8px;font-size:24px}
.cardgrid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.bigcard{width:min(150px,calc((100vw - 52px)/3));min-height:200px;border-radius:14px;border:2px solid #7a604c;background:linear-gradient(170deg,#f6ead0,#e6d3ae);color:var(--ink);padding:8px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.bigcard.taut{border-color:#c98a22}.bigcard.weave{border-color:#5262b8}
.bigcard .bn{font-weight:800;font-size:15px}
.bigcard .bt{font-size:12.5px;line-height:1.3}
.bigcard .bmeta{font-size:11px;color:#6a5444;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.bigcard .cart{width:88%;height:62px;border-radius:8px;background:#e9d9b6;overflow:hidden}
.bigcard .cart svg{width:100%;height:100%}
.bigcard.pick{cursor:pointer;transition:transform .12s}
.bigcard.pick:active{transform:scale(.97)}
.bigcard.sold{opacity:.4}
.price{font-weight:900;color:#7a5211}
.list{display:flex;flex-direction:column;gap:8px;max-width:420px;margin:0 auto;width:100%}
.opt{display:block;text-align:left;width:100%}
.opt small{display:block;color:var(--muted);font-weight:500;margin-top:2px}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.minicard{border-radius:9px;border:2px solid #7a604c;background:linear-gradient(170deg,#f6ead0,#e6d3ae);color:var(--ink);padding:6px;font-size:12px;font-weight:800;text-align:left;min-height:52px}
.minicard small{display:block;font-weight:500;font-size:11px;color:#5a4636;line-height:1.2;margin-top:2px}
.minicard.taut{border-color:#c98a22}.minicard.weave{border-color:#5262b8}
.minicard.up{box-shadow:inset 0 0 0 2px #6fae6a}
.recap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;max-width:420px;margin:0 auto;width:100%}
.recap li{margin:3px 0}
.big{font-size:34px;font-weight:900}
/* fx */
.fxlayer{position:absolute;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.float{position:absolute;font-weight:900;font-size:22px;text-shadow:0 2px 0 #000,0 0 6px #000;animation:floatup .9s ease-out forwards;white-space:nowrap}
.float.d{color:#ffb4a8}.float.b{color:#b9c4ff}.float.h{color:#c4f0a0}.float.t{color:#ffd27a;font-size:17px}.float.s{color:#fff;font-size:28px;letter-spacing:.05em}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.7);opacity:0}15%{transform:translate(-50%,-8px) scale(1.15);opacity:1}100%{transform:translate(-50%,-56px) scale(1);opacity:0}}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.lunge{animation:lunge .3s}
@keyframes lunge{50%{transform:translateY(14px) scale(1.08)}}
.flash{animation:flash .3s}
@keyframes flash{50%{filter:brightness(2.2) saturate(.3)}}
.scrshake{animation:shake .4s}
.dbg{position:absolute;right:6px;bottom:70px;z-index:70;max-width:300px;max-height:50%;overflow:auto;background:rgba(0,0,0,.85);color:#9f9;font:11px/1.3 ui-monospace,Menlo,monospace;padding:8px;border-radius:8px;white-space:pre-wrap}
.top .narrow{display:none}
@media (max-width:380px){ .card{width:68px;height:104px;margin:0 var(--m,-6px)} .top{gap:6px} .hpbar{width:50px} .top .wide{display:none} .top .narrow{display:inline} .card .cart{width:56px;height:34px} .sprite{width:74px;height:74px} .logo{font-size:38px} }
@media (min-height:760px){ .hand{height:142px} .enemies{min-height:190px} .sprite{width:96px;height:96px} }
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01s!important;transition-duration:.01s!important} }

/* R2 juice */
.hpbar,.ehp{position:relative}
.hpbar i,.ehp i{position:relative;z-index:1}
.gh{position:absolute;left:0;top:0;bottom:0;background:#f3d9a6;opacity:.75;transition:width .6s ease-in;z-index:0}
.hp.low svg{animation:pulse .8s infinite}
.float.big{font-size:32px;color:#ffe08a}
.enemy.dying .sprite{animation:flash .35s 2}
.tg.near i.on{box-shadow:0 0 8px #ffb04a;animation:pulse .7s infinite}
.flycard{position:absolute;z-index:60;pointer-events:none;transition:transform .28s cubic-bezier(.3,.7,.4,1),opacity .28s;will-change:transform}
.card .cname.long{font-size:9.5px;letter-spacing:-.02em;overflow-wrap:anywhere}
.bigcard .bmeta{line-height:1.25}
.rar.uncommon{color:#2f7a3a}.rar.rare{color:#a3361f}

</style></head>

  // ---------- map ----------
  var NODE_W = { F: 46, E: 16, R: 12, M: 12, S: 14 };
  function makeMap(seed) {
    var s = { s: hash(seed, 'map') };
    var nodes = {}, R = CONFIG.ROWS, C = CONFIG.COLS;
    function key(r, c) { return r + '-' + c; }
    function node(r, c) { var k = key(r, c); if (!nodes[k]) nodes[k] = { id: k, r: r, c: c, type: null, next: [] }; return nodes[k]; }
    var starts = shuffle(s, [0, 1, 2, 3]).slice(0, CONFIG.PATHS);
    for (var p = 0; p < CONFIG.PATHS; p++) {
      var c = starts[p];
      for (var r = 0; r < R; r++) {
        var n = node(r, c);
        if (r < R - 1) {
          var nc = Math.max(0, Math.min(C - 1, c + rint(s, -1, 1)));
          var m = node(r + 1, nc);
          if (n.next.indexOf(m.id) < 0) n.next.push(m.id);

    var list = Object.keys(nodes).map(function (k) { return nodes[k]; }).filter(function (n) { return n.id !== 'boss'; });
    list.sort(function (a, b) { return a.r - b.r || a.c - b.c; });

    list.forEach(function (n) { n.next.forEach(function (m) { (parents[m] = parents[m] || []).push(n.id); }); });

      ev.push({ e: 'draw', uid: card.uid });
    }
  }

  function startTurn(st, ev) {
    var c = st.combat;
    c.turn++; st.stats.turns++;
    c.block = Math.min(c.block, c.weave);
    if (c.turn > 1 && c.weave > 0 && CONFIG.WEAVE_FRAY) { var wf = Math.min(c.weave, CONFIG.WEAVE_FRAY); c.weave -= wf; ev.push({ e: 'weave', n: -wf }); }
    c.energy = CONFIG.ENERGY + (hasCharm(st, 'sand') && c.turn % 3 === 0 ? 1 : 0);
    c.plays = 0;
    ev.push({ e: 'turn', n: c.turn });
    if (c.powers.felting) { c.weave += c.powers.felting; ev.push({ e: 'weave', n: c.powers.felting }); }
    if (c.powers.hem) { c.block += c.powers.hem; ev.push({ e: 'block', who: 'p', n: c.powers.hem }); }
    if (c.powers.windup) addTension(st, ev, c.powers.windup);
    if (st.phase !== 'combat') return;
    drawCards(st, ev, CONFIG.HAND + (c.turn === 1 && hasCharm(st, 'shuttle2') ? 2 : 0));
  }

  function hurtPlayer(st, ev, amt, src, pierce) {
    var c = st.combat;
    if (amt <= 0) return;
    var blocked = 0;
    if (!pierce) { blocked = Math.min(c.block, amt); c.block -= blocked; }
    var dmg = amt - blocked;
    st.hp -= dmg; st.stats.taken += dmg;
    ev.push({ e: 'hurt', n: dmg, blocked: blocked, src: src });
    if (st.hp <= 0) {
      st.hp = 0;
      if (st.phase === 'combat') endRun(st, ev, false, src);
    }
  }

  function addTension(st, ev, n) {
    var c = st.combat;
    if (!c || st.phase !== 'combat') return;
    c.T += n;
    ev.push({ e: 'tension', n: n, T: Math.min(c.T, CONFIG.T_MAX) });
    while (c.T >= CONFIG.T_MAX && st.phase === 'combat') {
      c.T = CONFIG.SNAP_RESET;
      st.stats.snaps++;
      ev.push({ e: 'snap', T: c.T });
      if (hasCharm(st, 'thimble')) { c.block += 5; ev.push({ e: 'block', who: 'p', n: 5 }); }
      var dmgv = CONFIG.SNAP_HIT + (c.powers.snapback || 0);
      c.enemies.forEach(function (e, i) { if (e.hp > 0) hitEnemy(st, ev, i, dmgv, false, 'a snap'); });
      if (checkWin(st, ev)) return;
      if (!c.powers.snapback) hurtPlayer(st, ev, CONFIG.SNAP_DMG, { name: 'your own snapped thread' }, true);
    }
  }

  function hitEnemy(st, ev, i, base, isAttack, srcName) {
    var c = st.combat, e = c.enemies[i];
    if (!e || e.hp <= 0) return 0;
    var d = base + (isAttack ? c.temper : 0);
    if (isAttack && c.dull > 0) d = Math.floor(d * CONFIG.DULL_MULT);
    if (e.brittle > 0) d = Math.floor(d * CONFIG.BRITTLE_MULT);
    d = Math.max(0, d);
    var ab = Math.min(e.block, d); e.block -= ab;
    var net = d - ab;
    e.hp -= net; st.stats.dealt += net;
    if (net > st.stats.biggest) { st.stats.biggest = net; st.stats.biggestCard = srcName || null; }
    ev.push({ e: 'hit', i: i, n: net, blocked: ab });
    if (e.hp <= 0) { e.hp = 0; e.block = 0; st.stats.kills++; ev.push({ e: 'kill', i: i, name: e.name }); }
    else if (ENEMIES[e.key].phase2 && e.phase === 1 && e.hp <= e.maxHp * ENEMIES[e.key].phase2.at) {
      e.phase = 2; e.hist = []; e.cyc = 0;
      var p2 = ENEMIES[e.key].phase2;
      ev.push({ e: 'phase', i: i, name: p2.name });
      runEnemyFx(st, ev, i, p2.fx, p2.name);
      chooseIntent(st, i);
    }
    return net;
  }

  function gainBlock(st, ev, n, fromCard) {
    var c = st.combat;
    c.block += n; ev.push({ e: 'block', who: 'p', n: n });
    if (fromCard && c.powers.barbed) {
      var al = []; c.enemies.forEach(function (e, i) { if (e.hp > 0) al.push(i); });
      if (al.length) { var t = al[rint(c.rng, 0, al.length - 1)]; hitEnemy(st, ev, t, c.powers.barbed, false, 'Barbed Weft'); }
    }
  }

  function checkWin(st, ev) {
    var c = st.combat;
    if (st.phase !== 'combat') return true;
    if (alive(c).length) return false;
    winCombat(st, ev);
    return true;
  }

  function runCardFx(st, ev, card, target) {
    var c = st.combat, fx = cardFx(card), name = CARDS[card.id].name;
    for (var k = 0; k < fx.length; k++) {
      if (st.phase !== 'combat') return;
      var f = fx[k];
      var tgt = target;
      if (TARGETED[f[0]] && (tgt === null || tgt === undefined || !c.enemies[tgt] || c.enemies[tgt].hp <= 0)) {
        var al = alive(c); tgt = al.length ? c.enemies.indexOf(al[0]) : -1;
      }
      switch (f[0]) {
        case 'dmg': hitEnemy(st, ev, tgt, f[1], true, name); break;
        case 'hits': for (var h = 0; h < f[2]; h++) hitEnemy(st, ev, tgt, f[1], true, name); break;
        case 'dmgT': hitEnemy(st, ev, tgt, f[1] + f[2] * c.T, true, name); break;
        case 'whip': var n = whipHits(f[2], c.T); for (var w = 0; w < n; w++) hitEnemy(st, ev, tgt, f[1], true, name); break;
        case 'dmgBlock': hitEnemy(st, ev, tgt, c.block, true, name); break;
        case 'dmgAll': c.enemies.forEach(function (e, i) { if (e.hp > 0) hitEnemy(st, ev, i, f[1], true, name); }); break;
        case 'release':
          var spent = c.T; c.T = 0; ev.push({ e: 'tension', n: -spent, T: 0 });
          c.enemies.forEach(function (e, i) { if (e.hp > 0) hitEnemy(st, ev, i, f[1] * spent, true, name); });
          break;
        case 'heavy': hitEnemy(st, ev, tgt, f[1], true, name); if (c.block >= f[2]) hitEnemy(st, ev, tgt, f[1], true, name); break;
        case 'block': gainBlock(st, ev, f[1], true); break;
        case 'blockT': gainBlock(st, ev, f[1] + f[2] * c.T, true); break;
        case 'weave': c.weave += f[1]; ev.push({ e: 'weave', n: f[1] }); break;
        case 'tense': addTension(st, ev, f[1]); break;
        case 'slack': var sl = Math.min(c.T, f[1]); c.T -= sl; ev.push({ e: 'tension', n: -sl, T: c.T }); break;
        case 'loosen': var sp = Math.min(c.T, f[2]); c.T -= sp; ev.push({ e: 'tension', n: -sp, T: c.T }); if (sp > 0) gainBlock(st, ev, sp * f[1], true); break;
        case 'draw': drawCards(st, ev, f[1]); break;
        case 'energy': c.energy += f[1]; ev.push({ e: 'energy', n: f[1] }); break;
        case 'brittle': if (tgt >= 0) { c.enemies[tgt].brittle += f[1]; ev.push({ e: 'status', i: tgt, k: 'brittle', n: f[1] }); } break;
        case 'dull': if (tgt >= 0) { c.enemies[tgt].dull += f[1]; ev.push({ e: 'status', i: tgt, k: 'dull', n: f[1] }); } break;
        case 'double': gainBlock(st, ev, c.block, true); break;
        case 'heal': var hl = Math.min(f[1], st.maxHp - st.hp); st.hp += hl; ev.push({ e: 'heal', n: hl }); break;
        case 'power': c.powers[f[1]] = (c.powers[f[1]] || 0) + f[2]; ev.push({ e: 'power', k: f[1] }); break;
      }
      if (checkWin(st, ev)) return;
    }
  }

  function canPlay(st, card) {
    var c = st.combat;
    if (!c || st.phase !== 'combat') return false;
    var d = CARDS[card.id];
    if (d.unplayable) return false;
    if (c.plays >= CONFIG.PLAY_CAP) return false;
    return cardCost(card) <= c.energy;
  }

  function playCard(st, ev, uid, target) {
    var c = st.combat;
    var hi = -1; for (var i = 0; i < c.hand.length; i++) if (c.hand[i].uid === uid) hi = i;
    if (hi < 0) return 'no such card';
    var card = c.hand[hi];
    if (!canPlay(st, card)) return 'cannot play';
    if (needsTarget(card)) {
      if (target === undefined || target === null || !c.enemies[target] || c.enemies[target].hp <= 0) {
        var al = alive(c); target = al.length ? c.enemies.indexOf(al[0]) : null;
      }
    }
    c.energy -= cardCost(card);
    c.hand.splice(hi, 1);
    c.plays++; st.stats.played++;
    ev.push({ e: 'play', uid: uid, id: card.id, target: target });
    var d = CARDS[card.id];
    if (d.type === 'power') c.exhaust.push(card);
    else if (d.exhaust) { c.exhaust.push(card); ev.push({ e: 'exhaust', uid: uid }); }
    else c.discard.push(card);
    runCardFx(st, ev, card, target);
    return null;
  }

  function runEnemyFx(st, ev, i, fx, moveName) {
    var c = st.combat, e = c.enemies[i];
    for (var k = 0; k < fx.length; k++) {
      if (st.phase !== 'combat' || e.hp <= 0) return;
      var f = fx[k];
      switch (f[0]) {
        case 'atk':
          var times = f[2] || 1;
          for (var t = 0; t < times; t++) {
            var v = f[1] + e.str;
            if (e.dull > 0) v = Math.floor(v * CONFIG.DULL_MULT);
            if (c.brittle > 0) v = Math.floor(v * CONFIG.BRITTLE_MULT);
            ev.push({ e: 'enemyAtk', i: i });
            hurtPlayer(st, ev, Math.max(0, v), { name: e.name, move: moveName }, false);
            if (st.phase !== 'combat') return;
          }
          break;
        case 'block': e.block += f[1]; ev.push({ e: 'block', who: i, n: f[1] }); break;
        case 'str': e.str += f[1]; ev.push({ e: 'status', i: i, k: 'str', n: f[1] }); break;
        case 'strAll': c.enemies.forEach(function (o, j) { if (o.hp > 0) { o.str += f[1]; ev.push({ e: 'status', i: j, k: 'str', n: f[1] }); } }); break;
        case 'heal': var hl = Math.min(f[1], e.maxHp - e.hp); e.hp += hl; ev.push({ e: 'eheal', i: i, n: hl }); break;
        case 'dull': c.dull += f[1]; ev.push({ e: 'pstatus', k: 'dull', n: f[1] }); break;
        case 'brittle': c.brittle += f[1]; ev.push({ e: 'pstatus', k: 'brittle', n: f[1] }); break;
        case 'knot': for (var q = 0; q < f[1]; q++) c.discard.push({ uid: st.uid++, id: 'knot', up: 0, temp: 1 }); ev.push({ e: 'knot', n: f[1] }); break;
        case 'tense': addTension(st, ev, f[1]); break;
        case 'slackP': var sl = Math.min(c.T, f[1]); c.T -= sl; ev.push({ e: 'tension', n: -sl, T: c.T }); break;
      }
    }
  }

  function endTurn(st, ev) {
    var c = st.combat;
    // knots in hand pull the thread tighter
    var knots = c.hand.filter(function (x) { return x.id === 'knot'; }).length;
    if (knots) addTension(st, ev, knots * CONFIG.KNOT_TENSION);
    if (st.phase !== 'combat') return;
    c.discard = c.discard.concat(c.hand); c.hand = [];
    var slack = CONFIG.SLACK + (hasCharm(st, 'linen') ? 1 : 0);
    var s2 = Math.min(c.T, slack); c.T -= s2; ev.push({ e: 'tension', n: -s2, T: c.T });
    if (c.dull > 0) c.dull--; if (c.brittle > 0) c.brittle--;
    ev.push({ e: 'enemyTurn' });
    for (var i = 0; i < c.enemies.length; i++) {
      var e = c.enemies[i];
      if (e.hp <= 0) continue;
      e.block = 0;
      ev.push({ e: 'enemyMove', i: i, name: e.intent.name });
      runEnemyFx(st, ev, i, e.intent.fx, e.intent.name);
      if (st.phase !== 'combat') return;
      e.hist.push(e.mi);
    }
    c.enemies.forEach(function (e, i) {
      if (e.hp <= 0) return;
      if (e.dull > 0) e.dull--; if (e.brittle > 0) e.brittle--;
      chooseIntent(st, i);
    });
    startTurn(st, ev);
  }

  function cardReward(st, key, oddsKey, n) {
    var rs = { s: hash(st.seed, key, 'cards') };
    var pool = Object.keys(CARDS).filter(function (k) { var r = CARDS[k].rarity; return r === 'common' || r === 'uncommon' || r === 'rare'; });
    var out = [], guard = 0;
    while (out.length < n && guard++ < 100) {
      var rar = pickW(rs, ['common', 'uncommon', 'rare'], CONFIG.ODDS[oddsKey]);
      var opts = pool.filter(function (k) { return CARDS[k].rarity === rar && out.indexOf(k) < 0; });
      if (opts.length) out.push(opts[rint(rs, 0, opts.length - 1)]);
    }
    return out;
  }
  function randomCharm(st, key) {
    var rs = { s: hash(st.seed, key, 'charm') };
    var opts = CHARM_POOL.filter(function (k) { return st.charms.indexOf(k) < 0; });
    if (!opts.length) return null;
    return opts[rint(rs, 0, opts.length - 1)];
  }
  function gainCharm(st, ev, k) {
    if (!k || st.charms.indexOf(k) >= 0) return;
    st.charms.push(k); ev.push({ e: 'charm', k: k });
    if (k === 'spool') { st.maxHp += 10; st.hp += 10; }
  }

  function winCombat(st, ev) {
    var c = st.combat;
    st.stats.fights++;
    if (c.kind === 'elite') st.stats.elites++;
    st.log.push({ t: 'fight', row: st.map.nodes[c.node].r, kind: c.kind, names: c.enemies.map(function (e) { return e.name; }), turns: c.turn, hpLost: Math.max(0, c.hpStart - st.hp) });
    ev.push({ e: 'win', kind: c.kind });
    if (c.kind === 'boss') { st.combat = null; endRun(st, ev, true, null); return; }
    var heal = hasCharm(st, 'teacup') ? Math.min(4, st.maxHp - st.hp) : 0; st.hp += heal;
    var key = c.node;
    var gs = { s: hash(st.seed, key, 'gold') };
    var g = c.kind === 'elite' ? rint(gs, CONFIG.GOLD_ELITE[0], CONFIG.GOLD_ELITE[1]) : rint(gs, CONFIG.GOLD_FIGHT[0], CONFIG.GOLD_FIGHT[1]);
    if (hasCharm(st, 'purse')) g += 8;
    st.gold += g;
    var charm = c.kind === 'elite' ? randomCharm(st, key) : null;
    if (charm) gainCharm(st, ev, charm);
    st.reward = { gold: g, heal: heal, cards: cardReward(st, key, c.kind === 'elite' ? 'elite' : 'normal', 3), charm: charm };
    st.combat = null;
    st.phase = 'reward';
  }

  function computeScore(st, won) {
    var S = CONFIG.SCORE;
    return st.stats.rows * S.row + st.stats.kills * S.kill + (won ? S.win + st.hp * S.hpOnWin : 0) + Math.floor(st.gold / S.goldDiv);
  }

  function endRun(st, ev, won, src) {
    st.phase = won ? 'victory' : 'defeat';
    if (won) st.stats.rows = CONFIG.ROWS + 1;
    st.score = computeScore(st, won);
    st.end = { won: won, by: src ? { name: src.name, move: src.move || null } : null, row: st.pos ? st.map.nodes[st.pos].r : 0 };
    st.log.push({ t: won ? 'won' : 'lost', by: st.end.by });
    st.combat = st.combat || null;
    ev.push({ e: won ? 'victory' : 'defeat' });
  }

  function upgradeable(st) { return st.deck.filter(function (x) { var d = CARDS[x.id]; return !x.up && d.up; }); }

  function enterNode(st, ev, id) {
    var n = st.map.nodes[id];
    st.pos = id; st.visited.push(id);
    if (n.r > 0 || n.type === 'B') st.stats.rows = Math.max(st.stats.rows, n.r);
    ev.push({ e: 'enter', id: id, type: n.type });
    if (n.type === 'F' || n.type === 'E' || n.type === 'B') startCombat(st, ev, n);
    else if (n.type === 'R') { st.phase = 'rest'; st.rest = { done: false }; }
    else if (n.type === 'M') {
      var cards = cardReward(st, id, 'market', 4);
      st.market = { cards: cards.map(function (k) { return { id: k, price: CONFIG.PRICE[CARDS[k].rarity], sold: false }; }),
        charm: randomCharm(st, id), charmSold: false, chipPrice: CONFIG.PRICE.chip + CONFIG.PRICE.chipStep * st.chipCount, chipUsed: false };
      st.phase = 'market';
    } else if (n.type === 'S') {
      var keys = Object.keys(SHRINES);
      st.shrine = { key: keys[hash(st.seed, id, 'shrine') % keys.length], done: false };
      st.phase = 'shrine';
    }
  }

  function findDeck(st, uid) { for (var i = 0; i < st.deck.length; i++) if (st.deck[i].uid === uid) return i; return -1; }

  function runShrineFx(st, ev, fx, uid) {
    for (var i = 0; i < fx.length; i++) {
      var f = fx[i];
      switch (f[0]) {
        case 'hurt': st.hp = Math.max(1, st.hp - f[1]); ev.push({ e: 'hurt', n: f[1], blocked: 0 }); break;
        case 'heal': var h = Math.min(f[1], st.maxHp - st.hp); st.hp += h; ev.push({ e: 'heal', n: h }); break;
        case 'gold': st.gold += f[1]; ev.push({ e: 'gold', n: f[1] }); break;
        case 'maxHp': st.maxHp = Math.max(10, st.maxHp + f[1]); st.hp = Math.min(st.hp, st.maxHp); break;
        case 'rareCard':
          var rs = { s: hash(st.seed, st.pos, 'rare') };
          var rares = Object.keys(CARDS).filter(function (k) { return CARDS[k].rarity === 'rare'; });
          var k = rares[rint(rs, 0, rares.length - 1)];
          st.deck.push({ uid: st.uid++, id: k, up: 0 }); ev.push({ e: 'addCard', id: k }); break;
        case 'charm': gainCharm(st, ev, randomCharm(st, st.pos)); break;
        case 'upRandom':
          var rs2 = { s: hash(st.seed, st.pos, 'up') };
          var ups = shuffle(rs2, upgradeable(st)).slice(0, f[1]);
          ups.forEach(function (x) { x.up = 1; ev.push({ e: 'upgrade', uid: x.uid }); }); break;
        case 'mend': var mi = findDeck(st, uid); if (mi >= 0 && !st.deck[mi].up && CARDS[st.deck[mi].id].up) { st.deck[mi].up = 1; ev.push({ e: 'upgrade', uid: uid }); } break;
        case 'chip': var ci = findDeck(st, uid); if (ci >= 0 && st.deck.length > 1) { ev.push({ e: 'chip', id: st.deck[ci].id }); st.deck.splice(ci, 1); } break;
      }
    }
  }

  // ---------- the single command boundary ----------
  function apply(state, cmd) {
    var st = clone(state), ev = [];
    var err = applyMut(st, ev, cmd);
    return { state: st, events: ev, error: err };
  }

  function applyMut(st, ev, cmd) {
    if (!cmd || !cmd.t) return 'bad command';
    switch (cmd.t) {
      case 'pick': {
        if (st.phase !== 'map') return 'not on map';
        if (reachable(st).indexOf(cmd.id) < 0) return 'unreachable';
        enterNode(st, ev, cmd.id); return null;
      }
      case 'play': {
        if (st.phase !== 'combat') return 'not in combat';
        return playCard(st, ev, cmd.uid, cmd.target);
      }
      case 'end': {
        if (st.phase !== 'combat') return 'not in combat';
        endTurn(st, ev); return null;
      }
      case 'reward': {
        if (st.phase !== 'reward') return 'no reward';
        var R = st.reward;
        if (cmd.kind === 'card') {
          if (R.cards.indexOf(cmd.id) < 0) return 'not offered';
          st.deck.push({ uid: st.uid++, id: cmd.id, up: 0 }); ev.push({ e: 'addCard', id: cmd.id });
        } else if (cmd.kind === 'chip') {
          var i = findDeck(st, cmd.uid); if (i < 0 || st.deck.length <= 1) return 'bad chip';
          ev.push({ e: 'chip', id: st.deck[i].id }); st.deck.splice(i, 1);
        } else if (cmd.kind !== 'skip') return 'bad reward';
        st.reward = null; st.phase = 'map'; return null;
      }
      case 'rest': {
        if (st.phase !== 'rest') return 'not resting';
        if (cmd.kind === 'heal') { var h = Math.min(Math.round(st.maxHp * CONFIG.REST_HEAL), st.maxHp - st.hp); st.hp += h; ev.push({ e: 'heal', n: h }); }
        else if (cmd.kind === 'mend') {
          var j = findDeck(st, cmd.uid); if (j < 0 || st.deck[j].up || !CARDS[st.deck[j].id].up) return 'cannot mend';
          st.deck[j].up = 1; ev.push({ e: 'upgrade', uid: cmd.uid });
        } else return 'bad rest';
        st.rest = null; st.phase = 'map'; return null;
      }
      case 'buy': {
        if (st.phase !== 'market') return 'not in market';
        var M = st.market;
        if (cmd.kind === 'card') {
          var it = M.cards[cmd.slot]; if (!it || it.sold || st.gold < it.price) return 'cannot buy';
          st.gold -= it.price; it.sold = true; st.deck.push({ uid: st.uid++, id: it.id, up: 0 }); ev.push({ e: 'addCard', id: it.id });
        } else if (cmd.kind === 'charm') {
          if (!M.charm || M.charmSold || st.gold < CONFIG.PRICE.relic) return 'cannot buy';
          st.gold -= CONFIG.PRICE.relic; M.charmSold = true; gainCharm(st, ev, M.charm);
        } else if (cmd.kind === 'chip') {
          var k = findDeck(st, cmd.uid);
          if (M.chipUsed || k < 0 || st.gold < M.chipPrice || st.deck.length <= 1) return 'cannot chip';
          st.gold -= M.chipPrice; M.chipUsed = true; st.chipCount++; ev.push({ e: 'chip', id: st.deck[k].id }); st.deck.splice(k, 1);
        } else return 'bad buy';
        return null;
      }
      case 'leave': {
        if (st.phase !== 'market') return 'not in market';
        st.market = null; st.phase = 'map'; return null;
      }
      case 'shrine': {
        if (st.phase !== 'shrine') return 'no shrine';
        var S = SHRINES[st.shrine.key], o = S.opts[cmd.opt];
        if (!o) return 'bad option';
        if (o.need && st.gold < o.need) return 'not enough gold';
        var needsCard = o.fx.some(function (f) { return f[0] === 'mend' || f[0] === 'chip'; });
        if (needsCard) {
          var di = findDeck(st, cmd.uid); if (di < 0) return 'pick a card';

  }
  function topBar() {
    var row = S.pos ? S.map.nodes[S.pos].r + 1 : 0;

    return '<div class="top">' + hpBar() + '<span class="chip" aria-label="Gold">' + I.gold + S.gold + '</span>' +
      '<span class="chip muted" title="Terrace">' + rowTxt + '</span>' +
      '<span class="grow"></span><button class="iconbtn" data-act="deck" aria-label="View deck, ' + S.deck.length + ' cards">' + I.deck + '<span>' + S.deck.length + '</span></button>' +
      '<button class="iconbtn" data-act="menu" aria-label="Menu">≡</button></div>';
  }
  function fxChips(card, ctx) {
    var out = [], fxl = Rules.cardFx(card), tmp = ctx ? ctx.temper || 0 : 0;
    function dm(n) { var v = n + tmp; if (ctx && ctx.dull) v = Math.floor(v * CONFIG.DULL_MULT); return v; }
    fxl.forEach(function (f) {
      switch (f[0]) {
        case 'dmg': out.push(['d', I.atk, dm(f[1])]); break;
        case 'hits': out.push(['d', I.atk, dm(f[1]) + '×' + f[2]]); break;
        case 'dmgT': out.push(['d', I.atk, ctx ? dm(f[1] + f[2] * ctx.T) : f[1] + '+' + (f[2] > 1 ? f[2] : '') + 'T']); break;
        case 'whip': out.push(['d', I.atk, dm(f[1]) + '×' + (ctx ? Rules.whipHits(f[2], ctx.T) : 'T')]); break;
        case 'dmgBlock': out.push(['d', I.atk, ctx ? dm(ctx.block) : '=' ]); out.push(['b', I.block, '']); break;
        case 'dmgAll': out.push(['d', I.atk, 'all ' + dm(f[1])]); break;
        case 'release': out.push(['d', I.atk, 'all ' + (ctx ? dm(f[1] * ctx.T) : f[1] + '×T')]); break;
        case 'heavy': out.push(['d', I.atk, dm(f[1]) + (ctx && ctx.block >= f[2] ? '×2' : '')]); break;
        case 'block': out.push(['b', I.block, f[1]]); break;
        case 'blockT': out.push(['b', I.block, ctx ? f[1] + f[2] * ctx.T : f[1] + '+T']); break;
        case 'weave': out.push(['w', I.weave, f[1]]); break;
        case 'tense': out.push(['t', I.tension, '+' + f[1]]); break;
        case 'slack': out.push(['t', I.tension, '−' + f[1]]); break;
        case 'loosen': out.push(['t', I.tension, '→']); out.push(['b', I.block, f[1] + '/T']); break;
        case 'draw': out.push(['o', I.draw, f[1]]); break;
        case 'energy': out.push(['o', I.energy, '+' + f[1]]); break;
        case 'brittle': out.push(['o', I.debuff, 'Brt ' + f[1]]); break;
        case 'dull': out.push(['o', I.debuff, 'Dul ' + f[1]]); break;
        case 'double': out.push(['b', I.block, '×2']); break;
        case 'heal': out.push(['h', I.heal, f[1]]); break;
        case 'power': out.push(['o', I.buff, 'Power']); break;
      }
    });
    if (C[card.id].unplayable) out.push(['o', I.knot, 'Knot']);
    return out.map(function (x) { return '<span class="fxc ' + x[0] + '">' + x[1] + x[2] + '</span>'; }).join('');
  }
  function ctxNow() { var c = S && S.combat; return c ? { T: c.T, temper: c.temper, block: c.block, dull: c.dull > 0 } : null; }
  function cardName(c) { return C[c.id].name + (c.up ? '+' : ''); }
  function costText(c) { var k = Rules.cardCost(c); return k < 0 ? '' : k; }
  function handCard(c, i) {
    var d = C[c.id], can = Rules.canPlay(S, c), sel = ui.sel === c.uid;
    return '<button class="card ' + d.plan + (d.type === 'status' ? ' status' : '') + (c.up ? ' up' : '') + (sel ? ' sel' : '') + (can ? '' : ' cant') + '" data-card="' + c.uid + '" aria-label="' + esc(cardName(c) + ', cost ' + costText(c) + '. ' + Rules.describe(c, ctxNow())) + '" style="z-index:' + (sel ? 9 : i + 1) + '">' +
      (d.type === 'status' ? '' : '<span class="cost">' + costText(c) + '</span>') + '<span class="cname' + (cardName(c).length > 8 ? ' long' : '') + '">' + esc(cardName(c)) + '</span>' +
      '<span class="cart">' + ART.cardArt(c.id, d.plan) + '</span><span class="cfx">' + fxChips(c, ctxNow()) + '</span></button>';
  }
  function bigCard(id, up, extraCls, attrs, priceTxt) {
    var d = C[id], c = { id: id, up: up ? 1 : 0 };
    return '<div class="bigcard ' + d.plan + ' ' + (extraCls || '') + '" ' + (attrs || '') + '><div class="bmeta">' + (d.plan === 'taut' ? 'Taut ' : d.plan === 'weave' ? 'Weave ' : '') + d.type + (d.rarity === 'rare' || d.rarity === 'uncommon' ? '<br><span class="rar ' + d.rarity + '">' + d.rarity + '</span>' : '') + '</div>' +
      '<div class="bn">' + esc(d.name + (up ? '+' : '')) + ' <span class="price">(' + Rules.cardCost(c) + ')</span></div><div class="cart">' + ART.cardArt(id, d.plan) + '</div>' +
      '<div class="bt">' + esc(Rules.describe(c)) + '</div>' + (priceTxt ? '<div class="price">' + priceTxt + '</div>' : '') + '</div>';
  }
  function miniCard(c, attrs, preview) {
    var d = C[c.id], show = preview ? { id: c.id, up: 1 } : c;
    return '<button class="minicard ' + d.plan + (c.up ? ' up' : '') + '" ' + (attrs || '') + '>' + esc(cardName(show)) + ' <span class="muted">(' + costText(show) + ')</span><small>' + esc(Rules.describe(show)) + '</small></button>';
  }

  var KW = {
    Tension: 'Tension rises as you pull. At ' + CONFIG.T_MAX + ' the thread SNAPS: it lashes every enemy for ' + CONFIG.SNAP_HIT + ' and you for ' + CONFIG.SNAP_DMG + ' (through Block), then drops to ' + CONFIG.SNAP_RESET + '. Loses ' + CONFIG.SLACK + ' at the end of each turn.',
    Weave: 'At the start of your turn you keep up to your Weave in Block, instead of losing it all. Weave frays by 1 each turn.',
    Brittle: 'Takes 50% more damage. Drops by 1 each turn.',
    Dull: 'Deals 25% less attack damage. Drops by 1 each turn.',
    Knot: 'Unplayable clutter. If it is in your hand at end of turn, +' + CONFIG.KNOT_TENSION + ' Tension.',
    Exhaust: 'Removed for the rest of the fight.',
    Edge: 'Each point adds 1 damage to this enemy’s attacks.'
  };
  function keywordsFor(text) { return Object.keys(KW).filter(function (k) { return text.indexOf(k) >= 0; }); }

  function moveText(i) {
    var c = S.combat, e = c.enemies[i], parts = [], dmg = Rules.intentDamage(S, i), di = 0;
    e.intent.fx.forEach(function (f) {
      switch (f[0]) {
        case 'atk': var a = dmg[di++]; parts.push('attack ' + a.dmg + (a.times > 1 ? '×' + a.times : '')); break;
        case 'block': parts.push('block ' + f[1]); break;
        case 'str': parts.push('gain ' + f[1] + ' Edge'); break;
        case 'strAll': parts.push('all enemies gain ' + f[1] + ' Edge'); break;
        case 'dull': parts.push('make you Dull ' + f[1]); break;
        case 'brittle': parts.push('make you Brittle ' + f[1]); break;
        case 'knot': parts.push('add ' + f[1] + ' Knot' + (f[1] > 1 ? 's' : '') + ' to your discard'); break;
        case 'tense': parts.push('pull your thread +' + f[1] + ' Tension'); break;
        case 'slackP': parts.push('loosen your thread ' + f[1]); break;
        case 'heal': parts.push('heal ' + f[1]); break;
      }
    });
    return e.intent.name + ': ' + parts.join(', ') + '.';
  }
  function intentBubble(i) {
    var e = S.combat.enemies[i]; if (!e.intent) return '';
    var dmg = Rules.intentDamage(S, i), icons = '', di = 0, isAtk = false;
    e.intent.fx.forEach(function (f) {
      if (f[0] === 'atk') { var a = dmg[di++]; isAtk = true; icons += I.atk + a.dmg + (a.times > 1 ? '×' + a.times : ''); }
      else if (f[0] === 'block') icons += '<span style="color:#9fb0ff">' + I.block + '</span>';
      else if (f[0] === 'str' || f[0] === 'strAll' || f[0] === 'heal') icons += '<span style="color:#e9d36a">' + I.buff + '</span>';
      else if (f[0] === 'dull' || f[0] === 'brittle') icons += '<span style="color:#c4cf6a">' + I.debuff + '</span>';
      else if (f[0] === 'knot') icons += '<span style="color:#c3ae8e">' + I.knot + '</span>';

  // ---------- screens ----------
  function render() {
    var h;
    if (ui.view === 'title' || !S) h = renderTitle();
    else switch (S.phase) {
      case 'map': h = renderMap(); break;
      case 'combat': h = renderCombat(); break;
      case 'reward': h = renderReward(); break;
      case 'rest': h = renderRest(); break;
      case 'market': h = renderMarket(); break;
      case 'shrine': h = renderShrine(); break;
      default: h = renderEnd();
    }
    if (ui.sheet) h += renderSheet();
    if (DEBUG && ui.dbg) h += '<div class="dbg">' + esc(debugText()) + '</div>';
    if (DEBUG) h += '<button class="iconbtn" data-act="dbg" style="position:absolute;right:6px;bottom:6px;z-index:71">dbg</button>';
    app.innerHTML = h;
    app.appendChild(fx);
    afterRender();
  }

  function renderTitle() {
    var canCont = S && S.phase !== 'victory' && S.phase !== 'defeat';
    var dk = Rules.dailySeed().key, dBest = meta.daily[dk];
    return '<div class="scr title-scr"><div>' + ART.enemy('unraveler').replace('<svg', '<svg style="width:96px;height:96px"') + '</div>' +
      '<h1 class="logo title-font">Snap<b>thread</b></h1>' +
      '<p class="tag">Climb the dye terraces with a deck of cards. Pull your thread tight for big hits, but at 10 Tension it snaps.</p>' +
      (ui.notice ? '<div class="notice" role="alert">' + esc(ui.notice) + '</div>' : '') +
      (!Storage.ok ? '<div class="notice">This browser is blocking storage, so progress won’t be saved after you close the page.</div>' : '') +
      '<div class="menu">' + (canCont ? '<button class="btn primary" data-act="continue">Continue run (terrace ' + ((S.pos ? S.map.nodes[S.pos].r : 0) + 1) + ')</button>' : '') +
      '<button class="btn ' + (canCont ? '' : 'primary') + '" data-act="new">New run</button>' +
      '<button class="btn gold" data-act="daily">Daily thread · ' + dk + '</button>' +
      '<button class="btn ghost" data-act="howto">How to play</button>' +
      '<button class="btn ghost small" data-act="sound">Sound: ' + (meta.sound ? 'on' : 'off') + '</button></div>' +
      '<div class="stats">Best score ' + meta.best + ' · Wins ' + meta.wins + ' · Runs ' + meta.runs + (dBest !== undefined ? ' · Today’s daily best ' + dBest : '') + (meta.unlock.dyer ? ' · The Dyer unlocked' : ' · Win once to unlock a second weaver') + '</div></div>';

  function nodeIcon(t) { return I[t] || I.F; }

      info = '<div class="grow"><b>' + esc(cardName(selCard)) + '</b> (' + costText(selCard) + ') ' + esc(txt) + '<span class="muted">' + why + '</span>' + (kws.length ? '<div class="small muted">' + kws.map(function (k3) { return '<b>' + k3 + ':</b> ' + KW[k3]; }).join(' ') + '</div>' : '') + '</div>';

    return '<div class="scr" id="scr">' + topBar() + '<div class="arena"><div class="enemies">' + en + '</div>' +

      '<div class="hand" id="hand" style="--m:' + handMargin(c.hand.length) + 'px">' + c.hand.map(handCard).join('') + (c.hand.length ? '' : '<div class="muted small" style="align-self:center">No cards in hand.</div>') + '</div>' +
      '<div class="bottom"><div class="energy' + (c.energy ? '' : ' zero') + '" aria-label="Energy ' + c.energy + '">' + c.energy + '</div>' +
      '<button class="pile" data-act="pile" data-pile="draw">Draw<b>' + c.draw.length + '</b></button><button class="pile" data-act="pile" data-pile="discard">Discard<b>' + c.discard.length + '</b></button>' +
      '<button class="btn primary endbtn' + (!anyPlayable ? ' nudge' : '') + '" data-act="end">End turn</button></div></div></div>';
  }

  }

    var pk = t.closest('[data-pickuid]'); if (pk) { onPick(+pk.getAttribute('data-pickuid')); return; }
    var by = t.closest('[data-buy]'); if (by) { dispatch({ t: 'buy', kind: 'card', slot: +by.getAttribute('data-buy') }); return; }
    var sh = t.closest('[data-shrine]'); if (sh && !sh.disabled) {
      var oi = +sh.getAttribute('data-shrine'), o = DATA.SHRINES[S.shrine.key].opts[oi];
      var need = o.fx.filter(function (f) { return f[0] === 'mend' || f[0] === 'chip'; })[0];

      return;
    }
    var ch = t.closest('[data-char]'); if (ch && !ch.disabled) { ui.sheet = null; startNewRun({ char: ch.getAttribute('data-char') }); return; }
    if (S && S.phase === 'combat' && ui.sel !== null && !t.closest('.hand') && !t.closest('.info')) { ui.sel = null; ui.toast = null; render(); }
  });

  document.addEventListener('keydown', function (ev) {
    Snd.init();
    if (ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
    if (ui.sheet && ev.key === 'Escape') { ui.sheet = null; render(); return; }

      var c = S.combat, k = ev.key;
      if (/^[1-9]$/.test(k)) { var card = c.hand[+k - 1]; if (card) tapCard(card.uid); ev.preventDefault(); return; }
      if (k === 'ArrowLeft' || k === 'ArrowRight') {
        var al = c.enemies.map(function (e, i) { return e.hp > 0 ? i : -1; }).filter(function (i) { return i >= 0; });
        if (al.length) { var pos = al.indexOf(ui.tgt); pos = (pos + (k === 'ArrowRight' ? 1 : al.length - 1)) % al.length; ui.tgt = al[pos]; ui.showTgt = ui.sel === null; render(); }
        ev.preventDefault(); return;
      }
      if ((k === 'Enter' || k === ' ') && ui.sel !== null) { playSel(ui.tgt); ev.preventDefault(); return; }

    } else if (S.phase === 'reward') {
      if (/^[1-3]$/.test(ev.key) && S.reward.cards[+ev.key - 1]) dispatch({ t: 'reward', kind: 'card', id: S.reward.cards[+ev.key - 1] });
      if (ev.key === 's' || ev.key === 'S') dispatch({ t: 'reward', kind: 'skip' });
    }
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && ev.target && ev.target.getAttribute && ev.target.getAttribute('role') === 'button') { ev.target.click(); }
  });
  window.addEventListener('resize', function () { if (S && S.phase === 'map' && ui.view !== 'title') render(); });

  // test + debug hook (read access and the same command path the buttons use)
  window.__snapthread = { get state() { return S; }, get meta() { return meta; }, ui: ui, dispatch: dispatch, startNewRun: startNewRun, render: render, onAct: onAct, tapCard: tapCard, tapEnemy: tapEnemy, ST: ST };
  render();
})();
