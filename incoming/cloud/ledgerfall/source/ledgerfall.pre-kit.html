<title>Ledgerfall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one-screen phone app. A green accountant's columnar pad (the well) on a dark desk; HUD strip on top, ledger side column, thumb pad at the bottom. */
:root{
  --desk:#18302b; --desk2:#21403a;
  --pad:#eef5e6; --rule:#c4dbbf; --rule2:#9fc39a; --margin:#e3a3a0;
  --ink:#1d2b45; --ink2:#53627a; --paper-ink:#24314d;
  --need:#2f5f9e; --want:#e2478a; --save:#e3a21a; --debt:#c0392b; --junk:#7f8a8c;
  --chalk:#e9f1e6; --chalk2:#a9c2b8; --hi:#ffd66b;
  --num:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --body:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--desk);color:var(--chalk);font-family:var(--body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:radial-gradient(120% 80% at 50% 0%,var(--desk2),var(--desk))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding-top:max(6px,env(safe-area-inset-top,0px));padding-bottom:max(8px,env(safe-area-inset-bottom,0px));
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
#hud{width:100%;max-width:440px;display:flex;flex-direction:column;gap:5px}
.r1{display:flex;align-items:center;gap:8px}
#monthLbl{display:flex;flex-direction:column;line-height:1;min-width:64px}
#monthLbl b{font-family:var(--num);font-size:19px;letter-spacing:.08em;color:var(--hi)}
#monthLbl small{font-size:11px;color:var(--chalk2);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
#nw{flex:1;text-align:center;line-height:1}
#nw small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--chalk2)}
#nw b{font-family:var(--num);font-size:24px;font-variant-numeric:tabular-nums;display:inline-block;margin-top:2px}
#nw b.neg{color:#ff8a7a}
#nw b.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(1.25)}100%{transform:scale(1)}}
.hb{width:40px;height:40px;border-radius:10px;border:1px solid #3b5f56;background:#1d3832;font-size:15px;display:grid;place-items:center;touch-action:manipulation}
.r2{display:flex;gap:10px}
.meter{flex:1;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--chalk2);text-transform:uppercase;letter-spacing:.08em}
.meter i{flex:1;height:9px;border-radius:5px;background:#0f221e;overflow:hidden;border:1px solid #31544b}
.meter em{display:block;height:100%;width:0;background:var(--chalk);transition:width .25s}
#mBills em{background:linear-gradient(90deg,#7fc49a,#b8e6a6)}
#mJoy em{background:linear-gradient(90deg,#c43a76,#ff7fb5)}
#mJoy.low em{animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.meter b{font-family:var(--num);color:var(--chalk);font-size:12px;min-width:34px;text-align:right}
#stage{flex:1;min-height:0;display:flex;gap:8px;align-items:flex-start;justify-content:center;width:100%;max-width:440px}
#cvWrap{position:relative;flex:none}
#cv{display:block;touch-action:none;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 2px #0c1a17}
#side{width:86px;flex:none;display:flex;flex-direction:column;gap:6px;font-size:11px}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--chalk2)}
.slot{background:#122823;border:1px solid #2d5048;border-radius:8px;padding:5px;display:flex;flex-direction:column;align-items:center;gap:2px}
.slot canvas{display:block}
.slot span{font-size:10.5px;line-height:1.15;text-align:center;color:var(--chalk);min-height:24px}
#nowLbl{font-size:12px;line-height:1.2;color:var(--chalk);min-height:30px}
#nowLbl small{display:block;color:var(--chalk2);font-family:var(--num)}
.money{display:flex;flex-direction:column;gap:3px;font-family:var(--num);font-size:12px}
.money div{display:flex;justify-content:space-between;gap:4px}
.money .s b{color:#ffd877}.money .c b{color:#ff8a7a}
#bCharge{margin-top:2px;min-height:58px;border-radius:10px;border:2px solid #b8433a;background:#3a1d1b;color:#ffd9d4;font-size:12px;line-height:1.15;padding:4px;touch-action:manipulation}
#bCharge b{display:block;font-size:14px}
#bCharge:disabled{border-color:#3b5048;background:#16251f;color:#6f8a80}
#pad{width:100%;max-width:440px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#pad button{height:58px;border-radius:12px;border:1px solid #3b5f56;background:linear-gradient(#24463e,#1a352f);font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;touch-action:none}
#pad button small{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--chalk2);margin-top:3px}
#pad button.on{background:#335f54;transform:translateY(1px)}
#overlay{position:fixed;inset:0;background:rgba(8,18,16,.78);display:flex;align-items:center;justify-content:center;z-index:20;
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{width:100%;max-width:400px;max-height:100%;overflow:auto;background:var(--pad);color:var(--paper-ink);border-radius:10px;padding:18px 18px 16px 30px;position:relative;
  background-image:linear-gradient(90deg,transparent 21px,var(--margin) 21px,var(--margin) 23px,transparent 23px),repeating-linear-gradient(0deg,transparent 0 23px,var(--rule) 23px 24px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.sheet h1{font-family:var(--num);font-size:34px;letter-spacing:.04em;margin:2px 0 2px;color:var(--ink);text-wrap:balance}
.sheet h1 span{color:var(--debt)}
.sheet h2{font-size:22px;margin:0 0 6px;color:var(--ink);text-wrap:balance}
.sheet p{margin:6px 0;line-height:1.4;font-size:14px}
.tag{font-size:14px;color:var(--ink2);margin:0 0 12px}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.btn{min-height:48px;border-radius:10px;border:2px solid var(--ink);background:var(--ink);color:#f3f7ef;font-size:16px;font-weight:600;padding:8px 12px;touch-action:manipulation}
.btn.alt{background:transparent;color:var(--ink)}
.btn.warn{background:var(--debt);border-color:var(--debt)}
.btn small{display:block;font-weight:400;font-size:12px;opacity:.85}
.btn:disabled{opacity:.5}
.ledger{width:100%;border-collapse:collapse;font-family:var(--num);font-size:13px;margin:6px 0;font-variant-numeric:tabular-nums}
.ledger td{padding:3px 0;border-bottom:1px solid var(--rule2)}
.ledger td:last-child{text-align:right;white-space:nowrap}
.ledger tr.tot td{border-top:2px solid var(--ink);border-bottom:3px double var(--ink);font-weight:700}
.red{color:var(--debt)}.gold{color:#9a6a00}.grn{color:#2c7a3f}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.plan{border:2px solid var(--rule2);background:#f7fbf3;border-radius:9px;padding:6px 7px;text-align:left;display:flex;flex-direction:column;gap:1px;color:var(--paper-ink);min-height:74px;touch-action:manipulation}
.plan b{font-family:var(--num);font-size:15px}.plan span{font-size:13px;font-weight:600}.plan small{font-size:11px;color:var(--ink2);line-height:1.2}
.plan.on{border-color:var(--ink);background:#dfeedd;box-shadow:inset 0 0 0 1px var(--ink)}
.plan:disabled{opacity:.45}
.money .p b{color:var(--chalk)}
.chip{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.how{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.35}
.tip{background:#fff7d6;border:1px dashed #d4b24a;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.35;margin-top:8px}
.small{font-size:12px;color:var(--ink2)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);transform:translateX(-50%);z-index:15;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center;width:min(92vw,400px)}
.t{background:#fff7d6;color:#2b2a1e;border-radius:10px;padding:8px 12px;font-size:13.5px;line-height:1.3;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:tin .25s ease-out;text-align:center}
.t.bad{background:#ffe0dc;color:#5a1610}
.t.good{background:#e3f6dc;color:#173d1e}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#dbg{position:fixed;left:4px;bottom:4px;z-index:30;background:rgba(0,0,0,.75);color:#9f9;font:10px/1.3 var(--num);padding:4px 6px;border-radius:4px;max-width:60vw;white-space:pre;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <header id="hud">
    <div class="r1">
      <div id="monthLbl"><b id="mName">JAN</b><small id="mNum">Month 1</small></div>
      <div id="nw"><small>Net worth</small><b id="nwVal">$0</b></div>
      <button class="hb" id="bMute" aria-label="Sound on or off">&#9835;</button>
      <button class="hb" id="bPause" aria-label="Pause">&#10074;&#10074;</button>
    </div>
    <div class="r2">
      <div class="meter" id="mBills"><span>Bills</span><i><em></em></i><b id="billsTxt">0/4</b></div>
      <div class="meter" id="mJoy"><span id="joyLbl">Joy</span><i><em></em></i><b id="joyTxt">70</b></div>
    </div>
  </header>
  <main id="stage">
    <div id="cvWrap"><canvas id="cv" aria-label="The month: a falling-block board"></canvas></div>
    <aside id="side">
      <div class="lbl">Now</div>
      <div id="nowLbl"></div>
      <div class="lbl">Next</div>
      <div class="slot"><canvas id="nx1"></canvas><span id="nx1l"></span></div>
      <div class="slot"><canvas id="nx2"></canvas><span id="nx2l"></span></div>
      <div class="money"><div class="s">Saved<b id="vSave">$0</b></div><div class="c">Card<b id="vCard">$0</b></div><div class="p">Plan<b id="vPlan">50/30/20</b></div></div>
      <button id="bCharge" disabled><b>Card</b>locked</button>
    </aside>
  </main>
  <nav id="pad" aria-label="Controls">
    <button data-a="left" aria-label="Move left">&#9664;<small>left</small></button>
    <button data-a="right" aria-label="Move right">&#9654;<small>right</small></button>
    <button data-a="rotate" aria-label="Rotate">&#10227;<small>turn</small></button>
    <button data-a="soft" aria-label="Soft drop">&#9660;<small>down</small></button>
    <button data-a="hard" aria-label="Drop">&#10515;<small>drop</small></button>
  </nav>
</div>
<div id="overlay" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script id="core">

  { id: 'S', n: 3, c: [[1, 0], [2, 0], [0, 1], [1, 1]] },
  { id: 'Z', n: 3, c: [[0, 0], [1, 0], [1, 1], [2, 1]] },

      return `<button class="plan ${S.plan === pl.id ? 'on' : ''}" data-plan="${pl.id}" ${open ? '' : 'disabled'}>
        <b>${pl.split}</b><span>${pl.name}</span><small>${open ? pl.note : 'Opens in month ' + pl.unlock}</small></button>`;
    }).join('')}</div>`;
}
function overScreen() {
  screen = 'over'; Snd.stopMusic(); releaseHolds();
  const st = S.stats, nw = L.netWorth(S), done = S.over === 'finished';
  const head = done ? 'Year in the books' : S.over === 'debt' ? 'Buried in card debt' : S.over === 'buried' ? 'Buried by a surprise bill' : 'Overdrawn';
  const why = done ? `You finished ${S.month} months.` : 'The month ran out of room.';
  let lesson = 'Mix in gold savings blocks and clear their rows to grow your net worth.';
  if (st.cardInterest > 0 && st.cardInterest >= st.interestEarned) lesson = `Card interest cost you ${money(st.cardInterest)} while savings earned ${money(st.interestEarned)}. Debt compounds too.`;
  else if (st.impulses > 1) lesson = `${st.impulses} impulse buys. Clearing pink fun rows keeps Joy up.`;
  else if (st.chargedEmerg > 0) lesson = `${st.chargedEmerg} surprise bill${st.chargedEmerg > 1 ? 's' : ''} landed on the card. A bigger emergency fund would have covered ${st.chargedEmerg > 1 ? 'them' : 'it'}.`;
  else if (st.interestEarned > 0) lesson = `Your savings earned ${money(st.interestEarned)} in interest without you lifting a finger.`;
  const isBest = recordBest();
  show(`
    <h2>${head}</h2>
    <p>${why}</p>
    <table class="ledger">
      <tr><td>Months reached</td><td>${S.month}</td></tr>
      <tr><td>Bills paid</td><td>${st.rows} rows</td></tr>
      <tr><td>Interest earned</td><td class="grn">${money(st.interestEarned)}</td></tr>
      <tr><td>Card interest paid</td><td class="red">${st.cardInterest ? '(' + money(st.cardInterest) + ')' : '$0'}</td></tr>
      <tr><td>Perfect Budget rows</td><td>${st.perfect}</td></tr>
      <tr class="tot"><td>Net worth</td><td>${money(nw)}</td></tr>
    </table>
    ${isBest ? `<p class="gold"><b>New best${S.mode === 'daily' ? ' for today' : ''}!</b></p>` : ''}

    <div class="btns"><button class="btn" data-go="${S.mode === 'daily' ? 'daily' : 'new'}">${S.mode === 'daily' ? 'Try today again' : 'Play again'}</button><button class="btn alt" data-go="title">Main menu</button></div>`);
  saveRun();
}
function recordBest() {
  const nw = L.netWorth(S); let best = false;
  if (S.mode === 'daily') { const k = S.seed.replace('daily-', ''); if (meta.daily[k] == null || nw > meta.daily[k]) { meta.daily[k] = nw; best = true; } }
  else { if (meta.bestNW == null || nw > meta.bestNW) { meta.bestNW = nw; best = true; } }
  meta.bestMonth = Math.max(meta.bestMonth, S.month);
  meta.last = { nw, month: S.month, mode: S.mode };
  saveMeta();
  return best;
}
sheet.addEventListener('click', e => {
  const pb = e.target.closest('[data-plan]');
  if (pb && !pb.disabled && S && S.phase === 'payday') { Snd.unlock(); Snd.sfx('ui'); const top = sheet.scrollTop; dispatch({ type: 'plan', id: pb.dataset.plan }); paydayScreen(); sheet.scrollTop = top; return; }
  const b = e.target.closest('[data-go]'); if (!b) return;
  Snd.unlock(); Snd.sfx('ui');
  const go = b.dataset.go;
  if (go === 'new' || go === 'daily') {
    const live = S && S.phase !== 'over' && screen === 'title';
    if (live && confirmNew !== go) { confirmNew = go; b.innerHTML = `Tap again to start over<small>this replaces your month ${S.month} game</small>`; b.classList.add('warn'); return; }
    confirmNew = 0; startGame(go === 'daily' ? 'daily' : 'classic');
  } else if (go === 'continue') {
    resetFx(); if (S.phase === 'payday') paydayScreen(); else goPlay();
  } else if (go === 'how') howScreen();
  else if (go === 'back' || go === 'title') { confirmNew = 0; titleScreen(); }
  else if (go === 'resume') goPlay();
  else if (go === 'paycard') { const top = sheet.scrollTop; dispatch({ type: 'payCard' }); paydayScreen(); sheet.scrollTop = top; }
  else if (go === 'nextmonth') {
    dispatch({ type: 'startMonth' });
    if (S.phase === 'play') {
      goPlay();
      const added = S.board.slice(HID * COLS).filter(v => v === 4).length;
      toast(`${L.MONTH_NAMES[(S.month - 1) % 12]}: pay ${S.rowsGoal} bills.`, 'good');
      if (S.month === CF.CARD_UNLOCK_MONTH) tipOnce('card', 'New: the card. Tap Charge it to skip a block. It adds debt that grows 15% a month.');
      if (S.month === CF.EMERGENCY_UNLOCK_MONTH) tipOnce('emerg', 'Surprise bills start now. Savings pays them first.');
      if (added) tipOnce('debtrows', 'Your card balance came back as red rows. Clear them to pay it down.');
    }
  } else if (go === 'finish') { dispatch({ type: 'finish' }); }
});

// ---------------- Events -> juice ----------------
let pendingScreen = null;
function rowY(y) { return (y - HID) * CELLPX + CELLPX / 2; }
function float(txt, x, y, col, big) { fx.floats.push({ txt, x, y, col, big, life: 1100, vy: -0.03 }); }
function handle(ev) {
  let save = false;
  for (const e of ev) {
    switch (e.t) {
      case 'move': Snd.sfx('move'); break;
      case 'rotate': Snd.sfx('rotate'); break;
      case 'bump': break;
      case 'soft': break;
      case 'hard': Snd.sfx('hard'); shake = Math.min(7, 2 + e.d * 0.35); break;
      case 'lock': Snd.sfx('lock'); save = true; break;
      case 'spawn':
        if (e.cat === 3 && !e.imp) tipOnce('gold', 'Gold is savings. Clear its row to bank it.');
        break;
      case 'clear': {
        anim = { before: e.before, rows: e.rows, t: 0, dur: 300 };
        Snd.sfx('clear', e.n); if (e.saveCells) setTimeout(() => Snd.sfx('coin'), 120);
        const w = CELLPX * COLS;
        for (const ri of e.rowInfo) {
          for (let x = 0; x < COLS; x++) {
            const v = e.before[ri.y * COLS + x];
            const px = x * CELLPX + CELLPX / 2, py = rowY(ri.y);
            if (v === 3) for (let k = 0; k < 2; k++) fx.parts.push({ kind: 'coin', x: px, y: py, vx: (Math.random() - 0.5) * 0.25, vy: -0.35 - Math.random() * 0.25, life: 900, max: 900 });
            else fx.parts.push({ kind: 'bit', col: COLORS[v], x: px, y: py, vx: (Math.random() - 0.5) * 0.3, vy: -0.2 - Math.random() * 0.2, life: 500, max: 500 });
          }
          if (ri.perf) { float('PERFECT BUDGET', w / 2, rowY(ri.y) - CELLPX, '#b07800', true); Snd.sfx('perfect'); shake = 6; }
          else if (ri.bal) float('balanced', w / 2, rowY(ri.y) - CELLPX * 0.8, '#2c7a3f');
        }
        const yTop = rowY(Math.min(...e.rows));
        const got = e.banked + e.bonus;
        if (got) float('+' + money(got), w / 2, yTop - CELLPX * 1.6, '#9a6a00', e.n >= 3);
        if (e.debtPay) float('card -' + money(e.debtPay), w / 2, yTop + CELLPX * 1.2, '#2c7a3f');
        if (e.n >= 2) float(`${e.n} bills at once`, w / 2, yTop - CELLPX * 2.6, '#1d2b45');
        if (e.n >= 4) shake = 8;
        save = true; break;
      }
      case 'charge': Snd.sfx('charge'); toast(`Charged ${e.label}: +$${e.cost} on the card.`, 'bad', 1800); save = true; break;
      case 'impulse': Snd.sfx('impulse'); toast(`Joy hit zero. Impulse buy: +$${e.cost} on the card.`, 'bad', 3000); tipOnce('impulse', 'Clear rows with pink fun blocks to keep Joy up.'); shake = 5; save = true; break;
      case 'emergency':
        Snd.sfx('emergency'); shake = 6;
        if (e.rest > 0) toast(`${e.label}: $${e.cost}. Savings covered ${money(e.covered)}, the card took $${e.rest} and a junk row rose.`, 'bad', 3600);
        else toast(`${e.label}: $${e.cost}, paid from savings. That's what an emergency fund is for.`, 'good', 3200);
        save = true; break;
      case 'rows': break;
      case 'payday': pendingScreen = 'payday'; Snd.sfx('payday'); recordBest(); save = true; break;
      case 'paidCard': Snd.sfx('coin'); save = true; break;
      case 'month': save = true; break;
      case 'over': pendingScreen = 'over'; Snd.sfx('over'); save = true; break;
    }
  }
  if (save) saveRun();
}
function dispatch(a) {
  if (!S) return;
  const r = L.step(S, a); S = r.s; handle(r.ev);
  if (!anim && pendingScreen) flushPending();
  updateHUD();
}
// screens open after a short beat, counted in frames (not timers) so it pauses with the game
let pendingWait = 0;
function flushPending() { if (pendingWait <= 0) pendingWait = pendingScreen === 'over' ? 500 : 250; }
function runPending(dt) {
  if (!pendingScreen || anim) return;
  pendingWait -= dt; if (pendingWait > 0) return;
  const p = pendingScreen; pendingScreen = null; pendingWait = 0;
  if (p === 'payday' && S && S.phase === 'payday') paydayScreen();
  if (p === 'over' && S && S.phase === 'over') overScreen();
}
const canAct = () => S && screen === 'play' && !paused && !anim && S.phase === 'play';
function act(type, extra) { if (!canAct()) return; dispatch(Object.assign({ type }, extra || {})); }

// ---------------- Input ----------------
let softHeld = false;
const holds = {};       // repeating holds: left/right
const DAS = 165, ARR = 45;
function startHold(a) {
  if (holds[a]) return;
  act(a);
  holds[a] = { t0: performance.now(), last: 0 };
}
function stopHold(a) { delete holds[a]; }
function releaseHolds() { for (const k in holds) delete holds[k]; softHeld = false; document.querySelectorAll('#pad button.on').forEach(b => b.classList.remove('on')); }
function runHolds(now) {
  for (const a in holds) {
    const h = holds[a];
    if (now - h.t0 < DAS) continue;
    if (now - h.last >= ARR) { h.last = now; act(a); }
  }
}
// on-screen pad (pointer events, multi-touch friendly)
const padBtns = new Map();
document.querySelectorAll('#pad button').forEach(b => {
  const a = b.dataset.a;
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); Snd.unlock(); if (screen === 'play' && Snd.ctx) Snd.startMusic();
    try { b.setPointerCapture(e.pointerId); } catch (_) { /* jsdom/old browsers */ }
    padBtns.set(e.pointerId, a); b.classList.add('on');
    if (a === 'left' || a === 'right') startHold(a);
    else if (a === 'soft') { softHeld = true; act('soft'); }
    else act(a);
  });
  const end = e => { const pa = padBtns.get(e.pointerId); padBtns.delete(e.pointerId); b.classList.remove('on'); if (pa === 'soft') softHeld = false; else if (pa) stopHold(pa); };
  b.addEventListener('pointerup', end); b.addEventListener('pointercancel', end); b.addEventListener('lostpointercapture', end);
  b.addEventListener('contextmenu', e => e.preventDefault());
});
$('bCharge').addEventListener('click', () => { Snd.unlock(); act('charge'); });
$('bPause').addEventListener('click', () => { Snd.unlock(); if (screen === 'play') pauseScreen(); else if (screen === 'pause') goPlay(); });
$('bMute').addEventListener('click', () => { Snd.unlock(); meta.muted = !meta.muted; saveMeta(); Snd.setMuted(meta.muted); $('bMute').style.opacity = meta.muted ? 0.45 : 1; toast(meta.muted ? 'Sound off' : 'Sound on', '', 1000); });
$('bMute').style.opacity = meta.muted ? 0.45 : 1;
// board gestures: tap = turn, drag = move, drag down = speed up, flick down = drop
let gest = null;
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); Snd.unlock(); if (screen === 'play' && Snd.ctx) Snd.startMusic();
  if (screen !== 'play') return;
  try { cv.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
  gest = { id: e.pointerId, x0: e.clientX, y0: e.clientY, lx: e.clientX, ly: e.clientY, t0: performance.now(), moved: false, steps: 0 };
});
cv.addEventListener('pointermove', e => {
  if (!gest || e.pointerId !== gest.id) return;
  const stepX = CELLPX * 0.85;
  let dx = e.clientX - gest.lx;
  while (Math.abs(dx) >= stepX) { const dir = dx > 0 ? 1 : -1; act(dir > 0 ? 'right' : 'left'); gest.lx += dir * stepX; dx = e.clientX - gest.lx; gest.moved = true; }
  let dy = e.clientY - gest.ly;
  while (dy >= CELLPX) { act('soft'); gest.ly += CELLPX; dy = e.clientY - gest.ly; gest.moved = true; gest.steps++; }
  if (Math.abs(e.clientX - gest.x0) > 12 || Math.abs(e.clientY - gest.y0) > 12) gest.moved = true;
});
const endGest = e => {
  if (!gest || e.pointerId !== gest.id) return;
  const g = gest; gest = null;
  if (e.type === 'pointercancel') return;
  const dt = performance.now() - g.t0, dx = e.clientX - g.x0, dy = e.clientY - g.y0;
  if (!g.moved && dt < 350) act('rotate');
  else if (dy > 50 && dy / Math.max(dt, 1) > 0.55 && Math.abs(dy) > 2 * Math.abs(dx)) act('hard');
};
cv.addEventListener('pointerup', endGest); cv.addEventListener('pointercancel', endGest);
cv.addEventListener('contextmenu', e => e.preventDefault());
// keyboard
const KEYMAP = { ArrowLeft: 'left', ArrowRight: 'right', a: 'left', d: 'right' };
window.addEventListener('keydown', e => {
  Snd.unlock();
  const k = e.key;
  if (!ov.hidden) {
    if (k === 'Escape' && screen === 'pause') { goPlay(); e.preventDefault(); }
    return;
  }
  if (screen !== 'play') return;
  if (Snd.ctx) Snd.startMusic();
  if (KEYMAP[k]) { e.preventDefault(); if (!e.repeat) startHold(KEYMAP[k]); return; }
  if (k === 'ArrowDown' || k === 's') { e.preventDefault(); if (!softHeld) { softHeld = true; act('soft'); } return; }
  if (e.repeat) return;
  if (k === 'ArrowUp' || k === 'x' || k === 'X' || k === 'w') { e.preventDefault(); act('rotate'); }
  else if (k === 'z' || k === 'Z') { e.preventDefault(); act('rotate', { dir: -1 }); }
  else if (k === ' ') { e.preventDefault(); act('hard'); }
  else if (k === 'c' || k === 'C' || k === 'Shift') { e.preventDefault(); act('charge'); }
  else if (k === 'p' || k === 'P' || k === 'Escape') { e.preventDefault(); pauseScreen(); }
  else if (k === 'm' || k === 'M') { $('bMute').click(); }
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (KEYMAP[k]) stopHold(KEYMAP[k]);
  if (k === 'ArrowDown' || k === 's') softHeld = false;
});
window.addEventListener('blur', releaseHolds);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { Snd.hidden(true); if (screen === 'play') pauseScreen('Paused'); saveRun(); }
  else Snd.hidden(false);
});
window.addEventListener('pagehide', saveRun);
window.addEventListener('resize', () => { layout(); });

// ---------------- Loop ----------------
let last = performance.now();
function frame(now) {
  let dt = now - last; last = now; if (!(dt >= 0)) dt = 16; dt = Math.min(dt, 100);
  if (anim) { anim.t += dt; if (anim.t >= anim.dur) { anim = null; if (pendingScreen) flushPending(); } }
  else if (canAct()) { runHolds(now); dispatch({ type: 'tick', dt, soft: softHeld }); }
  runPending(dt);
  for (const p of fx.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.0009 * dt; p.life -= dt; }
  fx.parts = fx.parts.filter(p => p.life > 0);
  for (const f of fx.floats) { f.y += f.vy * dt; f.life -= dt; }
  fx.floats = fx.floats.filter(f => f.life > 0);
  render(now);
  if (DEBUG && S) $('dbg').textContent = `seed ${S.seed}\nrng ${S.rng} month ${S.month} phase ${S.phase}\nrows ${S.rowsPaid}/${S.rowsGoal} pieces ${S.pieces}/${S.piecesMonth}\nemerg@ ${S.emerg.join(',')} joy ${S.joy}\nsave ${S.savings} debt ${S.debt} lock ${Math.round(S.lockMs)} r${S.lockResets}\nbag ${S.bag.join('')} cbag ${S.cbag.join('')} speed ${L.speed(S)}`;
  requestAnimationFrame(frame);
}

// ---------------- Boot ----------------
if (DEBUG) { const d = document.createElement('div'); d.id = 'dbg'; document.body.appendChild(d); }
S = loadRun();
layout();
titleScreen();
updateHUD();
requestAnimationFrame(frame);
// test hooks (read-only use by the bot harness)
window.LF = { get S() { return S; }, set S(v) { S = v; }, get screen() { return screen; }, get anim() { return anim; }, dispatch, act, frame, layout, Snd, meta: () => meta, KEYS, get CELLPX() { return CELLPX; } };
})();
</script>
