<title>Spireshade</title>

<style>
/* Layout: one-screen desert board app. Header, score rail, square board with the sun on its rim, coach line, action row. Sheets slide up for menus. */
:root {
  --sand: #e4c896;        /* page ground: midday sand */
  --sand-2: #d8b77d;      /* raised surfaces */
  --board: #f0dcb2;       /* board top */
  --board-2: #e6cc98;     /* alternate squares */
  --grid: #b8935d;
  --ink: #2a1d12;
  --ink-2: #6b5136;
  --rust: #b3401f;
  --rust-2: #7c2a12;
  --indigo: #2f3c86;
  --indigo-2: #1b2459;
  --shade: rgba(34, 26, 74, 0.30);
  --sun: #f3a91f;
  --ok: #2f7a3e;
  --bad: #a3261a;
  --sheet: #f6e7c8;
  --display: "Bricolage Grotesque", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sand: #1d1710; --sand-2: #2b2217; --board: #3b2f20; --board-2: #33291c; --grid: #5f4b33;
  --ink: #f3e3c4; --ink-2: #c3a983; --rust: #e2683f; --rust-2: #9c3a1c; --indigo: #8794e6; --indigo-2: #4b58ad;
  --shade: rgba(4, 2, 20, 0.45); --sun: #f6b73c; --ok: #6cc47f; --bad: #ff7a66; --sheet: #2a2117; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --sand: #1d1710; --sand-2: #2b2217; --board: #3b2f20; --board-2: #33291c; --grid: #5f4b33;
  --ink: #f3e3c4; --ink-2: #c3a983; --rust: #e2683f; --rust-2: #9c3a1c; --indigo: #8794e6; --indigo-2: #4b58ad;
  --shade: rgba(4, 2, 20, 0.45); --sun: #f6b73c; --ok: #6cc47f; --bad: #ff7a66; --sheet: #2a2117; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--sand); color: var(--ink); font-family: var(--body); font-size:calc(max(12px,15px) * var(--gk-text-scale,1)); overflow: hidden;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; gap: 8px; box-sizing: border-box; }
header { display: flex; align-items: center; gap: 8px; }
header h1 { font-family: var(--display); font-weight: 800; font-size:calc(max(12px,22px) * min(var(--gk-text-scale,1),1.25)); letter-spacing: 0.02em; margin: 0; flex: 1; text-wrap: balance; }
header h1 span { color: var(--rust); }
button { font: inherit; color: inherit; cursor: pointer; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--grid); background: var(--sand-2); display: grid; place-items: center; font-size:calc(max(12px,18px) * min(var(--gk-text-scale,1),1.25)); }
.icon-btn:focus-visible, .btn:focus-visible, .chip:focus-visible, canvas:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.rail { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.side { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 12px; border: 1.5px solid transparent; min-width: 0; }
.side.r { justify-content: flex-end; text-align: right; }
.side.turn { border-color: var(--grid); background: var(--sand-2); }
.side .who { min-width: 0; }
.side .nm { font-weight: 700; font-size:calc(max(12px,14px) * min(var(--gk-text-scale,1),1.25)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side .sub { font-size:calc(max(12px,12px) * min(var(--gk-text-scale,1),1.25)); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side .ct { font-family: var(--display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
.side.p1 .ct { color: var(--rust); } .side.p2 .ct { color: var(--indigo); }
.sunbox { text-align: center; font-size:calc(max(12px,11px) * min(var(--gk-text-scale,1),1.25)); color: var(--ink-2); line-height: 1.25; text-transform: uppercase; letter-spacing: 0.06em; }
.sunbox b { display: block; color: var(--ink); font-size:calc(max(12px,13px) * min(var(--gk-text-scale,1),1.25)); letter-spacing: 0.02em; text-transform: none; }
#boardWrap { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1; margin: 0 auto; flex: 0 0 auto; }
canvas#board { width: 100%; height: 100%; display: block; border-radius: 18px; touch-action: none; }
.coach { min-height: 42px; display: flex; align-items: center; gap: 10px; font-size:calc(max(12px,14px) * var(--gk-text-scale,1)); line-height: 1.35; }
.coach p { margin: 0; flex: 1; min-width: 0; }
.coach .x { font-size:calc(max(12px,12px) * var(--gk-text-scale,1)); border: 0; background: none; color: var(--ink-2); text-decoration: underline; padding: 6px; }
.actions { display: flex; gap: 8px; }
.btn { flex: 1; min-height: 48px; border-radius: 14px; border: 1.5px solid var(--grid); background: var(--sand-2); font-weight: 700; font-size:calc(max(12px,15px) * var(--gk-text-scale,1)); padding: 0 12px; }
.btn.primary { background: var(--ink); color: var(--sand); border-color: var(--ink); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.small { flex: 0 0 auto; min-height: 40px; font-size:calc(max(12px,14px) * var(--gk-text-scale,1)); }
/* sheets */
.scrim { position: fixed; inset: 0; background: rgba(20, 12, 4, 0.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--sheet); color: var(--ink); width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto; border-radius: 22px 22px 0 0; box-sizing: border-box;
  padding: 18px max(18px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; animation: up 0.22s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: 0.6; } to { transform: none; opacity: 1; } }
.sheet h2 { font-family: var(--display); font-weight: 800; font-size: 24px; margin: 0; text-wrap: balance; }
.sheet h3 { font-size:calc(max(12px,12px) * var(--gk-text-scale,1)); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); margin: 4px 0 0; }
.sheet p { margin: 0; line-height: 1.45; max-width: 62ch; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.chip { text-align: left; border-radius: 14px; border: 1.5px solid var(--grid); background: var(--sand-2); padding: 10px 12px; min-height: 56px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.chip b { font-size:calc(max(12px,15px) * var(--gk-text-scale,1)); } .chip small { color: var(--ink-2); font-size:calc(max(12px,12px) * var(--gk-text-scale,1)); }
.chip.on { border-color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--grid); }
.toggle input { width: 22px; height: 22px; accent-color: var(--rust); }
table.st { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.st td, table.st th { padding: 6px 4px; border-bottom: 1px solid var(--grid); text-align: left; font-size:calc(max(12px,14px) * var(--gk-text-scale,1)); }
table.st th { font-size:calc(max(12px,12px) * var(--gk-text-scale,1)); color: var(--ink-2); font-weight: 400; }
.result { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1.1; }
.tp { border-left: 4px solid var(--sun); padding: 8px 12px; background: var(--sand-2); border-radius: 0 12px 12px 0; display: flex; flex-direction: column; gap: 6px; }
.tp .k { font-size:calc(max(12px,12px) * var(--gk-text-scale,1)); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
.mono { font-family: var(--mono); }
.bar { height: 8px; border-radius: 4px; background: var(--sand-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--sun); width: 0; transition: width 0.15s; }
canvas.graph { width: 100%; height: 90px; display: block; }
canvas.demo { width: 100%; max-width: 360px; aspect-ratio: 2.2; display: block; border-radius: 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--sand); padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 40; max-width: 86%; text-align: center; }
.reviewbar { display: flex; gap: 8px; align-items: center; }
.reviewbar input[type=range] { flex: 1; accent-color: var(--sun); min-width: 0; }
.ok { color: var(--ok); } .bad { color: var(--bad); }
#reviewPanel { display: flex; flex-direction: column; gap: 8px; max-height: 270px; overflow-y: auto; }
#reviewPanel[hidden] { display: none; }
#reviewPanel canvas.graph { height: 64px; flex: 0 0 auto; }
.icon-btn { position: relative; }
.icon-btn.due::after { content: ""; position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--sun); border: 1.5px solid var(--sand-2); }
@media (max-height: 640px) { header h1 { font-size:calc(max(12px,19px) * min(var(--gk-text-scale,1),1.25)); } .icon-btn { width: 40px; height: 40px; } .side .ct { font-size:22px; } .coach { min-height: 36px; font-size:calc(max(12px,13px) * var(--gk-text-scale,1)); } .btn { min-height: 44px; } }
html[data-gk-motion=calm] .sheet, html[data-gk-motion=still] .sheet { animation: none; }
html[data-gk-motion=still] .bar i { transition: none; }
</style>

<div id="app">
  <header>
    <button class="icon-btn" id="menuBtn" aria-label="Menu">&#9776;</button>
    <h1>Spire<span>shade</span></h1>
    <button class="icon-btn" id="puzzleBtn" aria-label="Daily puzzle" title="Daily puzzle">&#9670;</button>
    <button class="icon-btn" id="soundBtn" aria-label="Sound on">&#9834;</button>
  </header>
  <div class="rail">
    <div class="side p1" id="side1"><div class="ct" id="ct1">0</div><div class="who"><div class="nm" id="nm1">Rust</div><div class="sub" id="sub1">moves first</div></div></div>
    <div class="sunbox" id="sunbox">Shadows<b id="sunNow">west</b><span id="sunNext">next north</span></div>
    <div class="side p2 r" id="side2"><div class="who"><div class="nm" id="nm2">Indigo</div><div class="sub" id="sub2">moves second</div></div><div class="ct" id="ct2">0</div></div>
  </div>
  <div id="boardWrap"><canvas id="board" tabindex="0" aria-label="Board, 5 by 5. Arrow keys move, Enter selects and confirms."></canvas></div>

    <div class="reviewbar"><button class="btn small" id="rvPrev" aria-label="Previous move">&#9664;</button><input type="range" id="rvRange" min="0" max="0" value="0" aria-label="Move number"><button class="btn small" id="rvNext" aria-label="Next move">&#9654;</button></div>
    <div class="row" style="justify-content:space-between"><span id="rvPly" class="mono"></span><button class="btn small" id="rvDone">Done</button></div>
    <div id="rvText"></div>
  </div>

    <button class="btn primary" id="confirmBtn" disabled>Tap a square</button>
  </div>

<div id="layer"></div>

<script>
/* ===== Spireshade core: CONFIG, DATA, RNG, Rules (pure), AI, Review, Puzzle =====
   No DOM in this file. Shared by the game page and the node test harness. */
'use strict';

const CONFIG = {
  N: 5,                 // board is N x N. 25 squares: odd, so a full board can never tie
  MAXH: 3,              // tallest a spire can grow
  RULES_VERSION: 2,     // v1 was a 6x6 test board
  SUN_MODE: 'round',    // 'round': sun turns every two moves; 'ply': every move
  SUN_OFFSET: 0,        // 1 = the sun first turns after Rust's opening move, so Indigo casts first in each new direction
  TIE_GOES_TO: 2,       // unreachable on an odd board; kept as a safe fallback
  TIE_HEIGHT: false,    // tested: barely changes results, so the simpler rule stays. if true, equal spire count is first broken by total height
  // Bot strengths. nodes = search budget (deterministic), ms = phone safety cap.
  LEVELS: [
    { id: 'pebble', name: 'Pebble', blurb: 'Learning the rules', depth: 1, nodes: 400,    noise: 2.6, ms: 120 },
    { id: 'cairn',  name: 'Cairn',  blurb: 'Grabs what it sees',  depth: 2, nodes: 3000,   noise: 0.7, ms: 220 },
    { id: 'spire',  name: 'Spire',  blurb: 'Thinks a few moves',  depth: 3, nodes: 20000,  noise: 0.15, ms: 380 },
    { id: 'summit', name: 'Summit', blurb: 'Plays to win',        depth: 10, nodes: 150000, noise: 0,   ms: 650 }
  ],
  EVAL: { piece: 10, h2: 3, h3: 6, edge: 1, corner: 2, exposed: 2.5 },
  PUZZLE: { minPly: 10, maxPly: 26, tries: 200, margin: 2 },
  REVIEW: { nodes: 6000, depth: 3 }
};

// Shadow directions in sun order. Sun sits opposite the shadow.
// round r = floor(ply/2); shadow dir = DIRS[r % 4]
const DIRS = [
  { dx: -1, dy: 0, name: 'west',  sun: 'east'  },
  { dx: 0, dy: -1, name: 'north', sun: 'south' },
  { dx: 1, dy: 0,  name: 'east',  sun: 'west'  },
  { dx: 0, dy: 1,  name: 'south', sun: 'north' }
];

const DATA = {
  players: {
    1: { name: 'Rust',   glyph: 'dot'  },
    2: { name: 'Indigo', glyph: 'ring' }
  },
  coach: [
    'Tap an empty square to place a spire. Tap it again to confirm.',
    'Tap one of your own spires to raise it. Taller spires throw longer shadows.',
    'Shorter rival spires caught in your shadow turn to your color.',
    'A spire as tall as yours blocks the shadow. Height 3 can never be taken.',
    'The sun turns a quarter every round. Watch where the next shadows fall.'
  ]
};

/* ---------- seeded RNG (mulberry32) ---------- */
function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashString(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}

/* ---------- State ---------- */
// owner[i]: 0 empty, 1 Rust, 2 Indigo. height[i]: 0..3. ply counts moves made.
function newState(firstPlayer) {
  const n = CONFIG.N * CONFIG.N;
  return { owner: new Int8Array(n), height: new Int8Array(n), ply: 0, first: firstPlayer || 1, moves: [] };
}
function toMove(s) { return (s.ply % 2 === 0) ? s.first : 3 - s.first; }
function shadowDir(ply) {
  if (CONFIG.SUN_MODE === 'ply') return DIRS[ply % 4];
  return DIRS[Math.floor((ply + CONFIG.SUN_OFFSET) / 2) % 4];
}
// First ply after `ply` at which the shadow direction changes.
function nextShiftPly(ply) {
  if (CONFIG.SUN_MODE === 'ply') return ply + 1;
  let q = ply + 1; while ((q + CONFIG.SUN_OFFSET) % 2 !== 0) q++; return q;
}
function cloneState(s) {
  return { owner: Int8Array.from(s.owner), height: Int8Array.from(s.height), ply: s.ply, first: s.first, moves: s.moves.slice() };
}
function emptyCount(s) { let c = 0; for (let i = 0; i < s.owner.length; i++) if (!s.owner[i]) c++; return c; }
function isOver(s) { return emptyCount(s) === 0; }
function counts(s) {
  const c = { 1: 0, 2: 0, h1: 0, h2: 0 };
  for (let i = 0; i < s.owner.length; i++) { const o = s.owner[i]; if (o) { c[o]++; c['h' + o] += s.height[i]; } }
  return c;
}
function winner(s) {
  if (!isOver(s)) return 0;
  const c = counts(s);
  if (c[1] !== c[2]) return c[1] > c[2] ? 1 : 2;
  if (CONFIG.TIE_HEIGHT && c.h1 !== c.h2) return c.h1 > c.h2 ? 1 : 2;
  return CONFIG.TIE_GOES_TO;
}

/* ---------- Rules (pure-ish: legal + preview are pure, apply/undo mutate for search speed) ---------- */
function legalMoves(s) {
  const p = toMove(s), out = [];
  if (isOver(s)) return out;
  for (let i = 0; i < s.owner.length; i++) {
    if (!s.owner[i] || (s.owner[i] === p && s.height[i] < CONFIG.MAXH)) out.push(i);
  }
  return out;
}
function isLegal(s, cell) {
  if (!Number.isInteger(cell) || cell < 0 || cell >= s.owner.length || isOver(s)) return false;
  const p = toMove(s);
  return !s.owner[cell] || (s.owner[cell] === p && s.height[cell] < CONFIG.MAXH);
}
// Cells the shadow covers and which get flipped, without changing state.
function shadowOf(s, cell, heightAfter, p, ply) {
  const N = CONFIG.N, d = shadowDir(ply);
  let x = cell % N, y = (cell / N) | 0;
  const cover = [], flips = [];
  let blockedAt = -1;
  for (let k = 1; k <= heightAfter; k++) {
    x += d.dx; y += d.dy;
    if (x < 0 || y < 0 || x >= N || y >= N) break;
    const c = y * N + x;
    if (s.owner[c] && s.height[c] >= heightAfter) { blockedAt = c; break; }
    cover.push(c);
    if (s.owner[c] && s.owner[c] !== p) flips.push(c);
  }
  return { cover, flips, blockedAt, dir: d };
}
function preview(s, cell) {
  if (!isLegal(s, cell)) return null;
  const p = toMove(s);
  const kind = s.owner[cell] ? 'raise' : 'place';
  const h = kind === 'raise' ? s.height[cell] + 1 : 1;
  const sh = shadowOf(s, cell, h, p, s.ply);
  return { cell, kind, height: h, player: p, cover: sh.cover, flips: sh.flips, blockedAt: sh.blockedAt, dir: sh.dir };
}
// Mutating apply. Returns an undo record.
function applyMove(s, cell) {
  const p = toMove(s);
  const wasEmpty = !s.owner[cell];
  if (wasEmpty) { s.owner[cell] = p; s.height[cell] = 1; } else { s.height[cell]++; }
  const sh = shadowOf(s, cell, s.height[cell], p, s.ply);
  for (const c of sh.flips) s.owner[c] = p;
  s.ply++;
  s.moves.push(cell);
  return { cell, wasEmpty, flips: sh.flips, p };
}
function undoMove(s, u) {
  s.ply--; s.moves.pop();
  for (const c of u.flips) s.owner[c] = 3 - u.p;
  if (u.wasEmpty) { s.owner[u.cell] = 0; s.height[u.cell] = 0; } else { s.height[u.cell]--; }
}
// Pure step: returns new state (for UI and tests).
function step(s, cell) {
  if (!isLegal(s, cell)) throw new Error('Illegal move ' + cell);
  const t = cloneState(s); const u = applyMove(t, cell); return { state: t, undo: u };
}
function replay(moves, first) {
  let s = newState(first);
  for (const m of moves) { if (!isLegal(s, m)) return null; applyMove(s, m); }
  return s;
}
function cellName(i) { const N = CONFIG.N; return 'ABCDEFGH'[i % N] + (N - ((i / N) | 0)); }

/* ---------- Evaluation (from side p) ---------- */
const POS_W = (function () {
  const N = CONFIG.N, w = new Float32Array(N * N);
  for (let i = 0; i < N * N; i++) {
    const x = i % N, y = (i / N) | 0;
    const ex = x === 0 || x === N - 1, ey = y === 0 || y === N - 1;
    w[i] = (ex && ey) ? CONFIG.EVAL.corner : (ex || ey) ? CONFIG.EVAL.edge : 0;
  }
  return w;
})();
// Rough threat count: how many of p's pieces the next mover could flip with one raise.
function evaluate(s, p) {
  const E = CONFIG.EVAL;
  if (isOver(s)) {
    const w = winner(s), c = counts(s);
    const diff = c[p] - c[3 - p];
    return (w === p ? 10000 : -10000) + diff * 50;
  }
  let v = 0;
  const o = s.owner, h = s.height;
  for (let i = 0; i < o.length; i++) {
    if (!o[i]) continue;
    const val = E.piece + (h[i] === 2 ? E.h2 : h[i] === 3 ? E.h3 : 0) + POS_W[i];
    v += o[i] === p ? val : -val;
  }
  // Exposure: pieces the side to move could take next turn (cheap one-ply scan).
  const mover = toMove(s);
  let best = 0;
  for (let i = 0; i < o.length; i++) {
    if (o[i] !== mover || h[i] >= CONFIG.MAXH) continue;
    const sh = shadowOf(s, i, h[i] + 1, mover, s.ply);
    if (sh.flips.length > best) best = sh.flips.length;
  }
  v += (mover === p ? 1 : -1) * best * E.exposed;
  return v;
}

/* ---------- Search: negamax alpha-beta with iterative deepening ---------- */
function orderMoves(s, moves) {
  const p = toMove(s);
  const scored = moves.map(m => {
    const h = s.owner[m] ? s.height[m] + 1 : 1;
    const f = shadowOf(s, m, h, p, s.ply).flips.length;
    return { m, k: f * 10 + (s.owner[m] ? 2 : 0) + POS_W[m] };
  });
  scored.sort((a, b) => b.k - a.k);

      ctx.fillRect(i * bw + 0.5, bh >= 0 ? mid - bh : mid, Math.max(1, bw - 1), Math.abs(bh));
    });
    ctx.globalAlpha = 1;
    for (const p of [1, 2]) { const t = r.tps[p]; if (t && t.lossC >= 8) { ctx.fillStyle = COL.sun; ctx.beginPath(); ctx.arc((t.ply + 0.5) * bw, mid, 5, 0, Math.PI * 2); ctx.fill(); } }
    ctx.strokeStyle = COL.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(r.k * bw, 0); ctx.lineTo(r.k * bw, h); ctx.stroke();
    ctx.fillStyle = COL['ink-2']; ctx.font = tfx(11) + 'px ' + getComputedStyle(document.body).fontFamily; ctx.textBaseline = 'top';
    ctx.fillText('Rust ahead', 4, 2); ctx.textBaseline = 'bottom'; ctx.fillText('Indigo ahead', 4, h - 2);
  },
  exit() { App.mode = 'play'; App.review = null; $('reviewPanel').hidden = true; $('coach').hidden = false; $('actions').hidden = false; App.fit(); App.updateUI(); }
};

/* ---------- Daily puzzle (seeded by date) ---------- */
const Puzzle = {
  open(seed, isDaily) {
    if (App.anim) return;
    clearTimeout(App.botTimer); App.busy = false;
    const pz = C.makePuzzle(seed) || C.makePuzzle(seed + '#2') || C.makePuzzle('fallback-' + seed);
    if (!pz) { toast('No puzzle today. Try a practice one.'); return; }
    closeSheet();
    if (App.mode === 'review') Review.exit();
    App.mode = 'puzzle'; App.sel = null;
    const s = C.replay(pz.moves, 1);
    App.puzzle = { pz, isDaily, seed, me: C.toMove(s), phase: 'ask', tries: 0, showAnswer: false, base: s };
    App.s = C.cloneState(s); App.lastShadow = App.computeLastShadow(pz.moves);
    $('reviewPanel').hidden = true; $('coach').hidden = false; $('actions').hidden = false;
    this.prompt(); App.fit(); App.updateUI();
  },
  prompt() {
    const P = App.puzzle, lead = P.pz.nowLead;
    setCoach(`${P.isDaily ? 'Daily puzzle' : 'Practice puzzle'}. You are ${NAMES[P.me]}. Find the move that leaves you furthest ahead after your rival's best answer. You lead by ${fmt(lead)} now.`, false, true);
  },
  view() {
    const P = App.puzzle, v = {};
    if (P.showAnswer && P.phase === 'ask') { v.pre = C.preview(App.s, P.pz.solution); v.marks = [{ cell: P.pz.solution, kind: 'best' }]; }
    return v;
  },
  commit(cell) {
    const P = App.puzzle; P.tries++;
    P.picked = cell; P.phase = 'moving'; P.correct = cell === P.pz.solution && !P.showAnswer;
    App.commit(cell);
  },
  onAnimDone() {
    const P = App.puzzle, s = App.s;
    if (P.phase === 'moving') {
      // rival answers with its best reply (by plain spire count)
      if (C.isOver(s)) { this.resolve(); return; }
      const vals = C.puzzleValues(C.cloneState(P.base));
      const mine = vals.find(x => x.m === P.picked);
      P.value = mine ? mine.v : 0;
      P.phase = 'reply';
      setTimeout(() => { if (App.mode === 'puzzle' && mine && mine.reply >= 0 && C.isLegal(App.s, mine.reply)) App.commit(mine.reply); else this.resolve(); }, 380);
    } else if (P.phase === 'reply') this.resolve();
  },
  resolve() {
    const P = App.puzzle, d = Store.data.puzzle, c = C.counts(App.s);
    P.phase = 'done';
    const lead = c[P.me] - c[3 - P.me];
    if (P.picked === P.pz.solution) {
      Sound.good();
      let extra = '';
      if (P.isDaily && P.correct && !d.solved[P.seed]) {
        const y = new Date(); y.setDate(y.getDate() - 1);
        d.streak = d.last === C.dateKey(y) ? d.streak + 1 : 1; d.last = P.seed; d.best = Math.max(d.best, d.streak);
        d.solved[P.seed] = 1; extra = ` Streak: ${d.streak} day${d.streak > 1 ? 's' : ''}.`;
      } else if (!P.isDaily && P.correct) d.practice++;
      Store.save();
      setCoach(`${P.correct ? 'Solved' : 'That is the answer'}. After the best answer you lead by ${fmt(lead)}.${extra}`, false);
    } else {
      Sound.wrong();
      setCoach(`Not quite. After that answer you lead by ${fmt(lead)}. One move does better (${fmt(P.pz.value)}).`, false, true);
    }
    App.updateUI();
  },
  retry() { const P = App.puzzle; P.phase = 'ask'; App.s = C.cloneState(P.base); App.lastShadow = App.computeLastShadow(P.pz.moves); App.sel = null; this.prompt(); App.updateUI(); },
  reveal() {
    const P = App.puzzle; if (P.phase !== 'ask') this.retry();
    P.showAnswer = true; const pre = C.preview(App.s, P.pz.solution);
    setCoach(`Answer: ${pre.kind === 'raise' ? 'raise' : 'place at'} ${C.cellName(P.pz.solution)}. It takes ${pre.flips.length} and leaves you ${fmt(P.pz.value)} after the best answer. Tap it to play it out.`, false, true);
    App.updateUI();
  },
  buttons() {
    const P = App.puzzle, cb = $('confirmBtn'), ub = $('undoBtn');
    ub.hidden = false; ub.disabled = false;
    if (P.phase === 'ask') {
      ub.textContent = P.showAnswer ? 'Back to game' : 'Show answer';
      if (App.sel != null) { const p = C.preview(App.s, App.sel); cb.disabled = false; cb.textContent = (p.kind === 'place' ? 'Place at ' : 'Raise ') + C.cellName(p.cell) + (p.flips.length ? ' · takes ' + p.flips.length : ''); }
      else { cb.disabled = true; cb.textContent = 'Tap a square'; }
    } else if (P.phase === 'done') {
      const solved = P.picked === P.pz.solution;
      ub.textContent = 'Back to game';
      cb.disabled = false; cb.textContent = solved ? 'Practice another' : 'Try again';
    } else { ub.disabled = true; cb.disabled = true; cb.textContent = 'Rival answers…'; }
  },
  exit() { App.mode = 'play'; App.puzzle = null; App.s = C.replay(App.g.moves, 1); App.lastShadow = App.computeLastShadow(App.g.moves); App.sel = null; App.updateUI(); App.afterLoad(); }
};
const fmt = n => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n);

/* ---------- Sheets (menus) ---------- */
let sheetEl = null;
const pyw = el => el.querySelectorAll('[data-pyw]').forEach(s => s.replaceWith(GK.ui.prefsButton({ className: 'btn', panel: { text: true, tips: false } })));
function openSheet(html, mount, opts) {
  closeSheet();
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  scrim.addEventListener('pointerdown', e => { if (e.target === scrim && !(opts && opts.sticky)) closeSheet(); });
  $('layer').appendChild(scrim); sheetEl = scrim;
  if (mount) mount(scrim.firstChild);
  const f = scrim.querySelector('button'); if (f) f.focus({ preventScroll: true });
}
function closeSheet() { if (sheetEl) { sheetEl.remove(); sheetEl = null; } }
const Sheets = {
  pick: null,
  menu() {
    const d = Store.data, g = App.g;
    const pick = this.pick = { mode: g.mode, level: g.mode === 'bot' ? g.level : d.level, human: d.nextHuman };
    const lv = CONFIG.LEVELS.map((L, i) => {
      const r = d.stats.levels[L.id];
      return `<button class="chip" data-lv="${i}"><b>${L.name}</b><small>${L.blurb} · ${r.w}–${r.l}</small></button>`;
    }).join('');
    openSheet(`<h2>New game</h2>
      <h3>Opponent</h3><div class="grid2">${lv}<button class="chip" data-lv="pvp"><b>A friend</b><small>Pass and play on this phone</small></button></div>
      <div id="colorRow"><h3>You play</h3><div class="grid2"><button class="chip" data-hu="1"><b>Rust</b><small>Moves first</small></button><button class="chip" data-hu="2"><b>Indigo</b><small>Moves second</small></button></div></div>
      <button class="btn primary" id="startBtn">Start</button>
      <h3>More</h3>
      <div class="grid2"><button class="chip" data-go="puzzle"><b>Daily puzzle</b><small>${d.puzzle.solved[C.dateKey()] ? 'Solved today' : 'New today'} · streak ${d.puzzle.streak}</small></button>
      <button class="chip" data-go="rules"><b>How to play</b><small>Five rules, one minute</small></button>
      <button class="chip" data-go="stats"><b>Record</b><small>Wins, losses, streaks</small></button>
      <button class="chip" data-go="settings"><b>Settings</b><small>Sound, taps, numbers</small></button></div>
      <div data-pyw></div>
      <button class="btn" data-close>Back to the board</button>`, el => {
      pyw(el);
      const sync = () => {
        el.querySelectorAll('[data-lv]').forEach(b => b.classList.toggle('on', pick.mode === 'pvp' ? b.dataset.lv === 'pvp' : b.dataset.lv === String(pick.level)));
        el.querySelectorAll('[data-hu]').forEach(b => b.classList.toggle('on', +b.dataset.hu === pick.human));
        el.querySelector('#colorRow').hidden = pick.mode === 'pvp';
        el.querySelector('#startBtn').textContent = pick.mode === 'pvp' ? 'Start pass and play' : `Play ${CONFIG.LEVELS[pick.level].name} as ${NAMES[pick.human]}`;
      };
      el.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        if (b.dataset.lv != null) { if (b.dataset.lv === 'pvp') pick.mode = 'pvp'; else { pick.mode = 'bot'; pick.level = +b.dataset.lv; } sync(); }
        else if (b.dataset.hu) { pick.human = +b.dataset.hu; sync(); }
        else if (b.id === 'startBtn') { closeSheet(); Store.data.nextHuman = pick.human; App.newGame({ mode: pick.mode, level: pick.level, human: pick.human }); }
        else if (b.dataset.go === 'puzzle') Puzzle.open(C.dateKey(), true);
        else if (b.dataset.go === 'rules') this.rules();
        else if (b.dataset.go === 'stats') this.stats();
        else if (b.dataset.go === 'settings') this.settings();
        else if (b.hasAttribute('data-close')) closeSheet();
      });
      sync();
    });
  },
  rules() {
    openSheet(`<h2>How to play</h2>
      <canvas class="demo" id="demo" aria-label="A Rust spire rises to 3 and its shadow turns two Indigo spires to Rust"></canvas>
      <p><b>1.</b> On your turn, tap an empty square to place a spire, or tap one of yours to raise it. Spires grow to height 3.</p>
      <p><b>2.</b> The spire you just moved casts a shadow away from the sun, as many squares long as it is tall.</p>
      <p><b>3.</b> Rival spires in that shadow that are shorter than yours turn to your color. A spire as tall as yours stops the shadow, so height 3 is safe for good.</p>
      <p><b>4.</b> The sun moves a quarter turn after every round, so both players cast the same way, then it swings. The faint sun shows where it goes next.</p>
      <p><b>5.</b> When all 25 squares are full, whoever owns more spires wins. Rust moves first.</p>
      <p style="color:var(--ink-2);font-size:calc(max(12px,13px) * var(--gk-text-scale,1))">Keyboard: arrow keys move, Enter selects and confirms, Esc cancels, U undoes. Tap twice to move, or switch on one-tap moves in Settings.</p>
      <button class="btn primary" data-close>Play</button>`, el => {
      el.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheet(); });
      Demo.start(el.querySelector('#demo'));
    });
  },
  stats() {
    const d = Store.data;
    const rows = CONFIG.LEVELS.map(L => { const r = d.stats.levels[L.id]; return `<tr><td>${L.name}</td><td>${r.w}</td><td>${r.l}</td><td>${r.best ? '+' + r.best : '–'}</td></tr>`; }).join('');
    openSheet(`<h2>Record</h2>
      <table class="st"><tr><th>Opponent</th><th>Won</th><th>Lost</th><th>Best margin</th></tr>${rows}</table>
      <p>Daily puzzles solved: <b>${Object.keys(d.puzzle.solved).length}</b>. Streak: <b>${d.puzzle.streak}</b> (best ${d.puzzle.best}). Practice puzzles: <b>${d.puzzle.practice}</b>.</p>
      <p>Pass-and-play games: <b>${d.stats.pvp}</b>. Games with an undo or a retry are casual and not counted.</p>
      <p style="color:var(--ink-2);font-size:calc(max(12px,13px) * var(--gk-text-scale,1))">Your record lives only in this browser.</p>
      <button class="btn" data-close>Close</button>`, el => el.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheet(); }));
  },
  settings() {
    const st = Store.data.settings;
    openSheet(`<h2>Settings</h2>
      <label class="toggle" for="setSound"><span>Sound</span><input type="checkbox" id="setSound" ${st.sound ? 'checked' : ''}></label>
      <label class="toggle" for="setTap"><span>One-tap moves (no confirm)</span><input type="checkbox" id="setTap" ${st.oneTap ? 'checked' : ''}></label>
      <label class="toggle" for="setNums"><span>Show height numbers</span><input type="checkbox" id="setNums" ${st.nums ? 'checked' : ''}></label>
      <button class="btn" id="resetCoach">Show the tips again</button>
      <div data-pyw></div>
      <button class="btn" data-close>Done</button>`, el => {
      pyw(el);
      el.addEventListener('change', () => {
        st.sound = el.querySelector('#setSound').checked; st.oneTap = el.querySelector('#setTap').checked; st.nums = el.querySelector('#setNums').checked;
        if (st.sound) Sound.unlock(); else if (Sound.ctx) Sound.ctx.suspend().catch(() => {});
        Store.save(); App.updateUI();
      });
      el.addEventListener('click', e => {
        if (e.target.id === 'resetCoach') { Store.data.coach = 0; Store.save(); App.updateUI(); toast('Tips are back'); }
        if (e.target.closest('[data-close]')) closeSheet();
      });
    });
  },
  result() {
    if (App.mode !== 'play' || !C.isOver(App.s)) return;
    const g = App.g, s = App.s, w = C.winner(s), c = C.counts(s);
    let head;
    if (g.mode === 'bot') head = w === g.human ? `You win ${c[g.human]}–${c[3 - g.human]}` : `${CONFIG.LEVELS[g.level].name} wins ${c[3 - g.human]}–${c[g.human]}`;
    else head = `${NAMES[w]} wins ${c[w]}–${c[3 - w]}`;
    const tie = '';
    const casual = g.casual && g.mode === 'bot' ? '<p style="color:var(--ink-2)">Casual game: not counted in your record.</p>' : '';
    const next = g.mode === 'bot' ? `Rematch as ${NAMES[3 - g.human]}` : 'Play again';
    openSheet(`<div class="result">${head}</div>${tie}${casual}
      <p>See the move where the game turned, then try it again.</p>
      <button class="btn primary" id="rvBtn">Review the game</button>
      <div class="grid2"><button class="btn" id="rmBtn">${next}</button><button class="btn" id="mnBtn">Menu</button></div>`, el => {
      el.querySelector('#rvBtn').onclick = () => Review.start();
      el.querySelector('#rmBtn').onclick = () => { closeSheet(); const h = g.mode === 'bot' ? 3 - g.human : 1; Store.data.nextHuman = h; App.newGame({ mode: g.mode, level: g.level, human: h }); };
      el.querySelector('#mnBtn').onclick = () => this.menu();
    });
  }
};

/* ---------- Rules demo strip ---------- */
const Demo = {
  start(cv) {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const draw = () => {
      if (!cv.isConnected) return;
      const w = cv.clientWidth || 320, h = cv.clientHeight || 145;
      cv.width = w * dpr; cv.height = h * dpr;
      const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const cells = 5, cs = Math.min(w / (cells + 0.6), h * 0.7), ox = (w - cs * cells) / 2, oy = (h - cs) / 2 + 8;
      const phase = Math.floor(now() / 1600) % 2;
      ctx.fillStyle = COL['board-2']; ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < cells; i++) { ctx.fillStyle = i % 2 ? COL['board-2'] : COL.board; ctx.fillRect(ox + i * cs, oy, cs, cs); ctx.strokeStyle = COL.grid; ctx.strokeRect(ox + i * cs, oy, cs, cs); }
      // sun on the left, shadow east
      ctx.save(); ctx.fillStyle = COL.sun; ctx.beginPath(); ctx.arc(ox * 0.5, oy + cs / 2, cs * 0.14, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      const pieces = phase === 0 ? [[0, 1, 2], [1, 2, 1], [3, 2, 2], [4, 2, 1]] : [[0, 1, 3], [1, 1, 1], [3, 1, 2], [4, 2, 1]];
      if (phase === 1) for (let i = 1; i <= 3; i++) { ctx.globalAlpha = 0.9; ctx.fillStyle = COL.shade; ctx.fillRect(ox + i * cs + 1, oy + 1, cs - 2, cs - 2); ctx.globalAlpha = 1; }
      for (const [x, o, hh] of pieces) drawSpire(ctx, ox + (x + 0.5) * cs, oy + cs / 2, cs, o, hh);
      ctx.fillStyle = COL.ink; ctx.font = `700 13px ${getComputedStyle(document.body).fontFamily}`; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText(phase === 0 ? 'Before: Rust spire at height 2' : 'Raised to 3: shadow 3 long takes two', 8, 6);
      setTimeout(() => requestAnimationFrame(draw), 400);
    };
    draw();
  }
};

/* ---------- Toast ---------- */
let toastT = 0;
function toast(t) {
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 1900);
}

/* ---------- Input ---------- */
function bindInput() {
  const cv = $('board');
  let downCell = -1;
  document.addEventListener('pointerdown', () => Sound.unlock(), { capture: true });
  document.addEventListener('keydown', () => Sound.unlock(), { capture: true });
  cv.addEventListener('pointerdown', e => { downCell = Board.cellAt(e.clientX, e.clientY); App.showCursor = false; });
  cv.addEventListener('pointerup', e => {
    const c = Board.cellAt(e.clientX, e.clientY);
    if (c >= 0 && c === downCell) App.tap(c);
    else if (c < 0 && App.sel != null) { App.sel = null; App.updateUI(); }
    downCell = -1;
  });
  cv.addEventListener('keydown', e => {
    if (document.querySelector('.gk-prefs')) return;
    const k = e.key; let c = App.cursor;
    if (k === 'ArrowLeft') c = c % N ? c - 1 : c; else if (k === 'ArrowRight') c = c % N < N - 1 ? c + 1 : c;
    else if (k === 'ArrowUp') c = c >= N ? c - N : c; else if (k === 'ArrowDown') c = c < N * N - N ? c + N : c;
    else if (k === 'Enter' || k === ' ') { e.preventDefault(); App.showCursor = true; App.tap(App.cursor); return; }
    else if (k === 'Escape') { App.sel = null; App.updateUI(); return; }
    else return;
    e.preventDefault(); App.cursor = c; App.showCursor = true; App.render();
  });
  document.addEventListener('keydown', e => {
    if (document.querySelector('.gk-prefs')) return;
    if (e.key === 'Escape' && sheetEl) { closeSheet(); return; }
    if (sheetEl || e.target.tagName === 'INPUT') return;
    if ((e.key === 'u' || e.key === 'U') && App.mode === 'play') App.undo();
  });
  $('confirmBtn').onclick = () => {
    if (App.mode === 'puzzle') {
      const P = App.puzzle;
      if (P.phase === 'ask' && App.sel != null) Puzzle.commit(App.sel);
      else if (P.phase === 'done') { if (P.picked === P.pz.solution) Puzzle.open('practice-' + (Store.data.puzzle.practice + 1) + '-' + Date.now() % 100000, false); else Puzzle.retry(); }
      return;
    }
    if (C.isOver(App.s)) { Sheets.result(); return; }
    if (App.sel != null) App.commit(App.sel);
  };
  $('undoBtn').onclick = () => {
    if (App.mode === 'puzzle') { const P = App.puzzle; if (P.phase === 'ask' && !P.showAnswer) Puzzle.reveal(); else Puzzle.exit(); return; }
    App.undo();
  };
  $('menuBtn').onclick = () => Sheets.menu();
  $('puzzleBtn').onclick = () => Puzzle.open(C.dateKey(), true);
  $('soundBtn').onclick = () => { const st = Store.data.settings; st.sound = !st.sound; if (st.sound) { Sound.unlock(); Sound.place(); } else if (Sound.ctx) Sound.ctx.suspend().catch(() => {}); Store.save(); App.updateUI(); };
  $('coachX').onclick = () => { Store.data.coach = 5; Store.save(); App.updateUI(); };
  $('rvRange').oninput = e => Review.goto(+e.target.value);
  $('rvPrev').onclick = () => Review.goto(App.review.k - 1);
  $('rvNext').onclick = () => Review.goto(App.review.k + 1);
  $('rvDone').onclick = () => Review.exit();
  $('rvText').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.goto != null) Review.goto(+b.dataset.goto);
    if (b.dataset.retry != null) {
      const g = App.g, ply = +b.dataset.retry;
      Review.exit();
      App.newGame({ mode: 'bot', level: g.level, human: g.human, moves: g.moves.slice(0, ply), casual: true, startPly: ply }, true);
      toast('Your move from move ' + (ply + 1) + '. Find the better one.');
    }
  });
  window.addEventListener('resize', () => { App.fit(); if (App.review) Review.drawGraph(); });
  if (window.ResizeObserver) new ResizeObserver(() => { const r = $('board').getBoundingClientRect(); if (Math.abs(r.width - Board.size) > 1) { Board.resize(); App.render(); } }).observe($('boardWrap'));
}

/* ---------- Boot ---------- */
function start(hotData) {
  Store.load(hotData);
  bindInput();
  App.boot();
  GK.studio();
  GK.prefs.on(() => { App.fit(); App.render(); });
  GK.coach.create('spireshade-first', [{ target: () => { const s = App.s; if (!s) return null; const r = Board.cv.getBoundingClientRect(), k = r.width / Board.size;
      let best = -1, bd = 1e9; for (let i = 0; i < N * N; i++) { if (s.owner[i]) continue; const d = Math.abs(i % N - (N - 1) / 2) + Math.abs(((i / N) | 0) - (N - 1) / 2); if (d < bd) { bd = d; best = i; } }
      if (best < 0) return null; const [cx, cy] = Board.center(best); return { x: r.left + cx * k, y: r.top + cy * k, r: Board.cs * k * 0.5 }; },
    done: () => Store.data.coach > 0 }],
    { when: () => App.mode === 'play' && !sheetEl && App.humanToMove() && App.sel == null && !App.anim });
  GK.wired('motion', 'flip animation follows the level (Calm and Still skip it, as the game reduced mode did); preview glow holds under Still; sheet slide-up follows it');
  GK.wired('text', 'page CSS floor and scale (header, side boxes and sun box capped at A+); board coordinates, height numbers and review labels; how-to demo caption left at 13px');
  GK.wired('combo', 'own ladder kept: flips climb the game scale G A C D E, at most 3 a move');
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => Store.data);
  window.SpireApp = App; window.SpireCore = C; // for the debug console and tests
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start(window.claude && window.claude.hot ? window.claude.hot.data : null);
})();

</script>
