<title>Spireshade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one-screen desert board app. Header, score rail, square board with the sun on its rim, coach line, action row. Sheets slide up for menus. */
:root {
  --sand: #e4c896;        /* page ground: midday sand */
  --sand-2: #d8b77d;      /* raised surfaces */
  --board: #f0dcb2;       /* board top */
  --board-2: #e6cc98;     /* alternate squares */
  --grid: #b8935d;
  --ink: #2a1d12;
  --ink-2: #6b5136;
  --rust: #b3401f;
  --rust-2: #7c2a12;
  --indigo: #2f3c86;
  --indigo-2: #1b2459;
  --shade: rgba(34, 26, 74, 0.30);
  --sun: #f3a91f;
  --ok: #2f7a3e;
  --bad: #a3261a;
  --sheet: #f6e7c8;
  --display: "Bricolage Grotesque", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sand: #1d1710; --sand-2: #2b2217; --board: #3b2f20; --board-2: #33291c; --grid: #5f4b33;
  --ink: #f3e3c4; --ink-2: #c3a983; --rust: #e2683f; --rust-2: #9c3a1c; --indigo: #8794e6; --indigo-2: #4b58ad;
  --shade: rgba(4, 2, 20, 0.45); --sun: #f6b73c; --ok: #6cc47f; --bad: #ff7a66; --sheet: #2a2117; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --sand: #1d1710; --sand-2: #2b2217; --board: #3b2f20; --board-2: #33291c; --grid: #5f4b33;
  --ink: #f3e3c4; --ink-2: #c3a983; --rust: #e2683f; --rust-2: #9c3a1c; --indigo: #8794e6; --indigo-2: #4b58ad;
  --shade: rgba(4, 2, 20, 0.45); --sun: #f6b73c; --ok: #6cc47f; --bad: #ff7a66; --sheet: #2a2117; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--sand); color: var(--ink); font-family: var(--body); font-size:calc(max(12px,15px) * var(--gk-text-scale,1)); overflow: hidden;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; gap: 8px; box-sizing: border-box; }
header { display: flex; align-items: center; gap: 8px; }
header h1 { font-family: var(--display); font-weight: 800; font-size:calc(max(12px,22px) * min(var(--gk-text-scale,1),1.25)); letter-spacing: 0.02em; margin: 0; flex: 1; text-wrap: balance; }
header h1 span { color: var(--rust); }
button { font: inherit; color: inherit; cursor: pointer; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--grid); background: var(--sand-2); display: grid; place-items: center; font-size:calc(max(12px,18px) * min(var(--gk-text-scale,1),1.25)); }
.icon-btn:focus-visible, .btn:focus-visible, .chip:focus-visible, canvas:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.rail { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.side { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 12px; border: 1.5px solid transparent; min-width: 0; }
.side.r { justify-content: flex-end; text-align: right; }
.side.turn { border-color: var(--grid); background: var(--sand-2); }
.side .who { min-width: 0; }
.side .nm { font-weight: 700; font-size:calc(max(12px,14px) * min(var(--gk-text-scale,1),1.25)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side .sub { font-size:calc(max(12px,12px) * min(var(--gk-text-scale,1),1.25)); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side .ct { font-family: var(--display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
.side.p1 .ct { color: var(--rust); } .side.p2 .ct { color: var(--indigo); }
.sunbox { text-align: center; font-size:calc(max(12px,11px) * min(var(--gk-text-scale,1),1.25)); color: var(--ink-2); line-height: 1.25; text-transform: uppercase; letter-spacing: 0.06em; }
.sunbox b { display: block; color: var(--ink); font-size:calc(max(12px,13px) * min(var(--gk-text-scale,1),1.25)); letter-spacing: 0.02em; text-transform: none; }
#boardWrap { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1; margin: 0 auto; flex: 0 0 auto; }
canvas#board { width: 100%; height: 100%; display: block; border-radius: 18px; touch-action: none; }
.coach { min-height: 42px; display: flex; align-items: center; gap: 10px; font-size:calc(max(12px,14px) * var(--gk-text-scale,1)); line-height: 1.35; }
.coach p { margin: 0; flex: 1; min-width: 0; }
.coach .x { font-size:calc(max(12px,12px) * var(--gk-text-scale,1)); border: 0; background: none; color: var(--ink-2); text-decoration: underline; padding: 6px; }
.actions { display: flex; gap: 8px; }
.btn { flex: 1; min-height: 48px; border-radius: 14px; border: 1.5px solid var(--grid); background: var(--sand-2); font-weight: 700; font-size:calc(max(12px,15px) * var(--gk-text-scale,1)); padding: 0 12px; }
.btn.primary { background: var(--ink); color: var(--sand); border-color: var(--ink); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.small { flex: 0 0 auto; min-height: 40px; font-size:calc(max(12px,14px) * var(--gk-text-scale,1)); }
/* sheets */
.scrim { position: fixed; inset: 0; background: rgba(20, 12, 4, 0.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--sheet); color: var(--ink); width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto; border-radius: 22px 22px 0 0; box-sizing: border-box;
  padding: 18px max(18px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; animation: up 0.22s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: 0.6; } to { transform: none; opacity: 1; } }
.sheet h2 { font-family: var(--display); font-weight: 800; font-size: 24px; margin: 0; text-wrap: balance; }
.sheet h3 { font-size:calc(max(12px,12px) * var(--gk-text-scale,1)); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); margin: 4px 0 0; }
.sheet p { margin: 0; line-height: 1.45; max-width: 62ch; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.chip { text-align: left; border-radius: 14px; border: 1.5px solid var(--grid); background: var(--sand-2); padding: 10px 12px; min-height: 56px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.chip b { font-size:calc(max(12px,15px) * var(--gk-text-scale,1)); } .chip small { color: var(--ink-2); font-size:calc(max(12px,12px) * var(--gk-text-scale,1)); }
.chip.on { border-color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--grid); }
.toggle input { width: 22px; height: 22px; accent-color: var(--rust); }
table.st { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.st td, table.st th { padding: 6px 4px; border-bottom: 1px solid var(--grid); text-align: left; font-size:calc(max(12px,14px) * var(--gk-text-scale,1)); }
table.st th { font-size:calc(max(12px,12px) * var(--gk-text-scale,1)); color: var(--ink-2); font-weight: 400; }
.result { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1.1; }
.tp { border-left: 4px solid var(--sun); padding: 8px 12px; background: var(--sand-2); border-radius: 0 12px 12px 0; display: flex; flex-direction: column; gap: 6px; }
.tp .k { font-size:calc(max(12px,12px) * var(--gk-text-scale,1)); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
.mono { font-family: var(--mono); }
.bar { height: 8px; border-radius: 4px; background: var(--sand-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--sun); width: 0; transition: width 0.15s; }
canvas.graph { width: 100%; height: 90px; display: block; }
canvas.demo { width: 100%; max-width: 360px; aspect-ratio: 2.2; display: block; border-radius: 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--sand); padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 40; max-width: 86%; text-align: center; }
.reviewbar { display: flex; gap: 8px; align-items: center; }
.reviewbar input[type=range] { flex: 1; accent-color: var(--sun); min-width: 0; }
.ok { color: var(--ok); } .bad { color: var(--bad); }
#reviewPanel { display: flex; flex-direction: column; gap: 8px; max-height: 270px; overflow-y: auto; }
#reviewPanel[hidden] { display: none; }
#reviewPanel canvas.graph { height: 64px; flex: 0 0 auto; }
.icon-btn { position: relative; }
.icon-btn.due::after { content: ""; position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--sun); border: 1.5px solid var(--sand-2); }
@media (max-height: 640px) { header h1 { font-size:calc(max(12px,19px) * min(var(--gk-text-scale,1),1.25)); } .icon-btn { width: 40px; height: 40px; } .side .ct { font-size:22px; } .coach { min-height: 36px; font-size:calc(max(12px,13px) * var(--gk-text-scale,1)); } .btn { min-height: 44px; } }
html[data-gk-motion=calm] .sheet, html[data-gk-motion=still] .sheet { animation: none; }
html[data-gk-motion=still] .bar i { transition: none; }
</style>

<div id="app">
  <header>
    <button class="icon-btn" id="menuBtn" aria-label="Menu">&#9776;</button>
    <h1>Spire<span>shade</span></h1>
    <button class="icon-btn" id="puzzleBtn" aria-label="Daily puzzle" title="Daily puzzle">&#9670;</button>
    <button class="icon-btn" id="soundBtn" aria-label="Sound on">&#9834;</button>
  </header>
  <div class="rail">
    <div class="side p1" id="side1"><div class="ct" id="ct1">0</div><div class="who"><div class="nm" id="nm1">Rust</div><div class="sub" id="sub1">moves first</div></div></div>
    <div class="sunbox" id="sunbox">Shadows<b id="sunNow">west</b><span id="sunNext">next north</span></div>
    <div class="side p2 r" id="side2"><div class="who"><div class="nm" id="nm2">Indigo</div><div class="sub" id="sub2">moves second</div></div><div class="ct" id="ct2">0</div></div>
  </div>
  <div id="boardWrap"><canvas id="board" tabindex="0" aria-label="Board, 5 by 5. Arrow keys move, Enter selects and confirms."></canvas></div>
  <div id="reviewPanel" hidden>
    <canvas class="graph" id="rvGraph" aria-label="Spire lead across the game"></canvas>
    <div class="reviewbar"><button class="btn small" id="rvPrev" aria-label="Previous move">&#9664;</button><input type="range" id="rvRange" min="0" max="0" value="0" aria-label="Move number"><button class="btn small" id="rvNext" aria-label="Next move">&#9654;</button></div>
    <div class="row" style="justify-content:space-between"><span id="rvPly" class="mono"></span><button class="btn small" id="rvDone">Done</button></div>
    <div id="rvText"></div>
  </div>
  <div class="coach" id="coach"><p id="coachText" aria-live="polite"></p><button class="x" id="coachX" hidden>Got it</button></div>
  <div class="actions" id="actions">
    <button class="btn" id="undoBtn">Undo</button>
    <button class="btn primary" id="confirmBtn" disabled>Tap a square</button>
  </div>
</div>
<div id="layer"></div>

<script>
/*__CORE__*/
</script>
<script>
/*__UI__*/
</script>
