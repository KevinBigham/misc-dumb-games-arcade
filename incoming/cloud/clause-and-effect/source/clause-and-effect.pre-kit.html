<title>Clause &amp; Effect</title>

<style>
/* Layout: one column on phones (board, controls, ledger); board beside ledger from 860px. Carbon-copy registry forms. */

  --slot-bg: #dcefe9;
  --stamp: #b3261e;      /* auditor red */
  --brass: #a8761c;      /* hatch / key */
  --spill: #2f3f8a;      /* ink spill */
  --lamp: #d99413;       /* guard lamp */
  --ok: #2c7a3f;
  --cell-a: #e6eadf; --cell-b: #e1e6d9;
  --wall: #3a4656; --wall-top: #4d5b6e; --guard: #8a3b2e;
  --shadow: 0 1px 0 rgba(29,40,56,.08), 0 6px 18px rgba(29,40,56,.08);
  --f-display: 'Stardos Stencil', 'Impact', 'Arial Narrow', sans-serif;

  --f-code: 'Courier Prime', 'Courier New', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #11161d; --card: #19202a; --rule: #2b3543; --ink: #e5e8de; --ink-soft: #9aa5b1;
  --slot: #43c9c0; --slot-bg: #173634; --stamp: #ff5d50; --brass: #e0b04a; --spill: #6d82ff; --lamp: #ffb52e; --ok: #5fcf7a;
  --cell-a: #1b222c; --cell-b: #181e27; --wall: #3c4a5d; --wall-top: #52637a; --guard: #c9634f;
  --shadow: 0 1px 0 rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #11161d; --card: #19202a; --rule: #2b3543; --ink: #e5e8de; --ink-soft: #9aa5b1;
  --slot: #43c9c0; --slot-bg: #173634; --stamp: #ff5d50; --brass: #e0b04a; --spill: #6d82ff; --lamp: #ffb52e; --ok: #5fcf7a;
  --cell-a: #1b222c; --cell-b: #181e27; --wall: #3c4a5d; --wall-top: #52637a; --guard: #c9634f;
  --shadow: 0 1px 0 rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }

.screen { min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 96px; max-width: 1180px; margin: 0 auto; }

/* ---------- Title ---------- */
.title-screen { display: flex; flex-direction: column; gap: 18px; padding-top: 28px; }
.title-mark { font-family: var(--f-display); font-size: clamp(44px, 14vw, 84px); line-height: .9; letter-spacing: .01em; color: var(--ink); text-wrap: balance; margin: 0; }
.title-mark span { color: var(--stamp); }
.form-no { font-family: var(--f-code); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.lede { max-width: 34em; font-size: 16px; margin: 0; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { min-height: 48px; padding: 0 20px; border-radius: 8px; border: 1.5px solid var(--ink); background: transparent; font-weight: 700; letter-spacing: .02em; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }

.topbar { display: flex; align-items: center; gap: 10px; min-height: 48px; }

.lvl { min-height: 96px; border-radius: 8px; border: 1.5px solid var(--rule); background: var(--card); padding: 10px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px; position: relative; }
.lvl .no { font-family: var(--f-code); font-size: 12px; color: var(--ink-soft); }

.summary { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 16px; font-family: var(--f-code); font-size: 13px; color: var(--ink-soft); }

/* ---------- Play ---------- */
.play { display: grid; gap: 12px; }
@media (min-width: 860px) { .play { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; } .play .board-col { position: sticky; top: 12px; } }
.board-col, .ledger-col { display: grid; gap: 10px; min-width: 0; }
.memo { background: var(--card); border-radius: 6px; padding: 10px 12px; box-shadow: var(--shadow); font-size: 14.5px; border-top: 3px solid var(--slot); }
.memo .from { font-family: var(--f-code); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); display: block; margin-bottom: 2px; }
.board-wrap { position: relative; display: grid; place-items: center; background: var(--card); border-radius: 8px; box-shadow: var(--shadow); padding: 8px; overflow: hidden; }
#board { display: block; touch-action: manipulation; }
.hud { display: flex; gap: 8px 14px; flex-wrap: wrap; font-family: var(--f-code); font-size: 13px; color: var(--ink-soft); align-items: center; }
.hud b { color: var(--ink); font-weight: 700; }
.hud .msg { flex-basis: 100%; color: var(--ink); font-family: var(--f-body); font-size: 14px; min-height: 1.4em; }

.ledger { background: var(--card); border-radius: 8px; box-shadow: var(--shadow); padding: 4px 0 8px; }
.ledger .line, .ledger .seal-line { border-bottom: 1px solid color-mix(in srgb, var(--rule) 70%, transparent); }
.sect { font-family: var(--f-code); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); padding: 12px 12px 4px; display: flex; justify-content: space-between; gap: 8px; }
.sect em { font-style: normal; letter-spacing: .02em; text-transform: none; }
.line { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; min-height: 48px; padding: 6px 12px 6px 8px; font-family: var(--f-code); font-size: 15px; position: relative; }
.line .ln { width: 22px; flex: none; text-align: right; color: var(--ink-soft); font-size: 12px; }
.line.active { background: color-mix(in srgb, var(--slot) 14%, transparent); }
.line.active .ln::before { content: '▶'; color: var(--slot); margin-right: 2px; }
.slot { min-height: 38px; min-width: 44px; padding: 4px 10px; border-radius: 6px; border: 1.5px solid var(--slot); background: var(--slot-bg); color: var(--slot); font-family: var(--f-code); font-weight: 700; font-size: 15px; cursor: pointer; }
.slot.empty { border-style: dashed; background: transparent; font-weight: 400; }
.slot.locked { border-color: transparent; background: transparent; color: var(--ink); cursor: pointer; padding-inline: 2px; font-weight: 700; }
.slot.sealed { border-color: transparent; background: transparent; color: var(--ink); padding-inline: 2px; }
.slot.hot { animation: pulse 1.4s ease-in-out infinite; }
.slot.took { box-shadow: 0 0 0 3px color-mix(in srgb, var(--slot) 45%, transparent); }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--slot) 30%, transparent); } }
.word { color: var(--ink); }
.lock-tag { font-size: 11px; color: var(--ink-soft); font-family: var(--f-body); }
.seal-tag { font-family: var(--f-display); font-size: 13px; color: var(--stamp); border: 1.5px solid var(--stamp); padding: 0 5px; border-radius: 3px; transform: rotate(-4deg); display: inline-block; letter-spacing: .06em; }
.seal-line { display: flex; gap: 10px; align-items: center; min-height: 48px; padding: 6px 12px; font-size: 14px; }
.seal-line .dot { width: 22px; height: 22px; flex: none; border-radius: 50%; border: 2px solid var(--stamp); display: grid; place-items: center; color: var(--stamp); font-size: 11px; font-family: var(--f-display); }
.seal-line.broken { background: color-mix(in srgb, var(--stamp) 14%, transparent); }
.seal-line.struck .txt { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--ink-soft); }
.seal-line .txt { flex: 1; min-width: 0; }
.seal-line .when { font-family: var(--f-code); font-size: 11px; color: var(--ink-soft); }
.pen-ink { font-family: var(--f-code); font-size: 13px; padding: 0 12px 4px; color: var(--stamp); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.tools .btn { min-height: 44px; padding: 0 14px; font-size: 14px; }
.inspector { font-family: var(--f-code); font-size: 12.5px; background: var(--card); border-radius: 8px; padding: 10px 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 12px; box-shadow: var(--shadow); }
.inspector .k { color: var(--ink-soft); }
.hintbox { font-size: 14px; background: var(--card); border-left: 3px solid var(--brass); padding: 8px 12px; border-radius: 0 6px 6px 0; }

/* Bottom control bar */
.controls { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-top: 1px solid var(--rule); padding: 8px max(16px, env(safe-area-inset-left, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; justify-content: center; }
.controls .btn { flex: 1; max-width: 200px; justify-content: center; min-height: 52px; padding: 0 8px; }
.controls .btn.small { flex: 0 0 64px; }

/* Picker sheet */
.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(10, 14, 20, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 78vh; overflow: auto; background: var(--card); border-radius: 14px 14px 0 0; padding: 14px max(16px, env(safe-area-inset-left, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); box-shadow: 0 -10px 30px rgba(0,0,0,.25); animation: rise .18s ease-out; }
@keyframes rise { from { transform: translateY(30px); opacity: .4; } }
.sheet h3 { margin: 0 0 4px; font-family: var(--f-code); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.sheet .ctx { font-family: var(--f-code); font-size: 14px; margin: 0 0 10px; }
.opts { display: grid; gap: 8px; }
.opt { min-height: 52px; text-align: left; padding: 8px 12px; border-radius: 8px; border: 1.5px solid var(--rule); background: var(--paper); cursor: pointer; display: grid; gap: 1px; }
.opt b { font-family: var(--f-code); font-size: 16px; }
.opt span { font-size: 13px; color: var(--ink-soft); }
.opt.sel { border-color: var(--slot); background: var(--slot-bg); }
.opt.clear b { color: var(--stamp); }
.opt kbd { float: right; font-family: var(--f-code); font-size: 11px; color: var(--ink-soft); }

/* Result card */
.result { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; padding: 10px; background: color-mix(in srgb, var(--card) 70%, transparent); }
.result .card { background: var(--card); border-radius: 10px; box-shadow: var(--shadow); padding: 16px; width: min(340px, 100%); display: grid; gap: 10px; text-align: center; border: 1.5px solid var(--rule); }
.result .big { font-family: var(--f-display); font-size: 40px; line-height: 1; letter-spacing: .03em; }
.result .big.win { color: var(--ok); }
.result .big.bad { color: var(--stamp); }
.result .stars { font-size: 26px; letter-spacing: 6px; color: var(--brass); }
.result .remark { font-family: var(--f-code); font-size: 14px; text-align: left; border-left: 3px solid var(--stamp); padding-left: 10px; min-height: 2.6em; }
.result .meta { font-family: var(--f-code); font-size: 12.5px; color: var(--ink-soft); }
.result .btn-row { justify-content: center; }
.stamp-void { font-family: var(--f-display); font-size: 64px; color: var(--stamp); border: 5px solid var(--stamp); padding: 0 14px; border-radius: 6px; transform: rotate(-9deg); display: inline-block; justify-self: center; animation: thunk .28s cubic-bezier(.2,1.6,.4,1); line-height: 1.05; }
.stamp-void.ok { color: var(--ok); border-color: var(--ok); font-size: 46px; }
@keyframes thunk { from { transform: rotate(-9deg) scale(2.4); opacity: 0; } }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius: 8px; font-size: 14px; max-width: min(92vw, 420px); box-shadow: var(--shadow); }
.confirm { display: grid; gap: 8px; }
.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
.finale-card { background: var(--card); border-radius: 10px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 12px; max-width: 560px; }
.finale-card h2 { font-family: var(--f-display); font-weight: 400; font-size: 34px; margin: 0; line-height: 1; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<script>
"use strict";
// Clause & Effect — single-file build. Sections: CONFIG, DATA, RULES (pure), STORAGE, AUDIO, STATE, RENDERER, UI, INPUT, BOOT.
/* ================= CONFIG ================= */
const CONFIG = {
  VERSION: 1,
  SAVE_KEY: 'clause-effect-save-v1',
  MAX_TICKS: 60,          // default patience per run
  TICK_MS: 260,           // animation time per tick at 1x
  FAST_MULT: 3,           // speed multiplier on fast mode
  CELL_MAX: 54,           // largest cell size in px
  REPEAT_COUNTS: [2, 3, 4, 5, 6, 8],
};

/* ================= DATA ================= */
const DIRS = { north: [0, -1], east: [1, 0], south: [0, 1], west: [-1, 0] };
const DIR_ORDER = ['north', 'east', 'south', 'west'];

// Commands the routine can hold. Action commands take one tick.
const COMMANDS = {
  step:   { label: 'step',        about: 'Move forward one stride.' },
  left:   { label: 'turn left',   about: 'Turn 90° to the left.' },
  right:  { label: 'turn right',  about: 'Turn 90° to the right.' },
  around: { label: 'turn around', about: 'Face the other way.' },
  wait:   { label: 'wait',        about: 'Do nothing for one tick.' },
  repeat: { label: 'repeat',      about: 'Do one action several ticks in a row.' },
  if:     { label: 'if',          about: 'Look one tile ahead, then pick one of two actions.' },
};
const ACTIONS = ['step', 'left', 'right', 'around', 'wait'];

const SENSES = {
  wall:  { label: 'wall ahead',  about: 'A filing wall is right in front.' },
  open:  { label: 'path ahead',  about: 'Pip could step forward without bumping.' },
  ink:   { label: 'ink ahead',   about: 'An ink spill is right in front.' },
  guard: { label: 'guard ahead', about: 'A guard is right in front.' },
  key:   { label: 'holding key', about: 'Pip is carrying the brass key.' },
};

// World clauses. Each has a sentence template with one slot.
const CLAUSES = {
  walls:  { pre: 'Walls are',              post: '.',                opts: { solid: 'solid', soft: 'soft' } },
  hatch:  { pre: 'The hatch',              post: '.',                opts: { fixed: 'stays put', follows: 'follows Pip' } },
  door:   { pre: 'The door opens',         post: '.',                opts: { key: 'with the key', anyone: 'for anyone' } },
  guards: { pre: 'Guards are',             post: '.',                opts: { alert: 'alert', asleep: 'asleep' } },
  ink:    { pre: 'Ink is',                 post: '.',                opts: { deadly: 'wet (it smudges Pip)', dry: 'dry' } },
  spare:  { pre: 'A spare hatch appears',  post: '.',                opts: { none: 'nowhere', under: 'under Pip' } },
  winOn:  { pre: 'Pip escapes by touching', post: '.',               opts: { hatch: 'the hatch', wall: 'any wall' } },
  stride: { pre: "Pip's stride is",        post: '.',                opts: { 1: '1 tile', 2: '2 tiles (a hop)' } },
  pace:   { pre: 'Guards move every',      post: '.',                opts: { 1: 'tick', 2: '2nd tick', 3: '3rd tick' } },
};
const CLAUSE_DEFAULTS = { walls: 'solid', hatch: 'fixed', door: 'key', guards: 'alert', ink: 'deadly', spare: 'none', winOn: 'hatch', stride: '1', pace: '1' };

// The Auditor's seals. "lock" seals freeze a clause; "run" seals inspect the run afterwards.
const SEALS = {
  walls:    { text: 'Walls stay solid.',                         lock: ['walls', 'solid'] },
  noCross:  { text: 'Pip may not pass through or hop over walls or locked doors.', run: t => !t.crossedWall },
  hatchFix: { text: 'The hatch must not move.',                  run: t => !t.hatchMoved },
  keyEsc:   { text: 'Pip must hold the key when escaping.',      run: t => t.hadKeyAtEnd || !t.levelHadKey },
  guards:   { text: 'Guards stay alert.',                        lock: ['guards', 'alert'] },
  oneHatch: { text: 'There is exactly one hatch.',               run: t => t.maxHatches <= 1 },
  hatchOnly:{ text: 'Escapes go through the hatch.',             lock: ['winOn', 'hatch'] },
  noInk:    { text: 'Pip may not touch ink, wet or dry.',        run: t => !t.touchedInk },
  door:     { text: 'The door opens with the key.',              lock: ['door', 'key'] },
  pen:      { text: 'The Pen holds ink for 2 strokes.',          static: (lv, led) => strokes(lv, led) <= 2 },
};

/* ================= LEVELS (content as data) =================
 Map legend: # wall  . floor  p Pip  H hatch  k key  D door  ~ ink  G guard(see guards[])
*/
const LEVELS = [
  {
    id: 'facing', name: 'Facing Facts',
    memo: 'Pip is an ink blot who wants out of the Registry. Pip does exactly what the ledger says. Tap the glowing word to change which way Pip starts.',
    remark: 'A clerk who reads the ledger. Acceptable.',
    hints: ['The hatch is to the east.', 'Set "Pip starts facing" to east, then Run.'],
    map: ['#######', '#.....#', '#p...H#', '#.....#', '#######'],
    face: { v: 'north' },
    routine: [{ cmd: 'step', lock: true }],
    palette: [], clauses: [], seals: [],
    sol: { face: 'east' },
  },
  {
    id: 'soft', name: 'Soft Paperwork',
    memo: 'A filing wall blocks the way. But the ledger also describes the world, and some of it is not sealed yet.',
    remark: 'Walls that are not walls. Irregular. I am sealing that clause.',
    hints: ['Look at the World section.', 'Make walls soft.'],
    map: ['#######', '#..#..#', '#p.#.H#', '#..#..#', '#######'],
    face: { v: 'east', lock: true },
    routine: [{ cmd: 'step', lock: true }],
    palette: [], clauses: [{ key: 'walls', v: 'solid' }], seals: [],
    sol: { clauses: { walls: 'soft' } },
  },
  {
    id: 'stairs', name: 'Stairwell Clause',
    memo: 'Sealed: walls stay solid. Write a routine instead. Pip reads one line per tick, top to bottom, then starts over.',
    remark: 'Four lines, a hundred steps. Loops are permitted. For now.',
    hints: ['The stairs go step, turn, step, turn.', 'step, turn right, step, turn left.'],
    map: ['#######', '#p.####', '##..###', '###..##', '####.H#', '#######'],
    face: { v: 'east', lock: true },
    routine: [{}, {}, {}, {}],
    palette: ['step', 'left', 'right', 'around', 'wait'],
    clauses: [{ key: 'walls', v: 'solid' }], seals: ['walls'],
    sol: { routine: ['step', 'right', 'step', 'left'] },
  },
  {
    id: 'follow', name: 'Come Here, Hatch',
    memo: 'This corridor twists too much for two lines. Who says Pip has to do the walking?',
    remark: 'The hatch came to you. Hatches do not do that. Sealing.',
    hints: ['Read the hatch clause.', 'Set the hatch to follow Pip. You can leave the routine empty.'],
    map: ['#######', '#p#...#', '#.#.#.#', '#...#H#', '#######'],
    face: { v: 'south', lock: true },
    routine: [{}, {}],
    palette: ['step', 'left', 'right', 'wait'],
    clauses: [{ key: 'walls', v: 'solid' }, { key: 'hatch', v: 'fixed' }], seals: ['walls'],
    sol: { clauses: { hatch: 'follows' }, routine: ['step'] },
  },
  {
    id: 'spiral', name: 'Bolted Down',
    memo: 'New seal: the hatch must not move. You can still edit the clause, but I will check. Pip can look before stepping now.',
    remark: 'One line that thinks. Good. Thinking is allowed. Bending is not.',
    hints: ['Use one "if" line.', 'if wall ahead → turn right, otherwise → step.'],
    map: ['#######', '#p....#', '#####.#', '#..H#.#', '#.###.#', '#.....#', '#######'],
    face: { v: 'east', lock: true },

/* ================= RULES (pure) ================= */
// Apply a reference solution (data) to a fresh ledger. Used for par and for tests.
function applySol(level, sol) {
  const led = freshLedger(level);
  if (sol.face) led.face = sol.face;
  if (sol.clauses) Object.assign(led.clauses, sol.clauses);
  if (sol.struck) Object.assign(led.struck, sol.struck);
  if (sol.routine) sol.routine.forEach((r, i) => { Object.assign(led.routine[i], typeof r === 'string' ? { cmd: r } : r); });
  return led;
}

function parseMap(level) {
  const rows = level.map;
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const tiles = [], hatches = [], keys = [];
  let pip = null;
  for (let y = 0; y < h; y++) {
    const row = [];
    for (let x = 0; x < w; x++) {
      const c = rows[y][x] || '#';
      if (c === 'p') { pip = { x, y }; row.push('.'); }
      else if (c === 'H') { hatches.push({ x, y }); row.push('.'); }
      else if (c === 'k') { keys.push({ x, y }); row.push('.'); }
      else if (c === 'G') row.push('.');
      else row.push(c);
    }
    tiles.push(row);
  }
  return { w, h, tiles, pip, hatches, keys };
}

// Build an editable ledger from level data (deep copy so edits never touch DATA).
function freshLedger(level) {
  return {
    face: level.face.v,
    routine: level.routine.map(l => ({ cmd: l.cmd || null, n: l.n || 3, act: l.act || 'step', sense: l.sense || (level.senses ? level.senses[0] : 'wall'), then: l.then || 'right', else: l.else || 'step' })),
    clauses: Object.fromEntries(level.clauses.map(c => [c.key, c.v])),
    struck: {},
  };
}

// Effective rule values: defaults, then the ledger's clauses, then seals that lock.
function resolveRules(level, ledger) {
  const r = Object.assign({}, CLAUSE_DEFAULTS, ledger.clauses);
  for (const s of level.seals) {
    if (ledger.struck[s]) continue;
    const seal = SEALS[s];
    if (seal.lock && !level.strikable) r[seal.lock[0]] = seal.lock[1];
  }
  return r;
}

// Which ledger slots count as Pen strokes in the finale: struck seals + changed clauses.
function strokes(level, ledger) {
  let n = Object.keys(ledger.struck).filter(k => ledger.struck[k]).length;
  for (const c of level.clauses) if (ledger.clauses[c.key] !== c.v) n++;
  return n;
}

function isLocked(level, kind, key) {
  // kind: 'clause' → a clause locked by data or by a lock seal (non-strikable levels)
  if (kind === 'clause') {
    const c = level.clauses.find(c => c.key === key);
    if (c && c.lock) return true;
    if (!level.strikable) for (const s of level.seals) if (SEALS[s].lock && SEALS[s].lock[0] === key) return true;
    return false;
  }
  return false;
}

function usedLines(ledger) { return ledger.routine.filter(l => l.cmd).length; }

function newSim(level, ledger) {
  const m = parseMap(level);
  return {
    w: m.w, h: m.h, tiles: m.tiles,
    pip: { x: m.pip.x, y: m.pip.y, dir: ledger.face, pc: 0, rep: 0, key: false },
    hatches: m.hatches.map(h => ({ ...h })), keys: m.keys.map(k => ({ ...k })),
    guards: (level.guards || []).map(g => ({ x: g.x, y: g.y, dir: g.dir })),
    tick: 0, status: 'run', reason: '',
    trace: { crossedWall: false, hatchMoved: false, hadKeyAtEnd: false, maxHatches: m.hatches.length, touchedInk: false, levelHadKey: m.keys.length > 0 },
    events: [],
  };
}

function inB(s, x, y) { return x >= 0 && y >= 0 && x < s.w && y < s.h; }
function tileAt(s, x, y) { return inB(s, x, y) ? s.tiles[y][x] : '#'; }
function doorOpen(s, rules) { return rules.door === 'anyone' || s.pip.key; }
function solidForPip(s, rules, x, y) {
  if (!inB(s, x, y)) return true;
  const t = s.tiles[y][x];
  if (t === '#') return rules.walls === 'solid' || x === 0 || y === 0 || x === s.w - 1 || y === s.h - 1;
  if (t === 'D') return !doorOpen(s, rules);
  return false;
}
function solidForGuard(s, rules, x, y, self) {
  if (!inB(s, x, y)) return true;
  const t = s.tiles[y][x];
  if (t === '#') return true;
  if (t === 'D') return !doorOpen(s, rules);
  return s.guards.some(g => g !== self && g.x === x && g.y === y);
}
function turn(dir, how) {
  const i = DIR_ORDER.indexOf(dir);
  if (how === 'left') return DIR_ORDER[(i + 3) % 4];
  if (how === 'right') return DIR_ORDER[(i + 1) % 4];
  if (how === 'around') return DIR_ORDER[(i + 2) % 4];
  return dir;
}
function ahead(s) { const d = DIRS[s.pip.dir]; return { x: s.pip.x + d[0], y: s.pip.y + d[1] }; }
function sense(s, rules, what) {
  const a = ahead(s);
  switch (what) {
    case 'wall': return tileAt(s, a.x, a.y) === '#';
    case 'open': return !solidForPip(s, rules, a.x, a.y);
    case 'ink': return tileAt(s, a.x, a.y) === '~';
    case 'guard': return s.guards.some(g => g.x === a.x && g.y === a.y);
    case 'key': return s.pip.key;
  }
  return false;
}

// Do one action; returns event name.
function doAction(s, rules, act, ev) {
  const p = s.pip;
  if (act === 'step') {
    const d = DIRS[p.dir], st = Number(rules.stride) || 1;
    const mx = p.x + d[0], my = p.y + d[1];
    const tx = p.x + d[0] * st, ty = p.y + d[1] * st;
    // A hop (stride 2) flies over the middle tile; it fails if the middle is off the map.
    let bx = null, by = null;
    if (st === 2 && !inB(s, mx, my)) { bx = mx; by = my; }
    else if (solidForPip(s, rules, tx, ty)) { bx = tx; by = ty; if (st === 2 && solidForPip(s, rules, mx, my)) { bx = mx; by = my; } }
    if (bx !== null) {
      ev.bump = { x: bx, y: by };
      if (tileAt(s, bx, by) === '#') ev.touchWall = true;
      return;
    }
    if (st === 2) {
      const mt = tileAt(s, mx, my);
      if (mt === '#' || (mt === 'D' && !doorOpen(s, rules))) s.trace.crossedWall = true;
    }
    ev.move = { fx: p.x, fy: p.y, hop: st === 2 };
    p.x = tx; p.y = ty;
    if (tileAt(s, p.x, p.y) === '#') { s.trace.crossedWall = true; ev.touchWall = true; }
  } else if (act === 'left' || act === 'right' || act === 'around') {
    p.dir = turn(p.dir, act); ev.turn = act;
  } else { ev.wait = true; }
}

function bfsStep(s, rules, from, to) {
  // One step from `from` toward `to` along tiles Pip could stand on (never through walls).
  const key = (x, y) => y * s.w + x, seen = new Map();
  const q = [[to.x, to.y]]; seen.set(key(to.x, to.y), null);
  while (q.length) {
    const [x, y] = q.shift();
    if (x === from.x && y === from.y) break;
    for (const d of DIR_ORDER) {
      const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
      if (!inB(s, nx, ny) || seen.has(key(nx, ny)) || tileAt(s, nx, ny) === '#') continue;
      if (tileAt(s, nx, ny) === 'D' && !doorOpen(s, rules)) continue;
      seen.set(key(nx, ny), [x, y]); q.push([nx, ny]);
    }
  }
  const prev = seen.get(key(from.x, from.y));
  return prev ? { x: prev[0], y: prev[1] } : null;
}

function onHatch(s) { return s.hatches.some(h => h.x === s.pip.x && h.y === s.pip.y); }

// Advance the simulation by one tick. Mutates and returns s (callers clone if needed).
function step(level, ledger, s) {
  if (s.status !== 'run') return s;
  const rules = resolveRules(level, ledger);
  const p = s.pip;
  s.tick++;
  const ev = { tick: s.tick };

  // Spare hatches are printed before Pip moves.
  if (rules.spare === 'under' && !onHatch(s)) { s.hatches.push({ x: p.x, y: p.y }); ev.spare = true; }
  s.trace.maxHatches = Math.max(s.trace.maxHatches, s.hatches.length);
  if (ev.spare && rules.winOn === 'hatch') { ev.line = -1; return finish(level, ledger, s, 'win', '', ev); }

  // Pip reads one routine line.
  const lines = ledger.routine.map((l, i) => ({ l, i })).filter(o => o.l.cmd);
  if (lines.length === 0) { ev.wait = true; ev.line = -1; }
  else {
    if (p.pc >= lines.length) p.pc = 0;
    const { l, i } = lines[p.pc];
    ev.line = i;
    let advance = true;
    if (l.cmd === 'repeat') {
      if (p.rep <= 0) p.rep = l.n;
      doAction(s, rules, l.act, ev);
      p.rep--; ev.rep = l.n - p.rep;
      if (p.rep > 0) advance = false;
    } else if (l.cmd === 'if') {
      const yes = sense(s, rules, l.sense); ev.branch = yes ? 'then' : 'else';
      doAction(s, rules, yes ? l.then : l.else, ev);
    } else doAction(s, rules, l.cmd, ev);
    if (advance) p.pc = (p.pc + 1) % lines.length;
  }

  // Pickups and hazards.
  const ki = s.keys.findIndex(k => k.x === p.x && k.y === p.y);
  if (ki >= 0) { s.keys.splice(ki, 1); p.key = true; ev.key = true; }
  const won = () => (rules.winOn === 'hatch' && onHatch(s)) || (rules.winOn === 'wall' && ev.touchWall);
  if (tileAt(s, p.x, p.y) === '~') {
    s.trace.touchedInk = true;
    if (rules.ink === 'deadly' && !won()) return finish(level, ledger, s, 'smudged', 'Pip stepped in wet ink and smudged.', ev);
  }
  if (won()) return finish(level, ledger, s, 'win', '', ev);

  // The hatch may wander toward Pip.
  if (rules.hatch === 'follows') {
    for (const h of s.hatches) {
      if (h.x === p.x && h.y === p.y) continue;
      const nx = bfsStep(s, rules, h, p);
      if (nx) { h.x = nx.x; h.y = nx.y; s.trace.hatchMoved = true; ev.hatchMove = true; }
    }
    if (rules.winOn === 'hatch' && onHatch(s)) return finish(level, ledger, s, 'win', '', ev);
  }

  // Guards patrol, then catch.
  if (rules.guards === 'alert' && s.guards.length) {
    const pace = Number(rules.pace) || 1;
    const before = s.guards.map(g => ({ x: g.x, y: g.y }));
    if (s.tick % pace === 0) {
      for (const g of s.guards) {
        let d = DIRS[g.dir];
        if (solidForGuard(s, rules, g.x + d[0], g.y + d[1], g)) { g.dir = turn(g.dir, 'around'); d = DIRS[g.dir]; }
        if (!solidForGuard(s, rules, g.x + d[0], g.y + d[1], g)) { g.x += d[0]; g.y += d[1]; }
      }
      ev.guardsMoved = true;
    }
    const pf = ev.move ? { x: ev.move.fx, y: ev.move.fy } : { x: p.x, y: p.y };
    for (let i = 0; i < s.guards.length; i++) {
      const g = s.guards[i], b = before[i];
      const same = g.x === p.x && g.y === p.y;
      const swap = b.x === p.x && b.y === p.y && g.x === pf.x && g.y === pf.y;
      if (same || swap) return finish(level, ledger, s, 'caught', 'A guard caught Pip.', ev);
    }
  }

  const max = level.maxTicks || CONFIG.MAX_TICKS;
  if (s.tick >= max) return finish(level, ledger, s, 'timeout', `Pip ran out of patience after ${max} ticks.`, ev);
  s.events.push(ev);
  return s;
}

function finish(level, ledger, s, status, reason, ev) {
  ev.end = status;
  s.events.push(ev);
  s.status = status; s.reason = reason;
  if (status === 'win') {
    s.trace.hadKeyAtEnd = s.pip.key;
    const broken = checkSeals(level, ledger, s.trace);
    if (broken) { s.status = 'void'; s.reason = broken; s.voidSeal = broken; }
  }
  return s;
}

function checkSeals(level, ledger, trace) {
  for (const id of level.seals) {
    if (ledger.struck[id]) continue;
    const seal = SEALS[id];
    if (seal.run && !seal.run(trace)) return seal.text;
    if (seal.static && !seal.static(level, ledger)) return seal.text;
    if (seal.lock && level.strikable && ledger.clauses[seal.lock[0]] !== undefined && ledger.clauses[seal.lock[0]] !== seal.lock[1]) return seal.text;
  }
  return null;
}

// Run to completion (used by tests and the star calculation).
function runAll(level, ledger) {
  const s = newSim(level, ledger);
  while (s.status === 'run') step(level, ledger, s);
  return s;
}

function computePars() {
  for (const lv of LEVELS) {
    const led = applySol(lv, lv.sol || {});
    const s = runAll(lv, led);
    lv.par = { ticks: s.tick, lines: usedLines(led), ok: s.status === 'win' };
  }
}

function starsFor(level, ledger, s) {
  if (s.status !== 'win') return 0;
  let st = 1;
  if (s.tick <= level.par.ticks) st++;
  if (usedLines(ledger) <= level.par.lines) st++;
  return st;
}

// Which loophole closed the finale? (for the ending collection)
function loopholeOf(level, ledger) {
  const r = resolveRules(level, ledger);
  if (r.spare === 'under' && ledger.struck.oneHatch) return 'forgery';
  if (r.winOn === 'wall' && ledger.struck.hatchOnly) return 'fineprint';
  if (r.hatch === 'follows' && ledger.struck.hatchFix) return 'summons';

      g.fillStyle = C.paper; g.beginPath(); g.arc(ox, oy, c * 0.075, 0, 7); g.fill();
      g.fillStyle = C.ink; g.beginPath(); g.arc(ox + dx * c * 0.03, oy + dy * c * 0.03, c * 0.035, 0, 7); g.fill();
    }
    if (key) { g.save(); g.translate(0, -c * 0.4); this.key(px, py, c * 0.7, look); g.restore(); }
  },
  // Smooth closed blob through n radial points (quadratic curves through midpoints).
  blob(cx, cy, n, rad, sy) {
    const g = this.g, pts = [];
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, r = rad(i); pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r * sy]); }
    g.beginPath();
    const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    let m = mid(pts[n - 1], pts[0]); g.moveTo(m[0], m[1]);
    for (let i = 0; i < n; i++) { const p = pts[i], q = pts[(i + 1) % n], mm = mid(p, q); g.quadraticCurveTo(p[0], p[1], mm[0], mm[1]); }
    g.closePath();
  },
  round(x, y, w, h, r) { const g = this.g; g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); },
};

const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
let toastTimer = null;

  t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}
const app = () => $('#app');
function totalStars() { return Object.values(Storage.data.stars).reduce((a, b) => a + b, 0); }

  }).join('');

function renderPlay() {

  const lv = State.level();
  $('#lname').textContent = `${State.li + 1}. ${lv.name}`;

  renderLedger(); renderHud(); renderControls(); renderHint(); renderInspector();
}

function slotBtn(kind, i, text, extra = '') { return `<button class="slot ${extra}" data-k="${kind}" data-i="${i}">${esc(text)}</button>`; }

function renderLedger() {
  const lv = State.level(), led = State.ledger, rules = resolveRules(lv, led);
  const activeLine = State.sim && State.sim.events.length ? State.sim.events[State.sim.events.length - 1].line : null;
  const hot = !State.edited && State.li <= 1;
  let h = '';
  h += `<div class="sect"><span>Pip</span></div>`;
  h += `<div class="line"><span class="ln"></span><span class="word">Pip starts facing</span>${lv.face.lock ? `<span class="slot locked" data-k="lockedface">${led.face}</span>` : slotBtn('face', 0, led.face, hot && State.li === 0 ? 'hot' : '')}</div>`;
  h += `<div class="sect"><span>Routine</span><em>one line per tick, then it loops</em></div>`;
  led.routine.forEach((l, i) => {
    const src = lv.routine[i];
    const act = activeLine === i && State.sim && (State.running || State.sim.status !== 'run') ? 'active' : '';
    if (src.lock) {
      h += `<div class="line ${act}" data-line="${i}"><span class="ln">${i + 1}</span><span class="slot locked" data-k="lockedline">${esc(lineText(l))}</span><span class="lock-tag">🔒 fixed</span></div>`;
      return;
    }
    let inner = slotBtn('cmd', i, l.cmd ? COMMANDS[l.cmd].label : '+ write a line', l.cmd ? '' : 'empty');
    if (l.cmd === 'repeat') inner += slotBtn('n', i, String(l.n)) + `<span class="word">×</span>` + slotBtn('act', i, COMMANDS[l.act].label);
    if (l.cmd === 'if') inner += slotBtn('sense', i, SENSES[l.sense].label) + `<span class="word">→</span>` + slotBtn('then', i, COMMANDS[l.then].label) + `<span class="word">else</span>` + slotBtn('else', i, COMMANDS[l.else].label);
    h += `<div class="line ${act}" data-line="${i}"><span class="ln">${i + 1}</span>${inner}</div>`;
  });
  if (lv.clauses.length) {
    h += `<div class="sect"><span>World</span><em>the Registry's clauses</em></div>`;
    for (const c of lv.clauses) {
      const def = CLAUSES[c.key], v = led.clauses[c.key];
      const sealedBy = !lv.strikable && lv.seals.find(s => SEALS[s].lock && SEALS[s].lock[0] === c.key);
      let slot;
      if (c.lock) slot = `<span class="slot locked" data-k="lockedclause" data-key="${c.key}">${esc(def.opts[v])}</span><span class="lock-tag">🔒 fixed</span>`;
      else if (sealedBy) slot = `<span class="slot sealed" data-k="sealedclause" data-seal="${sealedBy}">${esc(def.opts[rules[c.key]])}</span><span class="seal-tag">SEALED</span>`;
      else slot = slotBtn('clause', c.key, def.opts[v], hot && State.li === 1 ? 'hot' : '');
      h += `<div class="line"><span class="ln"></span><span class="word">${esc(def.pre)}</span>${slot}</div>`;
    }
  }
  if (lv.seals.length) {
    h += `<div class="sect"><span>The Auditor's seals</span><em>${lv.strikable ? 'tap a seal to strike it' : 'checked on every escape'}</em></div>`;
    if (lv.strikable) { const used = strokes(lv, led); h += `<div class="pen-ink">Pen ink: ${'●'.repeat(Math.max(0, 2 - used))}${'○'.repeat(Math.min(2, used))} ${used > 2 ? `(over by ${used - 2})` : `(${2 - used} left)`}</div>`; }
    for (const id of lv.seals) {
      const s = SEALS[id], struck = !!led.struck[id], broken = State.brokenSeal === s.text;
      const when = s.lock ? (lv.strikable ? 'checks the clause' : 'locks a clause') : 'checked at the end';
      const tag = lv.strikable && id !== 'pen' ? 'button' : 'div';
      h += `<${tag} class="seal-line ${struck ? 'struck' : ''} ${broken ? 'broken' : ''}" ${tag === 'button' ? `data-k="strike" data-i="${id}" style="width:100%;text-align:left;border:0;background:none;cursor:pointer"` : ''}><span class="dot">§</span><span class="txt">${esc(s.text)}</span><span class="when">${struck ? 'struck out' : (id === 'pen' ? 'permanent ink' : when)}</span></${tag}>`;
    }
  }
  const el = $('#ledger'); el.innerHTML = h;
  el.querySelectorAll('[data-k]').forEach(b => b.onclick = () => onSlot(b));
}

function lineText(l) {
  if (!l.cmd) return '(blank)';
  if (l.cmd === 'repeat') return `repeat ${l.n} × ${COMMANDS[l.act].label}`;
  if (l.cmd === 'if') return `if ${SENSES[l.sense].label} → ${COMMANDS[l.then].label} else ${COMMANDS[l.else].label}`;
  return COMMANDS[l.cmd].label;
}

function onSlot(b) {
  Sound.init();
  const k = b.dataset.k, i = b.dataset.i, lv = State.level(), led = State.ledger;
  if (k === 'lockedline' || k === 'lockedface' || k === 'lockedclause') { Sound.sfx('bump'); toast('That line is fixed by the Registry.'); return; }
  if (k === 'sealedclause') { Sound.sfx('bump'); toast(`Sealed by the Auditor: ${SEALS[b.dataset.seal].text}`); return; }
  if (k === 'strike') {
    led.struck[i] = !led.struck[i]; if (!led.struck[i]) delete led.struck[i];
    Sound.sfx('stroke'); edited(); return;
  }
  Sound.sfx('tap');
  const L = led.routine[i];
  const pick = (title, ctx, options, cur, apply, extra) => openPicker({ title, ctx, options, cur, extra, onPick: v => { apply(v); Sound.sfx('pick'); edited(b); } });
  if (k === 'face') pick('Pip starts facing', 'Which way Pip looks before the first tick.', DIR_ORDER.map(d => ({ v: d, label: d })), led.face, v => led.face = v);
  else if (k === 'clause') { const def = CLAUSES[i]; pick(def.pre + ' …', 'A clause of the Registry. Seals may still check the result.', Object.entries(def.opts).map(([v, label]) => ({ v, label })), led.clauses[i], v => led.clauses[i] = v); }
  else if (k === 'cmd') {
    const opts = lv.palette.map(c => ({ v: c, label: COMMANDS[c].label, about: COMMANDS[c].about }));
    if (L.cmd) opts.push({ v: null, label: 'erase this line', about: 'Blank lines are skipped and take no time.', clear: true });
    pick(`Line ${+i + 1}`, 'Pick what Pip does on this line.', opts, L.cmd, v => {
      L.cmd = v;
      if (v === 'if' && !(lv.senses || []).includes(L.sense)) L.sense = (lv.senses || ['wall'])[0];
    });
  } else if (k === 'n') pick('Repeat how many ticks?', lineText(L), CONFIG.REPEAT_COUNTS.map(n => ({ v: n, label: n + ' ticks' })), L.n, v => L.n = v);
  else if (k === 'act' || k === 'then' || k === 'else') {
    const ctx = k === 'act' ? 'The action to repeat.' : k === 'then' ? `What Pip does when "${SENSES[L.sense].label}" is true.` : `What Pip does otherwise.`;
    pick(k === 'act' ? 'Repeat which action?' : k === 'then' ? 'Then' : 'Else', ctx, ACTIONS.map(a => ({ v: a, label: COMMANDS[a].label, about: COMMANDS[a].about })), L[k], v => L[k] = v);
  } else if (k === 'sense') pick('If Pip sees…', 'Pip looks one tile ahead (or at its own hands).', (lv.senses || []).map(s => ({ v: s, label: SENSES[s].label, about: SENSES[s].about })), L.sense, v => L.sense = v);
}

// Plain-language description of whatever is on a tile (tap the board to learn the pieces).
function tileInfo(x, y) {
  const lv = State.level(), s = State.sim || newSim(lv, State.ledger), r = resolveRules(lv, State.ledger);
  if (x < 0 || y < 0 || x >= s.w || y >= s.h) return '';
  if (s.pip.x === x && s.pip.y === y) return `Pip, facing ${s.pip.dir}${s.pip.key ? ', holding the key' : ''}. Pip follows the routine one line per tick.`;
  const g = s.guards.find(q => q.x === x && q.y === y);
  if (g) return r.guards === 'alert' ? `A guard walking ${g.dir}. It turns around at walls and catches Pip on the same tile.` : 'A sleeping guard. Pip can tiptoe past.';
  if (s.hatches.some(h => h.x === x && h.y === y)) return 'The hatch. Reach it to escape.';
  if (s.keys.some(k => k.x === x && k.y === y)) return lv.keyLook === 'pen' ? "The Auditor's Pen. It also works as the key." : 'The brass key. Pip picks it up by stepping on it.';
  const t = s.tiles[y][x];
  if (t === '#') return r.walls === 'soft' && x > 0 && y > 0 && x < s.w - 1 && y < s.h - 1 ? 'A soft wall. Pip can walk through it.' : 'A filing wall. Solid.';
  if (t === '~') return r.ink === 'dry' ? 'Dry ink. Harmless, unless a seal forbids touching it.' : 'Wet ink. Pip smudges if it steps here.';
  if (t === 'D') return doorOpen(s, r) ? 'An open door.' : 'A locked door. It opens while Pip holds the key.';
  return 'Floor.';
}

function edited() {
  const lv = State.level();
  State.edited = true; Storage.data.drafts[lv.id] = JSON.parse(JSON.stringify(State.ledger)); Storage.save();
  stopRun(); State.sim = null; State.brokenSeal = null; hideResult();
  renderPlay();
}

/* ---------- Picker sheet ---------- */
function openSheet(html, wire) {

  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;

  document.body.appendChild(bg);

  const first = bg.querySelector('.opt.sel') || bg.querySelector('.opt'); first && first.focus();
}
function closeSheet() { const s = $('#sheetbg'); if (s) s.remove(); State.picker = null; }
function openPicker(p) {
  State.picker = p;
  const opts = p.options.map((o, n) => `<button class="opt ${o.v === p.cur ? 'sel' : ''} ${o.clear ? 'clear' : ''}" data-n="${n}"><b>${esc(o.label)}<kbd>${n + 1}</kbd></b>${o.about ? `<span>${esc(o.about)}</span>` : ''}</button>`).join('');

/* ---------- Running ---------- */
function tickMs() { return CONFIG.TICK_MS / (State.fast ? CONFIG.FAST_MULT : 1); }
function ensureSim() {
  const lv = State.level();
  if (!State.sim || State.sim.status !== 'run') { State.sim = newSim(lv, State.ledger); State.path = [{ x: State.sim.pip.x, y: State.sim.pip.y }]; State.brokenSeal = null; hideResult(); }
}
function toggleRun() {
  if (State.running) { stopRun(); renderControls(); return; }
  ensureSim(); State.running = true; renderControls(); loop();
}
function stopRun() { State.running = false; clearTimeout(State.timer); State.timer = null; }
function loop() {
  if (!State.running) return;
  advance();
  if (State.sim && State.sim.status === 'run') State.timer = setTimeout(loop, tickMs());
  else { State.running = false; renderControls(); }
}
function stepOnce() { stopRun(); ensureSim(); advance(); renderControls(); }
function resetBoard() { stopRun(); State.sim = null; State.brokenSeal = null; hideResult(); renderLedger(); renderHud(); renderControls(); renderInspector(); }

function advance() {
  const lv = State.level(), s = State.sim; if (!s || s.status !== 'run') return;
  const from = snapshot(s);
  step(lv, State.ledger, s);
  const ev = s.events[s.events.length - 1];
  Render.anim = { from, to: snapshot(s), t0: performance.now(), dur: tickMs() * 0.92, ev };
  State.path.push({ x: s.pip.x, y: s.pip.y });
  const c = Render.cell, cx = s.pip.x * c + c / 2, cy = s.pip.y * c + c / 2;
  if (ev.move) Sound.sfx(ev.move.hop ? 'hop' : 'step');
  else if (ev.bump) Sound.sfx('bump');
  else if (ev.turn) Sound.sfx('turn');
  if (ev.key) { Sound.sfx('key'); setTimeout(() => { Render.burst(cx, cy, Render.colors.brass, 14); Render.float('key!', cx, cy - c * 0.3, Render.colors.brass); }, tickMs() * 0.8); }
  if (ev.hatchMove) Sound.sfx('hatch');
  if (ev.guardsMoved) Sound.sfx('guard');
  if (ev.spare) Render.float('printed!', cx, cy - c * 0.4, Render.colors.brass);
  renderLedger(); renderHud(); renderInspector();
  if (s.status !== 'run') setTimeout(() => endRun(s), Math.min(420, tickMs() + 60));
}

function endRun(s) {
  if (State.sim !== s) return;
  const lv = State.level(), c = Render.cell, cx = s.pip.x * c + c / 2, cy = s.pip.y * c + c / 2;
  const d = Storage.data;
  if (s.status === 'win') {
    Sound.sfx('win'); Render.burst(cx, cy, Render.colors.brass, 26, 3); Render.burst(cx, cy, Render.colors.slot, 18, 2.4);
    const stars = starsFor(lv, State.ledger, s), prev = d.stars[lv.id] || 0;
    d.stars[lv.id] = Math.max(prev, stars);
    const b = d.best[lv.id]; if (!b || s.tick < b.ticks) d.best[lv.id] = { ticks: s.tick, lines: usedLines(State.ledger) };
    if (State.li + 1 >= d.unlocked && State.li + 1 < LEVELS.length) d.unlocked = State.li + 2;
    let ending = null;
    if (lv.strikable) { ending = loopholeOf(lv, State.ledger); d.endings[ending] = true; }
    Storage.save();
    if (lv.strikable) { setTimeout(() => showFinale(ending, s), 700); return; }
    showResult(`
      <div class="big win">ESCAPED</div>
      <div class="stars" aria-label="${stars} of 3 stars">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
      <div class="meta">${s.tick} ticks (par ${lv.par.ticks}) · ${usedLines(State.ledger)} routine lines (par ${lv.par.lines})</div>
      <div class="remark" id="remark"></div>
      <div class="btn-row">${State.li + 1 < LEVELS.length ? '<button class="btn primary" id="next">Next level ▶</button>' : ''}<button class="btn" id="again">Replay</button></div>`);
    typewrite($('#remark'), 'The Auditor: ' + lv.remark);
    const nb = $('#next'); if (nb) { nb.onclick = () => openLevel(State.li + 1); nb.focus(); }
    $('#again').onclick = () => { resetBoard(); };
  } else if (s.status === 'void') {
    Sound.sfx('void'); Render.shake = 14; State.brokenSeal = s.voidSeal; renderLedger();
    showResult(`
      <div class="stamp-void">VOID</div>
      <div class="remark">Pip reached the exit, but the run broke a seal: <b>${esc(s.reason)}</b></div>
      <div class="btn-row"><button class="btn primary" id="edit">Back to the ledger</button></div>`);
    $('#edit').onclick = () => { resetBoard(); State.brokenSeal = s.voidSeal; renderLedger(); }; $('#edit').focus();
  } else {
    const label = { caught: 'CAUGHT', smudged: 'SMUDGED', timeout: 'STALLED' }[s.status];
    Sound.sfx(s.status === 'timeout' ? 'timeout' : s.status === 'smudged' ? 'smudge' : 'caught'); Render.shake = s.status === 'timeout' ? 0 : 10;
    if (s.status === 'smudged') Render.burst(cx, cy, Render.colors.spill, 20, 2);
    $('#bw').classList.remove('shake'); void $('#bw').offsetWidth; if (s.status !== 'timeout') $('#bw').classList.add('shake');
    showResult(`
      <div class="big bad">${label}</div>
      <div class="remark">${esc(s.reason)} (tick ${s.tick})</div>
      <div class="btn-row"><button class="btn primary" id="edit">Edit the ledger</button><button class="btn" id="hint2">Hint</button></div>`);
    $('#edit').onclick = resetBoard; $('#edit').focus();
    $('#hint2').onclick = () => { resetBoard(); showHint(); };
  }
}
function showResult(html) { const r = $('#result'); if (!r) return; r.className = 'result'; r.innerHTML = `<div class="card">${html}</div>`; r.hidden = false; }
function hideResult() { const r = $('#result'); if (r) { r.hidden = true; r.innerHTML = ''; } }
function typewrite(el, text) {
  if (!el) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = text; return; }
  let n = 0; const t = setInterval(() => { if (!el.isConnected) return clearInterval(t); el.textContent = text.slice(0, ++n); if (n >= text.length) clearInterval(t); }, 22);
}

function renderHud() {
  const lv = State.level(), s = State.sim;
  const max = lv.maxTicks || CONFIG.MAX_TICKS;
  const best = Storage.data.best[lv.id], st = Storage.data.stars[lv.id] || 0;
  const msg = !s ? (State.edited ? 'Ready. Press Run.' : 'Tap a glowing slot to rewrite it, then press Run.') : s.status === 'run' ? (s.pip.key ? 'Pip has the key.' : 'Running…') : '';
  $('#hud').innerHTML = `<span>Tick <b>${s ? s.tick : 0}</b>/${max}</span><span>Par <b>${lv.par.ticks}</b> ticks · <b>${lv.par.lines}</b> lines</span><span>Best <b>${best ? best.ticks : '–'}</b></span><span aria-label="${st} stars">${'★'.repeat(st)}${'☆'.repeat(3 - st)}</span><span class="msg">${msg}</span>`;
}
function renderControls() {
  const r = $('#run'); if (!r) return;
  const done = State.sim && State.sim.status !== 'run';
  r.textContent = State.running ? '❚❚ Pause' : (State.sim && State.sim.tick > 0 && !done ? '▶ Resume' : '▶ Run');
  r.classList.toggle('hot', !State.running && State.edited && !State.sim && State.li <= 1);
  $('#speed').textContent = State.fast ? '3×' : '1×';
}
function showHint() {
  const lv = State.level();
  if (!lv.hints.length) { toast('No hints here. Everything you need, you have already used.'); return; }
  State.hintShown = Math.min(lv.hints.length, State.hintShown + 1);
  Storage.data.hints[lv.id] = State.hintShown; Storage.save(); renderHint();
}
function renderHint() {
  const lv = State.level(), n = State.hintShown;
  $('#hintbox').innerHTML = n ? lv.hints.slice(0, n).map((h, i) => `<div class="hintbox"><b>Hint ${i + 1}.</b> ${esc(h)}</div>`).join('') : '';
  const hb = $('#hint'); if (hb) { hb.textContent = n >= lv.hints.length ? 'All hints shown' : `Hint (${n}/${lv.hints.length})`; hb.disabled = !lv.hints.length || n >= lv.hints.length; }
}
function renderInspector() {
  const box = $('#inspect'); if (!box) return;
  if (!Storage.data.settings.inspect) { box.innerHTML = ''; return; }
  const lv = State.level(), s = State.sim || newSim(lv, State.ledger), r = resolveRules(lv, State.ledger), t = s.trace;
  box.innerHTML = `<div class="inspector">
    <span><span class="k">tick</span> ${s.tick}</span><span><span class="k">Pip</span> (${s.pip.x},${s.pip.y}) ${s.pip.dir}</span>
    <span><span class="k">holding key</span> ${s.pip.key}</span><span><span class="k">hatches</span> ${s.hatches.length} (max ${t.maxHatches})</span>
    <span><span class="k">hatch moved</span> ${t.hatchMoved}</span><span><span class="k">crossed wall</span> ${t.crossedWall}</span>
    <span><span class="k">touched ink</span> ${t.touchedInk}</span><span><span class="k">stride</span> ${r.stride}</span>
    <span><span class="k">walls</span> ${r.walls}</span><span><span class="k">guards</span> ${r.guards} / every ${r.pace}</span>
  </div>`;
}

/* ---------- Finale ---------- */
function showFinale(endingKey, s) {
  stopRun(); State.screen = 'finale';
  const e = ENDINGS[endingKey], d = Storage.data, found = Object.keys(d.endings).filter(k => k !== 'other').length;
  app().innerHTML = `
  <div class="screen title-screen">
    <div class="form-no">Registry form 0 · Exit granted</div>
    <div class="stamp-void ok">APPROVED</div>
    <div class="finale-card">
      <h2>${esc(e.name)}</h2>
      <p class="lede">${esc(e.line)} Pip drops through the hatch and out of the Registry for good.</p>
      <p class="lede">The Auditor stares at the ledger for a long time, then writes one more line: <i>"Request: transfer to a department with fewer ink blots."</i></p>
      <div class="summary"><span>Loopholes found <b>${found}</b> / 5</span><span>Stars <b>${totalStars()}</b> / ${LEVELS.length * 3}</span></div>
      <p class="fineprint">The final audit has five different loopholes that fit in two strokes of ink. Each one counts once.</p>
      <div class="btn-row"><button class="btn primary" id="again">Find another loophole</button><button class="btn" id="lv">All levels</button></div>
    </div>
  </div>`;
  const c = document.createElement('canvas'); c.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%'; document.body.appendChild(c);
  confetti(c);
  $('#again').onclick = () => { const lv = LEVELS[LEVELS.length - 1]; delete d.drafts[lv.id]; Storage.save(); openLevel(LEVELS.length - 1); };
  $('#lv').onclick = showLevels; $('#again').focus();
}
function confetti(cv) {
  const g = cv.getContext('2d'), W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = [Render.colors.stamp, Render.colors.brass, Render.colors.slot, Render.colors.ink];
  const ps = Array.from({ length: 90 }, () => ({ x: Math.random() * W, y: -Math.random() * H * 0.5, vy: 1.5 + Math.random() * 2.5, vx: (Math.random() - 0.5) * 1.5, r: Math.random() * 6, a: Math.random() * 6, c: cols[Math.floor(Math.random() * 4)] }));
  let n = 0; (function f() { g.clearRect(0, 0, W, H); for (const p of ps) { p.y += p.vy; p.x += p.vx; p.a += 0.1; g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.fillRect(-4, -2, 8, 4 + p.r); g.restore(); } if (++n < 260) requestAnimationFrame(f); else cv.remove(); })();
}

/* ================= INPUT (keyboard + touch map to the same actions) ================= */
document.addEventListener('keydown', e => {
  if (State.picker || $('#sheetbg')) {
    if (e.key === 'Escape') { closeSheet(); e.preventDefault(); }
    const n = parseInt(e.key, 10);
    if (State.picker && n >= 1 && n <= State.picker.options.length) { const p = State.picker, o = p.options[n - 1]; closeSheet(); p.onPick(o.v); e.preventDefault(); }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      const list = [...document.querySelectorAll('#sheetbg .opt')], i = list.indexOf(document.activeElement);
      const j = (i + (e.key === 'ArrowDown' ? 1 : -1) + list.length) % list.length; list[j] && list[j].focus(); e.preventDefault();
    }
    return;
  }
  if (State.screen !== 'play') return;
  const onButton = document.activeElement && document.activeElement.tagName === 'BUTTON';
  if ((e.key === ' ' || e.key === 'Enter') && !onButton) { e.preventDefault(); Sound.init(); toggleRun(); }
  else if (e.key === ' ' && onButton && document.activeElement.id === 'run') { /* default click */ }
  else if (e.key.toLowerCase() === 's' && !e.metaKey && !e.ctrlKey) { Sound.init(); stepOnce(); }
  else if (e.key.toLowerCase() === 'r' && !e.metaKey && !e.ctrlKey) resetBoard();
  else if (e.key.toLowerCase() === 'h') showHint();
  else if (e.key === 'Escape') showLevels();
});
document.addEventListener('pointerdown', () => Sound.init(), { once: true });
document.addEventListener('visibilitychange', () => Sound.syncMusic());
window.addEventListener('resize', () => { if (State.screen === 'play') Render.resize(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => Render.readColors());

function rafLoop(now) { try { Render.frame(now); } catch (e) { console.error(e); } requestAnimationFrame(rafLoop); }

/* ================= BOOT ================= */
function boot() {
  Storage.load(); applyTheme();
  showTitle();
  requestAnimationFrame(rafLoop);
}
boot();

</script>
