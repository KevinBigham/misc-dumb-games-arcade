<title>Kettle Crawl</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800;9..144,900&family=Alegreya+Sans:wght@500;700;800&display=swap');
:root{--cu:#c7773c;--cu2:#e8a062;--po:#f3eadb;--po2:#d8c8ae;--ink:#2a1c13;--tea:#9aae58;--em:#e2552c;--hp:#c9474f;--au:#e9c25c;--bl:#8cb6c9;--mut:#b49e84;--fd:'Fraunces',Georgia,'Times New Roman',serif;--fb:'Alegreya Sans','Trebuchet MS',Verdana,sans-serif;--cw:78px;--hh:140px;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;background:#1a120d;color:#f3eadb;overflow:hidden}
body{font-family:var(--fb);font-size:calc(max(12px,16px) * var(--gk-text-scale,1));line-height:1.3;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:fixed;inset:0;overflow:hidden;background:#1a120d radial-gradient(130% 75% at 50% -5%,#432a17 0%,#24170f 50%,#140d09 100%)}
#app:before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 40px),repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 2px,transparent 2px 80px)}
#stage{position:absolute;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
#top{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-top:6px}
#top:empty{display:none}
.pill{display:flex;align-items:center;gap:5px;height:36px;padding:0 10px;border-radius:18px;background:#2c1e14;border:1px solid #5a3d27;font-weight:800;font-size:calc(max(12px,15px) * min(var(--gk-text-scale,1),1.25));color:#f3eadb;white-space:nowrap}
.pill svg{font-size:18px}.pill.hp svg{color:#d9545c}.pill.au svg{color:#e9c25c}.pill.dp svg{color:#c7c2a8}
.grow{flex:1}
.ib{width:44px;height:44px;border-radius:12px;background:#2c1e14;border:1px solid #5a3d27;color:#e8a062;display:grid;place-items:center;font-size:22px;padding:0}
#rels{flex-basis:100%;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-height:0}
#rels:empty{display:none}
.rel{width:44px;height:44px;flex:none;display:grid;place-items:center;color:#e9c25c;background:radial-gradient(circle,#3a2818 0,#3a281800 70%);border:0;font-size:26px;padding:0;border-radius:10px}
.rel.pulse{animation:rpulse .5s}
@keyframes rpulse{50%{transform:scale(1.35);color:#fff3c4}}
#view{flex:1;min-height:0;position:relative}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:10px 0 28px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
h1,h2,h3{font-family:var(--fd);margin:0;color:#f3eadb;letter-spacing:.01em}
h2{font-size:26px;font-weight:800;text-align:center;color:#e8a062}
.sub{text-align:center;color:#b49e84;margin:4px 0 12px;font-size:calc(max(12px,15px) * var(--gk-text-scale,1))}
.btn{min-height:48px;padding:10px 20px;border-radius:14px;border:2px solid #e8a062;background:linear-gradient(#d7894f,#a65a2a);color:#24160d;font:800 calc(max(12px,18px) * var(--gk-text-scale,1)) var(--fd);box-shadow:0 4px 0 #6a3415,0 6px 14px rgba(0,0,0,.4);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #6a3415}
.btn.ghost{background:#2c1e14;color:#f3eadb;border-color:#6b4a30;box-shadow:0 3px 0 #120b07}
.btn.big{font-size:calc(max(12px,22px) * var(--gk-text-scale,1));min-height:60px;padding:12px 30px}
.btn:disabled{opacity:.4;filter:grayscale(.6);cursor:default}
.col{display:flex;flex-direction:column;align-items:center;gap:12px}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
/* title */
.title{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:4vh;text-align:center}
.logo{font:900 clamp(46px,13vw,84px)/.9 var(--fd);color:#e8a062;text-shadow:0 3px 0 #6a3415,0 8px 30px rgba(226,85,44,.35);margin:0}
.logo small{display:block;font:700 calc(max(12px,15px) * var(--gk-text-scale,1)) var(--fb);letter-spacing:.32em;color:#b49e84;text-shadow:none;margin-top:10px;text-transform:uppercase}
.tcv{width:200px;height:150px}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stat{background:#2a1c13;border:1px solid #4d3422;border-radius:12px;padding:6px 12px;min-width:76px}
.stat b{display:block;font:800 calc(max(12px,20px) * var(--gk-text-scale,1)) var(--fd);color:#f3eadb}.stat span{font-size:calc(max(12px,12px) * var(--gk-text-scale,1));color:#b49e84;text-transform:uppercase;letter-spacing:.08em}
.prog{width:min(360px,100%);text-align:left}
.prog .lb{display:flex;justify-content:space-between;font-size:calc(max(12px,14px) * var(--gk-text-scale,1));color:#d8c8ae;margin-bottom:4px;gap:8px}
.track{height:14px;border-radius:7px;background:#120b07;border:1px solid #5a3d27;overflow:hidden}
.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6f8a3a,#b3c766);border-radius:7px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
/* witch select */
.witches{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.wcard{width:min(300px,100%);background:#2a1c13;border:2px solid #5a3d27;border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.wcard canvas{width:120px;height:120px}
.wcard h3{font-size:calc(max(12px,22px) * var(--gk-text-scale,1))}.wcard .wsub{color:#e8a062;font-weight:800;font-size:calc(max(12px,14px) * var(--gk-text-scale,1));letter-spacing:.1em;text-transform:uppercase}
.wcard p{margin:2px 0;color:#d8c8ae;font-size:calc(max(12px,15px) * var(--gk-text-scale,1))}
.wcard.locked{opacity:.6}
.tog{display:flex;align-items:center;gap:10px;justify-content:center;min-height:44px;padding:4px 14px;border-radius:12px;background:#2a1c13;border:1px solid #5a3d27}
/* map */
.mapw{position:relative;margin:0 auto;width:min(420px,100%)}
.mapw svg.ln{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px solid #6b4a30;background:radial-gradient(circle at 35% 30%,#f7efe2,#cdbb9e);color:#3a2618;display:grid;place-items:center;font-size:30px;padding:0}
.node .nl{position:absolute;top:66px;left:50%;transform:translateX(-50%);font:800 calc(max(12px,13px) * min(var(--gk-text-scale,1),1.25)) var(--fb);color:#d8c8ae;white-space:nowrap;letter-spacing:.04em}
.node.elite{color:#9b2c1c}.node.boss{width:84px;height:84px;margin:-42px 0 0 -42px;font-size:44px;color:#7a2a12;border-color:#c7773c}
.node.boss .nl{top:88px}
.node.cur{border-color:#e8a062;box-shadow:0 0 0 4px rgba(232,160,98,.25),0 0 24px rgba(232,160,98,.5);animation:npulse 1.3s ease-in-out infinite}
.node.done{background:radial-gradient(circle at 35% 30%,#9aae58,#5e6f2e);color:#1d2410;border-color:#b3c766}
.node.past{opacity:.28;filter:grayscale(1)}.node.fut{opacity:.75}
@keyframes npulse{50%{transform:scale(1.08)}}
/* combat */
#cb{position:absolute;inset:0;display:flex;flex-direction:column}
#ens{flex:1;min-height:120px;display:flex;justify-content:center;align-items:flex-end;gap:4px;position:relative}
.en{display:flex;flex-direction:column;align-items:center;position:relative;transition:transform .12s,opacity .35s;border-radius:16px;padding:2px 2px 4px}
.en canvas{display:block}
.en.kt{box-shadow:0 0 0 3px #e9c25c}
.en.tg{background:radial-gradient(ellipse at 50% 60%,rgba(232,160,98,.22),rgba(232,160,98,0) 70%)}
.en.kb{transform:translateX(10px) rotate(3deg)}
.en.lunge{transform:translateY(16px) scale(1.06)}
.en.dead{opacity:0;transform:scale(.6) rotate(-12deg);pointer-events:none}
.en.gone{visibility:hidden}
.intent{display:flex;align-items:center;gap:3px;height:30px;padding:0 9px;border-radius:15px;background:#2a1c13;border:1px solid #5a3d27;font:800 calc(max(12px,16px) * min(var(--gk-text-scale,1),1.25)) var(--fd);animation:ipulse 1.4s ease-in-out infinite;white-space:nowrap}
.intent svg{font-size:19px}.intent .atk{color:#ff7a4d}.intent .blk{color:#8cb6c9}.intent .buf{color:#e9c25c}.intent .deb{color:#9aae58}.intent .warn{color:#ff4d2e}.intent .unk{color:#d8c8ae}
.intent.danger{border-color:#e2552c;background:#3d1a10}
@keyframes ipulse{50%{transform:scale(1.07)}}
.bar{position:relative;height:16px;border-radius:8px;background:#120b07;border:1px solid #5a3d27;overflow:hidden;width:100%;min-width:64px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#e0606a,#a3323b);transition:width .25s}
.bar b{position:relative;display:block;text-align:center;font:800 calc(max(12px,12px) * min(var(--gk-text-scale,1),1.25))/14px var(--fb);color:#fff;text-shadow:0 1px 2px #000}
.bar.has-b{border-color:#8cb6c9;box-shadow:0 0 0 1px #8cb6c9}
.blkb{position:absolute;display:none;align-items:center;justify-content:center;width:30px;height:30px;color:#13242c;font:900 calc(max(12px,13px) * min(var(--gk-text-scale,1),1.25)) var(--fd);background:linear-gradient(135deg,#d8eef5,#8cb6c9 50%,#d8eef5);background-size:200% 200%;border:2px solid #f3eadb;border-radius:8px 8px 14px 14px;z-index:2}
.blkb.on{display:flex}.blkb.sh{animation:shim .5s}
@keyframes shim{0%{background-position:100% 0;transform:scale(1.4)}100%{background-position:0 100%;transform:scale(1)}}
.sts{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:24px;margin-top:3px}
.si{display:flex;align-items:center;gap:1px;height:24px;min-width:30px;padding:0 4px;border-radius:7px;background:#2a1c13;border:1px solid #4d3422;font:800 calc(max(12px,13px) * min(var(--gk-text-scale,1),1.25)) var(--fb);color:#f3eadb}
.si svg{font-size:15px}.si.steep{color:#b3c766}.si.scald{color:#ff7a4d}.si.chill{color:#a8d4e6}.si.soggy{color:#7fa3b8}.si.brew{color:#e9c25c}.si.zest{color:#ffb35c}.si.sharp{color:#ff8f6b}.si.surge{color:#e8a062}.si.pw{color:#e9c25c;border-color:#8a6a2c}
.si span{color:#f3eadb}
.enm{font:700 calc(max(12px,12px) * min(var(--gk-text-scale,1),1.25)) var(--fb);color:#b49e84;margin-top:1px;text-align:center;max-width:150px;line-height:1.1}
#mid{flex:none;height:96px;display:flex;align-items:center;gap:8px;position:relative}
#wc{width:88px;height:88px;flex:none}
#pinfo{flex:1;min-width:0;max-width:300px;position:relative}
.pnm{font:800 calc(max(12px,14px) * var(--gk-text-scale,1)) var(--fd);color:#e8a062;margin-bottom:3px}
#pinfo .blkb{left:-16px;top:12px}
#ctrl{flex:none;height:58px;display:flex;align-items:center;gap:8px;position:relative;z-index:5}
#orb{width:56px;height:56px;flex:none;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#f2b27a,#c7773c 45%,#6a3415);border:3px solid #f3eadb;color:#24160d;font:900 calc(max(12px,22px) * var(--gk-text-scale,1)) var(--fd);box-shadow:0 0 18px rgba(232,160,98,.45);position:relative}
#orb small{position:absolute;bottom:-12px;font:800 calc(max(12px,10px) * min(var(--gk-text-scale,1),1.25)) var(--fb);color:#d8c8ae;letter-spacing:.1em;text-transform:uppercase}
#orb.empty{filter:grayscale(.8) brightness(.7);box-shadow:none}
.pile{height:44px;min-width:52px;padding:0 8px;border-radius:12px;background:#2a1c13;border:1px solid #5a3d27;display:flex;align-items:center;gap:4px;font:800 calc(max(12px,15px) * min(var(--gk-text-scale,1),1.25)) var(--fb);color:#d8c8ae}
.pile svg{font-size:18px;color:#e8a062}
.btn.end{margin-left:auto;min-height:48px;padding:6px 16px;font-size:calc(max(12px,17px) * min(var(--gk-text-scale,1),1.25))}
.btn.end.glow{animation:eglow 1.1s ease-in-out infinite}
@keyframes eglow{50%{box-shadow:0 4px 0 #6a3415,0 0 22px rgba(232,160,98,.9)}}
#hand{flex:none;height:var(--hh);position:relative;margin:0 -6px}
#kwtip{position:absolute;left:0;right:0;bottom:calc(var(--hh) + 64px);margin:0 auto;max-width:440px;background:#f3eadb;color:#2a1c13;border-radius:14px;padding:10px 12px;font-size:calc(max(12px,15px) * var(--gk-text-scale,1));box-shadow:0 8px 28px rgba(0,0,0,.6);z-index:30;display:none;pointer-events:none}
#kwtip.on{display:block}
#kwtip .kt{font:800 calc(max(12px,17px) * var(--gk-text-scale,1)) var(--fd)}#kwtip .km{font-size:calc(max(12px,13px) * var(--gk-text-scale,1));color:#6b4a30;font-weight:700}
#kwtip .kd{margin:4px 0}#kwtip .kl{font-size:calc(max(12px,13.5px) * var(--gk-text-scale,1));margin-top:3px;color:#4a3220}
#kwtip .kh{font-size:calc(max(12px,13px) * var(--gk-text-scale,1));color:#a65a2a;font-weight:800;margin-top:4px}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font:900 32px var(--fd);color:#e8a062;text-shadow:0 3px 0 #3a1f0f,0 0 24px rgba(0,0,0,.8);pointer-events:none;opacity:0;z-index:20}
#banner.on{animation:ban .9s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(1.4)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
/* cards */
.card{position:absolute;left:0;top:0;width:var(--cw);height:calc(var(--cw)*1.42);border-radius:calc(var(--cw)*.1);transition:transform .22s cubic-bezier(.2,.8,.3,1.1),opacity .2s,translate .12s,filter .2s;will-change:transform}
#hand .card{touch-action:none}
.cf{position:absolute;inset:0;border-radius:inherit;background:#f3eadb;border:calc(var(--cw)*.045) solid #b8502a;box-shadow:0 4px 10px rgba(0,0,0,.5),inset 0 0 0 1px rgba(42,28,19,.25);display:flex;flex-direction:column;align-items:center;padding:calc(var(--cw)*.07) calc(var(--cw)*.06) calc(var(--cw)*.05);color:#2a1c13;overflow:hidden}
.t-skl .cf{border-color:#4f8a7d}.t-rit .cf{border-color:#b88a2e;background:#f6ecd2}.t-curse .cf{border-color:#5b5a45;background:#cfc8b6}
.cn{font:800 calc(var(--cw)*.128)/1.05 var(--fd);text-align:center;min-height:2.1em;display:flex;align-items:center;justify-content:center}
.up .cn{color:#3e7a2a}
.ca{flex:none;width:100%;height:calc(var(--cw)*.28);border-radius:calc(var(--cw)*.06);display:grid;place-items:center;font-size:calc(var(--cw)*.27);color:#f3eadb;background:linear-gradient(135deg,#c7773c,#7a3a1a);margin:calc(var(--cw)*.03) 0}
.t-skl .ca{background:linear-gradient(135deg,#6fa596,#2f5c53)}.t-rit .ca{background:linear-gradient(135deg,#e2b54e,#7d5a17)}.t-curse .ca{background:#6c6a55}
.ct{font:600 calc(var(--cw)*.116)/1.12 var(--fb);text-align:center;flex:1;display:flex;align-items:center;overflow:hidden}
.ct.long{font-size:calc(var(--cw)*.1)}
.ct b.kw{font-weight:800;color:#8a3a14}
.cty{font:800 calc(var(--cw)*.085) var(--fb);letter-spacing:.12em;text-transform:uppercase;color:#8a7458}
.r-U .cty{color:#3d6f8f}.r-R .cty{color:#b0801c}
.r-R .cf{box-shadow:0 0 0 2px #e9c25c,0 4px 14px rgba(233,194,92,.45)}
.cc{position:absolute;left:calc(var(--cw)*-.08);top:calc(var(--cw)*-.08);width:calc(var(--cw)*.32);height:calc(var(--cw)*.32);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#f2b27a,#a65a2a);border:2px solid #f3eadb;color:#24160d;font:900 calc(var(--cw)*.19) var(--fd);box-shadow:0 2px 4px rgba(0,0,0,.5)}
.card.no .cf{filter:brightness(.62) saturate(.6)}.card.no .cc{background:#6b5a4a}
.card.sel{z-index:20}.card.sel .cf{box-shadow:0 0 0 3px #e9c25c,0 10px 24px rgba(0,0,0,.6)}
.card.drag{transition:none;z-index:40}
@media (hover:hover){#hand .card:not(.sel):hover{translate:0 -14px;z-index:15}}
.card.static{position:relative;flex:none}
.card.pick .cf{box-shadow:0 0 0 4px #9aae58,0 8px 22px rgba(154,174,88,.5)}
.card.dis{opacity:.4}
#fly{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#fly .card{transition:transform .26s cubic-bezier(.4,0,.8,.4),opacity .26s}
.ft{position:absolute;font:900 26px var(--fd);color:#fff3e0;text-shadow:0 2px 0 #4a1c0c,0 0 10px rgba(0,0,0,.7);animation:ftup .8s ease-out forwards;white-space:nowrap;transform:translate(-50%,-50%)}
.ft.big{font-size:38px;color:#ffd27a}.ft.ph{color:#ff8d8d}.ft.bl{color:#bfe3f0;font-size:calc(max(12px,18px) * var(--gk-text-scale,1))}.ft.st{color:#c8dc78;font-size:calc(max(12px,22px) * var(--gk-text-scale,1))}.ft.hl{color:#a9e07a}.ft.sm{font-size:calc(max(12px,16px) * var(--gk-text-scale,1));color:#f3eadb}
@keyframes ftup{0%{opacity:0;margin-top:8px;scale:.6}15%{opacity:1;scale:1.15}100%{opacity:0;margin-top:-56px;scale:1}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:55}
/* reward/shop/rest/event */
.panel{background:#2a1c13;border:1px solid #5a3d27;border-radius:18px;padding:14px;margin:0 auto 12px;width:min(560px,100%)}
.loot{display:flex;align-items:center;gap:10px;padding:8px 4px;font-weight:700;font-size:calc(max(12px,17px) * var(--gk-text-scale,1))}
.loot svg{font-size:30px;color:#e9c25c}
.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding:8px 0;--cw:104px}
.cwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.price{display:flex;align-items:center;gap:4px;min-height:44px;padding:4px 14px;border-radius:12px;border:1px solid #8a6a2c;background:#3a2818;color:#e9c25c;font:800 calc(max(12px,16px) * var(--gk-text-scale,1)) var(--fb)}
.price:disabled{opacity:.4}.price.sold{visibility:hidden}
.relrow{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;background:#24170f;margin-bottom:8px;text-align:left}
.relrow .ric{font-size:36px;color:#e9c25c;flex:none;width:48px;display:grid;place-items:center}
.relrow b{font-family:var(--fd);font-size:calc(max(12px,16px) * var(--gk-text-scale,1))}.relrow p{margin:2px 0 0;font-size:calc(max(12px,14px) * var(--gk-text-scale,1));color:#d8c8ae}
.relrow .price{margin-left:auto;flex:none}
.evtxt{font-size:calc(max(12px,17px) * var(--gk-text-scale,1));color:#e6dac6;margin:8px 0 14px;line-height:1.45}
.opt{display:block;width:100%;text-align:left;min-height:52px;margin-bottom:10px;padding:10px 14px;border-radius:14px;border:2px solid #6b4a30;background:#33241a;color:#f3eadb;font:700 calc(max(12px,16px) * var(--gk-text-scale,1)) var(--fb)}
.opt:disabled{opacity:.4}
.opt:not(:disabled):active{background:#4a3220}
.evic{font-size:64px;color:#e8a062;display:flex;justify-content:center;margin:6px 0}
/* modal */

const snap=u=>{const o={hp:u.hp,mhp:u.mhp,blk:u.blk,st:Object.assign({},u.st)};if(u.pw)o.pw=Object.assign({},u.pw);return o;};
const allSnaps=C=>({p:snap(C.p),en:C.en.map(snap)});
const hasR=(G,id)=>G.relics.indexOf(id)>=0;
const alive=C=>{const a=[];C.en.forEach((e,i)=>{if(!e.dead)a.push(i);});return a;};
function decay(u,k){if(u.st[k]){u.st[k]--;if(u.st[k]<=0)delete u.st[k];}}
const cardVals=c=>c.up?Object.assign({},CARDS[c.id].v,CARDS[c.id].u):CARDS[c.id].v;
const cardCost=c=>{const D=CARDS[c.id];return c.up&&D.uc!=null?D.uc:D.c;};
const exhausts=c=>{const D=CARDS[c.id];return !!(c.up&&D.ux!=null?D.ux:D.x);};
const cardText=c=>CARDS[c.id].t(cardVals(c))+(exhausts(c)?' *Exhaust*.':'');
const canUp=c=>!c.up&&CARDS[c.id].ty!=='curse';
function canPlay(G,c){const C=G.C;if(!C||C.done)return false;const D=CARDS[c.id];if(D.ty==='curse')return false;return cardCost(c)<=C.p.en;}
function hurt(G,ti,amt,pierce,kind){const C=G.C,u=unit(C,ti);if(!u||u.dead||C.done)return 0;amt=Math.max(0,Math.floor(amt));let bl=0;if(!pierce&&u.blk>0){bl=Math.min(u.blk,amt);u.blk-=bl;amt-=bl;}u.hp-=amt;ev('dmg',{u:ti,a:amt,bl,k:kind,s:snap(u)});if(u.hp<=0){if(ti==='p'){u.hp=0;C.lost=true;C.done=true;ev('lose');}else killCheck(G,ti);}return amt;}
function killCheck(G,i){const C=G.C,e=C.en[i],D=EN[e.id];
if(D.p2&&e.ph===1){e.ph=2;let hp=D.p2;if(G.hard)hp=Math.round(hp*1.25);e.hp=e.mhp=hp;e.st={sharp:(e.st.sharp||0)+1};e.blk=0;e.n=0;e.h=[];G.st.p1=1;e.mv=D.ai(e,G);e.h.push(e.mv);e.fresh=1;ev('phase',{u:i,s:snap(e)});return;}
e.hp=0;e.dead=true;e.blk=0;e.st={};C.kills++;G.st.kills++;ev('die',{u:i,boss:!!D.boss,el:!!D.el});
if(C.en.every(x=>x.dead)){C.won=true;C.done=true;ev('win');return;}
C.en.forEach((o,j)=>{if(!o.dead&&EN[o.id].twin&&D.twin){o.st.sharp=(o.st.sharp||0)+4;ev('st',{u:j,k:'sharp',s:snap(o),msg:'Enraged!'});}});
if(hasR(G,'mug')){ev('relic',{id:'mug'});gainEn(G,1);drawN(G,1);}}
function atkVal(G,base,e){const C=G.C,p=C.p;let d=base+(p.st.zest||0)+C.bonus;if(p.st.chill)d*=0.75;d=Math.floor(d);if(e.st.scald)d=Math.floor(d*(hasR(G,'moon')?1.75:1.5));return Math.max(0,d);}
function pAtk(G,ti,base,hits){const C=G.C;let tot=0;for(let h=0;h<(hits||1);h++){const e=C.en[ti];if(!e||e.dead||C.done)break;tot+=hurt(G,ti,atkVal(G,base,e),false,'atk');}return tot;}
function atkAll(G,base,hits){const C=G.C;for(let h=0;h<(hits||1);h++){for(let i=0;i<C.en.length;i++){const e=C.en[i];if(!e.dead&&!C.done)hurt(G,i,atkVal(G,base,e),false,'atk');}if(C.done)break;}}
function atkRnd(G,base,hits){const C=G.C;for(let h=0;h<hits;h++){const a=alive(C);if(!a.length||C.done)break;const i=pk(G,a);hurt(G,i,atkVal(G,base,C.en[i]),false,'atk');}}
function pSt(G,ti,k,n){const C=G.C,u=unit(C,ti);if(!u||u.dead||C.done||n<=0)return;if(ti!=='p'){if(k==='steep'&&hasR(G,'strainer'))n+=1;if(k==='scald'&&hasR(G,'spout'))n+=1;}u.st[k]=(u.st[k]||0)+n;ev('st',{u:ti,k,n,s:snap(u)});}
function pStAll(G,k,n){const C=G.C;C.en.forEach((e,i)=>{if(!e.dead)pSt(G,i,k,n);});}
function blk(G,ti,n){const C=G.C,u=unit(C,ti);if(!u||u.dead||C.done)return;if(u.st.soggy)n=Math.floor(n*0.75);u.blk+=n;ev('blk',{u:ti,a:n,s:snap(u)});}
function heal(G,n){const C=G.C;if(C){const p=C.p,a=Math.min(n,p.mhp-p.hp);p.hp+=a;ev('heal',{u:'p',a,s:snap(p)});}else{G.hp=Math.min(G.mhp,G.hp+n);}}
function gainEn(G,n){G.C.p.en+=n;ev('en',{a:n});}
function addPw(G,k,n){const p=G.C.p;p.pw[k]=(p.pw[k]||0)+n;ev('pw',{k,s:snap(p)});}
function drawN(G,n){const C=G.C;let d=0;for(let i=0;i<n;i++){if(C.hand.length>=10)break;if(!C.draw.length){if(!C.disc.length)break;C.draw=shuf(G,C.disc);C.disc=[];ev('shuffle');}C.hand.push(C.draw.pop());d++;}if(d)ev('draw',{n:d});}
function plan(G,i){const e=G.C.en[i];if(e.dead)return;if(e.fresh)return;e.mv=EN[e.id].ai(e,G);e.h.push(e.mv);if(e.h.length>3)e.h.shift();}
function mkEnemy(G,id){const D=EN[id];let hp=ri(G,D.hp[0],D.hp[1]);if(!D.boss)hp=Math.round(hp*(1+0.07*G.layer));if(G.hard)hp=Math.round(hp*1.25);const st={};if(!D.boss&&!D.el&&G.layer>=3)st.sharp=G.layer>=5?2:1;return{id,hp,mhp:hp,blk:0,st,mv:null,h:[],n:0,ph:1,dead:false,seed:ri(G,0,999)};}
function intentInfo(G,i){const C=G.C,e=C&&C.en[i];if(!e||e.dead)return null;const m=EN[e.id].mv[e.mv];const r={n:m.n,ty:[],d:0,h:m.h||1,tx:[]};
if(m.a){let d=m.a+(e.st.sharp||0);if(e.st.chill)d*=0.75;d=Math.floor(d);if(C.p.st.scald)d=Math.floor(d*1.5);r.d=d;r.ty.push('atk');r.tx.push(`Attack for ${d}${r.h>1?' x'+r.h:''}`);}
if(m.b||m.ba){r.ty.push('blk');r.tx.push(m.ba?`Give all allies ${m.ba} Block`:`Gain ${m.b} Block`);}
if(m.s||m.sa){r.ty.push('buf');const o=m.s||m.sa;r.tx.push(Object.keys(o).map(k=>`${m.sa?'Give all allies':'Gain'} ${o[k]} ${KN[k]}`).join(', '));}
if(m.p){r.ty.push('deb');r.tx.push(Object.keys(m.p).map(k=>`Apply ${m.p[k]} ${KN[k]} to you`).join(', '));}
if(m.warn){r.ty.push('warn');r.tx.push('Something huge is coming next turn!');}
if(!r.ty.length)r.ty.push('unk');return r;}
function doMove(G,i){const C=G.C,e=C.en[i],m=EN[e.id].mv[e.mv];e.fresh=0;ev('act',{u:i,m:m.n,atk:!!m.a});
if(m.b)blk(G,i,m.b);
if(m.ba)C.en.forEach((o,j)=>{if(!o.dead)blk(G,j,m.ba);});
if(m.a){for(let h=0;h<(m.h||1);h++){let d=m.a+(e.st.sharp||0);if(e.st.chill)d*=0.75;d=Math.floor(d);if(C.p.st.scald)d=Math.floor(d*1.5);hurt(G,'p',d,false,'atk');if(C.done)return;}}
if(m.p)for(const k in m.p){const p=C.p;p.st[k]=(p.st[k]||0)+m.p[k];ev('st',{u:'p',k,n:m.p[k],s:snap(p),deb:1});}
if(m.s)for(const k in m.s){e.st[k]=(e.st[k]||0)+m.s[k];ev('st',{u:i,k,n:m.s[k],s:snap(e)});}
if(m.sa)C.en.forEach((o,j)=>{if(o.dead)return;for(const k in m.sa){o.st[k]=(o.st[k]||0)+m.sa[k];}ev('st',{u:j,k:'sharp',s:snap(o)});});}
function tickSteep(G,ti){const C=G.C,u=unit(C,ti);if(!u||u.dead||C.done)return;const s=u.st.steep;if(!s)return;let d=s;if(u.st.scald)d=Math.floor(d*(ti!=='p'&&hasR(G,'moon')?1.75:1.5));ev('tick',{u:ti});hurt(G,ti,d,true,'steep');if(u.dead||C.done)return;if(!(ti!=='p'&&C.p.pw.furnace)&&u.st.steep){u.st.steep--;if(u.st.steep<=0)delete u.st.steep;}ev('st',{u:ti,s:snap(u)});}
/* ---- combat flow ---- */
function startCombat(G,kind){let enc;
if(kind==='boss')enc=['samovar'];else if(kind==='elite')enc=pk(G,ENC.elite);else{const pool=G.layer<2?ENC.easy:ENC.hard;let tries=0;do{enc=pk(G,pool);}while(enc.join()===G.lastEnc&&tries++<8);}
G.lastEnc=enc.join();
const C={id:G.uid++,kind,en:enc.map(id=>mkEnemy(G,id)),draw:shuf(G,G.deck.map(c=>({u:c.u,id:c.id,up:c.up}))),hand:[],disc:[],exh:[],turn:0,p:{hp:G.hp,mhp:G.mhp,blk:0,en:0,st:{},pw:{}},done:false,won:false,lost:false,tongs:hasR(G,'tongs'),bonus:0,kills:0,rit:0};
G.C=C;G.screen='combat';
if(hasR(G,'cozy'))C.p.st.brew=6;if(hasR(G,'brick'))C.p.st.zest=2;
C.en.forEach((e,i)=>plan(G,i));ev('start');startTurn(G);}
function startTurn(G){const C=G.C,p=C.p;C.turn++;
if(!p.pw.porcelain)p.blk=0;
let en=3;if(C.turn===1&&hasR(G,'gauge'))en++;if(C.turn%3===0&&hasR(G,'bell'))en++;if(p.st.surge){en+=p.st.surge;delete p.st.surge;}p.en=en;
if(p.pw.slow)p.st.brew=(p.st.brew||0)+p.pw.slow;
if(p.pw.rolling)C.en.forEach((e,i)=>{if(!e.dead)pSt(G,i,'scald',p.pw.rolling);});
if(hasR(G,'infuser')){const a=alive(C);if(a.length){ev('relic',{id:'infuser'});pSt(G,pk(G,a),'steep',1);}}
if(C.turn===1&&hasR(G,'saucer')){ev('relic',{id:'saucer'});blk(G,'p',8);}
ev('sync',{s:allSnaps(C)});
drawN(G,5+(C.turn===1&&hasR(G,'spoon')?2:0));ev('turn',{n:C.turn});}
function playCard(G,hi,ti){const C=G.C;if(!C||C.done||G.screen!=='combat')return false;const c=C.hand[hi];if(!c)return false;const D=CARDS[c.id];if(!canPlay(G,c))return false;
if(D.tg==='one'){if(ti==null||ti===-1){const a=alive(C);if(a.length===1)ti=a[0];else return false;}const e=C.en[ti];if(!e||e.dead)return false;}else ti=null;
C.p.en-=cardCost(c);C.hand.splice(hi,1);ev('play',{c,ti,hi});
const isA=D.ty==='atk',brewNow=isA?(C.p.st.brew||0):0;C.bonus=0;
if(isA){C.bonus=brewNow+(C.tongs?8:0);if(C.tongs)ev('relic',{id:'tongs'});C.tongs=false;}
D.f(G,cardVals(c),ti);C.bonus=0;
if(isA&&brewNow){C.p.st.brew=Math.max(0,(C.p.st.brew||0)-brewNow);if(!C.p.st.brew)delete C.p.st.brew;ev('st',{u:'p',s:snap(C.p)});}
if(D.ty==='rit')C.rit++;else if(exhausts(c)){C.exh.push(c);ev('exh',{c});}else C.disc.push(c);
resolve(G);return true;}
function endTurn(G){const C=G.C;if(!C||C.done||G.screen!=='combat')return false;const p=C.p;ev('endturn');
if(p.pw.timer)blk(G,'p',p.pw.timer);
if(hasR(G,'napkin')&&p.blk<=0){ev('relic',{id:'napkin'});blk(G,'p',5);}
if(C.hand.length){ev('discard',{n:C.hand.length});C.disc.push(...C.hand);C.hand=[];}
tickSteep(G,'p');
if(!C.done){decay(p,'chill');decay(p,'soggy');C.en.forEach(e=>{if(!e.dead)decay(e,'scald');});
C.en.forEach(e=>{if(!e.dead)e.blk=0;});ev('eturn');ev('sync',{s:allSnaps(C)});
for(let i=0;i<C.en.length&&!C.done;i++){const e=C.en[i];if(e.dead)continue;doMove(G,i);if(C.done)break;if(!e.dead)tickSteep(G,i);if(!e.dead){decay(e,'chill');decay(e,'soggy');}}
if(!C.done){decay(p,'scald');C.en.forEach((e,i)=>plan(G,i));startTurn(G);}}
resolve(G);return true;}
function resolve(G){const C=G.C;if(!C||G.screen!=='combat')return;if(C.lost)endRun(G,false);else if(C.won)winCombat(G);}
function winCombat(G){const C=G.C;G.hp=Math.max(1,C.p.hp);
if(C.kind==='elite')G.st.elites++;
if(C.kind==='boss'){G.cleared++;G.C=null;return endRun(G,true);}
let gold=C.kind==='elite'?ri(G,30,40):ri(G,14,22);if(hasR(G,'leaf'))gold+=12;G.gold+=gold;
let healed=0;if(hasR(G,'stone')){healed=Math.min(6,G.mhp-G.hp);G.hp+=healed;}
let relic=null;if(C.kind==='elite'){relic=randRelic(G);if(relic)gainRelic(G,relic);}
G.rw={gold,relic,healed,cards:rollCards(G,3,C.kind==='elite')};G.C=null;G.screen='reward';}
/* ---- run ---- */
function addCard(G,id,up){G.deck.push({u:G.uid++,id,up:up?1:0});}
function gainRelic(G,id){if(!RELICS[id]||hasR(G,id))return;G.relics.push(id);if(id==='pot'){G.mhp+=10;G.hp+=10;}}
function randRelic(G){const a=G.pool.r.filter(r=>!hasR(G,r));return a.length?pk(G,a):null;}
function randCard(G,rar){const a=G.pool.c.filter(id=>CARDS[id].r===rar);return a.length?pk(G,a):pk(G,G.pool.c);}
function rollCards(G,n,elite){const out=[];let g=0;while(out.length<n&&g++<200){const r=rnd(G);const rar=elite?(r<0.15?'R':r<0.55?'U':'C'):(r<0.06?'R':r<0.36?'U':'C');const cand=G.pool.c.filter(id=>CARDS[id].r===rar&&out.indexOf(id)<0);if(cand.length)out.push(pk(G,cand));}return out;}
function genMap(G){const L=[];L.push(rnd(G)<0.5?['fight','fight']:['fight','mystery']);
for(let i=1;i<=5;i++){const o=i===1?['fight','mystery','shop','fight']:i===2?['fight','elite','mystery','rest','shop','fight']:['fight','elite','rest','mystery','shop','fight','elite'];const a=pk(G,o);let b=a,g=0;while(b===a&&g++<50)b=pk(G,o);if(b===a)b=a==='fight'?'mystery':'fight';L.push([a,b]);}
if(!L.slice(2,6).some(l=>l.indexOf('elite')>=0))L[3][L[3][0]==='fight'?0:1]='elite';
if(L[3][0]===L[3][1])L[3][1]='fight';
L.push(rnd(G)<0.5?['rest','shop']:['shop','rest']);L.push(['boss']);return L;}
function unlockedPool(M,hard){const c=[],r=[];for(const id in CARDS){const D=CARDS[id];if(D.r==='S'||D.r==='X')continue;if(!D.L||isUnl(M,'card',id))c.push(id);}for(const id in RELICS){const R=RELICS[id];if(R.s)continue;if(!R.L||isUnl(M,'relic',id))r.push(id);}return{c,r};}
function newRun(w,M,opt){opt=opt||{};const W=WITCH[w];const G={v:SAVEV,w,hp:W.hp,mhp:W.hp,gold:60,deck:[],relics:[W.relic],layer:0,cleared:0,path:[],screen:'map',C:null,rw:null,shop:null,evt:null,st:{kills:0,elites:0,p1:0},rs:(opt.seed!=null?opt.seed:(Date.now()^Math.floor(Math.random()*1e9)))|0,uid:1,hard:!!opt.hard,pool:unlockedPool(M||defMeta()),seen:[],lastEnc:'',over:null,rmCost:50};
W.deck.forEach(id=>addCard(G,id));G.map=genMap(G);return G;}
function chooseNode(G,i){if(G.screen!=='map')return false;const L=G.map[G.layer];if(!L||i<0||i>=L.length)return false;const t=L[i];G.path.push(i);
if(t==='fight')startCombat(G,'fight');else if(t==='elite')startCombat(G,'elite');else if(t==='boss')startCombat(G,'boss');
else if(t==='rest'){G.screen='rest';}
else if(t==='shop')genShop(G);
else if(t==='mystery'){if(rnd(G)<0.2){G.ambush=1;startCombat(G,'fight');}else{const keys=Object.keys(EVENTS).filter(k=>G.seen.indexOf(k)<0);const id=pk(G,keys.length?keys:Object.keys(EVENTS));G.seen.push(id);G.evt={id,res:null,pick:null};G.screen='event';}}
return true;}
function leaveNode(G){G.cleared++;G.layer++;G.screen='map';G.ambush=0;G.evt=null;G.shop=null;G.rw=null;}
function rewardPick(G,i){if(G.screen!=='reward'||!G.rw)return false;if(i!=null&&i>=0&&G.rw.cards[i])addCard(G,G.rw.cards[i]);leaveNode(G);return true;}
function restHeal(G){if(G.screen!=='rest')return false;heal(G,Math.round(G.mhp*0.3)+(hasR(G,'jar')?12:0));leaveNode(G);return true;}
function restUpgrade(G,di){if(G.screen!=='rest')return false;const c=G.deck[di];if(!c||!canUp(c))return false;c.up=1;leaveNode(G);return true;}
function price(G,r){return r==='R'?ri(G,105,120):r==='U'?ri(G,64,76):ri(G,40,50);}
function genShop(G){const cards=rollCards(G,5,false).map(id=>({id,p:price(G,CARDS[id].r),sold:0}));if(cards.length){const k=ri(G,0,cards.length-1);cards[k].p=Math.floor(cards[k].p/2);cards[k].sale=1;}
const rel=[];const a=G.pool.r.filter(r=>!hasR(G,r));shuf(G,a);for(let i=0;i<Math.min(2,a.length);i++)rel.push({id:a[i],p:ri(G,125,150),sold:0});
G.shop={cards,relics:rel,rmUsed:0};G.screen='shop';}
function buyCard(G,i){const s=G.shop;if(G.screen!=='shop'||!s)return false;const it=s.cards[i];if(!it||it.sold||G.gold<it.p)return false;G.gold-=it.p;it.sold=1;addCard(G,it.id);return true;}
function buyRelic(G,i){const s=G.shop;if(G.screen!=='shop'||!s)return false;const it=s.relics[i];if(!it||it.sold||G.gold<it.p||hasR(G,it.id))return false;G.gold-=it.p;it.sold=1;gainRelic(G,it.id);return true;}
function shopRemove(G,di){const s=G.shop;if(G.screen!=='shop'||!s||s.rmUsed||G.gold<G.rmCost||G.deck.length<=5||!G.deck[di])return false;G.gold-=G.rmCost;G.deck.splice(di,1);s.rmUsed=1;G.rmCost+=25;return true;}
function leaveShop(G){if(G.screen!=='shop')return false;leaveNode(G);return true;}
function upRandom(G,n){const a=G.deck.filter(canUp);shuf(G,a);const ch=a.slice(0,n);ch.forEach(c=>c.up=1);return ch.map(c=>CARDS[c.id].n).join(' and ');}

async function doEnd(){if(ui.busy||!G.C)return;ui.sel=-1;hideKw();hideTip();KC.endTurn(G);saveRun();ui.busy=true;try{await playEvs(KC.takeEv());}catch(e){if(window.console)console.error(e);}ui.busy=false;after();}
function after(){saveRun();if(G.screen==='combat'){updCombat();renderHand();}else{if(G.screen==='reward'){sfx('coin');}render();}}
function banner(t){const b=$('#banner');if(!b)return;b.textContent=t;b.classList.remove('on');void b.offsetWidth;b.classList.add('on');}
function unitEl(u){return u==='p'?$('#wc'):$(`.en[data-e="${u}"] canvas`);}
async function playEvs(evs){for(const e of evs){if(!$('#cb'))break;switch(e.t){
case'play':{sfx('swish');const el=handEl(e.c.u);if(el){const hr=$('#hand').getBoundingClientRect();const x=hr.left+(+el.dataset.x)+(+el.dataset.dx||0),y=hr.top+(+el.dataset.y)+(+el.dataset.dy||0);el.style.transition='none';el.classList.remove('sel','no');el.style.translate='';fly.appendChild(el);el.style.transform=`translate(${x}px,${y}px) scale(1.1)`;let tx=innerWidth/2,ty=innerHeight*0.38;if(e.ti!=null){const t=unitEl(e.ti);if(t){[tx,ty]=center(t);}}const{cw,ch}=cardMetrics();void el.offsetWidth;el.style.transition='';el.style.transform=`translate(${tx-cw/2}px,${ty-ch/2}px) scale(.35) rotate(${(Math.random()-.5)*40}deg)`;el.style.opacity='0';setTimeout(()=>el.remove(),320);}
renderHandSoon();await wait(150);break;}
case'dmg':{const t=unitEl(e.u);updUnit(e.u,e.s);if(!t)break;const[x,y]=center(t);
if(e.bl>0){floatTxt(x,y-30,'-'+e.bl,'bl');sfx('clink');burst(x,y,5,'frost');}
if(e.a>0||!e.bl){const big=e.a>=12;floatTxt(x,y-10,e.a,(e.k==='steep'?'st':big?'big':'')+(e.u==='p'?' ph':''));sfx('hit',big);
const r=e.u==='p'?ui.wcv:ui.ecv[e.u];if(r)r.flash=1;if(e.u!=='p'){const el=t.closest('.en');el.classList.add('kb');setTimeout(()=>el.classList.remove('kb'),110);}
burst(x,y,big?14:7,e.k==='steep'?'leaf':'spark');shake(e.u==='p'?(e.a>=10?14:6):(big?12:e.a>=6?4:0));}
await wait(e.k==='steep'?170:120);break;}
case'blk':{updUnit(e.u,e.s);const b=e.u==='p'?$('#pblk'):$(`.en[data-e="${e.u}"] .blkb`);if(b){b.classList.remove('sh');void b.offsetWidth;b.classList.add('sh');}sfx('clink');const t=unitEl(e.u);if(t){const[x,y]=center(t);floatTxt(x,y,'+'+e.a,'bl');}await wait(70);break;}
case'st':{updUnit(e.u,e.s);const t=unitEl(e.u);if(t&&e.k){const[x,y]=center(t);if(e.k==='steep'){sfx('sizzle');burst(x,y,8,'leaf');}else if(e.k==='scald'){sfx('sizzle');burst(x,y,8,'spark');}else if(e.k==='chill'||e.k==='soggy'){sfx('deb');burst(x,y,8,'frost');}else{sfx('buff');burst(x,y,6,'gold');}if(e.n)floatTxt(x,y-34,`+${e.n} ${KC.KN[e.k]}`,'sm');if(e.msg)floatTxt(x,y-50,e.msg,'big');}await wait(e.k?70:20);break;}
case'tick':{const t=unitEl(e.u);if(t){const[x,y]=center(t);burst(x,y-10,6,'steam');}sfx('sizzle');await wait(80);break;}
case'heal':{updUnit(e.u,e.s);const t=unitEl(e.u);if(t){const[x,y]=center(t);floatTxt(x,y,'+'+e.a,'hl');burst(x,y,8,'leaf');}sfx('heal');await wait(120);break;}
case'pw':{updUnit('p',e.s);const t=unitEl('p');if(t){const[x,y]=center(t);burst(x,y,14,'gold');floatTxt(x,y-30,KC.PWN[e.k][0],'sm');}sfx('buff');await wait(160);break;}
case'act':{const el=$(`.en[data-e="${e.u}"]`);if(el){el.classList.add('lunge');setTimeout(()=>el.classList.remove('lunge'),170);const t=el.querySelector('canvas');const[x,y]=center(t);floatTxt(x,y-50,e.m,'sm');}await wait(e.atk?190:300);break;}
case'die':{const el=$(`.en[data-e="${e.u}"]`);if(el){const[x,y]=center(el.querySelector('canvas'));ui.freeze=performance.now()+(e.boss?260:120);burst(x,y,30,'porc');burst(x,y,10,'steam');shake(e.boss?24:e.el?16:9);sfx('kill');el.classList.add('dead');setTimeout(()=>el.classList.add('gone'),400);}await wait(e.boss?600:300);break;}
case'phase':{const el=$(`.en[data-e="${e.u}"]`);if(ui.ecv[e.u])ui.ecv[e.u].o.ph=2;updUnit(e.u,e.s);if(el){const[x,y]=center(el.querySelector('canvas'));burst(x,y,40,'spark');burst(x,y,20,'steam');}ui.freeze=performance.now()+300;shake(26);sfx('phase');banner('It boils over!');await wait(1100);updCombat();break;}
case'draw':renderHand();updPiles();await wait(40);break;
case'shuffle':{const p=$('#pdraw');if(p){const[x,y]=center(p);floatTxt(x,y-30,'Shuffled','sm');}sfx('shuffle');await wait(120);break;}
case'discard':{const p=$('#pdisc'),hr=$('#hand').getBoundingClientRect();const[dx,dy]=p?center(p):[innerWidth,innerHeight];$('#hand').querySelectorAll('.card').forEach((el,i)=>{const x=hr.left+(+el.dataset.x),y=hr.top+(+el.dataset.y);el.style.transition='none';fly.appendChild(el);el.style.transform=`translate(${x}px,${y}px)`;void el.offsetWidth;el.style.transition='';setTimeout(()=>{el.style.transform=`translate(${dx-30}px,${dy-40}px) scale(.25) rotate(25deg)`;el.style.opacity='0';},i*30);setTimeout(()=>el.remove(),400+i*30);});sfx('swish');await wait(260);break;}
case'eturn':banner('Enemy turn');await wait(300);break;
case'sync':updUnit('p',e.s.p);e.s.en.forEach((s,i)=>{if(!G.C||!G.C.en[i]||!G.C.en[i].dead)updUnit(i,s);});break;
case'turn':updCombat();renderHand();banner('Your turn');sfx('turn');await wait(200);break;
case'en':updOrb();break;
case'relic':pulseRelic(e.id);break;
case'win':sfx('win');banner('Brewed!');await wait(800);break;
case'lose':sfx('lose');shake(20);banner('Your kettle goes cold');await wait(1400);break;}}}
let rhs=0;function renderHandSoon(){if(rhs)return;rhs=1;setTimeout(()=>{rhs=0;if(G&&G.C&&$('#hand'))renderHand();},60);}
function updOrb(){const o=$('#orb');if(o&&G.C){o.querySelector('b').textContent=G.C.p.en;o.classList.toggle('empty',G.C.p.en<=0);}}
function updPiles(){if(!G.C)return;const a=$('#pdraw span'),b=$('#pdisc span');if(a)a.textContent=G.C.draw.length;if(b)b.textContent=G.C.disc.length;}
/* ---- reward / rest / shop / event / over ---- */
function rReward(){const R=G.rw;const el=scr('rw',`<h2>Brewed!</h2><p class="sub">The kitchenware falls silent.</p><div class="panel"><div class="loot">${svg('coin')} +${R.gold} gold</div>${R.relic?`<div class="relrow"><div class="ric">${svg(R.relic)}</div><div><b>${RELICS[R.relic].n}</b><p>${fmt(RELICS[R.relic].t)}</p></div></div>`:''}${R.healed?`<div class="loot" style="color:#a9e07a">${svg('heart')} Warming Stone heals ${R.healed}</div>`:''}</div>
<h3 style="text-align:center;font-size:calc(max(12px,20px) * var(--gk-text-scale,1))">Add a recipe to your deck</h3><div class="cards">${R.cards.map((id,i)=>`<div class="cwrap">${cardHTML({id,up:0},'static'+(ui.rwSel===i?' pick':''),`data-a="rwsel" data-i="${i}"`)}</div>`).join('')}</div>
<div class="col"><button class="btn big" data-a="rwtake" ${ui.rwSel<0?'disabled':''}>${ui.rwSel<0?'Tap a card to choose':'Take '+CARDS[R.cards[ui.rwSel]].n}</button><button class="btn ghost" data-a="rwskip">Skip</button></div>`);}
function rRest(){scr('rest',`<h2>A Quiet Hearth</h2><p class="sub">A low fire and a battered armchair. Rest a while, or refine a recipe.</p><div class="evic">${svg('rest')}</div><div class="panel"><button class="opt" data-a="rheal">${svg('heart')} <b>Sip and rest.</b> Heal ${Math.min(G.mhp-G.hp,Math.round(G.mhp*0.3)+(KC.hasR(G,'jar')?12:0))} HP.</button><button class="opt" data-a="rup" ${G.deck.some(KC.canUp)?'':'disabled'}>${svg('zest')} <b>Refine a recipe.</b> Upgrade a card.</button></div>`);}
function rShop(){const s=G.shop;scr('shop',`<h2>The Copper Counter</h2><p class="sub">A shopkeeper made entirely of teaspoons clinks politely.</p><div class="cards">${s.cards.map((it,i)=>`<div class="cwrap">${cardHTML({id:it.id,up:0},'static'+(it.sold?' dis':''))}<button class="price${it.sold?' sold':''}" data-a="buyc" data-i="${i}" ${G.gold<it.p?'disabled':''}>${svg('coin')} ${it.p}${it.sale?' sale':''}</button></div>`).join('')}</div>
<div class="panel">${s.relics.map((it,i)=>`<div class="relrow"${it.sold?' style="opacity:.35"':''}><div class="ric">${svg(it.id)}</div><div><b>${RELICS[it.id].n}</b><p>${fmt(RELICS[it.id].t)}</p></div><button class="price${it.sold?' sold':''}" data-a="buyr" data-i="${i}" ${G.gold<it.p?'disabled':''}>${svg('coin')} ${it.p}</button></div>`).join('')}
<div class="relrow"><div class="ric" style="color:#c9474f">${svg('x')}</div><div><b>Toss a recipe</b><p>Remove a card from your deck.</p></div><button class="price" data-a="rm" ${s.rmUsed||G.gold<G.rmCost||G.deck.length<=5?'disabled':''}>${svg('coin')} ${G.rmCost}</button></div></div><div class="col"><button class="btn big" data-a="leave">Leave shop</button></div>`);}
function rEvent(){const e=G.evt,D=KC.EVENTS[e.id];const el=scr('evt',`<h2>${D.n}</h2><div class="evic">${svg(D.ic)}</div><div class="panel"><p class="evtxt">${D.d}</p>${e.res?`<p class="evtxt" style="color:#e9c25c">${esc(e.res)}</p><button class="btn big" style="width:100%" data-a="evdone">Continue down</button>`:D.o.map((o,i)=>`<button class="opt" data-a="evt" data-i="${i}" ${o.ok&&!o.ok(G)?'disabled':''}>${esc(o.t)}</button>`).join('')}</div>`);if(e.pick&&!modal.classList.contains('on'))openPicker(e.pick==='remove'?'erm':'eup');}
function rOver(){const o=G.over;if(!o.applied){ui.newly=KC.applyRun(M,o);o.applied=true;ui.beforeL=M.leaves-o.leaves;saveMeta();LS.del(K.run);memRun=null;}
const L=M.leaves,nx=KC.nextUnl(M),pa=KC.prevAt(L),bp=ui.beforeL!=null?ui.beforeL:L;const startW=nx?Math.max(0,Math.round((Math.max(bp,pa)-pa)/(nx.at-pa)*100)):100;
const el=scr('over',`<div class="title" style="padding-top:2vh"><h1 class="logo" style="font-size:clamp(34px,9vw,56px)">${o.win?'The Samovar Cools':'Your Kettle Went Cold'}</h1><p class="sub">${o.win?'You brewed your way to the bottom of the cellar.':'The cellar keeps its secrets, for now.'}</p>
<div class="stats"><div class="stat"><b>${o.depth}/8</b><span>Depth</span></div><div class="stat"><b>${o.kills}</b><span>Brewed</span></div><div class="stat"><b>${o.elites}</b><span>Elites</span></div><div class="stat"><b style="color:#b3c766">+${o.leaves}</b><span>Leaves</span></div></div>
<div class="prog"><div class="lb"><span>${nx?'Next: '+unlName(nx):'Every recipe unlocked'}</span><span>${L}${nx?'/'+nx.at:''} ${svg('leaf')}</span></div><div class="track"><i style="width:${startW}%" data-w="${nx?Math.round((L-pa)/(nx.at-pa)*100):100}"></i></div>${nx?`<p class="sub" style="text-align:left;margin-top:6px">${nx.at-L} more leaves to go.</p>`:''}</div>
${ui.newly.map((u,i)=>`<div class="newu" style="animation-delay:${0.5+i*0.3}s">Unlocked: ${unlName(u)}<div style="font-weight:600;font-size:calc(max(12px,14px) * var(--gk-text-scale,1));color:#e6dac6">${unlDesc(u)}</div></div>`).join('')}
<button class="btn big" data-a="new">New run</button><button class="btn ghost" data-a="title">Title</button></div>`);animBars(el);if(o.win)setTimeout(()=>{for(let i=0;i<5;i++)setTimeout(()=>burst(innerWidth*(0.2+Math.random()*0.6),innerHeight*0.3,24,'gold'),i*200);},300);}
/* ---- picker / modals ---- */
function openModal(h){modal.innerHTML=`<div class="mbox">${h}</div>`;modal.classList.add('on');}
function closeModal(){modal.classList.remove('on');modal.innerHTML='';ui.pick=null;}
function openPicker(mode){ui.pick=mode;ui.pickSel=-1;drawPicker();}
function drawPicker(){const m=ui.pick,up=m==='up'||m==='eup';const t={up:'Refine a recipe',eup:'Dip a card in the basin',rm:'Toss a recipe ('+G.rmCost+' gold)',erm:'Give the ghost a card'}[m];
openModal(`<h2>${t}</h2><p class="sub">${up?'Upgraded versions shown. Tap a card to choose.':'Tap a card to choose.'}</p><div class="mgrid">${G.deck.map((c,i)=>{const ok=up?KC.canUp(c):true;const shown=up&&ok?{id:c.id,up:1}:c;return cardHTML(shown,'static'+(ok?'':' dis')+(ui.pickSel===i?' pick':''),ok?`data-a="psel" data-i="${i}"`:'');}).join('')}</div><div class="mrow"><button class="btn" data-a="pok" ${ui.pickSel<0?'disabled':''}>${ui.pickSel<0?'Choose a card':(up?'Upgrade ':'Remove ')+CARDS[G.deck[ui.pickSel].id].n}</button><button class="btn ghost" data-a="pcancel">Cancel</button></div>`);}
function pileModal(which){const C=G.C;let cards;let t;if(which==='draw'){cards=C.draw.slice().sort((a,b)=>a.id<b.id?-1:1);t='Draw pile';}else if(which==='disc'){cards=C.disc.slice();t='Discard pile';}else{cards=G.deck;t='Your deck';}
openModal(`<h2>${t} (${cards.length})</h2>${which==='draw'?'<p class="sub">Shown in sorted order, not draw order.</p>':''}<div class="mgrid">${cards.map(c=>cardHTML(c,'static')).join('')||'<p class="sub">Empty.</p>'}</div>${which==='deck'&&C?`<p class="sub">Exhausted this fight: ${C.exh.length}</p>`:''}<div class="mrow"><button class="btn" data-a="mclose">Close</button></div>`);}
function menuModal(){openModal(`<h2>Settings</h2><div class="col"><button class="tog" data-a="tmus">Music: ${S.music?'On':'Off'}</button><button class="tog" data-a="tsfx">Sound effects: ${S.sfx?'On':'Off'}</button><button class="tog" data-a="tspd">Animation speed: ${S.fast?'Fast':'Normal'}</button>${G&&ui.scr==='run'&&G.screen!=='over'?`<button class="btn ghost" data-a="totitle">Save and quit to title</button><button class="btn ghost" data-a="abandon" style="color:#ff9a8a">Abandon run</button>`:''}<button class="btn" data-a="mclose">Back</button></div><p class="sub" style="margin-top:12px">Keys: 1 to 9 select a card (press again to play), Tab switches target, E ends turn, Esc cancels.</p>`);const bk=modal.querySelector('[data-a="mclose"]');if(bk)bk.before(GK.ui.prefsButton({className:'tog',panel:{text:true,tips:false}}));}
function helpModal(){openModal(`<h2>How to brew</h2><div class="evtxt" style="font-size:calc(max(12px,15.5px) * var(--gk-text-scale,1))">
<p>Descend 8 rooms of a cursed teahouse cellar. The Iron Samovar waits at the bottom.</p>
<p>Each turn you get <b>3 Steam</b> and draw 5 cards. Tap a card, then tap an enemy (or tap the card again if it needs no target). Drag cards up to play them, too.</p>
<p>Enemies show what they will do next above their heads. Block before big hits.</p>
<p><b style="color:#b3c766">Steep</b> burns at the end of the enemy's turn and drops by 1. <b style="color:#ff7a4d">Scald</b> makes the target take 50% more damage. <b style="color:#e9c25c">Brew</b> powers up your next Attack.</p>
<p>After fights, add a card. Rest to heal or upgrade. Every run earns <b>leaves</b>, which unlock new recipes, relics and a second witch.</p></div><div class="mrow"><button class="btn" data-a="mclose">Got it</button></div>`);S.seenHelp=true;saveSet();}
function confirmModal(q,yes){openModal(`<h2>${q}</h2><div class="mrow"><button class="btn" data-a="cyes">${yes}</button><button class="btn ghost" data-a="mclose">Cancel</button></div>`);}
/* ---- actions ---- */
function startRun(w){G=KC.newRun(w,M,{hard:S.hard&&KC.isUnl(M,'mode','boiling')});KC.takeEv();ui.scr='run';ui.rwSel=-1;saveRun();render();}
async function act(a,i,el){switch(a){
case'new':sfx('click');if(ui.scr==='title'&&loadRun()){ui.confirm='newrun';confirmModal('Start fresh? Your saved run will be abandoned. You keep the leaves it earned.','Start fresh');break;}ui.scr='select';render();break;
case'cont':{const sv=loadRun();if(sv){G=sv;ui.scr='run';ui.cbId=null;render();}else render();break;}
case'witch':sfx('click');if(KC.isUnl(M,'witch',i))startRun(i);break;
case'hard':S.hard=!S.hard;saveSet();render();break;
case'title':closeModal();ui.scr='title';render();break;
case'pantry':ui.scr='pantry';render();break;
case'help':helpModal();break;
case'menu':menuModal();break;
case'mclose':closeModal();break;
case'tmus':S.music=!S.music;saveSet();setMus();menuModal();break;
case'tsfx':S.sfx=!S.sfx;saveSet();setMus();menuModal();break;
case'tspd':S.fast=!S.fast;saveSet();menuModal();break;
case'totitle':saveRun();closeModal();ui.scr='title';render();break;
case'abandon':ui.confirm='abandon';confirmModal('Abandon this run? You keep the leaves earned so far.','Abandon');break;
case'cyes':if(ui.confirm==='abandon'&&G){closeModal();KC.abandon(G);KC.takeEv();saveRun();render();}else if(ui.confirm==='newrun'){closeModal();const sv=loadRun();if(sv){KC.abandon(sv);KC.applyRun(M,sv.over);saveMeta();}LS.del(K.run);memRun=null;G=null;ui.scr='select';render();}ui.confirm=null;break;
case'deck':if(G)pileModal('deck');break;
case'pile':if(G&&G.C)pileModal(i);break;
case'end':doEnd();break;
case'node':{if(!KC.chooseNode(G,+i))break;KC.takeEv();sfx('click');ui.rwSel=-1;saveRun();render();break;}
case'rwsel':ui.rwSel=+i;sfx('click');rReward();break;
case'rwtake':if(ui.rwSel>=0&&KC.rewardPick(G,ui.rwSel)){sfx('buff');ui.rwSel=-1;saveRun();render();}break;
case'rwskip':if(KC.rewardPick(G,-1)){ui.rwSel=-1;saveRun();render();}break;
case'rheal':if(KC.restHeal(G)){sfx('heal');saveRun();render();}break;
case'rup':openPicker('up');break;
case'psel':ui.pickSel=+i;sfx('click');drawPicker();break;
case'pcancel':if(ui.pick==='eup'||ui.pick==='erm'){KC.eventCancelPick(G);saveRun();}closeModal();if(G)render();break;
case'pok':{const m=ui.pick,di=ui.pickSel;if(di<0)break;let ok=false;if(m==='up')ok=KC.restUpgrade(G,di);else if(m==='rm')ok=KC.shopRemove(G,di);else ok=KC.eventPick(G,di);closeModal();if(ok){sfx(m==='rm'||m==='erm'?'swish':'buff');saveRun();}render();break;}
case'buyc':if(KC.buyCard(G,+i)){sfx('coin');saveRun();render();}else sfx('nope');break;
case'buyr':if(KC.buyRelic(G,+i)){sfx('coin');saveRun();render();}else sfx('nope');break;
case'rm':openPicker('rm');break;
case'leave':if(KC.leaveShop(G)){saveRun();render();}break;
case'evt':if(KC.eventChoose(G,+i)){sfx('click');saveRun();render();}break;
case'evdone':if(KC.eventDone(G)){saveRun();render();}break;}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;if(ui.busy&&b.dataset.a!=='menu'&&b.dataset.a!=='mclose'&&b.dataset.a!=='deck'&&b.dataset.a!=='pile'&&!b.closest('#modal'))return;act(b.dataset.a,b.dataset.i,b);});
modal.addEventListener('click',e=>{if(e.target===modal){if(ui.pick==='eup'||ui.pick==='erm'){KC.eventCancelPick(G);saveRun();closeModal();render();}else closeModal();}});
document.addEventListener('keydown',e=>{if(document.querySelector('.gk-prefs'))return;if(e.key==='Escape'){if(modal.classList.contains('on')){if(ui.pick==='eup'||ui.pick==='erm'){KC.eventCancelPick(G);saveRun();closeModal();render();}else closeModal();}else deselect();return;}
if(modal.classList.contains('on')||!G||ui.scr!=='run'||G.screen!=='combat'||ui.busy)return;const C=G.C;
if(/^[1-9]$/.test(e.key)||e.key==='0'){const hi=e.key==='0'?9:+e.key-1;if(!C.hand[hi])return;if(ui.sel===hi){const c=C.hand[hi];if(!KC.canPlay(G,c)){sfx('nope');nudge(hi);return;}const tg=CARDS[c.id].tg==='one';doPlay(hi,tg?ui.tgt:null);}else selectCard(hi);e.preventDefault();}
else if(e.key==='Tab'||e.key==='ArrowRight'||e.key==='ArrowLeft'){const a=KC.alive(C);if(!a.length)return;const k=a.indexOf(ui.tgt);ui.kb=1;ui.tgt=a[(k+(e.key==='ArrowLeft'?a.length-1:1))%a.length];updTargets();e.preventDefault();}
else if(e.key==='Enter'||e.key===' '){if(ui.sel>=0){const c=C.hand[ui.sel];if(c&&KC.canPlay(G,c))doPlay(ui.sel,CARDS[c.id].tg==='one'?ui.tgt:null);e.preventDefault();}}
else if(e.key==='e'||e.key==='E'){doEnd();}});
let rz=0;addEventListener('resize',()=>{resizeFx();clearTimeout(rz);rz=setTimeout(()=>{if(G&&ui.scr==='run'&&G.screen==='combat'&&$('#cb')){layoutEnemies();updCombat();renderHand();}},120);});
GK.studio();
GK.coach.create('kettle-crawl-first',[{target:()=>document.querySelector('#hand .card'),done:()=>kcPlayed}],{when:()=>ui.scr==='run'&&!!G&&G.screen==='combat'&&!modal.classList.contains('on')&&!ui.busy});
GK.wired('motion','game reduced-motion read follows the kit: Calm = its old reduce mode (bursts a third, no shake, pulses rest), Still also drops bursts');
GK.wired('text','page CSS and inline sizes floored and scaled; HUD pills, intents, status chips, HP bars, map labels and end-turn row capped at 1.25; card faces scale with the card');
resizeFx();requestAnimationFrame(loop);render();
})();
</script>
