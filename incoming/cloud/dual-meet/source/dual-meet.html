<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Dual Meet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one phone column. Title card, then the meet sheet (one card per event in meet order) with a docked Swim bar,
   then a results card that reveals event by event. Look: a pool deck at night under scoreboard light.
   Single dark theme by choice: it is a scoreboard. Shapes carry meaning as well as color: ● you, ◆ them, ★ scouted, ▲ back-to-back. */
:root{
  color-scheme: dark;
  --bg:#0a1620; --bg2:#0f2130; --panel:#122635; --panel2:#17304266; --line:#24425a; --ink:#eaf4f8; --muted:#a3bac8;
  --you:#4cc9f0; --you2:#0e3a4d; --them:#ffa25c; --them2:#4a2a14; --gold:#ffd45e; --good:#6ef0b4; --bad:#ff7d72; --warn:#ffc94d;
  --display:"Avenir Next Condensed","Futura","Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --body:"Avenir Next","Segoe UI","Helvetica Neue",Roboto,Arial,sans-serif;
  --mono:"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.4 var(--body);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:.02em;text-wrap:balance}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:0 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:15px}
.btn.go{background:var(--gold);color:#241a00;border-color:transparent}
.btn.big{min-height:60px;font:800 22px var(--display);letter-spacing:.06em;text-transform:uppercase;width:100%}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45}
/* ---------- title ---------- */
#sTitle{padding-block:calc(26px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.logo{font:800 clamp(52px,17vw,84px)/.86 var(--display);text-transform:uppercase;letter-spacing:.03em}
.logo span{color:var(--you)}
.logo i{font-style:normal;color:var(--them)}
.tag{margin:0;color:var(--muted);font-size:16px}
.today{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:4px}
.today .lbl{font:700 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.today b{font:700 21px var(--display);letter-spacing:.02em}
.foot{display:flex;gap:8px;flex-wrap:wrap}
.foot .btn{flex:1 1 30%}
/* ---------- meet ---------- */
#sMeet{padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:10px;padding:6px 0 10px}
.top .ic{width:44px;height:44px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font:700 20px var(--display);flex:none}
.top .mt{flex:1;min-width:0;display:grid}
.top .mt b{font:800 20px var(--display);letter-spacing:.03em;text-transform:uppercase}
.top .mt span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin:0 0 10px}
.legend .y{color:var(--you)} .legend .t{color:var(--them)} .legend .g{color:var(--gold)} .legend .w{color:var(--warn)}
.coach{background:#2b2308;border:1px solid #6b5a1c;color:#fff4cf;border-radius:14px;padding:10px 12px;margin:0 0 10px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.coach .ct{flex:1}
.coach .btn{min-height:36px;padding:0 12px;font-size:13px;background:#4a3d10;border-color:#6b5a1c}
#events{display:flex;flex-direction:column;gap:10px}
.ev{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 10px 12px;display:grid;gap:8px}
.ev.sc{border-color:#806a22;box-shadow:inset 3px 0 0 var(--gold)}
.evh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.evh .n{font:700 12px var(--mono);color:var(--muted);min-width:18px}
.evh b{font:800 18px var(--display);letter-spacing:.03em;text-transform:uppercase}
.evh .st{font-size:12px;font-weight:700;letter-spacing:.04em}
.evh .st.g{color:var(--gold)} .evh .st.h{color:var(--muted)}
.evh .pj{margin-left:auto;font-size:12px;color:var(--muted)}
.evh .pj b{font:700 13px var(--mono);letter-spacing:0;text-transform:none}
.evh .pj .w{color:var(--good)} .evh .pj .l{color:var(--bad)}
.side{display:grid;grid-template-columns:18px 1fr;gap:6px;align-items:start}
.side .mk{font-size:15px;line-height:44px;text-align:center}
.side.you .mk{color:var(--you)} .side.them .mk{color:var(--them)}
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.lanes.r{grid-template-columns:repeat(2,minmax(0,1fr))}
.chip{min-height:46px;border-radius:10px;padding:5px 7px;text-align:left;display:grid;gap:1px;min-width:0;border:1px solid transparent}
.you .chip{background:var(--you2);border-color:#1d5a73}
.you .chip:active{background:#145069}
.them .chip{background:var(--them2);border-color:#6a3d1d}
.chip .cn{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .cl{font-size:12px;color:var(--muted)}
.chip .ct{font:600 13px var(--mono);display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.chip .cf{font:700 12px var(--body);color:var(--warn)}
.chip.empty{border-style:dashed;border-color:#3a6178;background:transparent;color:var(--muted);align-content:center;font-size:13px;font-weight:700}
.chip.pulse{animation:pulse 1.1s ease-in-out infinite;border-color:var(--gold)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,212,94,.0)}50%{box-shadow:0 0 0 4px rgba(255,212,94,.55)}}
.hid{font-size:13px;color:var(--muted);line-height:1.35;padding-top:4px}
.hid .num{color:var(--ink)}
.brk{font-size:12px;color:var(--muted);text-align:center;padding:2px 0;letter-spacing:.06em;text-transform:uppercase}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:linear-gradient(to top,var(--bg) 70%,rgba(10,22,32,0));padding:14px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.dock .in{max-width:488px;margin:0 auto;display:flex;gap:8px;align-items:center}
.dock .info{flex:1;min-width:0;font-size:12px;color:var(--muted);line-height:1.3}
.dock .info b{color:var(--ink);font-size:13px}
.dock .btn.go{min-width:132px;min-height:54px;font:800 21px var(--display);letter-spacing:.08em;text-transform:uppercase}
/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(2,8,12,.62);display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--bg2);border:1px solid var(--line);border-bottom:0;width:100%;max-width:520px;max-height:86vh;max-height:86dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.shHead{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.shHead b{flex:1;font:800 18px var(--display);letter-spacing:.03em;text-transform:uppercase;min-width:0}
.shBody{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
.pk{display:grid;grid-template-columns:18px 1fr auto;gap:2px 8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 10px;text-align:left;min-height:52px}
.pk .mk{color:var(--you);grid-row:span 2}
.pk .pn{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk .pt{font:700 15px var(--mono);text-align:right}
.pk .pm{font-size:12px;color:var(--muted);grid-column:2/4}
.pk .pm .w{color:var(--warn);font-weight:700}
.pk.cur{border-color:var(--you)}
.pk.off{opacity:.5}
.pk.pulse{animation:pulse 1.1s ease-in-out infinite;border-color:var(--gold)}
.sec{font:700 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.note{font-size:14px;color:var(--muted);margin:0}
.rules{margin:0;padding-left:18px;display:grid;gap:8px;font-size:14px}
.rules b{color:var(--ink)}
.tabs{display:flex;gap:6px}
.tabs .btn{flex:1;min-height:40px}
.tabs .btn.on{background:var(--you2);border-color:var(--you)}
.ros{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 10px;display:grid;gap:3px}
.ros .rn{display:flex;gap:8px;align-items:baseline}
.ros .rn b{font-size:15px}
.ros .rn span{font-size:12px;color:var(--muted)}
.ros .rn .cnt{margin-left:auto;font:700 12px var(--mono);color:var(--ink)}
.ros .re{font-size:13px;color:var(--muted)}
.ros .re .num{color:var(--ink)}
/* ---------- results ---------- */
#sRes{padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.board{background:#050c12;border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;display:grid;gap:6px;text-align:center}
.board .lbl{font:700 12px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.score .tm{font:700 13px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .pts{font:800 54px/1 var(--mono);font-variant-numeric:tabular-nums}
.score .you .pts{color:var(--you)} .score .them .pts{color:var(--them)}
.score .dash{font:800 30px var(--mono);color:var(--muted)}
.bump{animation:bump .28s ease-out}
@keyframes bump{0%{transform:scale(1.18)}100%{transform:scale(1)}}
#rWL{font:800 30px var(--display);letter-spacing:.12em;text-transform:uppercase}
#rWL.w{color:var(--good)} #rWL.l{color:var(--bad)} #rWL.t{color:var(--gold)}
#rRate{font-size:14px;color:var(--muted)}
#rRate b{color:var(--ink)}
.stars{color:var(--gold);font-size:18px;letter-spacing:2px}
#rEvents{display:flex;flex-direction:column;gap:8px}
.re1{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:grid;gap:4px;animation:rin .3s ease-out}
@keyframes rin{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
.re1 .rh{display:flex;gap:8px;align-items:baseline}
.re1 .rh b{font:800 16px var(--display);letter-spacing:.03em;text-transform:uppercase}
.re1 .rh .rp{margin-left:auto;font:700 13px var(--mono)}
.re1 .rh .rp .y{color:var(--you)} .re1 .rh .rp .t{color:var(--them)}
.rr{display:grid;grid-template-columns:22px 16px 1fr auto 30px;gap:6px;font-size:13px;align-items:baseline}
.rr .pl{color:var(--muted);font:600 12px var(--mono)}
.rr.y .mk{color:var(--you)} .rr.t .mk{color:var(--them)}
.rr .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr .tm{font:600 13px var(--mono)}
.rr .pt{font:700 13px var(--mono);text-align:right}
.rr.y .pt{color:var(--you)} .rr.t .pt{color:var(--them)}
.rr .b2{color:var(--warn);font-size:12px}
.resBtns{display:grid;gap:8px}
.resBtns .row .btn{flex:1}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px}
.cmp div{min-width:0}
.cmp .chg{color:var(--gold);font-weight:700}
.badgeWrap .gk-badges{grid-template-columns:repeat(2,minmax(0,1fr))!important}
@media (prefers-reduced-motion:reduce){.chip.pulse,.pk.pulse{animation:none;box-shadow:0 0 0 3px rgba(255,212,94,.6)}.re1,.bump{animation:none}}
</style>
<div id="app">
  <section id="sTitle" aria-label="Title">
    <div class="logo">Dual<br><span>Me</span><i>et</i></div>
    <p class="tag">Set the lineup. Out-think their coach. One meet a day.</p>
    <div class="today" id="tToday"><span class="lbl" id="tDate">Today</span><b id="tVs">Setting up today's meet</b><span class="muted small" id="tState"></span></div>
    <button class="btn go big" id="tGo">Today's meet</button>
    <button class="btn" id="tPractice">Practice meet</button>
    <div class="muted small" id="tNext"></div>
    <div class="foot"><button class="btn" id="tHelp">How to play</button><button class="btn" id="tBadges">Badges</button><button class="btn" id="tSet">Settings</button></div>
  </section>

  <section id="sMeet" aria-label="Meet" hidden>
    <div class="top">
      <button class="ic" id="mBack" aria-label="Back to the title">‹</button>
      <div class="mt"><b id="mTitle">Dual meet</b><span id="mSub"></span></div>
      <button class="ic" id="mHelp" aria-label="How to play">?</button>
    </div>
    <div class="coach" id="coach" hidden><div class="ct" id="coachT"></div><button class="btn" id="coachX">Got it</button></div>
    <div class="legend"><span class="y">● You</span><span class="t">◆ Them</span><span class="g">★ Scouted</span><span class="w">▲ Back-to-back +2%</span></div>
    <div id="events"></div>
    <div class="dock"><div class="in">
      <button class="btn" id="mRoster">Roster</button>
      <div class="info" id="mInfo"></div>
      <button class="btn go" id="mSwim">Swim</button>
    </div></div>
  </section>

  <section id="sRes" aria-label="Results" hidden>
    <div class="board">
      <div class="lbl" id="rLbl">Final</div>
      <div class="score"><div class="you"><div class="tm" id="rYouN">You</div><div class="pts" id="rUs">0</div></div><div class="dash">–</div><div class="them"><div class="tm" id="rThemN">Them</div><div class="pts" id="rThem">0</div></div></div>
      <div id="rWL"></div>
      <div id="rRate"></div>
    </div>
    <div class="resBtns" id="rBtns">
      <button class="btn go big" id="rAgain">Again</button>
      <div class="row"><button class="btn" id="rShare">Share</button><button class="btn" id="rBest">Best lineup</button><button class="btn" id="rMenu">Menu</button></div>
    </div>
    <button class="btn" id="rSkip">Skip to the end</button>
    <div id="rEvents"></div>
  </section>

  <div class="sheet" id="sheet" hidden><div class="sh" role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <div class="shHead"><b id="shTitle"></b><button class="btn" id="shClose">Close</button></div>
    <div class="shBody" id="shBody"></div>
  </div></div>
</div>

<script id="gamekit">/* GameKit 1.1 : shared starter kit for single-file phone games.
   Paste inline in a script tag before the game's own script. No build step, no network.
   Modules: GK.rng, GK.daily, GK.save, GK.audio, GK.input, GK.juice, GK.ease,
            GK.badges, GK.share, GK.view, GK.ui, GK.loop, GK.retrofit.  README.md has the API. */

  var W = HAS_DOM ? window : {};

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function on(t, ev, fn, opt) { if (t && t.addEventListener) t.addEventListener(ev, fn, opt); }

    get: function (k) { try { var v = W.localStorage.getItem(k); return v == null ? (k in mem ? mem[k] : null) : v; } catch (e) { return k in mem ? mem[k] : null; } },
    set: function (k, v) { mem[k] = v; try { W.localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del: function (k) { delete mem[k]; try { W.localStorage.removeItem(k); } catch (e) {} }

      next: fn,

      int: function (lo, hi) { return lo + Math.floor(fn() * (hi - lo + 1)); }, // inclusive

  var CONS = 'BCDFGHJKLMNPQRSTVWXZ';
  GK.rng = {
    hash32: hash32,
    hash4: hash4,
    mulberry32: mulberry32,

        ES[e].forEach(function (si) {
          var p = M.luB[si], s = SL[si]; if (p < 0) { h += '<div class="chip empty">Empty</div>'; return; }
          h += '<div class="chip">' + (s.relay ? '<span class="cl">' + DM.LEGNAME[s.leg] + (ev.legs[0] === 'free' ? ' ' + (s.k + 1) : '') + '</span>' : '') + '<span class="cn">' + esc(sw(1, p).short) + '</span><span class="ct">' + fmt(pB.t[si]) + (pB.b2b[si] ? '<span class="cf">▲</span>' : '') + '</span></div>';
        });
        h += '</div>';
      } else h += '<div class="hid">' + topSeeds(e) + '</div>';
      h += '</div></div>';
      if (ev.brk) h += '<div class="brk">Diving · swimmers get a break</div>';
    }
    $('events').innerHTML = h;
    $('mInfo').innerHTML = '<b>Scouted events: ' + pts(seenUs) + '–' + pts(seenThem) + '</b><br>' + M.reveal.length + ' of 11 seen' + (empty ? ' · ' + empty + ' empty ' + (empty === 1 ? 'lane' : 'lanes') : ' · all lanes filled');
    $('mSwim').disabled = false;
  }
  // what a coach can see of a hidden event: their roster's top seeds
  function topSeeds(e) {
    var M = st.M, ev = EV[e], ros = M.away.swimmers;
    if (!ev.relay) {
      var a = ros.slice().sort(function (x, y) { return x.ab[ev.ab] - y.ab[ev.ab]; }).slice(0, 3);
      return 'Their top seeds: ' + a.map(function (s) { return esc(s.last) + ' <span class="num">' + fmt(s.ab[ev.ab]) + '</span>'; }).join(' · ');
    }
    var base = function (s, leg, k) { return DM.slotBase(M.away, ES[e][k], s.id); };
    if (ev.legs[0] === 'free') {
      var f = ros.slice().sort(function (x, y) { return base(x, 'free', 1) - base(y, 'free', 1); }).slice(0, 4);
      return 'Their four fastest: ' + f.map(function (s) { return esc(s.last); }).join(', ');
    }
    var out = [];
    ['back', 'breast', 'fly'].forEach(function (lg, k) { var b = ros.slice().sort(function (x, y) { return base(x, lg, k) - base(y, lg, k); })[0]; out.push(DM.LEGNAME[lg] + ' ' + esc(b.last)); });
    return 'Their best legs: ' + out.join(' · ');
  }

  /* ---------- placing a swimmer ---------- */
  var place = DM.place;
  function schedule(lu, p) {
    var ind = [], all = [];
    EV.forEach(function (ev, e) { if (ES[e].some(function (si) { return lu[si] === p; })) { all.push(ev.short); if (!ev.relay) ind.push(ev.short); } });
    return { ind: ind, all: all };
  }
  function openPick(si) {
    var M = st.M, s = SL[si], ev = EV[s.ev], cur = st.lu[si], rows = [], c = DM.counts(st.lu);
    for (var p = 0; p < DM.ROSTER; p++) {
      var r = place(st.lu, si, p), sc = schedule(st.lu, p), base = { p: p, s: M.home.swimmers[p], sched: sc, ind: c.ind[p], tot: c.tot[p] };
      if (r.lu) rows.push(proj(Object.assign({ r: r, lu: r.lu }, base), si));
      else {
        var tr = DM.trades(st.lu, si, p);
        if (tr.length) tr.forEach(function (t) { rows.push(proj(Object.assign({ r: r, lu: t.lu, tr: t }, base), si)); });
        else rows.push(Object.assign({ r: r }, base));
      }
    }
    rows.sort(function (a, b) { if (!!a.lu !== !!b.lu) return a.lu ? -1 : 1; if (a.lu) return a.t - b.t || (a.tr ? 1 : 0) - (b.tr ? 1 : 0); return a.p - b.p; });
    var h = '<p class="note">' + (s.relay ? DM.LEGNAME[s.leg] + ' leg' + (ev.legs[0] === 'free' ? ' ' + (s.k + 1) : '') + '. ' : '') + 'Times include tiredness from earlier swims. Up to 2 individual events and 4 events each.</p>';
    rows.forEach(function (w) {
      var ok = !!w.lu, hp = st.hint && st.hint.slot === si && st.hint.p === w.p && (st.hint.trade == null ? !w.tr : w.tr && w.tr.slot === st.hint.trade), pulse = hp ? ' pulse' : '';
      var meta;
      if (w.tr) meta = '↔ Trade: ' + (w.tr.q < 0 ? 'leaves ' + EV[w.tr.ev].short + ' open' : esc(M.home.swimmers[w.tr.q].short) + ' takes ' + esc(w.s.short) + '\'s ' + EV[w.tr.ev].short);
      else if (ok) { meta = w.s.label + ' · grade ' + w.s.grade + ' · ' + w.ind + '/2 ind · ' + w.tot + '/4 events'; if (w.sched.all.length) meta += ' · swims ' + w.sched.all.join(', '); }
      else meta = esc(w.r.err) + ' · ' + w.s.label;
      if (ok && w.b2b) meta += ' · <span class="w">▲ back-to-back +' + ((w.m - 1) * 100).toFixed(1) + '%</span>';
      else if (ok && w.m > 1.0049) meta += ' · tired +' + ((w.m - 1) * 100).toFixed(1) + '%';
      h += '<button class="pk' + (w.p === cur ? ' cur' : '') + (ok ? '' : ' off') + pulse + '" data-p="' + w.p + '"' + (w.tr ? ' data-tr="' + w.tr.slot + '"' : '') + (ok ? '' : ' aria-disabled="true"') + '><span class="mk">●</span><span class="pn">' + esc(w.s.name) + (w.p === cur ? ' (here now)' : w.r.swap ? ' (swap lanes)' : '') + '</span><span class="pt">' + (ok ? fmt(w.t) : '–') + '</span><span class="pm">' + meta + '</span></button>';
    });
    if (!s.relay) h += '<button class="pk' + (cur < 0 ? ' cur' : '') + (st.hint && st.hint.slot === si && st.hint.p === -1 ? ' pulse' : '') + '" data-p="-1"><span class="mk">○</span><span class="pn">Leave this lane empty</span><span class="pt"></span><span class="pm">Scores nothing here, frees this swimmer for another event.</span></button>';
    openSheet(ev.name + (s.relay ? ' · ' + DM.LEGNAME[s.leg] : ' · lane ' + (s.k + 1)), h, { kind: 'pick', slot: si });
  }
  function proj(w, si) { var pr = DM.project(st.M.home, w.lu); w.t = pr.t[si]; w.m = pr.mult[si]; w.b2b = pr.b2b[si]; return w; }
  function choose(si, p, tr) {
    var r = place(st.lu, si, p), nlu = r.lu;
    if (!nlu && tr != null) { var t = DM.trades(st.lu, si, p).filter(function (x) { return x.slot === +tr; })[0]; if (t) nlu = t.lu; }
    if (!nlu) { GK.ui.toast(r.err, 2400); J.haptic('fail'); return false; }
    st.lu = nlu; closeSheet();
    if (!st.practice) { D.draft.key = st.key; D.draft.lu = st.lu.slice(); save(); }
    GK.audio.play('tap'); J.haptic('tap');
    if (D.tut === 0 && st.hint) { st.hint = null; coach('Nice. The ★ events show seed points. Fix anything else you want, then tap Swim.'); }
    renderMeet();
    return true;
  }

  /* ---------- sheets ---------- */
  function openSheet(title, html, o) { st.sheet = o || { kind: 'info' }; $('shTitle').textContent = title; $('shBody').innerHTML = html; $('sheet').hidden = false; }
  function closeSheet() { st.sheet = null; $('sheet').hidden = true; $('shBody').innerHTML = ''; }
  function openRoster(tab) {
    var M = st.M, lu = st.lu, h = '<div class="tabs"><button class="btn' + (tab !== 'them' ? ' on' : '') + '" data-act="ros-you">Your roster</button><button class="btn' + (tab === 'them' ? ' on' : '') + '" data-act="ros-them">' + esc(M.away.school) + '</button></div>';
    var c = DM.counts(lu);
    if (tab !== 'them') {
      M.home.swimmers.forEach(function (s, p) {
        var sc = schedule(lu, p);
        h += '<div class="ros"><div class="rn"><span style="color:var(--you)">●</span><b>' + esc(s.name) + '</b><span>' + s.label + ' · ' + s.grade + '</span><span class="cnt">' + c.ind[p] + '/2 · ' + c.tot[p] + '/4</span></div><div class="re">' + (sc.all.length ? 'Swims ' + sc.all.join(', ') : 'Not swimming yet') + '</div><div class="re">' + bests(s) + '</div></div>';
      });
    } else {
      h += '<p class="note">Season best times. Their lineup is hidden except the ★ events.</p>';
      M.away.swimmers.forEach(function (s) { h += '<div class="ros"><div class="rn"><span style="color:var(--them)">◆</span><b>' + esc(s.name) + '</b><span>' + s.label + ' · ' + s.grade + '</span></div><div class="re">' + bests(s) + '</div></div>'; });
    }
    openSheet('Roster', h, { kind: 'roster', tab: tab });
  }
  function bests(s) {
    var a = s.ab, L = [['50 Fr', a.f50], ['100 Fr', a.f100], ['200 Fr', a.f200], ['500 Fr', a.f500], ['100 Bk', a.bk100], ['100 Br', a.br100], ['100 Fl', a.fl100], ['200 IM', a.im200]];
    return L.map(function (x) { return x[0] + ' <span class="num">' + fmt(x[1]) + '</span>'; }).join(' · ');
  }
  function openHelp() {
    openSheet('How to play', '<ol class="rules">' +
      '<li><b>Beat their lineup.</b> Put your 12 swimmers into the 11 events of a high school dual meet, then tap Swim.</li>' +
      '<li><b>Entry limits.</b> Each swimmer gets up to 2 individual events and 4 events in all. You have 3 lanes in each individual event and one relay.</li>' +
      '<li><b>Scoring.</b> Individual places score 6, 4, 3, 2, 1. A relay win scores 8 and second scores 4. Ties split the points. 164 points in all, so 83 wins.</li>' +
      '<li><b>Tired swimmers.</b> Every earlier swim adds a little time, more after long races. Back-to-back events (▲) add 2%. Diving after the 50 Free is a break.</li>' +
      '<li><b>Scouting.</b> Their coach built a lineup to beat your usual one. You can see 4 of their events (★). For the rest you see their top seeds.</li>' +
      '<li><b>Race day.</b> Every swim moves a few tenths from its seed, so a very close race can go either way. A clear gap never flips.</li>' +
      '<li><b>Daily.</b> One meet a day, the same for everyone, new at your midnight. Practice meets never run out.</li>' +
      '</ol><p class="note">All swimmers and schools are made up.</p>', { kind: 'help' });
  }
  function openSettings() {
    openSheet('Settings', '<div class="row"><button class="btn" data-act="mute">' + (D.muted ? 'Sound: off' : 'Sound: on') + '</button><button class="btn" data-act="tut">Show the tips again</button></div>' +
      '<div class="sec">Your save</div><p class="note">Progress keeps three backups and saves when you leave. Safari can clear a page after 7 days away, so export a code now and then.</p>' +
      '<div class="row"><button class="btn" data-act="export">Export save</button><button class="btn" data-act="import">Import save</button></div>', { kind: 'settings' });
  }
  function openBadges() {
    openSheet('Badges · ' + BD.count() + ' of ' + BADGES.length, '<div class="badgeWrap" id="bdWrap"></div>', { kind: 'badges' });
    BD.render($('bdWrap'));
  }
  var tools = GK.ui.saveTools(S, { onImported: function () { D = S.data; BD = GK.badges.create(BADGES, D.badges, { toast: true }); GK.audio.setMuted(D.muted); goTitle(); } });
  function sheetAct(act) {
    if (act === 'ros-you') openRoster('you');
    else if (act === 'ros-them') openRoster('them');
    else if (act === 'mute') { D.muted = !D.muted; GK.audio.setMuted(D.muted); save(); openSettings(); }
    else if (act === 'tut') { D.tut = 0; save(); GK.ui.toast('Tips will show on your next meet', 2000); }
    else if (act === 'export') { closeSheet(); tools.exportSave(); }
    else if (act === 'import') { closeSheet(); tools.importSave(); }
    else if (act === 'again') { closeSheet(); again(); }
  }

  /* ---------- swim and results ---------- */
  function swimNow() {
    if (st.mode !== 'meet') return;
    closeSheet();
    if (D.tut === 0) { D.tut = 1; coach(''); }
    finish(true);
  }
  function finish(fresh) {
    var M = st.M, r = DM.swim(M, st.lu), best = M.best, low = 0, relays = 0, empty = 0;
    r.events.forEach(function (e) { low = Math.min(low, e.runUs - e.runThem); if (EV[e.ev].relay && e.us > e.them) relays++; });
    st.lu.forEach(function (p) { if (p < 0) empty++; });
    var beat = r.margin > best.margin, perfect = r.margin >= best.margin;
    st.res = { r: r, best: best, beat: beat, perfect: perfect, low: low, relays: relays, empty: empty };
    if (fresh) {
      D.plays++; if (r.margin > 0) D.wins++; if (perfect) D.perfect++; if (beat) D.beat++;
      if (!st.practice) {
        D.today = { key: st.key, lu: st.lu.slice(), us: r.us, them: r.them, best: best.margin };
        D.draft = { key: '', lu: [] };
        GK.daily.mark(D.days, st.key);
        D.hist.push({ k: st.key, us: r.us, them: r.them, best: best.margin }); if (D.hist.length > 60) D.hist.splice(0, D.hist.length - 60);
      }
      save();
    }
    show('res'); renderResults(fresh);
  }
  function stars(res) { var m = res.r.margin, b = res.best.margin; return res.perfect ? 3 : m > 0 && m >= b / 2 ? 2 : m > 0 ? 1 : 0; }
  function renderResults(animate) {
    var M = st.M, res = st.res, r = res.r;
    $('rYouN').textContent = M.home.school; $('rThemN').textContent = M.away.school;
    $('rLbl').textContent = st.practice ? (st.retry ? 'Today again · not scored' : 'Practice · ' + st.code) : 'Final · ' + GK.daily.label(st.key);
    $('rEvents').innerHTML = ''; st.shown = 0; st.reveal = r.events.map(eventCard);
    $('rBest').textContent = 'Best';
    var reduce = false; try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (!animate) { revealAll(); return; }
    $('rWL').textContent = ''; $('rRate').innerHTML = ''; $('rUs').textContent = '0'; $('rThem').textContent = '0';
    $('rBtns').hidden = true; $('rSkip').hidden = false;
    var step = reduce ? 260 : 620;
    (function tick() {
      if (st.mode !== 'res' || st.shown >= r.events.length) { if (st.shown >= r.events.length) endReveal(); return; }
      showEvent(st.shown++, true);
      st.timer = setTimeout(tick, step);
    })();
  }
  function showEvent(i, sound) {
    var e = st.res.r.events[i], box = $('rEvents');
    box.innerHTML = st.reveal[i] + box.innerHTML; // newest on top
    $('rUs').textContent = pts(e.runUs); $('rThem').textContent = pts(e.runThem);
    $('rUs').className = 'pts bump'; $('rThem').className = 'pts';
    if (sound) GK.audio.play(e.us > e.them ? 'success' : e.us < e.them ? 'fail' : 'tap', { vol: e.us > e.them ? 0.55 : 0.3 });
  }
  function revealAll() { clearTimeout(st.timer); var box = $('rEvents'); box.innerHTML = st.reveal.slice().reverse().join(''); st.shown = st.reveal.length; endReveal(true); }
  function endReveal(quiet) {
    var res = st.res, r = res.r, M = st.M, b = res.best, n = stars(res);
    $('rUs').textContent = pts(r.us); $('rThem').textContent = pts(r.them);
    var w = r.margin > 0 ? 'w' : r.margin < 0 ? 'l' : 't';
    $('rWL').className = w; $('rWL').textContent = w === 'w' ? 'Win by ' + pts(r.margin) : w === 'l' ? 'Lose by ' + pts(-r.margin) : 'Tie';
    $('rRate').innerHTML = '<div class="stars" aria-label="' + n + ' of 3 stars">' + '★★★'.slice(0, n) + '<span style="opacity:.3">' + '★★★'.slice(0, 3 - n) + '</span></div>' +
      (res.beat ? '<b>You beat the best lineup we found (' + signed(b.margin) + ').</b>' : res.perfect ? '<b>Perfect lineup.</b> That matches the best we found.' : 'Best lineup found: <b>' + signed(b.margin) + '</b> (' + pts(b.us) + '–' + pts(b.them) + ')') +
      (st.practice ? '' : '<br>New meet in ' + GK.daily.countdown(GK.daily.msToNext()));
    $('rBtns').hidden = false; $('rSkip').hidden = true;
    $('rBest').textContent = 'Best'; $('rShare').textContent = 'Share';
    var retry = $('rRetry'); if (retry) retry.hidden = st.practice;
    if (!quiet) { GK.audio.play(r.margin > 0 ? 'win' : 'fail'); J.haptic(r.margin > 0 ? 'success' : 'fail'); }
    BD.check({ plays: D.plays, won: r.margin > 0, margin: r.margin, perfect: res.perfect, beat: res.beat, relays: res.relays, low: res.low, empty: res.empty, days: D.days.days });
    save();
  }
  function signed(x) { return (x > 0 ? '+' : x < 0 ? '−' : '') + pts(Math.abs(x)); }
  function eventCard(e) {
    var M = st.M, ev = EV[e.ev], h = '<div class="re1"><div class="rh"><span class="num muted small">' + (e.ev + 1) + '</span><b>' + ev.name + '</b><span class="rp"><span class="y">● ' + pts(e.us) + '</span> · <span class="t">◆ ' + pts(e.them) + '</span></span></div>';
    e.entries.forEach(function (x) {
      var nm = ev.relay ? (x.side === 0 ? M.home.school : M.away.school) + ' relay' : (x.side === 0 ? M.home : M.away).swimmers[x.p].short;
      h += '<div class="rr ' + (x.side === 0 ? 'y' : 't') + '"><span class="pl">' + x.place + (x.tie ? '=' : '') + '</span><span class="mk">' + (x.side === 0 ? '●' : '◆') + '</span><span class="nm">' + esc(nm) + (x.b2b ? ' <span class="b2">▲</span>' : '') + '</span><span class="tm">' + fmt(x.t) + '</span><span class="pt">' + pts(x.pts) + '</span></div>';
      if (ev.relay) h += '<div class="small muted" style="padding-left:44px">' + x.legs.map(function (l, k) { return DM.LEGNAME[ev.legs[k]] + ' ' + esc((x.side === 0 ? M.home : M.away).swimmers[l.p].last) + ' ' + fmt(l.t); }).join(' · ') + '</div>';
    });
    return h + '</div>';
  }
  function shareText() {
    var r = st.res.r, b = st.res.best, n = stars(st.res);
    var grid = r.events.map(function (e) { return e.us > e.them ? '🟦' : e.us < e.them ? '🟥' : '🟨'; }).join('');
    var score = (r.margin > 0 ? 'W ' : r.margin < 0 ? 'L ' : 'T ') + pts(r.us) + '-' + pts(r.them);
    var tail = '★'.repeat(n) + '☆'.repeat(3 - n) + ' · best ' + signed(b.margin);
    if (st.practice && !st.retry) return 'Dual Meet practice ' + st.code + ': ' + score + '\n' + grid + '\n' + tail;
    return GK.daily.shareLine({ game: 'Dual Meet' + (st.retry ? ' (retry)' : ''), key: st.retry ? todayKey() : st.key, score: score, grid: grid, tail: tail });
  }
  function openBest() {
    var M = st.M, bl = M.best.lu, lu = st.lu, h = '<p class="note">The best lineup we found against their real lineup, race-day swings included: ' + pts(M.best.us) + '–' + pts(M.best.them) + '. Gold names are where it differs from yours.</p><div class="cmp"><div class="sec">Yours</div><div class="sec">Best found</div>';
    EV.forEach(function (ev, e) {
      var mine = ES[e].map(function (si) { return lu[si] < 0 ? '–' : M.home.swimmers[lu[si]].last; });
      var bb = ES[e].map(function (si) { var x = bl[si] < 0 ? '–' : M.home.swimmers[bl[si]].last; return lu[si] !== bl[si] ? '<span class="chg">' + esc(x) + '</span>' : esc(x); });
      h += '<div><b>' + ev.short + '</b><br>' + mine.map(esc).join(', ') + '</div><div><b>&nbsp;</b><br>' + bb.join(', ') + '</div>';
    });
    h += '</div><div class="sec">Their full lineup</div><div class="cmp">';
    EV.forEach(function (ev, e) { h += '<div><b>' + ev.short + '</b></div><div>' + ES[e].map(function (si) { return M.luB[si] < 0 ? '–' : esc(M.away.swimmers[M.luB[si]].last); }).join(', ') + '</div>'; });
    openSheet('Best lineup', h + '</div>', { kind: 'best' });
  }
  function again() { GK.ui.toast('New practice meet', 1200); setTimeout(function () { openPractice(); }, 30); }

  /* ---------- wiring ---------- */
  function on(id, fn) { var el = $(id); if (el) el.addEventListener('click', fn); }
  function attr(e, name) { var el = e && e.target; while (el && el !== document) { if (el.getAttribute && el.getAttribute(name) != null) return el.getAttribute(name); el = el.parentNode; } return null; }
  on('tGo', function () { openToday(); });
  on('tPractice', function () { again(); });
  on('tHelp', openHelp); on('tBadges', openBadges); on('tSet', openSettings);
  on('mBack', goTitle); on('mHelp', openHelp); on('mRoster', function () { openRoster('you'); }); on('mSwim', swimNow);
  on('coachX', function () { coach(''); });
  on('rAgain', again); on('rShare', function () { GK.share.text(shareText(), { title: 'Dual Meet' }); });
  on('rBest', openBest); on('rMenu', goTitle); on('rSkip', function () { revealAll(); });
  on('shClose', closeSheet);
  $('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) closeSheet(); });
  $('events').addEventListener('click', function (e) { var s = attr(e, 'data-slot'); if (s != null) openPick(+s); });
  $('shBody').addEventListener('click', function (e) {
    var a = attr(e, 'data-act'); if (a) { sheetAct(a); return; }
    var p = attr(e, 'data-p'); if (p != null && st.sheet && st.sheet.kind === 'pick') choose(st.sheet.slot, +p, attr(e, 'data-tr'));
  });
  // a Retry button for today's meet sits beside Share/Best/Menu on daily results
  (function () { var row = $('rShare') && $('rShare').parentNode; if (!row || !row.insertBefore) return; var b = document.createElement('button'); b.className = 'btn'; b.id = 'rRetry'; b.textContent = 'Retry'; b.addEventListener('click', retryToday); row.insertBefore(b, $('rMenu')); })();
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && st.sheet) closeSheet(); });

  show('title'); titleRender();
  setTimeout(function () { todayMeet(); titleRender(); }, 30);
  setInterval(function () { if (st.mode === 'title') titleRender(); }, 30000);

  // test hook (bots and smoke tests drive the real handlers through this)
  window.__DMT = {
    st: st, get D() { return D; }, S: S, DM: DM, BD: BD,
    openToday: openToday, openPractice: openPractice, retryToday: retryToday, openPick: openPick, choose: choose, place: place,
    swim: swimNow, revealAll: revealAll, shareText: shareText, openBest: openBest, openRoster: openRoster, openHelp: openHelp, openSettings: openSettings, openBadges: openBadges,
    goTitle: goTitle, sheetAct: sheetAct, todayMeet: todayMeet
  };
})();
</script>
</body></html>
