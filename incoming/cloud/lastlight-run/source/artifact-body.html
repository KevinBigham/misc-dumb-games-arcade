<title>Lastlight Run</title>
<style>
/* Layout: one full-bleed canvas world with a thin DOM HUD on top and touch zones underneath it. */
:root{
  color-scheme: dark;
  --bg:#0d0a1f;          /* night indigo */
  --panel:rgba(16,12,38,.86);
  --ink:#fff1dc;         /* warm lantern-lit paper */
  --muted:#c9b8d6;
  --amber:#ffb84d;       /* lantern flame */
  --rose:#ff7a6b;        /* setting sun */
  --sky:#7fc4ff;         /* ghost wisp */
  --good:#7ff0b0;
  --bad:#ff8a8a;
  --gold:#ffd45e; --silver:#dfe7f5; --bronze:#de9466;
  --display:"Avenir Next Condensed","Futura","Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --body:"Avenir Next","Segoe UI","Helvetica Neue",Roboto,Arial,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--body);-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;width:100%;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:3;contain:strict}
.hud-left,.light,.prog,#toast,#hDraft{contain:layout}
.hud-top{position:absolute;top:8px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.hud-left{display:flex;flex-direction:column;gap:2px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#hTime{font:800 italic 26px/1 var(--display);letter-spacing:.02em}
#hSub{font:600 calc(max(12px, 12px) * min(var(--gk-text-scale, 1), 1.25))/1.2 var(--body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
#bPause{pointer-events:auto;width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,241,220,.25);background:rgba(10,8,26,.45);font:800 calc(max(12px, 15px) * var(--gk-text-scale, 1))/1 var(--display);letter-spacing:.08em}
.light{position:absolute;top:60px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px}
.sunico{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff6c8,var(--amber) 55%,var(--rose));box-shadow:0 0 12px var(--amber);flex:none}
.lbar{position:relative;flex:1;height:12px;border-radius:7px;background:rgba(8,6,22,.55);border:1px solid rgba(255,241,220,.22);overflow:hidden}
#hLightFill{position:absolute;inset:0;transform-origin:0 50%;will-change:transform;background:linear-gradient(90deg,var(--rose),var(--amber) 60%,#fff2b0);border-radius:7px;transition:background .3s}
#hLightFill.low{background:linear-gradient(90deg,#7a2140,var(--bad))}
#hLight{font:800 italic calc(max(12px, 20px) * var(--gk-text-scale, 1))/1 var(--display);min-width:56px;text-align:right;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#hLight.low{color:var(--bad)}
.prog{position:absolute;top:84px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));height:6px;border-radius:3px;background:rgba(8,6,22,.45)}
.prog i{position:absolute;top:-3px;left:0;width:12px;height:12px;margin-left:-6px;border-radius:50%;will-change:transform}
#progP{background:var(--amber);border:2px solid #fff1dc;box-sizing:border-box}
#progG{background:var(--sky)}
.prog b{position:absolute;top:-1px;width:2px;height:8px;background:rgba(255,241,220,.55)}
#hDraft{position:absolute;top:100px;left:50%;transform:translateX(-50%);font:800 italic calc(max(12px, 14px) * var(--gk-text-scale, 1))/1 var(--display);letter-spacing:.18em;color:#0d0a1f;background:var(--sky);padding:5px 10px 4px;border-radius:999px;opacity:0;transition:opacity .15s}
#hDraft.on{opacity:1}
#pop{position:absolute;top:30%;left:0;right:0;text-align:center;font:800 italic 34px/1.05 var(--display);text-shadow:0 3px 14px rgba(0,0,0,.6);opacity:0}
#pop small{display:block;font:700 calc(max(12px, 18px) * var(--gk-text-scale, 1))/1.2 var(--body);letter-spacing:.04em;margin-top:4px}
#pop .g{color:var(--good)} #pop .b{color:var(--bad)}
#pop.show{animation:pop 1.3s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.12)}22%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
#count{position:absolute;top:34%;left:0;right:0;text-align:center;font:900 italic 96px/1 var(--display);color:var(--ink);text-shadow:0 6px 24px rgba(255,140,60,.6)}
#count.go{color:var(--amber)}
#toast{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(88%,420px);text-align:center;font:600 calc(max(12px, 15px) * var(--gk-text-scale, 1))/1.35 var(--body);background:var(--panel);border:1px solid rgba(255,241,220,.2);border-radius:14px;padding:10px 14px;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}

/* ---------- touch ---------- */
#touch{position:absolute;inset:0;z-index:2;display:grid;grid-template-columns:1fr 1fr}
.zone{position:relative}
.zone span{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 40px/1 var(--display);color:rgba(255,241,220,.55);border:2px solid rgba(255,241,220,.18);background:rgba(10,8,26,.22);transition:background .08s,transform .08s}
.zone.l span{left:max(18px,env(safe-area-inset-left,0px))} .zone.r span{right:max(18px,env(safe-area-inset-right,0px))}
.zone.hold span{background:rgba(255,184,77,.35);color:var(--ink);transform:scale(1.08)}
#bBoost{position:absolute;z-index:4;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:84px;height:84px;border-radius:50%;border:2px solid rgba(255,184,77,.7);background:radial-gradient(circle at 50% 40%,rgba(255,184,77,.45),rgba(30,14,40,.7));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:800 italic calc(max(12px, 15px) * min(var(--gk-text-scale, 1), 1.25))/1 var(--display);letter-spacing:.1em}
#bBoost[disabled]{opacity:.45}
#bBoost .pips{display:flex;gap:4px}
#bBoost .pips i{width:9px;height:9px;border-radius:50%;background:rgba(255,241,220,.2)}
#bBoost .pips i.on{background:var(--amber);box-shadow:0 0 6px var(--amber)}
#touch.drag{grid-template-columns:1fr}
#touch.drag .zone.r{display:none}
#touch.drag .zone.l span{left:50%;margin-left:-32px;display:none}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;z-index:5;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:flex;flex-direction:column;align-items:center;padding-block:20px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.screen.dim{background:linear-gradient(180deg,rgba(9,6,24,.25),rgba(9,6,24,.86) 45%)}
#title{background:linear-gradient(180deg,rgba(9,6,24,.35),rgba(9,6,24,0) 30%,rgba(9,6,24,0) 42%,rgba(9,6,24,.88) 62%)}
#title .wrap{min-height:100%;justify-content:space-between}
.title-bottom{display:flex;flex-direction:column;gap:12px}
.wrap{width:100%;max-width:460px;display:flex;flex-direction:column;gap:14px}
.logo{margin:6px 0 0;font:900 italic clamp(44px,13vw,64px)/.88 var(--display);letter-spacing:.01em;text-transform:uppercase;background:linear-gradient(180deg,#fff4cf 10%,var(--amber) 50%,var(--rose) 92%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 16px rgba(255,120,60,.45));text-wrap:balance}
.tag{margin:0;font:600 calc(max(12px, 16px) * var(--gk-text-scale, 1))/1.4 var(--body);color:var(--ink);text-shadow:0 2px 8px rgba(0,0,0,.7);max-width:34ch}
.cards{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:12px 14px;border-radius:16px;border:1px solid rgba(255,241,220,.18);background:var(--panel)}
.card.sel{border-color:var(--amber);box-shadow:0 0 0 2px rgba(255,184,77,.35),0 8px 24px rgba(0,0,0,.35)}
.card.lock{opacity:.6}
.card h3{margin:0;font:800 italic calc(max(12px, 21px) * var(--gk-text-scale, 1))/1.1 var(--display);letter-spacing:.02em}
.card p{margin:0;grid-column:1/-1;font:500 calc(max(12px, 13px) * var(--gk-text-scale, 1))/1.35 var(--body);color:var(--muted)}
.card .best{font:700 calc(max(12px, 14px) * var(--gk-text-scale, 1))/1.2 var(--body);text-align:right;align-self:center}
.medals{display:inline-flex;gap:4px;vertical-align:middle;margin-left:6px}
.medals i{width:10px;height:10px;border-radius:50%;background:rgba(255,241,220,.15)}
.medals i.b{background:var(--bronze)} .medals i.s{background:var(--silver)} .medals i.g{background:var(--gold)}
.big{width:100%;padding:16px;border-radius:16px;border:0;background:linear-gradient(180deg,#ffd27a,var(--amber) 45%,#f2804e);color:#2a1206;font:900 italic 26px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;box-shadow:0 8px 26px rgba(255,140,60,.35)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.sec{padding:13px;border-radius:14px;border:1px solid rgba(255,241,220,.25);background:rgba(16,12,38,.7);font:700 calc(max(12px, 16px) * var(--gk-text-scale, 1))/1.1 var(--body)}
.help{margin:0;font:500 calc(max(12px, 13px) * var(--gk-text-scale, 1))/1.45 var(--body);color:var(--muted);text-align:center}
.help b{color:var(--ink)}
.iconbtn{position:absolute;top:12px;right:max(12px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,241,220,.25);background:rgba(10,8,26,.5);font:700 calc(max(12px, 20px) * var(--gk-text-scale, 1))/1 var(--body)}
.res h2{margin:10px 0 0;font:900 italic clamp(34px,10vw,48px)/.95 var(--display);text-transform:uppercase;text-wrap:balance}
.res .t{font:900 italic 64px/1 var(--display)}
.res .line{margin:0;font:600 calc(max(12px, 16px) * var(--gk-text-scale, 1))/1.4 var(--body)}
.res .muted{color:var(--muted);font-weight:500}
.badge{display:inline-block;padding:6px 12px;border-radius:999px;font:800 calc(max(12px, 13px) * var(--gk-text-scale, 1))/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:#1b1206}
.badge.g{background:var(--gold)} .badge.s{background:var(--silver)} .badge.b{background:var(--bronze)} .badge.n{background:var(--bad)}
.panel{padding:16px;border-radius:18px;background:var(--panel);border:1px solid rgba(255,241,220,.18);display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font:900 italic 30px/1 var(--display);text-transform:uppercase}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;font:600 calc(max(12px, 15px) * var(--gk-text-scale, 1))/1.3 var(--body)}
.opt button{min-width:96px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,241,220,.3);background:rgba(255,255,255,.06);font-weight:700}
.opt button.on{background:var(--amber);color:#2a1206;border-color:var(--amber)}
#fps{position:absolute;z-index:6;left:8px;bottom:calc(110px + env(safe-area-inset-bottom,0px));font:600 calc(max(12px, 11px) * var(--gk-text-scale, 1))/1.3 ui-monospace,Menlo,Consolas,monospace;background:rgba(0,0,0,.55);padding:4px 6px;border-radius:6px;pointer-events:none;white-space:pre}
html[data-gk-motion=calm] #pop.show,html[data-gk-motion=still] #pop.show{animation-duration:.01s}
</style>

<div id="app">
  <canvas id="cv" aria-label="Lastlight Run road view"></canvas>

  <div id="touch" hidden>
    <div class="zone l" id="zL"><span>&lsaquo;</span></div>
    <div class="zone r" id="zR"><span>&rsaquo;</span></div>
  </div>
  <button id="bBoost" hidden aria-label="Boost"><span>BOOST</span><span class="pips"><i></i><i></i><i></i></span></button>

  <div id="hud" hidden>
    <div class="hud-top">
      <div class="hud-left"><span id="hTime" class="num">0:00.00</span><span id="hSub" class="num">0 km/h</span></div>
      <button id="bPause" aria-label="Pause">II</button>
    </div>
    <div class="light"><span class="sunico" aria-hidden="true"></span><div class="lbar"><i id="hLightFill"></i></div><span id="hLight" class="num">0.0</span></div>
    <div class="prog" id="prog"><i id="progG"></i><i id="progP"></i></div>
    <div id="hDraft">DRAFTING</div>
    <div id="pop"></div>
    <div id="count"></div>
    <div id="toast"></div>
  </div>

  <section id="title" class="screen dim" aria-label="Choose a road">
    <div class="wrap">
      <h1 class="logo">Lastlight<br>Run</h1>
      <p class="tag">Race the sunset home. Every lantern gate buys back daylight. Let the dark catch you and the run is over.</p>
      <div class="title-bottom">
        <div class="cards" id="cards"></div>
        <button class="big" id="bRace">Race</button>
        <p class="help" id="helpLine"></p>
      </div>
    </div>
    <button class="iconbtn" id="bSet" aria-label="Settings">&#9881;</button>
  </section>

  <section id="results" class="screen dim res" hidden aria-live="polite">
    <div class="wrap" id="resWrap"></div>
  </section>

  <section id="pause" class="screen dim" hidden>
    <div class="wrap" style="margin-top:auto;margin-bottom:auto">
      <div class="panel">
        <h2>Paused</h2>
        <button class="big" id="bResume">Resume</button>
        <div class="row"><button class="sec" id="bRestart">Restart</button><button class="sec" id="bRoads">Roads</button></div>
        <button class="sec" id="bSet2">Settings</button>
      </div>
    </div>
  </section>

  <section id="settings" class="screen dim" hidden>
    <div class="wrap" style="margin-top:auto;margin-bottom:auto">
      <div class="panel">
        <h2>Settings</h2>
        <div class="opt"><span>Sound effects</span><button id="oSfx"></button></div>
        <div class="opt"><span>Music</span><button id="oMusic"></button></div>
        <div class="opt"><span>Touch steering</span><button id="oSteer"></button></div>
        <div class="opt"><span>Frame time readout</span><button id="oFps"></button></div>
        <div class="opt"><span>Erase records and ghosts</span><button id="oReset">Erase</button></div>
        <div id="pywSlot"></div>
        <button class="big" id="bSetDone">Done</button>
      </div>
    </div>
  </section>
  <div id="fps" hidden></div>
</div>

<script id="gamekit">/* GameKit 2.1 : shared starter kit for single-file phone games.
   Paste inline in a script tag before the game's own script. No build step, no network.
   Modules: GK.rng, GK.daily, GK.save, GK.audio, GK.input, GK.juice, GK.ease,
            GK.badges, GK.share, GK.view, GK.ui, GK.loop, GK.prefs, GK.flash, GK.perf,
            GK.theme, GK.popups, GK.roll, GK.coach, GK.hints, GK.studio, GK.wired, GK.retrofit.  README.md has the API.
   All code here is the studio's own (no third-party code). */
(function (root) {
  'use strict';
  var GK = { version: '2.1.0' };
  var HAS_DOM = typeof window !== 'undefined' && typeof document !== 'undefined';
  var W = HAS_DOM ? window : {};
  function now() { return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now(); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function on(t, ev, fn, opt) { if (t && t.addEventListener) t.addEventListener(ev, fn, opt); }
  function off(t, ev, fn, opt) { if (t && t.removeEventListener) t.removeEventListener(ev, fn, opt); }
  GK.clamp = clamp;
  GK.now = now;

  /* ---------- environment ---------- */
  var ENV = GK.env = (function () {
    var ua = HAS_DOM && navigator.userAgent || '';
    var touchMac = HAS_DOM && /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
    var ios = /iPhone|iPad|iPod/.test(ua) || !!touchMac;
    var reduced = false;
    try { reduced = HAS_DOM && W.matchMedia && W.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    return { ios: ios, android: /Android/.test(ua), touch: HAS_DOM && (('ontouchstart' in W) || navigator.maxTouchPoints > 0), reducedMotion: !!reduced };
  })();
  // follow the phone's reduce-motion setting live (2.0)
  if (HAS_DOM && W.matchMedia) {
    try {
      var mqRM = W.matchMedia('(prefers-reduced-motion: reduce)');
      var onRM = function () { ENV.reducedMotion = !!mqRM.matches; if (GK.prefs && GK.prefs._emit) GK.prefs._emit('motion'); };
      if (mqRM && mqRM.addEventListener) mqRM.addEventListener('change', onRM); else if (mqRM && mqRM.addListener) mqRM.addListener(onRM);
    } catch (e) {}
  }

  /* ---------- storage (never throws) ---------- */
  var mem = {};
  var LS = GK.ls = {
    get: function (k) { try { var v = W.localStorage.getItem(k); return v == null ? (k in mem ? mem[k] : null) : v; } catch (e) { return k in mem ? mem[k] : null; } },
    set: function (k, v) { mem[k] = v; try { W.localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del: function (k) { delete mem[k]; try { W.localStorage.removeItem(k); } catch (e) {} }
  };

  /* ================= RNG ================= */
  // hash4: string -> four 32-bit words (multiply-xorshift mixing, one pass per lane)
  var HMUL = [0x85ebca6b, 0xc2b2ae35, 0x27d4eb2f, 0x165667b1];
  function hash4(str) {
    str = String(str);
    var h = [0x6a09e667 ^ str.length, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a], M = HMUL;
    for (var i = 0; i < str.length; i++) {
      var c = str.charCodeAt(i);
      for (var j = 0; j < 4; j++) {
        h[j] = Math.imul(h[j] ^ c, M[j]);
        h[j] ^= h[j] >>> 15;
        c = (c + h[j]) | 0;
      }
    }
    for (var k = 0; k < 4; k++) {
      var x = h[k] ^ h[(k + 1) & 3];
      x = Math.imul(x ^ (x >>> 16), 0x7feb352d);
      x = Math.imul(x ^ (x >>> 15), 0x846ca68b);
      h[k] = (x ^ (x >>> 16)) >>> 0;
    }
    return h;
  }
  function hash32(str) { return hash4(str)[0]; }
  // sfc32 generator (small fast counting, 128-bit state); state is kept so a run can resume.
  function sfc(s) {
    var a = s[0] | 0, b = s[1] | 0, c = s[2] | 0, d = s[3] | 0;
    function next() {
      var t = (((a + b) | 0) + d) | 0;
      d = (d + 1) | 0;
      a = b ^ (b >>> 9);
      b = (c + (c << 3)) | 0;
      c = (c << 21) | (c >>> 11);
      c = (c + t) | 0;
      return (t >>> 0) / 4294967296;
    }
    for (var i = 0; i < 12; i++) next();
    next.state = function () { return [a >>> 0, b >>> 0, c >>> 0, d >>> 0]; };
    next.load = function (st) { a = st[0] | 0; b = st[1] | 0; c = st[2] | 0; d = st[3] | 0; };
    return next;
  }
  // mulberry32: kept so shipped games keep their exact dailies
  function mulberry32(seed) {
    var s = seed >>> 0;
    return function () {
      s = (s + 0x6d2b79f5) | 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function wrap(fn, seedStr) {
    var R = {
      seed: seedStr,
      next: fn,
      float: function (a, b) { if (b === undefined) { b = a === undefined ? 1 : a; a = 0; } return a + fn() * (b - a); },
      int: function (lo, hi) { return lo + Math.floor(fn() * (hi - lo + 1)); }, // inclusive
      chance: function (p) { return fn() < p; },
      pick: function (arr) { return arr[Math.floor(fn() * arr.length)]; },
      sign: function () { return fn() < 0.5 ? -1 : 1; },
      shuffle: function (arr) { for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(fn() * (i + 1)); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; },
      weighted: function (items, weights) {
        var tot = 0, i; for (i = 0; i < weights.length; i++) tot += Math.max(0, weights[i]);
        var r = fn() * tot; for (i = 0; i < items.length; i++) { r -= Math.max(0, weights[i]); if (r < 0) return items[i]; }
        return items[items.length - 1];
      },
      sub: function (label, n) { return GK.rng.make(seedFor(seedStr, label, n)); },
      state: function () { return fn.state ? fn.state() : null; },
      load: function (st) { if (fn.load && st) fn.load(st); return R; }
    };
    return R;
  }
  function seedFor(base, label, n) { return String(base) + '/' + label + (n === undefined ? '' : '#' + n); }
  var CONS = 'BCDFGHJKLMNPQRSTVWXZ';
  GK.rng = {
    hash32: hash32,
    hash4: hash4,
    mulberry32: mulberry32,

    for (let n = 0; n < h; n++) add(c, easeInOut(sy, ey, (e + n) / tot));

/* =============================== State ============================== */
function newRace(T, mode) {

/* =============================== Rules ============================== */
// Pure: step(state, input, dt, track, ghostAt) -> { s: newState, ev: [events] }. No drawing, no DOM.

// Drives for the title-screen attract mode and for the headless tests. `sloppy` adds human-ish mistakes.
function botInput(s, T, ghostAt, sloppy, rnd) {
  const C = CONFIG, L = C.segL, i0 = Math.floor(s.z / L), sp = s.speed / C.maxSpeed;
  let maxC = 0, avgC = 0;
  for (let k = 2; k < 46; k++) { const sg = T.segs[i0 + k]; if (!sg) break; if (Math.abs(sg.curve) > Math.abs(maxC)) maxC = sg.curve; if (k < 22) avgC += sg.curve / 20; }
  let tx = clamp(avgC * 0.13, -0.55, 0.55);
  if (s.embers < C.emberMax) for (let k = 3; k < 22; k++) { const sg = T.segs[i0 + k]; if (sg && sg.ember !== null && !s.taken[i0 + k]) { tx = sg.ember; break; } }
  if (ghostAt) { const g = ghostAt(s.t); if (g && g.z > s.z && g.z - s.z < L * 30 && Math.abs(maxC) < 3) tx = g.x; }
  const blocked = (x) => s.cars.some(c => { const d = c.z - s.z; return d > -L * 0.5 && d < L * (8 + sp * 30) && Math.abs(c.x - x) < 0.42; });
  if (blocked(tx)) {
    let best = tx, bs = -1e9;
    for (const ln of [-0.62, 0, 0.62]) {
      let sc = -Math.abs(ln - s.x) * 0.6;
      for (const c of s.cars) { const d = c.z - s.z; if (d > -L && d < L * 45 && Math.abs(c.x - ln) < 0.42) sc -= 10 * (1 - d / (L * 45)); }
      if (sc > bs) { bs = sc; best = ln; }
    }
    tx = best;
  }
  const seg = T.segs[i0] || T.segs[T.len - 1];
  let steer = (tx - s.x) * 3.2 + seg.curve * Math.min(sp, 1) * C.centrifugal - (seg.wind || 0) * 0.55;
  const safe = maxC ? 1.3 / (Math.abs(maxC) * C.centrifugal) : 9;
  let brake = (Math.abs(maxC) > 3 && sp > safe) || (Math.abs(s.x) > 0.9 && sp > 0.75 && Math.sign(s.x) !== Math.sign(steer) && Math.abs(maxC) > 2);
  let boost = s.embers > 0 && Math.abs(maxC) < 2 && sp > 0.85 && s.boostT <= 0;
  if (sloppy && rnd) {
    steer += (rnd() - 0.5) * 1.1;
    if (rnd() < 0.25) brake = false;
    if (rnd() < 0.02) boost = false;
  }
  return { steer: clamp(steer, -1, 1), brake, boost };
}

const Game = {

  resize() { Renderer.resize(this.perf.q >= 1 ? 1 : CONFIG.maxDpr); Input.W = Renderer.W; this.progW = 0; },
  setTrack(i) {

  },
  pause() { if (this.mode !== 'race') return; this.mode = 'paused'; UI.show('pause'); Sound.engine(0, false, 0, false); },
  resume() { if (this.mode !== 'paused') return; this.mode = 'race'; UI.show(null); this.last = performance.now(); },
  toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(this._tt); this._tt = setTimeout(() => t.classList.remove('on'), 3400); },
  popup(html) { const p = $('pop'); p.innerHTML = html; p.className = ''; void p.offsetWidth; p.className = 'show'; },
  burst(n, x, y, col, spd, life, up) { if (this.fx.reduced) n = GK.prefs.motion() === 'still' ? 0 : Math.ceil(n / 3); for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = spd * (0.3 + Math.random()); this.fx.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (up || 0), life, max: life, col, r: 2 + Math.random() * 3 }); } if (this.fx.parts.length > 260) this.fx.parts.splice(0, this.fx.parts.length - 260); },
  handle(ev) {
    const fx = this.fx, cs = fx.carScreen || { x: Renderer.W / 2, y: Renderer.pp, w: 60, h: 60 }, s = this.s;
    for (const e of ev) {

      else if (e.type === 'go') { $('count').textContent = 'GO'; $('count').className = 'go'; Sound.beep(true); setTimeout(() => { if ($('count').textContent === 'GO') $('count').textContent = ''; }, 650); }
      else if (e.type === 'gate') {

        const best = Store.data.best[this.T.def.id]; let split = '';

  finish(win) {

    if (win) {

  loop(now) {

    const C = CONFIG, rawDt = this.last ? (now - this.last) / 1000 : C.step; this.last = now;

  },

window.__LL = {

  giveEmber: () => { Game.s = Object.assign({}, Game.s, { embers: Math.min(3, Game.s.embers + 1) }); },
  setLight: v => { Game.s = Object.assign({}, Game.s, { light: v }); },
  jumpTo: frac => { const T = Game.T; Game.s = Object.assign({}, Game.s, { z: T.startZ + (T.finishZ - T.startZ) * frac }); },
  sim(trackIdx, opts) { // full race with the bot, no rendering
    opts = opts || {}; const T = BUILT[trackIdx]; let s = newRace(T, 'race'); s.phase = 'race';
    const rnd = mulberry32(opts.seed || 1); let steps = 0;
    const ga = opts.ghost ? (t => { const a = opts.ghost, f = t * 10, i = Math.floor(f), n = a.length / 2; if (i >= n - 1) return null; const k = f - i; return { z: lerp(a[i * 2], a[i * 2 + 2], k), x: lerp(a[i * 2 + 1], a[i * 2 + 3], k) / 1000 }; }) : null;
    const rec = []; let rt = 0;
    while (s.phase === 'race' && steps < 60 * 400) { const inp = botInput(s, T, ga, !!opts.sloppy, rnd); if (opts.sloppy && rnd() < (opts.lag || 0)) inp.steer = 0; s = step(s, inp, CONFIG.step, T, ga).s; steps++; rt += CONFIG.step; if (rt >= 0.1 - 1e-9) { rt = 0; rec.push(Math.round(s.z), Math.round(s.x * 1000)); } }
    return { win: s.result && s.result.win, time: s.t, prog: s.prog, minLight: s.minLight, bumps: s.bumps, offT: s.offT, len: T.len, gates: T.gates.map(g => g.bonus), startLight: T.startLight, ghost: rec };
  },
};

Game.init();
</script>
