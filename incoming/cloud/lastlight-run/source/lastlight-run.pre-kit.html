<title>Lastlight Run</title>
<style>
/* Layout: one full-bleed canvas world with a thin DOM HUD on top and touch zones underneath it. */
:root{
  color-scheme: dark;
  --bg:#0d0a1f;          /* night indigo */
  --panel:rgba(16,12,38,.86);
  --ink:#fff1dc;         /* warm lantern-lit paper */
  --muted:#c9b8d6;
  --amber:#ffb84d;       /* lantern flame */
  --rose:#ff7a6b;        /* setting sun */
  --sky:#7fc4ff;         /* ghost wisp */
  --good:#7ff0b0;
  --bad:#ff8a8a;
  --gold:#ffd45e; --silver:#dfe7f5; --bronze:#de9466;
  --display:"Avenir Next Condensed","Futura","Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --body:"Avenir Next","Segoe UI","Helvetica Neue",Roboto,Arial,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--body);-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;width:100%;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:3;contain:strict}
.hud-left,.light,.prog,#toast,#hDraft{contain:layout}
.hud-top{position:absolute;top:8px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.hud-left{display:flex;flex-direction:column;gap:2px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#hTime{font:800 italic 26px/1 var(--display);letter-spacing:.02em}
#hSub{font:600 12px/1.2 var(--body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
#bPause{pointer-events:auto;width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,241,220,.25);background:rgba(10,8,26,.45);font:800 15px/1 var(--display);letter-spacing:.08em}
.light{position:absolute;top:60px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px}
.sunico{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff6c8,var(--amber) 55%,var(--rose));box-shadow:0 0 12px var(--amber);flex:none}
.lbar{position:relative;flex:1;height:12px;border-radius:7px;background:rgba(8,6,22,.55);border:1px solid rgba(255,241,220,.22);overflow:hidden}
#hLightFill{position:absolute;inset:0;transform-origin:0 50%;will-change:transform;background:linear-gradient(90deg,var(--rose),var(--amber) 60%,#fff2b0);border-radius:7px;transition:background .3s}
#hLightFill.low{background:linear-gradient(90deg,#7a2140,var(--bad))}
#hLight{font:800 italic 20px/1 var(--display);min-width:56px;text-align:right;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#hLight.low{color:var(--bad)}
.prog{position:absolute;top:84px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));height:6px;border-radius:3px;background:rgba(8,6,22,.45)}
.prog i{position:absolute;top:-3px;left:0;width:12px;height:12px;margin-left:-6px;border-radius:50%;will-change:transform}
#progP{background:var(--amber);border:2px solid #fff1dc;box-sizing:border-box}
#progG{background:var(--sky)}
.prog b{position:absolute;top:-1px;width:2px;height:8px;background:rgba(255,241,220,.55)}
#hDraft{position:absolute;top:100px;left:50%;transform:translateX(-50%);font:800 italic 14px/1 var(--display);letter-spacing:.18em;color:#0d0a1f;background:var(--sky);padding:5px 10px 4px;border-radius:999px;opacity:0;transition:opacity .15s}
#hDraft.on{opacity:1}
#pop{position:absolute;top:30%;left:0;right:0;text-align:center;font:800 italic 34px/1.05 var(--display);text-shadow:0 3px 14px rgba(0,0,0,.6);opacity:0}
#pop small{display:block;font:700 18px/1.2 var(--body);letter-spacing:.04em;margin-top:4px}
#pop .g{color:var(--good)} #pop .b{color:var(--bad)}
#pop.show{animation:pop 1.3s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.12)}22%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
#count{position:absolute;top:34%;left:0;right:0;text-align:center;font:900 italic 96px/1 var(--display);color:var(--ink);text-shadow:0 6px 24px rgba(255,140,60,.6)}
#count.go{color:var(--amber)}
#toast{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(88%,420px);text-align:center;font:600 15px/1.35 var(--body);background:var(--panel);border:1px solid rgba(255,241,220,.2);border-radius:14px;padding:10px 14px;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}

/* ---------- touch ---------- */
#touch{position:absolute;inset:0;z-index:2;display:grid;grid-template-columns:1fr 1fr}
.zone{position:relative}
.zone span{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 40px/1 var(--display);color:rgba(255,241,220,.55);border:2px solid rgba(255,241,220,.18);background:rgba(10,8,26,.22);transition:background .08s,transform .08s}
.zone.l span{left:max(18px,env(safe-area-inset-left,0px))} .zone.r span{right:max(18px,env(safe-area-inset-right,0px))}
.zone.hold span{background:rgba(255,184,77,.35);color:var(--ink);transform:scale(1.08)}
#bBoost{position:absolute;z-index:4;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:84px;height:84px;border-radius:50%;border:2px solid rgba(255,184,77,.7);background:radial-gradient(circle at 50% 40%,rgba(255,184,77,.45),rgba(30,14,40,.7));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:800 italic 15px/1 var(--display);letter-spacing:.1em}
#bBoost[disabled]{opacity:.45}
#bBoost .pips{display:flex;gap:4px}
#bBoost .pips i{width:9px;height:9px;border-radius:50%;background:rgba(255,241,220,.2)}
#bBoost .pips i.on{background:var(--amber);box-shadow:0 0 6px var(--amber)}
#touch.drag{grid-template-columns:1fr}
#touch.drag .zone.r{display:none}
#touch.drag .zone.l span{left:50%;margin-left:-32px;display:none}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;z-index:5;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:flex;flex-direction:column;align-items:center;padding-block:20px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.screen.dim{background:linear-gradient(180deg,rgba(9,6,24,.25),rgba(9,6,24,.86) 45%)}
#title{background:linear-gradient(180deg,rgba(9,6,24,.35),rgba(9,6,24,0) 30%,rgba(9,6,24,0) 42%,rgba(9,6,24,.88) 62%)}
#title .wrap{min-height:100%;justify-content:space-between}
.title-bottom{display:flex;flex-direction:column;gap:12px}
.wrap{width:100%;max-width:460px;display:flex;flex-direction:column;gap:14px}
.logo{margin:6px 0 0;font:900 italic clamp(44px,13vw,64px)/.88 var(--display);letter-spacing:.01em;text-transform:uppercase;background:linear-gradient(180deg,#fff4cf 10%,var(--amber) 50%,var(--rose) 92%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 16px rgba(255,120,60,.45));text-wrap:balance}
.tag{margin:0;font:600 16px/1.4 var(--body);color:var(--ink);text-shadow:0 2px 8px rgba(0,0,0,.7);max-width:34ch}
.cards{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:12px 14px;border-radius:16px;border:1px solid rgba(255,241,220,.18);background:var(--panel)}
.card.sel{border-color:var(--amber);box-shadow:0 0 0 2px rgba(255,184,77,.35),0 8px 24px rgba(0,0,0,.35)}
.card.lock{opacity:.6}
.card h3{margin:0;font:800 italic 21px/1.1 var(--display);letter-spacing:.02em}
.card p{margin:0;grid-column:1/-1;font:500 13px/1.35 var(--body);color:var(--muted)}
.card .best{font:700 14px/1.2 var(--body);text-align:right;align-self:center}
.medals{display:inline-flex;gap:4px;vertical-align:middle;margin-left:6px}
.medals i{width:10px;height:10px;border-radius:50%;background:rgba(255,241,220,.15)}
.medals i.b{background:var(--bronze)} .medals i.s{background:var(--silver)} .medals i.g{background:var(--gold)}
.big{width:100%;padding:16px;border-radius:16px;border:0;background:linear-gradient(180deg,#ffd27a,var(--amber) 45%,#f2804e);color:#2a1206;font:900 italic 26px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;box-shadow:0 8px 26px rgba(255,140,60,.35)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.sec{padding:13px;border-radius:14px;border:1px solid rgba(255,241,220,.25);background:rgba(16,12,38,.7);font:700 16px/1.1 var(--body)}
.help{margin:0;font:500 13px/1.45 var(--body);color:var(--muted);text-align:center}
.help b{color:var(--ink)}
.iconbtn{position:absolute;top:12px;right:max(12px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,241,220,.25);background:rgba(10,8,26,.5);font:700 20px/1 var(--body)}
.res h2{margin:10px 0 0;font:900 italic clamp(34px,10vw,48px)/.95 var(--display);text-transform:uppercase;text-wrap:balance}
.res .t{font:900 italic 64px/1 var(--display)}
.res .line{margin:0;font:600 16px/1.4 var(--body)}
.res .muted{color:var(--muted);font-weight:500}
.badge{display:inline-block;padding:6px 12px;border-radius:999px;font:800 13px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:#1b1206}
.badge.g{background:var(--gold)} .badge.s{background:var(--silver)} .badge.b{background:var(--bronze)} .badge.n{background:var(--bad)}
.panel{padding:16px;border-radius:18px;background:var(--panel);border:1px solid rgba(255,241,220,.18);display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font:900 italic 30px/1 var(--display);text-transform:uppercase}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;font:600 15px/1.3 var(--body)}
.opt button{min-width:96px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,241,220,.3);background:rgba(255,255,255,.06);font-weight:700}
.opt button.on{background:var(--amber);color:#2a1206;border-color:var(--amber)}
#fps{position:absolute;z-index:6;left:8px;bottom:calc(110px + env(safe-area-inset-bottom,0px));font:600 11px/1.3 ui-monospace,Menlo,Consolas,monospace;background:rgba(0,0,0,.55);padding:4px 6px;border-radius:6px;pointer-events:none;white-space:pre}
@media (prefers-reduced-motion: reduce){#pop.show{animation-duration:.01s}}
</style>

<div id="app">
  <canvas id="cv" aria-label="Lastlight Run road view"></canvas>

  <div id="touch" hidden>
    <div class="zone l" id="zL"><span>&lsaquo;</span></div>
    <div class="zone r" id="zR"><span>&rsaquo;</span></div>
  </div>
  <button id="bBoost" hidden aria-label="Boost"><span>BOOST</span><span class="pips"><i></i><i></i><i></i></span></button>

  <div id="hud" hidden>
    <div class="hud-top">
      <div class="hud-left"><span id="hTime" class="num">0:00.00</span><span id="hSub" class="num">0 km/h</span></div>
      <button id="bPause" aria-label="Pause">II</button>
    </div>
    <div class="light"><span class="sunico" aria-hidden="true"></span><div class="lbar"><i id="hLightFill"></i></div><span id="hLight" class="num">0.0</span></div>
    <div class="prog" id="prog"><i id="progG"></i><i id="progP"></i></div>
    <div id="hDraft">DRAFTING</div>
    <div id="pop"></div>
    <div id="count"></div>
    <div id="toast"></div>
  </div>

  <section id="title" class="screen dim" aria-label="Choose a road">
    <div class="wrap">
      <h1 class="logo">Lastlight<br>Run</h1>
      <p class="tag">Race the sunset home. Every lantern gate buys back daylight. Let the dark catch you and the run is over.</p>
      <div class="title-bottom">
        <div class="cards" id="cards"></div>
        <button class="big" id="bRace">Race</button>
        <p class="help" id="helpLine"></p>
      </div>
    </div>
    <button class="iconbtn" id="bSet" aria-label="Settings">&#9881;</button>
  </section>

  <section id="results" class="screen dim res" hidden aria-live="polite">
    <div class="wrap" id="resWrap"></div>
  </section>

  <section id="pause" class="screen dim" hidden>
    <div class="wrap" style="margin-top:auto;margin-bottom:auto">
      <div class="panel">
        <h2>Paused</h2>
        <button class="big" id="bResume">Resume</button>
        <div class="row"><button class="sec" id="bRestart">Restart</button><button class="sec" id="bRoads">Roads</button></div>
        <button class="sec" id="bSet2">Settings</button>
      </div>
    </div>
  </section>

  <section id="settings" class="screen dim" hidden>
    <div class="wrap" style="margin-top:auto;margin-bottom:auto">
      <div class="panel">
        <h2>Settings</h2>
        <div class="opt"><span>Sound effects</span><button id="oSfx"></button></div>
        <div class="opt"><span>Music</span><button id="oMusic"></button></div>
        <div class="opt"><span>Touch steering</span><button id="oSteer"></button></div>
        <div class="opt"><span>Frame time readout</span><button id="oFps"></button></div>
        <div class="opt"><span>Erase records and ghosts</span><button id="oReset">Erase</button></div>
        <button class="big" id="bSetDone">Done</button>
      </div>
    </div>
  </section>
  <div id="fps" hidden></div>
</div>

<script>

const CONFIG = {
  step: 1 / 60,           // fixed simulation step (s)
  segL: 200,              // segment length (world units)
  rumble: 3,              // segments per rumble stripe
  roadW: 2000,            // half road width
  lanes: 3,
  drawDist: 200,          // segments drawn ahead (adaptive, see quality)
  drawDistMin: 110,
  fogDensity: 4.5,

  maxSpeed: 12000,        // = segL / step: one segment per frame

  offDecel: -6000, offLimit: 3000,

// Road pieces: ['S',n] straight · ['C',enter,hold,leave,curve,hill] · ['H',enter,hold,leave,hill]

/* =============================== Input ============================== */
const Input = {
  keys: {}, ptrs: new Map(), boostQ: false, mode: 'zones', W: 1,
  init(layer, boostBtn) {
    addEventListener('keydown', e => { const k = e.key; if (['ArrowLeft', 'ArrowRight', 'ArrowDown', 'ArrowUp', ' '].includes(k)) e.preventDefault(); if (!e.repeat && (k === 'ArrowUp' || k === 'x' || k === 'X' || k === 'Shift' || k === 'w' || k === 'W')) this.boostQ = true; this.keys[k.toLowerCase()] = true; });

    addEventListener('blur', () => { this.keys = {}; this.ptrs.clear(); });
    const down = e => { e.preventDefault(); try { layer.setPointerCapture(e.pointerId); } catch (_) {} this.ptrs.set(e.pointerId, { x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, t0: performance.now(), swiped: false }); };

    layer.addEventListener('pointerup', up); layer.addEventListener('pointercancel', up); layer.addEventListener('lostpointercapture', up);

    const k = this.keys; let L = k['arrowleft'] || k['a'], R = k['arrowright'] || k['d'], brake = !!(k['arrowdown'] || k['s'] || k[' ']);

    let tl = 0, tr = 0;
    if (this.mode === 'drag') {
      let first = null; for (const p of this.ptrs.values()) { if (!first) first = p; else brake = true; }

      const goal = m === 'g' ? 'You beat the gold time.' : m === 's' ? `${(r.time - T.def.medals.gold).toFixed(2)}s faster wins gold.` : `${(r.time - T.def.medals.silver).toFixed(2)}s faster wins silver.`;
      html += `<h2>Home before dark</h2><div class="t num">${fmt(r.time)}</div><div><span class="badge ${m}">${MEDAL_NAME[m]}</span></div>`;
      html += `<p class="line">${rec.newBest ? (rec.prev ? `New best, ${(rec.prev - r.time).toFixed(2)}s faster. Your ghost now rides this run.` : 'First finish. Your ghost will ride this run next time.') : `Best ${fmt(rec.prev)}. ${(r.time - rec.prev).toFixed(2)}s behind your ghost.`}</p>`;
      html += `<p class="line muted">${goal} ${rec.unlocked ? `New road open: ${next.def.name}.` : ''}</p>`;
      html += `<button class="big" id="rAgain">Race again</button><div class="row">${next && BUILT.indexOf(next) < d.unlocked ? '<button class="sec" id="rNext">Next road</button>' : ''}<button class="sec" id="rRoads">Roads</button></div>`;
    } else {
      const tip = s.bumps >= 4 ? 'Crashes cost the most. Brake when the yellow chevrons appear.' : s.offT > 6 ? 'Off the road you crawl. Keep between the stripes and gates come sooner.' : 'Grab embers and burn them on straights. Each boost buys back distance.';
      html += `<h2>The light ran out</h2><div class="t num">${Math.round(r.prog * 100)}%</div><div><span class="badge n">Caught by the dark</span></div>`;
      html += `<p class="line">You made it ${Math.round(r.prog * 100)}% of the way home${rec.furthestNew ? ', your furthest yet' : ''}.</p><p class="line muted">${tip}</p>`;
      html += `<button class="big" id="rAgain">Try again</button><div class="row"><button class="sec" id="rRoads">Roads</button></div>`;
    }
    w.innerHTML = html;
    $('rAgain').onclick = () => Game.start(d.sel);
    if ($('rNext')) $('rNext').onclick = () => { d.sel = BUILT.indexOf(T) + 1; Store.save(); Game.start(d.sel); };
    $('rRoads').onclick = () => Game.toTitle();
    this.show('results');
    setTimeout(() => { try { $('rAgain').focus({ preventScroll: true }); } catch (_) {} }, 50);
  },
};

/* ============================= Game loop ============================ */
const Game = {
  mode: 'title', T: BUILT[0], s: null, acc: 0, last: 0, rec: null, recT: 0, ghost: null, ghostArr: null,
  fx: { lf: 0.7, lfTarget: 0.7, sky: 0, time: 0, shake: 0, flash: 0, parts: [], carBySeg: new Map(), reduced: matchMedia('(prefers-reduced-motion: reduce)').matches, region: null, curSeg: null },
  perf: { frames: 0, dtSum: 0, dtMax: 0, renderSum: 0, renderMax: 0, hist: [], slowT: 0, q: 0 },
  hud: {}, prev: {},
  init() {
    Store.load(); makeSprites();
    Renderer.init($('cv')); this.resize();
    addEventListener('resize', () => this.resize());
    Input.init($('touch'), $('bBoost'));
    Input.mode = Store.data.settings.steer;
    Sound.sfxOn = Store.data.settings.sfx; Sound.musicOn = Store.data.settings.music;
    const wake = () => Sound.init(); addEventListener('pointerdown', wake, true); addEventListener('keydown', wake, true);
    $('bRace').onclick = () => this.start(Store.data.sel);
    $('bSet').onclick = () => { this.setFrom = 'title'; UI.settings(); UI.show('settings'); };
    $('bSet2').onclick = () => { this.setFrom = 'pause'; UI.settings(); UI.show('settings'); };
    $('bSetDone').onclick = () => { UI._resetArm = false; UI.show(this.setFrom === 'pause' ? 'pause' : 'title'); if (this.setFrom !== 'pause') UI.cards(); };
    const S = Store.data.settings;
    $('oSfx').onclick = () => { S.sfx = !S.sfx; Sound.sfxOn = S.sfx; Sound.apply(); Store.save(); UI.settings(); };
    $('oMusic').onclick = () => { S.music = !S.music; Sound.musicOn = S.music; Sound.apply(); Store.save(); UI.settings(); };
    $('oSteer').onclick = () => { S.steer = S.steer === 'drag' ? 'zones' : 'drag'; Input.mode = S.steer; $('touch').classList.toggle('drag', S.steer === 'drag'); Store.save(); UI.settings(); };
    $('oFps').onclick = () => { S.fps = !S.fps; $('fps').hidden = !S.fps; Store.save(); UI.settings(); };
    $('oReset').onclick = () => { if (!UI._resetArm) { UI._resetArm = true; UI.settings(); return; } const keep = Store.data.settings; Store.data = Store.defaults(); Store.data.settings = keep; Store.save(); UI._resetArm = false; UI.settings(); this.toast('Records and ghosts erased.'); };
    $('touch').classList.toggle('drag', S.steer === 'drag'); $('fps').hidden = !S.fps;
    $('bPause').onclick = () => this.pause();
    $('bResume').onclick = () => this.resume();
    $('bRestart').onclick = () => this.start(Store.data.sel);
    $('bRoads').onclick = () => this.toTitle();
    addEventListener('keydown', e => {
      const k = e.key;
      if ((k === 'Escape' || k === 'p' || k === 'P') && this.mode === 'race') this.pause();
      else if ((k === 'Escape' || k === 'p' || k === 'P') && this.mode === 'paused') this.resume();
      else if (k === 'Enter' && this.mode === 'title' && $('settings').hidden) this.start(Store.data.sel);
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden && this.mode === 'race') this.pause(); });
    // progress bar gate ticks
    this.hud = { time: $('hTime'), sub: $('hSub'), fill: $('hLightFill'), light: $('hLight'), p: $('progP'), g: $('progG'), draft: $('hDraft'), pips: [...document.querySelectorAll('#bBoost .pips i')], boost: $('bBoost'), zl: $('zL'), zr: $('zR'), fps: $('fps') };
    UI.cards(); this.toTitle();
    requestAnimationFrame(t => this.loop(t));
  },
  resize() { Renderer.resize(this.perf.q >= 1 ? 1 : CONFIG.maxDpr); Input.W = Renderer.W; this.progW = 0; },
  setTrack(i) {
    this.T = BUILT[i]; this.fx.region = this.T.R;
    const best = Store.data.best[this.T.def.id];
    this.ghostArr = best && best.ghost && best.ghost.length > 4 ? best.ghost : null;
    const prog = $('prog'); prog.querySelectorAll('b').forEach(b => b.remove());
    for (const gt of this.T.gates) { if (gt.finish) continue; const b = document.createElement('b'); b.style.left = ((gt.z - this.T.startZ) / (this.T.finishZ - this.T.startZ) * 100) + '%'; prog.appendChild(b); }
  },
  ghostAt(t) {
    const a = this.ghostArr; if (!a) return null;
    const f = t * CONFIG.ghostHz, i = Math.floor(f), n = a.length / 2;
    if (i >= n - 1) return null;
    const k = f - i; return { z: lerp(a[i * 2], a[i * 2 + 2], k), x: lerp(a[i * 2 + 1], a[i * 2 + 3], k) / 1000 };
  },
  attract() { this.setTrack(Store.data.sel); this.s = newRace(this.T, 'attract'); this.mode = 'title'; },
  toTitle() { $('hud').hidden = true; $('touch').hidden = true; $('bBoost').hidden = true; UI.cards(); UI.show('title'); this.attract(); this.fx.lfTarget = 0.7; },
  start(i) {
    Sound.init();
    this.setTrack(i); this.s = newRace(this.T, 'race'); this.mode = 'race'; this.acc = 0;
    this.rec = []; this.recT = 0; this.fx.lf = this.fx.lfTarget = this.s.light / CONFIG.fullLight; this.fx.parts.length = 0; this.fx.flash = 0;
    UI.show(null); $('hud').hidden = false; $('touch').hidden = false; $('bBoost').hidden = !Store.data.seen.ember;
    $('count').textContent = '3'; $('count').className = ''; $('pop').className = ''; this.prev = {};
    Store.data.runs++; Store.save();
    if (this.ghostArr && !Store.data.seen.ghost) { Store.data.seen.ghost = 1; Store.save(); setTimeout(() => this.toast('The blue cart is your best run. Tuck in right behind it to draft.'), 2600); }
    else if (!Store.data.seen.first) { Store.data.seen.first = 1; Store.save(); setTimeout(() => this.toast(touchy ? 'Your cart speeds up on its own. Hold the left or right side to steer.' : 'Your cart speeds up on its own. Steer with the arrow keys.'), 400); }
  },
  pause() { if (this.mode !== 'race') return; this.mode = 'paused'; UI.show('pause'); Sound.engine(0, false, 0, false); },
  resume() { if (this.mode !== 'paused') return; this.mode = 'race'; UI.show(null); this.last = performance.now(); },
  toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(this._tt); this._tt = setTimeout(() => t.classList.remove('on'), 3400); },
  popup(html) { const p = $('pop'); p.innerHTML = html; p.className = ''; void p.offsetWidth; p.className = 'show'; },
  burst(n, x, y, col, spd, life, up) { if (this.fx.reduced) n = Math.ceil(n / 3); for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = spd * (0.3 + Math.random()); this.fx.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (up || 0), life, max: life, col, r: 2 + Math.random() * 3 }); } if (this.fx.parts.length > 260) this.fx.parts.splice(0, this.fx.parts.length - 260); },
  handle(ev) {
    const fx = this.fx, cs = fx.carScreen || { x: Renderer.W / 2, y: Renderer.pp, w: 60, h: 60 }, s = this.s;
    for (const e of ev) {
      if (e.type === 'beep') { $('count').textContent = e.n; $('count').className = ''; Sound.beep(false); }
      else if (e.type === 'go') { $('count').textContent = 'GO'; $('count').className = 'go'; Sound.beep(true); setTimeout(() => { if ($('count').textContent === 'GO') $('count').textContent = ''; }, 650); }
      else if (e.type === 'gate') {
        Sound.gate(); fx.flash = 1; Store.data.gates++;
        const best = Store.data.best[this.T.def.id]; let split = '';
        if (best && best.splits && best.splits[e.idx] !== undefined) { const d = s.splits[e.idx] - best.splits[e.idx]; split = `<small class="${d <= 0 ? 'g' : 'b'}">${d <= 0 ? '−' : '+'}${Math.abs(d).toFixed(2)} vs best</small>`; }
        this.popup(`+${e.bonus.toFixed(1)}s daylight${split}`);
        this.burst(26, cs.x, cs.y - cs.h * 2, '#ffcf7a', 260, 0.8, 80);
        Store.save();
      }
      else if (e.type === 'ember') {
        Sound.ember(e.full); this.burst(14, cs.x, cs.y - cs.h, '#ffb84d', 180, 0.5, 60);
        if (!Store.data.seen.ember) { Store.data.seen.ember = 1; Store.save(); $('bBoost').hidden = false; this.toast(touchy ? 'Ember caught. Swipe up or tap Boost to burn it.' : 'Ember caught. Press Up or X to burn it for a boost.'); }
      }
      else if (e.type === 'crash') { Sound.crash(e.hard); fx.shake = e.hard ? 1 : 0.6; this.burst(e.hard ? 22 : 14, cs.x, cs.y - cs.h * 0.4, e.hard ? '#ffd27a' : '#fff1dc', 240, 0.45, 40); if (navigator.vibrate) try { navigator.vibrate(e.hard ? 40 : 20); } catch (_) {} }
      else if (e.type === 'boost') { Sound.boost(); fx.shake = 0.3; this.burst(18, cs.x, cs.y - cs.h * 0.2, '#ff9a4d', 200, 0.4, -40); }
      else if (e.type === 'draft') { Sound.tone(520, 0.2, 'sine', 0.06, 0, 780); }
      else if (e.type === 'tick') Sound.tick();
      else if (e.type === 'finish' || e.type === 'dark') this.finish(e.type === 'finish');
    }
  },
  finish(win) {
    const s = this.s, T = this.T, d = Store.data, id = T.def.id, rec = { newBest: false, prev: null, unlocked: false, furthestNew: false };
    Sound.finish(win); Sound.engine(0, false, 0, false);
    if (win) {
      const best = d.best[id]; rec.prev = best ? best.time : null;
      if (!best || s.result.time < best.time) { rec.newBest = true; d.best[id] = { time: s.result.time, splits: s.splits.slice(), ghost: this.rec.slice() }; }
      const idx = BUILT.indexOf(T); if (idx + 2 > d.unlocked && idx + 1 < BUILT.length) { d.unlocked = idx + 2; rec.unlocked = true; }
      d.furthest[id] = 1;
    } else {
      const prev = d.furthest[id]; if (prev === undefined || s.result.prog > prev) { rec.furthestNew = prev !== undefined; d.furthest[id] = s.result.prog; }
    }
    Store.save();
    this.mode = 'result'; $('touch').hidden = true; $('bBoost').hidden = true;
    setTimeout(() => { if (this.mode === 'result') { $('hud').hidden = true; UI.results(s, T, rec); } }, win ? 900 : 1300);
  },
  loop(now) {
    requestAnimationFrame(t => this.loop(t));
    const C = CONFIG, rawDt = this.last ? (now - this.last) / 1000 : C.step; this.last = now;
    const dt = Math.min(0.1, rawDt), fx = this.fx; fx.time += dt;
    if (this.mode !== 'paused') {
      this.acc += dt;
      let guard = 0;
      while (this.acc >= C.step && guard++ < 8) {
        this.acc -= C.step;
        let inp;
        if (this.mode === 'title' || this.botOn) inp = botInput(this.s, this.T, this.mode === 'title' ? null : this.ghostAt.bind(this), false);
        else if (this.mode === 'race') inp = Input.read();
        else inp = { steer: 0, brake: true };
        if (this.mode === 'result') inp = { steer: 0, brake: true };
        const r = step(this.s, inp, C.step, this.T, this.mode === 'race' && this.ghostArr ? this.ghostAt.bind(this) : null);
        if (this.mode === 'result' && this.s.phase === 'done') { const n = Object.assign({}, this.s); n.speed = Math.max(0, n.speed - 9000 * C.step); n.z += n.speed * C.step; this.s = n; }
        else this.s = r.s;
        if (this.mode === 'race' && this.s.phase === 'race') { this.recT += C.step; if (this.recT >= 1 / C.ghostHz - 1e-6 || this.rec.length === 0) { this.recT = 0; this.rec.push(Math.round(this.s.z), Math.round(this.s.x * 1000)); } }
        if (this.mode !== 'title') this.handle(r.ev);
        // sky drift with curves
        const seg = segAt(this.T, this.s.z); fx.curSeg = seg;
        fx.sky += seg.curve * (this.s.speed / C.maxSpeed) * 0.0011;
        // offroad dust
        if (this.s.offroad && this.s.speed > 1500 && Math.random() < 0.5 && fx.carScreen) { const cs = fx.carScreen; this.burst(1, cs.x + (Math.random() - 0.5) * cs.w, cs.y - 4, rgb(this.T.R.spray), 120, 0.5, 90); }
      }
      if (guard >= 8) this.acc = 0;
    }
    // light → sky
    if (this.mode === 'title') fx.lfTarget = 0.55 + 0.4 * Math.sin(fx.time * 0.08);
    else fx.lfTarget = Math.min(this.s.light / C.fullLight, 1.1) * (1 - C.homeDusk * this.s.prog);
    fx.lf += (fx.lfTarget - fx.lf) * Math.min(1, dt * 2.5);
    fx.shake *= Math.pow(0.02, dt); fx.flash *= Math.pow(0.01, dt);
    for (let i = fx.parts.length - 1; i >= 0; i--) { const p = fx.parts[i]; p.life -= dt; if (p.life <= 0) { fx.parts.splice(i, 1); continue; } p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; }
    const t0 = performance.now();
    const ghost = this.mode !== 'title' && this.ghostArr ? this.ghostAt(this.s.t) : null;
    Renderer.frame(this.s, this.T, fx, ghost);
    const rt = performance.now() - t0;
    if (!DBG.noHud && ((this.hudFrame = (this.hudFrame || 0) + 1) % 2 === 0 || this.s.phase !== 'race')) this.updateHud();
    // audio
    const s = this.s, sp = s.speed / C.maxSpeed, racing = this.mode === 'race' && s.phase === 'race';
    Sound.engine(sp, s.offroad, (fx.curSeg && fx.curSeg.wind ? 0.08 : 0) + s.draft * 0.06 + (s.boostT > 0 ? 0.1 : 0), racing || this.mode === 'result' && sp > 0.05);
    if (this.mode !== 'paused') Sound.music(this.T.R, racing && s.light < C.lowLight * 1.6 ? 1 : racing ? 0.3 : 0);
    // perf + adaptive quality
    const P = this.perf; P.frames++; P.dtSum += rawDt; P.renderSum += rt; P.dtMax = Math.max(P.dtMax, rawDt); P.renderMax = Math.max(P.renderMax, rt);
    P.hist.push(rawDt * 1000); if (P.hist.length > 240) P.hist.shift();
    if (rawDt > 0.024 && rawDt < 0.2) P.slowT += rawDt; else P.slowT = Math.max(0, P.slowT - rawDt * 0.5);
    if (P.slowT > 2 && P.q < 2) { P.q++; P.slowT = 0; if (P.q === 1) this.resize(); else Renderer.dd = CONFIG.drawDistMin; }
    if (!this.hud.fps.hidden && P.frames % 15 === 0) { const avg = P.hist.reduce((a, b) => a + b, 0) / P.hist.length; this.hud.fps.textContent = `frame ${avg.toFixed(1)} ms\ndraw ${rt.toFixed(1)} ms\nquality ${2 - P.q}`; }
  },
  updateHud() {
    if (this.mode !== 'race' && this.mode !== 'result') return;
    const s = this.s, C = CONFIG, h = this.hud, pv = this.prev;
    const set = (k, el, v, prop) => { if (pv[k] !== v) { pv[k] = v; if (prop) el.style[prop] = v; else el.textContent = v; } };
    this.hudTick = (this.hudTick || 0) + 1;
    if (this.hudTick % 2 === 0 || s.phase !== 'race') {
    set('t', h.time, fmt(s.t));
    set('l', h.light, s.light.toFixed(1));
    set('sub', h.sub, `${Math.round(s.speed / C.maxSpeed * C.kmh)} km/h${s.boostT > 0 ? ' · boost' : ''}`);
    }
    set('lw', h.fill, `scaleX(${clamp(s.light / C.fullLight, 0, 1).toFixed(3)})`, 'transform');
    const low = s.light < C.lowLight; if (pv.low !== low) { pv.low = low; h.fill.classList.toggle('low', low); h.light.classList.toggle('low', low); }
    const pw = this.progW || (this.progW = $('prog').clientWidth);
    set('p', h.p, `translateX(${(s.prog * pw).toFixed(1)}px)`, 'transform');
    const g = this.ghostArr ? this.ghostAt(s.t) : null;
    set('g', h.g, g ? `translateX(${(clamp((g.z - this.T.startZ) / (this.T.finishZ - this.T.startZ), 0, 1) * pw).toFixed(1)}px)` : 'translateX(-9999px)', 'transform');
    const dr = s.draft > 0.5; if (pv.dr !== dr) { pv.dr = dr; h.draft.classList.toggle('on', dr); }
    if (pv.em !== s.embers) { pv.em = s.embers; h.pips.forEach((p, i) => p.classList.toggle('on', i < s.embers)); h.boost.disabled = s.embers === 0; }
    const tl = [...Input.ptrs.values()].some(p => p.x < Input.W / 2), tr = [...Input.ptrs.values()].some(p => p.x >= Input.W / 2);
    if (pv.tl !== tl) { pv.tl = tl; h.zl.classList.toggle('hold', tl); } if (pv.tr !== tr) { pv.tr = tr; h.zr.classList.toggle('hold', tr); }
    if (s.phase === 'race' && segAt(this.T, s.z + 30 * C.segL).sharpStart && !Store.data.seen.brake) { Store.data.seen.brake = 1; Store.save(); this.toast(touchy ? 'Sharp bend ahead. Hold both sides to brake.' : 'Sharp bend ahead. Hold Down or Space to brake.'); }
  },
};

/* ======================= Test hook (headless bots) ===================== */
window.__LL = {
  CONFIG, BUILT, step, newRace, botInput,
  DBG, input: Input, state: () => Game.s, mode: () => Game.mode, perf: () => Game.perf, store: () => Store.data,
  setBot: on => { Game.botOn = !!on; },
  giveEmber: () => { Game.s = Object.assign({}, Game.s, { embers: Math.min(3, Game.s.embers + 1) }); },
  setLight: v => { Game.s = Object.assign({}, Game.s, { light: v }); },
  jumpTo: frac => { const T = Game.T; Game.s = Object.assign({}, Game.s, { z: T.startZ + (T.finishZ - T.startZ) * frac }); },
  sim(trackIdx, opts) { // full race with the bot, no rendering
    opts = opts || {}; const T = BUILT[trackIdx]; let s = newRace(T, 'race'); s.phase = 'race';
    const rnd = mulberry32(opts.seed || 1); let steps = 0;
    const ga = opts.ghost ? (t => { const a = opts.ghost, f = t * 10, i = Math.floor(f), n = a.length / 2; if (i >= n - 1) return null; const k = f - i; return { z: lerp(a[i * 2], a[i * 2 + 2], k), x: lerp(a[i * 2 + 1], a[i * 2 + 3], k) / 1000 }; }) : null;
    const rec = []; let rt = 0;
    while (s.phase === 'race' && steps < 60 * 400) { const inp = botInput(s, T, ga, !!opts.sloppy, rnd); if (opts.sloppy && rnd() < (opts.lag || 0)) inp.steer = 0; s = step(s, inp, CONFIG.step, T, ga).s; steps++; rt += CONFIG.step; if (rt >= 0.1 - 1e-9) { rt = 0; rec.push(Math.round(s.z), Math.round(s.x * 1000)); } }
    return { win: s.result && s.result.win, time: s.t, prog: s.prog, minLight: s.minLight, bumps: s.bumps, offT: s.offT, len: T.len, gates: T.gates.map(g => g.bonus), startLight: T.startLight, ghost: rec };
  },
};

Game.init();
</script>
