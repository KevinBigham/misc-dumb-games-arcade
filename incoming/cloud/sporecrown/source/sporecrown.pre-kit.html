<meta name="theme-color" content="#141c16">
<title>Sporecrown</title>
<style>
:root{--bg:#141c16;--panel:#1d2920;--panel2:#26362a;--ink:#f1e8d4;--dim:#a8a28f;--line:#3a4b3d;--amber:#f5a742;--bad:#ff6b5e;--good:#93e27e;--lore:#9fcbff;--chit:#e9c48a;--sap:#9be38a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
body{display:flex;justify-content:center}
#app{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;position:relative;padding:0}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;cursor:pointer;touch-action:manipulation;transition:transform .08s}
button:active{transform:scale(.96)}
button:disabled{opacity:.45}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#hud{display:flex;align-items:center;gap:8px;padding:6px 10px;min-height:44px}
#fac{display:flex;align-items:center;gap:6px;font-weight:700;white-space:nowrap}
#fac i{width:12px;height:12px;border-radius:50%;display:inline-block}
#yields{display:flex;gap:10px;flex:1;justify-content:center;font-variant-numeric:tabular-nums;font-size:14px}
#yields b{font-weight:700}
.ys{color:var(--sap)}.yc{color:var(--chit)}.yl{color:var(--lore)}
#menuBtn{min-width:44px;padding:6px}
#race{display:flex;gap:6px;padding:0 10px 4px;font-size:12.5px;color:var(--dim);overflow:hidden;white-space:nowrap;min-height:24px;align-items:center;cursor:pointer}
#race span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
#race span.hot{border-color:var(--bad);color:#ffd3cf}
#mapwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#map{touch-action:none;display:block}
#toasts{position:absolute;left:8px;right:8px;top:6px;display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none}
.toast{background:rgba(20,28,22,.92);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:13px;animation:tin .25s ease-out;max-width:100%}
.toast.good{border-color:#5a8a4e}.toast.bad{border-color:#8a4a44}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#coach{margin:0 8px 4px;padding:6px 10px;border-radius:10px;background:#2c2a1c;border:1px solid #6a5a2a;font-size:13.5px;display:none;align-items:center;gap:8px}
#coach.on{display:flex}
#coach span{flex:1}
#coach button{min-height:30px;padding:2px 8px;font-size:12px}
#panel{margin:0 8px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:108px;max-height:38vh;overflow-y:auto}
#panel h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:6px}
#panel .sub{color:var(--dim);font-size:13px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.seg{display:flex;gap:4px;margin-top:6px}
.seg button{flex:1;min-height:34px;padding:4px;font-size:12.5px}
.seg button.on{background:#4a3a1c;border-color:var(--amber)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:6px}
.opt{text-align:left;padding:6px 8px;min-height:48px;display:flex;flex-direction:column;gap:1px}
.opt b{font-size:13.5px}.opt small{color:var(--dim);font-size:11.5px}
.opt.on{border-color:var(--amber);background:#3a301b}
.bar{height:6px;background:#0e140f;border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--amber)}
#bar{display:flex;gap:6px;padding:6px 8px 8px}
#bar button{min-height:50px}
#resBtn{flex:1.3;font-size:13px;text-align:left;line-height:1.2}
#nextBtn{flex:.7}
#endBtn{flex:1.2;background:#4b3615;border-color:var(--amber);font-weight:700}
#endBtn.pick{background:#2e3f22;border-color:var(--good)}
#overlay{position:absolute;inset:0;background:rgba(8,12,9,.82);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
#overlay[hidden]{display:none}
#card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;max-width:440px;max-height:100%;overflow-y:auto;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
#card h1{margin:0;font-size:34px;letter-spacing:2px;text-align:center;color:var(--amber)}
#card h2{margin:0 0 6px;font-size:21px}
#card p{margin:6px 0}
.big{width:100%;min-height:52px;font-size:17px;font-weight:700;margin-top:8px;background:#4b3615;border-color:var(--amber)}
.mid{width:100%;margin-top:6px}
.tcards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tcard{text-align:left;min-height:120px;display:flex;flex-direction:column;gap:4px;padding:10px}
.tcard b{font-size:15px;color:var(--amber)}
.tcard small{color:var(--ink);font-size:13px}
.muted{color:var(--dim);font-size:13px}
table.race{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.race td,table.race th{padding:4px;border-bottom:1px solid var(--line);text-align:right}
table.race td:first-child,table.race th:first-child{text-align:left}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.story{background:#151e17;border-radius:10px;padding:8px 10px;font-size:13.5px;margin:8px 0}
.story div{margin:2px 0}
#titleArt{display:block;margin:4px auto 0}
.chips{display:flex;gap:6px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.chips button{min-height:34px;padding:4px 10px;font-size:13px}
.chips button.on{border-color:var(--amber);background:#3a301b}
.realms{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.realms button{text-align:left;min-height:52px;padding:6px 8px;font-size:12.5px;line-height:1.25}
.realms button b{display:flex;align-items:center;gap:6px;font-size:13.5px}
.realms button i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.realms button.on{border-color:var(--amber);background:#3a301b}
.realms small{color:var(--dim)}
.tree{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px;font-size:13px}
.tree div{border:1px solid var(--line);border-radius:8px;padding:6px}
.tree .got{border-color:var(--good);background:#1f3320}
.tree .lost{opacity:.4;text-decoration:line-through}
.tree .next{border-color:var(--amber)}
@media (max-height:640px){#panel{min-height:92px}#bar button{min-height:44px}#race{min-height:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <header id="hud">
    <div id="fac"><i></i><span>Sporecrown</span></div>
    <div id="yields"></div>
    <button id="menuBtn" aria-label="Menu">&#9776;</button>
  </header>
  <div id="race" role="button" tabindex="0" aria-label="Victory race"></div>
  <div id="mapwrap"><canvas id="map" aria-label="Map"></canvas><div id="toasts"></div></div>
  <div id="coach"><span></span><button id="coachX">Got it</button></div>
  <section id="panel" aria-live="polite"></section>
  <footer id="bar">
    <button id="resBtn">Lore</button>
    <button id="nextBtn" title="Next unit (N)">Next &#9656;</button>
    <button id="endBtn">End turn</button>
  </footer>
  <div id="overlay" hidden><div id="card"></div></div>
</div>
<script>
(function(){
'use strict';
// ======================================================================
// CONFIG — every tunable number lives here
// ======================================================================
const CONFIG={
  W:9,H:11,TURNS:40,TRUCE:8,
  HOLLOW_P:0.10,GROVE_P:0.22,SHELF_P:0.20,RELICS:5,
  GROW_BASE:4,GROW_PER:3,EAT:2,PROD_CAP:30,
  UNIT_HP:10,COL_HP:12,BASE_DMG:4,DMG_EXP:0.9,COL_RET:0.6,
  HEAL_FIELD:1,HEAL_HOME:3,COL_HEAL:3,MESH_HEAL:3,
  MIL_CAP_BASE:2,MIL_CAP_PER:2,SITE_MIN_DIST:3,RICH_MAX:2,TERR_R2_POP:3,
  RELIC_LORE:10,HOME_Y:[0,2,1],RELIC_CHIT:6,THORNS:2,BLOOM_EXPOSE:0.7,BLOOM_KNOCK:1.5,BLOOM_RATE:10,HEARTS:2,TRAITS:true,MESH_DEF:1.3,COL_POP_DEF:0.45,HOME_DEF:0.8,BLOOM_CARRY:20,PLUNDER_LORE:6,PLUNDER_POP:2,GARRISON:0.35,CAP_RET_HP:0.4,
  DIFF:{gentle:0.8,fair:1,fierce:1.2},
  WIN_BONUS:{conquest:30,bloom:30,renown:15},
  SAVE_KEY:'sporecrown.v1.save',META_KEY:'sporecrown.v1.meta',BAD_KEY:'sporecrown.v1.bad',
  SCHEMA:1,RULES:1
};
// ======================================================================
// DATA — content as tables
// ======================================================================
const TERRAIN={
  L:{name:'Loam',y:[2,1,0],cost:1,def:0},
  G:{name:'Glowgrove',y:[1,0,2],cost:2,def:0.1},
  S:{name:'Shelf',y:[0,2,0],cost:2,def:0.25},
  X:{name:'Hollow',y:[0,0,0],cost:99,def:0,block:true}
};
const UNITS={
  spore:{name:'Spore',atk:0,def:1,mv:2,cost:12,civil:true,desc:'Founds a colony. Uses 1 pop.'},
  warden:{name:'Warden',atk:2,def:4,mv:1,cost:8,desc:'Sturdy guard.'},
  raider:{name:'Raider',atk:4,def:2,mv:2,cost:10,desc:'Fast striker.'},
  thorn:{name:'Thornback',atk:7,def:5,mv:1,cost:16,req:'swarm',desc:'Heavy fighter.'},
  lobber:{name:'Lobber',atk:5,def:1,mv:1,cost:14,range:2,siege:1.5,req:'rotsiege',desc:'Range 2, takes no hits back.'}
};
const BLD={
  granary:{name:'Sap Cellar',cost:14,y:[2,0,0],desc:'+2 sap'},
  workshop:{name:'Chitin Works',cost:14,y:[0,2,0],desc:'+2 chitin'},
  archive:{name:'Spore Archive',cost:16,y:[0,0,2],desc:'+2 lore'},
  palisade:{name:'Thorn Palisade',cost:12,def:4,desc:'+4 defense, pricks foes'}
};
const PROJ={bloom:{name:'Great Bloom',cost:120,req:'sporefall',desc:'Finish it to win. Grows at most 10 chitin a turn; hits knock it back'},hoard:{name:'Hoard',cost:0,desc:'Save chitin'}};
const TECHS=[
  {cost:20,opts:[{id:'deeproots',name:'Deep Roots',desc:'+1 sap on Loam.'},{id:'hardshell',name:'Hard Shell',desc:'+1 chitin on Shelf. Wardens +1 defense.'}]},
  {cost:44,opts:[{id:'swarm',name:'Thornswarm',desc:'Unlocks the Thornback (attack 7, defense 5).'},{id:'glow',name:'Glowlore',desc:'+1 sap on Glowgroves. Archives give +3 lore.'}]},
  {cost:76,opts:[{id:'mesh',name:'Root Mesh',desc:'Colonies get 1.5x defense and heal faster. Palisades cost half.'},{id:'gale',name:'Spore Gale',desc:'All units +1 move. Spores cost 8.'}]},
  {cost:140,opts:[{id:'sporefall',name:'Sporefall',desc:'Unlocks the Great Bloom. Finish it to win.'},{id:'rotsiege',name:'Rot Siege',desc:'Unlocks the Lobber (range 2). All fighters +1 attack.'}]}
];
const FACTIONS=[
  {name:'Amber Gill',color:'#f5a742',pers:'bal',trait:'Sun-gilled',tdesc:'Every colony makes +1 chitin.',names:['Gillhold','Tawnyridge','Ochrestead','Honeyfold','Rustcap','Gildenroot','Sunveil','Amberhollow','Marigold Knoll','Copperstalk']},
  {name:'Violet Veil',color:'#b58cff',pers:'bloom',trait:'Driftspore',tdesc:'Spores cost 4 less chitin and move 1 farther.',names:['Veilspire','Plumroot','Lilacmound','Mauvecap','Orchidfold','Heathcap','Wisteria Knoll','Thistledown','Iris Stand','Sloeberry']},
  {name:'Ash Morel',color:'#d6cfc0',pers:'war',trait:'Ironstalk',tdesc:'Fighters cost 2 less chitin and hit 1 harder.',names:['Cinderstalk','Greystem','Ashfold','Flintcap','Pallmound','Smokegill','Charrow','Slatecap','Dunbark','Graveltop']},
  {name:'Ruby Puffball',color:'#ff7f6e',pers:'grow',trait:'Quickflush',tdesc:'Colonies need 2 less sap to grow.',names:['Rosecap','Blushfold','Peachstalk','Rosehip Mound','Ruddygill','Pinkfrill','Clayroot','Apricot Knoll','Rhubarb Stand','Petalcap']}
];
const PERS={
  bal:{tech:['deeproots','glow','mesh','sporefall'],focus:'bal',wantCols:4,milPer:1.3,aggr:0.5,bld:['granary','workshop','archive','palisade']},
  bloom:{tech:['deeproots','glow','mesh','sporefall'],focus:'bal',wantCols:3,milPer:1.2,aggr:0.3,bld:['archive','workshop','granary','palisade']},
  war:{tech:['hardshell','swarm','gale','rotsiege'],focus:'bal',wantCols:3,milPer:2,aggr:1,bld:['workshop','granary','palisade','archive']},
  grow:{tech:['deeproots','swarm','gale','sporefall'],focus:'sap',wantCols:6,milPer:1,aggr:0.4,bld:['granary','workshop','archive','palisade']}
};
const FOCUS={bal:[1.4,1.1,1.1],sap:[2.4,1,1],chit:[1,2.4,1],lore:[1,1,2.2]};
const FOCUS_NAME={bal:'Balanced',sap:'Sap',chit:'Chitin',lore:'Lore'};
// ======================================================================
// Hex geometry (pointy-top, odd rows shifted right)
// ======================================================================
const W=CONFIG.W,H=CONFIG.H,N=W*H;
const DIRS=[[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]];
const AX=[];for(let i=0;i<N;i++){const c=i%W,r=(i/W)|0;AX.push([c-((r-(r&1))>>1),r]);}
function axToIdx(q,r){if(r<0||r>=H)return -1;const c=q+((r-(r&1))>>1);if(c<0||c>=W)return -1;return r*W+c;}
const NBD=[],NB=[];
for(let i=0;i<N;i++){const d=DIRS.map(([dq,dr])=>axToIdx(AX[i][0]+dq,AX[i][1]+dr));NBD.push(d);NB.push(d.filter(x=>x>=0));}
const DIST=new Uint8Array(N*N);
for(let a=0;a<N;a++)for(let b=0;b<N;b++){const dq=AX[a][0]-AX[b][0],dr=AX[a][1]-AX[b][1];DIST[a*N+b]=(Math.abs(dq)+Math.abs(dr)+Math.abs(dq+dr))/2;}
const dist=(a,b)=>DIST[a*N+b];
const WITHIN=[];for(let r=0;r<=3;r++){WITHIN.push([]);for(let i=0;i<N;i++){const l=[];for(let j=0;j<N;j++)if(j!==i&&DIST[i*N+j]<=r)l.push(j);WITHIN[r].push(l);}}
// ======================================================================
// Seeded RNG
// ======================================================================
function mkRng(seed){let s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function rand(S){S.rng=(S.rng+0x6D2B79F5)>>>0;let t=S.rng;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function shuffle(a,R){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// ======================================================================
// Map generation
// ======================================================================
function genMap(seed,nCiv){
  const R=mkRng(seed^0x9e3779b9);
  const base=nCiv===4?[[1,1],[7,1],[1,9],[7,9]]:[[1,1],[7,2],[3,9]];
  for(let attempt=0;attempt<300;attempt++){
    const ter=new Array(N);
    for(let i=0;i<N;i++){const v=R();ter[i]=v<CONFIG.HOLLOW_P?'X':v<CONFIG.HOLLOW_P+CONFIG.GROVE_P?'G':v<CONFIG.HOLLOW_P+CONFIG.GROVE_P+CONFIG.SHELF_P?'S':'L';}
    for(let k=0;k<N;k++){const i=Math.floor(R()*N);if(R()<0.6){const nb=NB[i];ter[i]=ter[nb[Math.floor(R()*nb.length)]];}}
    const anchors=base.map(([c,r])=>{const cc=Math.max(0,Math.min(W-1,c+Math.floor(R()*3)-1)),rr=Math.max(0,Math.min(H-1,r+Math.floor(R()*3)-1));return rr*W+cc;});
    let ok=true;for(let a=0;a<anchors.length;a++)for(let b=a+1;b<anchors.length;b++)if(dist(anchors[a],anchors[b])<5)ok=false;
    if(!ok)continue;
    for(const t of anchors){ter[t]='L';let l=0;for(const n of NB[t]){if(ter[n]==='X')ter[n]='L';if(ter[n]==='L')l++;}for(const n of NB[t]){if(l>=2)break;if(ter[n]!=='L'){ter[n]='L';l++;}}}
    const seen=new Uint8Array(N);const q=[anchors[0]];seen[anchors[0]]=1;
    while(q.length){const i=q.pop();for(const n of NB[i])if(!seen[n]&&ter[n]!=='X'){seen[n]=1;q.push(n);}}
    if(anchors.some(t=>!seen[t]))continue;
    let pass=0;for(let i=0;i<N;i++){if(ter[i]!=='X'&&!seen[i])ter[i]='X';if(ter[i]!=='X')pass++;}
    if(pass<N*0.8)continue;
    let room=true;for(const t of anchors){let c=0;for(const n of WITHIN[3][t])if(ter[n]!=='X')c++;if(c<20)room=false;}
    if(!room)continue;
    const cands=[];for(let i=0;i<N;i++)if(ter[i]!=='X'&&anchors.every(t=>dist(t,i)>=3))cands.push(i);
    shuffle(cands,R);const relics=[];
    for(const c of cands)if(relics.length<CONFIG.RELICS&&relics.every(x=>dist(x,c)>=3))relics.push(c);
    return {ter,anchors,relics};
  }
  const ter=new Array(N).fill('L');return {ter,anchors:base.map(([c,r])=>r*W+c),relics:[]};
}
// ======================================================================
// State
// ======================================================================
function newGame(o){
  o=Object.assign({seed:(Date.now()%1000000007)>>>0,rivals:3,diff:'fair',mode:'standard',dateKey:'',allAI:false,pers0:null,realm:0},o||{});
  const realm=Number.isInteger(o.realm)&&FACTIONS[o.realm]?o.realm:0;
  const nCiv=o.rivals+1;const M=genMap(o.seed,nCiv);const R=mkRng(o.seed^0x51ed27);
  const rivalF=shuffle([0,1,2,3].filter(f=>f!==realm),R).slice(0,o.rivals);const facs=[realm].concat(rivalF);
  const anchors=shuffle(M.anchors.slice(),R);
  const S={v:CONFIG.SCHEMA,rv:CONFIG.RULES,seed:o.seed,rng:((o.seed*2654435761)>>>0)||1,turn:1,mode:o.mode,dateKey:o.dateKey,diff:o.diff,allAI:!!o.allAI,
    ter:M.ter,own:new Array(N).fill(-1),rich:new Array(N).fill(0),relic:new Array(N).fill(0),seen:new Array(N).fill(0),
    civs:[],cols:[],units:[],nid:1,log:[],over:null};
  for(const r of M.relics)S.relic[r]=1;
  facs.forEach((f,ci)=>{
    const F=FACTIONS[f];
    S.civs.push({id:ci,f,name:F.name,human:ci===0&&!o.allAI,pers:ci===0&&o.pers0?o.pers0:F.pers,alive:true,lore:0,techs:[],pick:null,cap0:anchors[ci],named:0,kills:0,lost:0,aiT:-1,mult:ci===0?1:(CONFIG.DIFF[o.diff]||1)});
    foundColony(S,ci,anchors[ci],true,[]);
    addUnit(S,ci,'warden',anchors[ci]);
    const free=NB[anchors[ci]].filter(n=>S.ter[n]!=='X'&&!unitAt(S,n));
    if(free.length)addUnit(S,ci,'raider',free[0]);
  });
  updateSeen(S);
  return S;
}
function clone(S){return JSON.parse(JSON.stringify(S));}
function unitAt(S,t){for(const u of S.units)if(u.t===t)return u;return null;}
function colAt(S,t){for(const c of S.cols)if(c.t===t)return c;return null;}
function unitById(S,id){for(const u of S.units)if(u.id===id)return u;return null;}
function colById(S,id){for(const c of S.cols)if(c.id===id)return c;return null;}
function hasTech(civ,id){return civ.techs.indexOf(id)>=0;}
function civCols(S,cid){return S.cols.filter(c=>c.civ===cid);}
function milCount(S,cid){let n=0;for(const u of S.units)if(u.civ===cid&&u.k!=='spore')n++;return n;}
function milCap(S,cid){return CONFIG.MIL_CAP_BASE+CONFIG.MIL_CAP_PER*civCols(S,cid).length;}
function hasTrait(civ,f){return CONFIG.TRAITS&&civ.f===f;}
function maxMv(S,u){const c=S.civs[u.civ];return UNITS[u.k].mv+(hasTech(c,'gale')?1:0)+(u.k==='spore'&&hasTrait(c,1)?1:0);}
function growNeed(pop,civ){return CONFIG.GROW_BASE+CONFIG.GROW_PER*pop-(civ&&hasTrait(civ,3)?2:0);}
function logE(S,c,x){S.log.push({t:S.turn,c,x});if(S.log.length>80)S.log.shift();}
function addUnit(S,civ,k,t){const u={id:S.nid++,civ,k,t,hp:CONFIG.UNIT_HP,mv:0,did:0,att:0,fort:0,sleep:0,goal:-1};u.mv=maxMv(S,u);S.units.push(u);return u;}
function claim(S,cid,center,rad){S.own[center]=cid;for(const i of WITHIN[rad][center])if(S.ter[i]!=='X'&&S.own[i]===-1)S.own[i]=cid;}
function foundColony(S,cid,t,home,ev){
  const civ=S.civs[cid];const F=FACTIONS[civ.f];
  let name=F.names[civ.named%F.names.length];if(civ.named>=F.names.length)name+=' II';civ.named++;
  const col={id:S.nid++,civ:cid,oc:cid,name,t,pop:1,food:0,prod:0,build:null,focus:'bal',b:{},hp:CONFIG.COL_HP,home:!!home,cap:!!home,r2:false,born:S.turn};
  S.cols.push(col);claim(S,cid,t,1);
  if(S.relic[t]){S.relic[t]=0;}
  ev.push({e:'found',col:col.id,t,civ:cid});
  if(!home)logE(S,cid,civ.name+' founded '+name+'.');
  return col;
}
function updateSeen(S){
  for(const u of S.units)if(u.civ===0)for(const i of WITHIN[2][u.t].concat([u.t]))S.seen[i]=1;
  for(const c of S.cols)if(c.civ===0)for(const i of WITHIN[c.r2?3:2][c.t].concat([c.t]))S.seen[i]=1;
}
function visibleSet(S){
  const v=new Uint8Array(N);
  for(const u of S.units)if(u.civ===0){v[u.t]=1;for(const i of WITHIN[2][u.t])v[i]=1;}
  for(const c of S.cols)if(c.civ===0){v[c.t]=1;for(const i of WITHIN[c.r2?3:2][c.t])v[i]=1;}
  return v;
}
// ======================================================================
// Rules — yields
// ======================================================================
function tileY(S,civ,i){
  const T=TERRAIN[S.ter[i]];let s=T.y[0]+S.rich[i],c=T.y[1],l=T.y[2];
  if(S.ter[i]==='L'&&hasTech(civ,'deeproots'))s+=1;
  if(S.ter[i]==='S'&&hasTech(civ,'hardshell'))c+=1;
  if(S.ter[i]==='G'&&hasTech(civ,'glow'))s+=1;
  return [s,c,l];
}
function colYield(S,col,taken){
  const civ=S.civs[col.civ];
  let ty=tileY(S,civ,col.t);const y=[Math.max(ty[0],2),Math.max(ty[1],1),Math.max(ty[2],1)];
  const cand=[];
  for(const i of WITHIN[2][col.t]){
    if(S.own[i]!==col.civ||S.ter[i]==='X')continue;
    if(colAt(S,i))continue;
    const u=unitAt(S,i);if(u&&u.civ!==col.civ)continue;
    if(taken&&taken.has(i))continue;
    cand.push(i);
  }
  const w=FOCUS[col.focus]||FOCUS.bal;const worked=[];
  for(let p=0;p<col.pop&&cand.length;p++){
    const need=y[0]<CONFIG.EAT*col.pop;
    let best=0,bs=-1e9;
    for(let k=0;k<cand.length;k++){const t=tileY(S,civ,cand[k]);const sc=t[0]*(w[0]+(need?1.6:0))+t[1]*w[1]+t[2]*w[2]-k*1e-6;if(sc>bs){bs=sc;best=k;}}
    const i=cand.splice(best,1)[0];const t=tileY(S,civ,i);y[0]+=t[0];y[1]+=t[1];y[2]+=t[2];worked.push(i);if(taken)taken.add(i);
  }
  for(const b in col.b){const B=BLD[b];if(B&&B.y){y[0]+=B.y[0];y[1]+=B.y[1];y[2]+=B.y[2]+(b==='archive'&&hasTech(civ,'glow')?1:0);}}
  if(col.home){y[0]+=CONFIG.HOME_Y[0];y[1]+=CONFIG.HOME_Y[1];y[2]+=CONFIG.HOME_Y[2];}
  if(hasTrait(civ,0))y[1]+=1;
  const m=civ.mult;
  return {sap:y[0]*m,chit:y[1]*m,lore:y[2]*m,worked};
}
function civYields(S,cid){
  const taken=new Set();const out=new Map();let sap=0,chit=0,lore=0,eat=0;
  for(const c of S.cols)if(c.civ===cid){const y=colYield(S,c,taken);out.set(c.id,y);sap+=y.sap;chit+=y.chit;lore+=y.lore;eat+=c.pop*CONFIG.EAT;}
  out.tot={sap,chit,lore,eat};return out;
}
function itemCost(S,civ,it){
  if(UNITS[it]){if(it==='spore')return (hasTech(civ,'gale')?8:12)-(hasTrait(civ,1)?4:0);return UNITS[it].cost-(hasTrait(civ,2)&&!UNITS[it].civil?2:0);}
  if(BLD[it]){if(it==='palisade'&&hasTech(civ,'mesh'))return 6;return BLD[it].cost;}
  if(PROJ[it])return PROJ[it].cost;return 999;
}
function buildOptions(S,col){
  const civ=S.civs[col.civ];const out=[];
  const mil=milCount(S,col.civ),cap=milCap(S,col.civ);
  for(const k in UNITS){const U=UNITS[k];if(U.req&&!hasTech(civ,U.req))continue;
    let ok=true,why='';
    if(k==='spore'&&col.pop<2){ok=false;why='Needs 2 pop';}
    if(!U.civil&&mil>=cap&&col.build!==k){ok=false;why='Army full ('+mil+'/'+cap+')';}
    out.push({id:k,name:U.name,cost:itemCost(S,civ,k),ok,why,kind:'unit'});}
  for(const k in BLD){if(col.b[k])continue;out.push({id:k,name:BLD[k].name,cost:itemCost(S,civ,k),ok:true,why:'',kind:'bld'});}
  if(hasTech(civ,'sporefall')){const other=S.cols.find(c=>c.civ===col.civ&&c.id!==col.id&&c.build==='bloom');
    out.push({id:'bloom',name:'Great Bloom',cost:PROJ.bloom.cost,ok:!other,why:other?'Growing in '+other.name:'',kind:'proj'});}
  out.push({id:'hoard',name:'Hoard',cost:0,ok:true,why:'',kind:'hoard'});
  return out;
}
// ======================================================================
// Rules — movement and combat
// ======================================================================
function canPass(S,u,n){
  if(S.ter[n]==='X')return false;
  const c=colAt(S,n);if(c&&c.civ!==u.civ)return false;
  const o=unitAt(S,n);if(o&&o.civ!==u.civ)return false;
  return true;
}
function reachable(S,u){
  const dest=new Map();const prev=new Map();const mv=u.mv;if(mv<=0)return {dest,prev};
  const best=new Map([[u.t,0]]);const open=[u.t];
  while(open.length){
    let bi=0;for(let k=1;k<open.length;k++)if(best.get(open[k])<best.get(open[bi]))bi=k;
    const cur=open.splice(bi,1)[0];const cc=best.get(cur);if(cc>=mv)continue;
    for(const n of NB[cur]){if(!canPass(S,u,n))continue;const nc=Math.min(mv,cc+TERRAIN[S.ter[n]].cost);
      if(!best.has(n)||nc<best.get(n)){best.set(n,nc);prev.set(n,cur);open.push(n);}}
  }
  for(const [t,c] of best){if(t===u.t)continue;if(unitAt(S,t))continue;dest.set(t,mv-c);}
  return {dest,prev};
}
function pathTo(prev,from,to){const p=[to];let c=to;let g=0;while(c!==from&&g++<N){c=prev.get(c);if(c===undefined)break;p.push(c);}return p.reverse();}
function atkStr(S,u,vsCol){const civ=S.civs[u.civ];const U=UNITS[u.k];let a=U.atk+(U.atk>0&&hasTech(civ,'rotsiege')?1:0)+(U.atk>0&&hasTrait(civ,2)?1:0);if(vsCol&&U.siege)a*=U.siege;return a*(0.5+0.5*u.hp/CONFIG.UNIT_HP);}
function defStr(S,u){const civ=S.civs[u.civ];const U=UNITS[u.k];let d=U.def+(u.k==='warden'&&hasTech(civ,'hardshell')?1:0);
  const m=1+TERRAIN[S.ter[u.t]].def+(u.fort?0.25:0)+(S.own[u.t]===u.civ?0.1:0);return d*m*(0.5+0.5*u.hp/CONFIG.UNIT_HP);}
function colDef(S,col){const civ=S.civs[col.civ];let d=1+col.pop*CONFIG.COL_POP_DEF+(col.home?CONFIG.HOME_DEF:0)+(col.b.palisade?BLD.palisade.def:0);
  if(hasTech(civ,'mesh'))d*=CONFIG.MESH_DEF;if(col.build==='bloom')d*=CONFIG.BLOOM_EXPOSE;const g=unitAt(S,col.t);if(g&&g.civ===col.civ&&g.k!=='spore')d+=defStr(S,g)*CONFIG.GARRISON;
  return d*(0.6+0.4*col.hp/CONFIG.COL_HP);}
function dmg(a,d,roll,min){const r=a/Math.max(0.1,d);return Math.max(min,Math.round(CONFIG.BASE_DMG*Math.pow(r,CONFIG.DMG_EXP)*roll));}
function attackTargets(S,u){
  const out=[];const U=UNITS[u.k];
  if(U.atk<=0||u.mv<=0||u.att||S.turn<CONFIG.TRUCE)return out;
  const list=U.range?WITHIN[U.range][u.t]:NB[u.t];
  for(const t of list){const c=colAt(S,t);const v=unitAt(S,t);if((c&&c.civ!==u.civ)||(!c&&v&&v.civ!==u.civ))out.push(t);}
  return out;
}
function preview(S,u,t){
  const c=colAt(S,t),v=unitAt(S,t);const ranged=!!UNITS[u.k].range;
  if(c&&c.civ!==u.civ){const A=atkStr(S,u,true),D=colDef(S,c);return {kind:'col',name:c.name,dd:dmg(A,D,1,1),da:ranged?0:dmg(D*CONFIG.COL_RET,A,1,0),hp:c.hp,max:CONFIG.COL_HP};}
  if(v){if(v.k==='spore')return {kind:'spore',name:'Spore',dd:v.hp,da:0,hp:v.hp,max:CONFIG.UNIT_HP};
    const A=atkStr(S,u,false),D=defStr(S,v);return {kind:'unit',name:UNITS[v.k].name,dd:dmg(A,D,1,1),da:ranged?0:dmg(D,A,1,0),hp:v.hp,max:CONFIG.UNIT_HP};}
  return null;
}
function killUnit(S,u,ev,by){
  const i=S.units.indexOf(u);if(i<0)return;S.units.splice(i,1);
  S.civs[u.civ].lost++;if(by>=0&&S.civs[by])S.civs[by].kills++;
  ev.push({e:'die',t:u.t,k:u.k,civ:u.civ,id:u.id});
  if(u.k!=='spore'&&S.ter[u.t]!=='X'&&S.rich[u.t]<CONFIG.RICH_MAX){S.rich[u.t]++;ev.push({e:'rich',t:u.t});}
}
function checkOver(S,ev){
  if(S.over)return;
  const alive=S.civs.filter(c=>c.alive);
  for(const c of S.civs){if(c.alive&&civCols(S,c.id).length===0){c.alive=false;S.units=S.units.filter(u=>u.civ!==c.id);ev.push({e:'elim',civ:c.id});logE(S,c.id,c.name+' was overrun.');}}
  if(!S.allAI&&!S.civs[0].alive){S.over={type:'eliminated',winner:-1,turn:S.turn};ev.push({e:'over'});return;}
  for(const c of S.civs){if(!c.alive)continue;let held=0;for(const o of S.civs){const col=colAt(S,o.cap0);if(col&&col.civ===c.id)held++;}
    if(S.civs.every(o=>o.id===c.id||!o.alive)){S.over={type:'conquest',winner:c.id,turn:S.turn};logE(S,c.id,c.name+' is the last realm standing.');ev.push({e:'over'});return;}void held;}
  void alive;
}
function heartsNeeded(S){return CONFIG.HEARTS;}
function heartsHeld(S,cid){let h=0;for(const o of S.civs){const col=colAt(S,o.cap0);if(col&&col.civ===cid)h++;}return h;}
// Conquest: hold two Heartcaps through a full round (so the loser gets one turn to strike back)
function checkHold(S,ev){
  for(const c of S.civs){if(!c.alive){c.hold=0;continue;}const h=heartsHeld(S,c.id);
    if(h>=heartsNeeded(S)){if(c.hold){S.over={type:'conquest',winner:c.id,turn:S.turn};logE(S,c.id,c.name+' held '+h+' Heartcaps for a full round.');ev.push({e:'over'});return;}
      c.hold=1;ev.push({e:'holdWarn',civ:c.id,h});logE(S,c.id,c.name+' holds '+h+' Heartcaps. One more round wins it.');}
    else c.hold=0;}
}
function capture(S,col,u,ev){
  const old=col.civ;const g=unitAt(S,col.t);if(g&&g.civ===old)killUnit(S,g,ev,u.civ);
  const pl=CONFIG.PLUNDER_LORE+CONFIG.PLUNDER_POP*col.pop;S.civs[u.civ].lore+=pl;ev.push({e:'plunder',civ:u.civ,lore:pl,t:col.t});
  col.civ=u.civ;col.hp=Math.round(CONFIG.COL_HP*CONFIG.CAP_RET_HP);col.build=null;col.prod=0;col.food=0;col.pop=Math.max(1,col.pop-1);col.focus='bal';
  const wasHome=col.home;col.home=false;
  const rem=civCols(S,old);
  for(const i of WITHIN[2][col.t].concat([col.t])){if(S.own[i]!==old)continue;
    const d=dist(i,col.t);if(rem.every(c=>dist(i,c.t)>d))S.own[i]=u.civ;}
  S.own[col.t]=u.civ;
  if(wasHome&&rem.length){rem.sort((a,b)=>b.pop-a.pop);rem[0].home=true;}
  const from=u.t;u.t=col.t;ev.push({e:'move',u:u.id,path:[from,col.t],civ:u.civ});
  ev.push({e:'cap',col:col.id,from:old,to:u.civ,t:col.t,name:col.name,heart:col.cap});
  logE(S,u.civ,S.civs[u.civ].name+' took '+col.name+' from '+S.civs[old].name+'.');
  checkOver(S,ev);
}
function doAttack(S,u,t,ev){
  const c=colAt(S,t),v=unitAt(S,t);const ranged=!!UNITS[u.k].range;
  const r1=0.85+rand(S)*0.3,r2=0.85+rand(S)*0.3;
  u.mv=0;u.att=1;u.did=1;u.fort=0;u.sleep=0;
  if(c&&c.civ!==u.civ){
    const A=atkStr(S,u,true),D=colDef(S,c);const dd=dmg(A,D,r1,1),da=ranged?0:dmg(D*CONFIG.COL_RET,A,r2,0);
    c.hp-=dd;c.hitT=S.turn;u.hp-=da;ev.push({e:'atk',from:u.t,to:t,dd,da,civ:u.civ,tc:c.civ,col:true,ranged});
    if(c.build==='bloom'&&c.prod>0){const k=Math.min(c.prod,Math.round(dd*CONFIG.BLOOM_KNOCK));c.prod-=k;ev.push({e:'knock',col:c.id,civ:c.civ,by:u.civ,k,t});}
    if(u.hp<=0){killUnit(S,u,ev,c.civ);if(c.hp<1)c.hp=1;return;}
    if(c.hp<=0){if(ranged)c.hp=1;else capture(S,c,u,ev);}
    return;
  }
  if(!v)return;
  if(v.k==='spore'){ev.push({e:'atk',from:u.t,to:t,dd:v.hp,da:0,civ:u.civ,tc:v.civ,ranged});killUnit(S,v,ev,u.civ);
    if(!ranged&&!colAt(S,u.t)&&!unitAt(S,t)){const f=u.t;u.t=t;ev.push({e:'move',u:u.id,path:[f,t],civ:u.civ});}return;}
  const A=atkStr(S,u,false),D=defStr(S,v);const dd=dmg(A,D,r1,1),da=ranged?0:dmg(D,A,r2,0);
  v.hp-=dd;u.hp-=da;ev.push({e:'atk',from:u.t,to:t,dd,da,civ:u.civ,tc:v.civ,ranged});
  if(v.hp<=0)killUnit(S,v,ev,u.civ);
  if(u.hp<=0){killUnit(S,u,ev,v.civ);return;}
  if(v.hp<=0&&!ranged){const mine=colAt(S,u.t);if(!(mine&&mine.civ===u.civ)&&!unitAt(S,t)&&!colAt(S,t)){const f=u.t;u.t=t;ev.push({e:'move',u:u.id,path:[f,t],civ:u.civ});}}
}
function validSite(S,cid,t){
  if(t<0||S.ter[t]==='X')return false;if(S.own[t]!==-1&&S.own[t]!==cid)return false;
  for(const c of S.cols)if(dist(c.t,t)<CONFIG.SITE_MIN_DIST)return false;return true;
}
function siteWhy(S,cid,t){
  if(S.own[t]!==-1&&S.own[t]!==cid)return 'Rival land';
  for(const c of S.cols)if(dist(c.t,t)<CONFIG.SITE_MIN_DIST)return 'Too close to '+c.name;return '';
}
function needsTech(S,cid){const c=S.civs[cid];return c.alive&&!c.pick&&c.techs.length<TECHS.length;}
// ======================================================================
// Rules — command execution (mutating) and pure apply()
// ======================================================================
function exec(S,cmd,ev){
  if(S.over)return false;
  const c=cmd.c;
  if(c==='move'){
    const u=unitById(S,cmd.u);if(!u||u.mv<=0)return false;
    const R=reachable(S,u);if(!R.dest.has(cmd.to))return false;
    const path=pathTo(R.prev,u.t,cmd.to);u.mv=R.dest.get(cmd.to);u.t=cmd.to;u.did=1;u.fort=0;u.sleep=0;
    ev.push({e:'move',u:u.id,path,civ:u.civ});
    if(S.relic[u.t]){S.relic[u.t]=0;const civ=S.civs[u.civ];civ.lore+=CONFIG.RELIC_LORE;
      const cs=civCols(S,u.civ).sort((a,b)=>dist(a.t,u.t)-dist(b.t,u.t));if(cs[0])cs[0].prod+=CONFIG.RELIC_CHIT;
      ev.push({e:'relic',t:u.t,civ:u.civ});logE(S,u.civ,civ.name+' found an old stump: +'+CONFIG.RELIC_LORE+' lore, +'+CONFIG.RELIC_CHIT+' chitin.');}
    if(u.civ===0)updateSeen(S);return true;
  }
  if(c==='attack'){
    const u=unitById(S,cmd.u);if(!u)return false;if(attackTargets(S,u).indexOf(cmd.t)<0)return false;
    doAttack(S,u,cmd.t,ev);if(u.civ===0)updateSeen(S);return true;
  }
  if(c==='found'){
    const u=unitById(S,cmd.u);if(!u||u.k!=='spore'||!validSite(S,u.civ,u.t))return false;
    S.units.splice(S.units.indexOf(u),1);foundColony(S,u.civ,u.t,false,ev);if(u.civ===0)updateSeen(S);return true;
  }
  if(c==='join'){
    const u=unitById(S,cmd.u);if(!u||u.k!=='spore')return false;const col=colAt(S,u.t);if(!col||col.civ!==u.civ)return false;
    S.units.splice(S.units.indexOf(u),1);col.pop++;ev.push({e:'grow',col:col.id,pop:col.pop,civ:col.civ});return true;
  }
  if(c==='fortify'||c==='skip'){
    const u=unitById(S,cmd.u);if(!u)return false;u.mv=0;u.sleep=c==='fortify'?1:0;if(c==='fortify'&&!u.did)u.fort=1;ev.push({e:'rest',u:u.id});return true;
  }
  if(c==='wake'){const u=unitById(S,cmd.u);if(!u)return false;u.sleep=0;return true;}
  if(c==='build'){
    const col=colById(S,cmd.col);if(!col)return false;const o=buildOptions(S,col).find(x=>x.id===cmd.it);if(!o||!o.ok)return false;
    if(cmd.it==='bloom'&&col.build!=='bloom'){ev.push({e:'bloomStart',civ:col.civ,col:col.id});logE(S,col.civ,S.civs[col.civ].name+' began the Great Bloom in '+col.name+'.');}
    if(cmd.it==='bloom'&&col.build!=='bloom')col.prod=Math.min(col.prod,CONFIG.BLOOM_CARRY);
    col.build=cmd.it;return true;
  }
  if(c==='focus'){const col=colById(S,cmd.col);if(!col||!FOCUS[cmd.f])return false;col.focus=cmd.f;return true;}
  if(c==='tech'){
    const civ=S.civs[cmd.civ];if(!civ||civ.pick||civ.techs.length>=TECHS.length)return false;
    if(!TECHS[civ.techs.length].opts.some(o=>o.id===cmd.id))return false;civ.pick=cmd.id;return true;
  }
  return false;
}
function apply(S,cmd){const T=clone(S);const ev=[];const ok=exec(T,cmd,ev);return {state:ok?T:S,events:ev,ok};}
function spawnTile(S,col){
  if(!unitAt(S,col.t))return col.t;
  const c=NB[col.t].filter(n=>S.ter[n]!=='X'&&!unitAt(S,n)&&!colAt(S,n)&&(S.own[n]===col.civ||S.own[n]===-1));
  return c.length?c[0]:-1;
}
function tryComplete(S,col,ev){
  const civ=S.civs[col.civ];const it=col.build;
  if(!it||it==='hoard'){col.prod=Math.min(col.prod,CONFIG.PROD_CAP);return;}
  const cost=itemCost(S,civ,it);if(col.prod<cost)return;
  if(UNITS[it]){
    if(it==='spore'&&col.pop<2){ev.push({e:'blocked',col:col.id,civ:col.civ,why:'needs 2 pop'});col.prod=Math.min(col.prod,cost);return;}
    if(it!=='spore'&&milCount(S,col.civ)>=milCap(S,col.civ)){ev.push({e:'blocked',col:col.id,civ:col.civ,why:'army is full'});col.prod=Math.min(col.prod,cost);return;}
    const t=spawnTile(S,col);if(t<0){ev.push({e:'blocked',col:col.id,civ:col.civ,why:'no room'});col.prod=Math.min(col.prod,cost);return;}
    if(it==='spore')col.pop--;

function validate(S){

    if(!S.ter.every(t=>TERRAIN[t]))return 'terrain';

    if(typeof S.rng!=='number'||!isFinite(S.rng))return 'rng';

      case 'die':this.noise(0.35,0.22,500);this.tone(220,0.3,'sawtooth',0.05,0,0.4);break;
      case 'grow':this.tone(440,0.12,'sine',0.12);this.tone(660,0.16,'sine',0.1,0.08);break;
      case 'found':[392,494,587,784].forEach((f,i)=>this.tone(f,0.18,'triangle',0.1,i*0.06));break;

      case 'lost':[392,311,262].forEach((f,i)=>this.tone(f,0.3,'triangle',0.1,i*0.12));break;
      case 'tech':[523,659,784,1047].forEach((f,i)=>this.tone(f,0.22,'sine',0.08,i*0.05));break;
      case 'turn':this.noise(0.25,0.08,2500);this.tone(220,0.2,'sine',0.06,0,1.5);break;
      case 'win':[392,494,587,784,988].forEach((f,i)=>this.tone(f,0.5,'triangle',0.1,i*0.12));break;
      case 'lose':[330,294,262,196].forEach((f,i)=>this.tone(f,0.5,'sine',0.1,i*0.18));break;
      case 'deny':this.tone(180,0.12,'square',0.06);break;

function playEvents(evs,delay0){
  const now=performance.now();const vis=visibleSet(S);let played={};const human=[];

      tweens.set(e.u,{path:e.path,t0:now+base,dur:Math.min(420,120*(e.path.length-1)+60)});if(e.civ===0)once('move');}
    else if(e.e==='atk'){if(!(vis[e.to]||vis[e.from]))continue;const dl=e.civ!==0?(civDelay[e.civ]||0)+d+120:d;addFloat(e.to,'-'+e.dd,'#ff8a7a',dl);if(e.da)addFloat(e.from,'-'+e.da,'#ffb08a',dl+80);burst(e.to,'#ffcfb0',8,dl,0.8);shake=Math.max(shake,e.col?7:4);once('hit');

    else if(e.e==='die'){if(vis[e.t]||S.seen[e.t]){burst(e.t,'#c9b38a',16,d+150,1.3);once('die');}if(e.civ===0)human.push(['Your '+UNITS[e.k].name+' fell.','bad']);}
    else if(e.e==='rich'){if(S.seen[e.t])addFloat(e.t,'+sap','#8fe07a',d+500);}

    else if(e.e==='starve'){if(e.civ===0){const c=colById(S,e.col);if(c){addFloat(c.t,'-1 pop','#ff8a7a',d);human.push([c.name+' is starving.','bad']);}}}
    else if(e.e==='found'){if(vis[e.t]||S.seen[e.t]){burst(e.t,FACTIONS[S.civs[e.civ].f].color,22,d,1.4);}if(e.civ===0)once('found');}

    else if(e.e==='built'){if(e.civ===0){const c=colById(S,e.col);if(c){addFloat(c.t,BLD[e.it].name,'#e9c48a',d);human.push([c.name+' built '+BLD[e.it].name+'.','good']);once('built');}}}
    else if(e.e==='blocked'){if(e.civ===0){const c=colById(S,e.col);human.push([(c?c.name:'')+' is waiting: '+e.why+'.','bad']);}}
    else if(e.e==='cap'){shake=12;burst(e.t,FACTIONS[S.civs[e.to].f].color,30,d+200,1.6);if(e.to===0){once('cap');human.push(['You took '+e.name+'!','good']);}else if(e.from===0){once('lost');human.push([S.civs[e.to].name+' took '+e.name+'.','bad']);}else if(e.heart)human.push([S.civs[e.to].name+' took the Heartcap '+e.name+'.','']);}
    else if(e.e==='tech'){if(e.civ===0){once('tech');const hc=S.cols.find(c=>c.civ===0&&c.home);if(hc){burst(hc.t,'#9fcbff',22,d,1.2);}const o=TECHS.flatMap(t=>t.opts).find(x=>x.id===e.id);human.push(['Learned '+o.name+'.','good']);}else if(e.id==='sporefall')human.push([S.civs[e.civ].name+' learned Sporefall.','bad']);}
    else if(e.e==='relic'){if(e.civ===0){addFloat(e.t,'+lore','#9fcbff',d);burst(e.t,'#9fcbff',14,d,1);once('tech');human.push(['Old stump: +'+CONFIG.RELIC_LORE+' lore, +'+CONFIG.RELIC_CHIT+' chitin.','good']);}}

    else if(e.e==='plunder'){if(e.civ===0){addFloat(e.t,'+'+e.lore+' lore','#9fcbff',d+420);human.push(['Plundered '+e.lore+' lore.','good']);}}
    else if(e.e==='holdWarn'){once('alarm');if(e.civ===0)human.push(['You hold '+e.h+' Heartcaps. Keep them one more round to win!','good']);else human.push([S.civs[e.civ].name+' holds '+e.h+' Heartcaps. Retake one this turn or lose!','bad']);}

  dirty=true;

function idleUnits(){return S.units.filter(u=>u.civ===0&&u.mv>0&&!u.sleep);}

function onTile(i){

function endTurn(){
  if(!S||S.over||modal)return;
  if(S.turn>=2&&needsTech(S,0)){openTech();return;}
  const nob=S.cols.find(c=>c.civ===0&&!c.build);if(nob){sel={k:'c',id:nob.id};Sound.sfx('tap');refresh();toast('Pick what '+nob.name+' grows next.');return;}
  Sound.sfx('turn');
  const T=clone(S);const ev=[];
  for(const c of T.civs){if(c.id===0||T.over)continue;aiPlay(T,c.id,ev);}
  if(!T.over)endRound(T,ev);
  S=T;sel=null;cursor=-1;playEvents(ev,60);saveGame();
  if(S.over){refresh();setTimeout(showEnd,900);return;}
  selectFirstIdle();coachCheck({c:'end'});
  if(needsTech(S,0)&&S.turn>=2)setTimeout(()=>{if(!modal&&S&&!S.over)openTech();},500);
}

function titleArt(){

  const x=c.getContext('2d');if(!x)return c;x.scale(d,d);
  const cols=['#b58cff','#f5a742','#ff7f6e'];[[50,62,20,0],[110,52,30,1],[170,64,18,2]].forEach(([px,py,r,k])=>{
    x.fillStyle='#efe2c4';x.fillRect(px-r*0.22,py-2,r*0.44,r*1.1);x.fillStyle=cols[k];x.beginPath();x.ellipse(px,py,r*1.3,r*0.95,0,Math.PI,0);x.closePath();x.fill();
    x.fillStyle='rgba(255,255,255,.85)';x.beginPath();x.arc(px-r*0.5,py-r*0.45,r*0.16,0,7);x.arc(px+r*0.3,py-r*0.62,r*0.13,0,7);x.fill();});
  x.fillStyle='#ffe08a';for(let k=-1;k<=1;k++){x.beginPath();x.moveTo(110+k*12-5,24);x.lineTo(110+k*12,12-(k?0:5));x.lineTo(110+k*12+5,24);x.fill();}
  return c;
}

function showEnd(){
