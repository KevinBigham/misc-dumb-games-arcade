<meta name="theme-color" content="#070818">
<title>Prismwheel</title>
<style>
:root{color-scheme:dark;--bg:#070818;--ink:#eef0ff;--dim:#9aa0c8;--card:rgba(18,20,48,.86);--line:rgba(160,170,255,.18);--coral:#ff5d73;--amber:#ffc23d;--mint:#3ee6a6;--sky:#4cc3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.ctl{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));height:84px;width:min(calc(50% - 64px),240px);border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--ink);border-radius:22px;font-size:34px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:pointer}
.ctl:active,.ctl.on{background:rgba(255,255,255,.14)}
#bl{left:12px}#br{right:12px}
#bf{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;border:none;color:#fff;font-weight:800;font-size:12px;letter-spacing:.08em;touch-action:none;cursor:pointer;
 background:conic-gradient(#fff var(--f,0%),rgba(255,255,255,.08) 0);padding:5px}
#bf span{display:flex;width:100%;height:100%;border-radius:50%;background:#14163a;align-items:center;justify-content:center;flex-direction:column;line-height:1.1}
#bf.ready span{background:radial-gradient(circle,#ffffff 0,#ffd27a 30%,#ff5d73 75%);color:#2a0b18;animation:pulse .9s ease-in-out infinite}
#bf.locked{opacity:0;pointer-events:none}
@keyframes pulse{50%{filter:brightness(1.25)}}
#topbtns{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;display:flex;gap:8px}
#topbtns button{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font-size:18px;cursor:pointer}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,6,18,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:5}
.ov[hidden]{display:none}
.card{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:26px;padding:24px 20px 20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo{font-size:40px;font-weight:900;letter-spacing:.04em;margin:2px 0 4px;background:linear-gradient(90deg,var(--coral),var(--amber),var(--mint),var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--dim);margin:0 0 16px;font-size:15px}
.how{text-align:left;margin:0 auto 18px;padding:0;list-style:none;font-size:15px;line-height:1.35;max-width:300px}
.how li{display:flex;gap:10px;align-items:center;margin:8px 0}
.how b{display:inline-flex;min-width:46px;justify-content:center;font-size:13px;padding:5px 6px;border-radius:9px;background:rgba(255,255,255,.08)}
.btn{display:block;width:100%;height:54px;border-radius:16px;border:none;font-size:18px;font-weight:800;margin:8px 0;cursor:pointer;color:#1a0b1f;background:linear-gradient(90deg,#ffd27a,#ff8aa0)}
.btn.alt{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line)}
.btn[hidden]{display:none}
.row{display:flex;gap:10px;justify-content:center;color:var(--dim);font-size:14px;margin-top:10px}
.big{font-size:52px;font-weight:900;margin:4px 0}
.nb{display:inline-block;margin:0 0 8px;padding:4px 12px;border-radius:999px;background:linear-gradient(90deg,var(--amber),var(--coral));color:#2a0b18;font-weight:800;font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;font-size:14px}
.stats div{background:rgba(255,255,255,.05);border-radius:12px;padding:8px}
.stats b{display:block;font-size:20px}
.tip{color:#d6dbff;font-size:14px;line-height:1.4;background:rgba(76,195,255,.1);border:1px solid rgba(76,195,255,.25);border-radius:14px;padding:10px 12px;margin:8px 0 6px;text-align:left}
#toast{position:fixed;left:50%;top:calc(90px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(18,20,48,.92);border:1px solid var(--line);border-radius:14px;padding:9px 14px;font-size:14px;max-width:calc(100% - 32px);text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;z-index:4}
#toast.show{opacity:1}
</style>
<canvas id="cv"></canvas>
<button class="ctl" id="bl" aria-label="Turn left">&#9664;</button>
<button class="ctl" id="br" aria-label="Turn right">&#9654;</button>
<button id="bf" class="locked" aria-label="Flare"><span>FLARE</span></button>
<div id="topbtns"><button id="bmute" aria-label="Sound">&#9834;</button><button id="bpause" aria-label="Pause">&#10074;&#10074;</button></div>
<div id="toast"></div>

<div class="ov" id="title"><div class="card">
  <div class="logo">PRISMWHEEL</div>
  <p class="tag">Spin the wheel, not the shards.</p>
  <ul class="how">
    <li><b>&#9664; &#9654;</b> Turn the wheel to catch falling shards</li>
    <li><b>3+</b> Touch 3 of a color to shatter them</li>
    <li><b>- - -</b> A face that passes the dashed ring breaks</li>
  </ul>
  <button class="btn" id="bresume" hidden>Resume run</button>
  <button class="btn" id="bplay">Play</button>
  <button class="btn alt" id="bdaily">Daily Spin</button>
  <div class="row"><span id="tbest">Best 0</span><span>&middot;</span><span id="tdaily">Today 0</span></div>
</div></div>

<div class="ov" id="pause" hidden><div class="card">
  <div class="logo" style="font-size:30px">PAUSED</div>
  <p class="tag" id="pinfo"></p>
  <button class="btn" id="bunpause">Resume</button>
  <button class="btn alt" id="bquit">Quit to menu</button>
</div></div>

<div class="ov" id="over" hidden><div class="card">
  <div class="tag" id="owhy" style="margin:0;letter-spacing:.12em;font-weight:700">A FACE BROKE</div>
  <div class="nb" id="onew" hidden>NEW BEST</div>
  <div class="big" id="oscore">0</div>
  <div class="row" style="margin:0"><span id="obest">Best 0</span></div>
  <div class="stats">
    <div>Ring<b id="oring">I</b></div><div>Shards<b id="ocl">0</b></div>
    <div>Best combo<b id="ocombo">0</b></div><div>Best chain<b id="ochain">0</b></div>
  </div>
  <div class="tip" id="otip"></div>
  <button class="btn" id="bretry">Spin again</button>
  <button class="btn alt" id="bmenu">Menu</button>
</div></div>
<script id="core">
/* Prismwheel core: CONFIG, DATA, State, pure-ish Rules (no drawing, no audio, no DOM).
   Rules mutate the state object and push plain events to state.events for the app to consume. */
(function (root) {
'use strict';

const CONFIG = {
  maxRows: 8,          // a side overflows when a 9th shard lands on it
  coreR: 0.165,        // core apothem, in wheel units (1 unit = half the play area)
  rowH: 0.07,          // shard thickness, in units
  spawnDist: 1.1,      // where shards appear
  step: 1 / 120,       // fixed timestep (s)
  // difficulty: d' = rate / (1 + damp * d), capped. Fast early, flatter late, hard cap.
  diffStart: 1, diffCap: 35, diffRate: 0.13, diffDamp: 0.08,
  speedBase: 0.3, speedPerDiff: 0.0115,      // units per second
  gapBase: 1.55, gapPerDiff: 0.032, gapMin: 0.5, // seconds between waves
  comboWindowBase: 3.4, comboWindowMin: 2.0,     // seconds to keep a combo alive
  matchMin: 3,
  cascadeDelay: 0.17,  // beat between a clear and the chain check
  flareCharge: 24,     // shards cleared to fill the flare
  flarePush: 0.32,     // how far a flare shoves incoming shards back out
  ringBreather: 0.72,  // difficulty multiplier when you climb a ring
  ringUpPause: 1.8,    // seconds of calm after a ring-up
  colors: 4,
};

const DATA = {
  colors: [
    { name: 'coral', hex: '#ff5d73', glyph: 'circle' },
    { name: 'amber', hex: '#ffc23d', glyph: 'triangle' },
    { name: 'mint',  hex: '#3ee6a6', glyph: 'square' },
    { name: 'sky',   hex: '#4cc3ff', glyph: 'diamond' },
  ],
  // Rings: each climb changes the wheel's shape. Quotas grow ~3x (shards cleared inside the ring).
  rings: [
    { name: 'Ring I',   title: 'Six Faces',   sides: 6, quota: 30,  specials: {} },
    { name: 'Ring II',  title: 'Seven Faces', sides: 7, quota: 90,  specials: { prism: 0.045 } },
    { name: 'Ring III', title: 'Eight Faces', sides: 8, quota: 270, specials: { prism: 0.045, stone: 0.05 } },
    { name: 'Crown',    title: 'Endless',     sides: 8, quota: Infinity, specials: { prism: 0.05, stone: 0.07 } },
  ],
  // Wave patterns as data. count may be [min,max]. laneStep: 'rand' | 'opp' | integer (0 = same lane, 'spin' = +1 or -1).
  patterns: [
    { id: 'single', minDiff: 0,  w: 6,   count: 1 },
    { id: 'trio',   minDiff: 3,  w: 0.7, count: 3, laneStep: 0, sameColor: true, delay: 0.32 },
    { id: 'twin',   minDiff: 4,  w: 2.2, count: 2, laneStep: 'rand', delay: 0 },
    { id: 'spiral', minDiff: 6,  w: 1.6, count: [3, 5], laneStep: 'spin', delay: 0.2 },
    { id: 'mirror', minDiff: 9,  w: 1.3, count: 2, laneStep: 'opp', sameColor: true, delay: 0 },
    { id: 'volley', minDiff: 14, w: 1.1, count: 4, laneStep: 0, delay: 0.27 },
    { id: 'storm',  minDiff: 22, w: 0.9, count: [5, 7], laneStep: 'rand', delay: 0.16 },
  ],
  // Death tips (rule 10: every loss teaches something). First matching tip wins.
  tips: [
    { when: s => s.flareReady, text: 'Your flare was full. Tap the core (or Space) to wipe the bottom row of every face.' },
    { when: s => s.stoneOnTop, text: 'Stones only crack when a match touches them. Clear next to them early.' },
    { when: s => s.bestChain < 2 && s.cleared >= 20, text: 'Try a chain: stack a color on top of a different one, then clear underneath it.' },
    { when: s => s.cleared < 12, text: 'Turn first, then look. Park each color next to its twin on the same row.' },
    { when: s => s.ring >= 1, text: 'Seven faces means turns stop lining up with the old habits. Count faces, not directions.' },
    { when: () => true, text: 'Keep one side low as a dump zone for colors you cannot place yet.' },
  ],
};

// ---------- RNG (seeded, serializable) ----------
function rand(st) { // mulberry32
  let t = (st.rngS = (st.rngS + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function hashStr(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }

// ---------- State ----------
function newState(opts) {
  opts = opts || {};
  const ring = DATA.rings[0];
  const st = {
    v: 1, mode: opts.mode || 'classic', seed: (opts.seed >>> 0) || 1, rngS: (opts.seed >>> 0) || 1,
    t: 0, diff: CONFIG.diffStart, ringIdx: 0, ringCleared: 0, sides: ring.sides, rot: 0,
    grid: [], falling: [], queue: [], pending: [], bag: [],
    nextWaveAt: 0.4, score: 0, combo: 0, comboT: 0, chain: 0,
    flare: 0, flareUnlocked: false, ringUpT: 0, over: false, nextId: 1,
    stats: { cleared: 0, bestChain: 0, bestCombo: 0, landed: 0, turns: 0, flares: 0, biggest: 0 },
    events: [],
  };
  for (let i = 0; i < st.sides; i++) st.grid.push([]);
  return st;
}
function serialize(st) { const c = Object.assign({}, st); delete c.events; return JSON.stringify(c); }
function load(json) {
  const st = JSON.parse(json);
  if (!st || st.v !== 1 || !Array.isArray(st.grid) || st.grid.length !== st.sides) throw new Error('bad save');
  st.events = []; return st;
}

// ---------- Derived numbers ----------
const speed = st => CONFIG.speedBase + Math.min(st.diff, CONFIG.diffCap) * CONFIG.speedPerDiff;
const waveGap = st => Math.max(CONFIG.gapMin, CONFIG.gapBase - st.diff * CONFIG.gapPerDiff);
const comboWindow = st => CONFIG.comboWindowBase - (CONFIG.comboWindowBase - CONFIG.comboWindowMin) * Math.min(1, st.diff / CONFIG.diffCap);
const landDist = (st, s) => CONFIG.coreR + st.grid[s].length * CONFIG.rowH;
const sideForLane = (st, lane) => ((lane - st.rot) % st.sides + st.sides) % st.sides;
const ring = st => DATA.rings[st.ringIdx];

// ---------- Spawning ----------
function drawColor(st) {
  if (!st.bag.length) { for (let c = 0; c < CONFIG.colors; c++) st.bag.push(c, c); for (let i = st.bag.length - 1; i > 0; i--) { const j = Math.floor(rand(st) * (i + 1)); [st.bag[i], st.bag[j]] = [st.bag[j], st.bag[i]]; } }
  return st.bag.pop();
}
function drawKind(st) {
  const sp = ring(st).specials, r = rand(st);
  if (sp.stone && r < sp.stone) return 'stone';
  if (sp.prism && r < (sp.stone || 0) + sp.prism) return 'prism';
  return 'shard';
}
function pickPattern(st) {
  const ok = DATA.patterns.filter(p => st.diff >= p.minDiff);
  let tot = 0; for (const p of ok) tot += p.w;
  let r = rand(st) * tot;
  for (const p of ok) { r -= p.w; if (r <= 0) return p; }
  return ok[0];
}
function queueWave(st) {
  const p = pickPattern(st), n = st.sides;
  const count = Array.isArray(p.count) ? p.count[0] + Math.floor(rand(st) * (p.count[1] - p.count[0] + 1)) : p.count;
  let lane = Math.floor(rand(st) * n);
  const dir = rand(st) < 0.5 ? -1 : 1;
  const color = drawColor(st);
  const used = new Set();
  for (let i = 0; i < count; i++) {
    if (i > 0) {
      if (p.laneStep === 'rand') { let tries = 0; do { lane = Math.floor(rand(st) * n); } while (used.has(lane) && ++tries < 8); }
      else if (p.laneStep === 'opp') lane = (lane + Math.floor(n / 2)) % n;
      else if (p.laneStep === 'spin') lane = (lane + dir + n) % n;
      else lane = (lane + (p.laneStep || 0) + n) % n;
    }
    used.add(lane);
    const kind = p.sameColor ? 'shard' : drawKind(st);
    st.queue.push({ at: st.t + i * (p.delay || 0), lane, c: p.sameColor ? color : drawColor(st), kind });
  }
  st.nextWaveAt = st.t + (count - 1) * (p.delay || 0) + waveGap(st);
  st.events.push({ type: 'wave', id: p.id });
}

// ---------- Matching ----------
function matches(b, color) { return b.kind === 'prism' || (b.kind === 'shard' && b.c === color); }
function groupFrom(st, s, r) {
  const g = st.grid, n = st.sides, start = g[s][r];
  if (!start || start.kind === 'stone') return [];
  const colors = start.kind === 'prism' ? [0, 1, 2, 3] : [start.c];
  let best = [];
  for (const color of colors) {
    const seen = new Set([s + ':' + r]), out = [], stack = [[s, r]];
    while (stack.length) {
      const [cs, cr] = stack.pop(); out.push([cs, cr]);
      const nb = [[cs, cr - 1], [cs, cr + 1], [(cs + 1) % n, cr], [(cs - 1 + n) % n, cr]];
      for (const [ns, nr] of nb) {
        const k = ns + ':' + nr; if (seen.has(k)) continue;
        const b = g[ns][nr]; if (!b || !matches(b, color)) continue;
        seen.add(k); stack.push([ns, nr]);
      }
    }
    // a group needs at least one real shard unless it is all prisms
    if (out.length > best.length) best = out;
  }
  return best;
}

// Remove cells, crack touching stones, compact, schedule chain checks. Returns removed info.
function removeCells(st, cells, gen, why) {
  const g = st.grid, n = st.sides, kill = new Set();
  for (const [s, r] of cells) kill.add(s + ':' + r);
  if (why !== 'flare') for (const [s, r] of cells) {
    for (const [ns, nr] of [[s, r - 1], [s, r + 1], [(s + 1) % n, r], [(s - 1 + n) % n, r]]) {
      const b = g[ns] && g[ns][nr]; if (b && b.kind === 'stone') kill.add(ns + ':' + nr);
    }
  }
  const removed = [], minRow = new Array(n).fill(Infinity);
  for (const k of kill) { const [s, r] = k.split(':').map(Number); const b = g[s][r]; removed.push({ s, r, c: b.c, kind: b.kind, id: b.id }); if (r < minRow[s]) minRow[s] = r; }
  const moved = [];
  for (let s = 0; s < n; s++) {
    if (minRow[s] === Infinity) continue;
    g[s] = g[s].filter((b, r) => !kill.has(s + ':' + r));
    for (let r = minRow[s]; r < g[s].length; r++) moved.push(g[s][r].id);
  }
  if (moved.length) st.pending.push({ at: st.t + CONFIG.cascadeDelay, ids: moved, gen: gen + 1 });
  return removed;
}

function scoreClear(st, removed, gen) {
  const size = removed.length;
  st.comboT > 0 ? st.combo++ : (st.combo = 1);
  st.comboT = comboWindow(st);
  const base = size * 10 + Math.max(0, size - 3) * 25;
  const mult = (1 + 0.5 * (st.combo - 1)) * gen;
  const clutch = removed.some(c => c.r >= CONFIG.maxRows - 2);
  const pts = Math.round(base * mult) + (clutch ? 100 * gen : 0);
  st.score += pts; if (clutch) st.stats.clutches = (st.stats.clutches || 0) + 1;
  st.ringCleared += size; st.stats.cleared += size;
  st.stats.bestChain = Math.max(st.stats.bestChain, gen);
  st.stats.bestCombo = Math.max(st.stats.bestCombo, st.combo);
  st.stats.biggest = Math.max(st.stats.biggest, size);
  const wasReady = st.flare >= 1;
  st.flare = Math.min(1, st.flare + size / CONFIG.flareCharge);
  if (st.flare >= 1 && !wasReady) { const first = !st.flareUnlocked; st.flareUnlocked = true; st.events.push({ type: 'flareReady', first }); }
  st.events.push({ type: 'clear', cells: removed, pts, combo: st.combo, chain: gen, size, clutch });
  checkRingUp(st);
}

function checkRingUp(st) {
  const r = ring(st);
  if (st.ringCleared < r.quota || st.ringIdx >= DATA.rings.length - 1) return;
  // shatter everything for a bonus, then reshape the wheel
  let shattered = [];
  for (let s = 0; s < st.sides; s++) for (let i = 0; i < st.grid[s].length; i++) shattered.push({ s, r: i, c: st.grid[s][i].c, kind: st.grid[s][i].kind });
  const bonus = (shattered.length * 15 + 250) * (st.ringIdx + 1);
  st.score += bonus;
  const oldSides = st.sides;
  st.ringIdx++; st.ringCleared = 0;
  st.sides = ring(st).sides; st.rot = 0;
  st.grid = []; for (let i = 0; i < st.sides; i++) st.grid.push([]);
  const fallingOut = st.falling.map(f => ({ lane: f.lane, d: f.d, c: f.c, kind: f.kind }));
  st.falling = []; st.queue = []; st.pending = [];
  st.diff = Math.max(CONFIG.diffStart, st.diff * CONFIG.ringBreather);
  st.ringUpT = CONFIG.ringUpPause; st.nextWaveAt = st.t + CONFIG.ringUpPause + 0.3;
  st.events.push({ type: 'ringup', ring: st.ringIdx, bonus, shattered, oldSides, fallingOut });
}

// ---------- Actions ----------
function rotate(st, dir) {
  if (st.over || st.ringUpT > 0.6) return false;
  st.rot = ((st.rot + dir) % st.sides + st.sides) % st.sides;
  st.stats.turns++;
  st.events.push({ type: 'rot', dir });
  return true;
}
function flare(st) {
  if (st.over || st.flare < 1) return false;
  const cells = [];
  for (let s = 0; s < st.sides; s++) if (st.grid[s].length) cells.push([s, 0]);
  st.flare = 0; st.stats.flares++;
  for (const f of st.falling) f.d = Math.min(CONFIG.spawnDist, f.d + CONFIG.flarePush);
  const removed = cells.length ? removeCells(st, cells, 1, 'flare') : [];
  const pts = removed.length * 20; st.score += pts;
  st.ringCleared += removed.length; st.stats.cleared += removed.length;
  st.events.push({ type: 'flare', cells: removed, pts });
  checkRingUp(st);
  return true;
}

// ---------- Step ----------
function step(st, dt) {
  if (st.over) return st;
  st.t += dt;
  if (st.ringUpT > 0) { st.ringUpT = Math.max(0, st.ringUpT - dt); }
  else st.diff = Math.min(CONFIG.diffCap, st.diff + dt * CONFIG.diffRate / (1 + CONFIG.diffDamp * st.diff));
  if (st.comboT > 0) { st.comboT -= dt; if (st.comboT <= 0) { st.comboT = 0; if (st.combo > 1) st.events.push({ type: 'comboEnd', combo: st.combo }); st.combo = 0; } }

  if (st.ringUpT <= 0 && st.t >= st.nextWaveAt) queueWave(st);
  for (let i = st.queue.length - 1; i >= 0; i--) {
    const q = st.queue[i];
    if (q.at <= st.t) { st.queue.splice(i, 1); st.falling.push({ id: st.nextId++, lane: q.lane, c: q.c, kind: q.kind, d: CONFIG.spawnDist }); st.events.push({ type: 'spawn', lane: q.lane }); }
  }

  // move falling shards; land when they reach their side's stack
  const v = speed(st) * dt;
  for (let i = 0; i < st.falling.length; i++) {
    const f = st.falling[i];
    f.d -= v;
    const s = sideForLane(st, f.lane);
    if (f.d <= landDist(st, s)) {
      st.falling.splice(i--, 1);
      const row = st.grid[s].length;
      if (row >= CONFIG.maxRows) { gameOver(st, s, f); return st; }
      const b = { id: f.id, c: f.c, kind: f.kind };
      st.grid[s].push(b); st.stats.landed++;
      st.events.push({ type: 'land', s, r: row, id: b.id, c: b.c, kind: b.kind, danger: row >= CONFIG.maxRows - 2 });
      const grp = groupFrom(st, s, row);
      if (grp.length >= CONFIG.matchMin) scoreClear(st, removeCells(st, grp, 1, 'match'), 1);
      if (st.ringUpT > 0) return st;
    }
  }

  // chain checks after clears
  for (let i = 0; i < st.pending.length; i++) {

      ctx.globalAlpha = 1; ctx.restore();
    }
    // falling shards with trails
    for (const f of st.falling) {
      const a = this.laneAngle(f.lane, n);
      this.drawBlock(n, a, f.d + CONFIG.rowH * 0.55, f, f.lane, 0.22, 1.4, lim);
      this.drawBlock(n, a, f.d, f, f.lane, 1, 1, lim);
    }
    // shockwaves
    for (let i = this.waves.length - 1; i >= 0; i--) {
      const w = this.waves[i]; w.life += dt; if (w.life > w.max) { this.waves.splice(i, 1); continue; }
      const q = w.life / w.max; ctx.globalAlpha = 1 - q; ctx.strokeStyle = w.c; ctx.lineWidth = 6 * (1 - q) + 1;
      ctx.beginPath(); ctx.arc(this.cx, this.cy, (w.r0 + (w.r1 - w.r0) * (1 - Math.pow(1 - q, 3))) * u, 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // particles
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i]; p.life += dt; if (p.life > p.max) { this.parts.splice(i, 1); continue; }
      p.vx *= Math.pow(0.08, dt); p.vy *= Math.pow(0.08, dt); p.x += p.vx * dt; p.y += p.vy * dt; p.spin += dt * 8;
      ctx.globalAlpha = 1 - p.life / p.max; ctx.fillStyle = p.c;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.spin); ctx.fillRect(-p.sz / 2, -p.sz / 2, p.sz, p.sz * 1.6); ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // off-screen shard chevrons at the edge
    for (const f of st.falling) {
      const a = this.laneAngle(f.lane, n), [x, y] = this.polar(f.d, a);
      if (x > 6 && x < W - 6 && y > 70 && y < H - 6) continue;
      const ex = Math.max(10, Math.min(W - 10, x)), ey = Math.max(80, Math.min(H - 130, y));
      ctx.save(); ctx.translate(ex, ey); ctx.rotate(a); ctx.fillStyle = this.colorOf(f, f.lane); ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-6, -7); ctx.lineTo(-2, 0); ctx.lineTo(-6, 7); ctx.closePath(); ctx.fill(); ctx.restore();
    }
    ctx.globalAlpha = 1;

    // floating texts
    for (let i = this.texts.length - 1; i >= 0; i--) {
      const t = this.texts[i]; t.life += dt; if (t.life > t.max) { this.texts.splice(i, 1); continue; }
      const q = t.life / t.max, s = q < 0.15 ? 0.6 + q / 0.15 * 0.55 : 1.15 - Math.min(0.15, (q - 0.15));
      ctx.globalAlpha = q > 0.7 ? (1 - q) / 0.3 : 1;
      ctx.font = '900 ' + Math.round(t.size * s) + 'px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(8,8,24,.8)'; ctx.strokeText(t.s, t.x, t.y - q * 34); ctx.fillStyle = t.c; ctx.fillText(t.s, t.x, t.y - q * 34);
    }
    ctx.globalAlpha = 1;

    this.hud(st, dt);
    if (this.banner) {
      const b = this.banner; b.life += dt; if (b.life > b.max) this.banner = null; else {
        const q = b.life / b.max, a = q < 0.12 ? q / 0.12 : q > 0.75 ? (1 - q) / 0.25 : 1;
        ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = '900 ' + Math.round(Math.min(40, W * 0.1)) + 'px system-ui,sans-serif'; ctx.fillStyle = '#fff'; ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(10,8,30,.85)';
        const y = this.cy - (lim + 0.2) * u * 0.62 - 10;
        ctx.strokeText(b.a, W / 2, y); ctx.fillText(b.a, W / 2, y);
        ctx.font = '700 ' + Math.round(Math.min(18, W * 0.046)) + 'px system-ui,sans-serif'; ctx.fillStyle = '#ffd27a'; ctx.strokeText(b.b, W / 2, y + 34); ctx.fillText(b.b, W / 2, y + 34);
        ctx.globalAlpha = 1;
      }
    }
    if (this.flash > 0) { ctx.globalAlpha = Math.min(0.6, this.flash); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  },
  hud(st, dt) {
    const W = this.W;
    this.shownScore += (st.score - this.shownScore) * Math.min(1, dt * 10); if (Math.abs(st.score - this.shownScore) < 1) this.shownScore = st.score;
    ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    ctx.fillStyle = '#9aa0c8'; ctx.font = '700 11px system-ui,sans-serif'; ctx.fillText('SCORE', 16, 26);
    if (st.score > (this._lastScore || 0)) this.scorePop = 1; this._lastScore = st.score; this.scorePop = Math.max(0, (this.scorePop || 0) - dt * 4);
    ctx.fillStyle = this.scorePop > 0.2 ? '#fff6d8' : '#fff'; ctx.font = '900 ' + Math.round(28 * (1 + this.scorePop * 0.18)) + 'px system-ui,sans-serif'; ctx.fillText(Math.round(this.shownScore).toLocaleString(), 16, 54);
    // ring progress, centered under the score row
    const ring = P.ring(st), bw = Math.min(150, W * 0.36), bx = W / 2 - bw / 2 + (W < 420 ? 18 : 0), by = 66;
    ctx.textAlign = 'center'; ctx.fillStyle = '#c9ceff'; ctx.font = '800 12px system-ui,sans-serif';
    const label = ring.quota === Infinity ? ring.name + ' · ' + ring.title : ring.name + ' · ' + Math.min(st.ringCleared, ring.quota) + '/' + ring.quota;
    ctx.fillText(label, bx + bw / 2, by - 6);
    ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.fillRect(bx, by, bw, 5);
    const fr = ring.quota === Infinity ? 1 : Math.min(1, st.ringCleared / ring.quota);
    const gr = ctx.createLinearGradient(bx, 0, bx + bw, 0); gr.addColorStop(0, '#ff5d73'); gr.addColorStop(0.5, '#ffc23d'); gr.addColorStop(1, '#3ee6a6');
    ctx.fillStyle = gr; ctx.fillRect(bx, by, bw * fr, 5);
    ctx.textAlign = 'left'; ctx.fillStyle = '#9aa0c8'; ctx.font = '700 11px system-ui,sans-serif';
    ctx.fillText((st.mode === 'daily' ? 'TODAY ' : 'BEST ') + Math.max(Game.bestFor(st.mode), st.score).toLocaleString(), 16, 74);
  },
};

// ---------------- Game glue ----------------
const Game = {
  st: null, playing: false, paused: false, acc: 0, freeze: 0, last: 0, lastSave: 0, overShownAt: 0,
  bestFor(mode) { return mode === 'daily' ? (Store.data.daily.date === today() ? Store.data.daily.best : 0) : Store.data.best; },
  start(mode) {
    const seed = mode === 'daily' ? P.hashStr('prismwheel-' + today()) : (Math.random() * 4294967295) >>> 0;
    this.st = P.newState({ mode, seed });
    this.begin();
    Store.data.plays++; Store.data.save = null; Store.write();
    if (Store.data.plays <= 2) setTimeout(() => toast('Tap the left or right side to turn the wheel'), 400);
  },
  resume() {
    try { this.st = P.load(Store.data.save); } catch (e) { Store.data.save = null; Store.write(); return this.start('classic'); }
    this.begin(); this.pause(true);
  },
  begin() {
    R.rotVis = R.rotTarget = this.st.rot; R.vrow.clear(); R.pop.clear(); R.parts = []; R.texts = []; R.waves = []; R.overSide = -1; R.banner = null; R.shownScore = this.st.score;
    this.playing = true; this.paused = false; this.acc = 0; this.freeze = 0;
    show('title', false); show('over', false); show('pause', false);
    updateFlareBtn();
    Audio.init(); Audio.key = [0, 2, 4, 5][this.st.ringIdx]; Audio.startMusic();
    R.banner = { a: P.ring(this.st).name, b: P.ring(this.st).title, life: 0, max: 1.6 };
  },
  save() { if (this.st && !this.st.over && this.playing) { Store.data.save = P.serialize(this.st); Store.write(); } },
  pause(on) {
    if (!this.playing || !this.st || this.st.over) return;
    this.paused = on; show('pause', on);
    if (on) { $('pinfo').textContent = P.ring(this.st).name + ' · ' + this.st.score.toLocaleString() + ' points'; Audio.stopMusic(); this.save(); }
    else { Audio.init(); Audio.startMusic(); this.last = performance.now(); }
  },
  act(a) {
    if (!this.playing || this.paused || !this.st || this.st.over) return;
    Audio.init();
    if (a === 'flare') { if (!P.flare(this.st)) { if (this.st.flareUnlocked) toast('Flare is still charging'); } }
    else P.rotate(this.st, a);
    this.drain();
  },
  drain() {
    const st = this.st, n = st.sides;
    for (const e of st.events) {
      if (e.type === 'rot') { R.rotTarget += e.dir; Audio.rot(e.dir); }
      else if (e.type === 'land') {
        R.vrow.set(e.id, e.r); R.pop.set(e.id, 0); R.addShake(1.5 + e.r * 0.25); Audio.land(e.r, e.danger);
        if (performance.now() - this.lastSave > 1500) { this.lastSave = performance.now(); this.save(); }
      }
      else if (e.type === 'clear') {
        let mx = 0, my = 0;
        for (const c of e.cells) { const [x, y] = R.cellPos(c.s, c.r, n); mx += x; my += y; R.burst(x, y, c.kind === 'shard' ? DATA.colors[c.c].hex : c.kind === 'stone' ? '#8a8fb0' : '#ffffff', 9, 1); R.vrow.delete(c.id); }
        mx /= e.cells.length; my /= e.cells.length;
        const lead = e.cells.find(c => c.kind === 'shard'); if (lead) R.lastClearColor = lead.c;
        R.text(mx, my, '+' + e.pts, '#fff', 18 + Math.min(14, e.size * 2));
        if (e.chain >= 2) R.text(mx, my - 26, 'CHAIN ' + e.chain + '!', '#ffd27a', 22, 1.1);
        else if (e.combo === 5) R.text(R.cx, R.cy - R.u * 0.95, 'OVERDRIVE', '#9ff0ff', 26, 1.1);
        else if (e.combo >= 3) R.text(mx, my - 24, 'COMBO ' + e.combo, '#9ff0ff', 16, 0.9);
        if (e.clutch) R.text(R.cx, R.cy + R.u * 0.95, 'CLUTCH SAVE!', '#ff8aa0', 26, 1.2);
        if (e.size >= 5) R.text(R.cx, R.cy - R.u * 0.95, e.size >= 7 ? 'PRISMATIC!' : 'BIG SHATTER', '#ffc23d', 26, 1.1);
        R.addShake(3 + e.size * 0.8 + e.chain * 2); R.punch = Math.min(1.5, R.punch + 0.6 + e.chain * 0.3); R.beat = 1;
        R.waves.push({ r0: CONFIG.coreR, r1: CONFIG.coreR + CONFIG.maxRows * CONFIG.rowH, life: 0, max: 0.35, c: lead ? DATA.colors[lead.c].hex : '#fff' });
        Audio.clear(e.combo, e.chain, e.size);
        if (e.size >= 5 || e.chain >= 2) this.freeze = reduceMotion ? 0 : 0.07;
        vibe(e.chain >= 2 ? 30 : 12);
      }
      else if (e.type === 'flare') {
        for (const c of e.cells) { const [x, y] = R.cellPos(c.s, c.r, n); R.burst(x, y, '#ffe2a0', 14, 1.4); R.vrow.delete(c.id); }
        R.waves.push({ r0: CONFIG.coreR, r1: 1.6, life: 0, max: 0.6, c: '#ffd27a' }, { r0: CONFIG.coreR, r1: 1.1, life: 0, max: 0.45, c: '#ffffff' });
        R.addShake(12); R.flash = 0.35; R.punch = 1.5; R.text(R.cx, R.cy - R.u * 0.95, 'FLARE +' + e.pts, '#ffd27a', 26, 1);
        Audio.flare(); vibe(40); updateFlareBtn();
      }
      else if (e.type === 'flareReady') {
        updateFlareBtn(); Audio.ready();
        if (e.first && !Store.data.seenFlare) { Store.data.seenFlare = true; Store.write(); toast('FLARE ready! Tap the core or the Flare button (Space) to wipe every bottom row'); }
      }
      else if (e.type === 'ringup') {
        for (const c of e.shattered) { const d = CONFIG.coreR + (c.r + 0.5) * CONFIG.rowH; const [x, y] = R.polar(d, R.sideAngle(c.s, e.oldSides, R.rotVis)); R.burst(x, y, c.kind === 'shard' ? DATA.colors[c.c].hex : '#ffffff', 6, 1.6); }
        for (const f of e.fallingOut) { const [x, y] = R.polar(f.d, R.laneAngle(f.lane, e.oldSides)); R.burst(x, y, '#ffffff', 6, 1); }
        R.rotVis = R.rotTarget = 0; R.vrow.clear();
        R.flash = 0.8; R.addShake(14); R.punch = 2;
        R.waves.push({ r0: 0.1, r1: 2.2, life: 0, max: 0.9, c: '#ffffff' });
        const ring = DATA.rings[e.ring];
        R.banner = { a: ring.name, b: ring.title + '  ·  +' + e.bonus.toLocaleString(), life: 0, max: 2.4 };
        Audio.key = [0, 2, 4, 5][e.ring]; Audio.ringup(); vibe([30, 40, 60]);
        if (e.ring === 1) setTimeout(() => toast('Seven faces now. Prisms (stars) match any color.'), 1300);
        if (e.ring === 2) setTimeout(() => toast('Eight faces. Gray stones crack when a match touches them.'), 1300);
        this.save();
      }
      else if (e.type === 'over') this.over(e);
    }
    st.events.length = 0;
  },
  over(e) {
    const st = this.st;
    R.overSide = e.s; R.addShake(16); R.flash = 0.3; Audio.over(); Audio.stopMusic(); vibe([60, 50, 120]);
    for (let r = 0; r < st.grid[e.s].length; r++) { const [x, y] = R.cellPos(e.s, r, st.sides); R.burst(x, y, '#ff4466', 5, 0.8); }
    const sum = st.summary, mode = st.mode;
    let isNew = false;
    if (mode === 'daily') { if (Store.data.daily.date !== today()) Store.data.daily = { date: today(), best: 0 }; if (sum.score > Store.data.daily.best) { Store.data.daily.best = sum.score; isNew = sum.score > 0; } }
    else if (sum.score > Store.data.best) { Store.data.best = sum.score; isNew = sum.score > 0; }
    Store.data.save = null; Store.write();
    $('oscore').textContent = sum.score.toLocaleString();
    $('onew').hidden = !isNew;
    $('obest').textContent = (mode === 'daily' ? 'Today’s best ' : 'Best ') + this.bestFor(mode).toLocaleString();
    $('oring').textContent = DATA.rings[sum.ring].name.replace('Ring ', '');
    $('ocl').textContent = sum.cleared; $('ocombo').textContent = 'x' + sum.bestCombo; $('ochain').textContent = sum.bestChain;
    $('otip').textContent = P.tipFor(sum);
    $('owhy').textContent = mode === 'daily' ? 'DAILY SPIN · A FACE BROKE' : 'A FACE BROKE';
    setTimeout(() => { if (this.st === st) { show('over', true); this.overShownAt = performance.now(); } }, 1100);
  },
  toMenu() { this.save(); this.playing = false; this.paused = false; Audio.stopMusic(); show('pause', false); show('over', false); refreshTitle(); show('title', true); },
  loop(now) {
    const dt = Math.min(0.05, Math.max(0, (now - (this.last || now)) / 1000)); this.last = now;
    if (this.playing && !this.paused && this.st && !this.st.over) {
      if (this.freeze > 0) this.freeze -= dt;
      else { this.acc += dt; let guard = 0; while (this.acc >= CONFIG.step && guard++ < 12) { P.step(this.st, CONFIG.step); this.acc -= CONFIG.step; if (this.st.events.length) this.drain(); if (this.freeze > 0 || this.st.over) { this.acc = 0; break; } } }
      updateFlareBtn();
    } else if (!this.playing) R.rotTarget += dt * 0.12;
    R.frame(dt);
    requestAnimationFrame(t => this.loop(t));
  },
};

// ---------------- UI helpers ----------------
function show(id, on) { $(id).hidden = !on; }
let toastT = 0;
function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 3600); }
function vibe(p) { try { if (navigator.vibrate && !reduceMotion) navigator.vibrate(p); } catch (e) { /* ignore */ } }
let lastFlareKey = '';
function updateFlareBtn() {
  const st = Game.st, b = $('bf'); if (!st) return;
  const key = (st.flareUnlocked ? 1 : 0) + ':' + Math.round(st.flare * 40) + ':' + (st.flare >= 1);
  if (key === lastFlareKey) return; lastFlareKey = key;
  b.classList.toggle('locked', !st.flareUnlocked);
  b.classList.toggle('ready', st.flare >= 1);
  b.style.setProperty('--f', Math.round(st.flare * 100) + '%');
}
function refreshTitle() {
  $('tbest').textContent = 'Best ' + Store.data.best.toLocaleString();
  $('tdaily').textContent = 'Today ' + Game.bestFor('daily').toLocaleString();
  $('bresume').hidden = !Store.data.save;
}

// ---------------- Input ----------------
function press(el, fn) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); el.classList.add('on'); fn(); setTimeout(() => el.classList.remove('on'), 110); });
  el.addEventListener('click', e => e.preventDefault());
}
press($('bl'), () => Game.act(-1));
press($('br'), () => Game.act(1));
press($('bf'), () => Game.act('flare'));
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!Game.playing || Game.paused) return;
  const dx = e.clientX - R.cx, dy = e.clientY - R.cy;
  if (Math.hypot(dx, dy) < CONFIG.coreR * R.u * 1.6 && Game.st && Game.st.flare >= 1) return Game.act('flare');
  Game.act(e.clientX < R.W / 2 ? -1 : 1);
});
let lastKey = 0;
window.addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', ' ', 'a', 'd', 'w', 'A', 'D', 'W'].includes(k)) e.preventDefault();
  if (k === 'Escape' || k === 'p' || k === 'P') { if (Game.playing && !Game.st.over) Game.pause(!Game.paused); return; }
  if (!$('title').hidden && (k === 'Enter' || k === ' ')) { Game.start('classic'); return; }
  if (!$('over').hidden && (k === 'Enter' || k === ' ' || k === 'r' || k === 'R')) { if (performance.now() - Game.overShownAt > 400) Game.start(Game.st.mode); return; }
  if (!$('pause').hidden && (k === 'Enter' || k === ' ')) { Game.pause(false); return; }
  const now = performance.now(); if (e.repeat && now - lastKey < 75) return; lastKey = now;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') Game.act(-1);
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') Game.act(1);
  else if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') Game.act('flare');
});
$('bplay').addEventListener('click', () => Game.start('classic'));
$('bdaily').addEventListener('click', () => Game.start('daily'));
$('bresume').addEventListener('click', () => Game.resume());
$('bretry').addEventListener('click', () => Game.start(Game.st ? Game.st.mode : 'classic'));
$('bmenu').addEventListener('click', () => Game.toMenu());
$('bunpause').addEventListener('click', () => Game.pause(false));
$('bquit').addEventListener('click', () => Game.toMenu());
$('bpause').addEventListener('click', () => { if (Game.playing && Game.st && !Game.st.over) Game.pause(!Game.paused); });
$('bmute').addEventListener('click', () => { Store.data.muted = !Store.data.muted; Store.write(); Audio.init(); Audio.setMuted(Store.data.muted); $('bmute').style.opacity = Store.data.muted ? 0.4 : 1; });
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (Game.playing && !Game.paused) Game.pause(true); Game.save(); } });
window.addEventListener('pagehide', () => Game.save());
window.addEventListener('blur', () => { if (Game.playing && !Game.paused && Game.st && !Game.st.over) Game.pause(true); });
window.addEventListener('resize', () => R.resize());

// ---------------- Boot ----------------
Store.load(); R.resize(); refreshTitle();
$('bmute').style.opacity = Store.data.muted ? 0.4 : 1;
// demo wheel behind the title
Game.st = P.newState({ seed: 7 });
for (const [s, cs] of [[0, [0, 1]], [1, [2]], [2, [1, 3, 3]], [3, [0]], [4, [3, 2]], [5, [1]]]) for (const c of cs) Game.st.grid[s].push({ id: Game.st.nextId++, c, kind: 'shard' });
// keep an open run alive across a republish in the viewer
try { const hot = window.claude && window.claude.hot; if (hot) { if (hot.snapshot) hot.snapshot(() => ({ save: Game.st && Game.playing && !Game.st.over ? P.serialize(Game.st) : null })); const d = hot.data; if (d && d.save) { Store.data.save = d.save; refreshTitle(); } } } catch (e) { /* viewer hook absent */ }
requestAnimationFrame(t => { Game.last = t; Game.loop(t); });
window.__prism = { Game, R, Store, Audio };
})();
</script>
