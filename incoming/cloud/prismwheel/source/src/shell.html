<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070818">
<title>Prismwheel</title>
<style>
:root{color-scheme:dark;--bg:#070818;--ink:#eef0ff;--dim:#9aa0c8;--card:rgba(18,20,48,.86);--line:rgba(160,170,255,.18);--coral:#ff5d73;--amber:#ffc23d;--mint:#3ee6a6;--sky:#4cc3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.ctl{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));height:84px;width:min(calc(50% - 64px),240px);border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--ink);border-radius:22px;font-size:34px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:pointer}
.ctl:active,.ctl.on{background:rgba(255,255,255,.14)}
#bl{left:12px}#br{right:12px}
#bf{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;border:none;color:#fff;font-weight:800;font-size:calc(max(12px,12px) * min(var(--gk-text-scale,1),1.25));letter-spacing:.08em;touch-action:none;cursor:pointer;
 background:conic-gradient(#fff var(--f,0%),rgba(255,255,255,.08) 0);padding:5px}
#bf span{display:flex;width:100%;height:100%;border-radius:50%;background:#14163a;align-items:center;justify-content:center;flex-direction:column;line-height:1.1}
#bf.ready span{background:radial-gradient(circle,#ffffff 0,#ffd27a 30%,#ff5d73 75%);color:#2a0b18;animation:pulse .9s ease-in-out infinite}
#bf.locked{opacity:0;pointer-events:none}
@keyframes pulse{50%{filter:brightness(1.25)}}
#topbtns{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;display:flex;gap:8px}
#topbtns button{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font-size:18px;cursor:pointer}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,6,18,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:5}
.ov[hidden]{display:none}
.card{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:26px;padding:24px 20px 20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo{font-size:40px;font-weight:900;letter-spacing:.04em;margin:2px 0 4px;background:linear-gradient(90deg,var(--coral),var(--amber),var(--mint),var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--dim);margin:0 0 16px;font-size:calc(max(12px,15px) * var(--gk-text-scale,1))}
.how{text-align:left;margin:0 auto 18px;padding:0;list-style:none;font-size:calc(max(12px,15px) * var(--gk-text-scale,1));line-height:1.35;max-width:300px}
.how li{display:flex;gap:10px;align-items:center;margin:8px 0}
.how b{display:inline-flex;min-width:46px;justify-content:center;font-size:calc(max(12px,13px) * min(var(--gk-text-scale,1),1.25));padding:5px 6px;border-radius:9px;background:rgba(255,255,255,.08)}
.btn{display:block;width:100%;height:54px;border-radius:16px;border:none;font-size:calc(max(12px,18px) * var(--gk-text-scale,1));font-weight:800;margin:8px 0;cursor:pointer;color:#1a0b1f;background:linear-gradient(90deg,#ffd27a,#ff8aa0)}
.btn.alt{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line)}
.btn[hidden]{display:none}
.row{display:flex;gap:10px;justify-content:center;color:var(--dim);font-size:calc(max(12px,14px) * var(--gk-text-scale,1));margin-top:10px}
.big{font-size:52px;font-weight:900;margin:4px 0}
.nb{display:inline-block;margin:0 0 8px;padding:4px 12px;border-radius:999px;background:linear-gradient(90deg,var(--amber),var(--coral));color:#2a0b18;font-weight:800;font-size:calc(max(12px,13px) * var(--gk-text-scale,1))}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;font-size:calc(max(12px,14px) * var(--gk-text-scale,1))}
.stats div{background:rgba(255,255,255,.05);border-radius:12px;padding:8px}
.stats b{display:block;font-size:calc(max(12px,20px) * var(--gk-text-scale,1))}
.tip{color:#d6dbff;font-size:calc(max(12px,14px) * var(--gk-text-scale,1));line-height:1.4;background:rgba(76,195,255,.1);border:1px solid rgba(76,195,255,.25);border-radius:14px;padding:10px 12px;margin:8px 0 6px;text-align:left}
#toast{position:fixed;left:50%;top:calc(90px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(18,20,48,.92);border:1px solid var(--line);border-radius:14px;padding:9px 14px;font-size:calc(max(12px,14px) * var(--gk-text-scale,1));max-width:calc(100% - 32px);text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;z-index:4}
#toast.show{opacity:1}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button class="ctl" id="bl" aria-label="Turn left">&#9664;</button>
<button class="ctl" id="br" aria-label="Turn right">&#9654;</button>
<button id="bf" class="locked" aria-label="Flare"><span>FLARE</span></button>
<div id="topbtns"><button id="bmute" aria-label="Sound">&#9834;</button><button id="bpause" aria-label="Pause">&#10074;&#10074;</button></div>
<div id="toast"></div>

<div class="ov" id="title"><div class="card">
  <div class="logo">PRISMWHEEL</div>
  <p class="tag">Spin the wheel, not the shards.</p>
  <ul class="how">
    <li><b>&#9664; &#9654;</b> Turn the wheel to catch falling shards</li>
    <li><b>3+</b> Touch 3 of a color to shatter them</li>
    <li><b>- - -</b> A face that passes the dashed ring breaks</li>
  </ul>
  <button class="btn" id="bresume" hidden>Resume run</button>
  <button class="btn" id="bplay">Play</button>
  <button class="btn alt" id="bdaily">Daily Spin</button>
  <div id="pywT"></div>
  <div class="row"><span id="tbest">Best 0</span><span>&middot;</span><span id="tdaily">Today 0</span></div>
</div></div>

<div class="ov" id="pause" hidden><div class="card">
  <div class="logo" style="font-size:30px">PAUSED</div>
  <p class="tag" id="pinfo"></p>
  <button class="btn" id="bunpause">Resume</button>
  <div id="pywP"></div>
  <button class="btn alt" id="bquit">Quit to menu</button>
</div></div>

<div class="ov" id="over" hidden><div class="card">
  <div class="tag" id="owhy" style="margin:0;letter-spacing:.12em;font-weight:700">A FACE BROKE</div>
  <div class="nb" id="onew" hidden>NEW BEST</div>
  <div class="big" id="oscore">0</div>
  <div class="row" style="margin:0"><span id="obest">Best 0</span></div>
  <div class="stats">
    <div>Ring<b id="oring">I</b></div><div>Shards<b id="ocl">0</b></div>
    <div>Best combo<b id="ocombo">0</b></div><div>Best chain<b id="ochain">0</b></div>
  </div>
  <div class="tip" id="otip"></div>
  <button class="btn" id="bretry">Spin again</button>
  <button class="btn alt" id="bmenu">Menu</button>
</div></div>
