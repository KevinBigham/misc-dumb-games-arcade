<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7a3b1f">
<title>Sunwire</title>
<meta name="color-scheme" content="light">
<style>
:root{--sand:#f2dcb0;--ink:#3b2416;--clay:#c4552d;--ochre:#e0a33a;--sage:#6f8f5c;--cream:#fff6e2;--panel:#fff3dc;--line:#d9b98a;--good:#2f7a35;--bad:#b23a26;--hud:#7a3b1f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#d9a868;color:var(--ink);font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:600px;margin:0 auto;background:var(--sand)}
#hud{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;background:var(--hud);color:var(--cream)}
#cashBox{flex:1;min-width:0;line-height:1.05}
#cash{font-weight:800;font-size:22px;white-space:nowrap}
#cash.neg{color:#ffb4a0}
#pm{font-size:12px;font-weight:700;white-space:nowrap;opacity:.95}
#pm.up{color:#c9f0b0}#pm.down{color:#ffb4a0}
#date{font-size:12px;text-align:right;line-height:1.15;white-space:nowrap;margin-right:2px}
.hb{min-width:42px;height:42px;border:0;border-radius:11px;background:#9b5230;color:var(--cream);font:800 15px system-ui,sans-serif;touch-action:manipulation;cursor:pointer}
.hb:active{transform:scale(.94)}
.hb:focus-visible,.sb:focus-visible,.mb:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
#goal{padding:5px 10px 7px;background:#f7e5c0;border-bottom:2px solid var(--line);font-size:13px}
#goalTop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
#goalName{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#goalProg{white-space:nowrap;font-weight:700}
#bar{height:8px;background:#e7cfa3;border-radius:5px;margin-top:4px;overflow:hidden}
#barFill{height:100%;width:0;background:linear-gradient(90deg,var(--clay),var(--ochre));transition:width .35s}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}
#hint{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(59,36,22,.9);color:var(--cream);padding:9px 12px;border-radius:12px;font-size:14px;pointer-events:none;transition:opacity .3s,transform .3s;opacity:0;transform:translateY(8px)}
#hint.show{opacity:1;transform:none}
#toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-20px);background:var(--cream);border:2px solid var(--clay);color:var(--ink);padding:8px 14px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transition:all .3s;pointer-events:none;max-width:92%;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{border-color:var(--bad);color:var(--bad)}
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top:3px solid var(--clay);border-radius:16px 16px 0 0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));max-height:64%;overflow:auto;transform:translateY(110%);transition:transform .2s;box-shadow:0 -6px 20px rgba(0,0,0,.2);z-index:5}
#sheet.open{transform:none}
#sheet h3{margin:0 34px 4px 0;font-size:17px}
#sheet .sub{font-size:13px;opacity:.85;margin-bottom:6px}
#sheet .x{position:absolute;right:8px;top:6px;width:36px;height:36px;border:0;background:transparent;font-size:22px;color:var(--ink);cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.stat{background:#f7e3bb;border-radius:9px;padding:4px 8px;font-size:13px}
.stat b{font-size:14px}
.why{margin:6px 0;padding:7px 9px;border-radius:9px;font-size:13px;background:#fbecd0;border-left:4px solid var(--ochre)}
.why.good{border-color:var(--good)}.why.bad{border-color:var(--bad)}
.sb{flex:1 1 30%;min-height:46px;border:0;border-radius:12px;background:var(--clay);color:var(--cream);font:800 14px system-ui,sans-serif;padding:6px 8px;touch-action:manipulation;cursor:pointer}
.sb.alt{background:#8a6a4a}.sb.warn{background:var(--bad)}
.sb:disabled{background:#cdb594;color:#7a6650;cursor:default}
.sb small{display:block;font-weight:600;font-size:11px;opacity:.9}
.chip{display:inline-flex;align-items:center;gap:4px;margin:2px 4px 2px 0;font-size:13px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1.5px solid rgba(0,0,0,.35)}
.lnk{display:block;width:100%;text-align:left;background:#f7e3bb;border:0;border-radius:9px;padding:8px 10px;margin:4px 0;font:600 14px system-ui,sans-serif;color:var(--ink);cursor:pointer}
#ov{position:absolute;inset:0;background:rgba(40,22,10,.55);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
#ov.open{display:flex}
#card{background:var(--panel);border-radius:18px;padding:16px;max-width:420px;width:100%;max-height:92%;overflow:auto;border:3px solid var(--clay);box-shadow:0 10px 30px rgba(0,0,0,.3)}
#card h2{margin:0 0 6px;font-size:22px}
#card p{margin:6px 0;font-size:14px}
#card ol{padding-left:20px;margin:6px 0;font-size:14px}
#card li{margin:4px 0}
.mb{display:block;width:100%;min-height:48px;margin:7px 0;border:0;border-radius:12px;background:var(--clay);color:var(--cream);font:800 16px system-ui,sans-serif;cursor:pointer;touch-action:manipulation}
.mb.alt{background:#8a6a4a}
.logo{font-weight:900;font-size:34px;letter-spacing:1px;color:var(--clay);text-shadow:2px 2px 0 #f0c27a}
.small{font-size:12px;opacity:.8}
.stars{font-size:28px;color:var(--ochre);letter-spacing:3px}
</style>
<div id="app">
  <div id="hud">
    <div id="cashBox"><div id="cash">$0</div><div id="pm">String your first line</div></div>
    <div id="date">Year 1<br>Jan</div>
    <button class="hb" id="bSpeed" aria-label="Game speed">1×</button>
    <button class="hb" id="bPause" aria-label="Pause">❚❚</button>
    <button class="hb" id="bMenu" aria-label="Menu">☰</button>
  </div>
  <div id="goal"><div id="goalTop"><span id="goalName">Order 1</span><span id="goalProg">0/0</span></div><div id="bar"><div id="barFill"></div></div></div>
  <div id="stage">
    <canvas id="cv" aria-label="Map of mesas. Drag from one place to another to build a ropeway."></canvas>
    <div id="hint"></div>
    <div id="toast"></div>
    <div id="sheet" role="dialog" aria-live="polite"></div>
    <div id="ov"><div id="card"></div></div>
  </div>
</div>
<script>
'use strict';
(function(){
/* ===================== CONFIG ===================== */
const CONFIG={
  VERSION:1, W:100, H:140, STEP:1/30, MONTH_SEC:8, SPEEDS:[1,2,4],
  START_CASH:1000, CREDIT:1500, STRIKES:3, DEADLINE:60,
  CABLE_BASE:180, CABLE_PER:8, CABLE_UPK:0.6, TRIP_COST:0.3, SPAN:[48,48,48,66,66], SPAN_FREE:66,
  SITE_R:5, CLEAR:2.2, SITE_GAP:15,
  PILE_CAP:90, DWELL:0.9, WAIT_MAX:12, WAIT_FILL:0.8, CAR_GAP:11, MAX_CARS:6, REFUND:0.5,
  DIST_REF:25, DIST_EXP:0.9, GRACE:5, LATE_K:18, TIME_MIN:0.5, OVER_PAY:0.25,
  GROW_UP:1.06, GROW_DOWN:0.98, MUL_CAP:2.5, SERVE_HI:0.6, SERVE_LO:0.25,
  POP_GROW:0.025, POP_DECAY:0.004, POP_CAP:500, POP_TIER_BOOST:1.12, RIDER_RATE:0.12,
  WANT:{P:0.16,J:0.12,T:0.09},
  PROD_JITTER:0.15, HIT_PX:26, CABLE_HIT_PX:18, FREE_GROWTH:1.35
};
/* ===================== DATA ===================== */
const DATA={
  cargo:{
    R:{name:'Riders',one:'rider',rate:9,col:'#fff1cf',edge:'#7a5a3a'},
    P:{name:'Peaches',one:'peach',rate:12,col:'#f39a52',edge:'#a2501d'},
    C:{name:'Clay',one:'clay',rate:6,col:'#9a6a45',edge:'#4a2e1a'},
    J:{name:'Pots',one:'pot',rate:24,col:'#d2492c',edge:'#6e2010'},
    O:{name:'Copper',one:'copper',rate:8,col:'#4fa58f',edge:'#1d5446'},
    T:{name:'Tools',one:'tool',rate:38,col:'#5b7fb3',edge:'#22385c'}
  },
  kinds:{
    town:{label:'Town',prod:'R',acc:['R','P','J','T'],ring:'#c4552d'},
    orchard:{label:'Peach orchard',prod:'P',base:22,acc:[],ring:'#e07b2e'},
    pit:{label:'Clay pit',prod:'C',base:34,acc:[],ring:'#8a5a35'},
    kiln:{label:'Kiln',acc:['C'],conv:{C:['J',1]},ring:'#a8381e'},
    mine:{label:'Copper mine',prod:'O',base:30,acc:[],ring:'#2f8a72'},
    foundry:{label:'Foundry',acc:['O'],conv:{O:['T',0.9]},ring:'#3d5f91'}
  },
  classes:[
    {name:'Basket',cap:6,spd:6,car:120,upk:3,trip:1,up:0,tier:0,col:'#8b5a35'},
    {name:'Coach',cap:12,spd:7,car:200,upk:5,trip:1.3,up:400,tier:1,col:'#3f6f8f'},
    {name:'Hauler',cap:24,spd:6,car:320,upk:8,trip:1.7,up:1000,tier:3,col:'#6a4b8f'},
    {name:'Swift',cap:16,spd:13,car:480,upk:12,trip:2.2,up:2200,tier:4,col:'#2f8a5a'}
  ],
  orders:[
    {name:'First Line',type:'deliver',c:'R',n:40,reward:300,blurb:'Carry riders between two towns.'},
    {name:'Peach Season',type:'deliver',c:'P',n:100,reward:700,blurb:'Peachwood opened. Towns pay well for peaches.'},
    {name:'Fired Earth',type:'deliver',c:'J',n:180,reward:1400,blurb:'Clay to the kiln, then the kiln’s pots to towns.'},
    {name:'Copper Age',type:'deliver',c:'T',n:220,reward:2600,blurb:'Copper to the foundry, then tools to towns.'},
    {name:'Valley Charter',type:'worth',n:60000,reward:0,blurb:'Grow the network to a net worth of $60,000.'}
  ],
  map:[
    {id:0,kind:'town',name:'Ochreton',x:28,y:96,tier:0,pop:85},
    {id:1,kind:'town',name:'Redfern',x:62,y:80,tier:0,pop:75},
    {id:2,kind:'orchard',name:'Peachwood',x:80,y:108,tier:1},
    {id:3,kind:'pit',name:'Umber Pit',x:14,y:60,tier:2},
    {id:4,kind:'kiln',name:'Kilnhollow',x:44,y:55,tier:2},
    {id:5,kind:'town',name:'Juniper Flats',x:22,y:126,tier:2,pop:70},
    {id:6,kind:'mine',name:'Verdigris Mine',x:82,y:28,tier:3},
    {id:7,kind:'foundry',name:'Brightforge',x:54,y:18,tier:3},
    {id:8,kind:'town',name:'Calico Butte',x:84,y:56,tier:3,pop:90},
    {id:9,kind:'town',name:'Saddleback',x:22,y:24,tier:4,pop:80},
    {id:10,kind:'orchard',name:'Sweetrock',x:52,y:122,tier:4}
  ],
  freeBase:{R:260,P:220,J:320,T:300},
  months:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
};

/* ===================== helpers ===================== */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const fmt=n=>{n=Math.round(n);const s=Math.abs(n).toLocaleString('en-US');return (n<0?'-':'')+s;};
const money=n=>(n<0?'-$':'$')+fmt(Math.abs(n));
function rngNext(o){o.rs=(o.rs+0x6D2B79F5)|0;let t=o.rs;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(rngNext(r)*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;let t=l2?((px-ax)*dx+(py-ay)*dy)/l2:0;t=clamp(t,0,1);return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));}
function segInter(p1,p2,p3,p4){const d=(p2.x-p1.x)*(p4.y-p3.y)-(p2.y-p1.y)*(p4.x-p3.x);if(Math.abs(d)<1e-9)return false;
  const ua=((p3.x-p1.x)*(p4.y-p3.y)-(p3.y-p1.y)*(p4.x-p3.x))/d, ub=((p3.x-p1.x)*(p2.y-p1.y)-(p3.y-p1.y)*(p2.x-p1.x))/d;
  return ua>0.001&&ua<0.999&&ub>0.001&&ub<0.999;}
function todayKey(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}

/* ===================== STATE ===================== */
function makeSites(mode,seed){
  const r={rs:seed|0};
  const tpl=DATA.map.map(s=>Object.assign({},s));
  if(mode==='daily'){
    const flip=rngNext(r)<0.5;
    const names=shuffle(tpl.filter(s=>s.kind==='town').map(s=>s.name),r);let k=0;
    for(const s of tpl){ if(s.kind==='town') s.name=names[k++];
      s.x+=(rngNext(r)-0.5)*16; s.y+=(rngNext(r)-0.5)*16; if(flip) s.x=CONFIG.W-s.x;
      if(s.pop) s.pop=Math.round(s.pop*(0.85+rngNext(r)*0.3)); }
    for(let pass=0;pass<4;pass++){ relax(tpl); pullPartners(tpl); }
    relax(tpl);
  }
  return tpl.map(s=>({id:s.id,kind:s.kind,name:s.name,x:+s.x.toFixed(1),y:+s.y.toFixed(1),tier:s.tier,pop:s.pop||0,
    piles:{},mul:1,jit:1,want:{},got:{},lastGot:{},mp:0,mk:0,served:0,lost:0}));
}
function relax(tpl){
  for(let it=0;it<40;it++){
    for(let i=0;i<tpl.length;i++)for(let j=i+1;j<tpl.length;j++){const a=tpl[i],b=tpl[j];const d=dist(a,b)||0.01;
      if(d<CONFIG.SITE_GAP){const push=(CONFIG.SITE_GAP-d)/2,ux=(a.x-b.x)/d,uy=(a.y-b.y)/d;a.x+=ux*push;a.y+=uy*push;b.x-=ux*push;b.y-=uy*push;}}
    for(const s of tpl){s.x=clamp(s.x,9,CONFIG.W-9);s.y=clamp(s.y,10,CONFIG.H-10);}
  }
}
function pullPartners(tpl){
  const order=tpl.slice().sort((a,b)=>a.tier-b.tier);
  for(const s of order){
    if(s.id===0) continue;
    const lim=CONFIG.SPAN[Math.min(s.tier,4)]-5;
    let best=null,bd=1e9;
    for(const p of tpl){ if(p===s||p.tier>s.tier) continue; if(!carries(s,p).length) continue; const d=dist(s,p); if(d<bd){bd=d;best=p;} }
    if(s.id===1) { best=tpl[0]; bd=dist(s,best); }
    const want=s.id===1?38:lim;
    if(best&&bd>want){ const f=(bd-want)/bd; s.x-=(s.x-best.x)*f; s.y-=(s.y-best.y)*f; }
  }
}
function newState(mode,seed){
  mode=mode==='daily'?'daily':'classic'; seed=(seed>>>0)||1;
  const st={v:CONFIG.VERSION,mode,seed,rs:(seed^0x9e3779b9)|0,clock:0,t:0,month:0,cash:CONFIG.START_CASH,tier:0,prog:0,
    started:false,sites:makeSites(mode,seed),cables:[],nid:1,strikes:0,delivered:{},m:{inc:0},last:{inc:0,up:0,profit:0},
    hist:[],won:false,wonMonth:0,over:null,expired:false,free:null,freeN:0,peak:CONFIG.START_CASH,log:[],h:{},ev:[]};
  st.m.trip=0;
  for(const c in DATA.cargo) st.delivered[c]=0;
  for(const s of st.sites) if(isRev(st,s)) stock(st,s);
  for(const s of st.sites) if(s.kind==='town') resetWant(s);
  return st;
}
function stock(st,s){const k=DATA.kinds[s.kind];if(k.prod)s.piles[k.prod]=Math.min(CONFIG.PILE_CAP,Math.round(prodRate(st,s)));}
function resetWant(s){ for(const c in CONFIG.WANT) s.want[c]=s.pop*CONFIG.WANT[c]; }

/* ===================== RULES (no DOM) ===================== */
const Rules={};
const site=(st,id)=>st.sites[id];
const isRev=(st,s)=>s.tier<=st.tier;
function produces(s){const k=DATA.kinds[s.kind],o=[];if(k.prod)o.push(k.prod);if(k.conv)for(const i in k.conv)o.push(k.conv[i][0]);return o;}
function accepts(s,c){return DATA.kinds[s.kind].acc.indexOf(c)>=0;}
function carries(a,b){const o=[];for(const c of produces(a))if(accepts(b,c))o.push([a.id,c]);for(const c of produces(b))if(accepts(a,c))o.push([b.id,c]);return o;}
const span=st=>st.tier<CONFIG.SPAN.length?CONFIG.SPAN[st.tier]:CONFIG.SPAN_FREE;
const cableCost=len=>Math.round(CONFIG.CABLE_BASE+CONFIG.CABLE_PER*len)+DATA.classes[0].car;
const maxCars=cb=>Math.min(CONFIG.MAX_CARS,1+Math.floor(cb.len/CONFIG.CAR_GAP));
const findCable=(st,a,b)=>st.cables.find(c=>(c.a===a&&c.b===b)||(c.a===b&&c.b===a));
const cableById=(st,id)=>st.cables.find(c=>c.id===id);
const curOrder=st=>st.tier<DATA.orders.length?DATA.orders[st.tier]:st.free;
function tripCost(cb){return Math.max(1,Math.round(cb.len*CONFIG.TRIP_COST*DATA.classes[cb.cls].trip));}
function upkeep(cb){return Math.round(cb.len*CONFIG.CABLE_UPK+DATA.classes[cb.cls].upk*cb.cars.length);}
function creditLimit(st){return Math.max(CONFIG.CREDIT,Math.round((st.last?st.last.up:0)*1.5/100)*100);}
function netWorth(st){let a=0;for(const c of st.cables)a+=c.inv;return Math.round(st.cash+a*CONFIG.REFUND);}
function cargoAvailable(st,c){return st.sites.some(s=>isRev(st,s)&&produces(s).indexOf(c)>=0);}

Rules.plan=function(st,aid,bid){
  const a=site(st,aid),b=site(st,bid);const r={ok:false,reason:'',cost:0,len:0,carry:[]};
  if(!a||!b||a===b){r.reason='Pick two different places';return r;}
  if(!isRev(st,a)||!isRev(st,b)){r.reason='That mesa is still in the dust';return r;}
  r.len=dist(a,b); r.cost=cableCost(r.len); r.carry=carries(a,b);
  if(findCable(st,aid,bid)){r.reason='Already connected';return r;}
  if(!r.carry.length){r.reason='Nothing to carry: neither end wants what the other makes';return r;}
  if(r.len>span(st)){r.reason='Too long ('+Math.round(r.len)+'). Longest span now: '+span(st);return r;}
  for(const s of st.sites){if(s===a||s===b)continue;if(segDist(s.x,s.y,a.x,a.y,b.x,b.y)<CONFIG.SITE_R+CONFIG.CLEAR){r.reason='Blocked by '+(isRev(st,s)?s.name:'a dusty mesa');return r;}}
  for(const c of st.cables){if(c.a===aid||c.b===aid||c.a===bid||c.b===bid)continue;const p=site(st,c.a),q=site(st,c.b);
    if(segInter(a,b,p,q)){r.reason='Would cross the '+p.name+'–'+q.name+' line';return r;}}
  if(st.over){r.reason='This run is over';return r;}
  if(st.cash<r.cost){r.reason='Costs '+money(r.cost)+'. You have '+money(st.cash);r.short=true;return r;}
  r.ok=true;return r;
};
function addCarRaw(st,cb){
  const i=cb.cars.length, atB=i%2===1;
  const car={p:atB?1:0,dir:atB?-1:1,st:'dwell',tm:CONFIG.DWELL*(1+Math.floor(i/2)*1.5),wt:0,load:{},n:0,dep:st.clock};
  cb.cars.push(car);
}
Rules.build=function(st,aid,bid){
  const p=Rules.plan(st,aid,bid); if(!p.ok) return p;
  st.cash-=p.cost;
  const cb={id:st.nid++,a:aid,b:bid,len:+p.len.toFixed(2),cls:0,cars:[],inv:p.cost,wait:false,m:{inc:0,n:0,over:0,late:0,trip:0},
    last:null,hist:[],tot:0,born:st.month,status:null,lastPay:null};
  addCarRaw(st,cb); st.cables.push(cb); st.started=true;
  st.ev.push({t:'build',id:cb.id}); Rules.afterAction(st); return p;
};
Rules.carCost=cb=>DATA.classes[cb.cls].car;
Rules.addCar=function(st,id){
  const cb=cableById(st,id); if(!cb||st.over) return {ok:false,reason:'No line'};
  if(cb.cars.length>=maxCars(cb)) return {ok:false,reason:'This line holds '+maxCars(cb)+' cars at most. Upgrade the class instead.'};
  const cost=Rules.carCost(cb); if(st.cash<cost) return {ok:false,reason:'Need '+money(cost)};
  st.cash-=cost; cb.inv+=cost; addCarRaw(st,cb); st.ev.push({t:'car',id}); Rules.afterAction(st); return {ok:true,cost};
};
Rules.sellCar=function(st,id){

    if(st.won&&(!slot.month||st.wonMonth<slot.month)){slot.month=st.wonMonth;changed=true;}
    if(changed) this.set(this.B,JSON.stringify(b)); return changed;},
  prefs(){let p=null;try{p=JSON.parse(this.get(this.P)||'null');}catch(e){}
    return {sound:p?p.sound!==false:true,music:p?p.music!==false:true,speed:p?int(p.speed,0,2,0):0,debug:p?!!p.debug:false};},
  savePrefs(p){this.set(this.P,JSON.stringify(p));}
};

/* ===================== AUDIO (generated) ===================== */
const Audio={
  ctx:null,master:null,sfxG:null,musG:null,on:true,music:true,lastCoin:0,step:0,nextT:0,timer:null,pattern:null,
  init(){
    if(this.ctx){ if(this.ctx.state==='suspended'&&!document.hidden) this.ctx.resume().catch(()=>{}); return; }
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    try{ this.ctx=new AC(); }catch(e){ this.ctx=null; return; }
    const c=this.ctx; this.master=c.createGain(); this.master.gain.value=0.8; this.master.connect(c.destination);
    this.sfxG=c.createGain(); this.sfxG.gain.value=this.on?1:0; this.sfxG.connect(this.master);
    this.musG=c.createGain(); this.musG.gain.value=this.music?1:0; this.musG.connect(this.master);
    const r={rs:20261106}; const scale=[0,2,4,7,9,12,14,16]; this.pattern=[]; let i=3;
    for(let k=0;k<32;k++){ i=clamp(i+Math.floor(rngNext(r)*5)-2,0,scale.length-1); this.pattern.push(rngNext(r)<0.72?scale[i]:null); }
    this.nextT=c.currentTime+0.1;
    this.timer=setInterval(()=>this.tick(),200);
  },
  setSound(v){this.on=v;if(this.sfxG)this.sfxG.gain.value=v?1:0;},
  setMusic(v){this.music=v;if(this.musG)this.musG.gain.value=v?1:0;},
  suspend(){if(this.ctx&&this.ctx.state==='running')this.ctx.suspend().catch(()=>{});},
  resume(){if(this.ctx&&this.ctx.state==='suspended'&&!document.hidden)this.ctx.resume().catch(()=>{});},
  tone(f,d,type,vol,slide,when,dest){
    const c=this.ctx; if(!c||c.state!=='running') return; const t=when||c.currentTime;
    const o=c.createOscillator(),g=c.createGain(); o.type=type||'triangle'; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.1,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(dest||this.sfxG); o.start(t); o.stop(t+d+0.05);
  },
  sfx(n,arg){
    if(!this.ctx||!this.on) return; const c=this.ctx, t=c.currentTime;
    switch(n){
      case 'build': this.tone(260,0.28,'sawtooth',0.07,780); this.tone(990,0.18,'triangle',0.08,null,t+0.2); break;
      case 'coin': { if(t-this.lastCoin<0.07) return; this.lastCoin=t; const base={R:1180,P:1320,C:990,J:1480,O:1100,T:1660}[arg]||1300;
        this.tone(base,0.06,'square',0.035); this.tone(base*1.5,0.09,'triangle',0.04,null,t+0.05); break; }
      case 'over': this.tone(700,0.07,'triangle',0.03); break;
      case 'car': this.tone(330,0.05,'square',0.05); this.tone(495,0.07,'square',0.04,null,t+0.06); break;
      case 'up': [523,659,784].forEach((f,i)=>this.tone(f,0.14,'triangle',0.08,null,t+i*0.07)); break;
      case 'tier': [523,659,784,1046,784,1046].forEach((f,i)=>this.tone(f,0.22,'triangle',0.09,null,t+i*0.11)); break;
      case 'err': this.tone(150,0.16,'sawtooth',0.06,110); break;
      case 'red': this.tone(330,0.25,'triangle',0.08,200); this.tone(220,0.3,'triangle',0.07,150,t+0.2); break;
      case 'tap': this.tone(660,0.04,'sine',0.04); break;
      case 'remove': this.tone(440,0.2,'triangle',0.07,180); break;
    }
  },
  tick(){
    const c=this.ctx; if(!c||c.state!=='running'||document.hidden||!this.music){ if(c) this.nextT=c.currentTime+0.1; return; }
    const beat=60/88/2;
    if(this.nextT<c.currentTime) this.nextT=c.currentTime+0.05;
    while(this.nextT<c.currentTime+0.6){
      const k=this.step%32, n=this.pattern[k];
      if(n!==null) this.tone(293.66*Math.pow(2,n/12),0.5,'triangle',0.028,null,this.nextT,this.musG);
      if(k%8===0) this.tone(73.4*(k%16===0?1:1.5),1.1,'sine',0.05,null,this.nextT,this.musG);
      if(k%4===2) this.tone(1800,0.03,'square',0.006,null,this.nextT,this.musG);
      this.nextT+=beat; this.step++;
    }
  }
};

UI.hud=function(){
  const o=curOrder(st);
  let gName,gProg,frac;
  if(o.type==='deliver'){gProg=fmt(Math.min(st.prog,o.n))+'/'+fmt(o.n)+' '+DATA.cargo[o.c].name.toLowerCase();frac=st.prog/o.n;}
  else{const w=netWorth(st);gProg=money(w)+' / '+money(o.n);frac=w/o.n;}
  const idx=st.tier<DATA.orders.length?('Order '+(st.tier+1)+'/'+DATA.orders.length+' · '):'';
  gName=idx+o.name;
  let pmTxt,pmCls='';
  if(!st.started){pmTxt='String your first line';}
  else if(st.month===0){pmTxt='First month running';}
  else{pmTxt=(st.last.profit>=0?'+':'')+money(st.last.profit)+'/mo';pmCls=st.last.profit>=0?'up':'down';}
  if(st.strikes>0) {pmTxt+=' · red '+st.strikes+'/'+CONFIG.STRIKES; pmCls='down';}
  let left='';
  if(!st.won&&!st.expired){const ml=Math.max(0,CONFIG.DEADLINE-st.month);left='<br><span style="opacity:.8">'+(ml>=12?Math.floor(ml/12)+'y ':'')+(ml%12)+'m left</span>';}
  const key=[st.cash|0,pmTxt,st.month,gName,gProg,UI.speed,UI.paused,st.won,st.expired].join('|');
  if(key===UI.lastHud) return; UI.lastHud=key;
  els.cash.textContent=money(st.cash); els.cash.className=st.cash<0?'neg':'';
  els.pm.textContent=pmTxt; els.pm.className=pmCls;
  els.date.innerHTML='Year '+(Math.floor(st.month/12)+1)+' · '+DATA.months[st.month%12]+left;
  els.goalName.textContent=gName; els.goalProg.textContent=gProg; els.barFill.style.width=clamp(frac*100,0,100)+'%';
  els.bSpeed.textContent=CONFIG.SPEEDS[UI.speed]+'×'; els.bPause.textContent=UI.paused?'▶':'❚❚';
  els.bPause.setAttribute('aria-label',UI.paused?'Resume':'Pause');
};

UI.hintFor=function(){
  const h=st.h;
  if(st.over||UI.modal) return '';
  if(!st.cables.length){ const a=site(st,0),b=site(st,1); return 'Drag from '+a.name+' to '+b.name+' to string your first ropeway.'; }
  const first=st.cables[0];
  if(st.tier===0&&first&&first.cars.length<2&&!h.addCar&&st.clock>10) return 'Riders are piling up. Tap the line to add a car.';
  if(st.tier===1&&!st.cables.some(c=>site(st,c.a).kind==='orchard'||site(st,c.b).kind==='orchard')) return 'Peachwood opened. Drag it to a town: towns pay for peaches.';
  if(st.tier===2&&!st.cables.some(c=>site(st,c.a).kind==='kiln'||site(st,c.b).kind==='kiln')) return 'Kilnhollow turns clay into pots. Link Umber Pit to it, then the kiln to a town.';
  if(st.tier===3&&!st.cables.some(c=>site(st,c.a).kind==='foundry'||site(st,c.b).kind==='foundry')) return 'Copper goes to Brightforge, tools go to towns. Longer spans are open now.';
  if(st.strikes>0) return 'You are in the red. Sell cars on losing lines (tap a line) before '+CONFIG.STRIKES+' months in a row.';
  const bad=st.cables.find(c=>c.status&&(c.status.k==='backlog'||c.status.k==='empty'||c.status.k==='over'));
  if(bad&&!h['seen'+bad.status.k]&&st.month>=1) return 'Tip: a line badge shows “!” when it needs attention. Tap it to see why.';
  return '';
};

UI.renderSheet=function(){
  const S=UI.sheet; if(!S) return; let h='<button class="x" data-act="close" aria-label="Close">×</button>';
  const focusAct=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.act:null;
  if(S.kind==='cable'){
    const cb=cableById(st,S.id); if(!cb){UI.closeSheet();return;}
    const a=site(st,cb.a),b=site(st,cb.b),cl=DATA.classes[cb.cls],nx=DATA.classes[cb.cls+1];

    h+='<h3>'+a.name+' ⇄ '+b.name+'</h3><div class="sub">'+cl.name+' class · length '+Math.round(cb.len)+' · '+cb.cars.length+'/'+maxCars(cb)+' cars · '+cl.cap+' seats each</div>';

    const L=cb.last;
    h+='<div class="row"><span class="stat">Last month <b style="color:'+(L&&L.profit<0?'var(--bad)':'var(--good)')+'">'+(L?((L.profit>=0?'+':'')+money(L.profit)):'—')+'</b></span>'+
       '<span class="stat">Earned <b>'+(L?money(L.inc):'—')+'</b></span><span class="stat">Upkeep <b>'+money(upkeep(cb))+'</b>/mo + <b>'+money(tripCost(cb))+'</b>/trip</span><span class="stat">Delivered <b>'+(L?L.n:'—')+'</b></span></div>';
    const s=cableStatus(st,cb);
    h+='<div class="why '+(s.k==='good'||s.k==='backlog'?'good':(s.k==='new'?'':'bad'))+'">'+s.txt+'</div>';
    const full=cb.cars.length>=maxCars(cb);
    h+='<div class="row">'+btn('add','+ Car',full?'line is full':money(Rules.carCost(cb)),'',full||st.cash<Rules.carCost(cb));
    if(nx){const locked=nx.tier>st.tier,c=Rules.upCost(cb);h+=btn('up','Upgrade → '+nx.name,locked?'after order '+nx.tier:money(c)+' · '+nx.cap+' seats, speed '+nx.spd,'alt',locked||st.cash<c);}
    else h+=btn('up','Top class','Swift is the best','alt',true);
    h+='</div><div class="row">'+btn('wait',cb.wait?'Order: wait to fill':'Order: leave on time',cb.wait?'fewer, fuller trips: saves fuel when cargo trickles in':'fastest service: cars leave after loading','alt')+
       btn('sell','− Car',cb.cars.length>1?'+'+money(Math.round(Rules.carCost(cb)*CONFIG.REFUND)):'needs 1 car','alt',cb.cars.length<=1)+
       btn('remove',UI.confirm===cb.id?'Tap again to remove':'Remove line','refund '+money(Math.round(cb.inv*CONFIG.REFUND)),'warn')+'</div>';
    if(cb.lastPay&&UI.debug){const p=cb.lastPay;h+='<div class="small">debug · last drop: '+p.q+' '+p.c+' ('+p.full+' wanted) × rate '+DATA.cargo[p.c].rate+' × dist '+p.distF+' × time '+p.timeF+' = '+money(p.pay)+'</div>';}
  }else if(S.kind==='site'){
    const s=site(st,S.id); if(!s){UI.closeSheet();return;} const k=DATA.kinds[s.kind];
    if(!isRev(st,s)){h+='<h3>A dusty mesa</h3><div class="sub">Something waits here. It opens after order '+s.tier+'. Lines can’t pass through it.</div>';}
    else{
      h+='<h3>'+s.name+'</h3><div class="sub">'+k.label+(s.kind==='town'?' · population '+Math.round(s.pop):'')+'</div>';
      const pr=produces(s);
      if(pr.length){h+='<div class="row">';for(const c of pr){const rate=k.prod===c?prodRate(st,s):0;
        h+='<span class="stat">'+cargoChip(c)+' waiting <b>'+Math.floor(s.piles[c]||0)+'</b>/'+CONFIG.PILE_CAP+(rate?' · makes '+Math.round(rate)+'/mo':' · made from deliveries')+'</span>';}h+='</div>';}
      if(k.acc.length){h+='<div class="sub" style="margin-top:6px"><b>Wants:</b></div><div class="row">';
        for(const c of k.acc){ if(s.kind==='town'&&c==='R'){h+='<span class="stat">'+cargoChip('R')+' from other towns, any amount</span>';continue;}
          if(s.kind==='town'&&CONFIG.WANT[c]){const full=s.pop*CONFIG.WANT[c],rem=Math.max(0,s.want[c]||0);
            h+='<span class="stat">'+cargoChip(c)+' <b>'+Math.round(rem)+'</b> more this month'+(cargoAvailable(st,c)?'':' (not found yet)')+'</span>';}
          else h+='<span class="stat">'+cargoChip(c)+' any amount → becomes '+DATA.cargo[k.conv[c][0]].name.toLowerCase()+'</span>';}
        h+='</div>';}
      if(s.kind==='town') h+='<div class="why">Towns grow when they get at least 60% of what they want each month. Bigger towns make more riders and want more goods.</div>';
      else if(k.prod) h+='<div class="why">'+(s.mul>1.01?'Good service has grown output to ×'+s.mul.toFixed(2)+'. ':'')+'Pick up most of what it makes each month and it grows (up to ×'+CONFIG.MUL_CAP+').</div>';
      const mine=st.cables.filter(c=>c.a===s.id||c.b===s.id);
      if(mine.length){h+='<div class="sub"><b>Lines here</b></div>';for(const cb of mine){const o=site(st,cb.a===s.id?cb.b:cb.a);
        h+='<button class="lnk" data-act="cable:'+cb.id+'">→ '+o.name+' · '+(cb.last?((cb.last.profit>=0?'+':'')+money(cb.last.profit)+'/mo'):'new')+'</button>';}}
      else h+='<div class="sub">No lines yet. Drag from here to somewhere that wants what this place makes.</div>';
    }
  }
  if(h===UI.sheetHtml) return; UI.sheetHtml=h; els.sheet.innerHTML=h;
  if(focusAct){const b=els.sheet.querySelector('[data-act="'+focusAct+'"]');if(b)b.focus();}
};
els.sheet.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return; Audio.init();
  const act=b.dataset.act, S=UI.sheet; if(!S) return;
  if(act==='close'){UI.closeSheet();return;}
  if(act.startsWith('cable:')){UI.openSheet('cable',+act.slice(6));Audio.sfx('tap');return;}
  const id=S.id; let r=null;
  if(act==='add'){r=Rules.addCar(st,id);if(r.ok){st.h.addCar=true;}}
  else if(act==='sell'){r=Rules.sellCar(st,id);}
  else if(act==='up'){r=Rules.upgrade(st,id);}
  else if(act==='wait'){r=Rules.toggleWait(st,id);Audio.sfx('tap');}
  else if(act==='remove'){ if(UI.confirm!==id){UI.confirm=id;UI.renderSheet();Audio.sfx('tap');return;} r=Rules.remove(st,id); if(r.ok){UI.closeSheet();} }
  if(r&&!r.ok){toast(r.reason,true);Audio.sfx('err');}
  UI.confirm=act==='remove'?UI.confirm:0;
  Game.save(); UI.renderSheet();
});

UI.recap=function(){

  let worst=null;for(const c of st.cables)if(c.last&&(!worst||c.last.profit<worst.last.profit))worst=c;
  let h='<p class="small">Delivered: '+(parts.join(', ')||'nothing yet')+'.<br>Orders done: '+st.log.length+'. Peak net worth '+money(st.peak)+'.</p>';
  if(bestCb) h+='<p class="small">Best line: '+site(st,bestCb.a).name+' ⇄ '+site(st,bestCb.b).name+', earned '+money(bestCb.tot)+' in all.</p>';

  effects(dt){const c=this.ctx;
    for(let i=this.pt.length-1;i>=0;i--){const p=this.pt[i];p.t+=dt;if(p.t>=p.life){this.pt.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=60*dt;c.globalAlpha=1-p.t/p.life;c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill();}
    c.globalAlpha=1;
    for(let i=this.fl.length-1;i>=0;i--){const f=this.fl[i];f.t+=dt;if(f.t>=f.life){this.fl.splice(i,1);continue;}const k=f.t/f.life;
      c.globalAlpha=k<0.7?1:1-(k-0.7)/0.3;const sc=k<0.12?0.6+k*3.3:1;c.font='800 '+Math.round(f.size*sc)+'px system-ui,sans-serif';c.textAlign='center';c.textBaseline='middle';
      c.lineWidth=3;c.strokeStyle='rgba(40,20,8,.75)';c.strokeText(f.txt,f.x,f.y-k*26);c.fillStyle=f.col;c.fillText(f.txt,f.x,f.y-k*26);}
    c.globalAlpha=1;},
  debug(){const c=this.ctx;c.font='600 9px monospace';c.textAlign='left';c.textBaseline='top';c.fillStyle='rgba(0,0,0,.7)';
    c.fillRect(2,2,150,26);c.fillStyle='#fff';c.fillText('m'+st.month+' t'+st.t.toFixed(1)+' worth '+netWorth(st),5,5);c.fillText('cables '+st.cables.length+' rs '+(st.rs>>>0).toString(16),5,15);
    for(const s of st.sites){if(!isRev(st,s))continue;const px=this.X(s.x)+14,py=this.Y(s.y)-4;c.fillStyle='rgba(0,0,0,.6)';c.fillRect(px,py,60,22);c.fillStyle='#fff';
      c.fillText('x'+s.mul.toFixed(2)+' sv'+(s.served||0).toFixed(2),px+2,py+2);c.fillText(s.kind==='town'?('P'+Math.round(s.want.P||0)+' J'+Math.round(s.want.J||0)+' T'+Math.round(s.want.T||0)):('lost '+Math.round(s.lost)),px+2,py+12);}}
};

/* ===================== INPUT ===================== */
const Input={drag:null,
  pos(e){const r=els.cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};},
  siteAt(px,py,includeHidden){let best=-1,bd=1e9;const R=Math.max(CONFIG.HIT_PX,CONFIG.SITE_R*Renderer.s+6);
    for(const s of st.sites){if(!includeHidden&&!isRev(st,s))continue;const d=Math.hypot(Renderer.X(s.x)-px,Renderer.Y(s.y)-py);if(d<R&&d<bd){bd=d;best=s.id;}}return best;},
  cableAt(px,py){let best=null,bd=CONFIG.CABLE_HIT_PX;for(const cb of st.cables){const a=site(st,cb.a),b=site(st,cb.b),k=Renderer.ctrl(a,b,cb);
    for(let i=0;i<=20;i++){const p=Renderer.bez(a,k,b,i/20),d=Math.hypot(Renderer.X(p.x)-px,Renderer.Y(p.y)-py);if(d<bd){bd=d;best=cb;}}
    const m=Renderer.bez(a,k,b,0.5),d=Math.hypot(Renderer.X(m.x)-px,Renderer.Y(m.y)-17+7-py);if(cb.last&&d<bd+6){bd=Math.max(0,d-6);best=cb;}}
    return best;},
  down(px,py,id){ if(UI.modal||st.over) return; const sid=this.siteAt(px,py,false);
    this.drag={from:sid,to:-1,sx:px,sy:py,px,py,moved:false,pid:id}; },
  move(px,py){const d=this.drag;if(!d)return;d.px=px;d.py=py;if(Math.hypot(px-d.sx,py-d.sy)>9)d.moved=true;
    if(d.from>=0&&d.moved){const t=this.siteAt(px,py,false);const nt=t===d.from?-1:t;if(nt!==d.to){d.to=nt;if(nt>=0)Audio.sfx('tap');}}},
  up(){const d=this.drag;this.drag=null;if(!d)return;
    if(d.from>=0&&d.moved){ if(d.to>=0) Game.tryBuild(d.from,d.to); return; }
    if(!d.moved){ const sid=this.siteAt(d.sx,d.sy,true);
      if(sid>=0){UI.openSheet('site',sid);Audio.sfx('tap');return;}
      const cb=this.cableAt(d.sx,d.sy); if(cb){UI.openSheet('cable',cb.id);Audio.sfx('tap');return;}
      UI.closeSheet(); }
  },
  cancel(){this.drag=null;}
};
els.cv.addEventListener('pointerdown',e=>{Audio.init();e.preventDefault();try{els.cv.setPointerCapture(e.pointerId);}catch(_){}
  const p=Input.pos(e);Input.down(p.x,p.y,e.pointerId);});
els.cv.addEventListener('pointermove',e=>{if(!Input.drag)return;const p=Input.pos(e);Input.move(p.x,p.y);});
els.cv.addEventListener('pointerup',e=>{const p=Input.pos(e);if(Input.drag)Input.move(p.x,p.y);Input.up();});
els.cv.addEventListener('pointercancel',()=>Input.cancel());
els.cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
  Audio.init();
  const tag=e.target&&e.target.tagName;
  if(e.key==='Escape'){ if(UI.modal&&UI.modal!=='win'&&UI.modal!=='over') UI.closeModal(); else if(UI.sheet) UI.closeSheet(); UI.from=-1; Input.cancel(); return; }
  if(UI.modal) return;
  if(tag==='BUTTON'&&(e.key==='Enter'||e.key===' ')) return;
  const rev=st.sites.filter(s=>isRev(st,s)).map(s=>s.id);
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();let i=rev.indexOf(UI.focus);i=i<0?0:(i+(e.key==='ArrowRight'?1:rev.length-1))%rev.length;UI.focus=rev[i];Audio.sfx('tap');return;}
  if(e.key==='Enter'){e.preventDefault();if(UI.focus<0){UI.focus=rev[0];return;}
    if(UI.from<0){UI.from=UI.focus;toast('Linking from '+site(st,UI.from).name+'. Pick a second place, then Enter.');}
    else if(UI.from===UI.focus){UI.from=-1;}
    else{Game.tryBuild(UI.from,UI.focus);UI.from=-1;} return;}
  if(e.key==='i'||e.key==='I'){if(UI.focus>=0)UI.openSheet('site',UI.focus);return;}
  if(e.key===' '){e.preventDefault();UI.paused=!UI.paused;UI.lastHud='';return;}
  if(e.key>='1'&&e.key<='3'){UI.speed=+e.key-1;UI.lastHud='';Game.savePrefs();return;}
  if(e.key==='m'||e.key==='M'){Audio.setSound(!Audio.on);Audio.setMusic(Audio.on);Game.savePrefs();toast('Sound '+(Audio.on?'on':'off'));return;}
});
window.addEventListener('resize',()=>{Renderer.resize();});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){UI.hidden=true;Audio.suspend();Game.save();}
  else{UI.hidden=false;Audio.resume();Game.last=0;}
});
window.addEventListener('pagehide',()=>Game.save());

/* ===================== GAME LOOP ===================== */
const Game={last:0,acc:0,
  save(){if(st)Storage.save(st);},
  savePrefs(){Storage.savePrefs({sound:Audio.on,music:Audio.music,speed:UI.speed,debug:UI.debug});},
  newRun(mode,seed){st=newState(mode,seed);this.acc=0;Renderer.bg=null;Renderer.fl=[];Renderer.pt=[];UI.closeSheet();UI.focus=-1;UI.from=-1;UI.lastHud='';this.save();},
  tryBuild(a,b){const p=Rules.build(st,a,b);
    if(!p.ok){toast(p.reason,true);Audio.sfx('err');return p;}
    this.save();return p;},
  events(){
    const ev=st.ev; if(!ev.length) return; st.ev=[];
    const R=Renderer;
    for(const e of ev){
      if(e.t==='pay'){const px=R.X(e.x),py=R.Y(e.y)-14;
        const last=R.fl.find(f=>f.key===e.x+','+e.y&&f.t<0.25);
        if(last){last.amt+=e.amt;last.txt='+'+money(last.amt);}else{R.floater(px,py,'+'+money(e.amt),e.over?'#e8d9b8':'#c9f0b0');R.fl[R.fl.length-1].key=e.x+','+e.y;R.fl[R.fl.length-1].amt=e.amt;}
        Audio.sfx(e.over?'over':'coin',e.c);}
      else if(e.t==='build'){const cb=cableById(st,e.id);if(cb){R.anim['w'+cb.id]=1.6;const a=site(st,cb.a),b=site(st,cb.b);for(let i=0;i<=6;i++)R.burst(R.X(a.x+(b.x-a.x)*i/6),R.Y(a.y+(b.y-a.y)*i/6),'#d9b48a',3,40);}Audio.sfx('build');}
      else if(e.t==='car'){Audio.sfx('car');const cb=cableById(st,e.id);if(cb)R.anim['w'+cb.id]=0.6;}
      else if(e.t==='sell'||e.t==='remove'){Audio.sfx('remove');if(e.t==='remove')toast('Line removed. Refund '+money(e.back)+'.');}
      else if(e.t==='up'){Audio.sfx('up');const cb=cableById(st,e.id);if(cb){R.anim['w'+cb.id]=1;const a=site(st,cb.a),b=site(st,cb.b);R.burst(R.X((a.x+b.x)/2),R.Y((a.y+b.y)/2),DATA.classes[cb.cls].col,18,70);}}
      else if(e.t==='tier'){Audio.sfx('tier');R.shake=7;toast(e.name+' done!'+(e.reward?' +'+money(e.reward):''));R.burst(R.cw/2,6,'#e0a33a',30,120);R.burst(R.cw/2,6,'#c4552d',20,100);}
      else if(e.t==='reveal'){const s=site(st,e.id);R.anim['rv'+e.id]=1;R.burst(R.X(s.x),R.Y(s.y),'#e8cfa4',26,90);setTimeout(()=>toast(s.name+' is open!'),1500);}
      else if(e.t==='red'){Audio.sfx('red');toast('In the red at month end ('+e.n+'/'+CONFIG.STRIKES+'). Cut losing cars or lines.',true);}
      else if(e.t==='month'){if(st.started){const v=st.last.profit;R.floater(R.cw/2,34,DATA.months[(st.month+11)%12]+': '+(v>=0?'+':'')+money(v),v>=0?'#c9f0b0':'#ffb4a0',15);}
        Storage.recordBest(st);this.save();if(UI.sheet)UI.renderSheet();}
      else if(e.t==='win'){Storage.recordBest(st);this.save();setTimeout(()=>UI.openModal('win'),900);}
      else if(e.t==='over'){Storage.recordBest(st);this.save();setTimeout(()=>UI.openModal('over'),600);}
    }
  },
  frame(now){
    requestAnimationFrame(Game.frame);
    const dt=Game.last?Math.min(0.1,(now-Game.last)/1000):0; Game.last=now;
    if(!UI.isPaused()&&st.started&&!st.over){Game.acc+=dt*CONFIG.SPEEDS[UI.speed];let n=0;
      while(Game.acc>=CONFIG.STEP&&n<60){Rules.step(st,CONFIG.STEP);Game.acc-=CONFIG.STEP;n++;}if(n>=60)Game.acc=0;}
    Game.events();
    Renderer.draw(dt);
    UI.hud();
    const ht=UI.hintFor(); if(ht!==UI.hintTxt){UI.hintTxt=ht;if(ht)els.hint.textContent=ht;els.hint.classList.toggle('show',!!ht&&!UI.sheet);}
    else els.hint.classList.toggle('show',!!ht&&!UI.sheet);
    if(UI.toastT>0){UI.toastT-=dt;if(UI.toastT<=0)els.toast.className=els.toast.className.replace('show','').trim();}
    if(UI.sheet&&!UI.hold){UI.sheetT+=dt;if(UI.sheetT>0.5){UI.sheetT=0;UI.renderSheet();}}
  }
};

/* ===================== BOOT ===================== */
function boot(){
  const p=Storage.prefs(); Audio.on=p.sound; Audio.music=p.music; UI.speed=p.speed; UI.debug=p.debug;
  const r=Storage.load();
  if(r.st){st=r.st;} else {st=newState('classic',hashStr('sunwire-classic')); if(r.bad) setTimeout(()=>toast('Your save was damaged, so a fresh run started. A backup was kept.',true),300);}
  Renderer.init(); requestAnimationFrame(Game.frame);
  if(st.over) setTimeout(()=>UI.openModal('over'),300);
}
window.__sunwire={CONFIG,DATA,Rules,Storage,Audio,UI,Input,Renderer,Game,newState,get st(){return st;},set st(v){st=v;}};
boot();
})();
</script>
