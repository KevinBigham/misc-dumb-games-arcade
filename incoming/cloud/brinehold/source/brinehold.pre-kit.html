<title>Brinehold</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen phone app. HUD strip with pause/speed, the marsh map canvas, a coach line with the Call button, a full-width tool tray. Single dark look (a salt marsh at dusk). */
:root{
  --bog:#0d1c1c; --bog2:#132a29; --reed:#24443d; --brine:#eef3ee; --brine-dim:#a9bcb5;
  --lamp:#f4bb4f; --rust:#c9673d; --goo:#8fd16a; --danger:#e8574d; --ink:#081212;
  --f-display:"IM Fell English SC","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-ui:"Barlow Semi Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--bog);color:var(--brine);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--f-ui);-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));box-sizing:border-box}
#hud{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 44px 44px;gap:5px;padding-block:6px 4px}
#hud button{min-height:0;height:100%;padding:0;font-size:15px}
.hc{background:var(--bog2);border:1px solid var(--reed);border-radius:8px;padding:2px 6px;transition:transform .12s;display:flex;flex-direction:column;min-width:0}
.hc b{font-size:11px;letter-spacing:.08em;color:var(--brine-dim);font-weight:600;text-transform:uppercase}
.hc span{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hSalt span{color:var(--brine)} .hc.pop{transform:scale(1.08)} #hKeep span{color:var(--lamp)} #hKeep.hurt span{color:var(--danger)}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#cv{display:block;touch-action:none;border-radius:10px;box-shadow:0 0 0 1px var(--reed),0 10px 30px #0008}
#coach{min-height:48px;display:flex;align-items:center;gap:8px;padding:4px 0 2px;font-size:14px;line-height:1.2;color:var(--brine)}
#coach .txt{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#coach button{flex:none;min-width:104px;padding:0 10px;min-height:46px;line-height:1.05;font-size:15px}
#tray{display:flex;gap:4px;overflow-x:auto;padding-block:4px max(6px,env(safe-area-inset-bottom,0px));scrollbar-width:none}
#tray::-webkit-scrollbar{display:none}
.tool{flex:1 1 0;min-width:38px;max-width:64px;height:60px;border-radius:10px;border:1px solid var(--reed);background:var(--bog2);color:var(--brine);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;font-family:var(--f-ui);position:relative}
.tool canvas{width:30px;height:30px}
.tool .nm{font-size:10.5px;font-weight:600;line-height:1;white-space:nowrap;overflow:hidden;max-width:100%}
.tool .cs{font-size:11px;color:var(--brine-dim);font-variant-numeric:tabular-nums;line-height:1}
.tool.sel{border-color:var(--lamp);box-shadow:inset 0 0 0 2px var(--lamp);background:#2a2a1c}
.tool.poor .cs{color:var(--danger)}
.tool.new::after{content:"NEW";position:absolute;top:-4px;right:-4px;background:var(--lamp);color:var(--ink);font-size:9px;font-weight:700;border-radius:6px;padding:1px 4px}
.tool.bought{opacity:.45}
button{font-family:var(--f-ui);font-weight:700;font-size:16px;border-radius:10px;border:1px solid var(--reed);background:var(--bog2);color:var(--brine);min-height:46px;cursor:pointer}
button:focus-visible,.tool:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
button.go{background:var(--lamp);color:var(--ink);border-color:var(--lamp)}
button.go:disabled{background:var(--bog2);color:var(--brine-dim);border-color:var(--reed)}
button.small{min-height:36px;font-size:14px;padding:0 12px}
#overlay{position:fixed;inset:0;background:#081212e6;display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:420px;max-height:100%;overflow:auto;background:var(--bog2);border:1px solid var(--reed);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.card h1{font-family:var(--f-display);font-weight:400;font-size:44px;margin:0;color:var(--lamp);text-align:center;letter-spacing:.02em;line-height:1}
.card h2{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0;text-align:center;text-wrap:balance}
.card p{margin:0;font-size:16px;line-height:1.35;color:var(--brine)}
.card .sub{text-align:center;color:var(--brine-dim)}
.card .row{display:flex;gap:8px;flex-wrap:wrap}
.card .row button{flex:1;min-width:120px}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:16px;font-variant-numeric:tabular-nums}
.stats span:nth-child(even){text-align:right;font-weight:700}
.how li{margin-bottom:6px;font-size:15px;line-height:1.3}
.how{padding-left:20px;margin:0}
.tip{background:#24443d66;border-left:3px solid var(--lamp);padding:8px 10px;border-radius:6px}
#overlay.light{background:linear-gradient(180deg,#08121240 0%,#081212b0 55%,#081212e0 100%)}
#overlay.light .card{background:#163029ee;box-shadow:0 10px 40px #000a}
.up{display:flex;align-items:center;gap:10px;justify-content:space-between;border-top:1px solid var(--reed);padding-top:10px}
.up div{display:flex;flex-direction:column;gap:2px;font-size:15px;line-height:1.25}
.up span{color:var(--brine-dim)}
.up.own b{color:var(--lamp)}
.up button{flex:0 0 auto;min-width:96px}
.tool.works .cs{color:var(--lamp)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <header id="hud">
    <div class="hc" id="hSalt"><b>Salt</b><span>60</span></div>
    <div class="hc" id="hKeep"><b>Keep</b><span>20</span></div>
    <div class="hc" id="hWave"><b>Wave</b><span>0/30</span></div>
    <div class="hc" id="hNext"><b>Next</b><span>35s</span></div>
    <button id="bPause" aria-label="Pause">II</button>
    <button id="bSpeed" aria-label="Game speed">1x</button>
  </header>
  <div id="stage"><canvas id="cv" aria-label="Salt marsh map" tabindex="0"></canvas></div>
  <div id="coach"><span class="txt" id="coachTxt" aria-live="polite">Loading…</span><button id="bCall" class="go">Call wave</button></div>
  <nav id="tray" aria-label="Build tools"></nav>
</div>
<div id="overlay" hidden><div class="card" id="card"></div></div>

<script>
'use strict';
/* =========================================================
   BRINEHOLD — rake salt, belt it to your cannons or your Keep,
   and survive 30 waves crawling up the creek.
   Architecture: CONFIG · DATA · RNG · Rules (no DOM) · Renderer · Sound · Storage · Input/UI · Loop
   ========================================================= */

/* ---------- CONFIG: every tunable number ---------- */
const CONFIG = {
  version: 1,
  cols: 10, rows: 15,
  startSalt: 60, keepHp: 20, keepTrickle: 0.25,
  firstWaveDelay: 35, waveGap: 22, waveGapLate: 16, totalWaves: 30,
  callBonusPerSec: 0.5,
  beltSpeed: 1.6, beltSpacing: 0.34,
  scrapRefund: 0.5, graceSec: 5,
  hpRamp1: 0.10, hpKnee: 12, hpRamp2: 0.11, hpCap: 5,
  saltValue: 1, brickValue: 3,
  dt: 1 / 60, maxStepsPerFrame: 12, autosaveSec: 4,
};

/* ---------- DATA: map, buildings, foes, waves, unlocks ---------- */
const DATA = {
  // . reed bank (buildable)  s salt pan  p creek (foes walk)  S creek source  C the Keep  r rock  w pool
  map: [
    'r.S...s..r',
    '..p.ss....',
    '..p.ss..ss',
    'w.pppppp.s',
    'ss.....p..',
    'ss..s..p.r',
    '..pppppp..',
    '.rp....ss.',
    '..p.s..ss.',
    '..pppppp.w',
    'ss.....p..',
    's..ss..p.r',
    '....pppp.s',
    '..s.p.s...',
    '..s.CCs..r',
  ],
  buildings: {
    rake:     { name: 'Rake', cost: 10, onlySalt: true, period: 1.6, buf: 2,
                desc: 'Place on a salt pan. Pushes salt into whatever touches it.' },
    belt:     { name: 'Belt', cost: 1,
                desc: 'Drag to lay a line. Salt rides the arrows. Tap a belt to turn it.' },
    cannon:   { name: 'Cannon', cost: 20, range: 2.6, cd: 0.55, dmg: 4, ammo: 'salt', maxAmmo: 20, startAmmo: 6,
                desc: 'Fires salt at the creek. 1 salt per shot. Feed it or it goes quiet.' },
    splitter: { name: 'Splitter', cost: 6,
                desc: 'Deals each item out of its other three sides in turn.' },
    pickler:  { name: 'Pickler', cost: 30, range: 1.9, cd: 1.0, dmg: 1, slow: 0.5, slowT: 1.6, ammo: 'salt', maxAmmo: 14, startAmmo: 4,
                desc: 'Sprays brine. Slows everything near it by half.' },
    kiln:     { name: 'Kiln', cost: 30, inN: 3, time: 2.5, cap: 6,
                desc: 'Bakes 3 salt into 1 Brick. Bricks feed Mortars.' },
    mortar:   { name: 'Mortar', cost: 40, range: 3.6, cd: 2.2, dmg: 16, splash: 0.85, flight: 0.7, ammo: 'brick', maxAmmo: 6, startAmmo: 2,
                desc: 'Lobs Bricks. Splash cracks shells and crowds. Salt will jam it.' },
    ward:     { name: 'Ward', cost: 8, chew: 9, burn: 3,
                desc: 'A salt post for the bank. Gnawers must chew it first, and salt burns them while they do.' },
    scrap:    { name: 'Scrap', cost: 0, tool: true,
                desc: 'Tap or drag to pull a building up. You get half its salt back.' },
  },
  toolOrder: ['rake', 'belt', 'cannon', 'splitter', 'pickler', 'kiln', 'mortar', 'ward', 'scrap'],
  foes: {
    slug:    { name: 'Bog Slug',    hp: 10,  speed: 0.55, armor: 0, leak: 1,  bounty: 1,  r: 0.27 },
    skitter: { name: 'Skitterling', hp: 5,   speed: 1.25, armor: 0, leak: 1,  bounty: 1,  r: 0.19 },
    shell:   { name: 'Shellback',   hp: 24,  speed: 0.42, armor: 3, leak: 2,  bounty: 3,  r: 0.31 },
    leech:   { name: 'Mire Leech',  hp: 3,   speed: 0.95, armor: 0, leak: 1,  bounty: 0,  r: 0.14 },
    gnawer:  { name: 'Mudgnawer',   hp: 14,  speed: 0.75, armor: 0, leak: 1,  bounty: 2,  r: 0.24, gnaw: true, bites: 2 },
    tyrant:  { name: 'Bog Tyrant',  hp: 140, speed: 0.30, armor: 1, leak: 6,  bounty: 30, r: 0.47, boss: true },
  },
  // Each group adds count = base + per*(wave-from), capped, spaced by gap seconds.
  waveGroups: [
    { foe: 'slug',    from: 1,  base: 4, per: 0.8,  max: 30, gap: 1.0 },
    { foe: 'skitter', from: 4,  base: 2, per: 0.55, max: 18, gap: 0.55 },
    { foe: 'shell',   from: 7,  base: 1, per: 0.5,  max: 18, gap: 1.6 },
    { foe: 'leech',   from: 9,  every: 2, base: 8, per: 0.9, max: 30, gap: 0.22 },
    { foe: 'gnawer',  from: 12, base: 1, per: 0.3, max: 7, gap: 2.4 },
    { foe: 'tyrant',  waves: [10, 20, 30], from: 10, base: 1, per: 0.05, max: 2, gap: 7, delay: 6 },
  ],
  unlocks: [
    { wave: 1, tools: ['rake', 'belt', 'cannon', 'scrap'] },
    { wave: 3, tools: ['splitter'], msg: 'Splitter unlocked. Share one rake line between a cannon and the Keep.' },
    { wave: 5, tools: ['pickler'],  msg: 'Pickler unlocked. Slow the creek so cannons get more shots.' },
    { wave: 6, tools: ['kiln', 'mortar'], msg: 'Kiln and Mortar unlocked. Shellbacks arrive next wave and laugh at cannons.' },
    { wave: 11, tools: ['ward'], msg: 'Ward unlocked. Mudgnawers come next wave: they climb the bank and chew whatever sits beside the creek.' },
    { wave: 13, ups: ['quickBelts'], msg: 'The Works are open. Spend spare salt on upgrades.' },
    { wave: 15, ups: ['deepRakes'], msg: 'New upgrade in the Works: Deep Tines.' },
    { wave: 18, ups: ['bellows'], msg: 'New upgrade in the Works: Bellows Cannons.' },
    { wave: 22, ups: ['heavyBricks'], msg: 'New upgrade in the Works: Heavy Bricks.' },
  ],
  upgrades: {
    quickBelts:  { name: 'Greased Belts',   cost: 80,  desc: 'Belts run 40% faster.' },
    deepRakes:   { name: 'Deep Tines',      cost: 160, desc: 'Rakes work 25% faster.' },
    bellows:     { name: 'Bellows Cannons', cost: 200, desc: 'Cannons fire 15% faster.' },
    heavyBricks: { name: 'Heavy Bricks',    cost: 260, desc: 'Mortar splash is 15% wider and hits 2 harder.' },
  },
};

/* ---------- RNG (seeded, state lives in game state) ---------- */
function rngNext(s) { // mulberry32
  let t = (s.rng = (s.rng + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

/* ---------- RULES (pure game logic, no DOM) ---------- */
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
const Rules = (() => {
  // Static map info (derived once from DATA)
  const W = CONFIG.cols, H = CONFIG.rows;
  const terrain = []; let spawn = null; const keepCells = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const c = DATA.map[y][x];
    const t = c === '.' ? 'g' : c === 's' ? 's' : c === 'p' ? 'p' : c === 'S' ? 'p' : c === 'C' ? 'c' : c === 'r' ? 'r' : 'w';
    terrain.push(t);
    if (c === 'S') spawn = { x, y };
    if (c === 'C') keepCells.push({ x, y });
  }
  const T = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? 'x' : terrain[y * W + x];
  // Walk the creek from its source to the Keep
  const path = [{ x: spawn.x, y: spawn.y - 0.9 }, { x: spawn.x, y: spawn.y }];
  { const seen = new Set([spawn.y * W + spawn.x]); let cx = spawn.x, cy = spawn.y;
    for (let guard = 0; guard < 400; guard++) {
      let moved = false;
      for (let d = 0; d < 4; d++) {
        const nx = cx + DX[d], ny = cy + DY[d], k = ny * W + nx, t = T(nx, ny);
        if ((t === 'p' || t === 'c') && !seen.has(k)) { seen.add(k); path.push({ x: nx, y: ny }); cx = nx; cy = ny; moved = true; break; }
      }
      if (!moved || T(cx, cy) === 'c') break;
    } }
  const segLen = []; let pathLen = 0;
  for (let i = 1; i < path.length; i++) { const l = Math.hypot(path[i].x - path[i - 1].x, path[i].y - path[i - 1].y); segLen.push(l); pathLen += l; }
  const pathIndexAt = new Map(); path.forEach((p, i) => { if (Number.isInteger(p.y)) pathIndexAt.set(p.y * W + p.x, i); });

  function posAt(prog) { // prog = distance along path from the source
    let d = Math.max(0, prog);
    for (let i = 0; i < segLen.length; i++) {
      if (d <= segLen[i] || i === segLen.length - 1) {
        const f = Math.min(1, d / segLen[i]); const a = path[i], b = path[i + 1];
        return { x: a.x + (b.x - a.x) * f + 0.5, y: a.y + (b.y - a.y) * f + 0.5, dir: Math.atan2(b.y - a.y, b.x - a.x) };
      }
      d -= segLen[i];
    }
    const e = path[path.length - 1]; return { x: e.x + 0.5, y: e.y + 0.5, dir: 0 };
  }

  const isKeep = (x, y) => T(x, y) === 'c';
  const idx = (x, y) => y * W + x;

  function newGame(seed) {
    seed = (seed >>> 0) || ((Math.random() * 2 ** 32) >>> 0);
    const s = {
      v: CONFIG.version, seed, rng: seed, t: 0,
      salt: CONFIG.startSalt, keep: CONFIG.keepHp, wave: 0, timer: CONFIG.firstWaveDelay,
      phase: 'play', grid: new Array(W * H).fill(null), foes: [], shells: [], spawnQ: [],
      unlocked: {}, newTools: {}, ups: {}, upAvail: {}, nextId: 1, trickle: 0, beltDir: 1,
      tut: 0, stats: { mined: 0, banked: 0, fired: 0, kills: 0, leaks: 0, leakBy: {}, built: 0, called: 0, peakSalt: CONFIG.startSalt },
      events: [],
    };
    applyUnlocks(s, 1, true);
    return s;
  }

  function applyUnlocks(s, forWave, silent) {
    for (const u of DATA.unlocks) {
      if (u.wave > forWave) continue;
      let fresh = false;
      for (const k of (u.tools || [])) if (!s.unlocked[k]) { s.unlocked[k] = true; fresh = true; if (!silent) s.newTools[k] = true; }
      for (const k of (u.ups || [])) if (!s.upAvail[k]) { s.upAvail[k] = true; fresh = true; if (!silent) s.newTools.works = true; }
      if (fresh && !silent && u.msg) s.events.push({ ev: 'unlock', msg: u.msg });
    }
  }

  function hpMult(w) {
    const k = CONFIG.hpKnee;
    const m = w <= k ? 1 + CONFIG.hpRamp1 * (w - 1) : 1 + CONFIG.hpRamp1 * (k - 1) + CONFIG.hpRamp2 * (w - k);
    return Math.min(CONFIG.hpCap, m);
  }

  function waveRoster(w) { // pure: list of {foe, at} for wave w
    const out = []; let offset = 0;
    for (const g of DATA.waveGroups) {
      let active;
      if (g.waves) active = g.waves.includes(w);
      else active = w >= g.from && (!g.every || (w - g.from) % g.every === 0);
      if (!active) continue;
      const n = Math.min(g.max, Math.floor(g.base + g.per * (w - (g.from || w))));
      const start = g.delay != null ? g.delay : offset;
      for (let i = 0; i < n; i++) out.push({ foe: g.foe, at: start + i * g.gap });
      offset += 1.6;
    }
    out.sort((a, b) => a.at - b.at);
    return out;
  }

  function startWave(s, called) {
    if (s.wave >= CONFIG.totalWaves) return;
    s.wave++;
    const roster = waveRoster(s.wave);
    for (const r of roster) s.spawnQ.push({ foe: r.foe, at: s.t + r.at + rngNext(s) * 0.15, w: s.wave });
    s.spawnQ.sort((a, b) => a.at - b.at);
    s.timer = 0;
    s.events.push({ ev: 'wave', n: s.wave, boss: roster.some(r => DATA.foes[r.foe].boss), called });
  }

  function callWave(s) {
    if (s.phase !== 'play' || s.spawnQ.length || s.wave >= CONFIG.totalWaves) return 0;
    const bonus = Math.floor(s.timer * CONFIG.callBonusPerSec);
    s.salt += bonus; s.stats.called++;
    startWave(s, true);
    if (bonus) s.events.push({ ev: 'bonus', n: bonus });
    return bonus;
  }

  function canPlace(s, kind, x, y) {
    const B = DATA.buildings[kind];
    if (!B || B.tool) return { ok: false, why: '' };
    if (!s.unlocked[kind]) return { ok: false, why: 'Not unlocked yet.' };
    const t = T(x, y);
    if (t === 'x') return { ok: false, why: '' };
    if (t === 'p') return { ok: false, why: 'Foes crawl the creek. Build on the banks.' };
    if (t === 'c') return { ok: false, why: 'That is the Keep.' };
    if (t === 'r') return { ok: false, why: 'Solid rock.' };
    if (t === 'w') return { ok: false, why: 'Deep water.' };
    if (B.onlySalt && t !== 's') return { ok: false, why: 'Rakes go on sparkly salt pans.' };
    if (s.grid[idx(x, y)]) return { ok: false, why: 'Something is already there.' };
    if (s.salt < B.cost) return { ok: false, why: 'Need ' + B.cost + ' salt.' };
    return { ok: true };
  }

  function make(kind, dir) {
    const B = DATA.buildings[kind];
    const b = { k: kind };
    if (kind === 'belt') { b.d = dir & 3; b.items = []; b.jam = 0; }
    if (kind === 'rake') { b.timer = 0; b.buf = 0; b.rr = 0; }
    if (B.ammo) { b.ammo = B.startAmmo; b.cd = 0; b.aim = -Math.PI / 2; b.flash = 0; }
    if (kind === 'splitter') { b.item = null; b.from = -1; b.rr = 0; }
    if (kind === 'kiln') { b.buf = 0; b.out = 0; b.prog = 0; b.rr = 0; }
    return b;
  }

  function place(s, kind, x, y, dir) {
    const c = canPlace(s, kind, x, y);
    if (!c.ok) { s.events.push({ ev: 'deny', why: c.why, x, y }); return false; }
    const B = DATA.buildings[kind];
    s.salt -= B.cost;
    s.grid[idx(x, y)] = make(kind, dir != null ? dir : s.beltDir);
    s.grid[idx(x, y)].at = s.t; s.grid[idx(x, y)].id = s.nextId++;
    if (kind === 'belt') s.beltDir = dir & 3;
    s.stats.built++;
    s.events.push({ ev: 'place', kind, x, y });
    return true;
  }

  function setBeltDir(s, x, y, dir) {
    const b = s.grid[idx(x, y)];
    if (b && b.k === 'belt' && b.d !== (dir & 3)) { b.d = dir & 3; s.beltDir = b.d; s.events.push({ ev: 'turn', x, y }); return true; }
    return false;
  }

  function scrap(s, x, y) {
    if (T(x, y) === 'x') return false;
    const b = s.grid[idx(x, y)];
    if (!b) return false;
    const cost = DATA.buildings[b.k].cost, grace = b.at != null && s.t - b.at <= CONFIG.graceSec;
    const refund = grace ? cost : Math.floor(cost * CONFIG.scrapRefund);
    s.salt += refund; s.grid[idx(x, y)] = null;

    const jammed = st.grid.some(b => b && b.k === 'belt' && b.bad && b.jam > 1.5);
    if (jammed) msg = 'A belt is jammed (red arrows): what is at its end can never take that item. Turn the belt or change what it feeds.';
    else if (starving) msg = 'A turret is out of ammo (red frame). Feed it salt, or Bricks for a Mortar.';
    else if (!st.spawnQ.length && st.wave < CONFIG.totalWaves) msg = 'Next: ' + previewWave(st.wave + 1) + '. Build up, or call it early for bonus salt.';

}
function fedCannon() {
  for (let y = 0; y < Rules.H; y++) for (let x = 0; x < Rules.W; x++) {

    for (let d = 0; d < 4; d++) { const n = state.grid[Rules.idx(x + DX[d], y + DY[d])]; if (x + DX[d] < 0 || x + DX[d] >= Rules.W) continue;
      if (n && (n.k === 'rake' || (n.k === 'belt' && n.d === ((d + 2) & 3)))) return true; }
  }

}
function afterBuild(kind) { if (state.tut === 0 && kind === 'rake') { state.tut = 1; selectTool('cannon'); } else if (state.tut === 1 && kind === 'cannon') { state.tut = 2; } }

/* ---------- UI: tray, HUD, overlay ---------- */
const iconCache = {};
function buildTray() {

    const B = DATA.buildings[k];

}
function worksScreen() {

    return `<div class="up${own ? ' own' : ''}"><div><b>${U.name}</b><span>${U.desc}</span></div><button class="small${own || poor ? '' : ' go'}" id="u_${id}" ${own || poor ? 'disabled' : ''}>${own ? 'Owned' : U.cost + ' salt'}</button></div>`; }).join('');

}
function selectTool(k) {

let hudCache = '';
function refreshHud() {

    b.innerHTML = canCall ? (st.wave === 0 ? 'Start wave 1' : 'Call wave ' + (st.wave + 1)) + (bonus >= 1 ? '<br><small>+' + bonus + ' salt</small>' : '') : 'Wave ' + st.wave + '<br><small>in the water</small>';

}

function showCard(html, light) { $('card').innerHTML = html; $('overlay').classList.toggle('light', !!light); $('overlay').hidden = false; paused = true; const f = $('card').querySelector('button'); if (f) f.focus(); }
function hideCard() { $('overlay').hidden = true; }
function howHtml() {
  return `<ol class="how">
    <li><b>Rake</b> salt from the sparkly pans. A rake pushes salt into anything touching it.</li>
    <li><b>Belt</b> it where it should go. Drag to lay a line; tap a belt to turn it.</li>
    <li>Salt that reaches the <b>Keep</b> is money. Salt that reaches a <b>Cannon</b> is ammo. Each crystal can only go one place.</li>

    <li>Spare salt buys upgrades in <b>the Works</b>. Night falls as the tides go on; your works carry their own light.</li>
  </ol><p class="sub">Keys: 1–9 tools · arrows + Enter build · R turn belt · N call wave · U the Works · P pause · F speed</p>`;
}
function titleScreen() {
  const saved = Storage.load(); const best = Storage.best();
  const canContinue = saved && saved.phase === 'play' && (saved.wave > 0 || saved.stats.built > 0);
  showCard(`<h1>Brinehold</h1><p class="sub">Rake salt. Belt it to your cannons or your Keep. Hold the creek for 30 waves.</p>
    ${best.wave ? `<p class="sub">Best: wave ${best.wave} · ${best.score} pts${best.wins ? ' · held ' + best.wins + 'x' : ''}</p>` : ''}
    <div class="row">${canContinue ? `<button class="go" id="oCont">Continue wave ${saved.wave}</button>` : ''}<button ${canContinue ? '' : 'class="go"'} id="oNew">${canContinue ? 'New run' : 'Play'}</button></div>
    <details><summary>How to play</summary>${howHtml()}</details>`, true);
  if (canContinue) $('oCont').onclick = () => { Sound.init(); startRun(saved); };
  $('oNew').onclick = () => { Sound.init(); if (canContinue && !$('oNew').dataset.sure) { $('oNew').dataset.sure = 1; $('oNew').textContent = 'Tap again to start over'; return; } startRun(null); };
}
function pauseScreen() {
  showCard(`<h2>Paused</h2><div class="row"><button class="go" id="oRes">Resume</button></div>
    <div class="row"><button id="oSnd">Sound: ${Sound.on ? 'on' : 'off'}</button><button id="oMus">Music: ${Sound.music ? 'on' : 'off'}</button></div>
    <div class="row"><button id="oRestart">Restart run</button></div>
    <details><summary>How to play</summary>${howHtml()}</details>`);
  $('oRes').onclick = resume; $('oSnd').onclick = () => { Sound.on = !Sound.on; $('oSnd').textContent = 'Sound: ' + (Sound.on ? 'on' : 'off'); };
  $('oMus').onclick = () => { Sound.init(); Sound.music = !Sound.music; $('oMus').textContent = 'Music: ' + (Sound.music ? 'on' : 'off'); };

}
function lessonFor(st) {
  const lb = st.stats.leakBy; const top = Object.keys(lb).sort((a, b) => lb[b] - lb[a])[0];
  if (st.phase === 'won') return 'Next time, try winning with fewer rakes banking into the Keep, or call every wave early.';
  if (!top) return 'Try more cannons along the last bend before the Keep.';
  if (top === 'shell') return 'Shellbacks got through most. Their shells shrug off cannon salt; Kilns feeding Mortars crack them.';
  if (top === 'skitter') return 'Skitterlings got through most. They are fast; a Pickler slows them so cannons get extra shots.';
  if (top === 'leech') return 'Leech swarms got through most. One Mortar splash hits a whole swarm.';
  if (top === 'gnawer') return 'Mudgnawers got through most. Wards on the bank hold them in place where your cannons can reach them.';
  if (top === 'tyrant') return 'The Bog Tyrant broke the Keep. Stockpile ammo before waves 10, 20 and 30, and slow it with Picklers.';
  return 'Slugs got through most. More fed cannons early, and watch for red frames that mean a cannon ran dry.';
}
function endScreen() {
  const st = state, won = st.phase === 'won', sc = Rules.score(st), best = Storage.best();
  const newBest = sc > best.score;
  const nb = { wave: Math.max(best.wave, won ? CONFIG.totalWaves : st.wave), score: Math.max(best.score, sc), wins: best.wins + (won ? 1 : 0) };
  Storage.setBest(nb); Storage.clear();
  showCard(`<h2>${won ? 'The Keep holds.' : 'The Keep has fallen.'}</h2>
    <p class="sub">${won ? 'All 30 waves turned back at the salt line.' : 'Wave ' + st.wave + ' broke through.'}</p>

    <span>Salt raked</span><span>${st.stats.mined}</span><span>Salt banked</span><span>${st.stats.banked}</span><span>Shots fired</span><span>${st.stats.fired}</span>
    <span>Leaks</span><span>${st.stats.leaks}</span><span>Buildings chewed</span><span>${st.stats.chewed || 0}</span><span>Waves called early</span><span>${st.stats.called}</span></div>

}
function resume() { hideCard(); paused = false; lastT = performance.now(); }

/* ---------- INPUT ---------- */
function cellFromEvent(e) { const r = cv.getBoundingClientRect(); const x = Math.floor((e.clientX - r.left) / S), y = Math.floor((e.clientY - r.top) / S); return (x >= 0 && y >= 0 && x < Rules.W && y < Rules.H) ? { x, y } : null; }
let drag = null;
function beltSmartDir(x, y) {
  // continue an incoming belt; else point at an adjacent turret/kiln/keep; else last used direction
  for (let d = 0; d < 4; d++) { const nx = x - DX[d], ny = y - DY[d]; if (nx < 0 || ny < 0 || nx >= Rules.W || ny >= Rules.H) continue; const n = state.grid[Rules.idx(nx, ny)]; if (n && n.k === 'belt' && n.d === d) return d; }
  for (let d = 0; d < 4; d++) { const nx = x + DX[d], ny = y + DY[d]; if (nx < 0 || ny < 0 || nx >= Rules.W || ny >= Rules.H) continue;
    if (Rules.T(nx, ny) === 'c') return d; const n = state.grid[Rules.idx(nx, ny)]; if (n && (DATA.buildings[n.k].ammo || n.k === 'kiln')) return d; }
  return state.beltDir;
}
function applyTap(c) {
  const occ = state.grid[Rules.idx(c.x, c.y)];
  if (tool === 'scrap') { Rules.scrap(state, c.x, c.y); }
  else if (tool === 'belt') {
    if (occ && occ.k === 'belt') Rules.setBeltDir(state, c.x, c.y, (occ.d + 1) & 3);
    else if (occ) inspect(occ, c);
    else Rules.place(state, 'belt', c.x, c.y, beltSmartDir(c.x, c.y));
  } else if (occ) inspect(occ, c);
  else Rules.place(state, tool, c.x, c.y);
  Storage.save(state); handleEvents();
}
let inspectAt = { x: 0, y: 0 };
function inspect(b, at) {
  if (at) inspectAt = at;
  const B = DATA.buildings[b.k]; let t = B.name;
  if (B.ammo) t += ' · ammo ' + b.ammo + '/' + B.maxAmmo + (b.ammo < 1 ? ' · empty, feed it ' + B.ammo : '');
  if (b.k === 'kiln') t += ' · salt ' + b.buf + '/' + B.cap + ' · bricks ' + b.out;
  if (b.k === 'belt') {
    if (b.bad && b.jam > 0.4) { const nx = inspectAt.x + DX[b.d], ny = inspectAt.y + DY[b.d]; const nb = state.grid[Rules.idx(nx, ny)];
      t += nb ? ' · jammed: the ' + DATA.buildings[nb.k].name + (nb.k === 'mortar' ? ' only takes Bricks' : nb.k === 'belt' ? ' points back into it' : ' can\'t take ' + b.items[0].t) : ' · jammed: it points at nothing'; }

}
cv.addEventListener('pointerdown', e => {
  Sound.init(); keyboardMode = false; if (paused || state.phase !== 'play') return;
  const c = cellFromEvent(e); if (!c) return; cv.setPointerCapture(e.pointerId);
  hover = c; drag = { start: c, last: c, moved: false, placedStart: false, touch: e.pointerType !== 'mouse' };
  if (tool === 'scrap') { Rules.scrap(state, c.x, c.y); drag.placedStart = true; handleEvents(); }
});
cv.addEventListener('pointermove', e => {
  const c = cellFromEvent(e); if (e.pointerType === 'mouse' || drag) hover = c;
  if (!drag || !c) return;
  if (c.x === drag.last.x && c.y === drag.last.y) return;
  if (tool === 'belt') {
    // walk from last to c one orthogonal step at a time
    let cx = drag.last.x, cy = drag.last.y, guard = 0;
    while ((cx !== c.x || cy !== c.y) && guard++ < 30) {
      const dx = c.x - cx, dy = c.y - cy; const d = Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
      // the cell we leave points toward the cell we enter
      const prev = state.grid[Rules.idx(cx, cy)];
      if (prev && prev.k === 'belt') Rules.setBeltDir(state, cx, cy, d);
      else if (!prev && Rules.canPlace(state, 'belt', cx, cy).ok) Rules.place(state, 'belt', cx, cy, d);
      cx += DX[d]; cy += DY[d];
      const here = state.grid[Rules.idx(cx, cy)];
      if (!here && Rules.canPlace(state, 'belt', cx, cy).ok) Rules.place(state, 'belt', cx, cy, d);
      else if (here && here.k === 'belt') Rules.setBeltDir(state, cx, cy, d);
      state.beltDir = d;
    }
    drag.moved = true; handleEvents();
  } else if (tool === 'scrap') { Rules.scrap(state, c.x, c.y); handleEvents(); drag.moved = true; }
  drag.last = c;
});
function endDrag(e) {
  if (!drag) return;
  const c = cellFromEvent(e) || drag.last;
  if (!drag.moved && !drag.placedStart) applyTap(c);
  else if (tool !== 'belt' && tool !== 'scrap' && c) applyTap(c); // press, slide, release to place
  else Storage.save(state);
  drag = null; if (e.pointerType !== 'mouse') hover = null;
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', () => { drag = null; hover = null; });
cv.addEventListener('pointerleave', e => { if (!drag && e.pointerType === 'mouse') hover = null; });

$('bPause').onclick = () => { Sound.init(); if (state.phase !== 'play') return; paused = true; pauseScreen(); };
$('bSpeed').onclick = () => { Sound.init(); speed = speed === 1 ? 2 : speed === 2 ? 3 : 1; $('bSpeed').textContent = speed + 'x'; Sound.play('click'); };
$('bCall').onclick = () => { Sound.init(); if (Rules.callWave(state)) {} else if (state.wave === 0) {} Storage.save(state); handleEvents(); refreshHud(); };

window.addEventListener('keydown', e => {
  if (!$('overlay').hidden) { if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { if (state && state.phase === 'play') resume(); } return; }
  const k = e.key;
  const order = DATA.toolOrder.filter(t => state.unlocked[t]);
  if (/^[1-9]$/.test(k) && order[+k - 1]) { selectTool(order[+k - 1]); return; }
  const mv = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3, w: 0, d: 1, s: 2, a: 3 }[k];
  if (mv != null) { e.preventDefault(); keyboardMode = true; const nx = cursor.x + DX[mv], ny = cursor.y + DY[mv];
    if (nx >= 0 && ny >= 0 && nx < Rules.W && ny < Rules.H) {
      if (e.shiftKey && tool === 'belt') { const here = state.grid[Rules.idx(cursor.x, cursor.y)]; if (!here) Rules.place(state, 'belt', cursor.x, cursor.y, mv); else if (here.k === 'belt') Rules.setBeltDir(state, cursor.x, cursor.y, mv); handleEvents(); }
      cursor = { x: nx, y: ny }; }
    return; }
  if (k === 'Enter' || k === ' ') { e.preventDefault(); keyboardMode = true; Sound.init(); applyTap(cursor); return; }
  if (k === 'r' || k === 'R') { const here = state.grid[Rules.idx(cursor.x, cursor.y)]; if (here && here.k === 'belt' && keyboardMode) Rules.setBeltDir(state, cursor.x, cursor.y, (here.d + 1) & 3); else state.beltDir = (state.beltDir + 1) & 3; handleEvents(); return; }
  if (k === 'n' || k === 'N') { $('bCall').click(); return; }
  if (k === 'p' || k === 'P' || k === 'Escape') { $('bPause').click(); return; }
  if (k === 'f' || k === 'F') { $('bSpeed').click(); return; }
  if ((k === 'u' || k === 'U') && Object.keys(state.upAvail).length) { worksScreen(); return; }
  if (k === '`') { debug = !debug; return; }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state) { Storage.save(state); if (state.phase === 'play' && $('overlay').hidden) { paused = true; pauseScreen(); } } });

/* ---------- LAYOUT ---------- */
function layout() {
  const st = $('stage').getBoundingClientRect();
  S = Math.max(18, Math.floor(Math.min(st.width / Rules.W, st.height / Rules.H)));
  DPR = Math.min(3, window.devicePixelRatio || 1);
  cv.style.width = Rules.W * S + 'px'; cv.style.height = Rules.H * S + 'px';
  cv.width = Math.round(Rules.W * S * DPR); cv.height = Math.round(Rules.H * S * DPR);
  buildTerrain();
}
window.addEventListener('resize', layout);

/* ---------- RUN CONTROL + LOOP ---------- */
function startRun(saved) {
  state = saved || Rules.newGame();
  tool = state.tut === 0 ? 'rake' : 'belt'; hudCache = ''; fx.parts = []; fx.floats = []; fx.rings = []; fx.tracers = [];
  lastPhase = state.phase;
  buildTray(); selectTool(tool); if (state.tut === 0) say('Tap a sparkly salt pan to place a Rake. The pan right beside the Keep banks salt for you.');
  hideCard(); paused = false; lastT = performance.now(); Storage.save(state);
}
let lastT = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const real = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  if (!state) return;
  if (!paused) {
    acc += real * speed; let n = 0;
    while (acc >= CONFIG.dt && n < CONFIG.maxStepsPerFrame) { Rules.step(state, CONFIG.dt); acc -= CONFIG.dt; n++; }
    if (n >= CONFIG.maxStepsPerFrame) acc = 0;
    handleEvents(); updateFx(real); coachTick(real);
    saveClock += real; if (saveClock > CONFIG.autosaveSec) { saveClock = 0; Storage.save(state); }
    if (state.phase !== lastPhase) { lastPhase = state.phase; if (state.phase !== 'play') { render(now / 1000); setTimeout(endScreen, 700); } }
  }
  refreshHud();
  Sound.mood.wave = state.phase === 'play' && (state.spawnQ.length > 0 || state.foes.length > 0);
  Sound.mood.boss = state.foes.some(f => DATA.foes[f.foe].boss); Sound.mood.night = nightLevel(now / 1000);
  Sound.tick();
  render(now / 1000);
}
// Hot-update support for the viewer (keeps a run alive across republishes)
if (window.claude && window.claude.hot && window.claude.hot.snapshot) try { window.claude.hot.snapshot(() => state ? Rules.serialize(state) : null); } catch (e) {}

state = Rules.newGame(); layout(); buildTray();
titleScreen();
requestAnimationFrame(frame);
window.__brine = { get state() { return state; }, Rules, DATA, CONFIG, startRun, worksScreen, selectTool, applyTap, get S() { return S; } };
})();
