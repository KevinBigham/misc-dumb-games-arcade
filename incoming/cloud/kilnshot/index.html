<title>Kilnshot</title>
<style>
/* Layout: one-screen app. HUD strip, the kiln yard canvas filling the middle, a thumb-reach button bar.
   Single deliberate look (daylit glaze studio: chalk-blue plaster, ochre shelves, cobalt keepers, ember orange). */

  color-scheme: light;
}

  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; background: var(--plaster);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); box-sizing: border-box; }

#hName { flex: 1; min-width: 0; font-family: var(--f-display); font-weight: 800; font-size:calc(max(12px,17px) * var(--gk-text-scale,1)); letter-spacing: .02em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hName small { font-family: var(--f-body); font-weight: 700; color: var(--ink-soft); font-size:calc(max(12px,12px) * var(--gk-text-scale,1)); letter-spacing: .08em; margin-right: 6px; }
#hEmbers { display: flex; gap: 4px; align-items: center; }
#hEmbers i { width: 11px; height: 11px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, var(--ember-hot), var(--ember) 60%, #b5370c); box-shadow: 0 0 6px rgba(255,106,31,.6); }

<script>
// ===================== KILNSHOT CORE =====================
// CONFIG + seeded RNG + pure deterministic physics/rules. No DOM in this file.
// Determinism: fixed timestep, only + - * / sqrt in the simulation (no trig),

const CONFIG = {

  MAXV: 1000,             // max launch speed

  SEG_HALF: 3,            // half thickness of ledges

  BREAK_SPEED: 150,       // impact needed to crack a flawed pot (and a good one!)
  HARD_SPEED: 470,        // impact needed to crack a thick-glazed pot
  FALL_BREAK: 120,        // a falling pot shatters on impacts above this
  PASS_KEEP: 0.72,        // ember keeps this much speed after smashing through
  REL_INHERIT: 0.3,      // released beads inherit this much of the hitter's velocity
  REL_SPREAD: 190,        // ...plus this much radial speed
  REST_SPEED: 24, REST_TIME: 0.45,
  BEAD_LIFE: 8, SHOT_MAX: 12,
  E_STONE: 0.55, F_STONE: 0.05,
  E_PEG: 0.55, E_POT: 0.4,
  SPRING_MIN: 640,        // a reed mat always throws at least this hard
  CLAY_COOL: 0.25,        // stuck embers vanish after this
  LATCH_COOLDOWN: 0.4, LATCH_MIN: 50,
  POT_MASS: 3,
  PREVIEW_T: 0.38,        // seconds of flight the aim preview shows

// 12 unit directions (precomputed so no trig runs in the sim)
const DIRS = [
  [1, 0], [0.8660254, 0.5], [0.5, 0.8660254], [0, 1], [-0.5, 0.8660254], [-0.8660254, 0.5],
  [-1, 0], [-0.8660254, -0.5], [-0.5, -0.8660254], [0, -1], [0.5, -0.8660254], [0.8660254, -0.5]

// mulberry32 seeded RNG
function makeRng(seed) {

    a = (a + 0x6D2B79F5) >>> 0;

    t = Math.imul(t ^ (t >>> 15), t | 1);

    segs.push({ x1: C.W, y1: C.WALL_TOP, x2: C.W, y2: C.H, mat: 'stone', frame: 1 });
    if (!level.pit) segs.push({ x1: 0, y1: 628, x2: C.W, y2: 628, mat: level.floor || 'stone', frame: 1 });
  }
  for (const s of (level.segs || [])) segs.push({ x1: s[0], y1: s[1], x2: s[2], y2: s[3], mat: s[4] || 'stone', gate: s[5] || null });

    id: i, x: p.x, y: p.y, r: p.r || 16, kind: p.k === 'k' ? 'keeper' : 'second',
    n: p.n || 0, hard: !!p.hard, cord: p.cord ? { ax: p.cord[0], ay: p.cord[1] } : null,
    dyn: false, vx: 0, vy: 0, rest: 0, broken: false, breaking: false

    level, segs, pots, pegs, latches, gates, fans,
    sling: { x: level.sling[0], y: level.sling[1] },
    beads: [], t: 0, steps: 0, shotT: 0, shots: 0, inShot: false,

function secondsLeft(w) { let n = 0; for (const p of w.pots) if (p.kind === 'second' && !p.broken) n++; return n; }

        const cs = { x1: p.cord.ax, y1: p.cord.ay, x2: p.x, y2: p.y - p.r };
        const c = closestOnSeg(b.x, b.y, cs); const dx = b.x - c[0], dy = b.y - c[1];
        if (dx * dx + dy * dy < (b.r + 1) * (b.r + 1)) {
          p.cord = null; p.dyn = true; p.vx = 0; p.vy = 0; p.rest = 0;
          w.events.push({ type: 'cut', x: c[0], y: c[1] });
        }
      }
      const dx = b.x - p.x, dy = b.y - p.y, R = b.r + p.r, d2 = dx * dx + dy * dy;
      if (d2 >= R * R || d2 < 1e-12) continue;
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
      const rvx = b.vx - p.vx, rvy = b.vy - p.vy;
      const imp = -(rvx * nx + rvy * ny);
      if (imp <= 0) { b.x = p.x + nx * R; b.y = p.y + ny * R; continue; }
      const thr = p.hard ? C.HARD_SPEED : C.BREAK_SPEED;
      if (imp >= thr) {
        queueBreak(w, p, b.vx, b.vy);
        b.vx *= C.PASS_KEEP; b.vy *= C.PASS_KEEP;
      } else {
        b.x = p.x + nx * R; b.y = p.y + ny * R;
        if (!p.dyn) { respond(b, nx, ny, C.E_POT, 0.05); }
        else {
          // two-body exchange, pot is heavier
          const m1 = 1, m2 = C.POT_MASS, j = (1 + C.E_POT) * imp / (1 / m1 + 1 / m2);
          b.vx += j / m1 * nx; b.vy += j / m1 * ny; p.vx -= j / m2 * nx; p.vy -= j / m2 * ny;
        }
        if (imp > 40) w.events.push({ type: 'clink', x: b.x, y: b.y, s: imp, kind: p.kind, id: p.id });
      }
    }
    // lifetime / rest / out of world
    const sp2 = b.vx * b.vx + b.vy * b.vy;
    if (sp2 < C.REST_SPEED * C.REST_SPEED) b.still += dt; else b.still = 0;
    if (b.still > C.REST_TIME || b.age > C.BEAD_LIFE || b.y > C.H + 60 || b.x < -60 || b.x > C.W + 60) b.alive = false;
  }

  // falling pots
  for (const p of w.pots) {
    if (!p.dyn || p.broken || p.breaking) continue;
    applyFields(w, p, dt);
    let hit = 0;
    for (const s of w.segs) {
      if (!segSolid(w, s)) continue;
      const c = closestOnSeg(p.x, p.y, s); let dx = p.x - c[0], dy = p.y - c[1]; const R = p.r + C.SEG_HALF;
      const d2 = dx * dx + dy * dy; if (d2 >= R * R || d2 < 1e-12) continue;
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
      p.x = c[0] + nx * R; p.y = c[1] + ny * R;
      const imp = s.mat === 'spring' ? respond(p, nx, ny, 1.0, 0) : respond(p, nx, ny, 0.3, 0.1);
      if (s.mat === 'clay') { p.vx = 0; p.vy = 0; }
      if (imp > hit) hit = imp;
    }
    for (const q of w.pegs) {
      const dx = p.x - q.x, dy = p.y - q.y, R = p.r + q.r, d2 = dx * dx + dy * dy;
      if (d2 >= R * R || d2 < 1e-12) continue;
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
      p.x = q.x + nx * R; p.y = q.y + ny * R;
      const imp = respond(p, nx, ny, 0.3, 0.1); if (imp > hit) hit = imp;
    }
    for (const q of w.pots) {
      if (q === p || q.broken || q.breaking) continue;
      const dx = p.x - q.x, dy = p.y - q.y, R = p.r + q.r, d2 = dx * dx + dy * dy;
      if (d2 >= R * R || d2 < 1e-12) continue;
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
      const rvx = p.vx - q.vx, rvy = p.vy - q.vy; const imp = -(rvx * nx + rvy * ny);
      if (imp <= 0) continue;
      p.x = q.x + nx * R; p.y = q.y + ny * R;
      const thr = q.hard ? C.HARD_SPEED : C.BREAK_SPEED;
      if (imp >= thr) queueBreak(w, q, p.vx, p.vy);
      if (!q.dyn) respond(p, nx, ny, 0.3, 0.1);
      else { const j = (1.3) * imp / 2; p.vx += j * nx; p.vy += j * ny; q.vx -= j * nx; q.vy -= j * ny; }
      if (imp > hit) hit = imp;
    }
    if (hit >= C.FALL_BREAK) { queueBreak(w, p, p.vx, p.vy); continue; }
    if (p.y > C.H + 80) { // fell out of the world: a lost pot counts as broken (it shattered below)
      queueBreak(w, p, p.vx, p.vy, true); continue;
    }
    const sp2 = p.vx * p.vx + p.vy * p.vy;
    if (sp2 < C.REST_SPEED * C.REST_SPEED) p.rest += dt; else p.rest = 0;
    if (p.rest > C.REST_TIME) { p.dyn = false; p.vx = 0; p.vy = 0; w.events.push({ type: 'settle', x: p.x, y: p.y }); }
  }

  // resolve breaks (in queue order)
  if (w.breakQueue.length) {
    const q = w.breakQueue; w.breakQueue = [];
    for (const br of q) doBreak(w, br);
  }
  // compact dead beads occasionally
  if ((w.steps & 63) === 0 && w.beads.length > 0) w.beads = w.beads.filter(b => b.alive);
}

// pots resting on a door that just swung open start to fall
function dropUnsupported(w) {
  for (const p of w.pots) {
    if (p.broken || p.dyn || p.cord) continue;
    for (const s of w.segs) {
      if (!s.gate || w.gates[s.gate]) continue;
      const c = closestOnSeg(p.x, p.y, s); const dx = p.x - c[0], dy = p.y - c[1];
      if (dy < 0 && dx * dx + dy * dy <= (p.r + CONFIG.SEG_HALF + 1.5) * (p.r + CONFIG.SEG_HALF + 1.5)) { p.dyn = true; p.vx = 0; p.vy = 0; p.rest = 0; break; }
    }
  }
}
function queueBreak(w, p, hvx, hvy, offscreen) {
  if (p.breaking || p.broken) return;
  p.breaking = true;
  w.breakQueue.push({ p, hvx, hvy, off: !!offscreen });
}
function doBreak(w, br) {
  const C = CONFIG, p = br.p;
  p.breaking = false; p.broken = true; p.dyn = false; p.cord = null;
  w.chain++;
  if (p.kind === 'keeper') w.keeperBroken = true;
  w.events.push({ type: 'break', x: p.x, y: p.y, kind: p.kind, chain: w.chain, id: p.id, n: p.n, off: br.off });
  if (p.n > 0 && !br.off) {
    // fountain: beads fan evenly across the upper half-circle, then inherit part of the hit
    for (let i = 0; i < p.n; i++) {
      const ux = p.n === 1 ? 0 : -0.94 + 1.88 * i / (p.n - 1);
      const uy = -Math.sqrt(1 - ux * ux);
      const vx = br.hvx * C.REL_INHERIT + ux * C.REL_SPREAD;
      const vy = br.hvy * C.REL_INHERIT + uy * C.REL_SPREAD;
      w.beads.push(mkBead(w, p.x + ux * p.r * 0.5, p.y + uy * p.r * 0.5, vx, vy, 1));
    }
  }
}

function shotOver(w) {
  if (!w.inShot) return true;
  if (w.shotT > CONFIG.SHOT_MAX) return true;
  if (w.breakQueue.length) return false;
  for (const b of w.beads) if (b.alive) return false;
  for (const p of w.pots) if (p.dyn && !p.broken) return false;
  return true;
}
function endShot(w) {
  w.inShot = false; w.beads = []; w.breakQueue = [];
  for (const p of w.pots) if (p.dyn && !p.broken) { p.dyn = false; p.vx = 0; p.vy = 0; } // freeze anything still sliding at timeout
}

// Run a whole shot to completion. Returns summary.
function runShot(w, vx, vy, onStep) {
  const s0 = secondsLeft(w);
  launch(w, vx, vy);
  let guard = 0;
  while (!shotOver(w) && guard++ < 1e6) { step(w); if (onStep) onStep(w); else w.events.length = 0; }
  endShot(w);
  return { broke: s0 - secondsLeft(w), keeper: w.keeperBroken, left: secondsLeft(w) };
}

// Replay a full attempt from level data
function replay(level, shots) {
  const w = makeWorld(level);
  for (const s of shots) { if (w.keeperBroken || secondsLeft(w) === 0) break; runShot(w, s[0], s[1]); }
  w.events.length = 0;
  return w;
}

// Aim preview: simulate the ember alone from the sling, through one stone bounce, until the next contact or PREVIEW_T.
function preview(w, vx, vy, maxT) {
  const C = CONFIG; const v = clampLaunch(vx, vy);
  const b = { x: w.sling.x, y: w.sling.y, vx: v[0], vy: v[1], r: C.BEAD_R };
  const pts = []; const T = maxT || C.PREVIEW_T; let t = 0, k = 0, bounces = 1;
  while (t < T) {
    applyFields(w, b, C.DT); t += C.DT; k++;
    if ((k % 8) === 0) pts.push([b.x, b.y]);
    let hit = false;
    for (const s of w.segs) {
      if (!segSolid(w, s)) continue;
      const c = closestOnSeg(b.x, b.y, s); let dx = b.x - c[0], dy = b.y - c[1]; const R = b.r + C.SEG_HALF, d2 = dx * dx + dy * dy;
      if (d2 >= R * R) continue;
      // bounce once off plain stone (walls, shelves) so a bank shot shows its line; stop at anything else
      if (bounces > 0 && s.mat === 'stone' && d2 > 0) {
        const d = Math.sqrt(d2); dx /= d; dy /= d; const vn = b.vx * dx + b.vy * dy;
        if (vn < 0) { b.vx -= (1 + C.E_STONE) * vn * dx; b.vy -= (1 + C.E_STONE) * vn * dy; }
        b.x = c[0] + dx * R; b.y = c[1] + dy * R; bounces--; pts.push([b.x, b.y]);
      } else hit = true;
      break;
    }
    if (!hit) for (const p of w.pots) { if (p.broken) continue; const dx = b.x - p.x, dy = b.y - p.y, R = b.r + p.r; if (dx * dx + dy * dy < R * R) { hit = true; break; } }
    if (!hit) for (const p of w.pegs) { const dx = b.x - p.x, dy = b.y - p.y, R = b.r + p.r; if (dx * dx + dy * dy < R * R) { hit = true; break; } }
    if (!hit) for (const p of w.latches) { const dx = b.x - p.x, dy = b.y - p.y, R = b.r + p.r; if (dx * dx + dy * dy < R * R) { hit = true; break; } }
    if (hit) { pts.push([b.x, b.y]); break; }
  }
  return pts;
}

// World snapshot used by Renderer/tests to compare states
function boardKey(w) {
  return w.pots.map(p => p.broken ? 'x' : (Math.round(p.x) + ',' + Math.round(p.y) + (p.cord ? 'c' : ''))).join('|') + '#' + Object.keys(w.gates).sort().map(k => k + (w.gates[k] ? 1 : 0)).join('');
}
function cloneWorld(w) {
  return {
    level: w.level, segs: w.segs, pegs: w.pegs, fans: w.fans, sling: w.sling,
    pots: w.pots.map(p => Object.assign({}, p, { cord: p.cord ? Object.assign({}, p.cord) : null })),
    latches: w.latches.map(l => Object.assign({}, l, { t: l.t })),
    gates: Object.assign({}, w.gates), beads: [], t: w.t, steps: w.steps, shotT: 0, shots: w.shots, inShot: false,
    keeperBroken: w.keeperBroken, events: [], chain: 0, breakQueue: [], nextBeadId: w.nextBeadId,
  };
}

function starsFor(level, shots) { if (shots <= level.par) return 3; if (shots <= level.par + 1) return 2; return 1; }

// Some levels are authored on the left and flipped here, so throws don't all bank off the same wall.
function mirrorLevel(l) {
  const W = CONFIG.W, fx = (x) => W - x;

// ===================== KILNSHOT DAILY KILN =====================
// A seeded level generator plus a small greedy solver that sets the day's par.
// Everyone gets the same level and par for a date (seeded RNG + deterministic physics).

function genDaily(seed) {
  const rnd = makeRng(seed);
  const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
  const slingX = pick([56, 56, 180]);
  const lvl = { id: 'D' + seed, ch: 0, name: 'Daily Kiln', par: 3, sling: [slingX, 556], hint: 'Today’s firing. Beat the kiln’s par.', segs: [], pots: [], pegs: [] };
  // ledges
  const ledges = [];
  const nL = ri(2, 4);
  for (let t = 0; t < 40 && ledges.length < nL; t++) {
    const w = ri(6, 14) * 10, x = ri(10, 34) * 10 - w / 2, y = ri(18, 50) * 10;
    if (x < 10 || x + w > 350) continue;
    if (Math.abs(x + w / 2 - slingX) < 70 && y > 430) continue;
    let ok = true;
    for (const L of ledges) if (x < L.x + L.w + 30 && L.x < x + w + 30 && Math.abs(y - L.y) < 90) ok = false;
    if (!ok) continue;
    ledges.push({ x, y, w });
    lvl.segs.push([x, y, x + w, y]);
  }
  // spots where pots can sit
  const spots = [];
  for (const L of ledges) for (let px = L.x + 18; px <= L.x + L.w - 18; px += 34) spots.push([px, L.y - 19]);
  for (let px = 130; px <= 340; px += 34) if (Math.abs(px - slingX) > 80) spots.push([px, 609]);
  // shuffle spots
  for (let i = spots.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = spots[i]; spots[i] = spots[j]; spots[j] = t; }
  const nS = ri(3, 5), nK = ri(0, 2);
  for (let i = 0; i < nS && spots.length; i++) { const s = spots.pop(); lvl.pots.push({ x: s[0], y: s[1] }); }
  for (let i = 0; i < nK && spots.length; i++) { const s = spots.pop(); lvl.pots.push({ x: s[0], y: s[1], k: 'k' }); }
  // a jar? (the highest second becomes a jar)
  if (rnd() < 0.6) {
    let hi = null; for (const p of lvl.pots) if (p.k !== 'k' && (!hi || p.y < hi.y)) hi = p;
    if (hi) hi.n = ri(4, 7);
  }
  // a hanging pot?
  if (rnd() < 0.35) {
    const x = ri(12, 32) * 10, y = ri(14, 26) * 10;
    let clear = true; for (const p of lvl.pots) if (Math.abs(p.x - x) < 40 && Math.abs(p.y - y) < 60) clear = false;
    for (const L of ledges) if (x > L.x - 20 && x < L.x + L.w + 20 && L.y < y + 40) clear = false;
    if (clear) lvl.pots.push({ x, y, cord: [x, ri(3, 8) * 10], n: rnd() < 0.5 ? 4 : 0 });
  }
  // a reed mat on the floor?
  if (rnd() < 0.3) { const x = ri(12, 26) * 10; if (Math.abs(x + 40 - slingX) > 90) lvl.segs.push([x, 621, x + 80, 621, 'spring']); }
  return lvl;
}

// Greedy daily solver, coarse to fine so it runs in a few seconds on a phone.
// Each round: fire a coarse launch grid, take the most promising cells, test a fine 3x3 around each,
// and keep the best shot whose neighbours mostly agree (a robust, human-repeatable throw).
// It is a generator: it yields progress 0..1 so the page can time-slice it.
function* dailySolve(lvl, maxShots) {
  const M = CONFIG.MAXV, CO = 80, FI = 40, coarse = [];
  for (let vx = -M; vx <= M; vx += CO) for (let vy = -M; vy <= 400; vy += CO) { const s = vx * vx + vy * vy; if (s <= M * M && s >= 160 * 160) coarse.push([vx, vy]); }
  const shots = []; const w = makeWorld(lvl);
  for (let k = 0; k < maxShots; k++) {
    const cache = new Map(); const left0 = secondsLeft(w), key0 = boardKey(w);
    const score = (vx, vy) => {
      const id = vx + ',' + vy; if (cache.has(id)) return cache.get(id);
      const s = vx * vx + vy * vy; let r = 0;
      if (s <= M * M && s >= 120 * 120) { const c = cloneWorld(w); runShot(c, vx, vy); r = c.keeperBroken ? -1 : (left0 - secondsLeft(c)) * 1000 + (boardKey(c) === key0 ? 0 : 1); }
      cache.set(id, r); return r;
    };
    let i = 0;
    for (const v of coarse) { score(v[0], v[1]); if ((++i & 15) === 0) yield (k + 0.8 * i / coarse.length) / maxShots; }
    const cands = coarse.filter(v => cache.get(v[0] + ',' + v[1]) > 0).sort((a, b) => cache.get(b[0] + ',' + b[1]) - cache.get(a[0] + ',' + a[1])).slice(0, 8);
    let best = null, bestScore = 0, ci = 0;
    for (const c of cands) {
      const r = score(c[0], c[1]); let same = 0;
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) if ((dx || dy) && score(c[0] + dx * FI, c[1] + dy * FI) === r) same++;
      yield (k + 0.8 + 0.2 * (++ci) / cands.length) / maxShots;
      if (same < 3) continue;
      const sc = r * 10 + same; if (sc > bestScore) { bestScore = sc; best = c; }
    }
    if (!best) return { ok: false, shots };
    shots.push(best); runShot(w, best[0], best[1]);
    if (secondsLeft(w) === 0) return { ok: true, shots, par: shots.length };
  }
  return { ok: false, shots };
}

function dailyRow(dateStr) {
  if (typeof DAILY_TABLE === 'undefined') return null;
  const a = Date.UTC(+DAILY_TABLE.start.slice(0, 4), +DAILY_TABLE.start.slice(5, 7) - 1, +DAILY_TABLE.start.slice(8, 10));
  const b = Date.UTC(+dateStr.slice(0, 4), +dateStr.slice(5, 7) - 1, +dateStr.slice(8, 10));
  const i = Math.round((b - a) / 864e5); const rows = DAILY_TABLE.rows.split('|');
  if (!(i >= 0 && i < rows.length)) return null;
  const n = rows[i].split(' ').map(Number); if (n.length < 4 || n.some(x => !Number.isFinite(x))) return null;
  const proof = []; for (let k = 2; k + 1 < n.length; k += 2) proof.push([n[k], n[k + 1]]);
  return { sub: n[0], par: n[1], proof };
}

// Build the daily level for a date string like "2026-11-06": tries a few sub-seeds until one is solvable.
function* buildDaily(dateStr) {
  const base = hashStr('kilnshot:' + dateStr);
  // fast path: the precomputed cache, re-proven here by replaying its throws
  const row = dailyRow(dateStr);
  if (row) {
    const lvl = genDaily((base + row.sub * 7919) >>> 0);
    if (validateLevel(lvl).ok) {
      const w = replay(lvl, row.proof);
      if (secondsLeft(w) === 0 && !w.keeperBroken && row.proof.length === row.par) { lvl.par = row.par; lvl.proof = row.proof; lvl.date = dateStr; return lvl; }
    }
  }
  for (let t = 0; t < 12; t++) {
    const lvl = genDaily((base + t * 7919) >>> 0);
    if (!validateLevel(lvl).ok) continue;
    if (secondsTotal(makeWorld(lvl)) < 2) continue;
    const g = dailySolve(lvl, 4); let r;
    while (true) { const n = g.next(); if (n.done) { r = n.value; break; } yield (t + n.value) / 12; }
    if (r.ok) { lvl.par = r.par; lvl.proof = r.shots; lvl.date = dateStr; return lvl; }
  }
  // fallback: a hand-made easy level so the day always has a firing
  const fb = JSON.parse(JSON.stringify(LEVELS[0])); fb.id = 'D' + base; fb.name = 'Daily Kiln'; fb.date = dateStr; fb.proof = null; return fb;
}

// Content validator (Untrusted-style): every level must be well formed and winnable in principle.
function validateLevel(l) {
  const errs = [];
  const num = (v) => typeof v === 'number' && isFinite(v);
  if (!l || typeof l !== 'object') return { ok: false, errs: ['not an object'] };
  if (!Array.isArray(l.sling) || !num(l.sling[0]) || !num(l.sling[1])) errs.push('bad sling');
  if (!(l.par >= 1)) errs.push('bad par');
  const pots = l.pots || [];
  if (!pots.some(p => p.k !== 'k')) errs.push('no cracked pot to break');
  for (const p of pots) {
    if (!num(p.x) || !num(p.y)) errs.push('bad pot');
    if (p.x < 0 || p.x > CONFIG.W || p.y > 628) errs.push('pot out of bounds');
    if (Math.abs(p.x - l.sling[0]) < 30 && Math.abs(p.y - l.sling[1]) < 30) errs.push('pot on the sling');
  }
  for (let i = 0; i < pots.length; i++) for (let j = i + 1; j < pots.length; j++) {
    const a = pots[i], b = pots[j], r = (a.r || 16) + (b.r || 16);
    if ((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y) < (r - 1) * (r - 1)) errs.push('pots overlap ' + i + ',' + j);
  }
  for (const s of (l.segs || [])) if (s.length < 4 || !s.slice(0, 4).every(num)) errs.push('bad ledge');
  return { ok: errs.length === 0, errs };
}

// ---------------- Game flow ----------------

  let n = 0; for (let i = 0; i < LEVELS.length; i++) if (Storage.data.best[LEVELS[i].id]) n = i + 1;
  let open = 0, out = new Set(); for (let i = 0; i < LEVELS.length; i++) { if (Storage.data.best[LEVELS[i].id]) out.add(i); else if (open < 2 && i <= n + 1) { out.add(i); open++; } }

  S.aim = null; S.fx = []; S.texts = []; S.trails.clear(); S.result = null; S.mode = 'play';

      Storage.data.daily.fired = Object.keys(Storage.data.daily.best).length;
    } else {

// ---------------- Main loop ----------------
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - (S.last || now)) / 1000); S.last = now;
  if (S.mode === 'shot' && S.world) {
    if (S.hitStop > 0) S.hitStop -= dt;
    else {
      S.acc += dt * (S.hold ? 3 : 1);
      let n = 0;
      while (S.acc >= C.DT && n < 240) { step(S.world); S.acc -= C.DT; n++; if (S.world.events.length) { handleEvents(S.world); if (S.hitStop > 0) { S.acc = 0; break; } } if (shotOver(S.world)) { finishShot(); break; } }

}
stage.addEventListener('pointerup', (e) => endAim(e, false));
stage.addEventListener('pointercancel', (e) => endAim(e, true));
window.addEventListener('blur', () => { S.aim = null; S.hold = false; });

window.addEventListener('keydown', (e) => {
  if (document.querySelector('.gk-prefs')) return;
  Audio.init();
  const k = e.key;
  if (!$('ov').hidden) {
    if (k === 'Escape' && S.level && S.mode !== 'title') { if (S.mode === 'over') return; hideOverlay(); }
    return;
  }
  if (k === 'r' || k === 'R') { retry(); return; }
  if (k === 'Escape' || k === 'm' || k === 'M') { showSelect(); return; }
  if (k === 'h' || k === '?') { showHint(true); return; }
  if (S.mode === 'shot' && (k === ' ' || k === 'Enter')) { S.hold = true; e.preventDefault(); return; }
  if (S.mode !== 'play') return;
  const A = S.kbAim; let ang = Math.atan2(A.ay, A.ax), used = true;
  if (k === 'ArrowLeft') ang -= e.shiftKey ? 0.004 : 0.03; else if (k === 'ArrowRight') ang += e.shiftKey ? 0.004 : 0.03;
  else if (k === 'ArrowUp') A.p = Math.min(1, A.p + (e.shiftKey ? 0.004 : 0.025)); else if (k === 'ArrowDown') A.p = Math.max(0.1, A.p - (e.shiftKey ? 0.004 : 0.025));
  else if (k === ' ' || k === 'Enter') { const v = [A.ax * A.p * C.MAXV, A.ay * A.p * C.MAXV]; S.aim = null; fire(v[0], v[1]); e.preventDefault(); return; }
  else used = false;
  if (used) {
    e.preventDefault(); A.ax = Math.cos(ang); A.ay = Math.sin(ang);
    const w = S.world, L = A.p * C.MAXV / C.POWER; // show it as a pull from the sling
    S.aim = { sx: w.sling.x, sy: w.sling.y, cx: w.sling.x - A.ax * L, cy: w.sling.y - A.ay * L, kb: true };
  }
});
window.addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'Enter') S.hold = false; });

// ---------------- UI ----------------
function updateHud() {
  const l = S.level; if (!l) { $('hName').textContent = 'Kilnshot'; $('hEmbers').innerHTML = ''; $('hPar').textContent = ''; return; }
  $('hName').innerHTML = `<small>${levelLabel(l)}</small>${esc(l.name)}`;
  const tot = embersFor(l), used = S.shots.length; let h = '';
  for (let i = 0; i < tot; i++) h += `<i class="${i < used ? 'spent' : ''}"></i>`;
  $('hEmbers').innerHTML = h; $('hPar').textContent = 'PAR ' + l.par;
  $('bSound').setAttribute('aria-label', Storage.data.sound ? 'Sound on' : 'Sound off'); $('bSound').style.opacity = Storage.data.sound ? 1 : 0.45;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function showHint(force) { if (!S.level) return; const h = $('hint'); h.textContent = S.level.hint; h.classList.remove('off'); S.hintT = force ? 6 : 4; }
function hideHint() { $('hint').classList.add('off'); S.hintT = 0; }
let toastT = 0;
function toast(s) { const t = $('toast'); t.textContent = s; t.style.opacity = s ? 1 : 0; clearTimeout(toastT); if (s) toastT = setTimeout(() => { t.style.opacity = 0; }, 1600); }
function showOverlay(html) { $('card').innerHTML = html; $('ov').hidden = false; const b = $('card').querySelector('button.primary') || $('card').querySelector('button'); if (b) try { b.focus({ preventScroll: true }); } catch (e) {} }
function hideOverlay() { $('ov').hidden = true; }
function totalStars() { let s = 0; for (const k in Storage.data.best) s += Storage.data.best[k].stars; return s; }
function nextUnbeaten() { for (let i = 0; i < LEVELS.length; i++) if (!Storage.data.best[LEVELS[i].id]) return i; return LEVELS.length - 1; }
function on(id, f) { const el = $(id); if (el) el.onclick = (e) => { Audio.init(); f(e); }; }

const PYW = { panel: { text: true, tips: false } };
function showTitle() {
  S.mode = 'title';
  const cur = Storage.data.cur; const resumable = cur && cur.shots.length > 0 && cur.id !== 'daily' && LEVELS.find(l => l.id === cur.id);
  showOverlay(`
    <h1>KILN<br>SHOT</h1>
    <p><b>Smash the cracked pots. Spare the good ones.</b></p>
    <div class="how">
      <b style="background:radial-gradient(circle at 40% 35%,#fff6c8,#ffc93d 40%,#ff6a1f 75%)"></b><span>Drag back anywhere, aim, let go to throw an ember.</span>
      <b style="background:#ead7b9;border:2px solid #7a5a3a"></b><span>Cracked bisque pots: break them all.</span>
      <b style="background:#2448a8;border:2px solid #0c1d4a"></b><span>Blue keepers: one crack and the firing fails.</span>
      <b style="background:#c58b3c;border:2px solid #8d5d22"></b><span>Fewest throws earns 3 stars. Hold the screen to speed up a throw.</span>
    </div>
    <div class="col">
      <button class="primary" id="tPlay">${resumable ? 'Continue' : (totalStars() ? 'Play' : 'Start firing')}</button>
      <div class="row"><button id="tLevels">Levels</button><button id="tDaily">Daily kiln</button></div>
    </div>
    <p class="tiny">${totalStars()} of ${LEVELS.length * 3} stars${Storage.data.daily.fired ? ' · ' + Storage.data.daily.fired + ' daily firings' : ''}${Storage.data.recovered ? ' · your old save could not be read, so it was set aside and a fresh one started' : ''}</p>`);
  on('tPlay', () => { if (resumable) startLevel(LEVELS.find(l => l.id === cur.id), cur.shots); else startLevel(LEVELS[nextUnbeaten()]); });
  on('tLevels', showSelect); on('tDaily', startDaily);
  $('card').querySelector('.col').appendChild(GK.ui.prefsButton(PYW));
}
function showSelect() {
  if (S.mode === 'shot') return;
  const open = unlockedIdx(); let h = `<h2>Levels</h2><p class="sub">${totalStars()} of ${LEVELS.length * 3} stars. Clear a level to open the next ones. ◆ means you beat the kiln’s par.</p>`;
  for (const ch of CHAPTERS) {
    h += `<div class="chap"><h3>${ch.n}. ${esc(ch.name)}</h3><p>${esc(ch.idea)}</p><div class="tiles">`;
    LEVELS.forEach((l, i) => {
      if (l.ch !== ch.n) return; const b = Storage.data.best[l.id]; const lk = !open.has(i);
      h += `<button data-i="${i}" class="${lk ? 'locked' : ''}" ${lk ? 'aria-disabled="true"' : ''}>${levelLabel(l)}<span>${esc(l.name)}</span><em>${b ? '★'.repeat(b.stars) + '<span style="color:#c8d4d6">' + '★'.repeat(3 - b.stars) + '</span>' + (b.shots < l.par ? '<span style="color:#ff6a1f" aria-label="beat par"> ◆</span>' : '') : (lk ? 'locked' : '· · ·')}</em></button>`;
    });
    h += '</div></div>';
  }
  h += `<div class="row"><button id="sBack">Back</button><button id="sDaily">Daily kiln</button></div>
    <div class="row"><button id="sDebug" style="font-size:calc(max(12px,12px) * var(--gk-text-scale,1));min-height:36px">${Storage.data.debug ? 'Hide' : 'Show'} physics overlay</button></div>`;
  showOverlay(h);
  $('card').querySelectorAll('button[data-i]').forEach(b => b.onclick = () => {
    Audio.init(); const i = +b.dataset.i; if (!open.has(i)) { b.textContent = 'Clear an earlier level first'; return; }
    const l = LEVELS[i]; const cur = Storage.data.cur; startLevel(l, cur && cur.id === l.id ? cur.shots : []);
  });
  on('sBack', () => { if (S.level && S.mode !== 'title' && S.mode !== 'over') hideOverlay(); else showTitle(); });
  on('sDaily', startDaily);
  on('sDebug', () => { Storage.data.debug = !Storage.data.debug; Storage.save(); showSelect(); });
  $('sDebug').parentNode.insertBefore(GK.ui.prefsButton(PYW), $('sDebug'));
}
function starsHtml(n) { return `<div class="stars" aria-label="${n} of 3 stars">${'★'.repeat(n)}<span class="dim">${'★'.repeat(3 - n)}</span></div>`; }
function showResult() {
  const r = S.result, l = S.level;
  if (r.kind === 'won') {
    const beat = r.shots < l.par;
    let h = `<h2>${beat ? 'Master firing!' : r.stars === 3 ? 'Clean firing!' : 'Fired!'}</h2>${starsHtml(r.stars)}
      <p>${r.shots} ${r.shots === 1 ? 'throw' : 'throws'} · par ${l.par}${beat ? ' · you beat the kiln’s par' : ''}</p>`;
    if (S.isDaily) {
      const share = `Kilnshot daily ${l.date}\n${r.shots} ${r.shots === 1 ? 'throw' : 'throws'} (par ${l.par}) ${'★'.repeat(r.stars)}${'☆'.repeat(3 - r.stars)}`;
      h += `<div class="share" id="shareTxt">${esc(share)}</div><div class="row"><button id="rCopy">Copy result</button><button class="primary" id="rRetry">Fire again</button></div><div class="row"><button id="rLevels">Levels</button></div>`;
      showOverlay(h);
      on('rCopy', () => { const t = $('shareTxt').textContent; const done = () => { $('rCopy').textContent = 'Copied'; };
        try { navigator.clipboard.writeText(t).then(done, () => selectText($('shareTxt'))); } catch (e) { selectText($('shareTxt')); } });
    } else {
      const hasNext = S.levelIdx < LEVELS.length - 1;
      h += `<div class="row"><button id="rRetry">Retry</button>${hasNext ? '<button class="primary" id="rNext">Next level</button>' : '<button class="primary" id="rLevels2">All levels</button>'}</div><div class="row"><button id="rLevels">Levels</button></div>`;
      if (!hasNext) h += `<p class="sub">That was the last firing. Try the daily kiln for a new level every day.</p>`;
      showOverlay(h);
      on('rNext', () => startLevel(LEVELS[S.levelIdx + 1])); on('rLevels2', showSelect);
    }
  } else {
    const msg = r.kind === 'keeper' ? ['A keeper cracked', 'The blue pots are good work. Find a line that misses them.'] : ['Out of embers', `${secondsLeft(S.world)} cracked ${secondsLeft(S.world) === 1 ? 'pot is' : 'pots are'} still standing. Look for a throw that chains.`];
    showOverlay(`<h2>${msg[0]}</h2><p class="sub">${msg[1]}</p><div class="row"><button class="primary" id="rRetry">Retry (R)</button></div><div class="row"><button id="rLevels">Levels</button></div>`);
  }
  on('rRetry', retry); on('rLevels', showSelect);
}
function selectText(el) { try { const r = document.createRange(); r.selectNodeContents(el); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {} }

function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function startDaily() {
  const date = todayStr(); const c = Storage.data.daily.cache;
  if (c && c.date === date) { const cur = Storage.data.cur; startLevel(c.level, cur && cur.id === 'daily' ? cur.shots : [], true); return; }
  if (S.dailyBuilding) return; S.dailyBuilding = true;
  showOverlay(`<h2>Firing today’s kiln</h2><p class="sub">Building ${date}’s level and finding its par. Everyone gets the same one.</p><div class="bar-prog"><i id="dProg"></i></div>`);
  const gen = buildDaily(date); let lvl = null;
  const pump = () => {
    const t0 = performance.now();
    while (performance.now() - t0 < 24) { const n = gen.next(); if (n.done) { lvl = n.value; break; } const pr = $('dProg'); if (pr) pr.style.width = Math.round(n.value * 100) + '%'; }
    if (!lvl) { setTimeout(pump, 0); return; }
    S.dailyBuilding = false;
    Storage.data.daily.cache = { date, level: lvl }; if (Storage.data.cur && Storage.data.cur.id === 'daily') Storage.data.cur = null; Storage.save();
    startLevel(lvl, [], true);
  };
  setTimeout(pump, 30);
}

on('bMenu', showSelect); on('bRetry', retry); on('bHint', () => showHint(true));
on('bSound', () => { Storage.data.sound = !Storage.data.sound; Storage.save(); Audio.setOn(Storage.data.sound); updateHud(); toast(Storage.data.sound ? 'Sound on' : 'Sound off'); });

// ---------------- Boot ----------------
Storage.load(); fit(); updateHud();
GK.studio();
GK.coach.create('kilnshot-first', [{ target: () => { const w = S.world; if (!w) return null; const r = cv.getBoundingClientRect(); return { x: r.left + w.sling.x * scale, y: r.top + w.sling.y * scale, r: 34 }; },
  done: () => S.shots.length > 0 || totalStars() > 0 || Storage.data.daily.fired > 0 }],
  { when: () => S.mode === 'play' && $('ov').hidden && !S.aim });
GK.wired('motion', 'shake, shard/spark bursts and spring shimmer scale with the level; hint, toast and progress CSS follow it');
GK.wired('flash', 'keeper-cracked flash');
GK.wired('text', 'page CSS floor and scale; floating words; jar badges, door and latch letters left as board art');
GK.wired('combo', 'own ladder kept: chain breaks climb the game pentatonic scale');
// if the last session was mid-level, put the board back exactly (replaying the committed throws)
const cur = Storage.data.cur;
if (cur && cur.id !== 'daily' && LEVELS.find(l => l.id === cur.id) && cur.shots.length) { startLevel(LEVELS.find(l => l.id === cur.id), cur.shots); showTitle(); S.mode = S.result ? 'over' : 'title'; }
else showTitle();
requestAnimationFrame(frame);
window.__kiln = { S, Storage, fire, retry, startLevel, startDaily, showSelect, LEVELS };
})();

</script>

</body></html>
