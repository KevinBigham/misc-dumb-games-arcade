<title>Kilnshot</title>
<style>
/* Layout: one-screen app. HUD strip, the kiln yard canvas filling the middle, a thumb-reach button bar.
   Single deliberate look (daylit glaze studio: chalk-blue plaster, ochre shelves, cobalt keepers, ember orange). */
:root {
  --plaster: #cfe1e4; --plaster-d: #a9c6cc; --ink: #1e2a33; --ink-soft: #4d5f6b;
  --ochre: #c58b3c; --ochre-d: #8d5d22; --cobalt: #2448a8; --ember: #ff6a1f; --ember-hot: #ffc93d;
  --bisque: #ead7b9; --panel: #f3f0e6; --panel-edge: #b9cfd3; --good: #2f7d4a; --bad: #b2321f;
  --f-display: "Avenir Next Condensed", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", system-ui, sans-serif;
  --f-body: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: var(--plaster-d); color: var(--ink); font-family: var(--f-body); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; background: var(--plaster);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); box-sizing: border-box; }
#hud { display: flex; align-items: center; gap: 10px; padding: 8px 12px 6px; min-height: 40px; }
#hName { flex: 1; min-width: 0; font-family: var(--f-display); font-weight: 800; font-size:calc(max(12px,17px) * var(--gk-text-scale,1)); letter-spacing: .02em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hName small { font-family: var(--f-body); font-weight: 700; color: var(--ink-soft); font-size:calc(max(12px,12px) * var(--gk-text-scale,1)); letter-spacing: .08em; margin-right: 6px; }
#hEmbers { display: flex; gap: 4px; align-items: center; }
#hEmbers i { width: 11px; height: 11px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, var(--ember-hot), var(--ember) 60%, #b5370c); box-shadow: 0 0 6px rgba(255,106,31,.6); }
#hEmbers i.spent { background: #9fb4b9; box-shadow: none; }
#hPar { font-size:calc(max(12px,12px) * var(--gk-text-scale,1)); font-weight: 800; letter-spacing: .08em; color: var(--ink-soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
#stage { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#cv { display: block; touch-action: none; border-radius: 6px; }
#hint { position: absolute; left: 12px; right: 12px; top: 8px; margin: 0 auto; max-width: 420px; background: rgba(243,240,230,.94);
  border: 1px solid var(--panel-edge); border-radius: 10px; padding: 8px 12px; font-size:calc(max(12px,14px) * var(--gk-text-scale,1)); line-height: 1.35; text-align: center;
  box-shadow: 0 4px 14px rgba(30,42,51,.12); transition: opacity .35s; pointer-events: none; }
#hint.off { opacity: 0; }
#toast { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-family: var(--f-display); font-weight: 800; font-size:calc(max(12px,20px) * var(--gk-text-scale,1));
  color: var(--ink); text-shadow: 0 2px 0 rgba(255,255,255,.7); pointer-events: none; transition: opacity .3s; }
#bar { display: flex; gap: 8px; padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px)); }
#bar button, .ov button { font: inherit; font-weight: 800; font-size:calc(max(12px,15px) * var(--gk-text-scale,1)); border-radius: 12px; border: 2px solid var(--ink); background: var(--panel);
  color: var(--ink); min-height: 46px; padding: 0 14px; cursor: pointer; touch-action: manipulation; }
#bar button { flex: 1; }
#bar button.icon { flex: 0 0 52px; padding: 0; }
button:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }
button:active { transform: translateY(1px); }
button.primary { background: var(--ember); border-color: #7a2a08; color: #2a0e02; }
button:disabled { opacity: .4; }
#ov { position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(30,42,51,.38);
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.ov { width: 100%; max-width: 420px; max-height: 100%; overflow: auto; background: var(--panel); border: 2px solid var(--ink); border-radius: 18px;
  padding: 18px 16px; box-sizing: border-box; box-shadow: 0 10px 0 rgba(30,42,51,.25); display: flex; flex-direction: column; gap: 12px; }
.ov h1 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 52px; line-height: .95; letter-spacing: .01em; text-align: center;
  color: var(--ember); -webkit-text-stroke: 2px var(--ink); text-shadow: 3px 4px 0 var(--ink); text-wrap: balance; }
.ov h2 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 30px; text-align: center; text-wrap: balance; }
.ov p { margin: 0; line-height: 1.4; text-align: center; }
.ov .sub { color: var(--ink-soft); font-size:calc(max(12px,14px) * var(--gk-text-scale,1)); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row button { flex: 1 1 120px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.stars { text-align: center; font-size: 40px; letter-spacing: 6px; color: var(--ochre); text-shadow: 0 2px 0 var(--ochre-d); }
.stars .dim { color: #c8d4d6; text-shadow: none; }
.how { display: grid; grid-template-columns: 26px 1fr; gap: 6px 8px; font-size:calc(max(12px,14px) * var(--gk-text-scale,1)); line-height: 1.3; align-items: center; }
.how b { display: inline-block; width: 22px; height: 22px; border-radius: 50%; }
.chap { border-top: 1px dashed var(--panel-edge); padding-top: 10px; }
.chap h3 { margin: 0 0 2px; font-size:calc(max(12px,13px) * var(--gk-text-scale,1)); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.chap p { text-align: left; font-size:calc(max(12px,13px) * var(--gk-text-scale,1)); color: var(--ink-soft); margin-bottom: 8px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tiles button { min-height: 58px; padding: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size:calc(max(12px,13px) * var(--gk-text-scale,1)); }
.tiles button span { font-size:calc(max(12px,11px) * var(--gk-text-scale,1)); font-weight: 700; color: var(--ink-soft); line-height: 1.1; }
.tiles button em { font-style: normal; color: var(--ochre); letter-spacing: 1px; font-size:calc(max(12px,13px) * var(--gk-text-scale,1)); }
.tiles button.locked { background: #dde6e7; border-style: dashed; color: #7f9196; }
.share { font-family: ui-monospace, Menlo, monospace; font-size:calc(max(12px,13px) * var(--gk-text-scale,1)); background: #fff; border: 1px solid var(--panel-edge); border-radius: 8px; padding: 8px; white-space: pre-wrap; user-select: text; -webkit-user-select: text; }
.bar-prog { height: 10px; background: #dde6e7; border-radius: 6px; overflow: hidden; border: 1px solid var(--panel-edge); }
.bar-prog i { display: block; height: 100%; width: 0; background: var(--ember); transition: width .15s; }
.tiny { font-size:calc(max(12px,12px) * var(--gk-text-scale,1)); color: var(--ink-soft); text-align: center; }
html[data-gk-motion=calm] :is(#hint, #toast, .bar-prog i), html[data-gk-motion=still] :is(#hint, #toast, .bar-prog i) { transition: none; }
</style>
<div id="app">
  <div id="hud"><div id="hName"></div><div id="hEmbers" aria-label="Embers left"></div><div id="hPar"></div></div>
  <div id="stage"><canvas id="cv" aria-label="Kiln yard. Drag back anywhere and release to throw an ember."></canvas>
    <div id="hint" class="off"></div><div id="toast"></div>
    <div id="ov" hidden><div class="ov" id="card"></div></div>
  </div>
  <div id="bar">
    <button id="bMenu" class="icon" aria-label="Levels">&#9776;</button>
    <button id="bRetry">Retry</button>
    <button id="bHint" class="icon" aria-label="Show the hint">?</button>
    <button id="bSound" class="icon" aria-label="Sound on">&#9835;</button>
  </div>
</div>
<script>
/*CORE*/
</script>
