var HorizonAudioEngine = class {
  ctx = null;
  muted = false;
  isMuted() {
    return this.muted;
  }
  setMuted(mute) {
    this.muted = mute;
  }
  toggleMute() {
    this.muted = !this.muted;
    return this.muted;
  }
  ensureContext() {
    if (this.muted || typeof window === "undefined") return null;
    if (!this.ctx) {
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (AudioCtor) {
        try {
          this.ctx = new AudioCtor();
        } catch {
          this.ctx = null;
        }
      }
    }
    if (this.ctx && this.ctx.state === "suspended") {
      void this.ctx.resume().catch(() => {
      });
    }
    return this.ctx;
  }
  playTone(freqHz, durationSec, type = "sine", gainPeak = 0.09, slideToHz) {
    const ctx = this.ensureContext();
    if (!ctx) return;
    try {
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freqHz, now);
      if (slideToHz) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideToHz), now + durationSec);
      }
      gain.gain.setValueAtTime(1e-4, now);
      gain.gain.linearRampToValueAtTime(gainPeak, now + 0.012);
      gain.gain.exponentialRampToValueAtTime(1e-4, now + durationSec);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + durationSec + 0.02);
    } catch {
    }
  }
  playEvent(event) {
    if (this.muted) return;
    switch (event.type) {
      case "SLINGSHOT_LAUNCH":
        this.playTone(180, 0.18, "triangle", 0.08, 520);
        break;
      case "BUMPER_RICOCHET": {
        const idx = Math.max(0, Math.min(LYDIAN_FREQUENCIES.length - 1, event.noteIndex ?? 0));
        const baseFreq = LYDIAN_FREQUENCIES[idx];
        this.playTone(baseFreq, 0.24, "sine", 0.1);
        this.playTone(baseFreq * 1.5, 0.16, "triangle", 0.045);
        break;
      }
      case "CONSTELLATION_ENCLOSED": {
        const chord = [523.25, 659.25, 783.99, 987.77];
        chord.forEach((f, i) => {
          setTimeout(() => this.playTone(f, 0.42, "triangle", 0.075), i * 45);
        });
        break;
      }
      case "EVENT_HORIZON_SKIM":
        this.playTone(310, 0.15, "sine", 0.065, 620);
        break;
      case "WORMHOLE_TRANSIT":
        this.playTone(110, 0.35, "sawtooth", 0.09, 880);
        break;
      case "ROCHE_CRUSH":
        this.playTone(440, 0.28, "sine", 0.09, 130);
        break;
      case "SUPERNOVA_PULSE":
        this.playTone(150, 0.42, "sawtooth", 0.11, 55);
        this.playTone(587.33, 0.28, "triangle", 0.08, 293.66);
        break;
      case "CHRONO_REWIND":
        this.playTone(880, 0.32, "triangle", 0.09, 220);
        break;
      case "ENEMY_DESTROYED":
        this.playTone(392, 0.18, "square", 0.06, 783.99);
        break;
      case "SHIP_DAMAGED":
        this.playTone(140, 0.26, "sawtooth", 0.1, 65);
        break;
      case "RELIC_DRAFTED":
      case "SECTOR_CLEARED":
      case "VICTORY": {
        const fanfare = [523.25, 659.25, 783.99, 1046.5];
        fanfare.forEach((f, i) => {
          setTimeout(() => this.playTone(f, 0.38, "triangle", 0.085), i * 65);
        });
        break;
      }
      case "GAME_OVER":
        this.playTone(220, 0.55, "sawtooth", 0.09, 73.42);
        break;
    }
  }
  destroy() {
    if (this.ctx) {
      void this.ctx.close().catch(() => {
      });
      this.ctx = null;
    }
  }
};

function runHorizonCounterfactuals(seed) {

      relicPref: "KEPLER_SCYTHE",
      philosophy: "Prioritizes 3-bumper Constellation Polygon enclosures & AI Coach trickshots.",
      useTether: false,
      useRewind: false
    },
    {
      id: "HORIZON_DAREDEVIL_AI",
      name: "Relativistic Tether Daredevil",
      chassis: "STAR_HAMMER",
      relicPref: "ROCHE_CRUSHER",
      philosophy: "Whips on Quantum Tethers ([Q]) & triggers Supernovas ([E]) for Roche Crushes.",
      useTether: true,
      useRewind: false
    },

      id: "CHRONO_WEAVER_AI",
      name: "Worldline Paradox Weaver",
      chassis: "PHOTON_WISP",
      relicPref: "SCHRODINGER_ECHO",
      philosophy: "Chains high-elasticity bumper bounces and rewinds spacetime ([R]) for Echo hits.",
      useTether: false,
      useRewind: true
    }
  ];

      startSector: 1

    sim.relics.push(arch.relicPref);

        const pick = sim.relicDraftChoices[0] ?? "NOETHER_DYNAMO";
        applyHorizonInput(sim, { type: "SELECT_RELIC", relicId: pick });

      if (step % 45 === 0) {
        applyHorizonInput(sim, { type: "TRIGGER_AI_COACH" });
      }
      if (arch.useTether && step % 30 === 15) {

      }

        applyHorizonInput(sim, { type: "TRIGGER_SUPERNOVA" });

      if (arch.useRewind && step % 75 === 50) {

function createDefaultHorizonCareer() {
  return {
    highScore: 0,
    bestLorentzGamma: 1,
    runsPlayed: 0,
    odysseyVictories: 0,
    dojoCompletions: 0,
    totalPolygonsEnclosed: 0,
    totalEnemiesVaporized: 0,
    relicsUnlocked: [],
    verdictsUnlocked: [],
    completedRunKeys: []
  };
}
function loadHorizonSave(storage = typeof localStorage !== "undefined" ? localStorage : null) {
  const defaultEnvelope = {
    version: HORIZON_CONFIG.SAVE_VERSION,
    career: createDefaultHorizonCareer(),
    activeRun: null
  };
  if (!storage) return defaultEnvelope;
  try {
    const raw = storage.getItem(HORIZON_CONFIG.SAVE_KEY);
    if (!raw) return defaultEnvelope;
    const parsed = JSON.parse(raw);
    if (!parsed || parsed.version !== HORIZON_CONFIG.SAVE_VERSION || !parsed.career) {
      return defaultEnvelope;
    }
    const c = parsed.career;
    return {
      version: HORIZON_CONFIG.SAVE_VERSION,
      career: {
        highScore: Number.isFinite(c.highScore) ? c.highScore : 0,
        bestLorentzGamma: Number.isFinite(c.bestLorentzGamma) ? c.bestLorentzGamma : 1,
        runsPlayed: Number.isFinite(c.runsPlayed) ? c.runsPlayed : 0,
        odysseyVictories: Number.isFinite(c.odysseyVictories) ? c.odysseyVictories : 0,
        dojoCompletions: Number.isFinite(c.dojoCompletions) ? c.dojoCompletions : 0,
        totalPolygonsEnclosed: Number.isFinite(c.totalPolygonsEnclosed) ? c.totalPolygonsEnclosed : 0,
        totalEnemiesVaporized: Number.isFinite(c.totalEnemiesVaporized) ? c.totalEnemiesVaporized : 0,
        relicsUnlocked: Array.isArray(c.relicsUnlocked) ? [...c.relicsUnlocked] : [],
        verdictsUnlocked: Array.isArray(c.verdictsUnlocked) ? [...c.verdictsUnlocked] : [],
        completedRunKeys: Array.isArray(c.completedRunKeys) ? [...c.completedRunKeys] : []
      },
      activeRun: parsed.activeRun && typeof parsed.activeRun.seed === "number" && parsed.activeRun.ship && Array.isArray(parsed.activeRun.wells) ? cloneHorizonState(parsed.activeRun) : null
    };
  } catch {
    return defaultEnvelope;
  }
}
function saveHorizonState(career, state, storage = typeof localStorage !== "undefined" ? localStorage : null) {
  const updatedCareer = {
    ...career,
    relicsUnlocked: [...career.relicsUnlocked],
    verdictsUnlocked: [...career.verdictsUnlocked],
    completedRunKeys: [...career.completedRunKeys]
  };
  if (state) {
    updatedCareer.highScore = Math.max(updatedCareer.highScore, state.score);
    updatedCareer.bestLorentzGamma = Math.max(
      updatedCareer.bestLorentzGamma,
      state.ship.peakLorentzGamma
    );
    for (const relicId of state.relics) {
      if (!updatedCareer.relicsUnlocked.includes(relicId)) {
        updatedCareer.relicsUnlocked.push(relicId);
      }
    }
    if (state.status === "VICTORY" || state.status === "GAME_OVER") {
      const runKey = `${state.seed}:${state.mode}:${state.tick}:${state.status}`;
      if (!updatedCareer.completedRunKeys.includes(runKey)) {
        updatedCareer.completedRunKeys.push(runKey);
        if (updatedCareer.completedRunKeys.length > 60) {
          updatedCareer.completedRunKeys.shift();
        }
        updatedCareer.runsPlayed += 1;
        updatedCareer.totalPolygonsEnclosed += state.stats.polygonsEnclosed;
        updatedCareer.totalEnemiesVaporized += state.stats.enemiesVaporized;
        if (state.status === "VICTORY") {
          if (state.mode === "ODYSSEY") updatedCareer.odysseyVictories += 1;
          if (state.mode === "TRICKSHOT_DOJO") updatedCareer.dojoCompletions += 1;
        }
        if (state.verdictId && !updatedCareer.verdictsUnlocked.includes(state.verdictId)) {
          updatedCareer.verdictsUnlocked.push(state.verdictId);
        }
      }
    }
  }
  const envelope = {
    version: HORIZON_CONFIG.SAVE_VERSION,
    career: updatedCareer,
    activeRun: state && state.status !== "VICTORY" && state.status !== "GAME_OVER" ? cloneHorizonState(state) : null
  };
  if (storage) {
    try {
      storage.setItem(HORIZON_CONFIG.SAVE_KEY, JSON.stringify(envelope));
    } catch {
    }
  }
  return envelope;
}
