// games/09-belt-and-bolt/src/audio.ts
var BeltAndBoltAudio = class {
  ctx = null;
  muted = false;
  ensureContext() {
    if (this.muted || typeof window === "undefined") return null;
    if (!this.ctx) {
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (AudioCtor) {
        try {
          this.ctx = new AudioCtor();
        } catch {
          this.ctx = null;
        }
      }
    }
    if (this.ctx && this.ctx.state === "suspended") {
      this.ctx.resume().catch(() => {
      });
    }
    return this.ctx;
  }
  setMuted(muted) {
    this.muted = muted;
  }
  isMuted() {
    return this.muted;
  }
  playPlaceClank() {
    const ctx = this.ensureContext();
    if (!ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(190, now);
    osc.frequency.exponentialRampToValueAtTime(95, now + 0.08);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(1e-3, now + 0.09);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.09);
  }
  playDemolish() {
    const ctx = this.ensureContext();
    if (!ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(240, now);
    osc.frequency.exponentialRampToValueAtTime(70, now + 0.12);
    gain.gain.setValueAtTime(0.09, now);
    gain.gain.exponentialRampToValueAtTime(1e-3, now + 0.13);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.13);
  }
  playTurretPulse(isRailgun = false) {
    const ctx = this.ensureContext();
    if (!ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = isRailgun ? "sawtooth" : "square";
    osc.frequency.setValueAtTime(isRailgun ? 640 : 420, now);
    osc.frequency.exponentialRampToValueAtTime(isRailgun ? 110 : 160, now + 0.07);
    gain.gain.setValueAtTime(isRailgun ? 0.1 : 0.06, now);
    gain.gain.exponentialRampToValueAtTime(1e-3, now + 0.075);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.075);
  }
  playSmelterHiss() {
    const ctx = this.ensureContext();
    if (!ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(520, now);
    osc.frequency.exponentialRampToValueAtTime(780, now + 0.06);
    gain.gain.setValueAtTime(0.04, now);
    gain.gain.exponentialRampToValueAtTime(1e-3, now + 0.065);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.065);
  }
  playWaveKlaxon(isBoss = false) {
    const ctx = this.ensureContext();
    if (!ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(isBoss ? 220 : 330, now);
    osc.frequency.setValueAtTime(isBoss ? 310 : 440, now + 0.14);
    gain.gain.setValueAtTime(0.11, now);
    gain.gain.exponentialRampToValueAtTime(1e-3, now + 0.3);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.3);
  }
  destroy() {
    if (this.ctx) {
      this.ctx.close().catch(() => {
      });
      this.ctx = null;
    }
  }
};

function getWaveDefinition(waveNumber) {
  if (waveNumber >= 1 && waveNumber <= WAVE_TABLE.length) {
    return WAVE_TABLE[waveNumber - 1];

  const extra = Math.max(1, waveNumber - 30);
  return {
    wave: waveNumber,
    title: `Wave ${waveNumber}: Endless Overdrive +${extra}`,
    isBossWave: waveNumber % 5 === 0,
    rewardCredits: 180 + extra * 15,
    earlyLaunchBonus: 50 + extra * 5,
    spawns: [
      { enemyType: "swarm_wasp", count: 6 + extra, spacingTicks: 1 },
      { enemyType: "armored_bruiser", count: 3 + Math.floor(extra * 0.6), spacingTicks: 2 },
      ...waveNumber % 5 === 0 ? [{ enemyType: "apex_goliath", count: 1 + Math.floor(extra / 5), spacingTicks: 4 }] : []
    ]
  };
}

// games/09-belt-and-bolt/src/rng.ts
function mulberry32(seed) {
  let state = seed >>> 0;
  if (state === 0) state = 1831565813;
  const next = () => {
    state = state + 1831565813 >>> 0;
    let t = Math.imul(state ^ state >>> 15, 1 | state);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  return {
    next,
    nextInt(minInclusive, maxInclusive) {
      const span = Math.max(1, maxInclusive - minInclusive + 1);
      return minInclusive + Math.floor(next() * span);
    },
    pick(items) {
      if (items.length === 0) {
        throw new Error("Cannot pick from an empty array");
      }
      const idx = Math.floor(next() * items.length);
      return items[idx];
    },
    getState() {
      return state >>> 0;
    }
  };
}
