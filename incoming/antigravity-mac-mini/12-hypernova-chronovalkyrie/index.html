var HypernovaAudioEngine = class {
  ctx = null;
  masterGain = null;
  musicGain = null;
  sfxGain = null;
  lowpassFilter = null;
  isMuted = false;
  musicPlaying = false;
  stepIndex = 0;
  sequencerTimer = null;
  currentBpm = 126;
  currentComboGrade = "D";
  constructor() {
  }
  initContext() {
    if (this.ctx) return;
    try {
      const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtxClass();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = 0.85;
      this.lowpassFilter = this.ctx.createBiquadFilter();
      this.lowpassFilter.type = "lowpass";
      this.lowpassFilter.frequency.value = 18e3;
      this.lowpassFilter.Q.value = 2;
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = 0.35;
      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.value = 0.5;
      this.musicGain.connect(this.lowpassFilter);
      this.sfxGain.connect(this.lowpassFilter);
      this.lowpassFilter.connect(this.masterGain);
      this.masterGain.connect(this.ctx.destination);
    } catch {
    }
  }
  resume() {
    this.initContext();
    if (this.ctx && this.ctx.state === "suspended") {
      void this.ctx.resume();
    }
  }
  setMute(muted) {
    this.isMuted = muted;
    if (this.masterGain && this.ctx) {
      this.masterGain.gain.setValueAtTime(muted ? 0 : 0.85, this.ctx.currentTime);
    }
  }
  toggleMute() {
    this.setMute(!this.isMuted);
    return this.isMuted;
  }
  /**
   * Sweeps the master low-pass filter down during Chrono-Drift (bullet-time effect).
   */
  setChronoDriftFilter(active) {
    if (!this.lowpassFilter || !this.ctx) return;
    const now = this.ctx.currentTime;
    this.lowpassFilter.frequency.cancelScheduledValues(now);
    if (active) {
      this.lowpassFilter.frequency.exponentialRampToValueAtTime(450, now + 0.15);
    } else {
      this.lowpassFilter.frequency.exponentialRampToValueAtTime(18e3, now + 0.25);
    }
  }
  /**
   * Starts the procedural synthwave sequencer loop.
   */
  startMusic() {
    this.resume();
    if (this.musicPlaying || !this.ctx) return;

    this.stepIndex = 0;

  stopMusic() {
    this.musicPlaying = false;
    if (this.sequencerTimer !== null) {
      clearTimeout(this.sequencerTimer);

  }
  updateMusicIntensity(comboGrade, isBossActive) {
    this.currentComboGrade = comboGrade;
    if (isBossActive) {

    } else if (comboGrade === "SSS" || comboGrade === "APEX") {
      this.currentBpm = 134;
    } else {
      this.currentBpm = 126;
    }
  }
  scheduleNextStep() {
    if (!this.musicPlaying || !this.ctx) return;
    const stepDurationMs = 60 / this.currentBpm / 4 * 1e3;
    this.playSequencerStep(this.stepIndex);
    this.stepIndex = (this.stepIndex + 1) % 16;
    this.sequencerTimer = window.setTimeout(() => {
      this.scheduleNextStep();
    }, stepDurationMs);
  }
  playSequencerStep(step) {
    if (!this.ctx || !this.musicGain || this.isMuted) return;
    const now = this.ctx.currentTime;
    if (step % 4 === 0) {
      this.synthKick(now, 0.6);
    }
    if (step === 4 || step === 12) {
      this.synthSnare(now, 0.45);
    }
    if (step % 2 === 1 || this.currentComboGrade === "SSS" || this.currentComboGrade === "APEX") {
      this.synthHiHat(now, step % 4 === 2 ? 0.22 : 0.12);
    }
    const bassNotes = [110, 110, 110, 123.47, 130.81, 130.81, 146.83, 110];
    const bassFreq = bassNotes[step % bassNotes.length];
    this.synthBassNote(now, bassFreq, 0.28);
    if (this.currentComboGrade !== "D" && this.currentComboGrade !== "C") {
      const arpNotes = [440, 523.25, 659.25, 783.99, 880, 783.99, 659.25, 523.25];
      const leadFreq = arpNotes[step % arpNotes.length];
      this.synthLeadNote(now, leadFreq, 0.18);

  }
  synthKick(time, volume) {
    if (!this.ctx || !this.musicGain) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.frequency.exponentialRampToValueAtTime(36, time + 0.12);
    gain.gain.setValueAtTime(volume, time);
    gain.gain.exponentialRampToValueAtTime(1e-3, time + 0.18);

    gain.connect(this.musicGain);
    osc.start(time);

  synthSnare(time, volume) {

    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = "highpass";
    filter.frequency.value = 1e3;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(volume, time);
    gain.gain.exponentialRampToValueAtTime(1e-3, time + 0.12);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.musicGain);
    noise.start(time);
    noise.stop(time + 0.13);
  }
  synthHiHat(time, volume) {
    if (!this.ctx || !this.musicGain) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = "square";

    gain.gain.setValueAtTime(volume, time);
    gain.gain.exponentialRampToValueAtTime(1e-4, time + 0.04);

    osc.stop(time + 0.05);

    const filter = this.ctx.createBiquadFilter();
    const gain = this.ctx.createGain();

    osc.frequency.setValueAtTime(freq / 2, time);
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(600, time);
    filter.frequency.exponentialRampToValueAtTime(200, time + 0.14);
    gain.gain.setValueAtTime(volume, time);
    gain.gain.exponentialRampToValueAtTime(1e-3, time + 0.16);
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(this.musicGain);

    osc.stop(time + 0.18);
  }

    osc.type = "square";

    gain.gain.setValueAtTime(volume, time);
    gain.gain.exponentialRampToValueAtTime(1e-3, time + 0.1);

    osc.frequency.exponentialRampToValueAtTime(140, now + 0.06);

    gain.gain.exponentialRampToValueAtTime(1e-3, now + 0.07);
    osc.connect(gain);

  playRailgun() {

    const gain = this.ctx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(120, now);
    osc.frequency.exponentialRampToValueAtTime(1800, now + 0.08);
    osc.frequency.exponentialRampToValueAtTime(80, now + 0.35);
    gain.gain.setValueAtTime(0.45, now);
    gain.gain.exponentialRampToValueAtTime(1e-3, now + 0.4);
    osc.connect(gain);
    gain.connect(this.sfxGain);

    osc.stop(now + 0.42);
  }
  playMissile() {

    osc.frequency.exponentialRampToValueAtTime(330, now + 0.08);

  }
  playExplosion(isBoss = false) {

    const bufferSize = Math.floor(this.ctx.sampleRate * duration);

    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-3 * i / bufferSize);
    }
    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(isBoss ? 280 : 450, now);
    filter.frequency.exponentialRampToValueAtTime(40, now + duration);
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(isBoss ? 0.6 : 0.35, now);
    gain.gain.exponentialRampToValueAtTime(1e-3, now + duration);
    noise.connect(filter);

var STORAGE_KEY = "hypernova_chronovalkyrie_save_v1";
function getDefaultCareerStats() {
  return {
    version: 1,
    highScore: 0,
    highestWave: 1,
    totalKills: 0,
    totalGrazes: 0,
    bossesDefeated: 0,
    highestComboGrade: "D",
    unlockedChassis: ["interceptor", "colossus", "phantom"],
    runsPlayed: 0,
    runsWon: 0,
    lastPlayedTimestamp: Date.now()
  };
}
function loadHypernovaSave() {
  try {
    if (typeof localStorage === "undefined") {
      return { career: getDefaultCareerStats() };
    }
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      return { career: getDefaultCareerStats() };
    }
    const parsed = JSON.parse(raw);
    const defaultCareer = getDefaultCareerStats();
    return {
      career: {
        ...defaultCareer,
        ...parsed.career || {},
        unlockedChassis: parsed.career?.unlockedChassis?.length ? parsed.career.unlockedChassis : defaultCareer.unlockedChassis
      },
      lastActiveSeed: parsed.lastActiveSeed
    };
  } catch {
    return { career: getDefaultCareerStats() };
  }
}
function saveHypernovaCareer(career, lastActiveSeed) {
  try {
    if (typeof localStorage === "undefined") return;
    const envelope = {
      career: { ...career, lastPlayedTimestamp: Date.now() },
      lastActiveSeed
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(envelope));
  } catch {
  }
}
function recordRunEnd(career, runScore, waveReached, kills, grazes, bossesKilled, peakCombo, isVictory) {
  const updated = { ...career };
  updated.runsPlayed++;
  if (isVictory) updated.runsWon++;
  if (runScore > updated.highScore) updated.highScore = runScore;
  if (waveReached > updated.highestWave) updated.highestWave = waveReached;
  updated.totalKills += kills;
  updated.totalGrazes += grazes;
  updated.bossesDefeated += bossesKilled;
  const order = ["D", "C", "B", "A", "S", "SS", "SSS", "APEX"];
  if (order.indexOf(peakCombo) > order.indexOf(updated.highestComboGrade)) {
    updated.highestComboGrade = peakCombo;
  }
  saveHypernovaCareer(updated);
  return updated;
}

// games/12-hypernova-chronovalkyrie/src/rng.ts
var HypernovaRNG = class {
  state;
  constructor(seed) {
    this.state = (seed ^ 1831565813) >>> 0;
  }
  /**
   * Returns a pseudo-random 32-bit unsigned integer.
   */
  nextUint32() {
    this.state = this.state + 1831565813 >>> 0;
    let t = Math.imul(this.state ^ this.state >>> 15, 1 | this.state);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return (t ^ t >>> 14) >>> 0;
  }
  /**
   * Returns a float in [0, 1).
   */
  nextFloat() {
    return this.nextUint32() / 4294967296;
  }
  /**
   * Returns a float in [min, max).
   */
  rangeFloat(min, max) {
    return min + this.nextFloat() * (max - min);
  }
  /**
   * Returns an integer in [min, max] inclusive.
   */
  rangeInt(min, max) {
    return Math.floor(this.rangeFloat(min, max + 1));
  }
  /**
   * Returns true with probability `chance` in [0, 1].
   */
  chance(probability) {
    return this.nextFloat() < probability;
  }
  /**
   * Selects an item at random from an array.
   */
  pick(array) {
    if (array.length === 0) {
      throw new Error("Cannot pick from empty array");
    }
    return array[this.rangeInt(0, array.length - 1)];
  }
  /**
   * Performs an in-place or copied Fisher-Yates shuffle.
   */
  shuffle(array) {
    const copy = [...array];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = this.rangeInt(0, i);
      const tmp = copy[i];
      copy[i] = copy[j];
      copy[j] = tmp;
    }
    return copy;
  }
  /**
   * State serialization for deterministic snapshots.
   */
  getState() {
    return this.state;
  }
  setState(savedState) {
    this.state = savedState >>> 0;
  }
};

function getPlayerDerivedStats(player) {
  const chassis = CHASSIS_REGISTRY[player.chassisId];
  let damageMultiplier = 1;
  let fireRateMultiplier = 1;
  let speedMultiplier = chassis.speedMultiplier;
  let critChance = chassis.critChance;
  let critMultiplier = chassis.critMultiplier;
  let shieldRegenRate = HYPERNOVA_CONFIG.SHIELD_REGEN_RATE;
  let chronoDriftDuration = HYPERNOVA_CONFIG.CHRONO_DRIFT_DURATION_SEC;
  let grazeBonusMultiplier = 1;
  let extraProjectiles = 0;
  let pierceBonus = 0;
  let hasChainLightning = false;
  let hasAegisNova = false;
  let hasGravitonCrit = false;
  let hasBulletMirror = false;
  let hasNaniteHarvest = false;
  let hasThrusterBurn = false;
  let hasChronosRewind = false;
  let hasApexOverdrive = false;
  for (const augSlot of player.augments) {
    const def = AUGMENT_REGISTRY.find((a) => a.id === augSlot.augmentId);
    if (!def) continue;
    const rank = augSlot.rank;
    if (def.statModifiers.damageMultiplier) damageMultiplier += def.statModifiers.damageMultiplier * rank;
    if (def.statModifiers.fireRateMultiplier) fireRateMultiplier *= Math.pow(def.statModifiers.fireRateMultiplier, rank);
    if (def.statModifiers.speedMultiplier) speedMultiplier += def.statModifiers.speedMultiplier * rank;
    if (def.statModifiers.critChanceDelta) critChance += def.statModifiers.critChanceDelta * rank;
    if (def.statModifiers.critMultiplierDelta) critMultiplier += def.statModifiers.critMultiplierDelta * rank;
    if (def.statModifiers.shieldRegenMultiplier) shieldRegenRate *= Math.pow(def.statModifiers.shieldRegenMultiplier, rank);
    if (def.statModifiers.chronoDurationDelta) chronoDriftDuration += def.statModifiers.chronoDurationDelta * rank;
    if (def.statModifiers.grazeBonusMultiplier) grazeBonusMultiplier += (def.statModifiers.grazeBonusMultiplier - 1) * rank;
    if (def.statModifiers.extraProjectiles) extraProjectiles += def.statModifiers.extraProjectiles * rank;
    if (def.statModifiers.pierceDelta) pierceBonus += def.statModifiers.pierceDelta * rank;
    if (def.specialEffect === "CHAIN_LIGHTNING") hasChainLightning = true;
    if (def.specialEffect === "AEGIS_NOVA") hasAegisNova = true;
    if (def.specialEffect === "GRAVITON_CRIT") hasGravitonCrit = true;
    if (def.specialEffect === "BULLET_MIRROR") hasBulletMirror = true;
    if (def.specialEffect === "NANITE_HARVEST") hasNaniteHarvest = true;
    if (def.specialEffect === "THRUSTER_BURN") hasThrusterBurn = true;
    if (def.specialEffect === "CHRONOS_REWIND") hasChronosRewind = true;
    if (def.specialEffect === "APEX_OVERDRIVE") hasApexOverdrive = true;
  }
  return {
    speed: HYPERNOVA_CONFIG.BASE_SPEED * speedMultiplier,
    damageMultiplier,
    fireRateMultiplier,
    critChance: Math.min(0.9, critChance),
    critMultiplier,
    shieldRegenRate,
    chronoDriftDuration,
    grazeBonusMultiplier,
    extraProjectiles,
    pierceBonus,
    hasChainLightning,
    hasAegisNova,
    hasGravitonCrit,
    hasBulletMirror,
    hasNaniteHarvest,
    hasThrusterBurn,
    hasChronosRewind,
    hasApexOverdrive
  };
}
function updateComboStatus(state) {
  const tiers = HYPERNOVA_CONFIG.COMBO_TIERS;
  let activeTier = tiers[0];
  for (let i = tiers.length - 1; i >= 0; i--) {
    if (state.comboPoints >= tiers[i].threshold) {
      activeTier = tiers[i];
      break;
    }
  }
  state.comboGrade = activeTier.grade;
  state.comboMultiplier = activeTier.multiplier;
  const tierOrder = ["D", "C", "B", "A", "S", "SS", "SSS", "APEX"];
  if (tierOrder.indexOf(state.comboGrade) > tierOrder.indexOf(state.highestComboGrade)) {
    state.highestComboGrade = state.comboGrade;
  }
}
function addComboPoints(state, points) {

          enemy.vx = dx / distToTarget * def.speed * 0.4;
          enemy.vy = dy / distToTarget * def.speed * 0.4;
        }
        enemy.sniperChargeTimer += worldDtSec;
        if (enemy.sniperChargeTimer >= 2.8) {
          enemy.sniperChargeTimer = 0;
          state.projectiles.push({
            id: state.nextEntityId++,
            fromPlayer: false,
            x: enemy.x + Math.cos(enemy.angle) * 20,
            y: enemy.y + Math.sin(enemy.angle) * 20,
            vx: Math.cos(enemy.angle) * 950,
            vy: Math.sin(enemy.angle) * 950,
            damage: 32,
            pierce: 1,
            radius: 5,
            color: "#facc15",
            duration: 2,
            isHoming: false,
            special: "ENEMY_SNIPER"
          });
        }
        break;
      }
      case "SHIELD_CHARGE": {
        enemy.vx = dx / distToTarget * def.speed;
        enemy.vy = dy / distToTarget * def.speed;
        enemy.shieldActive = true;
        break;
      }
      case "SPIRAL_WEAVE": {
        enemy.spiralPhase += worldDtSec * 2.5;
        enemy.vx = Math.cos(enemy.spiralPhase) * def.speed;
        enemy.vy = Math.sin(enemy.spiralPhase * 0.7) * def.speed;
        if (enemy.shootCooldown <= 0) {
          enemy.shootCooldown = 0.28;
          const arms = 3;
          for (let a = 0; a < arms; a++) {
            const angle = enemy.spiralPhase + a * (Math.PI * 2) / arms;
            state.projectiles.push({
              id: state.nextEntityId++,

      case "BOSS_HYPERION": {

        if (enemy.shootCooldown <= 0) {

      case "BOSS_CHRONOS": {

        enemy.spiralPhase += worldDtSec * 1.8;

            });
          }
        }

      }
    }

    enemy.y += enemy.vy * worldDtSec;

}
function updatePickups(state, dtSec) {
  const magnetRadius = 140;
  for (let i = state.xpGems.length - 1; i >= 0; i--) {
    const gem = state.xpGems[i];
    const dx = state.player.x - gem.x;
    const dy = state.player.y - gem.y;
    const dist = Math.hypot(dx, dy);
    if (dist < magnetRadius) {
      const pullSpeed = 520 * dtSec;
      gem.x += dx / dist * pullSpeed;
      gem.y += dy / dist * pullSpeed;
    }
    if (dist <= state.player.radius + 12) {
      state.player.xp += gem.value;
      state.xpGems.splice(i, 1);
      if (state.player.xp >= state.player.xpNext) {
        triggerLevelUp(state);
      }
    }
  }
  for (let i = state.naniteCells.length - 1; i >= 0; i--) {
    const cell = state.naniteCells[i];
    const dx = state.player.x - cell.x;
    const dy = state.player.y - cell.y;
    const dist = Math.hypot(dx, dy);
    if (dist < magnetRadius) {
      const pullSpeed = 480 * dtSec;
      cell.x += dx / dist * pullSpeed;
      cell.y += dy / dist * pullSpeed;
    }
    if (dist <= state.player.radius + 12) {
      state.player.hull = Math.min(state.player.maxHull, state.player.hull + cell.healAmount);
      state.events.push({
        type: "PLAYER_HIT",
        x: state.player.x,
        y: state.player.y,
        text: `+${cell.healAmount} HULL`
      });
      state.naniteCells.splice(i, 1);
    }
  }
}
function triggerLevelUp(state) {
  state.player.level++;
  state.player.xp -= state.player.xpNext;
  state.player.xpNext = Math.round(
    HYPERNOVA_CONFIG.XP_BASE_REQUIRED * Math.pow(state.player.level, HYPERNOVA_CONFIG.XP_GROWTH_EXPONENT)
  );
  state.pendingDraftChoices = generateDraftChoices(state);
  state.status = "DRAFTING";
  state.events.push({
    type: "LEVEL_UP",
    value: state.player.level,
    text: `LEVEL UP! ASCENSION TIER ${state.player.level}`
  });
}
function checkBulletGraze(state, derived) {
  const grazeOuterRadius = state.player.radius + HYPERNOVA_CONFIG.GRAZE_RADIUS;
  for (const proj of state.projectiles) {
    if (!proj.fromPlayer) {
      const d = Math.hypot(proj.x - state.player.x, proj.y - state.player.y);
      if (d > state.player.radius && d <= grazeOuterRadius) {
        const alreadyGrazed = state.recentGrazes.some((g) => g.projectileId === proj.id);
        if (!alreadyGrazed) {
          state.recentGrazes.push({
            projectileId: proj.id,
            timestampSec: state.elapsedSec
          });
          state.totalGrazes++;
          const energyBonus = HYPERNOVA_CONFIG.CHRONO_ENERGY_GRAZE_BONUS * (state.player.chassisId === "interceptor" ? 2 : 1) * derived.grazeBonusMultiplier;
          state.player.chronoEnergy = Math.min(
            state.player.maxChronoEnergy,
            state.player.chronoEnergy + energyBonus
          );
          addComboPoints(state, 35);
          state.events.push({
            type: "GRAZE",
            x: proj.x,
            y: proj.y,
            text: "GRAZE +ENERGY"
          });
        }
      }
    }
  }
  state.recentGrazes = state.recentGrazes.filter((g) => state.elapsedSec - g.timestampSec < 2);
}
function checkPlayerCollisions(state, derived) {
  if (state.player.invulnerableTimer > 0) return;
  for (let i = state.projectiles.length - 1; i >= 0; i--) {
    const proj = state.projectiles[i];
    if (!proj.fromPlayer) {
      const d = Math.hypot(proj.x - state.player.x, proj.y - state.player.y);
      if (d <= state.player.radius + proj.radius) {
        inflictPlayerDamage(state, proj.damage, derived);
        state.projectiles.splice(i, 1);
        if (state.status === "GAME_OVER") return;
      }
    }
  }
  for (const enemy of state.enemies) {
    const d = Math.hypot(enemy.x - state.player.x, enemy.y - state.player.y);
    if (d <= state.player.radius + enemy.radius) {
      const contactDamage = enemy.isBoss ? 45 : 18;
      inflictPlayerDamage(state, contactDamage, derived);
      if (state.status === "GAME_OVER") return;
      break;
    }
  }
}
function inflictPlayerDamage(state, amount, derived) {
  state.player.invulnerableTimer = HYPERNOVA_CONFIG.INVULNERABILITY_AFTER_HIT_SEC;
  state.player.shieldRegenTimer = HYPERNOVA_CONFIG.SHIELD_REGEN_DELAY_SEC;
  state.comboPoints = 0;
  updateComboStatus(state);
  if (state.player.shield > 0) {
    if (state.player.shield >= amount) {
      state.player.shield -= amount;
      state.events.push({
        type: "PLAYER_HIT",
        value: amount,
        text: `-${amount} SHIELD`
      });
      return;
    } else {
      const remainingDamage = amount - state.player.shield;
      state.player.shield = 0;
      state.events.push({
        type: "SHIELD_BREAK",
        text: "SHIELD COLLAPSE!"
      });
      if (derived.hasAegisNova) {
        state.projectiles = state.projectiles.filter((p) => p.fromPlayer);
        detonateAreaDamage(state, state.player.x, state.player.y, 400, 50);
        state.events.push({
          type: "PARRY",
          text: "AEGIS EMP SHOCKWAVE DISCHARGED!"
        });
      }
      state.player.hull -= remainingDamage;
    }
  } else {
    state.player.hull -= amount;
  }
  state.events.push({
    type: "PLAYER_HIT",
    value: amount,
    text: `-${amount} HULL`
  });
  if (state.player.hull <= 0) {
    if (derived.hasChronosRewind && state.player.rewindAvailable) {
      state.player.rewindAvailable = false;
      state.player.hull = Math.round(state.player.maxHull * 0.6);
      state.player.shield = state.player.maxShield;
      state.player.invulnerableTimer = 2.5;
      state.projectiles = state.projectiles.filter((p) => p.fromPlayer);
      state.events.push({
        type: "REWIND_TRIGGERED",
        text: "PARADOX FAIL-SAFE: REALITY REWOUND!"
      });
    } else {
      state.player.hull = 0;
      state.status = "GAME_OVER";
      state.events.push({
        type: "GAME_OVER",
        text: "VALKYRIE DESTROYED IN COMBAT"
      });
    }
  }
}
function updateWaveProgression(state, dtSec, rng) {
  const scheduleIndex = Math.min(state.currentWave - 1, WAVE_SCHEDULES.length - 1);
  const currentSchedule = WAVE_SCHEDULES[scheduleIndex];
  state.waveTimer += dtSec;
  for (const spawn of currentSchedule.spawnRates) {
    const key = spawn.archetype;
    state.waveSpawnTimers[key] = (state.waveSpawnTimers[key] ?? 0) + dtSec;
    if (state.waveSpawnTimers[key] >= spawn.intervalSec) {
      state.waveSpawnTimers[key] = 0;
      const activeCount = state.enemies.filter((e) => e.archetype === spawn.archetype).length;
      if (activeCount < spawn.maxCount) {
        spawnEnemyAtArenaEdge(state, spawn.archetype, rng);
      }
    }
  }
  if (currentSchedule.bossSpawn && !state.activeBossId) {
    const bossDef = ENEMY_REGISTRY[currentSchedule.bossSpawn];
    const bossId = state.nextEntityId++;
    state.activeBossId = bossId;
    state.enemies.push({
      id: bossId,
      archetype: currentSchedule.bossSpawn,
      x: HYPERNOVA_CONFIG.ARENA_WIDTH / 2,
      y: 90,
      vx: 0,
      vy: 0,
      hp: bossDef.maxHp,
      maxHp: bossDef.maxHp,
      radius: bossDef.radius,
      angle: Math.PI / 2,
      shootCooldown: 1,
      sniperChargeTimer: 0,
      spiralPhase: 0,
      shieldActive: false,
      isBoss: true
    });
    state.events.push({
      type: "BOSS_SPAWN",
      text: `TITAN ENGAGEMENT: ${bossDef.name}`
    });
  }
  if (state.waveTimer >= currentSchedule.durationSec && (!currentSchedule.bossSpawn || !state.activeBossId)) {
    if (state.currentWave < HYPERNOVA_CONFIG.TOTAL_WAVES) {
      state.currentWave++;
      state.waveTimer = 0;
      state.waveDuration = WAVE_SCHEDULES[state.currentWave - 1].durationSec;
      state.waveSpawnTimers = {};
      state.events.push({
        type: "WAVE_START",
        value: state.currentWave,
        text: WAVE_SCHEDULES[state.currentWave - 1].name
      });
    } else if (!state.endlessMode && state.activeBossId === null) {
      state.endlessMode = true;
      state.events.push({
        type: "WAVE_START",
        text: "ENTERED ENDLESS HYPERNOVA OVERDRIVE!"
      });
    }
  }
}
function spawnEnemyAtArenaEdge(state, archetype, rng) {
  const def = ENEMY_REGISTRY[archetype];
  const side = rng.rangeInt(0, 3);
  let x = 0;
  let y = 0;
  switch (side) {
    case 0:
      x = rng.rangeFloat(50, HYPERNOVA_CONFIG.ARENA_WIDTH - 50);
      y = -def.radius - 10;
      break;
    case 1:
      x = HYPERNOVA_CONFIG.ARENA_WIDTH + def.radius + 10;
      y = rng.rangeFloat(50, HYPERNOVA_CONFIG.ARENA_HEIGHT - 50);
      break;
    case 2:
      x = rng.rangeFloat(50, HYPERNOVA_CONFIG.ARENA_WIDTH - 50);
      y = HYPERNOVA_CONFIG.ARENA_HEIGHT + def.radius + 10;
      break;
    case 3:
      x = -def.radius - 10;
      y = rng.rangeFloat(50, HYPERNOVA_CONFIG.ARENA_HEIGHT - 50);
      break;
  }
  state.enemies.push({
    id: state.nextEntityId++,
    archetype,
    x,
    y,
    vx: 0,
    vy: 0,
    hp: def.maxHp,
    maxHp: def.maxHp,
    radius: def.radius,
    angle: 0,
    shootCooldown: rng.rangeFloat(1, 2.5),
    sniperChargeTimer: 0,
    spiralPhase: rng.rangeFloat(0, Math.PI * 2),
    shieldActive: archetype === "bulwark_cruiser",
    isBoss: def.isBoss
  });
}

  initEventListeners() {
    window.addEventListener("keydown", (e) => {
      this.keys[e.key.toLowerCase()] = true;
      this.keys[e.code] = true;
      if (e.key === "1" || e.key === "2" || e.key === "3") {
        const choiceIdx = parseInt(e.key, 10) - 1;
        this.triggerDraftByIndex(choiceIdx);
      }
      if (e.key === "Escape" || e.key.toLowerCase() === "p") {
        this.togglePause();
      }
      if (e.key.toLowerCase() === "d") {
        this.debugMode = !this.debugMode;
      }
    });
    window.addEventListener("keyup", (e) => {
      this.keys[e.key.toLowerCase()] = false;
      this.keys[e.code] = false;
    });
    this.canvas.addEventListener("mousemove", (e) => {
      const rect = this.canvas.getBoundingClientRect();
      const scaleX = this.canvas.width / rect.width;
      const scaleY = this.canvas.height / rect.height;
      this.mouseX = (e.clientX - rect.left) * scaleX;
      this.mouseY = (e.clientY - rect.top) * scaleY;
    });
    this.canvas.addEventListener("mousedown", (e) => {
      if (e.button === 0) {
        this.isMouseDown = true;
        this.audio.resume();
      } else if (e.button === 2) {
        this.rightMouseDown = true;
      }
    });
    this.canvas.addEventListener("mouseup", (e) => {
      if (e.button === 0) this.isMouseDown = false;
      if (e.button === 2) this.rightMouseDown = false;
    });
    this.canvas.addEventListener("contextmenu", (e) => {
      e.preventDefault();
    });
    const launchBtn = this.startMenuEl.querySelector("#btn-launch-run");
    if (launchBtn) {
      launchBtn.addEventListener("click", () => {
        const seedInput = this.startMenuEl.querySelector("#start-seed-input");
        const seed = seedInput ? parseInt(seedInput.value, 10) || HYPERNOVA_CONFIG.DEFAULT_SEED : HYPERNOVA_CONFIG.DEFAULT_SEED;
        this.startMenuEl.style.display = "none";
        this.audio.startMusic();
        this.callbacks.onRestart(this.selectedChassisId, seed);
      });
    }
    const btnResume = this.pauseMenuEl.querySelector("#btn-resume-run");
    if (btnResume) {
      btnResume.addEventListener("click", () => this.togglePause(false));
    }
    const btnSound = this.pauseMenuEl.querySelector("#btn-toggle-sound");

  triggerDraftByIndex(index) {

  togglePause(force) {

    const next = force !== void 0 ? force : !isVisible;
    this.pauseMenuEl.style.display = next ? "flex" : "none";
  }
  gatherInput(state) {
    let moveX = 0;
    let moveY = 0;
    if (this.keys["w"] || this.keys["arrowup"]) moveY -= 1;
    if (this.keys["s"] || this.keys["arrowdown"]) moveY += 1;
    if (this.keys["a"] || this.keys["arrowleft"]) moveX -= 1;
    if (this.keys["d"] || this.keys["arrowright"]) moveX += 1;
    const mag = Math.hypot(moveX, moveY);
    if (mag > 0) {
      moveX /= mag;
      moveY /= mag;
    }
    const dashRequested = Boolean(this.keys["shift"] || this.keys[" "]);
    const chronoRequested = Boolean(this.keys["e"] || this.rightMouseDown);
    const firing = this.autoFireEnabled || this.isMouseDown || Boolean(this.keys["j"]);
    return {
      moveX,
      moveY,
      aimX: this.mouseX,
      aimY: this.mouseY,
      firing,
      dashRequested,
      chronoRequested
    };
  }
  handleSimulationEvents(state) {
    for (const evt of state.events) {
      switch (evt.type) {
        case "PLAYER_HIT": {
          this.trauma = Math.min(HYPERNOVA_CONFIG.MAX_TRAUMA, this.trauma + 0.35);
          if (evt.value) {
            this.spawnFloatingText(state.player.x, state.player.y - 20, `-${evt.value}`, "#f43f5e", 1.2);
          }
          this.audio.playVulcan();
          break;
        }
        case "CRIT_HIT": {
          this.hitstopMs = HYPERNOVA_CONFIG.HITSTOP_CRIT_MS;
          this.trauma = Math.min(HYPERNOVA_CONFIG.MAX_TRAUMA, this.trauma + 0.15);
          if (evt.text && evt.x && evt.y) {
            this.spawnFloatingText(evt.x, evt.y - 24, evt.text, "#fde047", 1.4);
          }
          this.audio.playRailgun();
          break;
        }
        case "SHIELD_BREAK": {
          this.trauma = Math.min(HYPERNOVA_CONFIG.MAX_TRAUMA, this.trauma + 0.5);
          this.spawnFloatingText(state.player.x, state.player.y - 30, "SHIELD COLLAPSE", "#38bdf8", 1.4);
          this.audio.playShieldBreak();
          break;
        }
        case "GRAZE": {
          if (evt.x && evt.y) {
            this.spawnFloatingText(evt.x, evt.y - 12, "GRAZE", "#00f0ff", 1);
            this.spawnSparks(evt.x, evt.y, "#00f0ff", 6);
          }
          this.audio.playGraze();
          break;
        }
        case "KILL": {
          if (evt.x && evt.y) {
            this.spawnSparks(evt.x, evt.y, "#f97316", 12);
          }
          this.audio.playExplosion(false);
          break;
        }
        case "BOSS_KILL": {
          this.hitstopMs = HYPERNOVA_CONFIG.HITSTOP_BOSS_KILL_MS;
          this.trauma = HYPERNOVA_CONFIG.MAX_TRAUMA;
          if (evt.x && evt.y) {
            this.spawnSparks(evt.x, evt.y, "#f43f5e", 40);
          }
          this.audio.playExplosion(true);
          break;
        }
        case "LEVEL_UP": {
          this.audio.playLevelUp();
          this.showDraftModal(state);
          break;
        }
        case "DASH": {
          this.audio.playDash();
          this.spawnAfterimage(state.player.x, state.player.y, state.player.rotation, "#00f0ff");
          break;
        }
        case "PARRY": {
          this.audio.playParry();
          this.spawnFloatingText(state.player.x, state.player.y - 28, evt.text ?? "PARRY", "#facc15", 1.3);
          break;
        }
        case "CHRONO_DRIFT_START": {
          this.audio.setChronoDriftFilter(true);
          this.trauma = 0.2;
          break;
        }
        case "CHRONO_DRIFT_END": {
          this.audio.setChronoDriftFilter(false);
          break;
        }
        case "REWIND_TRIGGERED": {
          this.audio.playRewind();
          this.trauma = HYPERNOVA_CONFIG.MAX_TRAUMA;
          this.spawnFloatingText(state.player.x, state.player.y - 35, "REALITY REWOUND!", "#00f0ff", 1.6);
          break;
        }
        case "VICTORY":
        case "GAME_OVER": {
          this.showGameOverModal(state, evt.type === "VICTORY");
          this.callbacks.onRunEnd(state);
          break;
        }
      }
    }
  }

    container.innerHTML = state.pendingDraftChoices.map((choice, idx) => {

    container.querySelectorAll(".draft-card").forEach((card) => {

  showGameOverModal(state, isVictory) {
    const headline = this.gameOverEl.querySelector("#game-over-headline");

    if (headline && badge) {

  updateHUD(state) {
    const setVal = (id, val) => {
      const el = this.overlayRoot.querySelector(`#${id}`);
