  function makeRNG(seed) {
    let s = seed >>> 0 || 1;
    return () => {
      s ^= s << 13; s ^= s >>> 17; s ^= s << 5;
      return (s >>> 0) / 4294967296;
    };
  }
  let rng = makeRNG(initialSeed);
  let fxRng = makeRNG(initialSeed ^ 0x9e3779b9);
  const rand = (a = 1, b = 0) => b + rng() * (a - b);
  const fxRand = (a = 1, b = 0) => b + fxRng() * (a - b);

    while (a > Math.PI) a -= Math.PI * 2;

  // ============================================================================

  const AudioSys = (() => {

    function unlock() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -16;
        comp.ratio.value = 6;
        master = ctx.createGain();
        master.gain.value = 0.36;
        comp.connect(master);
        master.connect(ctx.destination);
      }
      if (ctx.state === 'suspended') ctx.resume();
    }
    function canPlay() {
      if (!ctx || muted || voices >= MAX_VOICES) return false;
      return true;
    }
    function trackVoice(dur) {
      voices++;
      setTimeout(() => { voices = Math.max(0, voices - 1); }, dur * 1000 + 40);

    function honk(power = 0.6, mega = false) {
      if (!canPlay()) return;
      const now = ctx.currentTime;
      const dur = mega ? 0.36 : 0.16 + power * 0.14;
      trackVoice(dur);
      const baseFreq = mega ? 165 : (255 - power * 65) * (0.94 + Math.random() * 0.12);
      const o1 = ctx.createOscillator();
      const o2 = ctx.createOscillator();
      const filt = ctx.createBiquadFilter();
      const g = ctx.createGain();
      o1.type = 'sawtooth';
      o2.type = 'square';
      o1.frequency.setValueAtTime(baseFreq * 1.08, now);
      o1.frequency.exponentialRampToValueAtTime(baseFreq * (mega ? 0.62 : 0.86), now + dur);
      o2.frequency.setValueAtTime(baseFreq * 1.035, now);
      o2.frequency.exponentialRampToValueAtTime(baseFreq * (mega ? 0.65 : 0.89), now + dur);
      filt.type = 'bandpass';
      filt.frequency.setValueAtTime(mega ? 680 : 920 + power * 450, now);
      filt.Q.value = mega ? 2.2 : 3.2;
      const vol = (0.28 + power * 0.25) * (mega ? 1.25 : 1);
      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(vol, now + 0.014);
      g.gain.setValueAtTime(vol * 0.9, now + dur * 0.55);
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o1.connect(filt);
      o2.connect(filt);
      filt.connect(g);
      g.connect(comp);
      o1.start(now); o2.start(now);
      o1.stop(now + dur + 0.02); o2.stop(now + dur + 0.02);
    }
    function updateInhale(active, chargeRatio) {
      if (!ctx || muted) return;
      const now = ctx.currentTime;
      if (active) {
        if (!inhaleOsc) {
          inhaleOsc = ctx.createOscillator();
          inhaleGain = ctx.createGain();
          const filt = ctx.createBiquadFilter();
          filt.type = 'lowpass';
          filt.frequency.value = 600;
          inhaleOsc.type = 'triangle';
          inhaleOsc.frequency.setValueAtTime(140, now);
          inhaleGain.gain.setValueAtTime(0.001, now);
          inhaleOsc.connect(filt);
          filt.connect(inhaleGain);
          inhaleGain.connect(comp);
          inhaleOsc.start(now);
        }
        const f = 150 + chargeRatio * 340 + Math.sin(now * 45) * (chargeRatio > 1 ? 35 : 8);
        inhaleOsc.frequency.setTargetAtTime(f, now, 0.03);
        inhaleGain.gain.setTargetAtTime(Math.min(0.11, 0.02 + chargeRatio * 0.08), now, 0.03);
      } else if (inhaleOsc) {
        try {
          inhaleGain.gain.setTargetAtTime(0.0001, now, 0.02);
          inhaleOsc.stop(now + 0.05);
        } catch (e) {}
        inhaleOsc = null;
        inhaleGain = null;
      }
    }
    function objection(typeIdx = 0) {
      if (!canPlay()) return;
      const now = ctx.currentTime;
      const dur = 0.22;
      trackVoice(dur);
      const freqs = [340, 440, 260, 520, 300, 195];
      const f0 = (freqs[typeIdx % freqs.length] || 360) * (0.95 + Math.random() * 0.1);
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = typeIdx % 2 === 0 ? 'square' : 'sawtooth';
      o.frequency.setValueAtTime(f0, now);
      o.frequency.setValueAtTime(f0 * 1.25, now + 0.06);
      o.frequency.exponentialRampToValueAtTime(f0 * 0.85, now + dur);
      const filt = ctx.createBiquadFilter();
      filt.type = 'lowpass';
      filt.frequency.value = 1100;
      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(0.14, now + 0.015);
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.connect(filt);
      filt.connect(g);
      g.connect(comp);
      o.start(now);
      o.stop(now + dur + 0.02);
    }
    function shatter() {
      if (!canPlay()) return;
      const now = ctx.currentTime;
      const dur = 0.28;
      trackVoice(dur);
      const notes = [587.33, 880, 1174.66];
      notes.forEach((n, idx) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(n, now + idx * 0.025);
        o.frequency.exponentialRampToValueAtTime(n * 1.15, now + idx * 0.025 + 0.14);
        g.gain.setValueAtTime(0.001, now + idx * 0.025);
        g.gain.linearRampToValueAtTime(0.22, now + idx * 0.025 + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.025 + 0.16);
        o.connect(g);
        g.connect(comp);
        o.start(now + idx * 0.025);
        o.stop(now + idx * 0.025 + 0.18);
      });
    }
    function bump(intensity = 0.5) {
      if (!canPlay()) return;
      const now = ctx.currentTime;
      const dur = 0.09;
      trackVoice(dur);
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      const f = 110 + intensity * 90;
      o.frequency.setValueAtTime(f, now);
      o.frequency.exponentialRampToValueAtTime(38, now + dur);
      g.gain.setValueAtTime(Math.min(0.26, 0.06 + intensity * 0.16), now);
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      o.connect(g);
      g.connect(comp);
      o.start(now);
      o.stop(now + dur + 0.01);
    }
    function evict(combo = 1) {
      if (!canPlay()) return;
      const now = ctx.currentTime;
      const dur = 0.32;
      trackVoice(dur);
      const semitone = Math.pow(1.059463, Math.min(16, combo - 1));
      const base = 392 * semitone;
      [1, 1.25, 1.5].forEach((mult, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        const t0 = now + i * 0.045;
        o.frequency.setValueAtTime(base * mult, t0);
        o.frequency.exponentialRampToValueAtTime(base * mult * 1.06, t0 + 0.15);
        g.gain.setValueAtTime(0.001, t0);
        g.gain.linearRampToValueAtTime(0.2, t0 + 0.012);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.19);
        o.connect(g);
        g.connect(comp);
        o.start(t0);
        o.stop(t0 + 0.21);
      });
    }
    function gavel() {
      if (!canPlay()) return;
      const now = ctx.currentTime;
      trackVoice(0.45);
      [0, 0.14].forEach((offset) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(220, now + offset);
        o.frequency.exponentialRampToValueAtTime(55, now + offset + 0.11);
        g.gain.setValueAtTime(0.32, now + offset);
        g.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.12);
        o.connect(g);
        g.connect(comp);
        o.start(now + offset);
        o.stop(now + offset + 0.13);
      });
    }
    function clack() {
      if (!canPlay()) return;
      const now = ctx.currentTime;
      trackVoice(0.05);
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(950 + Math.random() * 250, now);
      o.frequency.exponentialRampToValueAtTime(220, now + 0.035);
      g.gain.setValueAtTime(0.12, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
      o.connect(g);
      g.connect(comp);
      o.start(now);
      o.stop(now + 0.045);
    }
    function toggleMute() {
      muted = !muted;
      if (muted && inhaleOsc) updateInhale(false, 0);
      return muted;
    }
    return {
      unlock, honk, updateInhale, objection, shatter, bump, evict, gavel, clack, toggleMute,
      isMuted: () => muted

  function enactNextRuling() {
    Game.rulingCount++;
    Game.stats.rulingsSurvived++;
    // Every 3rd ruling is guaranteed helpful breather
    const wantHelpful = (Game.rulingCount % 3 === 0);
    const activeIds = new Set(Game.activeRulings.map(r => r.id));
    let candidates = RULINGS.filter(r => !activeIds.has(r.id) && r.helpful === wantHelpful);
    if (candidates.length === 0) {
      candidates = RULINGS.filter(r => !activeIds.has(r.id));
    }
    if (candidates.length === 0) return;
    const chosen = pick(candidates);
    if (Game.activeRulings.length >= CFG.MAX_RULINGS) {
      Game.activeRulings.shift();
    }
    Game.activeRulings.push(chosen);
    Game.rulingBanner = {
      ruling: chosen,
      timer: 4.2,
      dur: 4.2
    };
    AudioSys.gavel();
    addTrauma(0.35);
    triggerHitStop(0.055);

  // ============================================================================
  // 9. HONK & PHYSICS SIMULATION

  function releaseHonk(overcharged = false) {
    const g = Game.goose;
    const ratio = clamp(g.chargeTime / CFG.GOOSE.CHARGE_TIME, 0.18, 1.35);
    const hasMega = hasRuling('MEGAPHONE');
    g.charging = false;
    g.chargeTime = 0;
    AudioSys.updateInhale(false, 0);
    Game.stats.honksFired++;
    let fireAngle = g.aimAngle;
    if (overcharged) {
      // Over-committed Honk-Sneeze!
      g.dizzyTimer = 1.65;
      g.spinVel = 22;
      fireAngle += rand(-0.65, 0.65);
      Game.stats.selfHonkDizzy++;
      addFloatText(g.x, g.y - 26, 'OVER-HONKED!', '#ff6b6b', 16, 1.1);
    }
    const power = overcharged ? 1.28 : clamp(ratio, 0.22, 1.05);
    AudioSys.honk(power, overcharged || hasMega);
    // Recoil opposite to aim!
    const smallGooseMult = hasRuling('SMALL_GOOSE') ? 1.38 : 1.0;
    const shagMult = hasRuling('SHAG_CARPET') ? 1.32 : 1.0;
    const recoilSpeed = lerp(CFG.GOOSE.RECOIL_MIN, CFG.GOOSE.RECOIL_MAX, power) * smallGooseMult;
    g.vx -= Math.cos(fireAngle) * recoilSpeed;
    g.vy -= Math.sin(fireAngle) * recoilSpeed;
    g.neckLen = 36;
    g.neckVel = 180;
    g.scaleX = 1.42;
    g.scaleY = 0.68;
    g.honkFlash = 0.18;
    if (power > 0.72 && !overcharged) {
      g.spinVel = (rng() < 0.5 ? 1 : -1) * 14 * power;
    }
    const range = lerp(CFG.GOOSE.HONK_RANGE_MIN, CFG.GOOSE.HONK_RANGE_MAX, power) * (hasMega ? 1.25 : 1.0);
    const arc = CFG.GOOSE.HONK_ARC * (hasMega ? 1.42 : 1.0);
    // Visual shockwave cone
    Game.shockwaves.push({
      x: g.x + Math.cos(fireAngle) * 18,
      y: g.y + Math.sin(fireAngle) * 18,
      angle: fireAngle,
      arc,
      maxR: range,
      r: 18,
      life: 0.22,
      maxLife: 0.22,
      mega: overcharged || hasMega || power > 0.88
    });
    addTrauma(0.14 + power * 0.24);
    // Check if the physical Lease Ledger HUD is inside the honk cone!
    const led = Game.ledger;
    const ldx = led.x - g.x;
    const ldy = led.y - g.y;
    const lDist = Math.hypot(ldx, ldy);
    if (lDist < range + 45) {
      const la = Math.atan2(ldy, ldx);
      if (Math.abs(normAngle(la - fireAngle)) <= arc * 0.6) {
        led.vx += Math.cos(la) * 480 * power;
        led.vy += Math.sin(la) * 480 * power;
        led.vAngle += rand(-14, 14);
        led.assaults++;
        led.flash = 0.25;
        if (led.assaults % 3 === 1) {
          addFloatText(led.x, led.y + 28, '"STOP HONKING THE LEASE!"', '#ffd166', 13, 0.9);
        }
      }
    }
    // Apply Honk blast to all tenants inside the cone
    let shatteredAny = false;
    for (let i = 0; i < Game.tenants.length; i++) {
      const t = Game.tenants[i];
      if (t.state === 'EVICTING') continue;
      const dx = t.x - g.x;
      const dy = t.y - g.y;
      const d = Math.hypot(dx, dy);
      if (d > range + t.r) continue;
      const dirAngle = Math.atan2(dy, dx);
      const diff = Math.abs(normAngle(dirAngle - fireAngle));
      if (diff > arc * 0.5 && d > t.r + 22) continue;
      const falloff = clamp(1.15 - d / (range + t.r), 0.35, 1.15);
      let force = (540 + power * 680) * falloff * shagMult / Math.pow(t.mass, 0.55);
      // DID WE CATCH THEM MID-ARGUMENT?! (OBJECTION SHATTERED!)
      const isArguing = (t.state === 'ARGUE');
      const dignityDmg = (power >= 0.72 ? 2 : 1) + (hasMega ? 1 : 0);
      if (isArguing) {
        t.dignity = 0;
        t.state = 'UNDIGNIFIED';
        t.stateTimer = 4.2;
        force *= 2.45; // 2.45x launch velocity!
        t.vAngle = (rng() < 0.5 ? -1 : 1) * 18;
        shatteredAny = true;
        Game.stats.perjuriesShattered++;
        spawnParticles(t.x, t.y, '#ffd166', 18, 280, 5);
        addFloatText(t.x, t.y - t.r - 12, 'OBJECTION OVERRULED! 2.5x', '#ffd166', 16, 1.15);
      } else {
        t.dignity = Math.max(0, t.dignity - dignityDmg);
        if (t.dignity <= 0 && t.state !== 'UNDIGNIFIED') {
          t.state = 'UNDIGNIFIED';
          t.stateTimer = 3.6;
          force *= 1.45;
          t.vAngle = (rng() < 0.5 ? -1 : 1) * 11;
          addFloatText(t.x, t.y - t.r - 8, 'UNDIGNIFIED!', '#4ecdc4', 14, 0.85);
        }
      }
      t.vx += Math.cos(dirAngle) * force;
      t.vy += Math.sin(dirAngle) * force;
      t.scaleX = 1.45;
      t.scaleY = 0.62;
      t.hitFlash = 0.2;
      t.lastHonkedTime = Game.time;
      t.billiardChain = isArguing ? 2 : 1;
    }
    if (shatteredAny) {
      AudioSys.shatter();
      triggerHitStop(0.075);
      addTrauma(0.35);
    }
  }
  function isPointInChute(x, y, r, isUndignified) {
    const openBonus = hasRuling('OPEN_CONCEPT') ? 1.45 : 1.0;
    for (let i = 0; i < CFG.CHUTES.length; i++) {
      const c = CFG.CHUTES[i];
      const cw = (c.side === 'top' || c.side === 'bottom') ? c.w * openBonus : c.w;
      const ch = (c.side === 'left' || c.side === 'right') ? c.h * openBonus : c.h;
      if (c.side === 'top' && y - r < CFG.WALL + 6 && Math.abs(x - c.x) < cw * 0.5 - r * 0.25) return c;
      if (c.side === 'bottom' && y + r > CFG.H - CFG.WALL - 6 && Math.abs(x - c.x) < cw * 0.5 - r * 0.25) return c;
      if (c.side === 'left' && x - r < CFG.WALL + 6 && Math.abs(y - c.y) < ch * 0.5 - r * 0.25) return c;
      if (c.side === 'right' && x + r > CFG.W - CFG.WALL - 6 && Math.abs(y - c.y) < ch * 0.5 - r * 0.25) return c;
    }
    return null;
  }
  function evictTenant(t, chute) {

    addFloatText(

    );
    // Illegal Subletting Ruling: heavy furniture spawns a tiny angry Ottoman on eviction!
    if (hasRuling('SUBLET_BOOM') && !t.isSublet && t.mass >= 1.4 && Game.tenants.length < 13) {
      const sub = spawnTenant('OTTOMAN', CFG.W * 0.5 + rand(-90, 90), CFG.H * 0.5 + rand(-60, 60), true);
      addFloatText(sub.x, sub.y - 20, '"SQUATTER SUBLET!"', '#ff6b6b', 13, 0.95);

  }
  // ============================================================================
  // 10. MAIN FIXED-TIMESTEP UPDATE
  // ============================================================================
  function updateSimulation(dt) {
    if (state === 'TITLE') {
      updateTitle(dt);
      return;
    }
    if (state === 'RECEIPT') {
      updateReceipt(dt);
      return;
    }
    // Handle hit-stop freeze
    if (Game.hitStop > 0) {
      Game.hitStop -= dt;
      updateVisualEffectsOnly(dt);
      return;
    }
    const effDt = dt * Game.timeScale;
    Game.time += effDt;
    if (state === 'DYING') {
      Game.dyingTimer -= dt;
      if (Game.dyingTimer <= 0) {
        state = 'RECEIPT';
        return;
      }
    }
    // Smooth score ticker
    if (Game.displayRent < Game.rent) {
      Game.displayRent = Math.min(Game.rent, Game.displayRent + Math.ceil((Game.rent - Game.displayRent) * 0.18));
    }
    // Combo decay
    if (Game.comboTimer > 0) {
      Game.comboTimer -= effDt;
      if (Game.comboTimer <= 0) Game.combo = 0;
    }
    // Ruling banner timer
    if (Game.rulingBanner) {
      Game.rulingBanner.timer -= dt;
      if (Game.rulingBanner.timer <= 0) Game.rulingBanner = null;
    }
    // Enact new HOA Emergency Ruling every 22s
    if (state === 'PLAY') {
      Game.nextRulingTimer -= effDt;
      if (Game.nextRulingTimer <= 0) {
        Game.nextRulingTimer = CFG.RULING_INTERVAL;
        enactNextRuling();
      }
    }
    // Spawn curve: logarithmic ramp so it stays brisk and funny
    if (state === 'PLAY') {
      Game.nextSpawnTimer -= effDt;
      const activeCount = Game.tenants.filter(t => t.state !== 'EVICTING').length;
      if (Game.nextSpawnTimer <= 0 || activeCount === 0) {
        const difficulty = 1 + 0.65 * Math.log2(1 + Game.time / 22);
        const interval = clamp(3.5 / difficulty, 1.15, 3.4);
        Game.nextSpawnTimer = interval;
        if (activeCount < 14) {
          spawnTenant();
        }
      }
      // Occupancy meter climbs with active squatters (grace period for first 10s)
      const grace = Game.time < 10 ? 0.35 : 1.0;
      const rate = (CFG.PASSIVE_RENT_LOSS + activeCount * CFG.TENANT_OCC_RATE) * grace;
      Game.occupancy = clamp(Game.occupancy + rate * effDt, 0, CFG.MAX_OCCUPANCY);
      if (Game.occupancy >= CFG.MAX_OCCUPANCY && state === 'PLAY') {
        triggerGameOver();
      }
    }
    // Environmental forces from active HOA Rulings
    const envFric = hasRuling('WAXED_FLOORS') ? 0.28 : (hasRuling('SHAG_CARPET') ? 1.55 : 1.0);
    const wallBounce = hasRuling('RUBBER_MOULDING') ? 1.32 : 0.78;
    const tiltForceX = hasRuling('TILT_EAST') ? 165 : 0;
    const fanActive = hasRuling('PENTHOUSE_FAN');
    if (fanActive) {
      Game.rugSpin = lerp(Game.rugSpin, 2.4, effDt * 2);
      Game.rugAngle += Game.rugSpin * effDt;
    } else {
      Game.rugSpin = lerp(Game.rugSpin, 0, effDt * 3);
      Game.rugAngle += Game.rugSpin * effDt;
    }
    // Update Goose Landlord
    updateGoose(effDt, envFric, wallBounce, tiltForceX, fanActive);
    // Update Physical Lease Ledger HUD
    updateLedger(effDt);
    // Update Tenants & Collisions
    updateTenants(effDt, envFric, wallBounce, tiltForceX, fanActive);
    // Visual effects
    updateVisualEffectsOnly(effDt);
  }
  function updateGoose(dt, envFric, wallBounce, tiltForceX, fanActive) {
    const g = Game.goose;
    const gRadius = hasRuling('SMALL_GOOSE') ? CFG.GOOSE.R * 0.68 : CFG.GOOSE.R;
    const speedMult = (hasRuling('SMALL_GOOSE') ? 1.25 : 1.0) * (hasRuling('COFFEE_SPILL') ? 1.32 : 1.0);
    const chargeSpeedMult = hasRuling('COFFEE_SPILL') ? 1.65 : 1.0;
    // Movement input (WASD / Arrows)
    let ix = 0, iy = 0;
    if (Input.keys.has('KeyW') || Input.keys.has('ArrowUp')) iy -= 1;
    if (Input.keys.has('KeyS') || Input.keys.has('ArrowDown')) iy += 1;
    if (Input.keys.has('KeyA') || Input.keys.has('ArrowLeft')) ix -= 1;
    if (Input.keys.has('KeyD') || Input.keys.has('ArrowRight')) ix += 1;
    if (ix !== 0 || iy !== 0) {
      const len = Math.hypot(ix, iy);
      ix /= len; iy /= len;
      if (g.dizzyTimer > 0) {
        // Inverted dizzy controls!
        ix = -ix; iy = -iy;
      }
      const chargeSlow = g.charging ? 0.58 : 1.0;
      g.vx += ix * CFG.GOOSE.ACCEL * speedMult * chargeSlow * dt;
      g.vy += iy * CFG.GOOSE.ACCEL * speedMult * chargeSlow * dt;
      g.waddlePhase += dt * 16 * speedMult;
    }
    // Aiming towards mouse cursor
    const targetAim = Math.atan2(Input.mouseY - g.y, Input.mouseX - g.x);
    const aimDiff = normAngle(targetAim - g.aimAngle);
    g.aimAngle = normAngle(g.aimAngle + aimDiff * Math.min(1, dt * 22));
    // Charging Honk (Mouse Left or Spacebar)
    const holdingHonk = (Input.mouseDown || Input.keys.has('Space')) && state === 'PLAY';
    if (holdingHonk && g.dizzyTimer <= 0) {
      if (!g.charging) {
        g.charging = true;
        g.chargeTime = 0;
      }
      g.chargeTime += dt * chargeSpeedMult;
      const chargeRatio = g.chargeTime / CFG.GOOSE.CHARGE_TIME;
      AudioSys.updateInhale(true, chargeRatio);
      // Spring neck back while inhaling
      g.neckLen = lerp(g.neckLen, 9, dt * 12);
      g.scaleX = lerp(g.scaleX, 0.86, dt * 10);
      g.scaleY = lerp(g.scaleY, 1.18, dt * 10);
      // Inhale suction pulls nearby lightweight clutter slightly toward goose!
      for (let i = 0; i < Game.tenants.length; i++) {
        const t = Game.tenants[i];
        if (t.state === 'EVICTING') continue;
        const dx = g.x - t.x;
        const dy = g.y - t.y;
        const d = Math.hypot(dx, dy);
        if (d > 24 && d < CFG.GOOSE.INHALE_PULL_RANGE) {
          const pull = (1 - d / CFG.GOOSE.INHALE_PULL_RANGE) * CFG.GOOSE.INHALE_PULL_FORCE * dt / t.mass;
          t.vx += (dx / d) * pull;
          t.vy += (dy / d) * pull;
        }
      }
      // Over-committed charge triggers automatic dizzy sneeze-honk!
      if (g.chargeTime >= CFG.GOOSE.OVERCHARGE_TIME) {
        releaseHonk(true);
      }
    } else if (g.charging) {
      releaseHonk(false);
    } else {
      AudioSys.updateInhale(false, 0);
    }
    // Environmental forces
    g.vx += tiltForceX * dt;
    if (fanActive) {
      const fdx = g.x - CFG.W * 0.5;
      const fdy = g.y - CFG.H * 0.5;
      const fd = Math.hypot(fdx, fdy) || 1;
      if (fd < 250) {
        const swirl = (1 - fd / 250) * 320;
        g.vx += (-fdy / fd) * swirl * dt;
        g.vy += (fdx / fd) * swirl * dt;
      }
    }
    // Friction & position update
    const fric = Math.exp(-CFG.GOOSE.FRIC * envFric * dt);
    g.vx *= fric;
    g.vy *= fric;
    g.x += g.vx * dt;
    g.y += g.vy * dt;
    // Wall collisions for Goose (Goose cannot fall down chutes, only bounce off railings)
    const minX = CFG.WALL + gRadius;
    const maxX = CFG.W - CFG.WALL - gRadius;
    const minY = CFG.WALL + gRadius;
    const maxY = CFG.H - CFG.WALL - gRadius;
    if (g.x < minX) { g.x = minX; g.vx = Math.abs(g.vx) * wallBounce; AudioSys.bump(0.3); }
    if (g.x > maxX) { g.x = maxX; g.vx = -Math.abs(g.vx) * wallBounce; AudioSys.bump(0.3); }
    if (g.y < minY) { g.y = minY; g.vy = Math.abs(g.vy) * wallBounce; AudioSys.bump(0.3); }
    if (g.y > maxY) { g.y = maxY; g.vy = -Math.abs(g.vy) * wallBounce; AudioSys.bump(0.3); }
    // Recover spring animations
    if (!g.charging) {

      g.neckVel = (g.neckVel + neckSpring * dt) * Math.exp(-12 * dt);
      g.neckLen += g.neckVel * dt;

    g.scaleX = lerp(g.scaleX, 1, dt * 12);
    g.scaleY = lerp(g.scaleY, 1, dt * 12);
    if (g.dizzyTimer > 0) g.dizzyTimer -= dt;
    if (g.honkFlash > 0) g.honkFlash -= dt;
    g.spinAngle += g.spinVel * dt;
    g.spinVel *= Math.exp(-7 * dt);
    if (Math.abs(g.spinVel) < 0.2) g.spinAngle = lerp(g.spinAngle, 0, dt * 12);
    g.blinkTimer -= dt;
    if (g.blinkTimer < -0.12) g.blinkTimer = rand(2.2, 4.8);

  function updateLedger(dt) {

    led.vx = (led.vx + (led.homeX - led.x) * k * dt) * damp;
    led.vy = (led.vy + (led.homeY - led.y) * k * dt) * damp;
    led.x += led.vx * dt;
    led.y += led.vy * dt;
    led.vAngle = (led.vAngle - led.angle * 65 * dt) * damp;
    led.angle += led.vAngle * dt;
    if (led.flash > 0) led.flash -= dt;

  function updateTenants(dt, envFric, wallBounce, tiltForceX, fanActive) {
    const g = Game.goose;

    const lawyerMult = hasRuling('LAWYER_UP') ? 1.45 : 1.0;
    const openChutes = hasRuling('OPEN_CONCEPT');

        const targetX = CFG.W * 0.5 + Math.cos(t.id * 1.7 + Game.time * 0.7) * 140;
        const targetY = CFG.H * 0.5 + Math.sin(t.id * 2.3 + Game.time * 0.7) * 95;
        const dx = targetX - t.x;
        const dy = targetY - t.y;
        const d = Math.hypot(dx, dy) || 1;

          // and the Sovereign Citizen Fridge honks back!
          const gDist = Math.hypot(g.x - t.x, g.y - t.y);
          const pushRadius = t.kind === 'FRIDGE' ? 145 : 85;
          if (gDist < pushRadius) {
            const ang = Math.atan2(g.y - t.y, g.x - t.x);
            const push = t.kind === 'FRIDGE' ? 320 : 145;
            g.vx += Math.cos(ang) * push;
            g.vy += Math.sin(ang) * push;

        }
      } else if (t.state === 'ARGUE') {

        if (t.stateTimer <= 0) {

          t.argueTimer = t.spec.argueEvery * rand(0.75, 1.25);

      } else if (t.state === 'UNDIGNIFIED') {
        t.stateTimer -= dt;
        t.angle += t.vAngle * dt;
        t.vAngle *= Math.exp(-2.5 * dt);
        // Open-concept chutes gently magnetize Undignified furniture toward nearest exit
        if (openChutes) {
          let bestC = null, bestD = 999999;
          for (let c of CFG.CHUTES) {
            const cd = distSq(t.x, t.y, c.x, c.y);
            if (cd < bestD) { bestD = cd; bestC = c; }
          }
          if (bestC && bestD < 240 * 240) {
            const ang = Math.atan2(bestC.y - t.y, bestC.x - t.x);
            t.vx += Math.cos(ang) * 260 * dt;
            t.vy += Math.sin(ang) * 260 * dt;
          }
        }
        if (t.stateTimer <= 0) {
          t.state = 'ROAM';
          t.dignity = Math.ceil(t.dignityMax * 0.5);
          t.angle = 0;
          t.vAngle = 0;
          t.billiardChain = 0;
        }
      }
      // Environmental forces
      t.vx += tiltForceX * dt;
      if (fanActive) {
        const fdx = t.x - CFG.W * 0.5;
        const fdy = t.y - CFG.H * 0.5;
        const fd = Math.hypot(fdx, fdy) || 1;
        if (fd < 260) {
          const swirl = (1 - fd / 260) * 340 / Math.sqrt(t.mass);
          t.vx += (-fdy / fd) * swirl * dt;
          t.vy += (fdx / fd) * swirl * dt;
        }
      }
      // Apply floor friction (Undignified furniture slides much further!)
      const slideFactor = t.state === 'UNDIGNIFIED' ? 0.42 : 1.0;
      const fric = Math.exp(-3.8 * envFric * slideFactor * dt);
      t.vx *= fric;
      t.vy *= fric;
      t.x += t.vx * dt;
      t.y += t.vy * dt;
      // Check if tenant entered an Eviction Chute!
      const speed = Math.hypot(t.vx, t.vy);
      const chute = isPointInChute(t.x, t.y, t.r, t.state === 'UNDIGNIFIED');
      if (chute && (t.state === 'UNDIGNIFIED' || speed > 135 || Game.time - t.lastHonkedTime < 1.6)) {

      const minX = CFG.WALL + t.r;
      const maxX = CFG.W - CFG.WALL - t.r;
      const minY = CFG.WALL + t.r;
      const maxY = CFG.H - CFG.WALL - t.r;
      if (t.x < minX) { t.x = minX; t.vx = Math.abs(t.vx) * wallBounce; }
      if (t.x > maxX) { t.x = maxX; t.vx = -Math.abs(t.vx) * wallBounce; }
      if (t.y < minY) { t.y = minY; t.vy = Math.abs(t.vy) * wallBounce; }
      if (t.y > maxY) { t.y = maxY; t.vy = -Math.abs(t.vy) * wallBounce; }
      // Recover squash/stretch
      t.scaleX = lerp(t.scaleX, 1, dt * 10);

      t.blinkTimer -= dt;
      if (t.blinkTimer < -0.12) t.blinkTimer = rand(1.8, 4.5);

      const gdx = t.x - g.x;
      const gdy = t.y - g.y;
      const gdSq = gdx * gdx + gdy * gdy;
      const minDist = t.r + gRadius;
      if (gdSq < minDist * minDist && gdSq > 0.0001) {
        const gd = Math.sqrt(gdSq);
        const nx = gdx / gd;
        const ny = gdy / gd;
        const overlap = minDist - gd;
        t.x += nx * overlap * 0.55;
        t.y += ny * overlap * 0.55;
        g.x -= nx * overlap * 0.45;
        g.y -= ny * overlap * 0.45;
        const relVx = t.vx - g.vx;
        const relVy = t.vy - g.vy;
        const sepVel = relVx * nx + relVy * ny;
        if (sepVel < 0) {
          const imp = -sepVel * 1.15;
          t.vx += nx * imp / t.mass;
          t.vy += ny * imp / t.mass;
          g.vx -= nx * imp * 0.65;
          g.vy -= ny * imp * 0.65;

        }
      }
    }
    // Tenant <-> Tenant Billiard Collisions!
    for (let i = 0; i < Game.tenants.length; i++) {
      const a = Game.tenants[i];
      if (a.state === 'EVICTING') continue;
      for (let j = i + 1; j < Game.tenants.length; j++) {
        const b = Game.tenants[j];
        if (b.state === 'EVICTING') continue;
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const dSq = dx * dx + dy * dy;
        const minDist = a.r + b.r;
        if (dSq < minDist * minDist && dSq > 0.0001) {
          const d = Math.sqrt(dSq);
          const nx = dx / d;
          const ny = dy / d;
          const overlap = minDist - d;
          const totalMass = a.mass + b.mass;
          a.x -= nx * overlap * (b.mass / totalMass);
          a.y -= ny * overlap * (b.mass / totalMass);
          b.x += nx * overlap * (a.mass / totalMass);
          b.y += ny * overlap * (a.mass / totalMass);
          const rvx = b.vx - a.vx;
          const rvy = b.vy - a.vy;
          const velAlongNormal = rvx * nx + rvy * ny;
          if (velAlongNormal < 0) {
            const restitution = 0.92;
            const jImpulse = -(1 + restitution) * velAlongNormal / (1 / a.mass + 1 / b.mass);
            const ix = jImpulse * nx;
            const iy = jImpulse * ny;
            a.vx -= ix / a.mass;
            a.vy -= iy / a.mass;
            b.vx += ix / b.mass;
            b.vy += iy / b.mass;
            const impactSpeed = Math.abs(velAlongNormal);
            if (impactSpeed > 155) {
              AudioSys.bump(clamp(impactSpeed / 500, 0.25, 1));
              a.scaleX = 1.25; a.scaleY = 0.78;
              b.scaleX = 1.25; b.scaleY = 0.78;
              spawnParticles((a.x + b.x) * 0.5, (a.y + b.y) * 0.5, '#f6f1e6', 5, 110, 3);
              // Billiard Dignity transfer! Fast furniture strips dignity from what it slams into
              if (a.state === 'UNDIGNIFIED' || (Game.time - a.lastHonkedTime < 1.2 && impactSpeed > 220)) {
                b.dignity = Math.max(0, b.dignity - 1);
                b.lastHonkedTime = Game.time;
                b.billiardChain = Math.max(b.billiardChain, (a.billiardChain || 1) + 1);
                Game.stats.collaterals++;
                if (b.dignity <= 0 && b.state !== 'UNDIGNIFIED') {
                  b.state = 'UNDIGNIFIED';
                  b.stateTimer = 3.2;
                  b.vAngle = 12;
                  addFloatText(b.x, b.y - b.r, 'COLLATERAL!', '#4ecdc4', 13, 0.8);
                }
              }
              if (b.state === 'UNDIGNIFIED' || (Game.time - b.lastHonkedTime < 1.2 && impactSpeed > 220)) {
                a.dignity = Math.max(0, a.dignity - 1);
                a.lastHonkedTime = Game.time;
                a.billiardChain = Math.max(a.billiardChain, (b.billiardChain || 1) + 1);
                Game.stats.collaterals++;
                if (a.dignity <= 0 && a.state !== 'UNDIGNIFIED') {
                  a.state = 'UNDIGNIFIED';
                  a.stateTimer = 3.2;
                  a.vAngle = -12;
                  addFloatText(a.x, a.y - a.r, 'COLLATERAL!', '#4ecdc4', 13, 0.8);
                }
              }
            }
          }
        }
      }
    }
  }

  function drawGooglyEye(x, y, r, lookX, lookY, blinking, dizzyTime = 0) {

    ctx.translate(x, y);

      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(-r, 0);
      ctx.lineTo(r, 0);
      ctx.stroke();
      ctx.restore();

    }
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#141118';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);

    ctx.stroke();

    if (dizzyTime > 0) {
      px = Math.cos(Game.time * 22 + x) * (r * 0.45);
      py = Math.sin(Game.time * 22 + y) * (r * 0.45);

      const ang = Math.atan2(lookY - y, lookX - x);
      const dist = Math.min(r * 0.42, Math.hypot(lookX - x, lookY - y) * 0.04);
      px = Math.cos(ang) * dist;
      py = Math.sin(ang) * dist;
    }
    ctx.fillStyle = '#141118';
    ctx.beginPath();
    ctx.arc(px, py, r * 0.48, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

        ctx.lineTo(r * 0.85, -r * 0.25);
        ctx.stroke();

        ctx.fillRect(r * 0.48, -r * 0.75, 4, r * 1.3);
      } else if (t.spec.shape === 'chair') {

        ctx.beginPath();
        ctx.roundRect(-r, -r * 0.85, r * 2, r * 1.7, 9);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = t.spec.trim;
        ctx.beginPath();
        ctx.roundRect(-r * 0.7, -r * 0.45, r * 1.4, r * 1.1, 5);
        ctx.fill();
        ctx.stroke();
      } else if (t.spec.shape === 'bush') {
        // Emotional Support Ficus
        ctx.fillStyle = t.spec.trim;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.65, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = t.hitFlash > 0 ? '#ffffff' : t.spec.color;
        for (let a = 0; a < 6; a++) {
          const ang = (a / 6) * Math.PI * 2;
          ctx.beginPath();
          ctx.arc(Math.cos(ang) * r * 0.45, Math.sin(ang) * r * 0.45, r * 0.56, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }
      } else {

        ctx.beginPath();
        ctx.roundRect(-r, -r * 0.85, r * 2, r * 1.7, 10);
        ctx.fill();
        ctx.stroke();
      }
      // Expressive Googly Eyes tracking the Goose!
      const eyeSpread = Math.min(9, r * 0.36);
      const eyeY = -r * 0.15;
      const blinking = t.blinkTimer < 0;
      drawGooglyEye(-eyeSpread, eyeY, 5.2, g.x - t.x, g.y - t.y, blinking, t.state === 'UNDIGNIFIED' ? 1 : 0);
      drawGooglyEye(eyeSpread, eyeY, 5.2, g.x - t.x, g.y - t.y, blinking, t.state === 'UNDIGNIFIED' ? 1 : 0);
      // Animated shouting mouth when arguing!
      if (t.state === 'ARGUE') {
        ctx.fillStyle = '#141118';
        ctx.beginPath();
        ctx.ellipse(0, r * 0.32, 6.5, 4 + Math.sin(Game.time * 40) * 2.5, 0, 0, Math.PI * 2);
        ctx.fill();
      } else if (t.state === 'UNDIGNIFIED') {
        ctx.strokeStyle = '#141118';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, r * 0.38, 4.5, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
      // Dignity Pips (Crown badges above multi-dignity furniture)
      if (t.state !== 'EVICTING' && t.dignityMax > 1) {
        const pipW = 10;
        const startX = t.x - ((t.dignityMax - 1) * pipW) * 0.5;
        const pipY = t.y + t.r + 9;
        for (let p = 0; p < t.dignityMax; p++) {
          ctx.fillStyle = p < t.dignity ? '#ffd166' : '#2f2838';
          ctx.strokeStyle = '#141118';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(startX + p * pipW, pipY, 3.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }
      }
      // Speech Bubble when mid-argument!
      if (t.state === 'ARGUE') {

      renderTenants();
      renderGoose();
      renderEffects();
      renderHUD();
    } else if (Game.tenants.length > 0 && Game.goose) {
      renderTenants();
      renderGoose();
    }
    ctx.restore();
    if (state === 'TITLE') {
      renderTitleOverlay();
    } else if (state === 'RECEIPT') {
      renderReceiptOverlay();
    }
    ctx.restore();
  }
  // ============================================================================
  // 12. MAIN ENGINE LOOP & GLOBAL SHORTCUTS
  // ============================================================================
  let lastTime = performance.now();
  let accumulator = 0;
  function frame(now) {
    let frameDt = (now - lastTime) / 1000;
    lastTime = now;
    if (frameDt > 0.1) frameDt = 0.1;
    // Instant meta keys
    if (Input.justPressed.has('KeyM')) {
      AudioSys.toggleMute();
    }
    if (Input.justPressed.has('Backquote')) {
      debugOpen = !debugOpen;
    }
    if (Input.justPressed.has('KeyR') && (state === 'PLAY' || state === 'DYING')) {
      AudioSys.honk(0.6, false);
      startNewRun();
    }
    accumulator += frameDt;
    let steps = 0;
    while (accumulator >= CFG.DT && steps < 6) {
      updateSimulation(CFG.DT);
      Input.justPressed.clear();
      Input.mouseJustDown = false;
      Input.mouseJustUp = false;
      accumulator -= CFG.DT;
      steps++;
    }
    if (steps === 6) accumulator = 0;
    render();
    requestAnimationFrame(frame);
  }
  // Expose debug hook for automated verification
  window.__HONKCOURT__ = {
    getState: () => state,
    startNewRun,
    enactNextRuling,
    triggerGameOver,
    Game
  };
  requestAnimationFrame(frame);
})();
</script>
