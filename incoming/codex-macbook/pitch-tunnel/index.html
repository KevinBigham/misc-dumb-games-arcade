<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#07131b">
<title>PITCH TUNNEL — A Nine-Zone Mind Game</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #030a0f; }
  body {
    display: grid; place-items: center; overscroll-behavior: none;
    font-family: "Courier New", ui-monospace, monospace;
    background: radial-gradient(ellipse at 50% 35%, #132b35 0%, #07131b 52%, #03090d 100%);
  }
  canvas {
    display: block; width: 1200px; height: 760px; max-width: 100vw; max-height: 100vh;
    touch-action: none; user-select: none; -webkit-user-select: none;
    outline: none; box-shadow: 0 24px 100px #000a;
  }
  #sr { position: fixed; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" role="application" aria-label="PITCH TUNNEL. A three-inning baseball mind game. Q W E select pitch type, number keys 1 through 9 select a zone, Space locks a pitch or swings, P pauses, and M toggles sound. Mouse and touch controls are also available."></canvas>
<div id="sr" aria-live="polite"></div>
<script>
(() => {
'use strict';

// PITCH TUNNEL — all visuals, simulation, and audio are generated locally.
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
const sr = document.getElementById('sr');
const W = 1200, H = 760, STEP = 1 / 60;
const C = {
  ink: '#07131b', deep: '#0b1c25', panel: '#102832', line: '#29434a',
  cream: '#f3ead2', muted: '#91a8a6', mint: '#70f2bd', orange: '#ff805d',
  gold: '#f6c85f', red: '#ff5964', blue: '#72b7ff', white: '#ffffff'
};
const TYPES = ['fastball', 'curve', 'change'];
const TYPE_META = {
  fastball: { short: 'FAST', key: 'Q', color: C.orange, duration: 1.04, fatigue: 7, label: 'FASTBALL', note: 'STRIKE / FUEL' },
  curve:    { short: 'CURV', key: 'W', color: C.mint, duration: 1.20, fatigue: 9, label: 'CURVEBALL', note: 'CHASE / RISK' },
  change:   { short: 'CHNG', key: 'E', color: C.gold, duration: 1.31, fatigue: 5, label: 'CHANGEUP', note: 'TIMING / DROP' }
};
const ZONE = { x: 504, y: 294, w: 192, h: 228 };
const TUNNEL_POINT = { x: 600, y: 356 };
const RELEASE_POINT = { x: 600, y: 254 };
const SAVE_KEY = 'pitchTunnel.save.v1';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t);
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const countKey = () => `${game.balls}-${game.strikes}`;
const situation = () => game.strikes > game.balls ? 'ahead' : game.balls > game.strikes ? 'behind' : 'even';

let save = { wins: 0, losses: 0, ties: 0, muted: false };
try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) {
    const data = JSON.parse(raw);
    for (const k of ['wins', 'losses', 'ties']) {
      if (Number.isInteger(data[k]) && data[k] >= 0 && data[k] < 100000) save[k] = data[k];
    }
    if (typeof data.muted === 'boolean') save.muted = data.muted;
  }
} catch (_) { /* Storage can be disabled; the game remains fully playable. */ }
function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (_) {}
}

class AudioPark {
  constructor() { this.ac = null; this.master = null; this.crowd = null; this.excitement = 0; }
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ac = new AC();
      this.master = this.ac.createGain();
      this.master.gain.value = save.muted ? 0 : 0.72;
      this.master.connect(this.ac.destination);
      const length = this.ac.sampleRate * 2;
      const buffer = this.ac.createBuffer(1, length, this.ac.sampleRate);
      const data = buffer.getChannelData(0);
      let last = 0;
      for (let i = 0; i < length; i++) {
        last = last * 0.84 + (Math.random() * 2 - 1) * 0.16;
        data[i] = last * (0.72 + 0.28 * Math.sin(i * 0.00019));
      }
      const source = this.ac.createBufferSource();
      source.buffer = buffer; source.loop = true;
      const filter = this.ac.createBiquadFilter();
      filter.type = 'bandpass'; filter.frequency.value = 510; filter.Q.value = 0.52;
      this.crowd = this.ac.createGain(); this.crowd.gain.value = 0.045;
      source.connect(filter); filter.connect(this.crowd); this.crowd.connect(this.master);
      source.start();
    } catch (_) { this.ac = null; }
  }
  mute() {
    if (!this.ac || !this.master) return;
    this.master.gain.setTargetAtTime(save.muted ? 0 : 0.72, this.ac.currentTime, 0.025);
  }
  tone(freq, duration, type = 'square', volume = 0.08, endFreq = freq) {
    if (!this.ac || save.muted) return;
    const t = this.ac.currentTime;
    const osc = this.ac.createOscillator(), gain = this.ac.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), t + duration);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(volume, t + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(gain); gain.connect(this.master); osc.start(t); osc.stop(t + duration + 0.02);
  }
  noise(duration = 0.1, volume = 0.12, frequency = 900) {
    if (!this.ac || save.muted) return;
    const len = Math.max(1, (this.ac.sampleRate * duration) | 0);
    const buf = this.ac.createBuffer(1, len, this.ac.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ac.createBufferSource(), filter = this.ac.createBiquadFilter(), gain = this.ac.createGain();
    src.buffer = buf; filter.type = 'bandpass'; filter.frequency.value = frequency; filter.Q.value = 0.7;
    gain.gain.value = volume; src.connect(filter); filter.connect(gain); gain.connect(this.master); src.start();
  }
  ui() { this.tone(520, 0.055, 'square', 0.045, 660); }
  lock() { this.tone(180, 0.09, 'square', 0.07, 280); this.tone(620, 0.05, 'sine', 0.04, 740); }
  pitch() { this.noise(0.18, 0.045, 1200); }
  swing() { this.noise(0.13, 0.12, 1450); this.tone(130, 0.1, 'sine', 0.05, 70); }
  strike() { this.tone(160, 0.16, 'square', 0.1, 105); }
  ball() { this.tone(350, 0.09, 'sine', 0.055, 390); }
  hit(q) { this.noise(0.08, 0.19, 1900); this.tone(92, 0.16, 'triangle', 0.16, 48); if (q > 0.8) this.cheer(1); }
  cheer(amount = 0.7) {
    this.excitement = Math.max(this.excitement, amount);
    this.noise(0.55, 0.08 * amount, 650);
    this.tone(330, 0.16, 'square', 0.035, 440);
    setTimeout(() => this.tone(440, 0.2, 'square', 0.035, 550), 100);
  }
  update(dt) {
    this.excitement = Math.max(0, this.excitement - dt * 0.35);
    if (this.crowd && this.ac) this.crowd.gain.setTargetAtTime(0.04 + this.excitement * 0.12, this.ac.currentTime, 0.12);
  }
}
const audio = new AudioPark();

// A rolling 20-choice model: global frequencies + P(next | previous) Markov counts.
class HabitModel {
  constructor() { this.entries = []; }
  clear() { this.entries.length = 0; }
  push(type, zone, key, situ) {
    this.entries.push({ type, zone, countKey: key, situation: situ });
    if (this.entries.length > 20) this.entries.shift();
  }
  distribution(key) {
    const values = key === 'type' ? TYPES : [0,1,2,3,4,5,6,7,8];
    const freq = Object.fromEntries(values.map(v => [v, 0]));
    const trans = Object.fromEntries(values.map(v => [v, 0]));
    const n = this.entries.length;
    for (const e of this.entries) freq[e[key]]++;
    let transitions = 0;
    if (n > 1) {
      const previous = this.entries[n - 1][key];
      for (let i = 1; i < n; i++) {
        if (this.entries[i - 1][key] === previous) { trans[this.entries[i][key]]++; transitions++; }
      }
    }
    const out = {};
    for (const v of values) {
      const f = n ? freq[v] / n : 1 / values.length;
      const m = transitions ? trans[v] / transitions : f;
      const markovWeight = transitions >= 2 ? 0.58 : transitions ? 0.35 : 0;
      out[v] = f * (1 - markovWeight) + m * markovWeight;
    }
    return out;
  }
  confidence(key) {
    const d = this.distribution(key), n = this.entries.length;
    const raw = Math.max(...Object.values(d));
    const baseline = 1 / (key === 'type' ? 3 : 9);
    return clamp((raw - baseline) / (1 - baseline) * Math.min(1, n / 6), 0, 1);
  }
  report(key) {
    let rows = this.entries.filter(e => e.countKey === key);
    let label = `ON ${key.replace('-', '–')}`;
    if (!rows.length) {
      const last = this.entries[this.entries.length - 1];
      if (last) rows = this.entries.filter(e => e.situation === last.situation);
      label = last ? `WHEN ${last.situation.toUpperCase()}` : 'EARLY SAMPLE';
    }
    if (!rows.length) rows = this.entries.slice();
    const counts = { fastball: 0, curve: 0, change: 0 };
    rows.forEach(e => counts[e.type]++);
    const best = TYPES.reduce((a, b) => counts[a] >= counts[b] ? a : b);
    const pct = rows.length ? Math.round(counts[best] / rows.length * 100) : 0;
    return { label, pct, type: best, n: rows.length };
  }
}

const playerPitches = new HabitModel();
const playerGuesses = new HabitModel();
const cpuPitches = new HabitModel();

const game = {
  inning: 1, side: 0, balls: 0, strikes: 0, outs: 0, bases: [false, false, false],
  score: [0, 0], hits: [0, 0], lines: [[0,0,0],[0,0,0]],
  playerFatigue: 0, cpuFatigue: 0, phase: 'select', pitch: null, result: null,
  selectedType: 'fastball', selectedZone: 4, resultTimer: 0, report: null,
  halfTitle: '', halfSub: '', lastAnnouncement: 'Three innings. Nine zones. Nowhere to hide.',
  stats: null, recordSaved: false, flash: 0, shake: 0, swingAnim: 0, time: 0
};
function freshStats() {
  return { pitches: [0,0], strikes: [0,0], homeRuns: [0,0], strikeouts: [0,0], walks: [0,0], bestRead: 0, swings: 0, guessedBoth: 0 };
}
game.stats = freshStats();
let mode = 'title', paused = false, globalTime = 0;

function announce(text) {
  game.lastAnnouncement = text;
  sr.textContent = text;
}
function resetCount() { game.balls = 0; game.strikes = 0; }
function startGame() {
  game.inning = 1; game.side = 0; game.outs = 0; game.bases = [false,false,false];
  game.score = [0,0]; game.hits = [0,0]; game.lines = [[0,0,0],[0,0,0]];
  game.playerFatigue = 0; game.cpuFatigue = 0; game.pitch = null; game.result = null;
  game.selectedType = 'fastball'; game.selectedZone = 4; game.stats = freshStats();
  game.recordSaved = false; game.flash = 0; game.shake = 0; game.swingAnim = 0;
  playerPitches.clear(); playerGuesses.clear(); cpuPitches.clear();
  resetCount(); game.phase = 'select'; game.resultTimer = 0; game.report = null;
  mode = 'game'; paused = false;
  announce('Top one. You bat for the Neon Moths. Read the release.');
  audio.lock();
}
function finishGame() {
  mode = 'box'; game.phase = 'select'; game.pitch = null;
  if (!game.recordSaved) {
    if (game.score[0] > game.score[1]) save.wins++;
    else if (game.score[0] < game.score[1]) save.losses++;
    else save.ties++;
    save.ties = Math.max(0, save.ties);
    game.recordSaved = true; persist();
  }
  audio.cheer(1);
}

function fatigueName(value) { return value < 30 ? 'FRESH' : value < 65 ? 'WORN' : 'GASSED'; }
function zoneCenter(index) {
  const col = index % 3, row = (index / 3) | 0;
  return { x: ZONE.x + (col + 0.5) * ZONE.w / 3, y: ZONE.y + (row + 0.5) * ZONE.h / 3 };
}
function weightedChoice(distribution) {
  let r = Math.random(), sum = 0;
  for (const k of Object.keys(distribution)) { sum += distribution[k]; if (r <= sum) return k; }
  return Object.keys(distribution)[0];
}
function predictedKey(model, key) {
  const d = model.distribution(key);
  return Object.keys(d).reduce((a,b) => d[a] >= d[b] ? a : b);
}

function cpuSelectPitch() {
  // The CPU chooses against what it expects the player to guess, not a dominant fixed pitch.
  const guessedType = playerGuesses.distribution('type');
  const guessedZone = playerGuesses.distribution('zone');
  const f = game.cpuFatigue / 100;
  const typeScores = {};
  for (const t of TYPES) {
    let score = -guessedType[t] * 1.75 + rand(-0.16, 0.16);
    if (game.strikes === 2 && t !== 'fastball') score += 0.26;
    if (game.balls >= 2 && t === 'fastball') score += 0.36;
    if (t === 'change' && cpuPitches.entries.length && cpuPitches.entries[cpuPitches.entries.length - 1].type === 'fastball') score += 0.18;
    if (t === 'curve') score -= f * 0.24;
    if (t === 'fastball') score -= f * 0.15;
    if (t === 'change') score += f * 0.08;
    typeScores[t] = score;
  }
  const type = TYPES.reduce((a,b) => typeScores[a] >= typeScores[b] ? a : b);
  let bestZone = 4, best = Infinity;
  for (let z = 0; z < 9; z++) {
    const edge = z === 4 ? 0 : (z % 2 === 0 ? 0.11 : 0.055);
    let score = guessedZone[z] * 1.45 + rand(-0.07, 0.07);
    if (game.strikes === 2) score -= edge;
    if (game.balls >= 2) score += edge * 2.2;
    if (z === 4 && game.balls >= 2) score -= 0.13;
    if (score < best) { best = score; bestZone = z; }
  }
  return { type, zone: bestZone };
}
function cpuMakeGuess() {
  const td = playerPitches.distribution('type'), zd = playerPitches.distribution('zone');
  // Mostly selects the MAP prediction, but retains uncertainty instead of cheating.
  const type = Math.random() < 0.82 ? predictedKey(playerPitches, 'type') : weightedChoice(td);
  const zone = Number(Math.random() < 0.76 ? predictedKey(playerPitches, 'zone') : weightedChoice(zd));
  const read = Math.max(playerPitches.confidence('type'), playerPitches.confidence('zone'));
  game.stats.bestRead = Math.max(game.stats.bestRead, read);
  return { type, zone, read };
}

function makePitch(type, zone, fatigue, playerBatting, guess) {
  const target = zoneCenter(zone);
  const f = fatigue / 100;
  const meta = TYPE_META[type];
  let x = target.x + rand(-1,1) * (5 + fatigue * 0.12);
  let y = target.y + rand(-1,1) * (5 + fatigue * 0.11);
  const col = zone % 3, row = (zone / 3) | 0;
  const edge = zone !== 4;
  let wasteChance = type === 'fastball' ? 0.025 + f * 0.08 : 0.075 + f * 0.14;
  if (game.strikes === 2 && edge) wasteChance += playerBatting ? 0.48 : 0.13;
  if (type === 'curve' && edge) wasteChance += 0.08;
  if (Math.random() < wasteChance) {
    const dx = col === 0 ? -1 : col === 2 ? 1 : rand(-0.35,0.35);
    const dy = row === 0 ? -1 : row === 2 ? 1 : (type === 'change' ? 1 : rand(-0.3,0.3));
    const magnitude = rand(34, 52) + fatigue * 0.15;
    x += dx * magnitude; y += dy * magnitude;
  }
  if (type === 'change') y += 7;
  if (type === 'curve') x += (col === 0 ? -1 : 1) * 5;
  const isStrike = x >= ZONE.x && x <= ZONE.x + ZONE.w && y >= ZONE.y && y <= ZONE.y + ZONE.h;
  const duration = meta.duration + f * (type === 'fastball' ? 0.18 : 0.10);
  return {
    type, zone, final: {x,y}, isStrike, duration, t: 0, playerBatting, guess, countKey: countKey(),
    swung: false, decided: false, willSwing: false, swingAt: 0, trailSeed: Math.random(),
    typeMatch: guess.type === type, zoneMatch: guess.zone === zone
  };
}
function prepareCpuSwing(pitch) {
  const f = game.playerFatigue / 100;
  const timingSigma = 0.112 - (pitch.typeMatch ? 0.019 : 0) - (pitch.zoneMatch ? 0.015 : 0) - pitch.guess.read * 0.022 + f * 0.022;
  const error = (rand(-1,1) + rand(-1,1) + rand(-1,1)) * timingSigma;
  const chase = game.strikes === 2 ? 0.46 : game.balls > game.strikes ? 0.12 : 0.27;
  pitch.willSwing = pitch.isStrike || Math.random() < chase;
  pitch.swingAt = pitch.duration + error;
  pitch.decided = true;
}
function lockSelection() {
  if (mode !== 'game' || paused || game.phase !== 'select') return;
  audio.init(); audio.lock();
  const key = countKey(), situ = situation(), type = game.selectedType, zone = game.selectedZone;
  let pitch;
  if (game.side === 0) {
    const actual = cpuSelectPitch();
    pitch = makePitch(actual.type, actual.zone, game.cpuFatigue, true, { type, zone, read: 0 });
    if (pitch.typeMatch && pitch.zoneMatch) game.stats.guessedBoth++;
    playerGuesses.push(type, zone, key, situ);
    cpuPitches.push(actual.type, actual.zone, key, situ);
    game.cpuFatigue = clamp(game.cpuFatigue + TYPE_META[actual.type].fatigue, 0, 100);
    game.stats.pitches[1]++;
    if (pitch.isStrike) game.stats.strikes[1]++;
    announce(`Pitch on the way. Your call: ${TYPE_META[type].label}, zone ${zone + 1}.`);
  } else {
    const guess = cpuMakeGuess();
    pitch = makePitch(type, zone, game.playerFatigue, false, guess);
    playerPitches.push(type, zone, key, situ);
    game.playerFatigue = clamp(game.playerFatigue + TYPE_META[type].fatigue, 0, 100);
    game.stats.pitches[0]++;
    if (pitch.isStrike) game.stats.strikes[0]++;
    announce(`You deliver the ${TYPE_META[type].label}. The Wraiths are reading your patterns.`);
  }
  game.pitch = pitch; game.phase = 'flight'; game.result = null; game.swingAnim = 0;
  audio.pitch();
}
function swing() {
  if (mode !== 'game' || paused || game.phase !== 'flight' || !game.pitch || game.side !== 0 || game.pitch.swung) return;
  game.pitch.swung = true; game.stats.swings++;
  resolveSwing(game.pitch.t - game.pitch.duration);
}
function timingWindow(p) {
  return 0.105 + (p.typeMatch ? 0.042 : 0) + (p.zoneMatch ? 0.035 : 0) + (p.playerBatting ? game.cpuFatigue : game.playerFatigue) * 0.00018;
}
function addRuns(n) {
  if (!n) return;
  game.score[game.side] += n;
  game.lines[game.side][game.inning - 1] += n;
}
function advanceWalk() {
  let runs = 0;
  if (game.bases[0]) {
    if (game.bases[1]) {
      if (game.bases[2]) runs++;
      game.bases[2] = true;
    }
    game.bases[1] = true;
  }
  game.bases[0] = true; addRuns(runs); return runs;
}
function advanceHit(n) {
  let runs = 0;
  const next = [false,false,false];
  for (let i = 2; i >= 0; i--) {
    if (!game.bases[i]) continue;
    const dest = i + n;
    if (dest >= 3) runs++; else next[dest] = true;
  }
  if (n >= 4) runs++; else next[n - 1] = true;
  game.bases = next; addRuns(runs); return runs;
}
function setResult(title, detail, color, atBatOver, kind, quality = 0) {
  game.result = { title, detail, color, atBatOver, kind, quality, countKey: game.pitch ? game.pitch.countKey : countKey() };
  game.resultTimer = kind === 'foul' || kind === 'strike' || kind === 'ball' ? 1.12 : 1.48;
  game.phase = 'result'; game.flash = kind === 'homer' ? 0.8 : 0.28;
  if (kind === 'out' || kind === 'strikeout') game.shake = 0.16;
}
function resolveSwing(error) {
  const p = game.pitch;
  if (!p || game.phase !== 'flight') return;
  audio.swing(); game.swingAnim = 0.34;
  const abs = Math.abs(error), windowSize = timingWindow(p);
  const who = game.side === 0 ? 'You' : 'The Wraiths';
  if (abs > windowSize) {
    game.strikes++;
    const timing = error < 0 ? 'OUT IN FRONT' : 'LATE ON IT';
    if (game.strikes >= 3) {
      game.outs++; game.stats.strikeouts[1 - game.side]++;
      setResult('STRIKE THREE', `${who} ${game.side === 0 ? 'chase' : 'chases'} • ${timing}`, C.orange, true, 'strikeout');
      announce(`${game.side === 0 ? 'You are' : 'The Wraiths are'} rung up swinging. ${game.outs} out${game.outs === 1 ? '' : 's'}.`);
      audio.strike();
    } else {
      setResult('SWING & MISS', `${timing} • ${game.balls}–${game.strikes}`, C.orange, false, 'miss');
      announce(`Swing and a miss. ${timing.toLowerCase()}.`); audio.strike();
    }
    return;
  }
  const timing = 1 - abs / windowSize;
  const quality = clamp(timing * 0.82 + (p.typeMatch ? 0.09 : 0) + (p.zoneMatch ? 0.09 : 0) - (p.isStrike ? 0 : 0.09), 0, 1);
  const timingText = error < -0.025 ? 'EARLY' : error > 0.025 ? 'LATE' : 'BARRELED';
  audio.hit(quality);
  if (quality < 0.27 || (quality < 0.43 && Math.random() < 0.44)) {
    if (game.strikes < 2) game.strikes++;
    setResult('FOUL BALL', `${timingText} • ${game.strikes === 2 ? 'still ' : ''}${game.balls}–${game.strikes}`, C.cream, false, 'foul', quality);
    announce('Fought off into the seats. The duel continues.'); return;
  }
  if (quality < 0.58) {
    game.outs++;
    const outType = quality < 0.43 ? 'WEAK GROUNDOUT' : pick(['FLY OUT', 'LINE OUT', 'GROUNDOUT']);
    setResult(outType, `${timingText} • contact quality ${Math.round(quality * 100)}`, C.cream, true, 'out', quality);
    announce(`${outType.toLowerCase()}. ${game.outs} away in the ${game.side === 0 ? 'top' : 'bottom'}.`); return;
  }
  let bases = 1, title = 'SINGLE';
  if (quality >= 0.91) { bases = 4; title = 'HOME RUN'; }
  else if (quality >= 0.82) { bases = 3; title = 'TRIPLE'; }
  else if (quality >= 0.70) { bases = 2; title = 'DOUBLE'; }
  const runs = advanceHit(bases);
  game.hits[game.side]++;
  if (bases === 4) game.stats.homeRuns[game.side]++;
  setResult(title, `${timingText} • ${runs ? `${runs} RUN${runs > 1 ? 'S' : ''} SCORE` : 'RUNNERS ADVANCE'}`, bases === 4 ? C.gold : C.mint, true, bases === 4 ? 'homer' : 'hit', quality);

const particles = Array.from({length: 90}, () => ({ active: false, x:0, y:0, vx:0, vy:0, life:0, max:1, color:C.mint, size:3 }));
function spawnBurst(x, y, color, count) {
  let made = 0;
  for (const p of particles) {
    if (p.active) continue;
    p.active = true; p.x = x; p.y = y; p.vx = rand(-190,190); p.vy = rand(-230,40);
    p.life = p.max = rand(0.45,1.1); p.color = Math.random() < 0.28 ? C.cream : color; p.size = rand(2,6);
    if (++made >= count) break;
  }
}
function updateParticles(dt) {
  for (const p of particles) {
    if (!p.active) continue;
    p.life -= dt; if (p.life <= 0) { p.active = false; continue; }
    p.vy += 260 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
}

function update(dt) {
  globalTime += dt; audio.update(dt); updateParticles(dt);
  if (paused || mode !== 'game') return;
  game.time += dt; game.flash = Math.max(0, game.flash - dt * 2.4); game.shake = Math.max(0, game.shake - dt);
  game.swingAnim = Math.max(0, game.swingAnim - dt);
  if (game.phase === 'flight' && game.pitch) {
    const p = game.pitch; p.t += dt;
    if (!p.playerBatting && !p.decided && p.t / p.duration >= 0.69) prepareCpuSwing(p);
    if (!p.playerBatting && p.decided && p.willSwing && !p.swung && p.t >= p.swingAt) {
      p.swung = true; resolveSwing(p.swingAt - p.duration);
    } else if (game.phase === 'flight' && p.t >= p.duration + 0.13) {
      if (!p.swung) resolveTake();
    }
  } else if (game.phase === 'result') {
    game.resultTimer -= dt;
    if (game.resultTimer <= 0) continueAfterResult();
  }
}

function ballPosition(p, progress) {
  const q = clamp(progress, 0, 1.04);
  if (q <= 0.65) {
    const u = ease(q / 0.65);
    return { x: lerp(RELEASE_POINT.x, TUNNEL_POINT.x, u), y: lerp(RELEASE_POINT.y, TUNNEL_POINT.y, u) + Math.sin(u * Math.PI) * 3 };
  }
  const u = ease(clamp((q - 0.65) / 0.35, 0, 1));
  let x = lerp(TUNNEL_POINT.x, p.final.x, u), y = lerp(TUNNEL_POINT.y, p.final.y, u);
  if (p.type === 'curve') x += Math.sin(u * Math.PI) * (p.final.x < 600 ? -18 : 18) * (1 - u * 0.35);
  if (p.type === 'change') y += Math.sin(u * Math.PI) * 16;
  if (q > 1) y += (q - 1) * 250;
  return {x,y};
}

  text(r.line,600,302,25,C.cream,'center','display');text(r.sample,600,337,12,C.muted,'center');
  panel(280,368,640,63,C.line);text(r.read,600,391,17,C.orange,'center','bold');text(r.tip,600,416,11,C.cream,'center');
  if(game.result)text(`LAST PLAY  •  ${game.result.title}`,600,466,13,game.result.color,'center','bold');
  text('Randomness weakens the model. Repetition feeds it.',600,500,12,C.muted,'center');
  button('next-ab',405,531,390,52,'SPACE  NEXT BATTER',advanceReport,{color:C.mint,size:18});
}
function drawHalf() {
  drawStadium();drawScoreboard();ctx.fillStyle='#030a0ee8';ctx.fillRect(0,0,W,H);
  text('SIDE RETIRED',600,245,14,C.orange,'center','bold');text(game.halfTitle,600,314,58,C.cream,'center','display');
  text(game.halfSub,600,369,16,C.mint,'center','bold');
  text(`MOTHS ${game.score[0]}  —  ${game.score[1]} WRAITHS`,600,420,23,C.cream,'center','display');
  button('next-half',420,480,360,62,'SPACE  TAKE THE FIELD',continueHalf,{color:C.orange,size:18});
}
function drawTitle() {
  drawStadium();ctx.fillStyle='#031017a8';ctx.fillRect(0,0,W,H);
  text('AN ORIGINAL NINE-ZONE MIND GAME',52,48,12,C.mint,'left','bold');
  text(`RECORD  ${save.wins}–${save.losses}${save.ties?`–${save.ties}`:''}`,1148,48,12,C.cream,'right','bold');
  text('PITCH',64,174,104,C.cream,'left','display');text('TUNNEL',60,272,104,C.mint,'left','display');
  text('NEON MOTHS',70,330,15,C.mint,'left','bold');text('VS',191,330,12,C.muted);text('IRON WRAITHS',226,330,15,C.orange,'left','bold');
  text('Three innings. Two minds. One disappearing baseball.',68,377,16,C.cream);
  const cards=[['01  READ','Guess type + zone.','Then own the timing.'],['02  DECEIVE','Same first 65%.','Different final 35%.'],['03  ADAPT','The CPU learns 20','choices + transitions.']];
  cards.forEach((card,i)=>{const x=66+i*245;panel(x,423,226,119,i===1?C.mint:C.line);text(card[0],x+16,447,12,i===1?C.mint:C.orange,'left','bold');text(card[1],x+16,483,13,C.cream);text(card[2],x+16,508,13,C.muted);});
  button('start',67,575,650,70,'SPACE / CLICK  —  PLAY BALL',startGame,{color:C.orange,size:24});
  text('Q/W/E TYPE   •   1–9 ZONE   •   SPACE LOCK / SWING',68,679,12,C.cream);
  text('P PAUSE   •   M SOUND   •   MOUSE + TOUCH',68,707,11,C.muted);
  // Title-screen tunnel diagram: shared origin, three late-breaking outcomes.
  panel(790,114,355,454,C.line);text('THE LAST 35%',968,144,13,C.orange,'center','bold');
  const origin={x:968,y:190},mid={x:968,y:326};
  ctx.lineWidth=3;
  for(let i=0;i<3;i++){
    const end={x:877+i*91,y:480-(i===1?32:0)},color=TYPE_META[TYPES[i]].color;
    ctx.strokeStyle=C.cream;ctx.globalAlpha=0.38;ctx.beginPath();ctx.moveTo(origin.x,origin.y);ctx.lineTo(mid.x,mid.y);ctx.stroke();
    ctx.globalAlpha=0.9;ctx.strokeStyle=color;ctx.beginPath();ctx.moveTo(mid.x,mid.y);ctx.quadraticCurveTo(mid.x+(i-1)*18,390,end.x,end.y);ctx.stroke();
    text(TYPE_META[TYPES[i]].short,end.x,513,11,color,'center','bold');
  }
  ctx.globalAlpha=1;ctx.fillStyle=C.cream;ctx.beginPath();ctx.arc(origin.x,origin.y,7,0,Math.PI*2);ctx.fill();
  line(928,326,1008,326,C.orange,2);text('TUNNEL BREAK',968,308,10,C.cream,'center');
}
function drawBoxScore() {
  const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0d252e');g.addColorStop(1,'#050d13');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  text('FINAL / THREE INNINGS',58,50,13,C.mint,'left','bold');
  const won=game.score[0]>game.score[1],tied=game.score[0]===game.score[1];
  text(tied?'DEAD EVEN':won?'MOTHS WIN':'WRAITHS WIN',57,112,49,tied?C.gold:won?C.mint:C.orange,'left','display');
  text(`${game.score[0]}  —  ${game.score[1]}`,1145,110,54,C.cream,'right','display');
  panel(55,165,1090,222,C.line);
  const cols=[410,520,630,740,850,960];
  text('CLUB',87,195,12,C.muted,'left','bold');['1','2','3','R','H'].forEach((s,i)=>text(s,cols[i],195,12,C.muted,'center','bold'));
  line(80,218,1120,218,C.line);
  ['NEON MOTHS','IRON WRAITHS'].forEach((name,row)=>{
    const y=253+row*67;text(name,87,y,17,row===0?C.mint:C.orange,'left','bold');
    for(let i=0;i<3;i++)text(String(game.lines[row][i]),cols[i],y,20,C.cream,'center','bold');
    text(String(game.score[row]),cols[3],y,25,C.cream,'center','display');text(String(game.hits[row]),cols[4],y,22,C.cream,'center','display');
  });
  panel(55,417,529,190,C.line);text('YOUR PITCHING LINE',81,445,12,C.orange,'left','bold');
  text(`${game.stats.pitches[0]}`,85,492,37,C.cream,'left','display');text('PITCHES',166,493,11,C.muted);
  text(`${Math.round(game.stats.strikes[0]/Math.max(1,game.stats.pitches[0])*100)}%`,266,492,37,C.cream,'left','display');text('STRIKES',370,493,11,C.muted);
  text(`${game.stats.strikeouts[0]} K   •   ${game.stats.walks[0]} BB   •   ${game.stats.homeRuns[0]} HR ALLOWED`,84,548,14,C.cream);
  text(`PEAK CPU READ  ${Math.round(game.stats.bestRead*100)}%`,84,579,12,C.orange);
  panel(614,417,531,190,C.line);text('YOUR AT-BAT DATA',640,445,12,C.mint,'left','bold');
  text(`${game.stats.swings}`,645,492,37,C.cream,'left','display');text('SWINGS',726,493,11,C.muted);
  text(`${game.stats.guessedBoth}`,826,492,37,C.cream,'left','display');text('PERFECT READS',907,493,11,C.muted);
  text(`${game.stats.homeRuns[0]} HR   •   ${game.stats.strikeouts[1]} K   •   ${game.stats.walks[1]} BB`,644,548,14,C.cream);
  text(`CAREER RECORD  ${save.wins} W  /  ${save.losses} L${save.ties?`  /  ${save.ties} T`:''}`,644,579,12,C.mint);
  button('rematch',55,645,528,66,'SPACE  REMATCH',startGame,{color:C.orange,size:21});
  button('title',614,645,531,66,'T  RETURN TO TITLE',()=>{mode='title';audio.ui();},{color:C.mint,size:20});
}
function drawPause() {
  ctx.fillStyle='#02090de8';ctx.fillRect(0,0,W,H);panel(345,192,510,374,C.orange);
  text('TIME CALLED',600,250,37,C.cream,'center','display');text('THE COUNT WILL WAIT.',600,291,13,C.muted,'center');
  button('resume',410,332,380,57,'P / SPACE  RESUME',()=>{paused=false;audio.ui();},{color:C.mint,size:18});
  button('restart-pause',410,407,380,57,'RESTART GAME',startGame,{color:C.orange,size:17});
  button('quit-title',410,482,380,50,'RETURN TO TITLE',()=>{mode='title';paused=false;audio.ui();},{size:16});
}
function drawSound() {
  button('sound',1081,716,94,28,save.muted?'M  OFF':'M  ON',()=>{save.muted=!save.muted;audio.init();audio.mute();persist();},{size:11,color:save.muted?C.muted:C.mint});
}
function render() {
  ctx.save();
  if(game.shake>0&&mode==='game'&&!paused)ctx.translate(rand(-3,3)*game.shake/0.16,rand(-3,3)*game.shake/0.16);
  hotspots=[];
  if(mode==='title')drawTitle();else if(mode==='box')drawBoxScore();else if(game.phase==='report')drawReport();else if(game.phase==='half')drawHalf();else drawGame();
  ctx.restore();
  if(paused&&mode==='game'){hotspots=[];drawPause();}
  drawScanlines();drawSound();
}

function activatePrimary() {
  audio.init();
  if(mode==='title')startGame();else if(mode==='box')startGame();
  else if(paused){paused=false;audio.ui();}
  else if(game.phase==='select')lockSelection();else if(game.phase==='flight')swing();
  else if(game.phase==='report')advanceReport();else if(game.phase==='half')continueHalf();
}
window.addEventListener('keydown',e=>{
  const key=e.key.toLowerCase();
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(key))e.preventDefault();
  audio.init();canvas.focus();
  if(key==='m'){save.muted=!save.muted;audio.mute();persist();return;}
  if((key==='p'||key==='escape')&&mode==='game'&&game.phase!=='report'&&game.phase!=='half'){paused=!paused;audio.ui();return;}
  if(key===' '||key==='enter'){activatePrimary();return;}
  if(mode==='box'&&key==='t'){mode='title';audio.ui();return;}
  if(mode!=='game'||paused||game.phase!=='select')return;
  if(key==='q'){game.selectedType='fastball';audio.ui();}
  else if(key==='w'){game.selectedType='curve';audio.ui();}
  else if(key==='e'){game.selectedType='change';audio.ui();}
  else if(/^[1-9]$/.test(key)){game.selectedZone=Number(key)-1;audio.ui();}
},{passive:false});
function pointerPosition(e){const r=canvas.getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width*W;pointer.y=(e.clientY-r.top)/r.height*H;}
canvas.addEventListener('pointermove',e=>{pointerPosition(e);canvas.style.cursor=hotspots.some(b=>pointer.x>=b.x&&pointer.x<=b.x+b.w&&pointer.y>=b.y&&pointer.y<=b.y+b.h)?'pointer':'default';});
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();pointerPosition(e);audio.init();canvas.focus();
  for(let i=hotspots.length-1;i>=0;i--){const b=hotspots[i];if(pointer.x>=b.x&&pointer.x<=b.x+b.w&&pointer.y>=b.y&&pointer.y<=b.y+b.h){b.action();return;}}
},{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

let dpr=1;
function resize(){
  const scale=Math.min(window.innerWidth/W,window.innerHeight/H);
  canvas.style.width=`${Math.floor(W*scale)}px`;canvas.style.height=`${Math.floor(H*scale)}px`;
  dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=true;
}
window.addEventListener('resize',resize);resize();
let last=performance.now(),acc=0,fps=60,fpsFrames=0,fpsTime=0;
function frame(now){
  const elapsed=Math.min(0.05,(now-last)/1000);last=now;acc+=elapsed;
  while(acc>=STEP){update(STEP);acc-=STEP;}
  render();fpsFrames++;fpsTime+=elapsed;if(fpsTime>=0.5){fps=Math.round(fpsFrames/fpsTime);fpsFrames=0;fpsTime=0;}
  requestAnimationFrame(frame);
}
window.__gameProbe=()=>({mode,phase:game.phase,inning:game.inning,side:game.side,balls:game.balls,strikes:game.strikes,outs:game.outs,score:[...game.score],hits:[...game.hits],fps,playerChoices:playerPitches.entries.length,guessChoices:playerGuesses.entries.length,muted:save.muted,paused});
window.__GAME_READY__=true;
requestAnimationFrame(frame);
})();
</script>
