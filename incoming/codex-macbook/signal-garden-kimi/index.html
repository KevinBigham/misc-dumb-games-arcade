<script>
'use strict';
// ENGINE START — pure rules shared by live play and the on-load solver.
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const REFLECT=[ [1,0,3,2], [3,2,1,0] ];
const SCALE=[261.63,293.66,329.63,392,440,523.25,587.33,659.25];
function parseLevel(def){
  const rows=def.grid.map(r=>r.trim().split(/\s+/));
  const h=rows.length,w=rows[0].length,tiles=[],rot=[];
  rows.forEach((row,y)=>row.forEach((token,x)=>{
    let t={kind:'empty',x,y,o:0,note:SCALE[(x+y*2)%SCALE.length]};
    if(token==='##')t.kind='stone';
    else if(token[0]==='m'||token[0]==='s'){t.kind=token[0]==='m'?'mirror':'splitter';t.o=token[1]==='-'?1:0;t.rotatable=true;}
    else if(token[0]==='f'){t.kind='filter';t.color=token[1];}
    else if(token[0]==='p'){t.kind='pod';t.color=token[1];}
    else if('GCP'.includes(token[0])){t.kind='source';t.color=token[0];t.dir={ '^':0,'>':1,'v':2,'<':3}[token[1]];}
    t.index=y*w+x;tiles.push(t);if(t.rotatable)rot.push(t.index);
  }));
  return {def,w,h,tiles,rot,podTotal:tiles.filter(t=>t.kind==='pod').length};
}
function simulate(level,tiles=level.tiles){
  const {w,h,podTotal}=level,queue=[],segments=[],litPods=new Set(),litFlowers=new Set(),seen=new Set();
  let podCount=0,steps=0;
  for(const t of tiles)if(t.kind==='source')queue.push({x:t.x,y:t.y,d:t.dir,c:t.color});
  while(queue.length&&steps++<1000){
    const r=queue.pop(),nx=r.x+DIRS[r.d][0],ny=r.y+DIRS[r.d][1];
    segments.push({x1:r.x,y1:r.y,x2:nx,y2:ny,c:r.c});
    if(nx<0||ny<0||nx>=w||ny>=h)continue;
    const t=tiles[ny*w+nx],key=`${nx},${ny},${r.d},${r.c}`;
    if(seen.has(key))continue;seen.add(key);
    if(t.kind==='empty'){queue.push({x:nx,y:ny,d:r.d,c:r.c});continue;}
    if(t.kind==='pod'){
      if(t.color===r.c){litPods.add(t.index);podCount=litPods.size;}
      continue;
    }
    if(t.kind==='filter'){litFlowers.add(t.index);queue.push({x:nx,y:ny,d:r.d,c:t.color});continue;}
    if(t.kind==='mirror'||t.kind==='splitter'){
      litFlowers.add(t.index);const nd=REFLECT[t.o][r.d];
      queue.push({x:nx,y:ny,d:nd,c:r.c});
      if(t.kind==='splitter')queue.push({x:nx,y:ny,d:r.d,c:r.c});
    }
  }
  return {segments,litPods,litFlowers,solved:podTotal>0&&podCount===podTotal,podCount};
}
function solveLevel(def,maxDepth=def.par){

  if(key===' '||key==='enter'){rotateTile(selected);e.preventDefault();return;}
  const move={arrowup:[0,-1],arrowright:[1,0],arrowdown:[0,1],arrowleft:[-1,0]}[key];
  if(move){e.preventDefault();let t=tiles[selected]||tiles[0],nx=Math.max(0,Math.min(level.w-1,t.x+move[0])),ny=Math.max(0,Math.min(level.h-1,t.y+move[1]));selected=ny*level.w+nx;audio.tone(220,0,.06,.018);}
});
window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play')pause();});

function runAudit(){
  const results=LEVELS.map((def,i)=>({level:i+1,name:def.name,par:def.par,...solveLevel(def)}));console.group('SIGNAL GARDEN · level audit');console.table(results);const passed=results.every(r=>r.solvableAtPar&&r.minMoves===r.par);console.log(`[SIGNAL GARDEN] ${passed?'PASS':'FAIL'} — ${results.filter(r=>r.minMoves===r.par).length}/${results.length} levels solvable exactly at par.`);console.groupEnd();return {passed,results};
}
window.SignalGarden={levels:LEVELS,parseLevel,simulate,solveLevel,audit:runAudit,loadLevel,get state(){return {level:levelIndex+1,moves:historyIndex,mode,solved:simulation?.solved,save:JSON.parse(JSON.stringify(save))};}};
window.__gameProbe=()=>({mode,level:levelIndex+1,moves:historyIndex,pods:simulation?.podCount||0,podTotal:level?.podTotal||0,selected});
updateMute();setScreen('title');requestAnimationFrame(draw);setTimeout(runAudit,80);window.__GAME_READY__=true;
</script>
