<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><meta name="theme-color" content="#101614" />
    <title>HARDCOURT — Franchise Basketball</title>
    <style>:root {
  --bg: #101614;
  --panel: #19211e;
  --panel2: #1e2823;
  --line: #303b34;
  --muted: #97a69c;
  --text: #f4f3e9;
  --accent: #eaa15a;
  --green: #a7d5a6;
  --red: #ed9191;
  --team: #66bf99;
  --radius: 12px;
  color-scheme: dark;
  font-family:
    Inter,
    ui-sans-serif,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  font-size: 14px;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}
button,
input,
select {
  font: inherit;
}
button,
a,
input,
select {
  outline-offset: 4px;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 2px solid var(--accent);
}
button {
  cursor: pointer;
  color: inherit;
}
button:disabled {
  cursor: default;
  opacity: 0.4;
}
button {
  transition:
    background 0.15s,
    border-color 0.15s,
    transform 0.15s;
}
button:hover:not(:disabled) {
  filter: brightness(1.1);
}
a {
  color: var(--accent);
}
button.primary {
  background: var(--accent);
  color: #1b241d;
  border: 1px solid var(--accent);
  font-weight: 750;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 17px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #243027;
  white-space: nowrap;
  font-weight: 600;
  min-height: 42px;
}
.btn.small {
  padding: 7px 11px;
  min-height: 34px;
  font-size: 12px;
}
.btn.ghost {
  background: transparent;
}
.btn.danger {
  color: var(--red);
  border-color: #68433f;
  background: #382625;
}
.btn.full {
  width: 100%;
}
.icon {
  width: 19px;
  height: 19px;
  flex-shrink: 0;
  display: inline-block;
  vertical-align: middle;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.eyebrow {
  font-size: 10px;
  font-weight: 750;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent);
}
.muted {
  color: var(--muted);
}
.positive {
  color: var(--green);
}
.negative {
  color: var(--red);
}
.mono {
  font-variant-numeric: tabular-nums;
}
.small {
  font-size: 12px;
}
.tiny {
  font-size: 10px;
}
.flex {
  display: flex;
  align-items: center;
  gap: 12px;
}
.between {
  justify-content: space-between;
}
.wrap {
  flex-wrap: wrap;
}
.grow {
  flex: 1;
}
.stack {
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.grid3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.grid4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}
.spacer {
  height: 20px;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1 {
  font-size: 32px;
  letter-spacing: -1px;
  font-weight: 750;
}
h2 {
  font-size: 19px;
  letter-spacing: -0.4px;
}
h3 {
  font-size: 14px;
  font-weight: 700;
}
p {
  line-height: 1.6;
}
hr {
  border: 0;
  border-top: 1px solid var(--line);
  margin: 20px 0;
}
.shell {
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr);
  min-height: 100vh;
}
.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  width: 220px;
  border-right: 1px solid var(--line);
  padding: 30px 18px 18px;
  background: #131b16;
  display: flex;
  flex-direction: column;
  z-index: 20;
}
.brand {
  font-size: 22px;
  letter-spacing: -0.9px;
  font-weight: 900;
  display: flex;
  align-items: center;
  gap: 9px;
}
.brand-mark {
  width: 31px;
  height: 31px;
  color: var(--accent);
}
.brand-sub {
  font-size: 8px;
  letter-spacing: 3.3px;
  color: var(--muted);
  margin: 7px 0 0 40px;
}
.team-identity {
  padding: 23px 6px 22px;
  margin: 20px 0 10px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.team-identity .crest {
  width: 43px;
  height: 43px;
  font-size: 14px;
}
.crest {
  width: 40px;
  height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background: color-mix(in srgb, var(--c) 13%, #15201b);
  border: 1px solid color-mix(in srgb, var(--c) 50%, #2d3b31);
  color: var(--c);
  border-radius: 50%;
  font-size: 12px;
  font-weight: 850;
  letter-spacing: -0.5px;
  position: relative;
}
.crest:after {
  content: "";
  position: absolute;
  inset: 3px;
  border: 1px solid color-mix(in srgb, var(--c) 30%, transparent);
  border-radius: 50%;
}
.crest.large {
  width: 76px;
  height: 76px;
  font-size: 25px;
}
.crest.medium {
  width: 52px;
  height: 52px;
  font-size: 17px;
}
.nav-label {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: #718376;
  padding: 12px 12px 10px;
}
.nav-link {
  display: flex;
  align-items: center;
  gap: 13px;
  text-align: left;
  border: 0;
  background: none;
  color: #acb9ae;
  border-radius: 7px;
  padding: 12px;
  width: 100%;
  font-weight: 550;
  font-size: 13px;
  margin: 2px 0;
}
.nav-link.active {
  background: #2d3b2b;
  color: #d8ebc4;
}
.nav-link.active:after {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #c4dca2;
  margin-left: auto;
}
.nav-link .icon {
  width: 18px;
  height: 18px;
}
.sidebar-bottom {
  margin-top: auto;
  padding-top: 24px;
}
.save-indicator {
  font-size: 10px;
  color: var(--muted);
  display: flex;
  gap: 7px;
  align-items: center;
  padding: 14px 12px;
}
.dot {
  width: 6px;
  height: 6px;
  background: var(--green);
  border-radius: 50%;
  display: inline-block;
}
.main {
  grid-column: 2;
  min-width: 0;
}
.topbar {
  height: 70px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 34px;
  background: #141c17;
  gap: 15px;
}
.topbar .league-title {
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 1.4px;
}
.season-pill {
  border: 1px solid var(--line);
  background: #202a22;
  padding: 7px 11px;
  border-radius: 5px;
  font-size: 11px;
  color: #cbd5c8;
}
.topbar-right {
  display: flex;
  align-items: center;
  gap: 20px;
}
.avatar {
  width: 30px;
  height: 30px;
  border: 1px solid var(--line);
  background: #2d392e;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 750;
  color: #ddd9bf;
}
.content {
  padding: 30px 34px 42px;
  max-width: 1660px;
  margin: auto;
}
.page-head {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 20px;
  margin-bottom: 25px;
}
.page-head p {
  margin-top: 7px;
  font-size: 12px;
  color: var(--muted);
}
.page-head .eyebrow {
  margin-bottom: 8px;
}
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  min-width: 0;
  overflow: hidden;
}
.panel-body {
  padding: 22px;
}
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 22px 16px;
  gap: 12px;
}
.panel-head h2 {
  font-size: 15px;
}
.tag {
  display: inline-flex;
  align-items: center;
  padding: 4px 7px;
  border: 1px solid #40523c;
  background: #29352a;
  color: #b8d3a7;
  border-radius: 4px;
  font-size: 9px;
  letter-spacing: 0.6px;
  font-weight: 700;
  text-transform: uppercase;
}
.tag.orange {
  background: #352b20;
  color: var(--accent);
  border-color: #5b4530;
}
.tag.red {
  background: #3d2927;
  color: var(--red);
  border-color: #60403a;
}
.tag.gray {
  background: #252f29;
  color: #a9b6ac;
  border-color: #3a473d;
}
.hero {
  position: relative;
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  min-height: 272px;
  background: radial-gradient(
    ellipse at 80% 50%,
    #344331 0%,
    #1d2c22 55%,
    #1b261e 90%
  );
  border: 1px solid #3a4938;
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 20px;
}
.hero-copy {
  padding: 30px;
  z-index: 1;
}
.hero h2 {
  font-size: 37px;
  line-height: 1.12;
  letter-spacing: -1.3px;
  margin: 16px 0 12px;
}
.hero p {
  font-size: 12px;
  color: #b9c6b4;
  max-width: 380px;
}
.hero-actions {
  display: flex;
  gap: 10px;
  margin-top: 25px;
}
.hero-court {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  overflow: hidden;
}
.court-svg {
  width: 100%;
  max-height: 290px;
  opacity: 0.85;
}
.hero-court:after {
  position: absolute;
  inset: 0;
  content: "";
  background: linear-gradient(90deg, #26332655, transparent);
}
.court-pin {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  font-size: 8px;
  z-index: 2;
  gap: 3px;
  color: #d9e4d2;
  transform: translate(-50%, -50%);
}
.court-pin strong {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #26382d;
  border: 1px solid #789268;
  box-shadow: 0 3px 10px #0006;
}
.court-label {
  position: absolute;
  right: 24px;
  bottom: 22px;
  letter-spacing: 2px;
  font-size: 8px;
  color: #a5b39b;
}
.metric {
  padding: 19px 20px;
}
.metric .label {
  font-size: 10px;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.metric .value {
  font-size: 27px;
  letter-spacing: -1px;
  margin: 10px 0 6px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.metric .sub {
  font-size: 10px;
  color: var(--muted);
}
.metric .icon {
  color: #899d80;
  width: 16px;
  height: 16px;
}
.dashboard-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.65fr) minmax(280px, 1fr);
  gap: 20px;
  margin-top: 20px;
}
.upcoming {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 24px 22px;
}
.team-block {
  display: flex;
  align-items: center;
  gap: 13px;
}
.team-block strong {
  display: block;
  font-size: 14px;
}
.team-block span.city {
  font-size: 11px;
  color: var(--muted);
  display: block;
  margin-bottom: 4px;
}
.versus {
  font-size: 12px;
  font-weight: 800;
  color: #7c8a7f;
}
.upcoming-footer {
  background: #1e2821;
  border-top: 1px solid var(--line);
  padding: 12px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--muted);
}
.table-wrap {
  overflow-x: auto;
  width: 100%;
  scrollbar-width: thin;
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 12px;
  white-space: nowrap;
  text-align: left;
  font-variant-numeric: tabular-nums;
}
th {
  color: #92a48f;
  text-transform: uppercase;
  font-size: 9px;
  letter-spacing: 1px;
  font-weight: 650;
  padding: 12px 16px;
  background: #1d2720;
  border-bottom: 1px solid var(--line);
}
td {
  padding: 13px 16px;
  border-bottom: 1px solid #2a352d;
}
tr:last-child td {
  border-bottom: 0;
}
tbody tr:hover {
  background: #202d24;
}
.click-row {
  cursor: pointer;
}
.self-row {
  background: #293829;
}
td.num,
th.num {
  text-align: right;
}
.player-cell {
  display: flex;
  align-items: center;
  gap: 10px;
}
.player-avatar {
  background: linear-gradient(145deg, #3c4a38, #243227);
  color: #c7d2be;
  font-size: 10px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 33px;
  height: 37px;
  border: 1px solid #4b5942;
  clip-path: polygon(15% 0, 85% 0, 100% 100%, 0 100%);
  flex-shrink: 0;
}
.player-name {
  font-weight: 650;
  color: var(--text);
}
.player-name .small {
  font-size: 10px;
  font-weight: 400;
  color: var(--muted);
  margin-top: 3px;
}
.rating {
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 29px;
  height: 29px;
  border-radius: 5px;
  background: #2e3c2b;
  color: #b7d9a4;
  font-weight: 750;
}
.rating.elite {
  background: #3b3421;
  color: #efd089;
}
.rating.low {
  background: #29312b;
  color: #a2b0a5;
}
.news-item {
  display: flex;
  gap: 12px;
  padding: 15px 22px;
  border-bottom: 1px solid #2b352d;
}
.news-item:last-child {
  border: 0;
}
.news-icon {
  margin-top: 2px;
  width: 29px;
  height: 29px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  background: #2b382b;
  color: #a1b696;
  flex-shrink: 0;
}
.news-icon .icon {
  width: 14px;
  height: 14px;
}
.news-item p {
  font-size: 11px;
  line-height: 1.6;
  color: #d1d9ca;
}
.news-meta {
  font-size: 9px;
  color: #82917e;
  margin-top: 4px;
}
.progress {
  height: 5px;
  background: #303c31;
  border-radius: 4px;
  overflow: hidden;
}
.progress > i {
  display: block;
  height: 100%;
  background: #a3bf85;
  border-radius: 4px;
}
.goal-row {
  padding: 15px 22px;
  border-top: 1px solid #2b352d;
}
.goal-row p {
  font-size: 11px;
  margin-bottom: 9px;
}
.tabs {
  display: flex;
  gap: 6px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 22px;
  overflow-x: auto;
}
.tab {
  border: 0;
  background: none;
  padding: 13px 16px;
  color: var(--muted);
  font-weight: 600;
  font-size: 12px;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
}
.tab.active {
  border-bottom-color: var(--accent);
  color: var(--accent);
}
.filters {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
input,
select {
  background: #141e18;
  border: 1px solid #3a493c;
  border-radius: 6px;
  color: var(--text);
  padding: 10px 11px;
  min-height: 40px;
  max-width: 100%;
}
input[type="number"] {
  width: 95px;
}
input[type="range"] {
  accent-color: var(--accent);
  padding: 0;
  min-height: 24px;
  width: 100%;
}
input[type="checkbox"] {
  accent-color: var(--accent);
  min-height: 16px;
  width: 16px;
}
.search {
  min-width: 210px;
}
.input-label {
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 11px;
  color: #aebca7;
}
.empty {
  text-align: center;
  padding: 45px 25px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.8;
}
.empty .icon {
  width: 32px;
  height: 32px;
  display: block;
  margin: 0 auto 15px;
  color: #a8b393;
}
.notice {
  padding: 14px 17px;
  background: #2c3326;
  border: 1px solid #4a5138;
  border-radius: 8px;
  color: #d9d5b2;
  font-size: 12px;
  line-height: 1.6;
  margin-bottom: 20px;
}
.notice .icon {
  margin-right: 7px;
}
.notice.success {
  background: #20372b;
  border-color: #3d6147;
  color: #b4d7ba;
}
.two-col-asym {
  display: grid;
  grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr);
  gap: 20px;
}
.profile-head {
  display: flex;
  gap: 20px;
  align-items: center;
  margin-bottom: 24px;
}
.profile-head .player-avatar {
  width: 80px;
  height: 100px;
  font-size: 25px;
}
.attribute {
  display: grid;
  grid-template-columns: 110px 1fr 30px;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  margin: 14px 0;
}
.attribute .progress {
  height: 6px;
}
.profile-metrics {
  display: flex;
  gap: 30px;
  margin: 23px 0;
}
.profile-metrics strong {
  font-size: 25px;
  display: block;
  margin-bottom: 4px;
}
.profile-metrics span {
  font-size: 10px;
  color: var(--muted);
}
dialog {
  padding: 0;
  background: #19231c;
  color: var(--text);
  border: 1px solid #53604b;
  border-radius: 14px;
  max-width: min(850px, calc(100vw - 32px));
  width: 700px;
  max-height: 90vh;
  box-shadow: 0 30px 100px #0009;
}
dialog::backdrop {
  background: #070d0bd9;
  backdrop-filter: blur(5px);
}
.modal-head {
  padding: 22px 26px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  gap: 15px;
  position: sticky;
  top: 0;
  background: #1a251d;
  z-index: 1;
}
.modal-body {
  padding: 25px 26px;
}
.close {
  background: none;
  border: 1px solid var(--line);
  border-radius: 50%;
  width: 32px;
  height: 32px;
  font-size: 20px;
}
.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 24px;
  flex-wrap: wrap;
}
#toast {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #d9e5cd;
  color: #16231b;
  padding: 14px 22px;
  border-radius: 9px;
  font-size: 12px;
  font-weight: 650;
  box-shadow: 0 8px 40px #0008;
  z-index: 100;
  max-width: 90vw;
  transition: transform 0.22s;
}
#toast.visible {
  transform: translateX(-50%) translateY(0);
}
#toast.error {
  background: #f1bbb2;
  color: #401d1a;
}
.strategy-option {
  display: block;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #1d2920;
  padding: 15px 16px;
  text-align: left;
  width: 100%;
}
.strategy-option.active {
  border-color: #a5bc88;
  background: #2a3929;
}
.strategy-option h3 {
  font-size: 12px;
  margin-bottom: 5px;
}
.strategy-option p {
  font-size: 11px;
  color: var(--muted);
}
.strategy-option.active h3 {
  color: #c0d7a5;
}
.rotation-input {
  width: 65px !important;
  padding: 6px 9px;
  min-height: 31px;
}
.schedule-row {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 16px 22px;
  border-bottom: 1px solid var(--line);
}
.schedule-row:last-child {
  border-bottom: 0;
}
.schedule-date {
  font-size: 10px;
  color: var(--muted);
  width: 72px;
  flex-shrink: 0;
}
.schedule-score {
  font-size: 18px;
  font-weight: 750;
  letter-spacing: 1px;
}
.bracket {
  display: grid;
  grid-template-columns: repeat(4, minmax(180px, 1fr));
  gap: 18px;
  min-width: 850px;
}
.bracket-col {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  gap: 15px;
}
.series {
  border: 1px solid var(--line);
  background: #1b271e;
  border-radius: 8px;
  overflow: hidden;
}
.series-head {
  font-size: 9px;
  padding: 8px 12px;
  color: var(--muted);
  border-bottom: 1px solid var(--line);
}
.series-team {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  font-size: 11px;
}
.series-team.winner {
  background: #31402c;
  color: #d2e3bc;
}
.series-team .crest {
  width: 24px;
  height: 24px;
  font-size: 8px;
}
.series-team b {
  margin-left: auto;
  font-size: 15px;
}
.asset-list {
  max-height: 440px;
  overflow-y: auto;
}
.asset {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 11px 16px;
  border-bottom: 1px solid #2c382e;
  cursor: pointer;
  font-size: 11px;
}
.asset:hover {
  background: #253426;
}
.asset:has(input:checked) {
  background: #2b3b28;
}
.asset b {
  font-size: 11px;
}
.asset .rating {
  margin-left: auto;
}
.trade-status {
  margin-top: 20px;
  padding: 20px;
  border-radius: 9px;
  background: #242f25;
  border: 1px solid var(--line);
}
.level-dots {
  display: flex;
  gap: 5px;
}
.level-dots i {
  height: 7px;
  width: 22px;
  background: #344231;
  border-radius: 2px;
}
.level-dots i.on {
  background: #acc68a;
}
.front-card {
  padding: 23px;
}
.front-card p {
  font-size: 11px;
  color: var(--muted);
  margin: 12px 0 18px;
}
.history-title {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.6px;
}
.draft-clock {
  background: radial-gradient(ellipse at right, #4d3c26, #283022 60%);
  padding: 26px;
  border: 1px solid #655235;
  border-radius: 10px;
  margin-bottom: 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.draft-clock h2 {
  font-size: 25px;
  margin: 9px 0;
}
.draft-results {
  max-height: 500px;
  overflow-y: auto;
}
.live-scoreboard {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 30px;
  padding: 25px 30px;
  background: radial-gradient(ellipse at center, #2d3a2a, #1a241e);
  border-bottom: 1px solid #43503d;
}
.live-team {
  display: flex;
  align-items: center;
  gap: 16px;
}
.live-team.away {
  justify-content: flex-end;
  text-align: right;
}
.live-score {
  font-size: 57px;
  line-height: 1;
  font-weight: 800;
  letter-spacing: -3px;
  min-width: 80px;
}
.live-center {
  text-align: center;
  min-width: 100px;
}
.live-clock {
  font-size: 25px;
  font-weight: 700;
  letter-spacing: 2px;
}
.live-period {
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--accent);
  margin-top: 8px;
}
.game-court-wrap {
  position: relative;
  background: radial-gradient(ellipse at center, #37482f, #1a261d);
  min-height: 290px;
  display: flex;
  justify-content: center;
  overflow: hidden;
}
.game-court-wrap .court-svg {
  max-width: 700px;
  height: 310px;
}
.shot-dot {
  position: absolute;
  width: 23px;
  height: 23px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: var(--accent);
  border: 4px solid #f2c899;
  box-shadow: 0 0 25px #efae5b77;
  animation: shot 0.5s ease-out;
}
.shot-dot.miss {
  background: #8d9390;
  border-color: #c2c8c0;
}
.possession-banner {
  position: absolute;
  left: 20px;
  bottom: 17px;
  right: 20px;
  font-size: 12px;
  color: #e3e7d6;
  background: #122018de;
  border: 1px solid #4b5a40;
  border-radius: 7px;
  padding: 12px 15px;
}
.live-controls {
  padding: 16px 22px;
  background: #1c2820;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.play-feed {
  height: 260px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.play-line {
  font-size: 11px;
  display: flex;
  gap: 15px;
  padding: 12px 18px;
  border-bottom: 1px solid #2b382e;
  line-height: 1.6;
}
.play-line time {
  color: #91a584;
  min-width: 62px;
  flex-shrink: 0;
}
.play-line.scored {
  background: #263426;
}
.play-line strong {
  color: #d9c49b;
}
.loading-overlay {
  position: fixed;
  inset: 0;
  background: #0e1914dd;
  backdrop-filter: blur(5px);
  z-index: 150;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.loader-ring {
  width: 45px;
  height: 45px;
  border: 3px solid #3b4b39;
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 20px;
}
.loading-overlay h2 {
  font-size: 21px;
}
.loading-overlay p {
  color: var(--muted);
  font-size: 12px;
  margin-top: 10px;
}
.landing {
  min-height: 100vh;
  background: radial-gradient(
    ellipse at 75% 10%,
    #2d3b2a 0%,
    #15211a 45%,
    #101713 80%
  );
}
.landing-top {
  padding: 28px 5vw;
  border-bottom: 1px solid #34412f;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.landing-content {
  max-width: 1330px;
  padding: 50px 40px 30px;
  margin: auto;
}
.landing-hero {
  display: grid;
  grid-template-columns: 1fr 0.8fr;
  gap: 50px;
  margin-bottom: 40px;
}
.landing h1 {
  font-size: clamp(45px, 5.5vw, 76px);
  line-height: 0.98;
  font-weight: 900;
  letter-spacing: -3px;
  text-transform: uppercase;
  margin: 20px 0 20px;
}
.landing h1 em {
  color: var(--accent);
  font-style: normal;
}
.landing-desc {
  max-width: 480px;
  font-size: 13px;
  line-height: 1.8;
  color: #aebca7;
}
.features {
  display: flex;
  gap: 25px;
  margin: 26px 0;
}
.feature strong {
  display: block;
  font-size: 20px;
  color: #d2dfc6;
}
.feature span {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--muted);
}
.landing-art {
  position: relative;
  align-self: center;
  min-height: 260px;
  border: 1px solid #4e5a3d;
  background: linear-gradient(140deg, #3c4a2d66, #1a281e);
  transform: rotate(-3deg);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 20px 25px 0 #0d171366;
}
.landing-art .court-svg {
  width: 100%;
  height: 260px;
  opacity: 0.9;
}
.art-caption {
  position: absolute;
  bottom: 22px;
  left: 24px;
  font-size: 9px;
  letter-spacing: 3px;
  color: #d2d4a6;
}
.team-select-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 9px;
}
.team-select {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  border: 1px solid #394631;
  background: #1c281e;
  border-radius: 8px;
  padding: 13px 10px;
  text-align: left;
}
.team-select:hover,
.team-select.selected {
  border-color: var(--c);
  background: color-mix(in srgb, var(--c) 13%, #1c281e);
}
.team-select .crest {
  width: 34px;
  height: 34px;
  font-size: 10px;
}
.team-select strong {
  font-size: 10px;
  display: block;
}
.team-select small {
  color: var(--muted);
  font-size: 9px;
  display: block;
  margin-top: 3px;
}
.setup-bar {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 15px;
  padding: 23px;
  background: #202e22;
  border: 1px solid #47543a;
  border-radius: 10px;
  margin-top: 20px;
  flex-wrap: wrap;
}
.setup-fields {
  display: flex;
  align-items: end;
  gap: 15px;
  flex-wrap: wrap;
}
.landing-footer {
  text-align: center;
  color: #71836f;
  font-size: 10px;
  padding: 28px;
  line-height: 1.8;
}
.save-cards {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 30px;
}
.save-card {
  background: #253424;
  border: 1px solid #526043;
  border-radius: 8px;
  padding: 13px 18px;
  min-width: 240px;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
}
.save-card strong {
  font-size: 12px;
}
.save-card p {
  font-size: 10px;
  color: var(--muted);
  margin-top: 4px;
}
.help-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.help-grid p,
.help-grid li {
  font-size: 12px;
  color: #bccab5;
  line-height: 1.8;
}
.help-grid h3 {
  color: var(--accent);
  margin-bottom: 8px;
}
.form-error {
  color: var(--red);
  font-size: 12px;
  line-height: 1.6;
  margin-top: 12px;
}
.result-banner {
  padding: 20px;
  background: #293d2b;
  border-bottom: 1px solid #43593e;
}
.quick-action {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px 0;
  gap: 12px;
  border-bottom: 1px solid var(--line);
  font-size: 11px;
}
.quick-action:last-child {
  border-bottom: 0;
}
.keycap {
  font-size: 10px;
  border: 1px solid #5a6651;
  border-bottom-width: 2px;
  padding: 2px 5px;
  border-radius: 4px;
  color: #c9d4bd;
}
.badge-achievement {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #302e20;
  color: #e3cc8f;
  border: 1px solid #575039;
  border-radius: 7px;
  padding: 14px 16px;
  font-size: 12px;
}
.intro-step {
  counter-increment: steps;
  display: flex;
  gap: 13px;
  margin-bottom: 20px;
}
.intro-step:before {
  content: counter(steps);
  height: 27px;
  width: 27px;
  flex-shrink: 0;
  border-radius: 50%;
  background: #38492f;
  color: #d3e4bc;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.intro-step p {
  font-size: 12px;
  color: var(--muted);
  margin-top: 5px;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes shot {
  from {
    transform: translate(-50%, -50%) scale(2);
    opacity: 0.2;
  }
  to {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
}
@media (min-width: 1700px) {
  .content {
    padding-top: 40px;
  }
  .hero {
    min-height: 310px;
  }
  .hero-copy {
    padding: 38px;
  }
  .hero h2 {
    font-size: 44px;
  }
}
@media (max-width: 1200px) {
  .sidebar {
    width: 185px;
    padding-left: 12px;
    padding-right: 12px;
  }
  .shell {
    grid-template-columns: 185px minmax(0, 1fr);
  }
  .brand {
    font-size: 20px;
  }
  .content {
    padding: 25px 24px;
  }
  .topbar {
    padding: 0 24px;
  }
  .hero-copy {
    padding: 25px;
  }
  .hero h2 {
    font-size: 32px;
  }
  .grid4 {
    gap: 10px;
  }
  .metric {
    padding: 17px 15px;
  }
  .dashboard-grid {
    grid-template-columns: minmax(0, 1.4fr) minmax(250px, 1fr);
  }
  .team-select-grid {
    grid-template-columns: repeat(5, 1fr);
  }
  .team-block strong {
    font-size: 12px;
  }
  .upcoming {
    gap: 10px;
  }
  .upcoming .crest {
    width: 38px;
    height: 38px;
    font-size: 12px;
  }
  .live-team .crest {
    width: 43px;
    height: 43px;
    font-size: 14px;
  }
  .live-team h2 {
    font-size: 14px;
  }
  .live-scoreboard {
    gap: 18px;
    padding: 24px 20px;
  }
  .live-score {
    font-size: 48px;
    min-width: 65px;
  }
  .topbar-right {
    gap: 12px;
  }
}
@media (max-width: 950px) {
  .hero {
    grid-template-columns: 1fr 0.75fr;
  }
  .hero h2 {
    font-size: 28px;
  }
  .dashboard-grid,
  .two-col-asym {
    grid-template-columns: 1fr;
  }
  .grid4 {
    grid-template-columns: repeat(2, 1fr);
  }
  .hero-court .court-pin span {
    display: none;
  }
  .topbar .league-title {
    font-size: 9px;
  }
  .topbar .manager-name {
    display: none;
  }
  .landing-hero {
    gap: 20px;
  }
  .team-select-grid {
    grid-template-columns: repeat(4, 1fr);
  }
  .grid3 {
    grid-template-columns: 1fr;
  }
  .grid2 {
    gap: 15px;
  }
  .live-team {
    gap: 10px;
  }
  .live-scoreboard {
    gap: 10px;
  }
  .live-score {
    font-size: 42px;
  }
  .live-team .crest {
    display: none;
  }
}
@media (max-width: 700px) {
  .shell {
    display: block;
  }
  .sidebar {
    position: sticky;
    top: 0;
    width: 100%;
    height: auto;
    padding: 10px 14px 0;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }
  .sidebar .brand {
    font-size: 18px;
  }
  .sidebar .brand-mark {
    width: 25px;
    height: 25px;
  }
  .sidebar .brand-sub,
  .sidebar .team-identity,
  .sidebar .nav-label,
  .sidebar .sidebar-bottom {
    display: none;
  }
  .sidebar nav {
    display: flex;
    overflow-x: auto;
    gap: 3px;
    margin-top: 10px;
    scrollbar-width: none;
  }
  .nav-link {
    width: auto;
    font-size: 11px;
    white-space: nowrap;
    padding: 10px 12px;
    margin: 0;
    border-radius: 5px 5px 0 0;
    gap: 6px;
  }
  .nav-link .icon {
    width: 14px;
    height: 14px;
  }
  .nav-link.active:after {
    display: none;
  }
  .topbar {
    height: 49px;
    padding: 0 17px;
  }
  .topbar .league-title {
    display: none;
  }
  .topbar-right {
    gap: 9px;
  }
  .topbar .season-pill {
    font-size: 9px;
  }
  .avatar {
    display: none;
  }
  .content {
    padding: 23px 16px;
  }
  .page-head {
    align-items: start;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 {
    font-size: 27px;
  }
  .page-head p {
    font-size: 11px;
  }
  .page-head .btn {
    padding: 9px 12px;
    font-size: 11px;
    min-height: 36px;
  }
  .hero {
    grid-template-columns: 1fr;
    min-height: 0;
  }
  .hero-copy {
    padding: 25px;
    z-index: 1;
  }
  .hero h2 {
    font-size: 34px;
  }
  .hero-court {
    position: absolute;
    right: -80px;
    bottom: -50px;
    width: 75%;
    height: 250px;
    opacity: 0.18;
    pointer-events: none;
  }
  .hero-copy p {
    max-width: 300px;
  }
  .hero-actions {
    flex-wrap: wrap;
  }
  .grid2 {
    grid-template-columns: 1fr;
  }
  .grid4 {
    gap: 10px;
  }
  .metric .value {
    font-size: 25px;
  }
  .metric .sub {
    font-size: 9px;
  }
  .panel-head {
    padding: 18px;
  }
  .panel-body {
    padding: 18px;
  }
  .upcoming {
    padding: 22px 16px;
  }
  .upcoming .crest {
    width: 35px;
    height: 35px;
    font-size: 10px;
  }
  .team-block {
    gap: 8px;
  }
  .team-block strong {
    font-size: 12px;
  }
  .team-block span.city {
    font-size: 10px;
  }
  .dashboard-grid {
    gap: 17px;
  }
  .profile-metrics {
    gap: 20px;
  }
  .profile-head {
    gap: 15px;
  }
  .profile-head h1 {
    font-size: 25px;
  }
  .modal-head,
  .modal-body {
    padding: 20px;
  }
  .live-scoreboard {
    gap: 6px;
    padding: 20px 12px;
  }
  .live-team {
    flex-direction: column;
    align-items: start;
    gap: 9px;
  }
  .live-team.away {
    align-items: end;
  }
  .live-team h2 {
    font-size: 11px;
  }
  .live-team .muted {
    font-size: 9px;
  }
  .live-score {
    font-size: 44px;
  }
  .live-clock {
    font-size: 21px;
  }
  .live-center {
    min-width: 80px;
  }
  .game-court-wrap {
    min-height: 230px;
  }
  .game-court-wrap .court-svg {
    height: 250px;
  }
  .live-controls {
    padding: 14px;
  }
  .play-feed {
    height: 220px;
  }
  .landing-content {
    padding: 30px 18px 20px;
  }
  .landing-hero {
    grid-template-columns: 1fr;
    margin-bottom: 30px;
  }
  .landing h1 {
    font-size: 51px;
    letter-spacing: -2px;
  }
  .landing-art {
    display: none;
  }
  .landing-top {
    padding: 20px;
  }
  .landing-top .small {
    font-size: 9px;
  }
  .team-select-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
  }
  .team-select {
    padding: 10px 8px;
    gap: 7px;
  }
  .team-select .crest {
    width: 27px;
    height: 27px;
    font-size: 8px;
  }
  .team-select strong {
    font-size: 9px;
  }
  .team-select small {
    font-size: 8px;
  }
  .setup-bar {
    padding: 18px;
    align-items: stretch;
  }
  .setup-fields {
    width: 100%;
    gap: 12px;
  }
  .setup-fields .input-label {
    flex: 1;
    min-width: 130px;
  }
  .setup-bar > .btn {
    width: 100%;
  }
  .help-grid {
    grid-template-columns: 1fr;
  }
  .schedule-row {
    gap: 10px;
    padding: 14px;
  }
  .schedule-date {
    width: 55px;
    font-size: 9px;
  }
  .schedule-score {
    font-size: 14px;
  }
  .draft-clock {
    align-items: start;
    flex-direction: column;
  }
  .filters {
    gap: 8px;
  }
  .search {
    min-width: 0;
    width: 100%;
  }
  .page-head .flex {
    flex-wrap: wrap;
  }
  .notice {
    font-size: 11px;
  }
  .hide-phone {
    display: none;
  }
  .attribute {
    grid-template-columns: 90px 1fr 25px;
  }
  .table-wrap td {
    padding: 12px;
  }
  .topbar .btn {
    min-height: 30px;
    padding: 5px 10px;
    font-size: 10px;
  }
  .save-card {
    min-width: 100%;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

#toast {
  opacity: 0;
  visibility: hidden;
}
#toast.visible {
  opacity: 1;
  visibility: visible;

      `<div class="flex" style="margin-bottom:22px">${crest(t.id, "large")}<div><div class="eyebrow">${t.conf} · ${t.division}</div><h1 style="margin:8px 0">${esc(t.city)} ${esc(t.name)}</h1><p class="muted small">${t.w}–${t.l} · ${H.strength(S, t.id)} OVR · ${money(H.payroll(S, t.id))} payroll</p></div></div><p class="muted small" style="margin-bottom:16px">Coach ${esc(t.coach.name)} · ${esc(t.strategy.pace)} pace · ${esc(t.strategy.offense)} offense · ${esc(t.strategy.defense)} defense</p><div class="table-wrap"><table><thead><tr><th>Player</th><th>Pos</th><th>OVR</th><th>Age</th><th>PPG</th><th>Salary</th></tr></thead><tbody>${H.roster(
        S,
        id,
      )
        .slice()
        .sort((a, b) => b.ovr - a.ovr)
        .map(
          (p) =>
            `<tr class="click-row" data-a="player" data-id="${p.id}"><td>${esc(p.name)}${p.injury ? " †" : ""}</td><td>${p.pos}</td><td>${rate(p.ovr)}</td><td>${p.age}</td><td>${avg(p, "pts")}</td><td>${money(p.salary)}</td></tr>`,
        )
        .join(
          "",
        )}</tbody></table></div><div class="modal-actions">${id !== S.userId ? button("Open trade talks", "trade-with", `data-id="${id}"`, "primary") : ""}${button("Close", "close", "", "ghost")}</div>`,
    );
  }
  function boxModal(id) {
    const l = S.boxes[id];
    if (!l) {
      toast(
        "Detailed box score is available for games involving your team.",
        true,
      );
      return;
    }
    showModal(
      "Final box score",
      `<div class="flex between" style="margin-bottom:22px"><div class="flex">${crest(l.away)}<strong>${esc(H.team(S, l.away).city)} ${l.as}</strong></div><span class="muted">FINAL</span><div class="flex"><strong>${esc(H.team(S, l.home).city)} ${l.hs}</strong>${crest(l.home)}</div></div>${boxTable(l)}`,
    );
  }
  function help() {
    showModal(
      "Your franchise playbook",
      `<div class="help-grid"><div><h3>Build the basketball operation</h3><p>Start in Roster. Give at least five players minutes, then normalize to 240. Click a player to change scoring priority. Use Game plan to set tempo, shot selection, defense and weekly training.</p></div><div><h3>Run the season</h3><p>Coach a game possession by possession, watch automatically, simulate a quarter, or finish instantly. The simulation menu advances one game, seven games, to the deadline, or through the regular season.</p></div><div><h3>Make roster moves</h3><p>Sign free agents with cap room or a $0.8M minimum exception. Trade players and picks. Over-cap matching allows 125% of outgoing salary plus $0.5M. Trades and roster moves lock after game 60 until the offseason.</p></div><div><h3>Win in the offseason</h3><p>After four best-of-seven playoff rounds: review awards, re-sign expiring players, enter the lottery, make two rounds of draft picks, then sign free agents. Trim to 8–15 players before the next season.</p></div><div><h3>Find your next star</h3><p>You start with 100 scouting points and earn more every game. Each 15-point visit narrows estimates. Three visits reveal exact overall and potential. The first four picks are drawn in a weighted lottery among the 14 non-playoff teams.</p></div><div><h3>Manage ownership</h3><p>Each season opens with $22M broadcast revenue. Home games generate ticket income. Salaries and operating costs accrue per game. Arena upgrades add capacity; development improves growth; medicine reduces injury risk.</p></div><div><h3>Keep your career</h3><p>Three browser save slots autosave after decisions. Use Career → Export save for a portable JSON backup. Import on another device or browser. Private browsing and clearing site data can remove local saves.</p></div><div><h3>What shapes results</h3><p>Skills, scoring priority, minutes, morale, condition, coaching and strategy drive individual possessions. Younger players grow toward potential; older players decline and retire. Standard difficulty sets normal trade and salary demands; Ruthless raises both.</p></div></div><hr><p class="muted small">This is a management simulation with a live game viewer. Teams, players, ratings and finances belong to an original fictional league. The league uses 82 round-robin-based games, 41 home and 41 away, and simplified cap and lottery rules.</p>`,
    );
  }
  function menu() {
    showModal(
      "Career menu",
      `<div class="flex" style="margin-bottom:22px">${crest(S.userId, "medium")}<div><h2>${esc(S.manager)} · ${esc(user().city)}</h2><p class="muted small">Slot ${slot} · ${S.year} · ${phaseName()}</p></div></div><div class="stack">${button(icon("download") + " Export save (.json)", "export", "", "primary full")}${button(icon("save") + " Save career now", "save", "", "ghost full")}${button(icon("download") + " Import a career", "import", "", "ghost full")}${button(icon("help") + " Playbook & help", "help", "", "ghost full")}${button("Return to career selection", "title", "", "ghost full")}</div><p class="muted small" style="margin-top:22px">Autosave stays in this browser. Export a backup before clearing browser data or moving devices.</p>`,
    );
  }
  function simOptions() {
    if (S.live) {
      toast("Finish your active game before simulating other games.", true);
      return;
    }
    showModal(
      "Advance the season",
      `<p class="muted small" style="margin-bottom:20px">Your rotation and game plan stay active while the league simulates.</p><div class="stack">${S.phase === "regular" ? `${button("Simulate next game", "simulate", 'data-count="1"', "primary full")}${button("Simulate seven games", "simulate", 'data-count="7"', "ghost full")}${S.day < 59 ? button("Simulate to trade deadline (before game 60)", "simulate", `data-count="${59 - S.day}"`, "ghost full") : ""}${button("Simulate remaining regular season", "simulate", `data-count="${82 - S.day}"`, "ghost full")}` : `${button("Simulate next playoff date", "simulate", 'data-count="1"', "primary full")}${button("Simulate this playoff round", "simulate", 'data-count="round"', "ghost full")}${button("Simulate through the Finals", "simulate", 'data-count="playoffs"', "ghost full")}`}</div>`,
    );
  }
  async function simulate(count) {
    if (busy || S.live) return;
    closeModal();
    busy = true;
    stopLive();
    const phase = S.phase,
      round = S.playoffs?.round;
    let n = 0,
      max = count === "playoffs" ? 40 : count === "round" ? 7 : Number(count);
    const overlay = document.createElement("div");
    overlay.className = "loading-overlay";
    overlay.innerHTML = `<div><div class="loader-ring"></div><h2>The league is in motion.</h2><p id="sim-progress">Simulating games…</p></div>`;
    document.body.append(overlay);
    try {
      while (
        n < max &&
        S.phase === phase &&
        (count !== "round" || S.playoffs.round === round)
      ) {
        if (phase === "regular") H.simulateDay(S);
        else H.nextPlayoff(S);
        n++;
        $("#sim-progress").textContent =
          `${phase === "regular" ? "Game day" : "Playoff date"} ${n}${Number.isFinite(max) && max < 40 ? " of " + max : ""} complete`;
        if (n % 3 === 0) await new Promise((r) => setTimeout(r, 0));
      }
      save();
      render();
      toast(
        S.phase !== phase
          ? `Welcome to ${phaseName().toLowerCase()}.`
          : `${n} ${n === 1 ? "game day" : "game days"} simulated.`,
      );
    } catch (e) {
      toast(
        "Simulation stopped. Your last autosave is preserved. " + e.message,
        true,
      );
    } finally {
      busy = false;
      overlay.remove();
    }
  }
  function exportSave() {
    save();
    if (window.webkit?.messageHandlers?.hardcourt) {
      window.webkit.messageHandlers.hardcourt.postMessage({
        type: "export",
        filename: `Hardcourt-${S.userId}-${S.year}-Career.json`,
        content: JSON.stringify(S, null, 2),
      });
      return;
    }
    const blob = new Blob([JSON.stringify(S, null, 2)], {
        type: "application/json",
      }),
      url = URL.createObjectURL(blob),
      a = document.createElement("a");
    a.href = url;
    a.download = `Hardcourt-${S.userId}-${S.year}-Career.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast("Career exported. Keep this file as your backup.");
  }
  function welcome() {
    showModal(
      "Welcome to the front office",
      `<div class="flex" style="margin-bottom:25px">${crest(S.userId, "large")}<div><div class="eyebrow">The keys are yours</div><h1 style="margin-top:9px">${esc(user().city)} ${esc(user().name)}</h1><p class="muted small">Ownership expects ${user().goal} wins. Your first season starts now.</p></div></div><div style="counter-reset:steps"><div class="intro-step"><div><h3>Meet your roster</h3><p>Review skills and contracts, set minutes, and choose the players who get the shots.</p></div></div><div class="intro-step"><div><h3>Build your identity</h3><p>Set your game plan, work the market, scout prospects and invest in your organization.</p></div></div><div class="intro-step"><div><h3>Take it to the court</h3><p>Coach live or simulate ahead. Run all 82 games, chase a title, then rebuild in the offseason.</p></div></div></div><div class="notice" style="margin-top:22px">The game autosaves to career slot ${slot}. Export a backup from the Career menu whenever you want.</div><div class="modal-actions">${button("Let’s get to work " + icon("arrow"), "close", "", "primary")}</div>`,
    );
  }
  const handlers = {
    close: () => closeModal(),
    nav: (d) => {
      if (route === "game") stopLive();
      route = d.route;
      search = "";
      render();
      window.scrollTo(0, 0);
    },
    "select-team": (d) => {
      selectedTeam = d.id;
      document.querySelectorAll(".team-select").forEach((el) => {
        const active = el.dataset.id === d.id;
        el.classList.toggle("selected", active);
        el.setAttribute("aria-pressed", active);
      });
    },
    create: () => {
      const target = Number($("#new-slot").value);
      if (
        storageGet("hardcourt.slot." + target) &&
        !confirm(
          `Replace the existing career in slot ${target}? Export it first if you want to keep it.`,
        )
      )
        return;
      slot = target;
      const manager = $("#manager").value.trim() || "General Manager";
      try {
        localStorage.setItem("hardcourt.manager", manager);
      } catch {}
      S = H.createCareer({
        teamId: selectedTeam,
        manager,
        difficulty: $("#difficulty").value,
      });
      route = "overview";
      leagueConf = user().conf;
      tradeTeam = S.userId === "BOS" ? "NYE" : "BOS";
      save();
      render();
      window.scrollTo(0, 0);
      welcome();
    },
    load: (d) => {
      try {
        const s = JSON.parse(storageGet("hardcourt.slot." + d.slot));
        if (!H.validateSave(s)) throw Error("Invalid career");
        S = s;
        slot = Number(d.slot);
        route = S.live ? "game" : "overview";
        leagueConf = user().conf;
        tradeTeam = S.userId === "BOS" ? "NYE" : "BOS";
        render();
        toast("Career loaded.");
      } catch {
        toast(
          "This career could not be loaded. Import an exported backup.",
          true,
        );
      }
    },
    player: (d) => playerModal(d.id),
    prospect: (d) => prospectModal(d.id),
    team: (d) => teamModal(d.id),
    box: (d) => boxModal(d.id),
    "auto-rotation": () => {
      H.autoRotation(S, S.userId);
      save();
      render();
      toast("Rotation set: five starters, five reserves.");
    },
    normalize: () => {
      if (result(H.normalizeRotation(S), "Rotation normalized to 240 minutes."))
        render();
    },
    strategy: (d) => {
      user().strategy[d.key] = d.value;
      save();
      render();
    },
    "schedule-tab": (d) => {
      scheduleFilter = d.value;
      render();
    },
    "league-tab": (d) => {
      leagueTab = d.value;
      render();
    },
    "market-tab": (d) => {
      marketTab = d.value;
      search = "";
      render();
    },
    offer: (d) => offerModal(d.id),
    sign: (d) => {
      const fn = d.bird === "true" ? H.resign : H.sign;
      const r = fn(
        S,
        d.id,
        Number($("#offer-years").value),
        Number($("#offer-salary").value),
      );
      if (r.error) {
        $("#offer-error").textContent = r.error;
        return;
      }
      save();
      closeModal();
      render();
      toast("Contract signed. Welcome to the team.");
    },
    "release-confirm": (d) => {
      const p = S.players.find((p) => p.id === d.id);
      showModal(
        "Release " + esc(p.name) + "?",
        `<p>Waiving this player costs <strong>${money(p.salary * p.years * 0.5)}</strong> in cash and adds <strong>${money(p.salary * 0.4)}</strong> to this season’s cap charge. The player becomes a free agent.</p><div class="modal-actions">${button("Release player", "release", `data-id="${p.id}"`, "danger")}${button("Keep player", "close", "", "ghost")}</div>`,
      );
    },
    release: (d) => {
      if (result(H.release(S, d.id), "Player released.")) {
        closeModal();
        render();
      }
    },
    "execute-trade": () => {
      if (
        result(
          H.trade(S, tradeTeam, send, get, sendPicks, getPicks),
          "Trade completed.",
        )
      ) {
        send = [];
        get = [];
        sendPicks = [];
        getPicks = [];
        render();
      }
    },
    "trade-with": (d) => {
      closeModal();
      tradeTeam = d.id;
      send = [];
      get = [];
      sendPicks = [];
      getPicks = [];
      marketTab = "trades";
      route = "market";
      render();
    },
    scout: (d) => {
      if (result(H.scout(S, d.id), "Scouting report updated.")) render();
    },
    "scout-modal": (d) => {
      if (result(H.scout(S, d.id))) {
        render();
        prospectModal(d.id);
      }
    },
    "draft-player": (d) => {
      const cp = S.draft?.order[S.draft.index];
      if (cp?.owner !== S.userId) return;
      if (result(H.draftPlayer(S, d.id), "Selection is in.")) {
        closeModal();
        render();
      }
    },
    "sim-draft": () => {
      H.simToPick(S);
      save();
      render();
      toast(
        S.phase === "draft"
          ? "Your franchise is on the clock."
          : "The draft is complete. Free agency is open.",
      );
    },
    "auto-draft-all": () => {
      showModal(
        "Delegate the rest of the draft?",
        `<p class="muted">Your assistant will select the best combination of ability, upside and positional need with your remaining picks.</p><div class="modal-actions">${button("Auto-draft remaining picks", "confirm-auto-draft", "", "primary")}${button("Keep control", "close", "", "ghost")}</div>`,
      );
    },
    "confirm-auto-draft": () => {
      while (S.phase === "draft") H.autoDraftPick(S);
      save();
      closeModal();
      render();
      toast("The draft is complete. Free agency is open.");
    },
    "begin-draft": () => {
      showModal(
        "Enter the draft lottery?",
        `<p class="muted">Finish re-signing any returning players first. Once the lottery starts, unsigned players lose their returning-player cap exception and enter free agency.</p><div class="modal-actions">${button("Enter lottery & draft", "confirm-draft", "", "primary")}${button("Review my contracts", "review-contracts", "", "ghost")}</div>`,
      );
    },
    "review-contracts": () => {
      closeModal();
      route = "market";
      render();
    },
    "confirm-draft": () => {
      if (result(H.startDraft(S))) {
        closeModal();
        route = "scouting";
        search = "";
        render();
        toast("The lottery is complete. The draft is open.");
      }
    },
    "new-season": () => {
      if (result(H.newSeason(S), "A new season begins.")) {
        route = "overview";
        save();
        render();
      }
    },
    upgrade: (d) => {
      if (result(H.upgrade(S, d.key), "Investment complete.")) render();
    },
    "coach-confirm": (d) =>
      showModal(
        "Hire a new head coach?",
        `<p class="muted">A ${esc(d.type)} specialist costs $4M to hire and earns $3.5M per season. Your current coach is replaced immediately.</p><div class="modal-actions">${button("Hire specialist", "coach", `data-type="${d.type}"`, "primary")}${button("Keep current coach", "close", "", "ghost")}</div>`,
      ),
    coach: (d) => {
      if (result(H.hireCoach(S, d.type), "New head coach hired.")) {
        closeModal();
        render();
      }
    },
    watch: () => {
      if (S.live) {
        route = "game";
        render();
        return;
      }
      if (result(H.startUserGame(S))) {
        route = "game";
        render();
      }
    },
    "live-toggle": () => {
      if (timer) stopLive();
      else timer = setInterval(tick, speed);
      updateLive();
    },
    "live-step": () => {
      stopLive();
      tick();
    },
    "live-quarter": () => {
      stopLive();
      const period = S.live.period;
      let guard = 0;
      while (!S.live.done && S.live.period === period && guard++ < 300)
        H.stepLive(S, S.live);
      save();
      updateLive();
    },
    "live-finish": () => {
      stopLive();
      H.finishLive(S, S.live);
      save();
      updateLive();
    },
    "commit-game": () => {
      if (result(H.commitUserGame(S), "Result recorded.")) {
        route = "overview";
        render();
      }
    },
    "advance-playoff": () => simulate(1),
    "sim-options": () => simOptions(),
    simulate: (d) => simulate(d.count),
    help: () => help(),
    menu: () => menu(),
    save: () => {
      save();
      toast(saveFailed ? "Export your career to keep it." : "Career saved.");
    },
    export: () => exportSave(),
    import: () => $("#import-file").click(),
    title: () => {
      save();
      stopLive();
      closeModal();
      S = null;
      landing();
      window.scrollTo(0, 0);
    },
  };
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-a]");
    if (!el || el.disabled || busy) return;
    const fn = handlers[el.dataset.a];
    if (fn) fn(el.dataset);
  });
  document.addEventListener("change", (e) => {
    const el = e.target,
      d = el.dataset;
    if (!d.change || !S) return;
    switch (d.change) {
      case "roster-pos":
        rosterPos = el.value;
        render();
        break;
      case "roster-sort":
        rosterSort = el.value;
        render();
        break;
      case "minutes":
        H.setMinutes(S, d.id, el.value);
        save();
        render();
        break;
      case "conference":
        leagueConf = el.value;
        render();
        break;
      case "leader-stat":
        leaderStat = el.value;
        render();
        break;
      case "trade-team":
        tradeTeam = el.value;
        send = [];
        get = [];
        sendPicks = [];
        getPicks = [];
        render();
        break;
      case "trade-asset":
      case "trade-pick": {
        const list =
          d.change === "trade-pick"
            ? d.side === "send"
              ? sendPicks
              : getPicks
            : d.side === "send"
              ? send
              : get;
        if (el.checked) list.push(d.id);
        else list.splice(list.indexOf(d.id), 1);
        $("#trade-evaluation").innerHTML = tradeEvaluation(
          H.evaluateTrade(S, tradeTeam, send, get, sendPicks, getPicks),
        );
        break;
      }
      case "scout-sort":
        scoutSort = el.value;
        render();
        break;
      case "ticket":
        user().ticket = Number(el.value);
        save();
        render();
        break;
      case "marketing":
        user().marketing = Number(el.value);
        save();
        render();
        break;
      case "usage": {
        const p = S.players.find((p) => p.id === d.id);
        if (p) p.usage = Number(el.value);
        save();
        break;
      }
      case "live-speed":
        speed = Number(el.value);
        if (timer) {
          stopLive();
          timer = setInterval(tick, speed);
        }
        break;
      case "live-strategy":
        user().strategy[d.key] = el.value;
        save();
        toast("Sideline adjustment applied.");
        break;
    }
  });
  document.addEventListener("input", (e) => {
    const el = e.target;
    if (el.dataset.input === "search") {
      const start = el.selectionStart;
      search = el.value;
      render();
      const input = $('[data-input="search"]');
      input.focus();
      input.setSelectionRange(start, start);
    }
    if (el.dataset.change === "ticket")
      $("#ticket-value").textContent = el.value;
  });
  $("#import-file").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      if (file.size > 15000000) throw Error("Save file is too large.");
      const data = JSON.parse(await file.text());
      if (!H.validateSave(data))
        throw Error("This is not a compatible Hardcourt save.");
      const target = S ? slot : Number(storageGet("hardcourt.active")) || 1;
      if (
        storageGet("hardcourt.slot." + target) &&
        !confirm(
          `Import this career into slot ${target}? The career currently in that slot will be replaced.`,
        )
      )
        return;
      stopLive();
      S = data;
      slot = target;
      route = S.live ? "game" : "overview";
      leagueConf = user().conf;
      tradeTeam = S.userId === "BOS" ? "NYE" : "BOS";
      save();
      closeModal();
      render();
      toast("Career imported. Welcome back.");
    } catch (err) {
      toast(err.message || "Could not read this save file.", true);
    }
  });
  window.addEventListener("beforeunload", () => save());
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      stopLive();
      save();
    }
  });
  $("#modal").addEventListener("click", (e) => {
    if (e.target === $("#modal")) {
      const r = $("#modal").getBoundingClientRect();
      if (
        e.clientX < r.left ||
        e.clientX > r.right ||
        e.clientY < r.top ||
        e.clientY > r.bottom
      )
        closeModal();
    }
  });
  window.HardcourtNative = {
    save: () => {
      if (S) save();
    },
    exportCareer: () => {
      if (S) exportSave();
      else toast("Open a career before exporting.", true);
    },
    importCareer: () => $("#import-file").click(),
    title: () => {
      if (S) handlers.title();
    },
    help: () => {
      if (S) help();
    },
    exportResult: (status) =>
      toast(
        status === "saved"
          ? "Career exported. Keep this file as your backup."
          : status === "cancelled"
            ? "Export canceled."
            : "Could not save the file. Try exporting to another folder.",
        status === "error",
      ),
  };
  window.HardcourtDebug = {
    get state() {
      return S;
    },
    get route() {
      return route;
    },
    load(s) {
      S = s;
      route = "overview";
      leagueConf = user().conf;
      save();
      render();
    },
  };
  landing();
})();
</script>
  </body>
</html>
