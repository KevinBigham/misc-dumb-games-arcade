  h += '<div class="grid" style="align-content:start">' + pan('Cap sheet · ' + y, '<dl class="kv"><dt>Salary cap</dt><dd>' + money(L.cap) + '</dd><dt>Luxury tax line</dt><dd>' + money(taxLine(L)) + '</dd><dt>Apron (hard limits)</dt><dd>' + money(apron(L)) + '</dd><dt>Your payroll</dt><dd class="b">' + money(pay) + '</dd><dt>Cap room</dt><dd class="' + (pay < L.cap ? 'good' : '') + '">' + money(Math.max(0, L.cap - pay)) + '</dd><dt>Room under tax</dt><dd class="' + (pay > taxLine(L) ? 'bad' : '') + '">' + money(taxLine(L) - pay) + '</dd><dt>Luxury tax bill</dt><dd class="' + (tax ? 'bad' : '') + '">' + money(tax) + '</dd><dt>Mid-level exception</dt><dd>' + (t.mleY === y ? 'Used' : pay > apron(L) ? 'Unavailable (over apron)' : pay > taxLine(L) ? money(tmleAmt(L)) + ' taxpayer' : money(mleAmt(L))) + '</dd></dl>') +

      const best = res.slice().sort((a, b) => info(b).ws - info(a).ws)[0];
      body = '<div class="row" style="padding:8px 10px">' + ys.slice(0, 14).map(v => '<a class="btn sm' + (v === y ? ' pri' : '') + '" data-tab="dy:' + v + '">' + v + '</a>').join('') + (ys.length > 14 ? '<select data-chg="draftYear" aria-label="Older drafts"><option>Older…</option>' + ys.slice(14).map(v => '<option>' + v + '</option>').join('') + '</select>' : '') + '</div>' + (best && info(best).ws > 5 ? '<p style="padding:0 10px" class="note">Best career so far from this class: ' + pln(best.pid, best.n) + ' (No. ' + best.pk + ', ' + f1(info(best).ws) + ' win shares).</p>' : '') +
        tbl('dret', [{ k: 'pk', h: 'Pick', f: r => r.pk, v: r => r.pk }, { k: 'tm', h: 'Team', l: 1, f: r => tl(r.tid) }, { k: 'n', h: 'Player', l: 1, f: r => pln(r.pid, r.n), v: r => r.n }, { k: 'pos', h: 'Pos', l: 1, f: r => POS[r.pos] }, { k: 'age', h: 'Draft age', f: r => r.age, v: r => r.age }, { k: 'st', h: 'Now', l: 1, f: r => info(r).st }, { k: 'peak', h: 'Peak', f: r => info(r).peak ? ovc(info(r).peak) : '—', v: r => info(r).peak }, { k: 'gp', h: 'GP', f: r => info(r).gp, v: r => info(r).gp }, { k: 'ppg', h: 'PPG', f: r => info(r).gp ? f1(info(r).pts / info(r).gp) : '—', v: r => info(r).gp ? info(r).pts / info(r).gp : 0 }, { k: 'ws', h: 'WS', f: r => f1(info(r).ws), v: r => info(r).ws }, { k: 'verdict', h: 'Verdict', l: 1, f: r => { const i = info(r), yrs = L.year - y; if (yrs < 3) return '<span class="dim">Too early</span>'; const exp = Math.max(1, (61 - r.pk) / 60 * 9 * Math.min(yrs, 10) / 2.2); return i.ws > exp * 2.2 && r.pk > 10 ? '<span class="good b">Steal</span>' : i.ws > exp * 1.6 ? '<span class="good">Hit</span>' : r.pk <= 14 && i.ws < exp * .35 ? '<span class="bad b">Bust</span>' : '<span class="mut">As expected</span>'; } }, { k: 'aw', h: 'Honors', l: 1, f: r => awardsStr(info(r).aw.filter(a => a[1] !== 'CH')) }], res, { rc: r => r.tid === me ? 'me' : '' }); }
  } else {
    const g = L.gm, seasons = g.log.filter(x => !x.hired), w = seasons.reduce((s, x) => s + x.w, 0), l = seasons.reduce((s, x) => s + x.l, 0);
    body = '<div class="hero" style="margin:10px"><div class="num2">' + g.titles + '</div><div><h2>General manager résumé</h2><div class="mut num">' + seasons.length + ' seasons · ' + w + '-' + l + ' · ' + seasons.filter(x => x.po >= 2).length + ' playoff trips · ' + g.titles + ' title' + (g.titles === 1 ? '' : 's') + ' · Job security ' + g.sec + '/100</div></div></div>' + tbl('gm', [{ k: 'y', h: 'Season', l: 1, f: r => r.y, v: r => r.y }, { k: 't', h: 'Team', l: 1, f: r => tl(r.tid, true) }, { k: 'rec', h: 'Record', f: r => r.hired ? '' : r.w + '-' + r.l }, { k: 'po', h: 'Result', l: 1, f: r => r.hired ? '<span class="ac">Hired</span>' : r.po === 6 ? '<b class="ac">Champions</b>' : POLV[r.po] }, { k: 'goal', h: 'Owner wanted', l: 1, f: r => r.hired ? '' : GOALS[r.goal] }, { k: 'sec', h: 'Security', f: r => r.hired ? '' : r.sec }, { k: 'note', h: 'Review', l: 1, f: r => '<span style="white-space:normal" class="note">' + esc(r.note) + '</span>' }], g.log, { sort: { k: 'y', d: -1 }, empty: 'Your first review comes after the season.' });
  }
  return pan('History of the ' + LG.name, body, { np: 1, right: tabs('hi', [['seasons', 'Seasons'], ['records', 'Record book'], ['career', 'Career leaders'], ['chase', 'Milestone chases'], ['goat', 'All-time greats'], ['hof', 'Hall of Fame'], ['drafts', 'Draft classes'], ['gm', 'My résumé']], 'seasons') });
};
ACT.draftYear = (d, el) => { if (+el.value) { UI.tab.dy = el.value; render(); } };

/* ---------- settings + league health ---------- */
ACT.export = () => exportSave();
ACT.wipe = () => { if (!confirm('Delete the autosave and return to the title screen? Export first if you want to keep this franchise.')) return; try { localStorage.removeItem(SAVEKEY); } catch (e) { } L = null; UI.back = []; applyTheme(); UI.view = 'start'; render(); };
ACT.healthRun = d => {
  if (UI.busy) return; const n = +($('#hn') ? $('#hn').value : 10); UI.busy = true; const H = healthInit(L); UI.health = { n, H, sum: null, t0: performance.now() };
  (function step() { busy(true, 'League health: season ' + (H.done + 1) + ' of ' + n); setTimeout(() => { try { healthStep(H); } catch (e) { H.inv.push('CRASH: ' + e.message); H.done = n; } if (H.done < n) step(); else { UI.health.sum = healthSummary(H); UI.health.secs = (performance.now() - UI.health.t0) / 1000; UI.busy = false; busy(false); render(); } }, 10); })();
};
function healthTable(hh) {
  const S = hh.sum, fmt = (r, v) => r.k === 'talent' || r.k === 'talentTop' ? v.toFixed(1) : Math.abs(v) >= 100 ? v.toFixed(0) : v.toFixed(v < 10 ? 2 : 1);
  const bad = S.rows.filter(r => !r.ok).length;
  return '<div class="hero" style="margin:10px"><div class="num2" style="color:' + (bad || S.inv.length ? 'var(--warn)' : 'var(--good)') + '">' + (S.rows.length - bad) + '/' + S.rows.length + '</div><div><h2>' + S.n + ' seasons simulated on a throwaway copy</h2><div class="mut num">' + S.games.toLocaleString() + ' games in ' + f1(hh.secs) + 's · ' + S.inv.length + ' invariant violations · save size after run ' + f2(S.size / 1e6) + ' MB · ' + S.distinct + ' different champions (most titles by one club: ' + S.maxTitles + ')</div></div></div>' +
    '<div class="tw"><table><thead><tr><th class="l">Measure</th><th>Target</th><th>Healthy range</th><th>Actual</th><th>First half</th><th>Second half</th><th class="l">Status</th></tr></thead><tbody>' + S.rows.map(r => '<tr><td class="l">' + r.label + '</td><td>' + fmt(r, r.target) + '</td><td class="dim">' + fmt(r, r.lo) + ' – ' + fmt(r, r.hi) + '</td><td class="b">' + fmt(r, r.v) + '</td><td class="mut">' + fmt(r, r.first) + '</td><td class="mut">' + fmt(r, r.last) + '</td><td class="l">' + (r.ok ? '<span class="good">OK</span>' : '<span class="flag">OUT OF RANGE</span>') + '</td></tr>').join('') + '</tbody></table></div>' +
    (S.n < 10 ? '<p class="note" style="padding:8px 10px 0">Small sample: with fewer than 10 seasons, once-a-season counts (title odds, best and worst records, scoring leader) swing a lot. Run 20–30 for a fair read.</p>' : '') + '<div style="padding:10px"><h3 class="mb">Invariants checked every season</h3><p class="note">Legal rosters and rotations that cover every position · every contract backed by cap room or a valid exception · no NaN/undefined anywhere in the state · player stats sum to team stats · minutes equal 240 + 25 per overtime · assists never exceed made field goals · league-wide wins = losses and points for = points against.</p>' + (S.inv.length ? '<p class="flag">' + S.inv.length + ' violation(s):</p><ul class="note">' + S.inv.slice(0, 12).map(e => '<li>' + esc(e) + '</li>').join('') + '</ul>' : '<p class="good b">All invariants held in every simulated season.</p>') + '</div>';
}
VIEWS.settings = () => {
  const tab = tabv('set', 'save');
  let body;
  if (tab === 'health') body = '<div class="row" style="padding:10px"><label for="hn">Seasons to simulate</label><select id="hn">' + [3, 5, 10, 20, 30].map(n => '<option' + (n === (UI.health ? UI.health.n : 10) ? ' selected' : '') + '>' + n + '</option>').join('') + '</select><button class="btn pri" data-act="healthRun">Run league health check</button><span class="note">Runs on a copy — your franchise is untouched. Roughly one second per season.</span></div>' + (UI.health && UI.health.sum ? healthTable(UI.health) : '<p class="mut" style="padding:0 10px 10px">Simulates full seasons with every team under computer control, then compares the league\'s numbers with the design targets and flags anything out of range.</p>');
  else if (tab === 'keys') body = '<div style="padding:10px"><dl class="kv" style="max-width:520px"><dt>Space</dt><dd>Main action (play a day / next step)</dd><dt>W · M</dt><dd>Sim a week · a month</dd><dt>A · T · E</dt><dd>Sim to All-Star break · trade deadline · end of season</dd><dt>L</dt><dd>Watch my next game live</dd><dt>O</dt><dd>Auto-run the offseason</dd><dt>Backspace</dt><dd>Back</dd><dt>Esc</dt><dd>Close dialogs and menus</dd></dl><p class="note mt">Every player and team name is a link. Click any column header to sort.</p></div>';
  else body = '<div style="padding:10px"><div class="row"><button class="btn pri" data-act="export">Export save to file</button><label class="btn">Import save file<input type="file" accept=".json,application/json" data-chg="importFile" style="display:none"></label><button class="btn dng" data-act="wipe">Delete autosave / new league</button></div><p class="note mt">The game autosaves to this browser after every sim and every move (' + esc(UI.saveMsg || 'not saved yet') + '). Export a file now and then: a file can never be lost to a cleared browser.</p><dl class="kv mt" style="max-width:420px"><dt>League seed</dt><dd>' + L.seed + '</dd><dt>Season</dt><dd>' + L.year + '</dd><dt>Save size</dt><dd>' + f2(serialize(L).length / 1e6) + ' MB</dd><dt>Players tracked</dt><dd>' + Object.keys(L.players).length + ' active · ' + Object.keys(L.retired).length + ' retired</dd></dl></div>';
  return pan('Settings', body, { np: 1, right: tabs('set', [['save', 'Saves'], ['health', 'League health'], ['keys', 'Controls']], 'save') });
};

/* ---------- offseason hub ---------- */
ACT.resign = d => { const p = L.players[d.pid], yrs = +$('#ry' + d.pid).value; let amt = Math.round((+$('#ra' + d.pid).value || 0) * 1000); const mn = minSal(L, p), mx = maxSal(L, p), ak = resignAsk(L, p, ut()).amt; if (Math.abs(amt - ak) <= 10) amt = ak; if (amt < mn && amt >= mn * .97) amt = mn; if (amt > mx && amt <= mx * 1.01) amt = mx; const r = userResign(L, p, amt, yrs); if (r.ok) { save(); render(); toast(p.name + ' agrees to terms.'); } else toast(r.why); };
function resignTable(list, title, note) {
  const t = ut();
  return pan(title, (list.length ? '<div class="tw"><table><thead><tr><th class="l">Player</th><th class="l">Pos</th><th>Age</th><th>Ovr</th><th>Pot</th><th>Last PPG</th><th>Asking</th><th class="l">Your offer ($M / yrs)</th><th></th></tr></thead><tbody>' + list.map(p => { const a = resignAsk(L, p, t), l = p.ss.length ? lineToObj(p.ss[p.ss.length - 1]) : null; return '<tr><td class="l">' + pl(p) + '</td><td class="l">' + POS[p.pos] + '</td><td>' + p.age + '</td><td>' + ovc(p.ovr) + '</td><td class="mut">' + potEst(p) + '</td><td>' + (l && l.gp ? f1(l.pts / l.gp) : '—') + '</td><td>' + (a.willing ? money(a.amt) + ' × ' + a.yrs : '<span class="bad">Won\'t sign</span>') + '</td><td class="l">' + (a.willing ? '<input id="ra' + p.pid + '" type="number" step="0.1" style="width:84px" value="' + (a.amt / 1000).toFixed(2) + '" aria-label="Salary for ' + esc(p.name) + '"> <select id="ry' + p.pid + '" aria-label="Years for ' + esc(p.name) + '">' + [1, 2, 3, 4, 5].map(n => '<option' + (n === a.yrs ? ' selected' : '') + '>' + n + '</option>').join('') + '</select>' : '<span class="note" style="white-space:normal">' + esc(a.why) + '</span>') + '</td><td>' + (a.willing ? '<button class="btn sm pri" data-act="resign" data-pid="' + p.pid + '">Sign</button>' : '') + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<p class="mut" style="padding:10px">Nobody in this group.</p>') + '<p class="note" style="padding:8px 10px">' + note + '</p>', { np: 1 });
}
VIEWS.offseason = () => {
  const ph = L.phase, t = ut(), hs = L.hist.seasons[L.hist.seasons.length - 1];
  let h = '<div class="tabs mb">' + PHASES.map(p => '<a class="' + (p === ph ? 'on' : '') + '" style="cursor:default">' + PHASE_NAME[p] + '</a>').join('') + '</div>';
  if (ph === 'AWARDS' && hs) {
    const ev = L.gm.log.filter(x => !x.hired).slice(-1)[0];
    const dev = t.roster.map(x => L.players[x]).filter(p => p.ss.length).map(p => ({ p, d: p.ovr - p.ss[p.ss.length - 1][3] })).sort((a, b) => b.d - a.d);
    const ret = L.news.filter(n => n.y === L.year && n.ph === 'AWARDS' && (n.t === 'retire' || n.t === 'honor' || n.t === 'demand' || n.t === 'gm'));
    h += '<div class="hero"><div class="num2">' + hs.y + '</div><div><h1>' + esc(tname(L, hs.champ)) + '</h1><div class="mut">' + LG.name + ' champions — beat ' + esc(tname(L, hs.ru)) + ' ' + hs.fin + ' in the ' + LG.finals + '</div></div></div>';
    h += '<div class="grid g3 mt">' + pan('Your season', '<div class="big">' + (ev ? ev.w + '-' + ev.l : '') + '</div><p class="b ' + (t.poLvl === 6 ? 'ac' : '') + '">' + POLV[ev ? ev.po : 0] + '</p><p class="note">' + (ev ? esc(ev.note) : '') + '</p><div class="note">Job security ' + L.gm.sec + '/100</div><div class="meter"><i style="width:' + L.gm.sec + '%;background:' + (L.gm.sec >= 60 ? 'var(--good)' : L.gm.sec >= 35 ? 'var(--warn)' : 'var(--bad)') + '"></i></div>') +
      pan('Awards', '<dl class="kv">' + awLine(LG.aw.mvp, hs.aw.mvp) + awLine(LG.aw.fmvp, hs.aw.fmvp) + awLine(LG.aw.dpoy, hs.aw.dpoy) + awLine(LG.aw.roy, hs.aw.roy) + awLine(LG.aw.smoy, hs.aw.smoy) + awLine(LG.aw.mip, hs.aw.mip) + '</dl><a class="btn sm mt" data-go="history">Full season page</a>') +
      pan('Player development', dev.length ? '<div class="tw"><table><tbody>' + dev.map(x => '<tr><td class="l">' + pl(x.p, true) + ' <span class="dim">' + x.p.age + '</span></td><td>' + ovc(x.p.ovr) + '</td><td class="' + (x.d > 0 ? 'good' : x.d < 0 ? 'bad' : 'dim') + ' b">' + (x.d > 0 ? '+' : '') + x.d + '</td></tr>').join('') + '</tbody></table></div>' : '<span class="mut">—</span>', { np: 1 }) + '</div>';
    h += '<div class="mt">' + pan('Retirements, honors & unrest', newsList(ret, 40), { np: 1 }) + '</div>';
  } else if (ph === 'LOTTERY' || ph === 'DRAFT') return h + VIEWS.draft();
  else if (ph === 'RESIGN') {
    h += '<div class="hero mb"><div><h2>Re-signing & extensions</h2><div class="mut num">Next season: payroll ' + money(payroll(L, t)) + ' · cap ' + money(L.cap) + ' · tax line ' + money(taxLine(L)) + '</div></div></div>' + resignTable(expiring(L, t), 'Expiring contracts', 'You can exceed the cap to keep your own players. Anyone unsigned when you continue becomes a free agent — and rivals will bid.') + '<div class="mt">' + resignTable(extendable(L, t), 'Extension candidates (one year left)', 'An extension starts after the current deal ends. Stars who are frustrated with losing ask for more; those who have demanded a trade will not talk.') + '</div>';
  } else if (ph === 'FA') return h + VIEWS.fa();
  else if (ph === 'CAMP') return h + VIEWS.roster();
  else h += pan('Offseason', '<p class="mut">Use the button at the top right to continue.</p>');
  return h;
};

</script>
</body>
</html>
