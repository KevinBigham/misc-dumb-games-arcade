<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Emberward</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#110f26">
<style>
/* Layout: one-screen portrait app. HUD / board canvas / one hint line / hand of 3. Night-watch palette, single deliberate dark look. */
:root{
  --night:#110f26; --night2:#1a1738; --cell:#1f1b40; --line:#302b62;
  --ember:#ffb547; --hot:#ff6a3d; --ink:#f5eeff; --dim:#9a92c6; --danger:#ff4d6d; --ice:#bfe9ff;
  --display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --ui:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;background:var(--night);color:var(--ink)}
body{margin:0;font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{height:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));box-sizing:border-box;position:relative}
#hud{display:flex;align-items:center;gap:8px;padding-block:8px 4px;min-height:48px}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--night2);color:var(--ink);font:600 20px/1 var(--ui);display:grid;place-items:center;cursor:pointer;flex:none}
.ib:disabled{opacity:.35;cursor:default}
.ib:focus-visible,.card:focus-visible,.btn:focus-visible,.pick:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.hstat{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.lbl{font-size:10px;letter-spacing:.14em;color:var(--dim);font-weight:700}
.val{font:700 18px/1.1 var(--ui);font-variant-numeric:tabular-nums}
.hearts{display:flex;gap:2px;flex:1;justify-content:center}
.hearts svg{width:22px;height:22px}
#streak{font:800 12px/1 var(--ui);color:var(--ember);letter-spacing:.06em;min-width:30px;text-align:center}
#stage{flex:1;position:relative;min-height:0}
#board{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}
#hint{height:24px;line-height:24px;text-align:center;font-size:14px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hint b{color:var(--ink)} #hint .warn{color:var(--danger);font-weight:700} #hint .ok{color:var(--ember);font-weight:700}
#hand{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-block:6px max(10px,env(safe-area-inset-bottom,0px));min-height:104px}
.card{position:relative;border:1.5px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#26214e,#1b1839);color:var(--ink);padding:8px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:var(--ui);transition:transform .12s ease,border-color .12s;min-height:96px;min-width:0}
.card .nm{font:800 15px/1 var(--ui);letter-spacing:.02em}
.card .ds{font-size:11.5px;color:var(--dim);line-height:1.2;text-align:center}
.card .key{position:absolute;top:5px;left:8px;font-size:10px;color:var(--dim);font-weight:700}
.card svg{width:34px;height:34px}
.card.sel{border-color:var(--ember);transform:translateY(-6px);box-shadow:0 6px 22px -8px var(--hot)}
.card.empty{visibility:hidden}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;overflow:auto}
#ov.dim{background:rgba(12,10,30,.88);backdrop-filter:blur(3px)}
#ov.title{background:linear-gradient(180deg,rgba(17,15,38,.92) 0%,rgba(17,15,38,.55) 38%,rgba(17,15,38,.55) 62%,rgba(17,15,38,.95) 100%)}
.panel{width:100%;max-width:400px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.wordmark{font:600 clamp(40px,12vw,58px)/1 var(--display);letter-spacing:.06em;text-align:center;color:var(--ember);text-shadow:0 0 24px rgba(255,106,61,.55);margin:0}
.tag{text-align:center;color:var(--ink);font-size:15px;margin:2px 0 10px}
h2{font:600 28px/1.1 var(--display);margin:0;text-align:center;text-wrap:balance}
.sub{color:var(--dim);text-align:center;font-size:14px;line-height:1.4}
.btn{min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--night2);color:var(--ink);font:700 17px/1 var(--ui);cursor:pointer;padding:0 16px}
.btn.pri{background:linear-gradient(180deg,#ffbe5c,#ff8a3d);color:#2a1205;border-color:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>.btn{flex:1}
.tiers{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tier{min-width:44px;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--dim);font:700 14px var(--ui);cursor:pointer}
.tier.on{border-color:var(--ember);color:var(--ember)}
.stats{color:var(--dim);font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.pick{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);border-radius:14px;background:var(--night2);color:var(--ink);padding:10px 12px;cursor:pointer;min-height:64px;font-family:var(--ui)}
.pick svg{width:40px;height:40px;flex:none}
.pick .pn{font:800 16px/1.2 var(--ui)} .pick .pd{font-size:13px;color:var(--dim);line-height:1.3}
.pick .rl{font-size:10px;letter-spacing:.14em;color:var(--hot);font-weight:800}
.box{background:var(--night2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45}
.box b{color:var(--ember)}
.help li{margin:0 0 6px} .help ul{padding-left:18px;margin:0}
textarea.share{width:100%;height:90px;background:var(--night);color:var(--ink);border:1px solid var(--line);border-radius:10px;font:13px ui-monospace,monospace;box-sizing:border-box}
@media (max-height:640px){#hand{min-height:86px}.card{min-height:80px}.card svg{width:26px;height:26px}.card .ds{font-size:10.5px}}
</style>

<div id="app">
  <header id="hud">
    <button class="ib" id="bMenu" aria-label="Pause and menu">&#9776;</button>
    <div class="hstat"><span class="lbl">NIGHT</span><span class="val" id="hNight">1/8</span></div>
    <div class="hearts" id="hHearts" aria-label="Hearts"></div>
    <div class="hstat" style="align-items:flex-end"><span class="lbl">SCORE</span><span class="val" id="hScore">0</span></div>
    <div id="streak" title="Streak: turns in a row with a pop"></div>
    <button class="ib" id="bUndo" aria-label="Undo last cast (once per night)" title="Undo (U) — once per night">&#8630;</button>
    <button class="ib" id="bMute" aria-label="Toggle sound" title="Sound (M)">&#9835;</button>
  </header>
  <div id="stage"><canvas id="board" aria-label="Game board"></canvas></div>
  <div id="hint"></div>
  <div id="hand"></div>
  <div id="ov" hidden></div>
</div>

<script id="ew-logic">
/* EMBERWARD — pure deterministic logic. state in, action in, new state out. Runs in browser and Node. */
(function (G) {
'use strict';
const W = 5, H = 7;
const K = { // tuning knobs
  HEARTS: 3, MAX_HEARTS: 5, NIGHTS: 8,
  SPAWN_BASE: 5, SPAWN_PER_NIGHT: 2.4, LEN_BASE: 4,
  BURST: 1, SPARK: 2, HAND: 3, RELIC_NIGHTS: [2, 5], TWIN_EVERY: 6, ECHO_AT: 3, STAR_FIRST_ONLY: 1, TINDER_COST: 0, TINDER_NOCHAIN: 1, STAR_COST: 1, OVERFLOW_BONUS: 1,
  HP_RAMP: 0.08, TIER_SPAWN: 0.9, DRIFT_HP: 2, BRUTE_HP: 4,
};
const CARDS = {
  spark:  { n: 'Spark',  t: 'cell', d: '2 damage to one shade.' },
  lance:  { n: 'Lance',  t: 'col',  d: '1 damage to every shade in a column.' },
  flare:  { n: 'Flare',  t: 'cell', d: '1 damage in a + shape.' },
  blast:  { n: 'Blast',  t: 'cell', d: '1 damage in a 3×3 square, 2 in the middle.' },
  sweep:  { n: 'Sweep',  t: 'row',  d: '1 damage to every shade in a row.' },
  pierce: { n: 'Pierce', t: 'cell', d: '4 damage to one shade.' },
  gust:   { n: 'Gust',   t: 'cell', d: '1 damage, then push it up 2 rows.' },
  frost:  { n: 'Frost',  t: 'cell', d: '1 damage, and freeze a + shape: they skip their next move.' },
  kindle: { n: 'Kindle', t: 'cell', d: '1 damage. Marks a + shape: marked shades burst for +2 when they pop.' },
};
const RELICS = {
  tinder:   { n: 'Tinder Heart', d: 'Pops burst for 2 — but shades popped by a burst don\'t burst.' },
  star:     { n: 'Starburst',    d: 'Shades your card pops also burst diagonally. Costs 1 heart to take.' },
  echo:     { n: 'Echo Bell',    d: 'A cast that pops 3+ shades gives you an extra cast this turn.' },
  overflow: { n: 'Overflow',     d: 'Overkill damage +1 is added to that pop\'s burst.' },
  bulwark:  { n: 'Bulwark',      d: 'The first shade to reach your wall each night is destroyed harmlessly.' },
  twin:     { n: 'Twin Wick',    d: 'Every 6th turn you cast twice.' },
};
const TYPES = {
  drift: { n: 'Shade',  sp: 1, wall: 1 },
  dash:  { n: 'Runner', sp: 2, wall: 1 },
  brute: { n: 'Brute',  sp: 1, wall: 2, slow: 1 },
  ward:  { n: 'Warden', sp: 1, wall: 1, immune: 1 },
};
const BASE_CARDS = ['blast', 'sweep', 'pierce', 'gust', 'frost'];
const BASE_RELICS = ['tinder', 'echo', 'overflow', 'bulwark'];

function rnd(s) { let t = s.rng = (s.rng + 0x6D2B79F5) >>> 0; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function ri(s, n) { return Math.floor(rnd(s) * n); }
function shuffle(s, a) { for (let i = a.length - 1; i > 0; i--) { const j = ri(s, i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function has(s, r) { return s.relics.indexOf(r) >= 0; }
function at(s, x, y) { for (const o of s.shades) if (o.x === x && o.y === y && !o.dead) return o; return null; }

function clone(s) {
  const c = Object.assign({}, s);
  c.shades = s.shades.map(o => Object.assign({}, o));
  c.hand = s.hand.slice(); c.draw = s.draw.slice(); c.discard = s.discard.slice(); c.deck = s.deck.slice();
  c.relics = s.relics.slice(); c.spawnQ = s.spawnQ.map(o => Object.assign({}, o));
  c.stats = Object.assign({}, s.stats); c.draft = s.draft ? s.draft.map(o => Object.assign({}, o)) : null;
  c.ev = [];
  return c;
}

function newRun(seed, opts) {
  opts = opts || {};
  const s = {
    v: 2, seed: seed >>> 0, rng: (seed >>> 0) ^ 0x9E3779B9, tier: opts.tier || 0, daily: !!opts.daily,
    cardPool: opts.cardPool || BASE_CARDS.slice(), relicPool: opts.relicPool || BASE_RELICS.slice(),
    night: 0, turn: 0, hearts: K.HEARTS, shades: [], deck: ['spark', 'spark', 'spark', 'lance', 'lance', 'flare', 'flare'],
    hand: [], draw: [], discard: [], relics: [], spawnQ: [], casts: 1, phase: 'play', draft: null,
    score: 0, streak: 0, nextId: 1, bulwarkUsed: false,
    stats: { kills: 0, maxChain: 0, wallHits: 0, turns: 0, casts: 0, wildfires: 0 }, ev: [],
  };
  startNight(s);
  s.ev = [];
  return s;
}

function drawCards(s, n) {
  while (s.hand.length < n) {
    if (!s.draw.length) { if (!s.discard.length) break; s.draw = shuffle(s, s.discard); s.discard = []; }
    s.hand.push(s.draw.pop());
  }
}

function genNight(s, n) {
  const L = K.LEN_BASE + n;
  const count = Math.round(K.SPAWN_BASE + n * K.SPAWN_PER_NIGHT + s.tier * K.TIER_SPAWN);
  const q = [];
  for (let i = 0; i < count; i++) {
    const t = i < 2 ? 1 : 1 + ri(s, L);
    let r = rnd(s), type = 'drift';
    if (n >= 2 && r < 0.12 + n * 0.03) type = 'dash';
    else if (n >= 3 && r < 0.22 + n * 0.035) type = 'brute';
    else if (n >= 4 && r < 0.30 + n * 0.04) type = 'ward';
    let hp;
    if (type === 'drift') hp = K.DRIFT_HP + (rnd(s) < 0.25 + n * K.HP_RAMP ? 1 : 0) + (n >= 5 && rnd(s) < 0.25 ? 1 : 0);
    else if (type === 'dash') hp = 1 + (rnd(s) < 0.3 + n * 0.05 ? 1 : 0);
    else if (type === 'brute') hp = K.BRUTE_HP + Math.floor(n / 3);
    else hp = 2 + (rnd(s) < 0.4 ? 1 : 0);
    hp += (s.tier >= 3 && type !== 'brute' && rnd(s) < 0.07 * s.tier) ? 1 : 0;
    q.push({ t, type, hp, x: ri(s, W) });
  }
  if (n === 1) { // teaching opener: a 2-HP shade flanked by 1-HP shades, so the first Spark makes a chain
    const a = 1 + ri(s, 3);
    q[0] = { t: 1, type: 'drift', hp: 2, x: a }; q[1] = { t: 1, type: 'drift', hp: 1, x: a - 1 }; q.push({ t: 1, type: 'drift', hp: 1, x: a + 1 });
    for (const e of q) if (e.hp > 2) e.hp = 2;
  }
  if (n === K.NIGHTS) q.push({ t: L, type: 'brute', hp: 9 + s.tier, x: 2, boss: 1 });
  q.sort((a, b) => a.t - b.t);
  return q;
}

function spawnFor(s, t) {
  const keep = [];
  for (const e of s.spawnQ) {
    if (e.t > t) { keep.push(e); continue; }
    let placed = false;
    for (let d = 0; d < W && !placed; d++) for (const dx of d ? [d, -d] : [0]) {
      const x = e.x + dx; if (x < 0 || x >= W || placed) continue;
      if (!at(s, x, 0)) {
        const sh = { id: s.nextId++, type: e.type, hp: e.hp, max: e.hp, x, y: 0, cd: TYPES[e.type].slow ? 1 : 0, fz: 0, vol: 0, boss: e.boss || 0 };
        s.shades.push(sh); s.ev.push({ k: 'spawn', id: sh.id, x, y: 0 }); placed = true;
      }
    }
    if (!placed) { e.t = t + 1; keep.push(e); }
  }
  s.spawnQ = keep;
}

function castsFor(s) { return has(s, 'twin') && s.turn % K.TWIN_EVERY === 0 ? 2 : 1; }

function startNight(s) {
  s.night++; s.turn = 1; s.bulwarkUsed = false; s.shades = [];
  s.draw = shuffle(s, s.deck.slice()); s.discard = []; s.hand = []; drawCards(s, K.HAND);
  s.spawnQ = genNight(s, s.night);
  spawnFor(s, 1);
  s.casts = castsFor(s); s.phase = 'play'; s.draft = null;
  s.ev.push({ k: 'night', n: s.night });
}

function cardHits(s, cid, x, y) {
  const hits = [], fx = [];
  const plus = [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]];
  const inb = (a, b) => a >= 0 && a < W && b >= 0 && b < H;
  switch (cid) {
    case 'spark': hits.push([x, y, K.SPARK]); break;
    case 'pierce': hits.push([x, y, 4]); break;
    case 'lance': for (let yy = H - 1; yy >= 0; yy--) hits.push([x, yy, 1]); break;
    case 'sweep': for (let xx = 0; xx < W; xx++) hits.push([xx, y, 1]); break;
    case 'flare': for (const [dx, dy] of plus) if (inb(x + dx, y + dy)) hits.push([x + dx, y + dy, 1]); break;
    case 'blast': for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) if (inb(x + dx, y + dy)) hits.push([x + dx, y + dy, dx || dy ? 1 : 2]); break;
    case 'gust': hits.push([x, y, 1]); fx.push(['push', x, y]); break;
    case 'frost': hits.push([x, y, 1]); for (const [dx, dy] of plus) if (inb(x + dx, y + dy)) fx.push(['freeze', x + dx, y + dy]); break;
    case 'kindle': for (const [dx, dy] of plus) if (inb(x + dx, y + dy)) fx.push(['mark', x + dx, y + dy]); hits.push([x, y, 1]); break;
  }
  return { hits, fx };
}

// resolve damage with chain bursts. returns number of pops
function applyHits(s, hits) {
  let q = hits.map(h => ({ x: h[0], y: h[1], a: h[2], src: 'card' }));
  let wave = 0, pops = 0;
  const burst = has(s, 'tinder') ? 2 : K.BURST, diag = has(s, 'star');
  while (q.length && wave < 40) {
    const nq = [];
    for (const h of q) {
      const sh = at(s, h.x, h.y); if (!sh) continue;
      if (h.src === 'burst' && TYPES[sh.type].immune) { s.ev.push({ k: 'block', id: sh.id, w: wave }); continue; }
      sh.hp -= h.a; s.ev.push({ k: 'hit', id: sh.id, a: h.a, w: wave, src: h.src });
      if (sh.hp <= 0) {
        sh.dead = true; pops++; s.stats.kills++;
        s.score += 10 * pops;
        s.ev.push({ k: 'pop', id: sh.id, x: sh.x, y: sh.y, w: wave, n: pops, type: sh.type });
        const over = has(s, 'overflow') && sh.hp < 0 ? -sh.hp + K.OVERFLOW_BONUS : 0;
        const tinderStop = has(s, 'tinder') && K.TINDER_NOCHAIN && h.src === 'burst';
        const bb = burst + (sh.vol ? 2 : 0) + over;
        const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
        if (!tinderStop) for (const [dx, dy] of dirs) nq.push({ x: sh.x + dx, y: sh.y + dy, a: bb, src: 'burst' });
        if (diag && (wave === 0 || !K.STAR_FIRST_ONLY)) for (const [dx, dy] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) nq.push({ x: sh.x + dx, y: sh.y + dy, a: 1 + (sh.vol ? 2 : 0), src: 'burst' });
      }
    }
    q = nq; wave++;
  }
  s.shades = s.shades.filter(o => !o.dead);
  return pops;
}

function resolveCast(s, a) {
  const cid = s.hand[a.c];
  s.hand.splice(a.c, 1);
  const { hits, fx } = cardHits(s, cid, a.x, a.y);
  for (const f of fx) if (f[0] === 'mark') { const sh = at(s, f[1], f[2]); if (sh) { sh.vol = 1; s.ev.push({ k: 'mark', id: sh.id }); } }
  const pops = applyHits(s, hits);
  for (const f of fx) {
    const sh = at(s, f[1], f[2]); if (!sh) continue;
    if (f[0] === 'freeze') { sh.fz = 1; s.ev.push({ k: 'freeze', id: sh.id }); }
    if (f[0] === 'push') { let ny = sh.y; for (let i = 0; i < 2; i++) if (ny > 0 && !at(s, sh.x, ny - 1)) ny--; s.ev.push({ k: 'push', id: sh.id, from: sh.y, to: ny }); sh.y = ny; }
  }
  s.discard.push(cid);
  if (pops >= K.ECHO_AT && has(s, 'echo')) { s.casts++; s.ev.push({ k: 'echo', card: cid }); }
  s.stats.casts++;
  s.stats.maxChain = Math.max(s.stats.maxChain, pops);
  if (pops >= 5) { s.stats.wildfires++; s.score += 50; s.ev.push({ k: 'wildfire', n: pops }); }
  if (pops > 0) { s.streak++; s.score += 5 * (s.streak - 1); } else s.streak = 0;
  s.ev.push({ k: 'cast', card: cid, x: a.x, y: a.y, pops });
  return pops;
}

function moveShades(s) {
  const order = s.shades.slice().sort((a, b) => b.y - a.y);
  for (const sh of order) {
    if (sh.dead) continue;
    if (sh.fz > 0) { sh.fz--; s.ev.push({ k: 'thaw', id: sh.id }); continue; }
    const T = TYPES[sh.type];
    if (T.slow) { if (sh.cd > 0) { sh.cd--; continue; } sh.cd = 1; }
    const from = sh.y;
    for (let i = 0; i < T.sp; i++) {
      if (sh.y + 1 >= H) {
        sh.dead = true;
        if (has(s, 'bulwark') && !s.bulwarkUsed) { s.bulwarkUsed = true; s.ev.push({ k: 'bulwark', id: sh.id, x: sh.x }); }
        else { const dmg = sh.boss ? 3 : T.wall; s.hearts -= dmg; s.stats.wallHits++; s.ev.push({ k: 'wall', id: sh.id, x: sh.x, dmg }); }
        break;
      }
      if (at(s, sh.x, sh.y + 1)) break;
      sh.y++;
    }
    if (!sh.dead && sh.y !== from) s.ev.push({ k: 'move', id: sh.id, from, to: sh.y });
  }
  s.shades = s.shades.filter(o => !o.dead);
}

function nightClear(s) {
  s.score += 100 + 25 * s.hearts;
  s.ev.push({ k: 'clear', n: s.night });
  if (s.night >= K.NIGHTS) { s.phase = 'won'; s.score += 500 + 100 * s.hearts; s.ev.push({ k: 'won' }); return; }
  s.phase = 'draft'; s.draft = genDraft(s);
}

function genDraft(s) {
  if (K.RELIC_NIGHTS.indexOf(s.night) >= 0) {

function update(dt){
  tickAnim(dt);
  if (hitstop > 0 && anim) return;
  for (const d in disp) { const o = disp[d]; if (o.fl > 0) o.fl = Math.max(0, o.fl - dt * 5); }

$('hand').addEventListener('click', ev => { const b = ev.target.closest('.card'); if (!b || mode !== 'play') return; audio(); selectCard(+b.dataset.i); });
function selectCard(i){ if (!S || i >= S.hand.length) return; if (sel !== i) { sel = i; sfx.select(); } renderHand(); pvKey = ''; setHint(); }
$('bMute').addEventListener('click', () => { audio(); meta.muted = !meta.muted; if (master) master.gain.value = meta.muted ? 0 : .5; persist(); renderHud(); });
$('bUndo').addEventListener('click', undo);
$('bMenu').addEventListener('click', () => { audio(); if (mode === 'play') pause(); else if (mode === 'pause') resume(); });
document.addEventListener('keydown', ev => {
  audio(); const k = ev.key;
  if (k === 'm' || k === 'M') { $('bMute').click(); return; }
  if (mode === 'play') {
    if (k >= '1' && k <= '3') selectCard(+k - 1);
    else if (k.startsWith('Arrow')) { ev.preventDefault(); pointerType = 'key'; aim = aim || { x: 2, y: 3 }; if (k === 'ArrowLeft') aim.x = Math.max(0, aim.x - 1); if (k === 'ArrowRight') aim.x = Math.min(W - 1, aim.x + 1); if (k === 'ArrowUp') aim.y = Math.max(0, aim.y - 1); if (k === 'ArrowDown') aim.y = Math.min(H - 1, aim.y + 1); aim = { x: aim.x, y: aim.y }; sfx.aim(); setHint(); }
    else if ((k === 'Enter' || k === ' ') && aim && !anim) { ev.preventDefault(); commit(actFor(sel, aim.x, aim.y)); }
    else if (k === 'u' || k === 'U') undo();
    else if (k === 'Escape' || k === 'p' || k === 'P') pause();
  } else if (mode === 'draft') { if (k >= '1' && k <= '4') pickDraft(+k - 1); }
  else if (mode === 'pause') { if (k === 'Escape' || k === 'p' || k === 'P' || k === 'Enter') resume(); }
  else if (mode === 'end' || mode === 'title') { if (k === 'n' || k === 'N' || k === 'Enter') newRun(false); }
  else if (mode === 'help' && k === 'Escape') showTitle();
});

// ---------- flow ----------
function save(){ store.run = (S && (S.phase === 'play' || S.phase === 'draft')) ? { s: strip(S), snaps: snaps.slice(-40), undoNight: store.run && store.run.undoNight || 0 } : null; persist(); }
function strip(s){ const c = Object.assign({}, s); c.ev = []; return c; }
function canUndo(){ return mode === 'play' && !anim && prev && S && S.phase === 'play' && prev.night === S.night && !(store.run && store.run.undoNight === S.night); }
function undo(){
  if (!canUndo()) return;
  S = prev.s; prev = null; snaps.pop(); V = S; syncDisp(S); if (store.run) store.run.undoNight = S.night; aim = null; pvKey = '';
  floatText('Rewound', L.w / 2, L.oy + L.cell * 3, C.ink, 22); sfx.select(); save(); renderHud(); renderHand(); setHint();
}
function commit(a){
  if (anim || !S || S.phase !== 'play') return;
  const pre = S; const next = EW.step(S, a);
  snaps.push({ s: strip(pre), a, n: pre.night, t: pre.turn }); if (snaps.length > 60) snaps.shift();
  prev = { s: pre, night: pre.night };
  S = next; V = S; aim = null; pvKey = ''; downCell = null;
  sfx.cast();
  if (meta.tut < 3) { meta.tut++; }
  $('hint').innerHTML = '';
  save();
  renderHud();
  renderHand();
  playEvents(next.ev, next, afterStep);
}
function afterStep(){
  if (S.phase === 'draft') { prev = null; showDraft(); }
  else if (S.phase === 'won' || S.phase === 'lost') endRun();
  sel = Math.min(sel, Math.max(0, S.hand.length - 1));
  renderHud(); renderHand(); setHint();
}
function newRun(daily, tierOverride){
  audio();
  let seed, tier = daily ? 0 : (tierOverride != null ? tierOverride : meta.tier);
  if (daily) seed = hashStr('emberward-' + today()); else seed = (Date.now() ^ (Math.random() * 1e9)) >>> 0;
  S = EW.newRun(seed, Object.assign({ tier, daily }, pools(daily)));
  S.dailyDate = daily ? today() : null;
  snaps = []; prev = null; store.run = { s: S, snaps: [], undoNight: 0 };
  meta.runs++; persist();
  mode = 'play'; V = S; sel = 0; aim = null; anim = null; parts = []; floats = [];
  syncDisp(S); hideOv(); renderHud(); renderHand(); setHint(); save();
  floatText('Night 1', L.w / 2, L.oy + L.cell * 3.2, C.ink, 30, 1.3); sfx.spawn();
}
function continueRun(){ const r = store.run; if (!r || !r.s) return newRun(false); S = r.s; snaps = r.snaps || []; prev = null; mode = 'play'; V = S; sel = 0; anim = null; syncDisp(S); hideOv(); renderHud(); renderHand(); setHint(); if (S.phase === 'draft') showDraft(); }
function pause(){ if (mode !== 'play') return; mode = 'pause'; aim = null; showOv('dim', '<div class="panel"><h2>Paused</h2><p class="sub">Night ' + S.night + ', turn ' + S.turn + '. Your run is saved.</p><button class="btn pri" id="oResume">Resume</button><div class="row"><button class="btn" id="oHelp">How to play</button><button class="btn" id="oQuit">Title</button></div></div>'); $('oResume').onclick = resume; $('oHelp').onclick = () => showHelp('pause'); $('oQuit').onclick = showTitle; $('oResume').focus(); }
function resume(){ if (S && S.phase === 'draft') { showDraft(); return; } mode = 'play'; hideOv(); setHint(); renderHud(); }
function showOv(cls, html){ const o = $('ov'); o.className = cls; o.innerHTML = html; o.hidden = false; }
function hideOv(){ const o = $('ov'); o.hidden = true; o.innerHTML = ''; }

function showDraft(){
  mode = 'draft'; const relic = S.draft[0] && S.draft[0].kind === 'relic';
  let h = '<div class="panel"><h2>Night ' + S.night + ' held</h2><p class="sub">' + (relic ? 'Choose a relic. Relics change the rules.' : 'Add one card to your deck, or mend.') + '</p>';
  S.draft.forEach((o, i) => {
    let g, n, d, tag = '';
    if (o.kind === 'card') { g = glyph(o.id); n = EW.CARDS[o.id].n; d = EW.CARDS[o.id].d; }
    else if (o.kind === 'relic') { g = relicGlyph(o.id); n = EW.RELICS[o.id].n; d = EW.RELICS[o.id].d; tag = '<div class="rl">RELIC</div>'; }
    else if (o.kind === 'mend') { g = flameSvg(true); n = 'Mend'; d = 'Regain 1 heart (max ' + EW.K.MAX_HEARTS + ').'; }
    else { g = glyph('spark'); n = 'Trim'; d = 'Remove one Spark from your deck.'; }
    h += '<button class="pick" data-i="' + i + '">' + g + '<div>' + tag + '<div class="pn">' + (i + 1) + ' · ' + n + '</div><div class="pd">' + d + '</div></div></button>';
  });
  const counts = {}; S.deck.forEach(c => counts[c] = (counts[c] || 0) + 1);
  h += '<p class="stats">Deck: ' + Object.keys(counts).map(c => EW.CARDS[c].n + ' ×' + counts[c]).join(' · ') + (S.relics.length ? '<br>Relics: ' + S.relics.map(r => EW.RELICS[r].n).join(' · ') : '') + '</p></div>';
  showOv('dim', h);
  document.querySelectorAll('.pick').forEach(b => b.onclick = () => pickDraft(+b.dataset.i));
  const f = document.querySelector('.pick'); if (f) f.focus();
}
function pickDraft(i){
  if (mode !== 'draft' || !S.draft[i]) return;
  audio(); sfx.clear();
  S = EW.step(S, { t: 'pick', i }); V = S; snaps = snaps.slice(-40); prev = null;
  mode = 'play'; hideOv(); sel = 0; syncDisp(null); save();
  playEvents(S.ev, S, afterStep); renderHud(); renderHand();
}

function describe(s, a){
  const cid = s.hand[a.c], k = EW.CARDS[cid];
  if (k.t === 'col') return k.n + ' on column ' + COLS[a.x];
  if (k.t === 'row') return k.n + ' on row ' + (H - a.y);
  const sh = EW.at(s, a.x, a.y);
  return k.n + (sh ? ' on the ' + sh.hp + '-HP ' + EW.TYPES[sh.type].n : ' on empty') + ' at ' + COLS[a.x] + (H - a.y);
}
function analyzeLoss(){
  const pool = snaps.filter(x => x.n >= S.night - 1);
  let worst = null;
  for (const sn of pool) {
    const sc = EW.plannerScores(sn.s, { cluster: 6 }, 6); if (sc.length < 2) continue;
    const pn = EW.step(sn.s, sn.a); const hh = EW.hashState(pn);
    const f = sc.find(q => EW.hashState(q.n) === hh);
    const pval = f ? f.v : EW.evaluate(pn, { cluster: 6 }) - 50;
    const gap = sc[0].v - pval;
    if (gap > 20 && (!worst || gap > worst.gap)) worst = { sn, best: sc[0], gap, pn };
  }
  if (!worst) return 'No single misplay stood out. The nights outgrew your deck: draft area cards (Blast, Sweep) earlier.';
  const pops = st => st.ev.filter(e => e.k === 'pop').length;
  const pp = pops(worst.pn), bp = pops(worst.best.n);
  let why;
  if (worst.best.n.hearts > worst.pn.hearts) why = 'it would have kept ' + (worst.best.n.hearts - worst.pn.hearts) + ' more heart' + (worst.best.n.hearts - worst.pn.hearts > 1 ? 's' : '') + ' that turn';
  else if (bp > pp) why = 'it pops ' + bp + ' instead of ' + pp;
  else why = 'it removes the shade closest to the wall and keeps your next turn open';
  return '<b>Night ' + worst.sn.n + ', turn ' + worst.sn.t + ':</b> you cast ' + describe(worst.sn.s, worst.sn.a) + '.<br><b>Better:</b> ' + describe(worst.sn.s, worst.best.a) + ', because ' + why + '.<br><span style="color:var(--dim);font-size:12px">Rows count up from the wall: A1 is beside it, A7 is the top.</span>';
}
function endRun(){
  mode = 'end'; const won = S.phase === 'won';
  meta.best = Math.max(meta.best, S.score); meta.bestNight = Math.max(meta.bestNight, S.night - (won ? 0 : 1)); meta.maxChain = Math.max(meta.maxChain, S.stats.maxChain);
  const unlocked = [];
  if (S.night >= 4 && !meta.kindle) { meta.kindle = true; unlocked.push('Kindle card'); }
  if ((S.night >= 7 || won) && !meta.star) { meta.star = true; unlocked.push('Starburst relic'); }
  if (won && !meta.twin) { meta.twin = true; unlocked.push('Twin Wick relic'); }
  if (won) { meta.wins++; if (!S.daily && S.tier >= meta.tierMax && meta.tierMax < 5) { meta.tierMax = S.tier + 1; unlocked.push('Ember tier ' + meta.tierMax); } }
  if (S.daily) { const prevD = meta.daily[S.dailyDate]; if (!prevD || S.score > prevD.score) meta.daily[S.dailyDate] = { score: S.score, night: S.night, won }; }
  store.run = null; persist();
  won ? sfx.win() : sfx.lose();
  let h = '<div class="panel"><h2>' + (won ? 'Dawn breaks. The wall held.' : 'The wall fell on night ' + S.night) + '</h2>';
  h += '<p class="sub">Score <b style="color:var(--ember)">' + S.score.toLocaleString() + '</b> · best chain ' + S.stats.maxChain + ' · ' + S.stats.kills + ' shades popped' + (S.stats.wildfires ? ' · ' + S.stats.wildfires + ' wildfire' + (S.stats.wildfires > 1 ? 's' : '') : '') + '</p>';
  if (!won) h += '<div class="box" id="oWhy">Finding the turn that cost you…</div>';
  if (unlocked.length) h += '<div class="box">Unlocked: <b>' + unlocked.join(', ') + '</b></div>';
  if (S.daily) h += '<textarea class="share" id="oShareTxt" readonly>' + shareText() + '</textarea><button class="btn" id="oShare">Copy daily result</button>';
  h += '<button class="btn pri" id="oNew">New run</button><button class="btn" id="oTitle">Title</button></div>';
  showOv('dim', h);
  $('oNew').onclick = () => newRun(false); $('oTitle').onclick = showTitle;
  if (S.daily) $('oShare').onclick = () => { const t = shareText(); const done = () => { $('oShare').textContent = 'Copied'; }; try { navigator.clipboard.writeText(t).then(done, () => { $('oShareTxt').select(); }); } catch(e){ $('oShareTxt').select(); } };
  if (!won) setTimeout(() => { try { const el = $('oWhy'); if (el) el.innerHTML = analyzeLoss(); } catch(e){ const el = $('oWhy'); if (el) el.textContent = 'Could not analyze this run.'; } }, 60);
  $('oNew').focus();
}
function shareText(){
  const won = S.phase === 'won'; let bar = '';
  for (let i = 1; i <= EW.K.NIGHTS; i++) bar += i < S.night || won ? '🟧' : i === S.night ? '🟥' : '⬛';
  return 'Emberward Daily ' + S.dailyDate + '\n' + bar + ' ' + (won ? 'Dawn' : 'Fell N' + S.night) + '\nScore ' + S.score + ' · Chain ' + S.stats.maxChain + (S.stats.wildfires ? ' · 🔥×' + S.stats.wildfires : '') + ' · ' + '♥'.repeat(S.hearts);
}

function showTitle(){
  mode = 'title'; anim = null; parts = []; floats = [];
  if (!D) startDemo();
  V = D; syncDisp(D);
  const r = store.run && store.run.s && (store.run.s.phase === 'play' || store.run.s.phase === 'draft') ? store.run.s : null;
  let tiers = ''; if (meta.tierMax > 0) { tiers = '<div class="tiers" role="group" aria-label="Difficulty">'; for (let i = 0; i <= meta.tierMax; i++) tiers += '<button class="tier' + (meta.tier === i ? ' on' : '') + '" data-t="' + i + '">' + (i ? 'E' + i : 'Base') + '</button>'; tiers += '</div>'; }
  const dd = meta.daily[today()];
  let h = '<div class="panel"><h1 class="wordmark">EMBERWARD</h1><p class="tag">Hold the wall until dawn.</p>';
  if (r) h += '<button class="btn pri" id="oCont">Continue · night ' + r.night + '</button><button class="btn" id="oNew">New run</button>';
  else h += '<button class="btn pri" id="oNew">New run</button>';
  h += '<div class="row"><button class="btn" id="oDaily">Daily' + (dd ? ' · ' + dd.score : '') + '</button><button class="btn" id="oHelp">How to play</button></div>' + tiers;
  h += '<p class="stats">' + (meta.runs ? 'Runs ' + meta.runs + ' · Dawns ' + meta.wins + ' · Best ' + meta.best.toLocaleString() + ' · Longest chain ' + meta.maxChain : 'Eight nights. Three cards. One wall.') + '</p></div>';
  showOv('title', h);
  if (r) $('oCont').onclick = continueRun;
  $('oNew').onclick = () => newRun(false); $('oDaily').onclick = () => newRun(true); $('oHelp').onclick = () => showHelp('title');
  document.querySelectorAll('.tier').forEach(b => b.onclick = () => { meta.tier = +b.dataset.t; persist(); showTitle(); });
  renderHud(); renderHand(); setHint();
}
function showHelp(back){
  mode = 'help';
  showOv('dim', '<div class="panel"><h2>How to play</h2><div class="box help"><ul>' +
    '<li>Shades drift down toward your wall. Each one that reaches it costs a heart. Lose all hearts and the run ends.</li>' +
    '<li>Each turn, cast <b>one card</b> from your hand of three. Tap a target to preview; tap again to cast.</li>' +
    '<li>A shade at 0 pops and <b>bursts</b>: 1 damage to each neighbor. Bursts chain. 5+ pops is a <b>Wildfire</b>.</li>' +
    '<li>Arrows show where every shade moves next. ▼ Runners move 2. ■ Brutes rest every other turn. ⬢ Wardens ignore bursts.</li>' +
    '<li>Survive a night to draft a card. After nights 2 and 5, pick a relic that bends the rules.</li></ul></div>' +
    '<p class="sub">Keys: 1–3 card · arrows aim · Enter cast · U undo (once per night) · M sound · Esc pause</p><button class="btn pri" id="oBack">Got it</button></div>');
  $('oBack').onclick = () => back === 'pause' ? (mode = 'play', pause()) : showTitle(); $('oBack').focus();
}

// ---------- attract mode ----------
function startDemo(){ D = EW.newRun(demoSeed++ * 7919, { cardPool: EW.BASE_CARDS.concat(['kindle']), relicPool: EW.BASE_RELICS.concat(['star', 'twin']) }); }
function demoStep(){
  demoTimer = RM ? 1.6 : 0.9;
  if (!D || D.phase === 'won' || D.phase === 'lost' || D.night > 3) { startDemo(); V = D; syncDisp(D); return; }
  const a = D.phase === 'draft' ? EW.draftPick(D, 'chain') : EW.plannerScores(D, { cluster: 8 }, 3)[0].a;
  D = EW.step(D, a); V = D;
  if (a.t === 'pick') syncDisp(null);
  playEvents(D.ev, D, null);
}

// ---------- lifecycle ----------
function onHide(){ if (mode === 'play') pause(); save(); }
document.addEventListener('visibilitychange', () => { if (document.hidden) { onHide(); running = false; } else if (!running) { running = true; last = performance.now(); requestAnimationFrame(loop); } });
window.addEventListener('blur', () => { if (mode === 'play') pause(); });
window.addEventListener('pagehide', save);

resize();
showTitle();
requestAnimationFrame(t => { last = t; loop(t); });
if (window.ResizeObserver) new ResizeObserver(resize).observe($('stage'));
window.__ew = { setState(n){ S = n; V = S; syncDisp(S); renderHud(); renderHand(); }, get S(){ return S; }, get mode(){ return mode; }, commit, newRun, pickDraft, fps: () => fpsLog, EW };
})();
</script>

</body></html>
