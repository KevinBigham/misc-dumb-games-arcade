<title>The Moon Wants a Sandwich</title>
<style>

<script>
(() => {
'use strict';

// =====================================================================
// CONFIG — every tuning number lives here
// =====================================================================

const CFG = {
  chef:   { vmax: 720, acc: 2700, kp: 48, kd: 13, xlim: 580, keyV: 640 },
  tower:  { k0: -4.2, kPer: 0.72, couple: 0.0047, coupleN: 0.035, damp: 0.95, fail: 0.64, com: 0.8,

  hunger: { start: 22, rate0: 1.75, grace: 25, logT: 50, tierAdd: 0.03, collapseBase: 4, collapsePer: 0.9, collapseMax: 16,
            feedMul: [1, 0.78, 0.6, 0.48, 0.4, 0.36] },
  tierNeed: [170, 300, 520, 840, 1200],
  chefScale: [1, 0.72, 0.5, 0.34, 0.22],

  flyer:  { every: [0, 12, 10.5, 10, 9, 9] },
  hic:    { every: 2.3, kick: 0.5 },
};
const RANKS = [[0, 'MICROWAVE'], [3000, 'SNACK INTERN'], [12000, 'LINE COOK'], [35000, 'SOUS CHEF'],
               [80000, 'HEAD CHEF'], [170000, 'CHEF OF THE COSMOS'], [300000, "THE MOON'S FAVORITE"]];
const TIERS = [
  { name: 'THE BACKYARD',    sub: 'bread. cheese. ambition.',          line: '' },
  { name: 'THE HOUSE',       sub: 'the moon has grown',                line: 'I HAVE GROWN. BRING FURNITURE.' },
  { name: 'DOWNTOWN',        sub: 'city-sized appetite',               line: 'BIGGER. FEED ME THE CITY.' },
  { name: 'THE COUNTRYSIDE', sub: 'landmarks are a food group now',    line: 'I CRAVE A LIGHTHOUSE.' },
  { name: 'THE COSMOS',      sub: 'the final course',                  line: 'BRING ME THE STARS. AS A SANDWICH.' },
];

// =====================================================================
// UTIL
// =====================================================================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

const easeBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const cr = Math.random;                                  // cosmetic randomness
const fmt = n => Math.round(n).toLocaleString('en-US');
const pick = arr => arr[(cr() * arr.length) | 0];

const FONT = "'Arial Black','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif";
const OUT = '#231a33';
let LWW = 3; // current outline width in the active coordinate space

// =====================================================================
// AUDIO — one context, procedural everything
// =====================================================================
const A = { ctx: null, master: null, sfx: null, mus: null, choirBus: null, noise: null, muted: false, voices: 0, choir: [] };
try { A.muted = localStorage.getItem('moonSandwich.muted') === '1'; } catch (e) {}
function audioInit() {

}
function toggleMute() {

function tone(o) {

  const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(o.g || 0.2, t + (o.a || 0.004)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(fl); fl.connect(g); g.connect(o.dest || A.sfx);

  boing() { tone({ type: 'sine', f: 180, f1: 520, dur: 0.16, g: 0.18 }); tone({ type: 'sine', f: 520, f1: 230, dur: 0.2, g: 0.12, when: 0.12 }); },
  clink() { tone({ type: 'sine', f: 1900, dur: 0.18, g: 0.07 }); tone({ type: 'sine', f: 2850, dur: 0.12, g: 0.04 }); },
  squeak() { tone({ type: 'square', f: 900, f1: 1400, dur: 0.09, g: 0.06, lp: 2500 }); tone({ type: 'square', f: 1300, f1: 800, dur: 0.1, g: 0.05, lp: 2500, when: 0.08 }); },

  clang() { tone({ type: 'square', f: 620, f1: 600, dur: 0.25, g: 0.05, lp: 3000 }); tone({ type: 'square', f: 933, dur: 0.2, g: 0.035, lp: 3500 }); noise({ dur: 0.04, g: 0.08, ft: 'highpass', f: 3000 }); },
  chord() { [523, 659, 784].forEach((f, i) => tone({ type: 'triangle', f, dur: 0.6, g: 0.1, when: i * 0.03, exact: true })); },

  moo() { tone({ type: 'sawtooth', f: 160, f1: 120, dur: 0.6, g: 0.14, lp: 650, a: 0.08 }); },

  hum() { tone({ type: 'sine', f: 220, dur: 0.5, g: 0.12, a: 0.1 }); tone({ type: 'sine', f: 330, dur: 0.5, g: 0.08, a: 0.1 }); },
  whoosh() { noise({ dur: 0.38, g: 0.22, ft: 'bandpass', f: 300, f1: 2600, q: 1.4 }); },
  chomp() { tone({ type: 'square', f: 110, f1: 50, dur: 0.18, g: 0.28, lp: 900 }); noise({ dur: 0.12, g: 0.35, ft: 'lowpass', f: 1400 }); },
  nom(i) { tone({ type: 'sine', f: 170 - i * 10, f1: 120 - i * 8, dur: 0.09, g: 0.22 }); noise({ dur: 0.05, g: 0.1, ft: 'bandpass', f: 700 }); },
  bonk() { tone({ type: 'sine', f: 420, f1: 90, dur: 0.14, g: 0.3 }); noise({ dur: 0.03, g: 0.18, ft: 'highpass', f: 2000 }); },
  thud() { tone({ type: 'sine', f: 120, f1: 45, dur: 0.16, g: 0.18 }); noise({ dur: 0.07, g: 0.08, ft: 'lowpass', f: 500 }); },
  crash() { noise({ dur: 0.6, g: 0.32, ft: 'lowpass', f: 2200, f1: 300 }); tone({ type: 'sawtooth', f: 200, f1: 40, dur: 0.5, g: 0.1, lp: 800 }); },
  slip() { tone({ type: 'sine', f: 700, f1: 200, dur: 0.25, g: 0.1 }); },
  hic() { tone({ type: 'sine', f: 380, f1: 950, dur: 0.12, g: 0.28 }); noise({ dur: 0.04, g: 0.08, ft: 'bandpass', f: 1500 }); },
  squawk() { for (let i = 0; i < 2; i++) tone({ type: 'sawtooth', f: 850, f1: 620, dur: 0.12, g: 0.07, lp: 2400, when: i * 0.16 }); },
  tier() { [392, 523, 659, 784, 1047].forEach((f, i) => tone({ type: 'square', f, dur: 0.25, g: 0.06, lp: 3000, when: i * 0.09, exact: true })); tone({ type: 'triangle', f: 131, dur: 0.9, g: 0.2, exact: true }); },
  mood() { [659, 784, 988].forEach((f, i) => tone({ type: 'triangle', f, dur: 0.16, g: 0.12, when: i * 0.08, exact: true })); },
  burp() { tone({ type: 'sawtooth', f: 85, f1: 52, dur: 0.75, g: 0.3, lp: 480, q: 6, a: 0.03 }); },
  boom() { tone({ type: 'sine', f: 70, f1: 28, dur: 1.2, g: 0.6 }); noise({ dur: 1.0, g: 0.45, ft: 'lowpass', f: 600, f1: 80 }); },
  perfect() { tone({ type: 'sine', f: 1568, dur: 0.12, g: 0.06, exact: true }); tone({ type: 'sine', f: 2093, dur: 0.14, g: 0.05, when: 0.05, exact: true }); },
  tick(i) { tone({ type: 'square', f: 660 * Math.pow(2, (i % 12) / 12), dur: 0.04, g: 0.04, lp: 3000, exact: true }); },
  star(i) { tone({ type: 'triangle', f: 784 * Math.pow(2, i * 2 / 12), dur: 0.3, g: 0.12, exact: true }); },
  warn() { tone({ type: 'square', f: 880, dur: 0.06, g: 0.04, lp: 2000 }); tone({ type: 'square', f: 880, dur: 0.06, g: 0.04, lp: 2000, when: 0.12 }); },

const ITEM_SND = { boing: 'boing', clink: 'clink', squeak: 'squeak', quack: 'quack', clang: 'clang', chord: 'chord', bloop: 'bloop', honk: 'honk', moo: 'moo', zap: 'zap', hum: 'hum', whoosh: 'whoosh' };

// The Moon talks: one formant-filtered syllable per letter.
function babble(ch) {
  if (!A.ctx || A.muted || A.voices > 24) return;
  const u = ch.toUpperCase(); if (u < 'A' || u > 'Z') return;
  const c = A.ctx, t = c.currentTime, duck = S.mood.id === 'DUCK';
  const v = 'AEIOUY'.includes(u);
  const base = duck ? 270 : 88;
  const f = base * Math.pow(2, ((u.charCodeAt(0) * 5) % 7) / 12) * (1 + (Math.random() - 0.5) * 0.04);
  const o = c.createOscillator(); o.type = 'sawtooth';

  o.connect(bp); bp.connect(lp); lp.connect(g); g.connect(A.sfx);

// The food choir: six always-on voices that fade in as the tower tips. They sing "AAAAA" in G major.
let choirDropUntil = 0;

  const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 950; bp.Q.value = 0.9;
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
  bp.connect(lp); lp.connect(A.choirBus);

    const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = (i % 2 ? 1 : -1) * 6;
    lg.connect(o.frequency);

}
function choirTick() {
  if (!A.ctx || !A.choir.length || S.rt < choirDropUntil) return;
  const t = A.ctx.currentTime;
  let lv = 0, n = 0;

  if (S.flight) { lv = Math.max(lv, 0.45 * Math.min(1, S.flight.t * 2)); n = Math.max(n, S.flight.n); }

function choirDrop() {
  if (!A.ctx || !A.choir.length) return;
  const t = A.ctx.currentTime; choirDropUntil = S.rt + 0.95;
  A.choir.forEach((v, i) => {
    v.o.frequency.cancelScheduledValues(t); v.o.frequency.setValueAtTime(v.f, t);
    v.o.frequency.exponentialRampToValueAtTime(v.f * 0.45, t + 0.7); v.o.frequency.setValueAtTime(v.f, t + 0.95);

// Music: lookahead sequencer, C–Am–F–G lullaby that speeds up as the moon gets closer.

  if (S.mood.id === 'CAFFEINATED') bpm *= 1.25;

}
